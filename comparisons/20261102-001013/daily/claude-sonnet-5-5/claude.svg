<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">Added cells: 3</text>

  <rect x="150" y="50" width="300" height="300" fill="#ffffff"/>

  <!-- original shaded cells -->
  <g fill="#3b6fb6">
    <rect x="150" y="50" width="60" height="60"/>
    <rect x="210" y="50" width="60" height="60"/>
    <rect x="330" y="110" width="60" height="60"/>
    <rect x="270" y="170" width="60" height="60"/>
    <rect x="390" y="230" width="60" height="60"/>
    <rect x="150" y="290" width="60" height="60"/>
    <rect x="390" y="290" width="60" height="60"/>
  </g>

  <!-- added cells -->
  <g fill="#f08a24">
    <rect x="210" y="110" width="60" height="60"/>
    <rect x="330" y="170" width="60" height="60"/>
    <rect x="270" y="230" width="60" height="60"/>
  </g>

  <!-- grid lines -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="150" y1="50" x2="450" y2="50"/>
    <line x1="150" y1="110" x2="450" y2="110"/>
    <line x1="150" y1="170" x2="450" y2="170"/>
    <line x1="150" y1="230" x2="450" y2="230"/>
    <line x1="150" y1="290" x2="450" y2="290"/>
    <line x1="150" y1="350" x2="450" y2="350"/>
    <line x1="150" y1="50" x2="150" y2="350"/>
    <line x1="210" y1="50" x2="210" y2="350"/>
    <line x1="270" y1="50" x2="270" y2="350"/>
    <line x1="330" y1="50" x2="330" y2="350"/>
    <line x1="390" y1="50" x2="390" y2="350"/>
    <line x1="450" y1="50" x2="450" y2="350"/>
  </g>

  <!-- legend -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#111">
    <rect x="470" y="170" width="18" height="18" fill="#3b6fb6" stroke="#333"/>
    <text x="496" y="184">original</text>
    <rect x="470" y="200" width="18" height="18" fill="#f08a24" stroke="#333"/>
    <text x="496" y="214">added</text>
  </g>

  <!-- footer timestamp -->
  <text x="300" y="382" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#111">2026-11-02 00:10:13 SGT (UTC+08:00)</text>
</svg>