<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="545" fill="url(#sky)"/>
  <circle cx="90" cy="130" r="38" fill="#ffd93b">
    <animate attributeName="r" values="38;42;38" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g fill="#fff" opacity="0.9">
    <g>
      <ellipse cx="250" cy="130" rx="40" ry="14"/><ellipse cx="275" cy="120" rx="28" ry="14"/><ellipse cx="228" cy="122" rx="22" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="690" cy="215" rx="38" ry="12"/><ellipse cx="710" cy="206" rx="24" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="450" width="800" height="95" fill="#c9e59a"/>
  <rect x="0" y="450" width="800" height="40" fill="#8a8f98"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#fff" stroke-width="4" stroke-dasharray="30 24">
    <animate attributeName="stroke-dashoffset" from="0" to="54" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- title -->
  <text x="400" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#d6336c" stroke="#fff" stroke-width="1">TOUR DE BEAK!</text>

  <!-- speed lines -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="300" x2="110" y2="300"><animate attributeName="x1" values="60;20;60" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="70" y1="340" x2="150" y2="340"><animate attributeName="x1" values="90;40;90" dur="0.7s" repeatCount="indefinite"/></line>
    <line x1="30" y1="380" x2="100" y2="380"><animate attributeName="x1" values="50;10;50" dur="0.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- shadow -->
  <ellipse cx="400" cy="452" rx="270" ry="8" fill="#000" opacity="0.18"/>

  <!-- REAR WHEEL -->
  <g>
    <circle cx="270" cy="390" r="58" fill="none" stroke="#222" stroke-width="8"/>
    <g stroke="#777" stroke-width="2">
      <line x1="270" y1="335" x2="270" y2="445"/><line x1="215" y1="390" x2="325" y2="390"/>
      <line x1="231" y1="351" x2="309" y2="429"/><line x1="231" y1="429" x2="309" y2="351"/>
      <circle cx="270" cy="342" r="5" fill="#e03131" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0 270 390" to="360 270 390" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="270" cy="390" r="6" fill="#444"/>
  </g>

  <!-- FRONT WHEEL -->
  <g>
    <circle cx="530" cy="390" r="58" fill="none" stroke="#222" stroke-width="8"/>
    <g stroke="#777" stroke-width="2">
      <line x1="530" y1="335" x2="530" y2="445"/><line x1="475" y1="390" x2="585" y2="390"/>
      <line x1="491" y1="351" x2="569" y2="429"/><line x1="491" y1="429" x2="569" y2="351"/>
      <circle cx="530" cy="342" r="5" fill="#e03131" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0 530 390" to="360 530 390" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="530" cy="390" r="6" fill="#444"/>
  </g>

  <!-- FRAME -->
  <g stroke="#1c7ed6" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="270" y1="390" x2="390" y2="390"/>
    <line x1="270" y1="390" x2="362" y2="305"/>
    <line x1="390" y1="390" x2="362" y2="305"/>
    <line x1="362" y1="308" x2="498" y2="302"/>
    <line x1="390" y1="390" x2="498" y2="302"/>
    <line x1="498" y1="296" x2="530" y2="390"/>
    <line x1="498" y1="296" x2="486" y2="282" stroke="#333"/>
    <line x1="486" y1="282" x2="520" y2="282" stroke="#333"/>
  </g>
  <!-- seat -->
  <rect x="338" y="296" width="48" height="10" rx="5" fill="#333"/>

  <!-- far pedal/leg (behind body) -->
  <line stroke="#f08c00" stroke-width="9" stroke-linecap="round" x1="365" y1="300" x2="365" y2="390">
    <animate attributeName="x2" values="365;372.3;390;407.7;415;407.7;390;372.3;365" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="390;372.3;365;372.3;390;407.7;415;407.7;390" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- crank -->
  <g stroke="#555" stroke-width="6" stroke-linecap="round">
    <line x1="390" y1="390" x2="415" y2="390">
      <animate attributeName="x2" values="415;407.7;390;372.3;365;372.3;390;407.7;415" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="390;407.7;415;407.7;390;372.3;365;372.3;390" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="390" y1="390" x2="365" y2="390">
      <animate attributeName="x2" values="365;372.3;390;407.7;415;407.7;390;372.3;365" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="390;372.3;365;372.3;390;407.7;415;407.7;390" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <circle cx="390" cy="390" r="9" fill="#444"/>

  <!-- PELICAN (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- tail feathers -->
    <g fill="#f1f3f5" stroke="#343a40" stroke-width="3" stroke-linejoin="round">
      <polygon points="295,260 235,235 245,262"/>
      <polygon points="295,270 228,265 242,288"/>
      <polygon points="298,282 245,305 262,314"/>
    </g>

    <!-- body -->
    <ellipse cx="350" cy="268" rx="72" ry="46" fill="#f8f9fa" stroke="#343a40" stroke-width="4"/>
    <!-- wing flap -->
    <path d="M310 262 Q335 305 380 285 Q370 250 330 245 Z" fill="#ced4da" stroke="#343a40" stroke-width="3"/>

    <!-- neck -->
    <path d="M385 245 C430 245 395 205 440 195" fill="none" stroke="#343a40" stroke-width="30" stroke-linecap="round"/>
    <path d="M385 245 C430 245 395 205 440 195" fill="none" stroke="#f8f9fa" stroke-width="22" stroke-linecap="round"/>

    <!-- arm to handlebar -->
    <path d="M385 265 Q440 280 502 284" fill="none" stroke="#343a40" stroke-width="15" stroke-linecap="round"/>
    <path d="M385 265 Q440 280 502 284" fill="none" stroke="#f8f9fa" stroke-width="8" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="455" cy="182" r="25" fill="#f8f9fa" stroke="#343a40" stroke-width="4"/>

    <!-- pouch + fish -->
    <path d="M472 192 Q500 275 612 200 Z" fill="#ffd43b" stroke="#343a40" stroke-width="4" stroke-linejoin="round"/>
    <g>
      <ellipse cx="548" cy="224" rx="28" ry="11" fill="#ff8787" stroke="#343a40" stroke-width="2"/>
      <circle cx="565" cy="221" r="3" fill="#000"/>
      <polygon points="521,224 503,212 503,236" fill="#ff8787" stroke="#343a40" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="-12 521 224;12 521 224;-12 521 224" dur="0.3s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <!-- upper beak -->
    <path d="M472 170 L618 198 Q520 205 472 192 Z" fill="#fab005" stroke="#343a40" stroke-width="4" stroke-linejoin="round"/>

    <!-- helmet -->
    <path d="M428 175 Q432 142 458 142 Q482 144 484 172 Z" fill="#e03131" stroke="#343a40" stroke-width="4"/>
    <line x1="456" y1="143" x2="456" y2="172" stroke="#fff" stroke-width="4"/>
    <!-- sunglasses -->
    <rect x="452" y="170" width="30" height="14" rx="6" fill="#111"/>
    <line x1="452" y1="175" x2="432" y2="172" stroke="#111" stroke-width="3"/>
    <line x1="458" y1="174" x2="468" y2="174" stroke="#74c0fc" stroke-width="2"/>
    <!-- sweat drop -->
    <path d="M430 195 q-6 12 0 14 q8 -2 0 -14z" fill="#4dabf7">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- near leg + pedal (in front) -->
  <line stroke="#f08c00" stroke-width="9" stroke-linecap="round" x1="350" y1="305" x2="415" y2="390">
    <animate attributeName="x2" values="415;407.7;390;372.3;365;372.3;390;407.7;415" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="390;407.7;415;407.7;390;372.3;365;372.3;390" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <ellipse rx="14" ry="6" fill="#f08c00" stroke="#343a40" stroke-width="3" cx="415" cy="394">
    <animate attributeName="cx" values="415;407.7;390;372.3;365;372.3;390;407.7;415" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="394;411.7;419;411.7;394;376.3;369;376.3;394" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- speech bubble -->
  <g>
    <path d="M590 85 H775 Q785 85 785 95 V140 Q785 150 775 150 H640 L560 172 L610 150 H590 Q580 150 580 140 V95 Q580 85 590 85 Z" fill="#fff" stroke="#343a40" stroke-width="3"/>
    <text x="682" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#222">Fish delivery!</text>
    <text x="682" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">Ultra-fast. Ish.</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- caption -->
  <text x="400" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="italic" fill="#222">Pedaling to work with lunch already packed: in his own bill.</text>

  <!-- footer -->
  <rect x="0" y="545" width="800" height="55" fill="#212529"/>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff">2026-10-31 00:08:27 SGT (UTC+08:00)</text>
</svg>