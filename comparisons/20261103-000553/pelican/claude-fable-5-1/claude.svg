<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Beak-to-Work Day: a pelican riding a bicycle</title>
  <desc id="d">A satirical cartoon of a sweaty pelican in a tiny helmet pedaling a bicycle with groceries and an annoyed fish in its pouch. Wheels spin, pedals turn, pelican bobs.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="60" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="55" fill="none" stroke="#bbb" stroke-width="2"/>
      <g stroke="#555" stroke-width="2">
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="-39" y1="-39" x2="39" y2="39"/>
        <line x1="-39" y1="39" x2="39" y2="-39"/>
        <line x1="-21" y1="-51" x2="21" y2="51"/>
        <line x1="-51" y1="-21" x2="51" y2="21"/>
        <line x1="21" y1="-51" x2="-21" y2="51"/>
        <line x1="51" y1="-21" x2="-51" y2="21"/>
      </g>
      <circle r="7" fill="#333"/>
      <rect x="-3" y="-60" width="6" height="12" fill="#ff5a36"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="38" fill="#ffd93b" stroke="#f3b400" stroke-width="4"/>
  <g fill="#fff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-140 0" dur="9s" repeatCount="indefinite"/>
      <ellipse cx="160" cy="120" rx="48" ry="20"/>
      <ellipse cx="195" cy="108" rx="38" ry="22"/>
      <ellipse cx="520" cy="150" rx="55" ry="18"/>
      <ellipse cx="560" cy="138" rx="35" ry="20"/>
      <ellipse cx="860" cy="120" rx="48" ry="20"/>
      <ellipse cx="895" cy="108" rx="38" ry="22"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="470" width="800" height="70" fill="#7cc06b"/>
  <rect x="0" y="478" width="800" height="40" fill="#555"/>
  <line x1="0" y1="498" x2="800" y2="498" stroke="#ffe066" stroke-width="4" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- title -->
  <text x="400" y="52" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="40" font-weight="bold" fill="#1b2a41" stroke="#fff" stroke-width="1.5" paint-order="stroke">BEAK-TO-WORK DAY</text>

  <!-- motion lines -->
  <g stroke="#1b2a41" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.5s" repeatCount="indefinite"/>
    <line x1="60" y1="300" x2="130" y2="300"/>
    <line x1="40" y1="340" x2="150" y2="340"/>
    <line x1="80" y1="380" x2="140" y2="380"/>
  </g>

  <!-- bicycle -->
  <g>
    <!-- frame -->
    <g stroke="#d7263d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="250" y1="420" x2="390" y2="425"/>
      <line x1="250" y1="420" x2="365" y2="330"/>
      <line x1="365" y1="330" x2="390" y2="425"/>
      <line x1="365" y1="330" x2="495" y2="335"/>
      <line x1="390" y1="425" x2="500" y2="350"/>
      <line x1="495" y1="335" x2="507" y2="370"/>
      <line x1="507" y1="370" x2="520" y2="420"/>
    </g>
    <!-- seat post & seat -->
    <line x1="365" y1="330" x2="358" y2="306" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <path d="M330 306 Q358 296 386 306 Q358 316 330 306 Z" fill="#222"/>
    <!-- handlebar -->
    <line x1="495" y1="335" x2="512" y2="318" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <path d="M498 322 Q512 312 530 326" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
    <circle cx="530" cy="327" r="5" fill="#222"/>
    <!-- chain -->
    <line x1="250" y1="412" x2="390" y2="407" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="428" x2="390" y2="443" stroke="#333" stroke-width="2"/>
    <circle cx="250" cy="420" r="9" fill="none" stroke="#333" stroke-width="3"/>
    <!-- wheels -->
    <g transform="translate(250 420)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <use xlink:href="#wheel" href="#wheel"/>
      </g>
    </g>
    <g transform="translate(520 420)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <use xlink:href="#wheel" href="#wheel"/>
      </g>
    </g>
    <!-- crank & pedals -->
    <g transform="translate(390 425)">
      <circle r="18" fill="none" stroke="#333" stroke-width="4"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <line x1="-24" y1="0" x2="24" y2="0" stroke="#222" stroke-width="5" stroke-linecap="round"/>
        <rect x="18" y="-4" width="14" height="8" rx="2" fill="#222"/>
        <rect x="-32" y="-4" width="14" height="8" rx="2" fill="#222"/>
      </g>
      <circle r="5" fill="#222"/>
    </g>
  </g>

  <!-- pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0; 0 3; 0 0" dur="0.55s" repeatCount="indefinite"/>
    <!-- legs -->
    <g stroke="#ff9f1c" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M350 325 Q370 380 400 410">
        <animate attributeName="d" values="M350 325 Q370 380 400 410;M350 325 Q360 385 372 436;M350 325 Q370 380 400 410" dur="1.1s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- tail feathers -->
    <path d="M300 300 L262 280 L292 310 L255 312 L300 318 Z" fill="#f4f1ea" stroke="#555" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="350" cy="285" rx="62" ry="42" fill="#f4f1ea" stroke="#555" stroke-width="3" transform="rotate(-12 350 285)"/>
    <!-- wing reaching handlebar -->
    <path d="M340 270 Q420 250 500 318 Q470 330 420 300 Q380 290 340 290 Z" fill="#e3ded2" stroke="#555" stroke-width="3"/>
    <!-- neck -->
    <path d="M385 262 Q400 230 425 220" fill="none" stroke="#f4f1ea" stroke-width="26" stroke-linecap="round"/>
    <path d="M385 262 Q400 230 425 220" fill="none" stroke="#555" stroke-width="30" stroke-linecap="round" opacity="0.0"/>
    <path d="M372 266 Q392 222 428 208" fill="none" stroke="#555" stroke-width="3"/>
    <path d="M398 272 Q410 240 436 232" fill="none" stroke="#555" stroke-width="3"/>
    <!-- head -->
    <circle cx="438" cy="214" r="24" fill="#f4f1ea" stroke="#555" stroke-width="3"/>
    <!-- helmet -->
    <path d="M412 206 Q438 170 466 206 Z" fill="#2ec4b6" stroke="#555" stroke-width="3"/>
    <line x1="420" y1="190" x2="455" y2="190" stroke="#555" stroke-width="2"/>
    <line x1="422" y1="208" x2="430" y2="236" stroke="#333" stroke-width="2"/>
    <!-- beak -->
    <path d="M455 204 L585 222 L455 222 Z" fill="#ffb703" stroke="#555" stroke-width="3" stroke-linejoin="round"/>
    <!-- pouch (sags with cargo) -->
    <path d="M455 222 Q470 290 530 282 Q575 272 585 224 Z" fill="#ffd166" stroke="#555" stroke-width="3" stroke-linejoin="round"/>
    <!-- grocery contents -->
    <rect x="478" y="236" width="22" height="30" rx="2" fill="#8ac926" stroke="#555" stroke-width="2" transform="rotate(-10 489 251)"/>
    <ellipse cx="545" cy="252" rx="20" ry="10" fill="#4cc9f0" stroke="#555" stroke-width="2" transform="rotate(20 545 252)"/>
    <path d="M560 257 L578 250 L574 268 Z" fill="#4cc9f0" stroke="#555" stroke-width="2"/>
    <circle cx="534" cy="250" r="2.5" fill="#222"/>
    <path d="M526 258 Q532 254 536 258" fill="none" stroke="#222" stroke-width="1.5"/>
    <!-- eye -->
    <circle cx="447" cy="208" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="449" cy="209" r="2.5" fill="#111"/>
    <path d="M440 200 L454 196" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
    <!-- sweat drops -->
    <g fill="#4cc9f0">
      <path d="M470 196 q4 8 0 11 q-4 -3 0 -11 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;6 -10;0 0" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M404 206 q4 8 0 11 q-4 -3 0 -11 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;-6 -8;0 0" dur="0.9s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M560 120 h170 a10 10 0 0 1 10 10 v48 a10 10 0 0 1 -10 10 h-120 l-18 16 l4 -16 h-36 a10 10 0 0 1 -10 -10 v-48 a10 10 0 0 1 10 -10 Z" fill="#fff" stroke="#1b2a41" stroke-width="3"/>
    <text x="645" y="146" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1b2a41">"The bike lane is</text>
    <text x="645" y="166" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#1b2a41">basically a river."</text>
  </g>

  <!-- caption -->
  <text x="400" y="533" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#fff" stroke="#1b2a41" stroke-width="0.5">Groceries go in the pouch. The fish did not consent to the hills.</text>

  <!-- footer -->
  <rect x="0" y="548" width="800" height="52" fill="#1b2a41"/>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e6f7ff">2026-11-03 00:05:53 SGT (UTC+08:00)</text>
</svg>