<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" font-family="Arial, Helvetica, sans-serif">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">5x5 Grid: Two Shaded Per Row and Column, No Edge Contact</text>

  <!-- Shaded cells -->
  <g fill="#2b6cb0">
    <rect x="30" y="45" width="55" height="55"/>
    <rect x="140" y="45" width="55" height="55"/>
    <rect x="85" y="100" width="55" height="55"/>
    <rect x="250" y="100" width="55" height="55"/>
    <rect x="30" y="155" width="55" height="55"/>
    <rect x="195" y="155" width="55" height="55"/>
    <rect x="140" y="210" width="55" height="55"/>
    <rect x="250" y="210" width="55" height="55"/>
    <rect x="85" y="265" width="55" height="55"/>
    <rect x="195" y="265" width="55" height="55"/>
  </g>

  <!-- Grid lines -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="30" y1="45" x2="305" y2="45"/>
    <line x1="30" y1="100" x2="305" y2="100"/>
    <line x1="30" y1="155" x2="305" y2="155"/>
