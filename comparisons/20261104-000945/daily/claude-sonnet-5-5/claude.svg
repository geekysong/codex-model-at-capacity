  <!-- Solution list -->
  <g fill="#111" font-size="16">
    <text x="340" y="75" font-weight="bold">Shaded cells (in order):</text>
    <text x="340" y="105">A1, A3</text>
    <text x="340" y="130">B2, B5</text>
    <text x="340" y="155">C1, C4</text>
    <text x="340" y="180">D3, D5</text>
    <text x="340" y="205">E2, E4</text>
    <text x="340" y="245" font-weight="bold">Total shaded: 10</text>
    <text x="340" y="275" font-size="13" fill="#444">Each row: 2 shaded. Each column: 2 shaded.</text>
    <text x="340" y="295" font-size="13" fill="#444">No two shaded cells share an edge.</text>
  </g>

  <!-- Footer -->
  <line x1="20" y1="340" x2="580" y2="340" stroke="#999" stroke-width="1"/>
  <text x="300" y="370" font-size="15" text-anchor="middle" fill="#111">2026-11-04 00:09:45 SGT (UTC+08:00)</text>
