    <line x1="85" y1="45" x2="85" y2="320"/>
    <line x1="140" y1="45" x2="140" y2="320"/>
    <line x1="195" y1="45" x2="195" y2="320"/>
    <line x1="250" y1="45" x2="250" y2="320"/>
    <line x1="305" y1="45" x2="305" y2="320"/>
  </g>

  <!-- Cell labels: unshaded (dark text) -->
  <g font-size="16" text-anchor="middle" fill="#222">
    <text x="112.5" y="78">A2</text>
    <text x="222.5" y="78">A4</text>
    <text x="277.5" y="78">A5</text>
    <text x="57.5" y="133">B1</text>
    <text x="167.5" y="133">B3</text>
    <text x="222.5" y="133">B4</text>
    <text x="112.5" y="188">C2</text>
    <text x="167.5" y="188">C3</text>
    <text x="277.5" y="188">C5</text>
    <text x="57.5" y="243">D1</text>
    <text x="112.5" y="243">D2</text>
    <text x="222.5" y="243">D4</text>
    <text x="57.5" y="298">E1</text>
    <text x="167.5" y="298">E3</text>
    <text x="277.5" y="298">E5</text>
  </g>
  <!-- Cell labels: shaded (white text) -->
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">
    <text x="57.5" y="78">A1</text>
    <text x="167.5" y="78">A3</text>
    <text x="112.5" y="133">B2</text>
    <text x="277.5" y="133">B5</text>
    <text x="57.5" y="188">C1</text>
    <text x="222.5" y="188">C4</text>
    <text x="167.5" y="243">D3</text>
