<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#222">Shortest path length: 8</text>

  <!-- Grid background cells -->
  <g stroke="#555" stroke-width="1.5">
    <rect x="150" y="50" width="300" height="300" fill="#f7f7f7"/>
    <!-- Start (0,0) -->
    <rect x="150" y="50" width="60" height="60" fill="#4caf50"/>
    <!-- Goal (4,4) -->
    <rect x="390" y="290" width="60" height="60" fill="#e53935"/>
    <!-- Blocked cells -->
    <rect x="270" y="50" width="60" height="60" fill="#444"/>
    <rect x="270" y="110" width="60" height="60" fill="#444"/>
    <rect x="270" y="170" width="60" height="60" fill="#444"/>
    <rect x="150" y="170" width="60" height="60" fill="#444"/>
    <rect x="330" y="230" width="60" height="60" fill="#444"/>
    <rect x="210" y="290" width="60" height="60" fill="#444"/>
  </g>

  <!-- Grid lines -->
  <g stroke="#555" stroke-width="1.5">
    <line x1="210" y1="50" x2="210" y2="350"/>
    <line x1="270" y1="50" x2="270" y2="350"/>
    <line x1="330" y1="50" x2="330" y2="350"/>
    <line x1="390" y1="50" x2="390" y2="350"/>
    <line x1="150" y1="110" x2="450" y2="110"/>
    <line x1="150" y1="170" x2="450" y2="170"/>
    <line x1="150" y1="230" x2="450" y2="230"/>
    <line x1="150" y1="290" x2="450" y2="290"/>
    <rect x="150" y="50" width="300" height="300" fill="none" stroke-width="2"/>
  </g>

  <!-- Shortest path polyline -->
  <polyline points="180,80 240,80 240,140 240,200 240,260 300,260 300,320 360,320 420,320"
            fill="none" stroke="#1e63d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e3a7a">
    <circle cx="180" cy="80" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="180" y="85">0</text>
    <circle cx="240" cy="80" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
