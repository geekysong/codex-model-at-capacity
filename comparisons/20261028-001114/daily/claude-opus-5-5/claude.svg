  <!-- Footer timestamp -->
  <text x="300" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">2026-10-28 00:11:14 SGT (UTC+08:00)</text>
</svg>