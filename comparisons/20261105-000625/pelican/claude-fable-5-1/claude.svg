<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Pelican on Wheels</title>
  <desc id="d">A satirical cartoon of a pelican riding a bicycle with a fish in its pouch, wheels spinning and pelican bobbing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f5"/>
      <stop offset="1" stop-color="#dff3ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b6b6b"/>
      <stop offset="1" stop-color="#4a4a4a"/>
    </linearGradient>
    <g id="wheel">
      <circle r="55" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="48" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#555" stroke-width="2">
        <line x1="-48" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/>
        <line x1="-34" y1="34" x2="34" y2="-34"/>
        <line x1="-44" y1="-18" x2="44" y2="18"/>
        <line x1="-44" y1="18" x2="44" y2="-18"/>
        <line x1="-18" y1="-44" x2="18" y2="44"/>
        <line x1="18" y1="-44" x2="-18" y2="44"/>
      </g>
      <circle r="7" fill="#222"/>
      <circle cx="0" cy="-48" r="4" fill="#e63946"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="42" fill="#ffd93d" stroke="#f4b400" stroke-width="4"/>
  <g fill="#fff" opacity="0.95">
    <ellipse cx="140" cy="130" rx="55" ry="22"/>
    <ellipse cx="175" cy="118" rx="40" ry="26"/>
    <ellipse cx="110" cy="122" rx="35" ry="20"/>
    <ellipse cx="560" cy="170" rx="50" ry="18"/>
    <ellipse cx="590" cy="160" rx="35" ry="22"/>
  </g>
  <!-- hills -->
  <path d="M0 400 Q120 330 240 390 T480 400 T800 380 L800 480 L0 480 Z" fill="#8fd16a"/>
  <path d="M0 430 Q200 380 400 430 T800 420 L800 480 L0 480 Z" fill="#6fbf4f"/>
  <!-- road -->
  <rect x="0" y="470" width="800" height="40" fill="url(#road)"/>
  <line x1="0" y1="490" x2="800" y2="490" stroke="#ffe066" stroke-width="4" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <rect x="0" y="510" width="800" height="35" fill="#5b8c3a"/>

  <!-- title -->
  <text x="400" y="52" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="40" font-weight="bold" fill="#1d3557" stroke="#fff" stroke-width="1.5">PELICAN ON WHEELS</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1d3557">A Tour de Fish exclusive</text>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="380" x2="190" y2="380">
      <animate attributeName="x1" values="120;100;120" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="140" y1="410" x2="200" y2="410">
      <animate attributeName="x1" values="140;115;140" dur="0.45s" repeatCount="indefinite"/>
    </line>
    <line x1="110" y1="440" x2="185" y2="440">
      <animate attributeName="x1" values="110;90;110" dur="0.55s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- bicycle frame -->
  <g stroke="#d62828" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="390" y1="420" x2="335" y2="335"/>
    <line x1="335" y1="335" x2="260" y2="420"/>
    <line x1="390" y1="420" x2="260" y2="420"/>
    <line x1="390" y1="420" x2="480" y2="330"/>
    <line x1="335" y1="335" x2="480" y2="330"/>
    <line x1="480" y1="330" x2="520" y2="420"/>
    <line x1="480" y1="330" x2="486" y2="308"/>
  </g>
  <line x1="458" y1="306" x2="514" y2="306" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <line x1="335" y1="335" x2="337" y2="322" stroke="#222" stroke-width="6"/>
  <ellipse cx="336" cy="322" rx="24" ry="7" fill="#222"/>
  <!-- chain -->
  <line x1="268" y1="412" x2="390" y2="406" stroke="#444" stroke-width="2"/>
  <line x1="268" y1="428" x2="390" y2="434" stroke="#444" stroke-width="2"/>

  <!-- wheels -->
  <g transform="translate(260 420)">
    <use href="#wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(520 420)">
    <use href="#wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.6s" repeatCount="indefinite"/>
    <!-- tail -->
    <path d="M280 290 L240 270 L262 300 L232 300 L270 312 Z" fill="#f1f1f1" stroke="#333" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="330" cy="285" rx="62" ry="44" fill="#fafafa" stroke="#333" stroke-width="3"/>
    <!-- wing on body -->
    <path d="M300 272 Q350 250 380 290 Q345 305 300 272 Z" fill="#e6e6e6" stroke="#333" stroke-width="2"/>
    <!-- neck -->
    <path d="M372 262 Q395 250 410 215" fill="none" stroke="#333" stroke-width="26" stroke-linecap="round"/>
    <path d="M372 262 Q395 250 410 215" fill="none" stroke="#fafafa" stroke-width="20" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="418" cy="200" r="24" fill="#fafafa" stroke="#333" stroke-width="3"/>
    <!-- helmet -->
    <path d="M392 192 Q418 158 446 192 Z" fill="#ff8c00" stroke="#333" stroke-width="3"/>
    <line x1="402" y1="178" x2="410" y2="192" stroke="#333" stroke-width="2"/>
    <line x1="420" y1="172" x2="422" y2="192" stroke="#333" stroke-width="2"/>
    <line x1="437" y1="180" x2="432" y2="192" stroke="#333" stroke-width="2"/>
    <!-- eye -->
    <circle cx="428" cy="196" r="6" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="430" cy="197" r="3" fill="#111"/>
    <path d="M420 186 L436 190" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <!-- beak with pouch -->
    <path d="M438 198 L555 212 L440 210 Z" fill="#ffb703" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <path d="M440 210 L555 212 Q520 262 450 245 Z" fill="#fb8500" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <!-- fish in pouch -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 500 235;6 500 235;-6 500 235" dur="0.8s" repeatCount="indefinite"/>
      <ellipse cx="500" cy="235" rx="22" ry="9" fill="#4cc9f0" stroke="#333" stroke-width="2"/>
      <path d="M518 235 L532 226 L532 244 Z" fill="#4cc9f0" stroke="#333" stroke-width="2"/>
      <circle cx="490" cy="233" r="2.5" fill="#111"/>
    </g>
    <!-- wing to handlebar -->
    <path d="M365 290 Q430 290 480 308" fill="none" stroke="#333" stroke-width="16" stroke-linecap="round"/>
    <path d="M365 290 Q430 290 480 308" fill="none" stroke="#fafafa" stroke-width="10" stroke-linecap="round"/>
    <!-- sweat -->
    <g fill="#4cc9f0">
      <path d="M450 178 q4 -8 8 0 a4 4 0 0 1 -8 0 Z">
        <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M460 192 q4 -8 8 0 a4 4 0 0 1 -8 0 Z">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- legs to pedals -->
  <line x1="345" y1="312" x2="412" y2="420" stroke="#ff8c00" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="412;405.6;390;374.4;368;374.4;390;405.6;412" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="420;435.6;442;435.6;420;404.4;398;404.4;420" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="340" y1="312" x2="368" y2="420" stroke="#e07a00" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="368;374.4;390;405.6;412;405.6;390;374.4;368" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="420;404.4;398;404.4;420;435.6;442;435.6;420" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- crank and pedals -->
  <circle cx="390" cy="420" r="15" fill="none" stroke="#222" stroke-width="5"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 420" to="360 390 420" dur="1.2s" repeatCount="indefinite"/>
    <line x1="368" y1="420" x2="412" y2="420" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <rect x="404" y="414" width="18" height="12" rx="3" fill="#ff8c00" stroke="#222" stroke-width="2"/>
    <rect x="358" y="414" width="18" height="12" rx="3" fill="#ff8c00" stroke="#222" stroke-width="2"/>
  </g>
  <circle cx="390" cy="420" r="5" fill="#222"/>

  <!-- caption -->
  <rect x="60" y="518" width="680" height="30" rx="8" fill="#fff" opacity="0.92" stroke="#1d3557" stroke-width="1.5"/>
  <text x="400" y="539" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="17" fill="#1d3557">"It's not cheating. The fish is just carry-on luggage." — Pelican, mid-race, still not pedaling in a straight line.</text>

  <!-- footer -->
  <rect x="0" y="552" width="800" height="48" fill="#1d3557"/>
  <text x="400" y="581" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff">2026-11-05 00:06:25 SGT (UTC+08:00)</text>
</svg>