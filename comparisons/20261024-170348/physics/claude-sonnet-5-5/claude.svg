<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d">
  <title id="t">Level seesaw in static equilibrium</title>
  <desc id="d">A 6 kg mass 2 m left of the pivot balances a 4 kg mass 3 m right of the pivot, since 6×2 = 4×3.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .pulseW { transform-box: fill-box; transform-origin: center; animation: pw 2s ease-in-out infinite; }
    .pulseA { transform-box: fill-box; transform-origin: 50% 0%; animation: pa 2s ease-in-out infinite; }
    @keyframes pw { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    @keyframes pa { 0%,100% { transform: scaleY(1); opacity: .85; } 50% { transform: scaleY(1.15); opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f8fd"/>
      <stop offset="1" stop-color="#dfe9f5"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <text x="300" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d2b3a">Seesaw in Static Equilibrium</text>

  <!-- Solution panel -->
  <rect x="120" y="40" width="360" height="86" rx="10" fill="#ffffff" stroke="#9db3cc" stroke-width="1.5"/>
  <text x="300" y="62" text-anchor="middle" font-size="14" fill="#34495e">Στ = 0 about pivot:  m₁·d₁ = m₂·x</text>
  <text x="300" y="86" text-anchor="middle" font-size="16" fill="#1d2b3a">6 × 2 = 4 × x  ⇒  x = 12 ÷ 4 = 3 m</text>
  <text x="300" y="114" text-anchor="middle" font-size="20" font-weight="bold" fill="#1b7a43">6 × 2 = 4 × 3</text>

  <!-- Distance dimension lines -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <line x1="200" y1="180" x2="300" y2="180"/>
    <line x1="300" y1="180" x2="450" y2="180"/>
    <line x1="200" y1="172" x2="200" y2="232" stroke-dasharray="3 3"/>
    <line x1="300" y1="172" x2="300" y2="232" stroke-dasharray="3 3"/>
    <line x1="450" y1="172" x2="450" y2="232" stroke-dasharray="3 3"/>
  </g>
  <g fill="#555">
    <polygon points="200,180 208,176 208,184"/>
    <polygon points="300,180 292,176 292,184"/>
    <polygon points="300,180 308,176 308,184"/>
    <polygon points="450,180 442,176 442,184"/>
  </g>
  <text x="250" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2b3a">2 m</text>
  <text x="375" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2b3a">x = 3 m</text>

  <!-- Pivot -->
  <polygon points="300,244 268,302 332,302" fill="#6b7785" stroke="#3d4650" stroke-width="2"/>
  <rect x="250" y="302" width="100" height="8" rx="3" fill="#3d4650"/>
  <circle cx="300" cy="238" r="7" fill="#e8b73a" stroke="#8a6a10" stroke-width="2"/>
  <circle cx="300" cy="238" r="7" fill="none" stroke="#e8b73a" stroke-width="2">
    <animate attributeName="r" values="7;16;7" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="300" y="326" text-anchor="middle" font-size="13" fill="#34495e">pivot</text>

  <!-- Beam (level) -->
  <rect x="60" y="232" width="480" height="12" rx="3" fill="#b9854a" stroke="#6e4a22" stroke-width="2"/>

  <!-- Strings -->
  <line x1="200" y1="244" x2="200" y2="285" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="244" x2="450" y2="285" stroke="#333" stroke-width="2"/>

  <!-- Weights -->
  <g class="pulseW">
    <rect x="173" y="285" width="54" height="42" rx="4" fill="#d9534f" stroke="#8e2a27" stroke-width="2"/>
    <text x="200" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6 kg</text>
  </g>
  <g class="pulseW">
    <rect x="429" y="285" width="42" height="34" rx="4" fill="#2f7fc1" stroke="#1b4e7a" stroke-width="2"/>
    <text x="450" y="307" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">4 kg</text>
  </g>

  <!-- Force arrows -->
  <g class="pulseA" fill="#c0392b" stroke="#c0392b">
    <line x1="200" y1="330" x2="200" y2="366" stroke-width="4"/>
    <polygon points="200,380 192,364 208,364" stroke="none"/>
  </g>
  <g class="pulseA" fill="#1f5f99" stroke="#1f5f99">
    <line x1="450" y1="322" x2="450" y2="350" stroke-width="4"/>
    <polygon points="450,364 442,348 458,348" stroke="none"/>
  </g>
  <text x="188" y="358" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">F₁ = 6g ≈ 58.8 N</text>
  <text x="462" y="350" text-anchor="start" font-size="13" font-weight="bold" fill="#1f5f99">F₂ = 4g ≈ 39.2 N</text>

  <!-- Balanced badge -->
  <g>
    <rect x="240" y="338" width="120" height="36" rx="18" fill="#e3f6ea" stroke="#1b7a43" stroke-width="2.5">
      <animate attributeName="fill" values="#e3f6ea;#b9ebcb;#e3f6ea" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="300" y="362" text-anchor="middle" font-size="19" font-weight="bold" fill="#1b7a43" letter-spacing="1.5">balanced</text>
  </g>
</svg>