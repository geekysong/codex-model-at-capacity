<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="540" fill="url(#sky)"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-family="Comic Sans MS, Comic Neue, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1b2a49" stroke="#ffffff" stroke-width="1">PELICAN vs. PEDALS</text>

  <!-- Sun -->
  <circle cx="720" cy="110" r="32" fill="#ffd93b"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="190" rx="40" ry="14"/>
      <ellipse cx="175" cy="180" rx="28" ry="14"/>
      <ellipse cx="125" cy="182" rx="22" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 60 0; 0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="640" cy="200" rx="36" ry="12"/>
      <ellipse cx="660" cy="191" rx="24" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -50 0; 0 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Speech bubble -->
  <g font-family="Comic Sans MS, Comic Neue, Arial, sans-serif" font-size="15" fill="#1b2a49">
    <path d="M50,75 H300 Q315,75 315,90 V128 Q315,143 300,143 H190 L170,165 L172,143 H65 Q50,143 50,128 V90 Q50,75 65,75 Z" fill="#ffffff" stroke="#1b2a49" stroke-width="2.5"/>
    <text x="182" y="105" text-anchor="middle">"Relax, the pouch is just</text>
    <text x="182" y="126" text-anchor="middle">cargo space. I'm not biking!"</text>
  </g>

  <!-- Ground -->
  <rect x="0" y="472" width="800" height="68" fill="#6b6f78"/>
  <rect x="0" y="468" width="800" height="6" fill="#4a4d55"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#ffe66d" stroke-width="5" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="300" x2="150" y2="300">
      <animate attributeName="x1" values="60;20;60" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="90" y1="340" x2="170" y2="340">
      <animate attributeName="x1" values="90;40;90" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="380" x2="150" y2="380">
      <animate attributeName="x1" values="70;25;70" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Bobbing scene -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- Far leg (opposite phase) -->
    <g>
      <line x1="350" y1="295" x2="350" y2="370" stroke="#e07b00" stroke-width="8" stroke-linecap="round">
        <animate attributeName="x2" values="350;358;380;402;410;402;380;358;350" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="400;379;370;379;400;421;430;421;400" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <ellipse cx="350" cy="400" rx="14" ry="6" fill="#ff9a1f" stroke="#a85500" stroke-width="2">
        <animate attributeName="cx" values="350;358;380;402;410;402;380;358;350" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="400;379;370;379;400;421;430;421;400" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Bicycle -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Rear wheel -->
      <g>
        <circle cx="270" cy="400" r="70" stroke="#222" stroke-width="7"/>
        <circle cx="270" cy="400" r="63" stroke="#aaa" stroke-width="1.5"/>
        <g stroke="#555" stroke-width="2">
          <line x1="270" y1="338" x2="270" y2="462"/>
          <line x1="208" y1="400" x2="332" y2="400"/>
          <line x1="226" y1="356" x2="314" y2="444"/>
          <line x1="314" y1="356" x2="226" y2="444"/>
          <circle cx="270" cy="342" r="4" fill="#ff3b3b" stroke="none"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 270 400" to="360 270 400" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <!-- Front wheel -->
      <g>
        <circle cx="530" cy="400" r="70" stroke="#222" stroke-width="7"/>
        <circle cx="530" cy="400" r="63" stroke="#aaa" stroke-width="1.5"/>
        <g stroke="#555" stroke-width="2">
          <line x1="530" y1="338" x2="530" y2="462"/>
          <line x1="468" y1="400" x2="592" y2="400"/>
          <line x1="486" y1="356" x2="574" y2="444"/>
          <line x1="574" y1="356" x2="486" y2="444"/>
          <circle cx="530" cy="342" r="4" fill="#ff3b3b" stroke="none"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 530 400" to="360 530 400" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <!-- Frame -->
      <g stroke="#d6246e" stroke-width="7">
        <line x1="380" y1="400" x2="345" y2="315"/>
        <line x1="345" y1="315" x2="490" y2="320"/>
        <line x1="380" y1="400" x2="490" y2="320"/>
        <line x1="270" y1="400" x2="380" y2="400"/>
        <line x1="270" y1="400" x2="345" y2="315"/>
        <line x1="490" y1="320" x2="530" y2="400"/>
      </g>
      <!-- Handlebar -->
      <path d="M490,320 L484,295 Q490,288 518,290" stroke="#222" stroke-width="6"/>
      <!-- Seat -->
      <line x1="345" y1="315" x2="342" y2="302" stroke="#222" stroke-width="5"/>
      <rect x="320" y="294" width="46" height="10" rx="5" fill="#222" stroke="none"/>
      <!-- Chainring -->
      <circle cx="380" cy="400" r="12" fill="#999" stroke="#444" stroke-width="3"/>
    </g>

    <!-- Near leg and crank -->
    <g>
      <line x1="380" y1="400" x2="410" y2="400" stroke="#444" stroke-width="6" stroke-linecap="round">
        <animate attributeName="x2" values="410;402;380;358;350;358;380;402;410" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="400;421;430;421;400;379;370;379;400" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="355" y1="295" x2="410" y2="400" stroke="#ff9a1f" stroke-width="9" stroke-linecap="round">
        <animate attributeName="x2" values="410;402;380;358;350;358;380;402;410" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="400;421;430;421;400;379;370;379;400" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <ellipse cx="410" cy="400" rx="15" ry="7" fill="#ffb347" stroke="#a85500" stroke-width="2">
        <animate attributeName="cx" values="410;402;380;358;350;358;380;402;410" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="400;421;430;421;400;379;370;379;400" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- Tail feathers -->
    <path d="M305,270 L262,255 L270,275 L258,285 L306,290 Z" fill="#f2f2f2" stroke="#1b2a49" stroke-width="3" stroke-linejoin="round"/>

    <!-- Body -->
    <ellipse cx="350" cy="270" rx="58" ry="42" fill="#ffffff" stroke="#1b2a49" stroke-width="4"/>
    <path d="M318,275 Q350,310 385,272" fill="none" stroke="#d9e3ee" stroke-width="3"/>

    <!-- Neck -->
    <path d="M385,255 Q372,195 432,192" fill="none" stroke="#1b2a49" stroke-width="32" stroke-linecap="round"/>
    <path d="M385,255 Q372,195 432,192" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round"/>

    <!-- Wing arm to handlebar -->
    <path d="M370,262 Q440,290 512,291" fill="none" stroke="#1b2a49" stroke-width="20" stroke-linecap="round"/>
    <path d="M370,262 Q440,290 512,291" fill="none" stroke="#e8eef5" stroke-width="14" stroke-linecap="round"/>
    <circle cx="515" cy="291" r="8" fill="#e8eef5" stroke="#1b2a49" stroke-width="3"/>

    <!-- Head -->
    <circle cx="440" cy="182" r="26" fill="#ffffff" stroke="#1b2a49" stroke-width="4"/>

    <!-- Pouch with fish -->
    <path d="M455,203 Q505,275 580,210 Z" fill="#ffd36b" stroke="#a85500" stroke-width="3" stroke-linejoin="round"/>
    <g>
      <ellipse cx="520" cy="228" rx="20" ry="9" fill="#4aa8ff" stroke="#1b4a80" stroke-width="2"/>
      <path d="M540,228 L556,217 L556,239 Z" fill="#4aa8ff" stroke="#1b4a80" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="510" cy="226" r="2.5" fill="#000"/>
      <animateTransform attributeName="transform" type="rotate" values="-4 520 228; 4 520 228; -4 520 228" dur="0.6s" repeatCount="indefinite"/>
    </g>
    <path d="M455,176 L585,208 L455,203 Z" fill="#ff9a1f" stroke="#a85500" stroke-width="3" stroke-linejoin="round"/>
    <path d="M585,208 q6,2 3,7 q-4,1 -6,-3 Z" fill="#a85500"/>

    <!-- Sunglasses -->
    <rect x="438" y="165" width="30" height="14" rx="5" fill="#111"/>
    <line x1="420" y1="170" x2="438" y2="170" stroke="#111" stroke-width="3"/>
    <line x1="444" y1="168" x2="452" y2="168" stroke="#fff" stroke-width="2" opacity="0.8"/>

    <!-- Tiny helmet -->
    <path d="M420,168 A22 20 0 0 1 462,160 L458,168 Z" fill="#e63946" stroke="#7a1520" stroke-width="3" stroke-linejoin="round"/>
    <line x1="441" y1="150" x2="441" y2="163" stroke="#fff" stroke-width="3"/>
    <!-- Crest tuft -->
    <path d="M420,166 q-14,-4 -12,6 q6,-2 12,0" fill="#fff" stroke="#1b2a49" stroke-width="2"/>

    <!-- Cargo box -->
    <g>
      <rect x="236" y="268" width="44" height="30" fill="#c98a4b" stroke="#6b4420" stroke-width="3"/>
      <text x="258" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#3b2410">FISH?</text>
      <line x1="280" y1="300" x2="320" y2="310" stroke="#222" stroke-width="3"/>
    </g>
  </g>

  <!-- Caption -->
  <text x="400" y="526" text-anchor="middle" font-family="Comic Sans MS, Comic Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1b2a49">Pelican commutes by bike: pouch full of fish, helmet two sizes too small.</text>

  <!-- Footer -->
  <rect x="0" y="540" width="800" height="60" fill="#1b2a49"/>
  <text x="400" y="577" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff">2026-11-07 00:09:35 SGT (UTC+08:00)</text>
</svg>