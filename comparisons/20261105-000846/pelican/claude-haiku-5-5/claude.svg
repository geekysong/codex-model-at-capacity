<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#f2fbff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="150" r="40" fill="#ffd54a" stroke="#333" stroke-width="3"/>

  <!-- Title and caption -->
  <text x="400" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1d3557">PELICAN ON A BICYCLE</text>
  <text x="400" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333">Cycling is hard when your beak is the largest thing in the room.</text>

  <!-- Ground -->
  <rect x="0" y="470" width="800" height="60" fill="#8bc34a"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#5a8a2a" stroke-width="4"/>

  <!-- Bicycle frame -->
  <g stroke="#222" stroke-width="7" fill="none" stroke-linecap="round">
    <line x1="250" y1="400" x2="370" y2="400"/>
    <line x1="370" y1="400" x2="335" y2="300"/>
    <line x1="335" y1="300" x2="520" y2="290"/>
    <line x1="370" y1="400" x2="520" y2="290"/>
    <line x1="520" y1="290" x2="550" y2="400"/>
    <line x1="520" y1="290" x2="525" y2="262"/>
    <line x1="515" y1="262" x2="540" y2="268"/>
  </g>
  <line x1="322" y1="296" x2="348" y2="296" stroke="#222" stroke-width="10" stroke-linecap="round"/>

  <!-- Back wheel -->
  <g>
    <circle cx="250" cy="400" r="70" fill="none" stroke="#222" stroke-width="10"/>
    <g>
      <line x1="250" y1="330" x2="250" y2="470" stroke="#777" stroke-width="3"/>
      <line x1="180" y1="400" x2="320" y2="400" stroke="#777" stroke-width="3"/>
      <line x1="200" y1="350" x2="300" y2="450" stroke="#777" stroke-width="3"/>
      <line x1="300" y1="350" x2="200" y2="450" stroke="#777" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 400" to="360 250 400" dur="1.5s" repeatCount="indefinite"/>
    </g>
    <circle cx="250" cy="400" r="6" fill="#444"/>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="550" cy="400" r="70" fill="none" stroke="#222" stroke-width="10"/>
    <g>
      <line x1="550" y1="330" x2="550" y2="470" stroke="#777" stroke-width="3"/>
      <line x1="480" y1="400" x2="620" y2="400" stroke="#777" stroke-width="3"/>
      <line x1="500" y1="350" x2="600" y2="450" stroke="#777" stroke-width="3"/>
      <line x1="600" y1="350" x2="500" y2="450" stroke="#777" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0 550 400" to="360 550 400" dur="1.5s" repeatCount="indefinite"/>
    </g>
    <circle cx="550" cy="400" r="6" fill="#444"/>
  </g>

  <!-- Pedal crank (rotates) -->
  <g>
    <circle cx="370" cy="400" r="8" fill="#444"/>
    <g>
      <line x1="370" y1="400" x2="370" y2="372" stroke="#444" stroke-width="5" stroke-linecap="round"/>
      <line x1="362" y1="372" x2="378" y2="372" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <line x1="370" y1="400" x2="394" y2="414" stroke="#444" stroke-width="5" stroke-linecap="round"/>
      <line x1="386" y1="410" x2="402" y2="418" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 370 400" to="360 370 400" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.75s" repeatCount="indefinite"/>

    <!-- Legs -->
    <line x1="382" y1="308" x2="370" y2="372" stroke="#f08c00" stroke-width="7" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="385" cy="265" rx="75" ry="45" fill="#9fb3c8" stroke="#333" stroke-width="3" transform="rotate(-10 385 265)"/>

    <!-- Tail -->
    <path d="M315,255 Q280,245 290,225 Q325,235 330,248 Z" fill="#6f859c" stroke="#333" stroke-width="3"/>

    <!-- Wing -->
    <ellipse cx="355" cy="255" rx="52" ry="22" fill="#6f859c" stroke="#333" stroke-width="3" transform="rotate(-18 355 255)">
      <animateTransform attributeName="transform" type="rotate" values="-18 355 255;-8 355 255;-18 355 255" dur="0.75s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Neck -->
    <path d="M440,250 Q465,225 470,198" fill="none" stroke="#dfe8f0" stroke-width="30" stroke-linecap="round"/>
    <path d="M440,250 Q465,225 470,198" fill="none" stroke="#333" stroke-width="36" stroke-linecap="round" opacity="0"/>

    <!-- Head -->
    <circle cx="485" cy="185" r="26" fill="#dfe8f0" stroke="#333" stroke-width="3"/>

    <!-- Bill and pouch -->
    <path d="M500,176 L592,196 Q578,216 560,214 Q540,252 515,222 Z" fill="#f5b800" stroke="#333" stroke-width="3" stroke-linejoin="round"/>

    <!-- Eye -->
    <circle cx="495" cy="176" r="6" fill="#111"/>
    <circle cx="497" cy="174" r="2" fill="#fff"/>

    <!-- Cheerful brow -->
    <path d="M484,162 Q495,156 506,164" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>

    <!-- Feet on pedals -->
    <path d="M360,376 L372,372 L384,376" fill="none" stroke="#f08c00" stroke-width="5" stroke-linecap="round" opacity="0"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#1d3557" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="90" y1="330" x2="150" y2="330"/>
    <line x1="70" y1="370" x2="140" y2="370"/>
    <line x1="100" y1="410" x2="150" y2="410"/>
  </g>

  <!-- Footer -->
  <rect x="0" y="530" width="800" height="70" fill="#1d3557"/>
  <text x="400" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff">2026-11-05 00:08:46 SGT (UTC+08:00)</text>
</svg>