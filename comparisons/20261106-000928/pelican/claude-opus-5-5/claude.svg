<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <g id="spokes">
      <circle r="60" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="54" fill="none" stroke="#888" stroke-width="2"/>
      <line x1="-54" y1="0" x2="54" y2="0" stroke="#666" stroke-width="2"/>
      <line x1="0" y1="-54" x2="0" y2="54" stroke="#666" stroke-width="2"/>
      <line x1="-38" y1="-38" x2="38" y2="38" stroke="#666" stroke-width="2"/>
      <line x1="-38" y1="38" x2="38" y2="-38" stroke="#666" stroke-width="2"/>
      <circle r="6" fill="#444"/>
      <circle cx="0" cy="-54" r="4" fill="#e63946"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="38" fill="#ffd84a"/>
  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <ellipse cx="140" cy="120" rx="50" ry="18"/>
    <ellipse cx="170" cy="108" rx="30" ry="18"/>
    <ellipse cx="560" cy="150" rx="45" ry="15"/>
  </g>
  <!-- sea -->
  <rect x="0" y="400" width="800" height="90" fill="#3fa7d6"/>
  <path d="M0 420 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#bfe9ff" stroke-width="2"/>

  <!-- sign -->
  <g>
    <rect x="96" y="250" width="8" height="240" fill="#666"/>
    <rect x="30" y="230" width="140" height="70" rx="8" fill="#2a9d47" stroke="#fff" stroke-width="3"/>
    <text x="100" y="257" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">BIKE LANE</text>
    <text x="100" y="278" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">(ENDS SUDDENLY</text>
    <text x="100" y="292" font-family="Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle">INTO THE SEA)</text>
  </g>

  <!-- road -->
  <rect x="0" y="490" width="800" height="32" fill="#444"/>
  <line x1="0" y1="506" x2="800" y2="506" stroke="#fff" stroke-width="4" stroke-dasharray="30 25">
    <animate attributeName="stroke-dashoffset" from="0" to="55" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="180" y1="330" x2="230" y2="330"><animate attributeName="opacity" values="1;0.2;1" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="160" y1="370" x2="225" y2="370"><animate attributeName="opacity" values="0.2;1;0.2" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="190" y1="410" x2="225" y2="410"><animate attributeName="opacity" values="1;0.3;1" dur="0.4s" repeatCount="indefinite"/></line>
  </g>

  <!-- whole rig bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- wheels -->
    <g transform="translate(290 430)"><g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
    </g></g>
    <g transform="translate(510 430)"><g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
    </g></g>

    <!-- far leg (behind frame) -->
    <line x1="395" y1="318" x2="378" y2="430" stroke="#d9822b" stroke-width="7" stroke-linecap="round">
      <animate attributeName="x2" values="378;400;422;400;378" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="430;408;430;452;430" dur="0.8s" repeatCount="indefinite"/>
    </line>

    <!-- frame -->
    <g stroke="#e63946" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="400" y1="430" x2="380" y2="350"/>
      <line x1="380" y1="350" x2="490" y2="350"/>
      <line x1="400" y1="430" x2="490" y2="360"/>
      <line x1="400" y1="430" x2="290" y2="430"/>
      <line x1="290" y1="430" x2="380" y2="350"/>
      <line x1="490" y1="345" x2="510" y2="430"/>
      <line x1="490" y1="350" x2="495" y2="318"/>
    </g>
    <path d="M488 316 L520 314 q10 0 10 10" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- basket -->
    <rect x="525" y="330" width="40" height="28" fill="#c8964b" stroke="#7a5420" stroke-width="2"/>
    <text x="545" y="349" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5a3a10" text-anchor="middle">SNACKS</text>
    <!-- seat -->
    <path d="M360 345 h40 q6 0 4 6 h-44 z" fill="#222"/>

    <!-- crank -->
    <circle cx="400" cy="430" r="12" fill="#333"/>
    <g transform="translate(400 430)"><g>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#111" stroke-width="5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
    </g></g>

    <!-- pelican body (extra bob) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.4s" repeatCount="indefinite"/>
      <!-- tail -->
      <path d="M320 300 l-40 -10 l20 25 z" fill="#ddd" stroke="#555" stroke-width="2"/>
      <!-- body -->
      <ellipse cx="385" cy="300" rx="65" ry="42" fill="#fafafa" stroke="#555" stroke-width="3"/>
      <!-- neck -->
      <path d="M420 280 q30 -30 20 -70 l30 -5 q15 50 -15 90 z" fill="#fafafa" stroke="#555" stroke-width="3"/>
      <!-- wing reaching handlebar -->
      <path d="M370 290 q70 -10 150 25 q-60 10 -140 10 z" fill="#e2e2e2" stroke="#555" stroke-width="3"/>
      <path d="M512 312 l12 -4 l0 10 z" fill="#555"/>
      <!-- head -->
      <circle cx="462" cy="200" r="26" fill="#fafafa" stroke="#555" stroke-width="3"/>
      <!-- pouch with fish -->
      <path d="M478 210 q55 55 120 18 L600 222 z" fill="#f4a259" stroke="#b5651d" stroke-width="3"/>
      <path d="M540 236 l18 -12 l-2 22 z" fill="#5aa0c8" stroke="#2c5d7c" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="-10 548 236;12 548 236;-10 548 236" dur="0.3s" repeatCount="indefinite"/>
      </path>
      <!-- upper bill -->
      <path d="M478 195 L610 218 L606 226 L480 212 z" fill="#ffbe3d" stroke="#b5651d" stroke-width="3"/>
      <!-- helmet -->
      <path d="M436 196 q4 -36 40 -32 q20 4 16 26 z" fill="#2b6cb0" stroke="#163a63" stroke-width="3"/>
      <line x1="452" y1="172" x2="458" y2="186" stroke="#fff" stroke-width="3"/>
      <line x1="468" y1="168" x2="472" y2="184" stroke="#fff" stroke-width="3"/>
      <!-- goggles / eye -->
      <circle cx="470" cy="200" r="8" fill="#fff" stroke="#222" stroke-width="3"/>
      <circle cx="472" cy="200" r="3" fill="#111"/>
      <path d="M460 190 l20 4" stroke="#222" stroke-width="3"/>
      <!-- sweat drop -->
      <path d="M440 210 q-5 8 0 12 q5 -4 0 -12 z" fill="#5ab7ff">
        <animateTransform attributeName="transform" type="translate" values="0 0;-6 14;0 0" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- near leg -->
    <line x1="395" y1="318" x2="422" y2="430" stroke="#f08c2e" stroke-width="8" stroke-linecap="round">
      <animate attributeName="x2" values="422;400;378;400;422" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="430;452;430;408;430" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <ellipse cx="422" cy="430" rx="12" ry="5" fill="#f08c2e">
      <animate attributeName="cx" values="422;400;378;400;422" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="430;452;430;408;430" dur="0.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M600 90 h170 a12 12 0 0 1 12 12 v56 a12 12 0 0 1 -12 12 h-120 l-40 30 l10 -30 h-20 a12 12 0 0 1 -12 -12 v-56 a12 12 0 0 1 12 -12 z" fill="#fff" stroke="#222" stroke-width="3" transform="translate(-60 0)"/>
    <text x="625" y="118" font-family="Comic Sans MS, Arial, sans-serif" font-size="14" fill="#222" text-anchor="middle">Technically, my face</text>
    <text x="625" y="138" font-family="Comic Sans MS, Arial, sans-serif" font-size="14" fill="#222" text-anchor="middle">IS a cargo bike.</text>
    <text x="625" y="158" font-family="Comic Sans MS, Arial, sans-serif" font-size="12" fill="#555" text-anchor="middle">(tax credit pending)</text>
  </g>

  <!-- title -->
  <text x="400" y="52" font-family="Impact, Arial Black, sans-serif" font-size="40" font-weight="bold" fill="#1d3557" text-anchor="middle" stroke="#fff" stroke-width="1.5">THE PELICAN COMMUTE</text>

  <!-- caption -->
  <text x="400" y="545" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#1d3557" text-anchor="middle">Zero emissions, one stolen fish, and a pouch that out-hauls your SUV.</text>

  <!-- footer -->
  <rect x="0" y="560" width="800" height="40" fill="#1d3557"/>
  <text x="400" y="586" font-family="Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle">2026-11-06 00:09:28 SGT (UTC+08:00)</text>
</svg>