<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333" stroke-width="2"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <text x="300" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Union area of A, B, C = 79900 px²</text>

  <!-- Rectangles -->
  <rect x="50" y="50" width="200" height="150" fill="#e53935" fill-opacity="0.4" stroke="#b71c1c" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#1e88e5" fill-opacity="0.4" stroke="#0d47a1" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#43a047" fill-opacity="0.4" stroke="#1b5e20" stroke-width="2"/>

  <!-- Overlap regions -->
  <rect x="150" y="120" width="100" height="80" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatch)" stroke="#000" stroke-width="1"/>

  <!-- Rectangle labels -->
  <text x="100" y="92" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">A</text>
  <text x="285" y="242" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">B</text>
  <text x="440" y="312" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">C</text>

  <!-- Overlap labels -->
  <rect x="166" y="144" width="68" height="34" fill="#fff" fill-opacity="0.85" rx="3"/>
  <text x="200" y="158" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#111">A ∩ B</text>
  <text x="200" y="173" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">8000 px²</text>

  <line x1="346" y1="235" x2="362" y2="228" stroke="#111" stroke-width="1"/>
  <text x="365" y="232" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#111">B ∩ C: 2100 px²</text>

  <!-- Caption for non-overlapping pair -->
  <text x="470" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#111">A and C do not overlap (0 px²)</text>

  <!-- Footer -->
  <line x1="20" y1="368" x2="580" y2="368" stroke="#999" stroke-width="1"/>
  <text x="300" y="388" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">2026-11-03 00:09:45 SGT (UTC+08:00)</text>
</svg>