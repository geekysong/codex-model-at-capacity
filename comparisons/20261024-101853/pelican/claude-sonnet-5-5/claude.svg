<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#bfe6ff"/>
<circle cx="680" cy="90" r="50" fill="#ffd94a"/>
<g fill="#fff"><ellipse cx="150" cy="100" rx="60" ry="22"/><ellipse cx="190" cy="85" rx="40" ry="20"/><ellipse cx="480" cy="140" rx="55" ry="18"/></g>
<rect y="470" width="800" height="130" fill="#6c6"/>
<rect y="455" width="800" height="50" fill="#555"/>
<path d="M0 480H800" stroke="#fff" stroke-width="4" stroke-dasharray="30 20"/>
<rect x="0" y="0" width="800" height="62" fill="#ff5a3c"/>
<text x="400" y="45" font-family="Impact,Arial Black,sans-serif" font-size="42" text-anchor="middle" fill="#fff" stroke="#222" stroke-width="2">PELICAN PEDAL PANIC!</text>
<!-- speed lines -->
<g stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M40 300H150"/><path d="M20 340H120"/><path d="M50 380H140"/></g>
<!-- bicycle -->
<g fill="none" stroke="#222" stroke-width="7">
<circle cx="260" cy="440" r="70"/><circle cx="520" cy="440" r="70"/>
<path d="M260 440L360 340L480 340L520 440M360 340L400 440L260 440M400 440L480 340" stroke="#d22"/>
<path d="M480 340L470 300H505M350 335L340 310H370" stroke="#222"/>
</g>
<g stroke="#999" stroke-width="1.5"><path d="M260 370V510M190 440H330M520 370V510M450 440H590"/></g>
<circle cx="400" cy="440" r="12" fill="#333"/>
<!-- legs -->
<path d="M375 335L420 400L400 450" stroke="#f90" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M375 335L350 410L385 435" stroke="#f90" stroke-width="9" fill="none" stroke-linecap="round"/>
<rect x="375" y="440" width="50" height="9" fill="#222"/>
<path d="M388 452h35l12 8h-50z" fill="#f90"/>
<!-- pelican body -->
<ellipse cx="345" cy="280" rx="85" ry="62" fill="#fafafa" stroke="#222" stroke-width="4"/>
<path d="M270 270Q250 230 300 245Q290 280 300 320Q260 320 270 270Z" fill="#ddd" stroke="#222" stroke-width="3"/>
<path d="M370 300Q440 290 470 305" stroke="#ddd" stroke-width="14" fill="none" stroke-linecap="round"/>
<!-- neck and head -->
<path d="M395 250Q430 200 440 160" stroke="#222" stroke-width="40" fill="none" stroke-linecap="round"/>
<path d="M395 250Q430 200 440 160" stroke="#fafafa" stroke-width="32" fill="none" stroke-linecap="round"/>
<circle cx="445" cy="140" r="34" fill="#fafafa" stroke="#222" stroke-width="4"/>
<!-- helmet -->
<path d="M410 135Q445 85 482 130Z" fill="#3a7bd5" stroke="#222" stroke-width="4"/>
<!-- eyes -->
<circle cx="458" cy="140" r="11" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="461" cy="141" r="4" fill="#222"/>
<!-- beak -->
<path d="M470 150L640 160Q620 235 480 175Z" fill="#ffb53a" stroke="#222" stroke-width="4"/>
<path d="M470 152L640 160" stroke="#222" stroke-width="4"/>
<!-- fish in pouch -->
<path d="M530 185Q560 205 590 180Q570 215 530 185Z" fill="#8cf"/>
<g transform="rotate(-20 575 190)"><ellipse cx="555" cy="185" rx="26" ry="11" fill="#4aa8ff" stroke="#222" stroke-width="2"/><path d="M578 185l16-10v20z" fill="#4aa8ff" stroke="#222" stroke-width="2"/><circle cx="542" cy="182" r="2.5" fill="#222"/></g>
<!-- sweat -->
<path d="M420 100q-6 12 0 16q6-4 0-16z" fill="#39f"/>
<path d="M505 110q-6 12 0 16q6-4 0-16z" fill="#39f"/>
<!-- fish thought bubble -->
<g fill="#fff" stroke="#222" stroke-width="3"><circle cx="545" cy="105" r="6"/><circle cx="575" cy="82" r="9"/><ellipse cx="650" cy="80" rx="70" ry="30"/></g>
<text x="650" y="76" font-family="Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">NO FISH LANES?!</text>
<text x="650" y="94" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Outrageous!</text>
<!-- fish bonus -->
<g transform="translate(660 400)"><path d="M0 0l-40 30v-60z" fill="#e33"/></g>
<!-- sign -->
<rect x="690" y="330" width="8" height="140" fill="#654"/>
<rect x="650" y="300" width="110" height="50" rx="6" fill="#fc0" stroke="#222" stroke-width="3"/>
<text x="705" y="322" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NO BIRDS</text>
<text x="705" y="340" font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ON BIKES</text>
<!-- caption -->
<rect x="40" y="525" width="720" height="55" rx="10" fill="#fff" stroke="#222" stroke-width="3"/>
<text x="400" y="550" font-family="Georgia,serif" font-size="19" font-style="italic" text-anchor="middle">"Sure, I can't fit the helmet over my beak,</text>
<text x="400" y="572" font-family="Georgia,serif" font-size="19" font-style="italic" text-anchor="middle">but my bill is bigger than my budget for bike lanes."</text>
</svg>