<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e8f7ff"/></linearGradient>
</defs>
<rect width="800" height="600" fill="url(#sky)"/>
<circle cx="680" cy="110" r="50" fill="#ffe36b"/>
<g fill="#fff" opacity=".9"><ellipse cx="150" cy="120" rx="60" ry="25"/><ellipse cx="190" cy="105" rx="45" ry="22"/><ellipse cx="520" cy="80" rx="50" ry="20"/></g>
<rect y="430" width="800" height="170" fill="#7cc46a"/>
<path d="M0 470 Q400 440 800 470 L800 600 L0 600Z" fill="#555"/>
<path d="M0 535 L800 535" stroke="#fff" stroke-width="5" stroke-dasharray="40 30"/>
<!-- fish startled -->
<g transform="translate(110 420)">
<ellipse cx="0" cy="0" rx="28" ry="14" fill="#5aa8d8"/><path d="M-26 0 L-45 -14 L-45 14Z" fill="#5aa8d8"/><circle cx="12" cy="-3" r="4" fill="#fff"/><circle cx="13" cy="-3" r="2"/>
<text x="-40" y="-25" font-family="Comic Sans MS,cursive" font-size="16" font-weight="bold">!!</text>
</g>
<!-- motion lines -->
<g stroke="#333" stroke-width="3" stroke-linecap="round"><path d="M200 360h40M190 390h55M210 420h35"/></g>
<!-- bicycle -->
<g transform="translate(400 450)">
<circle cx="-120" cy="0" r="60" fill="none" stroke="#222" stroke-width="7"/>
<circle cx="120" cy="0" r="60" fill="none" stroke="#222" stroke-width="7"/>
<g stroke="#888" stroke-width="2"><path d="M-120 -60V60M-180 0H-60M-162 -42L-78 42M-78 -42L-162 42"/><path d="M120 -60V60M60 0H180M78 -42L162 42M162 -42L78 42"/></g>
<path d="M-120 0 L-40 -90 L60 -90 L120 0 M-40 -90 L0 0 L60 -90 M0 0 L-120 0 M-40 -90 L-60 -120 M60 -90 L90 -130" fill="none" stroke="#d62828" stroke-width="8" stroke-linecap="round"/>
<rect x="-85" y="-130" width="50" height="14" rx="6" fill="#222"/>
<path d="M70 -138 h40" stroke="#222" stroke-width="7" stroke-linecap="round"/>
<circle cx="0" cy="0" r="10" fill="#333"/>
<path d="M0 0 L25 25 M0 0 L-25 -25" stroke="#333" stroke-width="5"/>
<rect x="15" y="20" width="24" height="8" fill="#333"/><rect x="-39" y="-28" width="24" height="8" fill="#333"/>
<rect x="-180" y="-10" width="6" height="22" fill="#222"/>
<!-- basket of fish -->
<path d="M100 -150 h60 l-8 40 h-44Z" fill="#c8963e" stroke="#7a5a1e" stroke-width="3"/>
<ellipse cx="130" cy="-155" rx="22" ry="8" fill="#5aa8d8"/>
</g>
<!-- pelican -->
<g transform="translate(400 300)">
<!-- back leg -->
<path d="M-20 60 Q-40 110 -40 150" fill="none" stroke="#f0a030" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="0" cy="40" rx="85" ry="55" fill="#f4f4f4" stroke="#333" stroke-width="3"/>
<path d="M-70 10 Q-110 -20 -120 30 Q-90 60 -40 50Z" fill="#ddd" stroke="#333" stroke-width="3"/>
<!-- front leg to pedal -->
<path d="M30 70 Q40 120 25 175" fill="none" stroke="#f0a030" stroke-width="9" stroke-linecap="round"/>
<path d="M15 175 h40" stroke="#f0a030" stroke-width="8" stroke-linecap="round"/>
<!-- neck -->
<path d="M50 20 Q90 -20 70 -80 Q60 -120 90 -130" fill="none" stroke="#f4f4f4" stroke-width="30" stroke-linecap="round"/>
<path d="M50 20 Q90 -20 70 -80 Q60 -120 90 -130" fill="none" stroke="#333" stroke-width="36" stroke-linecap="round" opacity="0"/>
<circle cx="95" cy="-135" r="34" fill="#f4f4f4" stroke="#333" stroke-width="3"/>
<!-- wing to handlebar -->
<path d="M-20 20 Q-80 -60 -60 -130" fill="none" stroke="#e6e6e6" stroke-width="22" stroke-linecap="round"/>
<path d="M-20 20 Q-80 -60 -60 -130" fill="none" stroke="#333" stroke-width="3" opacity=".3"/>
<!-- beak -->
<path d="M110 -140 L230 -110 L120 -105Z" fill="#f7b538" stroke="#333" stroke-width="3"/>
<path d="M118 -105 Q170 -40 230 -110 Q180 -60 118 -105Z" fill="#f4a261" stroke="#333" stroke-width="3"/>
<!-- fish tail from pouch -->
<path d="M175 -70 l15 20 l5 -24Z" fill="#5aa8d8" stroke="#333" stroke-width="2"/>
<!-- eye -->
<circle cx="105" cy="-148" r="9" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="108" cy="-147" r="4"/>
<path d="M90 -165 L120 -160" stroke="#333" stroke-width="4" stroke-linecap="round"/>
<!-- helmet -->
<path d="M60 -160 Q95 -205 130 -160Z" fill="#e63946" stroke="#333" stroke-width="3"/>
<path d="M70 -170 h50" stroke="#fff" stroke-width="4"/>
<!-- sweat -->
<g fill="#4cc9f0"><ellipse cx="55" cy="-175" rx="4" ry="7"/><ellipse cx="45" cy="-150" rx="4" ry="7"/></g>
</g>
<!-- speech bubble -->
<g>
<path d="M560 150 Q540 90 620 80 L740 80 Q790 85 775 130 Q770 170 700 170 L630 170 L600 200 L610 168 Q560 165 560 150Z" fill="#fff" stroke="#333" stroke-width="3"/>
<text x="668" y="117" font-family="Comic Sans MS,cursive" font-size="20" font-weight="bold" text-anchor="middle">Who needs wings</text>
<text x="668" y="145" font-family="Comic Sans MS,cursive" font-size="20" font-weight="bold" text-anchor="middle">when you have gears?</text>
</g>
<!-- title -->
<text x="400" y="52" font-family="Impact,Arial Black,sans-serif" font-size="46" text-anchor="middle" fill="#1d3557" stroke="#fff" stroke-width="2">THE BILL-CYCLIST</text>
<!-- caption -->
<rect x="140" y="548" width="520" height="40" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="400" y="575" font-family="Georgia,serif" font-size="18" font-style="italic" text-anchor="middle" fill="#222">Pelican swaps flying for cycling; local fish report "zero improvement."</text>
</svg>