<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <!-- ground line -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#333333" stroke-width="2"/>
  <!-- trajectory: vx=20 m/s, vy=15 m/s, g=10 m/s^2, scale 7.5 px/m (fits canvas) -->
  <path d="M 100 350 Q 325 181.25 550 350" fill="none" stroke="#1f77b4" stroke-width="2"/>
  <!-- launch point -->
  <circle cx="100" cy="350" r="4" fill="#2ca02c"/>
  <!-- apex -->
  <circle cx="325" cy="265.625" r="4" fill="#d62728"/>
  <!-- landing point -->
  <circle cx="550" cy="350" r="4" fill="#2ca02c"/>
  <!-- labels -->
  <text x="60" y="375" font-family="Arial, sans-serif" font-size="13" fill="#000000">launch: 0 m, 0 m</text>
  <text x="325" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#000000">apex: 30 m, 11.25 m</text>
  <text x="550" y="375" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#000000">landing: 60 m, 0 m</text>
  <text x="60" y="40" font-family="Arial, sans-serif" font-size="14" fill="#000000">total flight time: 3 s</text>
  <text x="60" y="60" font-family="Arial, sans-serif" font-size="12" fill="#555555">vx = 20 m/s, vy = 15 m/s, g = 10 m/s², scale 7.5 px/m</text>
</svg>