<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- At 10 px/m horizontally, the 60 m range would land at x=700, which is off-canvas. The horizontal scale is set to 7.5 px/m so the full trajectory fits on the ground line (x=100 to 550). The vertical scale stays at 10 px/m. -->
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <text x="20" y="35" font-family="Arial, sans-serif" font-size="16" fill="#000">total flight time: 3 s</text>
  <text x="20" y="58" font-family="Arial, sans-serif" font-size="12" fill="#555">scale: horizontal 7.5 px/m, vertical 10 px/m</text>
  <line x1="50" y1="350" x2="550" y2="350" stroke="#333" stroke-width="2"/>
  <path d="M 100 350 Q 325 125 550 350" fill="none" stroke="#1f6fd1" stroke-width="2.5"/>
  <circle cx="100" cy="350" r="5" fill="#2a9d2a"/>
  <circle cx="325" cy="237.5" r="5" fill="#d12f1f"/>
  <circle cx="550" cy="350" r="5" fill="#7a2fd1"/>
  <text x="60" y="374" font-family="Arial, sans-serif" font-size="14" fill="#000">launch: 0 m, 0 m</text>
  <text x="325" y="222" font-family="Arial, sans-serif" font-size="14" fill="#000" text-anchor="middle">apex: 30 m, 11.25 m</text>
  <text x="580" y="374" font-family="Arial, sans-serif" font-size="14" fill="#000" text-anchor="end">landing: 60 m, 0 m</text>
</svg>