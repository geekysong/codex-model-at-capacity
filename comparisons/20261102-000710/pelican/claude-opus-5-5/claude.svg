<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/>
      <stop offset="1" stop-color="#2c3e72"/>
    </linearGradient>
    <style>
      .twinkle{animation:tw 2s ease-in-out infinite alternate}
      .t2{animation-delay:0.7s}
      .t3{animation-delay:1.3s}
      @keyframes tw{from{opacity:0.25}to{opacity:1}}
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="90" cy="120" r="34" fill="#f6f1c7"/>
  <circle cx="104" cy="112" r="30" fill="#1a2a55"/>
  <g fill="#fff">
    <circle class="twinkle" cx="200" cy="90" r="2"/>
    <circle class="twinkle t2" cx="330" cy="130" r="1.6"/>
    <circle class="twinkle t3" cx="430" cy="85" r="2.2"/>
    <circle class="twinkle t2" cx="160" cy="200" r="1.5"/>
    <circle class="twinkle" cx="520" cy="150" r="1.8"/>
    <circle class="twinkle t3" cx="740" cy="200" r="2"/>
    <circle class="twinkle t2" cx="60" cy="250" r="1.6"/>
  </g>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="38" fill="#ffd23f" stroke="#1b1b1b" stroke-width="1.5">THE GIG ECONOMY TAKES FLIGHT (NOT)</text>

  <!-- Road -->
  <rect x="0" y="480" width="800" height="22" fill="#3a3a44"/>
  <g fill="#e8e3a0">
    <g>
      <rect x="0" y="489" width="40" height="4"/>
      <rect x="80" y="489" width="40" height="4"/>
      <rect x="160" y="489" width="40" height="4"/>
      <rect x="240" y="489" width="40" height="4"/>
      <rect x="320" y="489" width="40" height="4"/>
      <rect x="400" y="489" width="40" height="4"/>
      <rect x="480" y="489" width="40" height="4"/>
      <rect x="560" y="489" width="40" height="4"/>
      <rect x="640" y="489" width="40" height="4"/>
      <rect x="720" y="489" width="40" height="4"/>
      <rect x="800" y="489" width="40" height="4"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Speed lines -->
  <g stroke="#9fb4e8" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="150" y1="330" x2="220" y2="330"/>
    <line x1="120" y1="370" x2="215" y2="370"/>
    <line x1="160" y1="410" x2="225" y2="410"/>
  </g>

  <!-- Thought bubble -->
  <g>
    <ellipse cx="655" cy="120" rx="125" ry="48" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>
    <circle cx="560" cy="178" r="10" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>
    <circle cx="530" cy="196" r="6" fill="#fff" stroke="#1b1b1b" stroke-width="3"/>
    <text x="655" y="112" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="16" fill="#1b1b1b">"Flying isn't in my</text>
    <text x="655" y="134" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="16" fill="#1b1b1b">job description."</text>
  </g>

  <!-- Back leg (behind bike) -->
  <line x1="385" y1="335" x2="375" y2="420" stroke="#e8892b" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="375;382.3;400;417.7;425;417.7;400;382.3;375" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="420;402.3;395;402.3;420;437.7;445;437.7;420" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Delivery box -->
  <g>
    <rect x="245" y="295" width="95" height="62" rx="5" fill="#2bb673" stroke="#1b1b1b" stroke-width="3"/>
    <text x="292" y="322" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="13" fill="#fff">FISH</text>
    <text x="292" y="340" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="13" fill="#fff">DASH</text>
    <line x1="300" y1="357" x2="300" y2="420" stroke="#555" stroke-width="4"/>
  </g>

  <!-- Wheels -->
  <g transform="translate(300,420)">
    <circle r="60" fill="none" stroke="#111" stroke-width="9"/>
    <circle r="55" fill="none" stroke="#999" stroke-width="2"/>
    <g stroke="#ccc" stroke-width="2">
      <line x1="-55" y1="0" x2="55" y2="0"/>
      <line x1="0" y1="-55" x2="0" y2="55"/>
      <line x1="-39" y1="-39" x2="39" y2="39"/>
      <line x1="-39" y1="39" x2="39" y2="-39"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
    <circle r="5" fill="#333"/>
  </g>
  <g transform="translate(520,420)">
    <circle r="60" fill="none" stroke="#111" stroke-width="9"/>
    <circle r="55" fill="none" stroke="#999" stroke-width="2"/>
    <g stroke="#ccc" stroke-width="2">
      <line x1="-55" y1="0" x2="55" y2="0"/>
      <line x1="0" y1="-55" x2="0" y2="55"/>
      <line x1="-39" y1="-39" x2="39" y2="39"/>
      <line x1="-39" y1="39" x2="39" y2="-39"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
    <circle r="5" fill="#333"/>
  </g>

  <!-- Frame -->
  <g stroke="#e63946" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="300" y1="420" x2="400" y2="420"/>
    <line x1="300" y1="420" x2="372" y2="335"/>
    <line x1="372" y1="335" x2="400" y2="420"/>
    <line x1="372" y1="335" x2="497" y2="330"/>
    <line x1="400" y1="420" x2="497" y2="345"/>
    <line x1="500" y1="315" x2="520" y2="420"/>
  </g>
  <line x1="372" y1="335" x2="368" y2="322" stroke="#333" stroke-width="5"/>
  <rect x="350" y="316" width="36" height="9" rx="4" fill="#222"/>
  <line x1="500" y1="315" x2="496" y2="298" stroke="#333" stroke-width="5"/>
  <path d="M484,298 L512,296" stroke="#222" stroke-width="6" stroke-linecap="round"/>

  <!-- Crank -->
  <g transform="translate(400,420)">
    <g>
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#444" stroke-width="5"/>
      <rect x="20" y="-3" width="12" height="6" fill="#111"/>
      <rect x="-32" y="-3" width="12" height="6" fill="#111"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
    <circle r="9" fill="#666" stroke="#222" stroke-width="2"/>
  </g>

  <!-- Pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.5s" repeatCount="indefinite"/>
    <!-- tail -->
    <path d="M345,300 L315,290 L322,312 Z" fill="#f4f4f4" stroke="#1b1b1b" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="395" cy="300" rx="58" ry="38" fill="#f8f8f8" stroke="#1b1b1b" stroke-width="3" transform="rotate(-12 395 300)"/>
    <!-- neck -->
    <path d="M428,285 Q455,250 465,215" fill="none" stroke="#1b1b1b" stroke-width="26" stroke-linecap="round"/>
    <path d="M428,285 Q455,250 465,215" fill="none" stroke="#f8f8f8" stroke-width="20" stroke-linecap="round"/>
    <!-- pouch and beak -->
    <path d="M482,205 Q545,265 610,216 Z" fill="#ffb36b" stroke="#1b1b1b" stroke-width="3"/>
    <path d="M590,228 L612,222 L604,240 Z" fill="#4aa3df" stroke="#1b1b1b" stroke-width="2"/>
    <path d="M480,191 L615,214 L484,207 Z" fill="#f28c28" stroke="#1b1b1b" stroke-width="3" stroke-linejoin="round"/>
    <!-- head -->
    <circle cx="468" cy="198" r="22" fill="#f8f8f8" stroke="#1b1b1b" stroke-width="3"/>
    <!-- helmet -->
    <path d="M444,192 A24 24 0 0 1 492,190 Z" fill="#ffd23f" stroke="#1b1b1b" stroke-width="3"/>
    <line x1="450" y1="186" x2="486" y2="184" stroke="#1b1b1b" stroke-width="2"/>
    <!-- tired eye -->
    <circle cx="474" cy="200" r="6" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
    <circle cx="476" cy="202" r="2.5" fill="#1b1b1b"/>
    <path d="M467,198 L481,197" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
    <!-- sweat drop -->
    <path d="M452,210 Q448,220 452,224 Q457,220 452,210 Z" fill="#8fd3ff">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </path>
    <!-- wing to handlebar -->
    <path d="M375,282 Q450,268 506,296 Q452,314 382,318 Z" fill="#cfd4dc" stroke="#1b1b1b" stroke-width="3"/>
    <path d="M400,300 L470,298 M405,309 L460,307" stroke="#8a93a3" stroke-width="2"/>
  </g>

  <!-- Front leg -->
  <line x1="390" y1="335" x2="425" y2="420" stroke="#f29b3a" stroke-width="8" stroke-linecap="round">
    <animate attributeName="x2" values="425;417.7;400;382.3;375;382.3;400;417.7;425" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="420;437.7;445;437.7;420;402.3;395;402.3;420" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Caption -->
  <text x="400" y="530" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#ffffff">Evolution gave the pelican wings. The app gave him a bicycle, a 4.2 rating</text>
  <text x="400" y="550" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#ffffff">and a strict "no eating the deliveries" policy.</text>

  <!-- Footer -->
  <rect x="0" y="562" width="800" height="38" fill="#0a0f1f"/>
  <text x="400" y="587" text-anchor="middle" font-family="Courier New, monospace" font-size="15" fill="#ffd23f">2026-11-02 00:07:10 SGT (UTC+08:00)</text>
</svg>