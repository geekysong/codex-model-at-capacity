<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <style>
      .tire{fill:none;stroke:#222;stroke-width:9}
      .rim{fill:none;stroke:#888;stroke-width:3}
      .spoke{stroke:#999;stroke-width:2}
      .frame{stroke:#d7263d;stroke-width:8;stroke-linecap:round;fill:none}
      .leg{stroke:#f08c00;stroke-width:6;stroke-linecap:round}
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="60" r="0" fill="#ffd43b"/>
  <circle cx="720" cy="190" r="34" fill="#ffd43b" opacity="0.9"/>

  <!-- Drifting clouds -->
  <g fill="#fff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" from="120 0" to="-220 0" dur="14s" repeatCount="indefinite"/>
      <ellipse cx="200" cy="120" rx="45" ry="18"/>
      <ellipse cx="235" cy="108" rx="30" ry="18"/>
      <ellipse cx="620" cy="230" rx="40" ry="14"/>
      <ellipse cx="650" cy="220" rx="25" ry="14"/>
    </g>
  </g>

  <!-- Hills -->
  <path d="M0 420 Q150 360 300 410 T600 400 T800 410 L800 480 L0 480 Z" fill="#8ccf7e"/>

  <!-- Road -->
  <rect x="0" y="475" width="800" height="45" fill="#555"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-80 0" dur="0.5s" repeatCount="indefinite"/>
    <g fill="#ffe066">
      <rect x="0" y="494" width="40" height="5"/>
      <rect x="80" y="494" width="40" height="5"/>
      <rect x="160" y="494" width="40" height="5"/>
      <rect x="240" y="494" width="40" height="5"/>
      <rect x="320" y="494" width="40" height="5"/>
      <rect x="400" y="494" width="40" height="5"/>
      <rect x="480" y="494" width="40" height="5"/>
      <rect x="560" y="494" width="40" height="5"/>
      <rect x="640" y="494" width="40" height="5"/>
      <rect x="720" y="494" width="40" height="5"/>
      <rect x="800" y="494" width="40" height="5"/>
    </g>
  </g>

  <!-- Sign -->
  <g>
    <rect x="86" y="330" width="8" height="145" fill="#666"/>
    <rect x="30" y="290" width="120" height="62" rx="6" fill="#fff" stroke="#c92a2a" stroke-width="4"/>
    <text x="90" y="313" text-anchor="middle" font-size="13" font-weight="bold" fill="#c92a2a">NO FLYING</text>
    <text x="90" y="331" text-anchor="middle" font-size="12" fill="#222">IN BIKE LANE</text>
    <text x="90" y="346" text-anchor="middle" font-size="10" fill="#555">(fines in fish)</text>
  </g>

  <!-- Speed lines -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round">
    <line x1="170" y1="360" x2="215" y2="360">
      <animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="395" x2="210" y2="395">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="175" y1="430" x2="215" y2="430">
      <animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Wheels -->
  <g>
    <circle cx="290" cy="410" r="62" class="tire"/>
    <circle cx="290" cy="410" r="55" class="rim"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 290 410" to="360 290 410" dur="0.8s" repeatCount="indefinite"/>
      <line x1="290" y1="355" x2="290" y2="465" class="spoke"/>
      <line x1="235" y1="410" x2="345" y2="410" class="spoke"/>
      <line x1="251" y1="371" x2="329" y2="449" class="spoke"/>
      <line x1="329" y1="371" x2="251" y2="449" class="spoke"/>
      <circle cx="290" cy="356" r="4" fill="#ffd43b"/>
    </g>
    <circle cx="290" cy="410" r="6" fill="#333"/>
  </g>
  <g>
    <circle cx="510" cy="410" r="62" class="tire"/>
    <circle cx="510" cy="410" r="55" class="rim"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 510 410" to="360 510 410" dur="0.8s" repeatCount="indefinite"/>
      <line x1="510" y1="355" x2="510" y2="465" class="spoke"/>
      <line x1="455" y1="410" x2="565" y2="410" class="spoke"/>
      <line x1="471" y1="371" x2="549" y2="449" class="spoke"/>
      <line x1="549" y1="371" x2="471" y2="449" class="spoke"/>
      <circle cx="510" cy="356" r="4" fill="#ffd43b"/>
    </g>
    <circle cx="510" cy="410" r="6" fill="#333"/>
  </g>

  <!-- Back leg (behind frame) -->
  <line x1="378" y1="312" x2="360" y2="410" class="leg" opacity="0.7">
    <animate attributeName="x2" values="360;368.8;390;411.2;420;411.2;390;368.8;360" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="410;388.8;380;388.8;410;431.2;440;431.2;410" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Frame -->
  <g class="frame">
    <line x1="290" y1="410" x2="390" y2="410"/>
    <line x1="290" y1="410" x2="360" y2="325"/>
    <line x1="390" y1="410" x2="360" y2="325"/>
    <line x1="360" y1="325" x2="482" y2="312"/>
    <line x1="390" y1="410" x2="486" y2="330"/>
    <line x1="480" y1="300" x2="510" y2="410"/>
  </g>
  <line x1="480" y1="302" x2="478" y2="282" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M462 284 L496 278 L500 290" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M338 320 Q356 312 378 318 L376 324 L340 326 Z" fill="#222"/>

  <!-- Crank -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 410" to="360 390 410" dur="1s" repeatCount="indefinite"/>
    <circle cx="390" cy="410" r="13" fill="none" stroke="#444" stroke-width="4"/>
    <line x1="360" y1="410" x2="420" y2="410" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Pelican upper body (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.5s" repeatCount="indefinite"/>

    <!-- Delivery backpack -->
    <g transform="rotate(-12 330 240)">
      <rect x="296" y="205" width="70" height="58" rx="5" fill="#ff922b" stroke="#a84300" stroke-width="3"/>
      <text x="331" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">FISHDASH</text>
      <text x="331" y="250" text-anchor="middle" font-size="12" fill="#fff">4.2★</text>
    </g>

    <!-- Tail -->
    <path d="M325 290 L290 305 L322 310 Z" fill="#dee2e6" stroke="#495057" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="375" cy="287" rx="58" ry="36" transform="rotate(-15 375 287)" fill="#fff" stroke="#495057" stroke-width="3"/>
    <!-- Neck -->
    <path d="M400 268 Q440 245 442 200" fill="none" stroke="#495057" stroke-width="26" stroke-linecap="round"/>
    <path d="M400 268 Q440 245 442 200" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>
    <!-- Wing reaching to handlebar -->
    <path d="M345 268 Q400 245 470 280 Q430 292 360 300 Z" fill="#adb5bd" stroke="#495057" stroke-width="3"/>
    <path d="M462 276 l14 4 l-4 8 l-12 -2 z" fill="#868e96"/>

    <!-- Head -->
    <circle cx="450" cy="182" r="23" fill="#fff" stroke="#495057" stroke-width="3"/>
    <!-- Helmet -->
    <path d="M426 178 Q430 148 458 152 Q478 156 476 176 Z" fill="#d7263d" stroke="#7a0f1d" stroke-width="2"/>
    <line x1="440" y1="158" x2="446" y2="174" stroke="#fff" stroke-width="2"/>
    <line x1="456" y1="155" x2="458" y2="172" stroke="#fff" stroke-width="2"/>
    <!-- Eye & determined brow -->
    <circle cx="460" cy="184" r="5" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <circle cx="462" cy="184" r="2.5" fill="#222"/>
    <line x1="452" y1="175" x2="468" y2="179" stroke="#222" stroke-width="3" stroke-linecap="round"/>

    <!-- Pouch with stolen sushi -->
    <path d="M468 196 Q520 262 576 204 Z" fill="#ffc078" stroke="#c76a00" stroke-width="2.5"/>
    <path d="M528 214 l14 -14 l2 12 z" fill="#4dabf7" stroke="#1864ab" stroke-width="1.5"/>
    <rect x="500" y="215" width="18" height="10" rx="3" fill="#fff" stroke="#333" stroke-width="1"/>
    <rect x="500" y="215" width="18" height="4" fill="#ff6b6b"/>
    <!-- Upper beak -->
    <path d="M466 184 L578 200 L574 206 L468 196 Z" fill="#ffa94d" stroke="#c76a00" stroke-width="2.5"/>
    <path d="M574 199 l8 4 l-7 4 z" fill="#e8590c"/>

    <!-- Sweat drop -->
    <path d="M428 168 q-5 8 0 11 q5 -3 0 -11 z" fill="#4dabf7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 12;0 0" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Front leg with webbed foot -->
  <line x1="384" y1="312" x2="420" y2="410" class="leg">
    <animate attributeName="x2" values="420;411.2;390;368.8;360;368.8;390;411.2;420" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="410;431.2;440;431.2;410;388.8;380;388.8;410" dur="1s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="420" cy="410" rx="11" ry="5" fill="#f08c00" stroke="#a84300" stroke-width="1.5">
    <animate attributeName="cx" values="420;411.2;390;368.8;360;368.8;390;411.2;420" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="410;431.2;440;431.2;410;388.8;380;388.8;410" dur="1s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Speech bubble -->
  <g>
    <path d="M590 96 h170 a12 12 0 0 1 12 12 v42 a12 12 0 0 1 -12 12 h-130 l-40 20 l12 -20 h-12 a12 12 0 0 1 -12 -12 v-42 a12 12 0 0 1 12 -12 z" fill="#fff" stroke="#222" stroke-width="2.5"/>
    <text x="676" y="124" text-anchor="middle" font-size="16" font-style="italic" fill="#222">"Wings? That's a</text>
    <text x="676" y="146" text-anchor="middle" font-size="16" font-style="italic" fill="#222">legacy feature."</text>
  </g>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-size="28" font-weight="900" fill="#1b1b3a" stroke="#fff" stroke-width="5" paint-order="stroke">PEDAL-POWERED PELICAN: GIG ECONOMY EDITION</text>

  <!-- Caption -->
  <text x="400" y="545" text-anchor="middle" font-size="15" fill="#1b1b3a">Gerald quit flying for the app: it pays per kilometre pedalled, not per flap. The sushi is not his.</text>

  <!-- Footer -->
  <rect x="0" y="562" width="800" height="38" fill="#1b1b3a"/>
  <text x="400" y="587" text-anchor="middle" font-size="14" fill="#ffffff">2026-11-03 00:07:14 SGT (UTC+08:00)</text>
</svg>