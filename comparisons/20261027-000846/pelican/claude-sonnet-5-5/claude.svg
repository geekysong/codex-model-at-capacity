<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Satirical cartoon of a pelican riding a bicycle">
  <title>Pelican Pedal Problems</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="50" fill="none" stroke="#222" stroke-width="6"/>
      <circle r="44" fill="none" stroke="#999" stroke-width="1.5"/>
      <g stroke="#555" stroke-width="2">
        <line x1="-44" y1="0" x2="44" y2="0"/>
        <line x1="0" y1="-44" x2="0" y2="44"/>
        <line x1="-31" y1="-31" x2="31" y2="31"/>
        <line x1="-31" y1="31" x2="31" y2="-31"/>
      </g>
      <line x1="0" y1="0" x2="44" y2="0" stroke="#e53935" stroke-width="4"/>
      <circle r="6" fill="#444"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="90" cy="135" r="34" fill="#ffd54a" stroke="#f9a825" stroke-width="4"/>

  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <g>
      <ellipse cx="240" cy="125" rx="36" ry="14"/>
      <ellipse cx="265" cy="115" rx="26" ry="14"/>
      <ellipse cx="215" cy="116" rx="22" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 40 0; 0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="680" cy="400" rx="0" ry="0"/>
    </g>
  </g>

  <!-- title -->
  <text x="400" y="48" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="38" font-weight="bold" fill="#c62828" stroke="#fff" stroke-width="1.5" paint-order="stroke">PELICAN PEDAL PROBLEMS</text>

  <!-- ground -->
  <rect x="0" y="440" width="800" height="110" fill="#7a7f87"/>
  <rect x="0" y="440" width="800" height="8" fill="#5d6168"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#fff" stroke-width="5" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- speed lines -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="300" x2="150" y2="300"><animate attributeName="opacity" values="1;0.1;1" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="30" y1="340" x2="140" y2="340"><animate attributeName="opacity" values="0.1;1;0.1" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="70" y1="380" x2="170" y2="380"><animate attributeName="opacity" values="1;0.1;1" dur="0.5s" repeatCount="indefinite"/></line>
  </g>

  <!-- wheels (stay on ground) -->
  <g>
    <g transform="translate(280 390)">
      <use href="#wheel"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></use>
    </g>
    <g transform="translate(520 390)">
      <use href="#wheel"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/></use>
    </g>
  </g>

  <!-- bobbing bike + pelican -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- frame -->
    <g stroke="#1e88e5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="280,390 360,320 380,390 280,390"/>
      <line x1="360" y1="320" x2="490" y2="315"/>
      <line x1="380" y1="390" x2="490" y2="315"/>
      <line x1="490" y1="315" x2="520" y2="390"/>
      <line x1="490" y1="315" x2="500" y2="298"/>
      <line x1="500" y1="298" x2="528" y2="298" stroke="#333"/>
    </g>
    <!-- seat -->
    <rect x="340" y="308" width="40" height="9" rx="4" fill="#222"/>
    <line x1="360" y1="317" x2="360" y2="322" stroke="#222" stroke-width="5"/>

    <!-- back leg (behind) -->
    <line x1="355" y1="305" x2="355" y2="390" stroke="#f57c00" stroke-width="7" stroke-linecap="round">
      <animate attributeName="x2" values="355;362.3;380;397.7;405;397.7;380;362.3;355" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="390;372.3;365;372.3;390;407.7;415;407.7;390" dur="1.2s" repeatCount="indefinite"/>
    </line>

    <!-- crank -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 380 390" to="360 380 390" dur="1.2s" repeatCount="indefinite"/>
      <line x1="355" y1="390" x2="405" y2="390" stroke="#444" stroke-width="5" stroke-linecap="round"/>
      <rect x="397" y="386" width="16" height="8" fill="#222"/>
      <rect x="347" y="386" width="16" height="8" fill="#222"/>
      <circle cx="380" cy="390" r="9" fill="#666"/>
    </g>

    <!-- tail feathers -->
    <path d="M296 262 L255 245 L262 270 L252 285 L298 285 Z" fill="#eceff1" stroke="#455a64" stroke-width="3" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="348" cy="272" rx="58" ry="40" fill="#fff" stroke="#455a64" stroke-width="4"/>
    <!-- briefcase -->
    <rect x="318" y="262" width="0" height="0"/>

    <!-- front leg -->
    <line x1="355" y1="305" x2="405" y2="390" stroke="#ff9800" stroke-width="7" stroke-linecap="round">
      <animate attributeName="x2" values="405;397.7;380;362.3;355;362.3;380;397.7;405" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="390;407.7;415;407.7;390;372.3;365;372.3;390" dur="1.2s" repeatCount="indefinite"/>
    </line>

    <!-- neck -->
    <path d="M385 250 C430 245 395 215 435 208" fill="none" stroke="#455a64" stroke-width="24" stroke-linecap="round"/>
    <path d="M385 250 C430 245 395 215 435 208" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round"/>

    <!-- wing arm to handlebar -->
    <path d="M385 268 L524 298" stroke="#455a64" stroke-width="17" stroke-linecap="round"/>
    <path d="M385 268 L524 298" stroke="#fff" stroke-width="11" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="440" cy="196" r="24" fill="#fff" stroke="#455a64" stroke-width="4"/>
    <!-- pouch with fish -->
    <path d="M455 212 C470 250 550 255 577 214 Z" fill="#ffcc80" stroke="#e65100" stroke-width="3" stroke-linejoin="round"/>
    <g>
      <ellipse cx="520" cy="232" rx="18" ry="8" fill="#4fc3f7" stroke="#0277bd" stroke-width="2"/>
      <polygon points="536,232 550,223 550,241" fill="#4fc3f7" stroke="#0277bd" stroke-width="2"/>
      <circle cx="512" cy="230" r="2" fill="#000"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 520 232; 6 520 232; -6 520 232" dur="0.4s" repeatCount="indefinite"/>
    </g>
    <!-- bill -->
    <path d="M452 186 L580 212 Q582 216 577 216 L455 214 Z" fill="#ffb300" stroke="#e65100" stroke-width="3" stroke-linejoin="round"/>
    <path d="M578 210 q8 2 4 8" fill="none" stroke="#e65100" stroke-width="3"/>
    <!-- sunglasses -->
    <rect x="436" y="184" width="26" height="12" rx="5" fill="#111"/>
    <line x1="418" y1="188" x2="436" y2="189" stroke="#111" stroke-width="3"/>
    <circle cx="446" cy="189" r="2" fill="#fff"/>
    <!-- helmet -->
    <path d="M414 190 A26 26 0 0 1 466 184 Z" fill="#e53935" stroke="#7f0000" stroke-width="3"/>
    <line x1="440" y1="170" x2="440" y2="186" stroke="#fff" stroke-width="4"/>
    <!-- tie -->
    <polygon points="412,230 424,228 422,255 416,262 410,252" fill="#8e24aa" stroke="#4a148c" stroke-width="2"/>
  </g>

  <!-- speech bubble -->
  <g>
    <polygon points="545,148 575,148 488,180" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <rect x="505" y="82" width="260" height="68" rx="16" fill="#fff" stroke="#333" stroke-width="3"/>
    <rect x="547" y="144" width="26" height="7" fill="#fff"/>
    <text x="635" y="110" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">Pouch is full of fish,</text>
    <text x="635" y="132" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">brakes are not. Yolo!</text>
  </g>

  <!-- caption -->
  <text x="400" y="526" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-style="italic" fill="#1a1a1a">Breaking: pelican commutes to work, insists the bicycle is "just a slow fish."</text>

  <!-- footer -->
  <rect x="0" y="545" width="800" height="55" fill="#263238"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">2026-10-27 00:08:46 SGT (UTC+08:00)</text>
</svg>