<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1035"/><stop offset="1" stop-color="#3a1858"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#ff3b6b" stop-opacity=".8"/><stop offset="1" stop-color="#ff3b6b" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="600" fill="url(#bg)"/>
<text x="400" y="45" font-family="Impact,Arial Black,sans-serif" font-size="38" fill="#ffe14d" text-anchor="middle" stroke="#000" stroke-width="1.5">CLUB CODEX: EXCLUSIVE</text>
<!-- building -->
<rect x="440" y="80" width="330" height="420" fill="#2a2a3e" stroke="#000" stroke-width="3"/>
<rect x="470" y="110" width="270" height="50" fill="#111" stroke="#ff3b6b" stroke-width="3"/>
<text x="605" y="146" font-family="Impact,sans-serif" font-size="30" fill="#5ff" text-anchor="middle">GPT-∞ LOUNGE</text>
<rect x="540" y="260" width="130" height="240" fill="#0a0a14" stroke="#000" stroke-width="3"/>
<!-- inside VIP -->
<circle cx="605" cy="330" r="60" fill="url(#glow)"/>
<circle cx="605" cy="400" r="18" fill="#7ff"/><rect x="590" y="415" width="30" height="40" fill="#7ff"/>
<polygon points="590,385 605,360 620,385" fill="#ffd34d"/>
<text x="605" y="480" font-size="11" fill="#fff" text-anchor="middle" font-family="Arial">the ONE model, sipping tokens</text>
<!-- FULL sign -->
<circle cx="605" cy="215" r="55" fill="url(#glow)"/>
<rect x="545" y="190" width="120" height="50" rx="8" fill="#200" stroke="#ff3b6b" stroke-width="4"/>
<text x="605" y="229" font-family="Impact,sans-serif" font-size="36" fill="#ff5a7e" text-anchor="middle">FULL</text>
<!-- hamster wheel servers -->
<g transform="translate(470,300)">
<rect x="0" y="0" width="55" height="130" fill="#555" stroke="#000" stroke-width="2"/>
<circle cx="27" cy="40" r="20" fill="none" stroke="#ddd" stroke-width="3"/>
<ellipse cx="27" cy="45" rx="8" ry="6" fill="#d9a066"/>
<path d="M10 70 q5 30 0 50 M30 75 q5 25 0 45 M45 70 q3 30 0 55" stroke="#f60" stroke-width="5" fill="none"/>
<text x="27" y="-6" font-size="12" fill="#fff" text-anchor="middle" font-family="Arial">melting…</text>
</g>
<!-- floor -->
<rect y="500" width="800" height="100" fill="#14102a"/>
<!-- velvet rope -->
<rect x="380" y="380" width="8" height="120" fill="#d4af37"/><circle cx="384" cy="378" r="9" fill="#d4af37"/>
<rect x="520" y="380" width="8" height="120" fill="#d4af37"/><circle cx="524" cy="378" r="9" fill="#d4af37"/>
<path d="M384 385 Q454 450 524 385" stroke="#c0102a" stroke-width="9" fill="none"/>
<!-- robot bouncer -->
<g transform="translate(400,250)">
<rect x="0" y="40" width="90" height="110" rx="10" fill="#8895a8" stroke="#000" stroke-width="3"/>
<rect x="15" y="-10" width="60" height="50" rx="8" fill="#a9b6c8" stroke="#000" stroke-width="3"/>
<rect x="22" y="5" width="46" height="14" fill="#111"/><circle cx="35" cy="12" r="4" fill="#f33"/><circle cx="55" cy="12" r="4" fill="#f33"/>
<rect x="30" y="28" width="30" height="5" fill="#222"/>
<line x1="45" y1="-10" x2="45" y2="-28" stroke="#000" stroke-width="3"/><circle cx="45" cy="-30" r="5" fill="#f33"/>
<polygon points="35,40 45,62 55,40" fill="#fff"/>
<rect x="-30" y="55" width="35" height="14" fill="#8895a8" stroke="#000" stroke-width="3"/>
<rect x="-50" y="35" width="20" height="40" rx="4" fill="#8895a8" stroke="#000" stroke-width="3"/>
<rect x="85" y="55" width="40" height="14" fill="#8895a8" stroke="#000" stroke-width="3"/>
<rect x="-110" y="-60" width="105" height="55" rx="10" fill="#fff" stroke="#000" stroke-width="2"/>
<text x="-57" y="-40" font-size="11" font-family="Arial" text-anchor="middle">Selected model is</text>
<text x="-57" y="-26" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">at capacity.</text>
<text x="-57" y="-12" font-size="10" font-family="Arial" text-anchor="middle">Try a different one.</text>
</g>
<!-- queue of developers -->
<g stroke="#000" stroke-width="2">
<g transform="translate(300,400)"><circle cx="0" cy="0" r="16" fill="#f1c9a0"/><rect x="-16" y="16" width="32" height="60" fill="#3a7"/><rect x="-14" y="-2" width="28" height="7" fill="#eee"/></g>
<g transform="translate(220,410)"><circle cx="0" cy="0" r="16" fill="#c68"/><rect x="-16" y="16" width="32" height="60" fill="#47c"/><path d="M-8 8 q8 6 16 0" fill="none"/><path d="M-12 -16 l-3 -10 M12 -16 l3 -10" /></g>
<g transform="translate(140,420)"><circle cx="0" cy="0" r="16" fill="#8d5a3a"/><rect x="-16" y="16" width="32" height="60" fill="#c63"/><rect x="-26" y="30" width="26" height="18" fill="#bbb"/></g>
<g transform="translate(60,430)"><circle cx="0" cy="0" r="16" fill="#f1c9a0"/><rect x="-16" y="16" width="32" height="60" fill="#888"/><rect x="-22" y="40" width="44" height="12" fill="#fc3"/></g>
</g>
<!-- speech bubbles -->
<g font-family="Arial" font-size="13" text-anchor="middle">
<rect x="230" y="320" width="150" height="34" rx="10" fill="#fff"/><text x="305" y="342">But I have a deadline!</text>
<rect x="110" y="340" width="130" height="34" rx="10" fill="#fff"/><text x="175" y="362">Try gpt-5 again?</text>
<rect x="10" y="355" width="130" height="34" rx="10" fill="#fff"/><text x="75" y="377">I've been here 3 days</text>
</g>
<!-- caption -->
<rect x="40" y="525" width="720" height="55" rx="10" fill="#000" opacity=".75"/>
<text x="400" y="549" font-family="Arial" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold">"Sorry pal, we're at capacity. Your commit isn't on the list."</text>
<text x="400" y="570" font-family="Arial" font-size="13" fill="#ffe14d" text-anchor="middle">Please try a different model. Or a different career.</text>
</svg>