<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="18" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">4x4 circle grid: radius +4 px per column, colors cycle red, blue, green, yellow</text>

  <!-- Row 1: red, blue, green, yellow -->
  <circle cx="100" cy="50" r="8" fill="red"/>
  <text x="114" y="54" font-family="Arial, sans-serif" font-size="11" fill="#333">r=8</text>
  <circle cx="220" cy="50" r="12" fill="blue"/>
  <text x="238" y="54" font-family="Arial, sans-serif" font-size="11" fill="#333">r=12</text>
  <circle cx="340" cy="50" r="16" fill="green"/>
  <text x="362" y="54" font-family="Arial, sans-serif" font-size="11" fill="#333">r=16</text>
  <circle cx="460" cy="50" r="20" fill="yellow" stroke="#999" stroke-width="1"/>
  <text x="486" y="54" font-family="Arial, sans-serif" font-size="11" fill="#333">r=20</text>

  <!-- Row 2: blue, green, yellow, red -->
  <circle cx="100" cy="120" r="8" fill="blue"/>
  <text x="114" y="124" font-family="Arial, sans-serif" font-size="11" fill="#333">r=8</text>
  <circle cx="220" cy="120" r="12" fill="green"/>
  <text x="238" y="124" font-family="Arial, sans-serif" font-size="11" fill="#333">r=12</text>
  <circle cx="340" cy="120" r="16" fill="yellow" stroke="#999" stroke-width="1"/>
  <text x="362" y="124" font-family="Arial, sans-serif" font-size="11" fill="#333">r=16</text>
  <circle cx="460" cy="120" r="20" fill="red"/>
  <text x="486" y="124" font-family="Arial, sans-serif" font-size="11" fill="#333">r=20</text>

  <!-- Row 3: green, yellow, red, blue -->
  <circle cx="100" cy="190" r="8" fill="green"/>
  <text x="114" y="194" font-family="Arial, sans-serif" font-size="11" fill="#333">r=8</text>
  <circle cx="220" cy="190" r="12" fill="yellow" stroke="#999" stroke-width="1"/>
  <text x="238" y="194" font-family="Arial, sans-serif" font-size="11" fill="#333">r=12</text>
  <circle cx="340" cy="190" r="16" fill="red"/>
  <text x="362" y="194" font-family="Arial, sans-serif" font-size="11" fill="#333">r=16</text>
  <circle cx="460" cy="190" r="20" fill="blue"/>
  <text x="486" y="194" font-family="Arial, sans-serif" font-size="11" fill="#333">r=20</text>

  <!-- Row 4: yellow, red, blue, green -->
  <circle cx="100" cy="260" r="8" fill="yellow" stroke="#999" stroke-width="1"/>
  <text x="114" y="264" font-family="Arial, sans-serif" font-size="11" fill="#333">r=8</text>
  <circle cx="220" cy="260" r="12" fill="red"/>
  <text x="238" y="264" font-family="Arial, sans-serif" font-size="11" fill="#333">r=12</text>
  <circle cx="340" cy="260" r="16" fill="blue"/>
  <text x="362" y="264" font-family="Arial, sans-serif" font-size="11" fill="#333">r=16</text>
  <circle cx="460" cy="260" r="20" fill="green"/>
  <text x="486" y="264" font-family="Arial, sans-serif" font-size="11" fill="#333">r=20</text>

  <!-- Answer -->
  <text x="300" y="315" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#222">The color in row 3, column 4 is blue.</text>

  <!-- Footer -->
  <line x1="20" y1="360" x2="580" y2="360" stroke="#ccc" stroke-width="1"/>
  <text x="300" y="384" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#444">2026-11-06 00:11:43 SGT (UTC+08:00)</text>
</svg>