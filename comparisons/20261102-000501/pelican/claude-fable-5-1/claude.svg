<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Late for the Fish Market, Again — a pelican riding a bicycle</title>
  <desc id="d">A satirical cartoon of a helmeted pelican pedaling a bicycle down a road with a fish sticking out of its pouch, wheels spinning and the pelican bobbing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc45a"/>
      <stop offset="1" stop-color="#4f9a3a"/>
    </linearGradient>
    <clipPath id="sceneClip"><rect x="0" y="70" width="800" height="415"/></clipPath>
    <style>
      .title { font-family: Impact, "Arial Black", Arial, sans-serif; font-size: 38px; font-weight: 900; letter-spacing: 1px; }
      .cap { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-style: italic; fill: #2b2b2b; }
      .foot { font-family: "Courier New", monospace; font-size: 15px; fill: #f4f4f4; }
      .sign { font-family: Arial, sans-serif; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- title band -->
  <rect x="0" y="0" width="800" height="70" fill="#1f3a5f"/>
  <text class="title" x="403" y="50" text-anchor="middle" fill="#0b1a2e">LATE FOR THE FISH MARKET, AGAIN</text>
  <text class="title" x="400" y="47" text-anchor="middle" fill="#ffd84d">LATE FOR THE FISH MARKET, AGAIN</text>

  <!-- scene -->
  <g clip-path="url(#sceneClip)">
    <!-- sun -->
    <g transform="translate(95 135)">
      <g stroke="#ffb703" stroke-width="5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <line x1="0" y1="-38" x2="0" y2="-54"/><line x1="0" y1="38" x2="0" y2="54"/>
        <line x1="-38" y1="0" x2="-54" y2="0"/><line x1="38" y1="0" x2="54" y2="0"/>
        <line x1="-27" y1="-27" x2="-38" y2="-38"/><line x1="27" y1="27" x2="38" y2="38"/>
        <line x1="-27" y1="27" x2="-38" y2="38"/><line x1="27" y1="-27" x2="38" y2="-38"/>
      </g>
      <circle r="30" fill="#ffd166" stroke="#f59e0b" stroke-width="3"/>
    </g>

    <!-- clouds (two sets for seamless loop) -->
    <g fill="#ffffff" opacity="0.95">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="28s" repeatCount="indefinite"/>
      <g>
        <ellipse cx="250" cy="120" rx="48" ry="20"/><ellipse cx="285" cy="108" rx="36" ry="24"/><ellipse cx="220" cy="112" rx="30" ry="18"/>
        <ellipse cx="620" cy="150" rx="55" ry="22"/><ellipse cx="660" cy="138" rx="40" ry="26"/><ellipse cx="585" cy="142" rx="32" ry="18"/>
      </g>
      <g transform="translate(800 0)">
        <ellipse cx="250" cy="120" rx="48" ry="20"/><ellipse cx="285" cy="108" rx="36" ry="24"/><ellipse cx="220" cy="112" rx="30" ry="18"/>
        <ellipse cx="620" cy="150" rx="55" ry="22"/><ellipse cx="660" cy="138" rx="40" ry="26"/><ellipse cx="585" cy="142" rx="32" ry="18"/>
      </g>
    </g>

    <!-- distant hills -->
    <path d="M0 440 Q 120 360 260 430 Q 380 350 520 425 Q 650 340 800 430 L800 460 L0 460 Z" fill="#a9d98f"/>

    <!-- ground and road -->
    <rect x="0" y="455" width="800" height="30" fill="url(#grass)"/>
    <rect x="0" y="445" width="800" height="22" fill="#5a5a5a"/>
    <line x1="0" y1="456" x2="800" y2="456" stroke="#f2d43c" stroke-width="4" stroke-dasharray="40 30">
      <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.5s" repeatCount="indefinite"/>
    </line>

    <!-- road sign -->
    <g>
      <rect x="704" y="340" width="6" height="118" fill="#7a5230"/>
      <rect x="650" y="300" width="130" height="56" rx="6" fill="#1f6f43" stroke="#0f3f26" stroke-width="3"/>
      <text class="sign" x="715" y="323" font-size="16" text-anchor="middle">FISH MARKET</text>
      <text class="sign" x="715" y="346" font-size="15" text-anchor="middle">2 km  ➜  HURRY</text>
    </g>

    <!-- dropped fish on the road behind -->
    <g transform="translate(120 440) rotate(-10)" opacity="0.9">
      <ellipse rx="14" ry="6" fill="#6fa8dc" stroke="#2f5f8f" stroke-width="1.5"/>
      <path d="M12 0 L22 -7 L22 7 Z" fill="#6fa8dc" stroke="#2f5f8f" stroke-width="1.5"/>
      <circle cx="-7" cy="-1.5" r="1.5" fill="#222"/>
    </g>

    <!-- speed lines -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
      <line x1="150" y1="300" x2="205" y2="300">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="130" y1="335" x2="215" y2="335">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="0.6s" repeatCount="indefinite"/>
      </line>
      <line x1="160" y1="370" x2="200" y2="370">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="0.45s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- BICYCLE -->
    <!-- rear wheel -->
    <g transform="translate(280 400)">
      <circle r="55" fill="none" stroke="#222" stroke-width="10"/>
      <circle r="48" fill="none" stroke="#bbb" stroke-width="3"/>
      <g stroke="#999" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="-48" y1="0" x2="48" y2="0"/><line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/><line x1="-34" y1="34" x2="34" y2="-34"/>
        <line x1="-44" y1="-18" x2="44" y2="18"/><line x1="-44" y1="18" x2="44" y2="-18"/>
        <line x1="-18" y1="-44" x2="18" y2="44"/><line x1="-18" y1="44" x2="18" y2="-44"/>
        <circle cx="30" cy="0" r="4" fill="#e63946" stroke="none"/>
      </g>
      <circle r="7" fill="#444"/>
    </g>
    <!-- front wheel -->
    <g transform="translate(520 400)">
      <circle r="55" fill="none" stroke="#222" stroke-width="10"/>
      <circle r="48" fill="none" stroke="#bbb" stroke-width="3"/>
      <g stroke="#999" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="-48" y1="0" x2="48" y2="0"/><line x1="0" y1="-48" x2="0" y2="48"/>
        <line x1="-34" y1="-34" x2="34" y2="34"/><line x1="-34" y1="34" x2="34" y2="-34"/>
        <line x1="-44" y1="-18" x2="44" y2="18"/><line x1="-44" y1="18" x2="44" y2="-18"/>
        <line x1="-18" y1="-44" x2="18" y2="44"/><line x1="-18" y1="44" x2="18" y2="-44"/>
        <circle cx="-30" cy="0" r="4" fill="#e63946" stroke="none"/>
      </g>
      <circle r="7" fill="#444"/>
    </g>
    <!-- frame -->
    <g stroke="#d62828" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="280" y1="400" x2="395" y2="402"/>
      <line x1="280" y1="400" x2="375" y2="318"/>
      <line x1="395" y1="402" x2="375" y2="318"/>
      <line x1="395" y1="402" x2="490" y2="320"/>
      <line x1="375" y1="318" x2="490" y2="320"/>
      <line x1="490" y1="320" x2="520" y2="400"/>
      <line x1="490" y1="320" x2="484" y2="294"/>
    </g>
    <path d="M470 300 Q 466 288 480 290 L 500 288 Q 512 286 508 298" stroke="#222" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="372" cy="311" rx="24" ry="8" fill="#222"/>
    <!-- chainring -->
    <circle cx="395" cy="402" r="20" fill="none" stroke="#333" stroke-width="5"/>
    <line x1="395" y1="402" x2="280" y2="400" stroke="#555" stroke-width="2"/>

    <!-- legs (behind body), following pedals -->
    <g stroke="#f4a261" stroke-width="8" stroke-linecap="round">
      <line x1="378" y1="322" x2="421" y2="402">
        <animate attributeName="x2" values="421;413;395;377;369;377;395;413;421" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="402;420;428;420;402;384;376;384;402" dur="2.4s" repeatCount="indefinite"/>
      </line>
      <line x1="378" y1="322" x2="369" y2="402" stroke="#e08a4a">
        <animate attributeName="x2" values="369;377;395;413;421;413;395;377;369" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="402;384;376;384;402;420;428;420;402" dur="2.4s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- PELICAN (bobbing) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0; 0 -2; 0 0" dur="1.2s" repeatCount="indefinite"/>
      <!-- tail -->
      <path d="M322 268 L292 250 L318 278 L286 280 L322 292 Z" fill="#e9e9e9" stroke="#999" stroke-width="2"/>
      <!-- body -->
      <ellipse cx="372" cy="275" rx="62" ry="46" transform="rotate(-14 372 275)" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="3"/>
      <!-- wing reaching to handlebar -->
      <path d="M392 268 Q 440 262 486 296 Q 470 305 448 300 Q 432 310 412 298 Q 400 300 388 290 Z" fill="#dcdcdc" stroke="#8a8a8a" stroke-width="3" stroke-linejoin="round"/>
      <!-- neck -->
      <path d="M400 252 Q 410 215 436 200" stroke="#fdfdfd" stroke-width="30" fill="none" stroke-linecap="round"/>
      <path d="M400 252 Q 410 215 436 200" stroke="#8a8a8a" stroke-width="34" fill="none" stroke-linecap="round" opacity="0.25"/>
      <path d="M400 252 Q 410 215 436 200" stroke="#fdfdfd" stroke-width="28" fill="none" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="446" cy="186" r="24" fill="#fdfdfd" stroke="#8a8a8a" stroke-width="3"/>
      <!-- pouch (orange) with fish -->
      <path d="M458 194 Q 500 262 578 212 L 458 194 Z" fill="#f77f00" stroke="#9c4a00" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(528 236) rotate(35)">
        <path d="M0 0 L16 -9 L16 9 Z" fill="#6fa8dc" stroke="#2f5f8f" stroke-width="2"/>
      </g>
      <!-- upper beak -->
      <path d="M456 176 L 584 206 L 456 194 Z" fill="#ffd166" stroke="#9c6b00" stroke-width="3" stroke-linejoin="round"/>
      <!-- eye: anxious -->
      <circle cx="455" cy="180" r="6.5" fill="#fff" stroke="#333" stroke-width="2"/>
      <circle cx="457" cy="181" r="3" fill="#111">
        <animate attributeName="cx" values="457;458;457;456;457" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M444 170 L 462 173" stroke="#333" stroke-width="3" stroke-linecap="round"/>
      <!-- tiny helmet -->
      <path d="M420 178 A 28 28 0 0 1 472 170 L 466 176 A 22 22 0 0 0 426 182 Z" fill="#06a77d" stroke="#044f3b" stroke-width="3" stroke-linejoin="round"/>
      <path d="M432 160 L 436 170 M448 155 L 448 166 M462 160 L 460 170" stroke="#044f3b" stroke-width="3" stroke-linecap="round"/>
      <path d="M426 184 Q 430 205 446 210" stroke="#044f3b" stroke-width="2.5" fill="none"/>
      <!-- sweat drops -->
      <g fill="#4cc9f0">
        <path d="M478 158 q 5 8 0 12 q -5 -4 0 -12 z">
          <animate attributeName="opacity" values="0;1;0" dur="1.2s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0; 6 -10" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M420 150 q 5 8 0 12 q -5 -4 0 -12 z">
          <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 0; -5 -10" dur="1.2s" begin="0.6s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- crank + pedals on top -->
    <g transform="translate(395 402)">
      <g stroke="#333" stroke-width="5" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
        <line x1="-26" y1="0" x2="26" y2="0"/>
        <g transform="translate(26 0)"><rect x="-7" y="-3" width="14" height="6" fill="#111" stroke="none"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.4s" repeatCount="indefinite"/></rect></g>
        <g transform="translate(-26 0)"><rect x="-7" y="-3" width="14" height="6" fill="#111" stroke="none"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="2.4s" repeatCount="indefinite"/></rect></g>
      </g>
      <circle r="5" fill="#777"/>
    </g>

    <!-- little honk -->
    <g font-family="Arial, sans-serif" font-weight="900" fill="#d62828" font-size="20">
      <text x="590" y="178" transform="rotate(-8 590 178)">SQUAWK!
        <animate attributeName="opacity" values="1;1;0;0;1" dur="2.4s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- caption band -->
  <rect x="0" y="485" width="800" height="63" fill="#fff8e1" stroke="#e0c97a" stroke-width="2"/>
  <text class="cap" x="400" y="509" text-anchor="middle">“A basket? Please. I come with a built-in one.”</text>
  <text class="cap" x="400" y="534" text-anchor="middle">— Percy the Pelican, declining all cargo upgrades while losing lunch at 30 km/h.</text>

  <!-- footer -->
  <rect x="0" y="548" width="800" height="52" fill="#1f3a5f"/>
  <text class="foot" x="400" y="579" text-anchor="middle">2026-11-02 00:05:01 SGT (UTC+08:00)</text>
</svg>