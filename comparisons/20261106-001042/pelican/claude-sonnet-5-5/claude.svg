<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Pelican on a Bicycle</title>
  <desc id="d">A satirical cartoon of a helmeted pelican pedaling a bicycle with a fish in its bill.</desc>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="545" fill="#bfe6ff"/>
  <rect x="0" y="330" width="800" height="120" fill="#d9f2c9"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="bold" fill="#17324d" stroke="#ffffff" stroke-width="1">PELICAN ON A BIKE!</text>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <ellipse cx="0" cy="110" rx="40" ry="16"/>
      <ellipse cx="-22" cy="116" rx="26" ry="12"/>
      <ellipse cx="24" cy="117" rx="28" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="-80 0; 900 0" dur="26s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="170" rx="34" ry="13"/>
      <ellipse cx="-18" cy="175" rx="22" ry="10"/>
      <ellipse cx="20" cy="176" rx="24" ry="10"/>
      <animateTransform attributeName="transform" type="translate" values="-300 0; 700 0" dur="34s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Road -->
  <rect x="0" y="435" width="800" height="62" fill="#555b63"/>
  <line x1="0" y1="466" x2="800" y2="466" stroke="#ffe27a" stroke-width="5" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- Speech bubble -->
  <path d="M575,136 L535,172 L610,136 Z" fill="#ffffff" stroke="#17324d" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="560" y="80" width="220" height="58" rx="14" fill="#ffffff" stroke="#17324d" stroke-width="2.5"/>
  <rect x="577" y="134" width="30" height="5" fill="#ffffff"/>
  <text x="670" y="106" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" font-weight="bold" fill="#17324d">Watch the bill!</text>
  <text x="670" y="125" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#17324d">It takes a very wide turn.</text>

  <!-- Bike + pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- Shadow -->
    <ellipse cx="410" cy="440" rx="150" ry="8" fill="#000" opacity="0.18"/>

    <!-- Rear wheel -->
    <g transform="translate(300,380)">
      <circle r="55" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="48" fill="none" stroke="#9aa" stroke-width="1.5"/>
      <g>
        <g stroke="#888" stroke-width="2">
          <line x1="-48" y1="0" x2="48" y2="0"/>
          <line x1="0" y1="-48" x2="0" y2="48"/>
          <line x1="-34" y1="-34" x2="34" y2="34"/>
          <line x1="-34" y1="34" x2="34" y2="-34"/>
        </g>
        <circle cx="0" cy="-42" r="5" fill="#e63946"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <circle r="6" fill="#333"/>
    </g>

    <!-- Front wheel -->
    <g transform="translate(520,380)">
      <circle r="55" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="48" fill="none" stroke="#9aa" stroke-width="1.5"/>
      <g>
        <g stroke="#888" stroke-width="2">
          <line x1="-48" y1="0" x2="48" y2="0"/>
          <line x1="0" y1="-48" x2="0" y2="48"/>
          <line x1="-34" y1="-34" x2="34" y2="34"/>
          <line x1="-34" y1="34" x2="34" y2="-34"/>
        </g>
        <circle cx="0" cy="-42" r="5" fill="#e63946"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <circle r="6" fill="#333"/>
    </g>

    <!-- Back leg (offset phase) -->
    <polyline fill="none" stroke="#e8890c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="375,290 421.9,335 375,380">
      <animate attributeName="points" dur="1.2s" repeatCount="indefinite"
        values="375,290 421.9,335 375,380; 375,290 438.8,302.8 400,355; 375,290 434.7,315.7 425,380; 375,290 414.5,341.6 400,405; 375,290 421.9,335 375,380"/>
    </polyline>

    <!-- Frame -->
    <g stroke="#d62839" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="300,380 375,295 490,300"/>
      <line x1="300" y1="380" x2="400" y2="380"/>
      <line x1="375" y1="295" x2="400" y2="380"/>
      <line x1="400" y1="380" x2="490" y2="300"/>
      <line x1="490" y1="300" x2="520" y2="380"/>
    </g>
    <!-- Stem, handlebars, seat -->
    <polyline points="488,298 494,280 514,282" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="352" y="287" width="40" height="8" rx="4" fill="#222"/>

    <!-- Crank + pedals -->
    <g>
      <line x1="375" y1="380" x2="425" y2="380" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <circle cx="425" cy="380" r="6" fill="#222"/>
      <circle cx="375" cy="380" r="6" fill="#222"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 380" to="360 400 380" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <circle cx="400" cy="380" r="9" fill="#444"/>

    <!-- Tail feathers -->
    <path d="M318,262 L285,246 L296,266 L280,274 L304,282 Z" fill="#f1f1f1" stroke="#17324d" stroke-width="3" stroke-linejoin="round"/>

    <!-- Body -->
    <ellipse cx="362" cy="264" rx="58" ry="38" fill="#ffffff" stroke="#17324d" stroke-width="3.5" transform="rotate(-8 362 264)"/>

    <!-- Neck -->
    <path d="M392,252 C412,216 432,238 458,200" fill="none" stroke="#17324d" stroke-width="30" stroke-linecap="round"/>
    <path d="M392,252 C412,216 432,238 458,200" fill="none" stroke="#ffffff" stroke-width="23" stroke-linecap="round"/>

    <!-- Wing reaching the handlebar -->
    <path d="M360,248 C400,262 450,278 508,282" fill="none" stroke="#17324d" stroke-width="22" stroke-linecap="round"/>
    <path d="M360,248 C400,262 450,278 508,282" fill="none" stroke="#dfe8f2" stroke-width="15" stroke-linecap="round"/>

    <!-- Front leg -->
    <polyline fill="none" stroke="#e8890c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="375,290 434.7,315.7 425,380">
      <animate attributeName="points" dur="1.2s" repeatCount="indefinite"
        values="375,290 434.7,315.7 425,380; 375,290 414.5,341.6 400,405; 375,290 421.9,335 375,380; 375,290 438.8,302.8 400,355; 375,290 434.7,315.7 425,380"/>
    </polyline>

    <!-- Head -->
    <circle cx="475" cy="188" r="22" fill="#ffffff" stroke="#17324d" stroke-width="3.5"/>

    <!-- Pouch with fish -->
    <path d="M492,198 L580,198 Q548,262 494,206 Z" fill="#ffc94d" stroke="#17324d" stroke-width="3" stroke-linejoin="round"/>
    <g>
      <ellipse cx="540" cy="217" rx="17" ry="8" fill="#4aa3df" stroke="#17324d" stroke-width="2"/>
      <path d="M555,217 L571,207 L571,227 Z" fill="#4aa3df" stroke="#17324d" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="532" cy="215" r="2" fill="#17324d"/>
      <animateTransform attributeName="transform" type="rotate" values="-6 540 217; 6 540 217; -6 540 217" dur="0.4s" repeatCount="indefinite"/>
    </g>
    <!-- Upper beak -->
    <path d="M490,178 L582,196 L582,200 L490,200 Z" fill="#f5a31a" stroke="#17324d" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="582" cy="196" r="3" fill="#c0392b"/>

    <!-- Helmet (too small) -->
    <path d="M452,184 A24 22 0 0 1 500,180 L496,184 Z" fill="#e63946" stroke="#17324d" stroke-width="3" stroke-linejoin="round"/>
    <line x1="476" y1="163" x2="476" y2="183" stroke="#ffffff" stroke-width="3"/>
    <!-- Eye with goggles -->
    <circle cx="486" cy="191" r="7" fill="#fff" stroke="#17324d" stroke-width="2.5"/>
    <circle cx="488" cy="191" r="3" fill="#17324d"/>
    <path d="M466,200 Q474,206 480,203" fill="none" stroke="#17324d" stroke-width="2"/>
  </g>

  <!-- Caption -->
  <text x="400" y="525" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="16" font-style="italic" fill="#17324d">Pelican on a bicycle: great legs, big bill, zero room for the helmet strap.</text>

  <!-- Footer -->
  <rect x="0" y="540" width="800" height="60" fill="#17324d"/>
  <text x="400" y="577" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="17" fill="#ffffff">2026-11-06 00:10:42 SGT (UTC+08:00)</text>
</svg>