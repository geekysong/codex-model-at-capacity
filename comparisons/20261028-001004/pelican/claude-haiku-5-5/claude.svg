<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#bfe9ff"/>
  <circle cx="90" cy="150" r="30" fill="#fff6b0"/>
  <ellipse cx="200" cy="110" rx="60" ry="22" fill="#ffffff"/>
  <ellipse cx="620" cy="130" rx="75" ry="24" fill="#ffffff"/>
  <rect x="0" y="490" width="800" height="22" fill="#7c8a94"/>
  <line x1="0" y1="501" x2="800" y2="501" stroke="#ffffff" stroke-width="3" stroke-dasharray="30 20"/>

  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#1d3557">PEDAL-LICAN: Beak Hour Express</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#264653">A pelican pedals furiously toward lunch, pouch full of ambition and fish.</text>

  <!-- Rear wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 250 430;360 250 430" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="250" cy="430" r="60" fill="none" stroke="#222" stroke-width="7"/>
    <line x1="190" y1="430" x2="310" y2="430" stroke="#555" stroke-width="3"/>
    <line x1="250" y1="370" x2="250" y2="490" stroke="#555" stroke-width="3"/>
    <line x1="207" y1="387" x2="293" y2="473" stroke="#555" stroke-width="3"/>
    <line x1="293" y1="387" x2="207" y2="473" stroke="#555" stroke-width="3"/>
  </g>

  <!-- Front wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 500 430;360 500 430" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="500" cy="430" r="60" fill="none" stroke="#222" stroke-width="7"/>
    <line x1="440" y1="430" x2="560" y2="430" stroke="#555" stroke-width="3"/>
    <line x1="500" y1="370" x2="500" y2="490" stroke="#555" stroke-width="3"/>
    <line x1="457" y1="387" x2="543" y2="473" stroke="#555" stroke-width="3"/>
    <line x1="543" y1="387" x2="457" y2="473" stroke="#555" stroke-width="3"/>
  </g>

  <!-- Bicycle frame -->
  <path d="M250 430 L340 340 L500 430 M340 340 L380 430 M340 340 L325 300 M250 430 L380 430 M500 430 L480 340 L500 330" fill="none" stroke="#e63946" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M312 300 L345 300" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <path d="M470 330 L500 322" stroke="#222" stroke-width="8" stroke-linecap="round"/>

  <!-- Pedal crank (rotating) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 380 430;360 380 430" dur="1.5s" repeatCount="indefinite"/>
    <line x1="352" y1="430" x2="408" y2="430" stroke="#333" stroke-width="6"/>
    <circle cx="380" cy="430" r="8" fill="#333"/>
    <rect x="344" y="426" width="16" height="8" fill="#333"/>
    <rect x="400" y="426" width="16" height="8" fill="#333"/>
  </g>

  <!-- Pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="0.75s" repeatCount="indefinite"/>
    <!-- Legs -->
    <path d="M355 330 L372 380 L380 425" fill="none" stroke="#f4a261" stroke-width="7" stroke-linecap="round"/>
    <path d="M372 380 L390 428" fill="none" stroke="#f4a261" stroke-width="7" stroke-linecap="round"/>
    <!-- Body -->
    <ellipse cx="360" cy="290" rx="72" ry="44" fill="#f1f1f1" stroke="#222" stroke-width="4"/>
    <!-- Tail -->
    <path d="M292 280 L252 262 L270 300 Z" fill="#dcdcdc" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
    <!-- Wing -->
    <path d="M330 270 Q300 230 350 245 Q380 255 360 285 Z" fill="#cfcfcf" stroke="#222" stroke-width="3"/>
    <!-- Neck -->
    <path d="M405 265 Q430 230 425 200" fill="none" stroke="#f1f1f1" stroke-width="34" stroke-linecap="round"/>
    <path d="M405 265 Q430 230 425 200" fill="none" stroke="#222" stroke-width="40" stroke-linecap="round" opacity="0"/>
    <!-- Head -->
    <circle cx="430" cy="186" r="24" fill="#f1f1f1" stroke="#222" stroke-width="4"/>
    <!-- Bill and pouch -->
    <path d="M446 178 L520 196 Q512 210 496 206 L450 196 Z" fill="#ffd166" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
    <path d="M452 194 Q480 230 500 204 Q498 200 496 206 Q478 218 456 196 Z" fill="#f4a261" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
    <!-- Eye -->
    <circle cx="438" cy="180" r="5" fill="#222"/>
    <circle cx="439" cy="178" r="1.5" fill="#fff"/>
    <!-- Eyebrow for attitude -->
    <path d="M430 166 L448 170" stroke="#222" stroke-width="3" stroke-linecap="round"/>
    <!-- Fish in pouch -->
    <path d="M470 210 Q480 200 492 210 Q480 220 470 210 Z" fill="#8ecae6" stroke="#222" stroke-width="2"/>
    <!-- Motion lines -->
    <path d="M220 280 L260 280 M210 300 L250 300 M225 320 L255 320" stroke="#1d3557" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Footer -->
  <rect x="60" y="530" width="680" height="50" rx="10" fill="#1d3557"/>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">2026-10-28 00:10:04 SGT (UTC+08:00)</text>
</svg>