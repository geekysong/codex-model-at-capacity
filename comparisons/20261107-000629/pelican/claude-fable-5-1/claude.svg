<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Big Bill on Wheels: a pelican riding a bicycle</title>
  <desc id="d">A satirical cartoon of a pelican wearing a helmet, pedaling a bicycle with fish spilling from its pouch, past a NO FLY ZONE sign.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <style>
      .title { font-family: Impact, "Arial Black", Arial, sans-serif; font-size: 40px; fill: #1b2a41; letter-spacing: 1px; }
      .caption { font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-style: italic; fill: #222; }
      .footer { font-family: "Courier New", monospace; font-size: 15px; fill: #f4f4f4; }
      .sign { font-family: Arial, sans-serif; font-weight: bold; font-size: 11px; fill: #fff; }
      .bubble { font-family: "Comic Sans MS", Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1b2a41; }
    </style>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="478" fill="url(#sky)"/>

  <!-- Sun with slowly spinning rays -->
  <g transform="translate(700 90)">
    <g stroke="#ffb703" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <line x1="0" y1="-38" x2="0" y2="-52"/>
      <line x1="0" y1="38" x2="0" y2="52"/>
      <line x1="-38" y1="0" x2="-52" y2="0"/>
      <line x1="38" y1="0" x2="52" y2="0"/>
      <line x1="27" y1="-27" x2="37" y2="-37"/>
      <line x1="-27" y1="27" x2="-37" y2="37"/>
      <line x1="27" y1="27" x2="37" y2="37"/>
      <line x1="-27" y1="-27" x2="-37" y2="-37"/>
    </g>
    <circle r="30" fill="#ffd166" stroke="#ffb703" stroke-width="3"/>
  </g>

  <!-- Clouds drifting -->
  <g fill="#ffffff" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0; -120 0; 0 0" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(140 120)">
      <ellipse cx="0" cy="0" rx="40" ry="18"/>
      <ellipse cx="30" cy="-10" rx="30" ry="20"/>
      <ellipse cx="60" cy="2" rx="35" ry="16"/>
    </g>
    <g transform="translate(520 100)">
      <ellipse cx="0" cy="0" rx="32" ry="14"/>
      <ellipse cx="26" cy="-9" rx="26" ry="17"/>
      <ellipse cx="50" cy="1" rx="28" ry="13"/>
    </g>
  </g>

  <!-- Title -->
  <text class="title" x="400" y="58" text-anchor="middle">BIG BILL ON WHEELS</text>

  <!-- Distant hills -->
  <path d="M0 430 Q120 360 240 420 T480 415 T720 425 T800 418 L800 478 L0 478 Z" fill="#9bd38f"/>
  <path d="M0 450 Q150 400 300 445 T600 440 T800 448 L800 478 L0 478 Z" fill="#7fc06f"/>

  <!-- NO FLY ZONE sign -->
  <g transform="translate(690 330)">
    <rect x="-3" y="0" width="6" height="150" fill="#8d6e63"/>
    <rect x="-52" y="-48" width="104" height="52" rx="6" fill="#d62828" stroke="#fff" stroke-width="3"/>
    <text class="sign" x="0" y="-28" text-anchor="middle">NO FLY ZONE</text>
    <text class="sign" x="0" y="-10" text-anchor="middle">(BIKES TOTALLY OK)</text>
  </g>

  <!-- Speed lines -->
  <g stroke="#1b2a41" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="0.4s" repeatCount="indefinite"/>
    <line x1="100" y1="300" x2="160" y2="300"/>
    <line x1="80" y1="330" x2="150" y2="330"/>
    <line x1="110" y1="360" x2="165" y2="360"/>
  </g>

  <!-- Flying fish escaping the pouch -->
  <g fill="#4cc9f0" stroke="#1b2a41" stroke-width="1.5">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 25 -40; 50 -20; 0 0" dur="1.6s" repeatCount="indefinite"/>
      <path d="M520 265 l14 -6 l-4 6 l4 6 z"/>
      <ellipse cx="510" cy="265" rx="12" ry="5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -15 -30; 10 -10; 0 0" dur="1.3s" begin="0.5s" repeatCount="indefinite"/>
      <path d="M545 275 l14 -6 l-4 6 l4 6 z"/>
      <ellipse cx="535" cy="275" rx="12" ry="5"/>
    </g>
  </g>

  <!-- Road -->
  <rect x="0" y="478" width="800" height="42" fill="#4a4a4a"/>
  <line x1="0" y1="499" x2="800" y2="499" stroke="#ffd166" stroke-width="4" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="-70" dur="0.7s" repeatCount="indefinite"/>
  </line>

  <!-- BICYCLE -->
  <g id="bike">
    <!-- Wheels -->
    <g transform="translate(260 420)">
      <circle r="60" fill="none" stroke="#1b2a41" stroke-width="7"/>
      <circle r="52" fill="none" stroke="#9aa0a6" stroke-width="2"/>
      <g stroke="#6c757d" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="0" y1="-52" x2="0" y2="52"/>
        <line x1="-37" y1="-37" x2="37" y2="37"/>
        <line x1="-37" y1="37" x2="37" y2="-37"/>
        <line x1="-48" y1="-20" x2="48" y2="20"/>
        <line x1="-48" y1="20" x2="48" y2="-20"/>
        <line x1="-20" y1="-48" x2="20" y2="48"/>
        <line x1="20" y1="-48" x2="-20" y2="48"/>
        <circle r="7" fill="#1b2a41"/>
        <circle cx="0" cy="-44" r="3" fill="#d62828" stroke="none"/>
      </g>
    </g>
    <g transform="translate(520 420)">
      <circle r="60" fill="none" stroke="#1b2a41" stroke-width="7"/>
      <circle r="52" fill="none" stroke="#9aa0a6" stroke-width="2"/>
      <g stroke="#6c757d" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="-52" y1="0" x2="52" y2="0"/>
        <line x1="0" y1="-52" x2="0" y2="52"/>
        <line x1="-37" y1="-37" x2="37" y2="37"/>
        <line x1="-37" y1="37" x2="37" y2="-37"/>
        <line x1="-48" y1="-20" x2="48" y2="20"/>
        <line x1="-48" y1="20" x2="48" y2="-20"/>
        <line x1="-20" y1="-48" x2="20" y2="48"/>
        <line x1="20" y1="-48" x2="-20" y2="48"/>
        <circle r="7" fill="#1b2a41"/>
        <circle cx="0" cy="-44" r="3" fill="#d62828" stroke="none"/>
      </g>
    </g>

    <!-- Far leg (behind frame) -->
    <polyline fill="none" stroke="#e07a1f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" points="345,330 370,362 365,420">
      <animate attributeName="points" dur="1.2s" repeatCount="indefinite"
        values="345,330 370,362 365,420; 345,330 382,350 390,395; 345,330 395,362 415,420; 345,330 382,374 390,445; 345,330 370,362 365,420"/>
    </polyline>

    <!-- Frame -->
    <g stroke="#d62828" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="260" y1="420" x2="390" y2="420"/>
      <line x1="390" y1="420" x2="330" y2="320"/>
      <line x1="260" y1="420" x2="330" y2="320"/>
      <line x1="330" y1="320" x2="480" y2="330"/>
      <line x1="390" y1="420" x2="480" y2="330"/>
      <line x1="480" y1="330" x2="520" y2="420"/>
    </g>
    <!-- Handlebar -->
    <g stroke="#1b2a41" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="480" y1="330" x2="472" y2="300"/>
      <path d="M455 304 Q472 294 492 306"/>
    </g>
    <!-- Seat -->
    <ellipse cx="330" cy="316" rx="20" ry="7" fill="#1b2a41"/>
    <!-- Chain -->
    <line x1="260" y1="412" x2="390" y2="402" stroke="#333" stroke-width="2"/>
    <line x1="260" y1="428" x2="390" y2="438" stroke="#333" stroke-width="2"/>
    <circle cx="260" cy="420" r="8" fill="none" stroke="#333" stroke-width="3"/>
    <!-- Crank and pedals -->
    <g transform="translate(390 420)">
      <circle r="18" fill="none" stroke="#333" stroke-width="4"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="-25" y1="0" x2="25" y2="0" stroke="#1b2a41" stroke-width="5" stroke-linecap="round"/>
        <rect x="19" y="-4" width="14" height="8" rx="2" fill="#333"/>
        <rect x="-33" y="-4" width="14" height="8" rx="2" fill="#333"/>
      </g>
      <circle r="5" fill="#1b2a41"/>
    </g>
  </g>

  <!-- PELICAN (bobbing) -->
  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.6s" repeatCount="indefinite"/>
    <!-- Tail feathers -->
    <path d="M300 300 l-45 -15 l25 20 l-30 10 l48 2 z" fill="#f2f2f2" stroke="#1b2a41" stroke-width="2" stroke-linejoin="round"/>
    <!-- Body -->
    <ellipse cx="345" cy="300" rx="52" ry="34" fill="#fafafa" stroke="#1b2a41" stroke-width="3" transform="rotate(-10 345 300)"/>
    <!-- Belly shading -->
    <ellipse cx="350" cy="312" rx="34" ry="16" fill="#e9e9e9" transform="rotate(-10 350 312)"/>
    <!-- Neck -->
    <path d="M375 282 C 400 270, 410 255, 430 235" fill="none" stroke="#1b2a41" stroke-width="3"/>
    <path d="M378 296 C 405 285, 420 268, 440 248" fill="none" stroke="#1b2a41" stroke-width="3"/>
    <path d="M375 282 C 400 270, 410 255, 430 235 L 440 248 C 420 268, 405 285, 378 296 Z" fill="#fafafa"/>
    <!-- Wing reaching the handlebar -->
    <path d="M345 285 Q 400 275 465 298 Q 440 310 400 300 Q 370 300 345 285 Z" fill="#dcdcdc" stroke="#1b2a41" stroke-width="3" stroke-linejoin="round"/>
    <!-- Head -->
    <circle cx="440" cy="232" r="22" fill="#fafafa" stroke="#1b2a41" stroke-width="3"/>
    <!-- Bill with pouch -->
    <path d="M455 226 L 548 240 L 540 248 L 455 240 Z" fill="#ffb703" stroke="#1b2a41" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M455 240 L 540 248 Q 520 300 470 285 Q 452 270 455 240 Z" fill="#ffd166" stroke="#1b2a41" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Fish tails poking out of pouch -->
    <path d="M498 268 l10 -14 l6 12 z" fill="#4cc9f0" stroke="#1b2a41" stroke-width="1.5"/>
    <path d="M480 272 l12 -10 l2 13 z" fill="#4cc9f0" stroke="#1b2a41" stroke-width="1.5"/>
    <!-- Eye (wide, determined) -->
    <circle cx="448" cy="226" r="7" fill="#fff" stroke="#1b2a41" stroke-width="2"/>
    <circle cx="450" cy="227" r="3" fill="#1b2a41"/>
    <path d="M438 214 L 456 218" stroke="#1b2a41" stroke-width="3" stroke-linecap="round"/>
    <!-- Helmet -->
    <path d="M416 226 A 25 25 0 0 1 465 224 L 462 230 L 419 232 Z" fill="#06d6a0" stroke="#1b2a41" stroke-width="3" stroke-linejoin="round"/>
    <line x1="430" y1="210" x2="436" y2="226" stroke="#1b2a41" stroke-width="2"/>
    <line x1="448" y1="206" x2="450" y2="224" stroke="#1b2a41" stroke-width="2"/>
    <path d="M422 232 Q 428 262 448 254" fill="none" stroke="#1b2a41" stroke-width="2"/>
    <!-- Sweat drops -->
    <g fill="#4cc9f0" stroke="#1b2a41" stroke-width="1.5">
      <path d="M410 215 q -5 8 0 12 q 6 -4 0 -12 z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -8 14; 0 0" dur="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M470 205 q -5 8 0 12 q 6 -4 0 -12 z">
        <animateTransform attributeName="transform" type="translate" values="0 0; 6 -12; 0 0" dur="1.1s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Near leg (in front of frame) -->
  <polyline fill="none" stroke="#f77f00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" points="345,330 395,362 415,420">
    <animate attributeName="points" dur="1.2s" repeatCount="indefinite"
      values="345,330 395,362 415,420; 345,330 382,374 390,445; 345,330 370,362 365,420; 345,330 382,350 390,395; 345,330 395,362 415,420"/>
  </polyline>

  <!-- Speech bubble -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M250 150 h190 a12 12 0 0 1 12 12 v48 a12 12 0 0 1 -12 12 h-110 l-22 18 l4 -18 h-62 a12 12 0 0 1 -12 -12 v-48 a12 12 0 0 1 12 -12 z" fill="#fff" stroke="#1b2a41" stroke-width="3"/>
    <text class="bubble" x="345" y="177" text-anchor="middle">Flying is for birds with</text>
    <text class="bubble" x="345" y="197" text-anchor="middle">NO carbon footprint goals!</text>
    <text class="bubble" x="345" y="215" text-anchor="middle" font-size="11">(also my wings are tired)</text>
  </g>

  <!-- Caption band -->
  <rect x="0" y="520" width="800" height="34" fill="#fff8e1" stroke="#1b2a41" stroke-width="2"/>
  <text class="caption" x="400" y="542" text-anchor="middle">After the airline cut his baggage allowance, Gerald found that a pouch beats any overhead bin — fish delivery in 30 minutes or it's free.</text>

  <!-- Footer with timestamp -->
  <rect x="0" y="554" width="800" height="46" fill="#1b2a41"/>
  <text class="footer" x="400" y="582" text-anchor="middle">2026-11-07 00:06:29 SGT (UTC+08:00)</text>
</svg>