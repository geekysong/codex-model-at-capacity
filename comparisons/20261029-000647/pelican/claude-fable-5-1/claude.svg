<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Pelican on Wheels</title>
  <desc id="d">A satirical cartoon of a helmeted pelican pedaling a bicycle along a coastal road while a seagull heckles from a sign.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#e8f6ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d8fd6"/>
      <stop offset="1" stop-color="#5fb6ea"/>
    </linearGradient>
    <path id="pedalPath" d="M443,420 A28,28 0 1,1 387,420 A28,28 0 1,1 443,420"/>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="95" r="38" fill="#ffd93b" stroke="#f4b400" stroke-width="4"/>
  <g stroke="#f4b400" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="700" y1="40" x2="700" y2="28"/><line x1="700" y1="150" x2="700" y2="162"/>
    <line x1="645" y1="95" x2="633" y2="95"/><line x1="755" y1="95" x2="767" y2="95"/>
    <line x1="661" y1="56" x2="652" y2="47"/><line x1="739" y1="134" x2="748" y2="143"/>
    <line x1="661" y1="134" x2="652" y2="143"/><line x1="739" y1="56" x2="748" y2="47"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="150" rx="46" ry="18"/><ellipse cx="180" cy="138" rx="30" ry="20"/><ellipse cx="120" cy="142" rx="26" ry="16"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="560" cy="170" rx="40" ry="15"/><ellipse cx="585" cy="160" rx="26" ry="17"/><ellipse cx="535" cy="162" rx="22" ry="13"/>
      <animateTransform attributeName="transform" type="translate" values="40 0;-50 0" dur="24s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="0" y="300" width="800" height="135" fill="url(#sea)"/>
  <path d="M0,300 Q40,292 80,300 T160,300 T240,300 T320,300 T400,300 T480,300 T560,300 T640,300 T720,300 T800,300 V310 H0 Z" fill="#ffffff" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0 0;-80 0" dur="4s" repeatCount="indefinite"/>
  </path>
  <rect x="0" y="430" width="800" height="70" fill="#f2d79b"/>
  <rect x="0" y="468" width="800" height="24" fill="#4a4a52"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#ffd93b" stroke-width="3" stroke-dasharray="30 24">
    <animate attributeName="stroke-dashoffset" from="0" to="-54" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- Title -->
  <text x="400" y="56" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="40" fill="#1e2a38" stroke="#ffffff" stroke-width="1.5" paint-order="stroke" letter-spacing="2">PELICAN ON WHEELS</text>
  <text x="400" y="84" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#2b3a4a">A satirical dispatch from the coastal bike lane</text>

  <!-- Heckling seagull on sign -->
  <g>
    <rect x="117" y="395" width="6" height="75" fill="#8b5a2b"/>
    <rect x="80" y="370" width="80" height="32" rx="4" fill="#2e8b57" stroke="#1e5f3a" stroke-width="2"/>
    <text x="120" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff">BIKE LANE</text>
    <g>
      <ellipse cx="122" cy="356" rx="16" ry="11" fill="#ffffff" stroke="#8a97a6" stroke-width="2"/>
      <circle cx="136" cy="346" r="8" fill="#ffffff" stroke="#8a97a6" stroke-width="2"/>
      <polygon points="143,345 156,348 143,351" fill="#f4a020"/>
      <circle cx="138" cy="344" r="1.8" fill="#000"/>
      <line x1="118" y1="367" x2="118" y2="370" stroke="#f4a020" stroke-width="2"/>
      <line x1="126" y1="367" x2="126" y2="370" stroke="#f4a020" stroke-width="2"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="0.7s" repeatCount="indefinite"/>
    </g>
    <path d="M160,322 h78 a6,6 0 0 1 6,6 v18 a6,6 0 0 1 -6,6 h-62 l-12,10 l2,-10 h-6 a6,6 0 0 1 -6,-6 v-18 a6,6 0 0 1 6,-6 z" fill="#ffffff" stroke="#1e2a38" stroke-width="2"/>
    <text x="202" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#1e2a38">SHOW-OFF.</text>
  </g>

  <!-- Speed lines -->
  <g stroke="#1e2a38" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <line x1="170" y1="395" x2="225" y2="395"/>
    <line x1="150" y1="415" x2="215" y2="415"/>
    <line x1="175" y1="435" x2="225" y2="435"/>
    <animateTransform attributeName="transform" type="translate" values="20 0;-20 0" dur="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="0.4s" repeatCount="indefinite"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#d6336c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="415" y1="420" x2="352" y2="332"/>
    <line x1="415" y1="420" x2="505" y2="335"/>
    <line x1="355" y1="335" x2="500" y2="335"/>
    <line x1="290" y1="420" x2="415" y2="420"/>
    <line x1="290" y1="420" x2="355" y2="335"/>
    <line x1="505" y1="335" x2="540" y2="420"/>
    <line x1="505" y1="335" x2="508" y2="320"/>
  </g>
  <line x1="508" y1="320" x2="532" y2="312" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <rect x="526" y="306" width="14" height="10" rx="3" fill="#1e2a38" transform="rotate(-18 533 311)"/>
  <ellipse cx="350" cy="328" rx="20" ry="7" fill="#1e2a38"/>
  <line x1="350" y1="328" x2="352" y2="340" stroke="#333" stroke-width="5"/>
  <!-- chain -->
  <line x1="290" y1="414" x2="415" y2="406" stroke="#555" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="290" y1="426" x2="415" y2="434" stroke="#555" stroke-width="2.5" stroke-dasharray="4 3">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- Rear wheel -->
  <g>
    <circle cx="290" cy="420" r="55" fill="none" stroke="#222" stroke-width="9"/>
    <circle cx="290" cy="420" r="50" fill="none" stroke="#bbb" stroke-width="2"/>
    <g stroke="#999" stroke-width="2">
      <line x1="240" y1="420" x2="340" y2="420"/><line x1="290" y1="370" x2="290" y2="470"/>
      <line x1="255" y1="385" x2="325" y2="455"/><line x1="325" y1="385" x2="255" y2="455"/>
      <line x1="247" y1="395" x2="333" y2="445"/><line x1="333" y1="395" x2="247" y2="445"/>
      <line x1="265" y1="377" x2="315" y2="463"/><line x1="315" y1="377" x2="265" y2="463"/>
    </g>
    <circle cx="290" cy="420" r="7" fill="#444"/>
    <animateTransform attributeName="transform" type="rotate" from="0 290 420" to="360 290 420" dur="1s" repeatCount="indefinite"/>
  </g>
  <!-- Front wheel -->
  <g>
    <circle cx="540" cy="420" r="55" fill="none" stroke="#222" stroke-width="9"/>
    <circle cx="540" cy="420" r="50" fill="none" stroke="#bbb" stroke-width="2"/>
    <g stroke="#999" stroke-width="2">
      <line x1="490" y1="420" x2="590" y2="420"/><line x1="540" y1="370" x2="540" y2="470"/>
      <line x1="505" y1="385" x2="575" y2="455"/><line x1="575" y1="385" x2="505" y2="455"/>
      <line x1="497" y1="395" x2="583" y2="445"/><line x1="583" y1="395" x2="497" y2="445"/>
      <line x1="515" y1="377" x2="565" y2="463"/><line x1="565" y1="377" x2="515" y2="463"/>
    </g>
    <circle cx="540" cy="420" r="7" fill="#444"/>
    <animateTransform attributeName="transform" type="rotate" from="0 540 420" to="360 540 420" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Back leg (behind crank) -->
  <line x1="368" y1="335" x2="387" y2="420" stroke="#e08a12" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="387;395.2;415;434.8;443;434.8;415;395.2;387" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="420;400.2;392;400.2;420;439.8;448;439.8;420" dur="1s" repeatCount="indefinite"/>
  </line>
  <g fill="#e08a12">
    <path d="M-10,4 L10,4 L6,-2 L0,-4 L-6,-2 Z"/>
    <animateMotion dur="1s" repeatCount="indefinite" begin="-0.5s"><mpath href="#pedalPath"/></animateMotion>
  </g>

  <!-- Crank and chainring -->
  <g>
    <circle cx="415" cy="420" r="15" fill="none" stroke="#333" stroke-width="5"/>
    <line x1="387" y1="420" x2="443" y2="420" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <rect x="437" y="416" width="14" height="8" rx="2" fill="#555"/>
    <rect x="379" y="416" width="14" height="8" rx="2" fill="#555"/>
    <animateTransform attributeName="transform" type="rotate" from="0 415 420" to="360 415 420" dur="1s" repeatCount="indefinite"/>
  </g>
  <circle cx="415" cy="420" r="4" fill="#111"/>

  <!-- Pelican body (bobbing) -->
  <g>
    <polygon points="328,290 292,266 296,304 332,308" fill="#ffffff" stroke="#8a97a6" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="385" cy="295" rx="62" ry="42" fill="#ffffff" stroke="#8a97a6" stroke-width="3" transform="rotate(-10 385 295)"/>
    <!-- neck -->
    <path d="M425,278 Q452,262 460,220" fill="none" stroke="#8a97a6" stroke-width="26" stroke-linecap="round"/>
    <path d="M425,278 Q452,262 460,220" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <!-- wing reaching handlebar -->
    <path d="M405,280 Q470,292 528,316" fill="none" stroke="#8a97a6" stroke-width="18" stroke-linecap="round"/>
    <path d="M405,280 Q470,292 528,316" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <path d="M380,300 Q360,330 395,330 Q372,322 388,308 Z" fill="#dfe6ee" stroke="#8a97a6" stroke-width="2"/>
    <!-- head -->
    <circle cx="470" cy="202" r="23" fill="#ffffff" stroke="#8a97a6" stroke-width="3"/>
    <!-- pouch and beak -->
    <path d="M490,207 L600,212 Q565,262 512,242 Q486,232 490,207 Z" fill="#f7b24a" stroke="#c9771a" stroke-width="3" stroke-linejoin="round">
      <animate attributeName="d" values="M490,207 L600,212 Q565,262 512,242 Q486,232 490,207 Z;M490,207 L600,212 Q565,268 512,246 Q486,234 490,207 Z;M490,207 L600,212 Q565,262 512,242 Q486,232 490,207 Z" dur="0.5s" repeatCount="indefinite"/>
    </path>
    <polygon points="600,212 620,198 618,226" fill="#5b8fb9" stroke="#2f5f80" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="486,192 610,208 490,207" fill="#f4a020" stroke="#c9771a" stroke-width="3" stroke-linejoin="round"/>
    <!-- eye -->
    <circle cx="479" cy="196" r="7" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <circle cx="481" cy="197" r="3.2" fill="#111"/>
    <line x1="468" y1="184" x2="488" y2="188" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M444,197 A27,27 0 0 1 497,193 L497,200 L445,203 Z" fill="#e53935" stroke="#9b1c1c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M452,183 L488,178" stroke="#ff8a80" stroke-width="3" stroke-linecap="round"/>
    <path d="M450,202 Q460,224 472,226" fill="none" stroke="#333" stroke-width="2"/>
    <!-- sweat drops -->
    <g fill="#5fb6ea">
      <ellipse cx="438" cy="182" rx="3" ry="5"/>
      <ellipse cx="430" cy="196" rx="2.5" ry="4"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.5s" repeatCount="indefinite"/>
  </g>

  <!-- Front leg (in front of crank) -->
  <line x1="378" y1="338" x2="443" y2="420" stroke="#f4a020" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="443;434.8;415;395.2;387;395.2;415;434.8;443" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="420;439.8;448;439.8;420;400.2;392;400.2;420" dur="1s" repeatCount="indefinite"/>
  </line>
  <g fill="#f4a020" stroke="#c9771a" stroke-width="1.5">
    <path d="M-10,4 L10,4 L6,-2 L0,-4 L-6,-2 Z"/>
    <animateMotion dur="1s" repeatCount="indefinite"><mpath href="#pedalPath"/></animateMotion>
  </g>

  <!-- Caption -->
  <rect x="40" y="496" width="720" height="38" rx="8" fill="#ffffff" opacity="0.9" stroke="#1e2a38" stroke-width="1.5"/>
  <text x="400" y="521" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1e2a38">Percival quit flying: “Cycling is zero-emission, and the pouch doubles as a lunchbox.”</text>

  <!-- Footer -->
  <rect x="0" y="540" width="800" height="60" fill="#1e2a38"/>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff" letter-spacing="0.5">2026-10-29 00:06:47 SGT (UTC+08:00)</text>
</svg>