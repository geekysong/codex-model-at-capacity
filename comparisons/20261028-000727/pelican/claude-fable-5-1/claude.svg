<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">The Pelican Express</title>
  <desc id="d">A satirical cartoon of a pelican in a helmet riding a bicycle, delivering a fish it has clearly already started eating.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <clipPath id="scene"><rect x="0" y="70" width="800" height="475"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="#fff"/>
  <rect x="0" y="70" width="800" height="475" fill="url(#sky)"/>

  <!-- title -->
  <text x="400" y="50" text-anchor="middle" font-family="Impact, 'Arial Black', Arial, sans-serif" font-size="40" font-weight="900" fill="#1a1a1a" letter-spacing="2">THE PELICAN EXPRESS</text>

  <g clip-path="url(#scene)">
    <!-- sun -->
    <circle cx="700" cy="140" r="38" fill="#ffd93b" stroke="#f5b800" stroke-width="4"/>
    <!-- clouds drifting -->
    <g fill="#fff" opacity="0.95">
      <g>
        <ellipse cx="150" cy="140" rx="55" ry="22"/><ellipse cx="185" cy="125" rx="35" ry="25"/><ellipse cx="115" cy="130" rx="30" ry="20"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-900 0" dur="40s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="950" cy="190" rx="60" ry="22"/><ellipse cx="985" cy="175" rx="35" ry="25"/><ellipse cx="915" cy="180" rx="30" ry="20"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-900 0" dur="40s" repeatCount="indefinite"/>
      </g>
      <g>
        <ellipse cx="520" cy="110" rx="45" ry="18"/><ellipse cx="550" cy="98" rx="28" ry="20"/>
        <animateTransform attributeName="transform" type="translate" values="300 0;-600 0" dur="40s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- distant hills -->
    <path d="M0 470 Q120 380 260 450 Q380 390 520 455 Q640 400 800 460 L800 500 L0 500 Z" fill="#9ed36a"/>

    <!-- grass -->
    <rect x="0" y="490" width="800" height="55" fill="#6fbf3f"/>
    <!-- road -->
    <rect x="0" y="455" width="800" height="36" fill="#555"/>
    <line x1="0" y1="473" x2="800" y2="473" stroke="#ffd93b" stroke-width="4" stroke-dasharray="30 24">
      <animate attributeName="stroke-dashoffset" values="0;-54" dur="0.6s" repeatCount="indefinite"/>
    </line>

    <!-- sign post -->
    <g transform="translate(110,0)">
      <rect x="-3" y="330" width="6" height="130" fill="#8a5a2b"/>
      <rect x="-70" y="300" width="140" height="46" rx="6" fill="#fff" stroke="#222" stroke-width="3"/>
      <text x="0" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#222">BIKE LANE</text>
      <text x="0" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c0392b">(pelicans: at own risk)</text>
    </g>

    <!-- speed lines -->
    <g stroke="#555" stroke-width="3" stroke-linecap="round" opacity="0.6">
      <line x1="200" y1="380" x2="250" y2="380"/>
      <line x1="185" y1="405" x2="245" y2="405"/>
      <line x1="210" y1="430" x2="255" y2="430"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="0.4s" repeatCount="indefinite"/>
    </g>

    <!-- ===== BICYCLE ===== -->
    <g id="bike">
      <!-- rear wheel -->
      <g>
        <circle cx="300" cy="400" r="60" fill="none" stroke="#222" stroke-width="9"/>
        <circle cx="300" cy="400" r="52" fill="none" stroke="#999" stroke-width="2"/>
        <g stroke="#777" stroke-width="2">
          <line x1="300" y1="348" x2="300" y2="452"/><line x1="248" y1="400" x2="352" y2="400"/>
          <line x1="263" y1="363" x2="337" y2="437"/><line x1="337" y1="363" x2="263" y2="437"/>
          <line x1="280" y1="352" x2="320" y2="448"/><line x1="320" y1="352" x2="280" y2="448"/>
          <line x1="252" y1="380" x2="348" y2="420"/><line x1="252" y1="420" x2="348" y2="380"/>
          <animateTransform attributeName="transform" type="rotate" from="0 300 400" to="360 300 400" dur="1.2s" repeatCount="indefinite"/>
        </g>
        <circle cx="300" cy="400" r="7" fill="#333"/>
      </g>
      <!-- front wheel -->
      <g>
        <circle cx="520" cy="400" r="60" fill="none" stroke="#222" stroke-width="9"/>
        <circle cx="520" cy="400" r="52" fill="none" stroke="#999" stroke-width="2"/>
        <g stroke="#777" stroke-width="2">
          <line x1="520" y1="348" x2="520" y2="452"/><line x1="468" y1="400" x2="572" y2="400"/>
          <line x1="483" y1="363" x2="557" y2="437"/><line x1="557" y1="363" x2="483" y2="437"/>
          <line x1="500" y1="352" x2="540" y2="448"/><line x1="540" y1="352" x2="500" y2="448"/>
          <line x1="472" y1="380" x2="568" y2="420"/><line x1="472" y1="420" x2="568" y2="380"/>
          <animateTransform attributeName="transform" type="rotate" from="0 520 400" to="360 520 400" dur="1.2s" repeatCount="indefinite"/>
        </g>
        <circle cx="520" cy="400" r="7" fill="#333"/>
      </g>
      <!-- frame -->
      <g stroke="#d7263d" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="400" y1="340" x2="410" y2="400"/>
        <line x1="400" y1="340" x2="500" y2="322"/>
        <line x1="500" y1="322" x2="410" y2="400"/>
        <line x1="410" y1="400" x2="300" y2="400"/>
        <line x1="400" y1="340" x2="300" y2="400"/>
        <line x1="500" y1="322" x2="520" y2="400"/>
        <line x1="500" y1="322" x2="498" y2="300"/>
      </g>
      <!-- handlebar -->
      <path d="M478 300 Q498 290 518 300" stroke="#222" stroke-width="6" fill="none" stroke-linecap="round"/>
      <!-- chain -->
      <line x1="300" y1="394" x2="410" y2="386" stroke="#333" stroke-width="2"/>
      <line x1="300" y1="406" x2="410" y2="414" stroke="#333" stroke-width="2"/>
      <circle cx="300" cy="400" r="6" fill="none" stroke="#333" stroke-width="2"/>
      <circle cx="410" cy="400" r="14" fill="none" stroke="#333" stroke-width="4"/>
      <!-- seat -->
      <ellipse cx="398" cy="335" rx="20" ry="6" fill="#222"/>
      <!-- basket with a sushi box -->
      <g>
        <path d="M530 300 L560 300 L556 330 L534 330 Z" fill="#c9a063" stroke="#8a5a2b" stroke-width="2"/>
        <rect x="536" y="286" width="20" height="14" rx="2" fill="#fff" stroke="#222" stroke-width="2"/>
        <text x="546" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#c0392b">SUSHI</text>
      </g>
    </g>

    <!-- crank + pedals -->
    <g>
      <line x1="382" y1="400" x2="438" y2="400" stroke="#333" stroke-width="5" stroke-linecap="round"/>
      <rect x="432" y="395" width="16" height="10" rx="2" fill="#222"/>
      <rect x="372" y="395" width="16" height="10" rx="2" fill="#222"/>
      <animateTransform attributeName="transform" type="rotate" from="0 410 400" to="360 410 400" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- legs (pedaling) -->
    <g stroke="#f28c28" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="395,355 408,367 382,400">
        <animate attributeName="points" dur="1.2s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
          values="395,355 408,367 382,400; 395,355 422,353 410,372; 395,355 436,367 438,400; 395,355 422,381 410,428; 395,355 408,367 382,400"/>
      </polyline>
      <polyline points="395,355 436,367 438,400">
        <animate attributeName="points" dur="1.2s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
          values="395,355 436,367 438,400; 395,355 422,381 410,428; 395,355 408,367 382,400; 395,355 422,353 410,372; 395,355 436,367 438,400"/>
      </polyline>
    </g>
    <!-- webbed feet -->
    <g fill="#f28c28">
      <path d="M382 400 l-14 8 l20 -1 l12 6 Z">
        <animateMotion dur="1.2s" repeatCount="indefinite" path="M0 0 A28 28 0 1 1 0 -0.01 Z" rotate="0" begin="0s"/>
      </path>
    </g>

    <!-- ===== PELICAN (bobbing) ===== -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 2;0 0" dur="0.6s" repeatCount="indefinite"/>
      <!-- tail -->
      <path d="M362 320 L330 305 L352 330 L322 332 L358 342 Z" fill="#e8e8e8" stroke="#444" stroke-width="2"/>
      <!-- body -->
      <ellipse cx="400" cy="325" rx="48" ry="34" fill="#f7f7f7" stroke="#444" stroke-width="3"/>
      <!-- belly shading -->
      <ellipse cx="408" cy="338" rx="28" ry="14" fill="#e3e3e3"/>
      <!-- neck -->
      <path d="M430 305 Q455 300 462 265" stroke="#f7f7f7" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M430 305 Q455 300 462 265" stroke="#444" stroke-width="3" fill="none" stroke-linecap="round" opacity="0" />
      <path d="M420 296 Q448 290 453 262" stroke="#444" stroke-width="3" fill="none"/>
      <path d="M440 315 Q462 306 472 275" stroke="#444" stroke-width="3" fill="none"/>
      <!-- wing gripping handlebar -->
      <path d="M405 312 Q450 295 492 300 Q470 316 420 335 Z" fill="#dcdcdc" stroke="#444" stroke-width="3"/>
      <!-- wing feathers -->
      <path d="M420 330 Q440 318 460 312" stroke="#444" stroke-width="2" fill="none"/>
      <!-- head -->
      <circle cx="468" cy="252" r="20" fill="#f7f7f7" stroke="#444" stroke-width="3"/>
      <!-- upper beak -->
      <path d="M478 246 L578 258 L480 262 Z" fill="#ffb347" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <!-- pouch (bulging, with fish) -->
      <path d="M480 262 Q500 318 578 262 Z" fill="#ffd38a" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <!-- fish tail sticking out -->
      <g>
        <path d="M548 266 L574 252 L572 272 L582 280 L558 284 Z" fill="#4aa3df" stroke="#1f5f8b" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" values="-6 552 272;8 552 272;-6 552 272" dur="0.5s" repeatCount="indefinite"/>
      </g>
      <!-- eye -->
      <circle cx="474" cy="246" r="6" fill="#fff" stroke="#444" stroke-width="2"/>
      <circle cx="476" cy="246" r="3" fill="#111"/>
      <!-- stressed eyebrow -->
      <path d="M465 236 L482 240" stroke="#444" stroke-width="3" stroke-linecap="round"/>
      <!-- helmet -->
      <path d="M446 250 A22 22 0 0 1 490 250 Z" fill="#2e86de" stroke="#1b4f8a" stroke-width="3"/>
      <line x1="458" y1="232" x2="462" y2="250" stroke="#1b4f8a" stroke-width="2"/>
      <line x1="472" y1="229" x2="472" y2="250" stroke="#1b4f8a" stroke-width="2"/>
      <path d="M452 254 Q462 274 470 272" stroke="#1b4f8a" stroke-width="2" fill="none"/>
      <!-- sweat drops -->
      <g fill="#4aa3df">
        <path d="M440 236 q4 -8 8 0 q-4 6 -8 0 Z"/>
        <path d="M446 224 q3 -6 6 0 q-3 5 -6 0 Z"/>
        <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <!-- speech bubble -->
      <g>
        <path d="M500 190 Q498 160 530 158 L640 158 Q668 160 666 185 Q666 210 640 212 L528 212 L505 230 L514 212 Q500 210 500 190 Z" fill="#fff" stroke="#222" stroke-width="3"/>
        <text x="583" y="180" text-anchor="middle" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" font-size="15" font-weight="bold" fill="#222">"Delivery fee: 1 fish."</text>
        <text x="583" y="200" text-anchor="middle" font-family="'Comic Sans MS', 'Trebuchet MS', sans-serif" font-size="13" fill="#c0392b">(already deducted)</text>
      </g>
    </g>

    <!-- order ETA badge -->
    <g transform="translate(690,330)">
      <rect x="-62" y="-26" width="124" height="52" rx="10" fill="#fff" stroke="#222" stroke-width="3"/>
      <text x="0" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#222">ORDER STATUS:</text>
      <text x="0" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c0392b">
        "Snack in progress"
        <animate attributeName="opacity" values="1;1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- caption -->
  <rect x="0" y="500" width="800" height="45" fill="#fff8dc" stroke="#e0c97a" stroke-width="2"/>
  <text x="400" y="528" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-style="italic" fill="#222">Gig economy, nature edition: Pelly guarantees 30-minute delivery — of whatever's left after the ride.</text>

  <!-- footer -->
  <rect x="0" y="545" width="800" height="55" fill="#1f2d3d"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff">2026-10-28 00:07:27 SGT (UTC+08:00)</text>
</svg>