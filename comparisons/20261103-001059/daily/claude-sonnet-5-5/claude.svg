<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#222" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#ffffff"/>

  <text x="300" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">Union area of A, B, C = 79900 px²</text>

  <rect x="50" y="50" width="200" height="150" fill="#1f77b4" fill-opacity="0.4" stroke="#1f77b4" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#d62728" fill-opacity="0.4" stroke="#d62728" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#2ca02c" fill-opacity="0.4" stroke="#2ca02c" stroke-width="2"/>

  <rect x="150" y="120" width="100" height="80" fill="url(#hatch)" fill-opacity="0.5" stroke="#222" stroke-width="1"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatch)" fill-opacity="0.5" stroke="#222" stroke-width="1"/>

  <g font-family="Arial, sans-serif" fill="#111">
    <text x="100" y="105" font-size="22" font-weight="bold" text-anchor="middle">A</text>
    <text x="230" y="245" font-size="22" font-weight="bold" text-anchor="middle">B</text>
    <text x="440" y="285" font-size="22" font-weight="bold" text-anchor="middle">C</text>

    <rect x="160" y="142" width="80" height="38" fill="#fff" fill-opacity="0.9"/>
    <text x="200" y="157" font-size="12" text-anchor="middle">A∩B</text>
    <text x="200" y="173" font-size="12" font-weight="bold" text-anchor="middle">8000 px²</text>

    <g transform="translate(335,235) rotate(-90)">
      <rect x="-30" y="-8" width="60" height="16" fill="#fff" fill-opacity="0.9"/>
      <text x="0" y="4" font-size="11" font-weight="bold" text-anchor="middle">2100 px²</text>
    </g>

    <text x="300" y="372" font-size="12" text-anchor="middle">A and C do not overlap (no A∩C). Rotated label at x=335 is B∩C.</text>
    <text x="300" y="392" font-size="12" text-anchor="middle">2026-11-03 00:10:59 SGT (UTC+08:00)</text>
  </g>
</svg>