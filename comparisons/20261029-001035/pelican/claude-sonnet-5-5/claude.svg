<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
    <g id="wheel">
      <circle r="62" fill="none" stroke="#222" stroke-width="7"/>
      <circle r="55" fill="none" stroke="#999" stroke-width="1.5"/>
      <g stroke="#555" stroke-width="2">
        <line x1="-55" y1="0" x2="55" y2="0"/>
        <line x1="0" y1="-55" x2="0" y2="55"/>
        <line x1="-39" y1="-39" x2="39" y2="39"/>
        <line x1="-39" y1="39" x2="39" y2="-39"/>
      </g>
      <circle r="7" fill="#444"/>
      <circle cx="55" cy="0" r="5" fill="#e33"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- title -->
  <text x="400" y="52" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="40" fill="#c0392b" stroke="#fff" stroke-width="1">PELICAN PEDAL PANIC!</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-style="italic" fill="#234">Breaking: local bird insists the bill is also a luggage rack.</text>

  <!-- sun -->
  <circle cx="710" cy="130" r="38" fill="#ffd84a">
    <animate attributeName="r" values="38;42;38" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="140" rx="45" ry="16"/><ellipse cx="180" cy="128" rx="30" ry="16"/><ellipse cx="125" cy="130" rx="25" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;40 0;0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="520" cy="160" rx="40" ry="13"/><ellipse cx="545" cy="150" rx="26" ry="13"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-35 0;0 0" dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="470" width="800" height="80" fill="#6dbf5b"/>
  <rect x="0" y="490" width="800" height="45" fill="#6b6b73"/>
  <g stroke="#fff" stroke-width="5" stroke-dasharray="30 24">
    <line x1="0" y1="513" x2="800" y2="513">
      <animate attributeName="stroke-dashoffset" values="0;-54" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- speed lines -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round">
    <line x1="60" y1="330" x2="140" y2="330"><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></line>
    <line x1="30" y1="370" x2="120" y2="370"><animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/></line>
    <line x1="70" y1="410" x2="140" y2="410"><animate attributeName="opacity" values="1;0;1" dur="0.8s" begin="0.2s" repeatCount="indefinite"/></line>
  </g>

  <!-- whole bike+pelican bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- wheels -->
    <g transform="translate(250 450)">
      <use href="#wheel">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </use>
    </g>
    <g transform="translate(500 450)">
      <use href="#wheel">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- frame -->
    <g stroke="#2a6fdb" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="250" y1="450" x2="340" y2="370"/>
      <line x1="340" y1="370" x2="445" y2="370"/>
      <line x1="445" y1="370" x2="500" y2="450"/>
      <line x1="340" y1="370" x2="375" y2="450"/>
      <line x1="375" y1="450" x2="250" y2="450"/>
      <line x1="375" y1="450" x2="445" y2="370"/>
      <line x1="445" y1="370" x2="460" y2="335"/>
    </g>
    <line x1="340" y1="370" x2="335" y2="340" stroke="#2a6fdb" stroke-width="6"/>
    <rect x="315" y="332" width="48" height="12" rx="6" fill="#222"/>
    <line x1="445" y1="338" x2="485" y2="330" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <circle cx="375" cy="450" r="14" fill="#888" stroke="#444" stroke-width="3"/>

    <!-- pedal legs -->
    <g transform="translate(375 450)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="0" y2="32" stroke="#444" stroke-width="6" stroke-linecap="round"/>
        <rect x="-10" y="30" width="20" height="7" fill="#222"/>
        <line x1="0" y1="0" x2="0" y2="-32" stroke="#444" stroke-width="6" stroke-linecap="round"/>
        <rect x="-10" y="-37" width="20" height="7" fill="#222"/>
      </g>
    </g>

    <!-- pelican legs (orange) -->
    <g stroke="#f5a623" stroke-width="7" stroke-linecap="round" fill="none">
      <polyline points="340,335 365,395 375,420">
        <animate attributeName="points" values="340,335 365,395 375,420;340,335 385,380 375,482;340,335 365,395 375,420" dur="1.2s" repeatCount="indefinite"/>
      </polyline>
      <polyline points="345,335 395,370 385,418">
        <animate attributeName="points" values="345,335 395,370 385,418;345,335 365,400 375,418;345,335 395,370 385,418" dur="1.2s" repeatCount="indefinite"/>
      </polyline>
    </g>

    <!-- body -->
    <ellipse cx="340" cy="305" rx="62" ry="42" fill="#fafafa" stroke="#333" stroke-width="3" transform="rotate(-15 340 305)"/>
    <!-- tail -->
    <polygon points="285,310 250,330 290,335" fill="#ddd" stroke="#333" stroke-width="3"/>
    <!-- wing arm -->
    <path d="M335 295 Q400 300 455 335" fill="none" stroke="#e8e8e8" stroke-width="16" stroke-linecap="round"/>
    <path d="M335 295 Q400 300 455 335" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

    <!-- neck -->
    <path d="M375 280 Q410 250 395 215" fill="none" stroke="#fafafa" stroke-width="26" stroke-linecap="round"/>
    <path d="M388 285 Q424 250 408 212" fill="none" stroke="#333" stroke-width="2" opacity="0.5"/>

    <!-- head wobble -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 395 215;3 395 215;-3 395 215" dur="0.6s" repeatCount="indefinite"/>
      <circle cx="398" cy="200" r="28" fill="#fafafa" stroke="#333" stroke-width="3"/>
      <!-- beak -->
      <path d="M418 198 L545 205 Q535 262 470 258 Q430 250 418 215 Z" fill="#ffb938" stroke="#333" stroke-width="3"/>
      <path d="M420 206 L540 208" stroke="#b36b00" stroke-width="3" fill="none"/>
      <!-- fish in pouch -->
      <g>
        <ellipse cx="480" cy="236" rx="22" ry="9" fill="#5aa9e6" stroke="#234" stroke-width="2"/>
        <polygon points="500,236 518,224 518,248" fill="#5aa9e6" stroke="#234" stroke-width="2"/>
        <circle cx="468" cy="233" r="2.5" fill="#000"/>
        <animateTransform attributeName="transform" type="rotate" values="-6 480 236;6 480 236;-6 480 236" dur="0.6s" repeatCount="indefinite"/>
      </g>
      <!-- goggles / eye -->
      <circle cx="405" cy="192" r="13" fill="#fff" stroke="#333" stroke-width="3"/>
      <circle cx="409" cy="193" r="5" fill="#000"/>
      <path d="M375 190 L392 186" stroke="#333" stroke-width="3"/>
      <path d="M395 174 L420 180" stroke="#333" stroke-width="4" stroke-linecap="round"/>
      <!-- helmet -->
      <path d="M370 195 Q372 155 405 160 Q430 165 428 190 Z" fill="#e74c3c" stroke="#333" stroke-width="3"/>
      <circle cx="395" cy="172" r="4" fill="#fff"/>
      <!-- head feather -->
      <path d="M372 190 Q350 180 352 168" fill="none" stroke="#333" stroke-width="3"/>
    </g>
  </g>

  <!-- sweat drops -->
  <g fill="#4aa8ff">
    <path d="M345 150 q-6 12 0 14 q6 -2 0 -14z">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-10 20;0 0" dur="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M325 175 q-5 10 0 12 q5 -2 0 -12z">
      <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M580 250 h170 a10 10 0 0 1 10 10 v50 a10 10 0 0 1 -10 10 h-120 l-30 22 l5 -22 h-25 a10 10 0 0 1 -10 -10 v-50 a10 10 0 0 1 10 -10z" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="670" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#222">"Tour de Fish!"</text>
    <text x="670" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#222">Don't tell the seagulls.</text>
  </g>

  <!-- caption -->
  <rect x="120" y="545" width="560" height="0" fill="none"/>
  <!-- footer -->
  <rect x="0" y="548" width="800" height="52" fill="#1f2a38"/>
  <text x="400" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#fff">Caption: Pelican on a bicycle: snacks stored up front, aerodynamics ignored.</text>
  <text x="400" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffd84a">2026-10-29 00:10:35 SGT (UTC+08:00)</text>
</svg>