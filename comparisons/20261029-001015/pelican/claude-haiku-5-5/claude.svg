<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#e0f7ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="120" r="40" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#1a1a2e">Pedal Pelican Express</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#263238">Satire: the pelican insists its beak is a cargo bay and it is always late.</text>

  <rect x="0" y="490" width="800" height="50" fill="#7cb342"/>

  <!-- Bicycle frame -->
  <g stroke="#c62828" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="240" y1="430" x2="380" y2="430"/>
    <line x1="380" y1="430" x2="340" y2="330"/>
    <line x1="340" y1="330" x2="240" y2="430"/>
    <line x1="340" y1="330" x2="470" y2="330"/>
    <line x1="470" y1="330" x2="530" y2="430"/>
    <line x1="380" y1="430" x2="530" y2="430"/>
  </g>
  <line x1="470" y1="330" x2="478" y2="302" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="466" y1="302" x2="494" y2="302" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <line x1="330" y1="322" x2="352" y2="322" stroke="#333" stroke-width="8" stroke-linecap="round"/>

  <!-- Rear wheel -->
  <g>
    <circle cx="240" cy="430" r="60" fill="none" stroke="#212121" stroke-width="7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 240 430" to="360 240 430" dur="1.5s" repeatCount="indefinite"/>
      <line x1="240" y1="370" x2="240" y2="490" stroke="#616161" stroke-width="3"/>
      <line x1="180" y1="430" x2="300" y2="430" stroke="#616161" stroke-width="3"/>
      <line x1="195" y1="385" x2="285" y2="475" stroke="#616161" stroke-width="3"/>
      <line x1="285" y1="385" x2="195" y2="475" stroke="#616161" stroke-width="3"/>
    </g>
    <circle cx="240" cy="430" r="6" fill="#212121"/>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="530" cy="430" r="60" fill="none" stroke="#212121" stroke-width="7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 530 430" to="360 530 430" dur="1.5s" repeatCount="indefinite"/>
      <line x1="530" y1="370" x2="530" y2="490" stroke="#616161" stroke-width="3"/>
      <line x1="470" y1="430" x2="590" y2="430" stroke="#616161" stroke-width="3"/>
      <line x1="485" y1="385" x2="575" y2="475" stroke="#616161" stroke-width="3"/>
      <line x1="575" y1="385" x2="485" y2="475" stroke="#616161" stroke-width="3"/>
    </g>
    <circle cx="530" cy="430" r="6" fill="#212121"/>
  </g>

  <!-- Crank and pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 380 430" to="360 380 430" dur="1.5s" repeatCount="indefinite"/>
    <line x1="362" y1="430" x2="398" y2="430" stroke="#424242" stroke-width="6" stroke-linecap="round"/>
    <line x1="380" y1="412" x2="380" y2="448" stroke="#424242" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle cx="380" cy="430" r="8" fill="#424242"/>

  <!-- Pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" keyTimes="0; 0.5; 1" dur="0.75s" repeatCount="indefinite"/>

    <!-- Legs to pedals -->
    <line x1="352" y1="318" x2="372" y2="400" stroke="#ff7043" stroke-width="7" stroke-linecap="round"/>
    <line x1="372" y1="400" x2="388" y2="420" stroke="#ff7043" stroke-width="6" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="370" cy="280" rx="72" ry="42" fill="#f5f5f5" stroke="#455a64" stroke-width="3"/>
    <!-- Tail -->
    <path d="M300 270 Q270 255 262 275 Q285 285 302 292 Z" fill="#b0bec5" stroke="#455a64" stroke-width="3"/>
    <!-- Wing -->
    <ellipse cx="352" cy="272" rx="50" ry="22" fill="#cfd8dc" stroke="#455a64" stroke-width="3" transform="rotate(-12 352 272)"/>

    <!-- Neck -->
    <path d="M414 262 Q430 225 442 200" fill="none" stroke="#f5f5f5" stroke-width="30" stroke-linecap="round"/>
    <path d="M414 262 Q430 225 442 200" fill="none" stroke="#455a64" stroke-width="34" stroke-linecap="butt" opacity="0"/>

    <!-- Head -->
    <circle cx="450" cy="190" r="24" fill="#f5f5f5" stroke="#455a64" stroke-width="3"/>

    <!-- Beak with pouch -->
    <path d="M466 186 L562 200 Q545 236 500 224 Q482 216 466 204 Z" fill="#ff9800" stroke="#e65100" stroke-width="3"/>
    <path d="M470 204 Q500 240 520 216" fill="none" stroke="#e65100" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="456" cy="184" r="6" fill="#ffffff" stroke="#212121" stroke-width="2"/>
    <circle cx="457" cy="185" r="3" fill="#212121"/>

    <!-- Cheeky smile line -->
    <path d="M462 200 Q472 204 478 198" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round"/>

    <!-- Fish in pouch -->
    <path d="M500 222 Q512 214 524 222 Q512 230 500 222 Z" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
  </g>

  <!-- Speech bubble -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#1a1a2e">
    <rect x="600" y="140" width="180" height="70" rx="14" fill="#ffffff" stroke="#263238" stroke-width="3"/>
    <path d="M610 210 L600 232 L628 210 Z" fill="#ffffff" stroke="#263238" stroke-width="3"/>
    <text x="690" y="168" text-anchor="middle">Delivery? Sure!</text>
    <text x="690" y="192" text-anchor="middle">Just 12 hours late.</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="545" width="800" height="55" fill="#1a1a2e"/>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">2026-10-29 00:10:15 SGT (UTC+08:00)</text>
</svg>