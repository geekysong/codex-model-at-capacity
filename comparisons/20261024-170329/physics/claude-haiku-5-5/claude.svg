<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { font-size: 22px; font-weight: bold; fill: #1f2937; }
    .solve { font-size: 18px; fill: #1f2937; }
    .label { font-size: 16px; font-weight: bold; fill: #1f2937; }
    .mass { font-size: 16px; font-weight: bold; fill: #ffffff; }
    .force { font-size: 14px; fill: #b91c1c; font-weight: bold; }
    .dim { font-size: 15px; fill: #374151; }
    .eq { font-size: 22px; font-weight: bold; fill: #1e3a8a; }
    .status { font-size: 26px; font-weight: bold; fill: #15803d; letter-spacing: 3px; }
  </style>

  <!-- Background -->
  <rect x="0" y="0" width="600" height="400" fill="#f8fafc"/>

  <!-- Title and solution -->
  <text class="title" x="300" y="34" text-anchor="middle">Seesaw in Static Equilibrium</text>
  <text class="solve" x="300" y="64" text-anchor="middle">Solve: 6 × 2 = 4 × x  →  x = 3 m</text>

  <!-- Distance dimension lines -->
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <line x1="180" y1="130" x2="300" y2="130"/>
    <line x1="180" y1="124" x2="180" y2="136"/>
    <line x1="300" y1="124" x2="300" y2="136"/>
    <line x1="300" y1="130" x2="480" y2="130"/>
    <line x1="480" y1="124" x2="480" y2="136"/>
  </g>
  <text class="dim" x="240" y="122" text-anchor="middle">2 m</text>
  <text class="dim" x="390" y="122" text-anchor="middle">3 m</text>

  <!-- Support and ground -->
  <polygon points="300,170 278,330 322,330" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <line x1="236" y1="330" x2="364" y2="330" stroke="#4b5563" stroke-width="4"/>

  <!-- Seesaw beam (kept level) -->
  <rect x="100" y="165" width="400" height="10" rx="3" fill="#78350f"/>

  <!-- Pivot -->
  <circle cx="300" cy="170" r="7" fill="#111827"/>
  <text class="dim" x="300" y="156" text-anchor="middle">pivot</text>

  <!-- Left mass: 6 kg at 2 m -->
  <line x1="180" y1="175" x2="180" y2="215" stroke="#4b5563" stroke-width="2"/>
  <rect x="160" y="215" width="40" height="40" rx="4" fill="#2563eb"/>
  <text class="mass" x="180" y="240" text-anchor="middle">6 kg</text>

  <!-- Left force arrow (weight) with gentle pulse -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="2s" repeatCount="indefinite"/>
    <line x1="180" y1="262" x2="180" y2="287" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <polygon points="170,284 190,284 180,298" fill="#dc2626"/>
    <text class="force" x="196" y="282">W = 58.8 N</text>
  </g>

  <!-- Right mass: 4 kg at 3 m -->
  <line x1="480" y1="175" x2="480" y2="215" stroke="#4b5563" stroke-width="2"/>
  <rect x="460" y="215" width="40" height="40" rx="4" fill="#d97706"/>
  <text class="mass" x="480" y="240" text-anchor="middle">4 kg</text>

  <!-- Right force arrow (weight) with gentle pulse, in sync -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 5;0 0" dur="2s" repeatCount="indefinite"/>
    <line x1="480" y1="262" x2="480" y2="281" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <polygon points="470,278 490,278 480,292" fill="#dc2626"/>
    <text class="force" x="498" y="278">W = 39.2 N</text>
  </g>

  <!-- Torque equation -->
  <text class="eq" x="300" y="362" text-anchor="middle">6 × 2 = 4 × 3</text>
  <text class="dim" x="300" y="382" text-anchor="middle">Torque: 6 kg × 2 m = 4 kg × 3 m  (Στ = 0)</text>

  <!-- Status word with pulse -->
  <text class="status" x="300" y="394" text-anchor="middle" opacity="1">
    BALANCED
    <animate attributeName="opacity" values="1;0.55;1" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>