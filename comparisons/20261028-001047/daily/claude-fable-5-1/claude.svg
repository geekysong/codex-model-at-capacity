<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Shortest path length: 8</text>

  <!-- Grid cells (open) -->
  <rect x="150" y="50" width="300" height="300" fill="#f4f4f4" stroke="none"/>

  <!-- Start (0,0) green -->
  <rect x="150" y="50" width="60" height="60" fill="#4caf50"/>
  <!-- Goal (4,4) red -->
  <rect x="390" y="290" width="60" height="60" fill="#e53935"/>

  <!-- Blocked cells dark gray -->
  <rect x="270" y="50" width="60" height="60" fill="#444"/>
  <rect x="270" y="110" width="60" height="60" fill="#444"/>
  <rect x="270" y="170" width="60" height="60" fill="#444"/>
  <rect x="150" y="170" width="60" height="60" fill="#444"/>
  <rect x="330" y="230" width="60" height="60" fill="#444"/>
  <rect x="210" y="290" width="60" height="60" fill="#444"/>

  <!-- Grid lines -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="150" y1="50" x2="450" y2="50"/>
    <line x1="150" y1="110" x2="450" y2="110"/>
    <line x1="150" y1="170" x2="450" y2="170"/>
    <line x1="150" y1="230" x2="450" y2="230"/>
    <line x1="150" y1="290" x2="450" y2="290"/>
    <line x1="150" y1="350" x2="450" y2="350"/>
    <line x1="150" y1="50" x2="150" y2="350"/>
    <line x1="210" y1="50" x2="210" y2="350"/>
    <line x1="270" y1="50" x2="270" y2="350"/>
    <line x1="330" y1="50" x2="330" y2="350"/>
    <line x1="390" y1="50" x2="390" y2="350"/>
    <line x1="450" y1="50" x2="450" y2="350"/>
  </g>

  <!-- Shortest path polyline through cell centers -->
  <polyline points="180,80 180,140 240,140 240,200 240,260 300,260 300,320 360,320 420,320"
            fill="none" stroke="#1e63d6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Step labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e63d6">
    <circle cx="180" cy="80" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="180" y="85">0</text>
    <circle cx="180" cy="140" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="180" y="145">1</text>
    <circle cx="240" cy="140" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="240" y="145">2</text>
    <circle cx="240" cy="200" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="240" y="205">3</text>
    <circle cx="240" cy="260" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="240" y="265">4</text>
    <circle cx="300" cy="260" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="300" y="265">5</text>
    <circle cx="300" cy="320" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="300" y="325">6</text>
    <circle cx="360" cy="320" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="360" y="325">7</text>
    <circle cx="420" cy="320" r="12" fill="#fff" stroke="#1e63d6" stroke-width="2"/>
    <text x="420" y="325">8</text>
  </g>

  <!-- Legend labels -->
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="12" fill="#333">Start</text>
  <text x="470" y="325" font-family="Arial, sans-serif" font-size="12" fill="#333">Goal</text>

  <!-- Footer timestamp -->
  <text x="300" y="382" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">2026-10-28 00:10:47 SGT (UTC+08:00)</text>
</svg>