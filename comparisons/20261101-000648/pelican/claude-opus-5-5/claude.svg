<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
    <g id="spokes">
      <line x1="-66" y1="0" x2="66" y2="0"/>
      <line x1="0" y1="-66" x2="0" y2="66"/>
      <line x1="-47" y1="-47" x2="47" y2="47"/>
      <line x1="-47" y1="47" x2="47" y2="-47"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="170" r="38" fill="#ffd84a" stroke="#f2a900" stroke-width="4"/>

  <!-- Drifting clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="150" cy="170" rx="50" ry="18"/>
      <ellipse cx="180" cy="158" rx="32" ry="18"/>
      <ellipse cx="560" cy="200" rx="45" ry="15"/>
      <ellipse cx="585" cy="190" rx="28" ry="15"/>
      <animateTransform attributeName="transform" type="translate" values="60,0;-60,0;60,0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Hills and road -->
  <path d="M0 430 Q150 360 300 420 T600 400 T800 410 L800 500 L0 500 Z" fill="#9bd77a"/>
  <rect x="0" y="495" width="800" height="50" fill="#5b5b66"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#fff" stroke-width="5" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="70" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- Roadside sign -->
  <g>
    <rect x="688" y="380" width="8" height="118" fill="#7a5230"/>
    <rect x="632" y="330" width="120" height="60" rx="6" fill="#2f7d32" stroke="#fff" stroke-width="3"/>
    <text x="692" y="355" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">BIKE LANE</text>
    <text x="692" y="377" font-size="12" font-weight="bold" fill="#ffeb3b" text-anchor="middle">NO FISHING</text>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-dasharray="30 25">
    <line x1="60" y1="300" x2="230" y2="300"><animate attributeName="stroke-dashoffset" from="0" to="55" dur="0.4s" repeatCount="indefinite"/></line>
    <line x1="30" y1="350" x2="200" y2="350"><animate attributeName="stroke-dashoffset" from="0" to="55" dur="0.35s" repeatCount="indefinite"/></line>
    <line x1="80" y1="400" x2="210" y2="400"><animate attributeName="stroke-dashoffset" from="0" to="55" dur="0.45s" repeatCount="indefinite"/></line>
  </g>

  <!-- Dust puffs -->
  <g fill="#d9c9a8">
    <circle cx="210" cy="490" r="10">
      <animate attributeName="cx" values="215;150" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;16" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="482" r="8">
      <animate attributeName="cx" values="210;130" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="5;14" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shadow -->
  <ellipse cx="400" cy="502" rx="190" ry="8" fill="#000" opacity="0.2"/>

  <!-- Wheels -->
  <g>
    <circle cx="290" cy="430" r="70" fill="none" stroke="#222" stroke-width="9"/>
    <circle cx="510" cy="430" r="70" fill="none" stroke="#222" stroke-width="9"/>
    <g transform="translate(290 430)" stroke="#999" stroke-width="2.5">
      <g>
        <use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(510 430)" stroke="#999" stroke-width="2.5">
      <g>
        <use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </g>
    </g>
    <circle cx="290" cy="430" r="6" fill="#444"/>
    <circle cx="510" cy="430" r="6" fill="#444"/>
  </g>

  <!-- Frame -->
  <g stroke="#e53935" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="290" y1="430" x2="395" y2="440"/>
    <line x1="290" y1="430" x2="362" y2="350"/>
    <line x1="362" y1="350" x2="395" y2="440"/>
    <line x1="365" y1="360" x2="472" y2="352"/>
    <line x1="472" y1="352" x2="395" y2="440"/>
    <line x1="478" y1="335" x2="510" y2="430"/>
  </g>
  <path d="M468 332 L480 322 L500 326" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>
  <ellipse cx="358" cy="344" rx="22" ry="6" fill="#333"/>

  <!-- Back leg -->
  <line x1="352" y1="328" x2="373" y2="440" stroke="#e8902b" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="373;395;417;395;373" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="440;418;440;462;440" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Crank -->
  <g>
    <line x1="395" y1="440" x2="417" y2="440" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <line x1="395" y1="440" x2="373" y2="440" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 395 440" to="360 395 440" dur="1s" repeatCount="indefinite"/>
  </g>
  <circle cx="395" cy="440" r="11" fill="#777" stroke="#333" stroke-width="3"/>

  <!-- Front leg -->
  <line x1="368" y1="330" x2="417" y2="440" stroke="#f5a33c" stroke-width="7" stroke-linecap="round">
    <animate attributeName="x2" values="417;395;373;395;417" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="440;462;440;418;440" dur="1s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="417" cy="440" rx="11" ry="5" fill="#f5a33c">
    <animate attributeName="cx" values="417;395;373;395;417" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="440;462;440;418;440" dur="1s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Pelican upper body (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="0.5s" repeatCount="indefinite"/>
    <!-- Tail -->
    <path d="M305 300 L270 290 L280 310 L268 322 L310 318 Z" fill="#f2f2f2" stroke="#333" stroke-width="3"/>
    <!-- Body -->
    <ellipse cx="360" cy="305" rx="62" ry="38" fill="#ffffff" stroke="#333" stroke-width="3.5" transform="rotate(-10 360 305)"/>
    <!-- Neck -->
    <path d="M395 290 C420 270 410 245 432 228" stroke="#333" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M395 290 C420 270 410 245 432 228" stroke="#fff" stroke-width="23" fill="none" stroke-linecap="round"/>
    <!-- Wing reaching handlebar -->
    <path d="M330 290 Q400 270 476 326 Q420 320 345 320 Z" fill="#e6e6e6" stroke="#333" stroke-width="3"/>
    <path d="M350 300 L410 302 M355 310 L425 314" stroke="#999" stroke-width="2"/>
    <!-- Head -->
    <circle cx="440" cy="215" r="24" fill="#fff" stroke="#333" stroke-width="3.5"/>
    <!-- Helmet -->
    <path d="M414 210 Q420 180 446 182 Q470 186 468 206 Z" fill="#1e88e5" stroke="#333" stroke-width="3"/>
    <path d="M428 190 L432 202 M444 186 L446 200 M458 190 L456 202" stroke="#bbdefb" stroke-width="3"/>
    <!-- Eye (determined, strained) -->
    <circle cx="447" cy="216" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
    <circle cx="450" cy="216" r="3.5" fill="#111"/>
    <path d="M438 206 L457 210" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <!-- Sweat drop -->
    <path d="M418 224 Q414 232 418 236 Q422 232 418 224 Z" fill="#4fc3f7">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </path>
    <!-- Pouch full of fish -->
    <path d="M458 230 Q500 330 582 246 Z" fill="#ffb74d" stroke="#333" stroke-width="3"/>
    <path d="M478 262 Q500 270 520 262 M495 285 Q515 290 540 276" stroke="#e08a1e" stroke-width="2" fill="none"/>
    <!-- Fish tail wagging out of pouch -->
    <g>
      <path d="M560 252 L590 236 L586 258 L596 276 Z" fill="#78909c" stroke="#333" stroke-width="2.5"/>
      <animateTransform attributeName="transform" type="rotate" values="-12 565 255;14 565 255;-12 565 255" dur="0.4s" repeatCount="indefinite"/>
    </g>
    <!-- Upper beak -->
    <path d="M456 208 Q520 214 590 240 Q585 248 578 246 Q520 232 458 230 Z" fill="#ffa726" stroke="#333" stroke-width="3"/>
    <circle cx="586" cy="242" r="3" fill="#e65100"/>
    <!-- Speech bubble -->
    <path d="M480 128 H620 Q632 128 632 140 V166 Q632 178 620 178 H540 L520 196 L524 178 H480 Q468 178 468 166 V140 Q468 128 480 128 Z" fill="#fff" stroke="#333" stroke-width="3"/>
    <text x="550" y="160" font-size="20" font-weight="bold" fill="#333" text-anchor="middle">MMF! MMMF!</text>
  </g>

  <!-- Title & caption -->
  <text x="400" y="58" font-size="40" font-weight="900" fill="#c62828" text-anchor="middle" stroke="#fff" stroke-width="2" paint-order="stroke">TOUR DE PELICAN</text>
  <text x="400" y="95" font-size="19" font-style="italic" fill="#1a237e" text-anchor="middle">“Basket? I don't need a basket. I AM the basket.”</text>

  <!-- Footer -->
  <rect x="0" y="550" width="800" height="50" fill="#263238"/>
  <text x="400" y="580" font-size="16" fill="#ffffff" text-anchor="middle">2026-11-01 00:06:48 SGT (UTC+08:00)</text>
</svg>