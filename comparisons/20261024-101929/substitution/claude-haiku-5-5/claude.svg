<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#fdf6e3"/>
<rect x="0" y="0" width="800" height="110" fill="#c0392b"/>
<text x="400" y="62" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="46" fill="#fff" letter-spacing="2">THE GREAT AI SWITCHEROO</text>
<text x="400" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fde2d8">"Premium" means whatever we feel like today</text>

<!-- customer -->
<circle cx="130" cy="300" r="38" fill="#f5cba7" stroke="#333" stroke-width="3"/>
<circle cx="118" cy="294" r="4" fill="#333"/><circle cx="142" cy="294" r="4" fill="#333"/>
<path d="M115 315 Q130 326 145 315" stroke="#333" stroke-width="3" fill="none"/>
<rect x="95" y="338" width="70" height="95" rx="14" fill="#2e86c1" stroke="#333" stroke-width="3"/>
<ellipse cx="130" cy="262" rx="20" ry="8" fill="#8e5a2b"/>
<path d="M40 150 H250 Q262 150 262 162 V205 Q262 217 250 217 H160 L140 240 L146 217 H40 Q28 217 28 205 V162 Q28 150 40 150Z" fill="#fff" stroke="#333" stroke-width="3"/>
<text x="145" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#222">"I want the PREMIUM model!"</text>

<!-- salesman -->
<circle cx="400" cy="250" r="44" fill="#f5cba7" stroke="#333" stroke-width="3"/>
<path d="M360 232 Q400 200 440 232 L440 222 Q400 188 360 222Z" fill="#222"/>
<circle cx="385" cy="250" r="5" fill="#333"/><circle cx="415" cy="250" r="5" fill="#333"/>
<path d="M382 270 Q400 290 418 270" stroke="#333" stroke-width="3" fill="none"/>
<path d="M375 300 H425 L440 420 H360Z" fill="#7d3c98" stroke="#333" stroke-width="3"/>
<path d="M400 300 L392 330 L400 345 L408 330Z" fill="#f1c40f"/>
<text x="400" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="0"> </text>
<path d="M455 170 H640 Q652 170 652 182 V215 Q652 227 640 227 H470 L455 245 L460 227 H455 Q443 227 443 215 V182 Q443 170 455 170Z" fill="#fff" stroke="#333" stroke-width="3"/>
<text x="548" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#222">"Absolutely! Premium, sir!"</text>

<!-- counter -->
<rect x="250" y="420" width="500" height="28" fill="#6e4a2a" stroke="#333" stroke-width="3"/>
<rect x="250" y="448" width="500" height="20" fill="#4a2f18"/>

<!-- premium box being handed over -->
<rect x="200" y="360" width="110" height="60" fill="#f4d03f" stroke="#333" stroke-width="3"/>
<text x="255" y="396" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="20" fill="#7d6608">PREMIUM</text>
<line x1="230" y1="360" x2="230" y2="420" stroke="#d4ac0d" stroke-width="4"/>

<!-- curtain -->
<path d="M560 180 L580 180 L590 430 L560 430Z" fill="#922b21" opacity="0.9"/>
<path d="M600 180 L620 180 L640 430 L610 430Z" fill="#922b21" opacity="0.9"/>

<!-- switch arrow -->
<path d="M320 395 Q400 430 480 400" stroke="#c0392b" stroke-width="5" fill="none" stroke-dasharray="10 6"/>
<polygon points="478,392 492,400 476,410" fill="#c0392b"/>
<text x="400" y="438" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="22" fill="#c0392b">*SWITCH!*</text>

<!-- cheap model -->
<rect x="530" y="345" width="160" height="75" rx="8" fill="#85929e" stroke="#333" stroke-width="3"/>
<rect x="545" y="358" width="130" height="30" fill="#2c3e50"/>
<text x="610" y="378" text-anchor="middle" font-family="Courier New,monospace" font-size="14" fill="#58d68d">tiny-model-v0.1</text>
<circle cx="610" cy="318" r="28" fill="none" stroke="#333" stroke-width="5"/>
<line x1="610" y1="290" x2="610" y2="346" stroke="#333" stroke-width="3"/>
<line x1="582" y1="318" x2="638" y2="318" stroke="#333" stroke-width="3"/>
<circle cx="612" cy="318" r="10" fill="#e59866" stroke="#333" stroke-width="2"/>
<text x="610" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#333">(hamster)</text>

<!-- price tag -->
<rect x="310" y="470" width="180" height="40" rx="6" fill="#27ae60" stroke="#333" stroke-width="3"/>
<text x="400" y="497" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#fff">$99/mo PREMIUM</text>

<!-- caption -->
<rect x="0" y="530" width="800" height="70" fill="#1c2833"/>
<text x="400" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#fdfefe">You paid for the Ferrari. You got the hamster-powered go-kart.</text>
<text x="400" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#aab7b8">Model subject to change without notice. Hamster rights reserved.</text>
</svg>