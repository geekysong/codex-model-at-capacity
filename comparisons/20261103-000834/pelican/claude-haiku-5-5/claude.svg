<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#bfe9ff"/>
  <circle cx="700" cy="130" r="42" fill="#ffd23f"/>
  <rect x="0" y="470" width="800" height="78" fill="#7cc576"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="bold" fill="#1d3557">PELICAN ON A BICYCLE</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">He insists he is "commuting." The bicycle disagrees.</text>

  <!-- speed lines -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="40 0;-30 0" dur="0.6s" repeatCount="indefinite"/>
    <line x1="120" y1="360" x2="170" y2="360" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="395" x2="160" y2="395" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <line x1="130" y1="430" x2="175" y2="430" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- rear wheel -->
  <circle cx="250" cy="430" r="60" fill="none" stroke="#222" stroke-width="8"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 430" to="360 250 430" dur="1.2s" repeatCount="indefinite"/>
    <line x1="250" y1="370" x2="250" y2="490" stroke="#666" stroke-width="3"/>
    <line x1="190" y1="430" x2="310" y2="430" stroke="#666" stroke-width="3"/>
    <line x1="208" y1="388" x2="292" y2="472" stroke="#666" stroke-width="3"/>
    <line x1="292" y1="388" x2="208" y2="472" stroke="#666" stroke-width="3"/>
  </g>

  <!-- front wheel -->
  <circle cx="480" cy="430" r="60" fill="none" stroke="#222" stroke-width="8"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 480 430" to="360 480 430" dur="1.2s" repeatCount="indefinite"/>
    <line x1="480" y1="370" x2="480" y2="490" stroke="#666" stroke-width="3"/>
    <line x1="420" y1="430" x2="540" y2="430" stroke="#666" stroke-width="3"/>
    <line x1="438" y1="388" x2="522" y2="472" stroke="#666" stroke-width="3"/>
    <line x1="522" y1="388" x2="438" y2="472" stroke="#666" stroke-width="3"/>
  </g>

  <!-- bicycle frame -->
  <g stroke="#d62828" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="250" y1="430" x2="360" y2="430"/>
    <line x1="360" y1="430" x2="330" y2="340"/>
    <line x1="330" y1="340" x2="460" y2="340"/>
    <line x1="360" y1="430" x2="460" y2="340"/>
    <line x1="460" y1="340" x2="480" y2="430"/>
    <line x1="460" y1="340" x2="455" y2="315"/>
  </g>
  <line x1="440" y1="315" x2="470" y2="315" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <line x1="300" y1="336" x2="345" y2="336" stroke="#222" stroke-width="10" stroke-linecap="round"/>

  <!-- pedal crank -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 360 430" to="360 360 430" dur="1.2s" repeatCount="indefinite"/>
    <line x1="360" y1="430" x2="385" y2="430" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <line x1="335" y1="430" x2="360" y2="430" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle cx="360" cy="430" r="8" fill="#333"/>

  <!-- pelican rider with bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.6s" repeatCount="indefinite"/>
    <!-- legs -->
    <line x1="318" y1="338" x2="352" y2="420" stroke="#f4a261" stroke-width="7" stroke-linecap="round"/>
    <line x1="340" y1="338" x2="368" y2="418" stroke="#e76f51" stroke-width="7" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="320" cy="300" rx="75" ry="45" fill="#f4f1de" stroke="#333" stroke-width="3" transform="rotate(-10 320 300)"/>
    <!-- wing -->
    <path d="M270,285 Q300,240 350,275 Q320,300 270,320 Z" fill="#e9e3c4" stroke="#333" stroke-width="3"/>
    <!-- tail -->
    <path d="M250,300 L215,285 L225,315 Z" fill="#e9e3c4" stroke="#333" stroke-width="3"/>
    <!-- neck -->
    <path d="M360,290 Q385,250 395,225" fill="none" stroke="#f4f1de" stroke-width="26" stroke-linecap="round"/>
    <path d="M360,290 Q385,250 395,225" fill="none" stroke="#333" stroke-width="32" stroke-linecap="round" opacity="0.15"/>
    <!-- head -->
    <circle cx="410" cy="212" r="22" fill="#f4f1de" stroke="#333" stroke-width="3"/>
    <!-- beak and pouch -->
    <path d="M425,202 L505,224 Q488,258 440,244 Z" fill="#f4a261" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
    <path d="M440,230 Q465,262 455,276 Q430,262 428,242 Z" fill="#e76f51" stroke="#333" stroke-width="2"/>
    <!-- eye -->
    <circle cx="416" cy="205" r="6" fill="#111"/>
    <circle cx="418" cy="203" r="2" fill="#fff"/>
    <!-- grin lines -->
    <path d="M428,214 Q436,218 442,214" fill="none" stroke="#333" stroke-width="2"/>
  </g>

  <!-- footer -->
  <rect x="0" y="550" width="800" height="50" fill="#1d3557"/>
  <text x="400" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">2026-11-03 00:08:34 SGT (UTC+08:00)</text>
</svg>