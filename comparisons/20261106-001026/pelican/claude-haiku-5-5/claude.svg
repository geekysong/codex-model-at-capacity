<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#bfe6ff"/>
  <circle cx="90" cy="110" r="40" fill="#fff6b0"/>
  <ellipse cx="200" cy="90" rx="60" ry="22" fill="#ffffff"/>
  <ellipse cx="650" cy="150" rx="75" ry="24" fill="#ffffff"/>

  <text x="400" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold" fill="#1a3c5e">PELICAN ON A BICYCLE</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a3c5e">Nobody asked the pelican to pedal. It pedaled anyway, beak first.</text>

  <rect x="0" y="490" width="800" height="40" fill="#6b8e4e"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#ffffff" stroke-width="4" stroke-dasharray="30 20">
    <animate attributeName="stroke-dashoffset" from="0" to="-50" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Rear wheel -->
  <g>
    <circle cx="250" cy="430" r="60" fill="none" stroke="#222" stroke-width="8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 250 430" to="360 250 430" dur="1.2s" repeatCount="indefinite"/>
      <line x1="250" y1="370" x2="250" y2="490" stroke="#555" stroke-width="3"/>
      <line x1="190" y1="430" x2="310" y2="430" stroke="#555" stroke-width="3"/>
      <line x1="208" y1="388" x2="292" y2="472" stroke="#555" stroke-width="3"/>
      <line x1="292" y1="388" x2="208" y2="472" stroke="#555" stroke-width="3"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="500" cy="430" r="60" fill="none" stroke="#222" stroke-width="8"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 500 430" to="360 500 430" dur="1.2s" repeatCount="indefinite"/>
      <line x1="500" y1="370" x2="500" y2="490" stroke="#555" stroke-width="3"/>
      <line x1="440" y1="430" x2="560" y2="430" stroke="#555" stroke-width="3"/>
      <line x1="458" y1="388" x2="542" y2="472" stroke="#555" stroke-width="3"/>
      <line x1="542" y1="388" x2="458" y2="472" stroke="#555" stroke-width="3"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#d7261e" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="250" y1="430" x2="370" y2="430"/>
    <line x1="370" y1="430" x2="340" y2="330"/>
    <line x1="340" y1="330" x2="450" y2="330"/>
    <line x1="370" y1="430" x2="450" y2="330"/>
    <line x1="450" y1="330" x2="500" y2="430"/>
    <line x1="450" y1="330" x2="462" y2="296"/>
    <line x1="462" y1="296" x2="486" y2="292"/>
    <line x1="340" y1="330" x2="326" y2="314"/>
  </g>
  <line x1="318" y1="310" x2="338" y2="310" stroke="#222" stroke-width="10" stroke-linecap="round"/>

  <!-- Crank and pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 370 430" to="360 370 430" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="370" cy="430" r="8" fill="#333"/>
    <line x1="370" y1="430" x2="392" y2="430" stroke="#333" stroke-width="5"/>
    <line x1="370" y1="430" x2="348" y2="430" stroke="#333" stroke-width="5"/>
  </g>

  <!-- Pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.6s" repeatCount="indefinite"/>
    <!-- Legs -->
    <line x1="352" y1="320" x2="372" y2="402" stroke="#f08a24" stroke-width="7" stroke-linecap="round"/>
    <line x1="382" y1="320" x2="350" y2="410" stroke="#f08a24" stroke-width="7" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M292 292 L250 270 L262 304 L246 320 L296 318 Z" fill="#7a8fa3"/>
    <!-- Body -->
    <ellipse cx="360" cy="290" rx="80" ry="44" transform="rotate(-12 360 290)" fill="#f2f2f2" stroke="#444" stroke-width="3"/>
    <!-- Wing -->
    <path d="M305 280 Q340 232 400 262 Q360 292 305 305 Z" fill="#c9d3dd" stroke="#444" stroke-width="3"/>
    <!-- Neck -->
    <path d="M404 266 Q430 230 440 200" fill="none" stroke="#f2f2f2" stroke-width="28" stroke-linecap="round"/>
    <path d="M404 266 Q430 230 440 200" fill="none" stroke="#444" stroke-width="2" opacity="0.3"/>
    <!-- Head -->
    <circle cx="462" cy="186" r="24" fill="#f2f2f2" stroke="#444" stroke-width="3"/>
    <!-- Beak and pouch -->
    <path d="M478 180 L572 192 L478 198 Z" fill="#ffb300" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
    <path d="M482 196 Q520 232 500 240 Q480 226 476 200 Z" fill="#ff7043" stroke="#444" stroke-width="2"/>
    <!-- Eye and cheek -->
    <circle cx="468" cy="180" r="5" fill="#111"/>
    <circle cx="470" cy="178" r="1.5" fill="#fff"/>
    <path d="M452 196 Q460 204 470 198" fill="none" stroke="#444" stroke-width="2"/>
    <!-- Motion lines -->
    <line x1="200" y1="270" x2="240" y2="270" stroke="#1a3c5e" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="296" x2="232" y2="296" stroke="#1a3c5e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Footer -->
  <rect x="0" y="540" width="800" height="60" fill="#1a3c5e"/>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff">2026-11-06 00:10:26 SGT (UTC+08:00)</text>
</svg>