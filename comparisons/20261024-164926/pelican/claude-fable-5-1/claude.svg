<text x="400" y="62" text-anchor="middle" font-size="52" fill="#d6323c" stroke="#222" stroke-width="2">PELICAN ON A BICYCLE</text>
<text x="400" y="560" text-anchor="middle" font-size="26" font-family="Georgia,serif" font-style="italic" fill="#222">"Pouch full of fish, legs full of regret, and absolutely no idea where the brakes are."</text>
