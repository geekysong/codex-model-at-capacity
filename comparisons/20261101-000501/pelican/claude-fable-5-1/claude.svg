<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">The Pelican Express</title>
  <desc id="d">A satirical cartoon of a pelican with a fish-stuffed beak pedaling a bicycle as a delivery courier.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <style>
      .ink{stroke:#2b2b2b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .title{font-family:Impact,'Arial Black',Arial,sans-serif;font-size:36px;font-weight:900;fill:#1b2a4a;letter-spacing:1px}
      .cap{font-family:Georgia,'Times New Roman',serif;font-size:19px;font-style:italic;fill:#222}
      .foot{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#333}
      .sign{font-family:'Arial Black',Arial,sans-serif;font-size:14px;font-weight:bold;fill:#fff}
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>
  <circle cx="700" cy="110" r="42" fill="#ffd84d" stroke="#f0b400" stroke-width="3"/>

  <!-- Drifting clouds (looping) -->
  <g opacity="0.95">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="24s" repeatCount="indefinite"/>
    <g fill="#fff" stroke="#cfe6f5" stroke-width="2">
      <ellipse cx="120" cy="120" rx="55" ry="22"/><ellipse cx="150" cy="105" rx="35" ry="22"/>
      <ellipse cx="420" cy="90" rx="60" ry="20"/><ellipse cx="450" cy="78" rx="30" ry="18"/>
      <ellipse cx="920" cy="120" rx="55" ry="22"/><ellipse cx="950" cy="105" rx="35" ry="22"/>
      <ellipse cx="1220" cy="90" rx="60" ry="20"/><ellipse cx="1250" cy="78" rx="30" ry="18"/>
    </g>
  </g>

  <!-- Title -->
  <text class="title" x="400" y="52" text-anchor="middle">THE PELICAN EXPRESS</text>

  <!-- Distant hills -->
  <path d="M0,420 Q120,360 240,415 Q330,380 420,420 Q540,370 660,418 Q740,395 800,420 L800,470 L0,470 Z" fill="#9ed47a" stroke="#6fae4e" stroke-width="3"/>

  <!-- Road -->
  <rect x="0" y="465" width="800" height="35" fill="#6e6e74"/>
  <line x1="0" y1="482" x2="800" y2="482" stroke="#ffe36b" stroke-width="4" stroke-dasharray="30 24">
    <animate attributeName="stroke-dashoffset" from="0" to="-54" dur="0.6s" repeatCount="indefinite"/>
  </line>

  <!-- Speed lines -->
  <g stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="260" x2="175" y2="260"/>
    <line x1="100" y1="300" x2="165" y2="300"/>
    <line x1="130" y1="340" x2="180" y2="340"/>
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="0.5s" repeatCount="indefinite"/>
  </g>

  <!-- Rear sign -->
  <g>
    <line x1="240" y1="372" x2="258" y2="408" class="ink"/>
    <rect x="178" y="330" width="112" height="44" rx="6" fill="#d8392b" stroke="#2b2b2b" stroke-width="3"/>
    <text class="sign" x="234" y="350" text-anchor="middle">FISH 4 U</text>
    <text class="sign" x="234" y="367" text-anchor="middle" font-size="11">30 MIN OR FREE</text>
  </g>

  <!-- Back leg (behind frame) -->
  <path d="M355,300 L420,410" stroke="#e08a1e" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8">
    <animate attributeName="d" values="M355,300 L360,410;M355,300 L390,380;M355,300 L420,410;M355,300 L390,440;M355,300 L360,410" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Bicycle frame -->
  <g class="ink" fill="none" stroke="#1f5fa8" stroke-width="7">
    <line x1="260" y1="410" x2="390" y2="410"/>
    <line x1="260" y1="410" x2="360" y2="300"/>
    <line x1="390" y1="410" x2="360" y2="300"/>
    <line x1="360" y1="300" x2="500" y2="310"/>
    <line x1="500" y1="310" x2="390" y2="410"/>
    <line x1="500" y1="310" x2="540" y2="410"/>
    <line x1="500" y1="310" x2="508" y2="278"/>
  </g>
  <!-- Handlebar -->
  <path d="M480,278 Q508,266 536,278" class="ink" fill="none" stroke-width="6"/>
  <!-- Seat -->
  <path d="M335,296 Q360,286 390,298 L380,306 Q360,300 342,306 Z" fill="#2b2b2b"/>
  <line x1="360" y1="300" x2="360" y2="312" class="ink"/>
  <!-- Chain -->
  <line x1="262" y1="398" x2="392" y2="392" stroke="#444" stroke-width="3"/>
  <line x1="262" y1="422" x2="392" y2="428" stroke="#444" stroke-width="3"/>
  <circle cx="390" cy="410" r="18" fill="none" stroke="#444" stroke-width="4"/>
  <circle cx="260" cy="410" r="10" fill="none" stroke="#444" stroke-width="4"/>

  <!-- Rear wheel -->
  <g transform="translate(260 410)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <circle r="55" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle r="47" fill="none" stroke="#bbb" stroke-width="2"/>
      <g stroke="#555" stroke-width="2">
        <line x1="-47" y1="0" x2="47" y2="0"/><line x1="0" y1="-47" x2="0" y2="47"/>
        <line x1="-33" y1="-33" x2="33" y2="33"/><line x1="-33" y1="33" x2="33" y2="-33"/>
        <line x1="-43" y1="-18" x2="43" y2="18"/><line x1="-43" y1="18" x2="43" y2="-18"/>
        <line x1="-18" y1="-43" x2="18" y2="43"/><line x1="18" y1="-43" x2="-18" y2="43"/>
      </g>
      <rect x="-6" y="-52" width="12" height="10" fill="#d8392b"/>
      <circle r="6" fill="#2b2b2b"/>
    </g>
  </g>
  <!-- Front wheel -->
  <g transform="translate(540 410)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <circle r="55" fill="none" stroke="#2b2b2b" stroke-width="9"/>
      <circle r="47" fill="none" stroke="#bbb" stroke-width="2"/>
      <g stroke="#555" stroke-width="2">
        <line x1="-47" y1="0" x2="47" y2="0"/><line x1="0" y1="-47" x2="0" y2="47"/>
        <line x1="-33" y1="-33" x2="33" y2="33"/><line x1="-33" y1="33" x2="33" y2="-33"/>
        <line x1="-43" y1="-18" x2="43" y2="18"/><line x1="-43" y1="18" x2="43" y2="-18"/>
        <line x1="-18" y1="-43" x2="18" y2="43"/><line x1="18" y1="-43" x2="-18" y2="43"/>
      </g>
      <rect x="-6" y="-52" width="12" height="10" fill="#d8392b"/>
      <circle r="6" fill="#2b2b2b"/>
    </g>
  </g>

  <!-- Pelican (bobbing) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 2;0 0" dur="1s" repeatCount="indefinite"/>
    <!-- tail -->
    <path d="M292,240 L255,225 L280,250 L250,258 L288,262 Z" fill="#fff" class="ink"/>
    <!-- body -->
    <ellipse cx="340" cy="255" rx="58" ry="42" fill="#fff" class="ink"/>
    <!-- belly shading -->
    <path d="M300,275 Q340,300 390,268" fill="none" stroke="#d9d9d9" stroke-width="4"/>
    <!-- neck -->
    <path d="M372,240 C400,235 408,200 428,182" fill="none" stroke="#2b2b2b" stroke-width="32" stroke-linecap="round"/>
    <path d="M372,240 C400,235 408,200 428,182" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="435" cy="170" r="23" fill="#fff" class="ink"/>
    <!-- helmet -->
    <path d="M412,165 A24,24 0 0 1 459,165 Z" fill="#d8392b" class="ink"/>
    <line x1="420" y1="178" x2="413" y2="166" class="ink" stroke-width="2"/>
    <circle cx="436" cy="150" r="4" fill="#ffd84d"/>
    <!-- eye -->
    <circle cx="446" cy="167" r="6" fill="#fff" class="ink" stroke-width="2"/>
    <circle cx="448" cy="168" r="3" fill="#2b2b2b"/>
    <path d="M438,158 L452,162" class="ink" stroke-width="2.5"/>
    <!-- beak upper -->
    <path d="M452,164 L585,183 L456,181 Z" fill="#f5a623" class="ink"/>
    <!-- bulging pouch stuffed with fish -->
    <path d="M454,181 L585,186 Q570,262 500,258 Q450,250 454,181 Z" fill="#e8822a" class="ink"/>
    <!-- fish lumps in pouch -->
    <path d="M470,215 Q485,205 500,218 Q515,206 530,220" fill="none" stroke="#b85f12" stroke-width="3" stroke-linecap="round"/>
    <!-- fish tail poking out -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 582 184;6 582 184;-6 582 184" dur="0.4s" repeatCount="indefinite"/>
      <path d="M582,182 L608,165 L603,184 L612,202 Z" fill="#5fb3c9" class="ink"/>
    </g>
    <!-- wing reaching to handlebar -->
    <path d="M318,232 Q400,212 504,282 L498,294 Q398,248 328,262 Z" fill="#fff" class="ink"/>
    <path d="M400,236 Q440,236 470,262" fill="none" stroke="#d9d9d9" stroke-width="3"/>
    <!-- sweat drops -->
    <g fill="#5fb3c9">
      <ellipse cx="414" cy="150" rx="3" ry="5"/>
      <ellipse cx="470" cy="150" rx="3" ry="5"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Front leg -->
  <path d="M355,300 L420,410" stroke="#f5a623" stroke-width="9" stroke-linecap="round" fill="none">
    <animate attributeName="d" values="M355,300 L420,410;M355,300 L390,440;M355,300 L360,410;M355,300 L390,380;M355,300 L420,410" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Crank and pedals -->
  <g transform="translate(390 410)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
      <rect x="22" y="-5" width="18" height="10" rx="2" fill="#2b2b2b"/>
      <rect x="-40" y="-5" width="18" height="10" rx="2" fill="#2b2b2b"/>
    </g>
    <circle r="5" fill="#777"/>
  </g>

  <!-- Caption band -->
  <rect x="0" y="500" width="800" height="40" fill="#fff8e1"/>
  <text class="cap" x="400" y="526" text-anchor="middle">"Fastest seafood courier in town. Not one fish has ever arrived."</text>

  <!-- Footer -->
  <rect x="0" y="540" width="800" height="60" fill="#1b2a4a"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#ffd84d" stroke-width="3"/>
  <text class="foot" x="400" y="575" text-anchor="middle" fill="#fff" style="fill:#ffffff">2026-11-01 00:05:01 SGT (UTC+08:00)</text>
</svg>