<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect x="0" y="0" width="600" height="400" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">Grid Route Map: A1 to E5 avoiding blocked B2, C3, D4</text>

  <!-- Streets: horizontal -->
  <g stroke="#9a9a9a" stroke-width="4" stroke-linecap="round">
    <line x1="130" y1="70" x2="410" y2="70"/>
    <line x1="130" y1="130" x2="410" y2="130"/>
    <line x1="130" y1="190" x2="410" y2="190"/>
    <line x1="130" y1="250" x2="410" y2="250"/>
    <line x1="130" y1="310" x2="410" y2="310"/>
  </g>
  <!-- Streets: vertical -->
  <g stroke="#9a9a9a" stroke-width="4" stroke-linecap="round">
    <line x1="130" y1="70" x2="130" y2="310"/>
    <line x1="200" y1="70" x2="200" y2="310"/>
    <line x1="270" y1="70" x2="270" y2="310"/>
    <line x1="340" y1="70" x2="340" y2="310"/>
    <line x1="410" y1="70" x2="410" y2="310"/>
  </g>

  <!-- Route highlight: A1-B1-C1-D1-E1-E2-E3-E4-E5 (8 segments) -->
  <polyline points="130,70 200,70 270,70 340,70 410,70 410,130 410,190 410,250 410,310" fill="none" stroke="#1e6fe0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Blocked intersections: red X's -->
  <g stroke="#d62828" stroke-width="3" stroke-linecap="round">
    <line x1="193" y1="123" x2="207" y2="137"/>
    <line x1="207" y1="123" x2="193" y2="137"/>
    <line x1="263" y1="183" x2="277" y2="197"/>
    <line x1="277" y1="183" x2="263" y2="197"/>
    <line x1="333" y1="243" x2="347" y2="257"/>
    <line x1="347" y1="243" x2="333" y2="257"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="130" cy="70" r="7" fill="#2a9d3a" stroke="#fff" stroke-width="2"/>
  <circle cx="410" cy="310" r="7" fill="#7b2cbf" stroke="#fff" stroke-width="2"/>
  <text x="118" y="86" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2a9d3a">Start</text>
  <text x="422" y="330" text-anchor="start" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7b2cbf">End</text>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#333">
    <!-- Row 1 -->
    <text x="136" y="62">A1</text>
    <text x="206" y="62">B1</text>
    <text x="276" y="62">C1</text>
    <text x="346" y="62">D1</text>
    <text x="416" y="62">E1</text>
    <!-- Row 2 -->
    <text x="136" y="122">A2</text>
    <text x="206" y="122">B2</text>
    <text x="276" y="122">C2</text>
    <text x="346" y="122">D2</text>
    <text x="416" y="122">E2</text>
    <!-- Row 3 -->
    <text x="136" y="182">A3</text>
    <text x="206" y="182">B3</text>
    <text x="276" y="182">C3</text>
    <text x="346" y="182">D3</text>
    <text x="416" y="182">E3</text>
    <!-- Row 4 -->
    <text x="136" y="242">A4</text>
    <text x="206" y="242">B4</text>
    <text x="276" y="242">C4</text>
    <text x="346" y="242">D4</text>
    <text x="416" y="242">E4</text>
    <!-- Row 5 -->
    <text x="136" y="302">A5</text>
    <text x="206" y="302">B5</text>
    <text x="276" y="302">C5</text>
    <text x="346" y="302">D5</text>
    <text x="416" y="302">E5</text>
  </g>

  <!-- Route summary -->
  <text x="300" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e6fe0" font-weight="bold">Route length: 8 street segments</text>
  <text x="300" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#d62828">Red X = blocked intersection (B2, C3, D4)</text>

  <!-- Footer with timestamp -->
  <line x1="40" y1="450" x2="560" y2="450" stroke="none"/>
  <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#555">2026-10-30 00:11:21 SGT (UTC+08:00)</text>
</svg>