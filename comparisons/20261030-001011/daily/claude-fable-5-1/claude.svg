    <line x1="470" y1="100" x2="500" y2="100" stroke="#1e63d6" stroke-width="5" stroke-linecap="round"/>
    <text x="508" y="104">Shortest route</text>
    <line x1="479" y1="124" x2="491" y2="136" stroke="#d62020" stroke-width="3" stroke-linecap="round"/>
    <line x1="491" y1="124" x2="479" y2="136" stroke="#d62020" stroke-width="3" stroke-linecap="round"/>
