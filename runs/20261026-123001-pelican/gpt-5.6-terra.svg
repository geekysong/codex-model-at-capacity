  </g>

  <text x="400" y="64" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" fill="#17212b">PELICAN PEDAL PANIC</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#31485b">“Sustainable transport, unsustainable fish anxiety.”</text>

