<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a pelican proudly riding a tiny bicycle while fish attempt to escape from its enormous beak.</desc>
  <style>
    .ink { stroke:#17212b; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
    .thin { stroke:#17212b; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .wheel { animation: spin 1.15s linear infinite; transform-origin:center; }
    .bob { animation: bob .58s ease-in-out infinite alternate; transform-origin:400px 310px; }
    .legA { animation: pedalA 1.15s linear infinite; transform-origin:390px 397px; }
    .legB { animation: pedalB 1.15s linear infinite; transform-origin:430px 397px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes bob { to { transform:translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform:rotate(28deg); } }
    @keyframes pedalB { 50% { transform:rotate(-28deg); } }
  </style>

  <rect width="800" height="600" fill="#bdeaff"/>
