  </g>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="41" font-weight="900" fill="#233747">TOUR DE FISH</text>
  <text x="400" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#a64b32">ALL BEAK. NO BRAKES.</text>

