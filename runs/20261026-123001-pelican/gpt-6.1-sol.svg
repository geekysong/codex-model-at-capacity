  <text x="183" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#233747">
    <tspan x="183">“It's aerodynamic</tspan>
    <tspan x="183" dy="21">if I believe!”</tspan>
  </text>

  <rect x="0" y="501" width="800" height="99" fill="#233747"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff5d9">He bought a road bike. The beak came with cargo space.</text>
