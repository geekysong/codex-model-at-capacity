      <circle r="9" fill="#233747"/>
    </g>
    <g id="fish">
      <path d="M0 0Q18-16 37 0Q18 16 0 0L-12-10V10Z" fill="#72c2bd" stroke="#233747" stroke-width="2.5"/>
      <circle cx="28" cy="-2" r="2.4" fill="#233747"/>
    </g>
  </defs>

