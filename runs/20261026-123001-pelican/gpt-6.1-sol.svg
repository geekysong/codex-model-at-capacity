<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a huge beak full of fish. The wheels spin, the pedals turn, and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#e6d9b8" stroke-width="1"/>
    </pattern>
