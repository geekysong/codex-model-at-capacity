<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly delivering absolutely nothing.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#263238" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#263238;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#263238}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="46" fill="#ffd166" stroke="#263238" stroke-width="5"/>
  <path d="M0 360 Q120 300 250 355 T510 345 T800 350 V470 H0Z" fill="#8bcf78"/>
  <path d="M0 420 Q170 390 330 420 T650 415 T800 425 V560 H0Z" fill="#5aa65a"/>
  <path d="M0 485 Q185 462 370 486 T800 480 V560 H0Z" fill="#4b5563"/>
  <path d="M0 515 H800" stroke="#f8e16c" stroke-width="8" stroke-dasharray="42 32"/>

  <text x="40" y="70" class="label" font-size="34" font-weight="900" fill="#ffffff" stroke="#263238" stroke-width="2" paint-order="stroke">
    THE PELICAN PEDAL EXPRESS
  </text>
  <text x="42" y="104" class="label" font-size="19" font-weight="700">
    “Delivering fishy promises at one beak per hour.”
  </text>

  <g filter="url(#shadow)">
    <!-- bicycle -->
    <g id="bike">
      <g id="wheelBack">
        <circle cx="285" cy="450" r="73" fill="#d9eef5" class="ink"/>
        <circle cx="285" cy="450" r="8" fill="#263238"/>
        <g stroke="#607d8b" stroke-width="3">
          <path d="M285 377V523M212 450H358M233 398L337 502M337 398L233 502"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 285 450" to="360 285 450" dur="2.2s" repeatCount="indefinite"/>
      </g>
      <g id="wheelFront">
        <circle cx="585" cy="450" r="73" fill="#d9eef5" class="ink"/>
        <circle cx="585" cy="450" r="8" fill="#263238"/>
        <g stroke="#607d8b" stroke-width="3">
          <path d="M585 377V523M512 450H658M533 398L637 502M637 398L533 502"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 585 450" to="360 585 450" dur="2.2s" repeatCount="indefinite"/>
      </g>

      <path d="M285 450 L390 370 L500 450 L385 450 Z" fill="#ef476f" class="ink"/>
      <path d="M390 370 L500 450 L585 450 L470 365 Z" fill="none" class="ink"/>
      <path d="M390 370 L365 330" fill="none" class="ink"/>
      <path d="M365 330 H420" fill="none" class="ink"/>
      <path d="M500 450 L525 350" fill="none" class="ink"/>
      <path d="M525 350 H560" fill="none" class="ink"/>
      <path d="M385 450 L350 405" fill="none" class="ink"/>
      <circle cx="385" cy="450" r="17" fill="#ffd166" class="ink"/>
      <g id="pedal">
        <path d="M385 450 L420 475 M385 450 L350 425" fill="none" stroke="#263238" stroke-width="7"/>
        <rect x="416" y="471" width="24" height="8" rx="4" fill="#263238"/>
        <rect x="330" y="421" width="24" height="8" rx="4" fill="#263238"/>
        <animateTransform attributeName="transform" type="rotate" from="0 385 450" to="360 385 450" dur="1.1s" repeatCount="indefinite"/>
      </g>
      <path d="M575 350 Q590 322 605 350" fill="none" class="ink"/>
      <path d="M550 350 H625" fill="none" class="ink"/>
    </g>

    <!-- pelican -->
    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.1s" repeatCount="indefinite"/>
      <ellipse cx="430" cy="285" rx="91" ry="108" fill="#f4f1de" class="ink"/>
      <path d="M380 260 Q330 215 352 164 Q382 125 430 150 Q476 128 500 176 Q518 224 477 266Z" fill="#f4f1de" class="ink"/>
      <path d="M390 193 Q435 175 478 207" fill="none" stroke="#ef476f" stroke-width="15"/>
      <circle cx="415" cy="188" r="10" fill="#263238"/>
      <circle cx="418" cy="185" r="3.5" fill="#fff"/>
      <path d="M357 214 Q300 225 270 260 Q315 292 390 251 Q413 238 430 210Z" fill="#ffb703" class="ink"/>
      <path d="M271 260 Q334 256 393 246" fill="none" stroke="#d97706" stroke-width="5"/>
      <path d="M439 290 Q505 245 530 315 Q505 360 450 350Z" fill="#d8d3bf" class="ink"/>
      <path d="M425 374 L393 430 M468 374 L500 430" fill="none" class="ink"/>
      <path d="M382 429 H415 M490 429 H523" fill="none" class="ink"/>
      <path d="M399 302 Q430 322 462 301" fill="none" stroke="#263238" stroke-width="5"/>
      <path d="M445 260 Q475 240 500 267" fill="none" stroke="#263238" stroke-width="5"/>
      <path d="M352 165 Q335 132 306 145" fill="none" stroke="#263238" stroke-width="7"/>
      <text x="505" y="245" class="label" font-size="18" font-weight="800" transform="rotate(12 505 245)">HONK!</text>
    </g>
  </g>

  <path d="M110 390 q25 -25 50 0 q25 -25 50 0" fill="none" stroke="#607d8b" stroke-width="6"/>
  <path d="M655 275 q20 -20 40 0 q20 -20 40 0" fill="none" stroke="#607d8b" stroke-width="6"/>

  <rect x="18" y="548" width="764" height="38" rx="10" fill="#ffffff" fill-opacity=".9" stroke="#263238" stroke-width="3"/>
  <text x="400" y="574" text-anchor="middle" class="label" font-size="18" font-weight="700">
    2026-10-28 06:30:01 SGT (UTC+08:00)
  </text>
</svg>