<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICAN COMMUTE</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly carrying an oversized fish.</desc>
  <defs>
    <style>
      .ink{stroke:#17202a;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
      .wheel{fill:none;stroke:#17202a;stroke-width:8}
      .spoke{stroke:#607080;stroke-width:3}
    </style>
    <path id="wheelPath" d="M0,0 m-58,0 a58,58 0 1,0 116,0 a58,58 0 1,0 -116,0"/>
  </defs>

  <rect width="800" height="600" fill="#dff3ff"/>
  <circle cx="105" cy="105" r="43" fill="#ffd166" opacity=".9"/>
  <path d="M0 425 Q130 390 255 425 T510 425 T800 425 V520 H0Z" fill="#8bd17c"/>
  <path d="M0 468 Q150 442 300 468 T600 468 T800 468" fill="none" stroke="#4d9b55" stroke-width="7"/>
