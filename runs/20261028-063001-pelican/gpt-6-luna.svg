  <text x="400" y="57" text-anchor="middle" class="label" font-size="34" font-weight="900">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="18" font-style="italic">“Why fly to work when you can pedal your way into the headlines?”</text>

  <!-- bicycle -->
  <g transform="translate(0,5)">
    <g transform="translate(278 412)">
      <circle r="62" class="wheel"/>
      <g>
        <line x1="0" y1="-58" x2="0" y2="58" class="spoke"/>
        <line x1="-58" y1="0" x2="58" y2="0" class="spoke"/>
        <line x1="-41" y1="-41" x2="41" y2="41" class="spoke"/>
        <line x1="-41" y1="41" x2="41" y2="-41" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(548 412)">
      <circle r="62" class="wheel"/>
      <g>
        <line x1="0" y1="-58" x2="0" y2="58" class="spoke"/>
        <line x1="-58" y1="0" x2="58" y2="0" class="spoke"/>
        <line x1="-41" y1="-41" x2="41" y2="41" class="spoke"/>
        <line x1="-41" y1="41" x2="41" y2="-41" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>
    <path d="M278 412 L362 320 L458 412 L548 412 L438 294 L362 320 L278 412 M438 294 L548 412" fill="none" class="ink" stroke="#e4572e"/>
    <circle cx="438" cy="412" r="18" fill="#ffd166" class="ink"/>
