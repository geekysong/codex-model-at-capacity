    <path d="M398 367 L420 355 M463 449 L488 439" class="ink"/>
    <path d="M438 294 L425 268 L449 268" fill="none" class="ink"/>
    <path d="M425 268 L392 269" class="ink"/>
    <path d="M548 412 L570 280 L598 279" fill="none" class="ink"/>
    <path d="M563 286 Q585 265 614 278" fill="none" class="ink"/>
  </g>

  <!-- pelican and fish -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="420" cy="252" rx="70" ry="86" fill="#f7f4ed" class="ink"/>
