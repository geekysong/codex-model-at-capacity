<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical pelican rides a bicycle while trying to deliver an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7f2"/>
      <stop offset="1" stop-color="#e9fbf5"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#626875"/>
      <stop offset="1" stop-color="#343944"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1e2730" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#202a35;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202a35}
      .small{font-size:18px;font-weight:700;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="48" fill="#fff4a8" opacity=".85"/>
  <path d="M0 320 Q120 250 250 320 T520 315 T800 300 V430 H0Z" fill="#8bcf93"/>
  <path d="M0 365 Q170 315 315 365 T620 355 T800 350 V430 H0Z" fill="#68b57c"/>
  <path d="M0 420 H800 V570 H0Z" fill="url(#road)"/>
  <path d="M0 500 H800" stroke="#f9db72" stroke-width="8" stroke-dasharray="48 35" opacity=".9"/>

  <g filter="url(#shadow)">
    <rect x="70" y="38" width="660" height="82" rx="22" fill="#fff" class="ink"/>
    <text x="400" y="78" text-anchor="middle" class="label" font-size="35" font-weight="900">PELICAN PEDAL PANIC</text>
    <text x="400" y="104" text-anchor="middle" class="label small">“Delivering fish faster than common sense.”</text>
  </g>

  <g transform="translate(0 8)">
    <g id="bike">
      <circle cx="245" cy="445" r="83" fill="none" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 245 445" to="360 245 445" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="585" cy="445" r="83" fill="none" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 585 445" to="360 585 445" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#202a35" stroke-width="3" opacity=".7">
        <path d="M245 362V528M162 445H328M186 386L304 504M304 386L186 504"/>
        <path d="M585 362V528M502 445H668M526 386L644 504M644 386L526 504"/>
      </g>
      <path d="M245 445 L355 335 L470 445 L245 445 M355 335 L585 445 M470 445 L430 315" fill="none" class="ink"/>
      <path d="M335 333 H385" class="ink"/>
      <path d="M420 315 H455" class="ink"/>
      <circle cx="355" cy="445" r="14" fill="#f4b942" class="ink"/>
      <path d="M355 445 L326 469 M355 445 L385 419" class="ink"/>
      <circle cx="326" cy="469" r="8" fill="#ef6f61" class="ink"/>
      <circle cx="385" cy="419" r="8" fill="#ef6f61" class="ink"/>
      <path d="M585 445 L602 337" class="ink"/>
      <path d="M602 337 Q620 327 631 342" fill="none" class="ink"/>
      <path d="M430 315 Q420 292 434 280" fill="none" class="ink"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.1s" repeatCount="indefinite"/>
      <ellipse cx="430" cy="285" rx="82" ry="101" fill="#f4f0df" class="ink"/>
      <path d="M385 254 Q350 286 369 337 Q402 321 430 285" fill="#d6d3c5" class="ink"/>
      <path d="M412 188 Q430 145 468 167 Q500 184 487 219 Q475 245 440 237Z" fill="#f4f0df" class="ink"/>
      <path d="M467 205 Q553 214 618 254 Q548 285 466 247 Q443 235 467 205Z" fill="#efad55" class="ink"/>
      <path d="M518 234 Q557 246 590 257 Q552 270 517 258Z" fill="#e88443" opacity=".8"/>
      <circle cx="455" cy="196" r="9" fill="#202a35"/>
      <path d="M430 168 Q447 148 466 163" fill="none" class="ink"/>
      <path d="M397 288 Q360 315 344 355" fill="none" class="ink"/>
      <path d="M460 288 Q503 307 522 353" fill="none" class="ink"/>
      <path d="M430 386 Q409 421 405 446" class="ink" fill="none"/>
      <path d="M474 384 Q492 418 496 446" class="ink" fill="none"/>
      <path d="M393 445 Q413 453 430 445" class="ink" fill="none"/>
      <path d="M486 445 Q506 453 522 445" class="ink" fill="none"/>
      <path d="M403 228 Q425 247 449 232" fill="none" class="ink"/>
      <path d="M510 217 Q535 205 553 218" fill="none" stroke="#202a35" stroke-width="4"/>
      <text x="430" y="301" text-anchor="middle" class="label" font-size="19" font-weight="900">HONK!</text>
      <path d="M547 194 Q572 173 599 191" fill="none" class="ink"/>
      <path d="M589 178 L603 163 M606 189 L625 182" stroke="#ef6f61" stroke-width="5"/>
      <path d="M554 258 Q578 278 605 269" fill="none" stroke="#202a35" stroke-width="4"/>
    </g>

    <g transform="translate(0 0)">
      <path d="M590 275 Q650 255 704 285 L692 351 Q631 366 584 335Z" fill="#f6d35e" class="ink"/>
      <path d="M610 290 Q653 304 691 294" fill="none" stroke="#d18b36" stroke-width="5"/>
      <path d="M618 328 Q656 340 686 326" fill="none" stroke="#d18b36" stroke-width="5"/>
      <path d="M694 287 L730 270 L716 315Z" fill="#ef6f61" class="ink"/>
      <text x="650" y="319" text-anchor="middle" class="label" font-size="17" font-weight="900">FISH</text>
    </g>

    <path d="M145 360 Q125 342 105 355" fill="none" class="ink"/>
    <path d="M105 355 l-14 -10 M105 355 l-16 7" stroke="#202a35" stroke-width="5"/>
    <text x="92" y="335" class="label" font-size="17" font-weight="800">WHO NEEDS A CAR?</text>
    <text x="112" y="365" class="label" font-size="15" font-weight="700">— the fish, apparently</text>
  </g>

  <rect x="24" y="548" width="752" height="34" rx="10" fill="#ffffff" opacity=".92"/>
  <text x="400" y="571" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 06:31:22 SGT (UTC+08:00)</text>
</svg>