  <text x="30" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Knight moves from square 6</text>

  <g stroke="#374151" stroke-width="2">
    <rect x="30" y="45" width="40" height="40" fill="#ffffff"/>
    <rect x="70" y="45" width="40" height="40" fill="#ffffff"/>
    <rect x="110" y="45" width="40" height="40" fill="#ffffff"/>
    <rect x="150" y="45" width="40" height="40" fill="#fbbf24"/>
    <rect x="30" y="85" width="40" height="40" fill="#ffffff"/>
    <rect x="70" y="85" width="40" height="40" fill="#60a5fa"/>
    <rect x="110" y="85" width="40" height="40" fill="#ffffff"/>
    <rect x="150" y="85" width="40" height="40" fill="#ffffff"/>
    <rect x="30" y="125" width="40" height="40" fill="#ffffff"/>
    <rect x="70" y="125" width="40" height="40" fill="#ffffff"/>
    <rect x="110" y="125" width="40" height="40" fill="#ffffff"/>
    <rect x="150" y="125" width="40" height="40" fill="#fbbf24"/>
    <rect x="30" y="165" width="40" height="40" fill="#fbbf24"/>
    <rect x="70" y="165" width="40" height="40" fill="#ffffff"/>
    <rect x="110" y="165" width="40" height="40" fill="#fbbf24"/>
    <rect x="150" y="165" width="40" height="40" fill="#ffffff"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#111827">
    <text x="50" y="65">1</text><text x="90" y="65">2</text><text x="130" y="65">3</text><text x="170" y="65">4</text>
    <text x="50" y="105">5</text><text x="90" y="105" font-weight="bold">6</text><text x="130" y="105">7</text><text x="170" y="105">8</text>
    <text x="50" y="145">9</text><text x="90" y="145">10</text><text x="130" y="145">11</text><text x="170" y="145">12</text>
    <text x="50" y="185">13</text><text x="90" y="185">14</text><text x="130" y="185">15</text><text x="170" y="185">16</text>
