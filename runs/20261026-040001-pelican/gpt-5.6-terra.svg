<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a tiny bicycle.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#87d8f5"/>
      <stop offset="1" stop-color="#e8f8c8"/>
    </linearGradient>
    <style>
      .ink{stroke:#202638;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#202638;stroke-width:3;stroke-linecap:round;fill:none}
      .wheel{animation:spin 1s linear infinite;transform-origin:center}
      .bob{animation:bob .7s ease-in-out infinite alternate;transform-origin:400px 330px}
      .legA{animation:pedalA 1s linear infinite;transform-origin:410px 392px}
      .legB{animation:pedalB 1s linear infinite;transform-origin:410px 392px}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-7px) rotate(-1deg)}}
      @keyframes pedalA{to{transform:rotate(360deg)}}
      @keyframes pedalB{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 315 Q130 270 260 322 T530 300 T800 320 V500 H0Z" fill="#94c85c"/>
  <path d="M0 431 Q150 385 310 435 T610 414 T800 438 V500 H0Z" fill="#71ad51"/>
  <path d="M0 470 Q155 435 285 474 T530 452 T800 470 V500 H0Z" fill="#f2c34f" class="ink"/>
  <path d="M26 432 Q95 392 163 417" class="thin" opacity=".45"/>
  <path d="M635 376 q15-72 26 0M662 378q11-53 23 0M685 381q15-64 27 0" class="thin" stroke="#4b8a42"/>

  <g font-family="Arial, sans-serif" fill="#202638">
    <text x="400" y="61" text-anchor="middle" font-size="42" font-weight="900">PELICAN PEDALS TO GLORY!</text>
    <text x="400" y="90" text-anchor="middle" font-size="18" font-weight="700">Local bird solves traffic with one extremely tiny bicycle.</text>
  </g>

  <g opacity=".95">
    <path d="M82 140 q19-22 38 0q-19 12-38 0M142 177q17-18 34 0q-17 10-34 0M674 150q17-19 34 0q-17 10-34 0" fill="none" stroke="#202638" stroke-width="4"/>
    <circle cx="728" cy="104" r="39" fill="#ffe777"/>
    <path d="M728 49v-15M728 174v-15M783 104h-15M688 104h-15M767 65l-11 11M700 143l-11 11M767 143l-11-11M700 65l-11-11" class="thin" stroke="#e6a938"/>
  </g>

  <g>
    <rect x="548" y="205" width="174" height="91" rx="10" fill="#fff4c9" class="ink"/>
    <path d="M568 226h134M568 250h105M568 274h121" class="thin"/>
    <text x="635" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#d45342">BIKE LANE</text>
    <text x="635" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#202638">FOR BIRDS WITH</text>
    <text x="635" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#202638">IMPORTANT MEETINGS</text>
    <path d="M635 296v70" class="ink"/>
  </g>

  <g transform="translate(0 5)">
    <g class="wheel" style="transform-origin:270px 431px">
      <circle cx="270" cy="431" r="70" fill="#fbf5db" class="ink"/>
      <circle cx="270" cy="431" r="10" fill="#f05c52" class="ink"/>
      <path d="M270 365v132M204 431h132M223 384l94 94M317 384l-94 94" class="thin" opacity=".65"/>
    </g>
    <g class="wheel" style="transform-origin:487px 431px">
      <circle cx="487" cy="431" r="70" fill="#fbf5db" class="ink"/>
      <circle cx="487" cy="431" r="10" fill="#f05c52" class="ink"/>
      <path d="M487 365v132M421 431h132M440 384l94 94M534 384l-94 94" class="thin" opacity=".65"/>
    </g>

    <path d="M270 431 L337 337 L408 431 Z M337 337 L461 337 L408 431 M461 337 L487 431 M408 431 L487 431" fill="none" stroke="#de4e46" stroke-width="9" stroke-linejoin="round"/>
    <path d="M461 337l26-54M475 283h41M337 337l-14-32h-47" fill="none" stroke="#202638" stroke-width="8" stroke-linecap="round"/>
    <path d="M401 430h31" class="ink" stroke-width="8"/>

    <g class="bob">
      <path d="M343 330 q-20 4-29 23q20 5 39-6" fill="#202638"/>
      <path d="M343 330q12-102 80-123q74-19 92 68q6 53-36 99q-54 27-109-1q-39-15-27-43Z" fill="#f4f3e8" class="ink"/>
      <path d="M409 214q-26 43-12 112q13 32 47 43q37-33 40-90q2-50-27-69Z" fill="#c5d2d6" class="ink"/>
      <path d="M402 240q-19-63 29-83q54-17 68 42q-27 26-97 41Z" fill="#f4f3e8" class="ink"/>
      <path d="M478 205q39-23 75 7q-32 40-74 28Z" fill="#f5ae4c" class="ink"/>
      <path d="M493 223q34 1 54-11" class="thin"/>
      <circle cx="459" cy="201" r="9" fill="#202638"/>
      <circle cx="462" cy="198" r="3" fill="white"/>
      <path d="M429 190q17-16 31-3" class="thin"/>
      <path d="M405 274q34 18 69 1" class="thin"/>
      <path d="M391 288q-55 9-67 44q33 25 79-2" fill="#c5d2d6" class="ink"/>
      <path d="M398 320q-37 10-54 33" class="thin"/>
      <path d="M466 284q24 18 38 55" fill="none" class="ink"/>
      <path d="M499 334q13 1 22-7q7 17-14 23Z" fill="#f5ae4c" class="ink"/>

      <g class="legA">
        <path d="M410 392q-33 18-58 52" fill="none" stroke="#d58d45" stroke-width="15" stroke-linecap="round"/>
        <path d="M344 443q-16 0-21 12q21 8 38-3" fill="#f5ae4c" class="ink"/>
      </g>
      <g class="legB">
        <path d="M410 392q34 10 64 40" fill="none" stroke="#d58d45" stroke-width="15" stroke-linecap="round"/>
        <path d="M468 430q14-8 24 3q-15 17-34 9" fill="#f5ae4c" class="ink"/>
      </g>
      <circle cx="410" cy="392" r="15" fill="#f5ae4c" class="ink"/>
      <path d="M411 392l23-12" class="thin"/>
    </g>
  </g>

  <g>
    <path d="M69 350q16-37 56-23q22 12 9 42q-29 22-62 5Z" fill="#fff" class="ink"/>
    <text x="101" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#202638">NO</text>
    <text x="101" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#202638">HONKING!</text>
    <path d="M134 361l21 17l-29-4" fill="#fff" class="ink"/>
  </g>

  <rect y="510" width="800" height="90" fill="#202638"/>
  <text x="400" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#ffe777">“If I can carry a fish, I can carry the commute.”</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">2026-10-26 04:02:29 SGT (UTC+08:00)</text>
</svg>