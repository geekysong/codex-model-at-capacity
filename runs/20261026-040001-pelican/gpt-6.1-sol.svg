    <path d="M81 188Q81 173 96 173H241Q256 173 256 188V223Q256 238 241 238H214L231 259L193 238H96Q81 238 81 223Z" fill="#fffdf6" stroke="#233c46" stroke-width="3"/>
    <text x="168" y="199" text-anchor="middle" font-size="17" font-weight="bold">“I was promised</text>
    <text x="168" y="222" text-anchor="middle" font-size="17" font-weight="bold">a cycle lane!”</text>
    <text x="651" y="283" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing="1">PERFORMANCE</text>
    <text x="651" y="301" text-anchor="middle" font-size="13" font-weight="bold" letter-spacing="1">INCENTIVE</text>
