    <path d="M556 204c-14-18 2-35 20-26 5-26 40-24 44 2 23-8 38 15 18 24Z"/>
  </g>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" fill="#233c46" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52676a">One bird. Two wheels. Absolutely no brakes for fish.</text>

  <path d="M0 480H800" stroke="#8aa692" stroke-width="4"/>
  <ellipse cx="398" cy="485" rx="265" ry="13" fill="#b5c5a3" opacity=".55"/>
  <g stroke="#233c46" stroke-linecap="round" stroke-linejoin="round">
    <use href="#wheel" x="246" y="397"/>
    <use href="#wheel" x="551" y="397"/>

