  <rect x="0" y="508" width="800" height="92" fill="#233c46"/>
  <text x="400" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff4d9">His carbon footprint is down. His fish bill is up.</text>
  <text x="400" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#d9e7cc">2026-10-26 04:01:15 SGT (UTC+08:00)</text>
