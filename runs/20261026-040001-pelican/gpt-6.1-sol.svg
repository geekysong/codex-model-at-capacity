<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish dangling ahead as motivation. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1">
      <rect width="1" height="1" fill="none"/>
    </pattern>
    <g id="wheel">
      <circle r="82" fill="#fff9e9" stroke="#233c46" stroke-width="12"/>
      <circle r="73" fill="none" stroke="#9eb9b5" stroke-width="3"/>
      <g stroke="#718c91" stroke-width="3">
        <path d="M-72 0H72M0-72V72M-51-51L51 51M-51 51L51-51"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#233c46"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <path d="M0 325Q110 280 220 325T440 325T660 325T880 325V492H0Z" fill="#d9e7cc"/>
