<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Two-Wheeled Takeover</title>
  <desc id="desc">A smug pelican pedals a bicycle past a startled fish, with gently spinning wheels and bobbing motion.</desc>
  <defs>
    <style>
      .ink{stroke:#203047;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .8s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#b9e9ee"/>
  <circle cx="683" cy="115" r="53" fill="#ffd56b"/>
  <path d="M0 366 Q120 333 240 364 T480 359 T800 363 V520 H0Z" fill="#79c9a5"/>
  <path d="M0 411 Q140 389 270 412 T540 408 T800 410" fill="none" stroke="#55ae91" stroke-width="5"/>
  <path d="M0 475 H800" stroke="#203047" stroke-width="8"/>
  <path d="M58 475h43m31 0h31m31 0h43m31 0h31m31 0h43m31 0h31m31 0h43m31 0h31m31 0h43m31 0h31" stroke="#fff3c8" stroke-width="5" stroke-linecap="round"/>

  <text x="40" y="57" fill="#203047" font-family="Trebuchet MS,Arial,sans-serif" font-size="27" font-weight="900" letter-spacing="1">THE PELICAN’S TWO-WHEELED TAKEOVER</text>
  <text x="42" y="87" fill="#436075" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" font-weight="700">“I’m technically a bird in a bike lane.”</text>

  <!-- Startled fish audience -->
  <g transform="translate(650 332)">
    <path d="M0 17 Q21 -2 43 17 Q22 38 0 17Z" fill="#ff977b" class="ink"/>
    <path d="M0 17l-16-13v27z" fill="#ff977b" class="ink"/>
    <circle cx="31" cy="13" r="3.5" fill="#203047"/>
    <path d="M20 26q7-7 13 0" fill="none" class="ink" stroke-width="3"/>
    <text x="-7" y="-6" fill="#203047" font-family="Arial,sans-serif" font-size="18" font-weight="900">?!</text>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M230 421 L318 421 L362 341 L287 341 Z" stroke="#f05b62" stroke-width="8"/>
    <path d="M318 421 L400 421 L362 341" stroke="#f05b62" stroke-width="8"/>
    <path d="M400 421 L431 342" stroke="#203047" stroke-width="7"/>
    <path d="M421 342h30m-21 0 20 79" stroke="#203047" stroke-width="7"/>
    <path d="M287 341h-39m19 0-26 80" stroke="#203047" stroke-width="7"/>
    <path d="M306 326h48" stroke="#203047" stroke-width="8"/>
    <path d="M350 335l15 7" stroke="#203047" stroke-width="6"/>
    <path d="M400 421l-26 19m26-19 22 20" stroke="#203047" stroke-width="6"/>
  </g>
  <g class="wheel" fill="none" stroke="#203047" stroke-width="6">
    <circle cx="230" cy="421" r="53" fill="#e8f5f2"/>
    <circle cx="431" cy="421" r="53" fill="#e8f5f2"/>
    <path d="M230 368v106m-53-53h106m-90-37 74 74m0-74-74 74"/>
  </g>
  <circle cx="318" cy="421" r="10" fill="#ffd56b" class="ink"/>
  <path d="M318 421l-29-31m29 31 28 28" fill="none" stroke="#203047" stroke-width="6" stroke-linecap="round"/>
  <path d="M286 389h17m41 59h18" stroke="#f05b62" stroke-width="6" stroke-linecap="round"/>

  <!-- Pelican rider -->
  <g class="rider">
    <!-- legs and feet -->
    <path d="M361 324l-39 68m0 0-26-1m26 1 28 39m3-4-20 3" fill="none" stroke="#f0a43a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M292 390l-19-3m80 80-23 1" stroke="#f0a43a" stroke-width="9" stroke-linecap="round"/>
    <!-- body -->
    <path d="M330 238 Q345 204 388 220 Q421 232 413 279 L395 330 Q369 347 337 323 L321 281Z" fill="#fffdf1" class="ink"/>
    <path d="M351 251q31-18 53 8l-17 52q-20 11-39-6z" fill="#d9e6e2" stroke="#203047" stroke-width="3"/>
    <!-- wing -->
    <path d="M343 251q39-13 48 12-18 30-50 24-12-16 2-36z" fill="#f9f5e6" class="ink"/>
    <path d="M352 266l23 13m-28-2 18 11" stroke="#c5d3d0" stroke-width="3" stroke-linecap="round"/>
    <!-- neck and head -->
    <path d="M371 241q-6-36 15-53l29 11q-23 19-8 54" fill="#fffdf1" class="ink"/>
    <path d="M387 193 Q399 163 431 173 Q455 181 449 206 Q443 229 414 224 Q392 221 387 193Z" fill="#fffdf1" class="ink"/>
    <!-- beak and pouch -->
    <path d="M438 197 Q477 190 514 209 Q483 225 443 216Z" fill="#f5b23f" class="ink"/>
    <path d="M449 215 Q486 226 514 209 Q499 245 469 239 Q451 235 449 215Z" fill="#ef765d" class="ink"/>
    <path d="M462 224q20 7 36-3" fill="none" stroke="#d85450" stroke-width="3"/>
    <!-- eye, brow, helmet -->
    <circle cx="431" cy="190" r="5.5" fill="#203047"/>
    <path d="M420 180q12-9 24-3" fill="none" stroke="#203047" stroke-width="4" stroke-linecap="round"/>
    <path d="M395 178q14-27 39-15 15 7 15 20-27-11-54-5z" fill="#54b9bd" class="ink"/>
    <path d="M431 163l7-9" stroke="#203047" stroke-width="3"/>
    <!-- handlebars grip -->
    <path d="M405 327l18 15" fill="none" stroke="#f0a43a" stroke-width="9" stroke-linecap="round"/>
  </g>

  <path d="M534 269q17-16 32 0m-22 15q12-12 24 0" fill="none" stroke="#fffdf1" stroke-width="5" stroke-linecap="round"/>
  <text x="535" y="310" fill="#203047" font-family="Trebuchet MS,Arial,sans-serif" font-size="15" font-weight="800">HONK IF YOU’RE</text>
  <text x="535" y="330" fill="#203047" font-family="Trebuchet MS,Arial,sans-serif" font-size="15" font-weight="800">ON THE MENU</text>

  <rect x="0" y="520" width="800" height="80" fill="#203047"/>
  <text x="400" y="549" text-anchor="middle" fill="#fff3c8" font-family="Trebuchet MS,Arial,sans-serif" font-size="17" font-weight="800">One bird, two wheels, absolutely no license.</text>
  <text x="400" y="579" text-anchor="middle" fill="#b9e9ee" font-family="Arial,sans-serif" font-size="15" font-weight="700">2026-10-26 04:02:07 SGT (UTC+08:00)</text>
</svg>