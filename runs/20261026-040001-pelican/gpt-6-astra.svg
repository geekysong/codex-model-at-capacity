<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A proud pelican pedals a tiny bicycle with a huge fish-filled bill. Spinning wheels and bouncing feathers animate above a seaside road.</desc>
  <defs>
    <pattern id="water" width="90" height="25" patternUnits="userSpaceOnUse">
      <path d="M10 13 Q25 5 40 13 T70 13" fill="none" stroke="#94d5db" stroke-width="3"/>
    </pattern>
    <g id="wheel">
      <circle r="84" fill="#fff8e6" stroke="#203342" stroke-width="12"/>
      <circle r="73" fill="#e4f4ed" stroke="#efad45" stroke-width="3"/>
      <g stroke="#648891" stroke-width="3">
        <path d="M-71 0H71M0-71V71M-50-50L50 50M-50 50L50-50"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      </g>
      <circle r="10" fill="#203342"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
