    <text x="0" y="23" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#203342">NO FREELOADING</text>
  </g>

  <ellipse cx="366" cy="486" rx="242" ry="13" fill="#7c8277" opacity=".23"/>
  <use href="#wheel" x="223" y="405"/>
  <use href="#wheel" x="515" y="405"/>

