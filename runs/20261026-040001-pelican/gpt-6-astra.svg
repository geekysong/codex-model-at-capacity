  <rect y="507" width="800" height="93" fill="#203342"/>
  <text x="400" y="538" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="bold" fill="#fff6df">One pelican. Two wheels. Six unpaid passengers.</text>
  <path d="M110 551H690" stroke="#68818c" stroke-width="1"/>
  <text x="400" y="577" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" fill="#fff6df">2026-10-26 04:00:01 SGT (UTC+08:00)</text>
