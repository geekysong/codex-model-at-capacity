  <path d="M0 484H800" stroke="#f9efd7" stroke-width="5" stroke-dasharray="38 27"/>

  <g font-family="Verdana, sans-serif" text-anchor="middle" fill="#203342">
    <text x="400" y="57" font-size="40" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
    <text x="400" y="89" font-size="17" font-weight="bold">THE ONLY CYCLIST WITH A BUILT-IN FOOD TRUCK.</text>
  </g>

  <g transform="translate(653 287)">
    <path d="M0 21V135" stroke="#677577" stroke-width="8"/>
    <rect x="-66" y="-27" width="132" height="65" rx="7" fill="#fff6df" stroke="#203342" stroke-width="4"/>
