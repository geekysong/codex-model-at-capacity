  <text x="400" y="65" text-anchor="middle" font-size="49" font-weight="900" fill="#223341" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="100" text-anchor="middle" font-size="20" fill="#46616b">Two wheels. One bird. Absolutely no aerodynamics.</text>

