<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican rides a bicycle with a fish in its enormous bill. The wheels spin, pedals turn, and the pelican bobs as a roadside sign announces a fuel-free lane.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1" patternContentUnits="objectBoundingBox">
      <path d="M0 .5H1M.5 0V1M.146 .146L.854 .854M.146 .854L.854 .146" stroke="#718492" stroke-width=".018"/>
    </pattern>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .ink{stroke:#223341;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .bob{animation:bob .8s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    </style>
  </defs>

  <path fill="#fff8e6" d="M0 0H800V600H0Z"/>
