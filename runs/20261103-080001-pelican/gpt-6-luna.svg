<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT BEAK ESCAPE</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish tucked into its beak pouch. The wheels spin and the pelican bobs along.</desc>
  <defs>
    <style>
      .ink{stroke:#26343b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#f8f0dc;stroke:#26343b;stroke-width:7}
      .spoke{stroke:#7b9296;stroke-width:2.5}
      .frame{fill:none;stroke:#e44f3f;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .title{font:900 34px 'Trebuchet MS',sans-serif;letter-spacing:1px;fill:#26343b}
      .caption{font:600 17px 'Trebuchet MS',sans-serif;fill:#42545a}
      .small{font:700 13px 'Trebuchet MS',sans-serif;fill:#42545a}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .ride{transform-box:fill-box;transform-origin:center;animation:bob .45s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px) rotate(-1deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#d9f2ed"/>
  <path d="M0 390Q160 365 330 391T800 380V548H0Z" fill="#a8d6c5"/>
  <path d="M0 430Q175 410 340 430T800 418" fill="none" stroke="#82bca9" stroke-width="4"/>
  <circle cx="690" cy="105" r="43" fill="#ffd36e"/>
  <path d="M57 185q17-16 34 0q15-14 29 0M630 208q16-13 31 0q14-13 28 0" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>

  <text x="400" y="53" text-anchor="middle" class="title">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="81" text-anchor="middle" class="caption">He’s cycling to lunch. Lunch is already in his face.</text>

  <!-- speed lines -->
  <path d="M91 319h82M66 344h91M119 369h47" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="615" y="280" class="small" transform="rotate(8 615 280)">HONK IF YOU HAVE FISH</text>

  <!-- bicycle -->
  <g aria-label="bicycle">
    <circle class="wheel" cx="260" cy="405" r="77"/>
    <circle class="wheel" cx="555" cy="405" r="77"/>
    <g class="spin">
      <path class="spoke" d="M260 330v150M185 405h150M207 352l106 106M313 352L207 458"/>
    </g>
    <g class="spin">
      <path class="spoke" d="M555 330v150M480 405h150M502 352l106 106M608 352L502 458"/>
    </g>
    <path class="frame" d="M260 405l94-106 76 106H260l65-79 29 79M354 299h42"/>
    <path d="M391 294l16-10M244 405h32M539 405h32" stroke="#26343b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="354" cy="405" r="16" fill="#ffd36e" stroke="#26343b" stroke-width="5"/>
    <path d="M354 405l-32-23M354 405l31 20" stroke="#26343b" stroke-width="5" stroke-linecap="round"/>
    <path d="M316 378l13 8M379 425l13 8" stroke="#26343b" stroke-width="7" stroke-linecap="round"/>
    <path d="M335 282h48" stroke="#26343b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- rider bob -->
  <g class="ride">
    <!-- legs -->
    <path d="M385 274q-10 46-31 76l-20 37" fill="none" stroke="#f0a84d" stroke-width="17" stroke-linecap="round"/>
    <path d="M374 283q39 34 24 84l-21 33" fill="none" stroke="#f0a84d" stroke-width="17" stroke-linecap="round"/>
    <path d="M332 389l-16 11M374 400l13 10" stroke="#26343b" stroke-width="8" stroke-linecap="round"/>

    <!-- body and tail -->
    <path d="M416 169q-47 4-62 55l19 66q40 22 82-5l16-61q-16-46-55-55Z" fill="#fffdf6" class="ink"/>
    <path d="M373 221q-28 14-44 7l-22-14q18 30 44 37" fill="#fffdf6" class="ink"/>
    <path d="M397 183q21-15 43-2" fill="none" stroke="#d7d5cb" stroke-width="5"/>

    <!-- neck and head -->
    <path d="M430 198q1-38 25-57q20-15 42 1l18 25q-13 30-45 42" fill="#fffdf6" class="ink"/>
    <ellipse cx="477" cy="139" rx="39" ry="34" fill="#fffdf6" class="ink"/>
    <path d="M494 142q42-10 77 1q-28 19-71 17Z" fill="#efa14b" class="ink"/>
    <path d="M501 161q30 9 65-5q-10 36-40 42q-23-3-25-37Z" fill="#ef7657" class="ink"/>
    <!-- fish in pouch -->
    <path d="M525 178q17-14 34 0q-17 15-34 0Zm34 0 11-9v18Z" fill="#59b8bd" stroke="#26343b" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="532" cy="176" r="2.5" fill="#26343b"/>
    <circle cx="488" cy="132" r="5" fill="#26343b"/>
    <path d="M477 118q12-10 22 1" fill="none" stroke="#26343b" stroke-width="3" stroke-linecap="round"/>
    <path d="M452 122q-14-24-30-13q-9 8 3 17" fill="#fffdf6" class="ink"/>
    <!-- little helmet -->
    <path d="M448 118q4-35 35-37q28 1 34 28l-43 2Z" fill="#ef5a48" class="ink"/>
    <path d="M445 113l73-2" stroke="#26343b" stroke-width="5" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M390 215q35-27 62 2q-21 31-58 24" fill="#f4f0df" stroke="#26343b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M402 222l28 7M398 232l25 7" stroke="#c9c9bc" stroke-width="3" stroke-linecap="round"/>
    <!-- handlebar reach -->
    <path d="M438 223q-24 27-42 55l-15 6" fill="none" stroke="#f0a84d" stroke-width="12" stroke-linecap="round"/>
    <path d="M377 284l-9-7" stroke="#26343b" stroke-width="7" stroke-linecap="round"/>
    <!-- sweat and boast -->
    <path d="M529 118q12 7 2 17q-10-5-2-17Z" fill="#62bfce"/>
    <text x="553" y="112" class="small" transform="rotate(9 553 112)">I REGRET NOTHING</text>
  </g>

  <path d="M116 476q22-18 45 0l-6 20h-39Z" fill="#f7c65f" stroke="#26343b" stroke-width="4"/>
  <path d="M128 469q8-17 18 0" fill="none" stroke="#26343b" stroke-width="4" stroke-linecap="round"/>
  <text x="96" y="521" class="small">EMERGENCY SNACK STOP</text>

  <rect x="0" y="548" width="800" height="52" fill="#26343b"/>
  <text x="400" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">2026-11-03 08:01:53 SGT (UTC+08:00)</text>
</svg>