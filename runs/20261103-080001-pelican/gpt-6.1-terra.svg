<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Pelican</title>
  <desc id="desc">A pelican pedals a bicycle with a fish in its beak. The bicycle wheels turn while the rider bobs.</desc>
  <defs>
    <style>
      .ink { stroke:#25334a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob .7s ease-in-out infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e9"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#dff3ef" stroke="#25334a" stroke-width="5"/>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#25334a">THE DAILY PELICAN</text>
  <text x="400" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#52716f">BREAKING NEWS FROM THE BIKE LANE</text>

