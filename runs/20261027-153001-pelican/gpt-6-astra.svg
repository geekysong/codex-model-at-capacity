<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>THE GREAT PELICAN COMMUTE</title>
  <desc>A satirical pelican rides a bicycle while proudly avoiding all useful work.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e7f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#222;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,sans-serif;font-weight:700;fill:#222}
      .white{fill:#fff}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="100" r="48" fill="#ffe36e" stroke="#222" stroke-width="5"/>
  <path d="M0 335 Q130 285 260 330 T520 320 T800 335 V420 H0Z" fill="#9bd36f" stroke="#222" stroke-width="5"/>
  <path d="M0 410 Q180 380 350 410 T800 405 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f7d85a" stroke-width="8" stroke-dasharray="48 28">
    <animate attributeName="stroke-dashoffset" from="0" to="-76" dur="1s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#shadow)">
    <rect x="40" y="34" width="720" height="92" rx="22" fill="#fff8d5" class="ink"/>
    <text x="400" y="76" text-anchor="middle" class="label" font-size="32">THE GREAT PELICAN COMMUTE</text>
    <text x="400" y="108" text-anchor="middle" class="label" font-size="18" fill="#b63b3b">“ALL BEAK, NO BRAKES.”</text>
  </g>

  <g transform="translate(0 4)">
    <g class="wheel">
      <circle cx="270" cy="458" r="72" fill="#d8f3ff" class="ink"/>
      <circle cx="270" cy="458" r="10" fill="#222"/>
      <g stroke="#222" stroke-width="3">
        <path d="M270 386V530 M198 458H342 M219 407L321 509 M321 407L219 509"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 270 458" to="360 270 458" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g class="wheel">
      <circle cx="540" cy="458" r="72" fill="#d8f3ff" class="ink"/>
      <circle cx="540" cy="458" r="10" fill="#222"/>
      <g stroke="#222" stroke-width="3">
        <path d="M540 386V530 M468 458H612 M489 407L591 509 M591 407L489 509"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 540 458" to="360 540 458" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <path d="M270 458 L355 365 L470 458 L540 458 L435 375 L355 365 Z" fill="none" class="ink"/>
    <path d="M355 365 L335 322" fill="none" class="ink"/>
    <path d="M320 322 H365" fill="none" class="ink"/>
    <path d="M470 458 L500 350" fill="none" class="ink"/>
    <path d="M480 348 H525" fill="none" class="ink"/>
    <circle cx="355" cy="365" r="13" fill="#ffcc33" class="ink"/>
    <circle cx="470" cy="458" r="14" fill="#ffcc33" class="ink"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="405" cy="294" rx="78" ry="96" fill="#f6f0d7" class="ink"/>
      <path d="M350 282 Q395 215 455 265 Q450 330 390 350 Q350 335 350 282Z" fill="#fff" class="ink"/>
      <ellipse cx="404" cy="220" rx="70" ry="62" fill="#f6f0d7" class="ink"/>
      <path d="M365 224 Q418 185 490 225 Q468 270 405 268 Q370 260 365 224Z" fill="#f39b45" class="ink"/>
      <path d="M485 225 Q545 220 580 247 Q544 269 490 254Z" fill="#f39b45" class="ink"/>
      <circle cx="430" cy="204" r="10" fill="#fff" class="ink"/>
      <circle cx="432" cy="205" r="4" fill="#222"/>
      <path d="M390 182 Q407 169 423 182" fill="none" class="ink"/>
      <path d="M354 280 Q315 300 325 344 Q356 334 380 304Z" fill="#e7cfa1" class="ink"/>
      <path d="M455 282 Q491 305 480 345 Q452 335 430 305Z" fill="#e7cfa1" class="ink"/>

      <path d="M369 341 Q345 371 330 405" fill="none" class="ink"/>
      <path d="M446 340 Q470 375 486 405" fill="none" class="ink"/>
      <path d="M330 405 L350 417" fill="none" class="ink"/>
      <path d="M486 405 L506 416" fill="none" class="ink"/>

      <g>
        <circle cx="410" cy="414" r="12" fill="#222"/>
        <path d="M410 414 L390 382 M410 414 L438 439" class="ink" fill="none"/>
        <path d="M386 381 Q366 370 350 382" class="ink" fill="none"/>
        <path d="M438 439 Q455 450 470 438" class="ink" fill="none"/>
        <animateTransform attributeName="transform" type="rotate" values="0 410 414;360 410 414" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <path d="M380 156 Q397 130 420 154" fill="none" stroke="#d94b3b" stroke-width="10"/>
      <text x="405" y="124" text-anchor="middle" class="label" font-size="16">CEO OF SIDEWALKS</text>
    </g>

    <path d="M575 280 Q620 255 660 278" fill="none" stroke="#222" stroke-width="5"/>
    <text x="650" y="260" text-anchor="middle" class="label" font-size="17">HONK!</text>
    <path d="M605 300 Q640 285 675 301" fill="none" stroke="#222" stroke-width="4"/>
    <path d="M600 312 Q630 305 655 315" fill="none" stroke="#222" stroke-width="4"/>
  </g>

  <g transform="translate(55 548)">
    <rect x="0" y="0" width="690" height="34" rx="10" fill="#fff8d5" class="ink"/>
    <text x="345" y="23" text-anchor="middle" class="label" font-size="15">A majestic bird pedals furiously toward absolutely no particular destination.</text>
  </g>

  <text x="400" y="596" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#222">2026-10-27 15:30:01 SGT (UTC+08:00)</text>
</svg>