<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#56616b"/>
      <stop offset="1" stop-color="#252c33"/>
    </linearGradient>
    <style>
      .title { font: 900 34px Arial, sans-serif; fill:#18324a; letter-spacing:1px; }
      .caption { font: 700 18px Arial, sans-serif; fill:#ffffff; }
      .label { font: 700 16px Arial, sans-serif; fill:#18324a; }
      .ink { stroke:#18324a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd85a"/>
  <path d="M0 390 Q140 335 280 390 T560 390 T800 370 V600 H0Z" fill="#8ed081"/>
  <path d="M0 455 Q190 420 380 455 T800 440 V600 H0Z" fill="url(#road)"/>
  <path d="M0 522 H800" stroke="#f8e58c" stroke-width="8" stroke-dasharray="42 28"/>

  <text x="400" y="55" text-anchor="middle" class="title">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="84" text-anchor="middle" class="caption" fill="#18324a">“Why fly when you can pedal dramatically?”</text>

  <!-- bicycle wheels -->
  <g class="ink" fill="#d8f4ff">
    <circle cx="245" cy="455" r="76"/>
    <circle cx="570" cy="455" r="76"/>
    <circle cx="245" cy="455" r="10" fill="#18324a"/>
    <circle cx="570" cy="455" r="10" fill="#18324a"/>
  </g>
  <g stroke="#5aa8c7" stroke-width="3">
    <path d="M245 379V531 M169 455H321 M191 401L299 509 M299 401L191 509"/>
    <path d="M570 379V531 M494 455H646 M516 401L624 509 M624 401L516 509"/>
  </g>

  <!-- bicycle frame -->
  <g class="ink" fill="none">
    <path d="M245 455 L350 365 L430 455 L245 455 Z"/>
    <path d="M350 365 L390 455"/>
    <path d="M430 455 L570 455 L525 350"/>
    <path d="M505 350 H550"/>
    <path d="M335 365 H370"/>
  </g>

  <!-- animated crank and pedals -->
  <g>
    <circle cx="390" cy="455" r="13" fill="#ffd34f" class="ink"/>
    <g stroke="#18324a" stroke-width="6" stroke-linecap="round">
      <path d="M390 455 L420 480"/>
      <path d="M390 455 L365 425"/>
      <path d="M420 480 h24"/>
      <path d="M365 425 h-24"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 390 455" to="360 390 455" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <!-- pelican body with gentle bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 6;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="390" cy="300" rx="82" ry="105" fill="#f5f1df" class="ink"/>
    <path d="M335 284 Q390 235 445 284 L430 390 Q390 422 350 390Z" fill="#e3dcc5" class="ink"/>
    <ellipse cx="390" cy="325" rx="42" ry="60" fill="#fffaf0"/>
    <!-- neck and head -->
    <path d="M355 250 Q330 190 375 150 Q420 115 458 155 Q482 182 451 230 L430 270Z" fill="#f5f1df" class="ink"/>
    <circle cx="414" cy="166" r="9" fill="#18324a"/>
    <path d="M433 185 Q505 185 575 218 Q593 227 575 240 Q504 245 432 218Z" fill="#f2a43a" class="ink"/>
    <path d="M455 218 Q512 229 570 237" fill="none" stroke="#c87522" stroke-width="4"/>
    <!-- wing -->
    <path d="M350 285 Q294 300 305 365 Q315 398 356 370 L390 325Z" fill="#d6cfb7" class="ink"/>
    <!-- feet and pedals -->
    <path d="M365 390 L365 430" class="ink" fill="none"/>
    <path d="M420 390 L420 430" class="ink" fill="none"/>
    <path d="M350 430 Q365 438 380 430" class="ink" fill="none"/>
    <path d="M405 430 Q420 438 435 430" class="ink" fill="none"/>
    <!-- tiny helmet -->
    <path d="M367 145 Q414 105 455 145 L452 160 H370Z" fill="#ed5964" class="ink"/>
    <path d="M375 143 Q412 128 447 144" fill="none" stroke="#fff3c4" stroke-width="7"/>
  </g>

  <!-- comic motion lines -->
  <g stroke="#18324a" stroke-width="5" stroke-linecap="round" opacity=".65">
    <path d="M110 330 H175"/>
    <path d="M85 350 H150"/>
    <path d="M625 300 H690"/>
  </g>
  <text x="615" y="275" class="label">HONK!</text>
  <text x="118" y="315" class="label">FLAP</text>

  <rect x="0" y="555" width="800" height="45" fill="#18324a"/>
  <text x="400" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2026-10-29 04:02:07 SGT (UTC+08:00)</text>
</svg>