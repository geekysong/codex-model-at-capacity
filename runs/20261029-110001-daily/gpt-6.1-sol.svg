<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#fff"/>

  <!-- Column numbers -->
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#000">
    <text x="90" y="35">1</text>
    <text x="150" y="35">2</text>
    <text x="210" y="35">3</text>
    <text x="270" y="35">4</text>
    <text x="330" y="35">5</text>
  </g>

  <!-- Row numbers -->
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#000">
    <text x="42" y="80">1</text>
    <text x="42" y="140">2</text>
    <text x="42" y="200">3</text>
    <text x="42" y="260">4</text>
    <text x="42" y="320">5</text>
  </g>

  <!-- Grid cells: dark when row + col is prime -->
  <g stroke="#000" stroke-width="1">
    <rect x="60" y="50" width="60" height="60" fill="#333"/>
    <rect x="120" y="50" width="60" height="60" fill="#333"/>
    <rect x="180" y="50" width="60" height="60" fill="#eee"/>
    <rect x="240" y="50" width="60" height="60" fill="#333"/>
    <rect x="300" y="50" width="60" height="60" fill="#eee"/>

    <rect x="60" y="110" width="60" height="60" fill="#333"/>
    <rect x="120" y="110" width="60" height="60" fill="#eee"/>
    <rect x="180" y="110" width="60" height="60" fill="#333"/>
    <rect x="240" y="110" width="60" height="60" fill="#eee"/>
    <rect x="300" y="110" width="60" height="60" fill="#333"/>

    <rect x="60" y="170" width="60" height="60" fill="#eee"/>
    <rect x="120" y="170" width="60" height="60" fill="#333"/>
    <rect x="180" y="170" width="60" height="60" fill="#eee"/>
    <rect x="240" y="170" width="60" height="60" fill="#333"/>
    <rect x="300" y="170" width="60" height="60" fill="#eee"/>

    <rect x="60" y="230" width="60" height="60" fill="#333"/>
    <rect x="120" y="230" width="60" height="60" fill="#eee"/>
    <rect x="180" y="230" width="60" height="60" fill="#333"/>
    <rect x="240" y="230" width="60" height="60" fill="#eee"/>
    <rect x="300" y="230" width="60" height="60" fill="#eee"/>

    <rect x="60" y="290" width="60" height="60" fill="#eee"/>
    <rect x="120" y="290" width="60" height="60" fill="#333"/>
    <rect x="180" y="290" width="60" height="60" fill="#eee"/>
    <rect x="240" y="290" width="60" height="60" fill="#eee"/>
    <rect x="300" y="290" width="60" height="60" fill="#eee"/>
  </g>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#000">
    <text x="400" y="55" font-weight="bold">Legend</text>
    <rect x="400" y="75" width="24" height="24" fill="#333" stroke="#000" stroke-width="1"/>
    <text x="434" y="93">Dark: row+col prime</text>
    <rect x="400" y="115" width="24" height="24" fill="#eee" stroke="#000" stroke-width="1"/>
    <text x="434" y="133">Light: otherwise</text>
    <text x="400" y="175">Dark cells: 11</text>
  </g>

  <!-- Timestamp footer -->
  <text x="300" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#000">2026-10-29 11:04:53 SGT (UTC+08:00)</text>
</svg>