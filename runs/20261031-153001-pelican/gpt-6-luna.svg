<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle</title>
  <desc id="desc">A smug pelican pedals a bicycle while a fish rides in its beak. The wheels spin and the bird bobs.</desc>
  <style>
    text { font-family: "Trebuchet MS", Arial, sans-serif; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.5s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center; animation: bob .7s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
  </style>

  <rect width="800" height="600" fill="#c9f0e8"/>
  <rect y="374" width="800" height="154" fill="#f3d77b"/>
  <path d="M0 404 Q110 379 225 402 T450 400 T680 397 T800 404 V528 H0Z" fill="#e8bd59"/>
  <circle cx="692" cy="105" r="42" fill="#ffca63"/>
  <path d="M0 374 Q92 322 176 374 Q253 321 334 374 Q417 330 500 374 Q587 318 672 374 Q744 335 800 368 V411 H0Z" fill="#8bc9a1"/>
  <text x="38" y="55" font-size="31" font-weight="900" fill="#184e58">THE PELICAN CYCLE</text>
  <text x="40" y="82" font-size="15" font-weight="700" fill="#347079">A bird with a one-fish commute and absolutely no helmet.</text>

  <g fill="none" stroke="#213e49" stroke-width="5">
