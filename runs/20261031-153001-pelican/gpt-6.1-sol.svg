<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Committee</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle, carrying a fish in its enormous bill pouch. Wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#fff5cc"/>
      <stop offset="1" stop-color="#f6dfb0"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc258"/>
      <stop offset="1" stop-color="#ef8544"/>
    </linearGradient>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #263440; }
      .ink { stroke: #263440; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #263440; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fffaf0"/>
  <rect x="18" y="18" width="764" height="496" rx="25" fill="url(#sky)" stroke="#263440" stroke-width="3"/>
  <text x="400" y="64" text-anchor="middle" font-size="34" font-weight="900">THE PELICAN PEDAL COMMITTEE</text>
  <text x="400" y="93" text-anchor="middle" font-size="16" letter-spacing="3">BIG BILL. TINY TRANSPORT BUDGET.</text>

  <path d="M40 385 Q130 345 225 376 T420 370 T620 373 T760 358 V490 H40Z" fill="#d4dda8"/>
  <path d="M40 448 Q400 421 760 448" fill="none" stroke="#b3b986" stroke-width="3"/>
  <ellipse cx="388" cy="452" rx="235" ry="15" fill="#263440" opacity=".12"/>

  <!-- The committee's official explanation. -->
  <path d="M518 121 H730 Q745 121 745 137 V190 Q745 206 729 206 H588 L553 231 L562 206 H518 Q503 206 503 190 V137 Q503 121 518 121Z" fill="#fffdf5" class="fine"/>
  <text x="624" y="151" text-anchor="middle" font-size="18" font-weight="bold">“It’s a streamlined</text>
  <text x="624" y="177" text-anchor="middle" font-size="18" font-weight="bold">operation.”</text>

  <!-- Two visibly rotating wheels. -->
  <g transform="translate(240 394)">
    <circle r="72" fill="#fff9e9" class="ink"/>
    <circle r="63" fill="none" stroke="#a7b4af" stroke-width="3"/>
    <g stroke="#718787" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0 H62 M0-62 V62 M-44-44 L44 44 M-44 44 L44-44"/>
      <path d="M0-69 A69 69 0 0 1 33-60" fill="none" stroke="#ed714e" stroke-width="6"/>
    </g>
    <circle r="7" fill="#263440"/>
  </g>
  <g transform="translate(537 394)">
    <circle r="72" fill="#fff9e9" class="ink"/>
    <circle r="63" fill="none" stroke="#a7b4af" stroke-width="3"/>
    <g stroke="#718787" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0 H62 M0-62 V62 M-44-44 L44 44 M-44 44 L44-44"/>
      <path d="M0-69 A69 69 0 0 1 33-60" fill="none" stroke="#ed714e" stroke-width="6"/>
    </g>
    <circle r="7" fill="#263440"/>
  </g>

  <!-- A bicycle clearly several sizes too small. -->
  <g fill="none" class="ink">
    <path d="M240 394 L318 302 L363 394 Z M318 302 L489 302 L363 394 M489 302 L537 394" stroke="#227f83" stroke-width="9"/>
    <path d="M318 302 L305 278 M489 302 L475 260 L502 244" stroke="#263440" stroke-width="7"/>
    <path d="M500 244 Q521 232 534 247" stroke-width="8"/>
    <path d="M287 278 H328" stroke-width="12"/>
    <path d="M240 394 H363" stroke="#263440" stroke-width="3"/>
  </g>
  <circle cx="363" cy="394" r="19" fill="#f5cb55" class="fine"/>

  <!-- Pelican: bobbing body, helmet, enormous bill and unruffled expression. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M279 270 L238 236 L248 277 L223 271 L258 303" fill="#fffdf3" class="ink"/>
    <path d="M278 217 Q299 186 340 203 Q370 216 374 259 Q372 292 336 303 Q283 313 259 281 Q248 250 278 217Z" fill="#fffdf3" class="ink"/>
    <path d="M284 236 Q328 216 343 252 Q344 281 299 283 Q314 268 302 259" fill="#dbe5df" class="fine"/>
    <path d="M339 218 Q354 194 351 162 Q345 124 380 122 Q411 123 410 154 L401 228 Q389 253 365 248" fill="#fffdf3" class="ink"/>

    <!-- A helmet with an excessively official tiny flag. -->
    <path d="M346 143 Q345 111 378 109 Q409 110 414 142Z" fill="#e95c49" class="ink"/>
    <path d="M365 116 L361 134 M383 114 L383 134 M399 121 L402 135" fill="none" stroke="#ffc77a" stroke-width="4"/>
    <path d="M377 109 V91 L406 99 L377 105" fill="#227f83" class="fine"/>
    <path d="M355 145 L371 176 L401 145" fill="none" class="fine"/>

    <!-- The bill's pouch doubles as a fish limousine. -->
    <path d="M401 166 L591 182 Q555 244 465 247 Q420 240 402 189Z" fill="url(#pouch)" class="ink"/>
    <path d="M399 157 Q491 158 597 179 L401 181Z" fill="#ffce66" class="ink"/>
    <path d="M427 194 Q452 214 472 198 Q498 180 524 201 L542 189 L539 213 L550 223 L523 218 Q492 239 461 219 Q439 225 427 194Z" fill="#7ebcb6" class="fine"/>
    <circle cx="443" cy="203" r="3.5" fill="#263440"/>
    <path d="M468 201 L478 190 L485 201" fill="#7ebcb6" class="fine"/>
    <path d="M415 188 Q423 231 458 239" fill="none" stroke="#ffe0a0" stroke-width="4"/>

    <circle cx="386" cy="151" r="5" fill="#263440"/>
    <path d="M375 140 L391 137" fill="none" class="fine"/>
    <path d="M364 247 Q415 258 432 283 L491 257" fill="none" stroke="#263440" stroke-width="13"/>
    <path d="M364 247 Q415 258 432 283 L491 257" fill="none" stroke="#fffdf3" stroke-width="8"/>
    <path d="M488 256 L501 253" fill="none" class="ink"/>
  </g>

  <!-- Alternating leg strokes and a rotating crank complete the pedaling loop. -->
  <path d="M327 294 Q304 332 339 371 L369 407" fill="none" stroke="#bb8743" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" values="M327 294 Q304 332 339 371 L369 407;M327 294 Q370 316 379 350 L357 381;M327 294 Q304 332 339 371 L369 407" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M341 294 Q380 319 377 351 L357 381" fill="none" stroke="#f2aa46" stroke-width="11" stroke-linecap="round">
    <animate attributeName="d" values="M341 294 Q380 319 377 351 L357 381;M341 294 Q307 333 339 371 L369 407;M341 294 Q380 319 377 351 L357 381" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(363 394)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-15-15 L15 15" class="fine" fill="none"/>
      <path d="M-25-15 H-5 M5 15 H25" stroke="#263440" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#263440"/>
  </g>

  <path d="M145 320 H186 M156 338 H177 M117 354 H170" fill="none" stroke="#87927a" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="494" text-anchor="middle" font-size="20" font-weight="bold">He cut the fuel bill. The fish still wants mileage.</text>

  <!-- Dedicated, unobstructed timestamp footer. -->
  <line x1="45" y1="536" x2="755" y2="536" stroke="#d2c7b1" stroke-width="2"/>
  <text x="400" y="571" text-anchor="middle" font-size="19">2026-10-31 15:31:31 SGT (UTC+08:00)</text>
</svg>