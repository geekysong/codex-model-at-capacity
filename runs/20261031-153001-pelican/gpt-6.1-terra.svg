<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN EXPRESS</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle, with spinning wheels and a bobbing rider.</desc>
  <defs>
    <pattern id="spokes" width="100" height="100" patternUnits="userSpaceOnUse"/>
    <style>
      .ink { stroke:#26333b; stroke-width:5; stroke-linecap:round; stroke-linejoin:round }
      .thin { stroke:#26333b; stroke-width:3; stroke-linecap:round; stroke-linejoin:round }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite }
      .rider { animation:bob .75s ease-in-out infinite alternate }
      @keyframes spin { to { transform:rotate(360deg) } }
      @keyframes bob { from { transform:translateY(0) rotate(-.5deg) } to { transform:translateY(-5px) rotate(.5deg) } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider { animation:none } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect x="20" y="18" width="760" height="564" rx="22" fill="#d9f1ef" stroke="#26333b" stroke-width="5"/>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="2" fill="#26333b">PELICAN EXPRESS</text>
  <text x="400" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#46656b">THE COMMUTE IS GETTING OUT OF HAND</text>

  <circle cx="675" cy="155" r="37" fill="#ffd96a"/>
