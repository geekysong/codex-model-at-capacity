    <path d="M0 0h111v58H0z" fill="#fffdf3" class="thin"/>
    <path d="M13 12h85 M13 20h62" stroke="#d95242" stroke-width="4" stroke-linecap="round"/>
    <text x="55" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#26333b">BIKE LANE?</text>
    <path d="M56 58v77" stroke="#26333b" stroke-width="5"/>
