  <rect x="37" y="503" width="726" height="63" rx="12" fill="#fffdf3" stroke="#26333b" stroke-width="3"/>
  <text x="400" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#26333b">He carries the whole lunch—and still asks for a bike lane.</text>
