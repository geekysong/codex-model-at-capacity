<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street map: shortest route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid. The blue route follows row 1 from A1 to E1, then column E to E5, totaling 8 street segments. Blocked intersections B2, C3, and D4 are marked with red X symbols.</desc>

