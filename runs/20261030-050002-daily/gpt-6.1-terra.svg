<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid route from A1 to E5</title>
  <desc id="desc">A five by five grid of intersections. The blue route travels across the top row and down the rightmost column, avoiding blocked intersections B2, C3, and D4. The route uses eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- City blocks -->
  <g fill="#e4e9ee">
    <path d="M128 53h74v44h-74z M218 53h74v44h-74z M308 53h74v44h-74z M398 53h74v44h-74z"/>
    <path d="M128 113h74v44h-74z M218 113h74v44h-74z M308 113h74v44h-74z M398 113h74v44h-74z"/>
    <path d="M128 173h74v44h-74z M218 173h74v44h-74z M308 173h74v44h-74z M398 173h74v44h-74z"/>
    <path d="M128 233h74v44h-74z M218 233h74v44h-74z M308 233h74v44h-74z M398 233h74v44h-74z"/>
  </g>

  <!-- Streets -->
  <g stroke="#a5b1bd" stroke-width="3" fill="none">
    <path d="M120 45H480 M120 105H480 M120 165H480 M120 225H480 M120 285H480"/>
    <path d="M120 45V285 M210 45V285 M300 45V285 M390 45V285 M480 45V285"/>
  </g>

  <!-- Shortest route: eight street segments -->
  <path d="M120 45H480V285" fill="none" stroke="#1769d2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersection markers -->
  <g fill="#fff" stroke="#5b6875" stroke-width="1.5">
    <circle cx="210" cy="45" r="4"/><circle cx="300" cy="45" r="4"/><circle cx="390" cy="45" r="4"/><circle cx="480" cy="45" r="4"/>
    <circle cx="120" cy="105" r="4"/><circle cx="300" cy="105" r="4"/><circle cx="390" cy="105" r="4"/><circle cx="480" cy="105" r="4"/>
    <circle cx="120" cy="165" r="4"/><circle cx="210" cy="165" r="4"/><circle cx="390" cy="165" r="4"/><circle cx="480" cy="165" r="4"/>
    <circle cx="120" cy="225" r="4"/><circle cx="210" cy="225" r="4"/><circle cx="300" cy="225" r="4"/><circle cx="480" cy="225" r="4"/>
    <circle cx="120" cy="285" r="4"/><circle cx="210" cy="285" r="4"/><circle cx="300" cy="285" r="4"/><circle cx="390" cy="285" r="4"/>
  </g>
  <circle cx="120" cy="45" r="7" fill="#16804b" stroke="#fff" stroke-width="2"/>
  <circle cx="480" cy="285" r="7" fill="#1769d2" stroke="#fff" stroke-width="2"/>

  <!-- Blocked intersections -->
  <g stroke="#c52b35" stroke-width="4" stroke-linecap="round">
    <path d="M204 99l12 12 M216 99l-12 12"/>
    <path d="M294 159l12 12 M306 159l-12 12"/>
    <path d="M384 219l12 12 M396 219l-12 12"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#263442">
    <text x="130" y="37">A1</text><text x="220" y="37">B1</text><text x="310" y="37">C1</text><text x="400" y="37">D1</text><text x="490" y="37">E1</text>
    <text x="130" y="97">A2</text><text x="220" y="97">B2</text><text x="310" y="97">C2</text><text x="400" y="97">D2</text><text x="490" y="97">E2</text>
    <text x="130" y="157">A3</text><text x="220" y="157">B3</text><text x="310" y="157">C3</text><text x="400" y="157">D3</text><text x="490" y="157">E3</text>
    <text x="130" y="217">A4</text><text x="220" y="217">B4</text><text x="310" y="217">C4</text><text x="400" y="217">D4</text><text x="490" y="217">E4</text>
    <text x="130" y="277">A5</text><text x="220" y="277">B5</text><text x="310" y="277">C5</text><text x="400" y="277">D5</text><text x="490" y="277">E5</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    <text x="68" y="49" fill="#16804b">Start</text>
    <text x="490" y="305" fill="#1769d2">End</text>
  </g>

  <!-- Footer -->
  <path d="M36 325H564" stroke="#cbd5df"/>
  <text x="36" y="347" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1769d2">Route: 8 street segments</text>
  <text x="36" y="379" font-family="Arial, sans-serif" font-size="14" fill="#374554">2026-10-30 05:04:00 SGT (UTC+08:00)</text>
</svg>