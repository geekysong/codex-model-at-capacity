<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172033" font-size="14">
    <text x="30" y="28" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="30" y="53">vₓ = 20 m/s · vᵧ = 15 m/s · g = 10 m/s²</text>
    <text x="30" y="77">Total flight time: 3 s</text>
    <text x="30" y="101" font-size="12">Scale: 10 px/m; a 20 m horizontal break keeps landing in view.</text>
  </g>

  <!-- Physical coordinates: x = 100 + 200t, y = 350 - 150t + 50t².
       The interval x = 450…650 is omitted horizontally.
       Beyond the break, physical x coordinates are translated by -200 px. -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#667085" stroke-width="2"/>

  <g fill="none" stroke="#176bc1" stroke-width="3">
    <path d="M 100,350 Q 275,218.75 450,240.625"/>
    <path d="M 450,315.625 Q 475,331.25 500,350"/>
  </g>

  <g stroke="#667085" stroke-width="2">
    <path d="M 443,345 l 5,10 M 452,345 l 5,10"/>
  </g>

  <g fill="#176bc1">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#172033" font-size="14">
    <text x="60" y="324">launch: 0 m, 0 m</text>
    <text x="300" y="216">apex: 30 m, 11.25 m</text>
    <text x="414" y="278" font-size="12">20 m omitted</text>
    <text x="416" y="374">landing: 60 m, 0 m</text>
  </g>

  <rect x="0" y="380" width="600" height="20" fill="#f0f3f7"/>
  <text x="300" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172033">2026-10-25 21:34:46 SGT (UTC+08:00)</text>
</svg>