<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Express</title>
  <desc>A satirical pelican rides a bicycle while taking itself far too seriously.</desc>
  <style>
    .ink{stroke:#18324a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#18324a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .label{font-family:Arial,sans-serif;fill:#18324a}
  </style>

  <rect width="800" height="600" fill="#bfe9f5"/>
  <rect y="430" width="800" height="170" fill="#f6d58a"/>
  <path d="M0 430 Q120 400 240 430 T480 430 T720 430 T960 430" fill="none" stroke="#d7ae58" stroke-width="8"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="42" font-weight="900">PELICAN EXPRESS</text>
  <text x="400" y="98" text-anchor="middle" class="label" font-size="21" font-weight="700">“Because walking is for birds with less ambition.”</text>

  <g transform="translate(0,0)">
    <g id="bike">
      <circle cx="250" cy="420" r="78" fill="none" class="ink"/>
      <circle cx="570" cy="420" r="78" fill="none" class="ink"/>
      <g class="thin">
        <path d="M250 420 L350 300 L465 420 L250 420 L410 420"/>
        <path d="M350 300 L410 420"/>
        <path d="M465 420 L535 300"/>
        <path d="M515 300 L560 300"/>
        <path d="M330 300 L370 300"/>
        <circle cx="410" cy="420" r="16"/>
        <path d="M410 420 l-30 -30 M410 420 l34 22"/>
      </g>
      <g stroke="#d07b32" stroke-width="4">
        <path d="M250 350 V490 M180 420 H320 M195 365 L305 475 M195 475 L305 365"/>
        <path d="M570 350 V490 M500 420 H640 M515 365 L625 475 M515 475 L625 365"/>
      </g>
      <path d="M325 287 Q350 270 375 287" fill="none" class="ink"/>
      <path d="M515 287 Q540 270 565 287" fill="none" class="ink"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="408" cy="245" rx="92" ry="108" fill="#f7f4e8" class="ink"/>
      <path d="M350 205 Q300 245 325 325 Q365 350 395 305" fill="#dce8ee" class="ink"/>
      <circle cx="408" cy="145" r="62" fill="#f7f4e8" class="ink"/>
      <path d="M446 155 Q555 170 570 215 Q548 260 446 205 Q430 180 446 155Z" fill="#f3a54b" class="ink"/>
      <path d="M449 195 Q510 205 555 215" fill="none" stroke="#bd6c25" stroke-width="4"/>
      <circle cx="430" cy="135" r="9" fill="#18324a"/>
      <path d="M374 124 Q400 105 422 118" fill="none" class="ink"/>
      <path d="M379 285 Q420 310 461 285" fill="none" class="ink"/>
      <path d="M365 335 Q350 390 370 420" fill="none" class="ink"/>
      <path d="M450 335 Q465 390 450 420" fill="none" class="ink"/>
      <path d="M365 420 L337 438 M450 420 L478 438" class="thin"/>
      <path d="M363 245 Q408 225 454 245" fill="none" stroke="#d07b32" stroke-width="7"/>
      <text x="408" y="255" text-anchor="middle" class="label" font-size="16" font-weight="900">HONK!</text>
      <path d="M300 190 Q275 170 290 145" fill="none" stroke="#e66b5b" stroke-width="7"/>
      <path d="M285 145 l-20 -18 M289 145 l-4 -27" stroke="#e66b5b" stroke-width="6"/>
    </g>
  </g>

  <g class="label" font-family="Arial,sans-serif">
    <path d="M585 150 Q650 120 710 155" fill="none" stroke="#18324a" stroke-width="3"/>
    <text x="650" y="145" text-anchor="middle" font-size="18" font-weight="700">“I demand</text>
    <text x="650" y="168" text-anchor="middle" font-size="18" font-weight="700">more beakroom!”</text>
  </g>

  <rect x="35" y="535" width="730" height="42" rx="12" fill="#fff4cf" stroke="#18324a" stroke-width="3"/>
  <text x="400" y="562" text-anchor="middle" class="label" font-size="17" font-weight="700">2026-10-28 00:33:10 SGT (UTC+08:00)</text>
</svg>