  <title id="title">5×5 Hamiltonian path — 24 moves</title>
  <desc id="desc">A path visits every cell of a five by five grid exactly once, starting at the top left and ending at the bottom right.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
