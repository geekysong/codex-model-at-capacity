<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">A 5×5 Hamiltonian path: 24 moves</title>
  <desc id="desc">A continuous path visits all 25 cells exactly once, from the top-left cell to the bottom-right cell, moving only between neighboring cells.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#172033">5×5 Grid Path — 24 Moves</text>

  <g stroke="#758195" stroke-width="1.5">
    <path d="M175 65V315 M225 65V315 M275 65V315 M325 65V315 M375 65V315"/>
    <path d="M125 115H375 M125 165H375 M125 215H375 M125 265H375"/>
    <rect x="125" y="65" width="250" height="250" fill="none" stroke-width="2"/>
  </g>

  <polyline points="150,90 200,90 250,90 300,90 350,90 350,140 300,140 250,140 200,140 150,140 150,190 200,190 250,190 300,190 350,190 350,240 300,240 250,240 200,240 150,240 150,290 200,290 250,290 300,290 350,290"
    fill="none" stroke="#3976c5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172033">
    <text x="150" y="90">1</text><text x="200" y="90">2</text><text x="250" y="90">3</text><text x="300" y="90">4</text><text x="350" y="90">5</text>
    <text x="150" y="140">10</text><text x="200" y="140">9</text><text x="250" y="140">8</text><text x="300" y="140">7</text><text x="350" y="140">6</text>
    <text x="150" y="190">11</text><text x="200" y="190">12</text><text x="250" y="190">13</text><text x="300" y="190">14</text><text x="350" y="190">15</text>
    <text x="150" y="240">20</text><text x="200" y="240">19</text><text x="250" y="240">18</text><text x="300" y="240">17</text><text x="350" y="240">16</text>
    <text x="150" y="290">21</text><text x="200" y="290">22</text><text x="250" y="290">23</text><text x="300" y="290">24</text><text x="350" y="290">25</text>
  </g>

  <circle cx="150" cy="90" r="8" fill="#22a45a" stroke="#fff" stroke-width="2"/>
  <circle cx="350" cy="290" r="8" fill="#d84242" stroke="#fff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <circle cx="405" cy="92" r="7" fill="#22a45a"/><text x="419" y="97" fill="#172033">Start</text>
    <circle cx="405" cy="119" r="7" fill="#d84242"/><text x="419" y="124" fill="#172033">End</text>
  </g>
  <text x="300" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#465267">2026-11-01 21:03:31 SGT (UTC+08:00)</text>
</svg>