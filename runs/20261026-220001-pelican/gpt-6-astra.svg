  <rect y="496" width="800" height="104" fill="#fff5dc"/>
  <text x="400" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#293d46">He cycles to work. His lunch takes the scenic pouch.</text>
