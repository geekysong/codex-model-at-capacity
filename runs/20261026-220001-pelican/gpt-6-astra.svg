  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#213a46">TOUR DE FISH</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="2" fill="#53666b">BIG BILL. TINY BIKE. ZERO SHAME.</text>

