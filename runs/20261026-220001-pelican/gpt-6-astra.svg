<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with an enormous beak full of fish. Both wheels spin as the bird bobs. A roadside sign declares a two-fish baggage limit.</desc>
