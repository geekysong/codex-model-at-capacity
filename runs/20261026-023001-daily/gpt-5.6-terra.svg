    <text x="70" y="145">5</text><text x="130" y="145">6</text><text x="190" y="145">7</text><text x="250" y="145">8</text>
    <text x="70" y="205">9</text><text x="130" y="205">10</text><text x="190" y="205">11</text><text x="250" y="205">12</text>
    <text x="70" y="265">13</text><text x="130" y="265">14</text><text x="190" y="265">15</text><text x="250" y="265">16</text>
