<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Knight moves from square 6</title>
  <desc id="desc">A numbered four by four grid with squares 4, 12, 13, and 15 shaded as knight moves from square 6.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="40" y="32" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Knight moves from square 6</text>

  <g stroke="#334155" stroke-width="2">
