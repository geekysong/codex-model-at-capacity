    <rect x="100" y="175" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="175" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="175" width="60" height="60" fill="#fbbf24"/>

    <rect x="40" y="235" width="60" height="60" fill="#fbbf24"/>
