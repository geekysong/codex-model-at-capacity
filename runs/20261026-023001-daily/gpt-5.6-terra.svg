    <rect x="100" y="55" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="55" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="55" width="60" height="60" fill="#fbbf24"/>

    <rect x="40" y="115" width="60" height="60" fill="#ffffff"/>
    <rect x="100" y="115" width="60" height="60" fill="#bfdbfe"/>
    <rect x="160" y="115" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="115" width="60" height="60" fill="#ffffff"/>

