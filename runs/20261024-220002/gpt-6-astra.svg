<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A 6 kilogram mass hangs 2 metres left of the pivot. A 4 kilogram mass hangs 3 metres right. Equal opposing torques keep the seesaw level: 6 times 2 equals 4 times 3.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#dc4b36"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#182b40">
    <text x="300" y="43" font-size="28" font-weight="700" fill="#16805d">balanced</text>
    <text x="300" y="72" font-size="16">Static equilibrium • equal opposing torques</text>

    <g stroke="#64748b" stroke-width="1.5" fill="none">
      <path d="M140 109 V140 M280 109 V140 M490 109 V140"/>
      <path d="M140 121 H280 M280 121 H490"/>
      <path d="M140 116 V126 M280 116 V126 M490 116 V126"/>
    </g>
    <text x="210" y="108" font-size="20">2 m</text>
    <text x="385" y="108" font-size="20" font-weight="700">x = 3 m</text>

    <rect x="105" y="151" width="420" height="14" rx="4" fill="#35556d"/>
    <circle cx="280" cy="158" r="5" fill="#f8fafc"/>
    <path d="M280 166 L254 217 H306 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <path d="M245 220 H315" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <text x="280" y="246" font-size="16">pivot</text>

    <g stroke="#475569" stroke-width="3">
      <path d="M140 165 V193 M490 165 V193"/>
    </g>
    <rect x="100" y="193" width="80" height="53" rx="7" fill="#dceaf7" stroke="#35556d" stroke-width="2"/>
    <rect x="455" y="193" width="70" height="53" rx="7" fill="#dceaf7" stroke="#35556d" stroke-width="2"/>
    <text x="140" y="226" font-size="23" font-weight="700">6 kg</text>
    <text x="490" y="226" font-size="23" font-weight="700">4 kg</text>

    <g stroke="#dc4b36" stroke-width="3" marker-end="url(#arrow)">
      <path d="M140 248 V297"/>
      <path d="M490 248 V285"/>
    </g>
    <text x="184" y="280" font-size="19" fill="#b33726">6g ↓</text>
    <text x="534" y="278" font-size="19" fill="#b33726">4g ↓</text>

    <text x="300" y="329" font-size="19">6g × 2 = 4g × x</text>
    <text x="300" y="363" font-size="27" font-weight="700">6×2 = 4×3</text>
    <text x="300" y="388" font-size="17" fill="#16805d">x = (6 × 2) / 4 = 3 m</text>
  </g>
</svg>