<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A level seesaw balances a 6 kilogram mass 2 meters left of the pivot with a 4 kilogram mass 3 meters right of the pivot.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d94b45"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183044; }
      .label { font-size: 18px; font-weight: 600; }
      .small { font-size: 16px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#f7fafc"/>
  <text x="300" y="42" text-anchor="middle" font-size="25" font-weight="700">Balanced Seesaw</text>

  <!-- Level beam -->
  <rect x="95" y="190" width="410" height="14" rx="7" fill="#4b7891"/>
  <line x1="300" y1="180" x2="300" y2="220" stroke="#183044" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M300 204 L270 268 L330 268 Z" fill="#e8a94a" stroke="#183044" stroke-width="2"/>
  <rect x="245" y="268" width="110" height="10" rx="5" fill="#183044"/>
  <text x="300" y="305" text-anchor="middle" class="small">pivot</text>

  <!-- Hanging masses -->
  <line x1="180" y1="204" x2="180" y2="236" stroke="#183044" stroke-width="3"/>
  <rect x="151" y="236" width="58" height="46" rx="6" fill="#6bb3a7" stroke="#183044" stroke-width="2"/>
  <text x="180" y="265" text-anchor="middle" class="label">6 kg</text>

  <line x1="420" y1="204" x2="420" y2="236" stroke="#183044" stroke-width="3"/>
  <rect x="391" y="236" width="58" height="46" rx="6" fill="#6bb3a7" stroke="#183044" stroke-width="2"/>
  <text x="420" y="265" text-anchor="middle" class="label">4 kg</text>

  <!-- Downward force arrows -->
  <line x1="180" y1="112" x2="180" y2="169" stroke="#d94b45" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="180" y="97" text-anchor="middle" class="label" fill="#d94b45">F = 6g</text>
  <line x1="420" y1="112" x2="420" y2="169" stroke="#d94b45" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="420" y="97" text-anchor="middle" class="label" fill="#d94b45">F = 4g</text>

  <!-- Distances -->
  <line x1="180" y1="326" x2="300" y2="326" stroke="#55758a" stroke-width="2"/>
  <line x1="180" y1="318" x2="180" y2="334" stroke="#55758a" stroke-width="2"/>
  <line x1="300" y1="318" x2="300" y2="334" stroke="#55758a" stroke-width="2"/>
  <text x="240" y="352" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="326" x2="420" y2="326" stroke="#55758a" stroke-width="2"/>
  <line x1="420" y1="318" x2="420" y2="334" stroke="#55758a" stroke-width="2"/>
  <text x="360" y="352" text-anchor="middle" class="label">x = 3 m</text>

  <text x="300" y="382" text-anchor="middle" font-size="20" font-weight="700">6 × 2 = 4 × 3</text>
  <text x="510" y="236" text-anchor="end" font-size="17" font-weight="700" fill="#2e806c">balanced</text>
</svg>