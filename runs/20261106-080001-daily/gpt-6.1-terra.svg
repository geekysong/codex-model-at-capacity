<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title">
  <title id="title">Four by four grid of circles with increasing radii and rotating colors</title>
  <rect width="600" height="400" fill="white"/>

  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#222">
    <text x="90" y="20">8 px</text>
    <text x="210" y="20">12 px</text>
    <text x="330" y="20">16 px</text>
    <text x="450" y="20">20 px</text>

    <text x="90" y="85">8 px</text>
    <text x="210" y="85">12 px</text>
    <text x="330" y="85">16 px</text>
    <text x="450" y="85">20 px</text>

    <text x="90" y="150">8 px</text>
    <text x="210" y="150">12 px</text>
    <text x="330" y="150">16 px</text>
    <text x="450" y="150">20 px</text>

    <text x="90" y="215">8 px</text>
    <text x="210" y="215">12 px</text>
    <text x="330" y="215">16 px</text>
    <text x="450" y="215">20 px</text>
  </g>

  <g stroke="#333" stroke-width="1">
    <circle cx="90" cy="45" r="8" fill="red"/>
    <circle cx="210" cy="45" r="12" fill="blue"/>
    <circle cx="330" cy="45" r="16" fill="green"/>
    <circle cx="450" cy="45" r="20" fill="yellow"/>

    <circle cx="90" cy="110" r="8" fill="blue"/>
    <circle cx="210" cy="110" r="12" fill="green"/>
    <circle cx="330" cy="110" r="16" fill="yellow"/>
    <circle cx="450" cy="110" r="20" fill="red"/>

    <circle cx="90" cy="175" r="8" fill="green"/>
    <circle cx="210" cy="175" r="12" fill="yellow"/>
    <circle cx="330" cy="175" r="16" fill="red"/>
    <circle cx="450" cy="175" r="20" fill="blue"/>

    <circle cx="90" cy="240" r="8" fill="yellow"/>
    <circle cx="210" cy="240" r="12" fill="red"/>
    <circle cx="330" cy="240" r="16" fill="blue"/>
    <circle cx="450" cy="240" r="20" fill="green"/>
  </g>

  <text x="300" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222">Row 3, column 4: blue</text>

  <line x1="30" y1="345" x2="570" y2="345" stroke="#ccc"/>
