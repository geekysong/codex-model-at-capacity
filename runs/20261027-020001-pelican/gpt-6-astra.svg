<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle, carrying fish in its enormous bill beneath a sign charging extra for baggage. Wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="sky" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff6df"/>
      <circle cx="3" cy="3" r="1" fill="#e9d9bc"/>
    </pattern>
    <style>
      .ink{stroke:#253644;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .type{font-family:Arial,Helvetica,sans-serif;fill:#253644}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 28H800" stroke="#ed7853" stroke-width="12"/>
  <text x="400" y="83" text-anchor="middle" class="type" font-size="52" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="116" text-anchor="middle" class="type" font-size="18" font-weight="bold">ZERO EMISSIONS. EXCESSIVE CARRY-ON.</text>

  <path d="M0 372Q120 333 240 369T480 363T800 366V480H0Z" fill="#bcdac9"/>
  <path d="M0 404Q200 386 400 407T800 400V487H0Z" fill="#8dbbad"/>
