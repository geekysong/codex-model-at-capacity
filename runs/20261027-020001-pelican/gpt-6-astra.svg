  <g fill="none" stroke="#253644" stroke-width="3" stroke-linecap="round">
    <path d="M162 347H121M157 363H103M166 381H135"/>
    <path d="M443 146L451 135M453 158L466 154"/>
  </g>

  <rect x="0" y="494" width="800" height="106" fill="#fff6df"/>
  <path d="M35 494H765" stroke="#253644" stroke-width="3"/>
  <text x="400" y="530" text-anchor="middle" class="type" font-size="23" font-weight="bold">He traded the gas bill for a fish bill.</text>
  <text x="400" y="574" text-anchor="middle" class="type" font-size="18">2026-10-27 02:00:01 SGT (UTC+08:00)</text>
</svg>