        <circle cx="-12" cy="-3" r="3" fill="#253644" stroke="none"/>
        <path d="M-3-7Q3 0-3 7" fill="none" stroke-width="2"/>
      </g>

      <circle cx="402" cy="168" r="10" fill="white" stroke-width="3"/>
      <circle cx="406" cy="169" r="4" fill="#253644" stroke="none"/>
      <path d="M391 153L411 157" fill="none" stroke-width="4"/>
      <path d="M376 146Q388 121 416 138L423 151L374 151Z" fill="#ed7853"/>
      <path d="M388 136L387 146M401 136L402 146" fill="none" stroke-width="3"/>

      <path d="M372 203L394 215L380 228L362 214Z" fill="#e7614e"/>
      <path d="M368 211Q340 198 321 207L337 214L320 222Q350 226 372 217" fill="#e7614e"/>
    </g>
  </g>

  <g class="ink">
    <circle cx="368" cy="394" r="15" fill="#ffdf80"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 368 394;360 368 394" dur="1.5s" repeatCount="indefinite"/>
      <path d="M347 381L389 407" fill="none" stroke-width="6"/>
