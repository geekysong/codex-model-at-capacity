  <path d="M30 473H135M190 473H295M505 473H610M665 473H770" stroke="#fff6df" stroke-width="5"/>
  <ellipse cx="393" cy="448" rx="227" ry="15" fill="#253644" opacity=".15"/>

  <g class="ink">
    <path d="M672 448V261" fill="none" stroke="#7e6757" stroke-width="10"/>
    <rect x="598" y="184" width="155" height="104" rx="10" fill="#ffdf80"/>
  </g>
  <text x="675" y="215" class="type" text-anchor="middle" font-size="20" font-weight="bold">CYCLE LANE</text>
  <text x="675" y="244" class="type" text-anchor="middle" font-size="17">Baggage fees</text>
  <text x="675" y="269" class="type" text-anchor="middle" font-size="20" font-weight="bold">STILL APPLY.</text>

  <!-- Wheels rotate around their own hubs. -->
  <g transform="translate(254 394)">
    <circle r="65" fill="#fff4dc" class="ink" stroke-width="9"/>
    <g stroke="#738a90" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-61 0H61M0-61V61M-43-43L43 43M-43 43L43-43"/>
      <path d="M24-56L-24 56M-56-24L56 24M-56 24L56-24M-24-56L24 56"/>
      <path d="M42-43L52-33" stroke="#ef7952" stroke-width="7"/>
    </g>
    <circle r="8" fill="#253644"/>
  </g>
  <g transform="translate(527 394)">
    <circle r="65" fill="#fff4dc" class="ink" stroke-width="9"/>
    <g stroke="#738a90" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-61 0H61M0-61V61M-43-43L43 43M-43 43L43-43"/>
      <path d="M24-56L-24 56M-56-24L56 24M-56 24L56-24M-24-56L24 56"/>
      <path d="M42-43L52-33" stroke="#ef7952" stroke-width="7"/>
    </g>
    <circle r="8" fill="#253644"/>
  </g>

  <g class="ink" fill="none">
    <path d="M254 394L319 302L368 394ZM319 302H474L368 394M474 302L527 394" stroke="#253644" stroke-width="12"/>
    <path d="M254 394L319 302L368 394ZM319 302H474L368 394M474 302L527 394" stroke="#ec684e" stroke-width="6"/>
    <path d="M319 302L306 278M474 302L461 269L487 253L505 260"/>
    <path d="M282 279H330" stroke-width="11"/>
    <path d="M233 314Q185 330 182 380M550 315Q585 332 596 369" stroke="#fff6df" stroke-width="8"/>
  </g>

  <!-- The rider bobs independently of the stationary typography. -->
