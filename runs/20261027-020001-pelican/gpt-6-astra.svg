      <path d="M321 242L346 257M312 251L334 263" fill="none" stroke-width="3"/>
      <path d="M353 240Q399 264 459 268" fill="none" stroke="#fffdf0" stroke-width="18"/>
      <path d="M449 267L465 270" fill="none"/>

      <path d="M415 177L565 191Q550 247 482 242Q428 235 415 194Z" fill="#f9b64c"/>
      <path d="M416 176L568 188L581 199L418 196Z" fill="#ffda6c"/>
      <path d="M435 207Q474 233 524 219" fill="none" stroke="#d18839" stroke-width="3"/>

