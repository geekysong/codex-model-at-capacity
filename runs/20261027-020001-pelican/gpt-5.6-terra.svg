    <path d="M495 316 L534 237" fill="none" stroke="#f19d3a" stroke-width="14" stroke-linecap="round"/>
    <path d="M529 238 L548 237" stroke="#263447" stroke-width="7" stroke-linecap="round"/>

    <rect x="309" y="315" width="76" height="57" rx="7" fill="#80523a" stroke="#263447" stroke-width="6"/>
    <path d="M330 315 V301 Q347 286 364 301 V315" fill="none" stroke="#263447" stroke-width="6"/>
    <path d="M321 336 H372" stroke="#d9b05e" stroke-width="5"/>
    <text x="347" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#fff7d7">FISH</text>
  </g>

  <g transform="translate(593 264)">
    <rect width="149" height="82" rx="8" fill="#fff6cf" stroke="#263447" stroke-width="6"/>
    <text x="74" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#e94c42">BIKE LANE</text>
    <text x="74" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263447">NO PARKING</text>
    <text x="74" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263447">OR PELICANS</text>
    <path d="M74 82 V79 L74 154" stroke="#263447" stroke-width="8"/>
  </g>

  <rect y="515" width="800" height="85" fill="#263447"/>
  <text x="400" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff7d7">“They said ride-share. I heard: ride, share fish.”</text>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#b9dce8">2026-10-27 02:03:24 SGT (UTC+08:00)</text>
</svg>