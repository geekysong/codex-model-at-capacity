      <circle cx="250" cy="410" r="72" fill="#eef3f4" stroke="#263447" stroke-width="10"/>
      <circle cx="250" cy="410" r="8" fill="#e94c42"/>
      <g stroke="#71808d" stroke-width="3">
        <path d="M250 338V482M178 410H322M199 359L301 461M301 359L199 461"/>
      </g>
    </g>
    <g class="wheel">
      <circle cx="530" cy="410" r="72" fill="#eef3f4" stroke="#263447" stroke-width="10"/>
      <circle cx="530" cy="410" r="8" fill="#e94c42"/>
      <g stroke="#71808d" stroke-width="3">
        <path d="M530 338V482M458 410H602M479 359L581 461M581 359L479 461"/>
      </g>
    </g>

    <g fill="none" stroke="#e94c42" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 410 L330 285 L415 410 Z"/>
      <path d="M415 410 L530 410 L465 280"/>
      <path d="M330 285 L465 280"/>
      <path d="M465 280 L500 235 L543 235"/>
      <path d="M330 285 L304 251"/>
