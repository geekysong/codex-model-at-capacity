<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals for Office</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle while carrying an oversized briefcase of fish.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .bob { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
    .leg-a { transform-box: fill-box; transform-origin: 50% 0%; animation: pedalA .75s ease-in-out infinite; }
    .leg-b { transform-box: fill-box; transform-origin: 50% 0%; animation: pedalB .75s ease-in-out infinite; }
    .blink { animation: blink 3.2s infinite; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 0%,100% { transform: rotate(22deg); } 50% { transform: rotate(-28deg); } }
    @keyframes pedalB { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(22deg); } }
    @keyframes blink { 0%,45%,48%,100% { transform: scaleY(1); } 46%,47% { transform: scaleY(.08); } }
  </style>

  <rect width="800" height="600" fill="#8ed4ed"/>
  <path d="M0 345 Q120 290 235 335 T470 324 T800 330 V505 H0Z" fill="#76bb62"/>
  <path d="M0 416 Q145 380 290 418 T560 404 T800 420 V505 H0Z" fill="#5b9e50"/>
  <path d="M0 473 Q125 449 250 474 T510 460 T800 475 V505 H0Z" fill="#d4a64f"/>
  <path d="M0 483 H800" stroke="#8e6a38" stroke-width="6" stroke-dasharray="22 15"/>

  <g fill="#fff7d7" opacity=".95">
    <ellipse cx="106" cy="90" rx="58" ry="25"/>
    <ellipse cx="157" cy="88" rx="48" ry="31"/>
    <ellipse cx="632" cy="116" rx="67" ry="25"/>
    <ellipse cx="689" cy="111" rx="52" ry="32"/>
  </g>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#263447">PELICAN COMMUTE: ZERO EMISSIONS*</text>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#263447">*Except for the executive fish breath.</text>

  <g aria-label="bicycle">
