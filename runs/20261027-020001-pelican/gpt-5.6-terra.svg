    <path d="M282 246 H326" stroke="#263447" stroke-width="13" stroke-linecap="round"/>
    <path d="M530 410 L548 354" stroke="#263447" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="556" cy="348" rx="27" ry="10" fill="#263447"/>
    <circle cx="415" cy="410" r="22" fill="#f5c84d" stroke="#263447" stroke-width="6"/>
