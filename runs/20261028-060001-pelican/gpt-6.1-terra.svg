<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on Patrol</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly carrying an enormous fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#626b78"/>
      <stop offset="1" stop-color="#303640"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#18202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202733;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#202733;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202733}
      .white{fill:#fff}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="52" fill="#fff7b2" opacity=".85"/>
  <path d="M0 305 Q120 245 250 295 T510 285 T800 300 V390 H0Z" fill="#8cc87e"/>
  <path d="M0 350 Q160 300 315 345 T620 335 T800 350 V405 H0Z" fill="#5aa66b"/>
  <path d="M0 410 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 470 H800" stroke="#f8dc78" stroke-width="8" stroke-dasharray="48 34" opacity=".9"/>
  <path d="M0 540 H800" stroke="#252b35" stroke-width="3" opacity=".5"/>

  <g filter="url(#shadow)">
    <rect x="38" y="28" width="365" height="78" rx="18" fill="#fff9df" class="ink"/>
    <text x="60" y="63" class="label" font-size="31" font-weight="900">PELICAN ON PATROL</text>
    <text x="61" y="91" class="label" font-size="17" font-weight="700">“I brake for absolutely nothing.”</text>
  </g>

  <!-- bicycle -->
  <g id="bike" class="ink" fill="none">
    <g id="rearWheel" transform="translate(273 462)">
      <circle r="72" fill="#222a35"/>
      <circle r="60" fill="#dbe7ed" stroke-width="5"/>
      <g stroke="#71808b" stroke-width="3">
        <path d="M0-60V60M-60 0H60M-42-42L42 42M42-42L-42 42"/>
      </g>
      <circle r="10" fill="#f0b83c"/>
      <animateTransform attributeName="transform" type="rotate" from="0 273 462" to="360 273 462" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g id="frontWheel" transform="translate(585 462)">
      <circle r="72" fill="#222a35"/>
      <circle r="60" fill="#dbe7ed" stroke-width="5"/>
      <g stroke="#71808b" stroke-width="3">
        <path d="M0-60V60M-60 0H60M-42-42L42 42M42-42L-42 42"/>
      </g>
      <circle r="10" fill="#f0b83c"/>
      <animateTransform attributeName="transform" type="rotate" from="0 585 462" to="360 585 462" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <path d="M273 462 L380 380 L470 462 L273 462 M380 380 L430 462 M380 380 L345 330 M470 462 L585 462 M470 462 L505 350 L585 462 M505 350 L535 330" stroke-width="8"/>
    <circle cx="380" cy="462" r="15" fill="#f0b83c"/>
    <path d="M380 462 L350 430 M380 462 L414 490" stroke-width="7"/>
    <path d="M505 350 L545 350" stroke-width="8"/>
  </g>

  <!-- pelican body and bobbing motion -->
  <g id="pelican" transform="translate(0 0)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 5;0 0" dur="1.2s" repeatCount="indefinite"/>
    <!-- tail -->
    <path d="M335 300 Q285 285 260 315 Q302 325 342 330Z" fill="#d3e8ef" class="ink"/>
    <!-- body -->
    <ellipse cx="403" cy="307" rx="92" ry="104" fill="#e9f5f7" class="ink"/>
    <path d="M365 235 Q395 205 435 232 Q452 260 430 284 Q397 293 365 270Z" fill="#c1dce3" class="thin"/>
    <!-- wing -->
    <path d="M374 300 Q430 268 468 316 Q445 371 385 375 Q360 350 374 300Z" fill="#b5d4dc" class="ink"/>
    <path d="M390 330 Q424 319 448 328" class="thin" fill="none"/>
    <!-- neck and head -->
    <path d="M420 238 Q429 178 468 158 Q500 150 520 176 L512 239Z" fill="#e9f5f7" class="ink"/>
    <ellipse cx="500" cy="146" rx="58" ry="51" fill="#f4fbfc" class="ink"/>
    <!-- beak -->
    <path d="M526 155 Q631 150 670 184 Q641 222 527 190 Q500 177 526 155Z" fill="#f3b344" class="ink"/>
    <path d="M531 177 Q603 188 661 184" class="thin" fill="none"/>
    <path d="M588 166 Q602 170 615 176" stroke="#202733" stroke-width="3" fill="none"/>
    <!-- eye and brow -->
    <circle cx="520" cy="139" r="9" fill="#202733"/>
    <path d="M503 118 Q527 104 548 118" stroke="#202733" stroke-width="8" fill="none"/>
    <!-- helmet -->
    <path d="M456 111 Q503 68 553 108 L550 126 L463 126Z" fill="#e45757" class="ink"/>
    <path d="M475 104 Q503 84 530 104" stroke="#fff2cf" stroke-width="7" fill="none"/>
    <!-- legs -->
    <path d="M392 394 L377 450 M430 394 L451 450" stroke="#e2a34d" stroke-width="13"/>
    <path d="M370 448 L397 448 M444 448 L472 448" stroke="#202733" stroke-width="8"/>
    <!-- fish trophy -->
    <g transform="translate(260 210) rotate(-12)">
      <path d="M0 18 Q48 -18 105 14 Q48 48 0 18Z" fill="#67b7c6" class="ink"/>
      <path d="M104 14 L132 -8 L128 39Z" fill="#ef8c53" class="ink"/>
      <circle cx="22" cy="13" r="5" fill="#202733"/>
      <path d="M45 0 Q56 18 45 36" stroke="#2d7180" stroke-width="4" fill="none"/>
      <path d="M72 2 Q83 18 72 32" stroke="#2d7180" stroke-width="4" fill="none"/>
      <text x="23" y="78" class="label" font-size="16" font-weight="900" transform="rotate(12 23 78)">EVIDENCE</text>
    </g>
    <!-- wing holding fish -->
    <path d="M365 294 Q318 263 278 231" stroke="#b5d4dc" stroke-width="25" fill="none"/>
    <circle cx="275" cy="230" r="12" fill="#e2a34d" class="thin"/>
  </g>

  <!-- motion marks -->
  <path d="M175 395 l-38 -15 M188 420 l-48 0 M638 350 l42 -20" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8">
    <animate attributeName="opacity" values=".15;.9;.15" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <g>
    <rect x="154" y="520" width="492" height="43" rx="12" fill="#f7f1dc" opacity=".96" class="ink"/>
    <text x="400" y="548" text-anchor="middle" class="label" font-size="19" font-weight="800">A beak, two wheels, and zero traffic laws.</text>
  </g>

  <text x="400" y="588" text-anchor="middle" class="label" font-size="14" font-weight="700">2026-10-28 06:01:43 SGT (UTC+08:00)</text>
</svg>