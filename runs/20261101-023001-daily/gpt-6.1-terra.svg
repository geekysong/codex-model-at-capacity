    <text x="180" y="170">11</text><text x="230" y="170">12</text><text x="280" y="170">13</text><text x="330" y="170">14</text><text x="380" y="170">15</text>
    <text x="180" y="220">20</text><text x="230" y="220">19</text><text x="280" y="220">18</text><text x="330" y="220">17</text><text x="380" y="220">16</text>
    <text x="180" y="270">21</text><text x="230" y="270">22</text><text x="280" y="270">23</text><text x="330" y="270">24</text><text x="380" y="270">25</text>
