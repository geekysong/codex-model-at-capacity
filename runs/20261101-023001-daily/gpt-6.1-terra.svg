<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">A path through all 25 cells — 24 moves</title>
  <desc id="desc">A five by five grid with a continuous path from the top-left cell to the bottom-right cell, visiting each cell exactly once.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Visit every cell — 24 moves</text>

  <rect x="175" y="55" width="250" height="250" fill="#ffffff" stroke="#475569" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="1">
    <path d="M225 55V305 M275 55V305 M325 55V305 M375 55V305"/>
    <path d="M175 105H425 M175 155H425 M175 205H425 M175 255H425"/>
  </g>

