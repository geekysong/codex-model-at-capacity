  <circle cx="200" cy="80" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="400" cy="280" r="8" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="start">
