    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#333" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#18212b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#18212b}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 420 Q120 370 240 420 T480 420 T720 420 T960 420 V600 H0Z" fill="#8bcf73"/>
  <path d="M0 470 Q180 430 360 470 T720 470 T1000 470" fill="none" stroke="#62a85e" stroke-width="8"/>
