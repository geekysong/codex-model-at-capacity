<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Power Ride</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly claiming it is traffic enforcement.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#d8f5ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60666f"/>
      <stop offset="1" stop-color="#30343b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#18202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#18202a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#18202a; }
      .small { font-size:18px; font-weight:700; letter-spacing:.4px; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.4s linear infinite; }
      .rider { transform-box:fill-box; transform-origin:center bottom; animation:bob .8s ease-in-out infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0) rotate(-1deg); } to { transform:translateY(-5px) rotate(1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="684" cy="94" r="43" fill="#fff4ad" opacity=".9"/>
  <path d="M0 350 Q130 280 255 350 T520 350 T800 330 V430 H0Z" fill="#8bc58c"/>
  <path d="M0 395 Q180 340 360 400 T800 390 V600 H0Z" fill="#6ca36f"/>
  <path d="M0 455 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 512 H800" stroke="#f5d76e" stroke-width="8" stroke-dasharray="48 34" opacity=".9"/>

  <text x="400" y="56" text-anchor="middle" class="label" font-size="34" font-weight="900" fill="#0e3c55">PELICAN POWER RIDE!</text>
  <text x="400" y="87" text-anchor="middle" class="label" font-size="19" font-weight="700">“Because waddling to work was taking forever.”</text>

  <g transform="translate(35 120)" filter="url(#shadow)">
    <rect width="205" height="94" rx="18" fill="#fff" class="ink"/>
    <path d="M158 94 l25 23 4-27" fill="#fff" class="ink"/>
    <text x="18" y="36" class="label" font-size="20" font-weight="800">OFFICIAL</text>
    <text x="18" y="63" class="label" font-size="20" font-weight="800">BIRD TRAFFIC COP</text>
    <text x="18" y="84" class="label" font-size="14" font-weight="700" fill="#c84b3d">Tickets payable in fish.</text>
  </g>

  <g transform="translate(0 10)">
    <g class="wheel">
      <circle cx="250" cy="450" r="76" fill="#18202a" opacity=".18"/>
      <circle cx="250" cy="450" r="66" fill="#e8eef2" class="ink"/>
      <circle cx="250" cy="450" r="7" fill="#e45d4d" class="ink"/>
      <path d="M250 384V516 M184 450H316 M203 403L297 497 M297 403L203 497" stroke="#7c8a94" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="590" cy="450" r="76" fill="#18202a" opacity=".18"/>
      <circle cx="590" cy="450" r="66" fill="#e8eef2" class="ink"/>
      <circle cx="590" cy="450" r="7" fill="#e45d4d" class="ink"/>
      <path d="M590 384V516 M524 450H656 M543 403L637 497 M637 403L543 497" stroke="#7c8a94" stroke-width="4"/>
    </g>

    <g class="ink" fill="none">
      <path d="M250 450 L350 330 L470 450 L590 450 L470 330 L350 330"/>
      <path d="M470 330 L500 275"/>
      <path d="M470 330 L430 260"/>
      <path d="M350 330 L320 270"/>
      <path d="M320 270 H390"/>
    </g>
    <path d="M476 260 h58" class="ink" fill="none"/>
    <path d="M477 260 q-14-9-3-18 q12-7 26 1" fill="#e45d4d" class="ink"/>

    <g class="rider">
      <ellipse cx="427" cy="274" rx="66" ry="82" fill="#f7f1dd" class="ink"/>
      <path d="M385 262 q-20 61 26 89 q53 28 85-19 q20-30-2-70" fill="#f7f1dd" class="ink"/>
      <path d="M400 245 q-37-45-8-89 q23-35 72-9 q37 21 22 72 q-12 38-48 41Z" fill="#f7f1dd" class="ink"/>
      <path d="M457 176 q71-13 122 28 q-41 36-112 19Z" fill="#f4a645" class="ink"/>
      <path d="M555 203 l28 8 -28 14" fill="#e67e32" class="ink"/>
      <circle cx="454" cy="170" r="7" fill="#18202a"/>
      <path d="M405 145 q29-35 62-4" fill="none" class="ink"/>
      <path d="M402 279 q-48 20-75-6" fill="none" class="ink"/>
      <path d="M486 276 q36 16 55-8" fill="none" class="ink"/>
      <path d="M394 349 l-18 68" class="ink"/>
      <path d="M482 350 l18 68" class="ink"/>
      <path d="M368 417 q18 11 34 0" class="ink"/>
      <path d="M492 417 q18 11 34 0" class="ink"/>
      <path d="M390 308 q-14 40-57 41" class="ink"/>
      <path d="M490 310 q31 25 59 9" class="ink"/>
      <path d="M331 349 l-25 17 M549 319 l27-17" class="ink"/>
      <path d="M422 347 q23 19 47 0" fill="none" class="ink"/>
      <path d="M449 344 q-10 18 4 25" fill="none" class="ink"/>
      <path d="M430 365 q25 14 41-2" fill="none" class="ink"/>
      <path d="M425 423 l-25 22 M508 423 l25 22" class="ink"/>
      <circle cx="400" cy="445" r="8" fill="#e45d4d" class="ink"/>
      <circle cx="533" cy="445" r="8" fill="#e45d4d" class="ink"/>
    </g>

    <g transform="translate(566 255)">
      <path d="M0 0 q42-30 74 3 q-32 29-74 0Z" fill="#ffdc59" class="ink"/>
      <text x="37" y="7" text-anchor="middle" class="label" font-size="15" font-weight="900">HONK!</text>
    </g>
  </g>

  <g transform="translate(530 535)">
    <rect x="0" y="0" width="240" height="38" rx="12" fill="#fff" opacity=".9" class="ink"/>
    <text x="120" y="25" text-anchor="middle" class="label small">Pedal faster, judge slower.</text>
  </g>

  <text x="400" y="590" text-anchor="middle" class="label" font-size="15" font-weight="700">2026-10-28 16:31:25 SGT (UTC+08:00)</text>
</svg>