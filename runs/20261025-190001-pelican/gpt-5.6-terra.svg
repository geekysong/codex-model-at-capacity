  <g class="label">
    <path d="M611 186 Q648 167 691 182 Q674 222 628 216Z" fill="#fff7cf" class="ink"/>
    <path d="M649 217 L646 235 L661 219" fill="#fff7cf" class="ink"/>
    <text x="650" y="202" text-anchor="middle" font-size="16" font-weight="bold">HONK!</text>
  </g>

  <rect x="0" y="516" width="800" height="84" fill="#18233b"/>
  <text x="400" y="548" text-anchor="middle" fill="#fff7cf" font-family="Arial,sans-serif" font-size="20" font-weight="bold">AERODYNAMICS ARE FOR BIRDS. OH, WAIT.</text>
  <text x="400" y="578" text-anchor="middle" fill="#b9e8f7" font-family="Arial,sans-serif" font-size="16">2026-10-25 19:02:52 SGT (UTC+08:00)</text>
</svg>