    </g>

    <path d="M357 303 Q322 276 337 210 Q349 156 407 163 Q437 168 436 214 Q433 259 400 280Z" fill="#f7f1d5" class="ink"/>
    <path d="M365 225 Q310 205 254 236 Q305 264 367 258 Q397 255 402 232 Q396 216 365 225Z" fill="#f4a83b" class="ink"/>
    <path d="M263 238 Q312 239 355 233" class="thin" fill="none"/>
    <circle cx="390" cy="199" r="13" fill="white" class="thin"/>
    <circle cx="394" cy="201" r="5" fill="#18233b"/>
    <path d="M373 184 Q391 171 409 184" fill="none" class="thin"/>
    <path d="M358 278 Q383 294 409 276" fill="none" class="thin"/>
