<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Power Pedal</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f4"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60656f"/>
      <stop offset="1" stop-color="#30343b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202733;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202733}
      .small{font-size:18px;font-weight:700}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .pelican{transform-box:fill-box;transform-origin:center;animation:bob .8s ease-in-out infinite alternate}
      .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="95" cy="105" r="48" fill="#ffe27a" opacity=".9"/>
  <path d="M0 255 Q120 205 240 255 T480 255 T720 255 T960 255 V390 H0Z" fill="#8bcf9b"/>
  <path d="M0 315 Q160 270 320 320 T640 315 T900 325 V390 H0Z" fill="#62ae78"/>

  <g opacity=".7" fill="none" class="ink" stroke-width="4">
    <path d="M115 160 q18-18 36 0 q18-18 36 0"/>
    <path d="M625 125 q18-18 36 0 q18-18 36 0"/>
  </g>

  <rect x="0" y="382" width="800" height="122" fill="url(#road)"/>
  <path d="M0 443 H800" stroke="#f5d56a" stroke-width="8" stroke-dasharray="46 30"/>
  <path d="M0 382 H800" stroke="#202733" stroke-width="8"/>

  <g filter="url(#shadow)">
    <rect x="57" y="38" width="686" height="92" rx="22" fill="#fff7d6" class="ink"/>
    <text x="400" y="79" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN POWER PEDAL</text>
    <text x="400" y="108" text-anchor="middle" class="label small">“Beak performance. Zero emissions. Maximum fish-tory.”</text>
  </g>

  <g class="pelican">
    <!-- tail feathers -->
    <path d="M276 326 q-52-28-70 5 q34 2 63 28" fill="#f5f0e2" class="ink"/>
    <path d="M276 326 q-44-47-66-22 q23 18 50 52" fill="#d6dce0" class="ink"/>

    <!-- body -->
    <ellipse cx="343" cy="285" rx="93" ry="82" fill="#f8f5e9" class="ink"/>
    <path d="M295 289 q42-65 104-18 q-12 52-72 65 q-30-7-32-47Z" fill="#dbe5e8" class="ink"/>
    <path d="M353 225 q-30-47 5-73 q42 4 47 48 q-8 35-52 25Z" fill="#f8f5e9" class="ink"/>
    <circle cx="385" cy="176" r="8" fill="#202733"/>
    <path d="M399 188 q64-22 126 5 q-34 22-109 19Z" fill="#f2a23a" class="ink"/>
    <path d="M405 204 q52 7 95 0 q-30 44-82 13Z" fill="#f7b95a" class="ink"/>

    <!-- fish in beak -->
    <g transform="translate(506 160) rotate(8)">
      <ellipse cx="48" cy="18" rx="42" ry="19" fill="#8fc8dc" class="ink"/>
      <path d="M8 18 L-18 0 L-11 36Z" fill="#8fc8dc" class="ink"/>
      <circle cx="66" cy="12" r="4" fill="#202733"/>
      <path d="M40 0 q12-20 24 0" fill="none" class="ink" stroke-width="4"/>
      <text x="47" y="45" text-anchor="middle" class="label" font-size="13" font-weight="800">LUNCH</text>
    </g>

    <!-- wing and scarf -->
    <path d="M326 253 q-45 17-31 66 q31 16 63-7 q-13-31-32-59Z" fill="#c6d2d7" class="ink"/>
    <path d="M350 218 q49 10 75-7 l-8 24 q-38 20-70 2Z" fill="#e34f4f" class="ink"/>
    <path d="M412 227 q31 4 55 32 l-20 9 q-26-13-43-31Z" fill="#e34f4f" class="ink"/>

    <!-- legs -->
    <path d="M331 343 L324 397" fill="none" class="ink"/>
    <path d="M382 344 L399 397" fill="none" class="ink"/>
    <path d="M315 398 q16-7 30 0" fill="none" class="ink"/>
    <path d="M391 398 q17-7 31 1" fill="none" class="ink"/>

    <!-- bicycle frame -->
    <g>
      <circle cx="274" cy="458" r="69" fill="none" stroke="#202733" stroke-width="9" class="wheel"/>
      <circle cx="566" cy="458" r="69" fill="none" stroke="#202733" stroke-width="9" class="wheel"/>
      <g stroke="#7ed0df" stroke-width="4" opacity=".9">
        <path d="M274 458 L274 389 M274 458 L337 507 M274 458 L211 507 M274 458 L343 458"/>
        <path d="M566 458 L566 389 M566 458 L629 507 M566 458 L503 507 M566 458 L635 458"/>
      </g>
      <path d="M274 458 L363 401 L440 458 L343 458 Z" fill="none" stroke="#e34f4f" stroke-width="9"/>
      <path d="M363 401 L391 358" fill="none" stroke="#202733" stroke-width="8"/>
      <path d="M381 355 h43" fill="none" stroke="#202733" stroke-width="8"/>
      <path d="M440 458 L494 382 L566 458" fill="none" stroke="#e34f4f" stroke-width="9"/>
      <path d="M494 382 L512 358" fill="none" stroke="#202733" stroke-width="8"/>
      <path d="M501 355 h34" fill="none" stroke="#202733" stroke-width="8"/>
      <g class="pedal">
        <circle cx="343" cy="458" r="13" fill="#f2a23a" class="ink"/>
        <path d="M343 458 l-25-18 M343 458 l27 20" fill="none" class="ink"/>
      </g>
    </g>

    <!-- feet on pedals -->
    <path d="M324 397 q12 13 19 43" fill="none" class="ink"/>
    <path d="M399 397 q-7 21-29 45" fill="none" class="ink"/>
  </g>

  <g transform="translate(625 290)">
    <path d="M0 0 q42-18 84 0 v64 q-42 18-84 0Z" fill="#fff7d6" class="ink"/>
    <text x="42" y="28" text-anchor="middle" class="label" font-size="16" font-weight="900">HONK!</text>
    <text x="42" y="49" text-anchor="middle" class="label" font-size="13">I’m aerodynamic!</text>
  </g>

  <text x="400" y="535" text-anchor="middle" class="label" font-size="20" font-weight="800">A bird, a bike, and one very committed beak.</text>
  <text x="400" y="575" text-anchor="middle" class="label" font-size="16">2026-10-28 18:02:45 SGT (UTC+08:00)</text>
</svg>