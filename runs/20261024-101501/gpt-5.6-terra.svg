<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#39204d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21142d"/>
      <stop offset="0.5" stop-color="#5d214e"/>
      <stop offset="1" stop-color="#21142d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e5ef"/>
      <stop offset="0.45" stop-color="#72899c"/>
      <stop offset="1" stop-color="#293847"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="brick" width="44" height="24" patternUnits="userSpaceOnUse">
      <rect width="44" height="24" fill="#28203c"/>
      <path d="M0 23H44M22 0V12M0 12H22M44 12H22" stroke="#3d2d50" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="0" y="105" width="800" height="270" fill="url(#brick)" opacity=".9"/>
  <path d="M0 375 Q200 330 400 375 T800 375 V600 H0Z" fill="url(#floor)"/>
  <path d="M0 470 Q200 420 400 470 T800 470" fill="none" stroke="#f06ab5" stroke-width="3" opacity=".35"/>
  <path d="M0 520 Q200 470 400 520 T800 520" fill="none" stroke="#59d7ff" stroke-width="3" opacity=".25"/>

  <text x="400" y="48" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" fill="#fff" letter-spacing="2">CODEX NIGHTCLUB</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#ff78c8">THE EXCLUSIVE MODEL LOUNGE</text>

  <g filter="url(#glow)">
    <rect x="292" y="118" width="216" height="78" rx="12" fill="#160d1e" stroke="#ff315e" stroke-width="5"/>
    <text x="400" y="169" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="48" fill="#ff315e" letter-spacing="5">FULL</text>
  </g>
  <circle cx="310" cy="135" r="4" fill="#ffe36e"/>
  <circle cx="490" cy="135" r="4" fill="#ffe36e"/>

  <!-- club doorway and the one admitted model -->
  <rect x="566" y="164" width="188" height="232" rx="10" fill="#080b15" stroke="#8df5ff" stroke-width="4"/>
  <path d="M590 390V198Q660 140 730 198V390" fill="#102842" stroke="#40d9ff" stroke-width="3"/>
  <path d="M620 270 Q660 230 700 270" fill="none" stroke="#ffdc67" stroke-width="8"/>
  <text x="660" y="224" text-anchor="middle" font-family="Arial Black" font-size="14" fill="#aef7ff">VIP MODEL</text>
  <g transform="translate(660 300)">
    <rect x="-31" y="-25" width="62" height="52" rx="14" fill="#bdcbd4" stroke="#263944" stroke-width="4"/>
    <circle cx="-12" cy="-3" r="7" fill="#55f5ff"/>
    <circle cx="12" cy="-3" r="7" fill="#55f5ff"/>
    <path d="M-15 14 Q0 25 15 14" fill="none" stroke="#263944" stroke-width="4"/>
    <path d="M0 -26V-40M-7 -40H7" stroke="#e9f4f8" stroke-width="4"/>
  </g>
  <text x="660" y="373" text-anchor="middle" font-family="Arial Black" font-size="15" fill="#ffe36e">“I’M THE DIFFERENT MODEL”</text>

  <!-- bouncer -->
  <g transform="translate(435 290)">
    <ellipse cx="0" cy="137" rx="74" ry="15" fill="#130d1d" opacity=".7"/>
    <rect x="-50" y="-53" width="100" height="93" rx="24" fill="url(#metal)" stroke="#182832" stroke-width="5"/>
    <path d="M-37 -32 Q0 -63 37 -32" fill="none" stroke="#ffdc67" stroke-width="8"/>
    <circle cx="-19" cy="-8" r="10" fill="#202d38"/>
    <circle cx="19" cy="-8" r="10" fill="#202d38"/>
    <circle cx="-19" cy="-8" r="4" fill="#ff395e"/>
    <circle cx="19" cy="-8" r="4" fill="#ff395e"/>
    <path d="M-25 18 Q0 29 25 18" fill="none" stroke="#24313b" stroke-width="6"/>
    <rect x="-60" y="38" width="120" height="84" rx="18" fill="#455c6b" stroke="#182832" stroke-width="5"/>
    <path d="M-49 62H49M-49 91H49" stroke="#9eb2be" stroke-width="5"/>
    <path d="M-60 55L-94 82M60 55L93 38" stroke="#455c6b" stroke-width="18" stroke-linecap="round"/>
    <path d="M-37 120L-49 157M37 120L49 157" stroke="#263944" stroke-width="18" stroke-linecap="round"/>
    <rect x="-109" y="73" width="57" height="29" rx="8" fill="#ff426f" transform="rotate(-15 -109 73)"/>
    <text x="-80" y="94" text-anchor="middle" font-family="Arial Black" font-size="12" fill="#fff" transform="rotate(-15 -80 94)">NOPE</text>
  </g>

  <!-- velvet rope -->
  <path d="M352 401 Q260 452 160 430" fill="none" stroke="#d71956" stroke-width="12"/>
  <path d="M352 401 Q260 452 160 430" fill="none" stroke="#ff6f9e" stroke-width="3"/>
  <circle cx="352" cy="401" r="13" fill="#f2c45c" stroke="#633b3e" stroke-width="4"/>
  <circle cx="160" cy="430" r="13" fill="#f2c45c" stroke="#633b3e" stroke-width="4"/>
  <path d="M352 401V500M160 430V507" stroke="#c49a4d" stroke-width="8"/>
  <ellipse cx="352" cy="503" rx="22" ry="7" fill="#8e6938"/>
  <ellipse cx="160" cy="510" rx="22" ry="7" fill="#8e6938"/>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(62 390)">
      <circle cx="0" cy="-25" r="23" fill="#c98766"/><path d="M-22 -28Q0-55 23-28" fill="#49302f"/>
      <rect x="-27" y="0" width="54" height="64" rx="14" fill="#4ba7c7"/>
      <path d="M-12 22h24" stroke="#17485b" stroke-width="5"/><path d="M-39 16L-26 30M39 16L26 30" stroke="#c98766" stroke-width="12"/>
      <path d="M-17 48v28M17 48v28" stroke="#303347" stroke-width="13"/>
      <text x="0" y="101" text-anchor="middle" fill="#ffe7b0" font-size="13">“again?”</text>
    </g>
    <g transform="translate(145 365)">
      <circle cx="0" cy="-25" r="23" fill="#e0a178"/><path d="M-22 -30Q0-58 24-27" fill="#d9dce2"/>
      <rect x="-27" y="0" width="54" height="64" rx="14" fill="#e35a65"/>
      <path d="M-14 15q14 15 28 0" fill="none" stroke="#6a2335" stroke-width="5"/>
      <path d="M-37 15L-26 30M37 15L26 30" stroke="#e0a178" stroke-width="12"/>
      <path d="M-17 48v28M17 48v28" stroke="#303347" stroke-width="13"/>
      <text x="0" y="100" text-anchor="middle" fill="#ffe7b0" font-size="13">“ship it?”</text>
    </g>
    <g transform="translate(235 405)">
      <circle cx="0" cy="-25" r="23" fill="#9a604c"/><path d="M-22 -30Q0-57 24-30" fill="#202536"/>
      <rect x="-27" y="0" width="54" height="64" rx="14" fill="#8b72d8"/>
      <path d="M-38 15L-26 30M38 15L26 30" stroke="#9a604c" stroke-width="12"/>
      <path d="M-17 48v28M17 48v28" stroke="#303347" stroke-width="13"/>
      <text x="0" y="101" text-anchor="middle" fill="#ffe7b0" font-size="13">“please…”</text>
    </g>
  </g>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(90 145)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="#8e9aaa" stroke-width="11"/>
    <circle cx="0" cy="0" r="39" fill="none" stroke="#526373" stroke-width="5"/>
    <path d="M-36-35L36 35M36-35L-36 35" stroke="#526373" stroke-width="5"/>
    <ellipse cx="0" cy="2" rx="16" ry="22" fill="#c77a48"/>
    <circle cx="-6" cy="-6" r="3" fill="#191323"/><circle cx="6" cy="-6" r="3" fill="#191323"/>
    <path d="M-8 7q8 7 16 0" fill="none" stroke="#191323" stroke-width="3"/>
    <path d="M-27 52q-10 20 4 29t19-10q7 24 24 18t11-27" fill="#ff784d"/>
    <text x="0" y="87" text-anchor="middle" font-family="Arial Black" font-size="13" fill="#ffac67">SERVER #404</text>
  </g>
  <g transform="translate(224 135) scale(.78)">
    <circle cx="0" cy="0" r="54" fill="none" stroke="#8e9aaa" stroke-width="11"/>
    <circle cx="0" cy="0" r="39" fill="none" stroke="#526373" stroke-width="5"/>
    <path d="M-36-35L36 35M36-35L-36 35" stroke="#526373" stroke-width="5"/>
    <ellipse cx="0" cy="2" rx="16" ry="22" fill="#c77a48"/>
    <circle cx="-6" cy="-6" r="3" fill="#191323"/><circle cx="6" cy="-6" r="3" fill="#191323"/>
    <path d="M-8 7q8 7 16 0" fill="none" stroke="#191323" stroke-width="3"/>
    <path d="M-27 52q-10 20 4 29t19-10q7 24 24 18t11-27" fill="#ff784d"/>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#fff">“SELECTED MODEL IS AT CAPACITY. PLEASE TRY A DIFFERENT MODEL.”</text>
</svg>