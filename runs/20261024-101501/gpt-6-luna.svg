<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#090914"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#784cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .ink{stroke:#17152b;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .txt{font-family:Arial,Helvetica,sans-serif}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 420 Q180 380 350 420 T800 410 V600 H0Z" fill="#111021"/>
  <path d="M0 90 Q120 35 240 80 T480 75 T800 90" fill="none" stroke="#3d315a" stroke-width="8"/>
  <circle cx="90" cy="120" r="18" fill="#ff3cac" filter="url(#glow)"/>
  <circle cx="720" cy="115" r="18" fill="#30e6ff" filter="url(#glow)"/>

  <text x="400" y="52" text-anchor="middle" class="txt" font-size="29" font-weight="900" fill="#fff">
    CODEX NIGHTCLUB
  </text>
  <text x="400" y="82" text-anchor="middle" class="txt" font-size="17" font-weight="700" fill="#ff77c8">
    THE EXCLUSIVE MODEL EXPERIENCE
  </text>

  <!-- Club entrance -->
  <rect x="485" y="115" width="275" height="335" rx="22" fill="#201936" class="ink"/>
  <rect x="512" y="171" width="221" height="245" rx="15" fill="#080812" stroke="#694e9e" stroke-width="6"/>
  <path d="M545 409 V214 Q545 184 574 184 H671 Q700 184 700 214 V409" fill="#141026"/>
  <path d="M562 337 Q622 287 683 337" fill="none" stroke="#ff3cac" stroke-width="5" opacity=".8"/>
  <path d="M558 365 Q620 315 689 365" fill="none" stroke="#30e6ff" stroke-width="4" opacity=".7"/>

  <!-- FULL sign -->
  <rect x="543" y="105" width="165" height="67" rx="10" fill="#ff174f" class="ink"/>
  <rect x="551" y="113" width="149" height="51" rx="6" fill="#ff385f" stroke="#ff9aab" stroke-width="3" filter="url(#glow)"/>
  <text x="625" y="148" text-anchor="middle" class="txt" font-size="34" font-weight="900" fill="#fff">FULL</text>

  <!-- VIP model inside -->
  <g transform="translate(618 240)">
    <ellipse cx="0" cy="104" rx="49" ry="12" fill="#000" opacity=".45"/>
    <rect x="-34" y="25" width="68" height="70" rx="18" fill="#69e7ff" class="ink"/>
    <circle cx="-13" cy="53" r="7" fill="#17152b"/>
    <circle cx="13" cy="53" r="7" fill="#17152b"/>
    <path d="M-20 75 Q0 88 20 75" fill="none" class="ink"/>
    <path d="M-47 38 Q-72 8 -53 -21" fill="none" stroke="#69e7ff" stroke-width="13"/>
    <path d="M47 38 Q72 8 53 -21" fill="none" stroke="#69e7ff" stroke-width="13"/>
    <path d="M-25 95 L-40 122 M25 95 L40 122" stroke="#69e7ff" stroke-width="13"/>
    <path d="M-55 -30 Q0 -62 55 -30" fill="none" stroke="#ffd34e" stroke-width="8"/>
    <text x="0" y="-74" text-anchor="middle" class="txt" font-size="14" font-weight="900" fill="#ffd34e">MODEL 1</text>
  </g>

  <!-- Robot bouncer -->
  <g transform="translate(440 262)">
    <ellipse cx="0" cy="188" rx="91" ry="18" fill="#000" opacity=".5"/>
    <path d="M-64 54 Q0 29 64 54 L54 181 Q0 204 -54 181Z" fill="#7f879d" class="ink"/>
    <rect x="-58" y="0" width="116" height="88" rx="22" fill="#9ea8bb" class="ink"/>
    <rect x="-43" y="18" width="86" height="45" rx="12" fill="#121326" class="ink"/>
    <circle cx="-20" cy="40" r="9" fill="#ff3cac" filter="url(#glow)"/>
    <circle cx="20" cy="40" r="9" fill="#30e6ff" filter="url(#glow)"/>
    <path d="M-28 72 Q0 84 28 72" fill="none" class="ink"/>
    <path d="M-38 102 L-98 63" stroke="#9ea8bb" stroke-width="18" class="ink"/>
    <path d="M38 102 L91 63" stroke="#9ea8bb" stroke-width="18" class="ink"/>
    <path d="M-101 61 L-126 45" stroke="#9ea8bb" stroke-width="14" class="ink"/>
    <path d="M91 63 L121 45" stroke="#9ea8bb" stroke-width="14" class="ink"/>
    <path d="M-38 181 L-47 230 M38 181 L47 230" stroke="#9ea8bb" stroke-width="18" class="ink"/>
    <path d="M-62 231 H-25 M25 231 H62" stroke="#9ea8bb" stroke-width="18" class="ink"/>
    <rect x="-38" y="116" width="76" height="34" rx="8" fill="#2a2444" stroke="#17152b" stroke-width="4"/>
    <text x="0" y="140" text-anchor="middle" class="txt" font-size="13" font-weight="900" fill="#ffcf4a">NOPE</text>
    <text x="0" y="-18" text-anchor="middle" class="txt" font-size="12" font-weight="900" fill="#d9d8e8">BOUNCER.exe</text>
  </g>

  <!-- Velvet rope -->
  <path d="M72 420 Q190 495 320 438 Q374 414 393 391" fill="none" stroke="#7e153c" stroke-width="15"/>
  <path d="M72 420 Q190 495 320 438 Q374 414 393 391" fill="none" stroke="#ff3b79" stroke-width="4"/>
  <g fill="#d8b45a" class="ink">
    <circle cx="72" cy="420" r="11"/><circle cx="320" cy="438" r="11"/><circle cx="393" cy="391" r="11"/>
  </g>
  <path d="M72 420 V486 M320 438 V493 M393 391 V449" stroke="#d8b45a" stroke-width="8" class="ink"/>

  <!-- Queue of tired developers -->
  <g class="ink">
    <g transform="translate(75 315)">
      <circle cx="0" cy="0" r="27" fill="#d19a78"/><path d="M-25 -5 Q0 -43 27 -8" fill="#3a2630"/>
      <path d="M-32 43 Q0 22 32 43 L39 116 H-39Z" fill="#41a6a1"/>
      <path d="M-17 6 L-8 11 M8 11 L17 6" stroke="#17152b" stroke-width="4"/>
      <path d="M-13 19 Q0 26 13 19" fill="none"/>
      <path d="M-29 64 L-70 86" stroke="#d19a78" stroke-width="12"/>
      <rect x="-87" y="79" width="49" height="28" rx="4" fill="#20243d"/>
      <text x="-62" y="98" text-anchor="middle" fill="#8ff9ff" stroke="none" font-size="12">404</text>
    </g>
    <g transform="translate(174 356)">
      <circle cx="0" cy="0" r="25" fill="#8b5e45"/><path d="M-25 -6 Q0 -39 25 -3" fill="#17152b"/>
      <path d="M-31 39 Q0 20 31 39 L37 108 H-37Z" fill="#db5d72"/>
      <path d="M-14 7 L-5 10 M7 10 L16 7" stroke-width="4"/>
      <path d="M-11 23 Q0 18 11 23" fill="none"/>
      <path d="M29 60 L69 73" stroke="#8b5e45" stroke-width="12"/>
      <path d="M63 67 l25 -13" stroke="#f3d2b3" stroke-width="7"/>
    </g>
    <g transform="translate(267 330)">
      <circle cx="0" cy="0" r="26" fill="#f1bd91"/><path d="M-26 -6 Q0 -44 27 -7" fill="#e9e4da"/>
      <path d="M-33 42 Q0 22 33 42 L40 122 H-40Z" fill="#5e75d6"/>
      <path d="M-16 8 L-7 11 M8 11 L17 8" stroke-width="4"/>
      <path d="M-12 24 Q0 18 12 24" fill="none"/>
      <path d="M-30 65 L-65 92" stroke="#f1bd91" stroke-width="12"/>
      <path d="M-65 91 l-28 2" stroke="#f1bd91" stroke-width="9"/>
    </g>
  </g>

  <!-- Melting server stack -->
  <g transform="translate(55 475)">
    <rect x="0" y="0" width="150" height="83" rx="8" fill="#45435d" class="ink"/>
    <rect x="14" y="14" width="122" height="18" rx="4" fill="#191827"/>
    <rect x="14" y="42" width="122" height="18" rx="4" fill="#191827"/>
    <circle cx="29" cy="23" r="5" fill="#ff3c72"/><circle cx="29" cy="51" r="5" fill="#ffc83d"/>
    <path d="M28 84 Q39 105 52 84 T78 88 T103 84 T130 88" fill="none" stroke="#ff704f" stroke-width="14"/>
    <path d="M18 100 Q37 125 57 101 T95 102 T136 101" fill="none" stroke="#ffb23e" stroke-width="9"/>
    <text x="75" y="-12" text-anchor="middle" class="txt" font-size="14" font-weight="900" fill="#ff8e7a">SERVER FARM (TOO HOT)</text>
  </g>

  <!-- Caption -->
  <rect x="230" y="520" width="530" height="56" rx="16" fill="#f7f2df" class="ink"/>
  <text x="495" y="545" text-anchor="middle" class="txt" font-size="18" font-weight="900" fill="#201936">
    “Sorry, the model is at capacity.”
  </text>
  <text x="495" y="565" text-anchor="middle" class="txt" font-size="14" font-weight="700" fill="#7e153c">
    Please try again after the servers stop screaming.
  </text>
</svg>