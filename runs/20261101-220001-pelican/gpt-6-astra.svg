<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle along a seaside road, carrying fish in its enormous bill pouch. The wheels rotate and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="sea" width="75" height="24" patternUnits="userSpaceOnUse">
      <path d="M8 12 Q22 4 36 12 T64 12" fill="none" stroke="#63b8bc" stroke-width="3"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #173a46; }
      .outline { stroke: #173a46; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #7a989b; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <path d="M0 116 H800 V383 H0Z" fill="#d7efeb"/>
  <circle cx="684" cy="173" r="38" fill="#ffc85e"/>
  <path d="M45 187 Q69 165 93 187 Q117 165 141 187 M581 144 Q596 131 611 144 Q626 131 641 144" fill="none" stroke="#73a5a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 302 Q169 286 342 307 T800 295 V389 H0Z" fill="#96d6d0"/>
  <path d="M0 314 H800 V390 H0Z" fill="url(#sea)"/>
  <path d="M0 376 Q203 359 403 380 T800 375 V472 H0Z" fill="#e5ce98"/>
  <path d="M0 421 Q350 395 800 421 V486 H0Z" fill="#899a96"/>
  <path d="M0 461 H800" stroke="#fceac1" stroke-width="5" stroke-dasharray="43 27"/>

  <text x="400" y="62" text-anchor="middle" font-size="48" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-size="17" font-weight="bold" letter-spacing="2">ZERO EMISSIONS. SUSPICIOUS FISH BREATH.</text>

  <!-- Speech bubble -->
  <path d="M43 132 H268 Q286 132 286 150 V204 Q286 222 268 222 H209 L222 250 L176 222 H43 Q25 222 25 204 V150 Q25 132 43 132Z" fill="#fffdf4" stroke="#173a46" stroke-width="3"/>
  <text x="155" y="168" text-anchor="middle" font-size="21" font-weight="bold">“It's not baggage.</text>
  <text x="155" y="197" text-anchor="middle" font-size="21" font-weight="bold">It's FUEL.”</text>

  <!-- Roadside race notice -->
  <path d="M706 335 V417" stroke="#173a46" stroke-width="7"/>
  <rect x="641" y="263" width="130" height="81" rx="8" fill="#fff4d9" stroke="#173a46" stroke-width="4"/>
  <text x="706" y="290" text-anchor="middle" font-size="17" font-weight="bold">BIKE LANE</text>
  <text x="706" y="314" text-anchor="middle" font-size="14">NO WIDE</text>
  <text x="706" y="332" text-anchor="middle" font-size="14">LOADS</text>

  <ellipse cx="401" cy="446" rx="236" ry="15" fill="#48676b" opacity=".22"/>

  <!-- Rotating wheels -->
  <g transform="translate(238 384)">
    <circle r="68" fill="#eff6e9" class="outline" stroke-width="9"/>
    <circle r="57" fill="none" stroke="#c2d6cb" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-57 0 H57 M0-57 V57 M-40-40 L40 40 M-40 40 L40-40" class="spoke"/>
      <path d="M17-54 A57 57 0 0 1 39-42" fill="none" stroke="#f7ad42" stroke-width="6"/>
    </g>
    <circle r="8" fill="#173a46"/>
  </g>
  <g transform="translate(558 384)">
    <circle r="68" fill="#eff6e9" class="outline" stroke-width="9"/>
    <circle r="57" fill="none" stroke="#c2d6cb" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-57 0 H57 M0-57 V57 M-40-40 L40 40 M-40 40 L40-40" class="spoke"/>
      <path d="M17-54 A57 57 0 0 1 39-42" fill="none" stroke="#f7ad42" stroke-width="6"/>
    </g>
    <circle r="8" fill="#173a46"/>
  </g>

  <!-- Tiny, overburdened bicycle -->
  <path d="M238 384 L307 292 L369 384 Z M307 292 L508 292 L369 384 M508 292 L558 384" fill="none" stroke="#173a46" stroke-width="13" stroke-linejoin="round"/>
  <path d="M238 384 L307 292 L369 384 Z M307 292 L508 292 L369 384 M508 292 L558 384" fill="none" stroke="#e9654f" stroke-width="7" stroke-linejoin="round"/>
  <path d="M307 292 L299 272 M508 292 L496 258 L521 247 Q538 242 541 257" fill="none" class="outline"/>
  <path d="M277 272 H321" stroke="#173a46" stroke-width="12" stroke-linecap="round"/>
  <path d="M245 374 L369 370 Q390 383 369 398 L245 394Z" fill="none" stroke="#173a46" stroke-width="3"/>
  <circle cx="369" cy="384" r="18" fill="#f6bd56" class="outline"/>
  <g transform="translate(369 384)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-24 0 H24" class="outline" fill="none"/>
      <path d="M-32 0 H-16 M16 0 H32" stroke="#173a46" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Pelican and flexing pedaling leg -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M344 274 Q351 317 384 338 L369 366" fill="none" stroke="#173a46" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M344 274 Q351 317 384 338 L369 366;M344 274 Q330 314 356 338 L351 381;M344 274 Q351 317 384 338 L369 366" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M344 274 Q351 317 384 338 L369 366" fill="none" stroke="#f5ab48" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" values="M344 274 Q351 317 384 338 L369 366;M344 274 Q330 314 356 338 L351 381;M344 274 Q351 317 384 338 L369 366" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M351 365 L391 372 L365 380Z" fill="#f5ab48" class="outline">
      <animateTransform attributeName="transform" type="translate" values="0 0;-18 15;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <path d="M286 238 L249 218 L261 252 L239 245 L270 277" fill="#fffdf0" class="outline"/>
    <path d="M278 214 Q298 188 353 207 Q375 212 380 181 L385 157 Q393 128 420 140 Q450 151 438 183 L420 220 Q414 263 376 280 Q323 303 279 276 Q256 255 278 214Z" fill="#fffdf0" class="outline"/>
    <path d="M276 227 Q309 207 358 220 L379 271 Q328 292 280 265Z" fill="#42a8aa" class="outline"/>
    <path d="M287 238 Q316 237 343 254" fill="none" stroke="#f6efcf" stroke-width="5" stroke-linecap="round"/>
    <rect x="293" y="242" width="36" height="29" rx="4" fill="#fff4d9" transform="rotate(9 311 257)"/>
    <text x="311" y="264" text-anchor="middle" font-size="22" font-weight="bold" transform="rotate(9 311 257)">01</text>
    <path d="M348 221 Q390 230 422 258 Q455 272 499 255" fill="none" stroke="#173a46" stroke-width="17" stroke-linecap="round"/>
    <path d="M348 221 Q390 230 422 258 Q455 272 499 255" fill="none" stroke="#fffdf0" stroke-width="11" stroke-linecap="round"/>

    <!-- Enormous fish-filled pouch -->
    <path d="M427 175 L615 184 Q591 253 520 256 Q454 249 427 175Z" fill="#f7be65" class="outline"/>
    <path d="M454 196 Q511 217 583 198" fill="none" stroke="#e39b49" stroke-width="3"/>
    <g transform="translate(491 221) rotate(14)">
      <path d="M-27 0 Q-8-24 21 0 Q-8 24-27 0 L-40-12 V12Z" fill="#5badaf" stroke="#173a46" stroke-width="3"/>
      <circle cx="10" cy="-2" r="3" fill="#173a46"/>
      <path d="M-12-6 L-6 0 L-12 6" fill="none" stroke="#173a46" stroke-width="2"/>
    </g>
    <g transform="translate(555 225) rotate(-14)">
      <path d="M-21 0 Q-6-18 19 0 Q-6 18-21 0 L-32-9 V9Z" fill="#eef2d4" stroke="#173a46" stroke-width="3"/>
      <circle cx="9" cy="-2" r="3" fill="#173a46"/>
    </g>
    <path d="M427 164 Q509 155 626 181 Q631 187 615 189 L430 181Z" fill="#ffcf66" class="outline"/>
    <circle cx="420" cy="157" r="10" fill="white" stroke="#173a46" stroke-width="3"/>
    <circle cx="424" cy="158" r="4" fill="#173a46"/>
    <path d="M408 143 L427 139" stroke="#173a46" stroke-width="4" stroke-linecap="round"/>

    <!-- Aerodynamic helmet: wildly optimistic -->
    <path d="M379 141 Q379 112 412 111 Q443 112 451 138Z" fill="#e9654f" class="outline"/>
    <path d="M397 119 L393 133 M412 118 L409 132 M427 121 L425 133" stroke="#173a46" stroke-width="4" stroke-linecap="round"/>
    <path d="M384 143 Q382 171 403 179" fill="none" stroke="#173a46" stroke-width="3"/>
  </g>

  <path d="M159 330 H191 M143 345 H181 M168 360 H187" fill="none" stroke="#fff4d9" stroke-width="5" stroke-linecap="round"/>

  <!-- Reserved caption and timestamp footer -->
  <rect y="486" width="800" height="114" fill="#fff4d9"/>
  <path d="M38 488 H762" stroke="#173a46" stroke-width="3"/>
  <text x="400" y="525" text-anchor="middle" font-size="24" font-weight="bold">He traded his wings for a worse commute.</text>
  <text x="400" y="568" text-anchor="middle" font-size="18">2026-11-01 22:00:01 SGT (UTC+08:00)</text>
</svg>