<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDAL POWER</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels and a bobbing motion. The caption reads: My other ride is a fish.</desc>
  <style>
    .outline { stroke: #263544; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.6s linear infinite; }
    .rider { animation: bob 1.2s ease-in-out infinite; }
    .pedals { transform-origin: 410px 411px; animation: spin 1.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedals { animation-duration: 5s; } }
  </style>
