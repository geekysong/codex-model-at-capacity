<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Powered Bicycle</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e9f7d6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#244052" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#173242;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#173242}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 390 Q120 340 240 390 T480 390 T800 380 V520 H0Z" fill="#9bd27d"/>
  <path d="M0 450 Q170 410 330 450 T650 445 T800 450" fill="none" stroke="#6eb45d" stroke-width="10"/>
  <path d="M65 120 Q95 92 125 120 M110 120 Q140 92 170 120" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="34" font-weight="900" fill="#fff" stroke="#173242" stroke-width="2" paint-order="stroke">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="96" text-anchor="middle" class="label" font-size="19" font-weight="700">“Why fly when you can pedal and complain?”</text>

  <g id="bike" filter="url(#shadow)">
    <g fill="none" class="ink">
      <circle cx="245" cy="430" r="76" fill="#d7f0f4"/>
      <circle cx="585" cy="430" r="76" fill="#d7f0f4"/>
      <path d="M245 430 L345 330 L450 430 L245 430 L385 430 L345 330 L520 330 L585 430"/>
      <path d="M520 330 L555 285 M535 285 L575 285"/>
      <path d="M345 330 L320 285 M300 285 L340 285"/>
      <path d="M450 430 L420 385"/>
    </g>
    <g id="spokes" fill="none" stroke="#5a93a1" stroke-width="3">
      <path d="M245 354V506 M169 430H321 M191 376L299 484 M191 484L299 376"/>
      <path d="M585 354V506 M509 430H661 M531 376L639 484 M531 484L639 376"/>
    </g>
    <g id="pedal" fill="none" stroke="#173242" stroke-width="7" stroke-linecap="round">
      <circle cx="385" cy="430" r="13" fill="#ffd45b"/>
      <path d="M385 430 L410 450 M385 430 L360 410"/>
      <path d="M410 450 h22 M360 410 h-22"/>
    </g>
    <path d="M245 506 q-12 18 -28 20 M585 506 q12 18 28 20" fill="none" class="ink"/>
  </g>

  <g id="pelican" class="ink">
    <g id="rider">
      <ellipse cx="397" cy="255" rx="66" ry="82" fill="#f5f4e9"/>
      <path d="M352 293 Q397 340 445 294 L431 370 Q398 393 365 370Z" fill="#e0e0cf"/>
      <path d="M353 273 Q319 247 317 204 Q341 179 373 197 Q397 217 397 257Z" fill="#fffdf0"/>
      <path d="M323 203 Q267 207 218 237 Q265 276 326 247 Q349 236 373 215 Q351 201 323 203Z" fill="#f3a63b"/>
      <path d="M218 237 Q270 244 326 247" fill="none" stroke="#b96d28" stroke-width="4"/>
      <circle cx="354" cy="196" r="12" fill="#173242"/>
      <circle cx="358" cy="192" r="4" fill="#fff"/>
      <path d="M430 262 Q480 226 506 257 Q491 292 440 301Z" fill="#d5d6c7"/>
      <path d="M365 369 L354 418 M430 369 L449 416" fill="none"/>
      <path d="M351 416 q-18 7 -26 18 M449 416 q17 5 27 17" fill="none"/>
      <path d="M371 228 Q398 245 423 228" fill="none" stroke="#173242" stroke-width="5"/>
      <path d="M383 268 Q402 280 421 268" fill="none" stroke="#d57963" stroke-width="5"/>
      <path d="M365 302 Q397 318 430 302" fill="none" stroke="#173242" stroke-width="4"/>
    </g>
    <g id="fish" transform="translate(0,0)">
      <path d="M485 245 Q540 210 591 245 Q540 280 485 245Z" fill="#73c6d3"/>
      <path d="M591 245 l35 -23 v46z" fill="#4b9eae"/>
      <circle cx="548" cy="238" r="5" fill="#173242" stroke="none"/>
      <path d="M504 233 q12 -18 24 0 M504 257 q12 18 24 0" fill="none" stroke="#3c8d9b" stroke-width="4"/>
      <path d="M485 245 Q460 255 447 241 Q460 228 485 245Z" fill="#f3a63b"/>
    </g>
  </g>

  <g class="label">
    <path d="M88 184 Q145 145 211 170" fill="none" stroke="#173242" stroke-width="4"/>
    <text x="74" y="164" font-size="20" font-weight="800">URGENT:</text>
    <text x="74" y="188" font-size="18">Fish delivery</text>
    <text x="74" y="210" font-size="18">is running late.</text>
    <path d="M652 245 q53 -24 84 8" fill="none" stroke="#173242" stroke-width="4"/>
    <text x="650" y="224" font-size="18" font-weight="800">NO WINGS?</text>
    <text x="650" y="247" font-size="17">No problem.</text>
    <text x="650" y="269" font-size="17">There’s pedals.</text>
  </g>

  <rect x="44" y="526" width="712" height="48" rx="16" fill="#fff9df" stroke="#173242" stroke-width="4"/>
  <text x="400" y="548" text-anchor="middle" class="label" font-size="17" font-weight="800">A pelican on a bicycle: proof that beaks can beat traffic.</text>
  <text x="400" y="568" text-anchor="middle" class="label" font-size="14">2026-10-29 00:32:02 SGT (UTC+08:00)</text>

  <animateTransform xlink:href="#bike" attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 4;0 0" dur="1.2s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#rider" attributeName="transform" type="rotate" values="0 397 350;1.5 397 350;0 397 350;-1.5 397 350;0 397 350" dur="1.2s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#fish" attributeName="transform" type="translate" values="0 0;2 -2;0 0;-2 2;0 0" dur="1.2s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#spokes" attributeName="transform" type="rotate" from="0 245 430" to="360 245 430" dur="2s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#spokes" attributeName="transform" type="rotate" from="0 585 430" to="360 585 430" dur="2s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#pedal" attributeName="transform" type="rotate" from="0 385 430" to="360 385 430" dur="1s" repeatCount="indefinite"/>
</svg>