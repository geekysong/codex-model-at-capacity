  <path d="M70 150 Q105 115 140 150 M115 150 Q150 110 185 150" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/>

  <text x="400" y="62" text-anchor="middle" class="title">THE GREAT PELICAN GRAND PRIX</text>
  <text x="400" y="92" text-anchor="middle" class="caption">A bird with a beak full of ambition and absolutely no brakes.</text>

  <g id="bike">
