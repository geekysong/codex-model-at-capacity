<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while pretending it is a grand racing champion.</desc>
  <style>
    .ink{stroke:#17202a;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
    .wheel{fill:none;stroke:#17202a;stroke-width:8}
    .spoke{stroke:#6b7280;stroke-width:3}
    .caption{font:700 22px sans-serif;fill:#17202a}
    .small{font:600 16px sans-serif;fill:#17202a}
    .title{font:900 42px sans-serif;fill:#17202a}
  </style>

  <rect width="800" height="600" fill="#dff5ff"/>
  <rect y="430" width="800" height="95" fill="#8fd18f"/>
  <path d="M0 430 Q140 400 280 430 T560 430 T800 430" fill="none" stroke="#4f9e62" stroke-width="8"/>
