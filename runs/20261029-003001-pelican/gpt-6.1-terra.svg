    <path d="M635 165 Q680 174 700 202 Q665 210 638 192" fill="#e58e29" class="ink"/>
    <circle cx="478" cy="132" r="8" fill="#17202a"/>
    <path d="M455 108 Q480 82 508 108" fill="none" class="ink"/>
    <path d="M390 215 Q330 230 315 285 Q340 310 388 285" fill="#e8e8dc" class="ink"/>
