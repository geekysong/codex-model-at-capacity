<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="white"/>
  
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#222">
    Level Seesaw — Static Equilibrium
  </text>

  <!-- Seesaw beam -->
  <rect x="90" y="175" width="420" height="18" rx="6" fill="#8b5a2b" stroke="#4d3218" stroke-width="2"/>
  
  <!-- Pivot -->
  <polygon points="300,193 270,255 330,255" fill="#6c757d" stroke="#343a40" stroke-width="2"/>
  <circle cx="300" cy="184" r="7" fill="#343a40"/>
  <text x="300" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#222">pivot</text>

  <!-- Left hanging mass -->
  <line x1="180" y1="193" x2="180" y2="272" stroke="#333" stroke-width="3"/>
  <rect x="145" y="272" width="70" height="48" rx="5" fill="#4dabf7" stroke="#1864ab" stroke-width="2"/>
  <text x="180" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>

  <!-- Right hanging mass -->
  <line x1="420" y1="193" x2="420" y2="272" stroke="#333" stroke-width="3"/>
  <rect x="385" y="272" width="70" height="48" rx="5" fill="#ff922b" stroke="#d9480f" stroke-width="2"/>
  <text x="420" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="225" x2="180" y2="265" stroke="#c92a2a" stroke-width="3"/>
  <polygon points="180,272 173,258 187,258" fill="#c92a2a"/>
  <text x="180" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c92a2a">6g downward</text>

  <line x1="420" y1="225" x2="420" y2="265" stroke="#c92a2a" stroke-width="3"/>
  <polygon points="420,272 413,258 427,258" fill="#c92a2a"/>
  <text x="420" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c92a2a">4g downward</text>

  <!-- Distance markers -->
  <line x1="180" y1="145" x2="300" y2="145" stroke="#343a40" stroke-width="2"/>
  <line x1="180" y1="138" x2="180" y2="152" stroke="#343a40" stroke-width="2"/>
  <line x1="300" y1="138" x2="300" y2="152" stroke="#343a40" stroke-width="2"/>
  <polygon points="180,145 192,140 192,150" fill="#343a40"/>
  <polygon points="300,145 288,140 288,150" fill="#343a40"/>
  <text x="240" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2 m</text>

  <line x1="300" y1="110" x2="420" y2="110" stroke="#343a40" stroke-width="2"/>
  <line x1="300" y1="103" x2="300" y2="117" stroke="#343a40" stroke-width="2"/>
  <line x1="420" y1="103" x2="420" y2="117" stroke="#343a40" stroke-width="2"/>
  <polygon points="300,110 312,105 312,115" fill="#343a40"/>
  <polygon points="420,110 408,105 408,115" fill="#343a40"/>
  <text x="360" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">x = 3 m</text>

  <!-- Equation and status -->
  <text x="300" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222">
    6 × 2 = 4 × 3
  </text>
  <text x="520" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2b8a3e">
    balanced
  </text>
</svg>