<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
    <marker id="dimArrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0,3.5 L7,0 L7,7 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="26" font-weight="bold" fill="#111827">Level Seesaw in Static Equilibrium</text>

  <!-- seesaw beam -->
  <rect x="80" y="192" width="440" height="18" rx="5" fill="#9a6b3f" stroke="#5b3a21" stroke-width="2"/>
  <line x1="300" y1="183" x2="300" y2="219" stroke="#111827" stroke-width="3"/>

  <!-- pivot -->
  <polygon points="300,210 265,285 335,285" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <line x1="245" y1="285" x2="355" y2="285" stroke="#334155" stroke-width="5"/>
  <text x="300" y="310" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17" fill="#334155">pivot</text>

  <!-- hanging supports -->
  <line x1="120" y1="210" x2="120" y2="258" stroke="#111827" stroke-width="3"/>
  <line x1="480" y1="210" x2="480" y2="258" stroke="#111827" stroke-width="3"/>

  <!-- masses -->
  <rect x="82" y="258" width="76" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="442" y="258" width="76" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="120" y="291" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#1e3a8a">6 kg</text>
  <text x="480" y="291" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#166534">4 kg</text>

  <!-- downward force arrows -->
  <line x1="120" y1="238" x2="120" y2="252" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="480" y1="238" x2="480" y2="252" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="120" y="232" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="15" fill="#1f2937">F↓</text>
  <text x="480" y="232" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="15" fill="#1f2937">F↓</text>

  <!-- distance dimensions -->
  <line x1="120" y1="165" x2="300" y2="165" stroke="#2563eb" stroke-width="2"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <line x1="120" y1="173" x2="120" y2="190" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="173" x2="300" y2="190" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="156" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#1d4ed8">2 m</text>

  <line x1="300" y1="135" x2="480" y2="135" stroke="#2563eb" stroke-width="2"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <line x1="300" y1="143" x2="300" y2="190" stroke="#2563eb" stroke-width="2"/>
  <line x1="480" y1="143" x2="480" y2="190" stroke="#2563eb" stroke-width="2"/>
  <text x="390" y="126" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#1d4ed8">x = 3 m</text>

  <!-- equation and conclusion -->
  <text x="300" y="350" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="23" font-weight="bold" fill="#111827">6 × 2 = 4 × 3</text>
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="25" font-weight="bold" fill="#15803d">balanced</text>
</svg>