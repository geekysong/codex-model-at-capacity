<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly tiny briefcase.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e8f7dc"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#737b86"/>
      <stop offset="1" stop-color="#343b46"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#13202b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#18232d;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#18232d}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.5s linear infinite}
      .bob{animation:bob .8s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="92" cy="102" r="42" fill="#fff6b0" opacity=".9"/>
  <path d="M0 315 Q130 260 260 315 T520 315 T800 300 L800 430 L0 430Z" fill="#8cc27c"/>
  <path d="M0 415 Q190 370 380 420 T800 400 L800 600 L0 600Z" fill="url(#road)"/>
  <path d="M0 487 Q200 452 400 490 T800 476" fill="none" stroke="#f3df79" stroke-width="10" stroke-dasharray="42 28"/>
  <path d="M40 280 Q75 250 110 280 M660 245 Q695 215 730 245" fill="none" class="ink" stroke-width="4"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#fff" stroke="#18232d" stroke-width="2" paint-order="stroke">THE PELICAN EXPRESS</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="20" font-weight="700">“Running late, but looking fabulous.”</text>

  <g filter="url(#shadow)">
    <g class="wheel" transform="translate(255 442)">
      <circle r="67" fill="#202a33" class="ink"/>
      <circle r="51" fill="#b9d1d6" class="ink"/>
      <circle r="7" fill="#18232d"/>
      <g stroke="#18232d" stroke-width="3">
        <path d="M0-51V-7M0 7V51M-51 0H-7M7 0H51M-36-36L-5-5M5 5L36 36M36-36L5-5M-5 5L-36 36"/>
      </g>
    </g>
    <g class="wheel" transform="translate(540 442)">
      <circle r="67" fill="#202a33" class="ink"/>
      <circle r="51" fill="#b9d1d6" class="ink"/>
      <circle r="7" fill="#18232d"/>
      <g stroke="#18232d" stroke-width="3">
        <path d="M0-51V-7M0 7V51M-51 0H-7M7 0H51M-36-36L-5-5M5 5L36 36M36-36L5-5M-5 5L-36 36"/>
      </g>
    </g>

    <path d="M255 442 L355 305 L540 442 L255 442 L430 442 L355 305 L430 442" fill="none" class="ink" stroke="#d94f45" stroke-width="9"/>
    <path d="M355 305 L345 270 M345 270 L390 270" fill="none" class="ink" stroke="#d94f45" stroke-width="9"/>
    <path d="M540 442 L560 300 M560 300 L600 300" fill="none" class="ink" stroke="#d94f45" stroke-width="9"/>
    <circle cx="430" cy="442" r="15" fill="#f1c34a" class="ink"/>
    <path d="M430 442 L400 410 M430 442 L460 470" fill="none" class="ink" stroke="#18232d" stroke-width="7"/>
    <ellipse cx="397" cy="410" rx="17" ry="7" fill="#f1c34a" class="ink"/>
    <ellipse cx="462" cy="472" rx="17" ry="7" fill="#f1c34a" class="ink"/>

    <g class="bob">
      <path d="M365 292 Q350 235 382 198 Q415 162 465 181 Q497 194 490 237 L472 300Z" fill="#f5f0dd" class="ink"/>
      <path d="M397 198 Q380 160 401 132 Q420 108 450 124 Q466 135 458 163 L443 190Z" fill="#ef6a4f" class="ink"/>
      <ellipse cx="430" cy="125" rx="10" ry="12" fill="#fff" class="ink"/>
      <circle cx="433" cy="126" r="4" fill="#18232d"/>
      <path d="M445 152 Q506 142 574 165 Q600 174 575 194 Q500 201 448 177Z" fill="#f29d4b" class="ink"/>
      <path d="M548 167 Q573 173 590 183 Q570 188 548 188" fill="#d95b43" class="ink"/>
      <path d="M397 204 Q355 214 337 252 Q365 248 397 233Z" fill="#d9e5df" class="ink"/>
      <path d="M401 281 L395 345 M456 281 L470 343" fill="none" class="ink" stroke="#e3a84f" stroke-width="13"/>
      <path d="M392 343 L420 343 M466 343 L494 343" fill="none" class="ink" stroke="#e3a84f" stroke-width="9"/>
      <path d="M376 218 Q404 230 438 222" fill="none" class="ink" stroke="#d94f45" stroke-width="6"/>
      <path d="M371 238 Q397 253 425 251" fill="none" class="ink" stroke="#18232d" stroke-width="4"/>
      <rect x="470" y="247" width="50" height="37" rx="5" fill="#55a6c8" class="ink"/>
      <path d="M482 247 Q482 229 496 229 Q510 229 510 247" fill="none" class="ink" stroke-width="4"/>
      <text x="495" y="272" text-anchor="middle" class="label" font-size="14" font-weight="900" fill="#fff">TAXES</text>
    </g>
  </g>

  <path d="M602 270 Q655 247 697 273" fill="none" class="ink" stroke-width="4"/>
  <text x="700" y="266" class="label small" font-size="17">HONK!</text>
  <path d="M613 286 q20 11 39 0" fill="none" class="ink" stroke-width="3"/>

  <rect x="28" y="535" width="744" height="42" rx="12" fill="#fff8d8" opacity=".95" class="ink" stroke-width="3"/>
  <text x="400" y="562" text-anchor="middle" class="label" font-size="18" font-weight="700">2026-10-29 13:00:07 SGT (UTC+08:00)</text>
</svg>