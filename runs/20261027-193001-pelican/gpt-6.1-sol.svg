<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle while proudly delivering absolutely nothing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b6e"/>
      <stop offset="1" stop-color="#292d3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffe58a" opacity=".9"/>
  <path d="M0 360 Q110 300 220 350 T440 345 T680 350 T800 325 V470 H0Z" fill="#9bd18b"/>
  <path d="M0 420 Q150 390 300 425 T600 415 T800 400 V600 H0Z" fill="url(#road)"/>
  <path d="M0 515 H800" stroke="#f4d35e" stroke-width="8" stroke-dasharray="42 30" opacity=".9"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#18212b" stroke="#fff" stroke-width="7" paint-order="stroke">THE PELICAN PEDAL EXPRESS</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263746">Delivering big beaks, tiny brakes, and absolutely no mail.</text>

  <g filter="url(#shadow)">
    <ellipse cx="390" cy="475" rx="230" ry="18" fill="#12151c" opacity=".35"/>

    <!-- bicycle -->
    <g stroke="#d94141" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M245 425 L350 425 L435 330 L505 425 L350 425 L300 350 L245 425"/>
      <path d="M435 330 L458 293"/>
      <path d="M445 292 L492 292"/>
      <path d="M300 350 L278 320"/>
      <path d="M265 320 L292 320"/>
    </g>
    <g fill="none" stroke="#222936" stroke-width="7">
      <circle cx="245" cy="425" r="67"/>
      <circle cx="505" cy="425" r="67"/>
    </g>
    <g stroke="#596273" stroke-width="2">
      <path d="M245 358V492 M178 425H312 M198 378L292 472 M198 472L292 378"/>
      <path d="M505 358V492 M438 425H572 M458 378L552 472 M458 472L552 378"/>
    </g>
    <g fill="#f4d35e" stroke="#222936" stroke-width="4">
      <circle cx="350" cy="425" r="12"/>
      <path d="M350 425 L323 454 L302 449"/>
      <path d="M350 425 L378 396 L399 402"/>
    </g>
    <path d="M238 350 Q252 337 270 350" fill="none" stroke="#222936" stroke-width="7"/>
    <path d="M472 290 q22 -12 38 2" fill="none" stroke="#222936" stroke-width="7"/>
  </g>

  <!-- pelican rider -->
  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="378" cy="284" rx="64" ry="78" fill="#f6f2e8" stroke="#263746" stroke-width="5"/>
    <path d="M333 260 Q292 275 276 320 Q317 333 360 302Z" fill="#f09a43" stroke="#263746" stroke-width="5"/>
    <path d="M340 301 Q370 332 409 315" fill="none" stroke="#d7d0c0" stroke-width="10"/>
    <path d="M397 220 Q440 217 461 245 Q430 267 398 252Z" fill="#f6f2e8" stroke="#263746" stroke-width="5"/>
    <circle cx="415" cy="235" r="8" fill="#263746"/>
    <circle cx="418" cy="232" r="2.5" fill="#fff"/>
    <path d="M350 350 L326 399" stroke="#f09a43" stroke-width="13" stroke-linecap="round"/>
    <path d="M402 350 L430 395" stroke="#f09a43" stroke-width="13" stroke-linecap="round"/>
    <path d="M326 399 L313 420 M430 395 L445 420" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
    <path d="M353 206 Q382 173 421 200" fill="none" stroke="#d94141" stroke-width="9"/>
    <path d="M373 185 L390 157 L403 190" fill="#d94141" stroke="#263746" stroke-width="4"/>
    <path d="M353 271 Q378 285 401 269" fill="none" stroke="#263746" stroke-width="4"/>
    <text x="381" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#263746">HONK!</text>
  </g>

  <!-- spinning wheel highlights -->
  <g fill="none" stroke="#ffffff" stroke-width="4" opacity=".8">
    <path d="M245 371 A54 54 0 0 1 291 394"/>
    <path d="M505 371 A54 54 0 0 1 551 394"/>
  </g>

  <g transform="translate(35 535)">
    <rect width="730" height="45" rx="12" fill="#18212b" opacity=".94"/>
    <text x="365" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">2026-10-27 19:30:37 SGT (UTC+08:00)</text>
  </g>

  <style>
    #pelican { transform-box: fill-box; transform-origin: center; }
  </style>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 245 425" to="360 245 425" dur="2s" repeatCount="indefinite"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 505 425" to="360 505 425" dur="2s" repeatCount="indefinite"/>
  </g>
</svg>