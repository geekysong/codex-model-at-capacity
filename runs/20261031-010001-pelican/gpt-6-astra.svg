<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a fish-filled basket. Its enormous beak acts as a wind scoop. Wheels rotate and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.7" fill="#bba87c" opacity=".16"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fff9e9" stroke="#263a43" stroke-width="10"/>
      <circle r="69" fill="none" stroke="#e0aa43" stroke-width="3"/>
      <g stroke="#637d83" stroke-width="3">
        <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
      </g>
      <circle r="9" fill="#f5ba45" stroke="#263a43" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 128Q200 95 400 125T800 117V450H0Z" fill="#d9efec"/>
  <circle cx="695" cy="163" r="41" fill="#ffcf67"/>
  <g fill="#fffaf0" opacity=".9">
    <path d="M55 188q-7-23 17-25 9-32 39-14 26-8 30 20 22 1 20 19Z"/>
    <path d="M573 213q-7-18 14-22 9-25 31-13 22-3 24 18 20 1 20 17Z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263a43" text-anchor="middle">
    <text x="400" y="63" font-size="46" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
    <text x="400" y="94" font-size="17" font-weight="700" letter-spacing="1.5">THE COMMUTE HAS A CATCH.</text>
  </g>

  <!-- A single seaside cycle lane -->
  <path d="M0 425Q180 412 356 429T800 420V499H0Z" fill="#aec8b4"/>
  <path d="M0 452H800V502H0Z" fill="#dfcaa6"/>
  <path d="M24 484H112M164 484H252M304 484H392M444 484H532M584 484H672M724 484H800" stroke="#fff8e5" stroke-width="5"/>
  <ellipse cx="404" cy="459" rx="252" ry="12" fill="#263a43" opacity=".13"/>

  <!-- Rotating bicycle wheels -->
  <g transform="translate(253 377)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(560 377)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Tiny heroic bicycle -->
  <g stroke="#263a43" stroke-linecap="round" stroke-linejoin="round">
    <path d="M253 377L330 286 393 377H253L490 287 393 377M490 287L560 377" fill="none" stroke-width="12"/>
    <path d="M253 377L330 286 393 377H253L490 287 393 377M490 287L560 377" fill="none" stroke="#ef6751" stroke-width="7"/>
    <path d="M330 286L318 265M490 287L478 252 506 231H529" fill="none" stroke-width="8"/>
    <path d="M295 266H342" stroke-width="13"/>
    <path d="M519 230H539" stroke="#324e57" stroke-width="11"/>
    <circle cx="393" cy="377" r="18" fill="#f5ba45" stroke-width="4"/>
    <path d="M409 379L276 387" fill="none" stroke-width="2"/>
  </g>

  <!-- Fish basket -->
  <g stroke="#263a43" stroke-linejoin="round">
    <path d="M529 275L546 332H617L635 275Z" fill="#e4b76d" stroke-width="5"/>
    <path d="M540 289H628M544 303H623M548 317H619M555 278L564 331M577 278V332M602 278L594 332M623 278L611 331" fill="none" stroke="#aa7948" stroke-width="2"/>
    <path d="M551 278q-20-26-5-39 21 0 29 29l8-18 9 23" fill="#76b9af" stroke-width="3"/>
    <circle cx="549" cy="249" r="3" fill="#263a43" stroke="none"/>
    <path d="M585 278q4-37 27-41 14 18-11 42l20-6-4 10" fill="#91c9c8" stroke-width="3"/>
    <circle cx="609" cy="248" r="3" fill="#263a43" stroke="none"/>
    <path d="M564 324H610V350H564Z" fill="#fff8e7" stroke-width="2"/>
  </g>
  <text x="587" y="342" font-family="Arial, sans-serif" font-weight="bold" font-size="13" text-anchor="middle" fill="#263a43">FUEL</text>

  <!-- Pedal crank loops in sync with the rider -->
  <g transform="translate(393 377)">
    <g stroke="#263a43" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-24 0H24"/>
      <path d="M-32-5H-16M16 5H32" stroke-width="7"/>
    </g>
  </g>

  <!-- Pelican: bouncing chest, determined eyes, absurdly large bill -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <g stroke="#263a43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M307 256L270 226 283 259 260 251 288 282" fill="#fffaf0"/>
      <path d="M336 279Q276 278 287 232 296 200 350 204 370 199 372 170 366 126 399 121 435 117 446 145 452 172 423 190 408 202 414 237 409 282 336 279Z" fill="#fffdf1"/>
      <path d="M318 222Q354 205 379 240 363 265 318 247" fill="#e1e8df"/>
      <path d="M325 232l27 8-17 5" fill="none" stroke="#8ba3a2" stroke-width="3"/>
      <path d="M381 225Q424 235 480 250L514 232" fill="none" stroke-width="13"/>
      <path d="M381 225Q424 235 480 250L514 232" fill="none" stroke="#fffdf1" stroke-width="8"/>

      <!-- Expressive face and helmet -->
      <path d="M377 139Q377 107 407 107 440 109 447 141Z" fill="#ed6650"/>
      <path d="M394 112l-1 16M410 111l1 17M426 117l4 13" stroke="#922f36" stroke-width="4"/>
      <path d="M377 140L453 143" stroke-width="6"/>
      <path d="M390 165Q393 189 412 187" fill="none" stroke-width="3"/>
      <ellipse cx="426" cy="152" rx="11" ry="14" fill="white" stroke-width="3"/>
      <circle cx="431" cy="153" r="4" fill="#263a43" stroke="none"/>
      <path d="M417 134L437 139" fill="none" stroke-width="4"/>

      <!-- Bill and pendulous pouch -->
      <path d="M440 158L625 180Q572 240 495 213 458 199 440 169Z" fill="#f6b556"/>
      <path d="M440 153Q524 146 633 177L440 169Z" fill="#ffd56c"/>
      <path d="M463 178Q491 202 537 209" fill="none" stroke="#cf813e" stroke-width="3"/>
      <path d="M623 175l13 2-8 9" fill="#ffd56c"/>
      <path d="M347 277L366 315 392 343" fill="none" stroke="#e5a740" stroke-width="12">
        <animate attributeName="d" values="M347 277L366 315 392 343;M347 277L380 307 414 354;M347 277L366 315 392 343" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M386 342l-7 13 31 1-17-14" fill="#f4bc54">
        <animateTransform attributeName="transform" type="translate" values="0 0;22 11;0 0" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- A scarf flying backwards -->
    <path d="M390 192Q356 184 332 166L337 185 313 180Q344 207 389 201Z" fill="#ed6650" stroke="#263a43" stroke-width="3"/>
  </g>

  <!-- Static joke balloon keeps the text readable -->
  <path d="M60 132H259Q273 132 273 146V198Q273 211 259 211H229L246 235 208 211H60Q46 211 46 198V146Q46 132 60 132Z" fill="#fffdf2" stroke="#263a43" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#263a43">
    <text x="160" y="163">“My bill has</text>
    <text x="160" y="190">zero emissions.”</text>
  </g>

  <g fill="none" stroke="#5e8e92" stroke-width="3" stroke-linecap="round">
    <path d="M189 294h42M172 309h48M199 324h25"/>
    <path d="M665 235l-16 5M672 252l-20-2"/>
  </g>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="502" width="800" height="98" fill="#fff4d9"/>
  <path d="M40 503H760" stroke="#263a43" stroke-width="2"/>
  <text x="400" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#263a43">A pelican on a bicycle: low carbon, high seafood.</text>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#465861">2026-10-31 01:00:01 SGT (UTC+08:00)</text>
</svg>