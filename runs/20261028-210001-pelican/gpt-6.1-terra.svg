  <g font-family="Arial, sans-serif" font-weight="800">
    <path d="M605 185 Q710 145 753 212" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="10 10"/>
    <text x="610" y="170" font-size="22" fill="#d94d42">HONK!</text>
    <text x="628" y="199" font-size="16" fill="#17324d">MOVE, FEATHER-WEIGHT!</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#17324d">
    <rect x="26" y="548" width="748" height="38" rx="10" fill="#ffffff" opacity=".9"/>
    <text x="40" y="573" font-size="16" font-weight="700">Pelican on a bicycle: because traffic is easier when your beak is the front bumper.</text>
    <text x="760" y="573" text-anchor="end" font-size="13" font-weight="700">2026-10-28 21:03:22 SGT (UTC+08:00)</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 255 445" to="360 255 445" dur="1.4s" repeatCount="indefinite"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 535 445" to="360 535 445" dur="1.4s" repeatCount="indefinite"/>
