    <circle cx="255" cy="445" r="66" fill="none" stroke="#263746" stroke-width="8"/>
    <circle cx="535" cy="445" r="66" fill="none" stroke="#263746" stroke-width="8"/>
    <circle cx="255" cy="445" r="8" fill="#263746"/>
    <circle cx="535" cy="445" r="8" fill="#263746"/>
    <g stroke="#9fb6c2" stroke-width="3">
      <path d="M255 387 V503 M197 445 H313 M214 404 L296 486 M296 404 L214 486"/>
      <path d="M535 387 V503 M477 445 H593 M494 404 L576 486 M576 404 L494 486"/>
    </g>
  </g>

  <g>
