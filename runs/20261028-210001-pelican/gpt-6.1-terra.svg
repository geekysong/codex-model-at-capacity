    <path d="M385 445 L412 463 M385 445 L357 425" stroke="#263746" stroke-width="6" stroke-linecap="round"/>
    <rect x="407" y="458" width="18" height="8" rx="4" fill="#e34d4d" transform="rotate(25 416 462)"/>
    <rect x="348" y="419" width="18" height="8" rx="4" fill="#e34d4d" transform="rotate(25 357 423)"/>
