<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of a pelican pedaling furiously on a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed9ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#697584"/>
      <stop offset="1" stop-color="#3d4652"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1f2933" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="105" r="52" fill="#fff3a3" opacity=".9"/>
  <path d="M0 385 Q120 340 240 380 T480 370 T800 375 V600 H0Z" fill="#9bd18b"/>
  <path d="M0 445 Q200 420 400 444 T800 438 V600 H0Z" fill="url(#road)"/>
  <path d="M0 515 H800" stroke="#f8d96b" stroke-width="8" stroke-dasharray="45 28" opacity=".9"/>

  <text x="40" y="62" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#17324d" stroke="#fff" stroke-width="4" paint-order="stroke">
    THE GREAT PELICAN COMMUTE
  </text>
  <text x="42" y="95" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">
    “No wings? No problem. Just pedal like you mean it.”
  </text>

  <g filter="url(#shadow)">
    <ellipse cx="418" cy="348" rx="116" ry="78" fill="#f4f1df" stroke="#263746" stroke-width="7"/>
    <path d="M350 365 Q302 405 286 450 Q339 431 382 392Z" fill="#d85b4a" stroke="#263746" stroke-width="7"/>
    <path d="M486 345 Q530 370 548 422 Q498 395 468 374Z" fill="#d85b4a" stroke="#263746" stroke-width="7"/>
    <circle cx="491" cy="262" r="58" fill="#f4f1df" stroke="#263746" stroke-width="7"/>
    <path d="M515 258 Q585 247 653 279 Q585 307 514 286Z" fill="#f28a43" stroke="#263746" stroke-width="7"/>
    <path d="M515 278 Q588 280 647 294 Q580 314 516 294Z" fill="#e86c3d" stroke="#263746" stroke-width="5"/>
    <circle cx="507" cy="247" r="9" fill="#263746"/>
    <path d="M464 213 Q494 185 538 202 L548 225 Q505 217 475 236Z" fill="#e34d4d" stroke="#263746" stroke-width="6"/>
    <path d="M459 216 Q484 189 519 187" fill="none" stroke="#ffd35a" stroke-width="7"/>
    <path d="M449 316 Q414 341 398 374" fill="none" stroke="#263746" stroke-width="8" stroke-linecap="round"/>
    <path d="M480 318 Q507 344 520 372" fill="none" stroke="#263746" stroke-width="8" stroke-linecap="round"/>
    <path d="M397 371 L367 399 M520 371 L548 399" stroke="#263746" stroke-width="8" stroke-linecap="round"/>
    <path d="M354 395 Q384 412 404 401" fill="none" stroke="#e6b33f" stroke-width="7" stroke-linecap="round"/>
    <path d="M535 397 Q563 413 582 400" fill="none" stroke="#e6b33f" stroke-width="7" stroke-linecap="round"/>
    <path d="M390 328 Q416 307 450 318" fill="none" stroke="#d6cdb3" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g stroke="#263746" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M255 445 L385 445 L470 365 L535 445 L385 445 L345 365 Z" fill="#4da6c8"/>
    <path d="M345 365 L330 330"/>
    <path d="M330 330 L300 330"/>
    <path d="M470 365 L490 332 L530 332"/>
    <path d="M385 445 L365 478"/>
    <path d="M535 445 L560 478"/>
    <path d="M365 478 L343 478 M560 478 L582 478"/>
