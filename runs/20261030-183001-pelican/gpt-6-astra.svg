<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Economy</title>
  <desc id="description">A smug pelican pedals a tiny bicycle with a huge fish-filled bill. The wheels spin, its feet pedal, and its body bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#25434b" opacity=".07"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fffaf0" stroke="#253942" stroke-width="12"/>
      <circle r="67" fill="none" stroke="#b4c7c5" stroke-width="3"/>
      <g stroke="#718b91" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <circle r="10" fill="#253942"/>
    </g>
    <g id="fish">
      <path d="M0 0Q18-19 43 0Q18 19 0 0L-12-10V10Z" fill="#72b9b8" stroke="#253942" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="32" cy="-2" r="2.5" fill="#253942"/>
      <path d="M22-7Q17 0 22 7" fill="none" stroke="#253942" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 130Q400 94 800 130V485H0Z" fill="#dceee7"/>
  <circle cx="661" cy="190" r="48" fill="#ffdb76"/>
  <g fill="#fffaf0" opacity=".85">
    <path d="M56 199Q52 174 78 176Q90 148 115 174Q147 163 155 199Z"/>
    <path d="M568 273Q567 251 587 253Q600 231 618 252Q648 246 651 273Z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#253942" text-anchor="middle">
    <text x="400" y="62" font-size="43" font-weight="900" letter-spacing="2">THE PELICAN ECONOMY</text>
    <text x="400" y="96" font-size="17" letter-spacing="3">BIG BILL. TINY TRANSPORT BUDGET.</text>
  </g>

  <path d="M0 484H800" stroke="#253942" stroke-width="4"/>
  <ellipse cx="403" cy="480" rx="240" ry="12" fill="#253942" opacity=".12"/>
  <g stroke="#83aaa2" stroke-width="4" stroke-linecap="round">
    <path d="M101 347H158M118 364H150M80 381H143"/>
  </g>

  <!-- Bicycle -->
  <use href="#wheel" x="253" y="399"/>
  <use href="#wheel" x="558" y="399"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M253 399L335 291L394 399H253L487 304L394 399M487 304L558 399" stroke="#253942" stroke-width="14"/>
    <path d="M253 399L335 291L394 399H253L487 304L394 399M487 304L558 399" stroke="#e66d52" stroke-width="8"/>
    <path d="M335 291L327 270M487 304L475 262L503 248" stroke="#253942" stroke-width="9"/>
    <path d="M504 248L528 246" stroke="#253942" stroke-width="13"/>
    <path d="M302 271H350" stroke="#253942" stroke-width="13"/>
    <path d="M255 399L394 418Q423 400 394 380Z" stroke="#253942" stroke-width="3" opacity=".6"/>
  </g>
  <circle cx="394" cy="399" r="23" fill="#fff4d9" stroke="#253942" stroke-width="5"/>

  <!-- Rider, bill, and deliberately overconfident expression -->
  <g stroke="#253942" stroke-width="4" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M321 244Q309 280 342 302L387 351" fill="none" stroke="#e9a33b" stroke-width="13" stroke-linecap="round"/>
    <path d="M278 239L239 207L249 249L270 267" fill="#fffdf1"/>
    <path d="M268 227Q281 188 338 197Q368 203 373 230Q377 269 342 282Q295 292 270 261Z" fill="#fffdf1"/>
    <path d="M310 212Q285 222 287 249Q318 269 344 244" fill="#d7e2da"/>
    <path d="M344 221Q385 224 382 179Q377 140 411 137Q446 135 449 165L432 205Q417 240 372 251" fill="#fffdf1"/>
    <path d="M423 175L618 174Q599 246 518 242Q451 239 423 192Z" fill="#f5b346"/>
    <path d="M443 189Q510 225 589 190" fill="none" stroke="#df8e38" stroke-width="3"/>
    <use href="#fish" transform="translate(479 199) rotate(10)"/>
    <use href="#fish" transform="translate(538 207) rotate(-12)"/>
    <path d="M425 173L620 173L627 180L425 185Z" fill="#f7d16b"/>
    <path d="M409 146L425 148" fill="none" stroke-linecap="round"/>
    <path d="M406 154Q414 150 424 154" fill="none" stroke-width="3"/>
    <circle cx="417" cy="158" r="3" fill="#253942" stroke="none"/>
    <path d="M399 137Q414 119 437 134L438 141L397 142Z" fill="#e66d52"/>
    <path d="M437 140H454" fill="none" stroke-width="5" stroke-linecap="round"/>
    <path d="M381 208L396 217L382 230L370 218Z" fill="#e66d52"/>
    <path d="M380 229L399 257L382 266L370 239Z" fill="#e66d52"/>
    <path d="M337 233Q384 271 441 260L510 248" fill="none" stroke="#253942" stroke-width="15" stroke-linecap="round"/>
    <path d="M337 233Q384 271 441 260L510 248" fill="none" stroke="#fffdf1" stroke-width="9" stroke-linecap="round"/>
    <path d="M342 276L356 319L394 374" fill="none" stroke="#e9a33b" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M342 276L356 319L394 374;M342 276L371 331L418 399;M342 276L358 354L394 424;M342 276L338 333L370 399;M342 276L356 319L394 374" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Rotating crank with an orbiting webbed foot -->
  <g transform="translate(394 399)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0-25V25" stroke="#253942" stroke-width="6"/>
      <g transform="translate(0 -25)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-8-5L9-5L25 4L12 7L-10 5Z" fill="#efa83b" stroke="#253942" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-12 10H24" stroke="#253942" stroke-width="6" stroke-linecap="round"/>
        </g>
      </g>
    </g>
    <circle r="6" fill="#253942"/>
  </g>

  <!-- Cargo tag -->
  <path d="M300 277L282 312" stroke="#253942" stroke-width="2"/>
  <g transform="rotate(-10 272 331)">
    <rect x="226" y="310" width="92" height="45" rx="5" fill="#fff4d9" stroke="#253942" stroke-width="3"/>
    <text x="272" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#253942">SOLE</text>
    <text x="272" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#253942">TRADER</text>
  </g>

  <rect x="0" y="499" width="800" height="101" fill="#fff4d9"/>
  <text x="400" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#253942">“My assets are liquid. Mostly fish.”</text>
  <path d="M90 550H710" stroke="#253942" stroke-width="1" opacity=".3"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#253942">2026-10-30 18:30:01 SGT (UTC+08:00)</text>
</svg>