<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A determined pelican cycles with a fish in its enormous bill pouch. Bicycle wheels spin, pedals turn, and the pelican bobs. A roadside sign promises free fish uphill.</desc>
