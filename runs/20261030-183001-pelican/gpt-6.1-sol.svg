  <text x="181" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#293d45">“My cargo is</text>
  <text x="181" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#293d45">mostly emotional.”</text>

  <rect x="0" y="493" width="800" height="107" fill="#fff7df"/>
  <text x="400" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#293d45">He bought a bicycle to reduce his food miles.</text>
