<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDAL POWER</title>
  <desc id="desc">A smug pelican rides a bicycle with spinning wheels, while a fish peers out of its bill pouch.</desc>
  <style>
    .ink { stroke: #26333b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.5s linear infinite; }
    .rider { animation: bob .75s ease-in-out infinite alternate; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1.5s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedal { animation: none; } }
  </style>

