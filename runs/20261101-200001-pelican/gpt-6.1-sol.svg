<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish tucked in its enormous bill. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8L8 0" stroke="#eadcb7" stroke-width="1"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #20323d; }
      .line { stroke: #20323d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e7"/>
  <circle cx="680" cy="160" r="46" fill="#ffda69"/>
  <path d="M40 367Q140 318 240 366T440 361T650 353T800 360V495H0V379Z" fill="#d7e8cf"/>
  <path d="M0 457Q390 439 800 460V510H0Z" fill="#e5d7bb"/>
  <path d="M48 486H151M618 486H746" stroke="#fff8e7" stroke-width="7" stroke-linecap="round"/>

  <text x="400" y="62" text-anchor="middle" font-size="48" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="99" text-anchor="middle" font-size="20">One pelican. Two wheels. Absolutely no hand signals.</text>

  <ellipse cx="402" cy="498" rx="242" ry="12" fill="#20323d" opacity=".12"/>

  <!-- Rotating wheels -->
  <g class="line">
    <circle cx="264" cy="415" r="78" fill="#fff8e7" stroke-width="10"/>
    <circle cx="534" cy="415" r="78" fill="#fff8e7" stroke-width="10"/>
    <g stroke="#7f969d" stroke-width="2">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 264 415" to="360 264 415" dur="1.4s" repeatCount="indefinite"/>
        <path d="M186 415H342M264 337V493M209 360L319 470M209 470L319 360"/>
        <path d="M234 343L294 487M192 385L336 445M192 445L336 385M234 487L294 343"/>
        <rect x="256" y="344" width="16" height="7" rx="2" fill="#ffba49" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 534 415" to="360 534 415" dur="1.4s" repeatCount="indefinite"/>
        <path d="M456 415H612M534 337V493M479 360L589 470M479 470L589 360"/>
        <path d="M504 343L564 487M462 385L606 445M462 445L606 385M504 487L564 343"/>
        <rect x="526" y="344" width="16" height="7" rx="2" fill="#ffba49" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M264 415L327 320L388 415ZM327 320H490L388 415M490 320L534 415" stroke="#20323d" stroke-width="13"/>
    <path d="M264 415L327 320L388 415ZM327 320H490L388 415M490 320L534 415" stroke="#ed6650" stroke-width="7"/>
    <path d="M327 320L318 297M490 320L480 284L504 272L523 278" stroke="#20323d" stroke-width="7"/>
    <path d="M297 297H339" stroke="#20323d" stroke-width="13"/>
    <path d="M264 415H388" stroke="#7f969d" stroke-width="4"/>
  </g>
  <circle cx="388" cy="415" r="19" fill="#fff8e7" class="line"/>
  <circle cx="264" cy="415" r="7" fill="#20323d"/>
  <circle cx="534" cy="415" r="7" fill="#20323d"/>

  <!-- Pelican and its determined little pedal stroke -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M352 291Q333 317 357 346L391 391" fill="none" stroke="#20323d" stroke-width="16" stroke-linecap="round"/>
    <path d="M352 291Q333 317 357 346L391 391" fill="none" stroke="#f5a83d" stroke-width="10" stroke-linecap="round"/>
    <path d="M381 387L412 397L415 406L379 402Z" fill="#f5a83d" class="line">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur=".7s" repeatCount="indefinite"/>
    </path>

    <path d="M309 269L276 246L284 280L270 288L316 294" fill="#f5f6eb" class="line"/>
    <path d="M309 246Q335 213 392 233Q421 238 431 267Q428 300 382 309Q332 315 309 285Z" fill="#fffefa" class="line"/>
    <path d="M335 253Q365 240 397 272Q369 293 340 277" fill="#dfe6e0" class="line"/>
    <path d="M397 250Q429 242 423 216Q416 174 447 164Q477 156 491 182L479 217Q465 238 463 273Q450 294 421 285" fill="#fffefa" class="line"/>
    <path d="M448 165L438 150M458 163L456 145" fill="none" class="line"/>

    <!-- Oversized bill and fish-filled pouch -->
    <path d="M480 199L644 218Q594 233 481 226Z" fill="#ffbe45" class="line"/>
    <path d="M483 226Q513 301 590 262L637 224Z" fill="#f3a66e" class="line"/>
    <path d="M506 238Q535 222 560 241L576 232L574 254L559 247Q531 260 506 238Z" fill="#6cbcc0" stroke="#20323d" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="518" cy="238" r="2.5" fill="#20323d"/>
    <path d="M484 214L628 220" stroke="#b76a30" stroke-width="2" fill="none"/>

    <!-- Expression -->
    <circle cx="463" cy="190" r="12" fill="white" stroke="#20323d" stroke-width="3"/>
    <circle cx="467" cy="191" r="4" fill="#20323d"/>
    <path d="M451 174L471 179" fill="none" class="line"/>
    <path d="M404 265Q440 276 499 274" fill="none" stroke="#20323d" stroke-width="13" stroke-linecap="round"/>
    <path d="M404 265Q440 276 499 274" fill="none" stroke="#e3e8e1" stroke-width="7" stroke-linecap="round"/>
    <path d="M492 270L507 274L500 282" fill="none" class="line"/>
  </g>

  <g transform="translate(388 415)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#20323d" stroke-width="6" stroke-linecap="round"/>
      <path d="M-31 -4H-17M17 4H31" stroke="#20323d" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Roadside satire -->
  <path d="M119 305V437" stroke="#7e796a" stroke-width="7"/>
  <rect x="52" y="232" width="136" height="77" rx="9" fill="#fffefa" class="line"/>
  <text x="120" y="257" text-anchor="middle" font-size="15" font-weight="bold">CYCLE LANE</text>
  <text x="120" y="282" text-anchor="middle" font-size="19" font-weight="bold">NO FISHING</text>
  <path d="M654 353L678 346M650 370H687" fill="none" stroke="#7f969d" stroke-width="4" stroke-linecap="round"/>

  <!-- Dedicated footer, clear of the scene -->
  <rect x="0" y="521" width="800" height="79" fill="#20323d"/>
  <text x="400" y="551" text-anchor="middle" font-size="19" font-weight="bold" style="fill:#fff8e7">“My cargo is sustainable. My balance is political.”</text>
  <text x="400" y="581" text-anchor="middle" font-size="17" style="fill:#fff8e7">2026-11-01 20:01:16 SGT (UTC+08:00)</text>
</svg>