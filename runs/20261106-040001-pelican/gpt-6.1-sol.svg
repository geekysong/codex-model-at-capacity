<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish-filled bill pouch. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff5dc"/>
      <circle cx="3" cy="5" r=".7" fill="#e8d8b6"/>
      <circle cx="12" cy="13" r=".6" fill="#e8d8b6"/>
    </pattern>
    <g id="wheel">
      <circle r="88" fill="#fff9e9" stroke="#233447" stroke-width="10"/>
      <circle r="76" fill="none" stroke="#a3b5b7" stroke-width="2"/>
      <g stroke="#8a9a9c" stroke-width="2">
        <path d="M-76 0H76M0-76V76M-54-54L54 54M-54 54L54-54M-70-29L70 29M-29-70L29 70M-70 29L70-29M-29 70L29-70"/>
      </g>
      <path d="M-51-57A76 76 0 0 1-23-72" fill="none" stroke="#f28a42" stroke-width="6" stroke-linecap="round"/>
      <circle r="9" fill="#233447"/>
    </g>
    <style>
      .ink{stroke:#233447;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:Arial,Helvetica,sans-serif;fill:#233447}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 363Q120 306 237 355T490 344T800 345V489H0Z" fill="#d5e6ca"/>
  <path d="M0 410Q179 388 360 412T800 405V493H0Z" fill="#b9d1af"/>
  <circle cx="701" cy="157" r="37" fill="#ffcd65"/>
  <path d="M42 185h96m-76 12h48M623 251h112" fill="none" stroke="#e1d1ae" stroke-width="6" stroke-linecap="round"/>

  <text x="400" y="64" text-anchor="middle" font-size="46" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="96" text-anchor="middle" font-size="17" font-weight="bold" letter-spacing="2">THE COMMUTE HAS GONE A LITTLE FISHY.</text>

  <path d="M90 475H721" stroke="#233447" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="405" cy="476" rx="259" ry="10" fill="#233447" opacity=".12"/>

  <g transform="translate(243 383)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(582 383)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <g fill="none" class="ink">
    <path d="M243 383L321 276L390 383Z" stroke="#df5346" stroke-width="9"/>
    <path d="M321 276H532L390 383" stroke="#df5346" stroke-width="9"/>
    <path d="M532 276L582 383M390 383L318 256" stroke="#df5346" stroke-width="9"/>
    <path d="M532 276L518 231L549 217" stroke-width="7"/>
    <path d="M544 216L562 215" stroke-width="10"/>
    <path d="M292 254H344" stroke-width="12"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <!-- Far leg -->
    <path d="M363 276Q398 300 371 346L370 364" fill="none" stroke="#d88c32" stroke-width="13" stroke-linecap="round"/>
    <!-- Tail and round body -->
    <path d="M295 236L255 218L270 255L249 250Q267 277 306 281" fill="#f7f5ec" class="ink"/>
    <path d="M295 192Q340 168 392 202Q430 230 396 274Q372 303 313 282Q272 262 278 229Z" fill="#fffdf3" class="ink"/>
    <!-- Proud chest and neck -->
    <path d="M376 253Q419 238 415 207L409 167Q406 147 427 143Q451 141 454 162L452 205Q452 248 411 271" fill="#fffdf3" class="ink"/>
    <!-- Wing -->
    <path d="M307 211Q365 201 385 247Q354 275 312 247L336 245L312 232L339 233Z" fill="#d5dce0" class="ink"/>
    <!-- Handlebar-reaching wing tip -->
    <path d="M384 226Q446 246 486 218L548 215" fill="none" stroke="#233447" stroke-width="15"/>
    <path d="M384 223Q446 243 486 215L548 212" fill="none" stroke="#f6f4e9" stroke-width="9"/>
    <!-- Head -->
    <path d="M407 157Q396 129 418 115Q444 105 465 127L475 151L447 175Z" fill="#fffdf3" class="ink"/>
    <!-- Cycle helmet -->
    <path d="M401 132Q399 103 430 102Q458 102 466 129Z" fill="#df5346" class="ink"/>
    <path d="M416 109L412 125M432 107V124M448 112L453 126" stroke="#8d3433" stroke-width="5" stroke-linecap="round"/>
    <path d="M403 133L475 130" class="ink" fill="none"/>
    <!-- Enormous bill and overloaded pouch -->
    <path d="M457 153L651 177Q628 238 542 248Q483 246 457 170Z" fill="#efaa45" class="ink"/>
    <path d="M479 182Q543 207 624 188Q597 229 542 232Q500 229 479 182Z" fill="#ffd476"/>
    <!-- Fish peeking out of pouch -->
    <g transform="translate(549 209) rotate(-13)">
      <path d="M-23 0L-39-13V13Z" fill="#4a9d9b" class="ink"/>
      <ellipse rx="26" ry="13" fill="#84c9bb" class="ink"/>
      <circle cx="15" cy="-3" r="3" fill="#233447"/>
      <path d="M-4-12L3-21L9-12" fill="#4a9d9b" class="ink"/>
    </g>
    <path d="M453 148L669 169L651 180L458 166Z" fill="#ffc357" class="ink"/>
    <path d="M477 159L644 172" stroke="#d17b31" stroke-width="2"/>
    <!-- Eye and strained brow -->
    <ellipse cx="445" cy="143" rx="10" ry="12" fill="white"/>
    <circle cx="449" cy="145" r="4" fill="#233447"/>
    <path d="M434 132L450 135" class="ink" fill="none"/>
    <path d="M479 130q12-18 14-2q-2 13-14 2" fill="#6bb9d6"/>
    <!-- Near leg pumps -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7 365 276;7 365 276;-7 365 276" dur="1.6s" repeatCount="indefinite"/>
      <path d="M365 276L411 311L396 363" fill="none" stroke="#233447" stroke-width="17" stroke-linejoin="round"/>
      <path d="M365 276L411 311L396 363" fill="none" stroke="#f0aa42" stroke-width="11" stroke-linejoin="round"/>
      <path d="M395 358L415 371L382 375L375 367Z" fill="#efaa45" class="ink"/>
    </g>
  </g>

  <g transform="translate(390 383)">
    <circle r="21" fill="#f6d582" class="ink"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-29 0H29" stroke="#233447" stroke-width="6"/>
      <path d="M-40 0H-19M19 0H40" stroke="#233447" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#233447"/>
  </g>

  <g transform="translate(68 254) rotate(-7)">
    <path d="M0 0H122V59H0Z" fill="#fffdf3" class="ink"/>
    <text x="61" y="24" text-anchor="middle" font-size="15" font-weight="bold">BIKE LANE</text>
    <text x="61" y="46" text-anchor="middle" font-size="13">NO TRAWLING</text>
    <path d="M61 60V174" class="ink" fill="none"/>
  </g>
  <path d="M126 353H151M111 372H144" fill="none" stroke="#233447" stroke-width="4" stroke-linecap="round"/>

  <rect x="0" y="495" width="800" height="105" fill="#233447"/>
  <text x="400" y="530" text-anchor="middle" font-size="23" font-weight="bold" fill="#fff5dc" style="fill:#fff5dc">He took up cycling. The fish took up praying.</text>
  <path d="M130 548H670" stroke="#617080"/>
  <text x="400" y="576" text-anchor="middle" font-size="17" fill="#fff5dc" style="fill:#fff5dc">2026-11-06 04:01:31 SGT (UTC+08:00)</text>
</svg>