    <text y="-29" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#243841">IN BIKE LANE</text>
    <path d="M-43-6L43-6" stroke="#d56b4c" stroke-width="3"/>
