  <text x="400" y="67" text-anchor="middle" font-family="sans-serif" font-size="39" font-weight="900" fill="#253440">PELICAN PEDALS THE PANIC EXPRESS</text>
  <text x="400" y="98" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#415362">“IT’S NOT TOO BIG — THE BIKE IS TOO SMALL.”</text>

