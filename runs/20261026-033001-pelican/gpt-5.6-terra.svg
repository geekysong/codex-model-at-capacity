<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the Panic Express</title>
  <desc id="desc">A satirical cartoon of an enormous pelican riding a tiny bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .bob { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: top center; animation: pedal .55s ease-in-out infinite alternate; }
    .leg2 { transform-box: fill-box; transform-origin: top center; animation: pedal .55s ease-in-out infinite alternate-reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(20deg); } }
  </style>

