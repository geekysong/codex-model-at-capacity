    <path d="M683 250V448" stroke-width="8"/>
    <rect x="617" y="181" width="132" height="77" rx="9" fill="#fff8e9" stroke-width="4"/>
    <text x="683" y="211" text-anchor="middle" stroke="none" fill="#b94432" font-family="sans-serif" font-size="20" font-weight="bold">NO FREE</text>
    <text x="683" y="237" text-anchor="middle" stroke="none" fill="#b94432" font-family="sans-serif" font-size="20" font-weight="bold">RIDES</text>
  </g>

