<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle, carrying a fish in its enormous bill beneath a sign reading No Free Rides. Wheels turn and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff4d8"/>
      <circle cx="3" cy="5" r=".7" fill="#e9d9b5"/>
    </pattern>
    <g id="wheel">
      <circle r="74" fill="#fff8e9" stroke="#243b48" stroke-width="10"/>
      <circle r="62" fill="none" stroke="#d5a95b" stroke-width="3"/>
      <g stroke="#71848c" stroke-width="3">
        <path d="M-66 0H66M0-66V66M-47-47L47 47M-47 47L47-47"/>
      </g>
      <circle r="9" fill="#e6583d" stroke="#243b48" stroke-width="4"/>
      <path d="M-8-68H8" stroke="#ffbd35" stroke-width="8" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#paper)"/>
  <text x="400" y="65" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="900" fill="#243b48" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="96" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#80533c">One bird. Two wheels. Absolutely no aerodynamic advantage.</text>

