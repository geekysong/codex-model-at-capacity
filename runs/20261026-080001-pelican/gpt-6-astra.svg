<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican rides a tiny bicycle with a fish in its enormous bill pouch. The wheels spin, the pedals turn, and the pelican bobs as it rides.</desc>
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <path d="M0 0V14" stroke="#e1ca9c" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5da"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="none" stroke="#253b40" stroke-width="3"/>
  <text x="400" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#253b40">TOUR DE BEAK</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#687572">ZERO EMISSIONS. EXCESS BAGGAGE.</text>

  <!-- A single seaside cycling scene -->
  <path d="M42 346Q160 317 279 345T518 337T758 346V461H42Z" fill="#cbe5d6"/>
  <path d="M43 370Q188 344 310 368T568 363T757 369" fill="none" stroke="#a8ccbd" stroke-width="3"/>
  <circle cx="110" cy="173" r="36" fill="#f5cb62"/>
  <path d="M66 243q14-15 28 0q14-15 28 0M654 170q11-12 22 0q11-12 22 0" fill="none" stroke="#95b7af" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="391" cy="463" rx="234" ry="14" fill="#253b40" opacity=".12"/>
  <path d="M42 463H758" stroke="#253b40" stroke-width="4"/>
  <path d="M67 483H139M578 483H655M697 483H734" stroke="#d6bd8c" stroke-width="4" stroke-linecap="round"/>

  <!-- Spinning bicycle wheels -->
  <g fill="none" stroke="#253b40">
    <g transform="translate(244 390)">
      <circle r="70" fill="#fff9e8" stroke-width="10"/>
      <circle r="59" stroke="#8aa5a1" stroke-width="2"/>
      <g stroke="#8aa5a1" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
      </g>
      <circle r="7" fill="#ef835c" stroke-width="3"/>
    </g>
    <g transform="translate(541 390)">
      <circle r="70" fill="#fff9e8" stroke-width="10"/>
      <circle r="59" stroke="#8aa5a1" stroke-width="2"/>
      <g stroke="#8aa5a1" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
      </g>
      <circle r="7" fill="#ef835c" stroke-width="3"/>
    </g>
  </g>

  <!-- Absurdly small racing bicycle -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M244 390L306 305L367 390H244L482 305H306M367 390L482 305L541 390" fill="none" stroke="#253b40" stroke-width="12"/>
    <path d="M244 390L306 305L367 390H244L482 305H306M367 390L482 305L541 390" fill="none" stroke="#ed7352" stroke-width="7"/>
    <path d="M306 305L297 281M482 305L472 269L500 255Q521 247 525 267" fill="none" stroke="#253b40" stroke-width="8"/>
    <path d="M276 280H321" stroke="#253b40" stroke-width="12"/>
    <path d="M247 392L366 403Q388 390 367 377L247 384Z" fill="none" stroke="#647773" stroke-width="3"/>
    <circle cx="367" cy="390" r="18" fill="#f4bd55" stroke="#253b40" stroke-width="4"/>
  </g>

  <!-- The rider bobs independently of all typography -->
  <g stroke="#253b40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".7s" repeatCount="indefinite"/>

    <!-- Far leg -->
    <path d="M327 275L337 325L384 363" fill="none" stroke="#d68b38" stroke-width="10"/>
    <path d="M375 358L404 365L381 371Z" fill="#efb24d"/>

    <!-- Tail, body, neck and head -->
    <path d="M280 257L221 228L244 271L216 267L263 292" fill="#fdfcf3"/>
    <path d="M266 279C233 257 244 214 275 202C300 190 335 204 348 226
             C368 215 374 180 378 154
             C381 126 411 119 434 132
             C456 145 454 171 436 185
             C423 200 423 225 416 247
             C406 283 375 301 326 296
             C300 294 281 291 266 279Z" fill="#fffef4"/>
    <path d="M264 237Q289 217 330 243Q353 254 367 271Q314 292 278 264" fill="#e0e8df"/>
    <path d="M278 247Q310 247 335 267M288 259L312 270" fill="none" stroke="#91aaa1" stroke-width="3"/>

    <!-- Wing reaching the handlebars -->
    <path d="M357 234Q394 243 426 260L485 258Q495 264 483 271L422 278Q385 273 362 261" fill="#fffef4"/>

    <!-- Huge cargo pouch -->
    <path d="M437 167L655 182Q634 245 543 251Q464 243 437 181Z" fill="#f3be57"/>
    <path d="M461 190Q530 235 625 195" fill="none" stroke="#d89438" stroke-width="3"/>
    <path d="M440 162L671 179L655 188L441 179Z" fill="#f4a44b"/>

    <!-- Fish peering out of the pouch -->
    <path d="M557 190Q586 168 612 192L631 178L630 207L612 199Q584 218 557 190Z" fill="#76b8b2" stroke-width="3"/>
    <circle cx="574" cy="188" r="7" fill="white" stroke-width="2"/>
    <circle cx="576" cy="188" r="2.5" fill="#253b40" stroke="none"/>
    <path d="M560 196L569 198M595 188Q587 196 597 203" fill="none" stroke-width="2"/>
    <path d="M465 205Q530 253 607 220" fill="none" stroke="#ffe29a" stroke-width="5"/>

    <!-- Smug eye and cycling helmet -->
    <circle cx="424" cy="150" r="10" fill="white" stroke-width="2.5"/>
    <circle cx="427" cy="151" r="3" fill="#253b40" stroke="none"/>
    <path d="M411 143L435 145" stroke-width="4"/>
    <path d="M373 137Q377 108 408 111Q435 109 446 136Z" fill="#ed7352"/>
    <path d="M389 119L384 132M405 117L403 132M421 120L425 133" stroke="#fff5da" stroke-width="5"/>
    <path d="M380 140Q383 174 403 186L430 169" fill="none" stroke-width="3"/>

    <!-- Near leg with a small pedaling motion -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 328 286;6 328 286;-5 328 286" dur="1.4s" repeatCount="indefinite"/>
      <path d="M328 286L310 332L352 382" fill="none" stroke="#efb24d" stroke-width="11"/>
      <path d="M347 375L377 387L345 393L334 387Z" fill="#f4ba53"/>
    </g>
  </g>

  <g transform="translate(367 390)" stroke="#253b40" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke-width="5"/>
      <path d="M-24-7V7M24-7V7" stroke-width="7"/>
    </g>
    <circle r="5" fill="#fff5da" stroke-width="2"/>
  </g>

  <!-- Stationary speech bubble -->
  <path d="M535 276H711Q725 276 725 290V329Q725 343 711 343H535Q521 343 521 329V290Q521 276 535 276Z" fill="#fffef4" stroke="#253b40" stroke-width="3"/>
  <path d="M568 277L584 249L594 277" fill="#fffef4" stroke="#253b40" stroke-width="3" stroke-linejoin="round"/>
  <path d="M570 277H592" stroke="#fffef4" stroke-width="4"/>
  <text x="623" y="303" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#253b40">“I ordered</text>
  <text x="623" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#253b40">a WATER taxi.”</text>

  <!-- Dedicated footer: caption and required visible timestamp -->
  <path d="M42 507H758" stroke="#d6bd8c" stroke-width="2"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#253b40">One pelican. Two wheels. A bill full of commuters.</text>
  <text x="400" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4c625e">2026-10-26 08:00:01 SGT (UTC+08:00)</text>
</svg>