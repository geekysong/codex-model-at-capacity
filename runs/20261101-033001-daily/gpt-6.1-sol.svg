<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">5×5 Hamiltonian Path — 24 Moves</title>
  <desc id="desc">A continuous snake path visits all 25 cells exactly once, starting at the top-left green circle and ending at the bottom-right red circle. Cell numbers show visit order.</desc>

  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#0f172a">5×5 Grid Path — 24 Moves</text>
  <text x="300" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Visit every cell exactly once • Numbers indicate visit order</text>

  <rect x="175" y="68" width="250" height="250" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <path d="M225 68V318 M275 68V318 M325 68V318 M375 68V318
           M175 118H425 M175 168H425 M175 218H425 M175 268H425"
        fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <polyline points="200,93 250,93 300,93 350,93 400,93
                    400,143 350,143 300,143 250,143 200,143
                    200,193 250,193 300,193 350,193 400,193
                    400,243 350,243 300,243 250,243 200,243
                    200,293 250,293 300,293 350,293 400,293"
            fill="none" stroke="#2563eb" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">
    <text x="182" y="82">1</text>
    <text x="232" y="82">2</text>
    <text x="282" y="82">3</text>
    <text x="332" y="82">4</text>
    <text x="382" y="82">5</text>

    <text x="182" y="132">10</text>
    <text x="232" y="132">9</text>
    <text x="282" y="132">8</text>
    <text x="332" y="132">7</text>
    <text x="382" y="132">6</text>

    <text x="182" y="182">11</text>
    <text x="232" y="182">12</text>
    <text x="282" y="182">13</text>
    <text x="332" y="182">14</text>
    <text x="382" y="182">15</text>

    <text x="182" y="232">20</text>
    <text x="232" y="232">19</text>
    <text x="282" y="232">18</text>
    <text x="332" y="232">17</text>
    <text x="382" y="232">16</text>

    <text x="182" y="282">21</text>
    <text x="232" y="282">22</text>
    <text x="282" y="282">23</text>
    <text x="332" y="282">24</text>
    <text x="382" y="282">25</text>
  </g>

  <circle cx="200" cy="93" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="400" cy="293" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <circle cx="218" cy="340" r="6" fill="#16a34a"/>
    <text x="231" y="345">Start: 1</text>
    <circle cx="331" cy="340" r="6" fill="#dc2626"/>
    <text x="344" y="345">End: 25</text>
  </g>

  <path d="M35 360H565" stroke="#cbd5e1"/>
  <text x="300" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-11-01 03:33:02 SGT (UTC+08:00)</text>
</svg>