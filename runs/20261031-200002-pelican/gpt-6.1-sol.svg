<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A smug pelican pedals a bicycle along a seaside road, carrying a fish in its enormous bill. The wheels spin and the pelican bobs in a seamless loop.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1"/>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke:#203442; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <text x="400" y="53" text-anchor="middle" font-size="37" font-weight="900" fill="#203442">THE PELICAN EXPRESS</text>
  <text x="400" y="83" text-anchor="middle" font-size="17" font-weight="bold" fill="#786449">ZERO GAS. QUESTIONABLE CARGO.</text>

  <rect x="30" y="104" width="740" height="399" rx="24" fill="#bce7e9"/>
  <circle cx="674" cy="166" r="37" fill="#ffd26e"/>
  <path d="M31 344 Q160 319 280 344 T520 344 T769 344 V456 H31Z" fill="#78c9ce"/>
  <path d="M48 366 Q96 354 140 366 M597 370 Q651 357 710 370" fill="none" stroke="#e1f7eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M31 406 Q180 390 331 410 T769 402 V480 H31Z" fill="#e2ca8d"/>
  <path d="M31 443 Q375 420 769 443 V479 Q769 503 745 503 H55 Q31 503 31 479Z" fill="#83928b"/>
  <path d="M48 480 H168 M610 480 H748" stroke="#fff4d1" stroke-width="5" stroke-dasharray="28 20"/>
  <ellipse cx="409" cy="480" rx="220" ry="11" fill="#203442" opacity=".13"/>

  <!-- Roadside satire -->
  <path d="M100 405 V269" class="ink" fill="none"/>
  <rect x="47" y="212" width="113" height="80" rx="8" fill="#fff5dc" class="ink"/>
  <text x="103" y="237" text-anchor="middle" font-size="15" font-weight="bold" fill="#203442">FUEL PRICES</text>
  <text x="103" y="269" text-anchor="middle" font-size="28" font-weight="900" fill="#d4523c">LOL</text>

  <!-- Wheels: stationary tires, rotating spokes -->
  <g fill="#fff5dc" class="ink">
    <circle cx="268" cy="418" r="66"/>
    <circle cx="548" cy="418" r="66"/>
  </g>
  <g stroke="#667b80" stroke-width="3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 268 418" to="360 268 418" dur="1.8s" repeatCount="indefinite"/>
      <path d="M268 357 V479 M207 418 H329 M225 375 L311 461 M225 461 L311 375"/>
      <path d="M235 366 L301 470 M216 451 L320 385"/>
      <circle cx="268" cy="360" r="5" fill="#ffd26e" stroke="none"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 548 418" to="360 548 418" dur="1.8s" repeatCount="indefinite"/>
      <path d="M548 357 V479 M487 418 H609 M505 375 L591 461 M505 461 L591 375"/>
      <path d="M515 366 L581 470 M496 451 L600 385"/>
      <circle cx="548" cy="360" r="5" fill="#ffd26e" stroke="none"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M268 418 L347 315 L403 418 Z M347 315 H510 L403 418 M510 315 L548 418" stroke="#203442" stroke-width="12"/>
    <path d="M268 418 L347 315 L403 418 Z M347 315 H510 L403 418 M510 315 L548 418" stroke="#e35c48" stroke-width="6"/>
    <path d="M347 315 L338 294 M510 315 L500 279 Q498 269 512 269 H538" stroke="#203442" stroke-width="8"/>
    <path d="M318 294 H361" stroke="#203442" stroke-width="12"/>
    <path d="M543 270 H559" stroke="#855844" stroke-width="11"/>
    <path d="M268 418 H403" stroke="#203442" stroke-width="3"/>
  </g>
  <circle cx="403" cy="418" r="17" fill="#ffe4a8" class="ink"/>
  <g class="ink" fill="none">
    <animateTransform attributeName="transform" type="rotate" from="0 403 418" to="360 403 418" dur="1.8s" repeatCount="indefinite"/>
    <path d="M381 402 L425 434"/>
    <path d="M371 402 H391 M415 434 H435" stroke-width="7"/>
  </g>
  <circle cx="268" cy="418" r="7" fill="#203442"/>
  <circle cx="548" cy="418" r="7" fill="#203442"/>

  <!-- Pelican and its tiny exertions -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M348 292 Q335 317 370 345 L392 388" fill="none" stroke="#203442" stroke-width="14" stroke-linecap="round"/>
    <path d="M348 292 Q335 317 370 345 L392 388" fill="none" stroke="#f4a741" stroke-width="8" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7 370 345;8 370 345;-7 370 345" dur="1.8s" repeatCount="indefinite"/>
      <path d="M370 345 L400 391 L420 397 L385 400 L378 390" fill="#f4a741" class="ink"/>
    </g>
    <path d="M293 253 L260 231 L271 270 L250 265 L285 295" fill="#fffdf0" class="ink"/>
    <path d="M287 244 Q325 209 373 232 Q406 249 400 277 Q387 309 341 304 Q293 305 280 276Z" fill="#fffdf0" class="ink"/>
    <path d="M310 245 Q358 232 378 265 Q348 288 311 268" fill="#e7e7d3" class="ink"/>
    <path d="M375 247 Q404 236 398 198 Q389 162 414 144 Q435 131 453 150 Q467 171 449 191 Q436 206 439 234 Q440 263 402 279" fill="#fffdf0" class="ink"/>
    <path d="M416 143 L409 125 L426 137 L431 121 L438 140" fill="#fffdf0" class="ink"/>
    <path d="M447 177 Q490 178 583 197 Q544 238 480 222 Q452 212 447 177Z" fill="#f2b05f" class="ink"/>
    <path d="M449 176 L594 194 L457 195" fill="#ffd15e" class="ink"/>
    <path d="M470 200 Q515 218 558 204" fill="none" stroke="#d38b43" stroke-width="3"/>

    <!-- Fish passenger -->
    <path d="M516 215 Q543 196 567 214 L586 203 L581 225 L590 234 L566 229 Q539 246 516 226Z" fill="#73b9b0" class="ink" stroke-width="3"/>
    <circle cx="528" cy="219" r="3" fill="#203442"/>
    <path d="M541 218 L551 227 M549 215 L560 223" stroke="#3a8582" stroke-width="2"/>

    <!-- Face, racing goggles, and determined brow -->
    <circle cx="433" cy="163" r="13" fill="white" class="ink" stroke-width="3"/>
    <circle cx="438" cy="163" r="4" fill="#203442"/>
    <path d="M419 147 L440 151" class="ink" fill="none"/>
    <path d="M405 163 H420" stroke="#203442" stroke-width="5"/>
    <path d="M402 195 Q386 201 372 190 L357 204 L385 214 L405 205" fill="#e35c48" class="ink" stroke-width="3"/>
    <path d="M386 265 Q425 273 453 281 L506 273" fill="none" stroke="#203442" stroke-width="11" stroke-linecap="round"/>
    <path d="M386 265 Q425 273 453 281 L506 273" fill="none" stroke="#fffdf0" stroke-width="6" stroke-linecap="round"/>
    <path d="M506 273 L516 266 M506 273 L520 277" fill="none" class="ink" stroke-width="3"/>
  </g>

  <g fill="#fffdf0" stroke="#203442" stroke-width="3">
    <path d="M535 111 H723 Q738 111 738 126 V157 Q738 172 723 172 H575 L551 187 L555 172 H535 Q520 172 520 157 V126 Q520 111 535 111Z"/>
  </g>
  <text x="630" y="137" text-anchor="middle" font-size="17" font-weight="bold" fill="#203442">“My other car</text>
  <text x="630" y="159" text-anchor="middle" font-size="17" font-weight="bold" fill="#203442">is a beak.”</text>

  <!-- Dedicated footer, clear of the animated scene -->
  <text x="400" y="537" text-anchor="middle" font-size="21" font-weight="bold" fill="#203442">He rides for the planet. And the halibut.</text>
  <path d="M118 552 H682" stroke="#d6c6a5" stroke-width="2"/>
  <text x="400" y="578" text-anchor="middle" font-size="17" fill="#4c5a60">2026-10-31 20:01:09 SGT (UTC+08:00)</text>
</svg>