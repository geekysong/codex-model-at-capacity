<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A smug pelican pedals a bicycle past a sign warning that the bike lane is for birds only.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .65s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

  <!-- Sky and title -->
  <rect width="800" height="600" fill="#b9e8f2"/>
  <path d="M0 355 Q180 320 365 355 T800 345 V500 H0Z" fill="#d8f0c4"/>
  <rect x="0" y="500" width="800" height="100" fill="#555965"/>
  <path d="M0 520 H800" stroke="#f7dc72" stroke-width="5" stroke-dasharray="38 28"/>
  <text id="title" x="400" y="58" text-anchor="middle" font-size="34" font-weight="900" fill="#18334b" stroke="#fff7dc" stroke-width="2" paint-order="stroke">THE PELICAN COMMUTE</text>
  <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#31546b">One bird. Two wheels. Absolutely no license.</text>

  <!-- Clouds -->
  <g fill="#f8ffff" opacity=".9">
    <path d="M92 151c-1-15 11-26 26-24 5-18 32-19 39-2 18-3 29 20 15 31H99c-5-1-8-2-7-5z"/>
    <path d="M623 137c0-14 12-23 25-20 8-16 30-14 35 2 17-1 24 18 11 27h-62c-6-1-9-4-9-9z"/>
  </g>
  <circle cx="714" cy="110" r="27" fill="#ffd46b"/>

  <!-- Roadside sign -->
  <g transform="translate(644 255)">
    <path d="M24 75v98" stroke="#73523d" stroke-width="9"/>
    <path d="M-12 0h102v78H-12z" rx="8" fill="#fff4d5" stroke="#31546b" stroke-width="5"/>
    <text x="39" y="25" text-anchor="middle" font-size="12" font-weight="900" fill="#31546b">BIKE LANE</text>
    <text x="39" y="45" text-anchor="middle" font-size="12" font-weight="900" fill="#31546b">BIRDS ONLY</text>
    <text x="39" y="66" text-anchor="middle" font-size="17">🐟</text>
  </g>

  <!-- Bicycle wheels: spinning spokes -->
  <g class="wheel" fill="none" stroke="#263b4a" stroke-width="5">
    <circle cx="244" cy="431" r="66"/>
    <path d="M244 365v132M178 431h132M197 384l94 94M291 384l-94 94"/>
  </g>
  <g class="wheel" fill="none" stroke="#263b4a" stroke-width="5">
    <circle cx="501" cy="431" r="66"/>
    <path d="M501 365v132M435 431h132M454 384l94 94M548 384l-94 94"/>
  </g>
  <g fill="#ffd46b" stroke="#263b4a" stroke-width="5">
    <circle cx="244" cy="431" r="7"/>
    <circle cx="501" cy="431" r="7"/>
  </g>

  <!-- Bicycle frame and details -->
  <g fill="none" stroke="#d94f45" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 431l67-86 69 86H244l47-54"/>
    <path d="M380 431l61-97 60 97"/>
    <path d="M441 334l-55 4"/>
  </g>
  <g stroke="#263b4a" stroke-width="7" stroke-linecap="round">
    <path d="M297 341h39"/>
    <path d="M430 328l17-14"/>
    <path d="M286 372l-17-10"/>
  </g>
  <circle cx="311" cy="431" r="20" fill="none" stroke="#263b4a" stroke-width="5"/>
  <path d="M311 431l26-17m-26 17 4 27" stroke="#263b4a" stroke-width="5" stroke-linecap="round"/>
  <path d="M336 414l16-7m-33 54h-20" stroke="#263b4a" stroke-width="7" stroke-linecap="round"/>

  <!-- Animated pelican rider -->
  <g class="rider">
    <!-- tail feathers -->
    <path d="M346 252q-34-25-51 3 22 2 31 17" fill="#f5f0df" stroke="#263b4a" stroke-width="4"/>
    <!-- body -->
    <ellipse cx="390" cy="250" rx="66" ry="51" fill="#f8f5e8" stroke="#263b4a" stroke-width="5"/>
    <path d="M381 267q30 15 62-3-4 34-42 37-22-6-20-34z" fill="#d9e5e8" stroke="#263b4a" stroke-width="3"/>
    <!-- neck and head -->
    <path d="M421 239q-7-56 10-83 12-16 28-5 14 11 3 28l-18 29 12 35" fill="#f8f5e8" stroke="#263b4a" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="448" cy="145" r="26" fill="#f8f5e8" stroke="#263b4a" stroke-width="5"/>
    <circle cx="456" cy="141" r="4.5" fill="#172b3b"/>
    <path d="M468 151q37 0 59 13-20 15-58 4z" fill="#f0a33a" stroke="#263b4a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M474 161q22 13 42 7-13 20-32 11" fill="#ea7857" stroke="#263b4a" stroke-width="3"/>
    <!-- jaunty helmet -->
    <path d="M425 137q3-31 28-32 25 2 28 28z" fill="#e95149" stroke="#263b4a" stroke-width="4"/>
    <path d="M420 137h66" stroke="#263b4a" stroke-width="6" stroke-linecap="round"/>
    <path d="M448 107l9-14 11 15" fill="#ffd46b" stroke="#263b4a" stroke-width="3"/>
    <!-- wing/arm reaching handlebars -->
    <path d="M384 228q31 1 56 32l-12 13q-34-13-60-29z" fill="#e7edf0" stroke="#263b4a" stroke-width="4"/>
    <path d="M434 266l-16 47" stroke="#263b4a" stroke-width="7" stroke-linecap="round"/>
    <path d="M418 313l-16 21" stroke="#f0a33a" stroke-width="8" stroke-linecap="round"/>
    <!-- legs on pedals -->
    <path d="M386 281l-41 49-28 10" fill="none" stroke="#f0a33a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M403 282l-13 56 20 18" fill="none" stroke="#f0a33a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M317 339l-18 4m111-1 13 14" stroke="#263b4a" stroke-width="7" stroke-linecap="round"/>
    <!-- expression -->
    <path d="M436 129q8-8 17-3" fill="none" stroke="#263b4a" stroke-width="3" stroke-linecap="round"/>
    <path d="M425 157l-7 3" stroke="#ef9c3d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Motion marks and comic aside -->
  <path d="M155 300h44M143 319h35M567 294h39" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".85"/>
  <g transform="translate(93 215)">
    <path d="M0 0h128q12 0 12 12v54q0 12-12 12H67l-20 19 3-19H12Q0 78 0 66z" fill="#fff7dd" stroke="#31546b" stroke-width="3"/>
    <text x="70" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#31546b">I use the beak</text>
    <text x="70" y="48" text-anchor="middle" font-size="13" font-weight="800" fill="#31546b">as a turn signal.</text>
  </g>

  <!-- Footer with clear breathing room -->
  <rect x="0" y="526" width="800" height="74" fill="#18334b"/>
  <text x="400" y="551" text-anchor="middle" font-size="17" font-weight="800" fill="#fff7dd">“I’m not late. I’m on bird time.”</text>
  <text x="400" y="581" text-anchor="middle" font-size="13" font-weight="600" fill="#d5e9ef">2026-10-25 08:31:57 SGT (UTC+08:00)</text>
</svg>