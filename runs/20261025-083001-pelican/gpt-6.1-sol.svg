<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A smug pelican pedals a bicycle with spinning wheels, an enormous beak full of fish, and a sign claiming zero emissions except smugness.</desc>
  <defs>
