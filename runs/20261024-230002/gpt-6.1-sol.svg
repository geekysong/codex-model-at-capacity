<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A 6 kilogram mass hangs 2 meters left of the pivot, and a 4 kilogram mass hangs 3 meters right. Equal torques keep the seesaw level: 6 times 2 equals 4 times 3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172033">
    <text x="300" y="40" font-size="26" font-weight="700" fill="#15803d">balanced</text>

    <!-- Distances share the same scale: 70 pixels per meter. -->
    <g stroke="#64748b" stroke-width="1.5" fill="none">
      <path d="M100 79V137 M240 79V137 M450 79V137" stroke-dasharray="4 4"/>
      <path d="M100 94H240 M240 94H450"/>
      <path d="M100 87V101 M240 87V101 M450 87V101"/>
    </g>
    <rect x="141" y="80" width="58" height="27" fill="#fff"/>
    <rect x="286" y="80" width="118" height="27" fill="#fff"/>
    <text x="170" y="100" font-size="20">2 m</text>
    <text x="345" y="100" font-size="20" font-weight="700">x = 3 m</text>

    <!-- Horizontal beam and central pivot. -->
    <rect x="65" y="140" width="420" height="12" rx="4" fill="#334155"/>
    <path d="M240 152 211 207H269Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <path d="M198 210H282" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <circle cx="240" cy="146" r="5" fill="#fff" stroke="#172033" stroke-width="2"/>
    <text x="240" y="235" font-size="16">pivot</text>

    <!-- Suspended masses. -->
    <g stroke="#334155" stroke-width="3">
      <path d="M100 152V182 M450 152V182"/>
    </g>
    <rect x="62" y="182" width="76" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="412" y="182" width="76" height="52" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="100" y="215" font-size="22" font-weight="700">6 kg</text>
    <text x="450" y="215" font-size="22" font-weight="700">4 kg</text>

    <!-- Downward gravitational forces. -->
    <g stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)">
      <path d="M100 237V294"/>
      <path d="M450 237V275"/>
    </g>
    <g font-size="18" fill="#c2410c">
      <text x="144" y="272">6g ↓</text>
      <text x="494" y="263">4g ↓</text>
    </g>

    <text x="300" y="333" font-size="18">Equal opposing torques: 6g × 2 = 4g × x</text>
    <text x="300" y="369" font-size="25" font-weight="700">6×2 = 4×3</text>
  </g>
</svg>