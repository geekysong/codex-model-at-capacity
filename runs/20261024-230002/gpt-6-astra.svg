<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A level seesaw has a 6 kilogram mass 2 meters left of the pivot and a 4 kilogram mass 3 meters right. Equal opposing torques give 6 times 2 equals 4 times 3, so x equals 3 meters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172a3a">
    <text x="300" y="38" font-size="26" font-weight="700" fill="#15803d">balanced</text>
    <text x="300" y="64" font-size="16">Static equilibrium</text>

    <g stroke="#526575" stroke-width="1.5">
      <path d="M120 101 V135 M260 101 V135 M470 101 V135"/>
      <path d="M120 113 H260 M260 113 H470"/>
      <path d="M120 108 V118 M260 108 V118 M470 108 V118"/>
    </g>
    <text x="190" y="98" font-size="20">2 m</text>
    <text x="365" y="98" font-size="20">x = 3 m</text>

    <rect x="85" y="145" width="420" height="12" rx="3" fill="#334155"/>
    <path d="M260 157 L229 218 H291 Z" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <circle cx="260" cy="157" r="5" fill="#172a3a"/>
    <path d="M216 219 H304" stroke="#475569" stroke-width="3"/>
    <text x="260" y="242" font-size="17">pivot</text>

    <g stroke="#475569" stroke-width="3">
      <path d="M120 157 V182"/>
      <path d="M470 157 V182"/>
    </g>
    <rect x="86" y="182" width="68" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="436" y="182" width="68" height="48" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="120" y="212" font-size="22" font-weight="700">6 kg</text>
    <text x="470" y="212" font-size="22" font-weight="700">4 kg</text>

    <g stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)">
      <path d="M120 234 V279"/>
      <path d="M470 234 V264"/>
    </g>
    <text x="157" y="264" font-size="18" fill="#c2410c">6g ↓</text>
    <text x="509" y="254" font-size="18" fill="#c2410c">4g ↓</text>

    <text x="300" y="310" font-size="18">Equal opposing torques: 6g × 2 = 4g × x</text>
    <text x="300" y="343" font-size="25" font-weight="700">6×2 = 4×3</text>
    <text x="300" y="377" font-size="23" font-weight="700" fill="#15803d">x = (6 × 2) ÷ 4 = 3 m</text>
  </g>
</svg>