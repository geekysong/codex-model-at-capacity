<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="A balanced level seesaw: a 6 kilogram mass hangs 2 meters left of the pivot, and a 4 kilogram mass hangs 3 meters right.">
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#18324b">balanced</text>

  <!-- Level seesaw -->
  <line x1="90" y1="190" x2="510" y2="190" stroke="#315c7d" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="190" r="10" fill="#18324b"/>
  <!-- Pivot -->
  <path d="M300 202 L263 275 L337 275 Z" fill="#9bb6c8" stroke="#18324b" stroke-width="3"/>
  <line x1="245" y1="278" x2="355" y2="278" stroke="#18324b" stroke-width="5" stroke-linecap="round"/>
  <text x="300" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#18324b">pivot</text>

  <!-- Hanging masses -->
  <line x1="160" y1="196" x2="160" y2="233" stroke="#526b7c" stroke-width="3"/>
  <rect x="126" y="233" width="68" height="48" rx="6" fill="#f2b84b" stroke="#8a5b08" stroke-width="2"/>
  <text x="160" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#392700">6 kg</text>

  <line x1="405" y1="196" x2="405" y2="233" stroke="#526b7c" stroke-width="3"/>
  <rect x="371" y="233" width="68" height="48" rx="6" fill="#72c6a1" stroke="#247454" stroke-width="2"/>
  <text x="405" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#123c2b">4 kg</text>

  <!-- Downward force arrows -->
  <line x1="160" y1="124" x2="160" y2="176" stroke="#d34b42" stroke-width="4"/>
  <path d="M151 166 L160 181 L169 166" fill="none" stroke="#d34b42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a92d27">weight</text>
  <line x1="405" y1="124" x2="405" y2="176" stroke="#d34b42" stroke-width="4"/>
  <path d="M396 166 L405 181 L414 166" fill="none" stroke="#d34b42" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="405" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a92d27">weight</text>

  <!-- Distance dimensions -->
  <line x1="160" y1="326" x2="300" y2="326" stroke="#526b7c" stroke-width="2"/>
  <line x1="160" y1="318" x2="160" y2="334" stroke="#526b7c" stroke-width="2"/>
  <line x1="300" y1="318" x2="300" y2="334" stroke="#526b7c" stroke-width="2"/>
  <text x="230" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#18324b">2 m</text>

  <line x1="300" y1="326" x2="405" y2="326" stroke="#526b7c" stroke-width="2"/>
  <line x1="405" y1="318" x2="405" y2="334" stroke="#526b7c" stroke-width="2"/>
  <text x="353" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#18324b">x = 3 m</text>

  <text x="300" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#18324b">6 × 2 = 4 × 3</text>
</svg>