      <path d="M326 248 Q300 208 324 174 Q355 139 407 160 Q445 176 453 226 Q455 270 429 315 L346 315 Q327 285 326 248Z" fill="#ffffff" class="ink"/>
      <path d="M388 160 Q432 141 467 171 Q490 193 474 216 Q445 235 407 216Z" fill="#f7c948" class="ink"/>
      <path d="M454 190 Q542 194 590 224 Q606 234 590 247 Q523 254 454 224Z" fill="#f39c3d" class="ink"/>
      <path d="M466 223 Q540 234 581 260 Q587 271 574 278 Q506 264 449 242Z" fill="#ffb84d" class="ink"/>
      <circle cx="426" cy="183" r="10" fill="#263238"/>
      <circle cx="429" cy="180" r="3.5" fill="#fff"/>
      <path d="M347 190 Q320 205 316 242" fill="none" class="ink" stroke="#cfd8dc" stroke-width="12"/>
      <path d="M359 315 L346 373" class="ink" stroke="#f0a83b" stroke-width="9"/>
      <path d="M420 315 L435 370" class="ink" stroke="#f0a83b" stroke-width="9"/>
      <path d="M337 374 H367" class="ink" stroke="#f0a83b" stroke-width="8"/>
      <path d="M426 371 H454" class="ink" stroke="#f0a83b" stroke-width="8"/>
      <path d="M340 244 Q377 260 419 247" fill="none" stroke="#b0bec5" stroke-width="5"/>
      <text x="278" y="124" class="label medium" fill="#b23a48">HONK!</text>
      <path d="M316 143 l-18 -16 M325 136 l-8 -22" stroke="#b23a48" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <g>
    <path d="M620 300 q35 -30 70 0" fill="none" stroke="#5c8d63" stroke-width="6"/>
    <circle cx="646" cy="286" r="13" fill="#5c8d63"/>
    <circle cx="676" cy="286" r="13" fill="#5c8d63"/>
    <text x="612" y="337" class="label small" fill="#345b3c">commuter? technically.</text>
  </g>

  <rect x="24" y="548" width="752" height="34" rx="10" fill="#ffffff" opacity=".88"/>
  <text x="400" y="571" text-anchor="middle" class="label small" font-weight="bold">2026-10-27 19:02:38 SGT (UTC+08:00)</text>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 250 455;360 250 455" dur="2.2s" repeatCount="indefinite"/>
    <circle cx="250" cy="455" r="8" fill="#263238"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 555 455;360 555 455" dur="2.2s" repeatCount="indefinite"/>
    <circle cx="555" cy="455" r="8" fill="#263238"/>
  </g>
</svg>