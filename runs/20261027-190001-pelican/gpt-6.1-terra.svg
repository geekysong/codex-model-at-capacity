<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636d"/>
      <stop offset="1" stop-color="#303840"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#263238;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#263238}
      .small{font-size:18px}
      .medium{font-size:24px;font-weight:bold}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".9"/>
  <path d="M0 390 Q140 320 285 382 T560 370 T800 350 V600 H0Z" fill="#9ad27c"/>
  <path d="M0 450 Q180 410 350 445 T800 430 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 Q160 492 320 518 T800 505" fill="none" stroke="#f4d35e" stroke-width="8" stroke-dasharray="34 24"/>

  <text x="40" y="62" class="label" font-size="42" font-weight="900" fill="#17324d">THE GREAT PELICAN GETAWAY</text>
  <text x="42" y="94" class="label medium" fill="#335c67">A bird, a bike, and absolutely no sense of balance.</text>

  <g filter="url(#shadow)">
    <g id="bike">
      <circle cx="250" cy="455" r="82" fill="none" class="ink" stroke="#172027" stroke-width="10"/>
      <circle cx="555" cy="455" r="82" fill="none" class="ink" stroke="#172027" stroke-width="10"/>
      <g stroke="#9cc7d8" stroke-width="3" opacity=".9">
        <path d="M250 373V537M168 455H332M192 397L308 513M192 513L308 397"/>
        <path d="M555 373V537M473 455H637M497 397L613 513M497 513L613 397"/>
      </g>
      <path d="M250 455 L355 350 L470 455 L250 455 L410 455 L355 350" fill="none" class="ink" stroke="#d84b3d" stroke-width="9"/>
      <path d="M470 455 L500 345 L555 455" fill="none" class="ink" stroke="#d84b3d" stroke-width="9"/>
      <path d="M493 345 L535 326" class="ink" stroke="#d84b3d" stroke-width="9"/>
      <path d="M336 350 L322 321" class="ink" stroke="#d84b3d" stroke-width="9"/>
      <path d="M305 321 H348" class="ink" stroke="#263238" stroke-width="8"/>
      <path d="M343 455 A42 42 0 1 0 427 455" fill="none" class="ink" stroke="#263238" stroke-width="6"/>
      <path d="M385 455 L415 428" class="ink" stroke="#263238" stroke-width="6"/>
