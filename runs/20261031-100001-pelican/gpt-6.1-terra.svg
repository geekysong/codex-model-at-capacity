    <path d="M347 290 Q354 260 345 229 Q338 199 352 181 Q365 164 389 172 Q405 177 409 196 Q414 213 403 227 Q392 240 402 283Z" fill="#fff9e8" stroke="#233f45" stroke-width="4"/>
