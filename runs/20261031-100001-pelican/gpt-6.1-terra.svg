<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Peak Pelican Performance</title>
  <desc id="desc">A smug pelican rides a bicycle with spinning wheels and bobbing pedals past a sign advertising a cycling race.</desc>
  <defs>
    <pattern id="spokes" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M100 0V200M0 100H200M29 29L171 171M171 29L29 171" fill="none" stroke="#eef5ed" stroke-width="3"/>
    </pattern>
    <g id="wheel">
      <circle r="82" fill="#314a50" stroke="#18343b" stroke-width="8"/>
      <circle r="69" fill="#f6d88c" stroke="#e7a94d" stroke-width="3"/>
      <g stroke="#f8f7e9" stroke-width="4">
        <path d="M0-68V68M-68 0H68M-48-48L48 48M48-48L-48 48"/>
      </g>
      <circle r="10" fill="#e65d43" stroke="#18343b" stroke-width="4"/>
    </g>
    <style>
      .wheel { animation: spin 1.8s linear infinite; }
      .crank { animation: spin 1.8s linear infinite; }
      .rider { animation: bob .9s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) {
        .wheel, .crank, .rider { animation-duration: 6s; }
      }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f9efcf"/>
  <rect x="18" y="18" width="764" height="564" rx="20" fill="#c9e8df" stroke="#233f45" stroke-width="4"/>
  <path d="M20 400 Q120 370 220 393 T420 390 T620 388 T780 394 V523 H20Z" fill="#a2c98e"/>
  <path d="M20 462 Q200 448 400 458 T780 455 V523 H20Z" fill="#e4bd79"/>
  <path d="M30 493 H770" fill="none" stroke="#c59355" stroke-width="3" stroke-dasharray="18 14"/>

  <text x="400" y="68" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="34" fill="#203e45">PEAK PELICAN PERFORMANCE</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#355b5c">The Tour de Fish is off to a questionable start.</text>

  <g fill="#fffdf0" opacity=".8">
    <path d="M80 150q12-22 30-8 18-25 38-4 24-3 27 12z"/>
    <path d="M590 132q12-20 29-7 15-22 34-4 22-3 26 11z"/>
  </g>
  <g transform="translate(668 280)">
