  <rect x="20" y="524" width="760" height="56" rx="0" fill="#fff8e4"/>
  <path d="M20 524H780" stroke="#233f45" stroke-width="3"/>
  <text x="400" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#233f45">“I’m only in it for the free lunch.”</text>
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#355b5c">2026-10-31 10:02:30 SGT (UTC+08:00)</text>
