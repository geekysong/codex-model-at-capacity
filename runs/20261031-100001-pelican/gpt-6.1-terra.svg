    <rect x="-67" y="-38" width="134" height="75" rx="8" fill="#fff7dd" stroke="#233f45" stroke-width="4" transform="rotate(4)"/>
    <text x="0" y="-10" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#233f45">RACE DAY</text>
    <text x="0" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d65b43">NO FISHING!</text>
  </g>

  <g transform="translate(242 420)">
    <g class="wheel"><use href="#wheel"/></g>
  </g>
  <g transform="translate(547 420)">
    <g class="wheel"><use href="#wheel"/></g>
  </g>

