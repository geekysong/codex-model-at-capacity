<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE BEAK EXPRESS</title>
  <desc id="desc">A smug pelican pedals a bicycle past a sign that reads “NO FLYING—BICYCLES ONLY.”</desc>
  <style>
    text { font-family: "Trebuchet MS", Arial, sans-serif; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .rider { animation: bob .65s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px); } }
  </style>

  <rect width="800" height="600" fill="#d9f3f1"/>
  <rect y="405" width="800" height="113" fill="#a7d98b"/>
  <path d="M0 432 Q110 400 215 432 T430 428 T650 430 T800 420 V518 H0Z" fill="#8cc477"/>
  <path d="M0 518H800" stroke="#394b52" stroke-width="5"/>
  <path d="M0 530H800" stroke="#f6d365" stroke-width="4" stroke-dasharray="34 26"/>

  <text x="400" y="51" text-anchor="middle" font-size="34" font-weight="900" letter-spacing="2" fill="#123843">THE BEAK EXPRESS</text>
  <text x="400" y="79" text-anchor="middle" font-size="16" font-weight="700" fill="#365b5d">“I could fly, but the bike has a bell.”</text>

  <g transform="translate(660 142)">
    <rect x="-4" y="0" width="8" height="274" fill="#7b563b"/>
    <rect x="-91" y="10" width="182" height="75" rx="9" fill="#fff3c4" stroke="#394b52" stroke-width="4"/>
    <text x="0" y="39" text-anchor="middle" font-size="15" font-weight="900" fill="#394b52">NO FLYING</text>
    <text x="0" y="63" text-anchor="middle" font-size="13" font-weight="800" fill="#394b52">BICYCLES ONLY</text>
  </g>

  <g fill="#fffdf5" stroke="#394b52" stroke-width="4">
    <path d="M92 138q0-22 22-22h25q18 0 18 19v27H92z"/>
    <path d="M121 162v24M143 162v24"/>
    <path d="M535 184q0-18 18-18h22q15 0 15 16v20h-55z"/>
    <path d="M553 202v20M574 202v20"/>
  </g>
  <g fill="#394b52">
    <circle cx="122" cy="145" r="3"/><circle cx="139" cy="145" r="3"/>
    <circle cx="553" cy="188" r="3"/><circle cx="569" cy="188" r="3"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#d34e3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 402L337 402L300 326L245 402"/>
    <path d="M337 402L382 326L300 326"/>
    <path d="M382 326L430 402"/>
    <path d="M382 326L393 303"/>
  </g>
  <path d="M376 326h28M424 402h24" stroke="#394b52" stroke-width="7" stroke-linecap="round"/>
  <path d="M285 321h31" stroke="#394b52" stroke-width="7" stroke-linecap="round"/>
  <path d="M376 326l-9-12" stroke="#394b52" stroke-width="5"/>
  <circle cx="337" cy="402" r="8" fill="#f6d365" stroke="#394b52" stroke-width="3"/>

  <g class="wheel" fill="none" stroke="#394b52" stroke-width="5">
    <circle cx="245" cy="402" r="51"/>
    <path d="M245 351v102M194 402h102M209 366l72 72M281 366l-72 72"/>
  </g>
  <g class="wheel" fill="none" stroke="#394b52" stroke-width="5">
    <circle cx="430" cy="402" r="51"/>
    <path d="M430 351v102M379 402h102M394 366l72 72M466 366l-72 72"/>
  </g>

  <!-- Pedal and crank -->
  <g class="rider">
    <path d="M337 402l-16-24M337 402l20 20" fill="none" stroke="#394b52" stroke-width="6" stroke-linecap="round"/>
    <path d="M311 375h20M350 425h20" stroke="#394b52" stroke-width="5" stroke-linecap="round"/>
    <!-- feet -->
    <path d="M310 374q-13-8-20 1l18 8M354 421q-4 12 9 14l10-7" fill="#f3a54a" stroke="#394b52" stroke-width="3"/>
    <!-- Pelican body -->
    <ellipse cx="337" cy="260" rx="69" ry="78" fill="#fffdf5" stroke="#394b52" stroke-width="5"/>
    <path d="M294 264q-7 46 31 56q38-4 52-40q-31 14-83-16" fill="#77b9c7" stroke="#394b52" stroke-width="4"/>
    <path d="M305 307q-30 17-44 48q23 13 48-3l25-35" fill="#fffdf5" stroke="#394b52" stroke-width="4"/>
    <!-- neck and head -->
    <path d="M347 218q12-41 37-48q20-3 26 16q5 17-13 32l-8 33" fill="none" stroke="#394b52" stroke-width="21" stroke-linecap="round"/>
    <path d="M347 218q12-41 37-48q20-3 26 16q5 17-13 32l-8 33" fill="none" stroke="#fffdf5" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="388" cy="169" rx="29" ry="25" fill="#fffdf5" stroke="#394b52" stroke-width="4"/>
    <circle cx="397" cy="165" r="4.5" fill="#263b40"/>
    <path d="M411 172q34 3 56 17q-22 16-57 9q-16-4-17-12q2-10 18-14" fill="#f2a83b" stroke="#394b52" stroke-width="4" stroke-linejoin="round"/>
    <path d="M407 192q28 7 49 0q-13 25-39 24q-17-1-19-13" fill="#e77a38" stroke="#394b52" stroke-width="4"/>
    <path d="M449 186l8 4" stroke="#fff5d8" stroke-width="3" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M360 157q7-31 32-32q25 1 30 29z" fill="#e85c47" stroke="#394b52" stroke-width="4"/>
    <path d="M355 157h72" stroke="#394b52" stroke-width="5" stroke-linecap="round"/>
    <path d="M380 129l5-7M402 132l5-7" stroke="#ffd36b" stroke-width="4" stroke-linecap="round"/>
    <!-- wing handlebars pose -->
    <path d="M293 247q-34 8-49 39q28 5 55-15" fill="#fffdf5" stroke="#394b52" stroke-width="4"/>
    <path d="M242 286l-12 13" stroke="#f2a83b" stroke-width="6" stroke-linecap="round"/>
    <!-- feather detail -->
    <path d="M298 274q13 11 29 12M302 284q12 10 25 12" fill="none" stroke="#9bbdc0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M470 286q20-20 35 0q15-18 29 0q-14 23-32 24q-19-2-32-24" fill="#fffdf5" stroke="#394b52" stroke-width="3"/>
  <text x="502" y="280" text-anchor="middle" font-size="14" font-weight="900" fill="#394b52">HONK!</text>

  <rect x="0" y="535" width="800" height="65" fill="#173e49"/>
  <text x="400" y="563" text-anchor="middle" font-size="15" font-weight="700" fill="#fff8de">Pelican-powered commuting: all the peck, none of the parking.</text>
  <text x="400" y="587" text-anchor="middle" font-size="13" font-weight="700" fill="#d9f3f1">2026-10-31 10:02:12 SGT (UTC+08:00)</text>
</svg>