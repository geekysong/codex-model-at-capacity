<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#302044"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#271631"/>
      <stop offset=".5" stop-color="#54214b"/>
      <stop offset="1" stop-color="#271631"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 420 Q190 380 400 420 T800 420 V600 H0Z" fill="url(#floor)"/>
  <path d="M0 480 Q200 440 400 480 T800 480" fill="none" stroke="#b04f9d" stroke-width="3" opacity=".35"/>
  <path d="M0 530 Q200 490 400 530 T800 530" fill="none" stroke="#b04f9d" stroke-width="2" opacity=".25"/>

  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="900" fill="#fff">
    CODEX NIGHTCLUB
  </text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff7bd8">
    “WHERE YOUR REQUESTS COME TO PARTY”
  </text>

  <!-- club entrance -->
  <rect x="455" y="105" width="305" height="285" rx="18" fill="#090914" stroke="#69436c" stroke-width="7"/>
  <rect x="480" y="140" width="255" height="210" rx="12" fill="#21152d"/>
  <path d="M500 320 Q610 150 715 320" fill="#100d1c" stroke="#e348c2" stroke-width="5"/>
  <circle cx="610" cy="230" r="58" fill="#f445b7" opacity=".12" filter="url(#soft)"/>
  <text x="610" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#ffe9fb">
    EXCLUSIVE
  </text>
  <text x="610" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#ffe9fb">
    MODEL LOUNGE
  </text>
  <text x="610" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff73d4">
    ONE MODEL INSIDE
  </text>
  <circle cx="610" cy="315" r="8" fill="#72ffb0"/>
  <text x="630" y="321" font-family="Arial, sans-serif" font-size="14" fill="#b8ffd5">having a blast</text>

  <!-- FULL sign -->
  <rect x="515" y="91" width="190" height="61" rx="10" fill="#26101e" stroke="#ff315f" stroke-width="5" filter="url(#glow)"/>
  <text x="610" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="1000" fill="#ff466f">FULL</text>

  <!-- robot bouncer -->
  <ellipse cx="427" cy="405" rx="73" ry="16" fill="#100b18" opacity=".6"/>
  <rect x="377" y="265" width="103" height="126" rx="25" fill="#8d9aaa" stroke="#17202b" stroke-width="6"/>
  <rect x="363" y="205" width="132" height="85" rx="27" fill="#bbc7d1" stroke="#17202b" stroke-width="7"/>
  <rect x="379" y="222" width="100" height="49" rx="15" fill="#151a27"/>
  <circle cx="410" cy="246" r="10" fill="#ff4e7c" filter="url(#glow)"/>
  <circle cx="447" cy="246" r="10" fill="#ff4e7c" filter="url(#glow)"/>
  <path d="M402 267 Q428 282 456 267" fill="none" stroke="#17202b" stroke-width="5"/>
  <path d="M428 205 V185" stroke="#17202b" stroke-width="7"/>
  <circle cx="428" cy="177" r="10" fill="#ffcf4a" stroke="#17202b" stroke-width="5"/>
  <path d="M377 300 L335 342" stroke="#17202b" stroke-width="16" stroke-linecap="round"/>
  <path d="M480 300 L523 331" stroke="#17202b" stroke-width="16" stroke-linecap="round"/>
  <path d="M335 342 L300 324" stroke="#bbc7d1" stroke-width="13" stroke-linecap="round"/>
  <path d="M523 331 L552 301" stroke="#bbc7d1" stroke-width="13" stroke-linecap="round"/>
  <rect x="395" y="306" width="67" height="39" rx="8" fill="#273746"/>
  <text x="428" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#7dffbc">BOUNCER</text>
  <path d="M399 390 V420 M458 390 V420" stroke="#17202b" stroke-width="17" stroke-linecap="round"/>

  <!-- velvet rope -->
  <path d="M112 391 Q260 440 350 392" fill="none" stroke="#d51d55" stroke-width="10"/>
  <path d="M112 391 Q260 440 350 392" fill="none" stroke="#ff6b8f" stroke-width="3"/>
  <circle cx="112" cy="391" r="14" fill="#e4b55c" stroke="#513b20" stroke-width="5"/>
  <circle cx="350" cy="392" r="14" fill="#e4b55c" stroke="#513b20" stroke-width="5"/>
  <path d="M112 399 V470 M350 400 V460" stroke="#d5a34d" stroke-width="8"/>

  <!-- queue developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(38 325)">
      <circle cx="35" cy="23" r="24" fill="#9b604d"/>
      <path d="M11 22 Q35 -10 59 22" fill="#50332d"/>
      <rect x="12" y="51" width="48" height="69" rx="12" fill="#4b73a7"/>
      <path d="M12 66 L-2 103 M60 66 L76 101" stroke="#4b73a7" stroke-width="13"/>
      <path d="M25 120 V151 M48 120 V151" stroke="#24253d" stroke-width="13"/>
      <rect x="20" y="31" width="13" height="8" fill="#e9f4ff"/>
      <rect x="42" y="31" width="13" height="8" fill="#e9f4ff"/>
      <path d="M30 45 Q35 49 41 45" fill="none" stroke="#401d25" stroke-width="3"/>
    </g>
    <g transform="translate(155 350) scale(.86)">
      <circle cx="35" cy="23" r="24" fill="#d28b67"/>
      <path d="M10 20 Q19 -12 58 8 L61 30 Q36 12 10 28Z" fill="#d6b36e"/>
      <rect x="12" y="51" width="48" height="69" rx="12" fill="#62a77e"/>
      <path d="M12 66 L-4 105 M60 66 L78 94" stroke="#62a77e" stroke-width="13"/>
      <path d="M25 120 V151 M48 120 V151" stroke="#292943" stroke-width="13"/>
      <path d="M27 42 Q35 48 45 42" fill="none" stroke="#6d2630" stroke-width="3"/>
    </g>
    <g transform="translate(267 330) scale(.9)">
      <circle cx="35" cy="23" r="24" fill="#705044"/>
      <path d="M8 22 Q17 -13 62 16 L57 31 Q34 10 8 29Z" fill="#20253c"/>
      <rect x="12" y="51" width="48" height="69" rx="12" fill="#b34f76"/>
      <path d="M12 66 L-7 94 M60 66 L78 102" stroke="#b34f76" stroke-width="13"/>
      <path d="M25 120 V151 M48 120 V151" stroke="#292943" stroke-width="13"/>
      <path d="M27 43 Q35 38 45 43" fill="none" stroke="#401d25" stroke-width="3"/>
    </g>
  </g>

  <!-- exhausted speech bubbles -->
  <path d="M52 280 Q52 235 116 235 H177 Q198 235 198 257 V277 Q198 300 177 300 H116 L89 319 V300 H73 Q52 300 52 280Z" fill="#fff8e7" stroke="#29223c" stroke-width="4"/>
  <text x="125" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#302540">I JUST NEED</text>
  <text x="125" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#302540">A SMALL FIX!</text>
  <path d="M220 235 Q220 192 278 192 H337 Q357 192 357 213 V235 Q357 254 337 254 H275 L249 273 V254 H239 Q220 254 220 235Z" fill="#fff8e7" stroke="#29223c" stroke-width="4"/>
  <text x="288" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#302540">IT'S BEEN</text>
  <text x="288" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#302540">THREE HOURS.</text>

  <!-- melting hamster servers -->
  <g transform="translate(620 390)">
    <ellipse cx="0" cy="25" rx="50" ry="19" fill="#ff8b42" opacity=".5" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="39" fill="#b97852" stroke="#3a2530" stroke-width="5"/>
    <circle cx="-13" cy="-8" r="7" fill="#252239"/>
    <circle cx="14" cy="-8" r="7" fill="#252239"/>
    <path d="M-12 14 Q0 23 14 14" fill="none" stroke="#3a2530" stroke-width="4"/>
    <path d="M-40 36 Q-18 52 0 38 T40 36" fill="none" stroke="#ffcf5c" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g transform="translate(705 405) scale(.75)">
    <circle cx="0" cy="0" r="39" fill="#b97852" stroke="#3a2530" stroke-width="5"/>
    <circle cx="-13" cy="-8" r="7" fill="#252239"/>
    <circle cx="14" cy="-8" r="7" fill="#252239"/>
    <path d="M-12 14 Q0 23 14 14" fill="none" stroke="#3a2530" stroke-width="4"/>
    <path d="M-40 36 Q-18 52 0 38 T40 36" fill="none" stroke="#ffcf5c" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="670" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#ffbd78">
    SERVER ROOM: “SEND HELP”
  </text>

  <!-- bouncer sign -->
  <path d="M491 344 L602 335 L608 391 L497 400Z" fill="#fff7d6" stroke="#29223c" stroke-width="5"/>
  <text x="552" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#ce315d">SORRY,</text>
  <text x="552" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#ce315d">AT CAPACITY.</text>

  <!-- caption -->
  <rect x="34" y="548" width="732" height="35" rx="12" fill="#120d1e" stroke="#ff62c8" stroke-width="2"/>
  <text x="400" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#fff5ff">
    “SELECTED MODEL IS AT CAPACITY. PLEASE TRY A DIFFERENT MODEL.”
  </text>
</svg>