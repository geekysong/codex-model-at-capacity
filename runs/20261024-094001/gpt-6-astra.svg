<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#322044"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#6ef7ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M30 105 Q400 45 770 105" fill="none" stroke="#6ef7ff" stroke-width="3" opacity=".4"/>
  <path d="M55 125 Q400 75 745 125" fill="none" stroke="#ff4fd8" stroke-width="2" opacity=".35"/>

  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff91e8">“SELECTED MODEL IS AT CAPACITY”</text>

  <!-- club facade -->
  <rect x="180" y="120" width="440" height="355" rx="20" fill="#121323" stroke="#6ef7ff" stroke-width="4"/>
  <rect x="205" y="145" width="390" height="285" rx="12" fill="#24203d" stroke="#ff4fd8" stroke-width="3"/>
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#6ef7ff">EXCLUSIVE MODEL LOUNGE</text>

  <!-- FULL sign -->
  <rect x="300" y="192" width="200" height="68" rx="12" fill="#29091c" stroke="#ff315c" stroke-width="5" filter="url(#glow)"/>
  <text x="400" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#ff315c">FULL</text>
  <circle cx="315" cy="210" r="5" fill="#ff315c"/>
  <circle cx="485" cy="210" r="5" fill="#ff315c"/>

  <!-- disco lights -->
  <circle cx="235" cy="290" r="10" fill="#6ef7ff" filter="url(#glow)"/>
  <circle cx="565" cy="290" r="10" fill="#ff4fd8" filter="url(#glow)"/>
  <path d="M220 340 L270 420 M580 340 L530 420" stroke="#6ef7ff" stroke-width="3" opacity=".5"/>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(245 340)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#aaa7c9" stroke-width="8"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#6ef7ff" stroke-width="4"/>
    <path d="M-30-10 Q0-38 30-10 M-28 18 Q0-8 28 18" fill="none" stroke="#ff4fd8" stroke-width="4"/>
    <rect x="-19" y="-9" width="38" height="24" rx="5" fill="#4b4a72"/>
    <circle cx="-9" cy="3" r="4" fill="#ff315c"/>
    <circle cx="9" cy="3" r="4" fill="#ff315c"/>
    <path d="M-30 48 Q-20 60 -5 51 T20 54 T40 45" fill="none" stroke="#ff9d4d" stroke-width="8"/>
    <text x="0" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffbd79">SERVER SWEAT</text>
  </g>
  <g transform="translate(555 340)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#aaa7c9" stroke-width="8"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#6ef7ff" stroke-width="4"/>
    <path d="M-30-10 Q0-38 30-10 M-28 18 Q0-8 28 18" fill="none" stroke="#ff4fd8" stroke-width="4"/>
    <rect x="-19" y="-9" width="38" height="24" rx="5" fill="#4b4a72"/>
    <circle cx="-9" cy="3" r="4" fill="#ff315c"/>
    <circle cx="9" cy="3" r="4" fill="#ff315c"/>
    <path d="M-38 48 Q-20 58 -5 50 T22 54 T38 45" fill="none" stroke="#ff9d4d" stroke-width="8"/>
    <text x="0" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffbd79">SERVER SWEAT</text>
  </g>

  <!-- bouncer -->
  <g transform="translate(130 295)">
    <ellipse cx="0" cy="166" rx="86" ry="16" fill="#090914" opacity=".6"/>
    <rect x="-53" y="48" width="106" height="118" rx="26" fill="#49516f" stroke="#101123" stroke-width="5"/>
    <rect x="-47" y="78" width="94" height="18" rx="8" fill="#6ef7ff" opacity=".8"/>
    <circle cx="-19" cy="87" r="5" fill="#ff315c"/><circle cx="0" cy="87" r="5" fill="#ff315c"/><circle cx="19" cy="87" r="5" fill="#ff315c"/>
    <rect x="-44" y="16" width="88" height="62" rx="18" fill="#6f7895" stroke="#101123" stroke-width="5"/>
    <rect x="-33" y="31" width="66" height="29" rx="8" fill="#14162b"/>
    <circle cx="-15" cy="45" r="7" fill="#ff315c" filter="url(#glow)"/><circle cx="15" cy="45" r="7" fill="#ff315c" filter="url(#glow)"/>
    <path d="M-20 67 Q0 79 20 67" fill="none" stroke="#111426" stroke-width="4"/>
    <path d="M-45 115 L-89 89" stroke="#6f7895" stroke-width="18" stroke-linecap="round"/>
    <path d="M45 115 L88 78" stroke="#6f7895" stroke-width="18" stroke-linecap="round"/>
    <rect x="-92" y="69" width="55" height="30" rx="7" fill="#ffd34e" stroke="#151326" stroke-width="4" transform="rotate(-17 -92 69)"/>
    <text x="-65" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#151326" transform="rotate(-17 -65 89)">NOPE</text>
    <path d="M-30 5 L-43-23 M30 5 L43-23" stroke="#6f7895" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- velvet rope -->
  <path d="M175 466 Q400 525 625 466" fill="none" stroke="#d10d54" stroke-width="12"/>
  <path d="M175 466 Q400 525 625 466" fill="none" stroke="#ff558b" stroke-width="3" stroke-dasharray="12 14"/>
  <g fill="#e9c96a" stroke="#6b4b27" stroke-width="4">
    <circle cx="175" cy="466" r="12"/><circle cx="625" cy="466" r="12"/>
    <circle cx="400" cy="507" r="10"/>
  </g>
  <path d="M175 466 V555 M625 466 V555 M400 507 V555" stroke="#d3b45b" stroke-width="8"/>
  <path d="M155 555 H195 M605 555 H645 M380 555 H420" stroke="#d3b45b" stroke-width="10" stroke-linecap="round"/>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(50 440)">
      <circle cx="0" cy="0" r="22" fill="#d49a78"/><path d="M-20-6 Q0-30 20-6" fill="#4a2d3d"/>
      <rect x="-24" y="22" width="48" height="58" rx="12" fill="#4d8b9e"/>
      <path d="M-18 42 H18 M-18 55 H9" stroke="#d7f7ff" stroke-width="4"/>
      <path d="M-30 86 Q0 74 30 86" fill="none" stroke="#777a99" stroke-width="5"/>
      <text x="0" y="108" text-anchor="middle" font-size="12" fill="#fff">dev #1</text>
    </g>
    <g transform="translate(120 470)">
      <circle cx="0" cy="0" r="22" fill="#a96e54"/><path d="M-20-8 Q0-34 20-8" fill="#211d2b"/>
      <rect x="-24" y="22" width="48" height="58" rx="12" fill="#c46b75"/>
      <path d="M-18 42 H18 M-18 55 H7" stroke="#ffe1c6" stroke-width="4"/>
      <path d="M-12 10 L-5 17 M12 10 L5 17" stroke="#211d2b" stroke-width="3"/>
      <text x="0" y="108" text-anchor="middle" font-size="12" fill="#fff">dev #2</text>
    </g>
    <g transform="translate(690 445)">
      <circle cx="0" cy="0" r="22" fill="#dba27e"/><path d="M-20-6 Q0-30 20-6" fill="#6a4b35"/>
      <rect x="-24" y="22" width="48" height="58" rx="12" fill="#6d9b62"/>
      <path d="M-18 42 H18 M-18 55 H11" stroke="#eaffd6" stroke-width="4"/>
      <path d="M-13 10 L-5 17 M13 10 L5 17" stroke="#4a2d3d" stroke-width="3"/>
      <text x="0" y="108" text-anchor="middle" font-size="12" fill="#fff">dev #99</text>
    </g>
  </g>

  <text x="400" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffd34e">The queue is infinite. The guest list has exactly one name.</text>
</svg>