<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17132b"/>
      <stop offset="1" stop-color="#351445"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39245e"/>
      <stop offset="1" stop-color="#120d22"/>
    </linearGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff426f"/>
      <stop offset=".5" stop-color="#ff9b4a"/>
      <stop offset="1" stop-color="#ff426f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="95" cy="100" r="2" fill="#fff" opacity=".7"/>
  <circle cx="725" cy="80" r="2" fill="#fff" opacity=".5"/>
  <circle cx="660" cy="180" r="3" fill="#ff6cba" opacity=".6"/>
  <path d="M0 455 Q180 420 330 455 T800 445 V600 H0Z" fill="#0c0a16"/>

  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ff98c8">THE HOTTEST MODEL IN TOWN (ALLEGEDLY)</text>

  <!-- Club façade -->
  <rect x="430" y="115" width="315" height="355" rx="20" fill="#090711" stroke="#6d4c9d" stroke-width="5"/>
  <rect x="458" y="180" width="260" height="250" rx="12" fill="url(#door)" stroke="#ff4f9a" stroke-width="4"/>
  <path d="M470 184 Q588 115 706 184" fill="#261843" stroke="#8d5dbb" stroke-width="3"/>
  <path d="M470 184 Q588 135 706 184" fill="none" stroke="#ff5aa8" stroke-width="4" opacity=".8"/>

  <!-- FULL sign -->
  <rect x="500" y="103" width="176" height="70" rx="12" fill="#4b0d28" stroke="#ff416d" stroke-width="5" filter="url(#glow)"/>
  <text x="588" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#fff" letter-spacing="4">FULL</text>
  <text x="588" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffb2ce">TRY AGAIN NEVER</text>

  <!-- Inside: the one model -->
  <ellipse cx="588" cy="285" rx="65" ry="90" fill="#191126" stroke="#a98cff" stroke-width="4"/>
  <rect x="548" y="232" width="80" height="58" rx="16" fill="#5ee7ff" stroke="#c8fbff" stroke-width="4"/>
  <circle cx="570" cy="259" r="7" fill="#11152d"/>
  <circle cx="606" cy="259" r="7" fill="#11152d"/>
  <path d="M568 276 Q588 288 608 276" fill="none" stroke="#11152d" stroke-width="5"/>
  <path d="M588 229 V211" stroke="#c8fbff" stroke-width="4"/>
  <circle cx="588" cy="207" r="6" fill="#ffdf64"/>
  <rect x="564" y="305" width="48" height="65" rx="14" fill="#7b65d5"/>
  <text x="588" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ffb5db">MODEL 1.0</text>
  <text x="588" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbb8ff">VIP: IT GOT IN</text>

  <!-- Melting server hamster wheels -->
  <g transform="translate(665 305)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#6df3bc" stroke-width="8"/>
    <circle cx="0" cy="0" r="8" fill="#ff744f"/>
    <path d="M-26 -15 L26 15 M-26 15 L26 -15" stroke="#6df3bc" stroke-width="4"/>
    <path d="M-27 42 Q-5 56 17 43 Q31 53 43 42" fill="none" stroke="#ff744f" stroke-width="7" stroke-linecap="round"/>
    <path d="M-14 48 Q-8 70 0 52 M15 48 Q22 65 28 47" stroke="#ffbf4f" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(512 350) scale(.75)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#6df3bc" stroke-width="8"/>
    <circle cx="0" cy="0" r="8" fill="#ff744f"/>
    <path d="M-26 -15 L26 15 M-26 15 L26 -15" stroke="#6df3bc" stroke-width="4"/>
    <path d="M-27 42 Q-5 56 17 43 Q31 53 43 42" fill="none" stroke="#ff744f" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="590" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ff946d">SERVER HEAT: LOL</text>

  <!-- Bouncer -->
  <g transform="translate(365 245)">
    <ellipse cx="0" cy="164" rx="75" ry="15" fill="#08070d" opacity=".7"/>
    <rect x="-55" y="-30" width="110" height="92" rx="28" fill="#41465c" stroke="#b7c0d5" stroke-width="4"/>
    <rect x="-39" y="-8" width="78" height="38" rx="12" fill="#121426" stroke="#7dffef" stroke-width="3"/>
    <circle cx="-17" cy="11" r="7" fill="#ff4f70"/>
    <circle cx="17" cy="11" r="7" fill="#ff4f70"/>
    <path d="M-20 43 Q0 54 20 43" fill="none" stroke="#f1f5ff" stroke-width="4"/>
    <path d="M0 -30 V-55" stroke="#b7c0d5" stroke-width="5"/>
    <circle cx="0" cy="-60" r="8" fill="#ffd45e"/>
    <path d="M-65 63 L-95 125" stroke="#9ca8c4" stroke-width="18" stroke-linecap="round"/>
    <path d="M65 63 L100 90" stroke="#9ca8c4" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-98" cy="127" r="13" fill="#ff627f"/>
    <path d="M-52 65 L-38 145 M52 65 L38 145" stroke="#2c3144" stroke-width="22" stroke-linecap="round"/>
    <rect x="-82" y="78" width="60" height="24" rx="8" fill="#ff5a8f" transform="rotate(-20 -82 78)"/>
    <text x="-52" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#fff" transform="rotate(-20 -52 96)">NOPE</text>
    <path d="M-110 155 Q-165 150 -188 120" fill="none" stroke="#fff" stroke-width="4"/>
    <text x="-205" y="112" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#fff" transform="rotate(-8 -205 112)">NEXT!</text>
  </g>

  <!-- Queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 385)">
      <circle cx="0" cy="0" r="24" fill="#d89a78"/><path d="M-23 -5 Q0 -34 24 -6" fill="#44302b"/>
      <rect x="-28" y="25" width="56" height="75" rx="14" fill="#3e7bb3"/><path d="M-19 105 L-30 155 M19 105 L30 155" stroke="#d2d8e5" stroke-width="13"/>
      <path d="M-34 52 Q-70 70 -80 95" stroke="#d89a78" stroke-width="11" fill="none"/><text x="-52" y="20" font-size="13" fill="#bfc5d8">zzz…</text>
      <rect x="-22" y="52" width="44" height="25" rx="4" fill="#171a2b"/><text x="0" y="70" text-anchor="middle" font-size="10" fill="#8dffdd">BUG</text>
    </g>
    <g transform="translate(175 405)">
      <circle cx="0" cy="0" r="23" fill="#9a674d"/><path d="M-22 -4 Q0 -31 22 -4" fill="#1e202b"/>
      <rect x="-27" y="24" width="54" height="73" rx="13" fill="#c65d72"/><path d="M-18 101 L-25 148 M18 101 L28 148" stroke="#d7d4e1" stroke-width="13"/>
      <path d="M-30 51 Q-62 80 -65 103" stroke="#9a674d" stroke-width="11" fill="none"/><text x="-58" y="18" font-size="12" fill="#ffb6cc">why?</text>
      <rect x="-20" y="49" width="40" height="24" rx="4" fill="#171a2b"/><text x="0" y="66" text-anchor="middle" font-size="9" fill="#ffdf65">RETRY</text>
    </g>
    <g transform="translate(270 395)">
      <circle cx="0" cy="0" r="24" fill="#efbd9a"/><path d="M-24 -5 Q0 -37 24 -5" fill="#e7d65e"/>
      <rect x="-28" y="25" width="56" height="75" rx="14" fill="#5eaa72"/><path d="M-18 103 L-26 153 M18 103 L30 153" stroke="#d2d8e5" stroke-width="13"/>
      <path d="M28 52 Q65 73 76 96" stroke="#efbd9a" stroke-width="11" fill="none"/><text x="35" y="8" font-size="13" fill="#ffdc73">again?!</text>
      <rect x="-20" y="50" width="40" height="24" rx="4" fill="#171a2b"/><text x="0" y="67" text-anchor="middle" font-size="9" fill="#8dffdd">WAIT</text>
    </g>
  </g>

  <!-- Velvet rope -->
  <circle cx="245" cy="500" r="14" fill="#d7a34d" stroke="#ffe49b" stroke-width="3"/>
  <circle cx="425" cy="500" r="14" fill="#d7a34d" stroke="#ffe49b" stroke-width="3"/>
  <path d="M245 500 Q330 555 425 500" fill="none" stroke="url(#rope)" stroke-width="10"/>
  <path d="M245 500 Q330 555 425 500" fill="none" stroke="#ffcf80" stroke-width="2" opacity=".7"/>

  <!-- Caption -->
  <rect x="28" y="535" width="744" height="46" rx="12" fill="#090711" stroke="#ff5a9d" stroke-width="3"/>
  <text x="400" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#fff">“Selected model is at capacity.” — THE BOUNCER, EVERY NIGHT</text>
</svg>