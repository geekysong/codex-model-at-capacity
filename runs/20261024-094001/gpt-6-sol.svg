<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#33204a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#271c38"/>
      <stop offset=".5" stop-color="#55305b"/>
      <stop offset="1" stop-color="#271c38"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="410" width="800" height="190" fill="url(#floor)"/>

  <!-- nightclub lights -->
  <path d="M90 0 L210 410" stroke="#4cf4ff" stroke-width="18" opacity=".12"/>
  <path d="M710 0 L590 410" stroke="#ff43d0" stroke-width="18" opacity=".12"/>
  <circle cx="105" cy="105" r="8" fill="#4cf4ff" filter="url(#glow)"/>
  <circle cx="690" cy="130" r="8" fill="#ff43d0" filter="url(#glow)"/>
  <circle cx="400" cy="65" r="6" fill="#ffe66d" filter="url(#glow)"/>

  <!-- title -->
  <text x="400" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#fff">
    CODEX NIGHTCLUB
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ff71dd" letter-spacing="3">
    THE MOST EXCLUSIVE MODEL IN TOWN
  </text>

  <!-- glowing FULL sign -->
  <rect x="284" y="103" width="232" height="78" rx="14" fill="#160d24" stroke="#ff315f" stroke-width="6" filter="url(#glow)"/>
  <text x="400" y="157" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#ff456d">
    FULL
  </text>
  <circle cx="305" cy="124" r="5" fill="#ffec72"/>
  <circle cx="495" cy="124" r="5" fill="#ffec72"/>

  <!-- back wall club door -->
  <rect x="520" y="198" width="175" height="218" rx="10" fill="#0d0b18" stroke="#a94de7" stroke-width="5"/>
  <path d="M540 390 Q608 335 675 390" fill="none" stroke="#562c74" stroke-width="7"/>
  <text x="607" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#cda8ff">
    EXCLUSIVE
  </text>
  <text x="607" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#cda8ff">
    ONE MODEL ONLY
  </text>
  <rect x="575" y="282" width="66" height="90" rx="8" fill="#3f2060"/>
  <circle cx="597" cy="312" r="9" fill="#65f2ff"/>
  <circle cx="620" cy="312" r="9" fill="#65f2ff"/>
  <path d="M592 340 Q608 353 624 340" fill="none" stroke="#65f2ff" stroke-width="4"/>
  <text x="608" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#f0d8ff">MODEL-X</text>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(88 315)">
    <ellipse cx="78" cy="68" rx="70" ry="47" fill="none" stroke="#67d7e8" stroke-width="13"/>
    <path d="M25 68 Q78 5 131 68 Q78 127 25 68Z" fill="none" stroke="#67d7e8" stroke-width="4"/>
    <path d="M78 10 L78 125 M28 44 L128 93 M28 93 L128 44" stroke="#67d7e8" stroke-width="3"/>
    <ellipse cx="78" cy="116" rx="61" ry="15" fill="#ff704c" opacity=".8" filter="url(#soft)"/>
    <path d="M24 122 q15 18 30 0 q15 20 30 0 q15 18 30 0 q15 16 30 0" fill="none" stroke="#ff8a55" stroke-width="8"/>
    <text x="78" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#ffad73">SERVER FARM</text>
  </g>

  <!-- bouncer -->
  <g transform="translate(382 205)">
    <ellipse cx="0" cy="192" rx="73" ry="17" fill="#140d20" opacity=".7"/>
    <rect x="-51" y="90" width="102" height="108" rx="24" fill="#29263c" stroke="#8a7ba5" stroke-width="4"/>
    <path d="M-50 113 L-83 162 M50 113 L84 162" stroke="#29263c" stroke-width="22" stroke-linecap="round"/>
    <circle cx="0" cy="53" r="53" fill="#9ca8b8" stroke="#d9e4ef" stroke-width="5"/>
    <rect x="-38" y="37" width="76" height="33" rx="10" fill="#151827"/>
    <circle cx="-19" cy="53" r="9" fill="#ff3d76" filter="url(#glow)"/>
    <circle cx="19" cy="53" r="9" fill="#ff3d76" filter="url(#glow)"/>
    <path d="M-25 88 Q0 103 25 88" fill="none" stroke="#5a6578" stroke-width="5"/>
    <path d="M-13 0 L13 0" stroke="#d9e4ef" stroke-width="5"/>
    <circle cx="0" cy="-12" r="7" fill="#ffdc55"/>
    <rect x="-63" y="102" width="126" height="16" rx="8" fill="#111322"/>
    <text x="0" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#ff5d9f">BOUNCER BOT</text>
    <path d="M65 95 Q105 75 128 96" fill="none" stroke="#9ca8b8" stroke-width="8" stroke-linecap="round"/>
    <path d="M127 96 L145 87 L136 108Z" fill="#ffdf70"/>
  </g>

  <!-- velvet rope -->
  <path d="M300 418 Q398 456 496 418" fill="none" stroke="#e32067" stroke-width="10"/>
  <circle cx="300" cy="418" r="14" fill="#f4c65d" stroke="#fff0a4" stroke-width="3"/>
  <circle cx="496" cy="418" r="14" fill="#f4c65d" stroke="#fff0a4" stroke-width="3"/>

  <!-- queue of developers -->
  <g font-family="Arial, sans-serif">
    <!-- dev 1 -->
    <g transform="translate(45 430)">
      <circle cx="0" cy="0" r="24" fill="#f3b48f"/>
      <path d="M-23 -5 Q0 -38 24 -5 Q18 -25 -4 -26 Q-22 -22 -23 -5" fill="#3b2630"/>
      <rect x="-28" y="23" width="56" height="74" rx="14" fill="#4bc4b8"/>
      <path d="M-28 48 L-55 80 M28 48 L52 75" stroke="#f3b48f" stroke-width="12" stroke-linecap="round"/>
      <text x="0" y="120" text-anchor="middle" font-size="13" fill="#fff">DEV 1</text>
    </g>
    <!-- dev 2 -->
    <g transform="translate(160 447)">
      <circle cx="0" cy="0" r="23" fill="#8d5a43"/>
      <path d="M-23 -2 Q0 -30 23 -2 L19 -19 Q0 -35 -19 -18Z" fill="#15151c"/>
      <rect x="-29" y="22" width="58" height="73" rx="14" fill="#ee7667"/>
      <path d="M-28 48 L-57 72 M28 48 L56 72" stroke="#8d5a43" stroke-width="12" stroke-linecap="round"/>
      <text x="0" y="117" text-anchor="middle" font-size="13" fill="#fff">DEV 2</text>
    </g>
    <!-- dev 3 -->
    <g transform="translate(270 432)">
      <circle cx="0" cy="0" r="24" fill="#e8a879"/>
      <path d="M-25 -4 Q-4 -35 24 -8 L19 -22 Q-8 -38 -25 -12Z" fill="#c4d1db"/>
      <rect x="-29" y="23" width="58" height="76" rx="14" fill="#6e8ce6"/>
      <path d="M-28 50 L-56 77 M28 50 L56 77" stroke="#e8a879" stroke-width="12" stroke-linecap="round"/>
      <text x="0" y="121" text-anchor="middle" font-size="13" fill="#fff">DEV 3</text>
    </g>
    <!-- dev 4 -->
    <g transform="translate(735 440)">
      <circle cx="0" cy="0" r="23" fill="#bd795e"/>
      <path d="M-23 -3 Q0 -34 23 -3 L21 -20 Q0 -38 -21 -19Z" fill="#f4d35e"/>
      <rect x="-28" y="22" width="56" height="76" rx="14" fill="#9a63ce"/>
      <path d="M-28 48 L-55 76 M28 48 L55 76" stroke="#bd795e" stroke-width="12" stroke-linecap="round"/>
      <text x="0" y="120" text-anchor="middle" font-size="13" fill="#fff">DEV 99</text>
    </g>
  </g>

  <!-- denied speech bubble -->
  <path d="M112 218 Q190 174 285 219 Q309 232 290 255 Q240 291 147 270 L115 292 L121 262 Q91 249 112 218Z" fill="#fff8e9" stroke="#2a1d38" stroke-width="4"/>
  <text x="201" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#3a2545">
    "SORRY!"
  </text>
  <text x="201" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3a2545">
    TRY A DIFFERENT MODEL
  </text>

  <!-- caption -->
  <rect x="95" y="535" width="610" height="43" rx="21" fill="#110d1b" stroke="#ff71dd" stroke-width="2"/>
  <text x="400" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#fff">
    WHEN THE MODEL IS "AT CAPACITY," THE QUEUE GETS A DJ SET.
  </text>
</svg>