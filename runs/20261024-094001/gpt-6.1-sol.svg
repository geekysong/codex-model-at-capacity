<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#332047"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f7b"/>
      <stop offset="1" stop-color="#ffb52e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="105" cy="100" r="70" fill="#5f2b8b" opacity=".25"/>
  <circle cx="700" cy="125" r="95" fill="#1b7d9a" opacity=".18"/>
  <path d="M0 470 Q180 420 350 465 T800 450 V600 H0Z" fill="#10101e"/>

  <text x="400" y="48" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2">CODEX NIGHTCLUB</text>
  <text x="400" y="78" text-anchor="middle" fill="#ffce57" font-family="Arial, sans-serif" font-size="17" font-weight="700">THE EXCLUSIVE MODEL LOUNGE</text>

  <!-- club facade -->
  <rect x="485" y="115" width="265" height="350" rx="20" fill="#171827" stroke="#7e4cbb" stroke-width="5"/>
  <path d="M480 185 H755" stroke="#ff4f8b" stroke-width="7"/>
  <path d="M515 205 V440 M565 205 V440 M615 205 V440 M665 205 V440 M715 205 V440" stroke="#3f315d" stroke-width="4"/>
  <circle cx="540" cy="260" r="19" fill="#38e0cf" opacity=".7"/>
  <circle cx="665" cy="315" r="22" fill="#ff4f9e" opacity=".65"/>
  <circle cx="715" cy="245" r="13" fill="#ffce57" opacity=".8"/>
  <text x="617" y="155" text-anchor="middle" fill="#ffce57" font-family="Arial, sans-serif" font-size="17" font-weight="800">MODEL VIP ONLY</text>

  <!-- glowing FULL sign -->
  <rect x="535" y="90" width="165" height="72" rx="13" fill="#321630" stroke="#ff668d" stroke-width="5" filter="url(#glow)"/>
  <text x="617" y="137" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="36" font-weight="900">FULL</text>

  <!-- bouncer robot -->
  <ellipse cx="421" cy="482" rx="78" ry="17" fill="#090914" opacity=".7"/>
  <rect x="365" y="275" width="112" height="133" rx="28" fill="#8b9aaa" stroke="#202938" stroke-width="6"/>
  <rect x="347" y="215" width="148" height="95" rx="25" fill="#aebcca" stroke="#202938" stroke-width="7"/>
  <rect x="367" y="237" width="108" height="47" rx="17" fill="#17233a"/>
  <circle cx="397" cy="260" r="9" fill="#ff527e" filter="url(#glow)"/>
  <circle cx="445" cy="260" r="9" fill="#ff527e" filter="url(#glow)"/>
  <path d="M394 292 Q420 307 449 291" fill="none" stroke="#293448" stroke-width="6"/>
  <path d="M421 215 V192" stroke="#202938" stroke-width="7"/>
  <circle cx="421" cy="186" r="11" fill="#ffce57"/>
  <path d="M365 326 L331 360" stroke="#202938" stroke-width="15" stroke-linecap="round"/>
  <path d="M477 326 L527 350" stroke="#202938" stroke-width="15" stroke-linecap="round"/>
  <path d="M377 405 L353 474 M462 405 L487 474" stroke="#202938" stroke-width="18" stroke-linecap="round"/>
  <path d="M516 335 Q552 348 575 370" fill="none" stroke="#ffce57" stroke-width="7"/>
  <text x="548" y="330" fill="#ffce57" font-family="Arial, sans-serif" font-size="15" font-weight="800" transform="rotate(14 548 330)">NOPE.</text>

  <!-- velvet rope -->
  <path d="M140 438 Q250 365 330 422 T505 428" fill="none" stroke="#d61e57" stroke-width="9"/>
  <path d="M140 438 V490 M505 428 V490" stroke="#e7b34b" stroke-width="8"/>
  <circle cx="140" cy="438" r="12" fill="#ffce57"/>
  <circle cx="505" cy="428" r="12" fill="#ffce57"/>

  <!-- queue developers -->
  <g stroke="#202938" stroke-width="5">
    <circle cx="75" cy="376" r="25" fill="#d89570"/>
    <path d="M42 458 Q75 408 108 458 V493 H42Z" fill="#4d91c8"/>
    <path d="M53 369 Q75 334 98 369" fill="none" stroke="#392b35" stroke-width="12"/>
    <rect x="56" y="373" width="38" height="13" rx="5" fill="#7ee0db" stroke="none"/>

    <circle cx="155" cy="355" r="24" fill="#a96f4f"/>
    <path d="M123 450 Q155 395 188 450 V493 H123Z" fill="#d85b66"/>
    <path d="M132 350 Q155 317 179 350" fill="none" stroke="#252535" stroke-width="13"/>
    <path d="M139 360 h32" stroke="#f4cf87" stroke-width="5"/>

    <circle cx="235" cy="386" r="24" fill="#e2ad85"/>
    <path d="M203 470 Q235 421 268 470 V500 H203Z" fill="#7a5bc4"/>
    <path d="M211 378 Q237 350 260 380" fill="none" stroke="#51352f" stroke-width="12"/>
    <rect x="215" y="389" width="39" height="12" rx="5" fill="#7ee0db" stroke="none"/>

    <circle cx="300" cy="345" r="22" fill="#c78661"/>
    <path d="M270 441 Q300 397 330 441 V490 H270Z" fill="#45ad83"/>
    <path d="M277 338 Q299 310 322 341" fill="none" stroke="#242335" stroke-width="12"/>
  </g>

  <!-- exhausted speech bubbles -->
  <path d="M42 310 Q75 285 110 307 L104 334 Q75 347 48 333Z" fill="#fff" stroke="#22283a" stroke-width="4"/>
  <text x="76" y="325" text-anchor="middle" fill="#23243a" font-family="Arial, sans-serif" font-size="12" font-weight="800">again?</text>
  <path d="M174 278 Q215 253 254 277 L248 305 Q214 317 181 303Z" fill="#fff" stroke="#22283a" stroke-width="4"/>
  <text x="214" y="294" text-anchor="middle" fill="#23243a" font-family="Arial, sans-serif" font-size="12" font-weight="800">still waiting...</text>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(560 475)">
    <ellipse cx="0" cy="0" rx="82" ry="23" fill="#0a0b14"/>
    <circle cx="-25" cy="-40" r="46" fill="none" stroke="#58677e" stroke-width="12"/>
    <path d="M-25 -86 V6 M-71 -40 H21 M-58 -73 L8 -7 M8 -73 L-58 -7" stroke="#58677e" stroke-width="5"/>
    <path d="M-65 2 Q-45 20 -25 5 T15 4" fill="none" stroke="#ff743d" stroke-width="11"/>
    <path d="M42 -12 Q64 -30 76 -4 T91 12" fill="none" stroke="#ff743d" stroke-width="9"/>
    <path d="M-58 25 Q-45 42 -27 28 T8 29" fill="none" stroke="#ffce57" stroke-width="8"/>
    <text x="0" y="55" text-anchor="middle" fill="#ffce57" font-family="Arial, sans-serif" font-size="13" font-weight="800">SERVERS: please hydrate</text>
  </g>

  <!-- caption -->
  <rect x="65" y="525" width="670" height="48" rx="16" fill="#0c0c18" stroke="#ffce57" stroke-width="3"/>
  <text x="400" y="557" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="800">“Selected model is at capacity.” — The bouncer has one guest inside.</text>
</svg>