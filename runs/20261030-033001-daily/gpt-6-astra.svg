<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street map with shortest route from A1 to E5</title>
  <desc id="desc">A five-column, five-row intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, totaling eight street segments and avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- City blocks and streets -->
  <rect x="90" y="55" width="420" height="240" fill="#e2eadf"/>
  <g fill="none" stroke="#ffffff" stroke-width="16">
    <path d="M90 55H510 M90 115H510 M90 175H510 M90 235H510 M90 295H510"/>
    <path d="M90 55V295 M195 55V295 M300 55V295 M405 55V295 M510 55V295"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M90 55H510 M90 115H510 M90 175H510 M90 235H510 M90 295H510"/>
    <path d="M90 55V295 M195 55V295 M300 55V295 M405 55V295 M510 55V295"/>
  </g>

  <!-- Shortest route: four segments east, four segments south -->
  <path d="M90 55H510V295" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#ffffff" stroke="#64748b" stroke-width="2">
    <circle cx="195" cy="55" r="4"/>
    <circle cx="300" cy="55" r="4"/>
    <circle cx="405" cy="55" r="4"/>
    <circle cx="510" cy="55" r="4"/>
    <circle cx="90" cy="115" r="4"/>
    <circle cx="300" cy="115" r="4"/>
    <circle cx="405" cy="115" r="4"/>
    <circle cx="510" cy="115" r="4"/>
    <circle cx="90" cy="175" r="4"/>
    <circle cx="195" cy="175" r="4"/>
    <circle cx="405" cy="175" r="4"/>
    <circle cx="510" cy="175" r="4"/>
    <circle cx="90" cy="235" r="4"/>
    <circle cx="195" cy="235" r="4"/>
    <circle cx="300" cy="235" r="4"/>
    <circle cx="510" cy="235" r="4"/>
    <circle cx="90" cy="295" r="4"/>
    <circle cx="195" cy="295" r="4"/>
    <circle cx="300" cy="295" r="4"/>
    <circle cx="405" cy="295" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M188 108L202 122 M202 108L188 122"/>
    <path d="M293 168L307 182 M307 168L293 182"/>
    <path d="M398 228L412 242 M412 228L398 242"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1e293b">
    <text x="90" y="79">A1</text>
    <text x="195" y="79">B1</text>
    <text x="300" y="79">C1</text>
    <text x="405" y="79">D1</text>
    <text x="510" y="79">E1</text>
    <text x="90" y="139">A2</text>
    <text x="195" y="139">B2</text>
    <text x="300" y="139">C2</text>
    <text x="405" y="139">D2</text>
    <text x="510" y="139">E2</text>
    <text x="90" y="199">A3</text>
    <text x="195" y="199">B3</text>
    <text x="300" y="199">C3</text>
    <text x="405" y="199">D3</text>
    <text x="510" y="199">E3</text>
    <text x="90" y="259">A4</text>
    <text x="195" y="259">B4</text>
    <text x="300" y="259">C4</text>
    <text x="405" y="259">D4</text>
    <text x="510" y="259">E4</text>
    <text x="90" y="319">A5</text>
    <text x="195" y="319">B5</text>
    <text x="300" y="319">C5</text>
    <text x="405" y="319">D5</text>
    <text x="510" y="319">E5</text>
  </g>

  <!-- Start and end markers -->
  <circle cx="90" cy="55" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <rect x="502" y="287" width="16" height="16" rx="3" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="90" y="31" text-anchor="middle" fill="#15803d">START</text>
    <text x="531" y="300" fill="#6d28d9">END</text>
  </g>

  <!-- Footer -->
  <path d="M24 335H576" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="357" font-size="16" font-weight="700" fill="#1d4ed8">Shortest route: 8 street segments</text>
    <text x="300" y="383" font-size="15" fill="#334155">2026-10-30 03:33:08 SGT (UTC+08:00)</text>
  </g>
</svg>