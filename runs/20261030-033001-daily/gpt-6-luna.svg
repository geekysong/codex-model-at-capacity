<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City block map with shortest route</title>
  <desc id="desc">A 5 by 5 grid of intersections. The blue shortest route from A1 to E5 avoids blocked intersections B2, C3, and D4 and has 8 street segments.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#222">City block route</text>

  <!-- Streets -->
  <g stroke="#aab4bf" stroke-width="3">
    <path d="M90 70H510 M90 130H510 M90 190H510 M90 250H510 M90 310H510"/>
    <path d="M90 70V310 M195 70V310 M300 70V310 M405 70V310 M510 70V310"/>
  </g>

  <!-- Shortest path: A1 → B1 → C1 → D1 → E1 → E2 → E3 → E4 → E5 -->
  <path d="M90 70H510V310" fill="none" stroke="#1674d1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blocked intersections -->
  <g stroke="#d52b35" stroke-width="5" stroke-linecap="round">
    <path d="M187 122l16 16m0-16l-16 16"/>
    <path d="M292 182l16 16m0-16l-16 16"/>
    <path d="M397 242l16 16m0-16l-16 16"/>
  </g>

  <!-- Intersections -->
  <g fill="#fff" stroke="#344256" stroke-width="2">
    <circle cx="90" cy="70" r="7"/><circle cx="195" cy="70" r="7"/><circle cx="300" cy="70" r="7"/><circle cx="405" cy="70" r="7"/><circle cx="510" cy="70" r="7"/>
    <circle cx="90" cy="130" r="7"/><circle cx="195" cy="130" r="7"/><circle cx="300" cy="130" r="7"/><circle cx="405" cy="130" r="7"/><circle cx="510" cy="130" r="7"/>
    <circle cx="90" cy="190" r="7"/><circle cx="195" cy="190" r="7"/><circle cx="300" cy="190" r="7"/><circle cx="405" cy="190" r="7"/><circle cx="510" cy="190" r="7"/>
    <circle cx="90" cy="250" r="7"/><circle cx="195" cy="250" r="7"/><circle cx="300" cy="250" r="7"/><circle cx="405" cy="250" r="7"/><circle cx="510" cy="250" r="7"/>
    <circle cx="90" cy="310" r="7"/><circle cx="195" cy="310" r="7"/><circle cx="300" cy="310" r="7"/><circle cx="405" cy="310" r="7"/><circle cx="510" cy="310" r="7"/>
  </g>

  <!-- Grid labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#303846" text-anchor="middle">
    <text x="90" y="52">A1</text><text x="195" y="52">B1</text><text x="300" y="52">C1</text><text x="405" y="52">D1</text><text x="510" y="52">E1</text>
    <text x="90" y="151">A2</text><text x="195" y="151">B2</text><text x="300" y="151">C2</text><text x="405" y="151">D2</text><text x="510" y="151">E2</text>
    <text x="90" y="211">A3</text><text x="195" y="211">B3</text><text x="300" y="211">C3</text><text x="405" y="211">D3</text><text x="510" y="211">E3</text>
    <text x="90" y="271">A4</text><text x="195" y="271">B4</text><text x="300" y="271">C4</text><text x="405" y="271">D4</text><text x="510" y="271">E4</text>
    <text x="90" y="333">A5</text><text x="195" y="333">B5</text><text x="300" y="333">C5</text><text x="405" y="333">D5</text><text x="510" y="333">E5</text>
  </g>

  <!-- Start and end markers -->
  <circle cx="90" cy="70" r="12" fill="#168447" stroke="#fff" stroke-width="3"/>
  <text x="90" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">S</text>
  <circle cx="510" cy="310" r="12" fill="#a3399a" stroke="#fff" stroke-width="3"/>
  <text x="510" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#fff">E</text>

  <text x="300" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#174f8d">Route length: 8 street segments</text>
  <text x="300" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#444">2026-10-30 03:34:07 SGT (UTC+08:00)</text>
</svg>