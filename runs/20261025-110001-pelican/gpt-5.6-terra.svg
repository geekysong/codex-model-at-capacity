  <g transform="translate(583 194)" stroke="#253342" stroke-width="5" stroke-linejoin="round">
    <path d="M7 94V16h114v78" fill="#f9f3d4"/>
    <path d="M0 94h128" fill="none"/>
    <text x="64" y="47" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#253342" stroke="none">BIKE LANE</text>
    <text x="64" y="73" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e95b4d" stroke="none">FOR BIRDS?</text>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#253342">PELICAN PEDALS PAST REASON</text>
  <text x="400" y="96" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#344b58">“If I can carry fish, I can carry the commute.”</text>

  <rect x="0" y="510" width="800" height="90" fill="#253342"/>
  <text x="400" y="545" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#f9f3d4">A pelican on a bicycle: urban mobility has reached its logical beak.</text>
  <text x="400" y="578" text-anchor="middle" font-family="monospace" font-size="16" fill="#ccefff">2026-10-25 11:02:34 SGT (UTC+08:00)</text>
</svg>