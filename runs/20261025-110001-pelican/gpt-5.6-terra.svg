<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past Reason</title>
  <desc id="desc">A satirical cartoon of an oversized pelican riding a tiny bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite; }
    .rider { animation: bob .55s ease-in-out infinite alternate; }
    .leg-a { transform-box: fill-box; transform-origin: 425px 385px; animation: pedalA 1.15s linear infinite; }
    .leg-b { transform-box: fill-box; transform-origin: 425px 385px; animation: pedalB 1.15s linear infinite; }
    .puff { animation: puff 1.15s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(28deg); } }
    @keyframes pedalB { 50% { transform: rotate(-28deg); } }
    @keyframes puff { 0% { opacity: .8; transform: translate(0,0) scale(.6); } 100% { opacity: 0; transform: translate(-35px,-18px) scale(1.4); } }
  </style>

  <rect width="800" height="600" fill="#ccefff"/>
  <path d="M0 352 Q100 326 200 354 T400 350 T600 348 T800 356 V490 H0Z" fill="#91d36d"/>
  <path d="M0 427 Q150 407 285 429 T530 422 T800 432 V505 H0Z" fill="#5da84f"/>
  <path d="M0 475 H800" stroke="#424242" stroke-width="13"/>
  <path d="M0 475 H800" stroke="#f7d84c" stroke-width="4" stroke-dasharray="34 24"/>

  <g fill="#fff" opacity=".9">
    <path d="M80 93c20-27 55-15 56 7 27-13 53 10 37 31H75c-17-14-10-29 5-38z"/>
    <path d="M610 110c16-23 47-13 48 6 23-11 45 9 31 27h-83c-13-12-8-24 4-33z"/>
  </g>

  <g class="puff" fill="#eef1ec">
    <ellipse cx="129" cy="438" rx="16" ry="10"/>
    <ellipse cx="112" cy="429" rx="10" ry="8"/>
  </g>

  <g stroke="#253342" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="8">
