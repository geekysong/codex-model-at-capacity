<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly carrying an absurdly oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e8f7d2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 420 Q120 360 240 420 T480 420 T800 420 V520 H0Z" fill="#8acb70"/>
  <path d="M0 500 Q180 470 360 500 T800 500 V560 H0Z" fill="#5da85e"/>
  <path d="M0 535 Q200 510 400 535 T800 535" fill="none" stroke="#3d7e4c" stroke-width="8" opacity=".6"/>

  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="900" fill="#17324d" stroke="#fff" stroke-width="3" paint-order="stroke">
    PELICAN PEDAL PANIC
  </text>
  <text x="400" y="96" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#17324d">
    “Why fly when you can wobble dramatically?”
  </text>

  <g filter="url(#shadow)">
    <ellipse cx="400" cy="530" rx="260" ry="20" fill="#244c3c" opacity=".25"/>

    <g id="bike">
      <g stroke="#273746" stroke-width="8" fill="none">
        <circle cx="230" cy="440" r="78"/>
        <circle cx="580" cy="440" r="78"/>
        <path d="M230 440 L350 440 L430 330 L580 440 L350 440 L300 350 L430 330"/>
        <path d="M430 330 L455 285"/>
        <path d="M440 285 L490 285"/>
      </g>
      <g stroke="#f3c542" stroke-width="5" fill="none" opacity=".9">
        <circle cx="230" cy="440" r="60"/>
        <circle cx="580" cy="440" r="60"/>
      </g>
      <g fill="#273746">
        <circle cx="350" cy="440" r="14"/>
        <path d="M350 440 l-35 -28 M350 440 l35 28" stroke="#273746" stroke-width="8"/>
        <ellipse cx="315" cy="410" rx="25" ry="7"/>
      </g>
      <rect x="430" y="270" width="12" height="48" rx="6" fill="#273746"/>
      <path d="M430 270 Q450 255 475 270" fill="none" stroke="#273746" stroke-width="8"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="395" cy="280" rx="72" ry="92" fill="#f8f4e8" stroke="#273746" stroke-width="7"/>
      <path d="M350 310 Q395 340 445 310 L455 385 Q395 420 335 385Z" fill="#e7a83d" stroke="#273746" stroke-width="7"/>
      <path d="M362 190 Q400 155 438 190 L445 260 Q400 290 355 260Z" fill="#fffdf5" stroke="#273746" stroke-width="7"/>
      <circle cx="385" cy="215" r="9" fill="#273746"/>
      <circle cx="420" cy="215" r="9" fill="#273746"/>
      <circle cx="388" cy="212" r="3" fill="#fff"/>
      <circle cx="423" cy="212" r="3" fill="#fff"/>
      <path d="M355 245 Q400 260 445 245 L510 275 Q525 285 510 300 L445 285 Q400 275 355 265Z" fill="#f0b443" stroke="#273746" stroke-width="7"/>
      <path d="M375 315 Q400 300 425 315" fill="none" stroke="#273746" stroke-width="6"/>
      <path d="M355 300 Q320 335 335 365" fill="none" stroke="#273746" stroke-width="18" stroke-linecap="round"/>
      <path d="M435 300 Q470 335 455 365" fill="none" stroke="#273746" stroke-width="18" stroke-linecap="round"/>
      <path d="M370 375 L350 420 M425 375 L450 420" stroke="#e7a83d" stroke-width="9" stroke-linecap="round"/>
      <path d="M350 420 l-24 8 M450 420 l24 8" stroke="#273746" stroke-width="7" stroke-linecap="round"/>
      <path d="M480 275 Q545 235 600 275 Q545 315 480 290Z" fill="#6db6d8" stroke="#273746" stroke-width="6"/>
      <path d="M590 275 l22 -12 l-8 18 l18 10 l-24 2" fill="#f08d4f" stroke="#273746" stroke-width="5"/>
      <text x="520" y="255" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17324d">TAXI?</text>
    </g>
  </g>

  <g font-family="sans-serif" font-weight="700" fill="#17324d">
    <text x="400" y="570" text-anchor="middle" font-size="16">A beak, two wheels, and absolutely no sense of traffic law.</text>
    <text x="400" y="592" text-anchor="middle" font-size="14">2026-10-28 14:31:00 SGT (UTC+08:00)</text>
  </g>

  <style>
    #bike { transform-origin: 400px 440px; }
    #bike circle { transform-box: fill-box; transform-origin: center; animation: spin 1.3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</svg>