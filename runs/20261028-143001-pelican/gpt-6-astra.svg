<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe8ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#536273"/>
      <stop offset="1" stop-color="#303a49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#173042" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#263746;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#263746}
      .wheel{transform-box:fill-box;transform-origin:center}
      .bob{transform-box:fill-box;transform-origin:center}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd76a" opacity=".95"/>
  <g fill="#fff" opacity=".78">
    <path d="M85 125c10-25 44-28 58-4 25-15 58 2 57 28H48c-1-17 15-29 37-24z"/>
    <path d="M535 82c8-19 33-22 45-3 19-12 45 1 44 21H505c-1-13 12-22 30-18z"/>
  </g>

  <text x="400" y="55" text-anchor="middle" class="label" font-size="36" font-weight="900" fill="#173042">
    THE PELICAN EXPRESS
  </text>
  <text x="400" y="87" text-anchor="middle" class="label" font-size="18" font-weight="700">
    “When the beak is full, just keep pedaling.”
  </text>

  <path d="M0 410 Q180 365 365 404 T800 390 V600 H0Z" fill="#a9d27b"/>
  <path d="M0 455 Q180 425 360 447 T800 435 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 Q180 475 360 497 T800 485" fill="none" stroke="#f8e7a2" stroke-width="8" stroke-dasharray="38 28"/>

  <g opacity=".65" fill="#6da05e">
    <path d="M70 425l15-55 15 55zm28 0l18-38 17 38zm585 5l17-58 17 58zm28-2l14-40 15 40z"/>
  </g>

  <g filter="url(#shadow)">
    <g id="bike">
      <g class="wheel" transform="translate(250 465)">
        <circle r="73" fill="#d9eef1" stroke="#263746" stroke-width="8"/>
        <circle r="9" fill="#263746"/>
        <g stroke="#607b89" stroke-width="3">
          <path d="M0-67V67M-67 0H67M-47-47L47 47M47-47L-47 47"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 250 465" to="360 250 465" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <g class="wheel" transform="translate(535 465)">
        <circle r="73" fill="#d9eef1" stroke="#263746" stroke-width="8"/>
        <circle r="9" fill="#263746"/>
        <g stroke="#607b89" stroke-width="3">
          <path d="M0-67V67M-67 0H67M-47-47L47 47M47-47L-47 47"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 535 465" to="360 535 465" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <path d="M250 465 L350 365 L455 465 L250 465 L405 465 L350 365 L535 465" fill="none" class="ink"/>
      <path d="M350 365 L330 325 M330 325 L365 325" fill="none" class="ink"/>
      <path d="M455 465 L480 390 L520 390" fill="none" class="ink"/>
      <circle cx="350" cy="365" r="12" fill="#ffcf4a" class="ink"/>
      <circle cx="405" cy="465" r="23" fill="none" class="ink"/>
      <path d="M405 465l-24-27M405 465l26 24" fill="none" stroke="#263746" stroke-width="7"/>
      <g class="bob">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 4;0 0" dur="1.2s" repeatCount="indefinite"/>
        <ellipse cx="387" cy="325" rx="93" ry="77" fill="#f7f2dc" class="ink"/>
        <path d="M325 300 Q350 225 415 250 Q460 267 460 330 Q450 365 414 370 Q357 365 325 300Z" fill="#f7f2dc" class="ink"/>
        <path d="M420 270 Q456 245 510 270 L548 295 Q558 304 545 313 L493 318 Q458 315 424 300Z" fill="#f4a642" class="ink"/>
        <path d="M494 318 Q520 328 543 314" fill="none" stroke="#bd6b2d" stroke-width="5"/>
        <circle cx="431" cy="257" r="10" fill="#fff" class="ink"/>
        <circle cx="434" cy="258" r="4" fill="#263746"/>
        <path d="M350 275 Q385 245 420 263" fill="none" stroke="#d6c994" stroke-width="15"/>
        <path d="M372 366 Q355 399 340 432 M424 366 Q444 398 460 432" fill="none" class="ink"/>
        <path d="M340 432l-23 12M460 432l23 12" fill="none" class="ink"/>
        <path d="M365 344 Q390 358 420 344" fill="none" stroke="#263746" stroke-width="5"/>
        <path d="M382 334 Q394 340 405 334" fill="none" stroke="#e68f7a" stroke-width="5"/>
        <g>
          <path d="M350 305 Q385 292 423 310 L443 345 Q400 367 360 345Z" fill="#79b6d3" class="ink"/>
          <path d="M374 305l-8 39M401 300l-2 52M425 307l8 33" fill="none" stroke="#4d839f" stroke-width="4"/>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(585 320)">
    <path d="M0 0q24-22 48 0" fill="none" stroke="#263746" stroke-width="5"/>
    <text x="25" y="-12" text-anchor="middle" class="label" font-size="17" font-weight="700">HONK!</text>
  </g>

  <rect x="24" y="545" width="752" height="38" rx="12" fill="#fff8df" stroke="#263746" stroke-width="3"/>
  <text x="400" y="570" text-anchor="middle" class="label" font-size="16" font-weight="700">
    2026-10-28 14:30:01 SGT (UTC+08:00)
  </text>
</svg>