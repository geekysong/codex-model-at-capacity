<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152e"/>
      <stop offset="1" stop-color="#32152c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#784bff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8e3ef"/>
      <stop offset="0.5" stop-color="#71849e"/>
      <stop offset="1" stop-color="#303c55"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 480 Q120 440 240 470 T480 460 T800 475 V600 H0Z" fill="#100f1c"/>
  <path d="M40 118 L760 118" stroke="#603d77" stroke-width="3"/>
  <circle cx="75" cy="88" r="7" fill="#ff4db8" filter="url(#smallGlow)"/>
  <circle cx="725" cy="88" r="7" fill="#45eaff" filter="url(#smallGlow)"/>

  <text x="400" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ff8bd7">THE HOTTEST MODEL IN TOWN*</text>
  <text x="400" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#cbb7d8">*Only one model actually got in.</text>

  <!-- Club facade -->
  <rect x="205" y="145" width="390" height="310" rx="20" fill="#211e3a" stroke="#9f55ff" stroke-width="5"/>
  <rect x="240" y="198" width="320" height="230" rx="12" fill="#0e1323" stroke="#593e81" stroke-width="3"/>
  <path d="M260 212 H540" stroke="#ff35c9" stroke-width="5" filter="url(#smallGlow)"/>
  <path d="M260 400 H540" stroke="#42e8ff" stroke-width="4" filter="url(#smallGlow)"/>
  <text x="400" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#ffdd75">MODEL VIP LOUNGE</text>
  <text x="400" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#9ffaff">Capacity: 1 (emotionally)</text>

  <!-- single model inside -->
  <g transform="translate(410 320)">
    <ellipse cx="0" cy="76" rx="62" ry="14" fill="#090b14"/>
    <rect x="-39" y="-20" width="78" height="95" rx="18" fill="#5674b8" stroke="#b6d2ff" stroke-width="3"/>
    <rect x="-30" y="-5" width="60" height="38" rx="8" fill="#111827"/>
    <circle cx="-14" cy="14" r="6" fill="#65f4ff" filter="url(#smallGlow)"/>
    <circle cx="14" cy="14" r="6" fill="#65f4ff" filter="url(#smallGlow)"/>
    <path d="M-17 52 Q0 64 17 52" fill="none" stroke="#b9f5ff" stroke-width="4"/>
    <circle cx="0" cy="-43" r="27" fill="#7891cc" stroke="#b6d2ff" stroke-width="3"/>
    <path d="M-13 -46 Q0 -58 13 -46" fill="none" stroke="#151d36" stroke-width="5"/>
    <text x="0" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ffd76a">“I’m fine.”</text>
  </g>

  <!-- glowing FULL sign -->
  <g filter="url(#glow)">
    <rect x="300" y="132" width="200" height="56" rx="12" fill="#e51b63" stroke="#ffacd9" stroke-width="4"/>
    <text x="400" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#fff">FULL</text>
  </g>

  <!-- bouncer -->
  <g transform="translate(595 250)">
    <ellipse cx="0" cy="200" rx="77" ry="17" fill="#090a12"/>
    <path d="M-58 78 L-70 196 Q0 224 70 196 L58 78Z" fill="#161b2a" stroke="#7588a8" stroke-width="4"/>
    <rect x="-58" y="15" width="116" height="85" rx="23" fill="url(#metal)" stroke="#d9e9ff" stroke-width="4"/>
    <rect x="-44" y="31" width="88" height="49" rx="10" fill="#101726"/>
    <circle cx="-20" cy="54" r="8" fill="#ff3f71" filter="url(#smallGlow)"/>
    <circle cx="20" cy="54" r="8" fill="#ff3f71" filter="url(#smallGlow)"/>
    <path d="M-26 72 H26" stroke="#ffb3c8" stroke-width="4"/>
    <path d="M-45 106 L-82 154" stroke="#7c91b3" stroke-width="18" stroke-linecap="round"/>
    <path d="M45 106 L82 154" stroke="#7c91b3" stroke-width="18" stroke-linecap="round"/>
    <path d="M-70 160 L-112 136" stroke="#d8e3ef" stroke-width="7" stroke-linecap="round"/>
    <path d="M68 160 L109 136" stroke="#d8e3ef" stroke-width="7" stroke-linecap="round"/>
    <path d="M-28 0 V-24 M28 0 V-24" stroke="#9fb5d7" stroke-width="6"/>
    <circle cx="-28" cy="-29" r="7" fill="#ff4db8"/>
    <circle cx="28" cy="-29" r="7" fill="#45eaff"/>
    <text x="0" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffbedf">BOUNCER v2.0</text>
  </g>

  <!-- velvet rope -->
  <path d="M154 427 Q315 498 560 430" fill="none" stroke="#d93677" stroke-width="12"/>
  <path d="M154 427 Q315 498 560 430" fill="none" stroke="#ff78ad" stroke-width="3"/>
  <circle cx="154" cy="427" r="13" fill="#f4c65d" stroke="#fff0aa" stroke-width="3"/>
  <circle cx="560" cy="430" r="13" fill="#f4c65d" stroke="#fff0aa" stroke-width="3"/>

  <!-- queue developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(92 355)">
      <circle cx="0" cy="0" r="25" fill="#c98d72"/>
      <path d="M-25 -5 Q0 -38 25 -5" fill="#3b2430"/>
      <rect x="-29" y="28" width="58" height="82" rx="15" fill="#3a82b8"/>
      <rect x="-15" y="51" width="30" height="18" rx="4" fill="#c9f1ff"/>
      <text x="0" y="134" text-anchor="middle" font-size="13" fill="#fff">dev_001</text>
    </g>
    <g transform="translate(172 410)">
      <circle cx="0" cy="0" r="24" fill="#e1ad8a"/>
      <path d="M-24 -4 Q0 -35 24 -4" fill="#edcc63"/>
      <rect x="-30" y="27" width="60" height="88" rx="15" fill="#b34b72"/>
      <rect x="-17" y="51" width="34" height="18" rx="4" fill="#d9f5ff"/>
      <text x="0" y="139" text-anchor="middle" font-size="13" fill="#fff">dev_002</text>
    </g>
    <g transform="translate(48 465)">
      <circle cx="0" cy="0" r="23" fill="#8f604f"/>
      <path d="M-23 -4 Q0 -34 23 -4" fill="#202333"/>
      <rect x="-29" y="27" width="58" height="84" rx="15" fill="#4d9a68"/>
      <text x="0" y="135" text-anchor="middle" font-size="13" fill="#fff">dev_003</text>
    </g>
    <g transform="translate(145 525)">
      <circle cx="0" cy="0" r="22" fill="#f0bd98"/>
      <path d="M-22 -5 Q0 -34 22 -5" fill="#823f63"/>
      <rect x="-28" y="26" width="56" height="78" rx="15" fill="#936ac4"/>
      <text x="0" y="129" text-anchor="middle" font-size="13" fill="#fff">dev_004</text>
    </g>
    <path d="M240 475 q18 -28 36 0" stroke="#a9b5c9" stroke-width="3" fill="none"/>
    <text x="278" y="478" font-size="19" fill="#a9b5c9">...</text>
    <text x="245" y="505" font-size="14" fill="#ffbdcf">queue time: 3 hours</text>
  </g>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(680 475)">
    <circle cx="0" cy="0" r="56" fill="none" stroke="#7b8ca8" stroke-width="9"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#34445d" stroke-width="4"/>
    <path d="M-39 -40 L39 40 M39 -40 L-39 40" stroke="#34445d" stroke-width="4"/>
    <ellipse cx="0" cy="10" rx="15" ry="11" fill="#e6a16e"/>
    <circle cx="-7" cy="8" r="2.5" fill="#2e1b27"/>
    <circle cx="7" cy="8" r="2.5" fill="#2e1b27"/>
    <path d="M-15 20 Q0 30 15 20" fill="none" stroke="#2e1b27" stroke-width="3"/>
    <path d="M-43 52 Q-32 65 -19 52 Q-6 40 7 54 Q20 68 33 52 Q45 40 57 51" fill="none" stroke="#ff704d" stroke-width="8" stroke-linecap="round"/>
    <path d="M-21 72 C-13 88 -3 76 5 86 C15 96 23 81 34 87" fill="none" stroke="#ffb347" stroke-width="5"/>
    <text x="0" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffbd7a">SERVER FARM</text>
  </g>

  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="900" fill="#fff">“Selected model is at capacity. Please try a different model.”</text>
</svg>