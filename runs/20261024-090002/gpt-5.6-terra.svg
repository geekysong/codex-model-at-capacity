<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#080914"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#784ba0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce6f2"/>
      <stop offset="1" stop-color="#66758a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="110" cy="90" r="3" fill="#fff" opacity=".7"/>
  <circle cx="690" cy="120" r="2" fill="#fff" opacity=".6"/>
  <circle cx="610" cy="65" r="3" fill="#fff" opacity=".5"/>

  <!-- club facade -->
  <rect x="430" y="112" width="330" height="390" rx="18" fill="#20243a" stroke="#8e5cff" stroke-width="4"/>
  <rect x="450" y="205" width="290" height="260" rx="10" fill="#0d1020" stroke="#343958" stroke-width="3"/>
  <path d="M455 208 Q595 150 735 208" fill="none" stroke="#ff3cac" stroke-width="5" filter="url(#glow)"/>
  <text x="595" y="173" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34" fill="#ff66c4" letter-spacing="3">MODEL CLUB</text>
  <text x="595" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#d8c9ff">EXCLUSIVE INFERENCE LOUNGE</text>

  <!-- glowing FULL sign -->
  <rect x="510" y="230" width="170" height="70" rx="12" fill="#35102d" stroke="#ff3cac" stroke-width="4" filter="url(#glow)"/>
  <text x="595" y="280" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="43" fill="#ff7ccf">FULL</text>
  <path d="M530 320 H660" stroke="#535878" stroke-width="2"/>
  <text x="595" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#aeb5d4">One model inside.</text>
  <text x="595" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#aeb5d4">It is apparently doing</text>
  <text x="595" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#aeb5d4">“important work.”</text>

  <!-- bouncer -->
  <ellipse cx="470" cy="500" rx="64" ry="13" fill="#05060c" opacity=".7"/>
  <rect x="440" y="348" width="62" height="118" rx="20" fill="url(#metal)" stroke="#242a3c" stroke-width="4"/>
  <rect x="428" y="337" width="86" height="66" rx="22" fill="#9eafc1" stroke="#242a3c" stroke-width="4"/>
  <rect x="442" y="351" width="58" height="34" rx="12" fill="#14182a"/>
  <circle cx="458" cy="368" r="6" fill="#ff3cac" filter="url(#glow)"/>
  <circle cx="484" cy="368" r="6" fill="#5cf2ff" filter="url(#glow)"/>
  <path d="M450 420 Q470 438 492 420" fill="none" stroke="#242a3c" stroke-width="5"/>
  <path d="M438 376 L407 357" stroke="#9eafc1" stroke-width="16" stroke-linecap="round"/>
  <path d="M500 376 L531 350" stroke="#9eafc1" stroke-width="16" stroke-linecap="round"/>
  <rect x="399" y="343" width="55" height="27" rx="7" fill="#ffef75" stroke="#9b7d23" stroke-width="3"/>
  <text x="426" y="362" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="12" fill="#4e3b00">NOPE</text>
  <path d="M451 470 L435 520 M492 470 L510 520" stroke="#66758a" stroke-width="15" stroke-linecap="round"/>
  <text x="470" y="548" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="12" fill="#c8d2e4">CAPACITY BOT</text>

  <!-- velvet rope -->
  <path d="M400 440 Q350 480 300 440 Q250 400 190 440" fill="none" stroke="#d51e6f" stroke-width="8"/>
  <circle cx="400" cy="440" r="11" fill="#ffd66e" stroke="#8b5d17" stroke-width="3"/>
  <circle cx="190" cy="440" r="11" fill="#ffd66e" stroke="#8b5d17" stroke-width="3"/>
  <rect x="181" y="440" width="18" height="72" fill="#ffd66e" stroke="#8b5d17" stroke-width="3"/>
  <rect x="391" y="440" width="18" height="72" fill="#ffd66e" stroke="#8b5d17" stroke-width="3"/>

  <!-- queue of tired developers -->
  <g stroke="#20263a" stroke-width="4">
    <circle cx="82" cy="380" r="23" fill="#d69b78"/>
    <path d="M56 377 Q82 345 108 377" fill="#2f3147"/>
    <rect x="58" y="404" width="48" height="72" rx="13" fill="#63c6d9"/>
    <path d="M63 424 L44 458 M101 424 L122 454" stroke="#63c6d9" stroke-width="13" stroke-linecap="round"/>
    <path d="M70 492 L62 532 M94 492 L105 532" stroke="#25334d" stroke-width="14" stroke-linecap="round"/>
    <path d="M72 388 Q82 397 94 388" fill="none" stroke="#5b2431"/>
    <path d="M68 372 L76 374 M90 374 L98 372" stroke="#232236" stroke-width="4"/>

    <circle cx="170" cy="333" r="22" fill="#9b684f"/>
    <path d="M146 330 Q171 294 196 330" fill="#e0b542"/>
    <rect x="145" y="357" width="50" height="82" rx="13" fill="#a16dd1"/>
    <path d="M150 380 L128 414 M190 380 L216 410" stroke="#a16dd1" stroke-width="13" stroke-linecap="round"/>
    <path d="M158 452 L150 490 M183 452 L194 490" stroke="#26334d" stroke-width="14" stroke-linecap="round"/>
    <path d="M158 340 Q170 347 184 340" fill="none" stroke="#542c37"/>
    <path d="M157 322 L164 320 M179 320 L187 322" stroke="#282033" stroke-width="4"/>

    <circle cx="270" cy="390" r="24" fill="#e1b28e"/>
    <path d="M243 388 Q270 350 297 388" fill="#4b3942"/>
    <rect x="242" y="414" width="56" height="82" rx="13" fill="#ef765e"/>
    <path d="M247 435 L222 466 M293 435 L319 466" stroke="#ef765e" stroke-width="13" stroke-linecap="round"/>
    <path d="M255 508 L248 545 M285 508 L296 545" stroke="#26334d" stroke-width="14" stroke-linecap="round"/>
    <path d="M253 397 Q270 405 288 397" fill="none" stroke="#642b38"/>
    <path d="M252 378 L260 380 M280 380 L288 378" stroke="#30233b" stroke-width="4"/>
  </g>

  <!-- rejected tickets -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#ffe28a">
    <rect x="42" y="287" width="94" height="26" rx="5" fill="#392947" stroke="#ffcf65"/>
    <text x="89" y="305" text-anchor="middle">RETRY LATER</text>
    <rect x="126" y="244" width="106" height="26" rx="5" fill="#392947" stroke="#ffcf65"/>
    <text x="179" y="262" text-anchor="middle">DIFFERENT MODEL?</text>
    <rect x="242" y="286" width="96" height="26" rx="5" fill="#392947" stroke="#ffcf65"/>
    <text x="290" y="304" text-anchor="middle">QUEUE: ∞</text>
  </g>

  <!-- melting server hamster wheel -->
  <g transform="translate(92 92)">
    <circle cx="0" cy="0" r="57" fill="#30374b" stroke="#7d89a6" stroke-width="7"/>
    <circle cx="0" cy="0" r="39" fill="none" stroke="#d6e0ef" stroke-width="5"/>
    <path d="M-30 -25 Q0 -50 30 -25 M-38 2 Q0 25 38 2 M-18 35 Q0 5 18 35" fill="none" stroke="#d6e0ef" stroke-width="5"/>
    <ellipse cx="3" cy="-3" rx="17" ry="12" fill="#cc7d56"/>
    <circle cx="-5" cy="-7" r="3" fill="#222"/>
    <path d="M17 0 Q28 8 18 15" fill="none" stroke="#cc7d56" stroke-width="6"/>
    <path d="M-45 55 Q-25 69 -8 59 Q10 49 26 62 Q42 74 58 56" fill="none" stroke="#ff7b45" stroke-width="8" filter="url(#glow)"/>
    <text x="0" y="90" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="12" fill="#ff9a62">SERVER FARM</text>
  </g>

  <!-- title and caption -->
  <text x="400" y=" fifty" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" fill="#ffffff">CODEX NIGHT OUT</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ff9ed7">“Selected model is at capacity. Please try a different model.”</text>

  <rect x="22" y="558" width="756" height="28" rx="10" fill="#251c38" stroke="#ff3cac" stroke-width="2"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" fill="#ffe47a">THE ONLY THING GETTING IN TONIGHT: THE ERROR MESSAGE.</text>
</svg>