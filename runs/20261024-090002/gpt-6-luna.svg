<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17122d"/>
      <stop offset="1" stop-color="#090914"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#242044"/>
      <stop offset="1" stop-color="#111126"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="110" cy="150" r="90" fill="#432d72" opacity=".25" filter="url(#soft)"/>
  <circle cx="700" cy="180" r="120" fill="#193c67" opacity=".22" filter="url(#soft)"/>

  <!-- Title -->
  <text x="400" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ff6bcb" letter-spacing="3">THE EXCLUSIVE MODEL LOUNGE</text>

  <!-- Club facade -->
  <rect x="205" y="120" width="500" height="350" rx="20" fill="#11101e" stroke="#6753a8" stroke-width="4"/>
  <rect x="230" y="148" width="450" height="250" rx="14" fill="#19152b" stroke="#302650" stroke-width="3"/>
  <path d="M250 360 Q455 190 660 360" fill="none" stroke="#553d87" stroke-width="3" opacity=".55"/>
  <circle cx="300" cy="220" r="4" fill="#ff5dc8"/>
  <circle cx="590" cy="210" r="4" fill="#63e7ff"/>
  <circle cx="390" cy="275" r="4" fill="#ffd45c"/>

  <!-- FULL sign -->
  <rect x="350" y="137" width="240" height="84" rx="12" fill="#270f22" stroke="#ff3e8d" stroke-width="5" filter="url(#glow)"/>
  <text x="470" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="55" font-weight="900" fill="#ff477f">FULL</text>
  <text x="470" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffd5ea">ONE MODEL INSIDE</text>

  <!-- Melting servers -->
  <g transform="translate(525 300)">
    <rect x="0" y="0" width="105" height="55" rx="8" fill="#49445e" stroke="#b7a8dc" stroke-width="3"/>
    <rect x="10" y="10" width="85" height="10" rx="4" fill="#1c1931"/>
    <circle cx="20" cy="15" r="3" fill="#61f5ba"/>
    <circle cx="31" cy="15" r="3" fill="#ffdc5a"/>
    <path d="M18 55 q-7 22 8 30 q12 6 18 0 q8 14 20 3 q10 11 22 0 q11 8 20-1 q15 9 18-6 q9-15-3-26" fill="#706681" stroke="#b7a8dc" stroke-width="3"/>
    <path d="M30 48 q5 20 15 20 M62 48 q-2 21 8 28 M87 48 q-1 16 8 22" stroke="#ff697c" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="53" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ff9b9b">SERVER ROOM</text>
    <text x="53" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffcdcd">please stop adding prompts</text>
  </g>

  <!-- Robot bouncer -->
  <g transform="translate(260 245)">
    <ellipse cx="78" cy="190" rx="72" ry="15" fill="#05050d" opacity=".6"/>
    <rect x="22" y="82" width="112" height="108" rx="28" fill="#798298" stroke="#d9e3ef" stroke-width="4"/>
    <rect x="31" y="6" width="94" height="90" rx="22" fill="#8f9aae" stroke="#e8f1ff" stroke-width="4"/>
    <rect x="45" y="28" width="66" height="38" rx="11" fill="#151426"/>
    <circle cx="63" cy="47" r="8" fill="#ff426f" filter="url(#glow)"/>
    <circle cx="93" cy="47" r="8" fill="#ff426f" filter="url(#glow)"/>
    <path d="M58 76 Q78 87 99 76" fill="none" stroke="#202034" stroke-width="5" stroke-linecap="round"/>
    <path d="M77 6 V-14" stroke="#dbe8f5" stroke-width="5"/>
    <circle cx="77" cy="-19" r="8" fill="#ff4f9a" filter="url(#glow)"/>
    <rect x="47" y="111" width="62" height="42" rx="8" fill="#25263d" stroke="#aab7cc" stroke-width="3"/>
    <text x="78" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ff668f">NOPE</text>
    <path d="M27 104 L-20 76" stroke="#8794a7" stroke-width="17" stroke-linecap="round"/>
    <path d="M130 104 L170 74" stroke="#8794a7" stroke-width="17" stroke-linecap="round"/>
    <path d="M42 184 L28 224 M113 184 L128 224" stroke="#8794a7" stroke-width="18" stroke-linecap="round"/>
    <path d="M-20 76 L-42 61" stroke="#8794a7" stroke-width="12" stroke-linecap="round"/>
    <path d="M170 74 L193 57" stroke="#8794a7" stroke-width="12" stroke-linecap="round"/>
    <text x="78" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd4e3">BOUNCER v.∞</text>
  </g>

  <!-- Velvet rope -->
  <path d="M185 442 Q330 500 470 442 Q560 405 690 447" fill="none" stroke="#d51d64" stroke-width="10"/>
  <path d="M185 442 V505 M470 442 V505 M690 447 V505" stroke="#d6b3c4" stroke-width="8"/>
  <circle cx="185" cy="442" r="12" fill="#f4d7e2"/>
  <circle cx="470" cy="442" r="12" fill="#f4d7e2"/>
  <circle cx="690" cy="447" r="12" fill="#f4d7e2"/>

  <!-- Queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(35 435)">
      <circle cx="30" cy="20" r="18" fill="#c58d6c"/><path d="M12 17 Q30-8 49 15" fill="#342634"/>
      <rect x="12" y="40" width="38" height="52" rx="9" fill="#4e8ac4"/><path d="M12 55 L-8 70 M50 55 L70 70" stroke="#c58d6c" stroke-width="9"/>
      <path d="M20 93 L12 125 M42 93 L52 125" stroke="#30334b" stroke-width="10"/>
      <text x="30" y="151" text-anchor="middle" font-size="12" fill="#d8d2e8">dev #1</text>
    </g>
    <g transform="translate(115 425)">
      <circle cx="30" cy="20" r="18" fill="#8f5c42"/><path d="M12 17 Q30-9 49 15" fill="#16182a"/>
      <rect x="12" y="40" width="38" height="52" rx="9" fill="#db665e"/><path d="M12 55 L-7 72 M50 55 L70 69" stroke="#8f5c42" stroke-width="9"/>
      <path d="M20 93 L12 125 M42 93 L53 125" stroke="#30334b" stroke-width="10"/>
      <text x="30" y="151" text-anchor="middle" font-size="12" fill="#d8d2e8">dev #2</text>
    </g>
    <g transform="translate(705 425)">
      <circle cx="30" cy="20" r="18" fill="#d4a17b"/><path d="M12 17 Q30-10 49 15" fill="#e3d8c8"/>
      <rect x="12" y="40" width="38" height="52" rx="9" fill="#57aa83"/><path d="M12 55 L-8 71 M50 55 L70 70" stroke="#d4a17b" stroke-width="9"/>
      <path d="M20 93 L12 125 M42 93 L53 125" stroke="#30334b" stroke-width="10"/>
      <text x="30" y="151" text-anchor="middle" font-size="12" fill="#d8d2e8">dev #99</text>
    </g>
  </g>

  <!-- Speech bubble -->
  <path d="M65 310 Q80 270 160 278 L220 278 Q250 280 245 313 L240 350 Q235 370 205 368 L150 368 L125 391 L127 367 L90 367 Q60 360 65 310Z" fill="#fff8f0" stroke="#342448" stroke-width="4"/>
  <text x="155" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#27203b">I have a ticket!</text>
  <text x="155" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#27203b">It says “urgent bug”!</text>
  <text x="155" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#9a315e">*sighs in developer*</text>

  <!-- Caption -->
  <rect x="70" y="535" width="660" height="43" rx="20" fill="#251c3d" stroke="#ff5eaa" stroke-width="2"/>
  <text x="400" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#fff">“Selected model is at capacity. Please try a different model.”</text>
</svg>