<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17142b"/>
      <stop offset="1" stop-color="#090914"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="90" r="90" fill="#30265a" opacity=".35"/>
  <circle cx="120" cy="110" r="120" fill="#35214e" opacity=".28"/>

  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff75df">THE FUTURE OF SHIPPING, OPEN NEVER</text>

  <!-- club facade -->
  <rect x="475" y="105" width="285" height="350" rx="18" fill="#211d3d" stroke="#765cff" stroke-width="5"/>
  <rect x="505" y="135" width="225" height="90" rx="12" fill="#0d0c19" stroke="#ff4fd8" stroke-width="4" filter="url(#smallGlow)"/>
  <text x="617" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="900" fill="#ff557d" filter="url(#glow)">FULL</text>
  <text x="617" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffd1ef">TRY AGAIN LATER</text>

  <path d="M520 265 Q617 240 715 265" fill="none" stroke="#442d75" stroke-width="15"/>
  <path d="M520 265 Q617 240 715 265" fill="none" stroke="#ff4fd8" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="545" y="284" width="165" height="145" rx="10" fill="#111023" stroke="#5948b5" stroke-width="3"/>
  <text x="627" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#b7a8ff">EXCLUSIVE LOUNGE</text>

  <!-- only model inside -->
  <g transform="translate(625 365)">
    <rect x="-42" y="-32" width="84" height="68" rx="17" fill="#62e6c4" stroke="#d7fff7" stroke-width="4"/>
    <rect x="-27" y="-18" width="54" height="34" rx="8" fill="#152c3b"/>
    <circle cx="-13" cy="-1" r="5" fill="#ffef70"/>
    <circle cx="13" cy="-1" r="5" fill="#ffef70"/>
    <path d="M-15 12 Q0 23 15 12" fill="none" stroke="#ffef70" stroke-width="3"/>
    <text x="0" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#72f7d8">MODEL 1.0</text>
  </g>

  <!-- melting servers -->
  <g transform="translate(665 485)">
    <rect x="-90" y="-32" width="55" height="42" rx="5" fill="#62657c"/>
    <rect x="-22" y="-42" width="55" height="52" rx="5" fill="#676b80"/>
    <rect x="45" y="-28" width="55" height="38" rx="5" fill="#62657c"/>
    <path d="M-80 10 Q-73 35 -61 18 Q-51 8 -43 31" fill="none" stroke="#ff8b39" stroke-width="9"/>
    <path d="M-11 10 Q-3 42 9 18 Q18 4 27 34" fill="none" stroke="#ff5b47" stroke-width="10"/>
    <path d="M55 10 Q64 33 75 17 Q84 5 95 28" fill="none" stroke="#ff8b39" stroke-width="9"/>
    <circle cx="-70" cy="-12" r="4" fill="#ffec73"/><circle cx="-52" cy="-12" r="4" fill="#ffec73"/>
    <circle cx="-3" cy="-20" r="4" fill="#ffec73"/><circle cx="15" cy="-20" r="4" fill="#ffec73"/>
    <circle cx="62" cy="-10" r="4" fill="#ffec73"/><circle cx="80" cy="-10" r="4" fill="#ffec73"/>
  </g>

  <!-- bouncer -->
  <g transform="translate(430 255)">
    <ellipse cx="0" cy="193" rx="62" ry="15" fill="#05050c" opacity=".7"/>
    <rect x="-42" y="100" width="84" height="95" rx="25" fill="#30354d" stroke="#11131e" stroke-width="5"/>
    <rect x="-28" y="115" width="56" height="52" rx="8" fill="#151928"/>
    <path d="M-22 130 L22 130 M-22 144 L22 144 M-22 158 L22 158" stroke="#70d8ff" stroke-width="4"/>
    <rect x="-52" y="116" width="20" height="67" rx="10" fill="#4b5470"/>
    <rect x="32" y="116" width="20" height="67" rx="10" fill="#4b5470"/>
    <circle cx="0" cy="70" r="48" fill="#69728d" stroke="#11131e" stroke-width="5"/>
    <rect x="-38" y="50" width="76" height="42" rx="12" fill="#101524"/>
    <circle cx="-18" cy="70" r="8" fill="#ff456f" filter="url(#smallGlow)"/>
    <circle cx="18" cy="70" r="8" fill="#ff456f" filter="url(#smallGlow)"/>
    <path d="M-18 88 Q0 97 18 88" fill="none" stroke="#ff456f" stroke-width="4"/>
    <path d="M-33 28 Q0 0 33 28" fill="none" stroke="#8d9abb" stroke-width="8"/>
    <text x="0" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#d9e1ff">BOUNCER-BOT</text>
  </g>

  <!-- velvet rope -->
  <path d="M390 430 Q330 472 270 430" fill="none" stroke="#e34375" stroke-width="9"/>
  <circle cx="390" cy="430" r="10" fill="#f8d38d"/>
  <circle cx="270" cy="430" r="10" fill="#f8d38d"/>
  <rect x="382" y="430" width="16" height="110" fill="#b58c55"/>
  <rect x="262" y="430" width="16" height="110" fill="#b58c55"/>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(75 355)">
      <ellipse cx="45" cy="142" rx="45" ry="10" fill="#05050c" opacity=".6"/>
      <circle cx="45" cy="40" r="29" fill="#d6a27d"/><path d="M18 38 Q45 0 72 38" fill="#3a2630"/>
      <path d="M30 47 l12 5 M48 52 l12 -5" stroke="#33243a" stroke-width="4"/>
      <path d="M30 50 Q45 58 60 50" fill="none" stroke="#33243a" stroke-width="3"/>
      <rect x="18" y="70" width="54" height="70" rx="12" fill="#4784c4"/>
      <path d="M0 90 L-20 130 M90 90 L111 127" stroke="#d6a27d" stroke-width="12"/>
      <text x="45" y="164" text-anchor="middle" font-size="14" font-weight="800" fill="#f4e9ff">DEV #404</text>
    </g>

    <g transform="translate(175 385)">
      <ellipse cx="45" cy="112" rx="43" ry="9" fill="#05050c" opacity=".6"/>
      <circle cx="45" cy="30" r="27" fill="#8e5d43"/><path d="M20 28 Q45 -3 70 28" fill="#1d1c2c"/>
      <path d="M27 37 l12 4 M51 41 l12 -4" stroke="#282033" stroke-width="4"/>
      <rect x="17" y="58" width="56" height="56" rx="10" fill="#d85d73"/>
      <path d="M0 75 L-16 107 M90 75 L106 106" stroke="#8e5d43" stroke-width="11"/>
      <text x="45" y="134" text-anchor="middle" font-size="13" font-weight="800" fill="#f4e9ff">DEV #503</text>
    </g>

    <g transform="translate(285 345)">
      <ellipse cx="42" cy="149" rx="43" ry="10" fill="#05050c" opacity=".6"/>
      <circle cx="42" cy="42" r="28" fill="#e4ba91"/><path d="M16 39 Q42 8 68 39" fill="#d7d9e7"/>
      <path d="M25 48 l12 4 M48 52 l12 -4" stroke="#44364c" stroke-width="4"/>
      <rect x="15" y="72" width="55" height="70" rx="11" fill="#53b5a6"/>
      <path d="M0 92 L-17 132 M85 92 L103 130" stroke="#e4ba91" stroke-width="12"/>
      <text x="42" y="170" text-anchor="middle" font-size="14" font-weight="800" fill="#f4e9ff">DEV #999</text>
    </g>
  </g>

  <!-- speech bubble -->
  <path d="M92 215 Q172 155 293 190 Q332 202 302 250 Q277 278 182 266 L135 296 L139 263 Q87 257 92 215Z" fill="#fff8e8" stroke="#22213a" stroke-width="5"/>
  <text x="190" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#2b2140">“SELECTED MODEL IS</text>
  <text x="190" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#e33d72">AT CAPACITY.”</text>

  <!-- caption -->
  <rect x="52" y="535" width="696" height="42" rx="20" fill="#ff4fd8" opacity=".15" stroke="#ff75df" stroke-width="2"/>
  <text x="400" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#fff">WHEN THE BOUNCER SAYS “AT CAPACITY,” EVEN THE SERVERS START MELTING.</text>
</svg>