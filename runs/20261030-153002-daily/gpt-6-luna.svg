<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City block route from A1 to E5</title>
  <desc id="desc">A 5 by 5 grid of intersections. The blue shortest route from A1 to E5 avoids blocked intersections B2, C3, and D4 and uses 8 street segments.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <g stroke="#9aa5b1" stroke-width="3">
    <path d="M100 70H500 M100 125H500 M100 180H500 M100 235H500 M100 290H500"/>
    <path d="M100 70V290 M200 70V290 M300 70V290 M400 70V290 M500 70V290"/>
  </g>
  <g fill="none" stroke="#1673d1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 70 H500 V290"/>
  </g>
  <g fill="#fff" stroke="#1673d1" stroke-width="3">
    <circle cx="100" cy="70" r="8"/>
    <circle cx="500" cy="290" r="8"/>
  </g>
  <g stroke="#d52b2b" stroke-width="5" stroke-linecap="round">
    <path d="M190 115l20 20m0-20l-20 20"/>
    <path d="M290 170l20 20m0-20l-20 20"/>
    <path d="M390 225l20 20m0-20l-20 20"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#263445" text-anchor="middle">
    <text x="100" y="48">A</text><text x="200" y="48">B</text><text x="300" y="48">C</text><text x="400" y="48">D</text><text x="500" y="48">E</text>
    <text x="65" y="75">1</text><text x="65" y="130">2</text><text x="65" y="185">3</text><text x="65" y="240">4</text><text x="65" y="295">5</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#263445" text-anchor="middle">
    <text x="100" y="98">A1</text><text x="200" y="98">B1</text><text x="300" y="98">C1</text><text x="400" y="98">D1</text><text x="500" y="98">E1</text>
    <text x="100" y="153">A2</text><text x="200" y="153">B2</text><text x="300" y="153">C2</text><text x="400" y="153">D2</text><text x="500" y="153">E2</text>
    <text x="100" y="208">A3</text><text x="200" y="208">B3</text><text x="300" y="208">C3</text><text x="400" y="208">D3</text><text x="500" y="208">E3</text>
    <text x="100" y="263">A4</text><text x="200" y="263">B4</text><text x="300" y="263">C4</text><text x="400" y="263">D4</text><text x="500" y="263">E4</text>
    <text x="100" y="318">A5</text><text x="200" y="318">B5</text><text x="300" y="318">C5</text><text x="400" y="318">D5</text><text x="500" y="318">E5</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    <text x="112" y="66" fill="#1265b5">START</text>
    <text x="486" y="280" fill="#1265b5" text-anchor="end">END</text>
  </g>
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#263445" text-anchor="middle">Shortest route: 8 street segments</text>
  <text x="300" y="381" font-family="Arial, sans-serif" font-size="13" fill="#263445" text-anchor="middle">2026-10-30 15:35:28 SGT (UTC+08:00)</text>
</svg>