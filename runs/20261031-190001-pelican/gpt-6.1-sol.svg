<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle with a fish-filled bill pouch. Both wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bce9ed"/>
      <stop offset="1" stop-color="#fff3c9"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd474"/>
      <stop offset="1" stop-color="#ee9650"/>
    </linearGradient>
    <pattern id="road" width="160" height="12" patternUnits="userSpaceOnUse">
      <path d="M20 6h70" stroke="#fff0ba" stroke-width="5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff8e9"/>
  <rect x="16" y="16" width="768" height="568" rx="24" fill="url(#sky)" stroke="#223b43" stroke-width="4"/>

  <text x="400" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#223b43" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#36575b">One bird. Two wheels. Absolutely no aerodynamics.</text>

  <g fill="#fffdf2" opacity=".8">
    <path d="M50 178c-10-23 19-36 35-23 5-28 47-29 55-1 30-8 44 21 22 28H50Z"/>
    <path d="M579 149c-9-21 17-32 32-21 6-23 38-25 47-2 25-7 40 17 20 23Z"/>
  </g>
  <circle cx="708" cy="208" r="37" fill="#ffd36a"/>
  <path d="M18 364Q155 326 286 362T557 360T782 346V449H18Z" fill="#8ab9a0"/>
  <path d="M18 399Q160 375 315 400T610 394T782 390V462H18Z" fill="#668e75"/>

  <g stroke="#223b43" stroke-linecap="round" stroke-linejoin="round">
    <path d="M650 439V282" stroke-width="7"/>
    <path d="M609 282h111v65H609Z" fill="#fff8e9" stroke-width="3"/>
    <text x="664" y="307" text-anchor="middle" stroke="none" fill="#223b43" font-family="Arial, sans-serif" font-weight="bold" font-size="15">BIKE LANE</text>
    <text x="664" y="330" text-anchor="middle" stroke="none" fill="#c05843" font-family="Arial, sans-serif" font-size="13">NO FLYING</text>
  </g>

  <path d="M18 444H782V508H18Z" fill="#53646a"/>
  <rect x="18" y="478" width="764" height="12" fill="url(#road)"/>
  <ellipse cx="387" cy="451" rx="225" ry="14" fill="#263e45" opacity=".18"/>

  <!-- Spinning bicycle wheels -->
  <g stroke="#223b43" stroke-linecap="round">
    <g transform="translate(256 388)">
      <circle r="63" fill="#e4f1df" fill-opacity=".55" stroke-width="10"/>
      <circle r="53" fill="none" stroke="#fff8e9" stroke-width="3"/>
      <g stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.25s" repeatCount="indefinite"/>
        <path d="M-54 0H54M0-54V54M-38-38l76 76M-38 38l76-76"/>
        <circle cx="40" cy="-30" r="5" fill="#ffd36a" stroke="none"/>
      </g>
      <circle r="8" fill="#ef785b" stroke-width="3"/>
    </g>
    <g transform="translate(521 388)">
      <circle r="63" fill="#e4f1df" fill-opacity=".55" stroke-width="10"/>
      <circle r="53" fill="none" stroke="#fff8e9" stroke-width="3"/>
      <g stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.25s" repeatCount="indefinite"/>
        <path d="M-54 0H54M0-54V54M-38-38l76 76M-38 38l76-76"/>
        <circle cx="40" cy="-30" r="5" fill="#ffd36a" stroke="none"/>
      </g>
      <circle r="8" fill="#ef785b" stroke-width="3"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#223b43" stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 388l73-103 53 103H256l202-93-76 93M458 295l63 93" stroke-width="13"/>
    <path d="M256 388l73-103 53 103H256l202-93-76 93M458 295l63 93" stroke="#ee7055" stroke-width="7"/>
    <path d="M329 285l-10-28M458 295l-12-43 34-12" stroke-width="8"/>
    <path d="M298 258h43" stroke-width="12"/>
    <path d="M475 240h18" stroke-width="10"/>
    <path d="M372 375l-97 4q-14 10 0 19l97 3" stroke-width="3"/>
  </g>

  <!-- Pelican and its magnificent fish-storage system -->
  <g stroke="#223b43" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".625s" repeatCount="indefinite"/>

    <path d="M302 227l-48-31 16 46-31-4 43 35" fill="#fffdf1"/>
    <path d="M299 209c-42 8-52 41-26 66 26 25 86 28 115 2 19-17 22-37 10-55l-31-39Z" fill="#fffdf1"/>
    <path d="M306 226q-20 5-15 25 24 32 70 15-24-4-38-24" fill="#d9e6df"/>
    <path d="M361 231c33-13 30-42 22-63-9-29-1-53 22-56 27-4 44 16 38 40-4 19-17 27-16 46l10 39" fill="#fffdf1"/>

    <path d="M394 119q-5-20 8-27l9 19 7-18 7 23" fill="#fffdf1"/>
    <path d="M387 128q21-16 50 1l-5-13q-23-16-42 0Z" fill="#ed7054"/>
    <path d="M395 118l32-1" fill="none" stroke-width="3"/>

    <path d="M432 169l157 17q-43 85-128 53-34-13-29-70Z" fill="url(#pouch)"/>
    <g fill="#82b6bc" stroke-width="2.5">
      <path d="M472 208q19-21 40-4l15-10-1 24-16-7q-23 14-38-3Z"/>
      <path d="M519 223q13-15 29-4l11-8 1 19-13-5q-16 10-28-2Z"/>
      <circle cx="481" cy="206" r="2" fill="#223b43" stroke="none"/>
      <circle cx="526" cy="221" r="2" fill="#223b43" stroke="none"/>
    </g>
    <path d="M434 153l163 31q10 3 1 9l-166-15Z" fill="#ffc459"/>
    <path d="M448 173l133 15" fill="none" stroke-width="2"/>

    <circle cx="421" cy="145" r="10" fill="white"/>
    <circle cx="425" cy="146" r="4.5" fill="#223b43" stroke="none"/>
    <path d="M409 131l18-5" fill="none"/>
    <path d="M438 197q-5 12 1 21" fill="none" stroke-width="2"/>

    <path d="M358 240q41 15 82 12l35-9" fill="none" stroke-width="13"/>
    <path d="M358 240q41 15 82 12l35-9" fill="none" stroke="#e3ebe0" stroke-width="7"/>

    <path d="M321 279l22 43 45 39" fill="none" stroke="#e8a240" stroke-width="13">
      <animate attributeName="d" values="M321 279l22 43 45 39;M321 279l9 54 47 43;M321 279l22 43 45 39" dur="1.25s" repeatCount="indefinite"/>
    </path>
    <path d="M379 360l20 3-10 10-20-2Z" fill="#ffc459">
      <animateTransform attributeName="transform" type="translate" values="0 0;-11 15;0 0" dur="1.25s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(382 388)">
    <circle r="17" fill="#fff1cb" stroke="#223b43" stroke-width="4"/>
    <g stroke="#223b43" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.25s" repeatCount="indefinite"/>
      <path d="M0-23V23"/>
      <path d="M-8-23H8M-8 23H8" stroke-width="7"/>
    </g>
    <circle r="5" fill="#ed7054"/>
  </g>

  <g fill="none" stroke="#fff8e9" stroke-width="3" stroke-linecap="round">
    <path d="M153 329h34M143 345h29M160 361h21">
      <animate attributeName="opacity" values=".3;1;.3" dur=".625s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="18" y="509" width="764" height="73" rx="12" fill="#fff8e9"/>
  <text x="400" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#223b43">“I was told cycling would shrink my carbon finprint.”</text>
  <text x="400" y="567" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#41575b">2026-10-31 19:01:07 SGT (UTC+08:00)</text>
</svg>