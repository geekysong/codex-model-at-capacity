<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A determined pelican pedals a bicycle with a huge beak full of fish while earning one sardine per delivery. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="sky" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#dce9df"/>
    </pattern>
    <g id="spokes" stroke="#48616a" stroke-width="3">
      <path d="M-66 0H66M0-66V66M-47-47L47 47M-47 47L47-47"/>
      <circle r="8" fill="#f9c34c" stroke="#253944"/>
    </g>
    <g id="fish">
      <path d="M-18 0Q0-17 19 0Q0 15-18 0L-31-11V11Z" fill="#70bdba" stroke="#253944" stroke-width="2"/>
      <circle cx="11" cy="-2" r="2.5" fill="#253944"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5db"/>
  <rect y="105" width="800" height="395" fill="#edf3e9"/>
  <rect y="105" width="800" height="395" fill="url(#sky)"/>
  <text x="400" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#253944">THE GIG ECONOMY TAKES WING</  text>
  <text x="400" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="3" fill="#607573">UNFORTUNATELY, IT STILL HAS TO PEDAL.</text>

