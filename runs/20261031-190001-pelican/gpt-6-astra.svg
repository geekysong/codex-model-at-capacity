    <text x="656" y="258" text-anchor="middle" font-size="19" font-weight="bold" fill="#253944">BOSS!”</text>
    <text x="656" y="278" text-anchor="middle" font-size="12" fill="#79624b">— the app, every 4 minutes</text>
  </g>

