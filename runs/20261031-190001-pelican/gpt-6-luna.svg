<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal-Powered Promise</title>
  <desc id="desc">A smug pelican rides a bicycle beneath the caption: “A beak ahead of traffic. Two wings short of a helmet.”</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.2s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8e8bd"/>
  <path d="M0 0H800V95Q630 130 460 96T0 106Z" fill="#173b45"/>
  <text x="400" y="49" text-anchor="middle" font-size="30" font-weight="900" letter-spacing="1.5" fill="#fff4d6">THE PELICAN PEDAL-POWERED PROMISE</text>
  <text x="400" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#f6bc52">A beak ahead of traffic. Two wings short of a helmet.</text>

  <circle cx="680" cy="165" r="43" fill="#f6bc52"/>
  <path d="M0 385Q160 325 330 375T800 350V520H0Z" fill="#a8c98c"/>
  <path d="M0 420Q170 385 340 415T800 395" fill="none" stroke="#789c72" stroke-width="4"/>
  <path d="M0 470Q200 430 420 462T800 440" fill="none" stroke="#789c72" stroke-width="3"/>

  <!-- Speed lines -->
  <path d="M92 265h115M55 290h142M112 317h92" stroke="#df7951" stroke-width="6" stroke-linecap="round"/>
  <path d="M611 273h82M636 298h113" stroke="#df7951" stroke-width="5" stroke-linecap="round"/>

  <!-- Bicycle frame and fork -->
  <g fill="none" stroke="#173b45" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 420L335 315L440 420L245 420L310 350"/>
    <path d="M440 420L520 316L553 420"/>
    <path d="M505 316h55M520 316l-24-23"/>
    <path d="M335 315h-35"/>
  </g>
  <g class="wheel" fill="none" stroke="#173b45" stroke-width="7">
    <circle cx="245" cy="420" r="66"/>
    <path d="M245 354v132M179 420h132M198 373l94 94M292 373l-94 94"/>
  </g>
  <g class="wheel" fill="none" stroke="#173b45" stroke-width="7">
    <circle cx="553" cy="420" r="66"/>
    <path d="M553 354v132M487 420h132M506 373l94 94M600 373l-94 94"/>
  </g>
  <circle cx="335" cy="315" r="10" fill="#f6bc52" stroke="#173b45" stroke-width="5"/>
  <circle cx="440" cy="420" r="12" fill="#f6bc52" stroke="#173b45" stroke-width="5"/>
  <path d="M423 402l-26-18M457 438l27 18" stroke="#173b45" stroke-width="7" stroke-linecap="round"/>
  <path d="M390 379l-12 13M484 451l13-13" stroke="#df7951" stroke-width="6" stroke-linecap="round"/>
  <path d="M276 288h83" stroke="#173b45" stroke-width="9" stroke-linecap="round"/>
  <path d="M511 306l17-19" stroke="#173b45" stroke-width="8" stroke-linecap="round"/>

  <!-- Animated pelican rider -->
  <g class="rider">
    <!-- tail -->
    <path d="M363 260Q327 242 312 265Q340 280 366 278Z" fill="#173b45"/>
    <!-- body -->
    <path d="M353 238Q375 194 425 206Q464 215 467 261Q466 299 428 315L371 297Q346 276 353 238Z" fill="#fff8e6" stroke="#173b45" stroke-width="6"/>
    <path d="M362 254Q400 275 463 257Q460 297 428 315L371 297Q354 282 362 254Z" fill="#df7951"/>
    <!-- wing -->
    <path d="M379 229Q414 213 444 239Q422 259 384 258Q372 246 379 229Z" fill="#d9e0d4" stroke="#173b45" stroke-width="5"/>
    <path d="M390 238l34 9M385 246l26 8" stroke="#9aaca2" stroke-width="3"/>
    <!-- neck and head -->
    <path d="M395 220Q377 184 404 151Q424 129 453 146Q470 157 463 178Q449 199 429 220Z" fill="#fff8e6" stroke="#173b45" stroke-width="6"/>
    <path d="M447 162Q487 149 547 174Q521 197 462 187Z" fill="#f6bc52" stroke="#173b45" stroke-width="6" stroke-linejoin="round"/>
    <path d="M465 180Q499 185 541 176Q521 216 485 207Q468 202 465 180Z" fill="#df7951" stroke="#173b45" stroke-width="5"/>
    <circle cx="445" cy="158" r="5.5" fill="#173b45"/>
    <path d="M434 143q12-11 23 0" fill="none" stroke="#173b45" stroke-width="4" stroke-linecap="round"/>
    <!-- jaunty cap -->
    <path d="M414 143Q421 119 450 126L466 145Z" fill="#df7951" stroke="#173b45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M450 142q18-4 29 4-15 8-29 2" fill="#f6bc52" stroke="#173b45" stroke-width="4"/>
    <!-- legs reaching pedals -->
    <path d="M388 294Q370 326 397 379" fill="none" stroke="#f6bc52" stroke-width="10" stroke-linecap="round"/>
    <path d="M425 301Q449 339 466 438" fill="none" stroke="#f6bc52" stroke-width="10" stroke-linecap="round"/>
    <path d="M386 377l17 3M457 438l22 2" stroke="#173b45" stroke-width="7" stroke-linecap="round"/>
    <!-- wing-arm on handlebars -->
    <path d="M435 246Q471 259 501 306" fill="none" stroke="#fff8e6" stroke-width="12" stroke-linecap="round"/>
    <path d="M496 306l20 1" stroke="#173b45" stroke-width="7" stroke-linecap="round"/>
    <!-- satirical speech -->
    <path d="M560 142q14-25 44-17l32 15-20 28-35-4-17 8z" fill="#fff8e6" stroke="#173b45" stroke-width="3"/>
    <text x="594" y="143" text-anchor="middle" font-size="11" font-weight="900" fill="#173b45">I demand</text>
    <text x="594" y="157" text-anchor="middle" font-size="11" font-weight="900" fill="#173b45">a beak lane!</text>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="401" cy="497" rx="247" ry="13" fill="#66845e" opacity=".45"/>
  <path d="M90 498h620" stroke="#173b45" stroke-width="3" opacity=".4"/>
  <rect x="0" y="524" width="800" height="76" fill="#173b45"/>
  <text x="400" y="555" text-anchor="middle" font-size="17" font-weight="800" fill="#fff4d6">LOCAL BIRD INSISTS THIS COUNTS AS “WINGING IT.”</text>
  <text x="400" y="583" text-anchor="middle" font-size="14" font-weight="700" fill="#f6bc52">2026-10-31 19:01:52 SGT (UTC+08:00)</text>
</svg>