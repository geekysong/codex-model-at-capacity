<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111">
    <!-- Title -->
    <text x="300" y="36" text-anchor="middle" font-size="24" font-weight="bold">Level Seesaw — Static Equilibrium</text>

    <!-- Seesaw beam -->
    <rect x="80" y="178" width="440" height="18" rx="9" fill="#c9874b" stroke="#5b351d" stroke-width="3"/>
    
    <!-- Pivot -->
    <polygon points="300,196 265,265 335,265" fill="#7b8794" stroke="#36424d" stroke-width="3"/>
    <line x1="245" y1="265" x2="355" y2="265" stroke="#36424d" stroke-width="6" stroke-linecap="round"/>
    <text x="300" y="292" text-anchor="middle" font-size="18" font-weight="bold">pivot</text>

    <!-- Left mass -->
    <rect x="130" y="112" width="70" height="52" rx="6" fill="#4f8edb" stroke="#244d80" stroke-width="3"/>
    <text x="165" y="144" text-anchor="middle" font-size="20" fill="white" font-weight="bold">6 kg</text>
    <line x1="165" y1="164" x2="165" y2="178" stroke="#244d80" stroke-width="3"/>
    <!-- Left downward force arrow -->
    <line x1="165" y1="70" x2="165" y2="108" stroke="#c62828" stroke-width="4"/>
    <polygon points="165,120 157,105 173,105" fill="#c62828"/>
    <text x="165" y="62" text-anchor="middle" font-size="17" fill="#c62828" font-weight="bold">F = 6g ↓</text>

    <!-- Right mass -->
    <rect x="430" y="112" width="70" height="52" rx="6" fill="#e39b3c" stroke="#8b5717" stroke-width="3"/>
    <text x="465" y="144" text-anchor="middle" font-size="20" fill="white" font-weight="bold">4 kg</text>
    <line x1="465" y1="164" x2="465" y2="178" stroke="#8b5717" stroke-width="3"/>
    <!-- Right downward force arrow -->
    <line x1="465" y1="70" x2="465" y2="108" stroke="#c62828" stroke-width="4"/>
    <polygon points="465,120 457,105 473,105" fill="#c62828"/>
    <text x="465" y="62" text-anchor="middle" font-size="17" fill="#c62828" font-weight="bold">F = 4g ↓</text>

    <!-- Distance dimension lines -->
    <line x1="165" y1="325" x2="300" y2="325" stroke="#333" stroke-width="2"/>
    <line x1="165" y1="317" x2="165" y2="333" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="317" x2="300" y2="333" stroke="#333" stroke-width="2"/>
    <polygon points="165,325 177,319 177,331" fill="#333"/>
    <polygon points="300,325 288,319 288,331" fill="#333"/>
    <text x="232.5" y="350" text-anchor="middle" font-size="18">2 m left</text>

    <line x1="300" y1="325" x2="465" y2="325" stroke="#333" stroke-width="2"/>
    <line x1="465" y1="317" x2="465" y2="333" stroke="#333" stroke-width="2"/>
    <polygon points="300,325 312,319 312,331" fill="#333"/>
    <polygon points="465,325 453,319 453,331" fill="#333"/>
    <text x="382.5" y="350" text-anchor="middle" font-size="18">x = 3 m right</text>

    <!-- Torque equation and status -->
    <text x="300" y="382" text-anchor="middle" font-size="20" font-weight="bold">Torque: 6 × 2 = 4 × 3</text>
    <text x="530" y="292" text-anchor="end" font-size="22" fill="#16803c" font-weight="bold">balanced</text>
  </g>
</svg>