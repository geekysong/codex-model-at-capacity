<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .label { font: 18px Arial, sans-serif; fill: #111827; }
      .small { font: 16px Arial, sans-serif; fill: #111827; }
      .eq { font: bold 24px Arial, sans-serif; fill: #111827; }
      .title { font: bold 26px Arial, sans-serif; fill: #166534; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <text x="300" y="38" text-anchor="middle" class="title">BALANCED</text>

  <!-- Seesaw beam -->
  <rect x="85" y="178" width="430" height="18" rx="7" fill="#8b5e34" stroke="#4b3621" stroke-width="2"/>
  <line x1="300" y1="160" x2="300" y2="214" stroke="#374151" stroke-width="3"/>

  <!-- Pivot -->
  <path d="M270 270 L300 210 L330 270 Z" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
  <line x1="250" y1="270" x2="350" y2="270" stroke="#374151" stroke-width="5"/>
  <text x="300" y="298" text-anchor="middle" class="label">pivot</text>

  <!-- Left rope and mass -->
  <line x1="170" y1="196" x2="170" y2="257" stroke="#374151" stroke-width="3"/>
  <rect x="140" y="257" width="60" height="48" rx="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
  <text x="170" y="287" text-anchor="middle" class="label">6 kg</text>

  <!-- Right rope and mass -->
  <line x1="420" y1="196" x2="420" y2="257" stroke="#374151" stroke-width="3"/>
  <rect x="390" y="257" width="60" height="48" rx="5" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
  <text x="420" y="287" text-anchor="middle" class="label">4 kg</text>

  <!-- Force arrows -->
  <line x1="170" y1="225" x2="170" y2="252" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="170" y="218" text-anchor="middle" class="small">6g downward</text>

  <line x1="420" y1="225" x2="420" y2="252" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="218" text-anchor="middle" class="small">4g downward</text>

  <!-- Distance indicators -->
  <line x1="170" y1="145" x2="300" y2="145" stroke="#374151" stroke-width="2"/>
  <line x1="170" y1="137" x2="170" y2="153" stroke="#374151" stroke-width="2"/>
  <line x1="300" y1="137" x2="300" y2="153" stroke="#374151" stroke-width="2"/>
  <text x="235" y="135" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="115" x2="420" y2="115" stroke="#374151" stroke-width="2"/>
  <line x1="300" y1="107" x2="300" y2="123" stroke="#374151" stroke-width="2"/>
  <line x1="420" y1="107" x2="420" y2="123" stroke="#374151" stroke-width="2"/>
  <text x="360" y="105" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Torque equation -->
  <text x="300" y="350" text-anchor="middle" class="eq">6 × 2 = 4 × 3</text>
  <text x="300" y="378" text-anchor="middle" class="small">equal opposing torques → static equilibrium</text>
</svg>