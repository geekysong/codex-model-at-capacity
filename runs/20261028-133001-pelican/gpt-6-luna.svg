      <path d="M270 438L270 362M270 438L205 468M270 438L331 466M270 438L220 406M270 438L322 407" stroke="#5ca2bd" stroke-width="4"/>
    </g>
    <g>
      <circle cx="552" cy="438" r="76" fill="#d9f5ff" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 552 438" to="360 552 438" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="552" cy="438" r="8" fill="#17212b"/>
      <path d="M552 438L552 362M552 438L487 468M552 438L613 466M552 438L502 406M552 438L604 407" stroke="#5ca2bd" stroke-width="4"/>
