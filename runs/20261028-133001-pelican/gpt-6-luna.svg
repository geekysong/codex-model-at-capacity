  <path d="M132 477 q-18-24-36 0 q-18-24-36 0" fill="none" stroke="#367c4c" stroke-width="6"/>
  <path d="M694 472 q-18-24-36 0 q-18-24-36 0" fill="none" stroke="#367c4c" stroke-width="6"/>

  <rect x="74" y="520" width="652" height="38" rx="12" fill="#fff4cf" class="ink"/>
  <text x="400" y="546" text-anchor="middle" class="label caption">A beak, two wheels, and absolutely no traffic sense.</text>
  <text x="400" y="583" text-anchor="middle" class="label small">2026-10-28 13:31:32 SGT (UTC+08:00)</text>
