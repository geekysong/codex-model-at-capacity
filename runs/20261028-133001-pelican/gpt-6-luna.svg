    .label{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
    .small{font-size:16px}
    .caption{font-size:22px;font-weight:bold}
    .title{font-size:38px;font-weight:900;letter-spacing:1px}
  </style>

  <rect width="800" height="600" fill="#bdeeff"/>
