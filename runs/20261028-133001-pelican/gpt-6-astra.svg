<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICAN COMMUTE</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle, wobbling proudly toward work.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6c7785"/>
      <stop offset="1" stop-color="#3c4652"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1c2733" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#1f2933;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#1f2933}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#1f2933}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="100" r="48" fill="#fff7b2" opacity=".9"/>
  <path d="M0 345 Q130 290 260 340 T520 330 T800 345 V430 H0Z" fill="#a9d68e"/>
  <path d="M0 380 Q150 350 300 380 T600 375 T800 390 V455 H0Z" fill="#78b77a"/>
  <path d="M0 425 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f7e7a3" stroke-width="8" stroke-dasharray="45 28"/>

  <g filter="url(#shadow)">
    <rect x="95" y="42" width="610" height="88" rx="22" fill="#fffdf4" class="ink"/>
    <text x="400" y="88" text-anchor="middle" class="label" font-size="36">THE GREAT PELICAN COMMUTE</text>
    <text x="400" y="116" text-anchor="middle" class="small" font-size="18">“Why walk when you can wobble with purpose?”</text>
  </g>

  <!-- motion lines -->
  <g stroke="#1f2933" stroke-width="5" stroke-linecap="round" opacity=".55">
    <path d="M120 275 h58"/>
    <path d="M96 302 h38"/>
    <path d="M650 270 h55"/>
  </g>

  <!-- bicycle -->
  <g id="bike" transform="translate(0,0)">
    <g fill="none" class="ink">
      <circle cx="280" cy="450" r="78" stroke="#202a35" stroke-width="10"/>
      <circle cx="560" cy="450" r="78" stroke="#202a35" stroke-width="10"/>
      <path d="M280 450 L378 350 L470 450 L280 450 M378 350 L430 450 M470 450 L530 350 L560 450 M430 450 H470"/>
      <path d="M370 350 h-35 M530 350 h35"/>
    </g>
    <g id="spokes" stroke="#b8c4ce" stroke-width="3">
      <path d="M280 372 V528 M202 450 H358 M225 395 L335 505 M225 505 L335 395"/>
      <path d="M560 372 V528 M482 450 H638 M505 395 L615 505 M505 505 L615 395"/>
    </g>
    <g fill="#e45757" class="ink">
      <circle cx="378" cy="350" r="13"/>
      <circle cx="430" cy="450" r="13"/>
    </g>
    <path d="M430 450 q-28 42 8 58 M430 450 q32 40 60 8" fill="none" stroke="#1f2933" stroke-width="8"/>
  </g>

  <!-- pelican body and bobbing motion -->
  <g id="pelican" class="ink">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0;0 5;0 0" dur="1.4s" repeatCount="indefinite"/>
    <ellipse cx="415" cy="295" rx="92" ry="105" fill="#f4f0e2"/>
    <path d="M355 310 Q300 275 320 210 Q342 150 405 173 Q455 190 453 245 Q451 296 420 321Z" fill="#fffdf4"/>
    <path d="M395 175 Q432 133 483 160 Q518 180 493 225 Q471 253 426 238Z" fill="#f4f0e2"/>
    <path d="M464 185 Q540 195 610 230 Q635 244 608 260 Q530 276 455 239Z" fill="#f3a64a"/>
    <path d="M475 221 Q550 230 616 244" fill="none" stroke="#b65b28" stroke-width="5"/>
    <circle cx="463" cy="188" r="9" fill="#1f2933"/>
    <path d="M340 250 Q300 220 286 178 Q325 190 354 224" fill="#e5dfcf"/>
    <path d="M397 320 L390 363 M436 320 L447 363" fill="none" stroke="#d47b28" stroke-width="9"/>
    <path d="M382 363 q18 12 35 0 M438 363 q18 12 35 0" fill="none" stroke="#d47b28" stroke-width="8"/>
    <path d="M360 290 Q405 325 454 290" fill="none" stroke="#d8cdb8" stroke-width="5"/>
    <rect x="370" y="255" width="94" height="27" rx="8" fill="#ef476f" stroke="#1f2933" stroke-width="5"/>
    <text x="417" y="275" text-anchor="middle" class="label" font-size="15" fill="#fff">BOSS BIRD</text>
    <path d="M335 215 Q303 190 285 207" fill="none" stroke="#1f2933" stroke-width="6"/>
  </g>

  <!-- wing gripping handlebar -->
  <path d="M466 295 Q500 320 530 350" fill="none" stroke="#1f2933" stroke-width="18" stroke-linecap="round"/>
  <path d="M360 300 Q337 330 350 360" fill="none" stroke="#1f2933" stroke-width="18" stroke-linecap="round"/>

  <!-- speech bubble -->
  <g>
    <path d="M575 150 Q690 125 746 180 Q762 220 720 248 Q660 270 588 235 L560 255 L566 218 Q540 188 575 150Z" fill="#fffdf4" class="ink"/>
    <text x="650" y="184" text-anchor="middle" class="label" font-size="21">I’M LATE!</text>
    <text x="650" y="211" text-anchor="middle" class="small" font-size="17">MY WINGS ARE</text>
    <text x="650" y="232" text-anchor="middle" class="small" font-size="17">IN A MEETING.</text>
  </g>

  <!-- wheel animation -->
  <animateTransform xlink:href="#spokes" attributeName="transform" type="rotate" from="0 280 450" to="360 280 450" dur="1.2s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#spokes" attributeName="transform" type="rotate" from="0 560 450" to="360 560 450" dur="1.2s" repeatCount="indefinite"/>

  <!-- caption -->
  <g>
    <rect x="170" y="535" width="460" height="36" rx="15" fill="#fffdf4" opacity=".95" class="ink"/>
    <text x="400" y="560" text-anchor="middle" class="small" font-size="18">A pelican on a bicycle: peak efficiency, questionable balance.</text>
  </g>

  <!-- required visible timestamp footer -->
  <text x="400" y="592" text-anchor="middle" class="small" font-size="14">2026-10-28 13:30:01 SGT (UTC+08:00)</text>
</svg>