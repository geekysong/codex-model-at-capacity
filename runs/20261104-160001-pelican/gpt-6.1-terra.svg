<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN IN THE BIKE LANE</title>
  <desc id="desc">A pelican with a fish in its beak rides a bicycle past a road sign. Its wheels spin and its body bobs.</desc>
  <defs>
    <pattern id="spokes" width="100%" height="100%">
      <path d="M0-72V72M-72 0H72M-51-51L51 51M51-51L-51 51" fill="none" stroke="#31505b" stroke-width="3"/>
      <circle r="7" fill="#ef694b" stroke="#243c45" stroke-width="3"/>
    </pattern>
    <style>
      .ink { stroke:#243c45; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 1s ease-in-out infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider { animation-duration:8s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect x="16" y="16" width="768" height="568" rx="20" fill="#d8f1ed" stroke="#243c45" stroke-width="5"/>
