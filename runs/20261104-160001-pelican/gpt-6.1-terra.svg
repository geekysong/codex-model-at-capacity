  <text x="94" y="242" text-anchor="middle" fill="#243c45" font-family="Arial, sans-serif" font-size="12" font-weight="900">SHARE</text>
  <text x="94" y="266" text-anchor="middle" fill="#243c45" font-family="Arial, sans-serif" font-size="12" font-weight="900">THE ROAD</text>

