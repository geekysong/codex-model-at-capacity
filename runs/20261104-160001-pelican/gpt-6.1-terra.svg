  <path d="M39 470H151M186 470H298M333 470H445M480 470H592M627 470H739" stroke="#fff4d9" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="68" text-anchor="middle" fill="#243c45" font-family="Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="1">PELICAN IN THE BIKE LANE</text>
  <text x="400" y="95" text-anchor="middle" fill="#47636a" font-family="Arial, sans-serif" font-size="16" font-weight="700">A commute with a considerable carry-on.</text>

