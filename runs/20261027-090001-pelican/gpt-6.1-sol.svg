  <text x="400" y="540" text-anchor="middle" class="label" font-size="21" font-weight="700">A beak, two wheels, and absolutely no sense of direction.</text>

  <text x="400" y="585" text-anchor="middle" class="label" font-size="14">2026-10-27 09:01:04 SGT (UTC+08:00)</text>
