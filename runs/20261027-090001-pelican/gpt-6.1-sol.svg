    <path d="M350 345 L332 405 M430 345 L448 405" class="ink" fill="none"/>
    <path d="M330 405 l-30 18 M448 405 l30 18" class="ink" fill="none"/>
    <path d="M348 383 L392 425 L439 383" fill="none" stroke="#e84d4d" stroke-width="9"/>
    <path d="M373 393 L399 425 L421 392" fill="none" stroke="#17212b" stroke-width="6"/>
    <path d="M305 250 Q276 230 286 202" fill="none" stroke="#ffffff" stroke-width="18"/>
