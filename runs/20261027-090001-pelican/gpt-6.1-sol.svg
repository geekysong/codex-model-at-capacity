      <stop offset="0" stop-color="#8ed8f8"/>
      <stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <style>
      .ink{stroke:#17212b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#17212b}
