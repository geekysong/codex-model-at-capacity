  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900">THE PEDELICAN EXPRESS</text>
  <text x="400" y="96" text-anchor="middle" class="label" font-size="20" font-weight="700">“Why walk when you can wobble?”</text>

  <!-- bicycle -->
