<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICAN PEDAL-OFF</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636d"/>
      <stop offset="1" stop-color="#303944"/>
    </linearGradient>
    <style>
      .ink { stroke:#202631; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#202631; }
      .bold { font-weight:800; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="48" fill="#fff4b0" opacity=".9"/>
  <path d="M0 350 Q120 285 250 345 T500 335 T800 320 V430 H0Z" fill="#7fcf83"/>
  <path d="M0 400 Q160 350 320 405 T640 395 T800 380 V470 H0Z" fill="#4eaa68"/>

  <text x="400" y="58" text-anchor="middle" class="label bold" font-size="34">THE GREAT PELICAN PEDAL-OFF</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="19">“When the fish says swim, this bird says: I have wheels.”</text>

  <rect x="0" y="455" width="800" height="100" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f8dc67" stroke-width="8" stroke-dasharray="48 30"/>

  <!-- bicycle -->
  <g class="ink" fill="none">
    <circle cx="230" cy="445" r="73" stroke="#161b22" stroke-width="9"/>
    <circle cx="570" cy="445" r="73" stroke="#161b22" stroke-width="9"/>
    <g stroke="#a9d7e5" stroke-width="3">
      <g>
        <line x1="230" y1="445" x2="230" y2="372"/>
        <line x1="230" y1="445" x2="230" y2="518"/>
        <line x1="230" y1="445" x2="157" y2="445"/>
        <line x1="230" y1="445" x2="303" y2="445"/>
        <line x1="230" y1="445" x2="282" y2="497"/>
        <line x1="230" y1="445" x2="178" y2="497"/>
        <line x1="230" y1="445" x2="282" y2="393"/>
        <line x1="230" y1="445" x2="178" y2="393"/>
      </g>
      <g>
        <line x1="570" y1="445" x2="570" y2="372"/>
        <line x1="570" y1="445" x2="570" y2="518"/>
        <line x1="570" y1="445" x2="497" y2="445"/>
        <line x1="570" y1="445" x2="643" y2="445"/>
        <line x1="570" y1="445" x2="622" y2="497"/>
        <line x1="570" y1="445" x2="518" y2="497"/>
        <line x1="570" y1="445" x2="622" y2="393"/>
        <line x1="570" y1="445" x2="518" y2="393"/>
      </g>
    </g>
    <path d="M230 445 L350 355 L470 445 L230 445 L400 445 L350 355"/>
    <path d="M470 445 L520 350 L570 445"/>
    <path d="M520 350 L545 325"/>
    <path d="M530 323 Q555 313 575 323"/>
    <path d="M350 355 L330 330"/>
    <path d="M310 330 H350"/>
    <circle cx="400" cy="445" r="13" fill="#f5b642"/>
    <path d="M400 445 l-32 27 M400 445 l34 -25" stroke="#f5b642" stroke-width="7"/>
    <ellipse cx="368" cy="472" rx="12" ry="6" fill="#f5b642"/>
    <ellipse cx="434" cy="420" rx="12" ry="6" fill="#f5b642"/>
  </g>

  <!-- spinning hubs and spokes -->
  <g>
    <g transform="translate(230 445)">
      <circle r="8" fill="#f5b642" class="ink"/>
      <g stroke="#a9d7e5" stroke-width="3">
        <line y1="-8" y2="-73"/>
        <line y1="8" y2="73"/>
        <line x1="-8" x2="-73"/>
        <line x1="8" x2="73"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(570 445)">
      <circle r="8" fill="#f5b642" class="ink"/>
      <g stroke="#a9d7e5" stroke-width="3">
        <line y1="-8" y2="-73"/>
        <line y1="8" y2="73"/>
        <line x1="-8" x2="-73"/>
        <line x1="8" x2="73"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pelican body bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="395" cy="285" rx="80" ry="100" fill="#f4f1e7" class="ink"/>
    <path d="M350 350 Q395 380 445 350 L470 420 Q400 450 330 420Z" fill="#e2a83b" class="ink"/>
    <path d="M370 365 Q395 385 420 365" fill="none" class="ink"/>
    <circle cx="395" cy="190" r="67" fill="#f4f1e7" class="ink"/>
    <path d="M350 195 Q300 190 250 218 Q305 252 365 228Z" fill="#f39b38" class="ink"/>
    <path d="M250 218 Q300 224 365 228" fill="none" stroke="#202631" stroke-width="4"/>
    <circle cx="420" cy="180" r="9" fill="#202631"/>
    <path d="M430 150 Q458 135 475 155" fill="none" class="ink"/>
    <path d="M360 255 Q395 275 430 252" fill="none" class="ink"/>
    <path d="M345 270 Q320 300 335 335" fill="none" class="ink"/>
    <path d="M445 270 Q470 300 455 335" fill="none" class="ink"/>
    <path d="M360 220 Q380 230 395 220" fill="none" stroke="#d47b2d" stroke-width="5"/>
    <!-- fish in beak -->
    <path d="M244 218 Q208 195 178 215 Q205 235 178 255 Q215 270 244 242Z" fill="#8bc7de" class="ink"/>
    <circle cx="207" cy="227" r="4" fill="#202631"/>
    <path d="M178 215 l-18 -13 M178 255 l-18 13" class="ink"/>
    <!-- wing -->
    <path d="M350 280 Q300 310 320 360 Q350 345 380 310Z" fill="#d8d5ca" class="ink"/>
    <!-- legs -->
    <path d="M370 365 L365 425 M425 365 L435 420" fill="none" class="ink"/>
  </g>

  <text x="635" y="285" text-anchor="middle" class="label bold" font-size="20" transform="rotate(8 635 285)">NO WINGING IT!</text>
  <path d="M590 300 Q625 280 650 292" fill="none" class="ink"/>
  <path d="M650 292 l-13 -12 M650 292 l-16 7" fill="none" class="ink"/>

  <rect x="24" y="565" width="752" height="27" rx="8" fill="#f7f1d0"/>
  <text x="400" y="585" text-anchor="middle" class="label" font-size="16">2026-10-27 09:00:01 SGT (UTC+08:00)</text>
</svg>