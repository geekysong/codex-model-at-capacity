  </g>

  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" letter-spacing="3" fill="#243440">TOUR DE BEAK</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#54716d">Zero emissions. Unlimited fish breath.</text>

  <g stroke="#718f87" stroke-width="4" stroke-linejoin="round">
    <path d="M83 407V260" fill="none"/>
    <path d="M47 249H119V291H47Z" fill="#fff9e8"/>
  </g>
  <text x="83" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#405f59">NO</text>
  <text x="83" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#405f59">FLYING</text>

