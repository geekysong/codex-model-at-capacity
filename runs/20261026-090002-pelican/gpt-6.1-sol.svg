  <text x="646" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243440">
    <tspan x="646">“My other ride</tspan>
    <tspan x="646" dy="21">is the wind.”</tspan>
