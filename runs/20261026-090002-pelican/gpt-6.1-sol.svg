        <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44"/>
      </g>
      <path d="M0-69a69 69 0 0 1 49 20" fill="none" stroke="#e8ab32" stroke-width="5"/>
      <circle r="9" fill="#f1b43d" stroke="#243440" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
