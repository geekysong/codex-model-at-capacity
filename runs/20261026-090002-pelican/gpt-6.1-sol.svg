  <rect y="521" width="800" height="79" fill="#fff6df"/>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#243440">He traded his wings for a company bike. Same peanuts.</text>
