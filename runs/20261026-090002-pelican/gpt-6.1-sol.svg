<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican in a business tie rides a tiny bicycle with a fish in its enormous bill pouch. The wheels spin and the pelican bobs as it pedals.</desc>
  <defs>
    <pattern id="pavement" width="100" height="20" patternUnits="userSpaceOnUse">
      <path d="M10 10h35" stroke="#fff4cf" stroke-width="4" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#f8eed7" stroke="#243440" stroke-width="12"/>
