  <path d="M0 454 H800" stroke="#5c9c48" stroke-width="8" stroke-dasharray="35 20"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="400" y="65" text-anchor="middle" font-size="38" font-weight="900" fill="#17384a">PELICAN PEDALS PAST COMMON SENSE</text>
    <text x="400" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#315b68">“Why fly when you can wobble majestically?”</text>
  </g>

