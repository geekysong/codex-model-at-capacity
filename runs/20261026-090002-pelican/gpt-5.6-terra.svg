  <g font-family="Arial, Helvetica, sans-serif" fill="#17384a">
    <text x="400" y="495" text-anchor="middle" font-size="25" font-weight="900">A BEAK, TWO WHEELS, ZERO AERODYNAMICS.</text>
    <text x="400" y="525" text-anchor="middle" font-size="16" font-weight="700">The city council called it “multimodal transportation.” The pelican called it lunch delivery.</text>
