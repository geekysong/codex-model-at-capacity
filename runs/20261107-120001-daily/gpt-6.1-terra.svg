<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Robot path on a 5 by 5 grid</title>
  <desc id="desc">The robot starts in row 1, column 1 facing right and finishes in row 3, column 4 facing right.</desc>
  <rect width="600" height="400" fill="white"/>

  <g fill="#d9efff">
    <rect x="150" y="35" width="60" height="60"/>
    <rect x="210" y="35" width="60" height="60"/>
    <rect x="270" y="35" width="60" height="60"/>
    <rect x="270" y="95" width="60" height="60"/>
    <rect x="270" y="155" width="60" height="60"/>
    <rect x="330" y="155" width="60" height="60"/>
  </g>

  <g fill="none" stroke="#475569" stroke-width="1.5">
    <rect x="150" y="35" width="300" height="300"/>
    <path d="M210 35V335 M270 35V335 M330 35V335 M390 35V335"/>
    <path d="M150 95H450 M150 155H450 M150 215H450 M150 275H450"/>
  </g>

  <polyline points="180,65 240,65 300,65 300,125 300,185 360,185"
            fill="none" stroke="#d62828" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-label="Robot at start, facing right">
    <rect x="163" y="50" width="30" height="30" rx="5" fill="#334155" stroke="white" stroke-width="2"/>
    <circle cx="183" cy="58" r="2" fill="white"/>
    <circle cx="183" cy="72" r="2" fill="white"/>
    <path d="M172 65H190 M185 60L190 65L185 70" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="360" cy="185" r="10" fill="#16803c" stroke="white" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="15" fill="#1e293b">
    <text x="465" y="166">Final position</text>
    <text x="465" y="189">Row 3, Column 4</text>
    <text x="465" y="212">Facing: Right</text>
  </g>

  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-11-07 12:04:17 SGT (UTC+08:00)</text>
</svg>