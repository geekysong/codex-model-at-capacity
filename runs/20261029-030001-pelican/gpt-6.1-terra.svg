    .wheel{fill:none;stroke:#24313b;stroke-width:8}
    .spoke{stroke:#6b7d87;stroke-width:3}
    .label{font-family:Arial,sans-serif;fill:#24313b}
  </style>

  <rect width="800" height="600" fill="#dff4ff"/>
