<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A determined pelican cycles with an enormous pouch full of fish, beneath a claim that delivery costs are going down. Bicycle wheels spin and the pelican bobs in a seamless loop.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M2 4h2M12 13h2" stroke="#decfae" stroke-width="1" opacity=".35"/>
    </pattern>
    <g id="wheel">
      <circle r="73" fill="#fff7df" stroke="#263741" stroke-width="10"/>
      <circle r="62" fill="none" stroke="#bdad88" stroke-width="2"/>
      <g stroke="#789099" stroke-width="2">
        <path d="M0-64V64M-64 0H64M-45-45L45 45M-45 45L45-45M-24-59L24 59M-59-24L59 24M-59 24L59-24M-24 59L24-59"/>
      </g>
      <path d="M-10-68H10" stroke="#f27645" stroke-width="6" stroke-linecap="round"/>
      <circle r="8" fill="#263741"/>
    </g>
    <g id="fish">
      <path d="M-20 0Q0-22 23 0Q0 21-20 0L-32-12V12Z" fill="#73bac0" stroke="#263741" stroke-width="2.5"/>
      <circle cx="13" cy="-2" r="2.5" fill="#263741"/>
      <path d="M2-10L-3-18L12-10" fill="#73bac0" stroke="#263741" stroke-width="2"/>
    </g>
  </defs>

  <path fill="#fff3d6" d="M0 0h800v600H0z"/>
  <path fill="url(#paper)" d="M0 0h800v600H0z"/>

  <text x="400" y="56" text-anchor="middle" font-family="sans-serif" font-size="39" font-weight="900" letter-spacing="2" fill="#263741">THE PELICAN EXPRESS</text>
  <path d="M90 73H710" stroke="#e97440" stroke-width="5"/>
  <text x="400" y="102" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#525956">“We cut delivery costs. He swallowed the workload.”</text>

  <g fill="#e2dfc8">
    <path d="M0 392V322h48v-42h54v112M117 392v-72h56v-35h35v107M654 392V281h53v39h42v72M757 392V307h43v85"/>
  </g>
  <path d="M0 464Q210 455 400 464T800 464V515H0Z" fill="#e3d2ac"/>
  <path d="M32 489h84m51 0h84m51 0h84m51 0h84m51 0h84m51 0h84" stroke="#fff6dd" stroke-width="5"/>
  <ellipse cx="401" cy="473" rx="249" ry="12" fill="#b5a585" opacity=".35"/>

  <!-- A corporate promise, helpfully attached to the actual worker. -->
  <g transform="rotate(-5 171 210)">
    <path d="M173 231L185 362" stroke="#263741" stroke-width="6"/>
    <rect x="66" y="151" width="210" height="92" rx="9" fill="#e87542" stroke="#263741" stroke-width="4"/>
    <text x="171" y="179" text-anchor="middle" fill="#fff9e7" font-family="sans-serif" font-weight="900" font-size="19">LEAN DELIVERY</    text>
    <text x="171" y="205" text-anchor="middle" fill="#fff9e7" font-family="sans-serif" font-weight="bold" font-size="16">ONE BIRD.</text>
    <text x="171" y="227" text-anchor="middle" fill="#fff9e7" font-family="sans-serif" font-weight="bold" font-size="16">ALL THE FISH.</text>
  </g>

  <!-- Wheels rotate independently of the stationary frame. -->
  <g transform="translate(240 395)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(575 395)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 395L328 290L389 395H240L358 322H530L389 395M530 322L575 395M328 290L358 322" stroke="#263741" stroke-width="13"/>
    <path d="M240 395L328 290L389 395H240L358 322H530L389 395M530 322L575 395M328 290L358 322" stroke="#df5945" stroke-width="7"/>
    <path d="M328 290L319 270M530 322L510 266L537 253" stroke="#263741" stroke-width="8"/>
    <path d="M299 270H342M534 253L550 257" stroke="#263741" stroke-width="11"/>
    <path d="M240 313Q188 313 167 359M575 313Q633 313 654 363" stroke="#e87542" stroke-width="6"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <!-- Far foot and leg -->
    <path d="M370 280Q419 314 411 353L370 393" fill="none" stroke="#be8435" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M370 280Q419 314 411 353L370 393;M370 280Q386 328 364 351L407 398;M370 280Q419 314 411 353L370 393" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <!-- Tail, body and neck -->
    <path d="M293 257L256 242L280 278L258 282L307 301Z" fill="#fffdf1" stroke="#263741" stroke-width="4" stroke-linejoin="round"/>
    <path d="M297 225Q320 184 373 204Q407 224 404 263Q400 294 358 300Q301 308 284 276Q278 254 297 225Z" fill="#fffdf1" stroke="#263741" stroke-width="4"/>
    <path d="M311 240Q341 222 376 251Q355 281 315 271" fill="#dce4df" stroke="#263741" stroke-width="3"/>
    <path d="M374 222Q396 192 394 167Q390 141 410 134Q434 128 447 148Q455 164 440 185Q424 211 427 240" fill="#fffdf1" stroke="#263741" stroke-width="4"/>
    <!-- Comically enormous throat pouch -->
    <path d="M439 171L609 181Q593 286 490 273Q443 261 430 194Z" fill="#f4bd56" stroke="#263741" stroke-width="4"/>
    <path d="M456 202Q494 244 572 211" fill="none" stroke="#d99335" stroke-width="3"/>
    <g>
      <use href="#fish" transform="translate(480 211) rotate(20) scale(.75)"/>
      <use href="#fish" transform="translate(542 228) rotate(-16) scale(.75)"/>
      <use href="#fish" transform="translate(521 187) rotate(8) scale(.65)"/>
    </g>
    <path d="M437 160Q514 150 624 178L440 184Z" fill="#f39738" stroke="#263741" stroke-width="4" stroke-linejoin="round"/>
    <path d="M454 174L600 178" stroke="#fff0b0" stroke-width="3"/>
    <!-- Face: exhausted, but still employed -->
    <ellipse cx="428" cy="151" rx="10" ry="12" fill="white" stroke="#263741" stroke-width="3"/>
    <circle cx="432" cy="154" r="4" fill="#263741"/>
    <path d="M416 136L437 141" stroke="#263741" stroke-width="4" stroke-linecap="round"/>
    <path d="M397 142L385 129M400 137L398 120M404 136L412 122" stroke="#263741" stroke-width="3" stroke-linecap="round"/>
    <path d="M452 130Q463 111 467 130Q468 140 459 141Z" fill="#70bdcc"/>
    <!-- Wing gripping handlebar -->
    <path d="M373 236Q421 255 451 268L514 262" fill="none" stroke="#263741" stroke-width="17" stroke-linecap="round"/>
    <path d="M373 236Q421 255 451 268L509 262" fill="none" stroke="#e5e9de" stroke-width="10" stroke-linecap="round"/>
    <path d="M502 256L519 258M503 264L519 265" stroke="#263741" stroke-width="3" stroke-linecap="round"/>
    <!-- Near leg pedals -->
    <path d="M346 290Q333 333 365 350L409 398" fill="none" stroke="#eaa541" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M346 290Q333 333 365 350L409 398;M346 290Q399 311 410 352L370 393;M346 290Q333 333 365 350L409 398" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="389" cy="395" r="17" fill="#fff3d6" stroke="#263741" stroke-width="5"/>
  <g transform="translate(389 395)">
    <g stroke="#263741" stroke-width="5" stroke-linecap="round">
      <path d="M-22 0H22"/>
      <path d="M-30 0H-15M15 0H30" stroke-width="8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g font-family="sans-serif" fill="#263741">
    <path d="M645 182Q638 166 650 154H752Q770 154 770 173V210Q770 226 752 226H659L637 242L644 217Q636 207 645 182Z" fill="#fffdf1" stroke="#263741" stroke-width="3"/>
    <text x="703" y="181" text-anchor="middle" font-size="16" font-weight="bold">My pension?</text>
    <text x="703" y="206" text-anchor="middle" font-size="16">Small fry.</text>
  </g>

  <path d="M30 520H770" stroke="#263741" stroke-width="2"/>
  <text x="400" y="548" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263741">A full pouch. A flat wage. A very long commute.</text>
  <text x="400" y="579" text-anchor="middle" font-family="monospace" font-size="16" fill="#525956">2026-11-01 00:31:09 SGT (UTC+08:00)</text>
</svg>