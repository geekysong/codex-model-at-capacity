<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Pelican Pedal-Off</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe4ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="1" stop-color="#3d4148"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="105" r="48" fill="#ffd86b" opacity=".9"/>
  <path d="M0 355 Q120 300 240 350 T480 340 T800 345 V430 H0Z" fill="#8bc58b"/>
  <path d="M0 410 Q170 380 340 415 T680 405 T800 420 V600 H0Z" fill="url(#road)"/>
  <path d="M0 485 H800" stroke="#e9d66b" stroke-width="8" stroke-dasharray="36 24" opacity=".9"/>

  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="900" fill="#17324d" stroke="#fff" stroke-width="5" paint-order="stroke">
    THE GREAT PELICAN PEDAL-OFF
  </text>
  <text x="400" y="94" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#27465b">
    “He has a beak for speed and absolutely no sense of traffic rules.”
  </text>

  <g filter="url(#shadow)">
    <!-- bicycle frame -->
    <g stroke="#e94f37" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M225 442 L315 300 L425 442 L225 442 L365 442 L315 300"/>
      <path d="M425 442 L500 300"/>
      <path d="M472 300 H528"/>
      <path d="M500 300 L520 270"/>
      <path d="M235 442 L205 415"/>
      <path d="M205 415 H240"/>
    </g>

    <!-- wheels -->
    <g fill="none" stroke="#17242d" stroke-width="11">
      <g>
        <circle cx="225" cy="442" r="68"/>
        <g stroke="#8ed7e8" stroke-width="3">
          <path d="M225 374V510 M157 442H293 M177 394L273 490 M273 394L177 490"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 225 442" to="360 225 442" dur="2s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="500" cy="442" r="68"/>
        <g stroke="#8ed7e8" stroke-width="3">
          <path d="M500 374V510 M432 442H568 M452 394L548 490 M548 394L452 490"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 500 442" to="360 500 442" dur="2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- crank and pedals -->
    <g transform="translate(365 442)">
      <circle r="13" fill="#ffd166" stroke="#17242d" stroke-width="5"/>
      <path d="M0 0 L-34 -22 M0 0 L34 22" stroke="#17242d" stroke-width="7"/>
      <path d="M-48 -25 H-25 M25 25 H48" stroke="#17242d" stroke-width="7" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- pelican body bobbing -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="1.2s" repeatCount="indefinite"/>
      <!-- body -->
      <ellipse cx="356" cy="245" rx="89" ry="103" fill="#f5f1e8" stroke="#243642" stroke-width="6"/>
      <path d="M303 278 Q350 320 411 277 Q389 360 333 342 Q305 323 303 278Z" fill="#f7a641" stroke="#243642" stroke-width="6"/>
      <path d="M331 330 L320 399 M391 326 L408 398" stroke="#f7a641" stroke-width="16" stroke-linecap="round"/>
      <path d="M320 398 l-22 9 M408 398 l22 9" stroke="#243642" stroke-width="7" stroke-linecap="round"/>
      <!-- wing -->
      <path d="M294 225 Q245 255 277 322 Q305 303 327 266Z" fill="#d8e3e5" stroke="#243642" stroke-width="6"/>
      <path d="M280 277 Q300 290 313 300" stroke="#9eb3b9" stroke-width="5" fill="none"/>
      <!-- head -->
      <circle cx="355" cy="145" r="67" fill="#f5f1e8" stroke="#243642" stroke-width="6"/>
      <!-- crest -->
      <path d="M318 93 Q340 61 360 91 Q383 62 397 103" fill="#f5f1e8" stroke="#243642" stroke-width="6"/>
      <!-- beak -->
      <path d="M375 150 Q493 133 555 172 Q491 208 374 183 Q353 170 375 150Z" fill="#f5a33b" stroke="#243642" stroke-width="6"/>
      <path d="M390 177 Q468 180 535 172" stroke="#c36d25" stroke-width="4" fill="none"/>
      <circle cx="378" cy="137" r="9" fill="#243642"/>
      <circle cx="381" cy="134" r="3" fill="#fff"/>
      <!-- helmet -->
      <path d="M300 126 Q323 73 382 83 Q413 90 427 126Z" fill="#4f8fe8" stroke="#243642" stroke-width="6"/>
      <path d="M304 124 H429" stroke="#243642" stroke-width="6"/>
      <!-- handlebar grip interaction -->
      <path d="M420 230 Q466 241 500 300" stroke="#f5f1e8" stroke-width="15" fill="none" stroke-linecap="round"/>
      <circle cx="500" cy="300" r="8" fill="#243642"/>
    </g>
  </g>

  <text x="400" y="542" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">
    Officially classified as “beak-powered transportation.”
  </text>
  <text x="400" y="582" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#17324d">
    2026-10-29 15:00:07 SGT (UTC+08:00)
  </text>
</svg>