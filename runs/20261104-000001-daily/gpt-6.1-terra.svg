<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Five by five shaded-cell puzzle solution</title>
  <desc id="desc">Each row and column contains exactly two shaded cells, and no shaded cells share an edge.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="30" y="24" fill="#17243a" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Shaded-cell solution</text>

  <g transform="translate(30 35)">
    <rect width="300" height="300" fill="#ffffff"/>
    <g fill="#276b83">
      <rect x="0" y="0" width="60" height="60"/>
      <rect x="120" y="0" width="60" height="60"/>
      <rect x="60" y="60" width="60" height="60"/>
      <rect x="180" y="60" width="60" height="60"/>
      <rect x="0" y="120" width="60" height="60"/>
      <rect x="240" y="120" width="60" height="60"/>
      <rect x="60" y="180" width="60" height="60"/>
      <rect x="180" y="180" width="60" height="60"/>
      <rect x="120" y="240" width="60" height="60"/>
      <rect x="240" y="240" width="60" height="60"/>
    </g>
    <g stroke="#65758a" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="300" height="300"/>
      <path d="M60 0v300 M120 0v300 M180 0v300 M240 0v300 M0 60h300 M0 120h300 M0 180h300 M0 240h300"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
      <g fill="#ffffff">
        <text x="30" y="30">A1</text><text x="150" y="30">A3</text>
        <text x="90" y="90">B2</text><text x="210" y="90">B4</text>
        <text x="30" y="150">C1</text><text x="270" y="150">C5</text>
        <text x="90" y="210">D2</text><text x="210" y="210">D4</text>
        <text x="150" y="270">E3</text><text x="270" y="270">E5</text>
      </g>
      <g fill="#34445a">
        <text x="90" y="30">A2</text><text x="210" y="30">A4</text><text x="270" y="30">A5</text>
        <text x="30" y="90">B1</text><text x="150" y="90">B3</text><text x="270" y="90">B5</text>
        <text x="90" y="150">C2</text><text x="150" y="150">C3</text><text x="210" y="150">C4</text>
        <text x="30" y="210">D1</text><text x="150" y="210">D3</text><text x="270" y="210">D5</text>
        <text x="30" y="270">E1</text><text x="90" y="270">E2</text><text x="210" y="270">E4</text>
      </g>
    </g>
  </g>

  <g font-family="Arial, sans-serif" fill="#17243a">
    <text x="360" y="65" font-size="17" font-weight="bold">Shaded cells</text>
    <text x="360" y="98" font-size="16">A1, A3, B2, B4,</text>
    <text x="360" y="124" font-size="16">C1, C5, D2, D4,</text>
    <text x="360" y="150" font-size="16">E3, E5</text>
    <text x="360" y="190" font-size="16" font-weight="bold">Total: 10</text>
    <text x="360" y="230" font-size="14">2 per row and column</text>
    <text x="360" y="252" font-size="14">No shared edges</text>
  </g>

  <path d="M30 355H570" stroke="#cbd5e1"/>
  <text x="30" y="380" fill="#34445a" font-family="Arial, sans-serif" font-size="14">2026-11-04 00:04:12 SGT (UTC+08:00)</text>
</svg>