<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICAN PEDAL-OFF</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while a fish cheers from the basket.</desc>
  <defs>
