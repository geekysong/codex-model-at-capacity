<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Power Ride</title>
  <desc>A satirical pelican pedals a bicycle while proudly claiming it is commuting sustainably.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636d"/>
      <stop offset="1" stop-color="#303740"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#24313a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#263238;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#263238}
      .small{font-size:18px;font-weight:bold}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="90" r="48" fill="#ffd166" opacity=".9"/>
  <path d="M0 390 Q110 330 220 390 T440 390 T660 390 T900 390 V600 H0Z" fill="#a7d88a"/>
  <path d="M0 455 Q200 425 400 455 T800 455 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 H800" stroke="#f8e16c" stroke-width="8" stroke-dasharray="50 28"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#173042">
    PELICAN POWER RIDE!
  </text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="21" font-weight="700">
    “Why fly when you can wobble sustainably?”
  </text>

  <g filter="url(#shadow)">
    <g id="bike">
      <g id="wheels">
        <circle cx="245" cy="430" r="78" fill="#edf4f5" class="ink"/>
        <circle cx="575" cy="430" r="78" fill="#edf4f5" class="ink"/>
        <g fill="none" stroke="#6b7b84" stroke-width="3">
          <circle cx="245" cy="430" r="68"/>
          <circle cx="575" cy="430" r="68"/>
          <path d="M245 352V508 M167 430H323 M190 375L300 485 M190 485L300 375"/>
          <path d="M575 352V508 M497 430H653 M520 375L630 485 M520 485L630 375"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 410 430" to="360 410 430" dur="2s" repeatCount="indefinite"/>
      </g>
      <path d="M245 430 L350 330 L470 430 L245 430 M350 330 L390 430 M350 330 L405 300" fill="none" stroke="#d94f4f" stroke-width="10" stroke-linejoin="round"/>
      <path d="M470 430 L575 430 M405 300 L438 300" fill="none" stroke="#d94f4f" stroke-width="10" stroke-linecap="round"/>
      <circle cx="390" cy="430" r="17" fill="#f7c948" class="ink"/>
      <path d="M390 430 L365 397 M390 430 L421 458" stroke="#263238" stroke-width="8" stroke-linecap="round"/>
      <path d="M405 300 L430 278" stroke="#263238" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="385" cy="250" rx="78" ry="92" fill="#f4f1e8" class="ink"/>
      <path d="M328 255 Q280 220 295 160 Q340 175 370 220Z" fill="#dfe8e8" class="ink"/>
      <path d="M445 235 Q500 195 545 220 Q505 270 442 274Z" fill="#f7a84b" class="ink"/>
      <path d="M445 235 Q500 220 545 220 Q510 250 448 255Z" fill="#ef8240"/>
      <circle cx="409" cy="188" r="9" fill="#263238"/>
      <path d="M360 315 Q405 350 446 309" fill="none" stroke="#263238" stroke-width="6"/>
      <path d="M356 325 Q332 350 315 382 M430 326 Q455 350 477 382" fill="none" stroke="#f7a84b" stroke-width="16" stroke-linecap="round"/>
      <path d="M315 382 L343 394 M477 382 L505 394" fill="none" stroke="#263238" stroke-width="6" stroke-linecap="round"/>
      <path d="M355 250 Q385 270 420 250" fill="none" stroke="#b8c5c8" stroke-width="12" stroke-linecap="round"/>
      <path d="M370 342 L356 389 M420 342 L439 389" stroke="#f7a84b" stroke-width="11" stroke-linecap="round"/>
      <circle cx="356" cy="389" r="8" fill="#263238"/>
      <circle cx="439" cy="389" r="8" fill="#263238"/>
    </g>
  </g>

  <g transform="translate(585 150) rotate(7)">
    <path d="M0 30 Q70 0 145 30 L130 95 Q70 115 10 92Z" fill="#fff8dc" class="ink"/>
    <text x="72" y="53" text-anchor="middle" class="label" font-size="17" font-weight="900">HONK IF</text>
    <text x="72" y="77" text-anchor="middle" class="label" font-size="17" font-weight="900">YOU SEE</text>
    <text x="72" y="99" text-anchor="middle" class="label" font-size="17" font-weight="900">MY BUS!</text>
    <path d="M10 93 L-20 120 L35 101" fill="#fff8dc" class="ink"/>
  </g>

  <text x="400" y="560" text-anchor="middle" class="label small">
    2026-10-28 05:00:01 SGT (UTC+08:00)
  </text>
</svg>