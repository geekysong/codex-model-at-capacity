<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICAN PEDAL PARADE</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666b78"/>
      <stop offset="1" stop-color="#343843"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#20232b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#20232b; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#20232b; }
      .bold { font-weight:900; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="48" fill="#fff5a8" opacity=".9"/>
  <path d="M0 380 Q130 330 260 380 T520 380 T800 380 V460 H0Z" fill="#82b86f"/>
  <path d="M0 430 Q170 390 340 430 T800 430 V560 H0Z" fill="url(#road)"/>
  <path d="M0 500 H800" stroke="#e7d98c" stroke-width="8" stroke-dasharray="42 30"/>
  <path d="M95 342 q18-22 36 0 q18-22 36 0" fill="none" class="ink" stroke-width="4"/>
  <path d="M610 280 q18-22 36 0 q18-22 36 0" fill="none" class="ink" stroke-width="4"/>

  <text x="400" y="62" text-anchor="middle" class="label bold" font-size="34">THE GREAT PELICAN PEDAL PARADE</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="18">“Why fly when you can wobble dramatically?”</text>

  <g filter="url(#shadow)">
    <g id="bike">
      <g id="rearWheel">
        <circle cx="255" cy="455" r="78" fill="#f7f7f7" class="ink"/>
        <circle cx="255" cy="455" r="11" fill="#f3b23c" class="ink"/>
        <g stroke="#59606d" stroke-width="3">
          <path d="M255 377 V533 M177 455 H333 M200 400 L310 510 M310 400 L200 510"/>
        </g>
      </g>
      <g id="frontWheel">
        <circle cx="590" cy="455" r="78" fill="#f7f7f7" class="ink"/>
        <circle cx="590" cy="455" r="11" fill="#f3b23c" class="ink"/>
        <g stroke="#59606d" stroke-width="3">
          <path d="M590 377 V533 M512 455 H668 M535 400 L645 510 M645 400 L535 510"/>
        </g>
      </g>

      <path d="M255 455 L350 350 L475 455 L255 455 L420 455 L350 350" fill="none" stroke="#d94b45" stroke-width="10"/>
      <path d="M475 455 L590 455 L555 330" fill="none" stroke="#d94b45" stroke-width="10"/>
      <path d="M535 330 H585" stroke="#20232b" stroke-width="8" stroke-linecap="round"/>
      <path d="M338 350 H390" stroke="#20232b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="420" cy="455" r="18" fill="#f3b23c" class="ink"/>
      <path d="M420 455 L385 420 M420 455 L455 490" stroke="#20232b" stroke-width="8" stroke-linecap="round"/>
      <path d="M380 417 h-34 M458 491 h34" stroke="#20232b" stroke-width="8" stroke-linecap="round"/>
    </g>

    <g id="pelican" transform="translate(0 0)">
      <ellipse cx="407" cy="278" rx="91" ry="111" fill="#f4f1e8" class="ink"/>
      <path d="M345 250 Q292 238 280 191 Q331 170 389 206 Q411 221 421 247 Q386 260 345 250Z" fill="#f6a43a" class="ink"/>
      <path d="M282 191 Q255 181 236 157 Q283 143 336 161 Q305 176 282 191Z" fill="#d67c26" class="ink"/>
      <ellipse cx="393" cy="192" rx="39" ry="45" fill="#f4f1e8" class="ink"/>
      <circle cx="405" cy="178" r="9" fill="#20232b"/>
      <path d="M425 176 q13-10 24 1" fill="none" class="ink" stroke-width="4"/>
      <path d="M367 280 Q405 317 443 280" fill="none" stroke="#d6d0c2" stroke-width="13"/>
      <path d="M377 365 Q395 387 419 365" fill="none" class="ink"/>
      <path d="M374 363 L342 425" class="ink" fill="none"/>
      <path d="M438 363 L467 425" class="ink" fill="none"/>
      <path d="M340 425 h-27 M466 425 h27" class="ink" fill="none"/>
      <path d="M353 250 Q322 289 354 335" fill="#ddd7ca" class="ink"/>
      <path d="M461 250 Q496 286 465 335" fill="#ddd7ca" class="ink"/>

      <g transform="translate(0 0)">
        <path d="M350 220 Q431 185 520 230 Q541 241 531 262 Q521 280 494 270 L383 246Z" fill="#f6a43a" class="ink"/>
        <path d="M495 229 Q548 208 579 227 Q557 252 514 256Z" fill="#7bb84a" class="ink"/>
        <path d="M515 229 Q557 219 587 240" fill="none" stroke="#20232b" stroke-width="5"/>
      </g>
    </g>

    <g id="fish" transform="translate(0 0)">
      <path d="M530 213 Q604 150 694 205 Q725 224 694 248 Q605 300 530 245Z" fill="#70b8d8" class="ink"/>
      <path d="M690 205 l42-28 l-12 43 l18 35 l-48-7Z" fill="#4d91b3" class="ink"/>
      <circle cx="619" cy="211" r="7" fill="#20232b"/>
      <path d="M587 248 q25 10 49-2" fill="none" class="ink" stroke-width="4"/>
      <text x="610" y="188" text-anchor="middle" class="label bold" font-size="17">EMERGENCY</text>
      <text x="610" y="207" text-anchor="middle" class="label bold" font-size="17">SNACK</text>
    </g>
  </g>

  <g class="label">
    <path d="M155 225 Q205 177 270 181" fill="none" stroke="#20232b" stroke-width="3"/>
    <rect x="44" y="140" width="170" height="72" rx="16" fill="#fff" class="ink"/>
    <text x="129" y="169" text-anchor="middle" font-size="19" class="bold">“I’m on a</text>
    <text x="129" y="193" text-anchor="middle" font-size="19" class="bold">strict fish diet!”</text>
  </g>

  <g class="label">
    <rect x="585" y="330" width="158" height="58" rx="14" fill="#fff4b8" class="ink"/>
    <text x="664" y="355" text-anchor="middle" font-size="16" class="bold">HONK IF YOU</text>
    <text x="664" y="376" text-anchor="middle" font-size="16" class="bold">FEAR LEGS DAY</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 255 455" to="360 255 455" dur="2.2s" repeatCount="indefinite"/>
    <use href="#rearWheel"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 590 455" to="360 590 455" dur="2.2s" repeatCount="indefinite"/>
    <use href="#frontWheel"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 5;0 0" dur="1.1s" repeatCount="indefinite"/>
    <use href="#pelican"/>
    <use href="#fish"/>
  </g>

  <text x="400" y="552" text-anchor="middle" class="label bold" font-size="20">Pelican on a bicycle: feathered transport, questionable steering.</text>
  <text x="400" y="582" text-anchor="middle" class="label" font-size="14">2026-10-27 14:02:27 SGT (UTC+08:00)</text>
</svg>