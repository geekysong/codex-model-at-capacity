<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedaler</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly large briefcase.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e7f8d9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#70777d"/>
      <stop offset="1" stop-color="#3f454a"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#23343b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#263238; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial, Helvetica, sans-serif; fill:#263238; }
      .wheelSpin { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .bob { animation:bob 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom; }
      .pedal { animation:pedal .75s linear infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0) rotate(-1deg); } 50% { transform:translateY(-6px) rotate(1deg); } }
      @keyframes pedal { to { transform:rotate(360deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff7b2" opacity=".85"/>
  <path d="M0 330 Q130 275 250 330 T500 325 T800 320 V430 H0Z" fill="#a7d68e"/>
  <path d="M0 388 Q150 350 300 390 T600 382 T800 390 V470 H0Z" fill="#72b879"/>
  <path d="M0 438 Q180 405 360 440 T800 430 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#e8d66e" stroke-width="8" stroke-dasharray="58 35" opacity=".9"/>
  <path d="M92 370 q18-32 36 0 M108 370 q18-32 36 0 M700 360 q18-32 36 0 M716 360 q18-32 36 0" fill="none" class="ink" stroke="#4f934e" stroke-width="7"/>

  <g class="label" font-weight="900">
    <text x="400" y="66" text-anchor="middle" font-size="42" fill="#173b4d">THE PELICAN PEDALER</text>
    <text x="400" y="98" text-anchor="middle" font-size="20" fill="#8d2e25">“Delivering fish, paperwork, and questionable policy.”</text>
  </g>

  <g filter="url(#shadow)">
    <g class="wheelSpin">
      <circle cx="255" cy="455" r="70" fill="#d9eef2" class="ink"/>
      <circle cx="255" cy="455" r="10" fill="#263238"/>
      <path d="M255 385V525 M185 455H325 M206 406L304 504 M304 406L206 504" stroke="#55737d" stroke-width="3"/>
    </g>
    <g class="wheelSpin">
      <circle cx="555" cy="455" r="70" fill="#d9eef2" class="ink"/>
      <circle cx="555" cy="455" r="10" fill="#263238"/>
      <path d="M555 385V525 M485 455H625 M506 406L604 504 M604 406L506 504" stroke="#55737d" stroke-width="3"/>
    </g>

    <path d="M255 455 L350 360 L455 455 L555 455 L455 455 L405 370 L350 360" fill="none" class="ink" stroke="#d94f3d" stroke-width="10"/>
    <path d="M350 360 L315 315 M455 455 L475 320 M475 320 L525 320" fill="none" class="ink" stroke="#263238" stroke-width="7"/>
    <circle cx="455" cy="455" r="18" fill="#f2b84b" class="ink"/>
    <g class="pedal">
      <path d="M455 455 L425 425 M455 455 L485 485" fill="none" class="ink" stroke="#263238" stroke-width="6"/>
      <circle cx="425" cy="425" r="7" fill="#263238"/>
      <circle cx="485" cy="485" r="7" fill="#263238"/>
    </g>

    <g class="bob">
      <ellipse cx="411" cy="330" rx="73" ry="91" fill="#f4f0d2" class="ink"/>
      <path d="M372 345 Q411 376 455 343 L449 399 Q410 420 370 394Z" fill="#e3a73f" class="ink"/>
      <path d="M368 276 Q410 238 452 274 L466 309 Q412 292 360 312Z" fill="#f8f4df" class="ink"/>
      <ellipse cx="410" cy="255" rx="57" ry="46" fill="#f4f0d2" class="ink"/>
      <path d="M363 259 Q410 280 462 250 L541 273 Q548 284 536 294 L455 292 Q410 310 363 280Z" fill="#ef8e3b" class="ink"/>
      <circle cx="428" cy="248" r="7" fill="#263238"/>
      <path d="M409 220 Q420 203 437 213" fill="none" class="ink" stroke="#d94f3d" stroke-width="5"/>
      <path d="M378 328 Q348 352 334 380 M446 324 Q474 350 490 377" fill="none" class="ink" stroke="#f4f0d2" stroke-width="21"/>
      <circle cx="333" cy="383" r="10" fill="#ef8e3b" class="ink"/>
      <circle cx="492" cy="380" r="10" fill="#ef8e3b" class="ink"/>
      <path d="M380 396 Q410 410 439 396" fill="none" class="ink" stroke="#263238" stroke-width="5"/>
      <path d="M385 287 Q405 300 426 287" fill="none" stroke="#263238" stroke-width="4"/>
    </g>

    <g transform="rotate(-8 565 320)">
      <rect x="535" y="275" width="112" height="86" rx="8" fill="#7656a8" class="ink"/>
      <path d="M562 275 Q590 245 620 275" fill="none" class="ink" stroke="#7656a8" stroke-width="15"/>
      <text x="591" y="318" text-anchor="middle" font-size="17" font-weight="900" class="label" fill="#fff">URGENT</text>
      <text x="591" y="340" text-anchor="middle" font-size="13" font-weight="900" class="label" fill="#fff">FISH + FORMS</text>
    </g>
  </g>

  <g class="label">
    <path d="M150 180 Q205 135 265 180" fill="none" stroke="#263238" stroke-width="4"/>
    <text x="205" y="150" text-anchor="middle" font-size="18" font-weight="700">WHEN THE BOSS SAYS</text>
    <text x="205" y="172" text-anchor="middle" font-size="18" font-weight="700">“CIRCLE BACK”...</text>
    <path d="M255 185 L330 245" stroke="#263238" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#263238"/>
    </marker>
  </defs>

  <rect x="0" y="555" width="800" height="45" fill="#263238"/>
  <text x="400" y="584" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2026-10-27 14:00:59 SGT (UTC+08:00)</text>
</svg>