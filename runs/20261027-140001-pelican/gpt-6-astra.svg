<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon pelican riding a bicycle.</desc>
  <defs>
    <style>
      .ink{stroke:#17212b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#17212b}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#bdefff"/>
  <rect y="430" width="800" height="110" fill="#83d36b"/>
  <path d="M0 455 Q120 420 240 455 T480 455 T720 455 T960 455" fill="none" stroke="#4b9e52" stroke-width="8"/>

  <g class="label" text-anchor="middle">
    <text x="400" y="62" font-size="42" font-weight="900" fill="#e85d3f" stroke="#fff" stroke-width="3" paint-order="stroke">THE GREAT PEDESTRIAN PELICAN</text>
    <text x="400" y="98" font-size="20" font-weight="700">“Why walk when you can wobble with style?”</text>
  </g>

  <g filter="url(#shadow)">
    <!-- bicycle -->
    <g fill="none" class="ink">
      <circle cx="255" cy="430" r="78" stroke="#263746" stroke-width="10">
        <animateTransform attributeName="transform" type="rotate" from="0 255 430" to="360 255 430" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="585" cy="430" r="78" stroke="#263746" stroke-width="10">
        <animateTransform attributeName="transform" type="rotate" from="0 585 430" to="360 585 430" dur="2s" repeatCount="indefinite"/>
      </circle>
      <path d="M255 430 L355 300 L470 430 L255 430 M355 300 L585 430 M470 430 L535 290 M500 290 L570 290" stroke="#e34f45" stroke-width="9"/>
      <path d="M340 312 L300 282 M526 290 L555 265" stroke="#263746" stroke-width="8"/>
      <circle cx="355" cy="430" r="14" fill="#ffd34e"/>
      <path d="M355 430 L315 398 M355 430 L394 461" stroke="#263746" stroke-width="7"/>
      <path d="M315 398 l-20 2 M394 461 l20 2" stroke="#263746" stroke-width="6"/>
    </g>

    <!-- pelican body bob -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1s" repeatCount="indefinite"/>
      <ellipse cx="410" cy="245" rx="105" ry="88" fill="#f7f3e8" class="ink"/>
      <path d="M350 235 Q300 205 315 145 Q328 93 380 116 Q430 137 416 190" fill="#f7f3e8" class="ink"/>
      <ellipse cx="380" cy="145" rx="24" ry="28" fill="#fff" class="ink"/>
      <circle cx="387" cy="143" r="8" fill="#17212b"/>
      <path d="M330 168 Q270 180 220 156 Q210 150 220 142 Q280 112 343 130 Z" fill="#f6a64b" class="ink"/>
      <path d="M225 147 Q278 163 330 153" fill="none" stroke="#c66a28" stroke-width="5"/>
      <path d="M365 220 Q420 180 480 224 Q495 250 472 274 Q415 300 362 264" fill="#e9dfcf" class="ink"/>
      <path d="M390 275 L380 335 M445 275 L460 335" fill="none" class="ink"/>
      <path d="M370 335 q25 15 40 0 M450 335 q25 15 42 0" fill="none" class="ink"/>
      <!-- wing and comic speech -->
      <path d="M420 235 Q470 205 505 245 Q470 258 430 270" fill="#d9d0c0" class="ink"/>
      <path d="M370 200 Q400 218 425 205" fill="none" class="ink"/>
      <text x="555" y="170" font-size="22" font-weight="900" class="label" transform="rotate(8 555 170)">HONK!</text>
      <path d="M520 180 l25 -18 M530 198 l30 -8" stroke="#e85d3f" stroke-width="5"/>
    </g>
  </g>

  <g class="label" text-anchor="middle">
    <text x="400" y="515" font-size="24" font-weight="800">A beak, two wheels, and absolutely no sense of balance.</text>
    <text x="400" y="570" font-size="16">2026-10-27 14:00:01 SGT (UTC+08:00)</text>
  </g>
</svg>