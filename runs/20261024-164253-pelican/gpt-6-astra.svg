<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>THE GREAT PELICAN COMMUTE</title>
  <desc>A satirical cartoon pelican rides a bicycle while carrying an absurdly large briefcase.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e9f7e9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#707984"/>
      <stop offset="1" stop-color="#424852"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#18232c; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#18232c; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .title { font-family:Impact,Arial Black,sans-serif; font-size:42px; letter-spacing:2px; fill:#fff; stroke:#18232c; stroke-width:3px; paint-order:stroke; }
      .caption { font-family:Arial,sans-serif; font-size:21px; font-weight:700; fill:#18232c; }
      .small { font-family:Arial,sans-serif; font-size:14px; font-weight:700; fill:#fff; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 300 Q120 220 240 295 T480 285 T800 270 L800 390 L0 390Z" fill="#9bc79b"/>
  <path d="M0 350 Q170 305 350 350 T800 330 L800 410 L0 410Z" fill="#73a879"/>
  <rect y="390" width="800" height="210" fill="url(#road)"/>
  <path d="M0 510 L800 510" stroke="#f7d65a" stroke-width="10" stroke-dasharray="70 38"/>
  <g opacity=".75">
    <path d="M70 110 q35-34 70 0 q-35-12-70 0Z" fill="#fff"/>
    <path d="M610 130 q35-34 70 0 q-35-12-70 0Z" fill="#fff"/>
  </g>

  <rect x="55" y="42" width="690" height="78" rx="18" fill="#e85050" class="ink" filter="url(#shadow)"/>
  <text x="400" y="94" text-anchor="middle" class="title">THE GREAT PELICAN COMMUTE</text>

  <g transform="translate(0 8)">
    <!-- briefcase -->
    <g transform="translate(475 245) rotate(9)" filter="url(#shadow)">
      <rect x="0" y="0" width="150" height="105" rx="12" fill="#d47b37" class="ink"/>
      <path d="M52 0v-18q0-12 12-12h22q12 0 12 12V0" fill="none" class="ink"/>
      <path d="M0 48h150" class="thin" fill="none"/>
      <circle cx="120" cy="27" r="7" fill="#f6d85b" class="thin"/>
      <text x="75" y="82" text-anchor="middle" class="small">QUARTERLY</text>
      <text x="75" y="98" text-anchor="middle" class="small">NEST REPORT</text>
    </g>

    <!-- bicycle frame -->
    <g class="ink" fill="none">
      <circle cx="230" cy="450" r="83" stroke-width="8"/>
      <circle cx="545" cy="450" r="83" stroke-width="8"/>
      <path d="M230 450 L335 340 L425 450 L230 450 L385 450 L335 340 L500 340 L545 450"/>
      <path d="M500 340 L535 315"/>
      <path d="M385 450 L405 500"/>
    </g>

    <!-- wheel animation -->
    <g transform="translate(230 450)">
      <g>
        <path d="M0-78V78M-78 0H78M-55-55L55 55M55-55L-55 55" stroke="#b9d1d8" stroke-width="3"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(545 450)">
      <g>
        <path d="M0-78V78M-78 0H78M-55-55L55 55M55-55L-55 55" stroke="#b9d1d8" stroke-width="3"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- handlebars -->
    <path d="M500 340 q18-27 43-25 q16 2 12 14 q-4 11-23 8" fill="none" class="ink"/>
    <path d="M333 340 l-7-25" class="ink"/>

    <!-- pelican body bob -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 5;0 0" dur="1.1s" repeatCount="indefinite"/>
      <!-- tail -->
      <path d="M300 317 q-55-40-80 4 q37 12 76 17" fill="#f6f0d2" class="ink"/>
      <!-- body -->
      <ellipse cx="363" cy="282" rx="78" ry="91" fill="#f8f2d7" class="ink"/>
      <path d="M319 260 q22 24 38 76" fill="none" stroke="#d6cba7" stroke-width="8"/>
      <!-- wing -->
      <path d="M365 245 q45 13 57 61 q-33 15-69-6 q-16-25 12-55Z" fill="#e7ddbd" class="thin"/>
      <path d="M373 265 q23 17 32 35" fill="none" class="thin"/>
      <!-- neck -->
      <path d="M365 214 q-18-56 18-83 q32-22 64 3 q24 20 10 67 l-17 51" fill="#faf5df" class="ink"/>
      <!-- head -->
      <ellipse cx="420" cy="125" rx="54" ry="48" fill="#faf5df" class="ink"/>
      <circle cx="443" cy="111" r="8" fill="#18232c"/>
      <path d="M461 126 q35 0 81 24 q-5 28-40 30 l-68-29Z" fill="#ee9d48" class="ink"/>
      <path d="M461 142 q38 5 73 10" fill="none" class="thin"/>
      <path d="M422 82 q-18-25-3-37 q23 12 29 34" fill="#e85050" class="ink"/>
      <!-- beak joke -->
      <text x="523" y="172" class="caption" transform="rotate(8 523 172)">HONK!</text>
      <!-- feet -->
      <path d="M343 353 q-8 28-8 56" fill="none" class="ink"/>
      <path d="M418 353 q10 25 10 57" fill="none" class="ink"/>
      <path d="M327 410 q18-9 34 0" fill="none" class="ink"/>
      <path d="M414 410 q18-9 34 0" fill="none" class="ink"/>

      <!-- pedaling leg -->
      <g>
        <path d="M355 350 L386 414 L405 450" fill="none" class="ink"/>
        <circle cx="405" cy="450" r="10" fill="#e85050" class="thin"/>
        <path d="M404 450 l42 18" class="thin"/>
        <animateTransform attributeName="transform" type="rotate" values="0 405 450;360 405 450" dur="1.4s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <g transform="translate(0 8)">
    <path d="M120 548 q55-35 110 0" fill="none" stroke="#18232c" stroke-width="5"/>
    <text x="400" y="565" text-anchor="middle" class="caption">“I’m late for work… but at least my bill is paid in fish!”</text>
  </g>
</svg>