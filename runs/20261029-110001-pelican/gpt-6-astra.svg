<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedal Patrol</title>
  <desc>A satirical cartoon pelican rides a bicycle while chasing fishy bureaucracy.</desc>
  <style>
    .ink{stroke:#17212b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#17212b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,sans-serif;fill:#17212b}
    .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
    .rider{animation:bob .7s ease-in-out infinite alternate}
    .fish{animation:swim 2.6s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-5px)}}
    @keyframes swim{to{transform:translateX(24px)}}
  </style>

  <rect width="800" height="600" fill="#bdeeff"/>
  <rect y="410" width="800" height="190" fill="#f8d98b"/>
  <path d="M0 410 Q120 380 240 410 T480 410 T720 410 T960 410" fill="none" stroke="#e5b85d" stroke-width="10"/>
  <circle cx="95" cy="105" r="48" fill="#fff7d6" opacity=".9"/>
  <path d="M40 150 Q90 125 140 150" fill="none" stroke="#fff" stroke-width="12" opacity=".8"/>
  <path d="M640 120 Q690 95 750 120" fill="none" stroke="#fff" stroke-width="12" opacity=".8"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900">PELICAN PEDAL PATROL</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="18" font-weight="700">“Delivering fishy policy at a beakneck speed.”</text>

  <g class="rider">
    <ellipse cx="430" cy="350" rx="92" ry="20" fill="#d7a74f" opacity=".45"/>
    <path d="M365 360 L455 360 L515 305 L405 305 Z" fill="none" class="ink"/>
    <path d="M405 305 L455 360 M455 360 L515 305" fill="none" class="thin"/>
    <g class="wheel">
      <circle cx="365" cy="390" r="66" fill="#f4f7fa" class="ink"/>
      <circle cx="365" cy="390" r="9" fill="#ef6c45" class="ink"/>
      <path d="M365 324V456 M299 390H431 M318 343L412 437 M412 343L318 437" fill="none" class="thin"/>
    </g>
    <g class="wheel">
      <circle cx="555" cy="390" r="66" fill="#f4f7fa" class="ink"/>
      <circle cx="555" cy="390" r="9" fill="#ef6c45" class="ink"/>
      <path d="M555 324V456 M489 390H621 M508 343L602 437 M602 343L508 437" fill="none" class="thin"/>
    </g>
    <path d="M515 305 L545 275" fill="none" class="ink"/>
    <path d="M532 276 Q560 265 584 279" fill="none" class="ink"/>
    <path d="M447 359 q18 12 36 0" fill="none" class="ink"/>
    <circle cx="455" cy="360" r="12" fill="#ef6c45" class="ink"/>
    <path d="M455 360 l-24 20 M455 360 l25 20" fill="none" class="thin"/>
    <path d="M430 330 Q420 285 438 243" fill="none" class="ink"/>
    <path d="M438 243 Q462 205 505 224 Q537 239 521 274 Q505 302 470 292 L450 333 Z" fill="#f6f0dd" class="ink"/>
    <path d="M505 224 Q550 214 604 238 Q620 246 603 257 L520 267" fill="#f5a64b" class="ink"/>
    <path d="M603 238 q-10 17 0 19" fill="none" class="thin"/>
    <circle cx="489" cy="238" r="7" fill="#17212b"/>
    <path d="M475 226 q14-13 29 0" fill="none" class="thin"/>
    <path d="M469 292 Q430 300 412 282" fill="none" class="ink"/>
    <path d="M413 282 Q392 258 402 239 Q418 214 442 231" fill="#f6f0dd" class="ink"/>
    <path d="M438 243 L421 208" fill="none" class="ink"/>
    <path d="M421 208 l-10-14 M421 208 l3-17" fill="none" class="thin"/>
    <path d="M470 292 l-7 45 M500 288 l18 42" fill="none" class="ink"/>
    <path d="M463 337 l-22 12 M518 330 l24 7" fill="none" class="ink"/>
    <path d="M490 238 q28 8 38 30" fill="none" class="thin"/>
    <path d="M548 275 l18-12" fill="none" class="thin"/>
    <rect x="565" y="250" width="84" height="54" rx="8" fill="#e95745" class="ink"/>
    <text x="607" y="273" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#fff">FISH TAX</text>
    <text x="607" y="291" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#fff">PAID IN FULL</text>
  </g>

  <g class="fish">
    <path d="M170 300 Q205 270 245 300 Q205 330 170 300 Z" fill="#5cc6d6" class="ink"/>
    <path d="M170 300 l-24-18 v36 z" fill="#5cc6d6" class="ink"/>
    <circle cx="222" cy="296" r="4" fill="#17212b"/>
    <path d="M235 302 q-18 10-28 0" fill="none" class="thin"/>
  </g>
  <text x="155" y="260" class="label" font-size="18" font-weight="700">“I voted for fins!”</text>

  <path d="M120 456 Q180 438 240 456 T360 456" fill="none" stroke="#7fb85a" stroke-width="8"/>
  <path d="M650 456 Q700 438 760 456" fill="none" stroke="#7fb85a" stroke-width="8"/>
  <path d="M92 475 q10-30 20 0 M735 475 q10-30 20 0" fill="none" stroke="#4d9b52" stroke-width="6"/>

  <rect x="25" y="535" width="750" height="45" rx="12" fill="#fff7d6" stroke="#17212b" stroke-width="4"/>
  <text x="400" y="563" text-anchor="middle" class="label" font-size="17" font-weight="700">2026-10-29 11:00:01 SGT (UTC+08:00)</text>
</svg>