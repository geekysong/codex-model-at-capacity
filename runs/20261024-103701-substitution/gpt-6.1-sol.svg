<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#f7c9a9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe36e"/>
      <stop offset="1" stop-color="#e69a19"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#562b39" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 470 Q180 420 360 475 T800 455 V600 H0Z" fill="#7cc6b5"/>
  <path d="M0 515 Q190 470 390 525 T800 500 V600 H0Z" fill="#4f9f98"/>

  <text x="400" y="64" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900" fill="#3b1d2b">PREMIUM MODEL™</text>
  <text x="400" y="99" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#8b3049">Now with 100% more marketing!</text>

  <g filter="url(#shadow)">
    <rect x="76" y="145" width="648" height="330" rx="28" fill="#fffaf0" stroke="#3b1d2b" stroke-width="6"/>
    <path d="M400 145 V475" stroke="#3b1d2b" stroke-width="5" stroke-dasharray="12 10"/>
  </g>

  <text x="205" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#3b1d2b">THE AD</text>
  <text x="595" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#3b1d2b">THE DELIVERY</text>

  <!-- left premium robot -->
  <g>
    <rect x="135" y="215" width="140" height="135" rx="25" fill="url(#gold)" stroke="#3b1d2b" stroke-width="6"/>
    <rect x="151" y="238" width="108" height="66" rx="16" fill="#33273d" stroke="#3b1d2b" stroke-width="5"/>
    <circle cx="180" cy="270" r="10" fill="#65f4d1"/>
    <circle cx="230" cy="270" r="10" fill="#65f4d1"/>
    <path d="M174 287 Q205 310 236 287" fill="none" stroke="#65f4d1" stroke-width="6" stroke-linecap="round"/>
    <path d="M205 215 V195" stroke="#3b1d2b" stroke-width="6"/>
    <circle cx="205" cy="188" r="9" fill="#ff5d76" stroke="#3b1d2b" stroke-width="5"/>
    <path d="M120 335 Q205 370 290 335" fill="none" stroke="#e69a19" stroke-width="12"/>
    <text x="205" y="395" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900" fill="#3b1d2b">GENIUS ENGINE</text>
  </g>

  <!-- right cheap box with hamster -->
  <g>
    <rect x="470" y="215" width="240" height="170" rx="16" fill="#6b7280" stroke="#3b1d2b" stroke-width="6"/>
    <rect x="490" y="235" width="200" height="105" rx="10" fill="#202631" stroke="#111827" stroke-width="5"/>
    <circle cx="590" cy="288" r="37" fill="#d69a6b" stroke="#3b1d2b" stroke-width="5"/>
    <circle cx="565" cy="258" r="15" fill="#d69a6b" stroke="#3b1d2b" stroke-width="5"/>
    <circle cx="615" cy="258" r="15" fill="#d69a6b" stroke="#3b1d2b" stroke-width="5"/>
    <circle cx="578" cy="283" r="5" fill="#3b1d2b"/>
    <circle cx="602" cy="283" r="5" fill="#3b1d2b"/>
    <ellipse cx="590" cy="302" rx="11" ry="7" fill="#3b1d2b"/>
    <path d="M580 315 Q590 322 600 315" fill="none" stroke="#3b1d2b" stroke-width="3"/>
    <path d="M520 360 H660" stroke="#d69a6b" stroke-width="9" stroke-linecap="round"/>
    <text x="590" y="413" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="900" fill="#3b1d2b">MODEL: “BUDGET”</text>
  </g>

  <!-- curtain -->
  <path d="M413 190 Q445 225 428 270 Q445 315 428 360 Q445 405 420 452 L400 452 V190Z" fill="#e94863" stroke="#3b1d2b" stroke-width="5"/>
  <path d="M413 190 Q380 225 397 270 Q380 315 397 360 Q380 405 405 452 L420 452 V190Z" fill="#ff7180" stroke="#3b1d2b" stroke-width="5"/>
  <text x="420" y="245" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="900" fill="#fff" transform="rotate(90 420 245)">SWITCH</text>

  <!-- customer and speech -->
  <g>
    <circle cx="180" cy="485" r="24" fill="#f2b38f" stroke="#3b1d2b" stroke-width="5"/>
    <path d="M145 565 Q150 510 180 510 Q210 510 215 565" fill="#4b78b8" stroke="#3b1d2b" stroke-width="5"/>
    <path d="M162 478 Q180 462 198 478" fill="none" stroke="#3b1d2b" stroke-width="6"/>
    <path d="M209 460 Q270 420 350 455 Q370 470 345 492 Q270 505 209 480Z" fill="#fff" stroke="#3b1d2b" stroke-width="5"/>
    <text x="279" y="472" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="#3b1d2b">“Why is it<br/>eating my prompt?”</text>
  </g>

  <text x="400" y="565" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="900" fill="#3b1d2b">PAY FOR THE ROCKET. RECEIVE THE HAMSTER.</text>
</svg>