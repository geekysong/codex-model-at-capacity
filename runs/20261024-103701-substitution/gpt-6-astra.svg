<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7dc"/>
      <stop offset="1" stop-color="#f3d9a4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#d99012"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9e1233"/>
      <stop offset=".5" stop-color="#e23b55"/>
      <stop offset="1" stop-color="#8c0d2c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".25"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#ffffff" opacity=".22"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="0" width="800" height="600" fill="url(#dots)" opacity=".35"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#241b32" letter-spacing="1">
    PREMIUM MODEL
  </text>
  <text x="400" y="101" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#c3203d">
    (terms and substitutions apply)
  </text>

  <!-- stage -->
  <rect x="70" y="145" width="660" height="350" rx="20" fill="#fffdf5" stroke="#241b32" stroke-width="6" filter="url(#shadow)"/>
  <rect x="70" y="145" width="660" height="55" rx="20" fill="#241b32"/>
  <text x="400" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#fff7dc">
    THE TRUSTED SERVICE EXPERIENCE
  </text>

  <!-- premium bait -->
  <rect x="115" y="230" width="270" height="170" rx="14" fill="url(#gold)" stroke="#7c4c08" stroke-width="5"/>
  <path d="M155 340 Q250 220 345 340" fill="none" stroke="#fff5bc" stroke-width="8" opacity=".8"/>
  <circle cx="250" cy="292" r="48" fill="#fff4af" stroke="#7c4c08" stroke-width="5"/>
  <path d="M250 256 L261 282 L290 285 L268 304 L275 333 L250 318 L225 333 L232 304 L210 285 L239 282 Z" fill="#d99012"/>
  <text x="250" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="900" fill="#402806">ULTRA-GENIUS X</text>

  <!-- arrow -->
  <path d="M405 315 H493" stroke="#241b32" stroke-width="12" stroke-linecap="round"/>
  <path d="M475 288 L510 315 L475 342" fill="none" stroke="#241b32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" fill="#c3203d">YOUR REQUEST</text>

  <!-- curtain / reveal -->
  <rect x="520" y="215" width="160" height="205" rx="10" fill="#3b2948" stroke="#241b32" stroke-width="5"/>
  <rect x="520" y="215" width="160" height="205" rx="10" fill="url(#curtain)"/>
  <path d="M537 218 C555 280 545 365 565 417 M573 218 C590 290 579 360 595 417 M610 218 C625 285 615 360 630 417 M647 218 C660 285 650 360 665 417" fill="none" stroke="#74102a" stroke-width="9" opacity=".65"/>
  <path d="M520 225 Q600 285 680 225 L680 215 L520 215 Z" fill="#f0656b" opacity=".8"/>
  <text x="600" y="247" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#fff7dc">BEHIND THE</text>
  <text x="600" y="267" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#fff7dc">MAGIC</text>

  <!-- cheap model robot peeking -->
  <rect x="558" y="310" width="85" height="72" rx="12" fill="#9aa2ad" stroke="#241b32" stroke-width="5"/>
  <rect x="568" y="286" width="65" height="42" rx="18" fill="#b9c0c8" stroke="#241b32" stroke-width="5"/>
  <circle cx="588" cy="306" r="6" fill="#c3203d"/>
  <circle cx="613" cy="306" r="6" fill="#c3203d"/>
  <path d="M582 348 Q600 360 619 348" fill="none" stroke="#241b32" stroke-width="5" stroke-linecap="round"/>
  <path d="M600 286 V274" stroke="#241b32" stroke-width="5"/>
  <circle cx="600" cy="268" r="7" fill="#c3203d" stroke="#241b32" stroke-width="4"/>
  <text x="600" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#fff7dc">BARGAIN-BOT 2.0</text>

  <!-- customer -->
  <circle cx="165" cy="475" r="24" fill="#f2b07e" stroke="#241b32" stroke-width="5"/>
  <path d="M140 470 Q165 438 190 470" fill="#3b2948" stroke="#241b32" stroke-width="5"/>
  <path d="M130 535 Q165 480 200 535" fill="#4680a5" stroke="#241b32" stroke-width="5"/>
  <path d="M165 495 L165 535 M145 510 L185 510" stroke="#241b32" stroke-width="5" stroke-linecap="round"/>
  <path d="M192 478 Q210 465 223 480" fill="none" stroke="#241b32" stroke-width="5"/>
  <text x="166" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#241b32">CUSTOMER</text>

  <!-- speech bubble -->
  <path d="M245 430 Q290 398 365 425 Q405 440 380 475 Q360 498 310 488 L280 510 L282 482 Q245 470 245 430 Z" fill="#fff" stroke="#241b32" stroke-width="5"/>
  <text x="326" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#241b32">“Why is my</text>
  <text x="326" y="473" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#c3203d">genius buffering?”</text>

  <!-- tiny invoice -->
  <rect x="530" y="445" width="145" height="48" rx="5" fill="#fff" stroke="#241b32" stroke-width="4"/>
  <text x="542" y="464" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" fill="#241b32">PREMIUM PLAN</text>
  <text x="542" y="482" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#241b32">Model delivered: “similar”</text>
  <path d="M662 451 l8 8 -8 8" fill="none" stroke="#c3203d" stroke-width="4"/>

  <rect x="0" y="580" width="800" height="20" fill="#241b32"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" fill="#241b32">
    SAME PRICE. SMALLER BRAIN. BIGGER SURPRISE.
  </text>
</svg>