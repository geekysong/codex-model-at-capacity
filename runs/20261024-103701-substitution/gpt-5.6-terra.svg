<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#c9d9ef"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff39a"/>
      <stop offset=".45" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#d88800"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7668"/>
      <stop offset="1" stop-color="#b71928"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#1b2940" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 470 Q180 430 350 470 T800 460 V600 H0Z" fill="#9fb3c9"/>
  <path d="M0 500 Q180 465 360 500 T800 490 V600 H0Z" fill="#8299b1"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#14233b" stroke="#fff" stroke-width="5" paint-order="stroke">
    PREMIUM MODEL
  </text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#c1272d">
    (terms and conditions apply... quietly)
  </text>

  <!-- billboard -->
  <g filter="url(#shadow)">
    <rect x="82" y="135" width="300" height="190" rx="16" fill="#fff" stroke="#17253b" stroke-width="7"/>
    <rect x="101" y="154" width="262" height="100" rx="12" fill="url(#gold)" stroke="#8b5700" stroke-width="5"/>
    <text x="232" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#5a3500">PROMISED:</text>
    <text x="232" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="900" fill="#fff" stroke="#5a3500" stroke-width="2" paint-order="stroke">ULTRA GENIUS AI</text>
    <text x="232" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#17253b">“Worth every penny!”</text>
    <text x="232" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#566273">*penny not included</text>
  </g>

  <!-- premium machine -->
  <g filter="url(#shadow)">
    <rect x="430" y="145" width="280" height="300" rx="24" fill="#263b5c" stroke="#101b2c" stroke-width="8"/>
    <rect x="455" y="170" width="230" height="122" rx="14" fill="#152338" stroke="#6d8dbd" stroke-width="5"/>
    <circle cx="520" cy="231" r="42" fill="url(#gold)" stroke="#fff2a8" stroke-width="5"/>
    <path d="M498 235 Q520 205 542 235 Q520 258 498 235Z" fill="#fff"/>
    <circle cx="510" cy="230" r="5" fill="#263b5c"/>
    <circle cx="530" cy="230" r="5" fill="#263b5c"/>
    <text x="570" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#dceaff">PREMIUM</text>
    <text x="570" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a8c8f0">processing...</text>
    <rect x="474" y="320" width="190" height="84" rx="10" fill="#0d1625" stroke="#ffcf37" stroke-width="4"/>
    <text x="569" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#ffdf62">DELUXE OUTPUT</text>
    <text x="569" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b9cbe4">unlocking brilliance...</text>
  </g>

  <!-- trapdoor / switch -->
  <path d="M470 438 L667 438 L700 525 L438 525Z" fill="#4d6079" stroke="#17253b" stroke-width="7"/>
  <path d="M500 454 L642 454 L660 502 L480 502Z" fill="#111927" stroke="#d23b42" stroke-width="6" stroke-dasharray="12 8"/>
  <text x="570" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#ff7777">SUBSTITUTION CHUTE</text>

  <!-- cheap model -->
  <g transform="translate(535 407)" filter="url(#shadow)">
    <rect x="0" y="0" width="105" height="92" rx="12" fill="#d8dee7" stroke="#27364a" stroke-width="6"/>
    <rect x="15" y="18" width="75" height="40" rx="7" fill="#8fa2b8"/>
    <circle cx="37" cy="37" r="7" fill="#222c3c"/>
    <circle cx="68" cy="37" r="7" fill="#222c3c"/>
    <path d="M35 52 Q52 43 70 52" fill="none" stroke="#222c3c" stroke-width="4"/>
    <text x="52" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#8b1520">CHEAP MODEL</text>
  </g>

  <!-- lever -->
  <path d="M694 366 L744 330" stroke="#17253b" stroke-width="12" stroke-linecap="round"/>
  <circle cx="694" cy="366" r="16" fill="#e23b43" stroke="#17253b" stroke-width="6"/>
  <text x="748" y="320" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#9b1d2a">QUIET SWAP</text>

  <!-- customer -->
  <g>
    <circle cx="210" cy="404" r="39" fill="#f2b58f" stroke="#26364c" stroke-width="6"/>
    <path d="M173 398 Q190 350 235 373 Q247 387 244 405 Q222 390 173 398Z" fill="#4b2e2a"/>
    <circle cx="196" cy="411" r="6" fill="#17253b"/>
    <circle cx="225" cy="411" r="6" fill="#17253b"/>
    <path d="M197 435 Q210 447 226 435" fill="none" stroke="#17253b" stroke-width="5"/>
    <path d="M154 470 Q210 432 267 470 L282 560 L137 560Z" fill="#2d77b8" stroke="#26364c" stroke-width="7"/>
    <path d="M150 476 L90 520" stroke="#f2b58f" stroke-width="18" stroke-linecap="round"/>
    <path d="M268 476 L328 505" stroke="#f2b58f" stroke-width="18" stroke-linecap="round"/>
    <rect x="55" y="487" width="105" height="59" rx="7" fill="#fff" stroke="#26364c" stroke-width="6" transform="rotate(-12 55 487)"/>
    <text x="104" y="516" transform="rotate(-12 104 516)" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#c1272d">PREMIUM?</text>
  </g>

  <!-- salesman -->
  <g>
    <circle cx="735" cy="185" r="28" fill="#e4a77f" stroke="#26364c" stroke-width="5"/>
    <path d="M708 180 Q730 145 762 170 L760 186 Q738 174 708 180Z" fill="#303844"/>
    <path d="M701 225 Q735 198 770 225 L780 302 L691 302Z" fill="#c8323d" stroke="#26364c" stroke-width="6"/>
    <path d="M719 232 L735 260 L751 232" fill="#fff"/>
    <path d="M704 235 L670 270" stroke="#e4a77f" stroke-width="14" stroke-linecap="round"/>
    <path d="M768 235 L790 252" stroke="#e4a77f" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- speech bubbles -->
  <path d="M286 352 Q340 313 406 345 Q432 360 398 386 Q355 405 301 388 L275 409 L282 381 Q266 367 286 352Z" fill="#fff" stroke="#26364c" stroke-width="5"/>
  <text x="351" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#17253b">Why is it</text>
  <text x="351" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#c1272d">thinking in crayons?</text>

  <path d="M650 212 Q690 180 759 203 Q784 218 754 240 L764 262 L732 247 Q680 256 650 237 Q630 225 650 212Z" fill="#fff" stroke="#26364c" stroke-width="5"/>
  <text x="709" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#17253b">Same logo.</text>
  <text x="709" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#c1272d">Lower electricity bill.</text>

  <rect x="55" y="560" width="690" height="30" rx="15" fill="#17253b"/>
  <text x="400" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#fff">
    THE BAIT: GOLDEN PROMISES  •  THE SWITCH: TIN CAN WITH A LOGIN
  </text>
</svg>