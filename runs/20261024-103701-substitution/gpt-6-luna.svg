<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="1" stop-color="#f4d9a6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="1" stop-color="#f2a900"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="5" dy="6" stdDeviation="4" flood-color="#402817" flood-opacity=".3"/>
    </filter>
    <style>
      .ink { stroke:#241b18; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial, Helvetica, sans-serif; font-weight:900; }
      .small { font-family:Arial, Helvetica, sans-serif; font-weight:700; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 475 Q180 430 370 470 T800 455 V600 H0Z" fill="#d39b60"/>
  <path d="M0 480 Q180 440 370 480 T800 465" fill="none" stroke="#8b5b3d" stroke-width="5"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="36" fill="#2b1c18">PREMIUM MODEL™</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="23" fill="#b52d24">NOW WITH 100% MORE MARKETING</text>

  <!-- storefront -->
  <rect x="73" y="125" width="654" height="327" rx="18" fill="#f8f3e7" class="ink" filter="url(#shadow)"/>
  <rect x="95" y="146" width="610" height="72" rx="12" fill="#382b67" class="ink"/>
  <text x="400" y="194" text-anchor="middle" class="label" font-size="32" fill="#fff">THE CLOUDY AI EMPORIUM</text>

  <!-- awning -->
  <path d="M95 218 H705 V267 Q655 294 605 267 Q555 294 505 267 Q455 294 405 267 Q355 294 305 267 Q255 294 205 267 Q155 294 95 267Z" fill="#e8493f" class="ink"/>
  <path d="M145 218 V267 M245 218 V267 M345 218 V267 M445 218 V267 M545 218 V267 M645 218 V267" stroke="#fff4d7" stroke-width="12"/>

  <!-- left promise -->
  <rect x="112" y="291" width="265" height="137" rx="14" fill="#fffdf5" class="ink"/>
  <text x="244" y="320" text-anchor="middle" class="label" font-size="20" fill="#2d2461">WHAT YOU ORDER</text>
  <rect x="142" y="337" width="207" height="65" rx="10" fill="url(#gold)" class="ink"/>
  <path d="M184 382 L210 347 L233 373 L257 344 L300 382Z" fill="#fff8d0" class="ink"/>
  <circle cx="297" cy="355" r="9" fill="#fff8d0" class="ink"/>
  <text x="246" y="417" text-anchor="middle" class="small" font-size="15" fill="#2d2461">GALAXY-BRAIN ULTRA</text>

  <!-- right delivery -->
  <rect x="423" y="291" width="265" height="137" rx="14" fill="#fffdf5" class="ink"/>
  <text x="555" y="320" text-anchor="middle" class="label" font-size="20" fill="#b52d24">WHAT ARRIVES</text>
  <rect x="480" y="344" width="150" height="60" rx="8" fill="#9aa0a5" class="ink"/>
  <path d="M492 359 H618 M492 373 H594 M492 387 H570" stroke="#53585d" stroke-width="7" stroke-linecap="round"/>
  <text x="555" y="417" text-anchor="middle" class="small" font-size="15" fill="#b52d24">DUSTY TOASTER 0.3</text>

  <!-- sneaky clerk -->
  <ellipse cx="400" cy="490" rx="122" ry="30" fill="#8b5b3d" opacity=".45"/>
  <path d="M350 448 Q355 407 399 403 Q445 407 450 448 L438 480 H361Z" fill="#ec6b43" class="ink"/>
  <path d="M359 423 Q399 389 441 423" fill="none" class="ink"/>
  <circle cx="384" cy="433" r="6" fill="#241b18"/>
  <circle cx="416" cy="433" r="6" fill="#241b18"/>
  <path d="M383 452 Q400 461 418 452" fill="none" class="ink"/>
  <path d="M350 455 L309 472 M450 455 L492 472" class="ink" fill="none"/>
  <path d="M307 471 Q289 478 280 493" class="ink" fill="none"/>
  <path d="M493 471 Q510 478 518 493" class="ink" fill="none"/>
  <text x="400" y="527" text-anchor="middle" class="label" font-size="19" fill="#241b18">“Same intelligence, tiny packaging!”</text>

  <!-- bait switch arrows and sticker -->
  <path d="M377 360 C397 342 409 342 423 360" fill="none" stroke="#b52d24" stroke-width="8"/>
  <path d="M414 351 L425 361 L412 369" fill="none" stroke="#b52d24" stroke-width="8"/>
  <path d="M393 337 L407 327 L417 339" fill="none" stroke="#b52d24" stroke-width="8"/>
  <path d="M620 287 L677 270 L696 322 L638 338Z" fill="#f7e64a" class="ink"/>
  <text x="663" y="302" text-anchor="middle" class="label" font-size="17" fill="#241b18" transform="rotate(17 663 302)">UPSELL!</text>

  <!-- caption -->
  <rect x="132" y="550" width="536" height="36" rx="18" fill="#241b18"/>
  <text x="400" y="575" text-anchor="middle" class="small" font-size="18" fill="#fff8df">Premium on the menu. Budget in the box.</text>
</svg>