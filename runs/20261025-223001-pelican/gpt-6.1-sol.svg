      <stop stop-color="#d9f3f2"/>
      <stop offset="1" stop-color="#fff6dc"/>
    </linearGradient>
    <pattern id="road" width="90" height="12" patternUnits="userSpaceOnUse">
      <path d="M10 6h40" stroke="#fff7df" stroke-width="4" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="65" fill="#fff9e8" stroke="#273b43" stroke-width="10"/>
