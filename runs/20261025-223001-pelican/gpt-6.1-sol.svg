    <text x="154" y="164" text-anchor="middle" font-size="16" font-weight="bold">“I commute on</text>
    <text x="154" y="186" text-anchor="middle" font-size="17" font-weight="bold">renewable fish.”</text>
    <text x="400" y="511" text-anchor="middle" font-size="21" font-weight="bold">He cut emissions. The fish demanded a recount.</text>
