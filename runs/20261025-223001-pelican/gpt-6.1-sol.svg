<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Pedal Lobby</title>
  <desc id="description">A smug pelican pedals a tiny bicycle, carrying an enormous pouch of fish beneath a sign promising a smaller carbon finprint. Bicycle wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
