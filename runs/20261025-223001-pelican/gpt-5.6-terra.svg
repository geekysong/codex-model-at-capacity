<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle while commuters look on.</desc>
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .bob { animation: bob .55s ease-in-out infinite alternate; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: pedal 1s linear infinite; }
    .blink { animation: blink 3s step-end infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 94%,98% { transform: scaleY(.08); } }
  </style>

  <rect width="800" height="600" fill="#bce9f7"/>
  <path d="M0 267 Q110 230 220 266 T440 260 T650 250 T800 268 V390 H0Z" fill="#91ce76"/>
  <path d="M0 365 H800 V510 H0Z" fill="#4d5967"/>
  <path d="M0 437 H800" stroke="#f9d64b" stroke-width="10" stroke-dasharray="45 28"/>
  <path d="M0 510 H800" stroke="#303946" stroke-width="7"/>

  <g fill="#fff" opacity=".92">
    <path d="M79 130c13-22 44-22 57 0 25-12 48 7 44 27H49c-3-16 13-31 30-27z"/>
    <path d="M590 105c12-20 42-18 51 3 21-9 42 8 36 27h-115c-2-16 12-29 28-30z"/>
  </g>

  <rect x="38" y="190" width="193" height="93" rx="10" fill="#fff4ca" stroke="#283240" stroke-width="5"/>
  <text x="134" y="222" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="19" fill="#283240">BIKE LANE</text>
  <text x="134" y="251" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="25" fill="#e24943">FOR BIRDS?</text>

  <text x="400" y="64" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="40" fill="#243142">PELICAN PEDALS HARD</text>
  <text x="400" y="94" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#40556b">“My carbon footprint is mostly fish.”</text>

