<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of a pelican riding a bicycle, with looping wheel and pedaling animation.</desc>

  <rect width="800" height="600" fill="#bde9ff"/>
  <rect y="430" width="800" height="170" fill="#8fd17f"/>
  <path d="M0 455 Q120 420 240 452 T480 450 T800 448" fill="none" stroke="#5b9d55" stroke-width="8"/>

  <g font-family="Trebuchet MS, sans-serif" fill="#17324d" text-anchor="middle">
    <text x="400" y="58" font-size="42" font-weight="bold">PELICAN COMMUTER</text>
    <text x="400" y="92" font-size="20">“Why fly when you can pedal through the red tape?”</text>
  </g>

  <g transform="translate(0 0)">
    <g stroke="#263746" stroke-width="9" fill="none">
      <circle cx="270" cy="430" r="82"/>
      <circle cx="575" cy="430" r="82"/>
      <path d="M270 430 L365 325 L470 430 L270 430 M365 325 L575 430 M365 325 L420 430"/>
      <path d="M365 325 L345 292 M345 292 L318 292"/>
      <path d="M420 430 L455 430"/>
    </g>

    <g stroke="#d64b3d" stroke-width="5" opacity="0.9">
      <path d="M270 348 V512 M188 430 H352 M212 372 L328 488 M328 372 L212 488"/>
      <path d="M575 348 V512 M493 430 H657 M517 372 L633 488 M633 372 L517 488"/>
    </g>

    <g id="pelican" transform="translate(0 0)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -9; 0 0" dur="1.2s" repeatCount="indefinite"/>

      <ellipse cx="420" cy="245" rx="78" ry="92" fill="#f4f0df" stroke="#263746" stroke-width="7"/>
      <path d="M365 250 Q315 215 330 170 Q350 118 405 132 Q455 145 456 202 Q450 250 420 273 Z"
            fill="#f9f6e9" stroke="#263746" stroke-width="7"/>
      <circle cx="393" cy="170" r="10" fill="#263746"/>
      <circle cx="396" cy="167" r="3" fill="#ffffff"/>

      <path d="M330 205 Q252 190 205 220 Q245 270 345 245 Q375 236 390 214 Z"
            fill="#f2a24b" stroke="#263746" stroke-width="7"/>
      <path d="M208 220 Q275 229 340 239" fill="none" stroke="#c66b2e" stroke-width="5"/>

      <path d="M380 245 Q420 270 468 248 L515 298 Q451 322 390 293 Z"
            fill="#e15a4f" stroke="#263746" stroke-width="7"/>
      <path d="M403 281 Q430 274 458 278" fill="none" stroke="#f8c9a5" stroke-width="8"/>

      <path d="M392 323 L375 373" stroke="#263746" stroke-width="9" stroke-linecap="round"/>
      <path d="M458 318 L488 372" stroke="#263746" stroke-width="9" stroke-linecap="round"/>
      <path d="M373 373 L350 399" stroke="#263746" stroke-width="8" stroke-linecap="round"/>
      <path d="M488 372 L515 398" stroke="#263746" stroke-width="8" stroke-linecap="round"/>

      <path d="M383 208 Q415 220 445 208" fill="none" stroke="#263746" stroke-width="5"/>
      <path d="M426 187 Q448 177 462 187" fill="none" stroke="#263746" stroke-width="5"/>
    </g>

    <g stroke="#263746" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M420 430 L392 395"/>
      <path d="M420 430 L455 397"/>
    </g>
    <g fill="#f2a24b" stroke="#263746" stroke-width="5">
      <ellipse cx="388" cy="392" rx="16" ry="9">
        <animateTransform attributeName="transform" type="rotate" values="0 388 392;18 388 392;0 388 392;-18 388 392;0 388 392" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="459" cy="394" rx="16" ry="9">
        <animateTransform attributeName="transform" type="rotate" values="0 459 394;-18 459 394;0 459 394;18 459 394;0 459 394" dur="1.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <g fill="#263746">
      <circle cx="270" cy="430" r="8"/>
      <circle cx="575" cy="430" r="8"/>
      <circle cx="420" cy="430" r="11"/>
    </g>
  </g>

  <g font-family="Trebuchet MS, sans-serif" fill="#17324d">
    <text x="70" y="145" font-size="22" font-weight="bold">BIRD-BRAINED</text>
    <text x="70" y="171" font-size="18">transport policy</text>
    <path d="M168 176 Q230 204 285 205" fill="none" stroke="#17324d" stroke-width="3"/>
    <path d="M285 205 l-12 -8 M285 205 l-13 5" fill="none" stroke="#17324d" stroke-width="3"/>
  </g>

  <g font-family="Trebuchet MS, sans-serif" fill="#17324d" text-anchor="middle">
    <text x="400" y="548" font-size="16">2026-10-27 14:31:08 SGT (UTC+08:00)</text>
  </g>
