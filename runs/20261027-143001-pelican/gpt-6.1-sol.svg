<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon pelican pedals furiously while balancing on a tiny bicycle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ecff"/>
      <stop offset="1" stop-color="#fff3c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#213047" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#263248;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,sans-serif;fill:#263248}
      .small{font-family:Arial,sans-serif;font-size:18px;font-weight:bold}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 410 Q110 350 220 410 T440 410 T660 410 T900 410 V520 H0Z" fill="#9ed47d"/>
  <path d="M0 470 Q170 430 350 470 T700 465 T900 470 V550 H0Z" fill="#70b765"/>
  <path d="M0 520 Q160 500 320 520 T640 520 T900 520" fill="none" stroke="#4d8e56" stroke-width="7"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#173d63">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="20" font-weight="700">A pelican discovers that “winging it” works better with wheels.</text>

  <g filter="url(#shadow)">
    <!-- bicycle -->
    <g fill="none" class="ink">
      <circle cx="245" cy="445" r="73" fill="#f8fbff">
        <animateTransform attributeName="transform" type="rotate" from="0 245 445" to="360 245 445" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="570" cy="445" r="73" fill="#f8fbff">
        <animateTransform attributeName="transform" type="rotate" from="0 570 445" to="360 570 445" dur="2s" repeatCount="indefinite"/>
      </circle>
      <path d="M245 445 L340 325 L430 445 L245 445 M340 325 L570 445 M430 445 L505 315 L570 445 M470 335 L530 335"/>
      <path d="M330 316 L350 290 M322 292 L366 292"/>
      <circle cx="430" cy="445" r="22" fill="#ffd34f"/>
      <path d="M430 445 L399 417 M430 445 L461 473"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 430 445" to="360 430 445" dur="1.1s" repeatCount="indefinite"/>
        <path d="M430 445 L399 417 M430 445 L461 473"/>
        <circle cx="395" cy="414" r="7" fill="#ef6c57"/>
        <circle cx="465" cy="476" r="7" fill="#ef6c57"/>
      </g>
    </g>

    <!-- pelican body bobbing -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 5;0 0" dur="1.1s" repeatCount="indefinite"/>
      <!-- tail feathers -->
      <path d="M355 285 Q290 260 272 300 Q311 309 348 317" fill="#f4f6f4" class="ink"/>
      <!-- body -->
      <ellipse cx="390" cy="265" rx="88" ry="105" fill="#f7f8f3" class="ink"/>
      <path d="M340 235 Q390 190 448 235 Q420 265 356 265Z" fill="#d7e3e4" class="ink"/>
      <!-- wing -->
      <path d="M374 266 Q430 238 463 288 Q433 343 377 320 Q355 300 374 266Z" fill="#c6d6d8" class="ink"/>
      <path d="M392 278 Q421 292 441 316" fill="none" class="ink"/>
      <!-- neck and head -->
      <path d="M405 188 Q408 130 455 119 Q493 112 518 139 Q535 158 514 186 Q481 207 438 202" fill="#f7f8f3" class="ink"/>
      <!-- beak -->
      <path d="M501 145 Q615 143 658 177 Q608 225 500 188 Q477 173 501 145Z" fill="#f2a63a" class="ink"/>
      <path d="M505 178 Q584 182 642 178" fill="none" class="ink"/>
      <circle cx="480" cy="151" r="8" fill="#263248"/>
      <path d="M479 133 Q500 119 518 131" fill="none" class="ink"/>
      <!-- jaunty hat -->
      <path d="M423 116 Q445 76 493 92 L515 125 Q468 112 423 116Z" fill="#e85c4a" class="ink"/>
      <path d="M415 119 Q466 103 522 126" fill="none" class="ink"/>
      <!-- feet on pedals -->
      <path d="M385 337 Q409 365 427 408 M437 337 Q427 381 399 414" fill="none" class="ink"/>
      <ellipse cx="425" cy="411" rx="18" ry="8" fill="#f2a63a" class="ink"/>
      <ellipse cx="396" cy="416" rx="18" ry="8" fill="#f2a63a" class="ink"/>
      <!-- handlebar grip -->
      <path d="M480 231 Q500 250 505 290" fill="none" class="ink"/>
    </g>
  </g>

  <!-- comic motion marks -->
  <path d="M135 270 l-34 -18 M150 300 l-42 -3 M650 300 l38 -15" stroke="#ef6c57" stroke-width="8" stroke-linecap="round"/>
  <text x="92" y="215" class="label small" fill="#ef6c57" transform="rotate(-12 92 215)">HONK!</text>
  <text x="605" y="260" class="label small" fill="#ef6c57" transform="rotate(12 605 260)">NO BRAKES!</text>

  <rect x="34" y="548" width="732" height="34" rx="12" fill="#fff8df" stroke="#263248" stroke-width="3"/>
  <text x="400" y="571" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-27 14:30:28 SGT (UTC+08:00)</text>
</svg>