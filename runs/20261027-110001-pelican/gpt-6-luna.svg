<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Into Trouble</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly large fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#d9f5f7"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7680"/>
      <stop offset="1" stop-color="#424951"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17212b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17212b;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#17212b;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .bob{animation:bob .9s ease-in-out infinite alternate}
      .pedal{animation:pedal 1.1s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-7px)}}
      @keyframes pedal{0%{transform:rotate(0deg)}50%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="675" cy="105" r="48" fill="#fff4a6" opacity=".85"/>
  <path d="M0 390 Q120 330 250 390 T520 380 T800 370 V470 H0Z" fill="#8cc57b"/>
  <path d="M0 425 Q180 380 360 430 T800 410 V480 H0Z" fill="#5e9d67"/>
  <path d="M0 455 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 H800" stroke="#f8d66d" stroke-width="8" stroke-dasharray="52 35" opacity=".8"/>

  <g class="label" text-anchor="middle">
    <rect x="400" y="24" width="570" height="72" rx="18" fill="#fff9df" class="ink" filter="url(#shadow)"/>
    <text x="400" y="56" font-size="29" font-weight="900">PELICAN PEDALS INTO TROUBLE</text>
    <text x="400" y="82" font-size="16" font-weight="700">“Fresh fish delivery, zero feathers spared!”</text>
  </g>

  <g transform="translate(0,4)">
    <g class="wheelSpin">
      <circle cx="245" cy="465" r="67" fill="#e7edf0" class="ink"/>
      <circle cx="245" cy="465" r="10" fill="#f05d4f" class="ink"/>
      <g class="thin" opacity=".85">
        <path d="M245 398V532M178 465H312M198 418L292 512M292 418L198 512"/>
      </g>
    </g>
    <g class="wheelSpin">
      <circle cx="565" cy="465" r="67" fill="#e7edf0" class="ink"/>
      <circle cx="565" cy="465" r="10" fill="#f05d4f" class="ink"/>
      <g class="thin" opacity=".85">
        <path d="M565 398V532M498 465H632M518 418L612 512M612 418L518 512"/>
      </g>
    </g>

    <path d="M245 465 L352 350 L565 465 L430 465 Z" fill="none" class="ink"/>
    <path d="M352 350 L430 465" fill="none" class="ink"/>
    <path d="M565 465 L548 337" fill="none" class="ink"/>
    <path d="M525 337 H579" fill="none" class="ink"/>
    <path d="M245 465 L220 382" fill="none" class="ink"/>
    <path d="M204 382 H238" fill="none" class="ink"/>
    <circle cx="430" cy="465" r="19" fill="#f2b84b" class="ink"/>

    <g class="pedal">
      <path d="M430 465 L465 495 M430 465 L397 435" fill="none" class="thin"/>
      <path d="M455 500 H480 M380 430 H404" fill="none" class="thin"/>
    </g>

    <g class="bob">
      <path d="M408 350 Q435 322 468 340 L492 370 Q463 388 426 376Z" fill="#f5a43b" class="ink"/>
      <path d="M456 348 Q485 290 530 303 Q557 312 568 348 L548 381 Q512 394 478 374Z" fill="#f7b84c" class="ink"/>
      <path d="M518 318 Q555 280 596 300 Q620 313 618 340 Q614 366 580 375 L548 356Z" fill="#f7b84c" class="ink"/>
      <ellipse cx="576" cy="319" rx="10" ry="13" fill="#fff" class="thin"/>
      <circle cx="579" cy="322" r="5" fill="#17212b"/>
      <path d="M605 337 Q663 318 705 345 Q666 386 598 360Z" fill="#ef704e" class="ink"/>
      <path d="M632 348 Q663 344 696 351" fill="none" class="thin"/>
      <path d="M553 374 Q570 405 548 441" fill="none" class="ink"/>
      <path d="M480 370 Q470 410 490 445" fill="none" class="ink"/>
      <path d="M548 441 L583 459 M490 445 L459 464" fill="none" class="ink"/>
      <path d="M443 344 Q423 310 435 278 Q463 294 475 332" fill="#f7b84c" class="ink"/>
      <path d="M442 286 Q427 265 449 248 Q473 266 475 292" fill="#ef704e" class="ink"/>
      <path d="M535 303 Q544 270 570 256" fill="none" class="ink"/>
      <path d="M570 256 Q584 240 596 255" fill="none" class="ink"/>
      <path d="M528 311 Q548 332 568 340" fill="none" class="thin"/>
      <path d="M484 380 Q518 399 552 380" fill="none" class="thin"/>
    </g>

    <g transform="translate(0,-3)">
      <path d="M614 300 Q642 260 686 279 Q712 290 719 319 Q698 339 666 327Z" fill="#6fb7d2" class="ink"/>
      <path d="M686 279 L719 319 L741 302 L718 337 L696 328Z" fill="#ef704e" class="ink"/>
      <circle cx="675" cy="293" r="6" fill="#17212b"/>
      <path d="M636 285 Q652 273 670 277" fill="none" class="thin"/>
    </g>
  </g>

  <g class="label">
    <path d="M86 180 Q180 130 286 170 L286 245 Q175 270 86 230Z" fill="#fff9df" class="ink" filter="url(#shadow)"/>
    <path d="M226 239 L255 278 L268 238" fill="#fff9df" class="ink"/>
    <text x="186" y="185" text-anchor="middle" font-size="22" font-weight="900">HONK IF</text>
    <text x="186" y="213" text-anchor="middle" font-size="22" font-weight="900">YOU SEE</text>
    <text x="186" y="241" text-anchor="middle" font-size="22" font-weight="900">A FISH!</text>
  </g>

  <g class="label" text-anchor="middle">
    <rect x="115" y="548" width="570" height="34" rx="10" fill="#fff9df" class="ink"/>
    <text x="400" y="571" font-size="15" font-weight="700">2026-10-27 11:01:15 SGT (UTC+08:00)</text>
  </g>
</svg>