<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Power Pedaler</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly delivering absolutely nothing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#163047" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#1e2934;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#1e2934}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.3s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center bottom;animation:bob .65s ease-in-out infinite alternate}
      .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.3s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-5px) rotate(1deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="100" r="48" fill="#fff2a6" opacity=".8"/>
  <path d="M0 365 Q110 310 220 355 T440 350 T680 340 T800 355 V430 H0Z" fill="#7fcf88"/>
  <path d="M0 405 Q130 375 260 405 T520 398 T800 390 V470 H0Z" fill="#4fa66c"/>
  <path d="M0 438 H800 V575 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f7d36b" stroke-width="9" stroke-dasharray="42 28" opacity=".9"/>

  <g class="label" text-anchor="middle">
    <text x="400" y="58" font-size="34" font-weight="900" fill="#17324d">PELICAN POWER PEDALER</text>
    <text x="400" y="88" font-size="16" font-weight="700" fill="#24516a">“Delivering big beaks and zero actual mail.”</text>
  </g>

  <g filter="url(#shadow)">
    <g class="wheel">
      <circle cx="235" cy="435" r="69" fill="#202a33" class="ink"/>
      <circle cx="235" cy="435" r="57" fill="#e8eef2" class="ink"/>
      <circle cx="235" cy="435" r="8" fill="#f4b942" class="ink"/>
      <path d="M235 378V492 M178 435H292 M195 395L275 475 M275 395L195 475" stroke="#6c8795" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="570" cy="435" r="69" fill="#202a33" class="ink"/>
      <circle cx="570" cy="435" r="57" fill="#e8eef2" class="ink"/>
      <circle cx="570" cy="435" r="8" fill="#f4b942" class="ink"/>
      <path d="M570 378V492 M513 435H627 M530 395L610 475 M610 395L530 475" stroke="#6c8795" stroke-width="3"/>
    </g>

    <g class="ink" fill="none">
      <path d="M235 435 L345 350 L455 435 L570 435 L455 350 Z"/>
      <path d="M345 350 L390 435"/>
      <path d="M455 350 L430 320"/>
      <path d="M430 320 L472 310"/>
      <path d="M345 350 L315 315"/>
      <path d="M300 315 H330"/>
    </g>
    <path d="M330 350 Q390 335 455 350" fill="none" stroke="#f4b942" stroke-width="13"/>
    <g class="pedal">
      <circle cx="390" cy="435" r="15" fill="#f4b942" class="ink"/>
      <path d="M390 435L420 455 M390 435L360 415" stroke="#1e2934" stroke-width="7"/>
      <path d="M420 455h20 M340 405h20" stroke="#1e2934" stroke-width="7"/>
    </g>
  </g>

  <g class="rider" filter="url(#shadow)">
    <path d="M382 310 Q405 275 445 285 L475 330 Q453 350 420 342Z" fill="#fffaf0" class="ink"/>
    <path d="M425 294 Q430 225 486 205 Q545 185 585 235 Q594 278 552 306 Q500 326 451 315Z" fill="#f5f0df" class="ink"/>
    <path d="M480 216 Q520 180 569 208 Q600 228 584 254 Q550 267 508 251Z" fill="#f5f0df" class="ink"/>
    <ellipse cx="560" cy="238" rx="10" ry="13" fill="#1e2934"/>
    <circle cx="563" cy="234" r="3" fill="#fff"/>
    <path d="M570 252 Q630 246 681 270 Q692 282 677 294 Q614 295 555 274Z" fill="#ef9c38" class="ink"/>
    <path d="M595 274 Q641 287 682 270" fill="none" stroke="#c86c27" stroke-width="4"/>
    <path d="M470 302 Q430 318 405 352 L372 400" fill="none" class="ink"/>
    <path d="M492 310 Q530 337 540 377 L565 423" fill="none" class="ink"/>
    <path d="M372 400 L350 426" fill="none" stroke="#ef9c38" stroke-width="14"/>
    <path d="M565 423 L592 432" fill="none" stroke="#ef9c38" stroke-width="14"/>
    <path d="M405 352 L390 435" fill="none" stroke="#ef9c38" stroke-width="12"/>
    <path d="M540 377 L470 435" fill="none" stroke="#ef9c38" stroke-width="12"/>
    <path d="M379 322 Q397 295 425 280" fill="none" stroke="#d5c8aa" stroke-width="10"/>
    <path d="M457 235 Q475 215 500 211" fill="none" stroke="#d5c8aa" stroke-width="8"/>
    <path d="M497 203 Q515 180 540 190" fill="none" stroke="#ef9c38" stroke-width="13"/>
    <path d="M522 190 Q545 171 563 186" fill="none" stroke="#ef9c38" stroke-width="13"/>
    <path d="M477 201 Q514 185 550 201" fill="none" stroke="#1e2934" stroke-width="4"/>
    <path d="M440 286 Q468 300 494 293" fill="none" stroke="#d5c8aa" stroke-width="8"/>
  </g>

  <g class="label">
    <path d="M95 190 Q165 145 246 176 L263 218 Q180 241 105 220Z" fill="#fff" class="ink"/>
    <text x="178" y="185" font-size="19" font-weight="800" text-anchor="middle">HONK IF YOU</text>
    <text x="178" y="207" font-size="19" font-weight="800" text-anchor="middle">LIKE BREAD!</text>
    <path d="M242 218 L286 264 L250 225" fill="#fff" class="ink"/>
  </g>

  <g class="label" text-anchor="middle">
    <text x="400" y="548" font-size="14" font-weight="700">2026-10-28 23:02:11 SGT (UTC+08:00)</text>
  </g>
</svg>