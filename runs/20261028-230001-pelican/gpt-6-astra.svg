<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Power Pedaling</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly ignoring the traffic jam behind him.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e7fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#626a78"/>
      <stop offset="1" stop-color="#303642"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#16202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#1f2933;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#1f2933}
      .bold{font-weight:800}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="110" r="55" fill="#ffd66b" opacity=".9"/>
  <path d="M0 315 Q110 270 220 315 T440 315 T660 315 T880 315 V390 H0Z" fill="#91c48a"/>
  <path d="M0 380 Q150 340 300 380 T600 380 T900 380 V440 H0Z" fill="#6faa70"/>
  <rect y="420" width="800" height="180" fill="url(#road)"/>
  <path d="M0 507 H800" stroke="#f7d56b" stroke-width="8" stroke-dasharray="48 32"/>
  <path d="M0 565 H800" stroke="#202630" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="38" y="28" width="475" height="92" rx="22" fill="#fff8df" stroke="#1f2933" stroke-width="7"/>
    <text x="62" y="70" class="label bold" font-size="33">PELICAN POWER PEDALING</text>
    <text x="63" y="101" class="label" font-size="20">Why sit in traffic when you can swallow it?</text>
  </g>

  <g opacity=".9">
    <rect x="610" y="265" width="130" height="70" rx="12" fill="#f26b5e" class="ink"/>
    <rect x="625" y="280" width="100" height="38" rx="7" fill="#ffd9a8" stroke="#1f2933" stroke-width="4"/>
    <circle cx="630" cy="345" r="13" fill="#202630"/>
    <circle cx="710" cy="345" r="13" fill="#202630"/>
    <text x="676" y="305" text-anchor="middle" class="label bold" font-size="17">HONK!</text>
  </g>

  <g id="bike" class="ink" fill="none">
    <g>
      <circle cx="235" cy="480" r="75" stroke="#202630" stroke-width="10"/>
      <circle cx="550" cy="480" r="75" stroke="#202630" stroke-width="10"/>
      <g stroke="#8eabb8" stroke-width="3">
        <path d="M235 405V555M160 480H310M182 427L288 533M288 427L182 533"/>
        <path d="M550 405V555M475 480H625M497 427L603 533M603 427L497 533"/>
      </g>
      <path d="M235 480 L330 405 L430 480 L550 480 L430 480 L380 380 L330 405 L430 480" stroke="#e5b93f" stroke-width="9"/>
      <path d="M380 380 L355 355 M350 355 H395" stroke="#202630" stroke-width="8"/>
      <path d="M550 480 L585 395 M570 395 H610" stroke="#202630" stroke-width="8"/>
      <circle cx="430" cy="480" r="17" fill="#e5b93f"/>
      <path d="M430 480 L398 510 M430 480 L462 450" stroke="#202630" stroke-width="8"/>
      <circle cx="398" cy="510" r="8" fill="#202630"/>
      <circle cx="462" cy="450" r="8" fill="#202630"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(0,0)">
      <circle cx="235" cy="480" r="67" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 16" opacity=".65">
        <animateTransform attributeName="transform" type="rotate" from="0 235 480" to="360 235 480" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="550" cy="480" r="67" stroke="#ffffff" stroke-width="3" stroke-dasharray="7 16" opacity=".65">
        <animateTransform attributeName="transform" type="rotate" from="0 550 480" to="360 550 480" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <g id="pelican" class="ink">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="410" cy="300" rx="72" ry="88" fill="#f4f1df"/>
    <path d="M369 273 Q400 210 457 244 Q483 260 473 305 Q461 340 420 351 Q379 345 369 273Z" fill="#d7e3e8"/>
    <ellipse cx="421" cy="239" rx="48" ry="52" fill="#f7f5e9"/>
    <path d="M452 249 Q546 250 585 293 Q551 327 447 296Z" fill="#f5b84b"/>
    <path d="M482 282 Q548 285 585 293 Q547 306 480 301Z" fill="#de8b2e"/>
    <circle cx="443" cy="231" r="11" fill="#ffffff"/>
    <circle cx="446" cy="232" r="5" fill="#1f2933"/>
    <path d="M399 333 Q420 356 450 336" fill="none" stroke="#c65c4b" stroke-width="7"/>
    <path d="M374 281 Q340 310 352 357 Q372 373 398 335" fill="#b9ccd4"/>
    <path d="M395 353 L375 407 M444 350 L468 405" stroke="#e5b93f" stroke-width="11"/>
    <path d="M375 407 L350 418 M468 405 L493 416" stroke="#e5b93f" stroke-width="8"/>
    <path d="M378 399 Q390 430 420 438" fill="none" stroke="#1f2933" stroke-width="7"/>
    <path d="M464 398 Q450 430 420 438" fill="none" stroke="#1f2933" stroke-width="7"/>
    <path d="M388 212 Q410 184 435 207" fill="none" stroke="#f26b5e" stroke-width="12"/>
  </g>

  <g>
    <path d="M126 190 Q155 165 184 190" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <path d="M205 160 Q230 140 255 160" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <text x="85" y="395" class="label bold" font-size="22" fill="#ffffff">LANE? WHAT LANE?</text>
    <path d="M190 402 Q220 430 250 445" fill="none" stroke="#ffffff" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#ffffff"/>
    </marker>
  </defs>

  <rect x="18" y="560" width="764" height="30" rx="8" fill="#fff8df" stroke="#1f2933" stroke-width="3"/>
  <text x="400" y="581" text-anchor="middle" class="label bold" font-size="16">2026-10-28 23:00:01 SGT (UTC+08:00)</text>
</svg>