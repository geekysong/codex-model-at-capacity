    <circle cx="100" cy="125" r="3"/><circle cx="300" cy="125" r="3"/><circle cx="400" cy="125" r="3"/><circle cx="500" cy="125" r="3"/>
    <circle cx="100" cy="185" r="3"/><circle cx="200" cy="185" r="3"/><circle cx="400" cy="185" r="3"/><circle cx="500" cy="185" r="3"/>
    <circle cx="100" cy="245" r="3"/><circle cx="200" cy="245" r="3"/><circle cx="300" cy="245" r="3"/><circle cx="500" cy="245" r="3"/>
    <circle cx="100" cy="305" r="3"/><circle cx="200" cy="305" r="3"/><circle cx="300" cy="305" r="3"/><circle cx="400" cy="305" r="3"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 118L207 132 M207 118L193 132"/>
    <path d="M293 178L307 192 M307 178L293 192"/>
    <path d="M393 238L407 252 M407 238L393 252"/>
