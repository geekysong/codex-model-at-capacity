<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street map: A1 to E5</title>
  <desc id="desc">A five-column, five-row street grid. The shortest route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for 8 street segments, avoiding blocked intersections B2, C3, and D4.</desc>

  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172033">Shortest route: A1 → E5</text>

  <!-- City blocks -->
  <path d="M100 55H500V315H100Z" fill="#eef2f5"/>
  <g stroke="#ffffff" stroke-width="12" fill="none">
    <path d="M100 55H500 M100 120H500 M100 185H500 M100 250H500 M100 315H500"/>
    <path d="M100 55V315 M200 55V315 M300 55V315 M400 55V315 M500 55V315"/>
  </g>

  <!-- Streets -->
