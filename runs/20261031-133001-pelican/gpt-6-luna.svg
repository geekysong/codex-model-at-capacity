<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle</title>
  <desc id="desc">A smug pelican pedals a bicycle, with a tiny traffic jam of fish in its beak.</desc>
  <style>
    text { font-family: "Trebuchet MS", Arial, sans-serif; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .rider { animation: bob .6s ease-in-out infinite alternate; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px); } }
  </style>

  <rect width="800" height="600" fill="#b9e9f2"/>
  <circle cx="680" cy="104" r="45" fill="#ffd166"/>
  <path d="M0 370 Q120 330 240 370 T480 366 T800 370 V600 H0Z" fill="#8bcf9b"/>
  <path d="M0 432 Q180 400 360 432 T800 425 V540 H0Z" fill="#d7c28a"/>
  <path d="M0 504 H800" stroke="#665c4b" stroke-width="7" stroke-dasharray="34 24"/>
  <text x="400" y="56" text-anchor="middle" font-size="34" font-weight="900" fill="#15374a">THE PELICAN CYCLE</text>
  <text x="400" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#315466">He’s pedaling. The fish are filing a complaint.</text>

  <!-- Bicycle -->
  <g fill="none" stroke="#e85d45" stroke-width="8" stroke-linejoin="round">
    <g class="wheel">
      <circle cx="257" cy="420" r="66" stroke="#263d4a" stroke-width="7"/>
      <path d="M257 354V486M191 420H323M210 373L304 467M304 373L210 467" stroke="#738995" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="525" cy="420" r="66" stroke="#263d4a" stroke-width="7"/>
      <path d="M525 354V486M459 420H591M478 373L572 467M572 373L478 467" stroke="#738995" stroke-width="3"/>
    </g>
    <path d="M257 420 L353 420 L310 330 L257 420 L420 330 L525 420 L420 330 L449 330"/>
    <path d="M296 327 H337 M432 324 H466" stroke="#263d4a" stroke-width="7" stroke-linecap="round"/>
    <path d="M353 420 L368 405 M353 420 L367 435" stroke="#263d4a" stroke-width="5"/>
    <circle cx="353" cy="420" r="11" fill="#f4c95d" stroke="#263d4a" stroke-width="4"/>
    <g class="pedal" stroke="#263d4a" stroke-width="5">
      <path d="M353 420 L375 441 M343 410 L363 430"/>
    </g>
  </g>

  <!-- Pelican rider -->
  <g class="rider">
    <!-- legs -->
    <path d="M382 291 Q385 329 367 353 L357 413" fill="none" stroke="#f28c28" stroke-width="15" stroke-linecap="round"/>
    <path d="M408 294 Q427 322 402 348 L365 420" fill="none" stroke="#f28c28" stroke-width="14" stroke-linecap="round"/>
    <path d="M346 417 Q357 409 369 417" fill="none" stroke="#263d4a" stroke-width="8" stroke-linecap="round"/>
    <path d="M358 426 Q369 417 380 425" fill="none" stroke="#263d4a" stroke-width="8" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="402" cy="253" rx="57" ry="72" fill="#fffdf4" stroke="#263d4a" stroke-width="5"/>
    <path d="M370 273 Q405 289 434 264 Q427 316 393 318 Q371 303 370 273Z" fill="#e7edf0" stroke="#263d4a" stroke-width="4"/>
    <path d="M373 216 Q388 184 425 204 L446 236 Q418 248 390 236Z" fill="#fffdf4" stroke="#263d4a" stroke-width="5"/>
    <!-- neck and head -->
    <path d="M425 226 Q446 189 469 164" fill="none" stroke="#fffdf4" stroke-width="22" stroke-linecap="round"/>
    <path d="M425 226 Q446 189 469 164" fill="none" stroke="#263d4a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="481" cy="151" r="39" fill="#fffdf4" stroke="#263d4a" stroke-width="5"/>
    <circle cx="492" cy="145" r="4.5" fill="#263d4a"/>
    <path d="M511 157 Q560 152 597 169 Q560 190 512 178Z" fill="#f4a62a" stroke="#263d4a" stroke-width="4"/>
    <path d="M512 177 Q553 188 588 175 Q567 213 535 207 Q516 199 512 177Z" fill="#ef735f" stroke="#263d4a" stroke-width="4"/>
    <!-- fish in the bill -->
    <path d="M544 172 Q554 160 565 172 Q554 184 544 172Z" fill="#77c9d8" stroke="#263d4a" stroke-width="2"/>
    <path d="M542 172 L536 167 L536 177Z" fill="#77c9d8" stroke="#263d4a" stroke-width="2"/>
    <circle cx="560" cy="171" r="1.8" fill="#263d4a"/>
    <!-- wing -->
    <path d="M374 251 Q395 232 422 247 Q419 270 389 279Z" fill="#e8edf0" stroke="#263d4a" stroke-width="4"/>
    <!-- helmet -->
    <path d="M448 143 Q453 105 489 107 Q520 110 526 144Z" fill="#44b7a5" stroke="#263d4a" stroke-width="5"/>
    <path d="M442 145 H529" stroke="#263d4a" stroke-width="5" stroke-linecap="round"/>
    <path d="M475 111 Q482 125 480 140 M499 114 Q504 127 502 141" fill="none" stroke="#b5eee0" stroke-width="3"/>
    <!-- wing on handlebar -->
    <path d="M428 245 Q445 249 456 271" fill="none" stroke="#fffdf4" stroke-width="13" stroke-linecap="round"/>
    <path d="M428 245 Q445 249 456 271" fill="none" stroke="#263d4a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- comic expression and motion -->
  <path d="M556 119 Q576 105 591 115 M562 129 Q580 122 594 130" fill="none" stroke="#263d4a" stroke-width="3" stroke-linecap="round"/>
  <text x="608" y="136" font-size="18" font-weight="900" fill="#263d4a">HONK!</text>
  <path d="M180 300 l-25 -12 M187 317 l-30 0 M611 300 l27 -14 M611 317 l31 2" stroke="#fffdf4" stroke-width="5" stroke-linecap="round"/>
  <path d="M325 168 Q337 150 349 168 M338 178 Q350 160 362 178" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <rect x="204" y="456" width="373" height="39" rx="19" fill="#fffdf4" stroke="#263d4a" stroke-width="3"/>
  <text x="390" y="481" text-anchor="middle" font-size="17" font-weight="800" fill="#263d4a">“I’m on a seafood diet. I see fish, I brake.”</text>
  <text x="400" y="562" text-anchor="middle" font-size="15" font-weight="700" fill="#263d4a">2026-10-31 13:32:04 SGT (UTC+08:00)</text>
</svg>