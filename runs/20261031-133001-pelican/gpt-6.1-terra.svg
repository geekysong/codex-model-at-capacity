<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A pelican in a helmet rides a bicycle with spinning wheels, while its body bobs gently above the pedals.</desc>
  <defs>
    <pattern id="clouds" width="240" height="110" patternUnits="userSpaceOnUse">
      <path d="M35 75c0-12 10-21 22-20 5-17 30-19 38-3 13-3 24 7 23 19H35z" fill="#fff" opacity=".55"/>
    </pattern>
    <g id="wheel">
