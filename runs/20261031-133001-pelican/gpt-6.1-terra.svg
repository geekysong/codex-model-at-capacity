        <path d="M0-75V75M-75 0H75M-53-53L53 53M53-53L-53 53"/>
      </g>
      <circle r="10" fill="#263340"/>
      <circle cx="0" cy="-80" r="5" fill="#e65642"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
    </g>
  </defs>

