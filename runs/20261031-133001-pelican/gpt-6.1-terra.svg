  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#704221">One bird. Two wheels. Zero carbon emissions.</text>

  <rect x="0" y="124" width="800" height="360" fill="#bce8e3"/>
  <rect x="0" y="124" width="800" height="270" fill="url(#clouds)"/>
  <circle cx="690" cy="185" r="35" fill="#ffe17b"/>
