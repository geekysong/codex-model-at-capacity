<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>
  <style>
    .ink{stroke:#20252b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .text{font-family:Arial,Helvetica,sans-serif;fill:#20252b}
    .wheel{fill:#f7f0d0;stroke:#20252b;stroke-width:7}
    .spoke{stroke:#6b7378;stroke-width:3}
  </style>

  <rect width="800" height="600" fill="#bdefff"/>
  <circle cx="690" cy="105" r="52" fill="#ffd95e" class="ink"/>
