<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of a pelican pedaling furiously while carrying absolutely nothing useful.</desc>
  <style>
    .ink{stroke:#243447;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#243447;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,Helvetica,sans-serif;fill:#243447}
  </style>

  <rect width="800" height="600" fill="#bde9f5"/>
  <rect y="420" width="800" height="180" fill="#f7d98b"/>
  <path d="M0 420 Q150 390 300 420 T600 420 T900 420" fill="none" stroke="#e6b962" stroke-width="7"/>
  <circle cx="690" cy="112" r="48" fill="#ffd96a" stroke="#243447" stroke-width="5"/>
  <path d="M70 150 q35-28 70 0 q35-28 70 0" fill="none" stroke="#fff" stroke-width="12" opacity=".8"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="800">THE GREAT PELICAN GETAWAY</text>
  <text x="400" y="96" text-anchor="middle" class="label" font-size="20" font-style="italic">“When the beak is bigger than the business plan.”</text>

  <!-- bicycle -->
  <g id="bike">
    <g>
      <circle cx="245" cy="422" r="82" fill="#eaf7fa" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 245 422" to="360 245 422" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="575" cy="422" r="82" fill="#eaf7fa" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 575 422" to="360 575 422" dur="3s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#6ba9b8" stroke-width="3">
        <path d="M245 340v164M163 422h164M187 364l116 116M187 480l116-116"/>
        <path d="M575 340v164M493 422h164M517 364l116 116M517 480l116-116"/>
      </g>
    </g>
    <path d="M245 422 L345 295 L470 422 L245 422 M345 295 L390 422 M470 422 L520 305" fill="none" class="ink"/>
    <path d="M505 305 L542 280" fill="none" class="ink"/>
    <path d="M525 280 l25 5" fill="none" class="ink"/>
    <circle cx="390" cy="422" r="17" fill="#f4a62a" class="ink"/>
    <path d="M390 422 l-42-28 M390 422 l40 30" fill="none" class="thin"/>
    <path d="M333 393 l-28-8 M430 452 l28 7" fill="none" class="thin"/>
    <path d="M345 295 l-5-22 h28" fill="none" class="ink"/>
    <path d="M520 305 q16-20 32 0" fill="none" class="ink"/>
  </g>

  <!-- pelican -->
  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="405" cy="235" rx="102" ry="91" fill="#fffaf0" class="ink"/>
    <path d="M335 230 q-55 20-68 72 q47 9 95-18" fill="#dcecf1" class="ink"/>
    <path d="M300 286 q45 25 82-2 q-10 45-61 45" fill="#f7a66b" class="ink"/>
    <ellipse cx="470" cy="150" rx="52" ry="58" fill="#fffaf0" class="ink"/>
    <path d="M492 166 Q610 176 650 214 Q566 235 478 202 Z" fill="#f49b5b" class="ink"/>
    <path d="M516 193 Q580 199 632 214" fill="none" stroke="#c96c42" stroke-width="4"/>
    <circle cx="483" cy="140" r="9" fill="#243447"/>
    <path d="M452 116 q28-28 59-5" fill="none" class="thin"/>
    <path d="M382 312 q50 25 100 0" fill="none" class="thin"/>
    <path d="M370 318 q-18 50-2 83" fill="none" class="ink"/>
    <path d="M470 317 q28 42 7 86" fill="none" class="ink"/>
    <path d="M368 397 l-23 25 M478 403 l27 19" fill="none" class="ink"/>
    <path d="M348 423 q25 8 42-1 M499 422 q18 7 34-1" fill="none" class="ink"/>
    <path d="M352 207 q-16 35-4 65 M400 176 q-20 25-14 57" fill="none" stroke="#b5cbd1" stroke-width="9"/>
    <path d="M374 334 q-18 23-11 49" fill="none" stroke="#f49b5b" stroke-width="9"/>
    <path d="M464 335 q23 22 14 50" fill="none" stroke="#f49b5b" stroke-width="9"/>
    <text x="405" y="270" text-anchor="middle" class="label" font-size="18" font-weight="700">HONK!</text>
  </g>

  <!-- pedaling motion marks -->
  <g fill="none" stroke="#243447" stroke-width="5" opacity=".75">
    <path d="M115 350 q-28 18-34 48"/>
    <path d="M645 330 q31 13 45 40"/>
    <path d="M125 390 q-22 8-31 26"/>
  </g>
  <text x="400" y="535" text-anchor="middle" class="label" font-size="24" font-weight="700">A pelican on a bicycle: maximum beak, minimum brakes.</text>
  <text x="400" y="575" text-anchor="middle" class="label" font-size="16">2026-10-27 18:01:17 SGT (UTC+08:00)</text>
</svg>