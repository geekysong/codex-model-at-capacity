<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#292929"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#17334a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#172b3a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial, Helvetica, sans-serif; fill:#172b3a; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".9"/>
  <path d="M0 405 Q110 365 220 405 T440 405 T660 405 T900 405 V510 H0Z" fill="#9ad47b"/>
  <path d="M0 485 Q170 452 330 482 T670 477 T900 485 V560 H0Z" fill="#74b45f"/>
  <rect y="490" width="800" height="70" fill="url(#road)"/>
  <path d="M0 525 H800" stroke="#f8df72" stroke-width="8" stroke-dasharray="46 28"/>

  <text x="400" y="54" text-anchor="middle" class="label" font-size="34" font-weight="900" fill="#173b57">THE GREAT PELICYCLE</text>
  <text x="400" y="84" text-anchor="middle" class="label" font-size="17" font-weight="700">A bird-brained commute with a very serious beak</text>

  <g filter="url(#shadow)">
    <!-- bicycle -->
    <g class="ink" fill="none">
      <circle cx="250" cy="455" r="66" stroke="#172b3a" stroke-width="10"/>
      <circle cx="565" cy="455" r="66" stroke="#172b3a" stroke-width="10"/>
      <path d="M250 455 L350 360 L445 455 L250 455 M350 360 L400 455 M350 360 L320 330 M445 455 L520 350 L565 455"/>
      <path d="M520 350 L550 345 M520 350 L535 365"/>
    </g>
    <g stroke="#7fd3e8" stroke-width="3" opacity=".8">
      <path d="M250 389V521 M184 455H316 M203 408L297 502 M203 502L297 408"/>
      <path d="M565 389V521 M499 455H631 M518 408L612 502 M518 502L612 408"/>
    </g>

    <!-- spinning wheel highlights -->
    <g fill="none" stroke="#fff" stroke-width="5" opacity=".75">
      <path d="M250 389 A66 66 0 0 1 309 425"/>
      <path d="M565 389 A66 66 0 0 1 624 425"/>
    </g>

    <!-- pelican bobbing group -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 5;0 0" dur="1.6s" repeatCount="indefinite"/>
      <!-- body -->
      <ellipse cx="395" cy="274" rx="91" ry="105" fill="#f7f1df" class="ink"/>
      <path d="M337 292 Q385 340 450 293 Q435 365 385 367 Q344 351 337 292Z" fill="#d8e5ec" class="ink"/>
      <!-- neck -->
      <path d="M361 219 Q348 152 396 125 Q448 144 430 225Z" fill="#f7f1df" class="ink"/>
      <!-- head -->
      <ellipse cx="394" cy="117" rx="60" ry="49" fill="#f7f1df" class="ink"/>
      <!-- crest -->
      <path d="M355 77 Q367 48 385 73 Q405 40 418 75 Q445 57 449 91" fill="#d9e7ee" class="ink"/>
      <!-- beak -->
      <path d="M440 111 Q535 104 580 139 Q525 177 438 142 Q419 130 440 111Z" fill="#f2a33b" class="ink"/>
      <path d="M450 140 Q520 145 564 143" fill="none" stroke="#b96524" stroke-width="5"/>
      <!-- eye and monocle -->
      <circle cx="414" cy="104" r="9" fill="#172b3a"/>
      <circle cx="414" cy="104" r="18" fill="none" stroke="#e7b83f" stroke-width="5"/>
      <path d="M432 104 Q448 99 458 106" fill="none" stroke="#e7b83f" stroke-width="4"/>
      <!-- wing -->
      <path d="M347 246 Q285 255 300 330 Q330 346 373 302Z" fill="#cbdbe3" class="ink"/>
      <path d="M315 286 Q337 292 352 309" fill="none" stroke="#91aebd" stroke-width="5"/>
      <!-- feet -->
      <path d="M369 351 L349 390 M424 351 L447 390" class="ink" fill="none"/>
      <path d="M336 389 Q350 379 365 390 M432 389 Q448 379 462 390" class="ink" fill="none"/>
      <!-- handlebars grip -->
      <path d="M520 350 Q500 327 476 316" class="ink" fill="none"/>
      <path d="M476 316 L460 323" class="ink" fill="none"/>
      <!-- pedal legs -->
      <path d="M385 356 L420 415 L452 430 M385 356 L360 414 L330 429" class="ink" fill="none"/>
      <path d="M444 432 l24 7 M322 431 l-24 7" class="ink" fill="none"/>
      <!-- pedals -->
      <g transform="translate(387 414)">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.1s" repeatCount="indefinite"/>
        <circle r="11" fill="#f2a33b" class="ink"/>
        <path d="M0 0 L35 18 M0 0 L-35 -18" class="ink" fill="none"/>
      </g>
    </g>
  </g>

  <g class="label">
    <text x="92" y="175" font-size="22" font-weight="800" fill="#9b3e34">LOCAL BIRD NEWS</text>
    <path d="M205 181 Q270 205 324 238" fill="none" stroke="#9b3e34" stroke-width="4"/>
    <path d="M323 238 l-12 -3 l6 -10" fill="#9b3e34"/>
    <text x="82" y="205" font-size="16" font-weight="700">“I pedal because</text>
    <text x="82" y="226" font-size="16" font-weight="700">walking is beneath me.”</text>
  </g>

  <text x="400" y="555" text-anchor="middle" class="label" font-size="18" font-weight="700">A pelican pedals into traffic, proving that every commute needs more drama.</text>
  <text x="400" y="582" text-anchor="middle" class="label" font-size="14">2026-10-27 21:32:59 SGT (UTC+08:00)</text>
</svg>