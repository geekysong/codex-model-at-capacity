<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest city street route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, using eight street segments and avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- City blocks -->
  <defs>
    <pattern id="blocks" x="100" y="55" width="100" height="60" patternUnits="userSpaceOnUse">
      <rect x="12" y="12" width="76" height="36" rx="4" fill="#dce9df"/>
    </pattern>
  </defs>
  <rect x="100" y="55" width="400" height="240" fill="url(#blocks)"/>

  <!-- Streets -->
  <g fill="none" stroke="#b8c1cc" stroke-width="10" stroke-linecap="round">
    <path d="M100 55H500 M100 115H500 M100 175H500 M100 235H500 M100 295H500"/>
    <path d="M100 55V295 M200 55V295 M300 55V295 M400 55V295 M500 55V295"/>
  </g>

  <!-- Shortest route: 4 east + 4 south = 8 segments -->
  <path d="M100 55H500V295" fill="none" stroke="#1565d8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#ffffff" stroke="#64748b" stroke-width="1.5">
    <circle cx="200" cy="55" r="4"/><circle cx="300" cy="55" r="4"/><circle cx="400" cy="55" r="4"/><circle cx="500" cy="55" r="4"/>
    <circle cx="100" cy="115" r="4"/><circle cx="300" cy="115" r="4"/><circle cx="400" cy="115" r="4"/><circle cx="500" cy="115" r="4"/>
    <circle cx="100" cy="175" r="4"/><circle cx="200" cy="175" r="4"/><circle cx="400" cy="175" r="4"/><circle cx="500" cy="175" r="4"/>
    <circle cx="100" cy="235" r="4"/><circle cx="200" cy="235" r="4"/><circle cx="300" cy="235" r="4"/><circle cx="500" cy="235" r="4"/>
    <circle cx="100" cy="295" r="4"/><circle cx="200" cy="295" r="4"/><circle cx="300" cy="295" r="4"/><circle cx="400" cy="295" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 108L207 122 M207 108L193 122"/>
    <path d="M293 168L307 182 M307 168L293 182"/>
    <path d="M393 228L407 242 M407 228L393 242"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">
    <text x="100" y="37">A1</text><text x="200" y="37">B1</text><text x="300" y="37">C1</text><text x="400" y="37">D1</text><text x="500" y="37">E1</text>
    <text x="100" y="97">A2</text><text x="200" y="97">B2</text><text x="300" y="97">C2</text><text x="400" y="97">D2</text><text x="500" y="97">E2</text>
    <text x="100" y="157">A3</text><text x="200" y="157">B3</text><text x="300" y="157">C3</text><text x="400" y="157">D3</text><text x="500" y="157">E3</text>
    <text x="100" y="217">A4</text><text x="200" y="217">B4</text><text x="300" y="217">C4</text><text x="400" y="217">D4</text><text x="500" y="217">E4</text>
    <text x="100" y="277">A5</text><text x="200" y="277">B5</text><text x="300" y="277">C5</text><text x="400" y="277">D5</text><text x="500" y="277">E5</text>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="55" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="295" r="7" fill="#1565d8" stroke="#ffffff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="78" y="60" text-anchor="end" fill="#15803d">START</text>
    <text x="518" y="300" fill="#1565d8">END</text>
  </g>

  <text x="300" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1565d8">Shortest route: 8 street segments</text>

  <!-- Dedicated timestamp footer -->
  <path d="M24 354H576" stroke="#cbd5e1"/>
  <text x="300" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-10-30 13:04:08 SGT (UTC+08:00)</text>
</svg>