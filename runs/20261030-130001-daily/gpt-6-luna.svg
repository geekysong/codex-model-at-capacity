<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City block route from A1 to E5</title>
  <desc id="desc">A top-down five by five intersection grid. The blue shortest route avoids blocked intersections B2, C3, and D4. It has eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172554">CITY BLOCK ROUTE</text>

  <!-- Streets -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <path d="M100 80H500 M100 145H500 M100 210H500 M100 275H500 M100 340H500"/>
    <path d="M100 80V340 M200 80V340 M300 80V340 M400 80V340 M500 80V340"/>
  </g>

  <!-- Shortest route: A1 → B1 → C1 → D1 → E1 → E2 → E3 → E4 → E5 -->
  <path d="M100 80H500V340" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <circle cx="200" cy="80" r="4"/><circle cx="300" cy="80" r="4"/><circle cx="400" cy="80" r="4"/>
    <circle cx="500" cy="145" r="4"/><circle cx="500" cy="210" r="4"/><circle cx="500" cy="275" r="4"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">
    <text x="100" y="65">A1</text><text x="200" y="65">B1</text><text x="300" y="65">C1</text><text x="400" y="65">D1</text><text x="500" y="65">E1</text>
    <text x="100" y="130">A2</text><text x="200" y="130">B2</text><text x="300" y="130">C2</text><text x="400" y="130">D2</text><text x="500" y="130">E2</text>
    <text x="100" y="195">A3</text><text x="200" y="195">B3</text><text x="300" y="195">C3</text><text x="400" y="195">D3</text><text x="500" y="195">E3</text>
    <text x="100" y="260">A4</text><text x="200" y="260">B4</text><text x="300" y="260">C4</text><text x="400" y="260">D4</text><text x="500" y="260">E4</text>
    <text x="100" y="325">A5</text><text x="200" y="325">B5</text><text x="300" y="325">C5</text><text x="400" y="325">D5</text><text x="500" y="325">E5</text>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M191 136L209 154 M209 136L191 154"/>
    <path d="M291 201L309 219 M309 201L291 219"/>
    <path d="M391 266L409 284 M409 266L391 284"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="80" r="12" fill="#16a34a" stroke="#fff" stroke-width="3"/>
  <text x="100" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">S</text>
  <circle cx="500" cy="340" r="12" fill="#7c3aed" stroke="#fff" stroke-width="3"/>
  <text x="500" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">E</text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#1e293b">
    <circle cx="91" cy="365" r="6" fill="#16a34a"/><text x="103" y="370">Start: A1</text>
    <circle cx="205" cy="365" r="6" fill="#7c3aed"/><text x="217" y="370">End: E5</text>
    <path d="M302 365l7 7m0-7l-7 7" stroke="#dc2626" stroke-width="2.5"/><text x="315" y="370">Blocked</text>
    <path d="M405 365h22" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="434" y="370">Route: 8 street segments</text>
  </g>
  <text x="300" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">2026-10-30 13:04:35 SGT (UTC+08:00)</text>
</svg>