<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid with shortest route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#ffffff"/>

  <!-- City blocks and streets -->
  <rect x="100" y="60" width="400" height="240" fill="#edf1f5"/>
  <g fill="none" stroke="#ffffff" stroke-width="16">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>
  <g fill="none" stroke="#8793a2" stroke-width="2">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <!-- Shortest route: four segments east, four south -->
  <path d="M100 60H500V300" fill="none" stroke="#1769db" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#ffffff" stroke="#526174" stroke-width="2">
    <circle cx="200" cy="60" r="4"/><circle cx="300" cy="60" r="4"/>
    <circle cx="400" cy="60" r="4"/><circle cx="500" cy="60" r="4"/>
    <circle cx="100" cy="120" r="4"/><circle cx="300" cy="120" r="4"/>
    <circle cx="400" cy="120" r="4"/><circle cx="500" cy="120" r="4"/>
    <circle cx="100" cy="180" r="4"/><circle cx="200" cy="180" r="4"/>
    <circle cx="400" cy="180" r="4"/><circle cx="500" cy="180" r="4"/>
    <circle cx="100" cy="240" r="4"/><circle cx="200" cy="240" r="4"/>
    <circle cx="300" cy="240" r="4"/><circle cx="500" cy="240" r="4"/>
    <circle cx="100" cy="300" r="4"/><circle cx="200" cy="300" r="4"/>
    <circle cx="300" cy="300" r="4"/><circle cx="400" cy="300" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 113L207 127 M207 113L193 127"/>
    <path d="M293 173L307 187 M307 173L293 187"/>
    <path d="M393 233L407 247 M407 233L393 247"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172536">
    <text x="109" y="47">A1</text><text x="209" y="47">B1</text><text x="309" y="47">C1</text><text x="409" y="47">D1</text><text x="509" y="47">E1</text>
    <text x="109" y="107">A2</text><text x="209" y="107">B2</text><text x="309" y="107">C2</text><text x="409" y="107">D2</text><text x="509" y="107">E2</text>
    <text x="109" y="167">A3</text><text x="209" y="167">B3</text><text x="309" y="167">C3</text><text x="409" y="167">D3</text><text x="509" y="167">E3</text>
    <text x="109" y="227">A4</text><text x="209" y="227">B4</text><text x="309" y="227">C4</text><text x="409" y="227">D4</text><text x="509" y="227">E4</text>
    <text x="109" y="287">A5</text><text x="209" y="287">B5</text><text x="309" y="287">C5</text><text x="409" y="287">D5</text><text x="509" y="287">E5</text>
  </g>

  <circle cx="100" cy="60" r="7" fill="#168047" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="300" r="7" fill="#1769db" stroke="#ffffff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <text x="82" y="65" text-anchor="end" fill="#168047">START</text>
    <text x="517" y="305" fill="#1769db">END</text>
  </g>

  <!-- Separate footer -->
  <rect x="0" y="324" width="600" height="76" fill="#f4f7fb"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="348" font-size="16" font-weight="bold" fill="#1769db">Shortest route: 8 street segments</text>
    <text x="300" y="379" font-size="15" fill="#263445">2026-10-30 13:03:30 SGT (UTC+08:00)</text>
  </g>
</svg>