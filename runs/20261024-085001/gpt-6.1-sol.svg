  <!-- melting hamster-wheel servers -->
  <g transform="translate(625 438)">
    <circle cx="0" cy="0" r="57" fill="none" stroke="#8dd6ff" stroke-width="9"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#8dd6ff" stroke-width="4"/>
    <path d="M-42 0 H42 M0 -42 V42" stroke="#8dd6ff" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="16" ry="25" fill="#d68b48"/>
    <circle cx="-6" cy="-8" r="3" fill="#111"/>
    <path d="M-12 7 Q0 15 12 7" fill="none" stroke="#111" stroke-width="3"/>
    <path d="M-42 54 Q-30 66 -18 55 Q-5 73 10 55 Q24 73 38 53" fill="none" stroke="#ff735f" stroke-width="7"/>
  </g>
  <text x="624" y="530" text-anchor="middle" font-family="monospace" font-size="12" fill="#ff9b87">SERVERS: OVERHEATED</text>

  <!-- caption -->
  <rect x="28" y="570" width="744" height="22" rx="11" fill="#0d0b15" stroke="#ff4fa3" stroke-width="2"/>
  <text x="400" y="587" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#fff">“Selected model is at capacity. Please try a different model.”</text>
</svg>