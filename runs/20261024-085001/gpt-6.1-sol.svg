  <path d="M240 330 Q300 430 390 438 Q500 448 620 375" fill="none" stroke="#d32972" stroke-width="8"/>
  <circle cx="240" cy="330" r="12" fill="#ffd35a" stroke="#754326" stroke-width="4"/>
  <circle cx="620" cy="375" r="12" fill="#ffd35a" stroke="#754326" stroke-width="4"/>

  <!-- queue developers -->
  <g stroke="#171522" stroke-width="4">
    <circle cx="75" cy="424" r="22" fill="#e4a77d"/><path d="M53 419 Q75 392 97 419" fill="#3b2334"/>
    <rect x="53" y="447" width="45" height="63" rx="12" fill="#4c8bd9"/>
    <path d="M62 465 l26 0 M62 478 l18 0" stroke="#d6f1ff" stroke-width="3"/>
    <circle cx="145" cy="449" r="21" fill="#9d6a4d"/><path d="M123 444 Q145 415 166 444" fill="#d8d0c4"/>
    <rect x="124" y="471" width="43" height="59" rx="12" fill="#78c98a"/>
    <circle cx="215" cy="426" r="22" fill="#f0bd91"/><path d="M193 420 Q215 391 237 420" fill="#25253a"/>
    <rect x="193" y="449" width="44" height="67" rx="12" fill="#ed8b58"/>
    <circle cx="280" cy="466" r="21" fill="#754936"/><path d="M259 460 Q280 434 301 460" fill="#16151c"/>
    <rect x="259" y="487" width="43" height="58" rx="12" fill="#b56be1"/>
  </g>
  <g font-family="monospace" font-size="12" fill="#fff">
    <text x="43" y="545">dev_01</text><text x="117" y="566">dev_02</text><text x="188" y="548">dev_03</text><text x="253" y="574">dev_04</text>
  </g>
  <g stroke="#fff" stroke-width="3" opacity=".8">
    <path d="M110 432 q16 -16 32 0"/><path d="M173 455 q16 -16 32 0"/><path d="M240 437 q16 -16 32 0"/>
