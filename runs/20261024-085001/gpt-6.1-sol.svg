  <path d="M145 375 L130 420M194 375 L210 420" stroke="#31394d" stroke-width="20" stroke-linecap="round"/>
  <path d="M93 315 Q62 327 41 316" fill="none" stroke="#ffea55" stroke-width="5"/>
  <text x="68" y="301" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffea55" transform="rotate(-18 68 301)">SORRY!</text>

