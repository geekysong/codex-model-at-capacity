<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#34204a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241a32"/>
      <stop offset="1" stop-color="#120e1d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="410" width="800" height="190" fill="url(#floor)"/>
  <path d="M0 410 Q200 380 400 410 T800 410" fill="none" stroke="#6c3e7e" stroke-width="3"/>
  <circle cx="95" cy="125" r="55" fill="#ff4fa3" opacity=".12" filter="url(#soft)"/>
  <circle cx="710" cy="165" r="80" fill="#4df4ff" opacity=".1" filter="url(#soft)"/>

  <text x="400" y="47" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="77" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#ff82c5">THE EXCLUSIVE MODEL EXPERIENCE</text>

  <!-- Club facade -->
  <rect x="240" y="110" width="440" height="285" rx="18" fill="#21172d" stroke="#9b5ab4" stroke-width="5"/>
  <rect x="265" y="135" width="390" height="70" rx="12" fill="#100d19" stroke="#ff4fa3" stroke-width="3"/>
  <text x="460" y="181" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#ff4fa3" filter="url(#glow)">FULL</text>
  <text x="460" y="198" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffd1ea">NO NEW CONNECTIONS</text>

  <!-- Disco lights -->
  <circle cx="285" cy="242" r="9" fill="#ffea55"/>
  <circle cx="335" cy="242" r="9" fill="#4df4ff"/>
  <circle cx="385" cy="242" r="9" fill="#ff4fa3"/>
  <circle cx="435" cy="242" r="9" fill="#ffea55"/>
  <circle cx="485" cy="242" r="9" fill="#4df4ff"/>
  <circle cx="535" cy="242" r="9" fill="#ff4fa3"/>
  <circle cx="585" cy="242" r="9" fill="#ffea55"/>
  <path d="M285 255v105M335 255v105M385 255v105M435 255v105M485 255v105M535 255v105M585 255v105" stroke="#8e4d9f" stroke-width="2" opacity=".55"/>

  <!-- exclusive model inside -->
  <ellipse cx="465" cy="330" rx="75" ry="34" fill="#ff4fa3" opacity=".18"/>
  <rect x="425" y="292" width="80" height="65" rx="16" fill="#63e6ff" stroke="#d8fbff" stroke-width="4"/>
  <rect x="439" y="307" width="52" height="25" rx="7" fill="#17243c"/>
  <circle cx="454" cy="319" r="5" fill="#7dffad"/>
  <circle cx="477" cy="319" r="5" fill="#7dffad"/>
  <path d="M450 341 Q465 349 480 341" fill="none" stroke="#17243c" stroke-width="4"/>
  <text x="465" y="378" text-anchor="middle" font-family="monospace" font-size="13" fill="#fff">MODEL_1</text>

