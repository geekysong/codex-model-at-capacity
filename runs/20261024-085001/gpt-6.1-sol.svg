  <rect x="126" y="226" width="86" height="154" rx="28" fill="#31394d" stroke="#151827" stroke-width="5"/>
  <circle cx="169" cy="190" r="42" fill="#65738a" stroke="#151827" stroke-width="5"/>
  <path d="M132 181 Q169 139 207 180" fill="#111522" stroke="#080a11" stroke-width="6"/>
  <rect x="142" y="182" width="54" height="19" rx="8" fill="#151b2b"/>
