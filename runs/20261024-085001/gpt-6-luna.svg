<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17142b"/>
      <stop offset="1" stop-color="#322044"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#261b3b"/>
      <stop offset="1" stop-color="#120e22"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="110" cy="120" r="70" fill="#5a2f8e" opacity=".25"/>
  <circle cx="710" cy="150" r="100" fill="#db2e83" opacity=".12"/>
  <path d="M0 470 Q200 430 400 470 T800 455 V600 H0Z" fill="url(#floor)"/>

  <text x="400" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffcc67">THE EXCLUSIVE MODEL LOUNGE</text>

  <!-- club facade -->
  <rect x="475" y="118" width="280" height="300" rx="18" fill="#21152f" stroke="#8f4db3" stroke-width="4"/>
  <rect x="500" y="145" width="230" height="105" rx="12" fill="#080711" stroke="#5a326f" stroke-width="3"/>
  <text x="615" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#ff4c89">THE</text>
  <text x="615" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#ff4c89">ONE MODEL</text>
  <text x="615" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffc45d">VIP ONLY</text>

  <!-- glowing FULL sign -->
  <rect x="548" y="270" width="135" height="57" rx="10" fill="#ff174d" opacity=".25" filter="url(#glow)"/>
  <rect x="550" y="272" width="130" height="53" rx="8" fill="#4e1024" stroke="#ff547e" stroke-width="3"/>
  <text x="615" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#ff6689">FULL</text>

  <!-- bouncer -->
  <ellipse cx="405" cy="424" rx="60" ry="15" fill="#090712" opacity=".7"/>
  <rect x="370" y="280" width="72" height="125" rx="24" fill="#657080" stroke="#161923" stroke-width="5"/>
  <rect x="376" y="346" width="60" height="55" rx="10" fill="#20283a"/>
  <circle cx="389" cy="374" r="7" fill="#ff3c68"/>
  <circle cx="424" cy="374" r="7" fill="#53e8ff"/>
  <rect x="382" y="293" width="48" height="33" rx="12" fill="#b8c1cb" stroke="#161923" stroke-width="5"/>
  <circle cx="396" cy="309" r="5" fill="#1a1728"/>
  <circle cx="418" cy="309" r="5" fill="#1a1728"/>
  <path d="M397 318 Q407 324 417 318" fill="none" stroke="#1a1728" stroke-width="3"/>
  <path d="M370 322 L340 345" stroke="#657080" stroke-width="16" stroke-linecap="round"/>
  <path d="M442 322 L478 350" stroke="#657080" stroke-width="16" stroke-linecap="round"/>
  <path d="M339 345 L302 332" stroke="#657080" stroke-width="11" stroke-linecap="round"/>
  <rect x="283" y="315" width="55" height="35" rx="6" fill="#fff1d3" stroke="#20202b" stroke-width="4" transform="rotate(-12 310 332)"/>
  <text x="311" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#222" transform="rotate(-12 311 338)">NOPE</text>
  <path d="M390 401 L382 444 M422 401 L432 444" stroke="#657080" stroke-width="17" stroke-linecap="round"/>
  <path d="M374 448 L395 448 M423 448 L444 448" stroke="#161923" stroke-width="9" stroke-linecap="round"/>

  <!-- velvet rope -->
  <path d="M100 440 Q240 490 360 440" fill="none" stroke="#d52e68" stroke-width="7"/>
  <path d="M100 440 Q240 490 360 440" fill="none" stroke="#ff6a9b" stroke-width="2" stroke-dasharray="10 9"/>
  <path d="M100 420 V462 M360 420 V462" stroke="#d7b16d" stroke-width="8"/>
  <circle cx="100" cy="420" r="10" fill="#f7d083"/>
  <circle cx="360" cy="420" r="10" fill="#f7d083"/>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <!-- dev 1 -->
    <circle cx="78" cy="365" r="23" fill="#d89572" stroke="#1a1525" stroke-width="4"/>
    <path d="M56 361 Q78 334 100 361" fill="#33243b"/>
    <rect x="53" y="390" width="50" height="61" rx="14" fill="#3c82b8"/>
    <path d="M62 407 L94 407" stroke="#bde7ff" stroke-width="4"/>
    <path d="M69 451 L65 488 M87 451 L92 488" stroke="#222033" stroke-width="12" stroke-linecap="round"/>
    <text x="78" y="520" text-anchor="middle" font-size="13" fill="#f6d6e0">"again?"</text>
    <!-- dev 2 -->
    <circle cx="170" cy="350" r="23" fill="#b97755" stroke="#1a1525" stroke-width="4"/>
    <path d="M147 348 Q170 322 193 348" fill="#1c2733"/>
    <rect x="145" y="375" width="50" height="73" rx="14" fill="#9a4e73"/>
    <path d="M154 389 L187 389" stroke="#ffd1e1" stroke-width="4"/>
    <path d="M160 448 L155 487 M181 448 L187 487" stroke="#222033" stroke-width="12" stroke-linecap="round"/>
    <text x="170" y="520" text-anchor="middle" font-size="13" fill="#f6d6e0">"try later"</text>
    <!-- dev 3 -->
    <circle cx="260" cy="378" r="22" fill="#e2aa83" stroke="#1a1525" stroke-width="4"/>
    <path d="M238 373 Q260 346 282 373" fill="#d9d8dc"/>
    <rect x="236" y="402" width="49" height="59" rx="14" fill="#4b9b72"/>
    <path d="M246 418 L276 418" stroke="#d2ffe6" stroke-width="4"/>
    <path d="M249 460 L245 495 M273 460 L279 495" stroke="#222033" stroke-width="12" stroke-linecap="round"/>
    <text x="260" y="520" text-anchor="middle" font-size="13" fill="#f6d6e0">"capacity?"</text>
  </g>

  <!-- melting hamster servers -->
  <g transform="translate(545 375)">
    <ellipse cx="0" cy="53" rx="78" ry="17" fill="#080711" opacity=".6"/>
    <ellipse cx="0" cy="20" rx="72" ry="40" fill="#7c8a9c" stroke="#171925" stroke-width="5"/>
    <ellipse cx="0" cy="20" rx="48" ry="25" fill="#273044" stroke="#b3c5d6" stroke-width="3"/>
    <circle cx="-20" cy="12" r="8" fill="#ffcf62"/>
    <circle cx="10" cy="12" r="8" fill="#ff557c"/>
    <path d="M-20 32 Q0 44 20 30" fill="none" stroke="#ff5a6f" stroke-width="6"/>
    <path d="M-56 45 Q-75 75 -48 78 Q-25 81 -15 57" fill="#ff9b61" opacity=".8"/>
    <path d="M25 46 Q45 73 64 63 Q77 55 62 42" fill="#ff9b61" opacity=".8"/>
    <text x="0" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#ffbd72">SERVER HAMSTERS: TOASTY</text>
  </g>

  <!-- speech bubble -->
  <path d="M160 150 Q160 105 245 105 H355 Q430 105 430 150 Q430 195 355 195 H230 L195 220 L200 194 Q160 188 160 150Z" fill="#fff7df" stroke="#201a31" stroke-width="5"/>
  <text x="294" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#2a1b38">SELECTED MODEL IS</text>
  <text x="294" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="900" fill="#e32f63">AT CAPACITY.</text>

  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#f8d5a5">“Please try a different model.” — the bouncer, every single night</text>
</svg>