<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17132c"/>
      <stop offset="1" stop-color="#321542"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25152e"/>
      <stop offset="1" stop-color="#120f20"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e4ed"/>
      <stop offset="1" stop-color="#687487"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 455 Q200 420 400 455 T800 445 V600 H0Z" fill="url(#floor)"/>
  <path d="M0 480 L800 480" stroke="#733d72" stroke-width="3" opacity=".7"/>

  <!-- title -->
  <text x="400" y="48" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" fill="#fff">
    CODEX NIGHTCLUB: ACCESS DENIED
  </text>
  <text x="400" y="77" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#ffb6e9">
    “Selected model is at capacity. Please try a different model.”
  </text>

  <!-- club facade -->
  <rect x="505" y="125" width="250" height="345" rx="16" fill="#090914" stroke="#69416f" stroke-width="5"/>
  <rect x="530" y="180" width="200" height="255" rx="10" fill="#181329" stroke="#b15ab1" stroke-width="3"/>
  <path d="M540 210 H720 M540 400 H720" stroke="#4a3467" stroke-width="3"/>
  <circle cx="630" cy="300" r="88" fill="#30204b" opacity=".65"/>
  <text x="630" y="155" text-anchor="middle" font-family="Arial" font-size="22" font-weight="900" fill="#ff68ca">THE ONE-MODEL CLUB</text>

  <!-- glowing FULL sign -->
  <rect x="550" y="205" width="160" height="68" rx="11" fill="#3b101f" stroke="#ff3e56" stroke-width="6" filter="url(#redGlow)"/>
  <text x="630" y="252" text-anchor="middle" font-family="Arial Black,Arial" font-size="38" font-weight="900" fill="#ff5965">FULL</text>
  <text x="630" y="266" text-anchor="middle" font-family="Arial" font-size="9" fill="#ffd1d5">CAPACITY: 100%</text>

  <!-- bouncer robot -->
  <ellipse cx="585" cy="457" rx="75" ry="13" fill="#080812" opacity=".7"/>
  <rect x="545" y="304" width="85" height="125" rx="25" fill="url(#metal)" stroke="#222a38" stroke-width="5"/>
  <rect x="552" y="320" width="71" height="54" rx="17" fill="#11182a" stroke="#8aa0b5" stroke-width="4"/>
  <circle cx="575" cy="347" r="8" fill="#ff4664" filter="url(#redGlow)"/>
  <circle cx="601" cy="347" r="8" fill="#ff4664" filter="url(#redGlow)"/>
  <path d="M570 361 Q588 372 606 361" fill="none" stroke="#ff8a9a" stroke-width="4"/>
  <path d="M535 337 L515 370 M635 337 L655 370" stroke="#9eafbf" stroke-width="13" stroke-linecap="round"/>
  <path d="M535 337 L515 370" stroke="#ffcc54" stroke-width="4"/>
  <path d="M635 337 L655 370" stroke="#ffcc54" stroke-width="4"/>
  <rect x="565" y="391" width="45" height="21" rx="5" fill="#273546"/>
  <text x="587" y="406" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#8effd4">NOPE</text>
  <path d="M555 425 L535 466 M620 425 L639 466" stroke="#7e8d9f" stroke-width="15" stroke-linecap="round"/>
  <circle cx="587" cy="292" r="6" fill="#ffcf5d"/>
  <path d="M587 292 V278" stroke="#96aabd" stroke-width="4"/>

  <!-- velvet rope -->
  <path d="M495 454 Q560 420 640 454 Q688 475 739 454" fill="none" stroke="#e34b78" stroke-width="9"/>
  <path d="M495 454 V486 M739 454 V486" stroke="#d6b071" stroke-width="9"/>
  <circle cx="495" cy="454" r="9" fill="#ffe3a4"/>
  <circle cx="739" cy="454" r="9" fill="#ffe3a4"/>

  <!-- queue of developers -->
  <g stroke="#20243a" stroke-width="4">
    <circle cx="105" cy="364" r="24" fill="#d99a7c"/>
    <path d="M72 438 Q105 395 138 438 V477 H72Z" fill="#386fa8"/>
    <path d="M82 351 Q105 320 128 351" fill="none" stroke="#4d2d2d" stroke-width="13"/>

    <circle cx="184" cy="377" r="23" fill="#f0bc98"/>
    <path d="M151 448 Q184 407 217 448 V480 H151Z" fill="#d34e6a"/>
    <path d="M161 368 Q184 344 207 368" fill="none" stroke="#d6d6df" stroke-width="13"/>
    <rect x="166" y="372" width="15" height="10" fill="#c7efff"/><rect x="187" y="372" width="15" height="10" fill="#c7efff"/>

    <circle cx="263" cy="363" r="24" fill="#9b694f"/>
    <path d="M230 438 Q263 397 296 438 V480 H230Z" fill="#6fa75d"/>
    <path d="M240 350 Q263 330 286 350" fill="none" stroke="#171822" stroke-width="13"/>
    <path d="M248 373 Q263 379 278 373" fill="none" stroke="#4d2828" stroke-width="4"/>

    <circle cx="343" cy="381" r="22" fill="#efbd9c"/>
    <path d="M311 451 Q343 412 375 451 V480 H311Z" fill="#8054b5"/>
    <path d="M321 370 Q343 348 365 370" fill="none" stroke="#e5a147" stroke-width="13"/>
    <path d="M329 384 H357" stroke="#25263a" stroke-width="5"/>

    <circle cx="420" cy="366" r="24" fill="#c78466"/>
    <path d="M387 440 Q420 398 453 440 V480 H387Z" fill="#4a9f9c"/>
    <path d="M397 352 Q420 326 443 352" fill="none" stroke="#493327" stroke-width="13"/>
    <path d="M407 371 Q420 378 433 371" fill="none" stroke="#4b2525" stroke-width="4"/>
  </g>

  <!-- queue signs and exhaustion -->
  <path d="M125 320 L125 270" stroke="#b88b5c" stroke-width="5"/>
  <rect x="70" y="230" width="110" height="43" rx="5" fill="#fff3c7" stroke="#aa7a4a" stroke-width="4" transform="rotate(-7 125 251)"/>
  <text x="125" y="248" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#47233e" transform="rotate(-7 125 251)">I JUST NEED</text>
  <text x="125" y="263" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#47233e" transform="rotate(-7 125 251)">ONE ANSWER</text>
  <text x="82" y="410" font-family="Arial" font-size="26" fill="#9ed4ff">Z</text>
  <text x="152" y="430" font-family="Arial" font-size="19" fill="#9ed4ff">z</text>
  <text x="265" y="420" font-family="Arial" font-size="24" fill="#9ed4ff">Z</text>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(278 492)">
    <circle cx="0" cy="0" r="42" fill="none" stroke="#8b9aaa" stroke-width="8"/>
    <path d="M-29 -28 L29 28 M29 -28 L-29 28" stroke="#8b9aaa" stroke-width="6"/>
    <ellipse cx="0" cy="-2" rx="11" ry="18" fill="#d8a77b"/>
    <circle cx="-4" cy="-8" r="2" fill="#281b28"/>
    <path d="M-10 8 Q0 15 10 8" fill="none" stroke="#281b28" stroke-width="2"/>
    <path d="M-40 39 Q-17 28 0 42 Q18 29 43 39" fill="none" stroke="#ff6a4f" stroke-width="7" stroke-linecap="round"/>
    <path d="M-16 48 Q0 35 16 48" fill="none" stroke="#ffd052" stroke-width="5"/>
  </g>
  <g transform="translate(385 495)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#7e8b9e" stroke-width="8"/>
    <path d="M-28 -26 L28 26 M28 -26 L-28 26" stroke="#7e8b9e" stroke-width="6"/>
    <rect x="-12" y="-17" width="24" height="28" rx="5" fill="#4fd2c2"/>
    <circle cx="-5" cy="-7" r="2" fill="#10262b"/><circle cx="5" cy="-7" r="2" fill="#10262b"/>
    <path d="M-9 2 Q0 8 9 2" fill="none" stroke="#10262b" stroke-width="2"/>
    <path d="M-39 40 Q-18 28 0 42 Q17 29 40 40" fill="none" stroke="#ff6a4f" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- caption -->
  <rect x="70" y="535" width="660" height="42" rx="20" fill="#111020" stroke="#ff70bd" stroke-width="3"/>
  <text x="400" y="562" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="900" fill="#fff">
    “At capacity” — because even the servers need a mental-health day.
  </text>
</svg>