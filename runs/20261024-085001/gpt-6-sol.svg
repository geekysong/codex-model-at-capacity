<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152f"/>
      <stop offset="1" stop-color="#342044"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c7a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ink{stroke:#17152f;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#fff}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="90" cy="90" r="55" fill="#5b2d69" opacity=".35"/>
  <circle cx="730" cy="110" r="80" fill="#5b2d69" opacity=".3"/>

  <text x="400" y="54" text-anchor="middle" class="txt" font-size="30" font-weight="900" letter-spacing="2">CODEX NIGHTCLUB</text>
  <text x="400" y="87" text-anchor="middle" class="txt" font-size="18" fill="#ffcf70">THE MOST EXCLUSIVE MODEL IN TOWN</text>

  <!-- club facade -->
  <rect x="250" y="125" width="500" height="325" rx="28" fill="#241b3c" class="ink"/>
  <rect x="285" y="180" width="430" height="235" rx="18" fill="#111323" class="ink"/>
  <path d="M285 225h430M285 270h430" stroke="#3d315c" stroke-width="5"/>
  <circle cx="365" cy="205" r="9" fill="#55f2d5"/>
  <circle cx="400" cy="205" r="9" fill="#ff5c7a"/>
  <circle cx="435" cy="205" r="9" fill="#ffd166"/>

  <!-- FULL sign -->
  <g filter="url(#glow)">
    <rect x="375" y="112" width="220" height="88" rx="15" fill="url(#sign)" class="ink"/>
    <text x="485" y="172" text-anchor="middle" class="txt" font-size="52" font-weight="900">FULL</text>
  </g>
  <path d="M485 200v34" stroke="#17152f" stroke-width="8"/>

  <!-- exclusive model inside -->
  <g transform="translate(540 290)">
    <rect x="-72" y="-63" width="144" height="105" rx="28" fill="#72e7dc" class="ink"/>
    <circle cx="-28" cy="-16" r="13" fill="#17152f"/>
    <circle cx="28" cy="-16" r="13" fill="#17152f"/>
    <path d="M-36 15q36 30 72 0" fill="none" class="ink"/>
    <rect x="-42" y="44" width="84" height="27" rx="13" fill="#ffd166" class="ink"/>
    <text x="0" y="64" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#17152f">MODEL 1</text>
    <path d="M-52 -63v-25M52 -63v-25" class="ink"/>
    <circle cx="-52" cy="-94" r="8" fill="#ff5c7a" class="ink"/>
    <circle cx="52" cy="-94" r="8" fill="#ff5c7a" class="ink"/>
  </g>
  <text x="540" y="390" text-anchor="middle" class="txt" font-size="17" font-weight="bold">“Sorry, VIP only.”</text>

  <!-- bouncer -->
  <g transform="translate(228 270)">
    <ellipse cx="0" cy="160" rx="93" ry="22" fill="#0d0d18" opacity=".55"/>
    <rect x="-48" y="-15" width="96" height="155" rx="35" fill="#5f6b86" class="ink"/>
    <rect x="-62" y="-85" width="124" height="86" rx="28" fill="#9aa9bc" class="ink"/>
    <rect x="-43" y="-65" width="35" height="23" rx="8" fill="#17152f"/>
    <rect x="8" y="-65" width="35" height="23" rx="8" fill="#17152f"/>
    <path d="M-23 -25h46" class="ink"/>
    <path d="M-60 18l-50 38M60 18l66 10" class="ink"/>
    <path d="M-110 56l-22-8M126 66l22 8" class="ink"/>
    <path d="M-28 138v45M28 138v45" class="ink"/>
    <path d="M-47 -97h94l-12-30h-70z" fill="#ff5c7a" class="ink"/>
    <text x="0" y="-106" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#fff">Bouncer.exe</text>
    <rect x="-113" y="66" width="93" height="38" rx="12" fill="#ffd166" class="ink" transform="rotate(-8)"/>
    <text x="-67" y="91" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#17152f" transform="rotate(-8)">NOPE</text>
  </g>

  <!-- velvet rope -->
  <path d="M92 438 Q220 382 342 438 Q430 478 560 435" fill="none" stroke="#ff3f70" stroke-width="12"/>
  <path d="M92 438v88M560 435v91" stroke="#ffd166" stroke-width="9"/>
  <circle cx="92" cy="438" r="13" fill="#ffd166" class="ink"/>
  <circle cx="560" cy="435" r="13" fill="#ffd166" class="ink"/>

  <!-- queue developers -->
  <g class="ink">
    <g transform="translate(82 360)">
      <circle cx="0" cy="0" r="27" fill="#f2b18f"/><path d="M-27 0q8-42 44-20" fill="#6b3e2e"/>
      <path d="M-30 34h60v72h-60z" fill="#4fd1c5"/><path d="M-12 54h25" stroke="#17152f"/>
      <path d="M-20 106l-18 70M20 106l18 70" fill="none"/>
      <text x="0" y="145" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">DEV</text>
    </g>
    <g transform="translate(160 390)">
      <circle cx="0" cy="0" r="25" fill="#9d6b53"/><path d="M-24-2q10-35 45-17" fill="#d7d7e8"/>
      <path d="M-28 32h56v66h-56z" fill="#ffb347"/><path d="M-17 53h34" stroke="#17152f"/>
      <path d="M-18 98l-15 67M18 98l15 67" fill="none"/>
    </g>
    <g transform="translate(245 405)">
      <circle cx="0" cy="0" r="24" fill="#d69570"/><path d="M-25-4q10-37 35-24" fill="#17152f"/>
      <path d="M-27 31h54v62h-54z" fill="#a58cff"/><path d="M-15 51h30" stroke="#17152f"/>
      <path d="M-16 93l-15 64M16 93l15 64" fill="none"/>
    </g>
  </g>

  <!-- exhausted speech bubbles -->
  <path d="M40 292q0-30 38-30h93q38 0 38 30t-38 30H78l-25 22 7-22q-20-8-20-30z" fill="#fff" class="ink"/>
  <text x="110" y="300" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#17152f">TRY AGAIN?</text>
  <path d="M85 520q0-25 32-25h135q32 0 32 25t-32 25H117l-22 19 6-19q-16-7-16-25z" fill="#fff" class="ink"/>
  <text x="168" y="527" text-anchor="middle" font-family="Arial" font-size="15" font-weight="900" fill="#17152f">I BROUGHT SNACKS.</text>

  <!-- melting servers -->
  <g transform="translate(665 477)">
    <rect x="-50" y="-55" width="100" height="78" rx="10" fill="#65738a" class="ink"/>
    <path d="M-34-30h68M-34-5h68" stroke="#17152f" stroke-width="7"/>
    <circle cx="-25" cy="-30" r="5" fill="#55f2d5"/><circle cx="-25" cy="-5" r="5" fill="#ff5c7a"/>
    <path d="M-37 23q-8 28 12 34t24 25q15-18 30-9t23-18q-19-16-9-36" fill="#ff8b5c" opacity=".9"/>
    <path d="M-10 82q8 17 20 0M18 82q8 17 20 0" fill="none" stroke="#ffcf70" stroke-width="7"/>
    <text x="0" y="116" text-anchor="middle" class="txt" font-size="14" font-weight="bold">SERVER FARM</text>
  </g>

  <rect x="30" y="558" width="740" height="2" fill="#ff5c7a"/>
  <text x="400" y="586" text-anchor="middle" class="txt" font-size="23" font-weight="900">“SELECTED MODEL IS AT CAPACITY. PLEASE TRY A DIFFERENT MODEL.”</text>
</svg>