<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17132d"/>
      <stop offset="1" stop-color="#090814"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fc3"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="650" cy="120" r="130" fill="#6637d8" opacity=".12" filter="url(#softGlow)"/>
  <circle cx="190" cy="250" r="120" fill="#ef3bb5" opacity=".08" filter="url(#softGlow)"/>

  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#ff77d8">THE FUTURE OF WORK IS CURRENTLY FULL</text>

  <!-- Club facade -->
  <rect x="505" y="130" width="255" height="365" rx="18" fill="#211d3d" stroke="#7d68db" stroke-width="5"/>
  <path d="M490 150 Q630 70 770 150" fill="#31245d" stroke="#ff4fc3" stroke-width="6"/>
  <text x="632" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#ff85df">THE EXCLUSIVE</text>
  <text x="632" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="900" fill="#fff">MODEL CLUB</text>

  <!-- Full sign -->
  <rect x="555" y="245" width="155" height="72" rx="14" fill="#341426" stroke="#ff315d" stroke-width="6" filter="url(#glow)"/>
  <text x="632" y="294" text-anchor="middle" font-family="Arial Black, Arial" font-size="39" font-weight="900" fill="#ff496c">FULL</text>
  <circle cx="572" cy="262" r="5" fill="#ffdc68"/>
  <circle cx="692" cy="262" r="5" fill="#ffdc68"/>

  <!-- Dance floor glimpse -->
  <rect x="530" y="350" width="205" height="120" rx="12" fill="#101022"/>
  <path d="M550 440 L580 375 L610 440 M620 440 L650 375 L680 440 M690 440 L720 375" fill="none" stroke="#35f0df" stroke-width="4" opacity=".7"/>
  <text x="632" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#8efff5">ONE MODEL INSIDE</text>
  <text x="632" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8efff5">(V.I.P. ACCESS)</text>

  <!-- Robot bouncer -->
  <ellipse cx="470" cy="478" rx="90" ry="15" fill="#000" opacity=".35"/>
  <rect x="408" y="300" width="125" height="150" rx="25" fill="#8b94a8" stroke="#25283b" stroke-width="7"/>
  <rect x="421" y="318" width="99" height="70" rx="18" fill="#151a29" stroke="#b9c7d8" stroke-width="5"/>
  <circle cx="452" cy="352" r="11" fill="#ff405d" filter="url(#glow)"/>
  <circle cx="490" cy="352" r="11" fill="#ff405d" filter="url(#glow)"/>
  <path d="M446 373 Q470 388 497 373" fill="none" stroke="#ffbd51" stroke-width="6"/>
  <rect x="438" y="401" width="66" height="24" rx="8" fill="#272d42"/>
  <text x="471" y="419" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6effe7">BOUNCER</text>
  <path d="M425 430 L382 478 M516 430 L560 478" stroke="#727d95" stroke-width="19" stroke-linecap="round"/>
  <path d="M444 449 L435 505 M496 449 L507 505" stroke="#727d95" stroke-width="22" stroke-linecap="round"/>
  <path d="M382 478 L350 478 M560 478 L590 478" stroke="#bbc6d4" stroke-width="15" stroke-linecap="round"/>
  <rect x="367" y="285" width="150" height="26" rx="8" fill="#3b4260"/>
  <text x="442" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff">MODEL CHECK</text>
  <path d="M485 273 L497 252 L508 273" fill="none" stroke="#ffbd51" stroke-width="5"/>

  <!-- Queue -->
  <path d="M50 505 H385" stroke="#d52d91" stroke-width="4" stroke-dasharray="8 10"/>
  <g font-family="Arial, sans-serif">
    <!-- developer 1 -->
    <g transform="translate(80,390)">
      <circle cx="0" cy="0" r="26" fill="#e3a47d"/>
      <path d="M-27 -6 Q-2 -37 28 -7 Q14 -23 -22 -16" fill="#4b2b2b"/>
      <rect x="-35" y="28" width="70" height="77" rx="18" fill="#49a6bb"/>
      <path d="M-24 55 H24 M-20 69 H17" stroke="#d6ffff" stroke-width="5"/>
      <circle cx="-8" cy="-1" r="3" fill="#222"/><circle cx="10" cy="-1" r="3" fill="#222"/>
      <path d="M-10 14 Q0 20 11 13" fill="none" stroke="#8b3c3c" stroke-width="3"/>
      <text x="0" y="137" text-anchor="middle" font-size="15" fill="#f5eaff">DEV #47</text>
    </g>
    <!-- developer 2 -->
    <g transform="translate(185,410)">
      <circle cx="0" cy="0" r="25" fill="#8c5b45"/>
      <path d="M-25 -4 Q0 -37 27 -6 L21 -19 Q-7 -29 -24 -14" fill="#171622"/>
      <rect x="-36" y="27" width="72" height="86" rx="17" fill="#f2a735"/>
      <rect x="-21" y="47" width="42" height="25" rx="4" fill="#261f41"/>
      <path d="M-15 55 H14 M-11 63 H6" stroke="#73f6dd" stroke-width="3"/>
      <circle cx="-9" cy="-1" r="3" fill="#222"/><circle cx="9" cy="-1" r="3" fill="#222"/>
      <path d="M-9 13 Q0 8 10 14" fill="none" stroke="#40211c" stroke-width="3"/>
      <text x="0" y="145" text-anchor="middle" font-size="15" fill="#f5eaff">DEV #48</text>
    </g>
    <!-- developer 3 -->
    <g transform="translate(290,390)">
      <circle cx="0" cy="0" r="26" fill="#d18a63"/>
      <path d="M-29 -5 Q0 -38 30 -4 L22 -24 Q-6 -37 -27 -17" fill="#d6d0bd"/>
      <rect x="-36" y="28" width="72" height="86" rx="17" fill="#765bd4"/>
      <path d="M-20 55 Q0 42 20 55" fill="none" stroke="#fff" stroke-width="5"/>
      <circle cx="-9" cy="-1" r="3" fill="#222"/><circle cx="10" cy="-1" r="3" fill="#222"/>
      <path d="M-10 15 Q0 8 11 15" fill="none" stroke="#733b39" stroke-width="3"/>
      <text x="0" y="145" text-anchor="middle" font-size="15" fill="#f5eaff">DEV #49</text>
    </g>
  </g>

  <!-- Tired queue speech bubbles -->
  <path d="M54 322 Q110 280 170 321 Q183 350 157 370 Q104 385 63 362 Z" fill="#fff7e8" stroke="#26203c" stroke-width="4"/>
  <text x="113" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#312344">I JUST NEED</text>
  <text x="113" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#312344">ONE ANSWER...</text>

  <path d="M215 275 Q276 240 334 278 Q345 307 317 324 Q265 337 225 316 Z" fill="#fff7e8" stroke="#26203c" stroke-width="4"/>
  <text x="275" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#312344">CAN I TRY</text>
  <text x="275" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#312344">A DIFFERENT MODEL?</text>

  <!-- Velvet rope -->
  <path d="M36 475 Q220 510 382 475" fill="none" stroke="#e02777" stroke-width="10"/>
  <path d="M36 475 V520 M382 475 V520" stroke="#e8c46a" stroke-width="8"/>
  <circle cx="36" cy="475" r="11" fill="#ffe28a"/>
  <circle cx="382" cy="475" r="11" fill="#ffe28a"/>

  <!-- Server hamster wheels melting -->
  <g transform="translate(105,535)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#65e8df" stroke-width="7"/>
    <path d="M-25 -22 L25 22 M25 -22 L-25 22 M0 -34 V34" stroke="#65e8df" stroke-width="4"/>
    <ellipse cx="0" cy="-4" rx="15" ry="10" fill="#d49355"/>
    <circle cx="6" cy="-7" r="2" fill="#222"/>
    <path d="M-31 28 Q-20 45 -8 30 Q0 50 12 30 Q22 45 32 25" fill="none" stroke="#ff5d5d" stroke-width="5"/>
  </g>
  <g transform="translate(220,535)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#65e8df" stroke-width="7"/>
    <path d="M-25 -22 L25 22 M25 -22 L-25 22 M0 -34 V34" stroke="#65e8df" stroke-width="4"/>
    <ellipse cx="0" cy="-4" rx="15" ry="10" fill="#d49355"/>
    <circle cx="6" cy="-7" r="2" fill="#222"/>
    <path d="M-31 28 Q-20 45 -8 30 Q0 50 12 30 Q22 45 32 25" fill="none" stroke="#ff5d5d" stroke-width="5"/>
  </g>
  <text x="162" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ff8d8d">SERVERS: PLEASE STOP ASKING</text>

  <!-- Bouncer message -->
  <path d="M330 175 Q380 135 438 163 L452 218 Q400 244 344 220 Z" fill="#fff7e8" stroke="#26203c" stroke-width="4"/>
  <text x="395" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#312344">SORRY, FRIEND.</text>
  <text x="395" y="201" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#312344">SELECTED MODEL</text>
  <text x="395" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f58">AT CAPACITY.</text>

  <!-- Caption -->
  <rect x="40" y="105" width="360" height="58" rx="14" fill="#fff" opacity=".95"/>
  <text x="220" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#17132d">WHEN YOUR AI SAYS “AT CAPACITY,”</text>
  <text x="220" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#d52d91">BUT THE QUEUE HAS A QUEUE.</text>
</svg>