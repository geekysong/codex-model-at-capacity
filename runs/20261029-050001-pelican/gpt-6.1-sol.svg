<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>The Pelican's Two-Wheeled Seafood Express</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f5"/>
      <stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636b"/>
      <stop offset="1" stop-color="#30363b"/>
    </linearGradient>
    <style>
      .ink{stroke:#20252a;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#20252a}
      .bold{font-weight:800}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="48" fill="#fff6b0" opacity=".9"/>
  <path d="M0 385 Q125 330 245 380 T490 370 T800 365 V600 H0Z" fill="#94c96b"/>
  <path d="M0 440 Q210 415 400 438 T800 430 V600 H0Z" fill="url(#road)"/>
  <path d="M0 525 Q210 500 400 522 T800 515" fill="none" stroke="#f4d35e" stroke-width="8" stroke-dasharray="34 26"/>

  <text x="400" y="62" text-anchor="middle" class="label bold" font-size="32">THE PELICAN'S TWO-WHEELED SEAFOOD EXPRESS</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="19">“Why fly south when you can pedal toward lunch?”</text>

  <g id="bike">
    <g id="rearWheel">
      <circle cx="260" cy="430" r="72" fill="#dce7ec" class="ink"/>
      <circle cx="260" cy="430" r="10" fill="#20252a"/>
      <g stroke="#20252a" stroke-width="3">
        <path d="M260 358V502M188 430H332M209 379L311 481M311 379L209 481"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 260 430" to="360 260 430" dur="2s" repeatCount="indefinite"/>
    </g>
    <g id="frontWheel">
      <circle cx="560" cy="430" r="72" fill="#dce7ec" class="ink"/>
      <circle cx="560" cy="430" r="10" fill="#20252a"/>
      <g stroke="#20252a" stroke-width="3">
        <path d="M560 358V502M488 430H632M509 379L611 481M611 379L509 481"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 560 430" to="360 560 430" dur="2s" repeatCount="indefinite"/>
    </g>
    <path d="M260 430 L350 330 L470 430 L260 430 L405 430 L350 330 L560 430" fill="none" stroke="#d94f4f" stroke-width="12" class="ink"/>
    <path d="M350 330 L330 285 M350 330 L390 305" fill="none" stroke="#20252a" stroke-width="8"/>
    <path d="M540 320 L570 285" fill="none" stroke="#20252a" stroke-width="8"/>
    <circle cx="405" cy="430" r="18" fill="#f4d35e" class="ink"/>
    <path d="M405 430 L437 462 M405 430 L380 397" fill="none" stroke="#20252a" stroke-width="7"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 405 430;18 405 430;0 405 430;-18 405 430;0 405 430" dur="1.1s" repeatCount="indefinite"/>
      <circle cx="437" cy="462" r="7" fill="#20252a"/>
      <circle cx="380" cy="397" r="7" fill="#20252a"/>
    </g>
    <path d="M560 430 L540 320 L575 310 L590 430" fill="none" stroke="#20252a" stroke-width="8"/>
    <path d="M540 320 L590 320" fill="none" stroke="#20252a" stroke-width="8"/>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 -4;0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="405" cy="270" rx="92" ry="112" fill="#f4f1e8" class="ink"/>
    <path d="M350 225 Q305 205 285 165 Q340 166 385 198Z" fill="#c9d2d7" class="ink"/>
    <path d="M373 185 Q406 130 463 151 Q497 164 506 204 Q507 259 470 288 Q425 315 380 288" fill="#f7f4ec" class="ink"/>
    <ellipse cx="447" cy="186" rx="9" ry="12" fill="#20252a"/>
    <path d="M466 205 Q548 205 620 240 Q565 275 467 247 Q438 238 431 221Z" fill="#f2a65a" class="ink"/>
    <path d="M466 205 Q550 218 620 240" fill="none" stroke="#b76835" stroke-width="4"/>
    <path d="M476 246 Q520 300 487 337" fill="none" stroke="#20252a" stroke-width="7"/>
    <path d="M401 280 Q365 330 380 388" fill="none" stroke="#20252a" stroke-width="9"/>
    <path d="M430 280 Q466 330 443 388" fill="none" stroke="#20252a" stroke-width="9"/>
    <path d="M380 388 l-24 9 M380 388 l24 4 M443 388 l-22 10 M443 388 l25 2" fill="none" stroke="#f2a65a" stroke-width="7"/>
    <path d="M347 258 Q314 285 300 322" fill="none" stroke="#20252a" stroke-width="10"/>
    <path d="M300 322 Q325 315 348 330" fill="none" stroke="#20252a" stroke-width="7"/>
    <path d="M493 177 Q531 154 556 177" fill="none" stroke="#20252a" stroke-width="6"/>
    <text x="405" y="365" text-anchor="middle" class="label bold" font-size="18" fill="#d94f4f">DELIVERY?</text>
  </g>

  <g>
    <path d="M135 280 q22 -25 44 0" fill="none" stroke="#20252a" stroke-width="5"/>
    <path d="M170 280 q22 -25 44 0" fill="none" stroke="#20252a" stroke-width="5"/>
  </g>
  <text x="400" y="565" text-anchor="middle" class="label" font-size="17">2026-10-29 05:00:46 SGT (UTC+08:00)</text>
</svg>