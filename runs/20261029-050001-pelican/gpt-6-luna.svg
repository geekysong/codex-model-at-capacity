<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9edcff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636d"/>
      <stop offset="1" stop-color="#303841"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#15202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#18232d;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#18232d}
      .small{font-size:18px}
      .title{font-size:38px;font-weight:800;letter-spacing:1px}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd45c" opacity=".9"/>
  <path d="M0 310 Q120 250 250 305 T520 285 T800 300 V385 H0Z" fill="#9bc68b"/>
  <path d="M0 355 Q140 320 280 350 T560 340 T800 350 V420 H0Z" fill="#75a86d"/>
  <path d="M0 392 H800 V565 H0Z" fill="url(#road)"/>
  <path d="M0 480 H800" stroke="#f7d56b" stroke-width="8" stroke-dasharray="62 34" opacity=".9"/>
  <path d="M0 540 H800" stroke="#202930" stroke-width="12"/>

  <g filter="url(#shadow)">
    <rect x="52" y="35" width="696" height="82" rx="20" fill="#fff4c8" class="ink"/>
    <text x="400" y="78" text-anchor="middle" class="label title">THE GREAT PELICAN GETAWAY</text>
    <text x="400" y="103" text-anchor="middle" class="label small">One bird. Two wheels. Absolutely no license.</text>
  </g>

  <g id="bike">
