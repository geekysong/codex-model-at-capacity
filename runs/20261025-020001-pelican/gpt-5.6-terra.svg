<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle.</desc>
  <defs>
    <style>
      .wheel { animation: spin 1s linear infinite; transform-box: fill-box; transform-origin: center; }
      .rider { animation: bob .55s ease-in-out infinite alternate; transform-origin: 420px 325px; }
      .leg-a { animation: pedalA 1s linear infinite; transform-origin: 420px 390px; }
      .leg-b { animation: pedalB 1s linear infinite; transform-origin: 420px 390px; }
      .beak { animation: honk .8s ease-in-out infinite alternate; transform-origin: 318px 273px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
      @keyframes pedalA { to { transform: rotate(360deg); } }
      @keyframes pedalB { to { transform: rotate(360deg); } }
      @keyframes honk { to { transform: rotate(-4deg); } }
    </style>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#8fe0ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
  </defs>

