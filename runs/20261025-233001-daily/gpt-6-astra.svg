<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="50" y="30" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="50" y="55">Initial velocity: horizontal 20 m/s, vertical 15 m/s</text>
    <text x="50" y="77">Gravity: 10 m/s² · No air resistance · Flight time: 3 s</text>
    <text x="50" y="101">Scale: 10 px/m. Horizontal distance is measured from launch.</text>
    <text x="50" y="125">Trajectory break omits 34–58 m to fit the canvas.</text>
    <text x="50" y="147">After the break, horizontal coordinates shift left by 210 px.</text>
  </g>

  <path d="M50 350 H550" fill="none" stroke="#485568" stroke-width="2"/>

  <!-- Physical trajectory: x=100+200t, y=350-150t+50t².
       First segment: 0≤t≤1.7. Second: 2.9≤t≤3, shifted left 210 px. -->
  <g fill="none" stroke="#1565c0" stroke-width="3">
    <path d="M100 350 Q270 222.5 440 239.5"/>
    <path d="M470 335.5 Q480 342.5 490 350"/>
  </g>

  <g stroke="#1565c0" stroke-width="2">
    <path d="M435 233 L439 246 M442 234 L446 247"/>
    <path d="M463 336 L474 329 M468 342 L479 335"/>
  </g>

  <g fill="#1565c0">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="490" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="325" y="215">apex: 30 m, 11.25 m</text>
    <text x="55" y="372">launch: 0 m, 0 m</text>
    <text x="420" y="372">landing: 60 m, 0 m</text>
  </g>

  <rect x="0" y="380" width="600" height="20" fill="#eef2f6"/>
  <text x="300" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172033">2026-10-25 23:33:58 SGT (UTC+08:00)</text>
</svg>