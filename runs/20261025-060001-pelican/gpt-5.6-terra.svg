<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the Daily Squawk</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle while carrying an oversized fish-shaped briefcase.</desc>
  <style>
    .wheel { animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
    .rider { animation: bob .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .leg { animation: pedal .55s linear infinite alternate; transform-box: fill-box; transform-origin: 50% 15%; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(20deg); } }
  </style>

