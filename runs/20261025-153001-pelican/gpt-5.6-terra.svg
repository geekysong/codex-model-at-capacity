    <path d="M292 291 Q244 283 230 244 Q228 217 253 221 Q282 233 312 261Z" fill="#667f96" class="line"/>
    <path d="M391 261 Q449 285 462 331 Q452 350 430 340 Q397 323 374 291Z" fill="#667f96" class="line"/>

    <path d="M282 208 Q253 211 230 238 Q275 255 321 244 Q344 235 342 219 Q323 199 282 208Z" fill="#f4ae43" class="line"/>
    <path d="M231 238 Q269 266 320 244 Q307 294 268 292 Q235 281 231 238Z" fill="#f7894b" class="line"/>
    <circle cx="344" cy="191" r="22" fill="white" class="line"/>
    <circle cx="349" cy="194" r="8" fill="#17202a"/>
    <path d="M366 174 Q385 167 397 177" class="thin"/>
    <path d="M357 221 Q377 234 398 219" class="thin"/>
