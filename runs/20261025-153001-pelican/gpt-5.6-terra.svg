  <g>
    <ellipse cx="619" cy="435" rx="66" ry="31" fill="#ff9861" class="line"/>
    <path d="M564 434 Q588 383 625 407 Q649 371 677 416 Q691 439 675 459 Q619 481 565 451Z" fill="#ff9861" class="line"/>
    <circle cx="612" cy="420" r="10" fill="white" class="line"/>
    <circle cx="646" cy="418" r="10" fill="white" class="line"/>
    <circle cx="614" cy="422" r="4" fill="#17202a"/>
    <circle cx="644" cy="420" r="4" fill="#17202a"/>
    <path d="M616 445 Q630 455 648 443" class="thin"/>
    <text x="619" y="495" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#17202a">“HE DIDN'T PAY THE BIKE TAX!”</text>
  </g>

  <rect y="520" width="800" height="80" fill="#17202a"/>
  <text x="400" y="550" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8f0d2">One bird. Two wheels. Zero respect for traffic law.</text>
  <text x="400" y="580" text-anchor="middle" font-family="monospace" font-size="14" fill="#9ee6f5">2026-10-25 15:33:03 SGT (UTC+08:00)</text>
</svg>