<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDALS, CITY PANICS</title>
  <desc id="desc">A satirical cartoon of an exuberant pelican riding a bicycle while a startled fish watches.</desc>
  <style>
    .line{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#17202a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .wheel{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
    .bird{animation:bob .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .legA{animation:pedalA 1s linear infinite;transform-box:fill-box;transform-origin:0% 15%}
    .legB{animation:pedalB 1s linear infinite;transform-box:fill-box;transform-origin:0% 15%}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-9px) rotate(-1deg)}}
    @keyframes pedalA{to{transform:rotate(360deg)}}
    @keyframes pedalB{to{transform:rotate(360deg)}}
  </style>

  <rect width="800" height="600" fill="#9ee6f5"/>
  <path d="M0 330 Q100 280 205 332 T405 325 T610 332 T800 300 V470 H0Z" fill="#b9e58f"/>
  <path d="M0 442 Q130 411 270 442 T540 431 T800 443 V506 H0Z" fill="#f5d466"/>
  <path d="M0 486 H800" stroke="#6b7980" stroke-width="10" stroke-dasharray="28 22"/>

  <g opacity=".9">
    <path d="M634 137 l22 -52 22 52z" fill="#f27666" class="line"/>
    <rect x="627" y="137" width="58" height="77" rx="5" fill="#f8f0d2" class="line"/>
    <path d="M640 158h32M640 180h32" class="thin"/>
    <text x="656" y="204" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#17202a">BIKE TAX</text>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="Impact, sans-serif" font-size="42" letter-spacing="2" fill="#17202a">PELICAN PEDALS,</text>
  <text x="400" y="101" text-anchor="middle" font-family="Impact, sans-serif" font-size="42" letter-spacing="2" fill="#ed5145">CITY PANICS!</text>
  <path d="M150 113 Q400 131 646 113" class="thin" stroke="#ed5145"/>

  <g>
    <g class="wheel">
      <circle cx="245" cy="414" r="72" fill="#f8faf7" class="line"/>
      <circle cx="245" cy="414" r="10" fill="#ed5145" class="line"/>
      <path d="M245 342V486M173 414H317M194 363L296 465M296 363L194 465" class="thin" stroke="#65747c"/>
    </g>
    <g class="wheel">
      <circle cx="510" cy="414" r="72" fill="#f8faf7" class="line"/>
      <circle cx="510" cy="414" r="10" fill="#ed5145" class="line"/>
      <path d="M510 342V486M438 414H582M459 363L561 465M561 363L459 465" class="thin" stroke="#65747c"/>
    </g>

    <path d="M245 414 L338 302 L420 414 L510 414 L388 277 L328 414 Z" fill="none" class="line" stroke="#2876a8"/>
    <path d="M338 302 L400 302 M389 277 L432 248 L458 252" fill="none" class="line" stroke="#2876a8"/>
    <path d="M320 294 L357 294" class="line" stroke="#17202a"/>
    <circle cx="420" cy="414" r="22" fill="#f3bf4c" class="line"/>
    <circle cx="420" cy="414" r="5" fill="#17202a"/>
    <path d="M420 414 l34 24 M420 414 l-35 -24" class="thin" stroke="#17202a"/>
  </g>

  <g class="bird">
    <g class="legA">
      <path d="M371 349 Q410 380 454 437" fill="none" stroke="#f58b46" stroke-width="14" stroke-linecap="round"/>
      <ellipse cx="454" cy="439" rx="24" ry="10" fill="#f58b46" class="line"/>
    </g>
    <g class="legB">
      <path d="M353 354 Q390 397 385 390" fill="none" stroke="#f58b46" stroke-width="14" stroke-linecap="round"/>
