<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish-filled basket. Its enormous beak acts as an aerodynamic fairing. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
