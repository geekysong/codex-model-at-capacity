<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican rides a bicycle with a fish-filled front basket. Its enormous beak makes an excellent aerodynamic fairing. Wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="road" width="160" height="12" patternUnits="userSpaceOnUse">
      <path d="M20 6H100" stroke="#fff5d9" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="69" fill="#fff8e5" stroke="#263f45" stroke-width="11"/>
      <circle r="58" fill="none" stroke="#a5b7b1" stroke-width="2"/>
      <g stroke="#66898c" stroke-width="3">
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
      </g>
      <circle r="8" fill="#263f45"/>
    </g>
  </defs>

  <!-- Poster -->
  <path fill="#fff3d5" d="M0 0H800V600H0Z"/>
  <path fill="#d9efea" d="M20 112H780V458H20Z"/>
  <circle cx="661" cy="190" r="47" fill="#ffd46e"/>
  <g fill="#fffaf0">
    <path d="M48 194Q46 176 65 175Q78 150 99 174Q125 171 128 194Z"/>
    <path d="M529 151Q535 129 555 139Q573 116 592 139Q618 137 620 151Z"/>
  </g>

  <text x="400" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="3" fill="#203d43">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#af4f38">ALL THE GEAR. ABSOLUTELY NO HANDS.</text>

  <!-- Seaside scenery -->
  <path d="M20 343Q155 321 293 345T560 342T780 339V413H20Z" fill="#91c8c3"/>
  <g fill="none" stroke="#e5f7eb" stroke-width="3" stroke-linecap="round">
    <path d="M42 365H105M159 375H202M624 366H701M716 386H758"/>
  </g>
  <path d="M20 402H780V489H20Z" fill="#738b85"/>
  <path d="M20 469H780" stroke="#526e69" stroke-width="3"/>
  <path d="M20 450H780V462H20Z" fill="url(#road)"/>

  <!-- Road sign -->
  <path d="M109 294V410" stroke="#304d50" stroke-width="7"/>
  <rect x="38" y="231" width="143" height="68" rx="8" fill="#fff9e9" stroke="#304d50" stroke-width="4"/>
  <text x="109" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#304d50">NO FISHING</text>
  <text x="109" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#304d50">while overtaking</text>

  <ellipse cx="426" cy="457" rx="230" ry="13" fill="#304d50" opacity=".17"/>

  <!-- Spinning wheels -->
  <g transform="translate(271 386)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(581 386)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M271 386L341 287L406 386ZM341 287H523L406 386M523 287L581 386"
          stroke="#253f45" stroke-width="14"/>
    <path d="M271 386L341 287L406 386ZM341 287H523L406 386M523 287L581 386"
          stroke="#e76c51" stroke-width="8"/>
    <path d="M341 287L330 264M523 287L511 253L543 239" stroke="#253f45" stroke-width="8"/>
    <path d="M309 265H349M538 240L553 237" stroke="#253f45" stroke-width="11"/>
    <path d="M271 386L406 386" stroke="#405f5e" stroke-width="4"/>
    <ellipse cx="380" cy="386" rx="39" ry="17" stroke="#405f5e" stroke-width="3"/>
  </g>

  <!-- Grocery basket and passengers -->
  <path d="M551 279L561 333H641L650 279Z" fill="#e1ad65" stroke="#493f32" stroke-width="4"/>
  <g stroke="#9e743f" stroke-width="3" fill="none">
    <path d="M557 296H646M560 313H642M573 281L579 330M593 281L597 331M614 281L615 331M635 281L632 330"/>
  </g>
  <g stroke="#28494b" stroke-width="3" stroke-linejoin="round">
    <path d="M568 279Q585 252 620 270L635 257L634 286L620 276Q589 295 568 279Z" fill="#73b8b5"/>
    <path d="M588 268Q590 244 614 243L617 229L631 244L620 250Q618 272 588 268Z" fill="#a9cfb3"/>
  </g>
  <circle cx="580" cy="276" r="3" fill="#233f44"/>
  <circle cx="602" cy="253" r="3" fill="#233f44"/>
  <rect x="567" y="299" width="69" height="23" rx="3" fill="#fff3d5"/>
  <text x="601" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#304d50">CARB LOAD</text>

  <!-- Bobbing pelican -->
  <g stroke="#263f45" stroke-width="4" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <!-- Tail and body -->
    <path d="M303 244L265 226L282 258L259 254Q278 282 317 276Z" fill="#fffdf2"/>
    <path d="M309 205Q350 174 390 204Q412 224 392 264Q376 287 330 279Q296 276 289 251Q280 226 309 205Z" fill="#fffdf2"/>
    <path d="M306 224Q345 203 376 223Q360 255 315 258Q337 247 344 233Q322 244 306 224Z" fill="#cadbd5"/>
    <!-- Long folded neck -->
    <path d="M372 234Q411 233 417 208Q422 191 405 172Q389 149 413 129Q432 113 452 130Q470 146 453 164Q436 180 450 201Q467 236 436 259Q412 274 382 263"
          fill="#fffdf2"/>
    <!-- Head -->
    <path d="M411 136Q418 109 448 116Q477 120 478 145L455 167Q423 168 411 149Z" fill="#fffdf2"/>
    <!-- Heroic beak -->
    <path d="M458 144L615 164Q572 207 485 192Q466 182 458 144Z" fill="#f5ba5c"/>
    <path d="M458 144L624 162L466 162Z" fill="#ffda76"/>
    <path d="M477 168Q522 183 576 176" fill="none" stroke="#ce8642" stroke-width="2"/>
    <!-- Cycling glasses -->
    <path d="M421 136L449 138L445 151L428 149Z" fill="#264c57"/>
    <path d="M423 139L411 135M449 139L460 141" fill="none"/>
    <path d="M428 139L435 147" stroke="#8ed6d5" stroke-width="2"/>
    <!-- Helmet -->
    <path d="M405 132Q409 102 441 105Q466 106 473 132Z" fill="#e8674f"/>
    <path d="M421 110L417 125M438 108L437 126M454 113L458 126" fill="none" stroke="#fff1cc" stroke-width="4"/>
    <path d="M407 132H480" stroke-width="5"/>
    <!-- Scarf -->
    <path d="M409 190L443 181L447 193L416 204Z" fill="#e8674f"/>
    <path d="M417 195Q384 183 360 191L376 202L360 212Q393 208 419 204Z" fill="#e8674f"/>
    <!-- Pedaling leg -->
    <path d="M365 272L383 316L408 352" fill="none" stroke="#e9a44d" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M365 272L383 316L408 352;M365 272L413 318L429 386;M365 272L386 335L404 411;M365 272L361 318L382 386;M365 272L383 316L408 352" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M391 353L418 353L427 363L395 363Z" fill="#edb255">
      <animateTransform attributeName="transform" type="translate" values="0 0;21 34;-4 59;-26 34;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Rotating crank and pedal -->
  <circle cx="406" cy="386" r="13" fill="#fff3d5" stroke="#263f45" stroke-width="4"/>
  <g transform="translate(406 386)">
    <g>
      <path d="M0 0V-27" stroke="#263f45" stroke-width="5"/>
      <path d="M-10-27H10" stroke="#263f45" stroke-width="6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Motion marks -->
  <g fill="none" stroke="#fff3d5" stroke-width="4" stroke-linecap="round">
    <path d="M179 349H215M164 365H199M188 381H211"/>
  </g>

  <!-- Caption and dedicated timestamp footer -->
  <text x="400" y="522" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#203d43">He bought a racing bike. The beak was already a spoiler.</text>
  <path d="M48 545H752" stroke="#d8c5a1" stroke-width="2"/>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#405653">2026-10-25 15:30:01 SGT (UTC+08:00)</text>
</svg>