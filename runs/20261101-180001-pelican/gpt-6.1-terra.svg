<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE DAILY COMMUTE</title>
  <desc id="desc">A pelican pedals a bicycle with a fish in its bill, beneath the caption "Rush hour is for the birds."</desc>
  <defs>
    <pattern id="wheelSpokes" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M100 10V190M10 100H190M36 36L164 164M164 36L36 164" fill="none" stroke="#36505a" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8eacb"/>
  <circle cx="673" cy="110" r="45" fill="#ffca5a"/>
  <path d="M0 328Q85 285 166 320T326 319T485 316T650 314T800 320V455H0Z" fill="#a8c9aa"/>
  <path d="M0 365Q90 344 179 366T355 363T531 361T800 365V455H0Z" fill="#d5dba9"/>
  <path d="M0 453H800V529H0Z" fill="#d99c67"/>
  <path d="M0 452H800" stroke="#754d3b" stroke-width="5"/>
  <path d="M32 491H136M187 491H291M341 491H445M495 491H599M649 491H753" stroke="#f9dfae" stroke-width="7" stroke-linecap="round"/>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="3" fill="#263d43">THE DAILY COMMUTE</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#765445">A pelican with places to be</text>

  <!-- Bicycle wheels -->
  <g transform="translate(236 401)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="77" fill="#fff8e6" stroke="#263d43" stroke-width="10"/>
      <circle r="68" fill="none" stroke="#e59643" stroke-width="4"/>
      <path d="M0-68V68M-68 0H68M-48-48L48 48M48-48L-48 48" stroke="#60747a" stroke-width="3"/>
      <circle r="8" fill="#263d43"/>
    </g>
  </g>
  <g transform="translate(573 401)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <circle r="77" fill="#fff8e6" stroke="#263d43" stroke-width="10"/>
      <circle r="68" fill="none" stroke="#e59643" stroke-width="4"/>
      <path d="M0-68V68M-68 0H68M-48-48L48 48M48-48L-48 48" stroke="#60747a" stroke-width="3"/>
      <circle r="8" fill="#263d43"/>
    </g>
  </g>

  <!-- Frame and handlebars -->
  <g fill="none" stroke="#d75d48" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 401L333 300L404 401H236L352 325H522L404 401"/>
    <path d="M573 401L520 290"/>
  </g>
  <g fill="none" stroke="#263d43" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 290L511 269H542Q553 269 553 282"/>
    <path d="M333 300L324 281"/>
    <path d="M301 279H345"/>
  </g>
  <circle cx="404" cy="401" r="19" fill="#f8eacb" stroke="#263d43" stroke-width="5"/>
  <g transform="translate(404 401)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <path d="M-25 0H25" stroke="#263d43" stroke-width="6"/>
      <path d="M-34 0H-18M18 0H34" stroke="#263d43" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Rider gently bobs while pedaling -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1s" repeatCount="indefinite"/>
    <path d="M347 274Q341 313 369 340L403 391" fill="none" stroke="#d98835" stroke-width="14" stroke-linecap="round"/>
    <path d="M369 337Q402 345 425 382" fill="none" stroke="#d98835" stroke-width="12" stroke-linecap="round"/>
    <path d="M392 392L416 392M416 383L438 383" fill="none" stroke="#b45d2e" stroke-width="8" stroke-linecap="round"/>
    <path d="M275 236Q265 177 321 164Q367 152 401 183Q429 208 413 249Q399 284 346 288Q294 288 275 260Z" fill="#fffdf2" stroke="#263d43" stroke-width="5"/>
    <path d="M295 224Q329 194 383 213Q372 252 330 258Q308 258 295 244Z" fill="#e5e9dd" stroke="#263d43" stroke-width="4"/>
    <path d="M290 243L259 232L276 258Z" fill="#fffdf2" stroke="#263d43" stroke-width="5" stroke-linejoin="round"/>
    <path d="M382 194Q399 180 397 151Q395 124 414 112Q433 99 455 113Q475 125 471 147Q468 166 453 178Q440 188 442 209" fill="#fffdf2" stroke="#263d43" stroke-width="5" stroke-linecap="round"/>
    <circle cx="447" cy="129" r="12" fill="#fff" stroke="#263d43" stroke-width="3"/>
    <circle cx="451" cy="130" r="5" fill="#263d43"/>
    <path d="M441 112Q452 103 464 110" fill="none" stroke="#263d43" stroke-width="4" stroke-linecap="round"/>
    <!-- Oversized bill and pouch -->
    <path d="M463 144Q525 142 603 157Q536 171 464 164Z" fill="#f5a83f" stroke="#263d43" stroke-width="4" stroke-linejoin="round"/>
    <path d="M465 163Q491 211 549 190Q577 179 603 157Q543 174 465 163Z" fill="#f8c66d" stroke="#263d43" stroke-width="4" stroke-linejoin="round"/>
    <path d="M484 177Q516 190 546 181" fill="none" stroke="#dd9144" stroke-width="3" stroke-linecap="round"/>
    <!-- Fish peeking out -->
    <path d="M514 150Q525 139 539 149L548 142L546 157L539 153Q525 161 514 153Z" fill="#72b7c0" stroke="#263d43" stroke-width="2"/>
    <circle cx="520" cy="150" r="2" fill="#263d43"/>
    <!-- Tie -->
    <path d="M399 184L410 190L402 200L392 190Z" fill="#d75d48" stroke="#263d43" stroke-width="3"/>
    <path d="M402 200L413 231L401 241L393 230Z" fill="#d75d48" stroke="#263d43" stroke-width="3"/>
  </g>
  <path d="M122 388q-20-9-25-24M117 406q-25 1-35-9" fill="none" stroke="#8c7059" stroke-width="4" stroke-linecap="round"/>
  <path d="M654 404q20-8 29-24" fill="none" stroke="#8c7059" stroke-width="4" stroke-linecap="round"/>

  <!-- Separate footer -->
  <rect y="529" width="800" height="71" fill="#263d43"/>
  <text x="400" y="556" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#fff8e6">“Rush hour is for the birds.”</text>
  <text x="400" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#f8d9a8">2026-11-01 18:02:33 SGT (UTC+08:00)</text>
</svg>