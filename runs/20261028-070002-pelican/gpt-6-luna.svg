<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical pelican rides a bicycle while trying to deliver an absurdly oversized fish.</desc>
  <style>
    .ink{stroke:#19324a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,Helvetica,sans-serif;fill:#19324a}
    .small{font-size:18px}
    .wheel{fill:none;stroke:#19324a;stroke-width:8}
    .spoke{stroke:#5a7890;stroke-width:3}
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcecff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69c9db"/>
      <stop offset="1" stop-color="#238cae"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#19324a" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 420 Q130 375 260 420 T520 420 T800 420 V600 H0Z" fill="url(#water)"/>
  <path d="M0 463 Q120 430 240 463 T480 463 T720 463 T960 463" fill="none" stroke="#b9f2f0" stroke-width="6" opacity=".75"/>
  <path d="M0 510 Q130 477 260 510 T520 510 T800 510" fill="none" stroke="#b9f2f0" stroke-width="5" opacity=".55"/>

  <g class="label">
    <text x="400" y="58" text-anchor="middle" font-size="38" font-weight="900">PELICAN PEDAL PANIC!</text>
    <text x="400" y="91" text-anchor="middle" font-size="20" font-style="italic">“Why fly when you can wobble with confidence?”</text>
  </g>

  <g opacity=".8" fill="#fff">
    <path d="M90 135 q25-25 50 0 q25-25 50 0 q-25 25-50 0 q-25 25-50 0z"/>
    <path d="M625 150 q22-22 44 0 q22-22 44 0 q-22 22-44 0 q-22 22-44 0z"/>
  </g>

  <g id="bike" filter="url(#shadow)">
    <g id="wheels">
      <circle class="wheel" cx="245" cy="455" r="76"/>
      <circle class="wheel" cx="600" cy="455" r="76"/>
      <g class="spoke">
        <path d="M245 379V531 M169 455H321 M191 401L299 509 M299 401L191 509"/>
        <path d="M600 379V531 M524 455H676 M546 401L654 509 M654 401L546 509"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 422 455" to="360 422 455" dur="3s" repeatCount="indefinite"/>
    </g>
    <path d="M245 455 L365 350 L600 455 L430 455 Z" fill="none" class="ink"/>
    <path d="M365 350 L430 455 M365 350 L335 455" fill="none" class="ink"/>
    <path d="M590 350 L620 330" fill="none" class="ink"/>
    <path d="M600 455 L590 350" fill="none" class="ink"/>
    <path d="M570 330 Q600 315 630 330" fill="none" class="ink"/>
    <path d="M329 454 q35-18 70 0" fill="none" stroke="#e34b4b" stroke-width="10"/>
    <circle cx="430" cy="455" r="15" fill="#f3b63f" class="ink"/>
    <path d="M430 455 l45-22 M430 455 l-38 25" fill="none" class="ink"/>
    <path d="M475 433 l18 5 M392 480 l-18 4" fill="none" class="ink"/>
  </g>

  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="414" cy="282" rx="77" ry="91" fill="#f7f8f2" class="ink"/>
    <path d="M360 263 Q331 204 379 176 Q427 148 465 192 Q480 236 450 275Z" fill="#f7f8f2" class="ink"/>
    <path d="M382 181 Q402 146 437 156 Q463 163 472 192 Q442 180 419 204Z" fill="#dbe6e3" class="ink"/>
    <circle cx="428" cy="194" r="9" fill="#19324a"/>
    <circle cx="431" cy="191" r="3" fill="#fff"/>
    <path d="M463 214 Q547 203 631 245 Q548 267 466 249 Q443 237 463 214Z" fill="#f3a83f" class="ink"/>
    <path d="M473 242 Q542 250 607 244 Q558 294 477 267Z" fill="#f08b35" class="ink"/>
    <path d="M502 242 q30 11 58 3" fill="none" stroke="#19324a" stroke-width="4"/>
    <path d="M380 272 Q330 300 349 352 Q365 381 400 343" fill="#d5e3e3" class="ink"/>
    <path d="M447 272 Q500 297 478 350 Q462 378 430 341" fill="#d5e3e3" class="ink"/>
    <path d="M378 343 q-6 42 16 69 M444 343 q7 42-13 69" fill="none" class="ink"/>
    <path d="M392 414 q-23 12-42 3 M431 413 q25 13 45 3" fill="none" class="ink"/>
    <path d="M393 414 q-5 34 37 41" fill="none" class="ink"/>
    <path d="M430 455 q-19-35-9-67" fill="none" class="ink"/>
    <path d="M409 388 q28-8 49 10" fill="none" class="ink"/>
    <path d="M368 251 q31 17 58 6" fill="none" stroke="#d4a32f" stroke-width="8"/>
    <g transform="translate(0 4)">
      <path d="M480 280 Q531 297 560 328" fill="none" stroke="#19324a" stroke-width="13"/>
      <path d="M556 327 q-27 4-38 25" fill="none" stroke="#19324a" stroke-width="11"/>
      <ellipse cx="591" cy="322" rx="55" ry="30" fill="#7fc6df" class="ink" transform="rotate(22 591 322)"/>
      <path d="M631 339 l29 13 -29 10z" fill="#ef5b4c" class="ink"/>
      <circle cx="610" cy="310" r="4" fill="#19324a"/>
      <text x="582" y="326" text-anchor="middle" font-size="15" font-weight="bold" class="label" transform="rotate(22 582 326)">FISH TAX</text>
    </g>
  </g>

  <g class="label">
    <path d="M89 285 Q131 249 196 276" fill="none" stroke="#19324a" stroke-width="3"/>
    <text x="78" y="265" font-size="21" font-weight="bold">NO WINGS?</text>
    <text x="78" y="289" font-size="21" font-weight="bold">NO PROBLEM!</text>
    <path d="M692 270 q42 10 51 52" fill="none" stroke="#19324a" stroke-width="3"/>
    <text x="635" y="250" font-size="19" font-weight="bold">DELIVERY</text>
    <text x="650" y="272" font-size="19" font-weight="bold">BY BIRD</text>
  </g>

  <g class="label">
    <rect x="28" y="548" width="744" height="34" rx="10" fill="#ffffff" opacity=".9"/>
    <text x="400" y="571" text-anchor="middle" font-size="16">2026-10-28 07:00:56 SGT (UTC+08:00)</text>
  </g>

  <g opacity=".7">
    <path d="M120 390 q22-15 44 0 M664 390 q22-15 44 0" fill="none" stroke="#fff" stroke-width="5"/>
  </g>
</svg>