<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152e"/>
      <stop offset="1" stop-color="#32153d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#784ba0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="100" cy="80" r="2" fill="#fff"/>
  <circle cx="690" cy="95" r="3" fill="#ff98de"/>
  <circle cx="740" cy="200" r="2" fill="#fff"/>
  <path d="M0 470 Q200 430 400 470 T800 455 V600 H0Z" fill="#120f24"/>

  <text x="400" y="52" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="31" font-weight="900" letter-spacing="1">CODEX NIGHTCLUB</text>
  <text x="400" y="82" text-anchor="middle" fill="#ff76d0" font-family="Arial, sans-serif" font-size="18" font-weight="700">THE EXCLUSIVE MODEL LOUNGE</text>

  <!-- Club facade -->
  <rect x="250" y="120" width="500" height="355" rx="18" fill="#211b3a" stroke="#ff3cac" stroke-width="5"/>
  <path d="M275 157 H725" stroke="#6b4b91" stroke-width="3"/>
  <path d="M275 420 H725" stroke="#6b4b91" stroke-width="3"/>

  <!-- FULL sign -->
  <rect x="420" y="145" width="255" height="85" rx="16" fill="#190f26" stroke="#ff456f" stroke-width="7" filter="url(#glow)"/>
  <text x="547" y="203" text-anchor="middle" fill="#ff426d" font-family="Arial, sans-serif" font-size="58" font-weight="900" filter="url(#smallGlow)">FULL</text>

  <!-- Inside club: one model -->
  <rect x="485" y="265" width="210" height="105" rx="20" fill="#332452" stroke="#65f4ff" stroke-width="4"/>
  <text x="590" y="301" text-anchor="middle" fill="#65f4ff" font-family="Arial, sans-serif" font-size="18" font-weight="700">VIP ROOM</text>
  <circle cx="545" cy="334" r="17" fill="#65f4ff"/>
  <rect x="568" y="319" width="45" height="30" rx="8" fill="#65f4ff"/>
  <text x="590" y="388" text-anchor="middle" fill="#b8faff" font-family="Arial, sans-serif" font-size="14">MODEL #1 GOT IN</text>

  <!-- Melting server hamster wheels -->
  <g transform="translate(280 365)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ff9c45" stroke-width="8"/>
    <path d="M-23 -22 L22 22 M22 -22 L-22 22" stroke="#ff9c45" stroke-width="5"/>
    <path d="M-34 43 Q-15 54 0 42 T34 44" fill="none" stroke="#ff5f45" stroke-width="7"/>
    <circle cx="-8" cy="-4" r="5" fill="#fff"/>
    <circle cx="10" cy="8" r="5" fill="#fff"/>
  </g>
  <g transform="translate(380 365)">
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ff9c45" stroke-width="8"/>
    <path d="M-23 -22 L22 22 M22 -22 L-22 22" stroke="#ff9c45" stroke-width="5"/>
    <path d="M-34 43 Q-15 54 0 42 T34 44" fill="none" stroke="#ff5f45" stroke-width="7"/>
    <circle cx="-8" cy="-4" r="5" fill="#fff"/>
    <circle cx="10" cy="8" r="5" fill="#fff"/>
  </g>
  <path d="M292 411 q8 15 18 0 M390 411 q8 15 18 0" fill="none" stroke="#ff6a4c" stroke-width="4"/>

  <!-- Bouncer robot -->
  <g transform="translate(185 290)">
    <rect x="-55" y="-92" width="110" height="85" rx="18" fill="#8b9bb3" stroke="#101321" stroke-width="7"/>
    <rect x="-35" y="-70" width="27" height="22" rx="5" fill="#ff4e87"/>
    <rect x="8" y="-70" width="27" height="22" rx="5" fill="#ff4e87"/>
    <path d="M-25 -25 Q0 -8 25 -25" fill="none" stroke="#182033" stroke-width="7"/>
    <circle cx="0" cy="-108" r="10" fill="#ffcc55"/>
    <path d="M0 -99 V-92" stroke="#182033" stroke-width="5"/>
    <rect x="-65" y="-5" width="130" height="150" rx="22" fill="#3c4d69" stroke="#101321" stroke-width="7"/>
    <path d="M-65 30 H65" stroke="#65f4ff" stroke-width="6"/>
    <circle cx="-25" cy="65" r="11" fill="#65f4ff"/>
    <circle cx="25" cy="65" r="11" fill="#ffcc55"/>
    <path d="M-39 104 H39" stroke="#111827" stroke-width="8"/>
    <path d="M-65 25 L-100 78 M65 25 L100 78" stroke="#3c4d69" stroke-width="18" stroke-linecap="round"/>
    <path d="M-100 78 L-120 68" stroke="#3c4d69" stroke-width="16" stroke-linecap="round"/>
    <path d="M-35 145 L-45 188 M35 145 L45 188" stroke="#3c4d69" stroke-width="18" stroke-linecap="round"/>
    <rect x="-135" y="65" width="88" height="36" rx="9" fill="#f4f0ff" stroke="#17152e" stroke-width="4" transform="rotate(-12 -135 65)"/>
    <text x="-91" y="88" text-anchor="middle" fill="#17152e" font-family="Arial, sans-serif" font-size="12" font-weight="900" transform="rotate(-12 -135 65)">NOPE</text>
  </g>

  <!-- Queue of tired developers -->
  <g stroke="#161328" stroke-width="5">
    <circle cx="65" cy="370" r="24" fill="#d69b7a"/>
    <path d="M43 365 Q65 330 87 365" fill="#42304f"/>
    <rect x="42" y="395" width="46" height="75" rx="14" fill="#5b8de8"/>
    <path d="M42 420 L15 455 M88 420 L112 453" stroke="#5b8de8" stroke-width="14" stroke-linecap="round"/>
    <path d="M55 470 V510 M75 470 V510" stroke="#5b8de8" stroke-width="14" stroke-linecap="round"/>
    <path d="M38 385 Q65 410 92 385" fill="none" stroke="#f0b18a" stroke-width="5"/>
    <circle cx="150" cy="390" r="23" fill="#b87959"/>
    <path d="M128 385 Q150 350 173 385" fill="#20253d"/>
    <rect x="127" y="414" width="47" height="70" rx="13" fill="#e45b75"/>
    <path d="M127 435 L103 470 M174 435 L200 470" stroke="#e45b75" stroke-width="14" stroke-linecap="round"/>
    <path d="M140 484 V522 M160 484 V522" stroke="#e45b75" stroke-width="14" stroke-linecap="round"/>
    <path d="M137 405 Q150 414 163 405" fill="none" stroke="#f0b18a" stroke-width="5"/>
  </g>

  <!-- Velvet rope -->
  <path d="M30 515 Q190 450 330 515 T720 500" fill="none" stroke="#c51e58" stroke-width="9"/>
  <circle cx="30" cy="515" r="12" fill="#e7b85b"/>
  <circle cx="330" cy="515" r="12" fill="#e7b85b"/>

  <text x="400" y="557" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20" font-weight="800">“Selected model is at capacity. Please try a different model.”</text>
</svg>