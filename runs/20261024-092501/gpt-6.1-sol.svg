<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17172e"/>
      <stop offset="1" stop-color="#302044"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c2749"/>
      <stop offset="1" stop-color="#1e2038"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#754a78" stroke-opacity=".22"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect y="410" width="800" height="190" fill="url(#floor)"/>
  <rect y="410" width="800" height="190" fill="url(#grid)"/>

  <!-- neon title -->
  <text x="400" y="55" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34" fill="#f8f7ff" letter-spacing="2">CODEX NIGHTCLUB</text>
  <text x="400" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ff70d1">THE EXCLUSIVE MODEL EXPERIENCE</text>

  <!-- club facade -->
  <rect x="255" y="112" width="390" height="300" rx="20" fill="#101326" stroke="#8b52ff" stroke-width="5"/>
  <rect x="276" y="132" width="348" height="85" rx="14" fill="#22163d" stroke="#ff4fc8" stroke-width="3"/>
  <text x="450" y="185" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="52" fill="#ffef61" filter="url(#glow)">FULL</text>
  <circle cx="300" cy="159" r="8" fill="#63ffb0"/>
  <circle cx="600" cy="159" r="8" fill="#ff436f"/>

  <!-- dance floor silhouettes -->
  <ellipse cx="450" cy="350" rx="132" ry="40" fill="#17152f"/>
  <circle cx="397" cy="295" r="13" fill="#ff76bd"/>
  <path d="M397 310v54m0-35l-27 25m27-25l28-24m-28 59l-20 31m20-31l28 24" stroke="#ff76bd" stroke-width="8" stroke-linecap="round"/>
  <circle cx="505" cy="292" r="13" fill="#62e7ff"/>
  <path d="M505 307v57m0-36l-31-20m31 20l31-27m-31 63l-24 28m24-28l31 25" stroke="#62e7ff" stroke-width="8" stroke-linecap="round"/>

  <!-- melting server racks -->
  <g transform="translate(665 300)">
    <rect x="0" y="0" width="88" height="105" rx="8" fill="#30384f" stroke="#91a2c9" stroke-width="3"/>
    <path d="M10 22h68M10 48h68M10 74h68" stroke="#7184a8" stroke-width="4"/>
    <circle cx="20" cy="22" r="4" fill="#77f7d2"/><circle cx="20" cy="48" r="4" fill="#77f7d2"/><circle cx="20" cy="74" r="4" fill="#77f7d2"/>
    <path d="M18 105q-5 25 15 22t18 18q10 17 23-5t17 2q12 8 13-20" fill="#ff7a45" opacity=".9"/>
    <path d="M20 104q-3 17 12 20t5 22" fill="none" stroke="#ffcf57" stroke-width="5"/>
  </g>

  <!-- bouncer -->
  <g transform="translate(150 145)">
    <ellipse cx="83" cy="274" rx="70" ry="15" fill="#151426"/>
    <rect x="45" y="126" width="78" height="130" rx="20" fill="#384766" stroke="#0b1020" stroke-width="5"/>
    <path d="M55 150h58l-8 103H65z" fill="#212b47"/>
    <rect x="68" y="186" width="31" height="42" rx="5" fill="#10172a" stroke="#6bf4ff" stroke-width="3"/>
    <path d="M74 198h19M74 209h19" stroke="#6bf4ff" stroke-width="3"/>
    <circle cx="84" cy="80" r="47" fill="#65728e" stroke="#0b1020" stroke-width="5"/>
    <path d="M50 67q34-50 69 0" fill="#202940"/>
    <circle cx="69" cy="86" r="8" fill="#ff4f91"/><circle cx="100" cy="86" r="8" fill="#ff4f91"/>
    <path d="M68 110q17 14 34 0" fill="none" stroke="#10172a" stroke-width="5"/>
    <path d="M47 156l-39 65" stroke="#65728e" stroke-width="20" stroke-linecap="round"/>
    <path d="M123 157l42 54" stroke="#65728e" stroke-width="20" stroke-linecap="round"/>
    <path d="M11 220h-42" stroke="#ffcf57" stroke-width="9" stroke-linecap="round"/>
    <path d="M165 211h39" stroke="#ffcf57" stroke-width="9" stroke-linecap="round"/>
    <text x="84" y="285" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="13" fill="#ffcf57">BOUNCER-BOT</text>
  </g>

  <!-- velvet rope -->
  <path d="M224 365 Q310 390 390 365 Q482 338 570 367" fill="none" stroke="#d51c5d" stroke-width="9"/>
  <g fill="#e9b553" stroke="#8c5d25" stroke-width="3">
    <circle cx="224" cy="365" r="10"/><circle cx="390" cy="365" r="10"/><circle cx="570" cy="367" r="10"/>
  </g>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(20 390)">
      <circle cx="30" cy="28" r="20" fill="#c68d6a"/><path d="M10 22q20-30 40 0" fill="#2b1d2a"/>
      <path d="M12 78q18-38 36 0" fill="#55a6c8"/><path d="M20 37l8 3m10-3l8-3" stroke="#34202d" stroke-width="3"/>
      <text x="2" y="107" font-size="12" fill="#f5d7e8">dev_001</text>
    </g>
    <g transform="translate(88 423)">
      <circle cx="30" cy="25" r="19" fill="#9b694e"/><path d="M12 20q16-29 37 0" fill="#d9d9e8"/>
      <path d="M10 76q20-38 40 0" fill="#e37854"/><path d="M20 34h8m9 0h8" stroke="#33202d" stroke-width="3"/>
      <text x="0" y="103" font-size="12" fill="#f5d7e8">dev_002</text>
    </g>
    <g transform="translate(5 495)">
      <circle cx="30" cy="24" r="19" fill="#d29a75"/><path d="M12 20q18-28 38 0" fill="#51334a"/>
      <path d="M9 76q21-39 42 0" fill="#6ac27a"/><path d="M18 34l10-3m9 3l10-3" stroke="#33202d" stroke-width="3"/>
      <text x="0" y="103" font-size="12" fill="#f5d7e8">dev_003</text>
    </g>
    <g transform="translate(100 520)">
      <circle cx="30" cy="23" r="18" fill="#b9795a"/><path d="M12 20q18-30 38 0" fill="#1d263c"/>
      <path d="M10 72q20-37 40 0" fill="#ad67c9"/>
    </g>
  </g>

  <!-- rejected ticket -->
  <g transform="translate(535 230) rotate(-8)">
    <rect width="175" height="52" rx="8" fill="#fff3c4" stroke="#ffb13b" stroke-width="3"/>
    <text x="87" y="23" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="12" fill="#52213c">SELECTED MODEL:</text>
    <text x="87" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d72b69">PLEASE TRY AGAIN</text>
  </g>

  <!-- hamster wheel server -->
  <g transform="translate(710 85)">
    <circle cx="40" cy="40" r="35" fill="none" stroke="#b7c2e8" stroke-width="7"/>
    <path d="M40 7v66M7 40h66M17 17l46 46M63 17L17 63" stroke="#6978ad" stroke-width="3"/>
    <ellipse cx="40" cy="40" rx="11" ry="8" fill="#f29b5b"/>
    <circle cx="34" cy="38" r="2" fill="#231934"/>
  </g>

  <text x="400" y="555" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="23" fill="#ffe8f4">“Selected model is at capacity.”</text>
  <text x="400" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ff9fca">The queue has been promoted to senior infrastructure engineer.</text>
</svg>