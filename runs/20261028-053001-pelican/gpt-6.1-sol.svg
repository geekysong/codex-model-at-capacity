<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de5ff"/>
      <stop offset="1" stop-color="#e7f9ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#20252b;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,sans-serif;fill:#20252b}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .rider{animation:bob .8s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="48" fill="#fff6a8" opacity=".85"/>
  <path d="M0 390 Q150 320 300 385 T600 375 T800 360 V485 H0Z" fill="#8bd17c"/>
  <path d="M0 430 Q180 390 360 425 T800 405 V520 H0Z" fill="#4fae66"/>
  <rect y="470" width="800" height="130" fill="url(#road)"/>
  <path d="M0 535 H800" stroke="#f7df67" stroke-width="8" stroke-dasharray="34 24"/>

  <g class="label" text-anchor="middle">
    <text x="400" y="58" font-size="34" font-weight="900" fill="#173b56">PELICAN PEDAL PANIC</text>
    <text x="400" y="88" font-size="18" font-weight="700">“Why fly when you can clog traffic with style?”</text>
  </g>

  <g transform="translate(0 4)" filter="url(#shadow)">
    <g class="wheelSpin">
      <circle cx="285" cy="458" r="72" fill="#20252b" class="ink"/>
      <circle cx="285" cy="458" r="58" fill="#e8eef2" stroke="#8b9aa4" stroke-width="5"/>
      <g stroke="#687781" stroke-width="3">
        <path d="M285 400V516M227 458H343M244 417L326 499M326 417L244 499"/>
      </g>
      <circle cx="285" cy="458" r="9" fill="#20252b"/>
    </g>
    <g class="wheelSpin">
      <circle cx="590" cy="458" r="72" fill="#20252b" class="ink"/>
      <circle cx="590" cy="458" r="58" fill="#e8eef2" stroke="#8b9aa4" stroke-width="5"/>
      <g stroke="#687781" stroke-width="3">
        <path d="M590 400V516M532 458H648M549 417L631 499M631 417L549 499"/>
      </g>
      <circle cx="590" cy="458" r="9" fill="#20252b"/>
    </g>

    <path d="M285 458 L390 350 L590 458 L470 458 Z" fill="none" class="ink"/>
    <path d="M390 350 L470 458" fill="none" class="ink"/>
    <path d="M390 350 L375 300" fill="none" class="ink"/>
    <path d="M365 300 H415" fill="none" class="ink"/>
    <path d="M590 458 L625 328" fill="none" class="ink"/>
    <path d="M600 330 H655" fill="none" class="ink"/>
    <circle cx="470" cy="458" r="14" fill="#f6a623" class="ink"/>
    <path d="M470 458 l30 -18 M470 458 l-25 20" fill="none" class="ink"/>

    <g class="rider">
      <path d="M390 350 Q405 305 447 292 Q483 284 500 315 L475 370 Q430 383 390 350Z" fill="#f4a62a" class="ink"/>
      <ellipse cx="452" cy="250" rx="54" ry="62" fill="#f7b735" class="ink"/>
      <path d="M418 256 Q455 280 493 256 L521 286 Q461 328 410 285Z" fill="#f08b2e" class="ink"/>
      <path d="M493 256 Q530 265 602 286 Q624 292 610 312 Q598 326 576 316 L493 292Z" fill="#f29b35" class="ink"/>
      <circle cx="468" cy="230" r="8" fill="#20252b"/>
      <path d="M418 205 Q456 176 494 205" fill="none" class="ink"/>
      <path d="M405 295 Q367 324 347 361" fill="none" class="ink"/>
      <path d="M489 302 Q520 330 535 365" fill="none" class="ink"/>
      <path d="M347 361 Q370 370 394 365" fill="none" class="ink"/>
      <path d="M535 365 Q556 375 579 365" fill="none" class="ink"/>
      <path d="M428 329 Q450 350 470 370" fill="none" class="ink"/>
      <path d="M470 370 Q493 347 515 330" fill="none" class="ink"/>
      <path d="M515 330 Q536 311 555 320" fill="#f08b2e" class="ink"/>
      <path d="M428 329 Q407 310 390 319" fill="#f08b2e" class="ink"/>
      <path d="M402 277 Q373 263 359 240 Q350 226 365 217 Q386 224 413 245" fill="#f08b2e" class="ink"/>
      <path d="M602 286 Q640 275 661 292 Q672 302 660 313 Q637 321 610 312" fill="#f08b2e" class="ink"/>
      <path d="M610 292 Q625 300 640 299" fill="none" stroke="#20252b" stroke-width="4"/>
      <text x="470" y="195" class="label" font-size="15" font-weight="700" text-anchor="middle">HONK!</text>
    </g>

    <g transform="translate(575 208) rotate(9)">
      <path d="M0 35 Q42 0 90 18 Q74 62 18 70 Q-8 65 0 35Z" fill="#7bc7e8" class="ink"/>
      <path d="M90 18 L113 5 L105 32Z" fill="#f4a62a" class="ink"/>
      <circle cx="31" cy="30" r="4" fill="#20252b"/>
      <path d="M15 58 Q43 45 72 45" fill="none" stroke="#3d87a1" stroke-width="4"/>
      <text x="45" y="100" class="label" font-size="14" font-weight="700" text-anchor="middle">EMERGENCY SNACK</text>
    </g>
  </g>

  <g class="label" text-anchor="middle">
    <text x="400" y="560" font-size="16" font-weight="700">2026-10-28 05:30:16 SGT (UTC+08:00)</text>
    <text x="400" y="582" font-size="13">No birds were ticketed during this commute.</text>
  </g>
</svg>