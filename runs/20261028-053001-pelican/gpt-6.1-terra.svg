<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#245" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff3a6" opacity=".9"/>
  <path d="M0 410 Q120 350 245 410 T500 400 T800 395 V520 H0Z" fill="#8bd27b"/>
  <path d="M0 465 Q150 415 300 465 T600 455 T800 460 V540 H0Z" fill="#5eae62"/>
  <path d="M0 510 H800 V555 H0Z" fill="#d6b276"/>
  <path d="M40 510 Q200 490 360 510 T760 510" fill="none" stroke="#ad824c" stroke-width="5" stroke-dasharray="14 14"/>

  <text x="400" y="58" text-anchor="middle" font-family="Verdana, sans-serif" font-size="34" font-weight="900" fill="#17324d" stroke="#fff" stroke-width="3" paint-order="stroke">
    THE GREAT PELICAN COMMUTE
  </text>
  <text x="400" y="91" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="700" fill="#244c63">
    “Why fly when you can pedal?”
  </text>

  <g filter="url(#shadow)">
    <g id="bike">
      <g fill="none" stroke="#263746" stroke-width="8">
        <circle cx="230" cy="455" r="72" fill="#d9f2ff"/>
        <circle cx="570" cy="455" r="72" fill="#d9f2ff"/>
        <path d="M230 455 L350 455 L425 340 L570 455 L350 455 L305 365 L425 340"/>
        <path d="M425 340 L475 320 L500 345"/>
        <path d="M305 365 L275 335"/>
      </g>
      <g id="wheelMarks" fill="none" stroke="#79aac0" stroke-width="3" opacity=".75">
        <path d="M230 391 V519 M166 455 H294 M185 410 L275 500 M185 500 L275 410"/>
        <path d="M570 391 V519 M506 455 H634 M525 410 L615 500 M525 500 L615 410"/>
      </g>
      <g transform="translate(350 455)">
        <circle r="18" fill="#f4c542" stroke="#263746" stroke-width="6"/>
        <path d="M0 0 L28 18 M0 0 L-26 -19" stroke="#263746" stroke-width="6"/>
        <circle cx="34" cy="22" r="7" fill="#263746"/>
        <circle cx="-32" cy="-23" r="7" fill="#263746"/>
      </g>
    </g>

    <g id="pelican" transform="translate(0 0)">
      <ellipse cx="394" cy="258" rx="68" ry="82" fill="#f4f0e7" stroke="#263746" stroke-width="7"/>
      <path d="M350 245 Q325 275 342 317 Q373 337 402 306 Q375 285 350 245Z" fill="#d7dce0" stroke="#263746" stroke-width="6"/>
      <path d="M419 207 Q468 202 520 225 Q555 242 522 264 Q478 268 427 248Z" fill="#f2a43a" stroke="#263746" stroke-width="7"/>
      <path d="M515 225 Q535 231 541 243 Q529 260 512 260" fill="#e98232" stroke="#263746" stroke-width="5"/>
      <circle cx="442" cy="207" r="9" fill="#263746"/>
      <circle cx="445" cy="204" r="3" fill="#fff"/>
      <path d="M365 193 Q393 154 438 177 L452 193 Q405 184 365 193Z" fill="#e34f4f" stroke="#263746" stroke-width="6"/>
      <path d="M367 181 Q402 145 442 174" fill="none" stroke="#f7d34c" stroke-width="10"/>
      <path d="M362 318 L350 389" stroke="#e98232" stroke-width="12" stroke-linecap="round"/>
      <path d="M416 320 L440 386" stroke="#e98232" stroke-width="12" stroke-linecap="round"/>
      <path d="M350 389 L324 398 M440 386 L466 394" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
      <path d="M366 257 Q395 273 425 255" fill="none" stroke="#263746" stroke-width="5"/>
      <path d="M375 276 Q399 288 421 274" fill="none" stroke="#e34f4f" stroke-width="4"/>
      <path d="M360 237 Q334 223 320 238" fill="none" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <g font-family="Verdana, sans-serif" font-weight="700">
    <rect x="76" y="145" width="212" height="60" rx="16" fill="#fff" stroke="#263746" stroke-width="4"/>
    <path d="M250 204 L276 230 L270 195" fill="#fff" stroke="#263746" stroke-width="4"/>
    <text x="182" y="170" text-anchor="middle" font-size="17" fill="#263746">“Beak traffic!</text>
    <text x="182" y="192" text-anchor="middle" font-size="17" fill="#263746">I’m late for lunch!”</text>
  </g>

  <text x="400" y="548" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="700" fill="#17324d">
    A pelican pedals past the fish market, proving wings are optional.
  </text>
  <text x="400" y="582" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#17324d">
    2026-10-28 05:31:31 SGT (UTC+08:00)
  </text>

  <animateTransform href="#pelican" attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 5;0 0" dur="1.2s" repeatCount="indefinite"/>
  <animateTransform href="#wheelMarks" attributeName="transform" type="rotate" from="0 230 455" to="360 230 455" dur="1.1s" repeatCount="indefinite"/>
  <animateTransform href="#wheelMarks" attributeName="transform" type="rotate" from="0 570 455" to="360 570 455" dur="1.1s" repeatCount="indefinite"/>
  <animateTransform href="#bike g[transform]" attributeName="transform" type="rotate" values="0 350 455;25 350 455;0 350 455;-25 350 455;0 350 455" dur="1.1s" repeatCount="indefinite"/>
</svg>