  <rect x="0" y="500" width="800" height="100" fill="#17324a"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff4cb">A pelican proves that every commute is better with a beak basket.</text>
  <text x="400" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#b9e8f3">2026-10-26 15:33:37 SGT (UTC+08:00)</text>
