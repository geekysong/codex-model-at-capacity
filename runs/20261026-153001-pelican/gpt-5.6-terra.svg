<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle while a fish acts as its navigation system.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: top center; animation: pedal .6s ease-in-out infinite alternate; }
    .leg.back { animation-delay: -.3s; }
    .cloud { animation: drift 9s linear infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(24deg); } }
    @keyframes drift { to { transform: translateX(38px); } }
  </style>

  <rect width="800" height="600" fill="#b9e8f3"/>
  <path d="M0 365 Q105 315 200 365 T400 365 T600 365 T800 365 V490 H0Z" fill="#81c95e"/>
  <path d="M0 430 Q160 390 325 430 T620 425 T800 420 V490 H0Z" fill="#62ae51"/>
  <path d="M0 477 H800" stroke="#4c9145" stroke-width="6"/>
  <path d="M0 470 Q90 438 180 470 T360 470 T540 470 T720 470 T800 470" fill="none" stroke="#e7c85c" stroke-width="9" stroke-dasharray="22 18"/>

  <g class="cloud" fill="#fff" opacity=".86">
    <path d="M85 130 C96 105 130 107 136 130 C151 109 184 122 184 146 H66 C66 127 78 119 85 130Z"/>
    <path d="M590 94 C602 70 632 76 638 96 C656 69 692 85 690 112 H560 C560 92 579 83 590 94Z"/>
  </g>

  <text x="400" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#18314b">PELICAN PEDAL PANIC</text>
  <text x="400" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#36556b">“Zero emissions. Maximum fish-related distractions.”</text>

  <g stroke="#27333b" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
