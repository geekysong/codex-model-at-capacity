    <ellipse cx="555" cy="85" rx="39" ry="13"/><ellipse cx="580" cy="78" rx="25" ry="17"/>
  </g>

  <text id="title" x="400" y="54" text-anchor="middle" font-size="31" font-weight="900" letter-spacing="1.5" fill="#17324d">THE PELICAN COMMUTER</text>
  <text x="400" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#31546a">“If it fits in the beak, it counts as a carry-on.”</text>

