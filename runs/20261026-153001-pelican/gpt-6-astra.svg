<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A determined pelican pedals a bicycle, carrying fish in its enormous bill beneath a sign promising free delivery. Wheels spin and the rider bobs in a continuous loop.</desc>
