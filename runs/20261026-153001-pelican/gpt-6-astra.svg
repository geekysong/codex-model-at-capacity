  <rect x="0" y="508" width="800" height="92" fill="#263747"/>
  <text x="400" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff5db">He carries the whole business in his bill.</text>
