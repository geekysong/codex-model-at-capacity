  </g>
  <text x="679" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#263747">FREE DELIVERY</text>
  <text x="679" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#a04736">paid in exposure</text>

