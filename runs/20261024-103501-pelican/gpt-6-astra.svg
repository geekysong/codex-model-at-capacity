  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="68" font-size="43" font-weight="900" fill="#202a36" stroke="#fff" stroke-width="5" paint-order="stroke">THE PELICAN EXPRESS</text>
    <text x="400" y="104" font-size="20" font-weight="700" fill="#e34b3f">When your bike has no basket… become the basket.</text>
  </g>

  <g fill="#3c9b63">
    <path d="M76 467 q15-42 28 0 q-16-20-28 0Z"/>
    <path d="M706 455 q13-38 26 0 q-13-19-26 0Z"/>
