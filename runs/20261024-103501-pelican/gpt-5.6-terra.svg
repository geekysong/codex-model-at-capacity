<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of a pelican wobbling proudly on a bicycle.</desc>
  <rect width="800" height="600" fill="#bfe9f2"/>
  <rect y="405" width="800" height="195" fill="#8bcf72"/>
  <path d="M0 430 Q120 390 240 430 T480 430 T800 430" fill="none" stroke="#6aaf5e" stroke-width="8"/>
  <path d="M55 455 Q95 420 135 455 M650 455 Q700 418 755 455" fill="none" stroke="#6aaf5e" stroke-width="7" stroke-linecap="round"/>
  
  <g font-family="Arial, sans-serif" font-weight="900">
    <text x="400" y="72" text-anchor="middle" font-size="44" fill="#17324d" stroke="#fff" stroke-width="7" paint-order="stroke">THE GREAT BEAK ESCAPE!</text>
    <text x="400" y="555" text-anchor="middle" font-size="22" fill="#17324d">“I’m not late... I’m dramatically aerodynamic!”</text>
  </g>
  
  <!-- bicycle -->
  <g stroke="#263746" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="245" cy="445" r="76" fill="#f8fbff"/>
    <circle cx="570" cy="445" r="76" fill="#f8fbff"/>
    <path d="M245 445 L350 300 L455 445 L245 445 M350 300 L570 445 M350 300 L315 445 M315 445 L455 445"/>
    <path d="M305 445 L330 465 M315 445 L288 465"/>
    <path d="M570 445 L598 405 M570 445 L545 480"/>
    <path d="M305 314 L370 314 M350 300 L342 270 M342 270 L378 270"/>
  </g>
  <g fill="#f05b62" stroke="#263746" stroke-width="6">
    <circle cx="315" cy="445" r="14"/>
    <circle cx="455" cy="445" r="14"/>
  </g>
  
  <!-- pelican body -->
  <g stroke="#263746" stroke-width="7" stroke-linejoin="round">
    <path d="M340 280 Q350 180 430 170 Q505 160 535 235 L525 330 Q505 370 440 365 Q375 360 340 280Z" fill="#f7f2df"/>
    <path d="M408 210 Q430 175 478 188 Q520 202 522 246 Q515 276 482 284 Q445 275 408 250Z" fill="#fffaf0"/>
    <!-- wing -->
    <path d="M425 250 Q470 245 505 285 Q485 327 442 315 Q415 295 425 250Z" fill="#d9e6e2"/>
    <path d="M450 270 Q480 285 486 306" fill="none"/>
    <!-- neck/head -->
    <path d="M382 244 Q350 195 375 135 Q400 83 458 98 Q515 110 515 165 Q508 220 467 247Z" fill="#f7f2df"/>
    <!-- crest -->
    <path d="M395 111 Q380 77 410 91 Q425 57 440 93 Q465 66 467 105" fill="#f1b84b"/>
    <!-- beak -->
    <path d="M435 151 Q540 120 674 170 Q700 181 675 202 Q560 244 455 204 Q425 188 435 151Z" fill="#f4a83d"/>
    <path d="M448 180 Q558 187 674 170" fill="none" stroke="#c87928"/>
    <path d="M668 171 Q696 175 681 199" fill="#e98f36"/>
    <!-- eye -->
    <circle cx="444" cy="142" r="14" fill="#fff"/>
    <circle cx="449" cy="145" r="6" fill="#263746" stroke="none"/>
    <!-- sweat -->
    <path d="M500 112 Q512 91 520 112 Q520 128 508 130 Q497 126 500 112Z" fill="#63c7e8"/>
    <!-- legs -->
    <path d="M410 340 L395 405 M490 340 L505 405" fill="none"/>
    <path d="M385 405 Q400 394 418 405 L425 420 L380 420Z M492 405 Q510 394 525 405 L532 420 L487 420Z" fill="#f4a83d"/>
    <!-- wing hand on handlebar -->
    <path d="M397 270 Q370 285 350 300 Q341 310 352 318 Q365 323 375 311 L420 285Z" fill="#f7f2df"/>
  </g>
  
  <!-- motion lines -->
  <g stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".85">
    <path d="M120 245 L185 245"/>
    <path d="M95 275 L150 275"/>
    <path d="M620 290 L700 290"/>
  </g>
  
  <!-- speech bubble -->
  <g>
    <path d="M570 85 Q690 45 755 105 Q770 150 730 175 Q670 200 600 165 L565 185 L575 150 Q548 120 570 85Z" fill="#fff" stroke="#263746" stroke-width="6"/>
    <text x="657" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#263746">WATCH THE</text>
    <text x="657" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#d94d57">BEAK!</text>
  </g>
  
  <!-- tiny scandalous newspaper -->
  <g transform="translate(90 350) rotate(-8)">
    <rect width="110" height="55" rx="4" fill="#fff7d6" stroke="#263746" stroke-width="4"/>
    <text x="55" y="22" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900" fill="#263746">LOCAL HERO</text>
    <text x="55" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#263746">OWES BIKE</text>
  </g>
</svg>