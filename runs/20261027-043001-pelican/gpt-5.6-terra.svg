<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Power Ride</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#575b66"/>
      <stop offset="1" stop-color="#30333b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#14202b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202733;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202733}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 1.3s linear infinite}
      .riderBob{transform-box:fill-box;transform-origin:center;animation:bob .65s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="100" r="48" fill="#fff4b2" opacity=".85"/>
  <path d="M0 390 Q130 330 270 380 T540 370 T800 360 V470 H0Z" fill="#8bcf8d"/>
  <path d="M0 430 Q170 390 330 425 T800 410 V600 H0Z" fill="url(#road)"/>
  <path d="M0 515 L800 480" stroke="#f4d35e" stroke-width="8" stroke-dasharray="30 24" opacity=".9"/>

  <g class="label" font-weight="900">
    <text x="400" y="62" text-anchor="middle" font-size="38" fill="#fff" stroke="#202733" stroke-width="3" paint-order="stroke">
      PELICAN POWER RIDE
    </text>
    <text x="400" y="94" text-anchor="middle" font-size="18" font-style="italic">
      “Why waddle when you can pedal?”
    </text>
  </g>

  <!-- motion lines -->
  <g stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".75">
    <path d="M95 210h82"/>
    <path d="M60 245h58"/>
    <path d="M120 280h95"/>
  </g>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <g class="wheelSpin">
      <circle cx="270" cy="455" r="83" fill="#e9eef2" class="ink"/>
      <circle cx="270" cy="455" r="11" fill="#f04e45" class="ink"/>
      <g stroke="#59636e" stroke-width="3">
        <path d="M270 372v166M187 455h166M211 396l118 118M329 396L211 514"/>
      </g>
    </g>
    <g class="wheelSpin">
      <circle cx="570" cy="455" r="83" fill="#e9eef2" class="ink"/>
      <circle cx="570" cy="455" r="11" fill="#f04e45" class="ink"/>
      <g stroke="#59636e" stroke-width="3">
        <path d="M570 372v166M487 455h166M511 396l118 118M629 396L511 514"/>
      </g>
    </g>
    <path d="M270 455 L365 360 L470 455 L390 455 Z" fill="none" class="ink"/>
    <path d="M365 360 L570 455 L520 340" fill="none" class="ink"/>
    <path d="M520 340 l42 -12" class="ink" fill="none"/>
    <path d="M347 350h48" class="ink"/>
    <circle cx="390" cy="455" r="24" fill="#f4d35e" class="ink"/>
    <path d="M390 455l-31-20M390 455l30 20" class="ink"/>
    <circle cx="359" cy="435" r="7" fill="#202733"/>
    <circle cx="420" cy="475" r="7" fill="#202733"/>
    <path d="M303 430 Q320 399 345 392" fill="none" stroke="#f04e45" stroke-width="10"/>
  </g>

  <!-- pelican rider -->
  <g class="riderBob" filter="url(#shadow)">
    <!-- body -->
    <ellipse cx="425" cy="270" rx="78" ry="105" fill="#f7f4e9" class="ink"/>
    <path d="M380 245 Q420 220 468 245 L490 330 Q430 350 372 315Z" fill="#d6e1e5" class="ink"/>
    <!-- wing -->
    <path d="M395 265 Q455 275 475 330 Q425 350 391 315Z" fill="#b6c8cf" class="ink"/>
    <path d="M415 280q20 28 48 42" fill="none" stroke="#7d949f" stroke-width="5"/>
    <!-- neck and head -->
    <path d="M402 205 Q390 152 424 125" fill="none" stroke="#f7f4e9" stroke-width="35"/>
    <ellipse cx="448" cy="135" rx="66" ry="55" fill="#f7f4e9" class="ink"/>
    <!-- crest -->
    <path d="M408 93q18-29 37 4q20-31 37 4" fill="#f04e45" class="ink"/>
    <!-- beak -->
    <path d="M485 140 Q590 125 625 160 Q570 205 475 175Z" fill="#f4a340" class="ink"/>
    <path d="M487 160 Q550 160 606 170" fill="none" stroke="#c66d24" stroke-width="5"/>
    <!-- eye and monocle -->
    <circle cx="458" cy="130" r="9" fill="#202733"/>
    <circle cx="458" cy="130" r="22" fill="none" stroke="#f4d35e" stroke-width="5"/>
    <path d="M478 145q15 13 24 3" fill="none" stroke="#202733" stroke-width="4"/>
    <!-- feet -->
    <path d="M398 350l-10 62M460 345l18 61" stroke="#f4a340" stroke-width="15" stroke-linecap="round"/>
    <path d="M382 412q20 8 37-2M468 406q20 9 37-1" fill="none" stroke="#f4a340" stroke-width="9" stroke-linecap="round"/>
    <!-- handlebars grip -->
    <path d="M502 335q18-10 36-7" fill="none" stroke="#202733" stroke-width="8"/>
  </g>

  <!-- fish gag -->
  <g transform="rotate(-8 565 245)" filter="url(#shadow)">
    <path d="M510 250 Q560 205 625 235 Q650 250 625 275 Q560 300 510 260Z" fill="#74c7d8" class="ink"/>
    <path d="M625 235l36-22-8 39 13 31-41-8" fill="#4a9daf" class="ink"/>
    <circle cx="537" cy="243" r="6" fill="#202733"/>
    <path d="M552 270q24 10 43-2" fill="none" stroke="#276c79" stroke-width="4"/>
    <text x="558" y="225" class="label" font-size="15" font-weight="700">LUNCH</text>
  </g>

  <g class="label">
    <rect x="38" y="535" width="724" height="46" rx="12" fill="#fff" opacity=".92" stroke="#202733" stroke-width="3"/>
    <text x="400" y="555" text-anchor="middle" font-size="16" font-weight="700">
      SATIRE: LOCAL PELICAN CLAIMS TRAFFIC IS “FOR THE BIRDS” — INSISTS ON BIKE LANE ROYALTY
    </text>
    <text x="400" y="574" text-anchor="middle" font-size="13">
      2026-10-27 04:31:33 SGT (UTC+08:00)
    </text>
  </g>
</svg>