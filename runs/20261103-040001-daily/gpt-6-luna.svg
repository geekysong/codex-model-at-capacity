<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatchAB" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f5f5f5" fill-opacity="0.75"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333" stroke-width="2"/>
    </pattern>
    <pattern id="hatchBC" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f5f5f5" fill-opacity="0.75"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#333" stroke-width="2"/>
    </pattern>
  </defs>

  <text x="300" y="25" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Union area: 84,500 px²</text>

  <!-- A ∩ B only: 100×80 = 8,000 px² -->
  <path d="M150 120 H250 V200 H150 Z" fill="url(#hatchAB)"/>
  <!-- B ∩ C only: 30×70 = 2,100 px² -->
  <path d="M320 200 H350 V270 H320 Z" fill="url(#hatchBC)"/>

  <rect x="50" y="50" width="200" height="150" fill="#e74c3c" fill-opacity="0.35" stroke="#922b21" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#3498db" fill-opacity="0.35" stroke="#1f618d" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#2ecc71" fill-opacity="0.35" stroke="#196f3d" stroke-width="2"/>

  <!-- Reapply hatching above translucent rectangle fills for clear overlap markings. -->
  <path d="M150 120 H250 V200 H150 Z" fill="url(#hatchAB)" stroke="#222" stroke-width="1"/>
  <path d="M320 200 H350 V270 H320 Z" fill="url(#hatchBC)" stroke="#222" stroke-width="1"/>

  <g font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="90" y="95">A</text>
    <text x="275" y="245">B</text>
    <text x="455" y="315">C</text>
    <text x="200" y="157">A∩B: 8,000 px²</text>
    <text x="335" y="238" transform="rotate(90 335 238)">B∩C: 2,100 px²</text>
  </g>

  <text x="300" y="375" text-anchor="middle" font-family="sans-serif" font-size="12">A and C do not overlap.</text>
  <text x="300" y="393" text-anchor="middle" font-family="sans-serif" font-size="11">2026-11-03 04:03:32 SGT (UTC+08:00)</text>
</svg>