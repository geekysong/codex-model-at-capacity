      <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" stroke="#263445" stroke-width="1.2" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#142033">
    <text x="300" y="28" text-anchor="middle" font-size="21" font-weight="700">Union area: 79900</text>

    <rect x="50" y="50" width="200" height="150" fill="#3288db" fill-opacity="0.38" stroke="#16558c" stroke-width="2"/>
    <rect x="150" y="120" width="200" height="150" fill="#ed9250" fill-opacity="0.38" stroke="#99501b" stroke-width="2"/>
    <rect x="320" y="200" width="200" height="150" fill="#51b781" fill-opacity="0.38" stroke="#246a45" stroke-width="2"/>

    <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
    <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

    <g font-size="20" font-weight="700">
      <text x="80" y="88">A</text>
      <text x="285" y="155">B</text>
      <text x="450" y="305">C</text>
    </g>

    <rect x="157" y="148" width="86" height="24" rx="4" fill="#fff" fill-opacity="0.95"/>
    <text x="200" y="165" text-anchor="middle" font-size="15" font-weight="700">8000 px²</text>

    <g transform="translate(335 235) rotate(-90)">
      <rect x="-31" y="-10" width="62" height="20" rx="3" fill="#fff" fill-opacity="0.95"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700">2100 px²</text>
    </g>

    <text x="50" y="302" font-size="14">A and C do not overlap.</text>

    <line x1="30" y1="362" x2="570" y2="362" stroke="#c5ccd5"/>
    <text x="300" y="386" text-anchor="middle" font-size="15">2026-11-03 04:02:53 SGT (UTC+08:00)</text>
  </g>
