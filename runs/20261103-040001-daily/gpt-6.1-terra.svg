<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Union area: 79900 square pixels</title>
  <desc id="desc">Three rectangles with hatched pairwise overlaps. A and C do not overlap.</desc>
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#172033" stroke-width="2" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Total union area: 79900 px²</text>

  <rect x="50" y="50" width="200" height="150" fill="#4c8fe8" fill-opacity="0.45" stroke="#22549a" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#f0a23b" fill-opacity="0.45" stroke="#9b5b09" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#69b975" fill-opacity="0.45" stroke="#30763b" stroke-width="2"/>

  <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <text x="95" y="92" font-size="18" font-weight="700">A</text>
    <text x="285" y="155" font-size="18" font-weight="700">B</text>
    <text x="425" y="310" font-size="18" font-weight="700">C</text>

    <rect x="164" y="148" width="72" height="24" rx="4" fill="#fff" fill-opacity="0.94"/>
    <text x="200" y="165" font-size="13" font-weight="700">8000 px²</text>

    <g transform="translate(335 235) rotate(-90)">
      <rect x="-29" y="-10" width="58" height="20" rx="3" fill="#fff" fill-opacity="0.94"/>
      <text y="4" font-size="11" font-weight="700">2100 px²</text>
    </g>

    <text x="300" y="374" font-size="13">A and C do not overlap.</text>
    <text x="300" y="392" font-size="12">2026-11-03 04:03:39 SGT (UTC+08:00)</text>
  </g>
</svg>