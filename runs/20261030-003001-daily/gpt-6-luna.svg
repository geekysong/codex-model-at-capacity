<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest route through a 5 by 5 city grid</title>
  <desc id="desc">A top-down street grid with a blue shortest path from A1 to E5, avoiding blocked intersections B2, C3, and D4. The route has 8 street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b">City Blocks: Shortest Route</text>

  <!-- Streets -->
  <g stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <path d="M100 65H500 M100 125H500 M100 185H500 M100 245H500 M100 305H500"/>
    <path d="M100 65V305 M200 65V305 M300 65V305 M400 65V305 M500 65V305"/>
  </g>
  <!-- Route: A1 to E5, 4 east and 4 south segments -->
  <path d="M100 65H500V305" fill="none" stroke="#1677ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Intersections -->
  <g fill="#fff" stroke="#334155" stroke-width="2">
    <circle cx="100" cy="65" r="6"/><circle cx="200" cy="65" r="6"/><circle cx="300" cy="65" r="6"/><circle cx="400" cy="65" r="6"/><circle cx="500" cy="65" r="6"/>
    <circle cx="100" cy="125" r="6"/><circle cx="200" cy="125" r="6"/><circle cx="300" cy="125" r="6"/><circle cx="400" cy="125" r="6"/><circle cx="500" cy="125" r="6"/>
    <circle cx="100" cy="185" r="6"/><circle cx="200" cy="185" r="6"/><circle cx="300" cy="185" r="6"/><circle cx="400" cy="185" r="6"/><circle cx="500" cy="185" r="6"/>
    <circle cx="100" cy="245" r="6"/><circle cx="200" cy="245" r="6"/><circle cx="300" cy="245" r="6"/><circle cx="400" cy="245" r="6"/><circle cx="500" cy="245" r="6"/>
    <circle cx="100" cy="305" r="6"/><circle cx="200" cy="305" r="6"/><circle cx="300" cy="305" r="6"/><circle cx="400" cy="305" r="6"/><circle cx="500" cy="305" r="6"/>
  </g>
  <!-- Route endpoints -->
  <circle cx="100" cy="65" r="10" fill="#16a34a" stroke="#fff" stroke-width="3"/>
  <circle cx="500" cy="305" r="10" fill="#7c3aed" stroke="#fff" stroke-width="3"/>
  <text x="100" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">START A1</text>
  <text x="500" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6d28d9">END E5</text>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 117L208 133 M208 117L192 133"/>
    <path d="M292 177L308 193 M308 177L292 193"/>
    <path d="M392 237L408 253 M408 237L392 253"/>
  </g>

  <!-- Coordinate labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="100" y="52" text-anchor="middle">A1</text>
    <text x="200" y="52" text-anchor="middle">B1</text>
    <text x="300" y="52" text-anchor="middle">C1</text>
    <text x="400" y="52" text-anchor="middle">D1</text>
    <text x="500" y="52" text-anchor="middle">E1</text>
    <text x="100" y="115" text-anchor="middle">A2</text>
    <text x="200" y="115" text-anchor="middle">B2</text>
    <text x="300" y="115" text-anchor="middle">C2</text>
    <text x="400" y="115" text-anchor="middle">D2</text>
    <text x="500" y="115" text-anchor="middle">E2</text>
    <text x="100" y="175" text-anchor="middle">A3</text>
    <text x="200" y="175" text-anchor="middle">B3</text>
    <text x="300" y="175" text-anchor="middle">C3</text>
    <text x="400" y="175" text-anchor="middle">D3</text>
    <text x="500" y="175" text-anchor="middle">E3</text>
    <text x="100" y="235" text-anchor="middle">A4</text>
    <text x="200" y="235" text-anchor="middle">B4</text>
    <text x="300" y="235" text-anchor="middle">C4</text>
    <text x="400" y="235" text-anchor="middle">D4</text>
    <text x="500" y="235" text-anchor="middle">E4</text>
    <text x="100" y="295" text-anchor="middle">A5</text>
    <text x="200" y="295" text-anchor="middle">B5</text>
    <text x="300" y="295" text-anchor="middle">C5</text>
    <text x="400" y="295" text-anchor="middle">D5</text>
    <text x="500" y="295" text-anchor="middle">E5</text>
  </g>

  <rect x="118" y="344" width="364" height="28" rx="6" fill="#e2e8f0"/>
  <text x="300" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e40af">Route length: 8 street segments</text>
  <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">2026-10-30 00:34:24 SGT (UTC+08:00)</text>
</svg>