<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid route from A1 to E5</title>
  <desc id="desc">A shortest route of eight street segments travels across the top row and down the rightmost column, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1e293b">City grid: A1 to E5</text>

  <!-- City blocks -->
  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
    <rect x="123" y="63" width="69" height="39" rx="3"/>
    <rect x="213" y="63" width="69" height="39" rx="3"/>
    <rect x="303" y="63" width="69" height="39" rx="3"/>
    <rect x="393" y="63" width="69" height="39" rx="3"/>
    <rect x="123" y="123" width="69" height="39" rx="3"/>
    <rect x="213" y="123" width="69" height="39" rx="3"/>
    <rect x="303" y="123" width="69" height="39" rx="3"/>
    <rect x="393" y="123" width="69" height="39" rx="3"/>
    <rect x="123" y="183" width="69" height="39" rx="3"/>
    <rect x="213" y="183" width="69" height="39" rx="3"/>
    <rect x="303" y="183" width="69" height="39" rx="3"/>
    <rect x="393" y="183" width="69" height="39" rx="3"/>
    <rect x="123" y="243" width="69" height="39" rx="3"/>
    <rect x="213" y="243" width="69" height="39" rx="3"/>
    <rect x="303" y="243" width="69" height="39" rx="3"/>
    <rect x="393" y="243" width="69" height="39" rx="3"/>
  </g>

  <!-- Streets -->
  <g stroke="#94a3b8" stroke-width="3">
    <path d="M110 50H470 M110 110H470 M110 170H470 M110 230H470 M110 290H470"/>
    <path d="M110 50V290 M200 50V290 M290 50V290 M380 50V290 M470 50V290"/>
  </g>

  <!-- Route -->
  <path d="M110 50H470V290" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#475569">
    <circle cx="110" cy="110" r="3"/><circle cx="110" cy="170" r="3"/><circle cx="110" cy="230" r="3"/><circle cx="110" cy="290" r="3"/>
    <circle cx="200" cy="170" r="3"/><circle cx="200" cy="230" r="3"/><circle cx="200" cy="290" r="3"/>
    <circle cx="290" cy="110" r="3"/><circle cx="290" cy="230" r="3"/><circle cx="290" cy="290" r="3"/>
    <circle cx="380" cy="110" r="3"/><circle cx="380" cy="170" r="3"/><circle cx="380" cy="290" r="3"/>
  </g>
  <g fill="#2563eb">
    <circle cx="200" cy="50" r="4"/><circle cx="290" cy="50" r="4"/><circle cx="380" cy="50" r="4"/><circle cx="470" cy="50" r="4"/>
    <circle cx="470" cy="110" r="4"/><circle cx="470" cy="170" r="4"/><circle cx="470" cy="230" r="4"/>
  </g>
  <circle cx="110" cy="50" r="7" fill="#16a34a" stroke="white" stroke-width="2"/>
  <circle cx="470" cy="290" r="7" fill="#7c3aed" stroke="white" stroke-width="2"/>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M194 104l12 12 M206 104l-12 12"/>
    <path d="M284 164l12 12 M296 164l-12 12"/>
    <path d="M374 224l12 12 M386 224l-12 12"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="92" y="43" text-anchor="end">A1</text><text x="200" y="43" text-anchor="middle">B1</text><text x="290" y="43" text-anchor="middle">C1</text><text x="380" y="43" text-anchor="middle">D1</text><text x="482" y="43">E1</text>
    <text x="92" y="114" text-anchor="end">A2</text><text x="200" y="99" text-anchor="middle" fill="#b91c1c">B2</text><text x="290" y="99" text-anchor="middle">C2</text><text x="380" y="99" text-anchor="middle">D2</text><text x="482" y="114">E2</text>
    <text x="92" y="174" text-anchor="end">A3</text><text x="200" y="159" text-anchor="middle">B3</text><text x="290" y="159" text-anchor="middle" fill="#b91c1c">C3</text><text x="380" y="159" text-anchor="middle">D3</text><text x="482" y="174">E3</text>
    <text x="92" y="234" text-anchor="end">A4</text><text x="200" y="219" text-anchor="middle">B4</text><text x="290" y="219" text-anchor="middle">C4</text><text x="380" y="219" text-anchor="middle" fill="#b91c1c">D4</text><text x="482" y="234">E4</text>
    <text x="92" y="294" text-anchor="end">A5</text><text x="200" y="306" text-anchor="middle">B5</text><text x="290" y="306" text-anchor="middle">C5</text><text x="380" y="306" text-anchor="middle">D5</text><text x="482" y="294">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <circle cx="143" cy="332" r="5" fill="#16a34a"/><text x="153" y="336">Start</text>
    <circle cx="212" cy="332" r="5" fill="#7c3aed"/><text x="222" y="336">End</text>
    <path d="M270 327l10 10 M280 327l-10 10" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><text x="286" y="336">Blocked</text>
    <path d="M355 332h22" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/><text x="384" y="336">Route: 8 street segments</text>
  </g>
  <path d="M40 355H560" stroke="#cbd5e1"/>
  <text x="300" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">2026-10-30 00:34:39 SGT (UTC+08:00)</text>
</svg>