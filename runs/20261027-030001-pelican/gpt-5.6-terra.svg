<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the City</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle while carrying an absurdly large fish.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .bob { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
    .legA { transform-box: fill-box; transform-origin: 50% 8%; animation: pedalA 1.1s linear infinite; }
    .legB { transform-box: fill-box; transform-origin: 50% 8%; animation: pedalB 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(28deg); } }
    @keyframes pedalB { 50% { transform: rotate(-28deg); } }
  </style>

