  </g>

  <text x="400" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#263849" letter-spacing="2">THE PELICAN EXPRESS</text>
  <text x="400" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#45626a">ZERO EMISSIONS. QUESTIONABLE FISH MILEAGE.</text>

  <path d="M20 421Q173 395 322 419T780 408V530H20Z" fill="#98bc89"/>
  <path d="M20 456Q384 428 780 448V532H20Z" fill="#e4c99f"/>
  <path d="M38 487H762" stroke="#fff6df" stroke-width="5" stroke-dasharray="35 25"/>
  <ellipse cx="398" cy="467" rx="242" ry="15" fill="#263849" opacity=".13"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
