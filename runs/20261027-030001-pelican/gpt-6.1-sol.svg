    <path d="M375 224Q411 252 477 242" fill="none" stroke="#263849" stroke-width="12" stroke-linecap="round"/>
    <path d="M375 224Q411 252 477 242" fill="none" stroke="#fffdf3" stroke-width="8" stroke-linecap="round"/>
    <path d="M459 241l11-8m-4 11 12-3" stroke="#263849" stroke-width="3" stroke-linecap="round"/>
