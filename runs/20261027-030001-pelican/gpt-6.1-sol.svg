    <rect x="605" y="252" width="128" height="75" rx="6" fill="#fff6df" stroke="#263849" stroke-width="3"/>
    <text x="669" y="276" font-size="14" font-weight="bold" fill="#263849">BIKE LANE</text>
    <text x="669" y="298" font-size="13" fill="#263849">No winging it.</text>
    <path d="M648 314H690m-9-6 9 6-9 6" fill="none" stroke="#ed6848" stroke-width="3"/>
  </g>

