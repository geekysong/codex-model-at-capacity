  <g font-family="Arial, sans-serif" fill="#263849">
    <path d="M80 202Q70 189 83 178H239Q254 181 249 198L238 222H139L120 244L123 222H87Q74 221 80 202Z" fill="#fffdf3" stroke="#263849" stroke-width="3"/>
    <text x="164" y="197" text-anchor="middle" font-size="16" font-weight="bold">“My other ride</text>
    <text x="164" y="216" text-anchor="middle" font-size="16" font-weight="bold">is a headwind.”</text>
    <text x="400" y="519" text-anchor="middle" font-size="18" font-weight="bold">He traded frequent flyer miles for frequent fish stops.</text>
  </g>

