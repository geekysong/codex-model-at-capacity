<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A determined pelican pedals a bicycle with a bulging pouch full of fish, passing a sign promising that cycling is cheaper than flying. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0L10 10" stroke="#fff" opacity=".15"/>
    </pattern>
    <g id="wheel">
      <circle r="70" fill="#f9f5dd" stroke="#263849" stroke-width="10"/>
      <circle r="61" fill="none" stroke="#e9a949" stroke-width="3"/>
      <g stroke="#6b8791" stroke-width="3">
        <path d="M-64 0H64M0-64V64M-45-45L45 45M-45 45L45-45"/>
      </g>
      <circle r="9" fill="#263849"/>
      <path d="M-8-63H8" stroke="#ed6848" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

