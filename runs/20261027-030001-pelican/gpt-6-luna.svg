<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT BEAK ESCAPE</title>
  <desc id="desc">A determined pelican pedals a bicycle while a fish rides in its beak. The wheels spin and the rider bobs gently.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { animation: bob .55s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#dff5f2"/>
  <rect y="0" width="800" height="390" fill="#bde8e8"/>
  <circle cx="680" cy="125" r="52" fill="#ffd66b"/>
  <path d="M0 335 Q130 305 250 338 T500 330 T800 337 V430 H0Z" fill="#8bd0bb"/>
  <path d="M0 380 Q160 350 320 382 T640 375 T800 380 V452 H0Z" fill="#62b99e"/>
  <path d="M40 425 H760" stroke="#334d54" stroke-width="8" stroke-linecap="round"/>
  <path d="M60 445 H740" stroke="#fff3cb" stroke-width="5" stroke-dasharray="28 24"/>

  <text x="400" y="55" text-anchor="middle" font-size="34" font-weight="900" letter-spacing="2" fill="#183d48">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#315d61">“I’m cycling for the health of my lunch.”</text>

  <!-- bicycle -->
  <g fill="none" stroke="#263f4b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g class="wheel">
      <circle cx="250" cy="365" r="66" stroke="#253d49" stroke-width="8"/>
      <path d="M250 299V431 M184 365H316 M203 318L297 412 M297 318L203 412" stroke="#587079" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="530" cy="365" r="66" stroke="#253d49" stroke-width="8"/>
      <path d="M530 299V431 M464 365H596 M483 318L577 412 M577 318L483 412" stroke="#587079" stroke-width="3"/>
    </g>
    <path d="M250 365 L340 365 L390 288 L530 365 L430 365 L390 288"/>
    <path d="M340 365 L315 310 M301 310H333"/>
    <path d="M530 365 L546 290 M528 289H564"/>
  </g>
  <circle cx="340" cy="365" r="11" fill="#f2a33a" stroke="#263f4b" stroke-width="4"/>
  <path d="M340 365L365 393 M340 365L316 390" stroke="#263f4b" stroke-width="6" stroke-linecap="round"/>
  <path d="M359 393h20 M307 390h20" stroke="#263f4b" stroke-width="6" stroke-linecap="round"/>

  <!-- expressive pelican and pedaling legs -->
  <g class="rider">
    <path d="M346 325 Q365 344 340 365 M408 322 Q400 345 430 365" fill="none" stroke="#f0a34d" stroke-width="12" stroke-linecap="round"/>
    <path d="M340 365L340 382 M430 365L430 382" fill="none" stroke="#f0a34d" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="382" cy="238" rx="77" ry="88" fill="#fffdf3" stroke="#263f4b" stroke-width="5"/>
    <path d="M330 270 Q370 300 426 275 Q418 323 376 329 Q345 322 330 270Z" fill="#f4a04c" stroke="#263f4b" stroke-width="4"/>
    <path d="M337 279 Q378 297 421 278 L414 298 Q375 315 344 294Z" fill="#f9c6bf" stroke="#c86e68" stroke-width="3"/>
    <path d="M364 170 Q351 132 376 117 Q399 101 419 119 Q438 136 423 166" fill="#fffdf3" stroke="#263f4b" stroke-width="5"/>
    <path d="M421 143 Q465 130 509 151 Q471 171 425 164Z" fill="#f2a33a" stroke="#263f4b" stroke-width="5"/>
    <path d="M456 151 Q480 145 500 152 Q481 160 459 157Z" fill="#f6b8ad" stroke="#c86e68" stroke-width="2"/>
    <path d="M458 147 Q474 134 488 145 Q478 153 463 153Z" fill="#67aeb0" stroke="#263f4b" stroke-width="2"/>
    <path d="M462 144l8-5 2 7 8-5 2 7" fill="none" stroke="#263f4b" stroke-width="2"/>
    <circle cx="402" cy="145" r="7" fill="#263f4b"/>
    <circle cx="404" cy="143" r="2" fill="#fff"/>
    <path d="M394 132 Q405 126 416 132" fill="none" stroke="#263f4b" stroke-width="3" stroke-linecap="round"/>
    <path d="M353 227 Q374 213 392 225" fill="none" stroke="#e99a91" stroke-width="4" stroke-linecap="round"/>
    <path d="M386 191 Q397 181 407 191" fill="none" stroke="#263f4b" stroke-width="3"/>
    <path d="M377 198 Q385 193 392 198" fill="none" stroke="#263f4b" stroke-width="3"/>
    <path d="M434 191 Q448 183 458 191" fill="none" stroke="#263f4b" stroke-width="3"/>
    <path d="M447 198 Q455 193 463 198" fill="none" stroke="#263f4b" stroke-width="3"/>
    <path d="M363 155 Q383 128 411 139" fill="none" stroke="#263f4b" stroke-width="4" stroke-linecap="round"/>
    <path d="M368 129 Q380 105 400 115" fill="#e85f58" stroke="#263f4b" stroke-width="3"/>
  </g>

  <!-- motion marks and comic speech -->
  <path d="M194 222l-32-9 M190 239l-38 2 M206 203l-24-20" stroke="#f2a33a" stroke-width="5" stroke-linecap="round"/>
  <path d="M522 208 Q549 182 592 193 Q615 199 615 222 Q615 244 589 250 L584 267 L567 251 Q533 255 520 236Z" fill="#fffdf3" stroke="#263f4b" stroke-width="3"/>
  <text x="568" y="220" text-anchor="middle" font-size="14" font-weight="800" fill="#263f4b">NO HELMET.</text>
  <text x="568" y="239" text-anchor="middle" font-size="13" font-weight="700" fill="#263f4b">ALL BEAK.</text>

  <rect x="0" y="470" width="800" height="130" fill="#183d48"/>
  <text x="400" y="505" text-anchor="middle" font-size="16" font-weight="700" fill="#dff5f2">Local bird claims cycling is “just a quick fish run.”</text>
  <text x="400" y="565" text-anchor="middle" font-size="18" font-weight="700" fill="#ffd66b">2026-10-27 03:02:27 SGT (UTC+08:00)</text>
</svg>