<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17132e"/>
      <stop offset="1" stop-color="#080913"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#784cff"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e6f2"/>
      <stop offset=".45" stop-color="#7d91aa"/>
      <stop offset="1" stop-color="#35465d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 420 Q190 355 400 425 T800 410 V600 H0Z" fill="#111327"/>
  <path d="M0 470 Q200 420 400 465 T800 455" fill="none" stroke="#25234b" stroke-width="4"/>

  <text x="400" y="48" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ff8bd8" letter-spacing="3">THE EXCLUSIVE MODEL LOUNGE</text>

  <rect x="300" y="105" width="430" height="280" rx="24" fill="#1b1738" stroke="#653b9d" stroke-width="5"/>
  <rect x="325" y="130" width="380" height="82" rx="12" fill="#090b18" stroke="#ff3cac" stroke-width="3" filter="url(#glow)"/>
  <text x="515" y="166" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34" fill="#ff4eb8">FULL</text>
  <text x="515" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffd3ef">one model inside • no exceptions</text>

  <circle cx="370" cy="280" r="34" fill="#101022" stroke="#45f4ff" stroke-width="4"/>
  <circle cx="370" cy="280" r="24" fill="none" stroke="#45f4ff" stroke-width="3"/>
  <path d="M370 280 l18 -10 M370 280 l-7 18 M370 280 l-13 -14" stroke="#45f4ff" stroke-width="4" stroke-linecap="round"/>
  <text x="370" y="333" text-anchor="middle" font-family="Arial" font-size="13" fill="#8af8ff">MODEL DJ</text>

  <rect x="430" y="245" width="240" height="105" rx="12" fill="#26214a" stroke="#a98cff" stroke-width="3"/>
  <text x="550" y="273" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" fill="#fff">VIP BOOTH</text>
  <text x="550" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d9cfff">“gpt-just-one-left”</text>
  <text x="550" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ff9fda">currently doing nothing</text>

  <!-- robot bouncer -->
  <ellipse cx="225" cy="408" rx="80" ry="18" fill="#05060d" opacity=".65"/>
  <rect x="170" y="238" width="112" height="142" rx="28" fill="url(#metal)" stroke="#172033" stroke-width="6"/>
  <rect x="185" y="258" width="82" height="54" rx="14" fill="#111827" stroke="#45f4ff" stroke-width="4"/>
  <circle cx="210" cy="283" r="8" fill="#ff4b9f" filter="url(#glow)"/>
  <circle cx="242" cy="283" r="8" fill="#ff4b9f" filter="url(#glow)"/>
  <path d="M205 299 Q226 312 247 299" fill="none" stroke="#45f4ff" stroke-width="4"/>
  <rect x="193" y="330" width="66" height="18" rx="9" fill="#27364d"/>
  <text x="226" y="344" text-anchor="middle" font-family="Arial Black" font-size="11" fill="#b9faff">BOUNCER</text>
  <path d="M171 278 L136 300 M281 278 L315 258" stroke="#8fa3ba" stroke-width="15" stroke-linecap="round"/>
  <path d="M134 300 L104 288" stroke="#8fa3ba" stroke-width="12" stroke-linecap="round"/>
  <path d="M315 258 L345 245" stroke="#8fa3ba" stroke-width="12" stroke-linecap="round"/>
  <path d="M196 380 L177 425 M255 380 L274 425" stroke="#8fa3ba" stroke-width="17" stroke-linecap="round"/>
  <path d="M154 428 H195 M255 428 H296" stroke="#151c2b" stroke-width="14" stroke-linecap="round"/>
  <rect x="116" y="350" width="85" height="30" rx="7" fill="#0d1020" stroke="#ffb3df" stroke-width="2" transform="rotate(-8 116 350)"/>
  <text x="158" y="370" text-anchor="middle" font-family="Arial Black" font-size="12" fill="#ffb3df" transform="rotate(-8 158 370)">NOPE</text>

  <!-- velvet rope -->
  <path d="M95 438 Q220 500 356 438" fill="none" stroke="#ff315f" stroke-width="8"/>
  <circle cx="95" cy="438" r="11" fill="#f5c46b" stroke="#fff0b0" stroke-width="3"/>
  <circle cx="356" cy="438" r="11" fill="#f5c46b" stroke="#fff0b0" stroke-width="3"/>
  <path d="M95 438 V520 M356 438 V520" stroke="#d8a85d" stroke-width="8"/>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(30 470)">
      <circle cx="30" cy="-30" r="20" fill="#b87958"/>
      <path d="M12 -35 Q30 -55 48 -35" fill="#3d2430"/>
      <rect x="8" y="-8" width="45" height="55" rx="12" fill="#3d8db8"/>
      <path d="M17 0 L-4 28 M46 0 L66 25" stroke="#b87958" stroke-width="10" stroke-linecap="round"/>
      <text x="30" y="68" text-anchor="middle" font-size="12" fill="#d7e5ff">dev.exe</text>
      <text x="30" y="84" text-anchor="middle" font-size="11" fill="#ff9cbf">zzz...</text>
    </g>
    <g transform="translate(122 500)">
      <circle cx="30" cy="-30" r="20" fill="#e1a67e"/>
      <path d="M10 -38 Q28 -58 50 -40" fill="#22243b"/>
      <rect x="8" y="-8" width="45" height="55" rx="12" fill="#8c59bd"/>
      <path d="M17 0 L-5 27 M46 0 L68 27" stroke="#e1a67e" stroke-width="10" stroke-linecap="round"/>
      <text x="30" y="68" text-anchor="middle" font-size="12" fill="#d7e5ff">retry()</text>
      <text x="30" y="84" text-anchor="middle" font-size="11" fill="#ff9cbf">again?</text>
    </g>
    <g transform="translate(214 470)">
      <circle cx="30" cy="-30" r="20" fill="#7f513b"/>
      <path d="M11 -40 Q30 -57 49 -38" fill="#101a2a"/>
      <rect x="8" y="-8" width="45" height="55" rx="12" fill="#db5e6f"/>
      <path d="M17 0 L-6 28 M46 0 L68 25" stroke="#7f513b" stroke-width="10" stroke-linecap="round"/>
      <text x="30" y="68" text-anchor="middle" font-size="12" fill="#d7e5ff">ship_it</text>
      <text x="30" y="84" text-anchor="middle" font-size="11" fill="#ff9cbf">sigh</text>
    </g>
  </g>

  <!-- melting hamster servers -->
  <g transform="translate(520 400)">
    <ellipse cx="0" cy="44" rx="92" ry="15" fill="#05060d" opacity=".7"/>
    <circle cx="0" cy="0" r="61" fill="#20243a" stroke="#7c89aa" stroke-width="6"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#ffda5d" stroke-width="6"/>
    <path d="M-30 24 Q0 48 30 24" fill="none" stroke="#ff744d" stroke-width="12" stroke-linecap="round"/>
    <circle cx="-16" cy="-8" r="6" fill="#ff516e"/>
    <circle cx="16" cy="-8" r="6" fill="#ff516e"/>
    <path d="M-75 34 Q-60 48 -45 40 M75 34 Q60 48 45 40" fill="none" stroke="#ff8d4d" stroke-width="8"/>
    <path d="M-55 66 C-48 82 -35 70 -27 84 M-8 68 C0 87 12 72 20 88 M38 66 C46 80 58 70 65 82" fill="none" stroke="#ff743d" stroke-width="7" stroke-linecap="round"/>
    <rect x="-86" y="92" width="172" height="25" rx="8" fill="#343957" stroke="#ff516e" stroke-width="3"/>
    <text x="0" y="110" text-anchor="middle" font-family="Arial Black" font-size="13" fill="#ffd5df">SERVER FARM: MELTING</text>
  </g>

  <path d="M382 530 Q520 510 728 530" fill="none" stroke="#ff3cac" stroke-width="3" opacity=".5"/>
  <text x="400" y="570" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#fff">“Selected model is at capacity. Please try a different model.”</text>
</svg>