<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17132d"/>
      <stop offset="1" stop-color="#090914"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#784ba0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8e2ef"/>
      <stop offset="1" stop-color="#68758c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="405" cy="315" rx="380" ry="230" fill="#54205f" opacity=".22" filter="url(#soft)"/>

  <!-- Title -->
  <text x="400" y="48" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="2">CODEX NIGHTCLUB</text>
  <text x="400" y="76" text-anchor="middle" fill="#ff73ce" font-family="Arial, sans-serif" font-size="15" font-weight="700">THE EXCLUSIVE MODEL LOUNGE</text>

  <!-- Club facade -->
  <rect x="285" y="105" width="470" height="360" rx="24" fill="#14152b" stroke="#6b4a9b" stroke-width="4"/>
  <rect x="305" y="125" width="430" height="52" rx="12" fill="#241c42" stroke="#ff3cac" stroke-width="3"/>
  <text x="520" y="160" text-anchor="middle" fill="#ffcf4a" font-family="Arial, sans-serif" font-size="29" font-weight="900" filter="url(#glow)">MODEL CLUB</text>
  <circle cx="333" cy="151" r="7" fill="#5affd2"/>
  <circle cx="708" cy="151" r="7" fill="#5affd2"/>

  <!-- FULL sign -->
  <rect x="602" y="195" width="116" height="64" rx="10" fill="#260f23" stroke="#ff424d" stroke-width="5" filter="url(#glow)"/>
  <text x="660" y="237" text-anchor="middle" fill="#ff525b" font-family="Arial, sans-serif" font-size="31" font-weight="900">FULL</text>
  <path d="M617 266 q18 12 36 0t36 0t20 0" fill="none" stroke="#ff525b" stroke-width="3"/>

  <!-- Dance floor behind bouncer -->
  <path d="M320 405 L720 405 L690 455 L350 455 Z" fill="#25204b"/>
  <path d="M360 418 L400 418 M430 418 L470 418 M500 418 L540 418 M570 418 L610 418 M640 418 L680 418" stroke="#55e6ff" stroke-width="5" opacity=".65"/>

  <!-- One model inside -->
  <g transform="translate(493 280)">
    <ellipse cx="0" cy="108" rx="47" ry="10" fill="#060611" opacity=".65"/>
    <rect x="-31" y="30" width="62" height="76" rx="18" fill="#53d7c0"/>
    <circle cx="0" cy="5" r="35" fill="url(#metal)" stroke="#91a5ba" stroke-width="4"/>
    <rect x="-22" y="-2" width="44" height="19" rx="9" fill="#101527"/>
    <circle cx="-11" cy="7" r="5" fill="#55f7ff"/>
    <circle cx="11" cy="7" r="5" fill="#ff65ce"/>
    <path d="M-15 34 Q0 47 15 34" fill="none" stroke="#162035" stroke-width="4"/>
    <path d="M-31 52 L-55 76 M31 52 L55 76 M-15 104 L-22 132 M15 104 L22 132" stroke="#a9bed1" stroke-width="10" stroke-linecap="round"/>
    <rect x="-23" y="55" width="46" height="20" rx="5" fill="#29244b"/>
    <text x="0" y="70" text-anchor="middle" fill="#ffd95e" font-family="Arial, sans-serif" font-size="11" font-weight="bold">VIP</text>
  </g>

  <!-- Melting hamster-wheel servers -->
  <g transform="translate(355 315)">
    <path d="M-57 47 C-68 15 -56 -17 -26 -25 C6 -33 34 -9 42 20 C50 50 27 71 -4 75 C-30 78 -51 68 -57 47Z" fill="#e78044" stroke="#ffbb52" stroke-width="4"/>
    <circle cx="-8" cy="23" r="35" fill="none" stroke="#ffdf78" stroke-width="6"/>
    <circle cx="-8" cy="23" r="7" fill="#6d2b3f"/>
    <path d="M-8 -12 L-8 58 M-43 23 L27 23 M-33 -2 L17 48 M-33 48 L17 -2" stroke="#ffdf78" stroke-width="3"/>
    <path d="M-48 69 q14 18 29 5t28 4t26-4" fill="none" stroke="#ff5b5b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="-31" cy="-12" r="9" fill="#ffc45b"/>
    <circle cx="-11" cy="-22" r="7" fill="#ff5b5b"/>
  </g>

  <!-- Bouncer -->
  <g transform="translate(242 265)">
    <ellipse cx="0" cy="205" rx="87" ry="15" fill="#05050d" opacity=".7"/>
    <rect x="-54" y="90" width="108" height="111" rx="26" fill="#202c48" stroke="#11182d" stroke-width="5"/>
    <path d="M-54 112 L-90 158 M54 112 L87 153" stroke="#d6e3f0" stroke-width="17" stroke-linecap="round"/>
    <circle cx="0" cy="39" r="66" fill="url(#metal)" stroke="#8fa5bb" stroke-width="5"/>
    <rect x="-48" y="20" width="96" height="42" rx="18" fill="#101629"/>
    <circle cx="-23" cy="41" r="11" fill="#ff3cac" filter="url(#glow)"/>
    <circle cx="23" cy="41" r="11" fill="#55e6ff" filter="url(#glow)"/>
    <path d="M-25 77 Q0 93 25 77" fill="none" stroke="#1a243d" stroke-width="7"/>
    <rect x="-42" y="-53" width="84" height="21" rx="8" fill="#242d4a"/>
    <text x="0" y="-38" text-anchor="middle" fill="#ffcf4a" font-family="Arial, sans-serif" font-size="12" font-weight="900">BOUNCER BOT</text>
    <rect x="-42" y="116" width="84" height="27" rx="5" fill="#101629" stroke="#4e6b8c" stroke-width="2"/>
    <text x="0" y="135" text-anchor="middle" fill="#ff6877" font-family="Arial, sans-serif" font-size="13" font-weight="900">NO CAPACITY</text>
    <path d="M-54 193 L-63 226 M54 193 L63 226" stroke="#b6c6d9" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Velvet rope -->
  <path d="M183 438 C275 493 390 488 485 446" fill="none" stroke="#d43f70" stroke-width="10"/>
  <path d="M183 438 C275 493 390 488 485 446" fill="none" stroke="#ff9ab6" stroke-width="3" stroke-dasharray="8 11"/>
  <g fill="#e6c36a" stroke="#8b6727" stroke-width="3">
    <circle cx="183" cy="438" r="13"/><circle cx="485" cy="446" r="13"/>
  </g>
  <path d="M183 450 L183 525 M485 458 L485 525" stroke="#e6c36a" stroke-width="8"/>

  <!-- Queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(65 365)">
      <circle cx="0" cy="0" r="25" fill="#b67d5a"/><path d="M-23 -5 Q0 -35 25 -5" fill="#3a2944"/>
      <path d="M-23 30 L-8 79 L20 79 L34 30" fill="#5d86bc"/>
      <path d="M-14 7 l-8 3 M12 7 l8 3" stroke="#1b1730" stroke-width="4"/>
      <text x="0" y="105" text-anchor="middle" fill="#aeb1cf" font-size="13">DEV #404</text>
    </g>
    <g transform="translate(135 405)">
      <circle cx="0" cy="0" r="23" fill="#d49b72"/><path d="M-22 -4 Q0 -30 22 -4" fill="#191827"/>
      <path d="M-22 27 L-8 72 L20 72 L29 27" fill="#a45b78"/>
      <path d="M-13 5 l7 1 M10 5 l7 -1" stroke="#1b1730" stroke-width="4"/>
      <text x="0" y="98" text-anchor="middle" fill="#aeb1cf" font-size="13">DEV #503</text>
    </g>
    <g transform="translate(48 508)">
      <circle cx="0" cy="0" r="25" fill="#815b45"/><path d="M-24 -5 Q0 -32 24 -5" fill="#83623b"/>
      <path d="M-22 29 L-5 75 L24 75 L31 29" fill="#4b9a8d"/>
      <path d="M-15 6 l8 2 M10 7 l8 -2" stroke="#1b1730" stroke-width="4"/>
      <text x="0" y="102" text-anchor="middle" fill="#aeb1cf" font-size="13">DEV #777</text>
    </g>
    <g transform="translate(125 525)">
      <circle cx="0" cy="0" r="22" fill="#e0af88"/><path d="M-22 -5 Q0 -33 22 -5" fill="#d85e6c"/>
      <path d="M-22 26 L-8 70 L22 70 L30 26" fill="#5367b4"/>
      <path d="M-14 4 l7 2 M10 6 l7 -2" stroke="#1b1730" stroke-width="4"/>
      <text x="0" y="96" text-anchor="middle" fill="#aeb1cf" font-size="13">DEV #999</text>
    </g>
  </g>

  <!-- Speech bubble -->
  <path d="M82 210 Q82 170 125 170 H270 Q310 170 310 210 V247 Q310 285 270 285 H178 L145 311 L149 285 H125 Q82 285 82 247Z" fill="#fff7d6" stroke="#3b254b" stroke-width="5"/>
  <text x="196" y="205" text-anchor="middle" fill="#28203e" font-family="Arial, sans-serif" font-size="15" font-weight="900">SELECTED MODEL IS</text>
  <text x="196" y="228" text-anchor="middle" fill="#e33d63" font-family="Arial, sans-serif" font-size="18" font-weight="900">AT CAPACITY.</text>
  <text x="196" y="252" text-anchor="middle" fill="#28203e" font-family="Arial, sans-serif" font-size="12">Please try a different model.</text>

  <!-- Caption -->
  <rect x="250" y="535" width="500" height="43" rx="12" fill="#211b3c" stroke="#ff3cac" stroke-width="2"/>
  <text x="500" y="563" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">When every model says “at capacity” except the one inside.</text>

  <!-- Exhaust and melting drips -->
  <path d="M326 292 q-16-24 3-39 M345 282 q-12-25 8-40 M366 290 q-8-22 10-34" fill="none" stroke="#ff8b4a" stroke-width="6" stroke-linecap="round"/>
  <path d="M330 389 q12 19 23 0t24 0t25-2" fill="none" stroke="#ff5b5b" stroke-width="8" stroke-linecap="round"/>
</svg>