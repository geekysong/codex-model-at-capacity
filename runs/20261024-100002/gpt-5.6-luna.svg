<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152d"/>
      <stop offset="1" stop-color="#34204a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#191525"/>
      <stop offset=".5" stop-color="#5a214f"/>
      <stop offset="1" stop-color="#191525"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="115" cy="120" r="75" fill="#6b2e88" opacity=".18" filter="url(#soft)"/>
  <circle cx="700" cy="190" r="105" fill="#ec3f9b" opacity=".12" filter="url(#soft)"/>
  <path d="M0 470 Q200 425 400 470 T800 455 V600 H0Z" fill="url(#floor)"/>
  <path d="M0 530 Q180 500 360 535 T800 510" fill="none" stroke="#ff4fba" stroke-width="3" opacity=".35"/>

  <text x="400" y="48" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="1">CODEX NIGHTCLUB</text>
  <text x="400" y="78" text-anchor="middle" fill="#ff83d1" font-family="Arial, sans-serif" font-size="17" font-weight="bold">THE EXCLUSIVE MODEL EXPERIENCE</text>

  <!-- club entrance -->
  <rect x="475" y="105" width="275" height="365" rx="18" fill="#11101d" stroke="#8c4c9e" stroke-width="5"/>
  <path d="M500 450 V165 Q500 125 540 125 H685 Q725 125 725 165 V450" fill="#281735" stroke="#bc54ad" stroke-width="4"/>
  <path d="M545 125 H680" stroke="#ff62bc" stroke-width="8" filter="url(#glow)"/>
  <text x="612" y="215" text-anchor="middle" fill="#ff4fbc" font-family="Arial" font-size="54" font-weight="900" filter="url(#glow)">FULL</text>
  <text x="612" y="247" text-anchor="middle" fill="#ffd0f2" font-family="Arial" font-size="14" font-weight="bold">ONE MODEL ONLY</text>
  <path d="M515 285 H710" stroke="#6d3c7e" stroke-width="2"/>
  <circle cx="535" cy="315" r="8" fill="#ffcf4a"/>
  <circle cx="690" cy="315" r="8" fill="#45e5ff"/>
  <path d="M535 405 Q612 355 690 405" fill="none" stroke="#ff62bc" stroke-width="4"/>

  <!-- lone model inside -->
  <g transform="translate(617 320)">
    <rect x="-42" y="14" width="84" height="70" rx="18" fill="#6de6df" stroke="#bafffa" stroke-width="4"/>
    <rect x="-35" y="-42" width="70" height="58" rx="16" fill="#9afff2" stroke="#d4fffb" stroke-width="4"/>
    <circle cx="-15" cy="-14" r="7" fill="#38204d"/>
    <circle cx="15" cy="-14" r="7" fill="#38204d"/>
    <path d="M-17 1 Q0 13 17 1" fill="none" stroke="#38204d" stroke-width="4"/>
    <path d="M-28 84 V104 M28 84 V104" stroke="#9afff2" stroke-width="10" stroke-linecap="round"/>
    <text x="0" y="58" text-anchor="middle" fill="#173d4c" font-family="Arial" font-size="12" font-weight="bold">VIP</text>
  </g>

  <!-- bouncer -->
  <g transform="translate(390 300)">
    <ellipse cx="0" cy="168" rx="83" ry="14" fill="#120d1a" opacity=".5"/>
    <rect x="-58" y="24" width="116" height="135" rx="22" fill="#252b44" stroke="#8f9bc7" stroke-width="4"/>
    <path d="M-48 48 L-83 130 M48 48 L83 130" stroke="#252b44" stroke-width="27" stroke-linecap="round"/>
    <circle cx="0" cy="-29" r="57" fill="#adb9c9" stroke="#e6f1ff" stroke-width="5"/>
    <path d="M-47 -40 Q0 -93 47 -40 L42 -20 H-42Z" fill="#202035" stroke="#9b78c1" stroke-width="4"/>
    <rect x="-39" y="-22" width="78" height="28" rx="10" fill="#151322"/>
    <circle cx="-20" cy="-8" r="6" fill="#ff477e" filter="url(#glow)"/>
    <circle cx="20" cy="-8" r="6" fill="#ff477e" filter="url(#glow)"/>
    <path d="M-20 24 H20" stroke="#202035" stroke-width="5" stroke-linecap="round"/>
    <path d="M-10 -86 V-105" stroke="#b9c8dc" stroke-width="5"/>
    <circle cx="-10" cy="-112" r="7" fill="#ffcf4a"/>
    <path d="M-65 65 H65" stroke="#e5eaff" stroke-width="5"/>
    <text x="0" y="122" text-anchor="middle" fill="#ffbddf" font-family="Arial" font-size="13" font-weight="bold">BOUNCER</text>
    <path d="M-84 132 L-115 155" stroke="#252b44" stroke-width="18" stroke-linecap="round"/>
    <path d="M84 132 L118 105" stroke="#252b44" stroke-width="18" stroke-linecap="round"/>
    <rect x="86" y="92" width="89" height="42" rx="7" fill="#fff5e6" stroke="#271832" stroke-width="3" transform="rotate(-9 86 92)"/>
    <text x="130" y="118" text-anchor="middle" fill="#24162f" font-family="Arial" font-size="11" font-weight="bold" transform="rotate(-9 130 118)">TRY AGAIN</text>
  </g>

  <!-- queue developers -->
  <g font-family="Arial, sans-serif">
    <text x="58" y="155" fill="#ffd2f0" font-size="18" font-weight="bold">THE DEVELOPER QUEUE</text>
    <path d="M82 425 H365" stroke="#d52f8c" stroke-width="6" stroke-dasharray="12 10"/>
    <g transform="translate(100 300)">
      <circle cx="0" cy="-37" r="31" fill="#d69a78"/>
      <path d="M-28 -42 Q0 -83 29 -42 Q15 -52 -26 -30Z" fill="#3b2630"/>
      <path d="M-13 -34 H-5 M10 -34 H18" stroke="#24192d" stroke-width="4"/>
      <path d="M-12 -19 Q0 -11 12 -19" fill="none" stroke="#24192d" stroke-width="3"/>
      <rect x="-37" y="-5" width="74" height="107" rx="18" fill="#447aab"/>
      <path d="M-34 26 H34" stroke="#d7f0ff" stroke-width="3"/>
      <text x="0" y="67" text-anchor="middle" fill="#d7f0ff" font-size="14" font-weight="bold">&lt;/&gt;</text>
      <path d="M-28 100 V137 M28 100 V137" stroke="#27334b" stroke-width="17" stroke-linecap="round"/>
    </g>
    <g transform="translate(210 328) scale(.86)">
      <circle cx="0" cy="-37" r="31" fill="#8f5e48"/>
      <path d="M-30 -40 Q0 -88 30 -38 L24 -20 H-25Z" fill="#29212a"/>
      <circle cx="-12" cy="-35" r="4" fill="#25182b"/><circle cx="12" cy="-35" r="4" fill="#25182b"/>
      <path d="M-12 -18 H12" stroke="#25182b" stroke-width="3"/>
      <rect x="-37" y="-5" width="74" height="107" rx="18" fill="#b64975"/>
      <text x="0" y="54" text-anchor="middle" fill="#ffe1ef" font-size="13" font-weight="bold">404</text>
      <path d="M-28 100 V137 M28 100 V137" stroke="#36243d" stroke-width="17" stroke-linecap="round"/>
    </g>
    <g transform="translate(300 352) scale(.7)">
      <circle cx="0" cy="-37" r="31" fill="#d7a478"/>
      <path d="M-31 -41 Q0 -82 31 -41 L25 -22 H-25Z" fill="#e8c152"/>
      <rect x="-37" y="-5" width="74" height="107" rx="18" fill="#547d62"/>
      <path d="M-17 -26 Q0 -12 17 -26" fill="none" stroke="#392031" stroke-width="4"/>
      <path d="M-28 100 V137 M28 100 V137" stroke="#263c35" stroke-width="17" stroke-linecap="round"/>
    </g>
  </g>

  <!-- melting hamster servers -->
  <g transform="translate(65 462)">
    <text x="0" y="-26" fill="#ffbbde" font-family="Arial" font-size="15" font-weight="bold">SERVERS, SOMEHOW:</text>
    <ellipse cx="82" cy="38" rx="70" ry="25" fill="#f2875b" opacity=".35" filter="url(#soft)"/>
    <circle cx="45" cy="15" r="25" fill="#d9d4e7" stroke="#fff" stroke-width="4"/>
    <circle cx="119" cy="15" r="25" fill="#d9d4e7" stroke="#fff" stroke-width="4"/>
    <circle cx="45" cy="15" r="4"/><circle cx="119" cy="15" r="4"/>
    <path d="M25 30 Q82 52 139 30 Q128 70 82 72 Q36 70 25 30Z" fill="#ef7658"/>
    <path d="M50 40 Q82 58 114 40" fill="none" stroke="#7c2942" stroke-width="5"/>
    <path d="M38 71 Q45 91 52 75 M80 72 Q88 96 95 73 M124 70 Q131 89 138 70" stroke="#ffbd62" stroke-width="5"/>
    <path d="M42 8 L30 -14 M120 8 L133 -17" stroke="#ffbd62" stroke-width="5"/>
    <text x="82" y="112" text-anchor="middle" fill="#ffcf89" font-family="Arial" font-size="13" font-weight="bold">RUNNING HOT</text>
  </g>

  <!-- velvet rope -->
  <path d="M392 470 Q270 405 150 470" fill="none" stroke="#ef315e" stroke-width="9"/>
  <circle cx="150" cy="470" r="12" fill="#e7c07a" stroke="#fff1c8" stroke-width="3"/>
  <circle cx="392" cy="470" r="12" fill="#e7c07a" stroke="#fff1c8" stroke-width="3"/>

  <!-- caption -->
  <rect x="105" y="548" width="590" height="36" rx="18" fill="#120e20" stroke="#ff5eb8" stroke-width="2"/>
  <text x="400" y="572" text-anchor="middle" fill="#fff2fa" font-family="Arial, sans-serif" font-size="17" font-weight="bold">“Selected model is at capacity. Please try a different model.”</text>
</svg>