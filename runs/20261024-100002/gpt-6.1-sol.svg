<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17142d"/>
      <stop offset="1" stop-color="#33204b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3cac"/>
      <stop offset=".5" stop-color="#784ba0"/>
      <stop offset="1" stop-color="#2b86c5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="90" cy="120" r="70" fill="#ff3cac" opacity=".12" filter="url(#soft)"/>
  <circle cx="710" cy="170" r="90" fill="#2b86c5" opacity=".14" filter="url(#soft)"/>

  <text x="400" y="52" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="1">
    CODEX NIGHTCLUB
  </text>
  <text x="400" y="82" text-anchor="middle" fill="#ff9cda" font-family="Arial, sans-serif" font-size="17" font-weight="700">
    THE EXCLUSIVE CLUB FOR ONE MODEL
  </text>

  <!-- club facade -->
  <rect x="500" y="112" width="245" height="310" rx="18" fill="#241b38" stroke="#ff56b6" stroke-width="4"/>
  <rect x="522" y="139" width="201" height="92" rx="13" fill="#120f22" stroke="#ffcc4d" stroke-width="4"/>
  <rect x="540" y="153" width="165" height="58" rx="9" fill="#ff3b30" opacity=".35" filter="url(#glow)"/>
  <text x="622" y="194" text-anchor="middle" fill="#fff4a8" font-family="Arial, sans-serif" font-size="38" font-weight="900">FULL</text>
  <text x="622" y="257" text-anchor="middle" fill="#ff9cda" font-family="Arial, sans-serif" font-size="14" font-weight="700">NO MORE TOKENS</text>

  <rect x="540" y="284" width="165" height="108" rx="12" fill="#302449" stroke="#7556a8" stroke-width="3"/>
  <text x="622" y="315" text-anchor="middle" fill="#bcd9ff" font-family="Arial, sans-serif" font-size="15" font-weight="700">INSIDE TONIGHT:</text>
  <text x="622" y="343" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="19" font-weight="900">MODEL-ONE</text>
  <text x="622" y="369" text-anchor="middle" fill="#ffcc4d" font-family="Arial, sans-serif" font-size="14" font-weight="700">VIP ACCESS</text>

  <!-- melting servers -->
  <g transform="translate(515 430)">
    <rect x="0" y="0" width="82" height="70" rx="8" fill="#596579" stroke="#a9c2df" stroke-width="3"/>
    <rect x="95" y="-8" width="82" height="78" rx="8" fill="#596579" stroke="#a9c2df" stroke-width="3"/>
    <circle cx="18" cy="20" r="5" fill="#6dff87"/><circle cx="36" cy="20" r="5" fill="#6dff87"/>
    <circle cx="113" cy="14" r="5" fill="#6dff87"/><circle cx="131" cy="14" r="5" fill="#6dff87"/>
    <path d="M5 70 q10 28 22 5 q12 35 27 4 q14 27 28-2" fill="#ff713d" stroke="#ffcc4d" stroke-width="3"/>
    <path d="M99 70 q12 27 24 2 q13 34 28 1 q12 24 26-3" fill="#ff713d" stroke="#ffcc4d" stroke-width="3"/>
    <text x="89" y="101" text-anchor="middle" fill="#ffb36b" font-family="Arial, sans-serif" font-size="13" font-weight="700">SERVER HAMSTERS: “WHEW!”</text>
  </g>

  <!-- bouncer -->
  <g transform="translate(315 175)">
    <ellipse cx="82" cy="246" rx="88" ry="17" fill="#120d1f" opacity=".65"/>
    <rect x="32" y="97" width="100" height="133" rx="40" fill="#27384b" stroke="#90b9d9" stroke-width="4"/>
    <rect x="48" y="122" width="68" height="46" rx="10" fill="#101828" stroke="#64e9ff" stroke-width="3"/>
    <circle cx="68" cy="145" r="7" fill="#ff4f92"/><circle cx="96" cy="145" r="7" fill="#ff4f92"/>
    <path d="M61 157 Q82 169 103 157" fill="none" stroke="#64e9ff" stroke-width="3"/>
    <path d="M30 119 L-5 151" stroke="#90b9d9" stroke-width="18" stroke-linecap="round"/>
    <path d="M132 119 L168 95" stroke="#90b9d9" stroke-width="18" stroke-linecap="round"/>
    <circle cx="174" cy="91" r="13" fill="#ffcc4d" stroke="#90b9d9" stroke-width="4"/>
    <rect x="46" y="185" width="72" height="24" rx="8" fill="#ff3cac"/>
    <text x="82" y="202" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="900">BOUNCER</text>
    <path d="M59 96 L59 67 M105 96 L113 67" stroke="#90b9d9" stroke-width="7" stroke-linecap="round"/>
    <circle cx="59" cy="59" r="10" fill="#ffcc4d"/><circle cx="116" cy="59" r="10" fill="#ffcc4d"/>
    <text x="82" y="260" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800">“SORRY, BUD.”</text>
  </g>

  <!-- queue -->
  <path d="M70 455 Q180 425 290 458" fill="none" stroke="#dca1d8" stroke-width="5" stroke-dasharray="10 12"/>
  <g font-family="Arial, sans-serif" font-weight="700">
    <g transform="translate(70 350)">
      <circle cx="35" cy="35" r="24" fill="#f2b18e"/><path d="M12 29 Q35 4 58 29" fill="#452d54"/>
      <rect x="12" y="60" width="47" height="70" rx="13" fill="#4cc9f0"/>
      <path d="M9 78 L-18 100 M60 78 L78 100" stroke="#f2b18e" stroke-width="12" stroke-linecap="round"/>
      <text x="35" y="153" text-anchor="middle" fill="#fff" font-size="13">DEV #1</text>
      <text x="35" y="172" text-anchor="middle" fill="#ffcc4d" font-size="11">needs coffee</text>
    </g>
    <g transform="translate(175 378)">
      <circle cx="35" cy="35" r="24" fill="#d99070"/><path d="M12 28 Q34 0 58 27" fill="#17152d"/>
      <rect x="12" y="60" width="47" height="70" rx="13" fill="#ff8fab"/>
      <path d="M9 78 L-18 100 M60 78 L78 100" stroke="#d99070" stroke-width="12" stroke-linecap="round"/>
      <text x="35" y="153" text-anchor="middle" fill="#fff" font-size="13">DEV #2</text>
      <text x="35" y="172" text-anchor="middle" fill="#ffcc4d" font-size="11">retrying...</text>
    </g>
    <g transform="translate(278 350)">
      <circle cx="35" cy="35" r="24" fill="#f0bd91"/><path d="M12 27 Q35 2 58 27" fill="#c56b3e"/>
      <rect x="12" y="60" width="47" height="70" rx="13" fill="#8be28b"/>
      <path d="M9 78 L-18 100 M60 78 L78 100" stroke="#f0bd91" stroke-width="12" stroke-linecap="round"/>
      <text x="35" y="153" text-anchor="middle" fill="#fff" font-size="13">DEV #3</text>
      <text x="35" y="172" text-anchor="middle" fill="#ffcc4d" font-size="11">still hopeful</text>
    </g>
  </g>

  <!-- velvet rope -->
  <path d="M92 495 L402 495 Q435 494 462 468" fill="none" stroke="#d92f68" stroke-width="8"/>
  <path d="M92 495 L92 442 M402 495 L402 441" stroke="#ffd56a" stroke-width="7"/>
  <circle cx="92" cy="440" r="10" fill="#ffd56a"/><circle cx="402" cy="439" r="10" fill="#ffd56a"/>

  <rect x="52" y="535" width="696" height="43" rx="14" fill="#0d0b18" stroke="#ff56b6" stroke-width="3"/>
  <text x="400" y="563" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="21" font-weight="900">
    “SELECTED MODEL IS AT CAPACITY. PLEASE TRY A DIFFERENT DOOR.”
  </text>

  <path d="M0 520 Q180 500 360 520 T800 520 L800 600 L0 600Z" fill="url(#floor)" opacity=".35"/>
</svg>