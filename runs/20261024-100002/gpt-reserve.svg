<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152f"/>
      <stop offset="1" stop-color="#301c3d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#63f5ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="105" r="78" fill="#572a62" opacity=".35"/>
  <circle cx="110" cy="135" r="95" fill="#213d65" opacity=".3"/>
  <path d="M0 445 Q180 410 350 445 T800 425 V600 H0Z" fill="#100f24"/>

  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#ff71da">THE EXCLUSIVE MODEL EXPERIENCE</text>

  <!-- Club facade -->
  <rect x="265" y="112" width="425" height="330" rx="22" fill="#201a3b" stroke="#8e5bba" stroke-width="5"/>
  <path d="M286 143 H668" stroke="#ff4fd8" stroke-width="5" filter="url(#glow)"/>
  <text x="478" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#fff">THE TOKEN ROOM</text>
  <text x="478" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#a8b7ff">MEMBERS ONLY • ONE MODEL PER EVENING</text>

  <!-- FULL sign -->
  <rect x="374" y="222" width="210" height="82" rx="12" fill="#241323" stroke="#ff3bcb" stroke-width="5" filter="url(#glow)"/>
  <text x="479" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#ff6cdd">FULL</text>
  <text x="479" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#63f5ff">TRY AGAIN LATER</text>

  <!-- One model inside -->
  <rect x="590" y="337" width="70" height="54" rx="9" fill="#3aefbd" opacity=".85"/>
  <circle cx="612" cy="358" r="7" fill="#11152d"/>
  <circle cx="638" cy="358" r="7" fill="#11152d"/>
  <path d="M609 375 Q625 385 642 375" fill="none" stroke="#11152d" stroke-width="4"/>
  <text x="625" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#3aefbd">MODEL_1</text>
  <path d="M615 337 V321" stroke="#3aefbd" stroke-width="4"/>
  <circle cx="615" cy="317" r="5" fill="#ffdc62"/>

  <!-- Bouncer -->
  <ellipse cx="245" cy="366" rx="58" ry="18" fill="#080817" opacity=".7"/>
  <rect x="205" y="260" width="80" height="116" rx="29" fill="#56627f" stroke="#10142b" stroke-width="5"/>
  <rect x="216" y="278" width="58" height="43" rx="12" fill="#10152b"/>
  <circle cx="234" cy="298" r="8" fill="#ff456f"/>
  <circle cx="257" cy="298" r="8" fill="#ff456f"/>
  <path d="M231 314 Q245 321 260 314" fill="none" stroke="#ff456f" stroke-width="4"/>
  <path d="M222 266 L268 266 L258 238 L232 238Z" fill="#17152e" stroke="#10142b" stroke-width="5"/>
  <path d="M191 322 L153 344" stroke="#56627f" stroke-width="18" stroke-linecap="round"/>
  <path d="M277 322 L320 303" stroke="#56627f" stroke-width="18" stroke-linecap="round"/>
  <rect x="125" y="332" width="92" height="31" rx="7" transform="rotate(-10 125 332)" fill="#ff527f"/>
  <text x="172" y="352" text-anchor="middle" transform="rotate(-10 172 352)" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#fff">NOPE</text>
  <text x="245" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b5c4ff">BOUNCER-BOT 3000</text>

  <!-- Velvet rope -->
  <path d="M322 382 Q440 424 588 382" fill="none" stroke="#e72f78" stroke-width="9"/>
  <path d="M322 382 V430 M588 382 V430" stroke="#d9a2b9" stroke-width="7"/>
  <circle cx="322" cy="382" r="12" fill="#ffd36b"/>
  <circle cx="588" cy="382" r="12" fill="#ffd36b"/>

  <!-- Queue developers -->
  <g stroke="#10152b" stroke-width="4">
    <circle cx="76" cy="410" r="24" fill="#d89d7b"/>
    <path d="M42 470 Q47 430 76 430 Q105 430 110 470Z" fill="#41a6d9"/>
    <path d="M58 398 Q76 375 95 397" fill="none" stroke="#2e2136" stroke-width="13"/>
    <circle cx="150" cy="434" r="23" fill="#a96f58"/>
    <path d="M116 493 Q120 453 150 453 Q180 453 184 493Z" fill="#f0b541"/>
    <path d="M133 420 Q150 400 168 420" fill="none" stroke="#161528" stroke-width="12"/>
    <circle cx="220" cy="454" r="22" fill="#e6b18e"/>
    <path d="M187 510 Q190 473 220 473 Q250 473 253 510Z" fill="#9d5ed1"/>
    <path d="M201 441 Q220 420 239 441" fill="none" stroke="#422937" stroke-width="12"/>
    <circle cx="292" cy="470" r="21" fill="#805843"/>
    <path d="M260 520 Q264 490 292 490 Q320 490 324 520Z" fill="#4fd19a"/>
  </g>

  <!-- laptops and tired expressions -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#fff">
    <text x="47" y="525">“just one request...”</text>
    <text x="126" y="550">zzz</text>
    <text x="215" y="545">retrying...</text>
  </g>
  <path d="M47 535 H108 M211 553 H283" stroke="#ff71da" stroke-width="2"/>

  <!-- Melting hamster-wheel servers -->
  <g transform="translate(570 455)">
    <ellipse cx="0" cy="45" rx="86" ry="18" fill="#09091a"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#7d8ba9" stroke-width="13"/>
    <circle cx="0" cy="0" r="9" fill="#ffca55"/>
    <path d="M-48 -32 L48 32 M48 -32 L-48 32" stroke="#7d8ba9" stroke-width="7"/>
    <path d="M-34 66 Q-25 85 -13 68 Q-3 53 8 72 Q20 89 34 63" fill="#ff704f" opacity=".9"/>
    <path d="M-45 68 Q-34 92 -22 70 Q-8 49 3 74 Q15 98 30 68" fill="none" stroke="#ffd05a" stroke-width="5"/>
    <circle cx="-18" cy="-7" r="8" fill="#d7e8ff"/>
    <circle cx="20" cy="10" r="8" fill="#d7e8ff"/>
    <path d="M-12 13 Q0 22 13 12" fill="none" stroke="#ff536d" stroke-width="5"/>
  </g>
  <text x="570" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#ff9c6b">SERVER FARM: EMOTIONALLY OVERHEATED</text>

  <!-- Caption -->
  <rect x="35" y="112" width="190" height="92" rx="14" fill="#fff4cd" stroke="#15152b" stroke-width="5" transform="rotate(-4 35 112)"/>
  <text x="130" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16152b" transform="rotate(-4 130 143)">SELECTED MODEL</text>
  <text x="130" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#16152b" transform="rotate(-4 130 165)">IS AT CAPACITY.</text>
  <text x="130" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7a3152" transform="rotate(-4 130 187)">Please try a different life.</text>

  <text x="400" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#d5c7ff">When the only model gets in, everyone else gets a timeout.</text>
</svg>