<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172333">
    <text x="30" y="28" font-size="19" font-weight="bold">Projectile motion</text>
    <text x="30" y="65">Initial velocity: (20, 15) m/s</text>
    <text x="30" y="88">Gravity: 10 m/s²; no air resistance</text>
    <text x="30" y="111">Scale: 10 px per meter</text>
    <text x="30" y="134" font-weight="bold">Total flight time: 3 s</text>
    <text x="30" y="170" font-size="12">Landing would be at canvas x = 700 px.</text>
    <text x="30" y="188" font-size="12">Inset continues the curve at the same scale.</text>
  </g>

  <!-- Main coordinates: x = 100 + 200t; y = 350 - 150t + 50t². -->
  <path d="M50 350H550" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M100 350 Q325 181.25 550 265.625"
        fill="none" stroke="#1769aa" stroke-width="3"/>
  <circle cx="100" cy="350" r="4" fill="#172333"/>
  <circle cx="400" cy="237.5" r="4" fill="#172333"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172333">
    <text x="60" y="369">launch: 0 m, 0 m</text>
    <text x="323" y="218">apex: 30 m, 11.25 m</text>
    <text x="458" y="291" font-size="12">to inset ↗</text>
  </g>

  <!-- Continuation translated by (-150, -200), with no scaling. -->
  <text x="378" y="43" font-family="Arial, sans-serif" font-size="12" fill="#475569">Continuation inset · same scale</text>
  <rect x="375" y="52" width="200" height="139" rx="6"
        fill="#f5f9fc" stroke="#b8c6d4"/>
  <path d="M390 150H565" stroke="#475569" stroke-width="2"/>
  <path d="M400 65.625 Q475 93.75 550 150"
        fill="none" stroke="#1769aa" stroke-width="3"/>
  <circle cx="550" cy="150" r="4" fill="#172333"/>
  <text x="392" y="176" font-family="Arial, sans-serif" font-size="14" fill="#172333">landing: 60 m, 0 m</text>

  <rect x="0" y="376" width="600" height="24" fill="#edf2f7"/>
  <text x="300" y="393" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="13" fill="#172333">2026-10-25 12:32:42 SGT (UTC+08:00)</text>
</svg>