<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8dd8f7"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666b78"/>
      <stop offset="1" stop-color="#30343d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <g id="wheel">
      <circle r="68" fill="none" stroke="#202631" stroke-width="10"/>
      <circle r="57" fill="none" stroke="#e9eef2" stroke-width="3"/>
      <g stroke="#d6e0e8" stroke-width="2">
        <line y2="-57"/><line y2="57"/>
        <line x2="-57"/><line x2="57"/>
        <line x1="-40" y1="-40" x2="40" y2="40"/>
        <line x1="-40" y1="40" x2="40" y2="-40"/>
      </g>
      <circle r="8" fill="#202631"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 330 Q120 270 250 330 T520 320 T800 315 V390 H0Z" fill="#72b87c"/>
