    <text x="400" y="69" text-anchor="middle" font-family="Verdana, sans-serif" font-size="34" font-weight="900" fill="#d53b31">THE GREAT PELICAN COMMUTE</text>
    <text x="400" y="96" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="700" fill="#263746">One bird. Two wheels. Zero sensible traffic decisions.</text>
  </g>

