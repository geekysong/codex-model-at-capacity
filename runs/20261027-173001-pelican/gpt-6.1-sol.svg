<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#606875"/>
      <stop offset="1" stop-color="#303640"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#243142" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202a36;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202a36}
      .small{font-family:Arial,Helvetica,sans-serif;fill:#fff;font-weight:bold}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="52" fill="#fff6ad" opacity=".8"/>
  <path d="M0 350 Q120 285 250 350 T520 345 T800 330 V450 H0Z" fill="#8acb7a"/>
  <path d="M0 420 Q170 390 340 425 T800 410 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f5db68" stroke-width="8" stroke-dasharray="42 30" opacity=".9"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#17344b">THE PELICAN PEDAL EXPRESS</text>
  <text x="400" y="95" text-anchor="middle" class="label" font-size="19" font-style="italic">“Why fly when you can make traffic miserable?”</text>

  <g filter="url(#shadow)">
    <!-- bicycle -->
    <g fill="none" class="ink">
      <circle cx="250" cy="445" r="82" stroke="#17212c" stroke-width="10"/>
      <circle cx="560" cy="445" r="82" stroke="#17212c" stroke-width="10"/>
      <path d="M250 445 L350 320 L455 445 L250 445 L405 445 L350 320 L520 320 L560 445"/>
      <path d="M520 320 L548 286"/>
      <path d="M505 285 H565"/>
    </g>
    <g class="ink" fill="none" stroke="#6f8798" stroke-width="3">
      <g>
        <path d="M250 363V527M168 445H332M192 387L308 503M192 503L308 387"/>
        <animateTransform attributeName="transform" type="rotate" from="0 250 445" to="360 250 445" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="M560 363V527M478 445H642M502 387L618 503M502 503L618 387"/>
        <animateTransform attributeName="transform" type="rotate" from="0 560 445" to="360 560 445" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- pelican bobbing with ride -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="0.8s" repeatCount="indefinite"/>
      <!-- body -->
      <ellipse cx="395" cy="255" rx="92" ry="112" fill="#f7f7f2" class="ink"/>
      <path d="M332 225 Q300 165 338 125 Q385 82 437 122 Q470 149 454 205 Q441 244 425 272Z" fill="#fff" class="ink"/>
      <!-- wing -->
      <path d="M365 235 Q421 215 452 250 Q421 304 367 320 Q343 288 365 235Z" fill="#d9e4e8" class="ink"/>
      <path d="M380 272 Q415 252 442 256" fill="none" stroke="#94aab6" stroke-width="5"/>
      <!-- head crest -->
      <path d="M338 132 Q315 103 337 84 Q352 108 367 91 Q380 111 399 101 Q412 119 430 113 Q436 145 414 157Z" fill="#f04f4f" class="ink"/>
      <!-- eye and monocle -->
      <circle cx="387" cy="150" r="11" fill="#fff" class="ink"/>
      <circle cx="390" cy="151" r="4" fill="#202a36"/>
      <circle cx="387" cy="150" r="18" fill="none" stroke="#d09b35" stroke-width="4"/>
      <path d="M405 150 H423" stroke="#d09b35" stroke-width="4"/>
      <!-- huge beak -->
      <path d="M350 178 Q275 159 207 188 Q274 229 365 215 Q391 201 350 178Z" fill="#f6a734" class="ink"/>
      <path d="M214 188 Q286 196 352 196" fill="none" stroke="#c87321" stroke-width="4"/>
      <!-- beak fish gag -->
      <path d="M235 188 Q206 168 185 180 Q204 201 235 188Z" fill="#6fc7e8" class="ink"/>
      <path d="M189 180 l-18 -12 l5 20Z" fill="#f28f55" class="ink"/>
      <!-- neck scarf -->
      <path d="M328 231 Q387 258 451 231 L444 255 Q389 280 335 253Z" fill="#e65050" class="ink"/>
      <!-- legs -->
      <path d="M372 331 L351 394 L391 420" fill="none" class="ink"/>
      <path d="M420 330 L442 394 L408 420" fill="none" class="ink"/>
      <path d="M381 417 L408 417" class="ink"/>
      <path d="M345 393 L375 393" class="ink"/>
      <!-- helmet -->
      <path d="M326 128 Q352 74 415 93 Q441 101 452 132Z" fill="#3d79c5" class="ink"/>
      <path d="M321 130 H456" class="ink"/>
      <!-- handlebar grip -->
      <path d="M518 320 Q540 300 555 286" fill="none" class="ink"/>
      <!-- pedal crank -->
      <circle cx="405" cy="445" r="13" fill="#f6a734" class="ink"/>
      <path d="M405 445 l-27 -17 M405 445 l30 18" class="ink"/>
      <path d="M366 424 h20 M430 463 h20" class="ink"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="0.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(590 170) rotate(8)">
    <path d="M0 30 Q46 0 92 30 L84 72 Q42 91 5 69Z" fill="#fff" class="ink"/>
    <text x="46" y="48" text-anchor="middle" class="label" font-size="16" font-weight="bold">HONK!</text>
  </g>

  <text x="400" y="555" text-anchor="middle" class="label" font-size="20" font-weight="bold">LOCAL BIRD INSISTS THIS COUNTS AS “SUSTAINABLE TRANSPORT.”</text>
  <text x="400" y="584" text-anchor="middle" class="label" font-size="14">2026-10-27 17:31:12 SGT (UTC+08:00)</text>
</svg>