<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Peak Pelican Performance</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels and bobbing motion, while a fish watches from its beak.</desc>
  <defs>
    <pattern id="spokes" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f5bf58"/>
    </pattern>
    <style>
      .ink { stroke:#263238; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.4s linear infinite; }
      .rider { animation:bob .7s ease-in-out infinite alternate; }
      .pedal { transform-origin:405px 370px; animation:spin 1.4s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8df"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#fffdf3" stroke="#263238" stroke-width="4"/>
