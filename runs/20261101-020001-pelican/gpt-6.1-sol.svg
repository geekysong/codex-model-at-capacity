<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A self-important pelican pedals a tiny bicycle, carrying a fish in its enormous bill pouch. Wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#fff" stroke-width="1"/>
    </pattern>
    <g id="wheel">
      <circle r="67" fill="#f8faf3" stroke="#243746" stroke-width="9"/>
      <circle r="59" fill="none" stroke="#6a8790" stroke-width="2"/>
      <g stroke="#78949c" stroke-width="2">
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41M-54-22L54 22M-22-54L22 54M-54 22L54-22M-22 54L22-54"/>
      </g>
      <circle r="9" fill="#e9ae42" stroke="#243746" stroke-width="3"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6dc"/>
  <path d="M0 325Q130 283 252 322T490 312T800 313V494H0Z" fill="#d8e8c5"/>
  <g fill="#fffdf4" opacity=".9">
    <path d="M47 164c-22-31 18-55 40-33 11-35 63-29 66 3 35-7 48 30 23 39H47Z"/>
    <path d="M585 173c-19-24 8-47 28-32 15-32 56-20 56 9 30-12 53 19 30 31H585Z"/>
  </g>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="900" fill="#243746" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#775433">One bird. Two wheels. Absolutely no brakes for lunch.</text>

  <g transform="translate(60 222) rotate(-7)">
    <rect width="150" height="77" rx="12" fill="#fff" stroke="#243746" stroke-width="3"/>
    <path d="M135 76l23 21-3-33" fill="#fff" stroke="#243746" stroke-width="3" stroke-linejoin="round"/>
    <text x="75" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243746">“I commute.</text>
    <text x="75" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243746">Therefore I’m fit.”</text>
  </g>

  <path d="M0 446H800V502H0Z" fill="#b8b7a5"/>
  <path d="M0 476H800" stroke="#fff6dc" stroke-width="4" stroke-dasharray="36 26"/>
  <ellipse cx="423" cy="449" rx="231" ry="13" fill="#243746" opacity=".13"/>

  <g transform="translate(270 381)">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0 270 381" to="360 270 381" dur="1.6s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(578 381)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- Rear wheel rotation uses its own local center. -->
  <circle cx="270" cy="381" r="67" fill="none" stroke="#243746" stroke-width="9"/>

  <g stroke="#243746" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 381L344 285 412 381H270L378 318 544 297 412 381M544 297L578 381" fill="none" stroke-width="12"/>
    <path d="M270 381L344 285 412 381H270L378 318 544 297 412 381M544 297L578 381" fill="none" stroke="#e65a4f" stroke-width="7"/>
    <path d="M344 285l-9-25M539 300l-13-46 26-15 22 8" fill="none" stroke-width="8"/>
    <path d="M315 259h47" stroke-width="12"/>
    <path d="M404 379l-67-92" stroke="#63777b" stroke-width="3"/>
    <circle cx="412" cy="381" r="18" fill="#f5d171" stroke-width="4"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <g stroke="#243746" stroke-width="4" stroke-linejoin="round">
      <path d="M356 278Q336 308 382 331L411 365" fill="none" stroke="#e6a23a" stroke-width="13" stroke-linecap="round">
        <animate attributeName="d" values="M356 278Q336 308 382 331L411 365;M356 278Q388 299 409 329L430 390;M356 278Q336 308 382 331L411 365" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M279 225l-39 9 25-32-37-7 58-22" fill="#fdfdf4"/>
      <path d="M285 188Q300 153 352 170Q385 183 391 235L367 278Q324 295 289 259Q269 237 285 188Z" fill="#fffdf3"/>
      <path d="M300 183Q329 165 360 180L377 218 288 224Z" fill="#45a5ad"/>
      <path d="M304 191Q347 210 363 250Q331 262 309 234Q294 217 304 191Z" fill="#edf0de"/>
      <path d="M362 190Q406 188 453 238L529 253" fill="none" stroke="#fffdf3" stroke-width="19" stroke-linecap="round"/>
      <path d="M525 251l16 5-10 11" fill="#f0b54c"/>
      <path d="M365 183Q373 157 358 140Q345 122 360 105Q377 88 398 104Q417 120 404 145L393 207" fill="#fffdf3"/>
      <path d="M395 132L576 149Q551 207 462 191Q418 181 395 145Z" fill="#efb444"/>
      <path d="M395 132L576 149L404 151" fill="#f7cd62"/>
      <path d="M417 157Q468 171 550 157" fill="none" stroke="#c98a37" stroke-width="2"/>

      <g transform="translate(475 173) rotate(8)">
        <path d="M-21 0Q0-19 25 0Q0 19-21 0L-34 11V-11Z" fill="#6bbac0" stroke-width="2.5"/>
        <circle cx="14" cy="-2" r="3" fill="#243746" stroke="none"/>
        <path d="M-2-5l-5 10" fill="none" stroke-width="2"/>
      </g>

      <path d="M348 111Q341 86 365 81Q393 76 406 102Z" fill="#e65a4f"/>
      <path d="M354 96l44-7" fill="none" stroke="#fff6dc" stroke-width="4"/>
      <circle cx="389" cy="122" r="9" fill="#fff"/>
      <circle cx="392" cy="123" r="4" fill="#243746" stroke="none"/>
      <path d="M382 107l15 2" fill="none" stroke-width="3" stroke-linecap="round"/>
      <path d="M360 155l-18 17-13-19" fill="#e65a4f"/>
    </g>
  </g>

  <g transform="translate(412 381)">
    <g stroke="#243746" stroke-linecap="round" stroke-width="5">
      <path d="M-22 0H22"/>
      <path d="M-31 0h17M14 0h17" stroke-width="8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(637 305)">
    <path d="M0 144V0" stroke="#735946" stroke-width="6"/>
    <rect x="-28" y="-17" width="115" height="64" rx="8" fill="#fff6dc" stroke="#243746" stroke-width="3"/>
    <text x="29" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#243746">BIKE LANE</text>
    <text x="29" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#243746">NO FREE FISH</text>
  </g>

  <rect y="505" width="800" height="95" fill="#243746"/>
  <text x="400" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff6dc">His carbon footprint is tiny. His lunch overhead is enormous.</text>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff6dc">2026-11-01 02:01:16 SGT (UTC+08:00)</text>
</svg>