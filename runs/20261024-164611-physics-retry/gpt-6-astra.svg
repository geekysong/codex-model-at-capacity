<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>Balanced seesaw in static equilibrium</title>
  <desc>A 6 kilogram mass hangs 2 meters left of the pivot and a 4 kilogram mass hangs 3 meters right. The seesaw remains level because 6 times 2 equals 4 times 3.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
    .beam { fill: #d7a84a; stroke: #6b4b16; stroke-width: 3; }
    .mass { stroke: #172033; stroke-width: 3; }
    .leftMass { fill: #5b8def; }
    .rightMass { fill: #ef7565; }
    .arrow { stroke: #c62828; stroke-width: 5; stroke-linecap: round; }
    .arrowHead { fill: #c62828; }
    .dimension { stroke: #39465c; stroke-width: 2; }
    .pivot { fill: #697386; stroke: #172033; stroke-width: 3; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
    .pulse2 { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite .9s; }
    @keyframes pulse { 0%,100% { opacity: .72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  </style>

  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- heading -->
  <text x="300" y="35" text-anchor="middle" font-size="24" font-weight="700">Level Seesaw — Static Equilibrium</text>

  <!-- seesaw beam -->
  <rect class="beam" x="90" y="185" width="420" height="22" rx="8"/>
  <line x1="300" y1="175" x2="300" y2="225" stroke="#172033" stroke-width="3"/>

  <!-- pivot -->
  <path class="pivot" d="M270 285 L300 215 L330 285 Z"/>
  <line x1="255" y1="285" x2="345" y2="285" stroke="#172033" stroke-width="5" stroke-linecap="round"/>
  <text x="300" y="310" text-anchor="middle" font-size="16" font-weight="600">pivot</text>

  <!-- suspension lines and masses -->
  <line x1="165" y1="207" x2="165" y2="250" stroke="#172033" stroke-width="3"/>
  <rect class="mass pulse" x="135" y="250" width="60" height="48" rx="7"/>
  <text x="165" y="280" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">6 kg</text>

  <line x1="435" y1="207" x2="435" y2="250" stroke="#172033" stroke-width="3"/>
  <rect class="mass pulse2" x="405" y="250" width="60" height="48" rx="7"/>
  <text x="435" y="280" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">4 kg</text>

  <!-- downward force arrows -->
  <g class="pulse">
    <line class="arrow" x1="165" y1="225" x2="165" y2="247"/>
    <path class="arrowHead" d="M156 240 L165 254 L174 240 Z"/>
  </g>
  <g class="pulse2">
    <line class="arrow" x1="435" y1="225" x2="435" y2="247"/>
    <path class="arrowHead" d="M426 240 L435 254 L444 240 Z"/>
  </g>
  <text x="165" y="220" text-anchor="middle" font-size="15" fill="#c62828">↓  F = 6g</text>
  <text x="435" y="220" text-anchor="middle" font-size="15" fill="#c62828">↓  F = 4g</text>

  <!-- distance dimensions -->
  <line class="dimension" x1="165" y1="335" x2="300" y2="335"/>
  <line class="dimension" x1="165" y1="328" x2="165" y2="342"/>
  <line class="dimension" x1="300" y1="328" x2="300" y2="342"/>
  <path d="M177 331 L165 335 L177 339" fill="none" stroke="#39465c" stroke-width="2"/>
  <path d="M288 331 L300 335 L288 339" fill="none" stroke="#39465c" stroke-width="2"/>
  <text x="232" y="356" text-anchor="middle" font-size="17">2 m</text>

  <line class="dimension" x1="300" y1="335" x2="435" y2="335"/>
  <line class="dimension" x1="435" y1="328" x2="435" y2="342"/>
  <path d="M312 331 L300 335 L312 339" fill="none" stroke="#39465c" stroke-width="2"/>
  <path d="M423 331 L435 335 L423 339" fill="none" stroke="#39465c" stroke-width="2"/>
  <text x="368" y="356" text-anchor="middle" font-size="17">x = 3 m</text>

  <!-- torque equation and status -->
  <rect x="115" y="70" width="370" height="58" rx="12" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="300" y="96" text-anchor="middle" font-size="22" font-weight="700">6 × 2 = 4 × 3</text>
  <text x="300" y="117" text-anchor="middle" font-size="16">12 N·m = 12 N·m</text>
  <text x="300" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#2e7d32">BALANCED</text>
</svg>