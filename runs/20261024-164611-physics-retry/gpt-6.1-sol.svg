<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <style>
    .label{font-family:Arial,sans-serif;fill:#17202a;font-size:18px}
    .small{font-size:16px}
    .mass{fill:#4a90e2;stroke:#17365d;stroke-width:2}
    .beam{fill:#d89b45;stroke:#6e451b;stroke-width:3}
    .pivot{fill:#7f8c8d;stroke:#34495e;stroke-width:3}
    .arrow{stroke:#c0392b;stroke-width:4;marker-end:url(#arrowhead)}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    .pulse2{animation:pulse 1.8s ease-in-out .9s infinite}
    @keyframes pulse{0%,100%{opacity:.65;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.12)}}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="300" y="38" text-anchor="middle" class="label" font-size="24">Level Seesaw — Static Equilibrium</text>

  <!-- level beam -->
  <rect x="80" y="190" width="440" height="18" rx="7" class="beam"/>
  <line x1="300" y1="180" x2="300" y2="218" stroke="#34495e" stroke-width="3"/>

  <!-- pivot -->
  <path d="M270 285 L300 215 L330 285 Z" class="pivot"/>
  <line x1="255" y1="285" x2="345" y2="285" stroke="#34495e" stroke-width="4"/>

  <!-- left suspension and mass -->
  <line x1="140" y1="208" x2="140" y2="260" stroke="#34495e" stroke-width="3"/>
  <rect x="108" y="260" width="64" height="52" rx="8" class="mass"/>
  <text x="140" y="292" text-anchor="middle" fill="white" font-family="Arial" font-size="18">6 kg</text>

  <!-- right suspension and mass -->
  <line x1="460" y1="208" x2="460" y2="260" stroke="#34495e" stroke-width="3"/>
  <rect x="428" y="260" width="64" height="52" rx="8" class="mass"/>
  <text x="460" y="292" text-anchor="middle" fill="white" font-family="Arial" font-size="18">4 kg</text>

  <!-- force arrows -->
  <g class="pulse">
    <line x1="140" y1="248" x2="140" y2="215" class="arrow"/>
    <text x="140" y="340" text-anchor="middle" class="label small">6g downward</text>
  </g>
  <g class="pulse2">
    <line x1="460" y1="248" x2="460" y2="215" class="arrow"/>
    <text x="460" y="340" text-anchor="middle" class="label small">4g downward</text>
  </g>

  <!-- distances -->
  <line x1="140" y1="155" x2="300" y2="155" stroke="#2c3e50" stroke-width="2"/>
  <line x1="140" y1="148" x2="140" y2="162" stroke="#2c3e50" stroke-width="2"/>
  <line x1="300" y1="148" x2="300" y2="162" stroke="#2c3e50" stroke-width="2"/>
  <text x="220" y="145" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="125" x2="460" y2="125" stroke="#2c3e50" stroke-width="2"/>
  <line x1="300" y1="118" x2="300" y2="132" stroke="#2c3e50" stroke-width="2"/>
  <line x1="460" y1="118" x2="460" y2="132" stroke="#2c3e50" stroke-width="2"/>
  <text x="380" y="115" text-anchor="middle" class="label">3 m</text>

  <!-- equation and result -->
  <text x="300" y="370" text-anchor="middle" class="label" font-size="22">6 × 2 = 4 × 3</text>
  <text x="300" y="395" text-anchor="middle" class="label" font-size="24" font-weight="bold">x = 3 m — BALANCED</text>
</svg>