<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish dangling in front of its enormous beak. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10 10 0" stroke="#fff" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "Trebuchet MS", Arial, sans-serif; }
    .outline { stroke: #243344; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="600" fill="#fff4d9"/>
  <circle cx="689" cy="149" r="49" fill="#ffc85b"/>
  <path d="M0 397 Q150 344 290 395 T570 389 T800 380 V490 H0Z" fill="#c4dbb2"/>
  <path d="M0 450 Q300 435 800 452 V516 H0Z" fill="#e3cba5"/>
  <path d="M30 483 H133 M348 483 H432 M662 483 H771" stroke="#fff4d9" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="61" text-anchor="middle" font-size="46" font-weight="900" fill="#243344" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="92" text-anchor="middle" font-size="18" fill="#775440">One bird. Two wheels. Absolutely no brakes for lunch.</text>

  <!-- A single, very questionable training incentive. -->
  <path d="M533 316 L566 179 H652 V220" fill="none" stroke="#775440" stroke-width="5" stroke-linecap="round"/>
  <path d="M652 220 V243" stroke="#243344" stroke-width="2"/>
  <g class="outline">
    <path d="M627 255 Q650 231 674 254 L690 241 V270 L674 259 Q650 278 627 255Z" fill="#69b9bb" stroke-width="3"/>
    <circle cx="639" cy="253" r="3" fill="#243344" stroke="none"/>
  </g>

  <!-- Wheels rotate about their hubs. -->
  <g transform="translate(230 409)">
    <circle r="78" fill="#fff9e8" stroke="#243344" stroke-width="12"/>
    <g stroke="#7f9da4" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-71 0 H71 M0-71 V71 M-50-50 50 50 M-50 50 50-50 M-66-27 66 27 M-27-66 27 66 M-66 27 66-27 M-27 66 27-66"/>
    </g>
    <circle r="9" fill="#243344"/>
  </g>
  <g transform="translate(559 409)">
    <circle r="78" fill="#fff9e8" stroke="#243344" stroke-width="12"/>
    <g stroke="#7f9da4" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-71 0 H71 M0-71 V71 M-50-50 50 50 M-50 50 50-50 M-66-27 66 27 M-27-66 27 66 M-66 27 66-27 M-27 66 27-66"/>
    </g>
    <circle r="9" fill="#243344"/>
  </g>

  <!-- Bicycle frame and chain. -->
  <path d="M230 409 309 306 385 409Z M309 306 H512 L385 409 M512 306 559 409" fill="none" stroke="#243344" stroke-width="13" stroke-linejoin="round"/>
  <path d="M230 409 309 306 385 409Z M309 306 H512 L385 409 M512 306 559 409" fill="none" stroke="#e76650" stroke-width="7" stroke-linejoin="round"/>
  <path d="M309 306 298 284 M512 306 497 266 H531" fill="none" class="outline"/>
  <path d="M275 283 H322" stroke="#243344" stroke-width="12" stroke-linecap="round"/>
  <path d="M232 400 385 390 A19 19 0 0 1 385 428 L232 418" fill="none" stroke="#526372" stroke-width="3"/>
  <circle cx="385" cy="409" r="20" fill="#ffd064" class="outline"/>

  <!-- Pelican: the pouch has a larger cargo capacity than the bicycle. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M304 289 Q275 324 292 345 L355 358 385 387" fill="none" stroke="#d68932" stroke-width="13" stroke-linecap="round"/>
    <path d="M265 266 228 242 244 281 214 278 Q244 309 283 301" fill="#f7faf2" class="outline"/>
    <path d="M279 289 Q239 258 272 215 Q298 186 345 218 Q371 239 362 279 Q337 309 279 289Z" fill="#fffef2" class="outline"/>
    <path d="M350 262 Q370 244 367 207 Q357 172 380 153 Q402 134 424 154 Q439 173 422 196 Q401 217 408 254 Q412 279 379 291" fill="#fffef2" class="outline"/>
    <path d="M420 180 Q505 177 601 204 Q542 215 424 204Z" fill="#f9b347" class="outline"/>
    <path d="M426 203 586 208 Q555 282 481 259 Q437 245 426 203Z" fill="#f4c078" class="outline"/>
    <path d="M454 225 Q491 246 537 230" fill="none" stroke="#d78c4a" stroke-width="3"/>
    <circle cx="406" cy="173" r="10" fill="white" stroke="#243344" stroke-width="3"/>
    <circle cx="410" cy="174" r="4" fill="#243344"/>
    <path d="M395 154 415 150" stroke="#243344" stroke-width="5" stroke-linecap="round"/>
    <path d="M371 149 Q392 117 422 145Z" fill="#e76650" class="outline"/>
    <path d="M380 139 394 139 M402 138 412 141" stroke="#fff4d9" stroke-width="4"/>
    <path d="M285 236 Q304 221 325 242 L359 267 492 269" fill="none" stroke="#243344" stroke-width="18" stroke-linecap="round"/>
    <path d="M285 236 Q304 221 325 242 L359 267 492 269" fill="none" stroke="#fffef2" stroke-width="11" stroke-linecap="round"/>
    <path d="M304 283 Q340 310 324 338 L365 365" fill="none" stroke="#e4a142" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M304 283 Q340 310 324 338 L365 365;M304 283 Q371 303 358 343 L403 395;M304 283 Q340 310 324 338 L365 365" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M293 252 Q306 273 328 272" fill="none" stroke="#a8b7b2" stroke-width="3"/>
  </g>

  <g transform="translate(385 409)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-30 0 H30" stroke="#243344" stroke-width="6"/>
      <path d="M-34-8 V8 M34-8 V8" stroke="#243344" stroke-width="10" stroke-linecap="round"/>
    </g>
    <circle r="6" fill="#243344"/>
  </g>

  <path d="M137 239 H186 M155 257 H204 M145 276 H185" stroke="#9bb8aa" stroke-width="4" stroke-linecap="round"/>
  <path d="M85 132 H281 Q295 132 295 146 V184 Q295 198 281 198 H245 L254 218 221 198 H85 Q71 198 71 184 V146 Q71 132 85 132Z" fill="#fffdf6" stroke="#243344" stroke-width="3"/>
  <text x="183" y="159" text-anchor="middle" font-size="18" font-weight="bold" fill="#243344">
    <tspan x="183">“My trainer calls it</tspan>
    <tspan x="183" dy="25">the seafood cycle.”</tspan>
  </text>

  <rect x="0" y="517" width="800" height="83" fill="#243344"/>
  <text x="400" y="545" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff4d9">This pelican runs on pedal power and unrealistic lunch goals.</text>
  <text x="400" y="578" text-anchor="middle" font-size="17" fill="#fff4d9">2026-11-04 12:01:05 SGT (UTC+08:00)</text>
</svg>