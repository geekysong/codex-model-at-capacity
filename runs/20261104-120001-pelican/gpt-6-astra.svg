<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Has a Large Bill</title>
  <desc id="desc">A smug pelican rides a tiny bicycle with spinning wheels and bobbing pedals, carrying a huge bill in its beak. Caption: Switched to cycling. Still has an enormous bill.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="1" fill="#decfae" opacity=".3"/>
      <circle cx="17" cy="19" r=".7" fill="#decfae" opacity=".3"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fff9e8" stroke="#253842" stroke-width="12"/>
      <circle r="67" fill="none" stroke="#a4b8b6" stroke-width="3"/>
      <g stroke="#78918f" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#edb748" stroke="#253842" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M30 119H770" stroke="#253842" stroke-width="3"/>
  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#253842">THE COMMUTER WITH THE BIG BILL</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" letter-spacing="3" fill="#966143">TWO WHEELS. ZERO FINANCIAL RELIEF.</text>

  <!-- One coastal commute, with ample room below for the caption and clock. -->
  <path d="M0 347Q120 326 230 346T460 342T800 345V448H0Z" fill="#d8e7db"/>
  <path d="M0 376Q165 354 288 375T570 369T800 378" fill="none" stroke="#b3cfbf" stroke-width="3"/>
  <path d="M47 187q15-16 30 0q15-16 30 0M665 169q11-12 22 0q11-12 22 0" fill="none" stroke="#a7b7ad" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="414" cy="465" rx="254" ry="15" fill="#253842" opacity=".13"/>
  <path d="M50 469H750" stroke="#253842" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#80978c" stroke-width="3" stroke-linecap="round">
    <path d="M90 391H141M109 405H154M78 419H135"/>
  </g>

  <!-- Wheels rotate independently of the bicycle frame. -->
  <g transform="translate(252 387)"><use href="#wheel"/></g>
  <g transform="translate(565 387)"><use href="#wheel"/></g>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M252 387L325 281L404 387ZM325 281H493L404 387M493 281L565 387" stroke="#253842" stroke-width="15"/>
    <path d="M252 387L325 281L404 387ZM325 281H493L404 387M493 281L565 387" stroke="#e46c4c" stroke-width="8"/>
    <path d="M325 281L316 258M493 281L480 244L508 222L534 224" stroke="#253842" stroke-width="9"/>
    <path d="M297 257H343" stroke="#253842" stroke-width="14"/>
    <path d="M404 387L252 387" stroke="#253842" stroke-width="4"/>
  </g>
  <circle cx="404" cy="387" r="20" fill="#f9d06e" stroke="#253842" stroke-width="5"/>
  <g transform="translate(404 387)">
    <g stroke="#253842" stroke-width="6" stroke-linecap="round">
      <path d="M-25 0H25"/>
      <path d="M-30-7V7M30-7V7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- The rider gently bobs; the webbed foot pedals in a small ellipse. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".75s" repeatCount="indefinite"/>
    <path d="M336 267Q342 307 380 322L409 359" fill="none" stroke="#253842" stroke-width="16" stroke-linecap="round"/>
    <path d="M336 267Q342 307 380 322L409 359" fill="none" stroke="#eda944" stroke-width="10" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;8 -7;0 -14;-8 -7;0 0" dur="1.5s" repeatCount="indefinite"/>
      <path d="M405 350L431 358L448 374L407 374L395 366Z" fill="#f2b449" stroke="#253842" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <path d="M292 204L247 185L266 229L236 224Q267 264 308 271" fill="#fdfcf0" stroke="#253842" stroke-width="5" stroke-linejoin="round"/>
    <path d="M280 211Q294 174 351 183Q390 188 410 160Q431 128 453 148Q475 165 455 196Q437 221 419 240Q393 285 333 276Q282 274 280 211Z" fill="#fffdf1" stroke="#253842" stroke-width="5"/>
    <path d="M306 215Q335 195 369 218L398 236Q358 269 315 246" fill="#dce6df" stroke="#253842" stroke-width="4" stroke-linecap="round"/>
    <path d="M326 225L352 240M340 218L367 234" stroke="#a4b8ae" stroke-width="3" stroke-linecap="round"/>
    <path d="M397 219Q435 225 474 239L502 225" fill="none" stroke="#253842" stroke-width="13" stroke-linecap="round"/>
    <path d="M397 219Q435 225 474 239L502 225" fill="none" stroke="#fffdf1" stroke-width="8" stroke-linecap="round"/>

    <!-- The oversized pouch is the visual punch line. -->
    <path d="M454 164L651 181Q589 237 507 207Q473 192 454 164Z" fill="#f4bb58" stroke="#253842" stroke-width="5" stroke-linejoin="round"/>
    <path d="M456 159L660 178L455 179" fill="#f2ce67" stroke="#253842" stroke-width="5" stroke-linejoin="round"/>
    <path d="M488 184Q529 211 576 202" fill="none" stroke="#d38a3f" stroke-width="3"/>
    <circle cx="447" cy="154" r="11" fill="white" stroke="#253842" stroke-width="3"/>
    <circle cx="451" cy="154" r="4" fill="#253842"/>
    <path d="M434 136L455 140" stroke="#253842" stroke-width="5" stroke-linecap="round"/>

    <!-- A tiny bicycle helmet for an absurdly confident bird. -->
    <path d="M413 136Q413 107 440 107Q463 110 466 137Z" fill="#559b94" stroke="#253842" stroke-width="4"/>
    <path d="M426 114L424 130M439 112V130M452 117L455 131" stroke="#253842" stroke-width="4" stroke-linecap="round"/>
    <path d="M418 137L430 174L440 177" fill="none" stroke="#253842" stroke-width="3"/>

    <g transform="rotate(9 607 204)">
      <path d="M583 184H636V278L627 273L618 279L609 273L600 279L591 273L583 278Z" fill="#fffdf3" stroke="#253842" stroke-width="3"/>
      <text x="609" y="209" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#253842">BILL</text>
      <path d="M593 219H626M593 226H620" stroke="#9aa59a" stroke-width="2"/>
      <text x="609" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#bd553e">$$$</text>
    </g>
  </g>

  <rect x="30" y="488" width="740" height="57" rx="12" fill="#253842"/>
  <text x="400" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff5dc">Switched to cycling. Still has an enormous bill.</text>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#253842">2026-11-04 12:00:01 SGT (UTC+08:00)</text>
</svg>