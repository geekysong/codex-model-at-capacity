<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Squawk</title>
  <desc id="desc">A pelican rides a bicycle with a fish in its bill. The wheels spin and the pelican bobs as it pedals.</desc>
  <defs>
