<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedals Against the Current</title>
  <desc>A satirical cartoon pelican rides a bicycle while insisting it is perfectly normal.</desc>
  <style>
    .ink{stroke:#17324d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,sans-serif;fill:#17324d}
    .small{font-size:17px}
    .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.8s linear infinite}
    .bikeBob{animation:bob 1.4s ease-in-out infinite}
    .wing{animation:flap 1.4s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @keyframes flap{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-8deg)}}
  </style>

  <rect width="800" height="600" fill="#d9f3ff"/>
  <rect y="390" width="800" height="210" fill="#8bd17c"/>
  <path d="M0 438 Q120 410 240 438 T480 438 T720 438 T960 438" fill="none" stroke="#5aa85b" stroke-width="8"/>
  <path d="M0 486 Q160 455 320 486 T640 486 T960 486" fill="none" stroke="#6db96b" stroke-width="6"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="36" font-weight="900">PELICAN PEDALS AGAINST THE CURRENT</text>
  <text x="400" y="89" text-anchor="middle" class="label" font-size="19" font-style="italic">“I’m not late. I’m making a dramatic entrance.”</text>

  <g transform="translate(0,5)" class="bikeBob">
    <g class="wheel">
      <circle cx="245" cy="430" r="74" fill="#f7fbff" class="ink"/>
      <circle cx="245" cy="430" r="10" fill="#ffb347" class="ink"/>
      <path d="M245 356V504M171 430H319M193 378L297 482M297 378L193 482" fill="none" class="ink" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="555" cy="430" r="74" fill="#f7fbff" class="ink"/>
      <circle cx="555" cy="430" r="10" fill="#ffb347" class="ink"/>
      <path d="M555 356V504M481 430H629M503 378L607 482M607 378L503 482" fill="none" class="ink" stroke-width="3"/>
    </g>

    <path d="M245 430 L340 300 L440 430 L245 430 M340 300 L555 430 M440 430 L500 300 L555 430 M500 300 L530 290" fill="none" class="ink"/>
    <path d="M320 302 L300 278 L330 270" fill="none" class="ink"/>
    <circle cx="440" cy="430" r="22" fill="#ffb347" class="ink"/>
    <path d="M440 430 L420 405 M440 430 L463 450" fill="none" class="ink"/>
    <path d="M420 405 l-18 -4 M463 450 l18 4" fill="none" class="ink"/>
    <path d="M530 290 L570 280" fill="none" class="ink"/>

    <g transform="translate(0,-7)">
      <path d="M355 290 Q370 210 438 208 Q493 206 510 270 L481 323 Q426 337 374 311 Z" fill="#f7f1dc" class="ink"/>
      <path d="M390 236 Q424 174 477 197 Q518 216 510 270 L480 301 L433 284 Z" fill="#f6a548" class="ink"/>
      <path d="M462 208 Q491 184 513 201 Q530 215 509 238 L475 250 Z" fill="#f7f1dc" class="ink"/>
      <circle cx="480" cy="210" r="7" fill="#17324d"/>
      <path d="M506 235 Q570 221 621 246 Q634 254 620 267 Q560 278 500 263 Z" fill="#f08b3e" class="ink"/>
      <path d="M516 250 Q567 252 620 263" fill="none" class="ink" stroke-width="3"/>
      <path d="M390 250 Q350 265 333 303 Q353 324 390 305 L421 278" fill="#f6a548" class="ink wing"/>
      <path d="M420 278 Q393 298 366 304" fill="none" class="ink" stroke-width="3"/>
      <path d="M398 308 Q384 343 362 373 M470 307 Q480 344 501 374" fill="none" class="ink"/>
      <path d="M347 371 q18 -10 32 2 M485 372 q18 -10 32 2" fill="none" class="ink"/>
      <path d="M350 274 Q326 255 320 229" fill="none" class="ink" stroke-width="8"/>
      <path d="M320 229 q-18 -22 4 -35 q22 14 10 37" fill="#f6a548" class="ink"/>
      <path d="M540 221 Q570 191 599 211" fill="none" stroke="#17324d" stroke-width="5"/>
      <path d="M594 204 l18 -10 M598 214 l21 -1" fill="none" stroke="#17324d" stroke-width="4"/>
    </g>
  </g>

  <g transform="translate(610 335)">
    <path d="M0 44 Q42 4 92 38" fill="none" stroke="#17324d" stroke-width="4"/>
    <rect x="8" y="35" width="82" height="42" rx="8" fill="#fff3b0" class="ink"/>
    <text x="49" y="61" text-anchor="middle" class="label" font-size="15" font-weight="700">HONK?</text>
  </g>

  <rect x="18" y="550" width="764" height="35" rx="8" fill="#ffffff" opacity=".9"/>
  <text x="400" y="573" text-anchor="middle" class="label small" font-weight="700">2026-10-28 11:32:18 SGT (UTC+08:00)</text>
