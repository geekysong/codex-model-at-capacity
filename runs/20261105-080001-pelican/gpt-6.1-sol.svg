<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish riding in its enormous bill pouch. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1" fill="#e5ddc7"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#fff6df"/>
  <rect width="800" height="490" fill="url(#paper)"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#203844">
    <text x="400" y="62" font-size="46" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="94" font-size="19" font-weight="bold">ONE BIRD. TWO WHEELS. ZERO AERODYNAMICS.</text>
  </g>

  <path d="M40 431 Q180 415 325 432 T760 428" fill="none" stroke="#b5bea3" stroke-width="4"/>
  <ellipse cx="408" cy="451" rx="265" ry="14" fill="#203844" opacity=".12"/>
  <g fill="none" stroke="#203844" stroke-width="3" stroke-linecap="round">
    <path d="M94 290h61 M72 308h68 M107 327h40"/>
    <path d="M649 335h39 M669 351h49"/>
  </g>

  <!-- Rotating wheels -->
  <g transform="translate(240 365)">
    <circle r="78" fill="#fff9e9" stroke="#203844" stroke-width="10"/>
    <circle r="68" fill="none" stroke="#e6ad48" stroke-width="3"/>
    <g stroke="#728b91" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-67 0H67 M0-67V67 M-47-47 47 47 M-47 47 47-47"/>
      <path d="M0-68h15" stroke="#f16d46" stroke-width="7"/>
    </g>
    <circle r="9" fill="#203844"/>
  </g>
  <g transform="translate(568 365)">
    <circle r="78" fill="#fff9e9" stroke="#203844" stroke-width="10"/>
    <circle r="68" fill="none" stroke="#e6ad48" stroke-width="3"/>
    <g stroke="#728b91" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-67 0H67 M0-67V67 M-47-47 47 47 M-47 47 47-47"/>
      <path d="M0-68h15" stroke="#f16d46" stroke-width="7"/>
    </g>
    <circle r="9" fill="#203844"/>
  </g>

  <!-- Bicycle -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M240 365 310 262 388 365 240 365 M310 262H508L388 365 M508 262 568 365"
          fill="none" stroke="#203844" stroke-width="13"/>
    <path d="M240 365 310 262 388 365 240 365 M310 262H508L388 365 M508 262 568 365"
          fill="none" stroke="#ec674b" stroke-width="7"/>
    <path d="M310 262 300 240 M508 262 494 218 523 202" fill="none" stroke="#203844" stroke-width="9"/>
    <path d="M275 239h53" stroke="#203844" stroke-width="13"/>
    <path d="M519 202h20" stroke="#203844" stroke-width="12"/>
    <path d="M252 365H388" stroke="#203844" stroke-width="4"/>
    <circle cx="388" cy="365" r="22" fill="#e6ad48" stroke="#203844" stroke-width="5"/>
    <g transform="translate(388 365)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-29 0H29" stroke="#203844" stroke-width="6"/>
        <path d="M-36-5v10 M36-5v10" stroke="#203844" stroke-width="10"/>
      </g>
    </g>
  </g>

  <!-- Pelican passenger and pilot -->
  <g stroke="#203844" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <!-- Distant leg -->
    <path d="M329 245 353 300 369 347" fill="none" stroke="#d98c32" stroke-width="11">
      <animate attributeName="d" values="M329 245 353 300 369 347;M329 245 344 309 407 376;M329 245 353 300 369 347" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M285 206 242 194 264 233" fill="#e1e9df"/>
    <path d="M276 191 Q266 231 300 247 Q344 268 381 236 Q413 209 414 167
             L414 151 Q418 127 447 133 Q466 140 464 158
             Q464 183 446 205 Q432 243 397 264
             Q320 287 281 245 Q260 223 276 191Z"
          fill="#fffdf1"/>
    <path d="M289 211 Q329 187 370 215 Q345 251 301 238Z" fill="#c7d6d3"/>
    <path d="M302 218q29-8 47 0 M310 229q17-4 28-1" fill="none" stroke="#829c9e" stroke-width="3"/>
    <!-- Wing reaching handlebars -->
    <path d="M361 205Q411 219 440 216L492 202Q503 200 507 207
             Q506 216 492 218L438 234Q395 238 365 224"
          fill="#fffdf1"/>
    <!-- Enormous bill pouch -->
    <path d="M453 159 650 182 Q625 250 559 245 Q492 235 453 174Z" fill="#f0b34b"/>
    <path d="M476 179Q548 233 624 190" fill="none" stroke="#d88a35" stroke-width="3"/>
    <!-- Fish looking out -->
    <path d="M552 187 536 172 537 199Z" fill="#60b7b7"/>
    <path d="M541 185Q567 162 589 185Q565 207 541 185Z" fill="#70c9c3"/>
    <circle cx="576" cy="181" r="3" fill="#203844" stroke="none"/>
    <path d="M587 189l8 2" fill="none"/>
    <path d="M451 156Q539 155 660 180L649 187 452 174Z" fill="#f6ce66"/>
    <!-- Face -->
    <circle cx="444" cy="147" r="5" fill="#203844" stroke="none"/>
    <path d="M433 135l17-3" fill="none"/>
    <!-- Helmet -->
    <path d="M410 139Q405 109 437 109Q465 109 473 134Z" fill="#ec674b"/>
    <path d="M433 112l-3 20 M448 113l4 19" fill="none" stroke="#fff6df" stroke-width="5"/>
    <path d="M414 138q0 28 23 28" fill="none" stroke-width="3"/>
    <!-- Near leg and webbed foot -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 334 253;7 334 253;-5 334 253" dur="1.8s" repeatCount="indefinite"/>
      <path d="M334 253 375 294 407 365" fill="none" stroke="#e6a139" stroke-width="12"/>
      <path d="M403 356 435 373 418 375 408 385 396 370Z" fill="#f0b34b"/>
    </g>
  </g>

  <!-- Fish's dry commentary -->
  <path d="M591 121Q591 109 605 109H740Q754 109 754 123V150Q754 164 740 164H610L592 176 598 160Q591 157 591 147Z"
        fill="#fffdf1" stroke="#203844" stroke-width="3"/>
  <text x="672" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#203844">
    <tspan x="672">“I ordered</tspan>
    <tspan x="672" dy="21">a SEA taxi.”</tspan>
  </text>

  <rect x="0" y="483" width="800" height="117" fill="#203844"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="519" fill="#fff6df" font-size="23" font-weight="bold">His commute is carbon neutral. His lunch is terrified.</text>
    <path d="M118 539H682" stroke="#718c92" stroke-width="1"/>
    <text x="400" y="570" fill="#fff6df" font-size="19">2026-11-05 08:01:04 SGT (UTC+08:00)</text>
  </g>
</svg>