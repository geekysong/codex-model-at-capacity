  <text x="171" y="199" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#263c40">“It’s all carry-on.”</text>
  <text x="171" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#59706c">— the pelican</text>
