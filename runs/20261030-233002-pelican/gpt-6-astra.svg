    <path d="M624 157q-5-19 17-23 13-22 31-6 30-5 32 25Z"/>
  </g>
  <ellipse cx="398" cy="467" rx="254" ry="13" fill="#b8c3a6"/>
  <path d="M52 479H747" class="thin" fill="none"/>

  <g transform="translate(234 389)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(564 389)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

