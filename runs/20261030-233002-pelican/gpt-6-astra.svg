    <rect x="112" y="248" width="132" height="64" rx="7" fill="#80b6ad" class="ink"/>
    <text x="178" y="273" text-anchor="middle" font-size="15" font-weight="bold">FISH DASH</text>
    <text x="178" y="296" text-anchor="middle" font-size="13">paid in exposure</text>
  </g>

  <path d="M626 293 602 249" class="thin" fill="none"/>
