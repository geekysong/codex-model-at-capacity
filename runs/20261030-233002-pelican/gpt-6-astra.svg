  <path d="M82 363h51M98 379h34M665 420h42M676 436h50" stroke="#718b8b" stroke-width="4" stroke-linecap="round"/>

  <rect x="39" y="491" width="722" height="69" rx="12" fill="#fff4d9"/>
  <text x="400" y="515" text-anchor="middle" font-size="20" font-weight="bold">His beak holds more than his benefits package.</text>
  <text x="400" y="546" text-anchor="middle" font-size="16">2026-10-30 23:30:02 SGT (UTC+08:00)</text>
