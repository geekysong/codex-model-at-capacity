<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A determined pelican pedals a bicycle with a huge beak full of fish. Its wheels spin and its body bobs as a tiny fish holds a five-star rating sign.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#fff4d9"/>
      <circle cx="3" cy="5" r=".7" fill="#e8dbbb"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #23333b; }
      .ink { stroke: #23333b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #23333b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="wheel">
      <circle r="76" fill="#fff9e9" stroke="#23333b" stroke-width="12"/>
      <circle r="65" fill="none" stroke="#80b6ad" stroke-width="3"/>
      <g stroke="#718b8b" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46 46 46M-46 46 46-46"/>
      </g>
      <path d="M38-54 A66 66 0 0 1 57-32" fill="none" stroke="#ef7753" stroke-width="7"/>
      <circle r="10" fill="#e9bc58" stroke="#23333b" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#paper)"/>
  <rect x="22" y="20" width="756" height="558" rx="22" fill="none" stroke="#23333b" stroke-width="3"/>
  <text x="400" y="64" text-anchor="middle" font-size="34" font-weight="900" letter-spacing="1">THE GIG ECONOMY HAS WINGS.</text>
  <text x="400" y="94" text-anchor="middle" font-size="18">Unfortunately, the company only supplied a bicycle.</text>

  <path d="M56 362Q151 327 236 355T408 353T610 347T749 359V475H56Z" fill="#dce6c7"/>
