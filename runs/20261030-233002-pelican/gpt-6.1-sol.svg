<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title description">
  <title id="title">Pedal to the Pelican</title>
  <desc id="description">A smug pelican with an enormous fish-filled bill rides a bicycle past a fuel price sign. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M2 3h1M8 9h1" stroke="#ded8c6" stroke-width="1" opacity=".35"/>
    </pattern>
    <g id="wheel">
      <circle r="73" fill="#fffaf0" stroke="#243746" stroke-width="10"/>
      <circle r="62" fill="none" stroke="#92a4a8" stroke-width="2"/>
      <g stroke="#92a4a8" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <circle r="9" fill="#e9b955" stroke="#243746" stroke-width="3"/>
      <path d="M-13-63l12-2" stroke="#f26c4f" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#f6efd9"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M28 86H772" stroke="#243746" stroke-width="3"/>
  <text x="400" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="39" fill="#243746">PEDAL TO THE PELICAN</text>
  <text x="400" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="3" fill="#52656b">BIG BILL. ZERO FUEL BILL.</text>

  <!-- A single seaside commuting scene. -->
  <path d="M32 369Q170 349 300 370T770 362V455H32Z" fill="#c8ded7"/>
  <path d="M32 384Q180 367 340 386T770 378" fill="none" stroke="#9dbfb8" stroke-width="3"/>
  <g fill="none" stroke="#91aaa7" stroke-width="3" stroke-linecap="round">
    <path d="M62 181q12-13 24 0q12-13 24 0M664 145q10-11 20 0q10-11 20 0"/>
  </g>
  <circle cx="701" cy="215" r="39" fill="#efcc72" opacity=".7"/>

  <g transform="translate(53 234)">
    <path d="M49 87V208" stroke="#596970" stroke-width="9"/>
    <rect width="102" height="96" rx="6" fill="#fffaf0" stroke="#243746" stroke-width="4"/>
    <text x="51" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243746">FUEL</text>
    <text x="51" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#d45e46">$9.99</text>
    <text x="51" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#52656b">PER GULP</text>
  </g>

  <ellipse cx="394" cy="471" rx="240" ry="13" fill="#243746" opacity=".12"/>
  <path d="M29 480H771" stroke="#243746" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#52656b" stroke-width="3" stroke-linecap="round">
    <path d="M164 353H208M154 370H192M175 386H203">
      <animate attributeName="opacity" values=".3;1;.3" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Wheels rotate around fixed axle locations. -->
  <g transform="translate(260 402)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(520 402)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke="#243746" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 402L321 307L377 402ZM321 307H474L377 402M474 307L520 402" stroke-width="12"/>
    <path d="M260 402L321 307L377 402ZM321 307H474L377 402M474 307L520 402" stroke="#e8694d" stroke-width="7"/>
    <path d="M321 307L309 281M474 307L464 272L495 259Q517 252 520 269" stroke-width="9"/>
    <path d="M286 279H333" stroke-width="13"/>
    <path d="M235 316H286M246 316V330M278 316V330" stroke-width="5"/>
  </g>
  <circle cx="377" cy="402" r="19" fill="#e9b955" stroke="#243746" stroke-width="4"/>
  <path d="M260 402L377 386Q394 402 377 418L260 410Z" fill="none" stroke="#52656b" stroke-width="3"/>

  <!-- The rider has a light, continuous saddle bounce. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M315 268Q282 253 267 225L311 235" fill="#fffaf0" stroke="#243746" stroke-width="4" stroke-linejoin="round"/>
    <path d="M322 240Q300 267 332 292L366 309L395 374" fill="none" stroke="#bd793b" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M322 240Q300 267 332 292L366 309L395 374;M322 240Q300 267 332 292L352 327L359 415;M322 240Q300 267 332 292L366 309L395 374" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M302 249Q292 208 334 194Q366 179 392 204Q420 226 399 264Q373 294 328 279Z" fill="#fffaf0" stroke="#243746" stroke-width="4"/>
    <path d="M327 217Q350 204 379 224Q377 252 340 258Q356 243 349 232" fill="#dce5df" stroke="#243746" stroke-width="3" stroke-linejoin="round"/>
    <path d="M372 207Q383 184 381 157Q379 131 402 125Q430 122 438 148L439 187Q429 211 403 236" fill="#fffaf0" stroke="#243746" stroke-width="4"/>
    <path d="M429 169L594 195Q571 244 472 231Q448 226 434 204Z" fill="#edb85d" stroke="#243746" stroke-width="4" stroke-linejoin="round"/>
    <path d="M435 172L600 191L436 194Z" fill="#ed8252" stroke="#243746" stroke-width="4" stroke-linejoin="round"/>
    <path d="M448 202Q493 232 561 208" fill="none" stroke="#c3823e" stroke-width="3"/>
    <path d="M486 213q16-18 35-1l13-9v21l-13-8q-20 13-35-3Z" fill="#6da9af" stroke="#243746" stroke-width="2"/>
    <circle cx="496" cy="211" r="2" fill="#243746"/>
    <circle cx="420" cy="154" r="8" fill="#fff" stroke="#243746" stroke-width="3"/>
    <circle cx="423" cy="154" r="3.5" fill="#243746"/>
    <path d="M409 139l18-5" stroke="#243746" stroke-width="4" stroke-linecap="round"/>
    <path d="M383 137Q389 104 421 109Q441 113 446 136Z" fill="#e8694d" stroke="#243746" stroke-width="4"/>
    <path d="M409 111L412 133M393 117L393 132M427 116L431 134" fill="none" stroke="#9e4035" stroke-width="3"/>
    <path d="M384 187l26 9-21 15-16-8Z" fill="#527f93" stroke="#243746" stroke-width="3"/>
    <path d="M386 198Q354 174 324 184L344 202L316 209Q355 220 386 207" fill="#527f93" stroke="#243746" stroke-width="3"/>
    <path d="M378 238Q419 254 460 268" fill="none" stroke="#243746" stroke-width="10" stroke-linecap="round"/>
    <path d="M378 238Q419 254 460 268" fill="none" stroke="#fffaf0" stroke-width="6" stroke-linecap="round"/>
    <path d="M459 268l13-5M460 268l12 5" stroke="#bd793b" stroke-width="5" stroke-linecap="round"/>
    <path d="M349 275L390 306L376 385" fill="none" stroke="#e3a44f" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M349 275L390 306L376 385;M349 275L405 325L393 414;M349 275L390 306L376 385" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(377 402)">
    <g stroke="#243746" stroke-width="5" stroke-linecap="round">
      <path d="M-24 0H24"/>
      <path d="M-32 0h16M16 0h16" stroke-width="8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="5" fill="#fffaf0" stroke="#243746" stroke-width="2"/>
  </g>

  <!-- Text stays stationary and has a separate footer. -->
  <text x="400" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#243746">He traded his gas bill for a bill full of fish.</text>
  <path d="M32 540H768" stroke="#b7ad94" stroke-width="1.5"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#43555d">2026-10-30 23:31:47 SGT (UTC+08:00)</text>
</svg>