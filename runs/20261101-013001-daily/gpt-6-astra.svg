<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Visit every cell exactly once — 24 moves</title>
  <desc id="desc">A continuous serpentine path visits all 25 cells of a five-by-five grid, starting at the top-left green circle and ending at the bottom-right red circle. Cells are numbered in visit order.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">25 cells · 24 moves</text>

  <rect x="175" y="55" width="250" height="250" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <path d="M225 55V305 M275 55V305 M325 55V305 M375 55V305
           M175 105H425 M175 155H425 M175 205H425 M175 255H425"
        fill="none" stroke="#94a3b8" stroke-width="1"/>

  <polyline points="200,80 250,80 300,80 350,80 400,80
                    400,130 350,130 300,130 250,130 200,130
                    200,180 250,180 300,180 350,180 400,180
                    400,230 350,230 300,230 250,230 200,230
                    200,280 250,280 300,280 350,280 400,280"
            fill="none" stroke="#2563eb" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#172033">
    <text x="181" y="70">1</text>
    <text x="231" y="70">2</text>
    <text x="281" y="70">3</text>
    <text x="331" y="70">4</text>
    <text x="381" y="70">5</text>

    <text x="181" y="120">10</text>
    <text x="231" y="120">9</text>
    <text x="281" y="120">8</text>
    <text x="331" y="120">7</text>
    <text x="381" y="120">6</text>

    <text x="181" y="170">11</text>
    <text x="231" y="170">12</text>
    <text x="281" y="170">13</text>
    <text x="331" y="170">14</text>
    <text x="381" y="170">15</text>

    <text x="181" y="220">20</text>
    <text x="231" y="220">19</text>
    <text x="281" y="220">18</text>
    <text x="331" y="220">17</text>
    <text x="381" y="220">16</text>

    <text x="181" y="270">21</text>
    <text x="231" y="270">22</text>
    <text x="281" y="270">23</text>
    <text x="331" y="270">24</text>
    <text x="381" y="270">25</text>
  </g>

  <circle cx="200" cy="80" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="400" cy="280" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="160" y="85" text-anchor="end" fill="#15803d">START</text>
    <text x="440" y="285" fill="#b91c1c">END</text>
  </g>

  <text x="300" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Each cell visited once • Orthogonal moves only</text>

  <path d="M30 351H570" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-11-01 01:32:44 SGT (UTC+08:00)</text>
</svg>