<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Panic</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly carrying an enormous fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e7f7d4"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#24313a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#24313a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#24313a}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="52" fill="#ffe082" opacity=".9"/>
  <path d="M0 425 Q110 390 220 425 T440 425 T660 425 T880 425 V520 H0Z" fill="#9acb79"/>
  <path d="M0 480 Q160 450 320 480 T640 480 T960 480" fill="none" stroke="#6da85c" stroke-width="8"/>
  <path d="M0 530 H800" stroke="#435c46" stroke-width="10"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900">THE PELICAN PEDAL PANIC</text>
  <text x="400" y="92" text-anchor="middle" class="label" font-size="20" font-weight="700">“Local bird insists this counts as sustainable transport.”</text>

  <g filter="url(#shadow)">
    <g id="bike">
      <g>
        <circle cx="245" cy="420" r="82" fill="#dff4ff" stroke="#24313a" stroke-width="8"/>
        <circle cx="555" cy="420" r="82" fill="#dff4ff" stroke="#24313a" stroke-width="8"/>
        <g class="wheel-spin">
          <path d="M245 338V502 M163 420H327 M187 362L303 478 M303 362L187 478" class="thin" opacity=".7"/>
          <path d="M555 338V502 M473 420H637 M497 362L613 478 M613 362L497 478" class="thin" opacity=".7"/>
        </g>
      </g>
      <path d="M245 420 L350 300 L555 420 L430 420 Z" fill="none" class="ink"/>
      <path d="M350 300 L430 420 M350 300 L325 267" fill="none" class="ink"/>
      <path d="M325 267 Q350 250 375 267" fill="none" class="ink"/>
      <path d="M430 420 L462 334" fill="none" class="ink"/>
      <circle cx="430" cy="420" r="18" fill="#ffcc4d" class="ink"/>
      <path d="M430 420 L391 393 M430 420 L469 447" fill="none" class="thin"/>
      <ellipse cx="390" cy="392" rx="15" ry="8" fill="#ffcc4d" class="ink"/>
      <ellipse cx="470" cy="448" rx="15" ry="8" fill="#ffcc4d" class="ink"/>
    </g>

    <g class="pelican-bob">
      <ellipse cx="379" cy="255" rx="83" ry="100" fill="#fffaf0" class="ink"/>
      <path d="M325 220 Q293 170 330 132 Q375 98 421 132 Q458 168 437 222" fill="#fffaf0" class="ink"/>
      <circle cx="382" cy="157" r="13" fill="#24313a"/>
      <circle cx="386" cy="153" r="4" fill="#fff"/>
      <path d="M421 174 Q510 142 594 187 Q520 219 424 207 Z" fill="#f3a33b" class="ink"/>
      <path d="M424 207 Q515 212 594 187 Q532 269 430 239 Z" fill="#f6b84b" class="ink"/>
      <path d="M472 191 Q515 179 558 191" fill="none" class="thin" opacity=".7"/>
      <path d="M347 316 Q333 350 347 386" fill="none" class="ink"/>
      <path d="M414 318 Q430 352 418 388" fill="none" class="ink"/>
      <path d="M347 382 L325 404 M418 384 L442 405" fill="none" class="ink"/>
      <path d="M342 238 Q305 267 320 300" fill="none" class="ink"/>
      <path d="M420 240 Q456 264 446 299" fill="none" class="ink"/>
      <path d="M328 274 Q356 291 385 278" fill="none" class="thin"/>
      <path d="M346 196 Q326 180 315 194" fill="none" class="thin"/>
      <path d="M413 195 Q430 181 442 195" fill="none" class="thin"/>
      <path d="M355 119 Q378 93 406 114" fill="none" class="ink"/>
      <path d="M366 110 Q352 90 369 78 M382 106 Q379 83 397 72 M396 108 Q407 87 423 87" fill="none" class="thin"/>
      <text x="365" y="285" class="label" font-size="17" font-weight="900">HOOONK!</text>
    </g>

    <g class="fish-wiggle">
      <path d="M515 172 Q570 132 636 167 Q610 191 567 191 Q542 191 515 172Z" fill="#c5e8ee" class="ink"/>
      <path d="M636 167 L674 144 L665 177 L674 206 L636 191" fill="#c5e8ee" class="ink"/>
      <circle cx="594" cy="165" r="5" fill="#24313a"/>
      <path d="M548 178 Q573 187 595 178" fill="none" class="thin"/>
    </g>
  </g>

  <path d="M118 335 q25-24 50 0 q25-24 50 0" fill="none" class="thin" opacity=".7"/>
  <path d="M640 285 q25-24 50 0 q25-24 50 0" fill="none" class="thin" opacity=".7"/>
  <text x="400" y="555" text-anchor="middle" class="label" font-size="17" font-weight="700">2026-10-28 13:00:01 SGT (UTC+08:00)</text>

  <style>
    .wheel-spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
    .pelican-bob{transform-box:fill-box;transform-origin:center bottom;animation:bob .8s ease-in-out infinite alternate}
    .fish-wiggle{transform-box:fill-box;transform-origin:center;animation:wiggle .8s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-8px) rotate(-2deg)}}
    @keyframes wiggle{to{transform:rotate(3deg) translateY(-3px)}}
  </style>
</svg>