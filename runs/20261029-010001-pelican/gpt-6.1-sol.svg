<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ee7ff"/>
      <stop offset="100%" stop-color="#f8fdff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555b66"/>
      <stop offset="100%" stop-color="#252a33"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd76b" opacity=".9"/>
  <path d="M0 370 Q120 300 240 365 T480 350 T800 340 V520 H0Z" fill="#8bcf82"/>
  <path d="M0 425 Q180 385 360 430 T800 415 V520 H0Z" fill="#5fa96a"/>
  <rect y="470" width="800" height="50" fill="url(#road)"/>
  <path d="M0 495 H800" stroke="#f7d36b" stroke-width="6" stroke-dasharray="42 28"/>

  <text x="400" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#17324d">
    THE GREAT PELICAN GETAWAY
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-style="italic" fill="#244e68">
    “Why walk when you can wobble with style?”
  </text>

  <g id="bike" filter="url(#shadow)">
    <g fill="none" stroke="#d63f38" stroke-width="7">
      <circle cx="275" cy="452" r="67"/>
      <circle cx="555" cy="452" r="67"/>
    </g>
    <g fill="none" stroke="#e9f2f5" stroke-width="2" opacity=".9">
      <circle cx="275" cy="452" r="58"/>
      <circle cx="555" cy="452" r="58"/>
    </g>
    <g fill="none" stroke="#d63f38" stroke-width="6" stroke-linecap="round">
      <path d="M275 452 L365 365 L445 452 L275 452"/>
      <path d="M365 365 L405 452"/>
      <path d="M445 452 L555 452"/>
      <path d="M445 452 L470 342"/>
      <path d="M470 342 L510 342"/>
      <path d="M365 365 L345 335"/>
      <path d="M332 335 H360"/>
    </g>
    <circle cx="405" cy="452" r="14" fill="#f7c845" stroke="#7e2f2b" stroke-width="5"/>
    <g stroke="#f7c845" stroke-width="5" stroke-linecap="round">
      <path d="M405 452 L435 470"/>
      <path d="M405 452 L375 434"/>
    </g>
    <circle cx="275" cy="452" r="8" fill="#f7c845"/>
    <circle cx="555" cy="452" r="8" fill="#f7c845"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.1s" repeatCount="indefinite"/>
  </g>

  <g id="wheelSpin" fill="none" stroke="#ffffff" stroke-width="2" opacity=".8">
    <g transform="translate(275 452)">
      <path d="M0 -58V58 M-58 0H58 M-41 -41L41 41 M-41 41L41 -41">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(555 452)">
      <path d="M0 -58V58 M-58 0H58 M-41 -41L41 41 M-41 41L41 -41">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="404" cy="285" rx="72" ry="92" fill="#f4f1e7" stroke="#263746" stroke-width="6"/>
    <path d="M365 250 Q335 220 347 178 Q360 135 407 145 Q444 153 451 192 Q455 235 425 258Z" fill="#f4f1e7" stroke="#263746" stroke-width="6"/>
    <path d="M406 183 Q485 168 540 204 Q493 235 414 220Z" fill="#f2a83b" stroke="#263746" stroke-width="6"/>
    <path d="M414 220 Q478 220 532 205" fill="none" stroke="#9b5426" stroke-width="5"/>
    <circle cx="410" cy="178" r="9" fill="#263746"/>
    <circle cx="413" cy="175" r="3" fill="#fff"/>
    <path d="M370 292 Q330 300 313 335 Q349 350 386 324" fill="#d8d4c6" stroke="#263746" stroke-width="5"/>
    <path d="M434 292 Q474 300 491 335 Q455 350 418 324" fill="#d8d4c6" stroke="#263746" stroke-width="5"/>
    <path d="M392 362 L382 410 M427 362 L438 410" stroke="#e38e2f" stroke-width="8" stroke-linecap="round"/>
    <path d="M370 410 H398 M423 410 H451" stroke="#e38e2f" stroke-width="8" stroke-linecap="round"/>
    <path d="M371 274 Q400 290 432 274" fill="none" stroke="#263746" stroke-width="5"/>
    <path d="M378 275 Q401 257 425 275" fill="#f4f1e7" stroke="#263746" stroke-width="5"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#17324d">
    <text x="80" y="175" font-size="21" font-weight="700">BREAKING NEWS!</text>
    <text x="80" y="202" font-size="17">Bird insists this is</text>
    <text x="80" y="225" font-size="17">“peak transportation.”</text>
    <path d="M220 230 Q285 245 340 285" fill="none" stroke="#17324d" stroke-width="3" stroke-dasharray="7 7"/>
    <path d="M338 284 l-13 -2 l8 11Z" fill="#17324d"/>
  </g>

  <rect x="40" y="530" width="720" height="48" rx="12" fill="#ffffff" opacity=".9" stroke="#244e68" stroke-width="2"/>
  <text x="400" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#17324d">
    A satirical ride: one pelican, two wheels, absolutely no license.
  </text>
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#244e68">
    2026-10-29 01:00:24 SGT (UTC+08:00)
  </text>
