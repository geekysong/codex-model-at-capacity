    <path d="M360 285 Q356 195 422 168 Q492 140 518 213 Q534 257 494 303" fill="#f4f0d5" class="ink"/>
    <path d="M420 176 Q468 140 503 179 L530 216 Q537 236 516 247 L458 230Z" fill="#f4f0d5" class="ink"/>
