      <circle cx="260" cy="458" r="57" fill="#b8d6df" class="ink"/>
      <circle cx="260" cy="458" r="8" fill="#f5c84c" class="ink"/>
      <path d="M260 401V515 M203 458H317 M220 418L300 498 M300 418L220 498" stroke="#45616c" stroke-width="3"/>
    </g>
    <g class="wheel">
