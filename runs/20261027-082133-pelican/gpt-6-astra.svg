<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly causing a traffic jam.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59616b"/>
      <stop offset="1" stop-color="#303740"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#13202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#18242b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#18242b}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.7s linear infinite}
      .ride{animation:bob .85s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="694" cy="94" r="46" fill="#fff4a8" opacity=".9"/>
  <path d="M0 220 Q110 175 220 220 T440 220 T660 220 T900 220 V340 H0Z" fill="#8fd09b"/>
  <path d="M0 285 Q160 245 320 285 T640 285 T960 285 V375 H0Z" fill="#69b77c"/>
  <rect y="350" width="800" height="250" fill="url(#road)"/>
  <path d="M0 468 H800" stroke="#f8d968" stroke-width="9" stroke-dasharray="42 30"/>
  <path d="M0 565 H800" stroke="#202831" stroke-width="8"/>

  <text x="40" y="68" class="label" font-size="42" font-weight="900" fill="#0d566b">PELICAN PEDAL PANIC!</text>
  <text x="43" y="103" class="label" font-size="19" font-weight="700">“Why use a beak when you can use a bell?”</text>

