<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest city street route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172033">Shortest route: A1 to E5</text>

  <!-- City blocks and streets -->
  <rect x="90" y="60" width="420" height="240" fill="#e2e8dd"/>
  <g stroke="#ffffff" stroke-width="16">
    <path d="M90 60H510 M90 120H510 M90 180H510 M90 240H510 M90 300H510"/>
    <path d="M90 60V300 M195 60V300 M300 60V300 M405 60V300 M510 60V300"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M90 60H510 M90 120H510 M90 180H510 M90 240H510 M90 300H510"/>
    <path d="M90 60V300 M195 60V300 M300 60V300 M405 60V300 M510 60V300"/>
  </g>

  <!-- Eight-segment shortest route -->
  <path d="M90 60H510V300" fill="none" stroke="#1671e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#475569">
    <circle cx="195" cy="60" r="4"/><circle cx="300" cy="60" r="4"/><circle cx="405" cy="60" r="4"/><circle cx="510" cy="60" r="4"/>
    <circle cx="90" cy="120" r="4"/><circle cx="300" cy="120" r="4"/><circle cx="405" cy="120" r="4"/><circle cx="510" cy="120" r="4"/>
    <circle cx="90" cy="180" r="4"/><circle cx="195" cy="180" r="4"/><circle cx="405" cy="180" r="4"/><circle cx="510" cy="180" r="4"/>
    <circle cx="90" cy="240" r="4"/><circle cx="195" cy="240" r="4"/><circle cx="300" cy="240" r="4"/><circle cx="510" cy="240" r="4"/>
    <circle cx="90" cy="300" r="4"/><circle cx="195" cy="300" r="4"/><circle cx="300" cy="300" r="4"/><circle cx="405" cy="300" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M188 113L202 127 M202 113L188 127"/>
    <path d="M293 173L307 187 M307 173L293 187"/>
    <path d="M398 233L412 247 M412 233L398 247"/>
  </g>

  <circle cx="90" cy="60" r="8" fill="#15803d" stroke="white" stroke-width="2"/>
  <circle cx="510" cy="300" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172033">
    <text x="101" y="49">A1</text><text x="206" y="49">B1</text><text x="311" y="49">C1</text><text x="416" y="49">D1</text><text x="521" y="49">E1</text>
    <text x="101" y="109">A2</text><text x="206" y="109">B2</text><text x="311" y="109">C2</text><text x="416" y="109">D2</text><text x="521" y="109">E2</text>
    <text x="101" y="169">A3</text><text x="206" y="169">B3</text><text x="311" y="169">C3</text><text x="416" y="169">D3</text><text x="521" y="169">E3</text>
    <text x="101" y="229">A4</text><text x="206" y="229">B4</text><text x="311" y="229">C4</text><text x="416" y="229">D4</text><text x="521" y="229">E4</text>
    <text x="101" y="289">A5</text><text x="206" y="289">B5</text><text x="311" y="289">C5</text><text x="416" y="289">D5</text><text x="521" y="289">E5</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <text x="69" y="65" text-anchor="end" fill="#15803d">START</text>
    <text x="510" y="327" text-anchor="middle" fill="#7c3aed">END</text>
    <text x="300" y="350" text-anchor="middle" fill="#165bb5">Total street segments: 8</text>
  </g>

  <path d="M24 363H576" stroke="#cbd5e1"/>
  <text x="300" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-10-30 12:04:18 SGT (UTC+08:00)</text>
</svg>