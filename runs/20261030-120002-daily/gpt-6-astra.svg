<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street grid with shortest route from A1 to E5</title>
  <desc id="desc">Five columns and five rows of intersections. Blue route: A1, B1, C1, D1, E1, E2, E3, E4, E5. It uses 8 street segments and avoids blocked intersections B2, C3, and D4.</desc>
  <defs>
    <pattern id="blocks" x="80" y="60" width="110" height="65" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="90" height="45" rx="5" fill="#dce7dd"/>
      <rect x="20" y="18" width="27" height="28" rx="2" fill="#c2d2c6"/>
      <rect x="55" y="18" width="34" height="28" rx="2" fill="#c2d2c6"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#f8fafc"/>
  <rect x="80" y="60" width="440" height="260" fill="url(#blocks)"/>

  <g fill="none" stroke="#a0aab7" stroke-width="7" stroke-linecap="round">
    <path d="M80 60H520 M80 125H520 M80 190H520 M80 255H520 M80 320H520"/>
    <path d="M80 60V320 M190 60V320 M300 60V320 M410 60V320 M520 60V320"/>
  </g>

  <path d="M80 60H520V320" fill="none" stroke="#1565d8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#fff" stroke="#667085" stroke-width="2">
    <circle cx="190" cy="60" r="5"/><circle cx="300" cy="60" r="5"/><circle cx="410" cy="60" r="5"/><circle cx="520" cy="60" r="5"/>
    <circle cx="80" cy="125" r="5"/><circle cx="300" cy="125" r="5"/><circle cx="410" cy="125" r="5"/><circle cx="520" cy="125" r="5"/>
    <circle cx="80" cy="190" r="5"/><circle cx="190" cy="190" r="5"/><circle cx="410" cy="190" r="5"/><circle cx="520" cy="190" r="5"/>
    <circle cx="80" cy="255" r="5"/><circle cx="190" cy="255" r="5"/><circle cx="300" cy="255" r="5"/><circle cx="520" cy="255" r="5"/>
    <circle cx="80" cy="320" r="5"/><circle cx="190" cy="320" r="5"/><circle cx="300" cy="320" r="5"/><circle cx="410" cy="320" r="5"/>
  </g>

  <g stroke="#d92d20" stroke-width="4" stroke-linecap="round">
    <path d="M182 117L198 133 M198 117L182 133"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M402 247L418 263 M418 247L402 263"/>
  </g>

  <circle cx="80" cy="60" r="8" fill="#16803c" stroke="#fff" stroke-width="2"/>
  <circle cx="520" cy="320" r="8" fill="#7137b5" stroke="#fff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#182230" stroke="#f8fafc" stroke-width="4" paint-order="stroke">
    <text x="80" y="43">A1</text><text x="190" y="43">B1</text><text x="300" y="43">C1</text><text x="410" y="43">D1</text><text x="520" y="43">E1</text>
    <text x="80" y="108">A2</text><text x="190" y="108">B2</text><text x="300" y="108">C2</text><text x="410" y="108">D2</text><text x="520" y="108">E2</text>
    <text x="80" y="173">A3</text><text x="190" y="173">B3</text><text x="300" y="173">C3</text><text x="410" y="173">D3</text><text x="520" y="173">E3</text>
    <text x="80" y="238">A4</text><text x="190" y="238">B4</text><text x="300" y="238">C4</text><text x="410" y="238">D4</text><text x="520" y="238">E4</text>
    <text x="80" y="303">A5</text><text x="190" y="303">B5</text><text x="300" y="303">C5</text><text x="410" y="303">D5</text><text x="520" y="303">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <text x="80" y="83" fill="#166534">START</text>
    <text x="520" y="342" fill="#7137b5">END</text>
  </g>

  <path d="M24 350H576" stroke="#d0d5dd"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="369" font-size="15" font-weight="700" fill="#1565d8">Shortest route: 8 street segments</text>
    <text x="300" y="390" font-size="14" fill="#344054">2026-10-30 12:03:41 SGT (UTC+08:00)</text>
  </g>
</svg>