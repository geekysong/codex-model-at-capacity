<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical pelican pedals furiously while balancing on a bicycle.</desc>
  <style>
    .ink{stroke:#17324d;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
    .bob{animation:bob .8s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-7px)}}
  </style>

  <rect width="800" height="600" fill="#dff5ff"/>
  <circle cx="680" cy="105" r="52" fill="#ffe78a" stroke="#17324d" stroke-width="5"/>
  <path d="M0 455 Q120 420 240 455 T480 455 T800 445 V600 H0Z" fill="#8fd18b"/>
  <path d="M0 490 Q180 450 360 490 T800 480" fill="none" stroke="#4f9b63" stroke-width="7"/>

  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#17324d">THE GREAT PELICAN GETAWAY</text>
  <text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#d34a3a">“Why walk when you can wobble with style?”</text>

  <g id="bike">
    <g class="spin">
      <circle cx="245" cy="430" r="76" fill="none" class="ink"/>
      <circle cx="570" cy="430" r="76" fill="none" class="ink"/>
      <path d="M245 430 L330 305 L420 430 L245 430 M330 305 L570 430 M420 430 L500 300 L570 430 M500 300 L548 300" fill="none" class="ink"/>
      <circle cx="245" cy="430" r="12" fill="#f5b642" class="ink"/>
      <circle cx="570" cy="430" r="12" fill="#f5b642" class="ink"/>
      <path d="M330 305 L315 275 M300 275 H330 M500 300 L520 270 M505 270 H535" fill="none" class="ink"/>
    </g>
    <path d="M327 307 Q360 340 400 350" fill="none" stroke="#e04b3b" stroke-width="13"/>
  </g>

  <g class="bob">
    <ellipse cx="382" cy="245" rx="91" ry="112" fill="#f7f1df" class="ink"/>
    <path d="M322 184 Q298 123 337 95 Q388 58 430 101 Q454 126 438 183" fill="#f7f1df" class="ink"/>
    <path d="M345 116 Q390 86 425 122" fill="none" class="ink"/>
    <circle cx="399" cy="137" r="10" fill="#17324d"/>
    <path d="M418 154 Q494 142 544 170 Q502 206 421 190Z" fill="#f4a62a" class="ink"/>
    <path d="M455 174 Q495 194 523 182" fill="none" stroke="#d87919" stroke-width="5"/>
    <path d="M343 192 Q300 225 286 274" fill="none" class="ink"/>
    <path d="M286 274 Q270 299 244 292" fill="none" stroke="#f4a62a" stroke-width="14"/>
    <path d="M416 205 Q470 235 485 283" fill="none" class="ink"/>
    <path d="M485 283 Q513 298 530 280" fill="none" stroke="#f4a62a" stroke-width="14"/>
    <path d="M337 339 Q315 377 331 405" fill="none" class="ink"/>
    <path d="M426 341 Q450 378 432 406" fill="none" class="ink"/>
    <path d="M326 403 L352 403 M425 404 L451 404" fill="none" class="ink"/>
    <path d="M316 250 Q350 270 371 250" fill="none" stroke="#d34a3a" stroke-width="7"/>
    <text x="380" y="470" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#17324d">HONK IF YOU LOVE FISH!</text>
  </g>

  <path d="M90 360 Q125 330 160 360" fill="none" stroke="#17324d" stroke-width="6"/>
  <path d="M115 380 Q145 355 175 380" fill="none" stroke="#17324d" stroke-width="6"/>
  <text x="400" y="548" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17324d">2026-10-28 22:00:01 SGT (UTC+08:00)</text>
</svg>