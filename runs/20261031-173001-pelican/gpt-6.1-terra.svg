<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A smug pelican pedals a bicycle past a sign warning of rush hour. Its wheels turn and its body bobs.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#c9f3f5"/>
      <stop offset="1" stop-color="#f8edc9"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#e4b77b"/>
      <stop offset="1" stop-color="#c98b5c"/>
    </linearGradient>
    <g id="wheel">
