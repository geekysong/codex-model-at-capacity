    <path d="M420 270q47 9 81 29-30 20-74 9z" fill="#f0a43c" stroke="#173d48" stroke-width="4"/>
    <path d="M425 289q35 12 69 9-27 15-65 15" fill="#e68a32"/>
    <circle cx="403" cy="266" r="5" fill="#173d48"/>
    <path d="M360 250q26-28 58-10" fill="none" stroke="#e45e32" stroke-width="8" stroke-linecap="round"/>
    <path d="M375 244l5-18M395 239l2-18M415 243l8-15" stroke="#e45e32" stroke-width="6" stroke-linecap="round"/>
    <path d="M483 294l13-8 14 5-11 10z" fill="#e45e32" stroke="#173d48" stroke-width="2"/>
    <path d="M497 286l7-9 7 5-6 7" fill="#f4d886" stroke="#173d48" stroke-width="2"/>
    <path d="M488 297q11 4 20 0" stroke="#173d48" stroke-width="2" fill="none"/>
    <path d="M360 302l-15 11 14 8" fill="none" stroke="#173d48" stroke-width="4"/>
    <path d="M346 313l-8-4" stroke="#173d48" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="rotate(-6 467 239)">
    <path d="M450 241h124v54H450z" fill="#fff4ce" stroke="#173d48" stroke-width="3"/>
    <text x="512" y="263" text-anchor="middle" font-size="13" font-weight="900" fill="#173d48">WILL WORK</text>
    <text x="512" y="281" text-anchor="middle" font-size="13" font-weight="900" fill="#e45e32">FOR SARDINES</text>
  </g>
  <path d="M460 296l-19 31" stroke="#173d48" stroke-width="3"/>

  <path d="M247 343q-24-16-43-3M551 341q22-18 40-11" fill="none" stroke="#fff8dd" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="520" text-anchor="middle" font-size="16" font-weight="800" fill="#365d61">Two wheels. One very large bill. Zero emissions (except the honking).</text>
  <path d="M0 555H800" stroke="#527c72" stroke-width="2"/>
  <text x="400" y="580" text-anchor="middle" font-size="14" font-weight="700" fill="#143b49">2026-10-31 17:32:11 SGT (UTC+08:00)</text>
</svg>