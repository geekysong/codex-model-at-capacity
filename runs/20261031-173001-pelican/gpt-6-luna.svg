<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A sharply dressed pelican pedals a bicycle through town, carrying a tiny fish in its beak and a sign that reads “WILL WORK FOR SARDINES.”</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .6s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#b9e7f2"/>
  <rect y="382" width="800" height="218" fill="#f4d886"/>
  <path d="M0 382H800" stroke="#527c72" stroke-width="8"/>
  <path d="M0 430H800" stroke="#fff5d6" stroke-width="5" stroke-dasharray="28 24"/>

  <text id="title" x="400" y="57" text-anchor="middle" font-size="34" font-weight="900" fill="#143b49">THE PELICAN COMMUTE</text>
  <text x="400" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#365d61">He’s late for work. The fish is already on the clock.</text>

  <g fill="#fff8dd" stroke="#315967" stroke-width="3">
    <path d="M48 300h142v82H48z"/>
    <path d="M190 317h22v65h-22z"/>
  </g>
  <text x="119" y="332" text-anchor="middle" font-size="14" font-weight="900" fill="#315967">BIKE LANE</text>
  <text x="119" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#315967">unless you’re a fish</text>

  <g fill="#fff8dd" stroke="#315967" stroke-width="3">
    <path d="M623 304h128v78H623z"/>
    <path d="M610 328h13v54h-13z"/>
  </g>
  <text x="687" y="335" text-anchor="middle" font-size="14" font-weight="900" fill="#315967">TRAFFIC</text>
  <text x="687" y="357" text-anchor="middle" font-size="12" font-weight="700" fill="#315967">is for the birds</text>

  <g fill="none" stroke="#173d48" stroke-width="6">
    <circle class="wheel" cx="274" cy="423" r="61"/>
    <circle class="wheel" cx="529" cy="423" r="61"/>
  </g>
  <g fill="none" stroke="#4d7275" stroke-width="2">
    <g class="wheel" transform="translate(274 423)">
      <path d="M-56 0H56M0-56V56M-40-40L40 40M40-40L-40 40"/>
    </g>
    <g class="wheel" transform="translate(529 423)">
      <path d="M-56 0H56M0-56V56M-40-40L40 40M40-40L-40 40"/>
    </g>
  </g>

  <g fill="none" stroke="#e45e32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M274 423L348 337L407 423L274 423L325 423"/>
    <path d="M348 337L455 337L529 423L407 423"/>
    <path d="M455 337L473 319"/>
    <path d="M438 319h43"/>
    <path d="M325 423l-16 28M325 423l18 26"/>
    <path d="M313 451h26"/>
    <path d="M342 329h-34"/>
  </g>
  <circle cx="407" cy="423" r="10" fill="#173d48"/>
  <path d="M344 328h-30" stroke="#173d48" stroke-width="8" stroke-linecap="round"/>
  <path d="M458 337h24" stroke="#173d48" stroke-width="8" stroke-linecap="round"/>

  <g class="rider">
    <path d="M357 309q21-33 54-12l31 34-44 28-36-20z" fill="#247b85" stroke="#173d48" stroke-width="4"/>
    <path d="M386 334l-39 21-21-24" fill="none" stroke="#173d48" stroke-width="8" stroke-linecap="round"/>
    <path d="M420 342l34-14 18 12" fill="none" stroke="#173d48" stroke-width="8" stroke-linecap="round"/>
    <path d="M348 349l-20 72" stroke="#f6a33c" stroke-width="9" stroke-linecap="round"/>
    <path d="M328 421l-28 2" stroke="#173d48" stroke-width="7" stroke-linecap="round"/>
