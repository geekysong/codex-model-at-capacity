<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a huge pouch full of fish. The wheels spin, the pedals turn, and the pelican bobs. A roadside sign declares this a no-fly zone.</desc>
