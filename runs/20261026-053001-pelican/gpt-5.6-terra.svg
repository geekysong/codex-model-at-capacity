  <path d="M0 470 H800" stroke="#d9e7ec" stroke-width="8"/>

  <text x="400" y="62" text-anchor="middle" font-family="Impact, sans-serif" font-size="38" fill="#25313b" letter-spacing="2">THE PELICAN BIKE LANE</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#40545d">“ONE BEAK. ZERO PARKING FEES. MAXIMUM SUPERIORITY.”</text>

