<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past Traffic</title>
  <desc id="desc">A satirical cartoon of a proud pelican riding a bicycle while cars sit in traffic.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .bike-bob { animation: bob .55s ease-in-out infinite alternate; }
    .leg-a { transform-origin: 402px 393px; animation: pedalA 1.2s linear infinite; }
    .leg-b { transform-origin: 402px 393px; animation: pedalB 1.2s linear infinite; }
    .wing { transform-origin: 396px 259px; animation: flap .55s ease-in-out infinite alternate; }
    .hat { animation: hatbob .55s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-5px); } }
    @keyframes pedalA { 0%,100% { transform: rotate(25deg); } 50% { transform: rotate(-35deg); } }
    @keyframes pedalB { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(25deg); } }
    @keyframes flap { to { transform: rotate(-10deg); } }
    @keyframes hatbob { to { transform: translateY(-3px) rotate(-2deg); } }
  </style>

  <rect width="800" height="600" fill="#b9e8f6"/>
  <path d="M0 248 Q110 218 220 248 T440 245 T650 247 T800 225 V390 H0Z" fill="#8bd17a"/>
  <path d="M0 355 H800 V468 H0Z" fill="#4d535b"/>
