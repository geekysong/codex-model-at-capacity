<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Beak Express</title>
  <desc id="desc">A self-important pelican pedals a tiny bicycle while a fish rides in its enormous beak.</desc>
  <defs>
    <style>
      .ink{stroke:#20303a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .55s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#d9f4f2"/>
  <circle cx="680" cy="105" r="53" fill="#ffd66b"/>
  <path d="M0 395 Q170 350 325 390 T800 378 V520 H0Z" fill="#a8df9a"/>
  <path d="M0 462 Q190 442 365 466 T800 450" fill="none" stroke="#6dbb76" stroke-width="6"/>
  <text x="38" y="55" fill="#20303a" font-family="Verdana, sans-serif" font-size="30" font-weight="900">THE BEAK EXPRESS</text>
  <text x="40" y="84" fill="#3d5860" font-family="Verdana, sans-serif" font-size="15" font-weight="700">A bird of considerable cargo capacity.</text>

  <!-- Bicycle -->
  <g fill="none" class="ink">
    <g class="wheel">
      <circle cx="245" cy="405" r="68" fill="#f8ffff"/>
      <path d="M245 337V473M177 405H313M197 357L293 453M293 357L197 453" stroke="#6c8990" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="555" cy="405" r="68" fill="#f8ffff"/>
      <path d="M555 337V473M487 405H623M507 357L603 453M603 357L507 453" stroke="#6c8990" stroke-width="3"/>
    </g>
    <path d="M245 405L350 405L307 330L245 405M350 405L435 330L555 405M307 330L435 330"/>
    <circle cx="350" cy="405" r="13" fill="#f6a23c"/>
    <path d="M307 330L285 330M435 330L453 314M285 330L273 316"/>
    <path d="M350 405L382 431M350 405L322 430" stroke="#c05d48" stroke-width="7"/>
    <path d="M266 314H294M439 308L462 319" stroke="#20303a" stroke-width="8"/>
  </g>

  <!-- Pelican rider -->
  <g class="rider">
    <path d="M307 294 Q305 245 337 224 Q375 203 404 235 Q426 261 408 315 L381 341 L320 326Z" fill="#fffdf2" class="ink"/>
    <path d="M329 245 Q350 216 385 235 Q409 250 405 281 Q379 272 349 283Z" fill="#f3f1df" class="ink"/>
    <path d="M380 234 Q390 205 421 193 Q452 181 472 197 Q455 219 430 226 L407 251Z" fill="#fffdf2" class="ink"/>
    <circle cx="425" cy="204" r="5" fill="#20303a"/>
    <path d="M466 197 Q509 190 546 209 Q510 223 469 214Z" fill="#f39a38" class="ink"/>
    <path d="M470 214 Q512 218 543 209 Q529 244 491 244 Q475 238 470 214Z" fill="#ed7958" class="ink"/>
    <path d="M482 218 Q500 220 515 217" fill="none" stroke="#a64b43" stroke-width="3"/>
    <!-- fish cargo -->
    <path d="M515 204 Q529 191 545 204 Q529 216 515 204Z" fill="#69c8d2" stroke="#20303a" stroke-width="2"/>
    <path d="M517 204L507 197L507 211Z" fill="#f8c95b" stroke="#20303a" stroke-width="2"/>
    <circle cx="537" cy="202" r="1.8" fill="#20303a"/>
    <!-- wings and legs -->
    <path d="M328 267 Q348 248 373 261 Q354 285 331 292Z" fill="#e8e6d7" class="ink"/>
    <path d="M345 317L350 367M384 320L380 367" fill="none" class="ink"/>
    <path d="M350 367L340 385M380 367L389 385" fill="none" stroke="#f39a38" stroke-width="6"/>
    <path d="M334 386L352 386M382 386L399 386" fill="none" stroke="#20303a" stroke-width="5"/>
    <!-- jaunty cap -->
    <path d="M381 225 Q403 200 432 211 L440 221 Q412 214 390 235Z" fill="#e85f52" class="ink"/>
    <path d="M414 214L438 218" stroke="#20303a" stroke-width="4"/>
  </g>

  <!-- comic motion accents -->
  <path d="M160 294L184 286M153 312L178 309M600 286L624 279" fill="none" stroke="#f39a38" stroke-width="5" stroke-linecap="round"/>
  <path d="M586 174 Q604 153 619 174 Q635 194 650 171" fill="none" stroke="#3d5860" stroke-width="3"/>
  <text x="604" y="153" fill="#20303a" font-family="Verdana, sans-serif" font-size="13" font-weight="700">HONK!</text>

  <rect x="0" y="510" width="800" height="90" fill="#20303a"/>
  <text x="40" y="547" fill="#fff7dd" font-family="Verdana, sans-serif" font-size="19" font-weight="800">“I’m not carrying a fish. I’m transporting lunch.”</text>
  <text x="40" y="581" fill="#bfe8df" font-family="Verdana, sans-serif" font-size="15" font-weight="600">Pelican-powered transport: one beak, zero baskets.</text>
  <text x="760" y="581" text-anchor="end" fill="#fff7dd" font-family="Verdana, sans-serif" font-size="14" font-weight="700">2026-10-26 05:32:11 SGT (UTC+08:00)</text>
</svg>