<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, carrying fish in its enormous bill pouch. The wheels spin, its legs pedal, and its body bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r=".7" fill="#203b45" opacity=".06"/>
    </pattern>
    <style>
      .ink{stroke:#203b45;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .letter{font-family:Arial,Helvetica,sans-serif;fill:#203b45}
      .spoke{stroke:#64848a;stroke-width:3}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <text x="400" y="64" text-anchor="middle" class="letter" font-size="44" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="97" text-anchor="middle" class="letter" font-size="18">ONE BIRD. TWO WHEELS. ZERO SELF-AWARENESS.</text>

  <!-- One seaside cycling scene -->
  <path d="M0 349 Q150 326 290 351 T570 345 T800 351 V447 H0Z" fill="#b9e2da"/>
  <path d="M0 380 Q150 363 290 382 T570 376 T800 382" fill="none" stroke="#78bdb7" stroke-width="3"/>
  <circle cx="690" cy="163" r="35" fill="#ffd462"/>
  <path d="M63 174q15-14 30 0q15-14 30 0M603 233q11-11 22 0q11-11 22 0" fill="none" stroke="#64848a" stroke-width="3" stroke-linecap="round"/>

  <!-- Roadside satire -->
  <path d="M674 290V440" class="ink" fill="none"/>
  <rect x="610" y="263" width="128" height="70" rx="8" fill="#fffdf3" class="ink"/>
  <text x="674" y="291" text-anchor="middle" class="letter" font-size="17" font-weight="bold">BIKE LANE</text>
  <text x="674" y="316" text-anchor="middle" class="letter" font-size="14">NO FREE LUNCH</text>

  <path d="M0 448H800" stroke="#203b45" stroke-width="5"/>
  <path d="M29 472H130M637 472H768" stroke="#dfbc79" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="382" cy="451" rx="225" ry="13" fill="#203b45" opacity=".12"/>

  <!-- Wheels: the spoke groups visibly rotate -->
  <g>
    <circle cx="235" cy="383" r="65" fill="#fffdf3" class="ink"/>
    <circle cx="235" cy="383" r="55" fill="#d6eeea" stroke="#e6ad50" stroke-width="4"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0 235 383" to="360 235 383" dur="1.4s" repeatCount="indefinite"/>
      <path d="M235 328V438M180 383H290M196 344L274 422M196 422L274 344"/>
      <path d="M235 331L246 338" stroke="#ef7050" stroke-width="7"/>
    </g>
    <circle cx="535" cy="383" r="65" fill="#fffdf3" class="ink"/>
    <circle cx="535" cy="383" r="55" fill="#d6eeea" stroke="#e6ad50" stroke-width="4"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0 535 383" to="360 535 383" dur="1.4s" repeatCount="indefinite"/>
      <path d="M535 328V438M480 383H590M496 344L574 422M496 422L574 344"/>
      <path d="M535 331L546 338" stroke="#ef7050" stroke-width="7"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <path d="M235 383L304 292L362 383ZM304 292H478L362 383M478 292L535 383M478 292L467 259L494 245L512 249" fill="none" stroke="#203b45" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M235 383L304 292L362 383ZM304 292H478L362 383M478 292L535 383M478 292L467 259L494 245" fill="none" stroke="#ee6c4d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M304 292L298 270" class="ink" fill="none"/>
  <path d="M277 268H322" stroke="#203b45" stroke-width="12" stroke-linecap="round"/>
  <circle cx="362" cy="383" r="17" fill="#ffd462" class="ink"/>
  <circle cx="235" cy="383" r="7" fill="#203b45"/>
  <circle cx="535" cy="383" r="7" fill="#203b45"/>

  <!-- Far leg -->
  <path d="M326 263L335 315L342 381" fill="none" stroke="#c58c35" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" values="M326 263L335 315L342 381;M326 263L385 313L382 385;M326 263L335 315L342 381" dur=".7s" repeatCount="indefinite"/>
  </path>

  <!-- Pelican and its absurdly generous lunch pouch -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M269 248L234 230L253 264L234 272L277 281" fill="#fffdf3" class="ink"/>
    <path d="M270 239C268 211 305 192 344 213C377 228 383 259 357 275C328 291 278 280 270 239Z" fill="#fffdf3" class="ink"/>
    <path d="M292 233Q328 218 349 254Q317 266 292 233Z" fill="#dce7df" stroke="#203b45" stroke-width="4"/>
    <path d="M346 232C371 221 356 184 372 162C383 146 413 146 425 163C438 184 418 208 407 220L395 254" fill="#fffdf3" class="ink"/>
    <path d="M414 184L591 194Q579 262 466 252Q433 246 414 204Z" fill="#f4b65a" class="ink"/>
    <path d="M416 182L599 192L419 202Z" fill="#ffd66e" class="ink"/>
    <path d="M459 224Q480 207 500 225Q480 243 459 224L449 213V235Z" fill="#83bdbb" stroke="#203b45" stroke-width="3"/>
    <circle cx="490" cy="223" r="2.5" fill="#203b45"/>
    <path d="M516 233Q533 217 550 234Q532 247 516 233L508 223V242Z" fill="#fff3d2" stroke="#203b45" stroke-width="3"/>
    <circle cx="542" cy="233" r="2.5" fill="#203b45"/>
    <circle cx="409" cy="174" r="10" fill="white" stroke="#203b45" stroke-width="3"/>
    <circle cx="413" cy="175" r="4" fill="#203b45"/>
    <path d="M399 156L417 160" stroke="#203b45" stroke-width="5" stroke-linecap="round"/>
    <!-- Tiny racing helmet -->
    <path d="M368 153Q374 125 404 135Q421 139 425 154Z" fill="#ee6c4d" class="ink"/>
    <path d="M382 137L378 149M395 138L392 150M408 143L406 151" stroke="#fff5d9" stroke-width="4"/>
    <path d="M366 206Q350 192 330 195L306 188" fill="none" stroke="#e65143" stroke-width="9" stroke-linecap="round"/>
    <path d="M356 244Q401 273 483 249" fill="none" stroke="#203b45" stroke-width="5"/>
    <path d="M475 245L487 250L480 257" fill="#fffdf3" stroke="#203b45" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Near leg pedals continuously -->
  <path d="M340 270L389 319L382 385" fill="none" stroke="#eda943" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" values="M340 270L389 319L382 385;M340 270L323 330L342 381;M340 270L389 319L382 385" dur=".7s" repeatCount="indefinite"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 362 383" to="360 362 383" dur=".7s" repeatCount="indefinite"/>
    <path d="M342 383H382" stroke="#203b45" stroke-width="5"/>
    <path d="M375 383H391M334 383H350" stroke="#203b45" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Stationary speech and typography stay readable -->
  <path d="M87 134H285Q298 134 298 147V190Q298 203 285 203H252L271 223L225 203H87Q74 203 74 190V147Q74 134 87 134Z" fill="#fffdf3" stroke="#203b45" stroke-width="3"/>
  <text x="186" y="161" text-anchor="middle" class="letter" font-size="18" font-weight="bold">“I commute for</text>
  <text x="186" y="186" text-anchor="middle" class="letter" font-size="18" font-weight="bold">the fuel savings.”</text>

  <text x="400" y="510" text-anchor="middle" class="letter" font-size="23" font-weight="bold">His bicycle is light. His lunch has other plans.</text>
  <path d="M48 535H752" stroke="#203b45" stroke-width="2" opacity=".3"/>
  <text x="400" y="570" text-anchor="middle" class="letter" font-size="18">2026-10-26 05:31:15 SGT (UTC+08:00)</text>
</svg>