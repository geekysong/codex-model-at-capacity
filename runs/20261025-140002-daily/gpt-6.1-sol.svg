  <g fill="none" stroke="#2563eb" stroke-width="3">
    <path d="M100 350 Q260 230 420 238"/>
    <path d="M420 273.625 Q485 301.25 550 350"/>
  </g>

  <g stroke="white" stroke-width="9">
    <path d="M421 342 L429 358 M431 342 L439 358"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.8">
    <path d="M421 342 L429 358 M431 342 L439 358"/>
  </g>

  <g fill="#2563eb">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="550" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="55" y="375">launch: 0 m, 0 m</text>
