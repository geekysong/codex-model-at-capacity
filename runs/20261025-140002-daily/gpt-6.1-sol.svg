    <text x="450" y="252" font-size="12">15 m omitted</text>
  </g>

  <text x="300" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">2026-10-25 14:03:47 SGT (UTC+08:00)</text>
</svg>