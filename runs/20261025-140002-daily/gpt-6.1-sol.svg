    <text x="30" y="30" font-size="19" font-weight="bold">Projectile motion</text>
    <text x="30" y="56">vₓ = 20 m/s · vᵧ = 15 m/s · g = 10 m/s²</text>
    <text x="30" y="80">Total flight time: 3 s</text>
    <text x="30" y="108" font-size="12">Scale: 10 px/m; horizontal distances measured from launch.</text>
    <text x="30" y="129" font-size="12">To fit the canvas, the horizontal axis omits 15 m at the break.</text>
  </g>

