  <path d="M44 479H756" stroke="#f7f0d8" stroke-width="5" stroke-dasharray="35 25"/>
  <ellipse cx="394" cy="452" rx="245" ry="16" fill="#344951" opacity=".16"/>

  <!-- One bicycle, two endlessly rotating wheels. -->
  <g stroke="#233540" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(253 386)">
      <circle r="72" fill="#f8f2df" stroke-width="12"/>
