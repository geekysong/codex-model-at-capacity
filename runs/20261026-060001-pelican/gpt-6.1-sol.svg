<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish riding in its enormous bill. Wheels spin and the pelican bobs in a looping animation.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1" patternUnits="objectBoundingBox">
      <rect width="1" height="1" fill="none"/>
    </pattern>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bde9ee"/>
      <stop offset="1" stop-color="#f6f1d8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="18" y="18" width="764" height="500" rx="24" fill="url(#sky)" stroke="#263742" stroke-width="4"/>

  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="900" letter-spacing="3" fill="#213642">TOUR DE BEAK</text>
  <text x="400" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#47616a">ZERO EMISSIONS. EXCESSIVE BAGGAGE.</text>

  <g fill="#fffdf4" opacity=".85">
    <path d="M64 177c-9-24 28-42 43-22 8-29 53-27 57 5 29-6 42 21 21 29H69Z"/>
    <path d="M588 148c1-23 30-32 44-13 16-28 54-14 51 10 26-6 43 18 27 29H593Z"/>
  </g>
  <circle cx="701" cy="221" r="34" fill="#f4cb65"/>
  <path d="M20 383Q135 318 258 378T506 373T780 359V474H20Z" fill="#b2c6a3"/>
  <path d="M20 413Q200 371 365 418T780 398V490H20Z" fill="#87a88c"/>
