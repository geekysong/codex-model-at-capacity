      <path d="M-29 0Q-8-22 20-3L38-15L34 2L41 15L20 9Q-8 25-29 0Z" fill="#8ac6c8" stroke-width="3"/>
      <circle cx="-15" cy="-3" r="3" fill="#233540" stroke="none"/>
      <path d="M-8-10Q0 0-8 12" fill="none" stroke-width="2"/>
    </g>
    <path d="M419 172L624 184L616 197L420 191Z" fill="#ffd675" stroke-width="4"/>
    <path d="M382 155L398 156" stroke-width="5"/>
    <path d="M379 165L398 168L396 182L381 179ZM402 168L418 170L415 184L401 182Z" fill="#283f49" stroke-width="3"/>
