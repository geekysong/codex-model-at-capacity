    <path d="M378 123L384 143M394 121L401 144M410 125L418 145" stroke="#fff0ce" stroke-width="4"/>

    <path d="M327 291Q349 322 362 343L388 385" fill="none" stroke="#e9a23c" stroke-width="13">
      <animate attributeName="d" values="M327 291Q349 322 362 343L388 385;M327 291Q371 317 389 344L402 370;M327 291Q349 322 362 343L388 385;M327 291Q329 331 347 352L374 400;M327 291Q349 322 362 343L388 385" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(387 386)" stroke="#233540" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    <path d="M-22 0H22"/>
    <path d="M-30 0H-15M15 0H30" stroke-width="8"/>
    <circle r="5" fill="#eee5cb" stroke-width="2"/>
  </g>

  <path d="M592 275Q621 263 643 277" fill="none" stroke="#fff9e9" stroke-width="5"/>
  <g font-family="Arial, sans-serif" fill="#233540">
    <path d="M563 292Q563 275 582 275H735Q752 275 752 292V326Q752 342 735 342H600L580 359L585 342H582Q563 342 563 326Z" fill="#fffdf0" stroke="#233540" stroke-width="3"/>
    <text x="657" y="302" text-anchor="middle" font-size="17" font-weight="bold">“I ordered</text>
    <text x="657" y="325" text-anchor="middle" font-size="17" font-weight="bold">a WATER taxi.”</text>
    <text x="400" y="548" text-anchor="middle" font-size="21" font-weight="bold">He took up cycling. The fish took issue.</text>
    <text x="400" y="580" text-anchor="middle" font-size="16" fill="#47616a">2026-10-26 06:01:09 SGT (UTC+08:00)</text>
  </g>
</svg>