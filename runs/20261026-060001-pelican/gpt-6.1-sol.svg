        <path d="M-24-57L24 57M-57-24L57 24M-57 24L57-24M-24 57L24-57"/>
        <path d="M0-66L9-65" stroke="#e6953b" stroke-width="6"/>
      </g>
      <circle r="7" fill="#233540" stroke="none"/>
    </g>
    <g transform="translate(539 386)">
      <circle r="72" fill="#f8f2df" stroke-width="12"/>
      <circle r="63" fill="#c4e2d6" stroke="#fdf8e9" stroke-width="4"/>
      <g fill="none" stroke="#627e86" stroke-width="2.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44"/>
        <path d="M-24-57L24 57M-57-24L57 24M-57 24L57-24M-24 57L24-57"/>
        <path d="M0-66L9-65" stroke="#e6953b" stroke-width="6"/>
      </g>
      <circle r="7" fill="#233540" stroke="none"/>
    </g>
    <path d="M253 386L321 286L387 386H253L477 286H321M387 386L477 286L539 386" fill="none" stroke="#d85c4a" stroke-width="10"/>
    <path d="M321 286L309 260M477 286L466 252L489 233L511 238" fill="none" stroke-width="8"/>
    <path d="M288 260H332" stroke-width="12"/>
    <path d="M490 233L512 238" stroke="#6f463c" stroke-width="11"/>
    <circle cx="387" cy="386" r="18" fill="#eee5cb" stroke-width="4"/>
    <path d="M253 386L387 371L387 401Z" fill="none" stroke="#6f7771" stroke-width="3"/>
  </g>

  <!-- The rider bobs gently while its feet pedal. -->
  <g stroke="#233540" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
