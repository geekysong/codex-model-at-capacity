    <path d="M420 174L620 186Q608 251 535 262Q461 270 418 198Z" fill="#f0b950" stroke-width="4"/>
    <path d="M438 199Q507 231 601 197Q586 239 529 246Q472 250 438 199Z" fill="#e69b3e" stroke="none"/>
