    </path>
    <path d="M260 256L213 223L234 267L205 266L252 295" fill="#e8eee3" stroke-width="4"/>
    <path d="M251 244Q270 207 332 226Q372 240 382 279Q362 314 305 307Q250 303 246 277Z" fill="#fffdf0" stroke-width="4"/>
