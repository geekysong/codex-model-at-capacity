<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#302047"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241936"/>
      <stop offset="1" stop-color="#5a254f"/>
    </linearGradient>
    <linearGradient id="rope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff426d"/>
      <stop offset=".5" stop-color="#ff9a43"/>
      <stop offset="1" stop-color="#ff426d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 430 Q180 390 360 435 T800 420 V600 H0Z" fill="url(#floor)"/>
  <g opacity=".35" fill="#ff5fb3">
    <circle cx="90" cy="95" r="5"/><circle cx="160" cy="150" r="3"/><circle cx="710" cy="100" r="4"/>
    <circle cx="650" cy="185" r="3"/><circle cx="410" cy="90" r="4"/><circle cx="540" cy="135" r="2"/>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="900" fill="#fff">
    CODEX NIGHTCLUB
  </text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ff8cbf">
    THE EXCLUSIVE MODEL LOUNGE
  </text>

  <!-- glowing full sign -->
  <g filter="url(#glow)">
    <rect x="505" y="118" width="224" height="85" rx="16" fill="#ef254f" stroke="#ffcad8" stroke-width="4"/>
    <text x="617" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#fff">FULL</text>
  </g>
  <path d="M617 203 v30" stroke="#ffcad8" stroke-width="5"/>
  <circle cx="617" cy="240" r="8" fill="#ffcad8"/>

  <!-- club doorway -->
  <rect x="465" y="215" width="255" height="245" rx="22" fill="#090b18" stroke="#6e4c92" stroke-width="7"/>
  <path d="M490 432 Q590 260 690 432" fill="#241a38" stroke="#b04bb7" stroke-width="4"/>
  <path d="M512 429 Q590 306 668 429" fill="none" stroke="#ff4eaa" stroke-width="5" opacity=".6"/>
  <text x="590" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#d9b8ff">VIP MODEL INSIDE</text>

  <!-- lone admitted model -->
  <g transform="translate(590 355)">
    <ellipse cx="0" cy="64" rx="38" ry="13" fill="#000" opacity=".45"/>
    <rect x="-25" y="-8" width="50" height="70" rx="12" fill="#7de7ff" stroke="#d2fbff" stroke-width="4"/>
    <rect x="-17" y="-1" width="34" height="23" rx="5" fill="#15283b"/>
    <circle cx="-8" cy="10" r="4" fill="#79ff9b"/><circle cx="8" cy="10" r="4" fill="#79ff9b"/>
    <path d="M-11 38 Q0 47 11 38" fill="none" stroke="#183448" stroke-width="4"/>
    <path d="M-17 59 l-12 17 M17 59 l12 17" stroke="#7de7ff" stroke-width="7" stroke-linecap="round"/>
    <text x="0" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="800" fill="#bff8ff">ONE MODEL</text>
  </g>

  <!-- bouncer -->
  <g transform="translate(355 305)">
    <ellipse cx="0" cy="155" rx="93" ry="18" fill="#0e0b19" opacity=".6"/>
    <rect x="-66" y="20" width="132" height="132" rx="22" fill="#30384b" stroke="#111522" stroke-width="6"/>
    <rect x="-48" y="-48" width="96" height="80" rx="22" fill="#9aa8b8" stroke="#111522" stroke-width="6"/>
    <rect x="-37" y="-28" width="74" height="32" rx="8" fill="#151b2c"/>
    <circle cx="-17" cy="-12" r="8" fill="#ff4b72"/><circle cx="17" cy="-12" r="8" fill="#ff4b72"/>
    <path d="M-22 13 Q0 27 22 13" fill="none" stroke="#111522" stroke-width="6"/>
    <path d="M-65 59 Q-110 69 -125 112" fill="none" stroke="#30384b" stroke-width="20" stroke-linecap="round"/>
    <path d="M65 59 Q104 70 123 102" fill="none" stroke="#30384b" stroke-width="20" stroke-linecap="round"/>
    <path d="M-125 112 l-23 14 M123 102 l23 8" stroke="#9aa8b8" stroke-width="13" stroke-linecap="round"/>
    <rect x="-61" y="11" width="122" height="22" rx="8" fill="#ff426d"/>
    <text x="0" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#fff">BOUNCER.exe</text>
    <path d="M-94 78 l-57 -21" stroke="#ffed9b" stroke-width="5"/>
    <path d="M-151 57 l-18 -2 l11 14" fill="#ffed9b"/>
  </g>

  <!-- velvet rope -->
  <g stroke="#c8a15c" stroke-width="8" fill="#d5b36d">
    <circle cx="206" cy="445" r="14"/><circle cx="435" cy="445" r="14"/>
  </g>
  <path d="M206 445 Q315 515 435 445" fill="none" stroke="url(#rope)" stroke-width="13"/>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <!-- dev 1 -->
    <g transform="translate(73 360)">
      <ellipse cx="0" cy="106" rx="40" ry="10" fill="#0b0914" opacity=".5"/>
      <circle cx="0" cy="0" r="28" fill="#c88968"/><path d="M-28 0 Q-26 -33 8 -29 Q32 -24 27 4 Q9 -10 -28 0" fill="#35233a"/>
      <rect x="-29" y="29" width="58" height="65" rx="13" fill="#67b7d5"/>
      <path d="M-18 50 l36 0" stroke="#183847" stroke-width="5"/><path d="M-15 70 l30 0" stroke="#183847" stroke-width="5"/>
      <path d="M-23 94 l-9 30 M23 94 l9 30" stroke="#67b7d5" stroke-width="10" stroke-linecap="round"/>
      <path d="M-18 11 Q0 19 18 11" fill="none" stroke="#40212b" stroke-width="4"/>
      <text x="0" y="151" text-anchor="middle" font-size="12" font-weight="800" fill="#ffe5ee">SLEEP-DEPRIVED</text>
    </g>
    <!-- dev 2 -->
    <g transform="translate(165 390)">
      <ellipse cx="0" cy="81" rx="38" ry="9" fill="#0b0914" opacity=".5"/>
      <circle cx="0" cy="-8" r="25" fill="#e1a078"/><path d="M-25 -11 Q-13 -42 19 -31 Q35 -23 22 -4 Q5 -15 -25 -11" fill="#70513e"/>
      <rect x="-27" y="18" width="54" height="55" rx="12" fill="#e18b4d"/>
      <path d="M-18 39 h36" stroke="#65321c" stroke-width="5"/><path d="M-20 63 l-8 27 M20 63 l8 27" stroke="#e18b4d" stroke-width="10" stroke-linecap="round"/>
      <path d="M-14 -8 h9 M5 -8 h9" stroke="#4b2630" stroke-width="4"/>
      <text x="0" y="124" text-anchor="middle" font-size="12" font-weight="800" fill="#ffe5ee">RETRYING...</text>
    </g>
    <!-- dev 3 -->
    <g transform="translate(270 415)">
      <ellipse cx="0" cy="62" rx="35" ry="8" fill="#0b0914" opacity=".5"/>
      <circle cx="0" cy="-10" r="23" fill="#9b604c"/><path d="M-23 -14 Q-13 -39 15 -30 Q29 -23 20 -6 Q3 -17 -23 -14" fill="#1f2638"/>
      <rect x="-25" y="15" width="50" height="43" rx="10" fill="#8565c5"/>
      <path d="M-17 34 h34" stroke="#39264f" stroke-width="5"/><path d="M-17 56 l-7 22 M17 56 l7 22" stroke="#8565c5" stroke-width="9" stroke-linecap="round"/>
      <text x="0" y="104" text-anchor="middle" font-size="12" font-weight="800" fill="#ffe5ee">PLEASE?</text>
    </g>
  </g>

  <!-- melting server hamster wheels -->
  <g transform="translate(84 515)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#a9b6ca" stroke-width="9"/>
    <path d="M-28 -19 l56 38 M-28 19 l56 -38" stroke="#a9b6ca" stroke-width="5"/>
    <path d="M-28 30 Q0 54 28 30" fill="none" stroke="#ff704d" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-7" r="10" fill="#ffcc66"/>
    <path d="M-8 -40 Q-16 -58 -6 -70 Q5 -79 12 -61 Q21 -45 12 -35" fill="#ff7a45"/>
  </g>
  <g transform="translate(190 550) scale(.8)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#a9b6ca" stroke-width="9"/>
    <path d="M-28 -19 l56 38 M-28 19 l56 -38" stroke="#a9b6ca" stroke-width="5"/>
    <path d="M-28 30 Q0 54 28 30" fill="none" stroke="#ff704d" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-7" r="10" fill="#ffcc66"/>
    <path d="M-8 -40 Q-16 -58 -6 -70 Q5 -79 12 -61 Q21 -45 12 -35" fill="#ff7a45"/>
  </g>

  <!-- caption -->
  <rect x="38" y="548" width="724" height="38" rx="12" fill="#101020" stroke="#ff6a9a" stroke-width="2"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#fff">
    “SELECTED MODEL IS AT CAPACITY.” — THE BOUNCER, ALSO AT CAPACITY
  </text>
</svg>