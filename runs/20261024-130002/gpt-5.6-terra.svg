<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
    <style>
      .label { font: 20px Arial, sans-serif; fill: #222; }
      .small { font: 16px Arial, sans-serif; fill: #333; }
      .equation { font: bold 25px Arial, sans-serif; fill: #173b63; }
    </style>
  </defs>

  <!-- Level seesaw beam -->
  <rect x="90" y="170" width="420" height="20" rx="6" fill="#8d6e63" stroke="#4e342e" stroke-width="3"/>
  <line x1="90" y1="160" x2="510" y2="160" stroke="#78909c" stroke-width="2"/>
  <text x="300" y="148" text-anchor="middle" class="small">level seesaw</text>

  <!-- Pivot -->
  <polygon points="300,190 260,270 340,270" fill="#607d8b" stroke="#263238" stroke-width="3"/>
  <circle cx="300" cy="180" r="9" fill="#263238"/>
  <text x="300" y="295" text-anchor="middle" class="label">pivot</text>

  <!-- Left suspension and mass -->
  <line x1="180" y1="190" x2="180" y2="245" stroke="#333" stroke-width="3"/>
  <rect x="145" y="245" width="70" height="55" rx="5" fill="#90caf9" stroke="#1565c0" stroke-width="3"/>
  <text x="180" y="279" text-anchor="middle" class="label">6 kg</text>
  <line x1="180" y1="215" x2="180" y2="240" stroke="#c62828" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="180" y="210" text-anchor="middle" class="small">F = 6g</text>

  <!-- Right suspension and mass -->
  <line x1="420" y1="190" x2="420" y2="245" stroke="#333" stroke-width="3"/>
  <rect x="385" y="245" width="70" height="55" rx="5" fill="#ffcc80" stroke="#ef6c00" stroke-width="3"/>
  <text x="420" y="279" text-anchor="middle" class="label">4 kg</text>
  <line x1="420" y1="215" x2="420" y2="240" stroke="#c62828" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="420" y="210" text-anchor="middle" class="small">F = 4g</text>

  <!-- Distance indicators -->
  <line x1="180" y1="330" x2="300" y2="330" stroke="#455a64" stroke-width="2"/>
  <line x1="180" y1="322" x2="180" y2="338" stroke="#455a64" stroke-width="2"/>
  <line x1="300" y1="322" x2="300" y2="338" stroke="#455a64" stroke-width="2"/>
  <text x="240" y="355" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="330" x2="420" y2="330" stroke="#455a64" stroke-width="2"/>
  <line x1="420" y1="322" x2="420" y2="338" stroke="#455a64" stroke-width="2"/>
  <text x="360" y="355" text-anchor="middle" class="label">x m</text>

  <!-- Torque equation and result -->
  <text x="300" y="385" text-anchor="middle" class="equation">6 × 2 = 4 × 3   ⇒   x = 3 m</text>
  <text x="515" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2e7d32">balanced</text>
</svg>