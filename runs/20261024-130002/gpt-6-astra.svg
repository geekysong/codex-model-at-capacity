<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="25" font-weight="bold" fill="#111827">Level Seesaw in Static Equilibrium</text>

  <!-- seesaw beam -->
  <rect x="90" y="208" width="420" height="24" rx="6" fill="#b7791f" stroke="#744210" stroke-width="3"/>
  <line x1="300" y1="208" x2="300" y2="232" stroke="#744210" stroke-width="3"/>

  <!-- pivot -->
  <path d="M300 232 L268 292 L332 292 Z" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <line x1="250" y1="296" x2="350" y2="296" stroke="#334155" stroke-width="5"/>
  <text x="300" y="322" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#111827">pivot</text>

  <!-- left hanging mass -->
  <line x1="220" y1="232" x2="220" y2="270" stroke="#374151" stroke-width="3"/>
  <rect x="190" y="270" width="60" height="42" rx="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
  <text x="220" y="297" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="bold" fill="#0f172a">6 kg</text>

  <!-- right hanging mass -->
  <line x1="420" y1="232" x2="420" y2="270" stroke="#374151" stroke-width="3"/>
  <rect x="390" y="270" width="60" height="42" rx="5" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
  <text x="420" y="297" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="bold" fill="#0f172a">4 kg</text>

  <!-- force arrows -->
  <line x1="220" y1="258" x2="220" y2="340" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="220" y="365" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="16" fill="#111827">6g downward</text>

  <line x1="420" y1="258" x2="420" y2="340" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="365" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="16" fill="#111827">4g downward</text>

  <!-- distance labels -->
  <line x1="220" y1="180" x2="300" y2="180" stroke="#475569" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="260" y="166" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#111827">2 m</text>

  <line x1="300" y1="145" x2="420" y2="145" stroke="#475569" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="360" y="131" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#111827">x = 3 m</text>

  <!-- torque equation -->
  <text x="300" y="92" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#111827">6 × 2 = 4 × 3</text>
  <text x="300" y="118" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#166534">balanced</text>
</svg>