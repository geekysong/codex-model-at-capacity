<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #222; font-size: 20px; }
      .small { font-family: Arial, sans-serif; fill: #222; font-size: 17px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Level seesaw -->
  <rect x="70" y="188" width="460" height="24" rx="8" fill="#8d6e63" stroke="#4e342e" stroke-width="3"/>
  <line x1="300" y1="175" x2="300" y2="225" stroke="#4e342e" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="270,300 330,300 300,210" fill="#78909c" stroke="#37474f" stroke-width="3"/>
  <circle cx="300" cy="200" r="9" fill="#37474f"/>
  <text x="300" y="330" text-anchor="middle" class="label">pivot</text>

  <!-- Left mass -->
  <line x1="150" y1="212" x2="150" y2="255" stroke="#555" stroke-width="3"/>
  <rect x="115" y="255" width="70" height="55" rx="8" fill="#ef5350" stroke="#b71c1c" stroke-width="3"/>
  <text x="150" y="289" text-anchor="middle" fill="white" font-family="Arial" font-size="20px" font-weight="bold">6 kg</text>

  <!-- Right mass -->
  <line x1="450" y1="212" x2="450" y2="255" stroke="#555" stroke-width="3"/>
  <rect x="415" y="255" width="70" height="55" rx="8" fill="#42a5f5" stroke="#0d47a1" stroke-width="3"/>
  <text x="450" y="289" text-anchor="middle" fill="white" font-family="Arial" font-size="20px" font-weight="bold">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="245" x2="150" y2="325" stroke="#c62828" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="150" y="350" text-anchor="middle" class="small" fill="#c62828">6g downward</text>

  <line x1="450" y1="245" x2="450" y2="325" stroke="#1565c0" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="450" y="350" text-anchor="middle" class="small" fill="#1565c0">4g downward</text>

  <!-- Distance dimensions -->
  <line x1="150" y1="155" x2="300" y2="155" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="147" x2="150" y2="163" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="147" x2="300" y2="163" stroke="#333" stroke-width="2"/>
  <text x="225" y="143" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="125" x2="450" y2="125" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="117" x2="300" y2="133" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="117" x2="450" y2="133" stroke="#333" stroke-width="2"/>
  <text x="375" y="113" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equilibrium statement -->
  <text x="300" y=" forty" text-anchor="middle" class="label" font-weight="bold">balanced</text>
  <text x="300" y="70" text-anchor="middle" class="label" font-weight="bold">6 × 2 = 4 × 3</text>
  <text x="300" y="95" text-anchor="middle" class="small">clockwise torque = counterclockwise torque</text>
</svg>