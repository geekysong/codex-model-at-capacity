<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#222">Static Equilibrium</text>

  <!-- level seesaw -->
  <rect x="75" y="212" width="450" height="16" rx="8" fill="#8b5a2b"/>
  <line x1="75" y1="220" x2="525" y2="220" stroke="#4a2c14" stroke-width="2"/>

  <!-- pivot -->
  <polygon points="300,228 270,285 330,285" fill="#777"/>
  <line x1="258" y1="285" x2="342" y2="285" stroke="#444" stroke-width="5"/>
  <text x="300" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">pivot</text>

  <!-- left mass -->
  <line x1="180" y1="220" x2="180" y2="150" stroke="#333" stroke-width="3"/>
  <rect x="150" y="112" width="60" height="38" rx="5" fill="#4f81bd" stroke="#244a73" stroke-width="2"/>
  <text x="180" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">6 kg</text>

  <!-- right mass -->
  <line x1="420" y1="220" x2="420" y2="150" stroke="#333" stroke-width="3"/>
  <rect x="390" y="112" width="60" height="38" rx="5" fill="#d96b5f" stroke="#873b34" stroke-width="2"/>
  <text x="420" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">4 kg</text>

  <!-- force arrows -->
  <line x1="180" y1="82" x2="180" y2="108" stroke="#1f5f99" stroke-width="4"/>
  <polygon points="180,116 172,102 188,102" fill="#1f5f99"/>
  <text x="180" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f5f99">F = 6g</text>

  <line x1="420" y1="82" x2="420" y2="108" stroke="#a33b32" stroke-width="4"/>
  <polygon points="420,116 412,102 428,102" fill="#a33b32"/>
  <text x="420" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#a33b32">F = 4g</text>

  <!-- distance labels -->
  <line x1="180" y1="342" x2="300" y2="342" stroke="#555" stroke-width="2"/>
  <line x1="180" y1="335" x2="180" y2="349" stroke="#555" stroke-width="2"/>
  <line x1="300" y1="335" x2="300" y2="349" stroke="#555" stroke-width="2"/>
  <text x="240" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">2 m</text>

  <line x1="300" y1="342" x2="420" y2="342" stroke="#555" stroke-width="2"/>
  <line x1="420" y1="335" x2="420" y2="349" stroke="#555" stroke-width="2"/>
  <text x="360" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">x = 3 m</text>

  <!-- torque equation and result -->
  <text x="300" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">6 × 2 = 4 × 3</text>
  <text x="520" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">balanced</text>
</svg>