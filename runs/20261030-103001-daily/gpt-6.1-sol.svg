<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest route from A1 to E5</title>
  <desc id="desc">A five-by-five street grid with blocked intersections B2, C3, and D4. The blue shortest route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">City Grid: A1 to E5</text>

  <g stroke="#cbd5e1" stroke-width="5" stroke-linecap="round">
    <path d="M100 70H500 M100 130H500 M100 190H500 M100 250H500 M100 310H500"/>
    <path d="M100 70V310 M200 70V310 M300 70V310 M400 70V310 M500 70V310"/>
  </g>

  <path d="M100 70H500V310" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#64748b">
    <circle cx="200" cy="70" r="4"/><circle cx="300" cy="70" r="4"/><circle cx="400" cy="70" r="4"/><circle cx="500" cy="70" r="4"/>
    <circle cx="100" cy="130" r="4"/><circle cx="300" cy="130" r="4"/><circle cx="400" cy="130" r="4"/><circle cx="500" cy="130" r="4"/>
    <circle cx="100" cy="190" r="4"/><circle cx="200" cy="190" r="4"/><circle cx="400" cy="190" r="4"/><circle cx="500" cy="190" r="4"/>
    <circle cx="100" cy="250" r="4"/><circle cx="200" cy="250" r="4"/><circle cx="300" cy="250" r="4"/><circle cx="500" cy="250" r="4"/>
    <circle cx="100" cy="310" r="4"/><circle cx="200" cy="310" r="4"/><circle cx="300" cy="310" r="4"/><circle cx="400" cy="310" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M192 122L208 138 M208 122L192 138"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M392 242L408 258 M408 242L392 258"/>
  </g>

  <circle cx="100" cy="70" r="8" fill="#16a34a" stroke="white" stroke-width="2"/>
  <circle cx="500" cy="310" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0f172a">
    <text x="100" y="55">A1</text><text x="200" y="55">B1</text><text x="300" y="55">C1</text><text x="400" y="55">D1</text><text x="500" y="55">E1</text>
    <text x="100" y="115">A2</text><text x="200" y="115">B2</text><text x="300" y="115">C2</text><text x="400" y="115">D2</text><text x="500" y="115">E2</text>
    <text x="100" y="175">A3</text><text x="200" y="175">B3</text><text x="300" y="175">C3</text><text x="400" y="175">D3</text><text x="500" y="175">E3</text>
    <text x="100" y="235">A4</text><text x="200" y="235">B4</text><text x="300" y="235">C4</text><text x="400" y="235">D4</text><text x="500" y="235">E4</text>
    <text x="100" y="295">A5</text><text x="200" y="295">B5</text><text x="300" y="295">C5</text><text x="400" y="295">D5</text><text x="500" y="295">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    <text x="80" y="75" text-anchor="end" fill="#15803d">START</text>
    <text x="520" y="315" fill="#7c3aed">END</text>
  </g>

  <text x="300" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Shortest route: 8 street segments</text>
  <path d="M30 360H570" stroke="#cbd5e1"/>
  <text x="300" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 10:34:27 SGT (UTC+08:00)</text>
</svg>