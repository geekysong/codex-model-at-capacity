    <circle cx="130" cy="185" r="4"/><circle cx="210" cy="185" r="4"/><circle cx="370" cy="185" r="4"/>
    <circle cx="130" cy="240" r="4"/><circle cx="210" cy="240" r="4"/><circle cx="290" cy="240" r="4"/>
    <circle cx="130" cy="295" r="4"/><circle cx="210" cy="295" r="4"/><circle cx="290" cy="295" r="4"/><circle cx="370" cy="295" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M203 123L217 137 M217 123L203 137"/>
    <path d="M283 178L297 192 M297 178L283 192"/>
    <path d="M363 233L377 247 M377 233L363 247"/>
