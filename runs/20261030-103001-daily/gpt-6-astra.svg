    <pattern id="blocks" x="130" y="75" width="80" height="55" patternUnits="userSpaceOnUse">
      <rect x="11" y="11" width="58" height="33" rx="4" fill="#e2e8e5"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#172b3a">City Grid · A1 to E5</text>

  <rect x="130" y="75" width="320" height="220" fill="url(#blocks)"/>

  <g fill="none" stroke="#a7b3bf" stroke-width="4" stroke-linecap="round">
