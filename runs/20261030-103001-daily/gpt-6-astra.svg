    <text x="130" y="115">A2</text><text x="210" y="115">B2</text><text x="290" y="115">C2</text><text x="370" y="115">D2</text><text x="450" y="115">E2</text>
    <text x="130" y="170">A3</text><text x="210" y="170">B3</text><text x="290" y="170">C3</text><text x="370" y="170">D3</text><text x="450" y="170">E3</text>
    <text x="130" y="225">A4</text><text x="210" y="225">B4</text><text x="290" y="225">C4</text><text x="370" y="225">D4</text><text x="450" y="225">E4</text>
    <text x="130" y="280">A5</text><text x="210" y="280">B5</text><text x="290" y="280">C5</text><text x="370" y="280">D5</text><text x="450" y="280">E5</text>
