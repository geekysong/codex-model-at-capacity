    <path d="M130 75V295 M210 75V295 M290 75V295 M370 75V295 M450 75V295"/>
  </g>

  <path d="M130 75H450V295" fill="none" stroke="#1670dd" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#1670dd">
