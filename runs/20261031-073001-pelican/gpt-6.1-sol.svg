<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">An ambitious pelican pedals a bicycle while carrying a fish in its enormous bill. Bicycle wheels spin and the rider bobs in a seamless looping animation.</desc>
