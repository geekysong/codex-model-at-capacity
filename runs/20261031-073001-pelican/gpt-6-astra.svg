<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with spinning wheels, carrying fish in its enormous bill. A sign announces a no-fly zone.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1"/>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #163341; }
      .ink { stroke: #163341; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .fine { fill: none; stroke: #163341; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6de"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="none" stroke="#163341" stroke-width="4"/>
  <text x="400" y="72" text-anchor="middle" font-size="45" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="103" text-anchor="middle" font-size="17" letter-spacing="2">ZERO EMISSIONS. EXCESS BAGGAGE.</text>

  <path d="M35 340 Q150 295 257 336 T476 330 T765 324 V469 H35Z" fill="#d4e9ce"/>
  <circle cx="684" cy="168" r="36" fill="#ffd36a"/>
  <path d="M56 202 Q73 184 90 202 Q107 184 124 202 M535 152 Q548 140 561 152 Q574 140 587 152" fill="none" stroke="#b1ccc6" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(66 246)">
    <path d="M56 54 V186" stroke="#163341" stroke-width="9"/>
    <rect width="113" height="72" rx="8" fill="#fffdf1" class="ink"/>
    <text x="56" y="28" text-anchor="middle" font-size="19" font-weight="900">NO-FLY</text>
    <text x="56" y="53" text-anchor="middle" font-size="19" font-weight="900">ZONE</text>
    <path d="M18 94 H94" stroke="#163341" stroke-width="3"/>
    <text x="56" y="117" text-anchor="middle" font-size="12">Fine. I'll cycle.</text>
  </g>

  <path d="M35 460 H765" stroke="#163341" stroke-width="4"/>
  <ellipse cx="429" cy="456" rx="228" ry="12" fill="#163341" opacity=".12"/>
  <path d="M60 484 H140 M670 484 H738" stroke="#e2cba3" stroke-width="5" stroke-linecap="round"/>

  <!-- Spinning wheels -->
  <g transform="translate(290 383)">
    <circle r="73" fill="#fffdf1" stroke="#163341" stroke-width="12"/>
    <circle r="64" fill="none" stroke="#77bcb5" stroke-width="3"/>
    <g stroke="#8ba5a4" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0 H62 M0-62 V62 M-44-44 L44 44 M-44 44 L44-44 M-57-24 L57 24 M-24-57 L24 57 M-57 24 L57-24 M-24 57 L24-57"/>
      <path d="M43-43 L49-49" stroke="#ffad45" stroke-width="8"/>
    </g>
    <circle r="9" fill="#163341"/>
  </g>
  <g transform="translate(576 383)">
    <circle r="73" fill="#fffdf1" stroke="#163341" stroke-width="12"/>
    <circle r="64" fill="none" stroke="#77bcb5" stroke-width="3"/>
    <g stroke="#8ba5a4" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0 H62 M0-62 V62 M-44-44 L44 44 M-44 44 L44-44 M-57-24 L57 24 M-24-57 L24 57 M-57 24 L57-24 M-24 57 L24-57"/>
      <path d="M43-43 L49-49" stroke="#ffad45" stroke-width="8"/>
    </g>
    <circle r="9" fill="#163341"/>
  </g>

  <!-- Bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M290 383 L353 291 L403 383 Z M353 291 L527 291 L403 383 M527 291 L576 383" stroke="#163341" stroke-width="13"/>
    <path d="M290 383 L353 291 L403 383 Z M353 291 L527 291 L403 383 M527 291 L576 383" stroke="#ed6552" stroke-width="7"/>
    <path d="M353 291 L342 266 M527 291 L512 248 Q510 239 526 236 L554 236" stroke="#163341" stroke-width="8"/>
    <path d="M546 236 H565" stroke="#163341" stroke-width="12"/>
    <path d="M321 266 H366" stroke="#163341" stroke-width="12"/>
    <path d="M290 383 L399 369 Q420 371 419 386 Q416 401 399 399 L290 391Z" stroke="#163341" stroke-width="3"/>
  </g>
  <circle cx="403" cy="383" r="20" fill="#ffd36a" class="ink"/>
  <g transform="translate(403 383)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-23 0 H23" class="fine"/>
      <circle cx="-23" r="5" fill="#163341"/>
      <circle cx="23" r="5" fill="#163341"/>
    </g>
  </g>

  <!-- Pelican and its improbable cargo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M338 254 Q322 300 361 323 L391 364" fill="none" stroke="#163341" stroke-width="15" stroke-linecap="round"/>
    <path d="M338 254 Q322 300 361 323 L391 364" fill="none" stroke="#efa83c" stroke-width="9" stroke-linecap="round"/>
    <path d="M379 358 L411 370 L378 374Z" fill="#f7b744" class="ink"/>

    <path d="M312 225 L268 208 L287 243 L263 242 L298 267" fill="#fffdf5" class="ink"/>
    <path d="M304 209 Q327 173 384 201 Q417 211 425 254 Q407 285 351 280 Q293 277 291 244Z" fill="#fffdf5" class="ink"/>
    <path d="M355 217 Q335 239 365 255 Q388 262 405 247" fill="#dce6df" class="fine"/>

    <path d="M390 236 Q410 210 407 176 Q405 143 437 139 Q468 139 468 167 Q457 194 455 221 Q453 251 421 262" fill="#fffdf5" class="ink"/>
    <path d="M428 213 Q457 226 481 240 L533 240" fill="none" stroke="#163341" stroke-width="16" stroke-linecap="round"/>
    <path d="M428 213 Q457 226 481 240 L533 240" fill="none" stroke="#dce6df" stroke-width="10" stroke-linecap="round"/>

    <path d="M452 172 L644 185 Q609 255 544 251 Q485 244 452 191Z" fill="#ffbf63" class="ink"/>
    <path d="M456 170 L649 184 L454 189Z" fill="#ffdf77" class="ink"/>
    <path d="M485 201 Q520 239 563 235" fill="none" stroke="#e38b42" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(545 213) rotate(12)">
      <path d="M-22 0 Q-3-19 22 0 Q-3 18-22 0 L-36 12 V-12Z" fill="#77bcb5" stroke="#163341" stroke-width="3"/>
      <circle cx="12" cy="-2" r="3" fill="#163341"/>
      <path d="M2-9 Q-4 0 2 8" class="fine"/>
    </g>

    <circle cx="443" cy="164" r="10" fill="white" stroke="#163341" stroke-width="3"/>
    <circle cx="447" cy="164" r="4" fill="#163341"/>
    <path d="M432 151 L451 149" class="fine"/>
    <path d="M410 145 Q415 120 442 124 Q464 128 470 146Z" fill="#ed6552" class="ink"/>
    <path d="M423 128 L420 139 M439 128 L438 140 M454 133 L456 142" class="fine"/>
    <path d="M413 146 H477" class="fine"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 379 275;7 379 275;-5 379 275" dur="1.6s" repeatCount="indefinite"/>
      <path d="M379 276 L410 314 L386 345" fill="none" stroke="#163341" stroke-width="15" stroke-linecap="round"/>
      <path d="M379 276 L410 314 L386 345" fill="none" stroke="#ffbf48" stroke-width="9" stroke-linecap="round"/>
      <path d="M385 339 L417 352 L379 356Z" fill="#ffbf48" class="ink"/>
    </g>
  </g>

  <g transform="translate(664 280)">
    <path d="M-19 14 L-43 3 L-28 30" fill="white" stroke="#163341" stroke-width="3" stroke-linejoin="round"/>
    <rect x="-25" y="-18" width="102" height="65" rx="17" fill="white" stroke="#163341" stroke-width="3"/>
    <text x="26" y="7" text-anchor="middle" font-size="15" font-weight="bold">It's all</text>
    <text x="26" y="28" text-anchor="middle" font-size="15" font-weight="bold">leg day.</text>
  </g>

  <text x="400" y="511" text-anchor="middle" font-size="21" font-weight="bold">He traded his wings for a two-wheel fish delivery gig.</text>
  <path d="M45 533 H755" stroke="#163341" stroke-width="2" opacity=".25"/>
  <text x="400" y="563" text-anchor="middle" font-size="18">2026-10-31 07:30:01 SGT (UTC+08:00)</text>
</svg>