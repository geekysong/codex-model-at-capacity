<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish-filled bill pouch. The wheels spin, its legs pedal, and its body bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#e8ddbd"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke: #20313a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #71878b; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
  <rect width="800" height="548" fill="url(#paper)" opacity=".45"/>
  <path d="M0 335 Q160 290 300 330 T580 318 T800 328 V480 H0Z" fill="#c6dfc5"/>
  <circle cx="680" cy="154" r="46" fill="#ffd46b"/>
  <path d="M62 192 Q83 170 104 192 Q125 170 146 192 M562 135 Q576 121 590 135" fill="none" stroke="#80958d" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="65" text-anchor="middle" font-size="48" font-weight="900" fill="#20313a" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="98" text-anchor="middle" font-size="19" fill="#566366">The only cyclist carrying a seafood buffet.</text>

  <g transform="translate(54 264)">
    <path d="M12 145 V0" class="ink" fill="none"/>
    <path d="M-6 0 H113 L130 27 L113 54 H-6Z" fill="#fffaf0" class="ink"/>
    <text x="58" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#20313a">NO FREE</text>
    <text x="58" y="43" text-anchor="middle" font-size="17" font-weight="bold" fill="#d85a45">RIDES</text>
  </g>

  <path d="M0 449 H800 V482 H0Z" fill="#b0b3a0"/>
  <path d="M0 450 H800" stroke="#20313a" stroke-width="5"/>
  <path d="M22 467 H105 M164 467 H245 M564 467 H644 M704 467 H785" stroke="#fff5d9" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="420" cy="448" rx="235" ry="13" fill="#20313a" opacity=".14"/>

  <!-- Spinning wheels -->
  <g transform="translate(270 371)">
    <circle r="76" fill="#fff8e5" class="ink" stroke-width="9"/>
    <circle r="65" fill="none" stroke="#e1b970" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-66 0 H66 M0-66 V66 M-47-47 L47 47 M-47 47 L47-47" class="spoke"/>
      <path d="M0-69 A69 69 0 0 1 27-63" fill="none" stroke="#e96b47" stroke-width="6"/>
    </g>
    <circle r="8" fill="#20313a"/>
  </g>
  <g transform="translate(573 371)">
    <circle r="76" fill="#fff8e5" class="ink" stroke-width="9"/>
    <circle r="65" fill="none" stroke="#e1b970" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-66 0 H66 M0-66 V66 M-47-47 L47 47 M-47 47 L47-47" class="spoke"/>
      <path d="M0-69 A69 69 0 0 1 27-63" fill="none" stroke="#e96b47" stroke-width="6"/>
    </g>
    <circle r="8" fill="#20313a"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M270 371 L337 270 L410 371 Z M337 270 L518 270 L410 371 M518 270 L573 371" stroke="#1c8d93" stroke-width="10"/>
    <path d="M337 270 L329 246 M309 245 H355" stroke-width="8"/>
    <path d="M518 270 L507 226 L537 211 Q552 205 554 219" stroke-width="7"/>
    <path d="M270 371 L410 380" stroke="#20313a" stroke-width="3"/>
  </g>
  <path d="M301 242 Q332 232 359 242 L357 252 H307Z" fill="#8a4e3c" class="ink"/>

  <!-- Far leg -->
  <path d="M367 247 L405 294 L391 350" fill="none" stroke="#d89337" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M367 247 L405 294 L391 350;M367 247 L378 309 L429 392;M367 247 L405 294 L391 350" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- Expressive pelican -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M304 220 L271 203 L283 237 L269 244 L308 252" fill="#fffdf0" class="ink"/>
    <path d="M302 213 Q326 176 378 191 Q402 199 410 224 Q421 257 379 267 Q329 278 303 249Z" fill="#fffdf0" class="ink"/>
    <path d="M319 216 Q354 200 386 222 Q373 250 337 246 Q326 242 319 230" fill="#d7e1da" class="ink"/>
    <path d="M387 211 Q419 199 418 166 Q415 134 440 128 Q465 124 469 149 L464 205 Q455 235 413 239" fill="#fffdf0" class="ink"/>
    <path d="M433 131 Q426 110 435 104 M443 129 Q445 107 454 111" fill="none" class="ink"/>

    <!-- Helmet -->
    <path d="M419 137 Q419 108 447 107 Q475 109 477 137Z" fill="#ed6b4d" class="ink"/>
    <path d="M438 113 L436 130 M454 114 L457 130" fill="none" stroke="#fff2cf" stroke-width="5"/>
    <path d="M425 139 L444 169 L466 140" fill="none" stroke="#20313a" stroke-width="3"/>

    <!-- Enormous bill and fish pouch -->
    <path d="M464 159 L644 176 Q626 234 552 239 Q493 240 464 189Z" fill="#f6bd5f" class="ink"/>
    <path d="M466 157 L655 171 Q660 177 647 181 L465 180Z" fill="#f28a3f" class="ink"/>
    <path d="M495 201 Q521 184 543 206 L557 197 L554 217 L541 212 Q519 225 495 208Z" fill="#79afb2" stroke="#20313a" stroke-width="3"/>
    <circle cx="505" cy="204" r="3" fill="#20313a"/>
    <path d="M575 218 Q589 199 606 207 L619 199 L617 217 L605 214 Q589 229 575 218Z" fill="#d9e8db" stroke="#20313a" stroke-width="3"/>
    <circle cx="586" cy="215" r="2.5" fill="#20313a"/>
    <path d="M474 184 Q483 191 490 185" fill="none" stroke="#20313a" stroke-width="3"/>
    <circle cx="453" cy="149" r="6" fill="#20313a"/>
    <path d="M444 138 L460 136" class="ink" fill="none" stroke-width="3"/>

    <!-- Wing reaches the handlebars -->
    <path d="M375 219 Q426 249 458 234 L516 220" fill="none" stroke="#20313a" stroke-width="17" stroke-linecap="round"/>
    <path d="M375 216 Q426 246 458 231 L516 217" fill="none" stroke="#fffdf0" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Pedaling leg and crank -->
  <path d="M362 255 L350 318 L429 392" fill="none" stroke="#eea640" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M362 255 L350 318 L429 392;M362 255 L397 297 L391 350;M362 255 L350 318 L429 392" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <circle cx="410" cy="371" r="16" fill="#f5d68d" class="ink"/>
  <g transform="translate(410 371)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="48" to="408" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-28 0 H28" class="ink" fill="none"/>
      <path d="M28-9 V9 M-28-9 V9" stroke="#20313a" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <path d="M198 278 H246 M210 297 H238 M185 317 H225" fill="none" stroke="#71878b" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="520" text-anchor="middle" font-size="24" font-weight="bold" fill="#20313a">“I carb-load. They cod-load.”</text>

  <rect x="0" y="548" width="800" height="52" fill="#20313a"/>
  <text x="400" y="580" text-anchor="middle" font-size="19" fill="#fff5d9">2026-10-25 13:31:26 SGT (UTC+08:00)</text>
</svg>