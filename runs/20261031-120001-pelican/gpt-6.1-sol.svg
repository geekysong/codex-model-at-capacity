<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle toward a dangling fish, wearing a helmet and carrying an enormous pouch. Wheels spin, feet pedal, and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24L24 0" stroke="#e8dec5" stroke-width=".6" opacity=".3"/>
    </pattern>
    <g id="spokes" stroke="#577b80" stroke-width="3">
      <path d="M-69 0H69M0-69V69M-49-49L49 49M-49 49L49-49"/>
      <circle r="10" fill="#ffce55" stroke="#213d49" stroke-width="4"/>
    </g>
    <style>
      .ink{stroke:#213d49;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .type{font-family:Arial,Helvetica,sans-serif;fill:#213d49}
      .bob{animation:bob 1s ease-in-out infinite}
      .flap{animation:flap 1s ease-in-out infinite;transform-origin:370px 303px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes flap{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
      @media(prefers-reduced-motion:reduce){.bob,.flap{animation-duration:3s}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6de"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 108H800" stroke="#213d49" stroke-width="3"/>
  <text x="400" y="51" text-anchor="middle" class="type" font-size="39" font-weight="900" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="83" text-anchor="middle" class="type" font-size="17" font-weight="bold">ZERO EMISSIONS. OUTRAGEOUS BAGGAGE.</text>

  <!-- One seaside cycling scene -->
  <path d="M0 360Q120 341 230 359T455 355T800 354V453H0Z" fill="#b8dfd6"/>
  <path d="M0 389Q140 376 260 391T525 387T800 386" fill="none" stroke="#80bcb5" stroke-width="3"/>
  <path d="M58 304q12-15 24 0q12-15 24 0M664 272q11-13 22 0q11-13 22 0" fill="none" stroke="#749b9e" stroke-width="3"/>
  <ellipse cx="407" cy="474" rx="244" ry="13" fill="#213d49" opacity=".13"/>
  <path d="M0 480H800" stroke="#213d49" stroke-width="4"/>
  <path d="M33 462H99M679 462H750M121 447H152" stroke="#d8b573" stroke-width="5" stroke-linecap="round"/>

  <!-- A public-service sign with an inconvenient exception -->
  <g transform="translate(52 149)">
    <path d="M57 98V273" class="ink" fill="none"/>
    <rect width="120" height="103" rx="9" fill="#fffdf2" class="ink"/>
    <text x="60" y="27" text-anchor="middle" class="type" font-size="17" font-weight="900">BIKE LANE</text>
    <path d="M22 40H98" stroke="#213d49" stroke-width="2"/>
    <text x="60" y="61" text-anchor="middle" class="type" font-size="13">NO WIDE</text>
    <text x="60" y="79" text-anchor="middle" class="type" font-size="13">LOADS*</text>
    <text x="60" y="95" text-anchor="middle" class="type" font-size="9">*especially lunch</text>
  </g>

  <!-- Speech balloon -->
  <path d="M219 130H414Q429 130 429 146V185Q429 200 413 200H328L309 222L311 200H219Q204 200 204 185V146Q204 130 219 130Z" fill="#fffdf6" class="ink" stroke-width="3"/>
  <text x="316" y="158" text-anchor="middle" class="type" font-size="17" font-weight="bold">“I’m in it for</text>
  <text x="316" y="183" text-anchor="middle" class="type" font-size="17" font-weight="bold">the cardio.”</text>

  <!-- Bicycle wheels -->
  <g transform="translate(268 402)">
    <circle r="76" fill="#fffaf0" class="ink" stroke-width="10"/>
    <circle r="66" fill="none" stroke="#e2b75c" stroke-width="3"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(548 402)">
    <circle r="76" fill="#fffaf0" class="ink" stroke-width="10"/>
    <circle r="66" fill="none" stroke="#e2b75c" stroke-width="3"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Tiny frame, heroic task -->
  <path d="M268 402L330 313L389 402ZM330 313H492L389 402M492 313L548 402M389 402L341 298" fill="none" stroke="#213d49" stroke-width="12" stroke-linejoin="round"/>
  <path d="M268 402L330 313L389 402ZM330 313H492L389 402M492 313L548 402M389 402L341 298" fill="none" stroke="#ef6851" stroke-width="7" stroke-linejoin="round"/>
  <path d="M492 313L482 280L508 263" fill="none" class="ink" stroke-width="7"/>
  <path d="M500 264L518 260" stroke="#213d49" stroke-width="10" stroke-linecap="round"/>
  <path d="M315 295H361" stroke="#213d49" stroke-width="13" stroke-linecap="round"/>
  <path d="M267 402L389 391V414Z" fill="none" stroke="#577b80" stroke-width="3"/>

  <!-- Far leg -->
  <path d="M364 298L410 344L389 379" fill="none" stroke="#d99230" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M364 298L410 344L389 379;M364 298L343 357L389 425;M364 298L410 344L389 379" dur="1s" repeatCount="indefinite"/>
  </path>

  <!-- Pelican rider -->
  <g class="bob">
    <path d="M292 268L245 252L269 288L243 285L292 311" fill="#fffdf3" class="ink"/>
    <path d="M284 257Q299 217 354 224Q392 226 404 254Q411 283 380 302Q326 325 289 296Q276 283 284 257Z" fill="#fffdf3" class="ink"/>
    <path d="M317 253Q343 241 374 258L345 286Q327 286 310 270" fill="#c8d5d5" class="ink" stroke-width="3"/>
    <path d="M376 250Q404 239 409 210L413 185Q416 161 440 166Q463 172 454 197L446 219Q441 261 405 281" fill="#fffdf3" class="ink"/>

    <!-- Pouch, beak, and utterly focused face -->
    <path d="M448 193L598 209Q582 264 523 277Q466 288 444 224Z" fill="#f6bf63" class="ink"/>
    <path d="M453 212Q490 252 566 230" fill="none" stroke="#d78b36" stroke-width="3"/>
    <path d="M447 185L616 205L598 218L449 209Z" fill="#ffcf57" class="ink"/>
    <path d="M470 202L588 210" stroke="#d9902b" stroke-width="2"/>
    <ellipse cx="439" cy="187" rx="11" ry="14" fill="white" stroke="#213d49" stroke-width="3"/>
    <circle cx="444" cy="187" r="4.5" fill="#213d49"/>
    <path d="M428 168L450 173" class="ink" fill="none" stroke-width="4"/>
    <path d="M408 172Q409 139 437 143Q465 145 464 175Z" fill="#ef6851" class="ink"/>
    <path d="M424 150L423 164M440 151L441 167" stroke="#fff3d7" stroke-width="4" stroke-linecap="round"/>
    <path d="M419 176L424 206" fill="none" stroke="#213d49" stroke-width="3"/>
    <path d="M401 233L383 224L379 243L399 247" fill="#d94942" stroke="#213d49" stroke-width="3"/>
    <path d="M384 231L346 211L352 236L335 238L376 247" fill="#ef6851" stroke="#213d49" stroke-width="3"/>

    <g class="flap">
      <path d="M371 266Q405 271 433 289L492 276Q504 273 508 281Q510 289 498 291L437 308Q425 310 410 300L374 285" fill="#fffdf3" class="ink"/>
      <path d="M388 282L420 297M397 276L428 292" fill="none" stroke="#aabec0" stroke-width="3"/>
    </g>
  </g>

  <!-- Near leg pedals through changing positions -->
  <path d="M348 298L359 350L389 425" fill="none" stroke="#213d49" stroke-width="17" stroke-linecap="round">
    <animate attributeName="d" values="M348 298L359 350L389 425;M348 298L417 332L389 379;M348 298L359 350L389 425" dur="1s" repeatCount="indefinite"/>
  </path>
  <path d="M348 298L359 350L389 425" fill="none" stroke="#f3b343" stroke-width="11" stroke-linecap="round">
    <animate attributeName="d" values="M348 298L359 350L389 425;M348 298L417 332L389 379;M348 298L359 350L389 425" dur="1s" repeatCount="indefinite"/>
  </path>
  <circle cx="389" cy="402" r="12" fill="#ffce55" class="ink" stroke-width="3"/>
  <g transform="translate(389 402)">
    <g>
      <path d="M0-23V23" class="ink" stroke-width="5"/>
      <path d="M-12-23H12M-12 23H12" class="ink" stroke-width="6"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Fish-powered motivation -->
  <path d="M501 267Q562 155 649 148" fill="none" stroke="#213d49" stroke-width="4"/>
  <path d="M649 148V195" fill="none" stroke="#577b80" stroke-width="2"/>
  <g>
    <path d="M628 207Q648 184 674 205L687 194V222L674 212Q648 234 628 207Z" fill="#64b8b5" class="ink" stroke-width="3"/>
    <circle cx="638" cy="205" r="3" fill="#213d49"/>
    <path d="M655 198Q663 208 655 218" fill="none" stroke="#287d84" stroke-width="2"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur="1s" repeatCount="indefinite"/>
  </g>
  <path d="M472 146l4-10M485 151l9-7" stroke="#75b8bf" stroke-width="3" stroke-linecap="round"/>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="493" width="800" height="107" fill="#213d49"/>
  <text x="400" y="527" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#fff6de">He traded his carbon footprint for a seafood print.</text>
  <path d="M90 546H710" stroke="#64808a" stroke-width="1"/>
  <text x="400" y="575" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#fff6de">2026-10-31 12:01:09 SGT (UTC+08:00)</text>
</svg>