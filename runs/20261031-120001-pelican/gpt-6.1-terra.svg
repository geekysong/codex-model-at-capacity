  <text x="400" y="87" text-anchor="middle" fill="#24343b" font-family="Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="2">PELICAN EXPRESS</text>
  <text x="400" y="115" text-anchor="middle" fill="#d25a3b" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="3">THE COMMUTE IS A CATCH</text>

