<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN EXPRESS</title>
  <desc id="desc">A pelican rides a bicycle with a fish peeking out of its beak. The bicycle wheels spin and the pelican bobs as it pedals.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#d4e7dc"/>
    </pattern>
    <style>
      .ink { stroke:#24343b; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#24343b; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.5s linear infinite; }
      .rider { animation:bob .75s ease-in-out infinite alternate; }
      .pedal { transform-origin:390px 398px; animation:spin 1.5s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation-duration:6s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8f1d9"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#eff7ed" stroke="#24343b" stroke-width="4"/>
