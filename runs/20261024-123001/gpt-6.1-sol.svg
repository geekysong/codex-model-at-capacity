<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f4e79"/>
    </marker>
    <style>
      .label { font: 18px Arial, sans-serif; fill: #222; }
      .small { font: 16px Arial, sans-serif; fill: #222; }
      .bold { font: bold 24px Arial, sans-serif; fill: #176b3a; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="70" y="210" width="460" height="20" rx="5" fill="#b87935" stroke="#633d1d" stroke-width="3"/>
  <text x="300" y="198" text-anchor="middle" class="small">level seesaw</text>

  <!-- Pivot -->
  <polygon points="300,230 265,300 335,300" fill="#777" stroke="#333" stroke-width="3"/>
  <circle cx="300" cy="220" r="8" fill="#333"/>
  <text x="300" y="327" text-anchor="middle" class="label">pivot</text>

  <!-- Left mass and hanger -->
  <line x1="160" y1="230" x2="160" y2="270" stroke="#333" stroke-width="3"/>
  <rect x="130" y="270" width="60" height="48" rx="5" fill="#d95f59" stroke="#7f211c" stroke-width="3"/>
  <text x="160" y="300" text-anchor="middle" class="label" fill="white">6 kg</text>

  <!-- Right mass and hanger -->
  <line x1="420" y1="230" x2="420" y2="270" stroke="#333" stroke-width="3"/>
  <rect x="390" y="270" width="60" height="48" rx="5" fill="#4f8fc4" stroke="#244d70" stroke-width="3"/>
  <text x="420" y="300" text-anchor="middle" class="label" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="160" y1="125" x2="160" y2="262" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="160" y="110" text-anchor="middle" class="label">6g downward</text>

  <line x1="420" y1="125" x2="420" y2="262" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="420" y="110" text-anchor="middle" class="label">4g downward</text>

  <!-- Distance dimensions -->
  <line x1="160" y1="350" x2="300" y2="350" stroke="#555" stroke-width="2"/>
  <line x1="160" y1="342" x2="160" y2="358" stroke="#555" stroke-width="2"/>
  <line x1="300" y1="342" x2="300" y2="358" stroke="#555" stroke-width="2"/>
  <text x="230" y="375" text-anchor="middle" class="label">2 m left</text>

  <line x1="300" y1="350" x2="420" y2="350" stroke="#555" stroke-width="2"/>
  <line x1="420" y1="342" x2="420" y2="358" stroke="#555" stroke-width="2"/>
  <text x="360" y="375" text-anchor="middle" class="label">x = 3 m right</text>

  <!-- Torque equation and result -->
  <text x="300" y=" fifty" text-anchor="middle" class="bold">balanced</text>
  <text x="300" y="82" text-anchor="middle" class="label">Torque equilibrium:</text>
  <text x="300" y="52" text-anchor="middle" class="label">6 × 2 = 4 × 3</text>
</svg>