<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#222">Level Seesaw — Static Equilibrium</text>

  <!-- seesaw beam -->
  <rect x="90" y="210" width="420" height="20" rx="6" fill="#c98b45" stroke="#633d1f" stroke-width="3"/>
  <!-- pivot -->
  <polygon points="300,230 260,300 340,300" fill="#6b7280" stroke="#374151" stroke-width="3"/>
  <circle cx="300" cy="220" r="8" fill="#374151"/>
  <text x="300" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">pivot</text>

  <!-- left mass -->
  <rect x="155" y="150" width="50" height="50" rx="5" fill="#4f86c6" stroke="#1e3a5f" stroke-width="3"/>
  <text x="180" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">6 kg</text>
  <line x1="180" y1="120" x2="180" y2="145" stroke="#b91c1c" stroke-width="4"/>
  <polygon points="180,155 172,140 188,140" fill="#b91c1c"/>
  <text x="180" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#b91c1c">F = 6g</text>

  <!-- right mass -->
  <rect x="395" y="150" width="50" height="50" rx="5" fill="#e28b45" stroke="#7c3415" stroke-width="3"/>
  <text x="420" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">4 kg</text>
  <line x1="420" y1="120" x2="420" y2="145" stroke="#b91c1c" stroke-width="4"/>
  <polygon points="420,155 412,140 428,140" fill="#b91c1c"/>
  <text x="420" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#b91c1c">F = 4g</text>

  <!-- distance markers -->
  <line x1="180" y1="260" x2="300" y2="260" stroke="#2563eb" stroke-width="3"/>
  <line x1="180" y1="252" x2="180" y2="268" stroke="#2563eb" stroke-width="3"/>
  <line x1="300" y1="252" x2="300" y2="268" stroke="#2563eb" stroke-width="3"/>
  <text x="240" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">2 m</text>

  <line x1="300" y1="260" x2="420" y2="260" stroke="#2563eb" stroke-width="3"/>
  <line x1="420" y1="252" x2="420" y2="268" stroke="#2563eb" stroke-width="3"/>
  <text x="360" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">x = 3 m</text>

  <!-- equation and status -->
  <text x="300" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#222">6 × 2 = 4 × 3</text>
  <text x="300" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#15803d">balanced</text>
</svg>