<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b3261e"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="24" font-weight="bold" fill="#222">Level Seesaw — Static Equilibrium</text>

  <!-- seesaw plank -->
  <rect x="90" y="190" width="420" height="20" rx="8" fill="#8b5a2b" stroke="#4a2c14" stroke-width="3"/>

  <!-- pivot -->
  <path d="M270 285 L300 210 L330 285 Z" fill="#6b7280" stroke="#374151" stroke-width="3"/>
  <line x1="250" y1="285" x2="350" y2="285" stroke="#374151" stroke-width="5"/>
  <circle cx="300" cy="200" r="7" fill="#f59e0b" stroke="#7c4a03" stroke-width="2"/>
  <text x="300" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">pivot</text>

  <!-- left hanging mass -->
  <line x1="160" y1="210" x2="160" y2="255" stroke="#333" stroke-width="3"/>
  <rect x="130" y="255" width="60" height="48" rx="6" fill="#4f81bd" stroke="#244a73" stroke-width="3"/>
  <text x="160" y="285" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="bold" fill="white">6 kg</text>
  <line x1="160" y1="235" x2="160" y2="250" stroke="#b3261e" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="160" y="232" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="15" fill="#b3261e">force</text>

  <!-- right hanging mass -->
  <line x1="440" y1="210" x2="440" y2="255" stroke="#333" stroke-width="3"/>
  <rect x="410" y="255" width="60" height="48" rx="6" fill="#d97706" stroke="#8a4b04" stroke-width="3"/>
  <text x="440" y="285" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="bold" fill="white">4 kg</text>
  <line x1="440" y1="235" x2="440" y2="250" stroke="#b3261e" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="440" y="232" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="15" fill="#b3261e">force</text>

  <!-- distance dimensions -->
  <line x1="160" y1="155" x2="300" y2="155" stroke="#222" stroke-width="2"/>
  <line x1="160" y1="148" x2="160" y2="162" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="148" x2="300" y2="162" stroke="#222" stroke-width="2"/>
  <text x="230" y="145" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17" fill="#222">2 m</text>

  <line x1="300" y1="115" x2="440" y2="115" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="108" x2="300" y2="122" stroke="#222" stroke-width="2"/>
  <line x1="440" y1="108" x2="440" y2="122" stroke="#222" stroke-width="2"/>
  <text x="370" y="105" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17" fill="#222">3 m (x)</text>

  <!-- balance statement -->
  <text x="300" y="350" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#16803c">balanced</text>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="20" fill="#222">6 × 2 = 4 × 3  →  x = 3 m</text>
</svg>