<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican rides a bicycle with a fish in its bill pouch. The wheels turn and the pelican bobs as it pedals.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#f2c96a" opacity=".45"/>
    </pattern>
    <style>
      .ink { stroke:#26333a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 1s ease-in-out infinite; }
      .pedal { transform-origin:365px 383px; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#fff2c9" stroke="#26333a" stroke-width="5"/>
  <rect x="26" y="26" width="748" height="480" rx="16" fill="#bde9e6"/>
  <rect x="26" y="26" width="748" height="480" rx="16" fill="url(#dots)" opacity=".55"/>

  <text x="400" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#26333a">THE DAILY COMMUTE</text>
  <path d="M75 105h650" stroke="#26333a" stroke-width="4" stroke-linecap="round"/>
