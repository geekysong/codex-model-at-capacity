    <path d="M83 174c-4-19 22-28 34-15 10-26 49-22 54 4 24-4 32 18 20 27H89c-8-3-10-9-6-16z"/>
    <path d="M588 145c1-16 22-23 32-11 8-21 40-19 45 3 21-3 27 14 17 22h-89c-5-3-7-8-5-14z"/>
  </g>
  <path d="M28 445 Q170 425 306 444 T570 441 T772 442 V506 H28Z" fill="#eac87a"/>
  <path d="M29 458 H772" stroke="#26333a" stroke-width="5"/>
  <path d="M70 474h70m42 0h70m42 0h70m42 0h70m42 0h70m42 0h70" stroke="#fff7df" stroke-width="5" stroke-linecap="round"/>

  <g class="wheel">
    <circle cx="235" cy="397" r="70" fill="#fff9e9" stroke="#26333a" stroke-width="9"/>
    <circle cx="235" cy="397" r="57" fill="none" stroke="#ef865e" stroke-width="4"/>
    <path d="M235 328v138m-69-69h138m-118-49 98 98m0-98-98 98" fill="none" stroke="#849a9a" stroke-width="3"/>
    <circle cx="235" cy="397" r="8" fill="#26333a"/>
