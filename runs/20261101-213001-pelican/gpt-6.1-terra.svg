    <circle cx="535" cy="397" r="8" fill="#26333a"/>
  </g>

  <g class="ink" fill="none">
    <path d="M235 397 305 307 365 383 235 397 340 313 365 383 470 310 535 397" stroke="#e35d42" stroke-width="10"/>
    <path d="M305 307h50" stroke="#26333a" stroke-width="8"/>
