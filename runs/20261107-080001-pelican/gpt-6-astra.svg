<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican pedals for lunch</title>
  <desc id="description">A determined pelican rides a tiny bicycle, carrying fish in its enormous beak pouch. The wheels spin, its feet pedal, and its body bobs. Caption: Zero emissions. Suspicious fish mileage.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r=".7" fill="#dfd8bd"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fffbea" stroke="#263747" stroke-width="12"/>
      <circle r="67" fill="#def1ef" stroke="#879b9e" stroke-width="2"/>
      <g stroke="#819698" stroke-width="3">
        <path d="M-66 0H66M0-66V66M-47-47L47 47M-47 47L47-47"/>
        <path d="M-61-25L61 25M-25-61L25 61M-61 25L61-25M-25 61L25-61"/>
      </g>
      <path d="M-17-70A72 72 0 0 1 17-70" fill="none" stroke="#f9b83f" stroke-width="6" stroke-linecap="round"/>
      <circle r="9" fill="#263747"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect width="800" height="600" fill="url(#paper)" opacity=".6"/>
  <path d="M0 342Q130 280 265 341T530 327T800 336V493H0Z" fill="#dce8c5"/>
  <g fill="#fffdf3">
    <path d="M52 151Q37 127 65 122Q70 96 95 111Q117 98 130 125Q153 124 154 145Z"/>
    <path d="M635 154Q615 132 640 121Q642 97 667 109Q688 89 707 118Q734 113 743 145Z"/>
  </g>

  <text x="400" y="62" text-anchor="middle" fill="#223747" font-family="Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
  <path d="M221 78H579" stroke="#f4ac36" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="108" text-anchor="middle" fill="#53605b" font-family="Arial, sans-serif" font-size="18" font-weight="bold">THE COMMUTE THAT ATE THE LUNCH BUDGET</text>

  <!-- Road and stationary shadow -->
  <path d="M0 477H800V502H0Z" fill="#b5c5b0"/>
  <path d="M0 479H800" stroke="#738b7b" stroke-width="3"/>
  <ellipse cx="409" cy="474" rx="248" ry="13" fill="#597a70" opacity=".17"/>

  <!-- A roadside joke -->
  <g stroke="#283c44" stroke-width="3" stroke-linejoin="round">
    <path d="M691 315V463" stroke="#7b806e" stroke-width="9"/>
    <path d="M641 281H743L763 309L743 337H641Z" fill="#fffbea"/>
  </g>
  <text x="696" y="304" text-anchor="middle" fill="#283c44" font-family="Arial, sans-serif" font-size="16" font-weight="bold">FISH SHOP</text>
  <text x="696" y="325" text-anchor="middle" fill="#283c44" font-family="Arial, sans-serif" font-size="14">one more hill</text>

  <!-- Spinning wheels -->
  <g transform="translate(246 397)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550 397)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Comically small bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246 397L330 290L373 397ZM330 290L507 291L373 397M507 291L550 397" stroke="#263747" stroke-width="14"/>
    <path d="M246 397L330 290L373 397ZM330 290L507 291L373 397M507 291L550 397" stroke="#ed6752" stroke-width="8"/>
    <path d="M330 291L321 266M507 291L492 250L519 238" stroke="#263747" stroke-width="9"/>
    <path d="M300 265H344" stroke="#263747" stroke-width="13"/>
    <path d="M514 238L535 237" stroke="#ed6752" stroke-width="10"/>
    <path d="M246 397H373" stroke="#263747" stroke-width="5"/>
  </g>
  <circle cx="373" cy="397" r="22" fill="#fff7df" stroke="#263747" stroke-width="5"/>
  <g transform="translate(373 397)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#263747" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-24" r="5" fill="#f6b640"/>
      <circle cx="24" r="5" fill="#f6b640"/>
    </g>
  </g>

  <!-- The rider bobs gently while the lettering stays still -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <!-- Tail -->
    <path d="M306 251L243 220L257 253L231 249Q258 284 316 283" fill="#fbfcf0" stroke="#263747" stroke-width="4" stroke-linejoin="round"/>
    <!-- Body and long neck -->
    <path d="M302 264Q266 245 281 212Q294 184 340 196Q374 204 385 221Q404 215 407 180L407 163Q404 137 429 132Q461 126 472 153Q479 173 462 196Q451 217 453 249Q446 293 392 304Q337 311 302 264Z" fill="#fffef4" stroke="#263747" stroke-width="4"/>
    <path d="M299 225Q325 211 359 236Q380 255 371 280Q334 279 312 249" fill="#d6ded7" stroke="#263747" stroke-width="3"/>
    <path d="M317 237L346 261M310 247L333 269" stroke="#9caaa4" stroke-width="3" stroke-linecap="round"/>
    <!-- Wing reaching the handlebars -->
    <path d="M388 246Q436 232 477 249L516 239Q524 238 525 245Q503 263 478 266L410 273" fill="#fffef4" stroke="#263747" stroke-width="4" stroke-linejoin="round"/>
    <!-- Giant pouch -->
    <path d="M454 170L635 184Q610 267 526 259Q472 254 454 170Z" fill="#f5b34f" stroke="#263747" stroke-width="4"/>
    <path d="M474 199Q502 247 552 244" fill="none" stroke="#d58b35" stroke-width="3"/>
    <!-- Fish silhouettes in the pouch -->
    <g fill="#657f7b" stroke="#263747" stroke-width="2">
      <path d="M505 221Q526 199 549 216L562 204L561 229L549 222Q524 238 505 221Z"/>
      <path d="M556 234Q575 214 595 224L607 215L605 238L594 231Q577 245 556 234Z"/>
    </g>
    <circle cx="515" cy="218" r="2.5" fill="#fff"/>
    <circle cx="565" cy="231" r="2.5" fill="#fff"/>
    <!-- Long upper bill -->
    <path d="M452 161Q530 158 648 182Q651 186 642 189L455 182Z" fill="#ffd164" stroke="#263747" stroke-width="4" stroke-linejoin="round"/>
    <path d="M480 173L612 182" stroke="#db9235" stroke-width="2"/>
    <!-- Determined face -->
    <ellipse cx="444" cy="155" rx="12" ry="14" fill="white" stroke="#263747" stroke-width="3"/>
    <circle cx="449" cy="157" r="5" fill="#263747"/>
    <path d="M429 137L453 143" stroke="#263747" stroke-width="5" stroke-linecap="round"/>
    <!-- Little cycling helmet -->
    <path d="M400 136Q406 108 436 113Q461 115 470 137Z" fill="#ed6752" stroke="#263747" stroke-width="4"/>
    <path d="M417 120L413 133M433 119L433 134M448 122L453 135" stroke="#263747" stroke-width="4"/>
    <path d="M408 139L417 177L433 185" fill="none" stroke="#263747" stroke-width="3"/>
    <!-- Sweat -->
    <path d="M478 124Q490 108 488 101Q500 117 490 125Z" fill="#69b9c9"/>
    <!-- Pedaling legs -->
    <g stroke="#263747" stroke-width="4" stroke-linejoin="round">
      <path d="M350 294L337 332L392 374" fill="none" stroke="#e6a13e" stroke-width="11">
        <animate attributeName="d" values="M350 294L337 332L392 374;M350 294L326 349L355 408;M350 294L337 332L392 374" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M389 369L417 380L382 382Z" fill="#f5b34f">
        <animateTransform attributeName="transform" type="translate" values="0 0;-37 34;0 0" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Motion marks and speech -->
  <g fill="none" stroke="#718c82" stroke-width="4" stroke-linecap="round">
    <path d="M151 312H207M163 327H194M119 343H186"/>
  </g>
  <path d="M74 166Q74 151 91 151H258Q275 151 275 168V198Q275 213 258 213H235L261 235L211 213H91Q74 213 74 196Z" fill="#fffef8" stroke="#263747" stroke-width="3"/>
  <text x="175" y="177" text-anchor="middle" fill="#263747" font-family="Arial, sans-serif" font-size="18" font-weight="bold">“It's all about</text>
  <text x="175" y="200" text-anchor="middle" fill="#263747" font-family="Arial, sans-serif" font-size="18" font-weight="bold">the carbo-loading.”</text>

  <!-- Dedicated, unobstructed footer -->
  <rect y="503" width="800" height="97" fill="#263747"/>
  <text x="400" y="539" text-anchor="middle" fill="#fff7df" font-family="Arial, sans-serif" font-size="23" font-weight="bold">Zero emissions. Suspicious fish mileage.</text>
  <text x="400" y="578" text-anchor="middle" fill="#d8e9e6" font-family="Arial, sans-serif" font-size="17">2026-11-07 08:00:01 SGT (UTC+08:00)</text>
</svg>