      <path d="M430 430 L455 410 M430 430 L405 450" fill="none" class="ink"/>
      <path d="M455 410 h22 M405 450 h-22" class="ink"/>
    </g>
  </g>

  <g class="rider" filter="url(#shadow)">
    <ellipse cx="420" cy="278" rx="92" ry="72" fill="#f3f0df" class="ink"/>
    <path d="M350 275 Q315 235 335 192 Q355 155 400 168 Q430 128 478 157 Q515 180 500 225 Q495 260 460 278Z" fill="#f3f0df" class="ink"/>
    <path d="M401 202 Q470 208 555 250 Q585 265 562 287 Q535 303 495 276 L420 240Z" fill="#f3f0df" class="ink"/>
    <path d="M550 250 Q624 244 675 267 Q700 280 674 295 Q615 306 555 287Z" fill="#f6b84e" class="ink"/>
