    <path d="M465 272 Q495 300 515 345" fill="none" class="ink"/>
    <path d="M515 345 Q520 375 495 382 Q470 382 470 355" fill="#f6b84e" class="ink"/>
    <path d="M395 270 Q425 310 430 350" fill="none" class="ink"/>
    <path d="M430 350 Q442 378 420 390 Q395 390 390 366" fill="#f6b84e" class="ink"/>
    <path d="M352 185 Q330 150 355 130" fill="none" stroke="#f6b84e" stroke-width="14" stroke-linecap="round"/>
    <path d="M372 178 Q350 140 380 125" fill="none" stroke="#f6b84e" stroke-width="14" stroke-linecap="round"/>
    <text x="415" y="225" class="label" font-size="17" font-weight="900" text-anchor="middle">HONK!</text>
