<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9edcff"/>
      <stop offset="1" stop-color="#e7f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b68"/>
      <stop offset="1" stop-color="#303540"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202632;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202632}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .75s ease-in-out infinite alternate}
      .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="52" fill="#ffe77a" opacity=".9"/>
  <path d="M0 310 Q110 250 220 310 T440 300 T660 310 T880 295 V410 H0Z" fill="#8cc889"/>
  <path d="M0 360 Q150 320 300 365 T600 355 T850 360 V430 H0Z" fill="#5fa86b"/>
  <path d="M0 405 Q180 380 360 410 T800 400 V600 H0Z" fill="url(#road)"/>
  <path d="M0 500 Q180 475 360 505 T800 495" fill="none" stroke="#f6d66b" stroke-width="8" stroke-dasharray="38 28"/>

  <g class="label" font-weight="900" text-anchor="middle">
    <text x="400" y="70" font-size="38" fill="#17202a">THE GREAT PELICAN COMMUTE</text>
    <text x="400" y="105" font-size="20" fill="#b23b3b">One bird. One bike. Zero navigation skills.</text>
  </g>

  <g filter="url(#shadow)">
    <g class="wheel">
      <circle cx="245" cy="430" r="72" fill="#202632"/>
      <circle cx="245" cy="430" r="62" fill="#dbe7ef" stroke="#202632" stroke-width="5"/>
      <g stroke="#6d7885" stroke-width="3">
        <path d="M245 368V492M183 430H307M201 386L289 474M289 386L201 474"/>
      </g>
      <circle cx="245" cy="430" r="9" fill="#e85d3f" stroke="#202632" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="560" cy="430" r="72" fill="#202632"/>
      <circle cx="560" cy="430" r="62" fill="#dbe7ef" stroke="#202632" stroke-width="5"/>
      <g stroke="#6d7885" stroke-width="3">
        <path d="M560 368V492M498 430H622M516 386L604 474M604 386L516 474"/>
      </g>
      <circle cx="560" cy="430" r="9" fill="#e85d3f" stroke="#202632" stroke-width="4"/>
    </g>

    <path d="M245 430 L350 330 L560 430 L430 430 Z" fill="none" class="ink"/>
    <path d="M350 330 L430 430 M350 330 L325 292 M560 430 L578 300" fill="none" class="ink"/>
    <path d="M563 300 Q600 282 620 300" fill="none" class="ink"/>
