<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly pretending it has a driving license.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#707681"/>
      <stop offset="1" stop-color="#343941"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink { stroke:#20252b; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#20252b; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { fill:none; stroke:#20252b; stroke-width:9; }
      .spoke { stroke:#65717d; stroke-width:3; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#20252b; }
      .title { font-weight:900; font-size:42px; letter-spacing:2px; }
      .caption { font-weight:700; font-size:20px; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="104" r="48" fill="#ffe177" stroke="#20252b" stroke-width="5"/>
  <path d="M0 350 Q110 300 220 350 T440 350 T660 350 T880 350 V430 H0Z" fill="#a9d58e" stroke="#20252b" stroke-width="5"/>
  <path d="M0 410 Q140 380 280 415 T560 410 T840 420 V600 H0Z" fill="url(#road)"/>
  <path d="M35 485 H765" stroke="#f7d35b" stroke-width="8" stroke-dasharray="45 30"/>

  <g filter="url(#shadow)">
    <rect x="188" y="34" width="424" height="76" rx="18" fill="#fff7d6" class="ink"/>
    <text x="400" y="86" text-anchor="middle" class="label title">PELICAN PEDAL PANIC</text>
  </g>

  <g class="label">
    <path d="M555 142 Q628 126 692 154" fill="none" class="thin"/>
    <path d="M672 142 l22 12 -24 7" fill="#fff7d6" class="ink"/>
    <text x="548" y="130" font-size="18" font-weight="700">“I passed my</text>
    <text x="563" y="151" font-size="18" font-weight="700">beak test!”</text>
  </g>

  <!-- bicycle -->
  <g id="bike">
    <g id="rearWheel">
      <circle cx="235" cy="438" r="73" class="wheel"/>
      <g class="spoke">
        <path d="M235 365V511 M162 438H308 M184 387L286 489 M286 387L184 489"/>
      </g>
      <circle cx="235" cy="438" r="9" fill="#f05d4f" class="ink"/>
    </g>
    <g id="frontWheel">
      <circle cx="555" cy="438" r="73" class="wheel"/>
      <g class="spoke">
        <path d="M555 365V511 M482 438H628 M504 387L606 489 M606 387L504 489"/>
      </g>
      <circle cx="555" cy="438" r="9" fill="#f05d4f" class="ink"/>
    </g>

    <path d="M235 438 L343 438 L415 438 L555 438 L475 319 L343 438 L235 438" fill="none" stroke="#e84f43" stroke-width="11" stroke-linejoin="round"/>
    <path d="M475 319 L487 283" class="ink" fill="none"/>
    <path d="M478 283 Q500 273 520 282" class="ink" fill="none"/>
    <path d="M343 438 L315 385" class="ink" fill="none"/>
    <path d="M299 385 H331" class="ink" fill="none"/>
    <circle cx="343" cy="438" r="15" fill="#ffd34e" class="ink"/>
    <path d="M343 438 L308 471 M343 438 L378 408" class="thin" fill="none"/>
    <circle cx="308" cy="471" r="8" fill="#20252b"/>
    <circle cx="378" cy="408" r="8" fill="#20252b"/>
    <path d="M555 438 L555 330" class="ink" fill="none"/>
  </g>

  <!-- pelican body and motion -->
  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="412" cy="292" rx="75" ry="88" fill="#f6f0dc" class="ink"/>
    <path d="M365 290 Q395 225 453 246 Q482 258 477 309 Q468 353 421 358 Q380 350 365 290Z" fill="#d5dce2" class="ink"/>
    <path d="M391 258 Q350 229 337 188 Q332 164 348 157 Q374 157 398 190 L424 236" fill="#fff6df" class="ink"/>
    <path d="M348 157 Q322 145 290 153 Q277 159 287 170 Q315 185 345 184" fill="#ef9a45" class="ink"/>
    <path d="M289 153 Q319 133 352 148" fill="none" class="thin"/>
    <circle cx="383" cy="228" r="8" fill="#20252b"/>
    <circle cx="386" cy="225" r="3" fill="#fff"/>
    <path d="M398 247 Q421 263 435 244" fill="none" class="thin"/>
    <path d="M386 319 Q420 339 451 317" fill="none" class="thin"/>
    <path d="M351 286 Q322 300 309 326 Q337 336 372 315" fill="#b9c5ce" class="ink"/>
    <path d="M399 350 L391 401" class="ink" fill="none"/>
    <path d="M442 350 L458 401" class="ink" fill="none"/>
    <path d="M374 401 Q391 410 405 401" fill="none" class="ink"/>
    <path d="M447 401 Q464 410 477 401" fill="none" class="ink"/>
    <path d="M389 401 L360 438 M458 401 L421 438" fill="none" stroke="#e84f43" stroke-width="8"/>
  </g>

  <!-- flapping wing gag -->
  <path d="M431 278 Q497 238 522 282 Q485 294 450 311" fill="#c5d0d8" class="ink">
    <animateTransform attributeName="transform" type="rotate" values="0 450 290;-12 450 290;0 450 290;10 450 290;0 450 290" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <g class="label">
    <rect x="72" y="505" width="656" height="43" rx="14" fill="#fff7d6" stroke="#20252b" stroke-width="4"/>
    <text x="400" y="533" text-anchor="middle" class="caption">A bird-brained commute: maximum wing power, minimum road sense.</text>
  </g>

  <text x="400" y="581" text-anchor="middle" class="label" font-size="14" font-weight="700">2026-10-29 06:02:04 SGT (UTC+08:00)</text>
</svg>