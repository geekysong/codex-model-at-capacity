<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636d"/>
      <stop offset="1" stop-color="#303841"/>
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style>
      .ink{stroke:#17212b;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:bold}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="105" r="58" fill="#fff4a8" opacity=".85"/>
  <path d="M0 360 Q130 285 270 350 T540 335 T800 320 V430 H0Z" fill="#7fc58b"/>
  <path d="M0 390 Q180 340 360 385 T800 365 V450 H0Z" fill="#5ba66d"/>
  <path d="M0 430 Q180 400 350 430 T800 420 V600 H0Z" fill="url(#road)"/>
  <path d="M0 492 H800" stroke="#f6d86b" stroke-width="9" stroke-dasharray="42 28"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#d74335">THE DAILY WINGNUT</text>
  <text x="400" y="96" text-anchor="middle" class="label" font-size="22" font-weight="700">Pelican takes the “beak” lane</text>

  <ellipse cx="410" cy="520" rx="220" ry="18" fill="#17212b" opacity=".28" filter="url(#shadow)"/>

  <!-- bicycle -->
  <g id="bike">
    <g fill="none" class="ink">
      <circle cx="265" cy="455" r="82" fill="#d9f4ff">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          from="0 265 455" to="360 265 455" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="585" cy="455" r="82" fill="#d9f4ff">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          from="0 585 455" to="360 585 455" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M265 455 L365 355 L465 455 L265 455 L410 455 L365 355 L430 330 L465 455"/>
      <path d="M430 330 L470 330"/>
      <path d="M365 355 L350 320"/>
      <path d="M350 320 L385 320"/>
      <path d="M410 455 L392 410"/>
      <circle cx="410" cy="455" r="13" fill="#f36c4f"/>
      <path d="M398 444 L370 427 M422 466 L450 484"/>
    </g>
    <g stroke="#17212b" stroke-width="5">
      <path d="M265 373 V537 M183 455 H347 M207 397 L323 513 M323 397 L207 513" opacity=".55"/>
      <path d="M585 373 V537 M503 455 H667 M527 397 L643 513 M643 397 L527 513" opacity=".55"/>
    </g>
  </g>

  <!-- pelican body bobbing -->
  <g id="pelican">
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="0 0; 0 -7; 0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="414" cy="267" rx="86" ry="108" fill="#f5f1e8" class="ink"/>
    <path d="M365 225 Q340 198 350 163 Q363 125 405 137 Q432 146 438 178 Q443 211 420 237Z" fill="#f5f1e8" class="ink"/>
    <circle cx="400" cy="171" r="11" fill="#17212b"/>
    <circle cx="404" cy="167" r="4" fill="#fff"/>
    <path d="M380 194 Q333 187 285 203 Q270 208 278 223 Q331 244 394 218Z" fill="#f5a33b" class="ink"/>
    <path d="M288 210 Q325 219 375 210" fill="none" stroke="#b96525" stroke-width="5"/>
    <path d="M398 260 Q448 221 478 260 Q487 279 466 291 Q429 309 397 296Z" fill="#d9dde1" class="ink"/>
    <path d="M405 350 L392 422 M450 350 L467 422" fill="none" class="ink"/>
    <path d="M382 422 Q399 416 412 425 L405 438 L376 438Z M455 422 Q470 416 483 426 L478 439 L448 439Z" fill="#f5a33b" class="ink"/>
    <path d="M390 270 Q410 282 431 270" fill="none" stroke="#c5cbd0" stroke-width="6"/>
    <path d="M368 245 Q338 260 320 285" fill="none" class="ink"/>
    <path d="M463 246 Q490 258 507 282" fill="none" class="ink"/>
    <path d="M327 286 Q292 302 276 328" fill="none" class="ink"/>
    <path d="M501 282 Q531 297 548 321" fill="none" class="ink"/>
    <path d="M278 328 Q300 337 318 328" fill="none" class="ink"/>
    <path d="M548 321 Q525 333 507 324" fill="none" class="ink"/>
  </g>

  <path d="M566 186 Q620 160 678 190" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
  <path d="M597 160 Q636 139 676 160" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>

  <g>
    <rect x="72" y="128" width="205" height="78" rx="18" fill="#fff" stroke="#17212b" stroke-width="6"/>
    <path d="M244 206 L270 231 L272 199" fill="#fff" stroke="#17212b" stroke-width="6"/>
    <text x="174" y="160" text-anchor="middle" class="label" font-size="19" font-weight="800">“I’m on a roll!”</text>
    <text x="174" y="185" text-anchor="middle" class="label" font-size="16">— literally, apparently</text>
  </g>

  <rect x="28" y="548" width="744" height="38" rx="12" fill="#fff4cf" stroke="#17212b" stroke-width="3"/>
  <text x="400" y="574" text-anchor="middle" class="label small">2026-10-29 06:01:20 SGT (UTC+08:00)</text>
</svg>