<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c62828"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #222; font-size: 18px; }
      .small { font-family: Arial, sans-serif; fill: #222; font-size: 16px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="90" y="174" width="420" height="16" rx="7" fill="#8d6e63" stroke="#4e342e" stroke-width="2"/>
  <line x1="300" y1="174" x2="300" y2="190" stroke="#4e342e" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="270,285 330,285 300,190" fill="#607d8b" stroke="#263238" stroke-width="2"/>
  <line x1="250" y1="285" x2="350" y2="285" stroke="#263238" stroke-width="5"/>
  <text x="300" y="315" text-anchor="middle" class="small">pivot</text>

  <!-- Left suspension and mass -->
  <line x1="150" y1="190" x2="150" y2="245" stroke="#333" stroke-width="3"/>
  <rect x="120" y="245" width="60" height="48" rx="5" fill="#90caf9" stroke="#1565c0" stroke-width="2"/>
  <text x="150" y="275" text-anchor="middle" class="label">6 kg</text>
  <line x1="150" y1="230" x2="150" y2="205" stroke="#c62828" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="165" y="220" class="small" fill="#c62828">F = 6g</text>

  <!-- Right suspension and mass -->
  <line x1="450" y1="190" x2="450" y2="245" stroke="#333" stroke-width="3"/>
  <rect x="420" y="245" width="60" height="48" rx="5" fill="#ffcc80" stroke="#ef6c00" stroke-width="2"/>
  <text x="450" y="275" text-anchor="middle" class="label">4 kg</text>
  <line x1="450" y1="230" x2="450" y2="205" stroke="#c62828" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="465" y="220" class="small" fill="#c62828">F = 4g</text>

  <!-- Distance dimension lines -->
  <line x1="150" y1="145" x2="300" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="138" x2="150" y2="152" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="138" x2="300" y2="152" stroke="#333" stroke-width="2"/>
  <text x="225" y="135" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="115" x2="450" y2="115" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="108" x2="300" y2="122" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="108" x2="450" y2="122" stroke="#333" stroke-width="2"/>
  <text x="375" y="105" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equilibrium annotation -->
  <text x="300" y="350" text-anchor="middle" class="label">Torque balance: 6 × 2 = 4 × 3</text>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2e7d32">BALANCED</text>
</svg>