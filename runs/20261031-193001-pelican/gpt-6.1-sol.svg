<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Commute</title>
  <desc id="description">A smug pelican pedals a bicycle with a huge fish-filled bill, passing a sign for the fish market. Wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#e9dfc5"/>
    </pattern>
