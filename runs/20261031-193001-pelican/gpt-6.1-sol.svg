      <circle r="7" fill="#e4ab49" stroke-width="3"/>
    </g>
  </defs>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#263744}
    .ink{stroke:#263744;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  </style>

