<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Pelican Getaway</title>
  <desc id="desc">A helmeted pelican pedals a bicycle, its enormous beak full of fish, while a startled fish watches from a roadside puddle.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#b9edff"/>
      <stop offset="1" stop-color="#f5fbda"/>
    </linearGradient>
    <linearGradient id="beak" x2="0" y2="1">
      <stop stop-color="#ffdc4f"/>
      <stop offset="1" stop-color="#ff8d35"/>
    </linearGradient>
    <style>
      .ink{stroke:#24334a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:none;stroke:#24334a;stroke-width:7}
      .spoke{stroke:#60758a;stroke-width:2}
      .caption{font:700 18px sans-serif;fill:#24334a}
      .small{font:600 14px sans-serif;fill:#24334a}
      @keyframes pedal{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-4px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      .rider{transform-origin:400px 325px;animation:pedal .8s ease-in-out infinite}
      .rotor{transform-origin:250px 430px;animation:spin 2s linear infinite}
      .rotor2{transform-origin:560px 430px;animation:spin 2s linear infinite}
    </style>
  </defs>

  <!-- Scene -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="685" cy="105" r="42" fill="#ffd95e"/>
  <path d="M0 355 Q100 300 210 350 T430 340 T650 345 T830 330 V500 H0Z" fill="#a9d989"/>
  <path d="M0 410 Q150 385 300 408 T600 400 T820 405 V520 H0Z" fill="#7ec477"/>
  <path d="M0 478 Q200 453 400 478 T800 465 V540 H0Z" fill="#e9d8a5"/>
  <path d="M0 510 Q180 490 390 510 T800 495" fill="none" stroke="#c6ad75" stroke-width="4"/>
  <g fill="#fff" opacity=".8">
    <ellipse cx="139" cy="122" rx="38" ry="12"/><ellipse cx="161" cy="114" rx="22" ry="17"/>
    <ellipse cx="530" cy="172" rx="31" ry="10"/><ellipse cx="548" cy="165" rx="20" ry="14"/>
  </g>

  <text x="400" y="48" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="900" fill="#24334a">THE GREAT PELICAN GETAWAY</text>
  <text x="400" y="76" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#466176">One bird. Two wheels. Absolutely no regard for the bike lane.</text>

  <!-- Bicycle wheels -->
  <g class="rotor">
    <circle class="wheel" cx="250" cy="430" r="67"/>
    <g class="spoke">
      <path d="M250 363V497M183 430H317M203 383L297 477M297 383L203 477"/>
    </g>
  </g>
  <g class="rotor2">
    <circle class="wheel" cx="560" cy="430" r="67"/>
    <g class="spoke">
      <path d="M560 363V497M493 430H627M513 383L607 477M607 383L513 477"/>
    </g>
  </g>
  <g fill="none" class="ink">
    <path d="M250 430 L345 430 L392 345 L445 430 L560 430 L445 430 L405 430 L345 430"/>
    <path d="M345 430 L324 394 M309 394H337"/>
    <path d="M445 430 L468 386 M454 386H482"/>
  </g>
  <circle cx="345" cy="430" r="10" fill="#ffbc3f" class="ink"/>
  <path d="M345 430l22 16m-22-16-18-17" class="ink" fill="none"/>
  <circle cx="250" cy="430" r="6" fill="#24334a"/>
  <circle cx="560" cy="430" r="6" fill="#24334a"/>

  <!-- Pelican and rider motion -->
  <g class="rider">
    <!-- tail and body -->
    <path d="M346 329 Q314 304 298 322 Q319 342 351 347Z" fill="#f8f6ed" class="ink"/>
    <ellipse cx="389" cy="315" rx="61" ry="44" fill="#fffdf4" class="ink"/>
    <path d="M365 316 Q391 284 425 302 Q415 332 380 345Z" fill="#dfeefa" stroke="#24334a" stroke-width="4"/>
    <!-- neck -->
    <path d="M420 316 Q438 285 429 252 Q420 226 447 208" fill="none" stroke="#24334a" stroke-width="22" stroke-linecap="round"/>
    <path d="M420 316 Q438 285 429 252 Q420 226 447 208" fill="none" stroke="#fffdf4" stroke-width="14" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="458" cy="203" rx="37" ry="31" fill="#fffdf4" class="ink"/>
    <!-- helmet -->
    <path d="M426 202 Q430 163 463 162 Q493 164 499 202Z" fill="#ff704f" class="ink"/>
    <path d="M420 203 Q460 194 503 204" fill="none" stroke="#24334a" stroke-width="6" stroke-linecap="round"/>
    <path d="M450 168l-4 27m25-25 5 25" stroke="#ffd7a8" stroke-width="4" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="469" cy="202" r="6" fill="#24334a"/>
    <circle cx="471" cy="200" r="2" fill="#fff"/>
    <!-- beak and comically full pouch -->
    <path d="M480 212 Q531 211 598 237 Q568 264 501 246 Q484 238 480 212Z" fill="url(#beak)" class="ink"/>
    <path d="M492 234 Q541 240 589 239 Q577 271 535 271 Q503 268 492 234Z" fill="#ffb54c" class="ink"/>
    <!-- fish peeking from pouch -->
    <path d="M532 251 Q547 236 562 248 Q547 261 532 251Z" fill="#6bd3cf" stroke="#24334a" stroke-width="3"/>
    <path d="M532 251l-10-8v16z" fill="#6bd3cf" stroke="#24334a" stroke-width="3"/>
    <circle cx="555" cy="248" r="2.5" fill="#24334a"/>
    <!-- wing -->
    <path d="M365 311 Q390 294 414 312 Q400 336 374 338Z" fill="#f2f4ed" stroke="#24334a" stroke-width="4"/>
    <path d="M378 316l23 8m-18-15 22 8" stroke="#9eafba" stroke-width="3" stroke-linecap="round"/>
    <!-- legs to pedals -->
    <path d="M385 347 Q371 374 363 409 L345 430" fill="none" stroke="#f1a52e" stroke-width="8" stroke-linecap="round"/>
    <path d="M409 345 Q423 374 400 402 L367 446" fill="none" stroke="#f1a52e" stroke-width="8" stroke-linecap="round"/>
    <path d="M334 431l23 1m-1 11 21 3" stroke="#24334a" stroke-width="6" stroke-linecap="round"/>
    <!-- scarf -->
    <path d="M430 227 Q443 235 460 225 L455 239 Q439 246 428 236Z" fill="#fa5c5c" stroke="#24334a" stroke-width="3"/>
    <path d="M433 237 Q414 247 405 265 Q429 260 442 242Z" fill="#fa5c5c" stroke="#24334a" stroke-width="3"/>
  </g>

  <!-- Comic exclamation and roadside fish -->
  <path d="M610 168l16-24 3 23 23-12-13 24 22 3-26 11" fill="none" stroke="#f05b4f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="631" y="136" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#f05b4f">WHEEE!</text>
  <ellipse cx="139" cy="469" rx="44" ry="10" fill="#9ecbe0"/>
  <path d="M119 461 Q135 440 157 458 Q137 477 119 461Z" fill="#ff9c52" stroke="#24334a" stroke-width="3"/>
  <path d="M119 461l-13-10v20z" fill="#ff9c52" stroke="#24334a" stroke-width="3"/>
  <circle cx="150" cy="457" r="2.5" fill="#24334a"/>
  <text x="105" y="425" font-family="sans-serif" font-size="14" font-weight="700" fill="#24334a">“That’s my lunch!”</text>

  <!-- Footer with clear separation from scene -->
  <rect x="0" y="535" width="800" height="65" fill="#fffdf4"/>
  <path d="M0 535H800" stroke="#24334a" stroke-width="3"/>
  <text x="400" y="562" text-anchor="middle" class="caption">“I’m not speeding. I’m just letting gravity do the honking!”</text>
  <text x="400" y="587" text-anchor="middle" class="small">2026-10-31 19:31:58 SGT (UTC+08:00)</text>
</svg>