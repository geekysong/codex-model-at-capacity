  <rect x="0" y="495" width="800" height="105" fill="#243548"/>
  <text x="400" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff5db">He ditched the car. Kept the oversized bill.</text>
