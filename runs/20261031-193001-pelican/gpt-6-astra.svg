<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish in its enormous bill pouch. Spinning wheels and bobbing motion loop continuously.</desc>
  <defs>
    <pattern id="spokes" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12L12 0" stroke="#fff" stroke-width="2"/>
    </pattern>
