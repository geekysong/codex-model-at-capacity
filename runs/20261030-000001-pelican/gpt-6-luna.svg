<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Punctual Pelican</title>
  <desc id="description">A determined pelican rides a bicycle, with a fish in its beak and a tiny helmet. The wheels spin while the pelican pedals and bobs.</desc>
  <defs>
    <style>
      .ink{stroke:#17324a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .6s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-5px)}}
    </style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="#bceeff"/>
  <circle cx="682" cy="102" r="47" fill="#ffe27a"/>
  <path d="M0 358 Q135 325 270 355 T540 350 T800 345 V510 H0Z" fill="#79d3a3"/>
  <path d="M0 393 Q160 367 320 394 T640 388 T800 380 V510 H0Z" fill="#55bd88"/>
  <path d="M95 145h90m-56-21 18 21-18 21M545 220h77m-44-19 17 19-17 19" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M0 472 Q200 458 400 472 T800 468" fill="none" stroke="#17324a" stroke-width="4" stroke-dasharray="12 14" opacity=".5"/>

  <!-- Title -->
  <text x="400" y="54" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="34" font-weight="900" fill="#17324a">PUNCTUAL PELICAN</text>
  <text x="400" y="82" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="16" font-weight="700" fill="#31566d">“I’m on the beak of being late!”</text>

  <!-- Bicycle wheels -->
  <g class="spin" aria-label="spinning rear wheel">
    <circle cx="237" cy="411" r="67" fill="#f7fbff" stroke="#17324a" stroke-width="8"/>
    <circle cx="237" cy="411" r="8" fill="#ef6b5a"/>
    <path d="M237 344v134M170 411h134M190 364l94 94m0-94-94 94" stroke="#8aa6b5" stroke-width="3"/>
  </g>
  <g class="spin" aria-label="spinning front wheel">
    <circle cx="545" cy="411" r="67" fill="#f7fbff" stroke="#17324a" stroke-width="8"/>
    <circle cx="545" cy="411" r="8" fill="#ef6b5a"/>
    <path d="M545 344v134M478 411h134M498 364l94 94m0-94-94 94" stroke="#8aa6b5" stroke-width="3"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M237 411 320 326 390 411 237 411 357 411 444 321 545 411"/>
    <path d="m390 411 54-90m-10 0h44m-160 5-26-8m-15 3h-34"/>
    <path d="M320 326h37" stroke-width="8"/>
    <circle cx="357" cy="411" r="17" fill="#ffd166"/>
    <path d="M357 411l-16-19m16 19 21 13" stroke-width="6"/>
  </g>
  <path d="M444 321 465 305" fill="none" class="ink"/>
  <path d="M459 302h31" fill="none" class="ink"/>

  <!-- Pelican rider -->
  <g class="rider">
    <!-- tail feathers -->
    <path d="M309 276q-37-16-46 4 24 17 47 10" fill="#f4f0df" class="ink"/>
    <!-- body -->
    <ellipse cx="352" cy="267" rx="61" ry="47" fill="#fffdf2" class="ink"/>
    <path d="M328 281q25 25 65 13-14 24-45 19-17-8-20-32Z" fill="#d7e6e8" stroke="#17324a" stroke-width="3"/>
    <!-- neck and head -->
    <path d="M377 263q16-52 45-80" fill="none" stroke="#fffdf2" stroke-width="27" stroke-linecap="round"/>
    <path d="M377 263q16-52 45-80" fill="none" class="ink"/>
    <ellipse cx="432" cy="174" rx="42" ry="34" fill="#fffdf2" class="ink"/>
    <!-- helmet -->
    <path d="M395 165q7-37 39-37 27 0 38 28l-77 9Z" fill="#ef6b5a" class="ink"/>
    <path d="M398 165h77" fill="none" class="ink"/>
    <circle cx="438" cy="151" r="4" fill="#fff5df"/>
    <!-- eye and expression -->
    <circle cx="447" cy="172" r="7" fill="#17324a"/>
    <circle cx="449" cy="170" r="2" fill="#fff"/>
    <path d="M440 162q11-9 21-1" fill="none" stroke="#17324a" stroke-width="4" stroke-linecap="round"/>
    <!-- long beak and pouch -->
    <path d="M464 183q59 0 94 19-37 17-91 6Z" fill="#f2ad35" class="ink"/>
    <path d="M466 190q36 8 53 29-27 10-51-4" fill="#f5c553" stroke="#17324a" stroke-width="4" stroke-linejoin="round"/>
    <!-- fish in beak -->
    <path d="M535 183q15-11 29 0-14 12-29 0Zm-1 0-10-8v16Z" fill="#4fabc4" stroke="#17324a" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="550" cy="181" r="1.8" fill="#17324a"/>
    <!-- wings -->
    <path d="M329 255q26-22 53 2-22 21-49 16" fill="#e3eeee" stroke="#17324a" stroke-width="4" stroke-linejoin="round"/>
    <!-- handlebars-reaching wing -->
    <path d="M387 252q30 17 60 49" fill="none" stroke="#fffdf2" stroke-width="16" stroke-linecap="round"/>
    <path d="M387 252q30 17 60 49" fill="none" stroke="#17324a" stroke-width="4" stroke-linecap="round"/>
    <path d="M439 300q11 5 17 0" fill="none" stroke="#f2ad35" stroke-width="8" stroke-linecap="round"/>
    <!-- legs pedaling -->
    <path d="M345 302q17 22 38 30l-20 28" fill="none" stroke="#f2ad35" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M382 332q-14 5-19 28m-6 0h20" fill="none" stroke="#17324a" stroke-width="5" stroke-linecap="round"/>
    <path d="M372 300q-1 24-25 39l17 19" fill="none" stroke="#f2ad35" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M364 358q8 12 22 8" fill="none" stroke="#17324a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Motion marks and speech bubble -->
  <path d="M279 204l-23-8m24 23-29 1m268 24 21-10" fill="none" stroke="#ef6b5a" stroke-width="5" stroke-linecap="round"/>
  <path d="M570 117q0-13 14-13h145q14 0 14 13v48q0 13-14 13h-90l-19 19 3-19h-39q-14 0-14-13Z" fill="#fffdf2" stroke="#17324a" stroke-width="4"/>
  <text x="650" y="138" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="14" font-weight="800" fill="#17324a">FISH DELIVERY:</text>
  <text x="650" y="158" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="14" font-weight="800" fill="#ef6b5a">FULL SPEED AHEAD!</text>

  <!-- Footer with date label -->
  <rect x="0" y="510" width="800" height="90" fill="#17324a"/>
  <text x="400" y="548" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#fffdf2">Two wheels, one fish, absolutely no brakes.</text>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#bceeff">2026-10-30 00:02:57 SGT (UTC+08:00)</text>
</svg>