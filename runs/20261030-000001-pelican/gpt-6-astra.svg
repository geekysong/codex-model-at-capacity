<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish-filled bill pouch. Both wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
