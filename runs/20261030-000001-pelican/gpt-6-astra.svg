    <text x="660" y="280" text-anchor="middle" font-size="17" font-weight="bold">“Company car?</text>
    <text x="660" y="304" text-anchor="middle" font-size="17" font-weight="bold">I took the perch.”</text>

    <text x="400" y="528" text-anchor="middle" font-size="21" font-weight="bold">He carries his lunch. His lunch files a complaint.</text>
    <path d="M60 547H740" stroke="#c5bca4" stroke-width="1"/>
