<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICAN GETAWAY</title>
  <desc id="desc">A comic pelican rides a bicycle while proudly carrying an absurdly oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636d"/>
      <stop offset="1" stop-color="#323a42"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17212b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#182431;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#182431}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#182431}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="43" fill="#fff5ae" opacity=".9"/>
  <path d="M0 352 Q110 305 220 350 T440 345 T660 350 T800 330 V430 H0Z" fill="#8acb83"/>
  <path d="M0 405 Q190 380 370 410 T800 395 V540 H0Z" fill="#5eaa62"/>
  <path d="M0 492 Q220 464 410 493 T800 480 V560 H0Z" fill="url(#road)"/>
  <path d="M0 543 H800" stroke="#f2d47a" stroke-width="8" stroke-dasharray="48 28"/>

  <g filter="url(#shadow)">
    <rect x="78" y="24" width="644" height="88" rx="20" fill="#fffdf2" class="ink"/>
    <text x="400" y="65" text-anchor="middle" class="label" font-size="31">THE GREAT PELICAN GETAWAY</text>
    <text x="400" y="94" text-anchor="middle" class="small" font-size="17">One bird. One bicycle. Absolutely no sensible cargo policy.</text>
  </g>

  <g transform="translate(0 4)">
    <!-- bicycle wheels -->
    <g class="ink" fill="none">
      <circle cx="245" cy="455" r="72" fill="#eaf4f7"/>
      <circle cx="560" cy="455" r="72" fill="#eaf4f7"/>
    </g>
    <g id="wheelSpin" class="ink" fill="none">
      <path d="M245 455 L245 383 M245 455 L245 527 M245 455 L173 455 M245 455 L317 455 M245 455 L194 404 M245 455 L296 506 M245 455 L296 404 M245 455 L194 506"/>
      <path d="M560 455 L560 383 M560 455 L560 527 M560 455 L488 455 M560 455 L632 455 M560 455 L509 404 M560 455 L611 506 M560 455 L611 404 M560 455 L509 506"/>
      <animateTransform attributeName="transform" type="rotate" from="0 245 455" to="360 245 455" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <g class="ink" fill="none">
      <path d="M245 455 L335 365 L455 455 L245 455 M335 365 L390 455 L560 455 L455 455 M335 365 L315 340"/>
      <circle cx="390" cy="455" r="15" fill="#f7c84b"/>
      <path d="M390 455 L372 427 M390 455 L412 482" stroke-width="9"/>
      <path d="M315 340 H350" stroke-width="9"/>
    </g>
    <g id="pedals">
      <path d="M390 455 L372 427 M390 455 L412 482" class="ink" fill="none" stroke-width="8"/>
      <animateTransform attributeName="transform" type="rotate" from="0 390 455" to="360 390 455" dur="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- pelican body and bobbing -->
    <g id="pelican" transform="translate(0 0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.6s" repeatCount="indefinite"/>
      <ellipse cx="390" cy="308" rx="78" ry="91" fill="#f7f4e8" class="ink"/>
      <path d="M342 285 Q390 240 438 285 Q421 325 390 336 Q359 325 342 285Z" fill="#f0b83e" class="ink"/>
      <path d="M350 286 Q390 308 430 286" fill="none" class="ink"/>
      <path d="M442 244 Q483 207 521 232 Q540 245 522 262 L450 280Z" fill="#f7f4e8" class="ink"/>
      <path d="M509 236 Q584 250 625 281 Q635 290 622 300 Q572 302 519 267Z" fill="#ef9e35" class="ink"/>
      <path d="M622 281 Q650 285 665 300 Q647 314 622 300" fill="#e9802e" class="ink"/>
      <circle cx="484" cy="239" r="8" fill="#182431"/>
      <path d="M365 354 Q390 375 415 354" fill="none" class="ink"/>
      <path d="M345 351 L302 385 L334 400 L370 367Z" fill="#d8dee0" class="ink"/>
      <path d="M435 351 L475 388 L447 403 L412 368Z" fill="#d8dee0" class="ink"/>
      <path d="M356 391 L340 436 M424 391 L440 436" class="ink" fill="none" stroke-width="10"/>
      <path d="M329 438 Q340 448 353 438 M429 438 Q442 448 454 438" class="ink" fill="none" stroke-width="7"/>
      <!-- ridiculous fish cargo -->
      <path d="M270 245 Q210 205 158 240 Q203 270 270 258Z" fill="#72c9d4" class="ink"/>
      <path d="M159 240 L128 218 L139 250 L128 277 L159 258" fill="#4fa9ba" class="ink"/>
      <circle cx="196" cy="239" r="5" fill="#182431"/>
      <path d="M231 230 Q247 245 231 258" fill="none" class="ink" stroke-width="3"/>
      <path d="M271 247 L303 271" class="ink" fill="none" stroke-width="7"/>
      <text x="177" y="202" class="small" font-size="15" transform="rotate(-12 177 202)">EMERGENCY SNACK</text>
    </g>
  </g>

  <g transform="translate(0 4)">
    <path d="M95 425 Q125 400 151 425" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M110 445 Q140 420 166 445" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="650" y="410" class="label" font-size="18" transform="rotate(8 650 410)">HONK!</text>
    <text x="650" y="433" class="small" font-size="14" transform="rotate(8 650 433)">MOVE, LANDLUBBERS!</text>
  </g>

  <rect x="38" y="560" width="724" height="30" rx="10" fill="#fffdf2" class="ink"/>
  <text x="400" y="581" text-anchor="middle" class="small" font-size="16">2026-10-29 12:00:09 SGT (UTC+08:00)</text>
</svg>