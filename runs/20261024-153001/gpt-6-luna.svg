<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">
    Level Seesaw — Static Equilibrium
  </text>

  <!-- Seesaw beam -->
  <rect x="90" y="174" width="420" height="18" rx="9" fill="#b8793f" stroke="#5b3822" stroke-width="3"/>
  <circle cx="300" cy="183" r="7" fill="#5b3822"/>

  <!-- Pivot -->
  <polygon points="300,192 265,270 335,270" fill="#78909c" stroke="#37474f" stroke-width="3"/>
  <line x1="245" y1="270" x2="355" y2="270" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#263238">pivot</text>

  <!-- Left mass and hanger -->
  <line x1="150" y1="192" x2="150" y2="228" stroke="#263238" stroke-width="3"/>
  <rect x="120" y="228" width="60" height="48" rx="6" fill="#e57373" stroke="#8e3030" stroke-width="3"/>
  <text x="150" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="white">6 kg</text>

  <!-- Right mass and hanger -->
  <line x1="450" y1="192" x2="450" y2="228" stroke="#263238" stroke-width="3"/>
  <rect x="420" y="228" width="60" height="48" rx="6" fill="#64b5f6" stroke="#245b86" stroke-width="3"/>
  <text x="450" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="120" x2="150" y2="218" stroke="#c62828" stroke-width="4"/>
  <polygon points="150,228 141,211 159,211" fill="#c62828"/>
  <text x="150" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c62828">weight</text>

  <line x1="450" y1="120" x2="450" y2="218" stroke="#1565c0" stroke-width="4"/>
  <polygon points="450,228 441,211 459,211" fill="#1565c0"/>
  <text x="450" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1565c0">weight</text>

  <!-- Distance dimension lines -->
  <line x1="150" y1="328" x2="300" y2="328" stroke="#455a64" stroke-width="2"/>
  <line x1="150" y1="319" x2="150" y2="337" stroke="#455a64" stroke-width="2"/>
  <line x1="300" y1="319" x2="300" y2="337" stroke="#455a64" stroke-width="2"/>
  <polygon points="150,328 162,322 162,334" fill="#455a64"/>
  <polygon points="300,328 288,322 288,334" fill="#455a64"/>
  <text x="225" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#263238">2 m</text>

  <line x1="300" y1="328" x2="450" y2="328" stroke="#455a64" stroke-width="2"/>
  <line x1="450" y1="319" x2="450" y2="337" stroke="#455a64" stroke-width="2"/>
  <polygon points="300,328 312,322 312,334" fill="#455a64"/>
  <polygon points="450,328 438,322 438,334" fill="#455a64"/>
  <text x="375" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#263238">x = 3 m</text>

  <!-- Torque equation and conclusion -->
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17324d">
    6 × 2 = 4 × 3
  </text>
  <text x="535" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2e7d32" transform="rotate(90 535 185)">
    BALANCED
  </text>
</svg>