<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4e79"/>
    </marker>
    <marker id="dim" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Level seesaw -->
  <rect x="75" y="190" width="450" height="20" rx="4" fill="#c58b4e" stroke="#603813" stroke-width="2"/>
  <line x1="300" y1="175" x2="300" y2="225" stroke="#603813" stroke-width="3"/>
  <path d="M270 270 L300 215 L330 270 Z" fill="#777" stroke="#333" stroke-width="2"/>
  <line x1="250" y1="270" x2="350" y2="270" stroke="#333" stroke-width="3"/>

  <!-- Hanging masses -->
  <line x1="220" y1="210" x2="220" y2="265" stroke="#333" stroke-width="2"/>
  <rect x="190" y="265" width="60" height="45" rx="5" fill="#d9534f" stroke="#7a1f1b" stroke-width="2"/>
  <text x="220" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white">6 kg</text>

  <line x1="420" y1="210" x2="420" y2="265" stroke="#333" stroke-width="2"/>
  <rect x="390" y="265" width="60" height="45" rx="5" fill="#4f81bd" stroke="#1f3d63" stroke-width="2"/>
  <text x="420" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="220" y1="145" x2="220" y2="255" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="220" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f4e79">6 kg force</text>

  <line x1="420" y1="145" x2="420" y2="255" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f4e79">4 kg force</text>

  <!-- Distance labels -->
  <line x1="220" y1="175" x2="300" y2="175" stroke="#555" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="260" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">2 m</text>

  <line x1="300" y1="175" x2="420" y2="175" stroke="#555" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="360" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">x = 3 m</text>

  <text x="300" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222">6 × 2 = 4 × 3</text>
  <text x="300" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#198754">BALANCED</text>
</svg>