<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish-filled bill pouch, declaring the fish to be his support team. Wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
