  <text x="400" y="458" text-anchor="middle" font-size="18" font-weight="800" fill="#263746">“I’m not late. I’m migrating.”</text>
  <text x="400" y="484" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#71817d">ONE FISH IN THE BASKET. ZERO PLANS.</text>
