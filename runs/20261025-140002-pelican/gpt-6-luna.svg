      .frame { fill: none; stroke: #e45c42; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #263746; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .ink { stroke: #263746; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="wheel">
