<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">WINGING IT</title>
  <desc id="desc">A smug pelican pedals a bicycle, carrying a tiny fish passenger. The wheels spin and the pelican bobs.</desc>
  <defs>
