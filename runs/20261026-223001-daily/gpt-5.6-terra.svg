<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Knight moves from square 6 on a 4 by 4 grid</title>
  <desc id="desc">Squares 4, 12, 13, and 15 are reachable in one standard knight move from square 6.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="35" y="24" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">Knight moves from square 6</text>

  <g stroke="#1f2937" stroke-width="2">
    <rect x="35" y="40" width="60" height="60" fill="#ffffff"/>
    <rect x="95" y="40" width="60" height="60" fill="#ffffff"/>
    <rect x="155" y="40" width="60" height="60" fill="#ffffff"/>
    <rect x="215" y="40" width="60" height="60" fill="#bfdbfe"/>

    <rect x="35" y="100" width="60" height="60" fill="#ffffff"/>
    <rect x="95" y="100" width="60" height="60" fill="#fbbf24"/>
    <rect x="155" y="100" width="60" height="60" fill="#ffffff"/>
    <rect x="215" y="100" width="60" height="60" fill="#ffffff"/>

    <rect x="35" y="160" width="60" height="60" fill="#ffffff"/>
    <rect x="95" y="160" width="60" height="60" fill="#ffffff"/>
    <rect x="155" y="160" width="60" height="60" fill="#ffffff"/>
    <rect x="215" y="160" width="60" height="60" fill="#bfdbfe"/>

    <rect x="35" y="220" width="60" height="60" fill="#bfdbfe"/>
    <rect x="95" y="220" width="60" height="60" fill="#ffffff"/>
    <rect x="155" y="220" width="60" height="60" fill="#bfdbfe"/>
    <rect x="215" y="220" width="60" height="60" fill="#ffffff"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111827">
    <text x="65" y="70">1</text><text x="125" y="70">2</text><text x="185" y="70">3</text><text x="245" y="70">4</text>
    <text x="65" y="130">5</text><text x="125" y="130">6</text><text x="185" y="130">7</text><text x="245" y="130">8</text>
    <text x="65" y="190">9</text><text x="125" y="190">10</text><text x="185" y="190">11</text><text x="245" y="190">12</text>
    <text x="65" y="250">13</text><text x="125" y="250">14</text><text x="185" y="250">15</text><text x="245" y="250">16</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="320" y="75" font-size="22" font-weight="bold">Legend</text>
    <rect x="322" y="96" width="22" height="22" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="356" y="113" font-size="17">Reachable in one move</text>
    <rect x="322" y="137" width="22" height="22" fill="#fbbf24" stroke="#1f2937" stroke-width="1.5"/>
    <text x="356" y="154" font-size="17">Starting square: 6</text>
    <text x="320" y="202" font-size="18" font-weight="bold">Shaded squares: 4</text>
    <text x="320" y="235" font-size="18">Numbers: 4, 12, 13, 15</text>
  </g>

  <line x1="25" y1="350" x2="575" y2="350" stroke="#d1d5db" stroke-width="1"/>
  <text x="300" y="378" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#4b5563">2026-10-26 22:35:11 SGT (UTC+08:00)</text>
</svg>