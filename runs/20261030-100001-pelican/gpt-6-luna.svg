<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Beak Escape</title>
  <desc id="desc">A smug pelican pedals a bicycle while its enormous beak catches the breeze.</desc>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .wheel{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
    .rider{transform-box:fill-box;transform-origin:center;animation:bob .65s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-4px)}}
  </style>

  <rect width="800" height="600" fill="#b9e8ef"/>
  <circle cx="666" cy="139" r="54" fill="#ffd96a"/>
  <path d="M0 356Q115 318 229 354T460 348T800 344V600H0Z" fill="#8bd29f"/>
  <path d="M0 414Q140 386 280 417T560 410T800 405V600H0Z" fill="#59b879"/>
  <path d="M0 474H800" stroke="#f6e8bd" stroke-width="12" stroke-dasharray="34 25"/>
  <path d="M0 491H800" stroke="#34765a" stroke-width="3"/>

  <text id="title" x="400" y="54" text-anchor="middle" font-size="31" font-weight="900" letter-spacing="1.2" fill="#183b4a">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#315965">One bird. Two wheels. Absolutely no license.</text>

  <!-- breeze and startled passersby -->
  <path d="M115 212h77m-55 18h48m393-48h56m-43 18h70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <g fill="#fff8e8" stroke="#315965" stroke-width="3">
    <ellipse cx="122" cy="340" rx="23" ry="15"/>
    <circle cx="114" cy="320" r="12"/>
    <path d="M129 320l22 5-22 5z"/>
    <ellipse cx="690" cy="345" rx="23" ry="15"/>
    <circle cx="682" cy="325" r="12"/>
    <path d="M697 325l22 5-22 5z"/>
  </g>
  <g fill="#183b4a">
    <circle cx="117" cy="319" r="2.7"/><circle cx="685" cy="324" r="2.7"/>
  </g>
  <path d="M105 373q17 11 34 0M673 378q17 11 34 0" fill="none" stroke="#315965" stroke-width="3" stroke-linecap="round"/>

  <!-- bicycle -->
  <g fill="none" stroke="#183b4a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle class="wheel" cx="250" cy="414" r="64" stroke="#f6fbf5" stroke-width="7"/>
    <circle class="wheel" cx="550" cy="414" r="64" stroke="#f6fbf5" stroke-width="7"/>
    <path d="M250 414L345 414 305 332 250 414M345 414L407 322 550 414M345 414L407 414M407 322l-16-16"/>
    <path d="M292 330h47M396 306h27"/>
  </g>
  <g class="wheel" fill="none" stroke="#b5d7d0" stroke-width="3">
    <path d="M250 350v128M186 414h128M205 369l90 90M295 369l-90 90"/>
    <path d="M550 350v128M486 414h128M505 369l90 90M595 369l-90 90"/>
  </g>
  <g fill="#ffd96a" stroke="#183b4a" stroke-width="4">
    <circle cx="345" cy="414" r="11"/>
  </g>
  <path d="M345 414l-32-25m32 25 28 22m-78-22h-18m96 22h18" fill="none" stroke="#183b4a" stroke-width="6" stroke-linecap="round"/>
  <path d="M296 325q13-11 29 0M387 305q18-11 35 0" fill="none" stroke="#e85c50" stroke-width="7" stroke-linecap="round"/>
  <path d="M536 344l28-8" stroke="#e85c50" stroke-width="7" stroke-linecap="round"/>

  <!-- rider with gentle pedaling bob -->
  <g class="rider">
    <!-- tail feathers -->
    <path d="M339 263q-39-20-61 2 20 0 30 17-25-2-33 17 35 1 57-16" fill="#fff8e8" stroke="#183b4a" stroke-width="4" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="381" cy="263" rx="53" ry="62" fill="#fff8e8" stroke="#183b4a" stroke-width="5"/>
    <path d="M350 286q30 10 63-4" fill="none" stroke="#f2c75e" stroke-width="8" stroke-linecap="round"/>
    <!-- long neck -->
    <path d="M407 268q13-47 8-78" fill="none" stroke="#fff8e8" stroke-width="25" stroke-linecap="round"/>
    <path d="M407 268q13-47 8-78" fill="none" stroke="#183b4a" stroke-width="5" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="411" cy="178" rx="38" ry="34" fill="#fff8e8" stroke="#183b4a" stroke-width="5"/>
    <path d="M436 185q65-31 124-4-53 16-119 29z" fill="#f3b644" stroke="#183b4a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M439 202q49 9 106-1-32 37-87 28-21-5-19-27z" fill="#ed7959" stroke="#183b4a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M453 209q31 4 62 0" fill="none" stroke="#c45647" stroke-width="3"/>
    <!-- expressive face -->
    <circle cx="424" cy="171" r="10" fill="#fff" stroke="#183b4a" stroke-width="3"/>
    <circle cx="427" cy="172" r="4.5" fill="#183b4a"/>
    <path d="M412 155q13-10 25 0" fill="none" stroke="#183b4a" stroke-width="4" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M380 166q11-39 44-31 20 5 25 24z" fill="#e85c50" stroke="#183b4a" stroke-width="4"/>
    <path d="M377 165h75" stroke="#183b4a" stroke-width="5" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M365 239q35-24 57 1-21 37-56 30-14-13-1-31z" fill="#e9eee0" stroke="#183b4a" stroke-width="4"/>
    <path d="M372 258l27-11m-20 22 27-13" stroke="#b8c7b7" stroke-width="3" stroke-linecap="round"/>
    <!-- legs reaching pedals -->
    <path d="M383 300q17 28 27 74M400 299q-1 31-44 48" fill="none" stroke="#ed7959" stroke-width="9" stroke-linecap="round"/>
    <path d="M408 374l15 3m-69-31-9 12" stroke="#183b4a" stroke-width="6" stroke-linecap="round"/>
    <!-- handlebar grip -->
    <path d="M414 307q13-12 25-3" fill="none" stroke="#ed7959" stroke-width="8" stroke-linecap="round"/>
    <!-- tiny tie -->
    <path d="M406 211l8 5-7 7-7-7z" fill="#e85c50" stroke="#183b4a" stroke-width="2"/>
  </g>

  <path d="M466 134q10-13 18 0m-19 17q11-11 20-2" fill="none" stroke="#183b4a" stroke-width="3" stroke-linecap="round"/>
  <text x="578" y="266" font-size="15" font-weight="800" fill="#183b4a" transform="rotate(8 578 266)">HONK IF YOU</text>
  <text x="580" y="285" font-size="15" font-weight="800" fill="#183b4a" transform="rotate(8 580 285)">HAVE A LICENSE!</text>
  <path d="M568 292q-12 15-20 24" fill="none" stroke="#183b4a" stroke-width="2"/>

  <rect x="0" y="534" width="800" height="66" fill="#183b4a"/>
  <text x="400" y="562" text-anchor="middle" font-size="15" font-weight="700" fill="#fff8e8">“I’m not speeding. My beak is just in a hurry.”</text>
  <text x="400" y="588" text-anchor="middle" font-size="13" font-weight="600" fill="#ffd96a">2026-10-30 10:02:27 SGT (UTC+08:00)</text>
</svg>