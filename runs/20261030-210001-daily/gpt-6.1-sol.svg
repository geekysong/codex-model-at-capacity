  <!-- Dedicated footer -->
  <rect x="0" y="329" width="600" height="71" fill="#eef2ff"/>
  <text x="300" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">Total street segments: 8</text>
