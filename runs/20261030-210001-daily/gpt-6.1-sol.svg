<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest city route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid with blocked intersections B2, C3, and D4. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172554">Shortest route: A1 to E5</text>

  <!-- City blocks -->
  <defs>
    <pattern id="blocks" x="100" y="65" width="95" height="60" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="77" height="42" rx="5" fill="#e2e8f0"/>
    </pattern>
  </defs>
  <rect x="100" y="65" width="380" height="240" fill="url(#blocks)"/>

  <!-- Streets -->
  <g fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M100 65H480 M100 125H480 M100 185H480 M100 245H480 M100 305H480"/>
    <path d="M100 65V305 M195 65V305 M290 65V305 M385 65V305 M480 65V305"/>
  </g>

  <!-- Eight-segment shortest route -->
  <path d="M100 65H480V305" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="white" stroke="#64748b" stroke-width="2">
    <circle cx="100" cy="65" r="5"/>
    <circle cx="195" cy="65" r="5"/>
    <circle cx="290" cy="65" r="5"/>
    <circle cx="385" cy="65" r="5"/>
    <circle cx="480" cy="65" r="5"/>
    <circle cx="100" cy="125" r="5"/>
    <circle cx="290" cy="125" r="5"/>
    <circle cx="385" cy="125" r="5"/>
    <circle cx="480" cy="125" r="5"/>
    <circle cx="100" cy="185" r="5"/>
    <circle cx="195" cy="185" r="5"/>
    <circle cx="385" cy="185" r="5"/>
    <circle cx="480" cy="185" r="5"/>
    <circle cx="100" cy="245" r="5"/>
    <circle cx="195" cy="245" r="5"/>
    <circle cx="290" cy="245" r="5"/>
    <circle cx="480" cy="245" r="5"/>
    <circle cx="100" cy="305" r="5"/>
    <circle cx="195" cy="305" r="5"/>
    <circle cx="290" cy="305" r="5"/>
    <circle cx="385" cy="305" r="5"/>
    <circle cx="480" cy="305" r="5"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M187 117L203 133 M203 117L187 133"/>
    <path d="M282 177L298 193 M298 177L282 193"/>
    <path d="M377 237L393 253 M393 237L377 253"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e293b">
    <text x="100" y="51">A1</text>
    <text x="195" y="51">B1</text>
    <text x="290" y="51">C1</text>
    <text x="385" y="51">D1</text>
    <text x="480" y="51">E1</text>
    <text x="100" y="111">A2</text>
    <text x="195" y="111">B2</text>
    <text x="290" y="111">C2</text>
    <text x="385" y="111">D2</text>
    <text x="480" y="111">E2</text>
    <text x="100" y="171">A3</text>
    <text x="195" y="171">B3</text>
    <text x="290" y="171">C3</text>
    <text x="385" y="171">D3</text>
    <text x="480" y="171">E3</text>
    <text x="100" y="231">A4</text>
    <text x="195" y="231">B4</text>
    <text x="290" y="231">C4</text>
