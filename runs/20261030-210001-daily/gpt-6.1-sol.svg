    <text x="290" y="291">C5</text>
    <text x="385" y="291">D5</text>
    <text x="480" y="291">E5</text>
  </g>

  <circle cx="100" cy="65" r="7" fill="#16a34a" stroke="white" stroke-width="2"/>
  <circle cx="480" cy="305" r="7" fill="#2563eb" stroke="white" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <text x="80" y="70" text-anchor="end" fill="#15803d">START</text>
    <text x="500" y="310" fill="#1d4ed8">END</text>
