        <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44M-57-24L57 24M-24-57L24 57M-57 24L57-24M-24 57L24-57"/>
      </g>
      <circle r="9" fill="#243844"/>
      <path d="M-10-61L6-62" stroke="#ef6550" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
