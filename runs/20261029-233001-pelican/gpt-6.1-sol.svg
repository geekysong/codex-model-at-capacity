  <text x="685" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243844">
    <tspan x="685">“My lunch is</tspan>
    <tspan x="685" dy="21">aerodynamic.”</tspan>
  </text>

  <rect x="0" y="493" width="800" height="107" fill="#243844"/>
  <text x="400" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff4d9">He bought a bicycle to reduce his carbon fin-print.</text>
