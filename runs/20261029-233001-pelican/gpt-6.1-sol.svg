    <path d="M534 166c-3-18 18-30 32-16 11-25 42-20 47 1 21-4 33 12 27 23H535Z"/>
  </g>

  <text x="400" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="47" font-weight="900" fill="#243844" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#5c6c67">One bird. Two wheels. Absolutely no lane discipline.</text>

  <g transform="translate(45 274)">
    <path d="M41 47V158" stroke="#746a51" stroke-width="8"/>
    <path d="M0 0H101V57H0Z" fill="#fff9e8" stroke="#243844" stroke-width="4"/>
    <text x="50" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#243844">BIKE LANE</text>
    <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#d25540">NO FISHING</text>
  </g>

