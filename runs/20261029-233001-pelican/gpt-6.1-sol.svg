<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with a fish in its enormous bill. Its wheels spin and its body bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1">
      <rect width="1" height="1" fill="none"/>
    </pattern>
    <g id="wheel">
      <circle r="69" fill="#fff8df" stroke="#243844" stroke-width="10"/>
      <circle r="59" fill="none" stroke="#e1ab56" stroke-width="3"/>
