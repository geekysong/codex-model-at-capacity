<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedals On</title>
  <desc id="desc">A satirical cartoon of an oversized pelican riding a tiny bicycle.</desc>
  <style>
    .wheel { animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
    .pelican { animation: bob .55s ease-in-out infinite alternate; transform-origin: 410px 310px; }
    .leg { animation: pedal .55s linear infinite alternate; transform-box: fill-box; transform-origin: center top; }
    .leg2 { animation: pedal .55s linear infinite alternate-reverse; transform-box: fill-box; transform-origin: center top; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(18deg); } }
  </style>

  <rect width="800" height="600" fill="#bde9f6"/>
  <path d="M0 350 Q130 315 260 350 T530 344 T800 350 V500 H0Z" fill="#99cf73"/>
  <path d="M0 412 Q160 389 325 414 T800 401" fill="none" stroke="#659b51" stroke-width="8"/>
  <circle cx="106" cy="108" r="48" fill="#ffe26a"/>
  <path d="M0 299 Q120 264 231 297" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity=".8"/>
  <path d="M570 142 Q633 94 704 137 Q745 161 782 125" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" opacity=".8"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="38" fill="#253143">THE PELICAN PEDALS ON</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#425365">Because the bird economy demands hustle.</text>

