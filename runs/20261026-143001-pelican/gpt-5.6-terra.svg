  <rect y="505" width="800" height="95" fill="#253143"/>
  <text x="400" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#fff7d1">“No gas, no shame, and absolutely no sense of scale.”</text>
