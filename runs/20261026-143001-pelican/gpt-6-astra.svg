<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a fish-filled bill. The wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff5dc"/>
      <circle cx="3" cy="5" r=".7" fill="#dfd0ad" opacity=".35"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #203544; }
      .ink { stroke: #203544; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #738c95; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#paper)"/>
  <rect x="18" y="18" width="764" height="564" rx="20" fill="none" stroke="#203544" stroke-width="3"/>

  <text x="400" y="66" text-anchor="middle" font-size="43" font-weight="900" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="96" text-anchor="middle" font-size="18">ONE BIRD. TWO WHEELS. AN EXCESSIVE LUNCH BUDGET.</text>

  <!-- One sunny coastal cycling scene -->
  <rect x="40" y="116" width="720" height="356" rx="18" fill="#cdebef"/>
  <circle cx="106" cy="176" r="32" fill="#ffd36b"/>
  <path d="M42 332 Q170 305 285 330 T530 329 T758 320 V421 H42Z" fill="#95c9bd"/>
  <path d="M42 371 Q195 344 362 368 T758 363 V437 H42Z" fill="#d9dda0"/>
  <path d="M40 421 H760 V454 Q760 472 742 472 H58 Q40 472 40 454Z" fill="#b3b7ac"/>
  <path d="M60 451 H180 M246 451 H366 M432 451 H552 M618 451 H738" stroke="#fff6da" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="403" cy="432" rx="236" ry="15" fill="#203544" opacity=".13"/>

  <!-- Commentary from the rider -->
  <path d="M479 130 H706 Q723 130 723 147 V207 Q723 223 706 223 H582 L550 248 L556 223 H479 Q464 223 464 207 V147 Q464 130 479 130Z" fill="#fffdf4" stroke="#203544" stroke-width="3"/>
  <text x="594" y="163" text-anchor="middle" font-size="21" font-weight="bold">
    <tspan x="594">“It’s not cargo.</tspan>
    <tspan x="594" dy="29">It’s a light snack.”</tspan>
  </text>

  <!-- Wheels rotate around fixed axles -->
  <g>
    <circle cx="258" cy="375" r="65" fill="#eaf7ee" fill-opacity=".55" stroke="#203544" stroke-width="11"/>
    <circle cx="258" cy="375" r="56" fill="none" stroke="#fff8dd" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0 258 375" to="360 258 375" dur="1.8s" repeatCount="indefinite"/>
      <path d="M258 318 V432 M201 375 H315 M218 335 L298 415 M218 415 L298 335"/>
      <path d="M239 321 L277 429 M204 394 L312 356"/>
      <rect x="251" y="324" width="14" height="7" rx="2" fill="#ffbf41" stroke="none"/>
    </g>
    <circle cx="258" cy="375" r="8" fill="#203544"/>
    <circle cx="555" cy="375" r="65" fill="#eaf7ee" fill-opacity=".55" stroke="#203544" stroke-width="11"/>
    <circle cx="555" cy="375" r="56" fill="none" stroke="#fff8dd" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0 555 375" to="360 555 375" dur="1.8s" repeatCount="indefinite"/>
      <path d="M555 318 V432 M498 375 H612 M515 335 L595 415 M515 415 L595 335"/>
      <path d="M536 321 L574 429 M501 394 L609 356"/>
      <rect x="548" y="324" width="14" height="7" rx="2" fill="#ffbf41" stroke="none"/>
    </g>
    <circle cx="555" cy="375" r="8" fill="#203544"/>
  </g>

  <!-- Delightfully undersized bicycle -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M258 375 L328 285 L389 375 Z M328 285 H506 L389 375 M506 285 L555 375" stroke="#203544" stroke-width="13"/>
    <path d="M258 375 L328 285 L389 375 Z M328 285 H506 L389 375 M506 285 L555 375" stroke="#ee6654" stroke-width="7"/>
    <path d="M328 285 L320 269 M506 285 L498 253 L524 243" stroke="#203544" stroke-width="8"/>
    <path d="M519 244 H539 Q554 244 550 260" stroke="#203544" stroke-width="8"/>
    <path d="M296 268 H344" stroke="#203544" stroke-width="12"/>
    <path d="M258 375 L389 365 Q409 375 389 385Z" stroke="#203544" stroke-width="3"/>
  </g>
  <circle cx="389" cy="375" r="18" fill="#f7ce65" class="ink"/>

  <!-- Pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 389 375" to="360 389 375" dur="1.8s" repeatCount="indefinite"/>
    <path d="M365 375 H413" stroke="#203544" stroke-width="6"/>
    <path d="M358 375 H372 M406 375 H420" stroke="#203544" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Pelican and its wildly optimistic lunch -->
  <g class="ink">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M327 268 L348 314 L387 343" fill="none" stroke="#e9a732" stroke-width="12"/>
    <path d="M385 341 L407 348 L378 353Z" fill="#ffc451" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="-7 385 341;9 385 341;-7 385 341" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M286 236 L246 211 L254 246 L235 244 L274 269" fill="#fdfdf0"/>
    <path d="M277 206 C297 181 344 191 371 213 C394 228 397 248 378 266 C350 292 290 281 270 254 C260 236 264 219 277 206Z" fill="#fffef1"/>
    <path d="M309 220 Q353 204 369 249 Q333 267 295 237 M310 239 L335 249 M322 229 L349 242" fill="#e0e9de" stroke-width="3"/>
    <path d="M363 232 C389 207 375 180 381 161 C386 141 411 134 430 146 C448 157 446 176 430 188 C414 202 422 235 401 254 L376 266" fill="#fffef1"/>
    <!-- Pouch -->
    <path d="M428 173 L583 186 C573 240 531 267 477 237 C455 225 443 203 428 173Z" fill="#ffc671"/>
    <!-- Fish silhouettes visible in the pouch -->
    <g stroke-width="2.5">
      <path d="M485 212 Q501 195 521 210 L534 201 L531 219 L521 214 Q501 230 485 212Z" fill="#79bab3"/>
      <circle cx="493" cy="210" r="2.5" fill="#203544" stroke="none"/>
      <path d="M536 230 Q550 212 565 221 L576 212 L575 230 L564 226 Q549 242 536 230Z" fill="#80b6d1"/>
      <circle cx="543" cy="228" r="2.5" fill="#203544" stroke="none"/>
    </g>
    <path d="M428 168 L599 184 L582 194 L431 185Z" fill="#f3ae38"/>
    <path d="M451 190 L571 196" fill="none" stroke-width="2.5"/>
    <circle cx="418" cy="160" r="9" fill="white" stroke-width="2.5"/>
    <circle cx="422" cy="160" r="4" fill="#203544" stroke="none"/>
    <path d="M408 145 L427 150" fill="none" stroke-width="4"/>
    <!-- Tiny racing helmet -->
    <path d="M376 148 Q379 117 409 119 Q436 119 445 144Z" fill="#ed6754"/>
    <path d="M391 127 L387 140 M407 125 L407 140 M422 129 L428 141" stroke-width="4"/>
    <path d="M380 149 Q382 184 406 190" fill="none" stroke-width="3"/>
    <!-- Wing reaching toward handlebars -->
    <path d="M370 225 Q419 257 482 244 L514 249 Q515 260 499 263 Q420 282 369 248" fill="#f5f6e9"/>
    <path d="M486 253 L503 256" stroke-width="2.5"/>
    <!-- Wind-blown scarf -->
    <path d="M383 195 L351 181 L320 191 L346 200 L329 214 L376 207Z" fill="#e55e54" stroke-width="3"/>
    <path d="M381 191 L405 199 L399 213 L376 205Z" fill="#ed6754" stroke-width="3"/>
  </g>

  <!-- Motion marks -->
  <path d="M201 262 H236 M184 280 H227 M162 300 H216" fill="none" stroke="#507d88" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="508" text-anchor="middle" font-size="23" font-weight="bold">He took up cycling to reduce his carbon finprint.</text>
  <path d="M64 531 H736" stroke="#b7aa8d" stroke-width="1.5"/>
  <text x="400" y="559" text-anchor="middle" font-size="18">2026-10-26 14:30:01 SGT (UTC+08:00)</text>
</svg>