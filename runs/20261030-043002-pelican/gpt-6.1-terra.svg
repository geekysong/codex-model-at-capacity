<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Peak Pelican Performance</title>
  <desc id="desc">A determined pelican rides a bicycle with spinning wheels, bobbing as it pedals past a seaside path.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#fff" opacity=".4"/>
    </pattern>
    <style>
      .ink { stroke:#243a43; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#243a43; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.5s linear infinite; }
      .rider { animation:bob 1s ease-in-out infinite; }
      .pedal { transform-origin:398px 396px; animation:spin 1.5s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
  </defs>

