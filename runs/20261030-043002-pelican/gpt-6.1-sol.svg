<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Lobby</title>
  <desc id="desc">A smug pelican with a fish-stuffed pouch pedals a bicycle past a fuel station, claiming to run on renewable sardines. Wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="sky" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#eadfc3"/>
    </pattern>
    <g id="wheel">
      <circle r="82" fill="#fff9e9" stroke="#243744" stroke-width="12"/>
      <circle r="70" fill="none" stroke="#e9b44c" stroke-width="3"/>
      <g stroke="#697d86" stroke-width="3">
        <path d="M-73 0H73M0-73V73M-52-52L52 52M-52 52L52-52"/>
      </g>
      <circle r="10" fill="#243744"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5db"/>
  <rect width="800" height="490" fill="url(#sky)"/>
  <path d="M0 399Q170 373 340 396T800 390V490H0Z" fill="#dce8bb"/>
  <circle cx="704" cy="147" r="39" fill="#ffce58"/>
  <path d="M74 167q20-24 40 0q20-24 40 0M593 205q13-16 26 0q13-16 26 0" fill="none" stroke="#92afba" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#243744">THE PELICAN PEDAL LOBBY</text>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="3" fill="#81644c">BIG BEAK. SMALL CARBON FOOTPRINT.</text>

  <!-- A single roadside scene -->
  <g transform="translate(53 255)">
    <rect x="0" y="0" width="109" height="65" rx="6" fill="#fff9e9" stroke="#243744" stroke-width="4"/>
    <text x="54" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243744">PETROL</text>
    <text x="54" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#b95138">TOO CHEEP!</text>
    <path d="M54 67V168" stroke="#81644c" stroke-width="9"/>
  </g>
  <ellipse cx="430" cy="464" rx="248" ry="15" fill="#a0ad8b" opacity=".35"/>
  <path d="M0 474H800" stroke="#81644c" stroke-width="4"/>
  <path d="M26 486H110M646 486H756" stroke="#bfae8b" stroke-width="3" stroke-linecap="round"/>

  <!-- Both wheels really rotate -->
  <g transform="translate(268 382)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(597 382)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M268 382L346 287L417 382ZM346 287H550L417 382M550 287L597 382" stroke="#243744" stroke-width="14"/>
    <path d="M268 382L346 287L417 382ZM346 287H550L417 382M550 287L597 382" stroke="#e76047" stroke-width="8"/>
    <path d="M346 287L335 263M550 287L536 251L560 239L581 244" stroke="#243744" stroke-width="9"/>
    <path d="M312 264H359" stroke="#243744" stroke-width="14"/>
    <path d="M268 382H417" stroke="#243744" stroke-width="5"/>
    <path d="M268 382Q340 346 417 382" stroke="#243744" stroke-width="3"/>
  </g>
  <circle cx="417" cy="382" r="23" fill="#f5c65f" stroke="#243744" stroke-width="5"/>
  <g transform="translate(417 382)">
    <g stroke="#243744" stroke-width="6" stroke-linecap="round">
      <path d="M-29 0H29"/>
      <path d="M-36-5V5M36-5V5" stroke-width="10"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- The rider bobs while its feet pump -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M360 254L375 310L403 351" fill="none" stroke="#d99132" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" values="M360 254L375 310L403 351;M360 254L399 299L435 377;M360 254L375 310L403 351" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M397 349l25 5-32 9Z" fill="#edab38" stroke="#243744" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;32 26;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <path d="M329 240L283 213L294 254L326 273" fill="#fffdf0" stroke="#243744" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="371" cy="234" rx="70" ry="43" transform="rotate(-12 371 234)" fill="#fffdf0" stroke="#243744" stroke-width="4"/>
    <path d="M337 224Q366 192 407 224Q382 263 337 224Z" fill="#d9e6e6" stroke="#243744" stroke-width="3"/>
    <path d="M401 225Q447 217 449 177L442 153" fill="none" stroke="#243744" stroke-width="33" stroke-linecap="round"/>
    <path d="M401 225Q447 217 449 177L442 153" fill="none" stroke="#fffdf0" stroke-width="25" stroke-linecap="round"/>

    <!-- Comically overloaded beak pouch -->
    <path d="M451 157L613 171Q562 254 467 204Z" fill="#ffc96b" stroke="#243744" stroke-width="4"/>
    <g fill="#6eaeb2" stroke="#243744" stroke-width="2">
      <path d="M482 192q18-18 35 0q-17 18-35 0l-11 8v-16Z"/>
      <path d="M531 193q17-17 33 0q-16 17-33 0l-10 8v-16Z"/>
    </g>
    <circle cx="506" cy="190" r="2.5" fill="#243744"/>
    <circle cx="553" cy="191" r="2.5" fill="#243744"/>
    <path d="M448 148L618 167L450 177Z" fill="#f5a835" stroke="#243744" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="441" cy="145" rx="29" ry="32" fill="#fffdf0" stroke="#243744" stroke-width="4"/>
    <path d="M418 119l-8-13M428 115l-1-17M438 115l6-14" fill="none" stroke="#243744" stroke-width="4" stroke-linecap="round"/>
    <circle cx="450" cy="140" r="10" fill="white" stroke="#243744" stroke-width="3"/>
    <circle cx="454" cy="139" r="4" fill="#243744"/>
    <path d="M440 125l19 4" stroke="#243744" stroke-width="4" stroke-linecap="round"/>
    <path d="M388 249Q431 268 453 285L429 369" fill="none" stroke="#efac3e" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M388 249Q431 268 453 285L429 369;M388 249Q412 284 420 309L399 395;M388 249Q431 268 453 285L429 369" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M427 364l24 12-34 4Z" fill="#ffc14c" stroke="#243744" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 26;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M409 228Q481 218 546 247" fill="none" stroke="#243744" stroke-width="13" stroke-linecap="round"/>
    <path d="M409 228Q481 218 546 247" fill="none" stroke="#fffdf0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M76 115H282Q296 115 296 129V181Q296 195 282 195H249L276 222L224 195H76Q62 195 62 181V129Q62 115 76 115Z" fill="white" stroke="#243744" stroke-width="3"/>
    <text x="179" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#243744">“I run on</text>
    <text x="179" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#243744">renewable sardines!”</text>
  </g>
  <path d="M177 351l-22-8M175 371h-30M183 391l-24 9" stroke="#93a39a" stroke-width="4" stroke-linecap="round"/>

  <!-- Dedicated caption and timestamp footer -->
  <rect y="499" width="800" height="101" fill="#243744"/>
  <text x="400" y="531" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff5db">The pelican’s commute is green. His lunch has concerns.</text>
  <path d="M100 548H700" stroke="#71818a"/>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffe2a0">2026-10-30 04:31:18 SGT (UTC+08:00)</text>
</svg>