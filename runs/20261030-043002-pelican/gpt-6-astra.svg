<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a tiny bicycle with an enormous pouch full of fish. Its wheels spin, feet pedal, and body bobs above a seaside road.</desc>
  <defs>
    <pattern id="sky" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#c1e4e3"/>
    </pattern>
    <style>
      .ink { stroke:#193746; stroke-width:5; stroke-linecap:round; stroke-linejoin:round }
      .type { font-family:Arial,Helvetica,sans-serif; fill:#193746 }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
  <path d="M0 112H800V448H0Z" fill="#d8efeb"/>
  <path d="M0 112H800V448H0Z" fill="url(#sky)"/>
  <text x="400" y="65" class="type" text-anchor="middle" font-size="49" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="95" class="type" text-anchor="middle" font-size="17" font-weight="bold" letter-spacing="2">ELITE CYCLING. QUESTIONABLE AERODYNAMICS.</text>

  <circle cx="693" cy="176" r="39" fill="#ffc85d"/>
  <path d="M42 188Q69 160 95 188Q123 149 153 188M642 273Q655 261 668 273Q681 261 694 273" fill="none" stroke="#98c6c6" stroke-width="5" stroke-linecap="round"/>
  <path d="M0 362Q110 342 221 363T445 361T670 359T800 363V449H0Z" fill="#82c9cb"/>
  <path d="M0 390Q100 378 200 391T400 390T600 390T800 390" fill="none" stroke="#d9f1e8" stroke-width="4"/>

  <g class="ink">
    <path d="M697 328V443" fill="none" stroke="#8a7d63"/>
    <path d="M645 291H748V345H645Z" fill="#fff5d9"/>
  </g>
  <text x="696" y="313" class="type" text-anchor="middle" font-size="15" font-weight="bold">BIKE LANE</text>
  <text x="696" y="334" class="type" text-anchor="middle" font-size="13">NO TRAWLERS</text>

  <path d="M0 444H800V498H0Z" fill="#bbb8a7"/>
  <path d="M0 485H800" stroke="#fff5d9" stroke-width="5" stroke-dasharray="37 25"/>
  <ellipse cx="397" cy="454" rx="242" ry="15" fill="#193746" opacity=".13"/>

  <!-- Bicycle wheels, rotating independently around their axles. -->
  <g class="ink">
    <g transform="translate(251 401)">
      <circle r="65" fill="#f8eed4"/>
      <g stroke="#91a9a6" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
        <path d="M16-56L22-52" stroke="#f6b733" stroke-width="7"/>
      </g>
      <circle r="65" fill="none" stroke-width="10"/>
      <circle r="7" fill="#193746" stroke="none"/>
    </g>
    <g transform="translate(542 401)">
      <circle r="65" fill="#f8eed4"/>
      <g stroke="#91a9a6" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
        <path d="M16-56L22-52" stroke="#f6b733" stroke-width="7"/>
      </g>
      <circle r="65" fill="none" stroke-width="10"/>
      <circle r="7" fill="#193746" stroke="none"/>
    </g>

    <path d="M251 401L328 310L383 401ZM328 310H491L383 401M491 310L542 401" fill="none" stroke="#e76148" stroke-width="9"/>
    <path d="M328 310L318 292M491 310L479 276L510 266Q531 259 534 277" fill="none"/>
    <path d="M295 290H337" stroke-width="12"/>
    <circle cx="383" cy="401" r="16" fill="#f6b733"/>

    <!-- Pelican rider. -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
      <path d="M288 268L221 241L242 280L213 280Q252 312 302 300" fill="#fffdf2"/>
      <path d="M280 220Q248 247 268 281Q288 315 351 299Q405 286 422 245L416 197Q400 171 377 197L359 229Q311 204 280 220Z" fill="#fffdf2"/>
      <path d="M286 243Q332 225 356 250Q350 280 289 277Q317 269 324 252" fill="#d8dfd7"/>
      <path d="M381 233Q368 196 380 166Q392 134 427 143Q459 147 461 175L446 206Q429 213 416 197L421 236" fill="#fffdf2"/>
      <path d="M381 162Q391 126 430 132Q458 137 466 159Z" fill="#e76148"/>
      <path d="M396 141L404 155M418 137L424 155M440 142L445 156" fill="none" stroke="#fff5d9" stroke-width="4"/>
      <path d="M397 165L410 196" fill="none" stroke-width="3"/>
      <circle cx="437" cy="174" r="9" fill="white" stroke-width="3"/>
      <circle cx="441" cy="176" r="4" fill="#193746" stroke="none"/>
      <path d="M427 158L448 164" fill="none" stroke-width="4"/>

      <!-- Oversized fish-filled bill pouch. -->
      <path d="M450 187L621 202Q592 269 529 270Q469 265 450 187Z" fill="#ffc965"/>
      <g stroke-width="3">
        <path d="M490 231Q514 213 537 231Q514 250 490 231L480 222V240Z" fill="#70b9b4"/>
        <circle cx="527" cy="229" r="2.5" fill="#193746" stroke="none"/>
        <path d="M545 241Q566 222 588 236Q569 255 545 241L534 234L536 249Z" fill="#91c9b7"/>
        <circle cx="579" cy="236" r="2.5" fill="#193746" stroke="none"/>
      </g>
      <path d="M449 181Q524 178 632 199Q638 207 617 210L450 197Z" fill="#f5ad38"/>
      <path d="M474 208Q483 245 510 254" fill="none" stroke="#df9639" stroke-width="3"/>
      <path d="M351 234Q387 248 416 269L495 274" fill="none" stroke="#193746" stroke-width="16"/>
      <path d="M351 234Q387 248 416 269L495 274" fill="none" stroke="#fffdf2" stroke-width="10"/>
      <path d="M492 269L503 278M499 268L510 276" fill="none" stroke-width="3"/>

      <path d="M325 294L356 338L383 379" fill="none" stroke="#e99b32" stroke-width="10">
        <animate attributeName="d" values="M325 294L356 338L383 379;M325 294L337 354L383 423;M325 294L356 338L383 379" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>

    <g transform="translate(383 401)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M0-22V22" stroke-width="5"/>
        <g transform="translate(0 -22)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
            <path d="M-13 4H15" stroke-width="6"/>
            <path d="M-10 0L-8-10L1-5L8-11L17 0Z" fill="#f5ad38" stroke-width="3"/>
          </g>
        </g>
        <g transform="translate(0 22)">
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
            <path d="M-13 4H15" stroke-width="6"/>
            <path d="M-10 0L-8-10L1-5L8-11L17 0Z" fill="#f5ad38" stroke-width="3"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g>
    <path d="M58 211Q48 201 53 170Q57 148 83 148H252Q274 148 274 172V200Q274 218 253 218H210L230 241L184 218H81Q64 218 58 211Z" fill="white" stroke="#193746" stroke-width="3"/>
    <text x="163" y="176" class="type" text-anchor="middle" font-size="18" font-weight="bold">“It's not baggage.</text>
    <text x="163" y="201" class="type" text-anchor="middle" font-size="18" font-weight="bold">It's protein.”</text>
  </g>
  <path d="M177 335H211M164 351H204M181 368H205" stroke="#193746" stroke-width="4" stroke-linecap="round"/>

  <rect y="502" width="800" height="98" fill="#fff5d9"/>
  <text x="400" y="535" class="type" text-anchor="middle" font-size="22" font-weight="bold">He bought a racing bike. His lunch bought a cargo bike.</text>
  <path d="M80 552H720" stroke="#d2c6a9" stroke-width="2"/>
  <text x="400" y="579" class="type" text-anchor="middle" font-size="17">2026-10-30 04:30:02 SGT (UTC+08:00)</text>
</svg>