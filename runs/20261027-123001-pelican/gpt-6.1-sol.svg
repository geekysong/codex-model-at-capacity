<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while the world tries to keep up.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8dd8f2"/>
      <stop offset="1" stop-color="#d9f6ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636d"/>
      <stop offset="1" stop-color="#343b43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#17212b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#17212b}
      .small{font-size:18px}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="52" fill="#fff6aa" opacity=".8"/>
  <path d="M0 370 Q130 300 270 365 T540 350 T800 365 V470 H0Z" fill="#86bf75"/>
  <path d="M0 430 Q190 395 380 430 T800 420 V600 H0Z" fill="url(#road)"/>
  <path d="M0 518 H800" stroke="#f5d76e" stroke-width="8" stroke-dasharray="52 30"/>

  <g filter="url(#shadow)">
    <rect x="54" y="36" width="692" height="86" rx="22" fill="#fff" stroke="#17212b" stroke-width="7"/>
    <text x="400" y="78" text-anchor="middle" class="label" font-size="36" font-weight="900">PELICAN PEDAL PANIC!</text>
    <text x="400" y="105" text-anchor="middle" class="label" font-size="20">He came for the fish… and accidentally joined the Tour de Pond.</text>
  </g>

  <g id="bike" class="ink">
    <g id="wheelBack">
      <circle cx="257" cy="431" r="78" fill="#d7e3ea"/>
      <circle cx="257" cy="431" r="12" fill="#f05a52"/>
      <g stroke="#60717c" stroke-width="3">
        <path d="M257 353V509M179 431H335M202 376L312 486M312 376L202 486"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 257 431" to="360 257 431" dur="2s" repeatCount="indefinite"/>
    </g>
    <g id="wheelFront" >
      <circle cx="574" cy="431" r="78" fill="#d7e3ea"/>
      <circle cx="574" cy="431" r="12" fill="#f05a52"/>
      <g stroke="#60717c" stroke-width="3">
        <path d="M574 353V509M496 431H652M519 376L629 486M629 376L519 486"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 574 431" to="360 574 431" dur="2s" repeatCount="indefinite"/>
    </g>
    <path d="M257 431 L365 330 L470 431 L257 431 L420 431 L574 431 L470 431 L430 302" fill="none" stroke="#e34d43" stroke-width="12"/>
    <path d="M365 330 L430 302" fill="none" stroke="#e34d43" stroke-width="12"/>
    <path d="M420 431 l35 36 M420 431 l-35 36" fill="none" stroke="#17212b" stroke-width="8"/>
    <circle cx="420" cy="431" r="18" fill="#f4b942"/>
    <path d="M430 302 q22 -20 45 0" fill="none"/>
    <path d="M466 302 l30 -15" fill="none"/>
  </g>

  <g id="pelican" class="ink">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="405" cy="265" rx="77" ry="92" fill="#f5f7f2"/>
    <path d="M360 286 Q405 315 455 284 L469 352 Q403 385 344 344Z" fill="#d7e1df"/>
    <circle cx="405" cy="173" r="58" fill="#f5f7f2"/>
    <path d="M365 181 Q310 198 280 177 Q319 151 372 150Z" fill="#f0a643"/>
    <path d="M365 181 Q319 211 276 185" fill="none" stroke="#17212b" stroke-width="5"/>
    <circle cx="421" cy="158" r="9" fill="#17212b"/>
    <circle cx="424" cy="155" r="3" fill="#fff"/>
    <path d="M365 150 Q347 118 370 104 Q392 125 388 153" fill="#f05a52"/>
    <path d="M374 251 Q420 229 454 259" fill="none" stroke="#17212b" stroke-width="9"/>
    <path d="M374 252 Q399 282 424 254" fill="none" stroke="#17212b" stroke-width="7"/>
    <path d="M359 338 L346 407 M449 338 L474 405" fill="none" stroke="#f0a643" stroke-width="15"/>
    <path d="M346 407 l-28 12 M474 405 l29 13" fill="none" stroke="#f0a643" stroke-width="10"/>
    <path d="M358 228 Q315 260 327 304" fill="none" stroke="#f5f7f2" stroke-width="28"/>
    <path d="M451 225 Q491 257 483 301" fill="none" stroke="#f5f7f2" stroke-width="28"/>
    <path d="M329 255 q-30 16 -45 6" fill="none" stroke="#17212b" stroke-width="5"/>
    <path d="M482 256 q28 18 45 8" fill="none" stroke="#17212b" stroke-width="5"/>
  </g>

  <g class="label">
    <text x="90" y="178" font-size="23" font-weight="700">LOCAL BIRD REPORT:</text>
    <text x="90" y="207" font-size="20">“Zero balance, maximum beak.”</text>
    <path d="M238 213 q60 20 88 57" fill="none" stroke="#17212b" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(610 270)">
    <path d="M0 70 q35 -65 70 0" fill="none" stroke="#17212b" stroke-width="5"/>
    <text x="35" y="105" text-anchor="middle" class="label" font-size="18" font-weight="700">HONK!</text>
  </g>

  <rect x="38" y="548" width="724" height="38" rx="10" fill="#fff" stroke="#17212b" stroke-width="4"/>
  <text x="400" y="573" text-anchor="middle" class="label small" font-weight="700">2026-10-27 12:31:01 SGT (UTC+08:00)</text>
</svg>