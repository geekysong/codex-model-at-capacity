<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly pretending it knows where it is going.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .ink { stroke:#20252b; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
    .thin { stroke:#20252b; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
  </style>

  <rect width="800" height="600" fill="#b9e7f5"/>
  <circle cx="680" cy="110" r="58" fill="#ffd86b" class="ink"/>
  <path d="M0 410 Q120 350 240 410 T480 410 T720 410 T960 410 V600 H0Z" fill="#83c878"/>
  <path d="M0 475 Q180 425 360 475 T720 475 T1000 475 V600 H0Z" fill="#5cae62"/>
  <path d="M45 395 q20-38 40 0 q20-45 42 0 q22-30 40 0" fill="none" class="thin"/>
  <path d="M585 395 q20-38 40 0 q20-45 42 0 q22-30 40 0" fill="none" class="thin"/>

  <rect x="90" y="42" width="620" height="74" rx="18" fill="#fff4c2" class="ink"/>
  <text x="400" y="88" text-anchor="middle" font-size="38" font-weight="900" fill="#e84d3c">PELICAN PEDAL PANIC!</text>

  <g id="bike">
    <g class="wheel">
      <circle cx="270" cy="438" r="83" fill="#f7f7f7" class="ink"/>
      <circle cx="270" cy="438" r="12" fill="#ef6b55" class="ink"/>
      <g stroke="#20252b" stroke-width="3">
        <path d="M270 355V521 M187 438H353 M211 379L329 497 M329 379L211 497"/>
      </g>
    </g>
    <g class="wheel">
      <circle cx="560" cy="438" r="83" fill="#f7f7f7" class="ink"/>
      <circle cx="560" cy="438" r="12" fill="#ef6b55" class="ink"/>
      <g stroke="#20252b" stroke-width="3">
        <path d="M560 355V521 M477 438H643 M501 379L619 497 M619 379L501 497"/>
      </g>
    </g>
    <path d="M270 438 L370 355 L470 438 L560 438 L430 438 L370 355 L330 438" fill="none" class="ink"/>
    <path d="M470 438 L500 365 L550 365" fill="none" class="ink"/>
    <path d="M500 365 l-18-18 M500 365 l22-18" fill="none" class="ink"/>
    <path d="M350 356 h-55" class="ink"/>
    <circle cx="430" cy="438" r="25" fill="#ffd34f" class="ink"/>
    <path d="M430 438 l33-18 M430 438 l-28 24" class="thin"/>
    <circle cx="463" cy="420" r="8" fill="#20252b"/>
    <circle cx="402" cy="462" r="8" fill="#20252b"/>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="410" cy="278" rx="92" ry="112" fill="#f5f1e8" class="ink"/>
    <path d="M350 298 Q300 330 332 369 Q374 390 408 350 Q387 327 350 298Z" fill="#d8d1c5" class="ink"/>
    <path d="M341 293 Q285 273 226 306 Q278 334 352 326" fill="#f29b62" class="ink"/>
    <path d="M224 306 Q274 305 326 315" fill="none" class="thin"/>
    <circle cx="386" cy="215" r="12" fill="#20252b"/>
    <circle cx="390" cy="211" r="4" fill="#fff"/>
    <path d="M361 189 Q390 166 418 188" fill="none" class="thin"/>
    <path d="M405 345 Q455 362 478 405" fill="none" class="ink"/>
    <path d="M478 405 q-10 20 12 27 M478 405 q12 14 30 13" fill="none" class="ink"/>
    <path d="M382 350 Q350 398 363 433" fill="none" class="ink"/>
    <path d="M363 433 q-20 3-28 17 M363 433 q18 8 30 0" fill="none" class="ink"/>
    <path d="M343 255 Q390 270 443 250" fill="none" stroke="#d8d1c5" stroke-width="13" stroke-linecap="round"/>
    <path d="M454 300 q34 17 43 49" fill="none" class="ink"/>
    <path d="M487 349 q18-11 31 2 q-15 15-31 7" fill="#f29b62" class="thin"/>
    <path d="M428 196 q18-25 43-5" fill="none" stroke="#e84d3c" stroke-width="8"/>
    <text x="430" y="164" font-size="18" font-weight="700" fill="#20252b">LICENSE?</text>
  </g>

  <g>
    <path d="M125 245 q45-42 91 0" fill="none" stroke="#20252b" stroke-width="5"/>
    <text x="105" y="222" font-size="22" font-weight="700" fill="#20252b">NO BRAKES!</text>
    <path d="M615 238 q42-27 80 2" fill="none" stroke="#20252b" stroke-width="5"/>
    <text x="600" y="215" font-size="22" font-weight="700" fill="#20252b">ALL BEAK.</text>
  </g>

  <rect x="118" y="515" width="564" height="48" rx="14" fill="#fff4c2" class="ink"/>
  <text x="400" y="546" text-anchor="middle" font-size="23" font-weight="700" fill="#20252b">
    “I’m winging it—and the traffic is too!”
  </text>

  <rect x="20" y="570" width="760" height="25" fill="#20252b"/>
  <text x="400" y="588" text-anchor="middle" font-size="14" font-weight="700" fill="#fff4c2">
    2026-10-28 04:30:33 SGT (UTC+08:00)
  </text>

  <style>
    #bike .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.4s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</svg>