<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of a pelican pedaling furiously while carrying a tiny briefcase.</desc>
  <style>
    .ink{stroke:#17324d;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,sans-serif;fill:#17324d}
    .wheel{fill:none;stroke:#17324d;stroke-width:9}
    .spoke{stroke:#4d7695;stroke-width:3}
    .feather{fill:#f5f0dc}
    .orange{fill:#f28c28}
  </style>

  <rect width="800" height="600" fill="#bde8f2"/>
  <rect y="430" width="800" height="170" fill="#8dcc72"/>
  <path d="M0 455 Q120 420 240 455 T480 455 T800 455" fill="none" stroke="#5caa5a" stroke-width="8"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="21" font-style="italic">“Why fly when you can pedal into bureaucracy?”</text>

  <g transform="translate(0,0)">
    <g>
      <circle cx="240" cy="405" r="86" class="wheel"/>
      <circle cx="590" cy="405" r="86" class="wheel"/>
      <g class="spoke">
        <path d="M240 319V491 M154 405H326 M179 344L301 466 M179 466L301 344"/>
        <path d="M590 319V491 M504 405H676 M529 344L651 466 M529 466L651 344"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 415 405" to="360 415 405" dur="2s" repeatCount="indefinite"/>
    </g>

    <path d="M240 405 L355 300 L470 405 L590 405 L470 405 L420 300 L355 300 L240 405" fill="none" class="ink" stroke="#df5b3f"/>
    <path d="M355 300 L420 300 L438 270" fill="none" class="ink"/>
    <path d="M420 300 L470 405" fill="none" class="ink"/>
    <path d="M345 300 L330 270" fill="none" class="ink"/>
    <circle cx="355" cy="300" r="12" fill="#f7c948" class="ink"/>
    <circle cx="470" cy="405" r="12" fill="#f7c948" class="ink"/>

    <g id="pelican">
      <ellipse cx="406" cy="208" rx="70" ry="92" class="feather ink"/>
      <path d="M365 188 Q320 220 350 270 Q380 252 400 216" fill="#d6e7ee" class="ink"/>
      <path d="M450 190 Q490 230 460 270 Q430 252 412 216" fill="#d6e7ee" class="ink"/>
      <circle cx="402" cy="112" r="52" class="feather ink"/>
      <path d="M432 120 L560 150 Q579 156 560 174 L430 160 Q416 145 432 120Z" class="orange ink"/>
      <path d="M440 150 Q500 162 554 161" fill="none" stroke="#b95c18" stroke-width="4"/>
      <circle cx="421" cy="103" r="8" fill="#17324d"/>
      <path d="M389 77 Q402 56 423 72" fill="none" class="ink"/>
      <path d="M382 289 Q360 328 350 365" fill="none" class="ink"/>
      <path d="M430 289 Q451 326 460 365" fill="none" class="ink"/>
      <path d="M350 365 L325 380 M350 365 L347 389 M460 365 L486 380 M460 365 L465 389" fill="none" class="ink"/>

      <path d="M350 365 Q382 330 420 365" fill="none" class="ink"/>
      <circle cx="350" cy="365" r="9" fill="#f7c948" class="ink"/>
      <circle cx="460" cy="365" r="9" fill="#f7c948" class="ink"/>

      <rect x="474" y="215" width="68" height="51" rx="8" fill="#8e5a3c" class="ink"/>
      <path d="M488 215 Q508 190 528 215" fill="none" class="ink"/>
      <text x="508" y="248" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#fff6d5">TAX</text>

      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(0,0)">
    <path d="M95 150 Q130 125 165 150" fill="none" stroke="#fff" stroke-width="10" opacity=".8"/>
    <path d="M650 180 Q690 150 730 180" fill="none" stroke="#fff" stroke-width="10" opacity=".8"/>
  </g>

  <text x="400" y="528" text-anchor="middle" class="label" font-size="20" font-weight="bold">He has two wheels, one beak, and absolutely no sense of direction.</text>
  <text x="400" y="570" text-anchor="middle" class="label" font-size="16">2026-10-28 04:30:01 SGT (UTC+08:00)</text>
</svg>