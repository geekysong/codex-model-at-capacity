<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly large fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#fff1b8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#737b88"/>
      <stop offset="1" stop-color="#444a55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#263238" flood-opacity=".3"/>
    </filter>
    <style>
      .ink { stroke:#20252b; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial, Helvetica, sans-serif; fill:#20252b; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .rider { transform-box:fill-box; transform-origin:center bottom; animation:bob .55s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-7px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="55" fill="#ffd45c" opacity=".9"/>
  <path d="M0 350 Q120 275 245 350 T500 340 T800 330 V455 H0Z" fill="#8bcf88"/>
  <path d="M0 395 Q160 335 300 395 T610 390 T800 375 V470 H0Z" fill="#5aaf78"/>
  <path d="M0 455 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 H800" stroke="#f8df72" stroke-width="10" stroke-dasharray="48 30"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#ffffff" stroke="#20252b" stroke-width="3" paint-order="stroke">
    THE PELICAN PEDAL EXPRESS
  </text>
  <text x="400" y="93" text-anchor="middle" class="label" font-size="19" font-weight="700">
    “Because flying is for birds with a better sense of direction.”
  </text>

  <g filter="url(#shadow)">
    <g class="wheel">
      <circle cx="235" cy="455" r="78" fill="#d9e1e8" class="ink"/>
      <circle cx="235" cy="455" r="10" fill="#20252b"/>
      <g stroke="#59636e" stroke-width="4">
        <path d="M235 377V533M157 455H313M180 400L290 510M290 400L180 510"/>
      </g>
    </g>
    <g class="wheel">
      <circle cx="570" cy="455" r="78" fill="#d9e1e8" class="ink"/>
      <circle cx="570" cy="455" r="10" fill="#20252b"/>
      <g stroke="#59636e" stroke-width="4">
        <path d="M570 377V533M492 455H648M515 400L625 510M625 400L515 510"/>
      </g>
    </g>

    <path d="M235 455 L350 350 L470 455 L235 455 L410 455 L350 350 L570 455 L520 325" fill="none" class="ink" stroke="#e34c4c"/>
    <path d="M520 325 L545 300" fill="none" class="ink"/>
    <path d="M520 325 L557 330" fill="none" class="ink"/>
    <path d="M350 350 L332 316" fill="none" class="ink"/>
    <path d="M332 316 H375" fill="none" class="ink"/>

    <g class="pedal">
      <circle cx="410" cy="455" r="18" fill="#f7c948" class="ink"/>
      <path d="M410 455 L440 430 M410 455 L380 480" fill="none" class="ink"/>
      <rect x="438" y="423" width="18" height="9" rx="4" fill="#20252b"/>
      <rect x="372" y="476" width="18" height="9" rx="4" fill="#20252b"/>
    </g>

    <g class="rider">
      <ellipse cx="390" cy="267" rx="88" ry="76" fill="#f4f0df" class="ink"/>
      <path d="M337 276 Q285 250 300 210 Q324 171 366 202 Q385 219 378 264Z" fill="#e5e0ce" class="ink"/>
      <path d="M365 213 Q405 167 451 197 Q489 224 465 270 Q440 303 390 290Z" fill="#faf7e9" class="ink"/>
      <circle cx="440" cy="196" r="38" fill="#f4f0df" class="ink"/>
      <path d="M470 204 Q563 215 620 254 Q575 285 470 246Z" fill="#f2a23a" class="ink"/>
      <path d="M615 254 Q647 265 666 252 Q650 286 611 274Z" fill="#e7832f" class="ink"/>
      <circle cx="450" cy="187" r="7" fill="#20252b"/>
      <path d="M428 174 Q452 158 474 175" fill="none" class="ink" stroke-width="5"/>
      <path d="M355 292 Q328 330 330 365" fill="none" class="ink"/>
      <path d="M421 292 Q448 325 465 361" fill="none" class="ink"/>
      <path d="M330 365 L292 424" fill="none" class="ink"/>
      <path d="M465 361 L510 420" fill="none" class="ink"/>
      <path d="M292 424 L270 447" fill="none" class="ink"/>
      <path d="M510 420 L530 446" fill="none" class="ink"/>
      <path d="M336 245 Q300 225 276 239" fill="none" class="ink" stroke="#cf5b52"/>
      <path d="M455 260 Q489 275 507 296" fill="none" class="ink" stroke="#cf5b52"/>
      <path d="M518 240 Q545 221 565 237" fill="none" class="ink" stroke="#20252b" stroke-width="4"/>
    </g>

    <g transform="translate(520 112) rotate(8)">
      <ellipse cx="0" cy="0" rx="72" ry="28" fill="#f05b4f" class="ink"/>
      <path d="M-62 -14 Q-18 -68 52 -42 Q72 -33 62 -15 Q-7 10 -62 -14Z" fill="#ffd45c" class="ink"/>
      <circle cx="48" cy="-29" r="6" fill="#20252b"/>
      <path d="M-75 5 Q-95 24 -87 40" fill="none" class="ink"/>
    </g>
  </g>

  <path d="M675 382 q24 -20 48 0 q-24 18 -48 0Z" fill="#fff" opacity=".8"/>
  <path d="M95 170 q24 -20 48 0 q-24 18 -48 0Z" fill="#fff" opacity=".8"/>

  <rect x="28" y="555" width="744" height="32" rx="8" fill="#fff8df" stroke="#20252b" stroke-width="3"/>
  <text x="400" y="577" text-anchor="middle" class="label" font-size="16" font-weight="700">
    2026-10-28 04:31:58 SGT (UTC+08:00)
  </text>
</svg>