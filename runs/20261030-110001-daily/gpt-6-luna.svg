<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down city grid with shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4">
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">City-block route: A1 to E5</text>

  <!-- Streets -->
  <g stroke="#b9c1ca" stroke-width="3" stroke-linecap="round">
    <path d="M100 70H500 M100 130H500 M100 190H500 M100 250H500 M100 310H500"/>
    <path d="M100 70V310 M200 70V310 M300 70V310 M400 70V310 M500 70V310"/>
  </g>

  <!-- Shortest route: 8 street segments -->
  <path d="M100 70H200 V70 H300 V70 H400 V70 H500 V130 H500 V190 H500 V250 H500 V310"
        fill="none" stroke="#1677e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#7c8794" stroke-width="2">
    <circle cx="100" cy="70" r="6"/><circle cx="200" cy="70" r="6"/><circle cx="300" cy="70" r="6"/><circle cx="400" cy="70" r="6"/><circle cx="500" cy="70" r="6"/>
    <circle cx="100" cy="130" r="6"/><circle cx="200" cy="130" r="6"/><circle cx="300" cy="130" r="6"/><circle cx="400" cy="130" r="6"/><circle cx="500" cy="130" r="6"/>
    <circle cx="100" cy="190" r="6"/><circle cx="200" cy="190" r="6"/><circle cx="300" cy="190" r="6"/><circle cx="400" cy="190" r="6"/><circle cx="500" cy="190" r="6"/>
    <circle cx="100" cy="250" r="6"/><circle cx="200" cy="250" r="6"/><circle cx="300" cy="250" r="6"/><circle cx="400" cy="250" r="6"/><circle cx="500" cy="250" r="6"/>
    <circle cx="100" cy="310" r="6"/><circle cx="200" cy="310" r="6"/><circle cx="300" cy="310" r="6"/><circle cx="400" cy="310" r="6"/><circle cx="500" cy="310" r="6"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="70" r="10" fill="#18a558" stroke="#fff" stroke-width="3"/>
  <circle cx="500" cy="310" r="10" fill="#e89b16" stroke="#fff" stroke-width="3"/>

  <!-- Blocked intersections -->
  <g stroke="#d62828" stroke-width="5" stroke-linecap="round">
    <path d="M192 122L208 138 M208 122L192 138"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M392 242L408 258 M408 242L392 258"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#28323c" text-anchor="middle">
    <text x="100" y="53">A1</text><text x="200" y="53">B1</text><text x="300" y="53">C1</text><text x="400" y="53">D1</text><text x="500" y="53">E1</text>
    <text x="100" y="119">A2</text><text x="200" y="119">B2</text><text x="300" y="119">C2</text><text x="400" y="119">D2</text><text x="500" y="119">E2</text>
    <text x="100" y="179">A3</text><text x="200" y="179">B3</text><text x="300" y="179">C3</text><text x="400" y="179">D3</text><text x="500" y="179">E3</text>
    <text x="100" y="239">A4</text><text x="200" y="239">B4</text><text x="300" y="239">C4</text><text x="400" y="239">D4</text><text x="500" y="239">E4</text>
    <text x="100" y="299">A5</text><text x="200" y="299">B5</text><text x="300" y="299">C5</text><text x="400" y="299">D5</text><text x="500" y="299">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    <text x="112" y="66" fill="#148347">START</text>
    <text x="447" y="330" fill="#bb7410">END</text>
  </g>
  <text x="300" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1677e8">Route length: 8 street segments</text>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">2026-10-30 11:04:49 SGT (UTC+08:00)</text>
</svg>