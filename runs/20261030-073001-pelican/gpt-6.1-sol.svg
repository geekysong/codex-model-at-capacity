<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Express</title>
  <desc id="description">A self-important pelican cycles along a seaside road with a fish in its basket. Its wheels spin, its feet pedal, and its body bobs.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bcecf2"/>
      <stop offset="1" stop-color="#fff6d8"/>
    </linearGradient>
    <pattern id="road" width="90" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6H44" stroke="#fff8db" stroke-width="4"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-90 0" dur="1.2s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff8e8"/>
  <rect x="12" y="12" width="776" height="576" rx="22" fill="none" stroke="#243b43" stroke-width="4"/>
  <path d="M25 108H775V480H25Z" fill="url(#sky)"/>
  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="39" fill="#203a43">THE PELICAN EXPRESS</text>
  <text x="400" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="3" fill="#466269">BIG BILL. SMALL CARBON FOOTPRINT.</text>

  <circle cx="681" cy="168" r="35" fill="#ffd25e"/>
  <g fill="#fff" opacity=".85">
    <path d="M48 170q8-25 33-16q18-29 39-3q28-4 34 19Z"/>
    <path d="M570 128q9-20 28-10q20-25 38 3q18-1 24 14H570Z"/>
  </g>
  <path d="M25 339Q150 322 265 339T500 338T775 334V407H25Z" fill="#75c3c7"/>
  <path d="M31 361H135m33 16h94m323-22h108m29 28h78" stroke="#d6f4e9" stroke-width="4" stroke-linecap="round"/>
  <path d="M25 400Q400 382 775 402V480H25Z" fill="#d6b985"/>
  <path d="M25 435H775" stroke="#7d8175" stroke-width="72"/>
  <path d="M25 450H775" stroke="url(#road)" stroke-width="12"/>
  <ellipse cx="402" cy="451" rx="225" ry="12" fill="#384d48" opacity=".2"/>

  <!-- A small roadside verdict. -->
  <g stroke="#243b43" stroke-width="3">
    <path d="M98 326V423"/>
    <rect x="40" y="270" width="117" height="64" rx="7" fill="#fff8e8"/>
  </g>
  <text x="98" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#243b43">NO FREE</text>
  <text x="98" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#243b43">FISH RIDES</text>

  <!-- Wheels rotate around their own hubs. -->
  <g stroke="#243b43" fill="none">
    <g transform="translate(268 389)">
      <circle r="65" fill="#f7f2dc" stroke-width="10"/>
      <circle r="55" stroke="#a7b5aa" stroke-width="2"/>
      <g stroke-width="2.5">
        <path d="M-59 0H59M0-59V59M-42-42L42 42M-42 42L42-42"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle r="7" fill="#efb749" stroke-width="3"/>
    </g>
    <g transform="translate(541 389)">
      <circle r="65" fill="#f7f2dc" stroke-width="10"/>
      <circle r="55" stroke="#a7b5aa" stroke-width="2"/>
      <g stroke-width="2.5">
        <path d="M-59 0H59M0-59V59M-42-42L42 42M-42 42L42-42"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      </g>
      <circle r="7" fill="#efb749" stroke-width="3"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 389L329 293L378 389ZM329 293H493L378 389M493 293L541 389" stroke="#243b43" stroke-width="13"/>
    <path d="M268 389L329 293L378 389ZM329 293H493L378 389M493 293L541 389" stroke="#e9634f" stroke-width="7"/>
    <path d="M329 293L318 269M493 293L483 258L511 247" stroke="#243b43" stroke-width="8"/>
    <path d="M298 268H342" stroke="#243b43" stroke-width="13"/>
    <path d="M510 246L525 246" stroke="#e9634f" stroke-width="9"/>
    <path d="M222 320H287" stroke="#243b43" stroke-width="5"/>
  </g>

  <!-- The far foot pedals behind the bird. -->
  <g transform="translate(378 389)">
    <g>
      <path d="M0 0L-22-17" stroke="#243b43" stroke-width="5"/>
      <path d="M-35-17H-9" stroke="#243b43" stroke-width="7" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Pelican: all character details bob together. -->
  <g stroke="#243b43" stroke-width="4" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".6s" repeatCount="indefinite"/>
    <path d="M301 270L265 244L280 281L254 273L284 302" fill="#eef2e4"/>
    <path d="M283 257Q277 223 317 216Q352 212 376 244L411 264Q423 297 380 311Q319 326 292 292Z" fill="#fffdf0"/>
    <path d="M311 246Q343 230 377 276Q347 301 315 273" fill="#d3ded6"/>
    <path d="M321 256Q345 250 365 276" fill="none" stroke="#99afa8" stroke-width="3"/>

    <path d="M369 264Q391 248 381 215Q370 176 390 154Q405 139 426 154Q441 167 429 187Q410 212 431 242Q444 275 414 287Z" fill="#fffdf0"/>
    <path d="M424 178Q459 180 510 202Q492 237 451 226Q430 218 419 197Z" fill="#f5b968"/>
    <path d="M424 177L542 191Q553 195 538 200L425 194Z" fill="#f3c34e"/>
    <path d="M448 204Q469 217 492 211" fill="none" stroke="#d98b4a" stroke-width="2.5"/>
    <circle cx="414" cy="168" r="5" fill="#243b43" stroke="none"/>
    <circle cx="415" cy="166.5" r="1.5" fill="white" stroke="none"/>
    <path d="M401 156L419 151" fill="none" stroke-width="3"/>
    <path d="M389 146Q393 124 413 128L434 147Z" fill="#e9634f"/>
    <path d="M385 146H440" stroke-linecap="round"/>
    <path d="M389 222L421 228L404 240Z" fill="#e9634f"/>
    <path d="M407 231L433 257L418 268L397 239" fill="#e9634f"/>
    <path d="M373 263Q416 278 454 253L493 249" fill="none" stroke-width="10"/>
    <path d="M373 261Q416 276 454 251L493 247" fill="none" stroke="#f6f3e5" stroke-width="6"/>
  </g>

  <!-- The near leg and crank make a continuous pedaling cycle. -->
  <path d="M355 303Q374 325 378 350" fill="none" stroke="#e5a13c" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(378 389)">
    <circle r="15" fill="#e6c779" stroke="#243b43" stroke-width="4"/>
    <g>
      <path d="M0-39L22 17" stroke="#e5a13c" stroke-width="9" stroke-linecap="round"/>
      <path d="M0 0L22 17" stroke="#243b43" stroke-width="5"/>
      <path d="M12 16L38 14L32 24L12 24Z" fill="#efae42" stroke="#243b43" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Basket and deeply unimpressed passenger. -->
  <g stroke="#243b43" stroke-width="3" stroke-linejoin="round">
    <path d="M523 269H594L585 316H533Z" fill="#d6a76c"/>
    <path d="M535 278L542 309M551 278L555 312M568 278V312M583 278L578 310M530 289H590M533 302H587" fill="none" stroke="#986e43" stroke-width="2"/>
    <path d="M538 264Q552 245 576 257L593 246L591 269L577 265Q553 282 538 264Z" fill="#82bac1"/>
    <circle cx="548" cy="261" r="2.5" fill="#243b43" stroke="none"/>
    <path d="M543 253L554 256" fill="none" stroke-width="2"/>
    <path d="M538 269L550 270" fill="none" stroke-width="2"/>
  </g>

  <path d="M553 224L561 241L574 224H740Q755 224 755 209V163Q755 148 740 148H561Q546 148 546 163V209Q546 219 553 224Z" fill="#fffdf4" stroke="#243b43" stroke-width="3"/>
  <text x="650" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243b43">
    <tspan x="650">“I was promised</tspan>
    <tspan x="650" dy="24">a water taxi.”</tspan>
  </text>

  <rect x="26" y="480" width="748" height="93" rx="10" fill="#fff8e8"/>
  <text x="400" y="511" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#243b43">He gave up flying. The bill stayed enormous.</text>
  <path d="M85 531H715" stroke="#d5c9ad" stroke-width="1.5"/>
  <text x="400" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#46575b">2026-10-30 07:31:17 SGT (UTC+08:00)</text>
</svg>