<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a tiny bicycle along the waterfront, carrying fish in its enormous bill pouch. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="water" width="90" height="24" patternUnits="userSpaceOnUse">
      <path d="M8 12h42m12 0h12" fill="none" stroke="#87c4c6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="81" fill="#fff7df" stroke="#263442" stroke-width="12"/>
      <circle r="72" fill="none" stroke="#a5b7b9" stroke-width="3"/>
      <g stroke="#738c95" stroke-width="3">
        <path d="M-70 0H70M0-70V70M-49.5-49.5l99 99M-49.5 49.5l99-99"/>
      </g>
      <circle r="10" fill="#f7bd45" stroke="#263442" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect x="17" y="17" width="766" height="566" rx="20" fill="none" stroke="#263442" stroke-width="3"/>
  <path d="M35 113H765" stroke="#263442" stroke-width="3"/>
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="3" fill="#263442">TOUR DE BEAK</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#b34e39">BIG BILL. TINY BIKE. ZERO SHAME.</text>

  <path d="M35 132H765V419H35Z" fill="#cce9e4"/>
  <circle cx="113" cy="191" r="37" fill="#ffcf66"/>
  <path d="M35 321Q180 303 322 321T610 321T765 321V423H35Z" fill="#a9d5d2"/>
  <path d="M35 336H765V421H35Z" fill="url(#water)"/>
  <g fill="none" stroke="#688f97" stroke-width="3" stroke-linecap="round">
    <path d="M176 204q12-12 24 0q12-12 24 0M90 271q9-9 18 0q9-9 18 0"/>
  </g>
  <path d="M35 426H765V506H35Z" fill="#eacb94"/>
  <path d="M35 426H765" stroke="#263442" stroke-width="4"/>
  <path d="M64 487H161m106 0h100m111 0h100m95 0h60" stroke="#fff7df" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="412" cy="480" rx="267" ry="13" fill="#b99163" opacity=".3"/>

  <g font-family="Arial, sans-serif" fill="#263442">
    <path d="M560 145h177q13 0 13 13v63q0 13-13 13H620l-34 25 8-25h-34q-13 0-13-13v-63q0-13 13-13Z" fill="#fffdf4" stroke="#263442" stroke-width="3"/>
    <text x="648" y="174" text-anchor="middle" font-size="18" font-weight="bold">“It's called</text>
    <text x="648" y="198" text-anchor="middle" font-size="20" font-weight="bold">CARP-POOLING.”</text>
    <text x="648" y="220" text-anchor="middle" font-size="13">One rider. Six passengers.</text>
  </g>

  <!-- The wheels rotate independently of the frame. -->
  <g transform="translate(240 399)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(590 399)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <g stroke="#263442" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M240 399l91-113 65 113H240l66-84h225L396 399"/>
    <path d="M331 286l-13-29M590 399l-67-144 24-17"/>
  </g>
  <g stroke="#ed6951" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M240 399l91-113 65 113H240l66-84h225L396 399M590 399l-67-144"/>
  </g>
  <path d="M294 257h55" stroke="#263442" stroke-width="14" stroke-linecap="round"/>
  <path d="M524 255l22-17h28" fill="none" stroke="#263442" stroke-width="8" stroke-linecap="round"/>
  <circle cx="549" cy="239" r="8" fill="#f7bd45" stroke="#263442" stroke-width="3"/>
  <path d="M240 399l156-14v28Z" fill="#e2b77b" stroke="#263442" stroke-width="3"/>
  <circle cx="396" cy="399" r="24" fill="#fff7df" stroke="#263442" stroke-width="5"/>

  <!-- The rider and its absurd cargo bob gently together. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".75s" repeatCount="indefinite"/>
    <path d="M326 281l48 39 22 53" fill="none" stroke="#263442" stroke-width="15" stroke-linecap="round"/>
    <path d="M326 281l48 39 22 53" fill="none" stroke="#efac39" stroke-width="9" stroke-linecap="round"/>
    <path d="M365 376q24-15 51 0l-2 11h-45Z" fill="#efac39" stroke="#263442" stroke-width="3"/>

    <path d="M277 247l-31-33 46 13q44-56 109-18l15 42q-39 57-109 33Z" fill="#fffdf4" stroke="#263442" stroke-width="4" stroke-linejoin="round"/>
    <path d="M297 239q40-32 85 0q-24 44-73 14" fill="#dce5df" stroke="#263442" stroke-width="3"/>
    <path d="M322 245l27 3m-17 9 22 1" fill="none" stroke="#9aaca9" stroke-width="3" stroke-linecap="round"/>
    <path d="M386 252q-8-38 15-75q14-27 39-19q26 10 17 32q-6 15-22 16l-18 50" fill="#fffdf4" stroke="#263442" stroke-width="4"/>
    <path d="M410 228q27 34 89 24l44-11" fill="none" stroke="#263442" stroke-width="15" stroke-linecap="round"/>
    <path d="M410 228q27 34 89 24l44-11" fill="none" stroke="#fffdf4" stroke-width="9" stroke-linecap="round"/>

    <path d="M447 188l172 15q-30 85-112 67q-54-11-60-82Z" fill="#f5bd55" stroke="#263442" stroke-width="4"/>
    <g fill="#76b0b2" stroke="#263442" stroke-width="2.5" stroke-linejoin="round">
      <path d="M477 230q17-19 39 0q-21 18-39 0l-10 9v-18Z"/>
      <path d="M521 250q17-19 37 0q-20 17-37 0l-10 8v-16Z"/>
      <path d="M552 225q16-17 35 0q-19 16-35 0l-10 8v-16Z"/>
    </g>
    <g fill="#263442">
      <circle cx="507" cy="228" r="2.5"/>
      <circle cx="549" cy="248" r="2.5"/>
      <circle cx="579" cy="223" r="2.5"/>
    </g>
    <path d="M447 184l188 18q-3 12-24 10l-164-13Z" fill="#f29238" stroke="#263442" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="438" cy="178" r="6" fill="#263442"/>
    <circle cx="440" cy="176" r="1.8" fill="white"/>
    <path d="M426 166l18 3" stroke="#263442" stroke-width="4" stroke-linecap="round"/>

    <path d="M399 159q2-39 36-37q31 2 34 35Z" fill="#ed6951" stroke="#263442" stroke-width="4"/>
    <path d="M420 128l-5 21m22-23-1 22m17-17 4 16" stroke="#263442" stroke-width="5" stroke-linecap="round"/>
    <path d="M393 158h82" stroke="#263442" stroke-width="6" stroke-linecap="round"/>
    <path d="M404 162l12 32 18 8" fill="none" stroke="#263442" stroke-width="3"/>
    <path d="M396 211l-20 11-18-15-29 10 18 16 32-1 23-8" fill="#ed6951" stroke="#263442" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g transform="translate(396 399)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#263442" stroke-width="6" stroke-linecap="round"/>
      <path d="M-31-5h14v10h-14ZM17-5h14v10H17Z" fill="#f7bd45" stroke="#263442" stroke-width="3"/>
    </g>
    <circle r="6" fill="#ed6951" stroke="#263442" stroke-width="3"/>
  </g>
  <g fill="none" stroke="#263442" stroke-width="3" stroke-linecap="round">
    <path d="M126 360h32m-47 15h39m-27 16h22"/>
  </g>

  <rect x="35" y="508" width="730" height="61" fill="#fff7df"/>
  <text x="400" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#263442">The pelican's commute comes with an in-flight meal.</text>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#445461">2026-10-30 07:30:01 SGT (UTC+08:00)</text>
</svg>