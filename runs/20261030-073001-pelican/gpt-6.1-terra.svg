<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pedalican</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels and a bobbing body.</desc>
  <defs>
    <style>
      .ink { stroke: #263544; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { animation: bob 1s ease-in-out infinite; }
      .pedals { transform-origin: 390px 412px; animation: spin 2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff7e6"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#dff5f2" stroke="#263544" stroke-width="4"/>
  <text x="400" y="70" text-anchor="middle" fill="#263544" font-family="Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="2">THE PEDALICAN</text>
  <text x="400" y="100" text-anchor="middle" fill="#485d63" font-family="Arial, sans-serif" font-size="18" font-weight="bold">Two wheels. One very large bill.</text>

