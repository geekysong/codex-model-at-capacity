<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A determined pelican pedals a bicycle along a seaside road, with spinning wheels and a gentle bobbing motion.</desc>
  <defs>
    <style>
      .ink{stroke:#29364a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#29364a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .title{font-family:Verdana,sans-serif;font-weight:900;fill:#29364a}
      .caption{font-family:Verdana,sans-serif;fill:#29364a}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.8s linear infinite}
      .rider{animation:bob .65s ease-in-out infinite alternate}
      .pedals{transform-origin:408px 400px;animation:spin 1.8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#fff" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect x="16" y="16" width="768" height="568" rx="24" fill="#d9f2ef" stroke="#29364a" stroke-width="5"/>
  <path d="M19 350 Q130 320 240 349 T460 343 T781 337 V493 H19Z" fill="#82c9ca"/>
  <path d="M20 393 Q180 379 360 393 T780 388 V493 H20Z" fill="#b7ded2"/>
  <circle cx="686" cy="115" r="39" fill="#ffcd62"/>
  <path d="M78 143 q17 -17 34 0 q17 -17 34 0 M584 185 q12 -12 24 0 q12 -12 24 0" fill="none" stroke="#7eaaa7" stroke-width="4" stroke-linecap="round"/>
  <path d="M31 442 H769" stroke="#29364a" stroke-width="7" stroke-linecap="round"/>
  <path d="M48 461 H154 M183 461 H236 M660 461 H742" stroke="#74aaa1" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="70" text-anchor="middle" class="title" font-size="37" letter-spacing="1">THE PELICAN EXPRESS</text>
  <text x="400" y="98" text-anchor="middle" class="caption" font-size="15" font-weight="bold">COASTAL COMMUTER OF THE YEAR</text>

  <g fill="none" stroke="#6aaba9" stroke-width="5" stroke-linecap="round">
    <path d="M82 334 h85 M111 350 h55 M68 366 h86"/>
  </g>

  <g class="wheel">
    <circle cx="253" cy="379" r="63" fill="#fff9e9" class="ink"/>
    <circle cx="253" cy="379" r="51" fill="none" stroke="#8abbb8" stroke-width="3"/>
    <path d="M253 317 V441 M191 379 H315 M209 335 L297 423 M209 423 L297 335" fill="none" stroke="#8abbb8" stroke-width="3"/>
    <circle cx="253" cy="379" r="7" fill="#29364a"/>
  </g>
  <g class="wheel">
    <circle cx="550" cy="379" r="63" fill="#fff9e9" class="ink"/>
