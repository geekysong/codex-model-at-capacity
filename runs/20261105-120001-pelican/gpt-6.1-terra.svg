    <path d="M550 317 V441 M488 379 H612 M506 335 L594 423 M506 423 L594 335" fill="none" stroke="#8abbb8" stroke-width="3"/>
    <circle cx="550" cy="379" r="7" fill="#29364a"/>
  </g>

  <g fill="none" stroke="#e75b51" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M253 379 L343 303 L408 400 L253 379 L376 370 L343 303"/>
    <path d="M408 400 L490 303 L550 379 M376 370 L490 303"/>
  </g>
  <path d="M490 303 l-13 -35 h31 q13 0 13 -12" fill="none" class="ink"/>
  <path d="M327 299 h42" fill="none" stroke="#29364a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="408" cy="400" r="13" fill="#fff4d9" class="thin"/>
