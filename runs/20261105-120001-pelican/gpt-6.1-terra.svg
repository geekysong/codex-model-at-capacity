    <path d="M470 171 Q518 169 574 164 Q565 206 523 216 Q487 223 467 187Z" fill="#f4c05c" class="ink"/>
    <path d="M484 184 Q514 190 545 181" fill="none" stroke="#ca8437" stroke-width="3" stroke-linecap="round"/>
    <path d="M402 174 q-14 6 -23 1" fill="none" stroke="#e75b51" stroke-width="7" stroke-linecap="round"/>
    <path d="M387 176 l-9 27 15 -8 5 -20" fill="#e75b51" class="thin"/>
    <path d="M478 103 q17 -10 36 0" fill="none" stroke="#29364a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(594 230) rotate(6)">
    <rect x="0" y="0" width="121" height="54" rx="8" fill="#fff9e9" class="thin"/>
    <text x="60.5" y="22" text-anchor="middle" class="title" font-size="14">FISH LANE</text>
    <text x="60.5" y="42" text-anchor="middle" class="caption" font-size="13" font-weight="bold">→ THIS WAY</text>
  </g>

  <path d="M30 493 H770" stroke="#29364a" stroke-width="3"/>
  <rect x="20" y="496" width="760" height="83" rx="0" fill="#fff4d9"/>
  <text x="400" y="529" text-anchor="middle" class="caption" font-size="19" font-weight="bold">He insists the bike is faster than flying.</text>
