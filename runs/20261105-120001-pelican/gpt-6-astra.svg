<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="description">An indignant pelican pedals a tiny bicycle with a huge fish-filled beak pouch. Its wheels spin, its feet pedal, and its body bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1" fill="#ddcfaf" opacity=".25"/>
      <circle cx="17" cy="20" r=".8" fill="#ddcfaf" opacity=".25"/>
    </pattern>
    <g id="wheel">
      <circle r="74" fill="#fff8e8" stroke="#263c40" stroke-width="11"/>
      <circle r="64" fill="none" stroke="#e7ab59" stroke-width="3"/>
      <g stroke="#547174" stroke-width="3">
        <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44"/>
      </g>
      <path d="M-15-63L-3-65" stroke="#e95740" stroke-width="6" stroke-linecap="round"/>
      <circle r="9" fill="#263c40"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5dd"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M26 110H774" stroke="#263c40" stroke-width="3"/>
  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#263c40">TOUR DE FISH</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#b84932">ONE BIRD. TWO WHEELS. ZERO DIGNITY.</text>

  <!-- A single windswept seaside scene. -->
  <path d="M28 356Q140 327 252 352T477 349T774 345V467H28Z" fill="#cce3d8"/>
  <path d="M29 378Q149 357 270 377T516 374T774 370" fill="none" stroke="#a0c8bc" stroke-width="3"/>
  <path d="M58 182q14-13 28 0q14-13 28 0M664 161q12-12 24 0q12-12 24 0" fill="none" stroke="#8ba6a0" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="409" cy="470" rx="255" ry="13" fill="#263c40" opacity=".13"/>
  <path d="M40 472H760" stroke="#263c40" stroke-width="4" stroke-linecap="round"/>

  <!-- The wheels rotate around their own hubs. -->
  <g transform="translate(245 391)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(574 391)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- A comically undersized commuter bicycle. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 391L327 301L389 391ZM327 301H505L389 391M505 301L574 391" fill="none" stroke="#263c40" stroke-width="14"/>
    <path d="M245 391L327 301L389 391ZM327 301H505L389 391M505 301L574 391" fill="none" stroke="#e95740" stroke-width="8"/>
    <path d="M327 301L315 277M505 301L493 258L523 245L543 255" fill="none" stroke="#263c40" stroke-width="9"/>
    <path d="M290 278Q316 270 341 278" fill="none" stroke="#263c40" stroke-width="13"/>
    <circle cx="389" cy="391" r="20" fill="#f4c45d" stroke="#263c40" stroke-width="5"/>
    <path d="M245 391L389 372Q414 389 391 410Z" fill="none" stroke="#263c40" stroke-width="3"/>
    <path d="M165 331H286M182 331L202 354" fill="none" stroke="#263c40" stroke-width="6"/>
  </g>

  <!-- Rider and wings bob gently, without moving any lettering. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M310 281Q281 307 277 335L366 381" fill="none" stroke="#bf7a27" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M310 281Q281 307 277 335L366 381;M310 281Q301 315 321 346L412 401;M310 281Q281 307 277 335L366 381" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M280 226L211 210L235 247L204 241Q247 283 290 275" fill="#fffdf1" stroke="#263c40" stroke-width="4" stroke-linejoin="round"/>
    <path d="M265 216Q295 180 353 202Q373 208 379 181L383 158Q388 133 409 139Q433 144 430 168L425 213Q419 264 362 291Q286 318 263 265Q254 241 265 216Z" fill="#fffdf1" stroke="#263c40" stroke-width="4"/>
    <path d="M277 224Q310 206 350 229L323 265L301 249L293 261Q274 248 277 224Z" fill="#dce4dc" stroke="#263c40" stroke-width="3" stroke-linejoin="round"/>
    <path d="M351 231Q396 270 493 256" fill="none" stroke="#263c40" stroke-width="15" stroke-linecap="round"/>
    <path d="M351 228Q396 267 491 253" fill="none" stroke="#fffdf1" stroke-width="10" stroke-linecap="round"/>
    <path d="M419 174L617 192Q589 267 479 242Q440 230 419 174Z" fill="#f1bf64" stroke="#263c40" stroke-width="4"/>
    <path d="M467 213Q502 189 540 211L565 197L560 221L540 218Q500 240 467 213Z" fill="#6ca6a5" stroke="#263c40" stroke-width="3"/>
    <circle cx="483" cy="210" r="3.5" fill="#263c40"/>
    <path d="M496 212l10 6m8-10 9 7" fill="none" stroke="#397273" stroke-width="2"/>
    <path d="M418 171L634 183L617 197L420 188Z" fill="#ef943d" stroke="#263c40" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="411" cy="160" rx="10" ry="13" fill="white" stroke="#263c40" stroke-width="3"/>
    <circle cx="416" cy="163" r="4" fill="#263c40"/>
    <path d="M398 143L421 149" fill="none" stroke="#263c40" stroke-width="5" stroke-linecap="round"/>
    <path d="M379 142Q384 112 407 120Q428 122 434 142Z" fill="#e95740" stroke="#263c40" stroke-width="4"/>
    <path d="M393 123L391 136M407 124L408 136M420 129L423 138" stroke="#263c40" stroke-width="4"/>
    <path d="M383 143L390 180L405 185" fill="none" stroke="#263c40" stroke-width="3"/>
    <path d="M374 197L395 211L371 221L345 195Z" fill="#e95740" stroke="#263c40" stroke-width="3"/>
    <path d="M369 209L323 188L331 210L298 199L349 228Z" fill="#e95740" stroke="#263c40" stroke-width="3"/>
    <path d="M352 282Q379 312 365 337L412 401" fill="none" stroke="#e6a13f" stroke-width="14" stroke-linecap="round">
      <animate attributeName="d" values="M352 282Q379 312 365 337L412 401;M352 282Q346 308 342 329L366 381;M352 282Q379 312 365 337L412 401" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Cranks and webbed feet pedal together. -->
  <g transform="translate(389 391)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-23-10L23 10" stroke="#263c40" stroke-width="6"/>
      <g transform="translate(23 10)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-10-8L17-3L23 7H-15Z" fill="#ef943d" stroke="#263c40" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-16 10H23" stroke="#263c40" stroke-width="5"/>
        </g>
      </g>
      <g transform="translate(-23 -10)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-10-8L17-3L23 7H-15Z" fill="#ef943d" stroke="#263c40" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-16 10H23" stroke="#263c40" stroke-width="5"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#263c40"/>
  </g>

  <g fill="none" stroke="#547174" stroke-width="3" stroke-linecap="round">
    <path d="M143 270H199M116 284H181M144 299H204"/>
    <path d="M449 144l7-10m1 21 13-3"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#263c40">
    <path d="M59 132H262Q274 132 274 144V188Q274 200 262 200H235L244 218L212 200H59Q47 200 47 188V144Q47 132 59 132Z" fill="#fffdf5" stroke="#263c40" stroke-width="3"/>
    <text x="160" y="159" text-anchor="middle" font-size="18" font-weight="bold">“The airline charged</text>
    <text x="160" y="184" text-anchor="middle" font-size="18" font-weight="bold">extra for my bill.”</text>
    <text x="400" y="510" text-anchor="middle" font-size="22" font-weight="bold">This pelican’s commute is powered by pure fishful thinking.</text>
  </g>

  <!-- Dedicated footer keeps the timestamp clear of the cartoon and caption. -->
  <rect x="0" y="539" width="800" height="61" fill="#263c40"/>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fff5dd">2026-11-05 12:00:01 SGT (UTC+08:00)</text>
</svg>