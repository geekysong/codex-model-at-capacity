<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">THE GREAT WHEEL DEAL</title>
  <desc id="description">A smug pelican rides a bicycle while its enormous beak catches the wind. The wheels spin and the pelican pedals in a loop.</desc>
  <defs>
    <style>
      .ink{stroke:#17324a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:700}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .6s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff4d7"/>
  <path d="M0 138H800" stroke="#f2c66d" stroke-width="3"/>
  <text x="400" y="58" text-anchor="middle" class="small" font-size="34" letter-spacing="1.5" fill="#17324a">THE GREAT WHEEL DEAL</text>
  <text x="400" y="91" text-anchor="middle" class="small" font-size="16" fill="#bd4c36">A pelican’s guide to getting nowhere, faster.</text>

  <!-- Breezy backdrop -->
  <path d="M90 192h110m-82 22h72M606 188h94m-58 22h45" fill="none" stroke="#80c9c2" stroke-width="5" stroke-linecap="round"/>
  <path d="M128 180q12-12 24 0M642 176q12-12 24 0" fill="none" stroke="#80c9c2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="674" cy="154" r="23" fill="#f6bf4e"/>
  <path d="M674 119v-10m0 90v-10m35-35h10m-90 0h10m60-25 8-8m-66 66 8-8m50 0 8 8m-66-66 8 8" stroke="#f6bf4e" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M76 471H724" stroke="#17324a" stroke-width="5" stroke-linecap="round"/>
  <path d="M108 484h88m390 0h82" stroke="#80c9c2" stroke-width="5" stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M246 420 335 305 444 420 246 420 390 420 335 305 470 305 444 420"/>
    <path d="M470 305h43m-158 0h-32m149 0 20-28m-22 28h-29"/>
    <path d="M335 305l-17-13m-13 0h26"/>
    <path d="M444 420l16 17m-28 0h39"/>
  </g>

  <!-- Spinning wheels -->
  <g class="wheel" fill="none" stroke="#17324a" stroke-width="5">
    <circle cx="246" cy="420" r="52"/>
    <circle cx="246" cy="420" r="7" fill="#f2c66d"/>
    <path d="M246 368v104m-52-52h104m-89-37 74 74m0-74-74 74"/>
  </g>
  <g class="wheel" fill="none" stroke="#17324a" stroke-width="5">
    <circle cx="444" cy="420" r="52"/>
    <circle cx="444" cy="420" r="7" fill="#f2c66d"/>
    <path d="M444 368v104m-52-52h104m-89-37 74 74m0-74-74 74"/>
  </g>

  <!-- Pelican and pedaling motion -->
  <g class="rider">
    <!-- legs -->
    <path d="M365 282 401 350 390 408" fill="none" stroke="#e7863e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M380 287 349 351 305 405" fill="none" stroke="#e7863e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M378 286 399 350 438 365" fill="none" stroke="#e7863e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M363 282 345 350 325 361" fill="none" stroke="#e7863e" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M390 408h-25m-60-3h-23" fill="none" stroke="#17324a" stroke-width="8" stroke-linecap="round"/>
    <!-- feathers/body -->
    <path d="M326 204q9-30 44-31 42 0 54 39l-15 77q-35 18-78-2l-17-51z" fill="#fff" class="ink"/>
    <path d="M332 219q17 7 31 0m-37 16q17 7 31 0m29-13q15 7 29 0" fill="none" stroke="#b6d9d2" stroke-width="5" stroke-linecap="round"/>
    <!-- tail -->
    <path d="m400 224 36-15-14 34" fill="#fff" class="ink"/>
    <!-- neck and head -->
    <path d="M352 198q-8-54 18-75 17-15 40-4l-13 31q-17 17-10 50" fill="#fff" class="ink"/>
    <ellipse cx="395" cy="112" rx="38" ry="34" fill="#fff" class="ink"/>
    <!-- crest -->
    <path d="M373 82l-8-17 20 11 6-19 12 17 14-11-2 24" fill="#e7863e" class="ink"/>
    <!-- giant comic beak -->
    <path d="M424 113q59-31 137-18-29 41-116 43z" fill="#f2a343" class="ink"/>
    <path d="M438 139q45 7 73 2-15 47-48 46-24-3-25-48" fill="#e97c43" class="ink"/>
    <path d="M440 141q31 8 69 0" fill="none" stroke="#17324a" stroke-width="4"/>
    <circle cx="406" cy="105" r="5.5" fill="#17324a"/>
    <path d="M400 118q-8 9-18 3" fill="none" stroke="#17324a" stroke-width="3" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M338 217q22-24 48-6-13 33-43 40-17-8-5-34z" fill="#d9eee6" class="ink"/>
    <path d="m345 229 25-9m-19 20 22-8" stroke="#8abdb5" stroke-width="4" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M365 91q12-31 44-23 18 5 23 24l-65 4z" fill="#e85d45" class="ink"/>
    <path d="M361 95h75" stroke="#17324a" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Comedy detail -->
  <path d="M573 112q-4-18 12-21 16-3 18 13" fill="none" stroke="#bd4c36" stroke-width="4" stroke-linecap="round"/>
  <text x="610" y="116" class="small" font-size="13" fill="#bd4c36">WIND RESISTANCE:</text>
  <text x="610" y="134" class="small" font-size="13" fill="#bd4c36">ABSOLUTELY NOT</text>
  <path d="M581 145 548 164" fill="none" stroke="#bd4c36" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Caption and footer -->
  <rect x="90" y="500" width="620" height="49" rx="15" fill="#17324a"/>
  <text x="400" y="531" text-anchor="middle" class="small" font-size="19" fill="#fff4d7">“I’m making great time. The scenery is just very committed to staying put.”</text>
  <text x="400" y="579" text-anchor="middle" class="small" font-size="14" fill="#17324a">2026-11-05 12:02:27 SGT (UTC+08:00)</text>
</svg>