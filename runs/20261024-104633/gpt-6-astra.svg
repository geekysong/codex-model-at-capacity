<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #111827; font-size: 18px; }
      .small { font-family: Arial, sans-serif; fill: #111827; font-size: 16px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Level seesaw -->
  <rect x="90" y="208" width="420" height="24" rx="5" fill="#b7791f" stroke="#5b3a0a" stroke-width="3"/>
  <line x1="300" y1="195" x2="300" y2="245" stroke="#374151" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="270,300 330,300 300,230" fill="#64748b" stroke="#1f2937" stroke-width="3"/>
  <line x1="250" y1="300" x2="350" y2="300" stroke="#1f2937" stroke-width="5"/>

  <!-- Hanging masses -->
  <line x1="180" y1="232" x2="180" y2="275" stroke="#374151" stroke-width="3"/>
  <rect x="145" y="275" width="70" height="48" rx="6" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
  <text x="180" y="305" text-anchor="middle" class="label">6 kg</text>

  <line x1="420" y1="232" x2="420" y2="275" stroke="#374151" stroke-width="3"/>
  <rect x="385" y="275" width="70" height="48" rx="6" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <text x="420" y="305" text-anchor="middle" class="label">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="255" x2="180" y2="335" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="180" y="355" text-anchor="middle" class="small">6g downward</text>

  <line x1="420" y1="255" x2="420" y2="335" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="355" text-anchor="middle" class="small">4g downward</text>

  <!-- Distance dimensions -->
  <line x1="180" y1="175" x2="300" y2="175" stroke="#374151" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="180" y1="185" x2="180" y2="205" stroke="#374151" stroke-width="2"/>
  <line x1="300" y1="185" x2="300" y2="205" stroke="#374151" stroke-width="2"/>
  <text x="240" y="165" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="145" x2="420" y2="145" stroke="#374151" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="300" y1="155" x2="300" y2="205" stroke="#374151" stroke-width="2"/>
  <line x1="420" y1="155" x2="420" y2="205" stroke="#374151" stroke-width="2"/>
  <text x="360" y="135" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equilibrium statement -->
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#166534">BALANCED</text>
  <text x="300" y="90" text-anchor="middle" class="label">Torque equilibrium: 6 × 2 = 4 × 3</text>
</svg>