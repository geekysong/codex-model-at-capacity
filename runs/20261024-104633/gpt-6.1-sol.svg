<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f4e79"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #222; font-size: 20px; }
      .small { font-family: Arial, sans-serif; fill: #222; font-size: 17px; }
      .beam { stroke: #8b5a2b; stroke-width: 14; stroke-linecap: round; }
      .force { stroke: #1f4e79; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Level seesaw -->
  <line x1="100" y1="210" x2="500" y2="210" class="beam"/>
  <circle cx="300" cy="210" r="7" fill="#333"/>
  <path d="M265 285 L335 285 L300 210 Z" fill="#777" stroke="#444" stroke-width="2"/>
  <text x="300" y="315" text-anchor="middle" class="small">pivot</text>

  <!-- Left suspension and mass -->
  <line x1="220" y1="210" x2="220" y2="250" stroke="#333" stroke-width="3"/>
  <rect x="185" y="250" width="70" height="55" rx="6" fill="#d95f59" stroke="#8c2f2b" stroke-width="2"/>
  <text x="220" y="284" text-anchor="middle" class="label" fill="white">6 kg</text>
  <line x1="220" y1="225" x2="220" y2="245" class="force"/>
  <text x="220" y="178" text-anchor="middle" class="small">6g downward</text>

  <!-- Right suspension and mass -->
  <line x1="420" y1="210" x2="420" y2="250" stroke="#333" stroke-width="3"/>
  <rect x="385" y="250" width="70" height="55" rx="6" fill="#4f81bd" stroke="#284e7b" stroke-width="2"/>
  <text x="420" y="284" text-anchor="middle" class="label" fill="white">4 kg</text>
  <line x1="420" y1="225" x2="420" y2="245" class="force"/>
  <text x="420" y="178" text-anchor="middle" class="small">4g downward</text>

  <!-- Distance dimensions -->
  <line x1="220" y1="340" x2="300" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="220" y1="332" x2="220" y2="348" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="332" x2="300" y2="348" stroke="#333" stroke-width="2"/>
  <text x="260" y="365" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="340" x2="420" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="332" x2="420" y2="348" stroke="#333" stroke-width="2"/>
  <text x="360" y="365" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equation and status -->
  <text x="300" y=" fifty" text-anchor="middle" class="label">6 × 2 = 4 × 3</text>
  <text x="300" y=" ninety" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#228b22">BALANCED</text>
</svg>