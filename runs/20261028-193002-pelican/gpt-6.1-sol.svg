<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICAN PEDAL-OFF</title>
  <desc id="desc">A smug pelican rides a bicycle while fish cheer from the roadside.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87d9f5"/>
      <stop offset="1" stop-color="#d9f6ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="1" stop-color="#3f464d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#173042" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202936;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#202936}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .rider{animation:bob .8s ease-in-out infinite alternate}
      .pedal{animation:pedal .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-5px)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="104" r="52" fill="#fff7b2" opacity=".8"/>
  <path d="M0 350 Q120 295 240 350 T480 350 T720 350 T960 350 V430 H0Z" fill="#79b978"/>
  <path d="M0 420 Q170 385 340 420 T680 420 T1000 420 V600 H0Z" fill="url(#road)"/>
  <path d="M0 500 H800" stroke="#f6d365" stroke-width="10" stroke-dasharray="55 35"/>
  <path d="M75 390 q18-32 36 0 M700 390 q18-32 36 0" fill="none" class="ink" stroke="#3f7d43"/>
  <g fill="#ffdc4a" class="ink">
    <path d="M95 390 l-12 28 h24z"/>
    <path d="M720 390 l-12 28 h24z"/>
  </g>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="34" font-weight="900" letter-spacing="2">THE GREAT PELICAN PEDAL-OFF</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="18" font-weight="700">“He’s got the biggest bill in the race—and still refuses to pay road tax.”</text>

  <g class="rider" filter="url(#shadow)">
    <g class="wheel" aria-label="spinning rear wheel">
      <circle cx="265" cy="430" r="76" fill="#1f2933" class="ink"/>
      <circle cx="265" cy="430" r="62" fill="#d9e4ea" stroke="#202936" stroke-width="5"/>
      <g stroke="#778894" stroke-width="3">
        <path d="M265 368V492 M203 430H327 M221 386L309 474 M309 386L221 474"/>
      </g>
      <circle cx="265" cy="430" r="9" fill="#202936"/>
    </g>
    <g class="wheel" aria-label="spinning front wheel">
      <circle cx="535" cy="430" r="76" fill="#1f2933" class="ink"/>
      <circle cx="535" cy="430" r="62" fill="#d9e4ea" stroke="#202936" stroke-width="5"/>
      <g stroke="#778894" stroke-width="3">
        <path d="M535 368V492 M473 430H597 M491 386L579 474 M579 386L491 474"/>
      </g>
      <circle cx="535" cy="430" r="9" fill="#202936"/>
    </g>

    <path d="M265 430 L345 330 L450 430 L535 430 L450 430 L395 360 L345 330" fill="none" class="ink" stroke="#e54b4b" stroke-width="12"/>
    <path d="M345 330 L315 280" fill="none" class="ink"/>
    <path d="M315 280 h62" fill="none" class="ink" stroke-width="10"/>
    <path d="M450 430 L470 292" fill="none" class="ink"/>
    <path d="M470 292 L535 430" fill="none" class="ink"/>
    <path d="M470 292 h48" fill="none" class="ink" stroke-width="9"/>
    <path d="M450 430 q-10 34 18 48" fill="none" class="ink" stroke-width="7"/>
    <g class="pedal" transform-origin="450 430">
      <circle cx="450" cy="430" r="13" fill="#f6c445" class="ink"/>
      <path d="M450 430 l-31 22 M450 430 l31-22" fill="none" class="ink" stroke-width="6"/>
      <path d="M405 456 h28 M467 404 h28" fill="none" class="ink" stroke-width="7"/>
    </g>

    <g>
      <ellipse cx="395" cy="245" rx="76" ry="91" fill="#f8f5e8" class="ink"/>
      <path d="M345 260 Q395 295 446 259 Q431 335 395 353 Q358 335 345 260Z" fill="#e9e0c7" class="ink"/>
      <path d="M350 180 Q388 135 430 168 Q454 186 445 225 Q432 254 395 257 Q356 251 350 220Z" fill="#f8f5e8" class="ink"/>
      <path d="M420 205 Q490 188 600 220 Q625 228 600 244 Q502 270 420 239Z" fill="#f29a54" class="ink"/>
      <path d="M585 220 q22 6 29 17 q-17 17-32 7" fill="#e87d3f" class="ink"/>
      <circle cx="425" cy="194" r="9" fill="#202936"/>
      <path d="M375 177 q-18-17-35-4" fill="none" class="ink"/>
      <path d="M371 281 Q398 300 427 279" fill="none" class="ink" stroke-width="5"/>
      <path d="M363 335 L326 393 M429 336 L472 392" fill="none" class="ink" stroke-width="12"/>
      <path d="M326 393 l-21 23 M472 392 l23 23" fill="none" class="ink" stroke-width="9"/>
      <path d="M335 382 q-5-45 13-77" fill="none" class="ink" stroke-width="10"/>
      <path d="M445 385 q17-42 6-78" fill="none" class="ink" stroke-width="10"/>
      <path d="M327 310 q-37-26-54 5 q33 17 59 8" fill="#f8f5e8" class="ink"/>
      <path d="M465 307 q35-23 49 8 q-28 15-53 7" fill="#f8f5e8" class="ink"/>
      <path d="M365 143 q29-24 58 0" fill="none" class="ink" stroke-width="7"/>
      <path d="M378 140 l-3-18 M400 137 v-20 M421 141 l6-18" stroke="#e54b4b" stroke-width="7"/>
    </g>
  </g>

  <g class="label" font-weight="700" font-size="20">
    <text x="95" y="470">FISH FANS</text>
    <text x="642" y="470">NO HONKING!</text>
  </g>
  <g fill="#5da9d6" class="ink">
    <path d="M108 515 q28-27 56 0 q-28 27-56 0Z"/>
    <path d="M119 515 l-18-14 v28z"/>
    <circle cx="145" cy="509" r="3" fill="#202936" stroke="none"/>
    <path d="M670 525 q28-27 56 0 q-28 27-56 0Z"/>
    <path d="M681 525 l-18-14 v28z"/>
    <circle cx="707" cy="519" r="3" fill="#202936" stroke="none"/>
  </g>
  <text x="400" y="565" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 19:30:47 SGT (UTC+08:00)</text>
</svg>