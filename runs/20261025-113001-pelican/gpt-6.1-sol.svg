      <path d="M391 310L413 348L398 393" fill="none" stroke="#203647" stroke-width="16" stroke-linecap="round"/>
      <path d="M391 310L413 348L398 393" fill="none" stroke="#eda744" stroke-width="10" stroke-linecap="round"/>
      <path d="M385 393l23-3 16 12-38 2Z" fill="#eda744" class="ink"/>
    </g>
  </g>

  <circle cx="379" cy="416" r="16" fill="#f7dc95" stroke="#203647" stroke-width="4"/>
  <g transform="translate(379 416)">
