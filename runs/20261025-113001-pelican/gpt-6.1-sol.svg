<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a tiny bicycle along a seaside road, carrying a fish in its enormous bill. The wheels turn and the pelican bobs in a seamless loop.</desc>
  <defs>
    <pattern id="road" width="130" height="12" patternUnits="userSpaceOnUse">
      <path d="M15 6H75" stroke="#fff7d9" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="68" fill="#f7fbef" stroke="#203647" stroke-width="10"/>
      <circle r="57" fill="none" stroke="#9ab8b8" stroke-width="2"/>
      <g stroke="#79979f" stroke-width="2.5">
        <path d="M0-62V62M-62 0H62M-44-44L44 44M-44 44L44-44"/>
      </g>
      <path d="M-25-57A62 62 0 0 1 24-57" fill="none" stroke="#f2af45" stroke-width="5" stroke-linecap="round"/>
      <circle r="8" fill="#203647"/>
    </g>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke: #203647; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .bob { animation: bob 1s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6dc"/>
  <path d="M0 104H800V447H0Z" fill="#d9eff0"/>
  <circle cx="677" cy="169" r="40" fill="#ffcf68"/>
