      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <path d="M78 208Q78 194 93 194H263Q278 194 278 209V242Q278 257 263 257H218L231 276L196 257H93Q78 257 78 242Z" fill="#fffdf3" stroke="#203647" stroke-width="3"/>
    <text x="178" y="220" text-anchor="middle" font-size="18" font-weight="bold" fill="#203647">“I only ride</text>
    <text x="178" y="243" text-anchor="middle" font-size="18" font-weight="bold" fill="#203647">for the fishness.”</text>
  </g>

  <g stroke="#203647" stroke-width="3" stroke-linecap="round">
    <path d="M163 390h-26m19 15h-34m43 16h-21"/>
  </g>

  <rect y="502" width="800" height="98" fill="#fff6dc"/>
  <text x="400" y="534" text-anchor="middle" font-size="22" font-weight="bold" fill="#203647">One pelican. Two wheels. Unlimited snack storage.</text>
