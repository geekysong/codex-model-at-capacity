    <path d="M40 172c0-15 19-21 29-11 6-26 42-27 51-3 22-8 40 6 39 20H40Z"/>
    <path d="M575 113c8-13 24-13 32-3 10-16 34-10 36 8h-68Z"/>
  </g>

  <text x="400" y="62" text-anchor="middle" font-size="48" font-weight="900" fill="#203647" letter-spacing="2">TOUR DE BEAK</text>
  <text x="400" y="89" text-anchor="middle" font-size="16" font-weight="bold" fill="#54717a" letter-spacing="3">THE MOST OVERBILLED CYCLIST IN TOWN</text>

  <path d="M0 340Q145 315 290 341T580 340T800 331V449H0Z" fill="#89c5cd"/>
  <g fill="none" stroke="#d4eff0" stroke-width="3" stroke-linecap="round">
