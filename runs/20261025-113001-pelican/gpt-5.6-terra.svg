      <path d="M0 75 L91 8 L160 75 L0 75 L91 8 L128 75 L240 75 L160 75" fill="none" stroke="#dc4546" stroke-width="9" stroke-linejoin="round"/>
      <path d="M91 8 L108 -31" stroke="#263845" stroke-width="7"/>
