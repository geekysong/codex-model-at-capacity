<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Prestige</title>
  <desc id="desc">A satirical cartoon of an enormous pelican riding a tiny bicycle, with spinning wheels and bobbing motion.</desc>
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .bob { animation: bob .8s ease-in-out infinite alternate; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
  </style>

  <rect width="800" height="600" fill="#bfe9f4"/>
  <path d="M0 326 Q130 270 260 325 T520 310 T800 325 V455 H0Z" fill="#7ed08a"/>
  <path d="M0 416 Q180 375 380 417 T800 399 V510 H0Z" fill="#4da960"/>
  <path d="M0 458 H800" stroke="#2b7b45" stroke-width="7"/>

  <g fill="#fff" opacity=".85">
    <path d="M70 100 q24-30 48 0 q29-20 49 10 H55q-4-15 15-10"/>
    <path d="M610 110 q22-28 45 0 q35-20 58 12 H595q-3-16 15-12"/>
  </g>

  <text x="400" y="63" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="35" fill="#173b59">PELICAN PEDALS TO PRESTIGE</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#27546b">“Why fly when a tiny bicycle can announce your importance?”</text>

  <g transform="translate(635 205)">
    <path d="M0 58 L20 15 L38 58" fill="none" stroke="#76502f" stroke-width="7" stroke-linecap="round"/>
    <rect x="11" y="49" width="18" height="24" rx="3" fill="#f4cf47"/>
    <circle cx="20" cy="61" r="6" fill="#ef704f"/>
    <path d="M20 73v20" stroke="#76502f" stroke-width="5"/>
    <text x="20" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#244b35">BIKE LANE</text>
  </g>

  <g class="bob">
    <g transform="translate(182 368)">
      <circle cx="0" cy="75" r="64" fill="none" stroke="#263845" stroke-width="10"/>
      <circle cx="0" cy="75" r="5" fill="#263845"/>
      <g class="spin" stroke="#607581" stroke-width="3">
        <path d="M0 11V139M-64 75H64M-45 30L45 120M45 30L-45 120"/>
      </g>
      <circle cx="240" cy="75" r="64" fill="none" stroke="#263845" stroke-width="10"/>
      <circle cx="240" cy="75" r="5" fill="#263845"/>
