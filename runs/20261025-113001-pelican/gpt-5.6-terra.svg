      <path d="M184 -83 q17 -9 25 1" fill="none" stroke="#263845" stroke-width="4" stroke-linecap="round"/>

      <path d="M107 -70 Q49 -78 28 -49 Q50 -17 116 -29 Q151 -43 151 -68 Q135 -79 107 -70Z" fill="#ef9e36" stroke="#263845" stroke-width="5"/>
      <path d="M40 -49 Q81 -47 121 -36 Q81 -15 47 -30Z" fill="#f7be5a"/>
      <path d="M103 -27 Q69 7 119 36 Q158 39 158 1 L149 -25Z" fill="#f6f1df" stroke="#263845" stroke-width="5"/>

