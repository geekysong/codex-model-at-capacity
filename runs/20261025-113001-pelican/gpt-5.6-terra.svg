      <text x="165" y="-133" font-family="Arial Black, sans-serif" font-size="12" fill="#263845">MAYOR</text>
    </g>
  </g>

  <g transform="translate(523 319)">
    <path d="M0 75 Q24 35 56 70 Q81 37 107 75" fill="none" stroke="#263845" stroke-width="5"/>
    <ellipse cx="56" cy="84" rx="58" ry="13" fill="#347e49" opacity=".45"/>
    <text x="56" y="113" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" fill="#244b35">TOOT! TOOT!</text>
  </g>

  <rect y="512" width="800" height="88" fill="#173b59"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff7cf">A bird with wings, choosing gridlock one proud pedal at a time.</text>
  <text x="400" y="578" text-anchor="middle" font-family="monospace" font-size="15" fill="#bfe9f4">2026-10-25 11:32:22 SGT (UTC+08:00)</text>
</svg>