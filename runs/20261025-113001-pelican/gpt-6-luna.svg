<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">WHEELS OF FORTUNE</title>
  <desc id="desc">A smug pelican rides a bicycle, pedaling furiously while a fish enjoys the ride in its beak pouch.</desc>
  <defs>
    <style>
      .ink{stroke:#183047;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.8s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .7s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#d9f3ef"/>
  <path d="M0 392Q155 358 302 390T590 382T800 391V600H0Z" fill="#b9df9a"/>
  <path d="M0 438Q180 421 365 439T800 430" fill="none" stroke="#8bc37d" stroke-width="5"/>
  <circle cx="690" cy="112" r="43" fill="#ffd56a"/>
  <path d="M62 138q30-28 60 0m-32 18q22-20 44 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>

  <text id="title" x="400" y="53" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" letter-spacing="2" fill="#183047">WHEELS OF FORTUNE</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#466477">“I’m not late. I’m migrating at my own pace.”</text>

  <!-- Bicycle -->
  <g fill="none" class="ink">
    <g class="wheel">
      <circle cx="250" cy="401" r="73" fill="#f5fcf8" stroke-width="7"/>
      <circle cx="250" cy="401" r="8" fill="#ff7563"/>
      <path d="M250 328V474M177 401H323M198 349L302 453M302 349L198 453" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="560" cy="401" r="73" fill="#f5fcf8" stroke-width="7"/>
      <circle cx="560" cy="401" r="8" fill="#ff7563"/>
      <path d="M560 328V474M487 401H633M508 349L612 453M612 349L508 453" stroke-width="3"/>
    </g>
    <path d="M250 401L344 328L405 401L250 401M344 328L560 401M405 401L450 329"/>
    <path d="M329 319h42m-8 0-18 9m-108 72-14-49m-7-7h42"/>
    <path d="M450 329h37m-7 0-14 9"/>
    <circle cx="405" cy="401" r="17" fill="#ffd56a" stroke-width="4"/>
    <path d="M405 401l22 15m-22-15-15 22" stroke-width="4"/>
    <circle cx="427" cy="416" r="5" fill="#183047" stroke-width="2"/>
    <circle cx="390" cy="423" r="5" fill="#183047" stroke-width="2"/>
  </g>

  <!-- Pelican and its comically overconfident ride -->
  <g class="rider">
    <!-- tail feathers -->
    <path d="M344 264q-41-28-57 5 27 3 48 22" fill="#fff" class="ink"/>
    <path d="M326 273q-32-8-39 12" fill="none" stroke="#7aa9b5" stroke-width="4"/>
    <!-- body -->
    <ellipse cx="386" cy="260" rx="71" ry="60" fill="#fff" class="ink"/>
    <path d="M366 293q39 18 73-3-10 39-45 43-20-7-28-40" fill="#f2a05d" class="ink"/>
    <path d="M365 247q20-30 53-18 21 7 25 28-27 28-69 15" fill="#dcecf0" stroke="#183047" stroke-width="4"/>
    <!-- neck and head -->
    <path d="M420 242q-6-48 24-80" fill="none" stroke="#fff" stroke-width="32" stroke-linecap="round"/>
    <path d="M420 242q-6-48 24-80" fill="none" class="ink"/>
    <ellipse cx="457" cy="147" rx="38" ry="31" fill="#fff" class="ink"/>
    <path d="M481 151q60-14 80 5-27 20-77 11z" fill="#f4a346" class="ink"/>
    <!-- pouch -->
    <path d="M484 164q34 29 73-8-5 53-47 57-22-7-26-49" fill="#ff8b6b" class="ink"/>
    <!-- fish passenger -->
    <path d="M521 184q16-14 33 0-17 15-33 0m0 0-10-9v18z" fill="#7ed3ca" stroke="#183047" stroke-width="3"/>
    <circle cx="545" cy="181" r="2.5" fill="#183047"/>
    <!-- face -->
    <circle cx="466" cy="141" r="4.5" fill="#183047"/>
    <path d="M452 128q10-8 19 0" fill="none" stroke="#183047" stroke-width="3" stroke-linecap="round"/>
    <path d="M446 153q7 5 13 0" fill="none" stroke="#e87970" stroke-width="3" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M421 133q5-39 40-40 27 1 35 28l-74 10z" fill="#ffcf57" class="ink"/>
    <path d="M424 130q30 4 68-8m-46-27 4 27" fill="none" stroke="#183047" stroke-width="4" stroke-linecap="round"/>
    <!-- legs and flailing pedals -->
    <path d="M376 306q-14 39 24 59l-5 30m36-91q-8 37-29 56l25 42" fill="none" stroke="#f4a346" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M395 395l-12 4m55-1 11 8" fill="none" stroke="#183047" stroke-width="5" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M358 249q25-26 52 0-19 17-44 16" fill="#fff" stroke="#183047" stroke-width="4"/>
    <path d="M365 251l23 10m-14-17 24 13" fill="none" stroke="#a5c3cb" stroke-width="3"/>
  </g>

  <!-- motion lines and tiny satire -->
  <path d="M123 332h58m-74 20h42m491-33h49" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <rect x="598" y="247" width="150" height="53" rx="12" fill="#fff3cc" stroke="#183047" stroke-width="3"/>
  <path d="M598 275l-17 9 17 4" fill="#fff3cc" stroke="#183047" stroke-width="3" stroke-linejoin="round"/>
  <text x="673" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#183047">FISH: “Are we</text>
  <text x="673" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#183047">there yet?”</text>

  <path d="M34 503H766" stroke="#183047" stroke-width="2" opacity=".25"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#183047">Two wheels, one fish, absolutely no flight plan.</text>
  <text x="400" y="577" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#466477">2026-10-25 11:32:04 SGT (UTC+08:00)</text>
</svg>