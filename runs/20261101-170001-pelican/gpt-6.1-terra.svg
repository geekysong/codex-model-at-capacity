  <path d="M55 480 H745" stroke="#24323b" stroke-width="5" stroke-linecap="round"/>
  <path d="M93 495 h65 m38 0 h38 m356 0 h58 m29 0 h35" stroke="#d8c7a4" stroke-width="4" stroke-linecap="round"/>

  <g class="wheel">
    <circle cx="265" cy="405" r="76" fill="#fffaf0" class="ink"/>
    <circle cx="265" cy="405" r="64" fill="none" stroke="#d7e7e0" stroke-width="5"/>
    <path d="M265 329 V481 M189 405 H341 M211 351 L319 459 M211 459 L319 351" fill="none" stroke="#9bb3b1" stroke-width="3"/>
    <circle cx="265" cy="405" r="8" fill="#24323b"/>
  </g>
  <g class="wheel">
    <circle cx="565" cy="405" r="76" fill="#fffaf0" class="ink"/>
