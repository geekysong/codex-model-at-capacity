<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels and bobbing pedals, while carrying a fish in its oversized bill.</desc>
  <defs>
    <style>
      .ink { stroke: #24323b; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #24323b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
      .rider { animation: bob 1.4s ease-in-out infinite; }
      .pedals { transform-origin: 408px 405px; animation: spin 1.4s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedals { animation-duration: 8s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f9f2db"/>
  <rect x="18" y="18" width="764" height="564" rx="20" fill="#fffaf0" stroke="#24323b" stroke-width="4"/>
  <text x="400" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#24323b">THE DAILY COMMUTE</text>
  <path d="M65 86 H735" fill="none" stroke="#e4b34c" stroke-width="4"/>

  <circle cx="668" cy="155" r="38" fill="#ffcf58"/>
  <path d="M73 177 q30 -30 60 0 q26 -23 54 0 M568 115 q21 -19 42 0 q18 -15 37 0" fill="none" stroke="#b8d9da" stroke-width="8" stroke-linecap="round"/>
