  <text x="400" y="531" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#24323b">He packed lunch. Lunch has concerns.</text>
  <path d="M75 548 H725" stroke="#e6d7b9" stroke-width="2"/>
  <text x="400" y="571" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#47555a">2026-11-01 17:03:00 SGT (UTC+08:00)</text>
</svg>