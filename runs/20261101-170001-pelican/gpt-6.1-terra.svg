  </g>

  <path d="M265 405 L337 321 L408 405 Z M337 321 L493 321 L408 405 M493 321 L565 405 M483 300 L493 321 M329 307 L337 321" fill="none" stroke="#e45f45" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M313 307 H359" class="ink" fill="none"/>
  <path d="M483 300 L471 276 H446 M471 276 Q481 264 493 270" class="ink" fill="none"/>
  <circle cx="408" cy="405" r="19" fill="#f5c957" class="thin"/>
  <g class="pedals">
    <path d="M408 405 L429 423 M408 405 L387 387" fill="none" class="thin"/>
    <path d="M420 425 H439 M377 385 H396" fill="none" stroke="#24323b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g class="rider">
    <path d="M332 311 Q290 303 274 280 Q307 284 329 276" fill="#e8e8d8" class="ink"/>
