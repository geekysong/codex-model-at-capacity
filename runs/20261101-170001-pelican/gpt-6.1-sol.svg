    <tspan x="170">“My bill has</tspan>
    <tspan x="170" dy="23">a delivery fee.”</tspan>
  </text>

  <text x="400" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#243647">He bought a bicycle. The fish still does all the baiting.</text>
