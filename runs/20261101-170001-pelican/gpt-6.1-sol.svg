<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish dangling from its enormous bill. Wheels spin, pedals turn, and the bird bobs as it rides past a no fishing sign.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bdeeff"/>
      <stop offset="1" stop-color="#f9f7dc"/>
    </linearGradient>
    <pattern id="road" width="160" height="12" patternUnits="userSpaceOnUse">
      <path d="M15 6h65" stroke="#fff4bf" stroke-width="5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="16" y="16" width="768" height="478" rx="25" fill="url(#sky)" stroke="#243647" stroke-width="4"/>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#243647">TOUR DE FISH</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#386073">ONE BIRD. TWO WHEELS. ZERO DIGNITY.</text>

