  <text x="400" y="65" text-anchor="middle" font-family="sans-serif" font-size="49" font-weight="900" fill="#203746" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="98" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#526b70">THE COMMUTE IS FINE. THE CARGO HAS CONCERNS.</text>

  <path d="M0 443Q380 420 800 442V531H0Z" fill="#d7c39a"/>
  <path d="M0 495H800" stroke="#fff3d9" stroke-width="5" stroke-dasharray="40 27"/>
