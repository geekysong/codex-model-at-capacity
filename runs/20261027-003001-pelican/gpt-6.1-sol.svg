<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle along the waterfront, carrying fish in its enormous bill beneath the slogan Zero emissions. Questionable fish mileage. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0h10" stroke="#fff" stroke-width="1"/>
    </pattern>
    <g id="wheel">
      <circle r="82" fill="#f9fcf8" stroke="#203746" stroke-width="11"/>
      <circle r="74" fill="none" stroke="#e0b85f" stroke-width="3"/>
      <g stroke="#6c8c95" stroke-width="2.5">
        <path d="M-73 0H73M0-73V73M-52-52 52 52M-52 52 52-52M-28-67 28 67M-67-28 67 28M-67 28 67-28M-28 67 28-67"/>
      </g>
      <circle r="9" fill="#203746"/>
    </g>
    <g id="fish">
      <path d="M0 0Q17-16 35 0Q17 16 0 0L-12-10V10Z" fill="#76bbb4" stroke="#203746" stroke-width="2"/>
      <circle cx="27" cy="-2" r="2" fill="#203746"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff3d9"/>
  <path d="M0 245Q180 210 350 245T800 236V444H0Z" fill="#b9e0dc"/>
