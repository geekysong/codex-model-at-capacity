<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals into History</title>
  <desc id="desc">A satirical cartoon of an overconfident pelican riding a tiny bicycle.</desc>
  <defs>
    <style>
      .line{stroke:#18233b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .thin{stroke:#18233b;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .wheel{stroke:#18233b;stroke-width:8;fill:#f9faf4}
      .label{font-family:Arial,sans-serif;fill:#18233b}
    </style>
  </defs>

  <rect width="800" height="600" fill="#bfe9f2"/>
  <path d="M0 326 Q105 292 202 323 T400 310 T600 320 T800 298 V474 H0Z" fill="#83cfb8"/>
  <path d="M0 414 Q120 390 255 417 T530 400 T800 417 V480 H0Z" fill="#5ba98f"/>
