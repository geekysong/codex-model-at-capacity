  <rect x="0" y="505" width="800" height="95" fill="#18233b"/>
  <text x="400" y="540" text-anchor="middle" fill="#f8c251" font-family="Arial,sans-serif" font-size="21" font-weight="800">A BIG BIRD. A TINY BIKE. A VERY LOUD CAMPAIGN PROMISE.</text>
  <text x="400" y="575" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="16">2026-10-27 00:33:02 SGT (UTC+08:00)</text>
