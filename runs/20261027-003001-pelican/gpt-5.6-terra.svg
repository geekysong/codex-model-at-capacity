  <path d="M36 445 Q95 414 158 444 T278 443 T402 442 T538 444 T676 439 T790 445" fill="none" stroke="#f5ce5b" stroke-width="7" stroke-dasharray="20 16"/>

  <text x="400" y="64" text-anchor="middle" class="label" font-size="39" font-weight="900">PELICAN PEDALS INTO HISTORY</text>
  <text x="400" y="96" text-anchor="middle" class="label" font-size="18" font-weight="700">“No hands? No problem. No dignity? Also no problem.”</text>

  <g opacity=".8">
    <path d="M105 166 q21-27 42 0 q-20-11-42 0M180 138q18-23 36 0q-17-9-36 0M658 158q19-25 39 0q-19-10-39 0" class="thin"/>
  </g>

