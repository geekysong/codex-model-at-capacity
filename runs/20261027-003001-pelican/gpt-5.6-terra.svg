      <path d="M258 336V460M196 398H320M214 354L302 442M302 354L214 442" class="thin" opacity=".55"/>
      <circle cx="258" cy="398" r="10" fill="#f05d5e" stroke="#18233b" stroke-width="4"/>
    </g>
