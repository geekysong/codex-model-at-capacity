    <text x="472" y="170" class="label" font-size="16" font-weight="800">MOMENTUM</text>
  </g>

  <g>
    <path d="M576 355 q35-28 70-4 q-18 35-60 25" fill="#fff7d1" stroke="#18233b" stroke-width="4"/>
