      <path d="M420 398l32-19M420 398l-32 19" class="thin"/>
      <rect x="443" y="371" width="24" height="9" rx="4" fill="#f05d5e" stroke="#18233b" stroke-width="3"/>
      <rect x="373" y="416" width="24" height="9" rx="4" fill="#f05d5e" stroke="#18233b" stroke-width="3"/>
    </g>
  </g>

