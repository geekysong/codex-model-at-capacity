<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Beak of the Peloton</title>
  <desc id="desc">A smug pelican rides a bicycle, carrying an absurdly large fish in its beak.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#b9edff"/>
      <stop offset="1" stop-color="#fff4cf"/>
    </linearGradient>
    <linearGradient id="feather" x2="0" y2="1">
      <stop stop-color="#fffef4"/>
      <stop offset="1" stop-color="#d9e5e2"/>
    </linearGradient>
    <style>
      .ink{stroke:#173342;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#fff9e8;stroke:#173342;stroke-width:8}
      .spoke{stroke:#78949b;stroke-width:2}
      .label{font-family:system-ui,sans-serif;font-weight:800;fill:#173342}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 320 Q130 290 250 322 T500 317 T800 316 V510 H0Z" fill="#9bd89d"/>
  <path d="M0 420 Q170 395 330 418 T650 411 T800 421 V520 H0Z" fill="#73c583"/>
  <path d="M0 493 Q190 478 400 495 T800 488 V600 H0Z" fill="#f5dfaa"/>
  <circle cx="700" cy="139" r="47" fill="#ffd166"/>
  <path d="M45 350 Q180 340 310 350" fill="none" stroke="#fff5dc" stroke-width="5" stroke-dasharray="18 16"/>

  <text x="400" y="54" text-anchor="middle" class="label" font-size="32">THE BEAK OF THE PELOTON</text>
  <text x="400" y="82" text-anchor="middle" class="label" font-size="16" fill="#49646b">“Training for the Tour de Pond. Mostly snacks.”</text>

  <g fill="#fff" opacity=".9">
    <path d="M92 152q8-18 20 0 15-10 23 4H80q4-8 12-4z"/>
    <path d="M553 220q8-18 20 0 15-10 23 4h-55q4-8 12-4z"/>
  </g>

  <!-- bicycle wheels and rotating spokes -->
  <g>
    <circle class="wheel" cx="232" cy="420" r="75"/>
    <g class="spoke">
      <path d="M232 345v150M157 420h150M179 367l106 106M285 367 179 473"/>
      <animateTransform attributeName="transform" type="rotate" from="0 232 420" to="360 232 420" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <circle class="wheel" cx="548" cy="420" r="75"/>
    <g class="spoke">
      <path d="M548 345v150M473 420h150M495 367l106 106M601 367 495 473"/>
      <animateTransform attributeName="transform" type="rotate" from="0 548 420" to="360 548 420" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- bicycle frame -->
  <g fill="none" class="ink">
    <path d="M232 420 315 337 390 420 232 420 278 355 365 355 390 420 465 337"/>
    <path d="M315 337h-32m174 0h25"/>
    <path d="M365 355l8-27h35"/>
  </g>
  <circle cx="390" cy="420" r="11" fill="#f28f3b" class="ink"/>
  <path d="M390 420l-16 31m16-31 31 17" fill="none" class="ink"/>
  <path d="M271 354h24m162-17h24" stroke="#173342" stroke-width="8" stroke-linecap="round"/>
  <path d="M300 324q15-15 32 0l-7 13h-28z" fill="#e85d4a" class="ink"/>
  <path d="M350 344q17-9 32 2l-5 12h-30z" fill="#e85d4a" class="ink"/>

  <!-- pedal legs bob gently -->
  <g class="ink" fill="none">
    <path d="M365 286 390 350 373 420"/>
    <path d="M412 288 390 350 421 437"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.7s" repeatCount="indefinite"/>
  </g>

  <!-- pelican rider -->
  <g>
    <g>
      <ellipse cx="385" cy="250" rx="69" ry="77" fill="url(#feather)" class="ink"/>
      <path d="M337 267q-18 24-7 48 27-2 47-25" fill="#b8d5d0" class="ink"/>
      <path d="M427 257q23 4 31 22-15 13-34 6" fill="#c7dad5" class="ink"/>
      <ellipse cx="399" cy="184" rx="52" ry="46" fill="url(#feather)" class="ink"/>
      <path d="M416 183q35-17 88-2-34 14-76 23z" fill="#f5a623" class="ink"/>
      <path d="M428 197q43 18 62 3-18 35-49 28-17-4-22-18z" fill="#ed7951" class="ink"/>
      <circle cx="414" cy="178" r="5" fill="#173342"/>
      <path d="M437 164q13-15 24-3" fill="none" stroke="#173342" stroke-width="4" stroke-linecap="round"/>
      <path d="M361 320q20 14 36 1m8 2q18 13 35-3" fill="none" class="ink"/>
      <path d="M342 218q-17-20-33 0 13 17 34 15" fill="#fffef4" class="ink"/>
      <path d="M328 219q-16 3-24 14 14 8 28 0" fill="#9ab8b7" class="ink"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.7s" repeatCount="indefinite"/>
    </g>
    <!-- wing and steering arm -->
    <path d="M349 249q-41 12-41 47 29 15 62-3" fill="#edf4e9" class="ink"/>
    <path d="M310 286q-28 20-35 59" fill="none" class="ink" stroke-width="9"/>
    <path d="M275 345l-13 9" fill="none" class="ink" stroke-width="8"/>
    <!-- fish dangling from the bill -->
    <path d="M505 183q18-14 32 0-14 6-32 0z" fill="#f36f5b" stroke="#173342" stroke-width="3"/>
    <path d="M532 183l12-9v18z" fill="#f7b267" stroke="#173342" stroke-width="3"/>
    <circle cx="511" cy="181" r="2.5" fill="#173342"/>
    <path d="M515 187q6 5 11 0" fill="none" stroke="#173342" stroke-width="2"/>
  </g>

  <path d="M126 288q-11-16-1-26 10 12 4 24m10-8q-1-15 10-18 4 13-7 21" fill="none" stroke="#173342" stroke-width="4" stroke-linecap="round"/>
  <text x="116" y="268" class="label" font-size="15">HONK!</text>

  <path d="M477 304q22-20 44 0" fill="none" stroke="#173342" stroke-width="3" stroke-dasharray="5 6"/>
  <text x="528" y="295" class="label" font-size="14">SPLASH ZONE</text>

  <!-- footer kept clear beneath the scene -->
  <rect x="0" y="535" width="800" height="65" fill="#173342"/>
  <text x="400" y="566" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#fff9e8">Pelican-powered transport: one fish per mile.</text>
  <text x="400" y="590" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#ffd166">2026-10-27 00:32:37 SGT (UTC+08:00)</text>
</svg>