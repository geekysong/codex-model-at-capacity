<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest city street route from A1 to E5</title>
  <desc id="desc">A five-by-five grid of intersections. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>

  <rect width="600" height="400" fill="#f8fafc"/>
  <rect x="100" y="60" width="400" height="240" fill="#e2e8f0"/>

  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <path d="M100 60H500V300" fill="none" stroke="#2563eb" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

  <g fill="#fff" stroke="#475569" stroke-width="2">
    <circle cx="100" cy="60" r="5"/><circle cx="200" cy="60" r="5"/><circle cx="300" cy="60" r="5"/><circle cx="400" cy="60" r="5"/><circle cx="500" cy="60" r="5"/>
    <circle cx="100" cy="120" r="5"/><circle cx="300" cy="120" r="5"/><circle cx="400" cy="120" r="5"/><circle cx="500" cy="120" r="5"/>
    <circle cx="100" cy="180" r="5"/><circle cx="200" cy="180" r="5"/><circle cx="400" cy="180" r="5"/><circle cx="500" cy="180" r="5"/>
    <circle cx="100" cy="240" r="5"/><circle cx="200" cy="240" r="5"/><circle cx="300" cy="240" r="5"/><circle cx="500" cy="240" r="5"/>
    <circle cx="100" cy="300" r="5"/><circle cx="200" cy="300" r="5"/><circle cx="300" cy="300" r="5"/><circle cx="400" cy="300" r="5"/><circle cx="500" cy="300" r="5"/>
  </g>

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 112L208 128 M208 112L192 128"/>
    <path d="M292 172L308 188 M308 172L292 188"/>
    <path d="M392 232L408 248 M408 232L392 248"/>
  </g>

  <circle cx="100" cy="60" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="300" r="8" fill="#7c3aed" stroke="#fff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">
    <text x="100" y="44">A1</text><text x="200" y="44">B1</text><text x="300" y="44">C1</text><text x="400" y="44">D1</text><text x="500" y="44">E1</text>
    <text x="100" y="104">A2</text><text x="200" y="104">B2</text><text x="300" y="104">C2</text><text x="400" y="104">D2</text><text x="500" y="104">E2</text>
    <text x="100" y="164">A3</text><text x="200" y="164">B3</text><text x="300" y="164">C3</text><text x="400" y="164">D3</text><text x="500" y="164">E3</text>
    <text x="100" y="224">A4</text><text x="200" y="224">B4</text><text x="300" y="224">C4</text><text x="400" y="224">D4</text><text x="500" y="224">E4</text>
    <text x="100" y="284">A5</text><text x="200" y="284">B5</text><text x="300" y="284">C5</text><text x="400" y="284">D5</text><text x="500" y="284">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="100" y="22" text-anchor="middle" fill="#15803d">START</text>
    <text x="520" y="305" fill="#6d28d9">END</text>
    <text x="300" y="338" text-anchor="middle" fill="#1d4ed8">Shortest route: 8 street segments</text>
  </g>

  <path d="M24 353H576" stroke="#cbd5e1"/>
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-10-30 08:33:21 SGT (UTC+08:00)</text>
</svg>