<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down 5 by 5 city grid with a shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4">
  <rect width="600" height="400" fill="#f7f8fa"/>
  <text x="300" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#202a36">City Block Route</text>

  <!-- Streets -->
  <g stroke="#aab4c0" stroke-width="3" stroke-linecap="round">
    <path d="M100 68H500 M100 128H500 M100 188H500 M100 248H500 M100 308H500"/>
    <path d="M100 68V308 M200 68V308 M300 68V308 M400 68V308 M500 68V308"/>
  </g>

  <!-- Shortest route: 8 street segments -->
  <path d="M100 68 H200 V128 H300 V188 H400 V248 H500 V308"
        fill="none" stroke="#1674e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1674e8">
    <circle cx="100" cy="68" r="6"/>
    <circle cx="200" cy="68" r="4"/>
    <circle cx="200" cy="128" r="4"/>
    <circle cx="300" cy="128" r="4"/>
    <circle cx="300" cy="188" r="4"/>
    <circle cx="400" cy="188" r="4"/>
    <circle cx="400" cy="248" r="4"/>
    <circle cx="500" cy="248" r="4"/>
    <circle cx="500" cy="308" r="6"/>
  </g>

  <!-- Intersections and labels -->
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#344252">
    <g fill="#596675">
      <circle cx="100" cy="68" r="2.5"/><circle cx="200" cy="68" r="2.5"/><circle cx="300" cy="68" r="2.5"/><circle cx="400" cy="68" r="2.5"/><circle cx="500" cy="68" r="2.5"/>
      <circle cx="100" cy="128" r="2.5"/><circle cx="200" cy="128" r="2.5"/><circle cx="300" cy="128" r="2.5"/><circle cx="400" cy="128" r="2.5"/><circle cx="500" cy="128" r="2.5"/>
      <circle cx="100" cy="188" r="2.5"/><circle cx="200" cy="188" r="2.5"/><circle cx="300" cy="188" r="2.5"/><circle cx="400" cy="188" r="2.5"/><circle cx="500" cy="188" r="2.5"/>
      <circle cx="100" cy="248" r="2.5"/><circle cx="200" cy="248" r="2.5"/><circle cx="300" cy="248" r="2.5"/><circle cx="400" cy="248" r="2.5"/><circle cx="500" cy="248" r="2.5"/>
      <circle cx="100" cy="308" r="2.5"/><circle cx="200" cy="308" r="2.5"/><circle cx="300" cy="308" r="2.5"/><circle cx="400" cy="308" r="2.5"/><circle cx="500" cy="308" r="2.5"/>
    </g>
    <text x="100" y="52">A1</text><text x="200" y="52">B1</text><text x="300" y="52">C1</text><text x="400" y="52">D1</text><text x="500" y="52">E1</text>
    <text x="100" y="112">A2</text><text x="200" y="112">B2</text><text x="300" y="112">C2</text><text x="400" y="112">D2</text><text x="500" y="112">E2</text>
    <text x="100" y="172">A3</text><text x="200" y="172">B3</text><text x="300" y="172">C3</text><text x="400" y="172">D3</text><text x="500" y="172">E3</text>
    <text x="100" y="232">A4</text><text x="200" y="232">B4</text><text x="300" y="232">C4</text><text x="400" y="232">D4</text><text x="500" y="232">E4</text>
    <text x="100" y="292">A5</text><text x="200" y="292">B5</text><text x="300" y="292">C5</text><text x="400" y="292">D5</text><text x="500" y="292">E5</text>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#d33b3b" stroke-width="5" stroke-linecap="round">
    <path d="M192 120L208 136 M208 120L192 136"/>
    <path d="M292 180L308 196 M308 180L292 196"/>
    <path d="M392 240L408 256 M408 240L392 256"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="68" r="11" fill="none" stroke="#16834a" stroke-width="3"/>
  <circle cx="500" cy="308" r="11" fill="none" stroke="#b52f35" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <text x="100" y="342" text-anchor="middle" fill="#16834a">START A1</text>
    <text x="500" y="342" text-anchor="middle" fill="#b52f35">END E5</text>
  </g>

  <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1674e8">Route length: 8 street segments</text>
  <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#344252">2026-10-30 08:33:41 SGT (UTC+08:00)</text>
</svg>