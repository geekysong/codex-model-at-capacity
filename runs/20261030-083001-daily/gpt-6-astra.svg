    <text x="100" y="92">A2</text><text x="200" y="92">B2</text><text x="300" y="92">C2</text><text x="400" y="92">D2</text><text x="500" y="92">E2</text>
    <text x="100" y="152">A3</text><text x="200" y="152">B3</text><text x="300" y="152">C3</text><text x="400" y="152">D3</text><text x="500" y="152">E3</text>
    <text x="100" y="212">A4</text><text x="200" y="212">B4</text><text x="300" y="212">C4</text><text x="400" y="212">D4</text><text x="500" y="212">E4</text>
    <text x="100" y="272">A5</text><text x="200" y="272">B5</text><text x="300" y="272">C5</text><text x="400" y="272">D5</text><text x="500" y="272">E5</text>
