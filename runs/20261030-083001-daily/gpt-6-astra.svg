    <circle cx="100" cy="110" r="4"/><circle cx="300" cy="110" r="4"/><circle cx="400" cy="110" r="4"/><circle cx="500" cy="110" r="4"/>
    <circle cx="100" cy="170" r="4"/><circle cx="200" cy="170" r="4"/><circle cx="400" cy="170" r="4"/><circle cx="500" cy="170" r="4"/>
    <circle cx="100" cy="230" r="4"/><circle cx="200" cy="230" r="4"/><circle cx="300" cy="230" r="4"/><circle cx="500" cy="230" r="4"/>
    <circle cx="100" cy="290" r="4"/><circle cx="200" cy="290" r="4"/><circle cx="300" cy="290" r="4"/><circle cx="400" cy="290" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 102L208 118 M208 102L192 118"/>
    <path d="M292 162L308 178 M308 162L292 178"/>
    <path d="M392 222L408 238 M408 222L392 238"/>
  </g>

  <circle cx="100" cy="50" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="290" r="8" fill="#7c3aed" stroke="#fff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
