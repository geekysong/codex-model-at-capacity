  <path d="M30 320H570" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="347" font-size="17" font-weight="700" fill="#1d4ed8">Shortest route: 8 street segments</text>
    <text x="300" y="379" font-size="15" fill="#334155">2026-10-30 08:32:51 SGT (UTC+08:00)</text>
