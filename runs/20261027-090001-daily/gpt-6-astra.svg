<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <!-- Prime cells -->
  <rect x="180" y="60" width="60" height="60" fill="#4A90E2"/>
  <rect x="240" y="60" width="60" height="60" fill="#4A90E2"/>
  <rect x="120" y="120" width="60" height="60" fill="#4A90E2"/>
  <rect x="240" y="120" width="60" height="60" fill="#4A90E2"/>
  <rect x="240" y="180" width="60" height="60" fill="#4A90E2"/>
  <rect x="120" y="240" width="60" height="60" fill="#4A90E2"/>
  <!-- Perfect square cells -->
  <rect x="120" y="60" width="60" height="60" fill="#F5A623"/>
  <rect x="120" y="120" width="60" height="60" fill="#F5A623"/>
  <rect x="120" y="180" width="60" height="60" fill="#F5A623"/>
  <rect x="300" y="240" width="60" height="60" fill="#F5A623"/>
  <!-- Grid -->
  <g fill="none" stroke="#222" stroke-width="2">
    <rect x="120" y="60" width="240" height="240"/>
    <path d="M180 60V300 M240 60V300 M300 60V300 M120 120H360 M120 180H360 M120 240H360"/>
  </g>
  <!-- Cell numbers -->
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle" fill="#111">
    <text x="150" y="90">1</text><text x="210" y="90">2</text><text x="270" y="90">3</text><text x="330" y="90">4</text>
    <text x="150" y="150">5</text><text x="210" y="150">6</text><text x="270" y="150">7</text><text x="330" y="150">8</text>
    <text x="150" y="210">9</text><text x="210" y="210">10</text><text x="270" y="210">11</text><text x="330" y="210">12</text>
    <text x="150" y="270">13</text><text x="210" y="270">14</text><text x="270" y="270">15</text><text x="330" y="270">16</text>
  </g>
  <!-- Counts and timestamp footer -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#111">
    <text x="120" y="330">Blue cells (primes): 6</text>
    <text x="120" y="355">Orange cells (perfect squares): 4</text>
    <text x="120" y="385">2026-10-27 09:03:12 SGT (UTC+08:00)</text>
  </g>
</svg>