<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle</title>
  <desc id="desc">A smug pelican pedals a bicycle past a sign that says “Fish are for walkers.”</desc>
  <defs>
    <style>
      .ink{stroke:#17324d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .6s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#bdeaff"/>
  <circle cx="690" cy="112" r="48" fill="#ffd66b"/>
  <path d="M0 390 Q130 330 260 380 T520 370 T800 365 V520 H0Z" fill="#85ce93"/>
  <path d="M0 450 Q170 415 340 450 T800 430 V540 H0Z" fill="#5fb77d"/>
  <path d="M0 500 H800" stroke="#f7e7b2" stroke-width="14"/>
  <path d="M0 500 H800" stroke="#17324d" stroke-width="3" stroke-dasharray="24 22"/>

  <text x="40" y="58" font-family="Verdana, sans-serif" font-size="32" font-weight="900" fill="#17324d">THE PELICAN CYCLE</text>
  <text x="42" y="88" font-family="Verdana, sans-serif" font-size="16" font-weight="700" fill="#31536b">“I’m cutting out fish. I’m just not cutting out for fish.”</text>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M250 410 L330 330 L405 410 L250 410 L295 340 L330 330"/>
    <path d="M405 410 L430 320 L330 330"/>
    <path d="M430 320 L455 310 M430 320 L444 340"/>
    <path d="M283 340 L308 340"/>
    <path d="M405 410 L420 420 M405 410 L397 425"/>
    <circle cx="250" cy="410" r="55" stroke-width="7"/>
    <circle cx="405" cy="410" r="55" stroke-width="7"/>
    <circle cx="330" cy="330" r="8" fill="#ffd66b"/>
  </g>
  <g class="wheel" fill="none" stroke="#4c7f98" stroke-width="2">
    <path d="M250 355V465 M195 410H305 M211 371L289 449 M211 449L289 371"/>
    <path d="M405 355V465 M350 410H460 M366 371L444 449 M366 449L444 371"/>
  </g>

  <!-- Pedals -->
  <g class="rider">
    <circle cx="330" cy="330" r="17" fill="none" stroke="#17324d" stroke-width="4"/>
    <path d="M330 313 L350 300 M330 347 L310 358" fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <path d="M345 296h18 M302 362h18" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>

    <!-- Pelican body and neck -->
    <ellipse cx="340" cy="255" rx="58" ry="43" fill="#f7fbff" class="ink"/>
    <path d="M371 268 Q407 257 417 222 Q425 190 405 173" fill="none" stroke="#f7fbff" stroke-width="22" stroke-linecap="round"/>
    <path d="M371 268 Q407 257 417 222 Q425 190 405 173" fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="401" cy="166" rx="34" ry="29" fill="#f7fbff" class="ink"/>
    <path d="M426 171 Q489 164 503 182 Q476 207 427 190Z" fill="#ff9f43" class="ink"/>
    <path d="M428 187 Q471 199 490 188 Q481 224 445 216 Q431 210 428 187Z" fill="#ef6e45" class="ink"/>
    <circle cx="412" cy="161" r="4.5" fill="#17324d"/>
    <path d="M395 139 Q405 126 419 139" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
    <path d="M318 285 L302 320 M355 286 L365 317" fill="none" stroke="#17324d" stroke-width="7" stroke-linecap="round"/>
    <path d="M292 320l18 2 M356 318l17 2" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <path d="M301 236 Q337 205 372 239" fill="none" stroke="#70b9d9" stroke-width="9" stroke-linecap="round"/>
    <path d="M310 229 Q340 214 365 230" fill="none" stroke="#17324d" stroke-width="3"/>
    <path d="M365 214 Q384 198 398 189" fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sign gag -->
  <path d="M625 300V455" stroke="#795b3b" stroke-width="12" stroke-linecap="round"/>
  <rect x="544" y="270" width="164" height="95" rx="12" fill="#fff7da" class="ink"/>
  <text x="626" y="301" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" font-weight="900" fill="#17324d">FISH ARE</text>
  <text x="626" y="324" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" font-weight="900" fill="#17324d">FOR WALKERS</text>
  <text x="626" y="348" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" font-weight="700" fill="#d85e45">— LOCAL GULLS</text>

  <path d="M465 143 Q500 120 529 145 Q538 154 526 162 L500 168" fill="#fff" stroke="#17324d" stroke-width="3" stroke-linejoin="round"/>
  <text x="500" y="148" text-anchor="middle" font-family="Verdana, sans-serif" font-size="11" font-weight="800" fill="#17324d">NO HANDFULS?</text>

  <!-- Footer -->
  <rect x="0" y="540" width="800" height="60" fill="#17324d"/>
  <text x="400" y="579" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="700" fill="#ffffff">2026-10-25 15:02:50 SGT (UTC+08:00)</text>
</svg>