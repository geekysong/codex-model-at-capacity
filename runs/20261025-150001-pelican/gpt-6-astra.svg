<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Express: Fueled by fish, paid in exposure</title>
  <desc id="desc">A determined pelican cycles along a seaside road carrying fish, its enormous bill acting as a delivery box. Wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="road" width="160" height="12" patternUnits="userSpaceOnUse">
      <path d="M20 6H85" stroke="#fff4cf" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="spokes" stroke="#426474" stroke-width="3">
      <path d="M-64 0H64M0-64V64M-45-45L45 45M-45 45L45-45"/>
      <circle r="13" fill="#ffcc58" stroke="#243b46" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <path d="M0 122H800V410H0Z" fill="#c7ece8"/>
  <circle cx="688" cy="174" r="38" fill="#ffc951"/>
  <g fill="#fffaf0">
    <path d="M30 195Q35 171 62 178Q76 146 101 173Q128 165 136 195Z"/>
    <path d="M551 224Q558 202 579 209Q591 187 610 208Q633 204 640 224Z"/>
  </g>
  <path d="M0 332Q110 310 215 332T430 332T645 332T860 332V412H0Z" fill="#7fc6c5"/>
  <g fill="none" stroke="#ebffed" stroke-width="4" stroke-linecap="round">
    <path d="M36 354H91M126 374H165M610 354H650M710 379H761"/>
  </g>
  <path d="M0 398Q210 380 410 401T800 398V437H0Z" fill="#e6c991"/>
  <rect y="428" width="800" height="79" fill="#64747b"/>
  <rect y="478" width="800" height="12" fill="url(#road)">
    <animate attributeName="x" values="0;-160" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="width" values="960;960" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <g font-family="Verdana, sans-serif" text-anchor="middle" fill="#243b46">
    <text x="400" y="55" font-size="39" font-weight="900" letter-spacing="2">PELICAN EXPRESS</text>
    <text x="400" y="89" font-size="17" font-weight="bold" letter-spacing="3">THE GIG ECONOMY HAS WINGS. AND RENT.</text>
  </g>

  <!-- One coastal delivery scene -->
  <ellipse cx="404" cy="456" rx="245" ry="14" fill="#243b46" opacity=".18"/>

  <g stroke="#243b46" stroke-linejoin="round" stroke-linecap="round">
    <!-- Wheels -->
    <g transform="translate(253 410)">
      <circle r="76" fill="#fff4d9" stroke-width="10"/>
      <circle r="66" fill="#c7ece8" stroke="#94aaad" stroke-width="3"/>
      <g>
        <use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(570 410)">
      <circle r="76" fill="#fff4d9" stroke-width="10"/>
      <circle r="66" fill="#c7ece8" stroke="#94aaad" stroke-width="3"/>
      <g>
        <use href="#spokes"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Bicycle frame -->
    <path d="M253 410L326 314L397 410ZM326 314H523L397 410M523 314L570 410" fill="none" stroke-width="13"/>
    <path d="M253 410L326 314L397 410ZM326 314H523L397 410M523 314L570 410" fill="none" stroke="#ef6651" stroke-width="7"/>
    <path d="M326 314L314 288M523 314L513 270L541 255L560 260" fill="none" stroke-width="8"/>
    <path d="M287 287H338" stroke-width="13"/>
    <path d="M204 321H288M217 321L241 352" fill="none" stroke-width="5"/>

    <!-- Cargo basket -->
    <path d="M184 275H283L274 318H193Z" fill="#e7ac5d" stroke-width="4"/>
    <path d="M191 291H278M196 305H275M210 277V316M232 277V317M254 277V316" fill="none" stroke="#a06b3b" stroke-width="2"/>
    <g fill="#80aeba" stroke-width="3">
      <path d="M205 275Q185 246 201 229Q224 233 223 264L233 254L233 276Z"/>
      <path d="M242 275Q225 241 245 228Q266 240 256 264L270 258L267 277Z"/>
    </g>
    <g fill="#243b46" stroke="none">
      <circle cx="201" cy="241" r="3"/>
      <circle cx="245" cy="240" r="3"/>
    </g>

    <!-- Rotating crank -->
    <circle cx="397" cy="410" r="22" fill="#ffcc58" stroke-width="4"/>
    <g transform="translate(397 410)">
      <g>
        <path d="M-23 0H23" fill="none" stroke-width="6"/>
        <path d="M-30-5V5M30-5V5" stroke-width="8"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Pelican and expressive riding pose -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
      <path d="M344 286L369 333L400 383" fill="none" stroke="#dd9541" stroke-width="13"/>
      <path d="M385 383L414 388L411 399L382 397Z" fill="#f3af45" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" values="-7 395 390;9 395 390;-7 395 390" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M306 263L275 239L284 275L268 270L292 294" fill="#fffaf0" stroke-width="4"/>
      <path d="M293 267Q292 220 332 210Q365 203 396 223Q408 192 408 158Q406 136 427 131Q455 128 459 157Q464 205 447 243Q428 291 368 300Q316 308 293 267Z" fill="#fffaf0" stroke-width="5"/>
      <path d="M316 238Q344 222 373 247L419 278Q377 287 344 270Q324 260 316 238Z" fill="#d4e1de" stroke-width="4"/>
      <path d="M367 248Q410 258 439 280L516 270" fill="none" stroke-width="12"/>
      <path d="M367 248Q410 258 439 280L516 270" fill="none" stroke="#fffaf0" stroke-width="7"/>
      <path d="M509 267L521 266L527 273" fill="none" stroke-width="4"/>

      <!-- Absurdly spacious bill -->
      <path d="M452 171L643 183Q608 250 529 244Q478 239 453 198Z" fill="#f4b24a" stroke-width="4"/>
      <path d="M454 168L654 182L452 188Z" fill="#ffce62" stroke-width="4"/>
      <path d="M481 202Q503 229 540 230" fill="none" stroke="#d78a36" stroke-width="3"/>
      <path d="M458 194L467 199" fill="none" stroke-width="3"/>
      <ellipse cx="440" cy="159" rx="10" ry="13" fill="white" stroke-width="3"/>
      <circle cx="444" cy="160" r="4" fill="#243b46" stroke="none"/>
      <path d="M426 141L449 145" fill="none" stroke-width="5"/>

      <!-- Tiny aerodynamic helmet -->
      <path d="M402 135Q405 109 431 109Q456 109 462 134Z" fill="#ef6651" stroke-width="4"/>
      <path d="M419 115L415 127M434 115V127M447 119L450 127" stroke-width="3"/>
      <path d="M407 135L419 179L429 181" fill="none" stroke-width="3"/>
    </g>
  </g>

  <g font-family="Verdana, sans-serif" fill="#243b46" text-anchor="middle">
    <text x="548" y="214" font-size="14" font-weight="bold" transform="rotate(4 548 214)">BILL-BOARD</text>
    <text x="545" y="233" font-size="11" transform="rotate(4 545 233)">YOUR AD HERE</text>
  </g>

  <!-- Speech is stationary for readability -->
  <path d="M65 141Q65 125 82 125H300Q317 125 317 143V194Q317 211 299 211H273L286 231L246 211H82Q65 211 65 194Z" fill="#fffaf0" stroke="#243b46" stroke-width="3"/>
  <g font-family="Verdana, sans-serif" text-anchor="middle" fill="#243b46" font-size="19" font-weight="bold">
    <text x="191" y="157">“Flying is free.</text>
    <text x="191" y="185">Parking isn't.”</text>
  </g>

  <!-- Dedicated caption and timestamp footer -->
  <rect y="507" width="800" height="93" fill="#fff4d9"/>
  <path d="M35 509H765" stroke="#243b46" stroke-width="3"/>
  <g font-family="Verdana, sans-serif" fill="#243b46" text-anchor="middle">
    <text x="400" y="542" font-size="20" font-weight="bold">A pelican on a bicycle: all bill, no benefits.</text>
    <text x="400" y="578" font-size="16">2026-10-25 15:00:01 SGT (UTC+08:00)</text>
  </g>
</svg>