<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Beak of the Road</title>
  <desc id="desc">A smug pelican pedals a bicycle while a fish rides in its bill. The wheels spin and the rider bobs.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .48s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#c9f0ef"/>
  <path d="M0 374 Q130 344 265 374 T530 370 T800 360 V540 H0Z" fill="#a9d98e"/>
  <circle cx="682" cy="108" r="46" fill="#ffd86b"/>
  <g fill="#fff" opacity=".9">
    <ellipse cx="145" cy="112" rx="45" ry="17"/><ellipse cx="177" cy="105" rx="30" ry="21"/>
    <ellipse cx="490" cy="160" rx="38" ry="15"/><ellipse cx="518" cy="151" rx="27" ry="20"/>
  </g>

  <text x="400" y="55" text-anchor="middle" font-size="34" font-weight="900" fill="#173d55" stroke="#fff" stroke-width="5" paint-order="stroke">THE BEAK OF THE ROAD</text>
  <text x="400" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#315c69">“I’m not late. I’m on fish time.”</text>

  <!-- Road -->
  <path d="M0 455 Q200 430 400 455 T800 440" fill="none" stroke="#526a70" stroke-width="5"/>
  <path d="M18 475 H95 M230 462 H310 M470 463 H550 M690 455 H770" stroke="#fff3c4" stroke-width="7" stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <g stroke="#e34f45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M214 402 L315 402 L359 330 L277 330 L214 402"/>
    <path d="M315 402 L395 402 L359 330"/>
    <path d="M277 330 L259 313 M249 313 H275"/>
    <path d="M395 402 L411 323 M398 323 H427"/>
  </g>
  <g class="wheel" fill="none" stroke="#233e50" stroke-width="6">
    <circle cx="214" cy="402" r="61"/><path d="M153 402h122M214 341v122M171 359l86 86M257 359l-86 86"/>
    <circle cx="395" cy="402" r="61"/><path d="M334 402h122M395 341v122M352 359l86 86M438 359l-86 86"/>
  </g>
  <circle cx="315" cy="402" r="9" fill="#ffd86b" stroke="#233e50" stroke-width="4"/>
  <path d="M302 402h26 M315 402l-15 -16 M315 402l17 15" stroke="#233e50" stroke-width="5" stroke-linecap="round"/>
  <path d="M272 322h35" stroke="#233e50" stroke-width="8" stroke-linecap="round"/>
  <path d="M402 316h25" stroke="#233e50" stroke-width="7" stroke-linecap="round"/>

  <!-- Pelican and pedal motion -->
  <g class="rider">
    <!-- tail and body -->
    <path d="M341 252 Q315 239 297 252 L312 274 Q329 269 348 272" fill="#f8f5e9" stroke="#253f50" stroke-width="4"/>
    <ellipse cx="368" cy="266" rx="47" ry="39" fill="#fffdf3" stroke="#253f50" stroke-width="4"/>
    <path d="M350 271 Q370 247 395 264 Q382 283 357 291Z" fill="#dce9e5" stroke="#253f50" stroke-width="3"/>
    <!-- neck -->
    <path d="M394 263 Q416 242 409 213 Q405 194 422 183" fill="none" stroke="#253f50" stroke-width="18" stroke-linecap="round"/>
    <path d="M394 263 Q416 242 409 213 Q405 194 422 183" fill="none" stroke="#fffdf3" stroke-width="11" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="432" cy="176" rx="30" ry="25" fill="#fffdf3" stroke="#253f50" stroke-width="4"/>
    <path d="M450 174 Q507 164 548 190 Q512 204 454 190Z" fill="#f3a930" stroke="#253f50" stroke-width="4"/>
    <path d="M453 186 Q504 201 547 190 Q515 226 467 202Z" fill="#f08a4b" stroke="#253f50" stroke-width="4"/>
    <circle cx="440" cy="169" r="4.5" fill="#192d3a"/>
    <path d="M448 157q10-9 18-2" fill="none" stroke="#253f50" stroke-width="3" stroke-linecap="round"/>
    <!-- fish in bill -->
    <path d="M491 184 Q506 173 520 184 Q506 195 491 184Z" fill="#62c8ce" stroke="#245567" stroke-width="2"/>
    <path d="M491 184l-9-7v14z" fill="#f07b61" stroke="#245567" stroke-width="2"/>
    <circle cx="513" cy="182" r="1.8" fill="#173d55"/>
    <!-- wing -->
    <path d="M344 257 Q366 236 390 260 Q374 276 349 276Z" fill="#f1eee1" stroke="#253f50" stroke-width="3"/>
    <path d="M354 259l22 9m-12-15 22 10" stroke="#c1cbc3" stroke-width="2"/>
    <!-- jaunty helmet -->
    <path d="M405 156 Q411 128 438 132 Q459 135 464 157Z" fill="#f25f54" stroke="#253f50" stroke-width="4"/>
    <path d="M401 157h68" stroke="#253f50" stroke-width="5" stroke-linecap="round"/>
    <path d="M426 136l4 17m14-14 2 16" stroke="#ffd86b" stroke-width="3"/>
    <!-- legs and feet -->
    <path d="M354 292 Q335 316 316 365" fill="none" stroke="#f3a930" stroke-width="10" stroke-linecap="round"/>
    <path d="M385 294 Q382 326 328 392" fill="none" stroke="#f3a930" stroke-width="10" stroke-linecap="round"/>
    <path d="M316 365 Q305 382 300 391 M328 392 Q341 402 349 399" fill="none" stroke="#f3a930" stroke-width="8" stroke-linecap="round"/>
    <!-- wing-arm on handlebar -->
    <path d="M397 251 Q421 269 422 309" fill="none" stroke="#fffdf3" stroke-width="13" stroke-linecap="round"/>
    <path d="M397 251 Q421 269 422 309" fill="none" stroke="#253f50" stroke-width="3" stroke-linecap="round"/>
    <circle cx="422" cy="309" r="5" fill="#f3a930"/>
  </g>

  <!-- motion marks and speech -->
  <path d="M279 203l-25-10m27 25-30-1m64-50-14-19" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M566 120 Q627 111 643 146 Q650 166 626 179 L631 195 L608 181 Q572 189 557 166 Q545 145 566 120Z" fill="#fff" stroke="#315c69" stroke-width="3"/>
  <text x="600" y="151" text-anchor="middle" font-size="14" font-weight="800" fill="#315c69">HONK!</text>
  <text x="600" y="167" text-anchor="middle" font-size="10" fill="#315c69">coming through!</text>

  <!-- footer -->
  <rect x="0" y="530" width="800" height="70" fill="#173d55"/>
  <text x="400" y="558" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Local bird insists the bike lane is “basically a runway.”</text>
  <text x="400" y="585" text-anchor="middle" font-size="14" fill="#ffe39a">2026-10-25 01:32:15 SGT (UTC+08:00)</text>
</svg>