<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the City</title>
  <desc id="desc">A satirical cartoon of a proud pelican riding a tiny bicycle while carrying an oversized fish.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .pelican { transform-box: fill-box; transform-origin: 50% 80%; animation: bob .55s ease-in-out infinite alternate; }
    .legA { transform-box: fill-box; transform-origin: 50% 10%; animation: pedalA 1s linear infinite; }
    .legB { transform-box: fill-box; transform-origin: 50% 10%; animation: pedalB 1s linear infinite; }
    .fish { transform-box: fill-box; transform-origin: left center; animation: fishwiggle .4s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 0%,100% { transform: rotate(28deg); } 50% { transform: rotate(-27deg); } }
    @keyframes pedalB { 0%,100% { transform: rotate(-27deg); } 50% { transform: rotate(28deg); } }
    @keyframes fishwiggle { to { transform: rotate(6deg); } }
  </style>

  <rect width="800" height="600" fill="#bde9f6"/>
  <circle cx="694" cy="92" r="49" fill="#ffd95f"/>
  <path d="M0 285 Q95 237 190 286 T380 280 T570 287 T800 265 V455 H0Z" fill="#76c778"/>
  <path d="M0 394 Q140 362 285 395 T530 388 T800 374 V480 H0Z" fill="#4fa75d"/>
  <path d="M0 456H800V510H0Z" fill="#5a5d67"/>
  <path d="M0 510H800V600H0Z" fill="#e6d49b"/>
  <path d="M0 480H800" stroke="#fff6cb" stroke-width="8" stroke-dasharray="38 27"/>

  <g fill="#537a4f">
    <path d="M70 345v-91l-28 91zM97 345v-123l32 123zM690 347v-115l-36 115zM722 347v-93l25 93z"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="57" font-size="38" font-weight="900" fill="#17334a" stroke="#fff" stroke-width="5" paint-order="stroke">PELICAN PEDALS THE CITY</text>
    <text x="400" y="88" font-size="17" font-weight="700" fill="#24445a">“No parking? Fine. I’ll just bike my lunch home.”</text>
  </g>

  <g transform="translate(75 225)">
    <rect width="128" height="91" rx="8" fill="#f6f0d4" stroke="#223d51" stroke-width="5"/>
    <text x="64" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#223d51">BIKE LANE</text>
    <path d="M32 69h64m-53 0 12-20 13 20m-1 0 12-20 13 20" fill="none" stroke="#df4a40" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(228 260)">
    <g class="wheel">
      <circle cx="88" cy="171" r="67" fill="#e8eef0" stroke="#26333b" stroke-width="11"/>
      <circle cx="88" cy="171" r="8" fill="#e64e45"/>
      <path d="M88 104V238M21 171H155M41 124l94 94M135 124l-94 94" stroke="#82909a" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="319" cy="171" r="67" fill="#e8eef0" stroke="#26333b" stroke-width="11"/>
      <circle cx="319" cy="171" r="8" fill="#e64e45"/>
      <path d="M319 104V238M252 171H386M272 124l94 94M366 124l-94 94" stroke="#82909a" stroke-width="3"/>
    </g>

    <path d="M88 171 169 75 237 171 88 171 200 171 169 75 276 69 319 171M237 171l-37 0" fill="none" stroke="#d84137" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M161 70h36M271 68l17-34h35" fill="none" stroke="#26333b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="200" cy="171" r="19" fill="#ffce43" stroke="#26333b" stroke-width="6"/>
    <path d="M200 171l36 20M200 171l-38-17" stroke="#26333b" stroke-width="7" stroke-linecap="round"/>

    <g class="pelican">
      <path d="M150 94 Q157 35 205 22 Q264 9 280 57 L267 137 184 143Z" fill="#f5f4e8" stroke="#26333b" stroke-width="6"/>
      <path d="M201 35 Q230 0 271 27 Q287 38 274 77 Q247 59 214 75Z" fill="#edf0db" stroke="#26333b" stroke-width="6"/>
      <ellipse cx="228" cy="50" rx="9" ry="12" fill="#fff"/>
      <circle cx="231" cy="52" r="4" fill="#18232c"/>
      <path d="M224 44l18-8" stroke="#18232c" stroke-width="5" stroke-linecap="round"/>
      <path d="M199 67 Q252 64 310 91 Q325 101 310 113 Q251 111 206 97Z" fill="#f4ad3e" stroke="#26333b" stroke-width="6"/>
      <path d="M205 97 Q250 109 309 112 Q292 148 222 139 Q201 135 190 119Z" fill="#f19232" stroke="#26333b" stroke-width="6"/>
      <path d="M170 90 Q101 113 126 178 Q143 209 195 178 L213 124Z" fill="#7689a0" stroke="#26333b" stroke-width="6"/>
      <path d="M159 117q20 5 33 28" fill="none" stroke="#516c89" stroke-width="8" stroke-linecap="round"/>
      <path d="M189 138 Q218 149 225 180 Q210 199 177 184 Q156 169 155 145Z" fill="#f5f4e8" stroke="#26333b" stroke-width="6"/>
      <path d="M191 151q24 4 25 29" fill="none" stroke="#26333b" stroke-width="5" stroke-linecap="round"/>

      <g class="fish">
        <path d="M290 91 Q345 64 397 89 L423 70 419 99 446 111 416 124 419 151 392 130 Q337 149 290 118Z" fill="#55a9c3" stroke="#26333b" stroke-width="6" stroke-linejoin="round"/>
        <circle cx="374" cy="97" r="5" fill="#fff"/>
        <circle cx="375" cy="98" r="2.5" fill="#172832"/>
        <path d="M335 114q14 10 29 1" fill="none" stroke="#26333b" stroke-width="4"/>
      </g>

      <path class="legA" d="M193 178 Q173 204 199 228 L224 209" fill="none" stroke="#f4ad3e" stroke-width="13" stroke-linecap="round"/>
      <path class="legB" d="M211 180 Q235 204 204 230 L181 215" fill="none" stroke="#f4ad3e" stroke-width="13" stroke-linecap="round"/>
      <path d="M214 208h30M171 214h-25" stroke="#26333b" stroke-width="8" stroke-linecap="round"/>
    </g>

    <path d="M62 249q27-16 54 0" fill="none" stroke="#26333b" stroke-width="5"/>
    <text x="202" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#24303b">CARBON-FREE, FISH-FULL</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="34" y="536" width="732" height="45" rx="10" fill="#fff8da" stroke="#26333b" stroke-width="3"/>
    <text x="52" y="565" font-size="16" font-weight="bold" fill="#26333b">Caption: One pelican, two wheels, and absolutely zero respect for aerodynamic dignity.</text>
    <text x="748" y="565" text-anchor="end" font-size="12" fill="#26333b">2026-10-25 01:32:34 SGT (UTC+08:00)</text>
  </g>
</svg>