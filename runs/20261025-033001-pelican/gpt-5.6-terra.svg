<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle, with animated wheels and bobbing motion.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.25s linear infinite; }
    .rider { transform-origin: 410px 310px; animation: bob .65s ease-in-out infinite alternate; }
    .leg { transform-origin: 430px 360px; animation: pedal .65s ease-in-out infinite alternate; }
    .leg2 { transform-origin: 430px 360px; animation: pedal2 .65s ease-in-out infinite alternate; }
    .dust { animation: puff 1.1s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translate(0,-8px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(25deg); } }
    @keyframes pedal2 { to { transform: rotate(-25deg); } }
    @keyframes puff { 0% { opacity:0; transform:translate(0,0) scale(.4); } 35% { opacity:.8; } 100% { opacity:0; transform:translate(-35px,-18px) scale(1.25); } }
  </style>

  <rect width="800" height="600" fill="#bfeaff"/>
  <path d="M0 255 Q120 215 250 250 T500 235 T800 250 V430 H0Z" fill="#8bd18b"/>
  <path d="M0 345 Q150 310 300 340 T600 330 T800 345 V430 H0Z" fill="#54b96c"/>
  <path d="M0 425 H800" stroke="#55613a" stroke-width="9"/>
  <path d="M0 440 H800" stroke="#f6d75b" stroke-width="6" stroke-dasharray="35 24"/>

  <g opacity=".85">
    <path d="M105 241 l18-55 15 55zM137 246 l13-39 16 42z" fill="#40855d"/>
    <path d="M680 242 l18-57 16 57zM714 244 l15-43 15 45z" fill="#40855d"/>
  </g>

  <text x="400" y="66" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="42" fill="#17334a" stroke="#fff" stroke-width="4" paint-order="stroke">PELICAN PEDAL PANIC!</text>
  <text x="400" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#25445a">“Saving the planet one wildly impractical commute at a time.”</text>

  <g class="dust" fill="#d9c8a3">
    <ellipse cx="152" cy="410" rx="18" ry="9"/>
    <ellipse cx="126" cy="418" rx="12" ry="6"/>
  </g>

