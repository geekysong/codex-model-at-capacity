  </g>

  <g font-family="Arial Black, sans-serif" fill="#17334a">
    <path d="M587 180 q64-25 118 12 l-16 65 q-55 10-101-25z" fill="#fff9d8" stroke="#17334a" stroke-width="4"/>
    <text x="646" y="207" text-anchor="middle" font-size="17">HONK IF</text>
