  <rect y="510" width="800" height="90" fill="#17334a"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#fff6ca">One beak. Two wheels. Zero respect for traffic laws.</text>
