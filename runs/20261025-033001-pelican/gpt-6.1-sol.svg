<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="description">A determined pelican with an enormous pouch full of fish pedals a bicycle past a no-fishing sign. The wheels spin and the pelican bobs in a continuous animation.</desc>
  <defs>
    <pattern id="road" width="100" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 6h42" stroke="#fff5d9" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="spokes" stroke="#597780" stroke-width="3">
      <path d="M-70 0H70M0-70V70M-49-49L49 49M-49 49L49-49"/>
      <circle r="9" fill="#f5c54c" stroke="#243c46" stroke-width="4"/>
    </g>
    <g id="fish">
      <path d="M-19 0Q0-19 23 0Q0 19-19 0L-32-12V12Z" fill="#83c5cc" stroke="#243c46" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="13" cy="-2" r="2.5" fill="#243c46"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <path d="M0 114H800V490H0Z" fill="#d8eef0"/>
  <circle cx="690" cy="174" r="38" fill="#f9cd58"/>
  <g fill="#fff" opacity=".85">
    <path d="M38 198q-15-31 20-35q17-32 42-5q33-8 36 24q16 17-7 21H46Z"/>
    <path d="M570 156q-8-24 17-29q17-21 35 0q28-5 31 23Z"/>
  </g>

  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="41" font-weight="900" fill="#203d48">TOUR DE FISH</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#b34d36">ONE BIRD. TWO WHEELS. ZERO RESTRAINT.</text>

  <path d="M0 445Q130 409 245 444T510 433T800 444V513H0Z" fill="#a5c7a1"/>
  <path d="M0 471H800V520H0Z" fill="#698087"/>
  <rect y="495" width="800" height="12" fill="url(#road)"/>

  <g stroke="#243c46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 306V465" stroke-width="9"/>
    <rect x="49" y="236" width="110" height="77" rx="10" fill="#fff9e9" stroke-width="4"/>
    <use href="#fish" transform="translate(104 274) scale(.9)"/>
    <path d="M65 301l77-54" stroke="#d75443" stroke-width="7"/>
    <text x="104" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#243c46" stroke="none">NICE TRY.</text>
  </g>

  <ellipse cx="407" cy="513" rx="241" ry="9" fill="#243c46" opacity=".15"/>

  <g fill="#e4f0e9" stroke="#243c46" stroke-width="7">
    <circle cx="270" cy="435" r="75"/>
    <circle cx="540" cy="435" r="75"/>
  </g>
  <g transform="translate(270 435)">
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(540 435)">
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g stroke="#243c46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 435L333 332L398 435ZM333 332H493L398 435M493 332L540 435" fill="none" stroke-width="13"/>
    <path d="M270 435L333 332L398 435ZM333 332H493L398 435M493 332L540 435" fill="none" stroke="#dd6150" stroke-width="7"/>
    <path d="M333 332l-8-26M306 305h43" fill="none" stroke-width="9"/>
    <path d="M493 332l-17-51h31q18 0 18 15" fill="none" stroke-width="8"/>
    <circle cx="398" cy="435" r="19" fill="#f6d05f" stroke-width="4"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <g stroke="#243c46" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M318 322q-31-13-43-37l42 7" fill="#fffdf1"/>
      <path d="M330 326q-42-34-15-78q21-35 60-11q32 23 26 64q-3 31-37 39Z" fill="#fffdf1"/>
      <path d="M359 282q-17 6-15 24q17 15 39-4l66-20" fill="#e4e9dc"/>
      <path d="M449 282l30 2" fill="none" stroke-width="10"/>
      <path d="M378 254q-14-49 5-79q18-29 44-8q21 20-1 55l-14 45" fill="#fffdf1"/>
      <path d="M404 192Q455 183 572 208Q522 266 430 236Q411 218 404 192Z" fill="#f5bd55"/>
      <path d="M410 194L580 205Q576 215 559 215L421 207" fill="#ef8c3e"/>
      <path d="M432 218q43 27 105 1" fill="none" stroke="#dc8b3d" stroke-width="2"/>
      <circle cx="413" cy="180" r="6" fill="#243c46" stroke="none"/>
      <circle cx="415" cy="178" r="2" fill="white" stroke="none"/>
      <path d="M401 165l19 3" fill="none"/>
      <path d="M381 161q-2-25 25-28q28 1 31 25Z" fill="#dc6150"/>
      <path d="M395 139l-1 15m15-16l2 16" fill="none" stroke="#fff7df" stroke-width="3"/>
      <path d="M379 161l65 1" fill="none" stroke-width="6"/>
      <path d="M383 233l26 18-22 13-12-21" fill="#d95443"/>
      <path d="M387 259q-24 5-34-4l4 24 28-8" fill="#d95443"/>

      <path d="M356 331l-6 42 48 42" fill="none" stroke="#edaa40" stroke-width="12">
        <animate attributeName="d" values="M356 331l-6 42 48 42;M356 331l21 39 21 63;M356 331l-6 42 48 42" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M379 334l36 30-1 65" fill="none" stroke="#f6bd50" stroke-width="12">
        <animate attributeName="d" values="M379 334l36 30-1 65;M379 334l1 46 34 26;M379 334l36 30-1 65" dur="1.6s" repeatCount="indefinite"/>
      </path>
    </g>
    <use href="#fish" transform="translate(456 224) rotate(12) scale(.65)"/>
    <use href="#fish" transform="translate(505 226) rotate(-12) scale(.55)"/>
  </g>

  <g transform="translate(398 435)">
    <g stroke="#243c46" stroke-width="5" stroke-linecap="round">
      <path d="M-22 0H22"/>
      <path d="M-29-5h14M15 5h14" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif" fill="#243c46">
    <path d="M585 276q-13-38 26-44h113q28 0 28 28v35q0 23-25 23H619l-29 22 6-29q-15-6-11-35Z" fill="#fffdf1" stroke="#243c46" stroke-width="3"/>
    <text x="668" y="262" text-anchor="middle" font-size="17" font-weight="bold">
      <tspan x="668">“It's called</tspan>
      <tspan x="668" dy="24">a pelican</tspan>
      <tspan x="668" dy="24">delivery fee.”</tspan>
    </text>
  </g>

  <rect y="527" width="800" height="73" fill="#fff7df"/>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243c46">The pelican chose cycling. His lunch chose otherwise.</text>
  <text x="400" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#435b64">2026-10-25 03:31:13 SGT (UTC+08:00)</text>
</svg>