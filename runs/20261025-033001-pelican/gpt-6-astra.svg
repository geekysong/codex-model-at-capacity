<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">An overly confident pelican pedals a tiny bicycle with a huge fish-filled beak. The wheels spin and the pelican bobs in a continuous loop.</desc>
