<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a fish in its beak pouch. Both wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
