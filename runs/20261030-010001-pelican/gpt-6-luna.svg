  <text x="40" y="58" font-size="34" font-weight="900" fill="#17324d">THE PELICAN BIKE LANE</text>
  <text x="42" y="87" font-size="16" font-weight="700" fill="#31546a">“I’m not carrying the fish. The fish is commuting.”</text>

