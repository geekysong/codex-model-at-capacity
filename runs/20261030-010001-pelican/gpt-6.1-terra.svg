    <path d="M225 411L300 313 370 411 225 411 327 325 452 325 370 411"/>
    <path d="M452 325L535 411 M452 325L441 293"/>
  </g>
  <path d="M289 308h31" stroke="#25324a" stroke-width="9" stroke-linecap="round"/>
  <path d="M441 293l26-5 11 8" fill="none" stroke="#25324a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="370" cy="411" r="19" fill="#fff9e8" stroke="#25324a" stroke-width="4"/>
  <path d="M370 411l17 15h18" fill="none" stroke="#25324a" stroke-width="5" stroke-linecap="round"/>
  <path d="M400 426h18" stroke="#25324a" stroke-width="7" stroke-linecap="round"/>

  <g class="rider">
    <path d="M327 326l25 37 27 22" fill="none" stroke="#e59c42" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
