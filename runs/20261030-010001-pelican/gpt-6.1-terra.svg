<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN IN THE BIKE LANE</title>
  <desc id="desc">A smug pelican pedals a bicycle past a roadside sign. The wheels spin and the rider bobs as the animation loops.</desc>
  <defs>
    <style>
      .outline { stroke:#25324a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 1s ease-in-out infinite; }
      .cloud { animation:drift 8s ease-in-out infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
      @keyframes drift { to { transform:translateX(16px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.cloud { animation:none; } }
    </style>
    <pattern id="road" width="42" height="20" patternUnits="userSpaceOnUse">
      <path d="M5 12h6 M27 5h5" stroke="#9f9b8b" stroke-width="2" opacity=".45"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f9edce"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#fff9e8" stroke="#25324a" stroke-width="4"/>
  <path d="M20 95H780V432H20Z" fill="#a9dfe2"/>
  <circle cx="695" cy="145" r="35" fill="#ffd36b"/>
  <g class="cloud" fill="#fff9e8" opacity=".9">
    <path d="M90 155c0-15 22-20 32-10 6-22 39-22 47-2 19-4 29 6 28 17H90Z"/>
    <path d="M537 198c2-12 18-15 27-7 8-17 34-15 39 1 16-3 26 4 26 14h-92Z"/>
  </g>

  <text x="400" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" letter-spacing="2" fill="#25324a">PELICAN IN THE BIKE LANE</text>
  <path d="M20 423 Q160 404 310 422 T600 419 T780 423V486H20Z" fill="#a5c68b"/>
  <path d="M20 451H780V500H20Z" fill="#c5c0ae"/>
  <path d="M20 451H780V500H20Z" fill="url(#road)"/>
  <path d="M20 450H780" stroke="#697563" stroke-width="4"/>

  <g transform="translate(650 283)">
    <path d="M30 84V166" stroke="#6b5949" stroke-width="8"/>
    <rect x="-20" y="0" width="100" height="91" rx="8" fill="#fff9e8" stroke="#25324a" stroke-width="4" transform="rotate(3 30 45)"/>
    <text x="30" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#25324a">BIKE LANE</text>
    <text x="30" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d85a44">NO</text>
    <text x="30" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#d85a44">FISHING</text>
  </g>

  <path d="M73 421h55 M53 433h52 M86 443h38" stroke="#fff9e8" stroke-width="5" stroke-linecap="round" opacity=".8"/>

  <g class="wheel" transform="translate(225 411)">
    <circle r="69" fill="#fff9e8" stroke="#25324a" stroke-width="9"/>
    <circle r="57" fill="none" stroke="#e88360" stroke-width="3"/>
    <g stroke="#8a9ca0" stroke-width="3">
      <path d="M-57 0H57 M0-57V57 M-40-40L40 40 M40-40L-40 40"/>
    </g>
    <circle r="8" fill="#25324a"/>
  </g>
  <g class="wheel" transform="translate(535 411)">
    <circle r="69" fill="#fff9e8" stroke="#25324a" stroke-width="9"/>
    <circle r="57" fill="none" stroke="#e88360" stroke-width="3"/>
    <g stroke="#8a9ca0" stroke-width="3">
      <path d="M-57 0H57 M0-57V57 M-40-40L40 40 M40-40L-40 40"/>
    </g>
    <circle r="8" fill="#25324a"/>
  </g>

