    <path d="M360 257c20 16 30 32 42 47l36-9" fill="none" stroke="#25324a" stroke-width="7" stroke-linecap="round"/>
    <path d="M437 295l10-4" stroke="#e59c42" stroke-width="9" stroke-linecap="round"/>
    <path d="M356 222c-4-30 4-55 25-67 19-11 45-8 58 7 12 14 11 31 5 44-6 14-16 22-19 35" fill="#fff9e8" class="outline"/>
