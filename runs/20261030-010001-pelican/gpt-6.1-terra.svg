    <circle cx="415" cy="182" r="16" fill="#fff" stroke="#25324a" stroke-width="4"/>
    <circle cx="420" cy="183" r="5" fill="#25324a"/>
    <path d="M401 161q15-8 27-1" fill="none" stroke="#25324a" stroke-width="5" stroke-linecap="round"/>
    <path d="M369 165c5-23 20-35 43-35 17 0 31 8 36 25l-4 7c-22-8-48-8-75 3Z" fill="#e56c55" class="outline"/>
    <path d="M380 145l-3 12 M394 137l-2 17 M410 136l1 16 M426 140l4 15" stroke="#fff9e8" stroke-width="3" stroke-linecap="round"/>
    <path d="M359 158q44-14 92 1" fill="none" stroke="#25324a" stroke-width="6" stroke-linecap="round"/>
