  <text x="400" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#ad543b">ZERO EMISSIONS. MAXIMUM ENTITLEMENT.</text>

