<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican’s sustainable commute</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish-filled basket. Both wheels spin, the pedals turn, and the pelican gently bobs. A sign announces a bike lane while pointing toward the sea.</desc>
