  <rect x="0" y="530" width="800" height="70" fill="#203d48"/>
  <text x="400" y="555" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#fff8e7">He gave up flying. The smugness stayed airborne.</text>
