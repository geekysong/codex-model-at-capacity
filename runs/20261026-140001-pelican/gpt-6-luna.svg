<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Two-Wheel Deal</title>
  <desc id="desc">A smug pelican pedals a bicycle while its enormous beak catches a fish. The wheels turn and the rider bobs gently.</desc>
  <defs>
    <style>
      .ink{stroke:#203344;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:none;stroke:#203344;stroke-width:7}
      .spoke{stroke:#718494;stroke-width:2}
      .frame{fill:none;stroke:#df6043;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#203344}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .rolling{transform-box:fill-box;transform-origin:center;animation:spin 2.5s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .55s ease-in-out infinite}
    </style>
  </defs>

  <rect width="800" height="600" fill="#d9f3f2"/>
