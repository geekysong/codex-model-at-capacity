  <text x="400" y="53" text-anchor="middle" class="label" font-size="31" font-weight="900" letter-spacing="1">THE PELICAN’S TWO-WHEEL DEAL</text>
  <text x="400" y="82" text-anchor="middle" class="label" font-size="16" font-weight="600">“I’m on a seafood diet: I see food, I pedal faster.”</text>

