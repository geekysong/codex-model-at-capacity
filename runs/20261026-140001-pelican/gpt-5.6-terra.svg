      <circle cx="249" cy="413" r="9" fill="#ffd953" stroke="#253a43" stroke-width="4"/>
      <g stroke="#778996" stroke-width="4">
        <path d="M249 337V489M173 413H325M195 359L303 467M303 359L195 467"/>
      </g>
    </g>
    <g class="wheel">
      <circle cx="555" cy="413" r="76" fill="#f9faf6" stroke="#253a43" stroke-width="10"/>
      <circle cx="555" cy="413" r="9" fill="#ffd953" stroke="#253a43" stroke-width="4"/>
      <g stroke="#778996" stroke-width="4">
        <path d="M555 337V489M479 413H631M501 359L609 467M609 359L501 467"/>
      </g>
    </g>

    <path d="M249 413 L340 292 L433 413 Z M340 292 L493 299 L555 413 M433 413 L493 299" fill="none" stroke="#e4473e" stroke-width="12" stroke-linejoin="round"/>
