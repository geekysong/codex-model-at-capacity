  <rect y="510" width="800" height="90" fill="#173555"/>
  <text x="400" y="547" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#fff">A pelican on a bicycle: proof that every commute can get more ridiculous.</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#bcecff">2026-10-26 14:03:20 SGT (UTC+08:00)</text>
</svg>