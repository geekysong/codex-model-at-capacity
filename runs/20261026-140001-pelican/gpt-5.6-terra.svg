  <g font-family="Arial, sans-serif" font-weight="700">
    <path d="M613 272 q64 -42 108 7 q-45 49 -108 14Z" fill="#fff5bc" stroke="#253a43" stroke-width="4"/>
    <text x="666" y="282" text-anchor="middle" font-size="16" fill="#253a43">HONK!</text>
