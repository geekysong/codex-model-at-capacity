<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a proud pelican wobbling along on a bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .bob { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: top center; animation: pedal .55s ease-in-out infinite alternate; }
    .leg2 { transform-box: fill-box; transform-origin: top center; animation: pedal .55s ease-in-out infinite alternate-reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(18deg); } }
  </style>

  <rect width="800" height="600" fill="#bcecff"/>
  <path d="M0 347 Q105 304 210 345 T420 338 T625 347 T800 326 V478 H0Z" fill="#9bd95e"/>
  <path d="M0 408 Q150 378 286 411 T544 397 T800 408 V478 H0Z" fill="#6eba48"/>
  <path d="M0 472 H800" stroke="#405b36" stroke-width="10"/>
  <path d="M41 246 Q86 198 132 247 Q173 190 217 247 Q260 201 303 247" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  <path d="M576 161 Q625 101 675 160 Q724 98 777 159" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>

  <text x="400" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="43" fill="#173555">PELICAN PEDAL PANIC</text>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#31586a">“Finally, a beak-friendly alternative to traffic.”</text>

  <g aria-label="bicycle">
