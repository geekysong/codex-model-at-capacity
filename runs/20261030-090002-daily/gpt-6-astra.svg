    <path d="M100 65V305 M190 65V305 M280 65V305 M370 65V305 M460 65V305"/>
  </g>

  <path d="M100 65H460V305" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#475569">
    <circle cx="190" cy="65" r="3"/>
    <circle cx="280" cy="65" r="3"/>
    <circle cx="370" cy="65" r="3"/>
    <circle cx="460" cy="65" r="3"/>
    <circle cx="100" cy="125" r="3"/>
    <circle cx="280" cy="125" r="3"/>
    <circle cx="370" cy="125" r="3"/>
    <circle cx="460" cy="125" r="3"/>
    <circle cx="100" cy="185" r="3"/>
    <circle cx="190" cy="185" r="3"/>
    <circle cx="370" cy="185" r="3"/>
    <circle cx="460" cy="185" r="3"/>
    <circle cx="100" cy="245" r="3"/>
    <circle cx="190" cy="245" r="3"/>
    <circle cx="280" cy="245" r="3"/>
    <circle cx="460" cy="245" r="3"/>
    <circle cx="100" cy="305" r="3"/>
    <circle cx="190" cy="305" r="3"/>
    <circle cx="280" cy="305" r="3"/>
    <circle cx="370" cy="305" r="3"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M183 118L197 132 M197 118L183 132"/>
    <path d="M273 178L287 192 M287 178L273 192"/>
    <path d="M363 238L377 252 M377 238L363 252"/>
  </g>

  <circle cx="100" cy="65" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="460" cy="305" r="8" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>

  <g font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="100" y="50">A1</text>
    <text x="190" y="50">B1</text>
    <text x="280" y="50">C1</text>
    <text x="370" y="50">D1</text>
    <text x="460" y="50">E1</text>
    <text x="100" y="110">A2</text>
    <text x="190" y="110">B2</text>
    <text x="280" y="110">C2</text>
    <text x="370" y="110">D2</text>
