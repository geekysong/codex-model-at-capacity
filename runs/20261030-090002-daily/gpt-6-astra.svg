<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title description">
  <title id="title">City grid: shortest route from A1 to E5</title>
  <desc id="description">Five columns and five rows of intersections. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="25" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">City Grid · A1 to E5</text>

  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
    <rect x="100" y="65" width="360" height="240" rx="3"/>
  </g>

  <g stroke="#ffffff" stroke-width="16">
    <path d="M100 65H460 M100 125H460 M100 185H460 M100 245H460 M100 305H460"/>
    <path d="M100 65V305 M190 65V305 M280 65V305 M370 65V305 M460 65V305"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
