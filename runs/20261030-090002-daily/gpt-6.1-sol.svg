<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>City street map: shortest route from A1 to E5</title>
  <desc>A five-by-five grid of intersections with blocked intersections B2, C3, and D4. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">City Streets · A1 to E5</text>

  <!-- City blocks -->
  <g fill="#e2e8f0" stroke="#cbd5e1">
    <path d="M112 72h76v36h-76z M212 72h76v36h-76z M312 72h76v36h-76z M412 72h76v36h-76z
             M112 132h76v36h-76z M212 132h76v36h-76z M312 132h76v36h-76z M412 132h76v36h-76z
             M112 192h76v36h-76z M212 192h76v36h-76z M312 192h76v36h-76z M412 192h76v36h-76z
             M112 252h76v36h-76z M212 252h76v36h-76z M312 252h76v36h-76z M412 252h76v36h-76z"/>
  </g>

  <!-- Streets -->
  <g fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <!-- Shortest route: four segments east, four south -->
  <path d="M100 60H500V300" fill="none" stroke="#2563eb" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#64748b" stroke-width="2">
    <circle cx="200" cy="60" r="4"/><circle cx="300" cy="60" r="4"/><circle cx="400" cy="60" r="4"/><circle cx="500" cy="60" r="4"/>
    <circle cx="100" cy="120" r="4"/><circle cx="300" cy="120" r="4"/><circle cx="400" cy="120" r="4"/><circle cx="500" cy="120" r="4"/>
    <circle cx="100" cy="180" r="4"/><circle cx="200" cy="180" r="4"/><circle cx="400" cy="180" r="4"/><circle cx="500" cy="180" r="4"/>
    <circle cx="100" cy="240" r="4"/><circle cx="200" cy="240" r="4"/><circle cx="300" cy="240" r="4"/><circle cx="500" cy="240" r="4"/>
    <circle cx="100" cy="300" r="4"/><circle cx="200" cy="300" r="4"/><circle cx="300" cy="300" r="4"/><circle cx="400" cy="300" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 113l14 14m0-14l-14 14"/>
    <path d="M293 173l14 14m0-14l-14 14"/>
    <path d="M393 233l14 14m0-14l-14 14"/>
  </g>

  <!-- Start and end -->
  <circle cx="100" cy="60" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="300" r="7" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    <text x="56" y="65" text-anchor="middle" fill="#15803d">START</text>
    <text x="542" y="305" text-anchor="middle" fill="#7c3aed">END</text>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle" stroke="#f8fafc" stroke-width="3" paint-order="stroke">
    <text x="100" y="48">A1</text><text x="200" y="48">B1</text><text x="300" y="48">C1</text><text x="400" y="48">D1</text><text x="500" y="48">E1</text>
    <text x="100" y="108">A2</text><text x="200" y="108">B2</text><text x="300" y="108">C2</text><text x="400" y="108">D2</text><text x="500" y="108">E2</text>
    <text x="100" y="168">A3</text><text x="200" y="168">B3</text><text x="300" y="168">C3</text><text x="400" y="168">D3</text><text x="500" y="168">E3</text>
    <text x="100" y="228">A4</text><text x="200" y="228">B4</text><text x="300" y="228">C4</text><text x="400" y="228">D4</text><text x="500" y="228">E4</text>
    <text x="100" y="321">A5</text><text x="200" y="321">B5</text><text x="300" y="321">C5</text><text x="400" y="321">D5</text><text x="500" y="321">E5</text>
  </g>

  <text x="300" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">Shortest route: 8 street segments</text>
  <path d="M24 361H576" stroke="#cbd5e1"/>
  <text x="300" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 09:03:36 SGT (UTC+08:00)</text>
</svg>