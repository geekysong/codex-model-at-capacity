<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172b4d">
    <text x="50" y="30" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="50" y="57">Initial velocity: horizontal 20 m/s, vertical 15 m/s</text>
    <text x="50" y="81">Gravity: 10 m/s² · No air resistance · Flight time: 3 s</text>
    <text x="50" y="110">Scale: 10 px/m on both axes; horizontal axis broken.</text>
    <text x="50" y="134">The 34–56 m interval is omitted to fit the canvas.</text>
    <text x="50" y="158">Distances are measured horizontally from launch.</text>
  </g>

  <!-- Physical trajectory: x = 100 + 200t, y = 350 - 150t + 50t².
       The landing would be at x=700 without the explicitly marked axis break.
       After the break, horizontal coordinates are translated by -200 px. -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#637083" stroke-width="2"/>

  <g fill="none" stroke="#176baf" stroke-width="3">
    <path d="M 100,350 Q 270,222.5 440,239.5"/>
    <path d="M 460,322 Q 480,335 500,350"/>
  </g>

  <g stroke="#637083" stroke-width="2">
    <path d="M 441,345 L 447,355 M 451,345 L 457,355"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#637083">
    <text x="452" y="241">break</text>
    <text x="465" y="307">resume</text>
  </g>

  <g fill="#176baf">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172b4d">
    <text x="55" y="373">launch: 0 m, 0 m</text>
    <text x="320" y="215">apex: 30 m, 11.25 m</text>
    <text x="435" y="373">landing: 60 m, 0 m</text>
  </g>

  <text x="300" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#172b4d">2026-10-25 10:03:10 SGT (UTC+08:00)</text>
</svg>