<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Five by five shaded-cell puzzle solution</title>
  <desc id="desc">Each row and column has two shaded cells. Shaded cells do not share an edge.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="30" y="25" fill="#172033" font-family="Arial, sans-serif" font-size="18" font-weight="bold">5 × 5 grid solution</text>

  <g transform="translate(30 40)">
    <rect width="300" height="300" fill="#ffffff"/>
    <g fill="#b9d7f4">
      <rect x="0" y="0" width="60" height="60"/>
      <rect x="120" y="0" width="60" height="60"/>
      <rect x="60" y="60" width="60" height="60"/>
      <rect x="180" y="60" width="60" height="60"/>
      <rect x="120" y="120" width="60" height="60"/>
      <rect x="240" y="120" width="60" height="60"/>
      <rect x="0" y="180" width="60" height="60"/>
      <rect x="180" y="180" width="60" height="60"/>
      <rect x="60" y="240" width="60" height="60"/>
      <rect x="240" y="240" width="60" height="60"/>
    </g>
    <g fill="none" stroke="#42546b" stroke-width="1.5">
      <rect x="0" y="0" width="300" height="300"/>
      <path d="M60 0v300 M120 0v300 M180 0v300 M240 0v300 M0 60h300 M0 120h300 M0 180h300 M0 240h300"/>
    </g>
    <g fill="#172033" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" dominant-baseline="middle">
      <text x="30" y="30">A1</text><text x="90" y="30">A2</text><text x="150" y="30">A3</text><text x="210" y="30">A4</text><text x="270" y="30">A5</text>
      <text x="30" y="90">B1</text><text x="90" y="90">B2</text><text x="150" y="90">B3</text><text x="210" y="90">B4</text><text x="270" y="90">B5</text>
      <text x="30" y="150">C1</text><text x="90" y="150">C2</text><text x="150" y="150">C3</text><text x="210" y="150">C4</text><text x="270" y="150">C5</text>
      <text x="30" y="210">D1</text><text x="90" y="210">D2</text><text x="150" y="210">D3</text><text x="210" y="210">D4</text><text x="270" y="210">D5</text>
      <text x="30" y="270">E1</text><text x="90" y="270">E2</text><text x="150" y="270">E3</text><text x="210" y="270">E4</text><text x="270" y="270">E5</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="355" y="65" font-size="17" font-weight="bold">Shaded cells</text>
    <g font-size="16">
      <text x="355" y="98">A1, A3</text>
      <text x="355" y="126">B2, B4</text>
      <text x="355" y="154">C3, C5</text>
      <text x="355" y="182">D1, D4</text>
      <text x="355" y="210">E2, E5</text>
      <text x="355" y="250" font-weight="bold">Total: 10</text>
    </g>
  </g>

  <line x1="30" y1="360" x2="570" y2="360" stroke="#cbd5e1"/>
  <text x="30" y="384" fill="#334155" font-family="Arial, sans-serif" font-size="14">2026-11-04 04:04:11 SGT (UTC+08:00)</text>
</svg>