  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="300" y="27" text-anchor="middle" font-size="19" font-weight="700">5 × 5 Shaded-Cell Grid</text>
    <text x="183" y="52" text-anchor="middle" font-size="14" font-weight="700">1</text>
    <text x="253" y="52" text-anchor="middle" font-size="14" font-weight="700">2</text>
    <text x="323" y="52" text-anchor="middle" font-size="14" font-weight="700">3</text>
    <text x="393" y="52" text-anchor="middle" font-size="14" font-weight="700">4</text>
    <text x="463" y="52" text-anchor="middle" font-size="14" font-weight="700">5</text>
    <text x="115" y="96" text-anchor="middle" font-size="14" font-weight="700">A</text>
    <text x="115" y="166" text-anchor="middle" font-size="14" font-weight="700">B</text>
    <text x="115" y="236" text-anchor="middle" font-size="14" font-weight="700">C</text>
    <text x="115" y="306" text-anchor="middle" font-size="14" font-weight="700">D</text>
    <text x="115" y="376" text-anchor="middle" font-size="14" font-weight="700">E</text>
  </g>
  <g fill="#8ecae6">
    <rect x="148" y="62" width="70" height="70"/>
    <rect x="288" y="62" width="70" height="70"/>
    <rect x="428" y="132" width="70" height="70"/>
    <rect x="218" y="202" width="70" height="70"/>
    <rect x="358" y="202" width="70" height="70"/>
    <rect x="148" y="272" width="70" height="70"/>
    <rect x="288" y="272" width="70" height="70"/>
    <rect x="428" y="342" width="70" height="0"/>
  </g>
  <g fill="#8ecae6">
    <rect x="428" y="342" width="70" height="0"/>
    <rect x="218" y="342" width="70" height="0"/>
  </g>
  <g fill="none" stroke="#314158" stroke-width="1.5">
