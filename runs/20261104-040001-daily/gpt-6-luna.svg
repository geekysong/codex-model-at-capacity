<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">5 by 5 shaded-cell grid</title>
  <desc id="desc">A five by five grid. Shaded cells are A1, A3, B5, C2, C4, D1, D3, E5, E2, and E4. There are ten shaded cells, with exactly two in every row and column and no shared edges.</desc>
