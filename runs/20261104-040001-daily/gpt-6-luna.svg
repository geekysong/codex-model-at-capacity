    <g fill="#102a43">
      <text x="183" y="97">A1</text><text x="253" y="97">A2</text><text x="323" y="97">A3</text><text x="393" y="97">A4</text><text x="463" y="97">A5</text>
      <text x="183" y="167">B1</text><text x="253" y="167">B2</text><text x="323" y="167">B3</text><text x="393" y="167">B4</text><text x="463" y="167">B5</text>
      <text x="183" y="237">C1</text><text x="253" y="237">C2</text><text x="323" y="237">C3</text><text x="393" y="237">C4</text><text x="463" y="237">C5</text>
      <text x="183" y="307">D1</text><text x="253" y="307">D2</text><text x="323" y="307">D3</text><text x="393" y="307">D4</text><text x="463" y="307">D5</text>
