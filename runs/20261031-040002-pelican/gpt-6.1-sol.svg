<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Pelican Express</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, carrying fish in its enormous bill beneath a sign promising sustainable delivery. The wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
