<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, carrying three smug fish in its enormous bill. The wheels spin, its foot pedals, and the pelican bobs in a looping animation.</desc>
  <defs>
    <pattern id="grip" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8L8 0" stroke="#46656a" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5db"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="none" stroke="#203943" stroke-width="4"/>

  <text x="400" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" letter-spacing="2" fill="#203943">TOUR DE BEAK</text>
  <text x="400" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#697c7a">ONE RIDER. THREE FREELOADERS. ZERO GEARS.</text>

  <!-- A single sunny coastal scene -->
  <rect x="43" y="129" width="714" height="347" rx="19" fill="#cfebdf"/>
  <circle cx="681" cy="186" r="33" fill="#ffce64"/>
  <path d="M44 361 Q185 329 318 358 T570 350 T757 362 V476 H43Z" fill="#9dcab5"/>
  <path d="M44 402 Q245 378 430 401 T757 403 V476 H43Z" fill="#e9d6aa"/>
  <path d="M45 458H755" stroke="#203943" stroke-width="4"/>
  <path d="M78 441h49m490 0h55m30 0h30" stroke="#c3a97d" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="404" cy="462" rx="213" ry="9" fill="#203943" opacity=".12"/>

  <!-- Roadside joke -->
  <path d="M119 252V397" stroke="#657b73" stroke-width="7"/>
  <path d="M64 197H163L181 223L163 249H64Z" fill="#fff5db" stroke="#203943" stroke-width="3"/>
  <text x="117" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#203943">BIKE LANE</text>
  <text x="117" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#203943">NO FLYING</text>

  <!-- Rotating bicycle wheels -->
  <g transform="translate(263 391)">
    <circle r="64" fill="#fff5db" stroke="#203943" stroke-width="11"/>
    <circle r="56" fill="none" stroke="#ffffff" stroke-width="3"/>
    <g stroke="#7a9392" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-55 0H55M0-55V55M-39-39L39 39M-39 39L39-39"/>
      <path d="M34-44L42-36" stroke="#ed9146" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="8" fill="#203943"/>
  </g>
  <g transform="translate(552 391)">
    <circle r="64" fill="#fff5db" stroke="#203943" stroke-width="11"/>
    <circle r="56" fill="none" stroke="#ffffff" stroke-width="3"/>
    <g stroke="#7a9392" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-55 0H55M0-55V55M-39-39L39 39M-39 39L39-39"/>
      <path d="M34-44L42-36" stroke="#ed9146" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="8" fill="#203943"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#203943" stroke-linejoin="round" stroke-linecap="round">
    <path d="M263 391L325 305L388 391ZM325 305H493L388 391M493 305L552 391" stroke-width="12"/>
    <path d="M263 391L325 305L388 391ZM325 305H493L388 391M493 305L552 391" stroke="#e55d4b" stroke-width="7"/>
    <path d="M325 305L315 279M493 305L483 268L510 255L530 262" stroke-width="8"/>
    <path d="M298 279H337" stroke-width="12"/>
    <path d="M516 258L531 263" stroke="#375a60" stroke-width="12"/>
  </g>
  <path d="M263 389L386 374Q412 390 388 408L264 399Z" fill="#e5e6ce" stroke="#203943" stroke-width="3"/>
  <circle cx="388" cy="391" r="20" fill="#fff5db" stroke="#203943" stroke-width="4"/>

  <!-- Pelican and pedaling leg -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M329 280L344 323L383 367" fill="none" stroke="#203943" stroke-width="12" stroke-linecap="round"/>
    <path d="M329 280L344 323L383 367" fill="none" stroke="#eea744" stroke-width="7" stroke-linecap="round"/>

    <path d="M294 231L252 216L268 250L243 251L281 274" fill="#fbfcf0" stroke="#203943" stroke-width="4" stroke-linejoin="round"/>
    <path d="M283 223Q302 187 363 205Q391 218 389 251Q381 289 330 287Q282 286 274 260Q269 240 283 223Z" fill="#fffef3" stroke="#203943" stroke-width="4"/>
    <path d="M303 222Q353 217 367 248Q338 271 298 247L317 244L300 235" fill="#d6e2d9" stroke="#203943" stroke-width="3" stroke-linejoin="round"/>

    <!-- Long curved neck -->
    <path d="M355 226Q369 204 364 182Q356 156 381 149Q409 142 422 166L415 190Q401 207 405 230L420 250Q408 267 387 259" fill="#fffef3" stroke="#203943" stroke-width="4"/>

    <!-- Enormous pouch carrying fish -->
    <path d="M412 183L616 202Q580 270 477 246Q432 233 412 199Z" fill="#f5b75c" stroke="#203943" stroke-width="4"/>
    <path d="M439 206Q472 246 548 235" fill="none" stroke="#d68a3e" stroke-width="3"/>

    <g stroke="#203943" stroke-width="3" stroke-linejoin="round">
      <path d="M469 207Q455 187 472 176Q487 179 486 198L495 190L494 209Z" fill="#75b7b1"/>
      <path d="M514 212Q498 187 517 176Q532 181 530 203L540 195L539 215Z" fill="#e98d86"/>
      <path d="M559 214Q545 193 561 183Q579 186 575 205L586 200L582 218Z" fill="#8aaf77"/>
    </g>
    <g fill="#fff">
      <circle cx="474" cy="184" r="5"/>
      <circle cx="519" cy="185" r="5"/>
      <circle cx="563" cy="191" r="5"/>
    </g>
    <g fill="#203943">
      <circle cx="476" cy="184" r="2"/>
      <circle cx="521" cy="185" r="2"/>
      <circle cx="565" cy="191" r="2"/>
    </g>

    <path d="M411 180L634 208L415 205Z" fill="#ffce64" stroke="#203943" stroke-width="4" stroke-linejoin="round"/>
    <path d="M428 193L601 207" stroke="#c47c34" stroke-width="2"/>
    <circle cx="401" cy="171" r="10" fill="#fff" stroke="#203943" stroke-width="3"/>
    <circle cx="405" cy="173" r="4" fill="#203943"/>
    <path d="M389 157L410 162" stroke="#203943" stroke-width="5" stroke-linecap="round"/>

    <!-- Helmet -->
    <path d="M359 153Q359 124 389 124Q419 125 424 152Z" fill="#e55d4b" stroke="#203943" stroke-width="4"/>
    <path d="M376 132L372 146M390 130V145M404 134L408 146" stroke="#843f37" stroke-width="4" stroke-linecap="round"/>
    <path d="M364 153Q375 183 390 188" fill="none" stroke="#203943" stroke-width="3"/>

    <!-- Wing reaching the handlebars -->
    <path d="M368 226Q411 229 439 251L514 255Q522 257 517 266L434 266Q393 259 367 246" fill="#fffef3" stroke="#203943" stroke-width="4" stroke-linecap="round"/>
    <path d="M500 258L509 265M491 258L500 265" stroke="#9eafa6" stroke-width="2"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 341 279;6 341 279;-6 341 279" dur="1.6s" repeatCount="indefinite"/>
      <path d="M342 280L371 322L378 365" fill="none" stroke="#203943" stroke-width="12" stroke-linecap="round"/>
      <path d="M342 280L371 322L378 365" fill="none" stroke="#f4b04e" stroke-width="7" stroke-linecap="round"/>
      <path d="M375 359L365 374L401 375L392 365Z" fill="#f4b04e" stroke="#203943" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>

  <g transform="translate(388 391)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0-24V24" stroke="#203943" stroke-width="5"/>
      <path d="M-10-24H10M-10 24H10" stroke="#203943" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle r="6" fill="#e55d4b"/>
  </g>

  <!-- Static dialogue stays readable -->
  <path d="M582 281H721Q733 281 733 294V329Q733 342 720 342H591Q578 342 578 329V300L555 274L590 281Z" fill="#fffef3" stroke="#203943" stroke-width="3"/>
  <text x="656" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#203943">“We pay him</text>
  <text x="656" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#203943">in exposure.”</text>

  <text x="400" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#203943">His bill carries the team. His legs get the bill.</text>
  <path d="M62 531H738" stroke="#c6bda4" stroke-width="2"/>
  <text x="400" y="561" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#203943">2026-10-31 04:00:02 SGT (UTC+08:00)</text>
</svg>