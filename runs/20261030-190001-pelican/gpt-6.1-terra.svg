<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A smug pelican rides a bicycle with spinning wheels and bobbing pedals.</desc>
  <defs>
    <style>
      .ink { stroke:#24313b; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#24313b; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 0.8s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion: reduce) {
        .wheel, .rider, .pedal { animation:none; }
      }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e8"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#e7f5f4" stroke="#24313b" stroke-width="5"/>
  <text x="400" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#24313b">THE PELICAN COMMUTE</text>
