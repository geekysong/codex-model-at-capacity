<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A proud pelican pedals a bicycle with a huge fish-filled bill. The wheels spin, its feet pedal, and its body bobs. A roadside sign declares this a low-carbon commute.</desc>
