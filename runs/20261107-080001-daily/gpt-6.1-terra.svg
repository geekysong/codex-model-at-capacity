<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>

  <!-- The grid occupies x=150–450 and y=50–350. -->
  <g fill="#d9efff">
    <rect x="150" y="50" width="60" height="60"/>
    <rect x="210" y="50" width="60" height="60"/>
    <rect x="270" y="50" width="60" height="60"/>
    <rect x="270" y="110" width="60" height="60"/>
    <rect x="270" y="170" width="60" height="60"/>
    <rect x="330" y="170" width="60" height="60"/>
  </g>

  <g fill="none" stroke="#45515c" stroke-width="1">
    <rect x="150" y="50" width="300" height="300"/>
    <path d="M210 50V350 M270 50V350 M330 50V350 M390 50V350
             M150 110H450 M150 170H450 M150 230H450 M150 290H450"/>
  </g>

  <polyline points="180,80 240,80 300,80 300,140 300,200 360,200"
            fill="none" stroke="#d62828" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Starting robot, facing right. -->
  <g transform="translate(180 80)">
    <rect x="-16" y="-13" width="28" height="26" rx="5" fill="#34495e" stroke="white" stroke-width="2"/>
    <circle cx="-7" cy="-4" r="2" fill="white"/>
    <circle cx="3" cy="-4" r="2" fill="white"/>
    <path d="M-8 5H5" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M12-7L20 0L12 7Z" fill="#34495e"/>
  </g>

  <circle cx="360" cy="200" r="10" fill="#18853b" stroke="white" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="15" fill="#1e2933">
    <text x="466" y="190">Row: 3</text>
    <text x="466" y="212">Column: 4</text>
    <text x="466" y="234">Facing: Right</text>
  </g>

  <text x="300" y="382" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#34404b">2026-11-07 08:04:26 SGT (UTC+08:00)</text>
</svg>