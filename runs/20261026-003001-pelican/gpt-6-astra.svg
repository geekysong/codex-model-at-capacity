      .frame { fill:none; stroke:#e75243; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <g id="wheel">
      <circle r="79" fill="#fff9e9" stroke="#243044" stroke-width="10"/>
      <circle r="66" fill="none" stroke="#a8b9bd" stroke-width="2"/>
