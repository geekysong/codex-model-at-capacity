<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="description">A determined pelican pedals a bicycle with an enormous beak full of fish. Its wheels spin, feet pedal, and body bobs as a fish complains about the service.</desc>
  <defs>
