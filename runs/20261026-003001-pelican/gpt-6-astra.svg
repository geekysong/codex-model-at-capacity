  <g>
    <path d="M83 112H288Q305 112 305 129V173Q305 190 288 190H183L164 211L167 190H83Q66 190 66 173V129Q66 112 83 112Z" fill="#fffdf5" class="ink"/>
    <text x="185" y="143" text-anchor="middle" font-size="19" font-weight="bold" fill="#243044">“Paid in exposure.</text>
    <text x="185" y="170" text-anchor="middle" font-size="19" font-weight="bold" fill="#243044">Mostly headwind.”</text>
  </g>
  <g>
    <path d="M623 261H750Q763 261 763 274V319Q763 332 750 332H623Q610 332 610 319V280L583 238L626 261Z" fill="#fffdf5" class="ink"/>
    <text x="686" y="289" text-anchor="middle" font-size="17" font-weight="bold" fill="#243044">“We ordered</text>
    <text x="686" y="313" text-anchor="middle" font-size="17" font-weight="bold" fill="#243044">a pool.”</text>
  </g>

  <text x="400" y="514" text-anchor="middle" font-size="23" font-weight="bold" fill="#243044">One pelican. Two wheels. A bill full of customers.</text>
  <path d="M40 541H760" stroke="#cbbb9e" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" font-size="18" fill="#334454">2026-10-26 00:30:01 SGT (UTC+08:00)</text>
