<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commuter</title>
  <desc id="desc">A smug pelican pedals a bicycle along the waterfront with a huge fish-filled bill pouch. The wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="water" width="70" height="24" patternUnits="userSpaceOnUse">
      <path d="M5 13q12-8 24 0t24 0" fill="none" stroke="#83c8cf" stroke-width="3"/>
    </pattern>
    <g id="wheel">
      <circle r="69" fill="#fff9e8" stroke="#233645" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#9bafae" stroke-width="2"/>
      <g stroke="#647c85" stroke-width="2">
        <path d="M0-60V60M-60 0H60M-42-42 42 42M-42 42 42-42"/>
      </g>
      <circle r="8" fill="#e95b43" stroke="#233645" stroke-width="3"/>
    </g>
    <g id="fish">
      <path d="M-18 0Q0-17 19 0 0 17-18 0l-11 10V-10Z" fill="#77bac3" stroke="#233645" stroke-width="2"/>
      <circle cx="11" cy="-2" r="2" fill="#233645"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect x="18" y="18" width="764" height="564" rx="20" fill="none" stroke="#233645" stroke-width="4"/>
  <text x="400" y="64" text-anchor="middle" fill="#233645" font-family="sans-serif" font-size="36" font-weight="900">THE PELICAN COMMUTER</text>
  <text x="400" y="94" text-anchor="middle" fill="#a04632" font-family="sans-serif" font-size="17" font-weight="bold">ZERO EMISSIONS. EXCESS BAGGAGE.</text>

  <path d="M34 270Q140 247 239 273T447 267T766 271V406H34Z" fill="#bce4df"/>
  <path d="M34 291H766V406H34Z" fill="url(#water)"/>
  <circle cx="693" cy="161" r="32" fill="#f5bc51"/>
  <g fill="none" stroke="#6e969b" stroke-width="3" stroke-linecap="round">
    <path d="M80 197q10-13 20 0 10-13 20 0M625 219q8-10 16 0 8-10 16 0"/>
  </g>
  <path d="M34 416H766V503H34Z" fill="#e0d1ae"/>
  <path d="M34 416H766" stroke="#233645" stroke-width="4"/>
  <path d="M55 477H151m57 0h96m57 0h96m57 0h96m57 0h70" stroke="#fff4d9" stroke-width="5" stroke-dasharray="22 16"/>
  <ellipse cx="392" cy="458" rx="222" ry="13" fill="#233645" opacity=".12"/>

  <g transform="translate(239 386)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(549 386)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <g stroke="#233645" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="m239 386 85-114 67 114H239l122-99h144l-114 99" fill="none" stroke="#d44f41" stroke-width="10"/>
    <path d="m549 386-44-99-12-42h34" fill="none" stroke-width="9"/>
    <path d="m324 272-8-28" fill="none" stroke-width="8"/>
    <path d="M293 244h52" fill="none" stroke-width="12"/>
    <path d="m527 245 22-12" fill="none" stroke="#805333" stroke-width="10"/>
    <path d="M239 386h152" fill="none" stroke-width="2"/>
    <circle cx="391" cy="386" r="20" fill="#f5bc51"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <!-- Tail, body, and neck -->
    <path d="m288 233-43-21 17 39 42 15" fill="#faf9ed" stroke="#233645" stroke-width="4" stroke-linejoin="round"/>
    <path d="M295 263q-35-37-7-82 23-36 72-10l36 44q39-14 26-60-8-32 16-44 29-13 44 14 10 21-4 42-18 28-8 62 8 52-48 64-73 18-127-30Z" fill="#fffdf1" stroke="#233645" stroke-width="4"/>
    <path d="M310 197q-18 53 49 65 25 1 35-18-47 5-52-29" fill="#d8e3dc" stroke="#233645" stroke-width="3"/>
    <!-- Outstretched wing holds the handlebar -->
    <path d="M369 213q54 9 88 31l67-11 10 13-77 18q-63-7-100-29" fill="#fffdf1" stroke="#233645" stroke-width="4" stroke-linejoin="round"/>
    <path d="m516 238 17 9m-23-5 15 10" stroke="#233645" stroke-width="2"/>

    <!-- Vast, proudly overloaded bill -->
    <path d="M471 145 640 167q-12 88-101 76-58-8-68-83" fill="#f4bb52" stroke="#233645" stroke-width="4"/>
    <path d="M476 143q92-4 181 24l-181 5Z" fill="#ee8b35" stroke="#233645" stroke-width="4" stroke-linejoin="round"/>
    <use href="#fish" transform="translate(527 195) rotate(14)"/>
    <use href="#fish" transform="translate(580 203) rotate(-16)"/>
    <path d="M509 226q44 17 81-3" fill="none" stroke="#cc8430" stroke-width="3"/>

    <!-- Face and tiny commuter helmet -->
    <circle cx="459" cy="132" r="6" fill="#233645"/>
    <circle cx="461" cy="130" r="1.5" fill="white"/>
    <path d="m450 119 17 3" stroke="#233645" stroke-width="4" stroke-linecap="round"/>
    <path d="M426 116q0-31 30-29 27 1 31 29Z" fill="#e95b43" stroke="#233645" stroke-width="4"/>
    <path d="m444 91-3 15m16-17v17m13-12 4 13" stroke="#fff4d9" stroke-width="4"/>
    <path d="m431 119 9 32 20 5" fill="none" stroke="#233645" stroke-width="3"/>

    <!-- Bent pedaling leg -->
    <path d="m348 282 43 42-18 43" fill="none" stroke="#233645" stroke-width="15" stroke-linecap="round">
      <animate attributeName="d" values="M348 282 391 324 373 367;M348 282 363 329 409 405;M348 282 391 324 373 367" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="m348 282 43 42-18 43" fill="none" stroke="#eea244" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" values="M348 282 391 324 373 367;M348 282 363 329 409 405;M348 282 391 324 373 367" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="m369 367 20 3-14 7-18-4Z" fill="#eea244" stroke="#233645" stroke-width="3">
      <animate attributeName="d" values="M369 367 389 370 375 377 357 373Z;M405 405 425 408 411 415 393 411Z;M369 367 389 370 375 377 357 373Z" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(391 386)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="225" to="585" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-27 0H27" stroke="#233645" stroke-width="6" stroke-linecap="round"/>
      <path d="M-27-8V8M27-8V8" stroke="#233645" stroke-width="7"/>
    </g>
    <circle r="6" fill="#233645"/>
  </g>

  <!-- Separate speech bubble keeps lettering steady and readable -->
  <path d="M76 120h276q16 0 16 16v43q0 16-16 16h-43l-24 21 4-21H76q-16 0-16-16v-43q0-16 16-16Z" fill="white" stroke="#233645" stroke-width="3"/>
  <text x="214" y="149" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#233645">
    <tspan x="214">“It’s a company car.</tspan>
    <tspan x="214" dy="25">I work for fish.”</tspan>
  </text>

  <text x="400" y="530" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#233645">He cycles to work. His lunch takes the whole lane.</text>
  <path d="M48 546H752" stroke="#b8a88a" stroke-width="1.5"/>
  <text x="400" y="569" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#233645">2026-11-04 20:01:26 SGT (UTC+08:00)</text>
</svg>