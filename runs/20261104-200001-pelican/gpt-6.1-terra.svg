<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels and a bobbing body. The caption reads: "One more delivery and I can finally bill by the beak."</desc>
  <style>
    .ink { stroke: #24313b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.2s linear infinite; }
    .rider { animation: bob 1.1s ease-in-out infinite; }
    .pedal { transform-origin: 405px 409px; animation: spin 2.2s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedal { animation-duration: 8s; } }
  </style>

  <rect width="800" height="600" fill="#f8edcc"/>
