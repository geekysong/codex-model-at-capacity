    <text x="61" y="128">5</text><text x="103" y="128" font-weight="bold">6</text><text x="145" y="128">7</text><text x="187" y="128">8</text>
    <text x="61" y="170">9</text><text x="103" y="170">10</text><text x="145" y="170">11</text><text x="187" y="170">12</text>
    <text x="61" y="212">13</text><text x="103" y="212">14</text><text x="145" y="212">15</text><text x="187" y="212">16</text>
