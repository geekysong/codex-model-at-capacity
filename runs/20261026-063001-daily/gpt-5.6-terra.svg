    <rect x="82" y="65" width="42" height="42" fill="#ffffff"/>
    <rect x="124" y="65" width="42" height="42" fill="#ffffff"/>
    <rect x="166" y="65" width="42" height="42" fill="#93c5fd"/>

    <rect x="40" y="107" width="42" height="42" fill="#ffffff"/>
    <rect x="82" y="107" width="42" height="42" fill="#fbbf24"/>
    <rect x="124" y="107" width="42" height="42" fill="#ffffff"/>
    <rect x="166" y="107" width="42" height="42" fill="#ffffff"/>

