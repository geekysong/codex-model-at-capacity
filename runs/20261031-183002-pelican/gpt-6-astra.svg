<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican rides a tiny bicycle with a fish in its enormous bill pouch. Wheels spin, pedals turn, and the pelican bobs. Caption: Zero emissions. Suspiciously fishy fuel.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bcebf0"/>
      <stop offset="1" stop-color="#fff5d9"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd279"/>
      <stop offset="1" stop-color="#ef9865"/>
    </linearGradient>
    <pattern id="road" width="160" height="12" patternUnits="userSpaceOnUse">
      <path d="M20 6h70" stroke="#fff7d8" stroke-width="5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="16" y="16" width="768" height="568" rx="22" fill="url(#sky)" stroke="#223b42" stroke-width="4"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#203940">
    <text x="400" y="65" font-size="43" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="94" font-size="17" font-weight="700" letter-spacing="2">THE COMMUTE HAS GONE FOWL.</text>
  </g>

  <circle cx="690" cy="161" r="37" fill="#ffdb73"/>
  <g fill="#fff" opacity=".8">
    <path d="M57 168c-7-19 16-32 30-23 3-26 42-29 51-5 22-7 37 11 31 28Z"/>
    <path d="M489 138c-5-16 13-26 27-19 8-21 36-19 42 1 18-4 30 6 28 18Z"/>
  </g>
  <path d="M18 368Q124 324 224 358T439 351T653 350T782 346V432H18Z" fill="#a9c8a1"/>
  <path d="M18 403Q156 362 287 398T542 387T782 399V450H18Z" fill="#80b79e"/>
  <rect x="18" y="429" width="764" height="74" fill="#64828a"/>
  <rect x="18" y="476" width="764" height="12" fill="url(#road)"/>
  <ellipse cx="402" cy="448" rx="241" ry="13" fill="#2c4c57" opacity=".22"/>

  <!-- A very optimistic roadside sign. -->
  <g stroke="#29434a" stroke-width="3" stroke-linejoin="round">
    <path d="M701 271v160" stroke-width="7"/>
    <path d="M628 247h112l26 34-26 34H628Z" fill="#fff6cc"/>
  </g>
  <g fill="#29434a" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">
    <text x="692" y="274" font-size="15">BIKE LANE</text>
    <text x="692" y="296" font-size="12">NO WINGING IT</text>
  </g>

  <!-- Rotating wheels, each spinning around its own axle. -->
  <g transform="translate(245 397)">
    <circle r="69" fill="#eff4dc" stroke="#233c44" stroke-width="13"/>
    <circle r="58" fill="none" stroke="#c2d7ce" stroke-width="3"/>
    <g stroke="#547580" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
      <path d="M-58 0H58M0-58V58M-41-41 41 41M-41 41 41-41"/>
      <path d="M-22-54 22 54M-54-22 54 22M-54 22 54-22M-22 54 22-54"/>
      <path d="M39-39 47-47" stroke="#ffb448" stroke-width="7"/>
    </g>
    <circle r="8" fill="#233c44"/>
  </g>
  <g transform="translate(552 397)">
    <circle r="69" fill="#eff4dc" stroke="#233c44" stroke-width="13"/>
    <circle r="58" fill="none" stroke="#c2d7ce" stroke-width="3"/>
    <g stroke="#547580" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
      <path d="M-58 0H58M0-58V58M-41-41 41 41M-41 41 41-41"/>
      <path d="M-22-54 22 54M-54-22 54 22M-54 22 54-22M-22 54 22-54"/>
      <path d="M39-39 47-47" stroke="#ffb448" stroke-width="7"/>
    </g>
    <circle r="8" fill="#233c44"/>
  </g>

  <!-- The bicycle is optimistically undersized. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 397 330 310 389 397 245 397M330 310 509 310 389 397M509 310 552 397" stroke="#233c44" stroke-width="12"/>
    <path d="M245 397 330 310 389 397 245 397M330 310 509 310 389 397M509 310 552 397" stroke="#ec6254" stroke-width="7"/>
    <path d="M330 310 319 286M509 310 492 269 522 256" stroke="#233c44" stroke-width="8"/>
    <path d="M511 260 532 253" stroke="#304f55" stroke-width="12"/>
    <path d="M296 286h45" stroke="#233c44" stroke-width="12"/>
    <path d="M245 397 389 387Q406 397 389 408L245 402" stroke="#4a6064" stroke-width="3"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" dur="1.7s" repeatCount="indefinite"/>
    <!-- Far leg. -->
    <path d="M353 278 361 323 410 365" fill="none" stroke="#bf793f" stroke-width="11" stroke-linecap="round"/>
    <path d="M402 362q26-10 36 9l-30 4Z" fill="#eda143" stroke="#263e45" stroke-width="3"/>

    <!-- Tail and round, overcommitted rider. -->
    <path d="M294 236 244 220 267 254 238 249 285 282" fill="#fafbf0" stroke="#263e45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M279 239Q271 191 327 177Q369 169 397 209Q416 245 383 277Q346 308 299 280Q276 264 279 239Z" fill="#fffdf1" stroke="#263e45" stroke-width="4"/>
    <path d="M313 207Q283 239 316 269Q351 284 373 251Q340 255 313 207Z" fill="#d9e4db" stroke="#263e45" stroke-width="3"/>
    <path d="M314 228q12 26 35 30M309 242q12 23 27 24" fill="none" stroke="#91aaa6" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck curves into the aerodynamic head. -->
    <path d="M372 246Q407 242 417 213Q424 189 413 166Q402 144 422 131Q446 118 459 140Q470 163 452 184Q450 213 437 246Q421 279 384 273" fill="#fffdf1" stroke="#263e45" stroke-width="4"/>
    <path d="M416 220q7 22-10 36" fill="none" stroke="#c5d8d1" stroke-width="6" stroke-linecap="round"/>

    <!-- Helmet, with a tiny racing plume. -->
    <path d="M407 145Q404 112 433 110Q464 109 470 139Z" fill="#ef6556" stroke="#263e45" stroke-width="4"/>
    <path d="M419 119 424 136M436 116 441 134M451 120 456 134" stroke="#fff1bb" stroke-width="5" stroke-linecap="round"/>
    <path d="M412 144 425 168 449 153" fill="none" stroke="#263e45" stroke-width="3"/>

    <!-- Heroically enormous bill pouch. -->
    <path d="M455 161 625 171Q599 242 530 227Q483 218 455 177Z" fill="url(#pouch)" stroke="#263e45" stroke-width="4"/>
    <path d="M455 155Q518 150 640 171Q631 182 609 181L454 172Z" fill="#ffbd4c" stroke="#263e45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M478 185q46 25 104 10" fill="none" stroke="#fff0b6" stroke-width="4" stroke-linecap="round"/>

    <!-- A passenger who did not agree to the commute. -->
    <path d="M526 209q19-27 49-9l15-11-2 27-15-9q-24 17-47 2Z" fill="#72bcc4" stroke="#29434a" stroke-width="2.5"/>
    <circle cx="539" cy="202" r="5" fill="#fff"/>
    <circle cx="540" cy="201" r="2.3" fill="#253c42"/>
    <path d="m533 194 9 2M552 203l-3 7" fill="none" stroke="#29434a" stroke-width="2"/>

    <!-- Face: intense concentration, absolutely no dignity. -->
    <ellipse cx="447" cy="151" rx="9" ry="11" fill="#fff" stroke="#263e45" stroke-width="2.5"/>
    <circle cx="451" cy="153" r="4" fill="#263e45"/>
    <path d="m436 137 19 5" stroke="#263e45" stroke-width="4" stroke-linecap="round"/>
    <path d="M393 147q-9 6-6 12 7 4 9-3Z" fill="#4ca8c4"/>
    <path d="M380 160q-8 4-6 9 6 4 8-2Z" fill="#4ca8c4"/>

    <!-- Reaching wing and near leg. -->
    <path d="M369 225Q411 274 489 263L515 257" fill="none" stroke="#263e45" stroke-width="17" stroke-linecap="round"/>
    <path d="M369 225Q411 274 489 263L515 257" fill="none" stroke="#f7f6e8" stroke-width="11" stroke-linecap="round"/>
    <path d="M342 281 323 328 379 381" fill="none" stroke="#263e45" stroke-width="14" stroke-linecap="round"/>
    <path d="M342 281 323 328 379 381" fill="none" stroke="#f1a449" stroke-width="8" stroke-linecap="round"/>
    <path d="M368 377q20-8 37 8l-2 9-36-5Z" fill="#ffb54c" stroke="#263e45" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="-7 375 382;8 375 382;-7 375 382" dur=".85s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="389" cy="397" r="17" fill="#f8d77c" stroke="#263e45" stroke-width="4"/>
  <g transform="translate(389 397)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
      <path d="M-18-13 18 13" stroke="#263e45" stroke-width="5"/>
      <path d="M-27-13h18M9 13h18" stroke="#263e45" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="none" stroke="#fff5ce" stroke-width="4" stroke-linecap="round">
    <path d="M120 349h44M100 365h54M135 381h22">
      <animate attributeName="opacity" values=".3;1;.3" dur=".85s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Dedicated caption and timestamp footer. -->
  <path d="M18 503H782V562Q782 582 762 582H38Q18 582 18 562Z" fill="#fff9e9"/>
  <path d="M18 503H782" stroke="#233c44" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#203940">
    <text x="400" y="535" font-size="22" font-weight="700">Zero emissions. Suspiciously fishy fuel.</text>
    <text x="400" y="566" font-size="16">2026-10-31 18:30:02 SGT (UTC+08:00)</text>
  </g>
</svg>