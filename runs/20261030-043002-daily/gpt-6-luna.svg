<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down 5 by 5 city grid with a shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">City block route map</text>

  <!-- Streets -->
  <g stroke="#b7c1cc" stroke-width="3" stroke-linecap="round">
    <path d="M100 70H500 M100 130H500 M100 190H500 M100 250H500 M100 310H500"/>
    <path d="M100 70V310 M200 70V310 M300 70V310 M400 70V310 M500 70V310"/>
  </g>

  <!-- Shortest route: 8 street segments -->
  <path d="M100 70H200 M200 70H300 M300 70H400 M400 70H500 M500 70V130 M500 130V190 M500 190V250 M500 250V310"
        fill="none" stroke="#1674e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#687586" stroke-width="2">
    <circle cx="100" cy="70" r="7"/><circle cx="200" cy="70" r="7"/><circle cx="300" cy="70" r="7"/><circle cx="400" cy="70" r="7"/><circle cx="500" cy="70" r="7"/>
    <circle cx="100" cy="130" r="7"/><circle cx="200" cy="130" r="7"/><circle cx="300" cy="130" r="7"/><circle cx="400" cy="130" r="7"/><circle cx="500" cy="130" r="7"/>
    <circle cx="100" cy="190" r="7"/><circle cx="200" cy="190" r="7"/><circle cx="300" cy="190" r="7"/><circle cx="400" cy="190" r="7"/><circle cx="500" cy="190" r="7"/>
    <circle cx="100" cy="250" r="7"/><circle cx="200" cy="250" r="7"/><circle cx="300" cy="250" r="7"/><circle cx="400" cy="250" r="7"/><circle cx="500" cy="250" r="7"/>
    <circle cx="100" cy="310" r="7"/><circle cx="200" cy="310" r="7"/><circle cx="300" cy="310" r="7"/><circle cx="400" cy="310" r="7"/><circle cx="500" cy="310" r="7"/>
  </g>

  <!-- Route markers -->
  <circle cx="100" cy="70" r="12" fill="#20a464" stroke="#fff" stroke-width="3"/>
  <text x="100" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#176b43">START A1</text>
  <circle cx="500" cy="310" r="12" fill="#e58a20" stroke="#fff" stroke-width="3"/>
  <text x="500" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#8a4d08">END E5</text>

  <!-- Blocked intersections -->
  <g stroke="#d32626" stroke-width="5" stroke-linecap="round">
    <path d="M192 122L208 138 M208 122L192 138"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M392 242L408 258 M408 242L392 258"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#394451" text-anchor="middle">
    <text x="100" y="91">A1</text><text x="200" y="91">B1</text><text x="300" y="91">C1</text><text x="400" y="91">D1</text><text x="500" y="91">E1</text>
    <text x="100" y="151">A2</text><text x="200" y="151">B2</text><text x="300" y="151">C2</text><text x="400" y="151">D2</text><text x="500" y="151">E2</text>
    <text x="100" y="211">A3</text><text x="200" y="211">B3</text><text x="300" y="211">C3</text><text x="400" y="211">D3</text><text x="500" y="211">E3</text>
    <text x="100" y="271">A4</text><text x="200" y="271">B4</text><text x="300" y="271">C4</text><text x="400" y="271">D4</text><text x="500" y="271">E4</text>
    <text x="100" y="331">A5</text><text x="200" y="331">B5</text><text x="300" y="331">C5</text><text x="400" y="331">D5</text><text x="500" y="331">E5</text>
  </g>

  <!-- Legend and footer -->
  <g font-family="Arial, sans-serif" fill="#26313d">
    <text x="300" y="359" text-anchor="middle" font-size="14" font-weight="bold">Shortest route: 8 street segments</text>
    <text x="300" y="386" text-anchor="middle" font-size="12">2026-10-30 04:34:00 SGT (UTC+08:00)</text>
  </g>
</svg>