<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a tiny bicycle with a fish hanging from its enormous bill. Wheels spin, feet pedal, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#e9dfbe" opacity=".45"/>
      <circle cx="17" cy="19" r=".7" fill="#e9dfbe" opacity=".45"/>
    </pattern>
    <style>
      .ink{stroke:#243443;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .small{font-family:Arial,Helvetica,sans-serif;fill:#243443}
      .bob{animation:bob .8s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .wing{animation:wing .8s ease-in-out infinite;transform-origin:381px 288px}
      @keyframes wing{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
    </style>
  </defs>

  <path fill="#fff8e5" d="M0 0h800v600H0z"/>
  <path fill="url(#paper)" d="M0 0h800v600H0z"/>
  <text x="400" y="60" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="47" font-weight="900" letter-spacing="3" fill="#243443">TOUR DE BEAK</text>
  <path d="M223 77h354" stroke="#f17649" stroke-width="7" stroke-linecap="round"/>
  <text x="400" y="103" text-anchor="middle" class="small" font-size="16" font-weight="700" letter-spacing="3">THE MOST INFLATED EGO ON TWO WHEELS</text>

  <!-- One seaside road, with plenty of room for the captions below. -->
  <path d="M45 357q110-23 219 0t219 0 272 0v80H45z" fill="#c9e4df"/>
  <path d="M45 376q100-17 191 0m373-4q72-15 146 0" fill="none" stroke="#9ac8c4" stroke-width="3"/>
  <path d="M39 452h722" stroke="#243443" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="402" cy="459" rx="237" ry="12" fill="#243443" opacity=".1"/>
  <path d="M74 435h54m-35-17h43m491 19h71" stroke="#e0c991" stroke-width="5" stroke-linecap="round"/>

  <!-- A roadside commentary on the rider's priorities. -->
  <path d="M686 254v197" class="ink" fill="none"/>
  <rect x="625" y="208" width="121" height="65" rx="8" fill="#fff8e5" class="ink"/>
  <text x="685" y="234" text-anchor="middle" class="small" font-size="17" font-weight="900">BIKE LANE</text>
  <text x="685" y="256" text-anchor="middle" class="small" font-size="14">NO FLYING</text>

  <!-- Wheels: stationary tires, endlessly rotating spokes and reflectors. -->
  <g fill="#fffdf3" class="ink">
    <circle cx="252" cy="373" r="77"/>
    <circle cx="548" cy="373" r="77"/>
  </g>
  <g fill="none" stroke="#84969b" stroke-width="3">
    <circle cx="252" cy="373" r="65"/>
    <circle cx="548" cy="373" r="65"/>
  </g>
  <g transform="translate(252 373)">
    <g stroke="#74868b" stroke-width="3">
      <path d="M-65 0H65M0-65V65M-46-46l92 92m-92 0 92-92"/>
      <rect x="37" y="-6" width="17" height="12" rx="3" fill="#ffbd4b" stroke="#243443" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(548 373)">
    <g stroke="#74868b" stroke-width="3">
      <path d="M-65 0H65M0-65V65M-46-46l92 92m-92 0 92-92"/>
      <rect x="37" y="-6" width="17" height="12" rx="3" fill="#ffbd4b" stroke="#243443" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Comically undersized racing bicycle. -->
  <g class="ink" fill="none">
    <path d="M252 373l79-113 63 113H252l225-98-83 98" stroke="#df6049" stroke-width="9"/>
    <path d="M477 275l71 98m-78-116 7 18m-146-15-12-24" stroke="#df6049" stroke-width="9"/>
    <path d="M296 236h54" stroke-width="12"/>
    <path d="M470 258l-7-29h38q22 0 20 18-1 12-13 12" stroke-width="7"/>
  </g>
  <circle cx="394" cy="373" r="17" fill="#f7c94e" class="ink"/>
  <circle cx="252" cy="373" r="7" fill="#243443"/>
  <circle cx="548" cy="373" r="7" fill="#243443"/>

  <!-- Orange webbed feet follow the rotating pedals. -->
  <path d="M355 304l-18 28 40 29" fill="none" stroke="#df853b" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M355 304l-18 28 40 29;M355 304l33 17 23 64;M355 304l-18 28 40 29" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(394 373)">
    <g class="ink">
      <path d="M-23 0h46" fill="none"/>
      <path d="M-34-5h22m24 10h22" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <path d="M388 307l40 33-12 41" fill="none" stroke="#f2a64d" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M388 307l40 33-12 41;M388 307l-26 28 13 26;M388 307l40 33-12 41" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M405 377l21 2 8 12-33-1z" fill="#f2a64d" stroke="#243443" stroke-width="3">
    <animateTransform attributeName="transform" type="translate" values="0 0;-35 -23;0 0" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <g class="bob">
    <!-- Tail, body and upright neck. -->
    <path d="M317 258l-48-25 18 48-32-4 55 43" fill="#fffdf5" class="ink"/>
    <path d="M305 256q23-33 67-24 29 6 41-18l10-41q6-29 31-24 31 6 20 38l-10 54q-1 32-33 52-19 34-65 28-60-4-61-65z" fill="#fffdf5" class="ink"/>
    <path d="M322 291q38 32 82 3" fill="none" stroke="#dedfd2" stroke-width="8" stroke-linecap="round"/>
    <g class="wing">
      <path d="M342 254q34-17 65 7l50-18 13 13-56 29q-43 1-65-12" fill="#f2f1df" class="ink"/>
      <path d="M365 265l38 7m-47 1 24 8" fill="none" stroke="#a9b1ac" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Head and vast bill, with a pouch full of lunch. -->
    <path d="M431 168q-10-26 12-38 27-14 45 9l7 25" fill="#fffdf5" class="ink"/>
    <path d="M482 164l134 16q-20 59-82 47-43-9-52-63z" fill="#f3be65" class="ink"/>
    <path d="M483 157l145 21-14 12-132-12z" fill="#f49b45" class="ink"/>
    <path d="M507 192q35 22 72 8" fill="none" stroke="#d68c42" stroke-width="3"/>
    <path d="M558 202q12-10 26-1l13-8-2 17-12-3q-15 8-25-5z" fill="#78b8c3" stroke="#243443" stroke-width="2.5"/>
    <circle cx="578" cy="201" r="2" fill="#243443"/>
    <circle cx="465" cy="150" r="5" fill="#243443"/>
    <path d="M454 139l16-3" fill="none" stroke="#243443" stroke-width="4" stroke-linecap="round"/>
    <!-- Helmet with an aerodynamic fish-shaped ornament. -->
    <path d="M428 135q0-31 31-32 29 1 35 30z" fill="#df6049" class="ink"/>
    <path d="M449 110l-3 18m19-19 4 18" stroke="#fff0ca" stroke-width="5" stroke-linecap="round"/>
    <path d="M457 103l-12-13 24 6 16-6-7 13" fill="#f7c94e" stroke="#243443" stroke-width="3"/>
  </g>

  <!-- The rider's confident, thoroughly questionable logic. -->
  <path d="M89 137h202q15 0 15 15v53q0 15-15 15h-26l26 28-53-28H89q-15 0-15-15v-53q0-15 15-15z" fill="#fffdf6" stroke="#243443" stroke-width="3"/>
  <text x="190" y="168" text-anchor="middle" class="small" font-size="20" font-weight="700">“Flying? In this</text>
  <text x="190" y="196" text-anchor="middle" class="small" font-size="20" font-weight="700">economy?”</text>

  <text x="400" y="510" text-anchor="middle" class="small" font-size="23" font-weight="700">Zero emissions. Excessive fish consumption.</text>
  <path d="M80 541h640" stroke="#d2c5a6" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" class="small" font-size="18">2026-10-30 17:31:46 SGT (UTC+08:00)</text>
</svg>