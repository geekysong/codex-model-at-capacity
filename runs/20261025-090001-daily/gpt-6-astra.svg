<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172635">
    <text x="25" y="24" font-size="17" font-weight="bold">Projectile motion</text>
    <text x="25" y="49">Initial velocity: (20, 15) m/s</text>
    <text x="25" y="71">Gravity: 10 m/s²; no air resistance</text>
    <text x="25" y="93">Total flight time: 3 s</text>
    <text x="25" y="115">Scale: 10 px/m in both panels</text>
    <text x="25" y="137">A → A: trajectory continues in inset</text>
    <text x="310" y="24" font-weight="bold">Landing continuation inset</text>
    <text x="310" y="44">Translated view; same scale</text>
  </g>

  <!-- Main coordinates: x = 100 + 200t, y = 350 - 150t + 50t².
       The final second is translated into the inset to retain 10 px/m. -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#566573" stroke-width="2"/>
  <path d="M100 350 Q300 200 500 250" fill="none" stroke="#1769aa" stroke-width="3"/>
  <circle cx="100" cy="350" r="4" fill="#172635"/>
  <circle cx="400" cy="237.5" r="4" fill="#172635"/>

  <!-- Original landing (700,350), translated by (-180,-190). -->
  <line x1="310" y1="160" x2="550" y2="160" stroke="#566573" stroke-width="2"/>
  <path d="M320 60 Q420 85 520 160" fill="none" stroke="#1769aa" stroke-width="3"/>
  <circle cx="520" cy="160" r="4" fill="#172635"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#172635">
    <text x="510" y="248" font-weight="bold">A</text>
    <text x="299" y="66" font-weight="bold">A</text>
    <text x="310" y="217">apex: 30 m, 11.25 m</text>
    <text x="367" y="184">landing: 60 m, 0 m</text>
    <text x="65" y="371">launch: 0 m, 0 m</text>
  </g>

  <line x1="20" y1="380" x2="580" y2="380" stroke="#d5dce2"/>
  <text x="300" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172635">2026-10-25 09:03:04 SGT (UTC+08:00)</text>
</svg>