<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish dangling from its enormous bill. The wheels spin and the pelican bobs in a looping cartoon animation.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#dbcda8" opacity=".25"/>
    </pattern>
    <g id="wheel">
      <circle r="72" fill="#fff9e8" stroke="#243643" stroke-width="10"/>
      <circle r="61" fill="none" stroke="#94acac" stroke-width="3"/>
      <g stroke="#69818a" stroke-width="3">
        <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44"/>
      </g>
      <circle r="9" fill="#f4bc45" stroke="#243643" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff3d5"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 405Q100 355 200 403T400 395T600 400T800 385V510H0Z" fill="#d5e5cd"/>
  <circle cx="697" cy="137" r="40" fill="#f9c953"/>
  <path d="M62 168q25-27 50 0q25-27 50 0M586 196q17-18 34 0q17-18 34 0" fill="none" stroke="#9bb2ae" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" fill="#243643">TOUR DE FISH</text>
  <text x="400" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#b64c36">ONE BIRD. TWO WHEELS. ZERO HUMILITY.</text>

  <ellipse cx="402" cy="477" rx="259" ry="15" fill="#243643" opacity=".12"/>
  <path d="M67 481H730" stroke="#637f77" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#809b87" stroke-width="3" stroke-linecap="round">
    <path d="M93 448h48M68 462h49M656 451h49"/>
  </g>

  <!-- Bicycle -->
  <g transform="translate(239 399)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(565 399)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M239 399L323 291L392 399H239L491 291L392 399M323 291H491M491 291L565 399" stroke="#243643" stroke-width="13"/>
    <path d="M239 399L323 291L392 399H239L491 291L392 399M323 291H491M491 291L565 399" stroke="#e05c45" stroke-width="7"/>
    <path d="M323 291L311 266M491 291L477 251L509 239" stroke="#243643" stroke-width="9"/>
    <path d="M290 266h48M501 239h24" stroke="#243643" stroke-width="12"/>
    <path d="M254 404Q282 301 331 334" stroke="#f4bc45" stroke-width="6"/>
  </g>
  <circle cx="392" cy="399" r="21" fill="#f4bc45" stroke="#243643" stroke-width="5"/>
  <g transform="translate(392 399)">
    <g stroke="#243643" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-25 0H25"/>
      <path d="M-32-5v10M32-5v10" stroke-width="9"/>
    </g>
  </g>

  <!-- Pelican and its remarkably oversized lunch compartment -->
  <g stroke="#243643" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M323 266Q344 298 365 321L389 375" fill="none" stroke="#e8a43b" stroke-width="12">
      <animate attributeName="d" values="M323 266Q344 298 365 321L389 375;M323 266Q352 288 380 320L408 380;M323 266Q344 298 365 321L389 375" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M375 379l28 1" stroke="#e8a43b" stroke-width="12"/>
    <path d="M272 259L231 235L243 279L283 286" fill="#e7ece2"/>
    <path d="M273 211Q297 183 347 197Q382 208 389 248Q375 285 320 282Q267 285 263 252Z" fill="#fffdf3"/>
    <path d="M283 231Q305 217 350 239Q327 272 284 249" fill="#c9d5d2"/>
    <path d="M353 222Q382 203 377 176Q368 148 395 135Q425 127 442 152Q457 176 436 194L411 221Q403 244 384 255" fill="#fffdf3"/>
    <path d="M431 171L614 186Q590 202 438 198Z" fill="#f4bc45"/>
    <path d="M439 197Q471 280 536 247Q570 228 605 191Z" fill="#f1a96f"/>
    <path d="M451 206Q483 250 523 237" fill="none" stroke="#dc8459" stroke-width="3"/>
    <circle cx="420" cy="161" r="5" fill="#243643" stroke="none"/>
    <path d="M409 148l17 3" stroke-width="5"/>
    <path d="M380 140Q394 116 419 128L437 145Z" fill="#e05c45"/>
    <path d="M385 137l43 5" stroke="#fff3d5" stroke-width="4"/>
    <path d="M378 211Q424 220 483 246" fill="none" stroke="#fffdf3" stroke-width="20"/>
    <path d="M378 211Q424 220 483 246" fill="none" stroke-width="3"/>
    <path d="M478 243l24 2" stroke="#f4bc45" stroke-width="9"/>
    <path d="M378 202l-28 9l18 12l-35 16" fill="#e05c45" stroke-width="3"/>
    <!-- Fish passenger -->
    <path d="M567 206Q551 229 566 246Q587 231 579 211L590 202L574 202Z" fill="#6faeae" stroke-width="3"/>
    <circle cx="568" cy="235" r="2.5" fill="#243643" stroke="none"/>
    <path d="M566 246l-5 7" fill="none" stroke-width="2"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#243643">
    <path d="M99 165Q99 145 121 145H272Q292 145 292 165V198Q292 218 272 218H216L226 239L185 218H121Q99 218 99 198Z" fill="#fffdf3" stroke="#243643" stroke-width="3"/>
    <text x="195" y="174" text-anchor="middle" font-size="19" font-weight="bold">
      <tspan x="195">“I carb-load</tspan>
      <tspan x="195" dy="25">with carp.”</tspan>
    </text>
    <text x="400" y="520" text-anchor="middle" font-size="22" font-weight="bold">His carbon footprint is tiny. His lunch bill is enormous.</text>
  </g>

  <rect x="0" y="544" width="800" height="56" fill="#243643"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff3d5">2026-10-26 02:01:19 SGT (UTC+08:00)</text>
</svg>