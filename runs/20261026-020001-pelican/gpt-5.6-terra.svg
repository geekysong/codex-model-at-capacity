  </g>

  <text x="400" y="64" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34" fill="#24364b">PELICAN PEDALS TO PRESTIGE</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#42556a">“Why fly when everyone can see your expensive bicycle?”</text>

