<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Prestige</title>
  <desc id="desc">A satirical cartoon of a pelican proudly riding a bicycle, with animated wheels and bobbing motion.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: 50% 90%; animation: bob .65s ease-in-out infinite alternate; }
    .leg-a { transform-box: fill-box; transform-origin: 50% 5%; animation: pedalA 1s linear infinite; }
    .leg-b { transform-box: fill-box; transform-origin: 50% 5%; animation: pedalB 1s linear infinite; }
    .dust { animation: puff 1s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(28deg); } }
    @keyframes pedalB { 50% { transform: rotate(-28deg); } }
    @keyframes puff { 0% { opacity:0; transform:translateX(0) scale(.4); } 35% { opacity:.75; } 100% { opacity:0; transform:translateX(-35px) scale(1.5); } }
  </style>

  <rect width="800" height="600" fill="#dff4ff"/>
