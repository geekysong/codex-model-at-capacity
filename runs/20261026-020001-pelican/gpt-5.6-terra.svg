  <path d="M0 393 Q200 360 400 392 T800 375 V500 H0Z" fill="#75bf68"/>
  <path d="M0 476 Q180 430 380 469 T800 448 V520 H0Z" fill="#f4d85c"/>
  <path d="M0 492 Q190 461 390 488 T800 470 V520 H0Z" fill="#6e5a4d"/>

