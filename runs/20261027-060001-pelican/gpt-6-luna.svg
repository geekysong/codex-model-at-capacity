<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly carrying an absurdly large fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee8ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#30343b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#20252b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#20252b}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff5b5" opacity=".9"/>
  <path d="M0 330 Q130 270 260 330 T520 325 T800 315 V430 H0Z" fill="#8fd17c"/>
  <path d="M0 390 Q160 345 320 390 T640 380 T800 390 V470 H0Z" fill="#62ad68"/>
  <path d="M0 445 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 H800" stroke="#f7d66a" stroke-width="8" stroke-dasharray="50 32" opacity=".9"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#133b5c">THE PELICAN PEDAL EXPRESS</text>
  <text x="400" y="98" text-anchor="middle" class="label" font-size="20" font-weight="700">“Why fly when you can overtake traffic dramatically?”</text>

  <g filter="url(#shadow)">
    <g id="bike" transform="translate(0 0)">
      <g class="wheel" transform="translate(270 450)">
        <circle r="67" fill="#20252b"/>
        <circle r="55" fill="#d9edf2" stroke="#20252b" stroke-width="5"/>
        <g stroke="#65717a" stroke-width="3">
          <path d="M0-53V53M-53 0H53M-37-37L37 37M37-37L-37 37"/>
        </g>
        <circle r="9" fill="#ef6c5b"/>
        <animateTransform attributeName="transform" type="rotate" from="0 270 450" to="360 270 450" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <g class="wheel" transform="translate(545 450)">
        <circle r="67" fill="#20252b"/>
        <circle r="55" fill="#d9edf2" stroke="#20252b" stroke-width="5"/>
        <g stroke="#65717a" stroke-width="3">
          <path d="M0-53V53M-53 0H53M-37-37L37 37M37-37L-37 37"/>
        </g>
        <circle r="9" fill="#ef6c5b"/>
        <animateTransform attributeName="transform" type="rotate" from="0 545 450" to="360 545 450" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <path d="M270 450 L360 350 L460 450 L545 450 L430 350 L360 350 L460 450" fill="none" stroke="#ef6c5b" stroke-width="12"/>
      <path d="M430 350 L450 300 M438 300 H490" fill="none" stroke="#20252b" stroke-width="9"/>
      <path d="M360 350 L335 305 H375" fill="none" stroke="#20252b" stroke-width="9"/>
      <circle cx="460" cy="450" r="18" fill="#20252b"/>
      <path d="M460 450 L425 410 M460 450 L492 485" stroke="#20252b" stroke-width="8"/>
      <circle cx="425" cy="410" r="7" fill="#ef6c5b"/>
      <circle cx="492" cy="485" r="7" fill="#ef6c5b"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.6s" repeatCount="indefinite"/>
      <ellipse cx="410" cy="285" rx="82" ry="105" fill="#f7f3e8" class="ink"/>
      <path d="M355 300 Q315 345 350 375 Q390 390 420 350" fill="#d8e0e2" class="ink"/>
      <path d="M350 205 Q300 145 335 125 Q390 120 430 180" fill="#f7f3e8" class="ink"/>
      <ellipse cx="409" cy="169" rx="59" ry="64" fill="#f7f3e8" class="ink"/>
      <path d="M444 177 Q560 165 620 205 Q570 245 442 215 Q425 200 444 177Z" fill="#f2a84b" class="ink"/>
      <path d="M455 207 Q530 218 590 213" fill="none" stroke="#b86d2f" stroke-width="5"/>
      <circle cx="430" cy="155" r="10" fill="#20252b"/>
      <circle cx="434" cy="151" r="3" fill="#fff"/>
      <path d="M370 230 Q410 248 450 225" fill="none" stroke="#20252b" stroke-width="6"/>
      <path d="M366 352 L385 420 M443 350 L468 420" stroke="#ef8d3c" stroke-width="12"/>
      <path d="M385 420 h-30 M468 420 h30" stroke="#20252b" stroke-width="7"/>
      <path d="M378 305 Q420 330 455 300" fill="none" stroke="#20252b" stroke-width="7"/>
      <g transform="translate(500 238) rotate(8)">
        <ellipse cx="0" cy="0" rx="58" ry="35" fill="#68b36b" class="ink"/>
        <path d="M-55 0 Q0-40 55 0 Q0 40-55 0Z" fill="#f2d36b" opacity=".85"/>
        <path d="M-25-22 Q0-50 25-22" fill="none" stroke="#20252b" stroke-width="5"/>
      </g>
      <text x="392" y="285" class="label" font-size="18" font-weight="900" transform="rotate(-8 392 285)">HONK!</text>
    </g>
  </g>

  <path d="M95 385 Q130 360 165 385" fill="none" stroke="#20252b" stroke-width="7"/>
  <path d="M115 410 Q150 390 180 410" fill="none" stroke="#20252b" stroke-width="7"/>
  <text x="400" y="565" text-anchor="middle" class="label" font-size="17" font-weight="700">2026-10-27 06:01:09 SGT (UTC+08:00)</text>
</svg>