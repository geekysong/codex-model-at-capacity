<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Power Ride</title>
  <desc>A satirical cartoon of a pelican riding a bicycle, animated with spinning wheels and pedaling motion.</desc>
  <style>
    .ink{stroke:#243447;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
    .label{font-family:Arial,sans-serif;fill:#243447}
    .wheel{fill:none;stroke:#243447;stroke-width:10}
    .spoke{stroke:#6b7c8c;stroke-width:3}
  </style>

  <rect width="800" height="600" fill="#bde9f7"/>
  <circle cx="690" cy="105" r="55" fill="#ffd76a" opacity=".9"/>
  <path d="M0 420 Q120 380 240 420 T480 420 T800 415 V600 H0Z" fill="#8fd08a"/>
  <path d="M0 470 Q160 440 330 470 T800 465 V600 H0Z" fill="#68b76b"/>
  <path d="M0 515 Q190 492 390 520 T800 512" fill="none" stroke="#4b9958" stroke-width="5"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN POWER RIDE!</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="17" font-weight="700">“Why walk when you can pedal dramatically?”</text>

  <!-- bicycle -->
  <g id="bicycle">
    <g class="wheel">
      <circle cx="240" cy="430" r=" seventy" />
    </g>
  </g>
  <g class="wheel">
    <circle cx="240" cy="430" r="70"/>
    <circle cx="565" cy="430" r="70"/>
  </g>
  <g id="spokes">
    <g>
      <path d="M240 360V500 M170 430H310 M190 380L290 480 M290 380L190 480" class="spoke"/>
      <path d="M565 360V500 M495 430H635 M515 380L615 480 M615 380L515 480" class="spoke"/>
      <animateTransform attributeName="transform" type="rotate" from="0 240 430" to="360 240 430" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(325 0)">
      <path d="M240 360V500 M170 430H310 M190 380L290 480 M290 380L190 480" class="spoke"/>
      <animateTransform attributeName="transform" type="rotate" from="0 240 430" to="360 240 430" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>
  <path d="M240 430 L350 315 L565 430 L430 430 L350 315 L285 430" fill="none" class="ink" stroke="#e85d4a" stroke-width="9"/>
  <path d="M350 315 L330 270 M330 270 H385" fill="none" class="ink"/>
  <path d="M565 430 L585 285 H535" fill="none" class="ink"/>
  <circle cx="430" cy="430" r="18" fill="#f5b942" class="ink"/>
  <path d="M430 430 L390 465 M430 430 L470 395" fill="none" class="ink"/>
  <ellipse cx="380" cy="468" rx="30" ry="9" fill="#243447"/>
  <ellipse cx="486" cy="392" rx="30" ry="9" fill="#243447"/>

  <!-- pelican -->
  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="390" cy="265" rx="85" ry="105" fill="#f8f5ed" class="ink"/>
    <path d="M340 300 Q385 350 440 300 L455 360 Q392 390 325 350Z" fill="#d9e1e5" class="ink"/>
    <path d="M340 205 Q290 235 315 285 Q350 320 390 270 Q410 230 385 205Z" fill="#fffdf7" class="ink"/>
    <path d="M318 252 Q250 270 175 248 Q155 242 170 222 Q250 205 337 218Z" fill="#f4a63b" class="ink"/>
    <path d="M175 248 Q235 272 300 246 Q260 290 190 270Z" fill="#f08b32" class="ink"/>
    <circle cx="350" cy="225" r="10" fill="#243447"/>
    <circle cx="353" cy="222" r="3" fill="#fff"/>
    <path d="M360 345 Q315 370 305 415" fill="none" class="ink"/>
    <path d="M425 345 Q475 365 490 405" fill="none" class="ink"/>
    <path d="M305 414 l-22 18 M305 414 l25 10 M490 405 l-18 22 M490 405 l27 3" fill="none" class="ink"/>
    <path d="M335 185 Q370 145 420 175" fill="none" stroke="#e85d4a" stroke-width="12"/>
    <path d="M373 164 l18 -22 l18 27" fill="#e85d4a" class="ink"/>
    <path d="M442 245 Q485 260 500 290" fill="none" class="ink"/>
    <path d="M500 290 l18 -12 M500 290 l20 8" fill="none" class="ink"/>
  </g>

  <text x="610" y="190" class="label" font-size="18" font-weight="700" transform="rotate(8 610 190)">NO LICENSE.</text>
  <text x="610" y="215" class="label" font-size="18" font-weight="700" transform="rotate(8 610 215)">ALL BEAK.</text>
  <path d="M595 225 q-30 20 -55 35" fill="none" stroke="#243447" stroke-width="3" stroke-dasharray="6 6"/>

  <rect x="40" y="545" width="720" height="38" rx="12" fill="#fff7d6" stroke="#243447" stroke-width="3"/>
  <text x="400" y="570" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-27 06:00:01 SGT (UTC+08:00)</text>
</svg>