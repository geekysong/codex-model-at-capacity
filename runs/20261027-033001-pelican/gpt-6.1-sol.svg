<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Patrol</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>
  <style>
    .ink{stroke:#20252b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .txt{font-family:Arial,Helvetica,sans-serif;fill:#20252b}
    .small{font-size:17px}
  </style>

  <rect width="800" height="600" fill="#bde8f5"/>
  <rect y="420" width="800" height="180" fill="#83c96b"/>
  <path d="M0 455 Q120 425 240 455 T480 455 T800 455" fill="none" stroke="#4d9b50" stroke-width="8"/>
  <path d="M0 505 Q150 480 300 510 T600 505 T800 510" fill="none" stroke="#5ba758" stroke-width="5"/>

  <text x="400" y="58" text-anchor="middle" class="txt" font-size="39" font-weight="900">PELICAN PEDAL PATROL</text>
  <text x="400" y="91" text-anchor="middle" class="txt" font-size="20" font-weight="700">“Why fly when you can commute dramatically?”</text>

  <g transform="translate(0,0)">
    <g transform="translate(0,0)">
      <circle cx="255" cy="430" r="78" fill="#f7f7f2" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 255 430" to="360 255 430" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="555" cy="430" r="78" fill="#f7f7f2" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 555 430" to="360 555 430" dur="2s" repeatCount="indefinite"/>
      </circle>
      <g fill="none" class="ink">
        <path d="M255 430 L355 300 L455 430 L255 430"/>
        <path d="M355 300 L555 430"/>
        <path d="M355 300 L420 300 L455 430"/>
        <path d="M420 300 L445 270"/>
        <path d="M430 270 L468 270"/>
        <path d="M355 300 L330 270"/>
        <path d="M315 270 L350 270"/>
        <path d="M455 430 L480 410"/>
      </g>
      <circle cx="355" cy="300" r="13" fill="#f04e4e" class="ink"/>
      <g class="ink" fill="none">
        <path d="M355 300 L325 350 L285 365"/>
        <path d="M355 300 L390 350 L425 365"/>
      </g>
      <circle cx="325" cy="350" r="10" fill="#f04e4e" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 355 300" to="360 355 300" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="390" cy="350" r="10" fill="#f04e4e" class="ink">
        <animateTransform attributeName="transform" type="rotate" from="0 355 300" to="360 355 300" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1s" repeatCount="indefinite"/>
      <ellipse cx="400" cy="245" rx="92" ry="108" fill="#fffdf5" class="ink"/>
      <path d="M337 210 Q300 150 335 118 Q370 95 407 128 L455 188 Q470 220 443 245 Q407 267 337 210Z" fill="#f7a62a" class="ink"/>
      <ellipse cx="405" cy="145" rx="62" ry="68" fill="#fffdf5" class="ink"/>
      <path d="M446 151 Q535 137 612 170 Q626 180 612 192 Q535 212 447 187Z" fill="#f28b24" class="ink"/>
      <path d="M454 170 Q535 168 604 180" fill="none" stroke="#c8641b" stroke-width="5"/>
      <circle cx="429" cy="133" r="9" fill="#20252b"/>
      <path d="M458 116 Q482 91 503 106" fill="none" class="ink"/>
      <path d="M382 255 Q400 278 418 255" fill="none" class="ink"/>
      <path d="M362 318 Q390 338 420 318" fill="none" stroke="#f28b24" stroke-width="13"/>
      <path d="M350 319 L324 371" class="ink" fill="none"/>
      <path d="M430 319 L455 371" class="ink" fill="none"/>
      <path d="M316 372 Q327 382 340 374" fill="none" stroke="#f28b24" stroke-width="12"/>
      <path d="M447 373 Q460 383 474 374" fill="none" stroke="#f28b24" stroke-width="12"/>
      <path d="M333 183 Q373 155 411 181" fill="none" stroke="#d97a1e" stroke-width="8"/>
      <text x="400" y="226" text-anchor="middle" class="txt" font-size="18" font-weight="900">HONK!</text>
    </g>
  </g>

  <g transform="translate(610 315)">
    <path d="M0 35 Q30 8 58 35" fill="none" stroke="#20252b" stroke-width="5"/>
    <path d="M29 9 L29 62 M8 35 L52 35" stroke="#20252b" stroke-width="5"/>
    <text x="30" y="-8" text-anchor="middle" class="txt" font-size="18" font-weight="800">NO FLY ZONE</text>
  </g>

  <rect x="24" y="548" width="752" height="34" rx="8" fill="#fffdf5" stroke="#20252b" stroke-width="3"/>
  <text x="400" y="571" text-anchor="middle" class="txt small" font-weight="700">2026-10-27 03:30:18 SGT (UTC+08:00)</text>
