<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly pretending it is a professional racer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9edff"/>
      <stop offset="1" stop-color="#f8fcff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#434b5c"/>
      <stop offset="1" stop-color="#252b38"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe7ee"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#18202b" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#18202b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#18202b}
      .bold{font-weight:800}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="92" r="46" fill="#fff5b2" opacity=".9"/>
  <path d="M0 386 Q120 338 240 385 T480 382 T800 372 V480 H0Z" fill="#93c995"/>
  <path d="M0 430 Q155 400 300 430 T600 426 T800 418 V510 H0Z" fill="#72b67f"/>
  <path d="M0 476 H800 V548 H0Z" fill="url(#road)"/>
  <path d="M34 512 H142 M205 512 H313 M376 512 H484 M547 512 H655 M718 512 H785" stroke="#f7d66b" stroke-width="8" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="52" y="34" width="696" height="82" rx="22" fill="#fffdf7" stroke="#18202b" stroke-width="6"/>
    <text x="400" y="73" text-anchor="middle" class="label bold" font-size="34">PELICAN PEDAL PANIC</text>
    <text x="400" y="99" text-anchor="middle" class="label" font-size="17">“Tour de Beak” — one bird, two wheels, zero balance</text>
  </g>

  <!-- bicycle -->
  <g id="bike" class="ink" fill="none">
    <circle cx="246" cy="454" r="72" stroke-width="9" fill="#1d2531"/>
    <circle cx="246" cy="454" r="62" stroke="#edf4f7" stroke-width="4"/>
    <g id="rearSpokes">
      <path d="M246 392V516 M184 454H308 M202 410L290 498 M290 410L202 498" stroke="#a9c1cb" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0 246 454" to="360 246 454" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle cx="590" cy="454" r="72" stroke-width="9" fill="#1d2531"/>
    <circle cx="590" cy="454" r="62" stroke="#edf4f7" stroke-width="4"/>
    <g id="frontSpokes">
      <path d="M590 392V516 M528 454H652 M546 410L634 498 M634 410L546 498" stroke="#a9c1cb" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0 590 454" to="360 590 454" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <path d="M246 454 L328 362 L470 362 L590 454 L404 454 Z" fill="#ef6b52" stroke-width="7"/>
    <path d="M328 362 L404 454 L470 362" stroke-width="7"/>
    <path d="M470 362 L512 330 L554 330" stroke-width="7"/>
    <path d="M246 454 L296 366" stroke-width="7"/>
    <path d="M288 365 L338 365" stroke-width="7"/>
    <path d="M404 454 L404 416" stroke-width="7"/>
    <circle cx="404" cy="454" r="18" fill="#f7d66b" stroke-width="5"/>
    <g id="crank">
      <path d="M404 454 L438 483 M404 454 L373 425" stroke-width="6"/>
      <path d="M435 486 h28 M370 422 h-27" stroke-width="6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 404 454" to="360 404 454" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pelican and bobbing motion -->
  <g id="pelican" transform="translate(0 0)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.1s" repeatCount="indefinite"/>
    <!-- tail -->
    <path d="M318 294 Q275 270 254 291 Q287 306 320 314" fill="#c9d9df" class="ink"/>
    <!-- body -->
    <ellipse cx="393" cy="286" rx="104" ry="86" fill="url(#feather)" class="ink"/>
    <path d="M337 282 Q380 245 431 267 Q461 280 471 315 Q423 303 380 326 Q350 340 323 321Z" fill="#b7cbd4" class="ink"/>
    <path d="M351 315 Q381 344 430 326" fill="none" class="ink"/>
    <!-- neck -->
    <path d="M421 238 Q434 178 488 171 Q523 167 541 198 Q553 221 530 253 L486 289Z" fill="url(#feather)" class="ink"/>
    <!-- head -->
    <ellipse cx="510" cy="157" rx="63" ry="57" fill="url(#feather)" class="ink"/>
    <path d="M470 176 Q512 194 559 169" fill="none" stroke="#b7cbd4" stroke-width="8"/>
    <!-- crest -->
    <path d="M478 111 Q486 87 502 106 Q514 77 529 111 Q548 93 551 127" fill="#e9f3f6" class="ink"/>
    <!-- eye -->
    <circle cx="526" cy="145" r="10" fill="#18202b"/>
    <circle cx="530" cy="141" r="3.5" fill="#fff"/>
    <!-- beak -->
    <path d="M548 166 Q624 151 677 179 Q628 215 548 193 Q529 188 526 178Z" fill="#f4a64d" class="ink"/>
    <path d="M552 184 Q609 190 656 181" fill="none" stroke="#c56e35" stroke-width="5"/>
    <!-- wing -->
    <path d="M358 252 Q395 217 449 237 Q473 249 454 278 Q412 304 364 298 Q342 289 358 252Z" fill="#f8fcfd" class="ink"/>
    <path d="M379 265 Q409 256 442 263" fill="none" stroke="#9ab2bc" stroke-width="5"/>
    <!-- legs -->
    <path d="M382 339 L374 389 M438 332 L447 390" class="ink" fill="none"/>
    <path d="M355 391 Q375 382 395 394 M430 393 Q449 383 468 395" class="ink" fill="none"/>
    <!-- feet -->
    <path d="M374 389 L371 416 M447 390 L451 416" class="ink" fill="none"/>
    <path d="M351 416 Q373 405 394 418 M430 418 Q452 405 473 418" fill="none" class="ink"/>
    <!-- goggles -->
    <path d="M480 136 Q504 119 528 136 M528 136 Q550 117 572 136" fill="none" stroke="#e85f4f" stroke-width="8"/>
    <path d="M504 137 Q507 153 522 153 Q536 151 536 136" fill="#8fe3ef" opacity=".8" class="ink"/>
    <!-- speech bubble -->
    <path d="M586 83 Q660 42 731 83 Q746 93 734 114 Q704 145 638 130 L610 148 L616 123 Q585 116 586 83Z" fill="#fffdf7" class="ink"/>
    <text x="661" y="96" text-anchor="middle" class="label bold" font-size="17">I meant to do that!</text>
  </g>

  <g transform="translate(0 0)">
    <text x="400" y="548" text-anchor="middle" class="label bold" font-size="20" fill="#ffffff">Caption: When your wings need a break, your beak becomes the engine.</text>
  </g>

  <rect x="0" y="558" width="800" height="42" fill="#18202b"/>
  <text x="400" y="585" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#ffffff">2026-10-27 03:31:39 SGT (UTC+08:00)</text>
</svg>