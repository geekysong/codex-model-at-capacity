<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A determined pelican pedals a bicycle with spinning wheels, a huge bill, and a tiny helmet. A fish in the front basket looks unimpressed.</desc>
  <defs>
    <pattern id="spokes" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12L12 0" stroke="#e4dac4" stroke-width="2"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .outline { stroke:#253442; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { fill:none; stroke:#253442; }
      .spoke { stroke:#7d919a; stroke-width:3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <circle cx="706" cy="148" r="47" fill="#ffd66e"/>
  <text x="400" y="61" text-anchor="middle" font-size="44" font-weight="900" fill="#253442">TOUR DE FISH</text>
  <text x="400" y="91" text-anchor="middle" font-size="17" letter-spacing="3" fill="#637477">ONE BIRD. TWO WHEELS. ZERO AERODYNAMICS.</text>

  <path d="M0 419Q110 380 225 419T450 419T675 419T900 419V498H0Z" fill="#d8e9cb"/>
  <path d="M0 469H800" stroke="#aab995" stroke-width="5"/>
  <ellipse cx="405" cy="477" rx="281" ry="12" fill="#b4c39d" opacity=".45"/>

  <g fill="none" stroke="#9aada9" stroke-width="4" stroke-linecap="round">
    <path d="M99 297h62M120 317h43M83 337h72"/>
  </g>

  <!-- Wheels rotate around their own hubs. -->
  <g class="wheel">
    <circle cx="235" cy="402" r="77" stroke-width="11" fill="#fff9eb"/>
    <circle cx="571" cy="402" r="77" stroke-width="11" fill="#fff9eb"/>
    <g class="spoke">
      <g>
        <path d="M158 402H312M235 325V479M181 348L289 456M181 456L289 348"/>
        <circle cx="235" cy="402" r="64" fill="none" stroke="#b4c0bf" stroke-width="2"/>
        <path d="M235 329v12" stroke="#ec704e" stroke-width="8"/>
        <animateTransform attributeName="transform" type="rotate" from="0 235 402" to="360 235 402" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="M494 402H648M571 325V479M517 348L625 456M517 456L625 348"/>
        <circle cx="571" cy="402" r="64" fill="none" stroke="#b4c0bf" stroke-width="2"/>
        <path d="M571 329v12" stroke="#ec704e" stroke-width="8"/>
        <animateTransform attributeName="transform" type="rotate" from="0 571 402" to="360 571 402" dur="1.4s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Bicycle frame and drive. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 402L326 310L398 402H235L507 310L398 402M326 310H507M507 310L571 402" stroke="#253442" stroke-width="13"/>
    <path d="M235 402L326 310L398 402H235L507 310L398 402M326 310H507M507 310L571 402" stroke="#ee7255" stroke-width="7"/>
    <path d="M326 310L316 288M507 310L495 267L525 258" stroke="#253442" stroke-width="8"/>
    <path d="M292 287H340" stroke="#253442" stroke-width="13"/>
    <path d="M235 402L398 386M235 402L398 418" stroke="#65716c" stroke-width="3"/>
    <circle cx="398" cy="402" r="19" stroke="#253442" stroke-width="5" fill="#e2b956"/>
  </g>

  <!-- Basket and skeptical passenger. -->
  <path d="M540 280H625L615 329H551Z" fill="url(#spokes)" class="outline"/>
  <path d="M539 280H627" stroke="#253442" stroke-width="7" stroke-linecap="round"/>
  <g>
    <path d="M556 270Q580 240 606 263L621 252L619 277L606 270Q579 289 556 270Z" fill="#78bac0" class="outline" stroke-width="3"/>
    <circle cx="569" cy="266" r="3" fill="#253442"/>
    <path d="M564 259L576 261" stroke="#253442" stroke-width="3"/>
  </g>
  <path d="M626 210h98q12 0 12 12v32q0 12-12 12h-69l-17 13 3-13h-15q-12 0-12-12v-32q0-12 12-12Z" fill="white" stroke="#253442" stroke-width="3"/>
  <text x="675" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#253442">I ordered</text>
  <text x="675" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#253442">a sea taxi.</text>

  <!-- Pelican bobs gently while pedaling. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" dur="1.4s" repeatCount="indefinite"/>
    <path d="M337 291L363 341L410 378" fill="none" stroke="#cc913e" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M337 291L363 341L410 378;M337 291L344 359L382 421;M337 291L363 341L410 378" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M306 266Q271 251 276 219Q280 181 327 188Q350 154 381 179Q396 194 389 217L377 274Q359 309 317 294Z" fill="#fffef5" class="outline"/>
    <path d="M285 239L263 256L291 260" fill="#fffef5" class="outline"/>
    <path d="M318 217Q351 211 365 247Q347 269 316 260Q335 246 318 217Z" fill="#dce2da" stroke="#253442" stroke-width="4"/>
    <path d="M370 223Q396 231 419 267L499 267" fill="none" stroke="#253442" stroke-width="14" stroke-linecap="round"/>
    <path d="M370 223Q396 231 419 267L499 267" fill="none" stroke="#f5f1dd" stroke-width="8" stroke-linecap="round"/>
    <path d="M373 205Q394 175 391 144Q393 118 416 120Q443 123 437 151L427 190" fill="#fffef5" class="outline"/>
    <path d="M426 151L591 175Q533 214 432 193Z" fill="#efae48" class="outline"/>
    <path d="M434 161L591 175" fill="none" stroke="#b8732f" stroke-width="3"/>
    <path d="M435 180Q497 193 546 182" fill="none" stroke="#f8ca73" stroke-width="7" stroke-linecap="round"/>
    <circle cx="419" cy="144" r="6" fill="#253442"/>
    <circle cx="421" cy="142" r="2" fill="white"/>
    <path d="M409 132L426 136" stroke="#253442" stroke-width="4" stroke-linecap="round"/>
    <path d="M390 127Q394 105 414 107Q434 108 439 129Z" fill="#e96d54" class="outline"/>
    <path d="M405 110L402 122M418 110L419 123" stroke="#fff6df" stroke-width="4"/>
    <path d="M404 178L380 191L398 203L380 213" fill="#e96d54" stroke="#253442" stroke-width="3" stroke-linejoin="round"/>
    <path d="M331 282L320 345L384 416" fill="none" stroke="#e8ac50" stroke-width="14" stroke-linecap="round">
      <animate attributeName="d" values="M331 282L320 345L384 416;M331 282L366 333L412 378;M331 282L320 345L384 416" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M383 416l-15 5 32 5-5-12Z" fill="#efae48" stroke="#253442" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;28 -38;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M406 376h22" stroke="#253442" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="0 0;-28 43;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Dedicated footer leaves the scene and all text clear. -->
  <rect x="0" y="501" width="800" height="99" fill="#253442"/>
  <text x="400" y="537" text-anchor="middle" font-size="23" font-weight="bold" fill="#fff6df">His bill is enormous. His carbon footprint? Webbed.</text>
  <text x="400" y="577" text-anchor="middle" font-size="18" fill="#d9e8e5">2026-10-25 07:31:04 SGT (UTC+08:00)</text>
</svg>