  <path d="M0 457H800" stroke="#213344" stroke-width="5"/>
  <rect y="460" width="800" height="36" fill="#e0c9a6"/>
  <path d="M25 479H118M167 479H237M588 479H675M719 479H782" stroke="#fff5d9" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="390" cy="452" rx="239" ry="13" fill="#213344" opacity=".13"/>

  <g>
    <path d="M707 275V452" stroke="#6f7a70" stroke-width="9"/>
