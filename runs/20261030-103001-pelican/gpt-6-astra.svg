    <text x="708" y="261" text-anchor="middle" font-size="18" font-weight="900" fill="#b64e3e" transform="rotate(5 708 269)">NO FISHING</text>
    <text x="708" y="284" text-anchor="middle" font-size="12" fill="#213344" transform="rotate(5 708 269)">YES, YOU TOO.</text>
  </g>

  <g transform="translate(245 376)">
