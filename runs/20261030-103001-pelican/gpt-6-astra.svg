<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a huge fish-filled bill, passing a sign that says no fishing. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r=".7" fill="#d9d1b5" opacity=".35"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke:#213344; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#213344; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <g id="wheel">
      <circle r="78" fill="#fffdf0" stroke="#213344" stroke-width="12"/>
      <circle r="68" fill="none" stroke="#b6c8c7" stroke-width="3"/>
      <g stroke="#748e98" stroke-width="3">
        <path d="M-66 0H66M0-66V66M-47-47L47 47M-47 47L47-47"/>
      </g>
      <path d="M47-47L55-55" stroke="#ffbb48" stroke-width="7"/>
      <circle r="9" fill="#213344"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
  <rect width="800" height="600" fill="url(#paper)"/>

  <text x="400" y="61" text-anchor="middle" font-size="49" font-weight="900" fill="#213344" letter-spacing="2">TOUR DE BEAK</text>
  <text x="400" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#ac5037" letter-spacing="3">ONE BIRD. TWO WHEELS. ZERO SHAME.</text>

