    </path>
  </g>

  <g transform="translate(384 376)">
    <g>
      <path d="M-19 0H19" class="thin" fill="none"/>
      <path d="M-28 0H-13M13 0H28" stroke="#213344" stroke-width="7" stroke-linecap="round"/>
      <circle r="5" fill="#213344"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <path d="M150 311H199M135 331H184M159 351H194" fill="none" stroke="#7f9f9c" stroke-width="4" stroke-linecap="round"/>
  <g>
    <path d="M59 112H294Q309 112 309 127V167Q309 182 294 182H285L299 204L258 182H59Q44 182 44 167V127Q44 112 59 112Z" fill="#fffef5" class="thin"/>
    <text x="176" y="141" text-anchor="middle" font-size="19" font-weight="700" fill="#213344">“It’s not overfishing.</text>
    <text x="176" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#213344">It’s carb loading.”</text>
  </g>

  <rect x="0" y="497" width="800" height="103" fill="#fff5d9"/>
  <text x="400" y="530" text-anchor="middle" font-size="23" font-weight="700" fill="#213344">He rides a bicycle. His lunch rides first class.</text>
  <path d="M105 549H695" stroke="#c5b791" stroke-width="2"/>
  <text x="400" y="578" text-anchor="middle" font-size="17" fill="#46535c">2026-10-30 10:30:01 SGT (UTC+08:00)</text>
</svg>