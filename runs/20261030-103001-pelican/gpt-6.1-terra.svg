<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican with a fish-filled pouch pedals a bicycle past a skeptical crab. The wheels spin and the pelican bobs.</desc>
  <defs>
    <pattern id="spokes" width="140" height="140" patternUnits="userSpaceOnUse">
      <rect width="140" height="140" fill="none"/>
    </pattern>
    <g id="wheel">
      <circle r="68" fill="#fff9e8" stroke="#263a45" stroke-width="9"/>
      <circle r="56" fill="none" stroke="#91c5bd" stroke-width="3"/>
      <g stroke="#526d73" stroke-width="3">
        <path d="M-56 0H56M0-56V56M-40-40L40 40M40-40L-40 40"/>
      </g>
      <circle r="8" fill="#f3a94d" stroke="#263a45" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#f9f0d8"/>
  <rect x="18" y="18" width="764" height="564" rx="18" fill="#e7f5ed" stroke="#263a45" stroke-width="4"/>
  <path d="M20 346 Q140 315 245 343 T460 337 T780 331 V477 H20Z" fill="#a7d8cb"/>
  <circle cx="674" cy="134" r="39" fill="#ffd56e"/>
  <g fill="#fffdf2" opacity=".9">
    <path d="M68 152q8-22 30-14 12-24 32-7 19-5 25 16z"/>
    <path d="M530 112q8-18 25-11 11-19 27-5 16-4 21 13z"/>
  </g>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#263a45">THE DAILY COMMUTE</text>
  <text x="400" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#527477">COASTAL TRAFFIC REPORT</text>

  <path d="M25 435 Q175 425 330 436 T775 430" fill="none" stroke="#6ca89c" stroke-width="4"/>
  <path d="M25 476H775" stroke="#263a45" stroke-width="5" stroke-linecap="round"/>
  <path d="M76 457h55m500 0h44" stroke="#fff9e8" stroke-width="5" stroke-linecap="round"/>

  <!-- Bicycle -->
  <g transform="translate(241 403)"><use href="#wheel"/></g>
  <g transform="translate(553 403)"><use href="#wheel"/></g>
  <g fill="none" stroke="#e76f51" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M241 403L320 300L380 403H241L448 309L380 403"/>
    <path d="M448 309L553 403"/>
  </g>
  <g fill="none" stroke="#263a45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320 300L309 278M291 277h42"/>
    <path d="M448 309l-12-42h39q13 0 13 13"/>
    <path d="M553 403l-41-132"/>
  </g>
  <circle cx="380" cy="403" r="13" fill="#f9f0d8" stroke="#263a45" stroke-width="5"/>
  <g transform="translate(380 403)">
    <g>
      <path d="M-23-20L23 20" stroke="#263a45" stroke-width="6" stroke-linecap="round"/>
      <path d="M-35-20h24M11 20h24" stroke="#263a45" stroke-width="7" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Pelican and its expressive cargo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.8s" repeatCount="indefinite"/>
    <path d="M337 267q-11 36 9 68l30 50" fill="none" stroke="#e58d3d" stroke-width="10" stroke-linecap="round"/>
