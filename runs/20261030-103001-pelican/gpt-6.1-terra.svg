    <path d="M351 260q22-27 55-17 20 7 26 24-27 25-57 12-15-6-24-19z" fill="#d3e7df" stroke="#263a45" stroke-width="3"/>
    <path d="M414 254q29 8 38 30l16 7" fill="none" stroke="#e58d3d" stroke-width="8" stroke-linecap="round"/>
    <path d="M468 291l11-3" fill="none" stroke="#263a45" stroke-width="6" stroke-linecap="round"/>
    <path d="M412 236q15-18 19-44 3-32 27-39 27-8 43 11 12 15 7 36-5 22-31 32l-20 24z" fill="#fffdf2" stroke="#263a45" stroke-width="4"/>
    <path d="M486 184q39 8 93 23-30 6-80 3-28-2-35-12z" fill="#f6ae4f" stroke="#263a45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M473 201q18 6 27 9 35 3 79-3-13 40-53 49-37 8-53-18-7-12 0-37z" fill="#ffd07a" stroke="#263a45" stroke-width="4"/>
    <path d="M497 228q12-9 23 0-11 9-23 0zm23 0 9-7v14z" fill="#68a8aa" stroke="#527477" stroke-width="2"/>
    <circle cx="502" cy="227" r="1.5" fill="#263a45"/>
    <circle cx="482" cy="176" r="12" fill="#fff" stroke="#263a45" stroke-width="3"/>
    <circle cx="486" cy="178" r="4" fill="#263a45"/>
    <path d="M466 159q12-8 23-3" fill="none" stroke="#263a45" stroke-width="4" stroke-linecap="round"/>
    <path d="M432 159q12-21 39-22 21 0 34 16l-8 7q-28-10-59 4z" fill="#e76f51" stroke="#263a45" stroke-width="4"/>
    <path d="M454 139l-3-9h14l4 9" fill="#e76f51" stroke="#263a45" stroke-width="3"/>
  </g>

  <!-- Roadside observer -->
  <g transform="translate(678 447)" stroke="#263a45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-15 4l-10 8m13-3-4 12m25-12 4 12m3-17 10 8" fill="none"/>
    <path d="M-16 0q-13-5-15-16m47 16q13-5 15-16" fill="none"/>
    <path d="M-36-20q6-8 12 0l-5 6zm72 0q-6-8-12 0l5 6z" fill="#e76f51"/>
    <ellipse cy="1" rx="20" ry="13" fill="#e76f51"/>
    <path d="M-8-10v-8m16 8v-8" fill="none"/>
    <circle cx="-8" cy="-20" r="4" fill="#fff"/>
    <circle cx="8" cy="-20" r="4" fill="#fff"/>
    <path d="M-7 5q7-4 14 0" fill="none"/>
  </g>
  <path d="M618 359q-33-3-33 19 0 20 27 20h13l15 12-5-14q15-5 15-18 0-19-32-19z" fill="#fffdf2" stroke="#263a45" stroke-width="3"/>
  <text x="618" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#263a45">SHOW-OFF.</text>

  <path d="M39 496H761" stroke="#a5c8be" stroke-width="2"/>
  <text x="400" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#263a45">He brings his own lunch—and the traffic jams.</text>
  <text x="400" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#526d73">2026-10-30 10:33:04 SGT (UTC+08:00)</text>
</svg>