<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Pedal Lobby</title>
  <desc id="description">A smug pelican cycles along the waterfront with a fish in its enormous bill pouch. Bicycle wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#243947" opacity=".035"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fff9e9" stroke="#243947" stroke-width="12"/>
      <circle r="65" fill="none" stroke="#9bb5b6" stroke-width="2"/>
      <g stroke="#52717c" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <circle r="10" fill="#f6bf43" stroke="#243947" stroke-width="4"/>
      <path d="M-9-68H9" stroke="#f07a4f" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7e5"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 320Q130 293 250 320T510 320T800 313V459H0Z" fill="#bfe1df"/>
  <g fill="none" stroke="#7ab4b7" stroke-width="3" stroke-linecap="round">
    <path d="M29 354h57m26 23h78m385-29h72m39 37h83"/>
    <path d="M14 406h109m527 19h91"/>
  </g>
  <circle cx="691" cy="157" r="39" fill="#f6bf43"/>
  <path d="M54 201q23-23 46 0q23-23 46 0M625 242q15-15 30 0q15-15 30 0" fill="none" stroke="#52717c" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#243947">THE PELICAN PEDAL LOBBY</text>
  <text x="400" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#a54b35">BIG BILL. TINY CARBON FOOTPRINT.</text>

  <!-- A single waterfront cycling scene -->
  <path d="M0 464H800V519H0Z" fill="#e0cba5"/>
  <path d="M0 465H800" stroke="#243947" stroke-width="5"/>
  <ellipse cx="406" cy="478" rx="256" ry="13" fill="#243947" opacity=".12"/>

  <g transform="translate(240 391)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(565 391)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#243947" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 391L325 280L397 391H240M325 280H510L397 391M510 280L565 391"/>
    <path d="M325 280L313 251M510 280L492 236L526 221"/>
  </g>
  <g fill="none" stroke="#e96249" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 391L325 280L397 391H240M325 280H510L397 391M510 280L565 391"/>
  </g>
  <path d="M292 250H339" stroke="#243947" stroke-width="13" stroke-linecap="round"/>
  <path d="M521 221H540" stroke="#243947" stroke-width="10" stroke-linecap="round"/>
  <circle cx="397" cy="391" r="23" fill="#f6bf43" stroke="#243947" stroke-width="5"/>
  <path d="M245 391L397 374M245 391L397 409" fill="none" stroke="#52717c" stroke-width="3"/>

  <!-- Pelican and its officious cargo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M331 252Q284 241 280 206Q275 163 316 156Q346 153 377 176L402 224Q381 259 331 252Z" fill="#fffdf5" stroke="#243947" stroke-width="5"/>
    <path d="M291 214L259 230L283 196" fill="#fffdf5" stroke="#243947" stroke-width="5" stroke-linejoin="round"/>
    <path d="M365 205Q399 189 401 157Q401 126 425 123Q452 122 455 146Q455 171 436 187L419 235Q397 254 371 239" fill="#fffdf5" stroke="#243947" stroke-width="5"/>
    <path d="M313 184Q335 171 359 189L389 219Q352 235 318 211" fill="#dae6df" stroke="#243947" stroke-width="4"/>
    <path d="M349 204Q412 247 502 230" fill="none" stroke="#243947" stroke-width="11" stroke-linecap="round"/>
    <path d="M349 204Q412 247 502 230" fill="none" stroke="#dae6df" stroke-width="6" stroke-linecap="round"/>
    <path d="M498 229l16 1m-13-3 10-5" stroke="#243947" stroke-width="4" stroke-linecap="round"/>

    <!-- Enormous bill and stretchy fish-filled pouch -->
    <path d="M451 151L616 167Q583 231 490 210Q461 200 451 151Z" fill="#f5bd4f" stroke="#243947" stroke-width="5" stroke-linejoin="round"/>
    <path d="M451 151L624 161L616 173L453 165Z" fill="#f18a45" stroke="#243947" stroke-width="5" stroke-linejoin="round"/>
    <path d="M485 189Q510 169 542 190Q513 212 485 189L472 202V178Z" fill="#78b9c2" stroke="#243947" stroke-width="3"/>
    <circle cx="531" cy="188" r="3" fill="#243947"/>
    <path d="M500 186l8 7-7 5" fill="none" stroke="#243947" stroke-width="2"/>
    <circle cx="438" cy="143" r="5" fill="#243947"/>
    <path d="M428 132l15-3" stroke="#243947" stroke-width="4" stroke-linecap="round"/>

    <!-- Ridiculously formal cycling helmet -->
    <path d="M401 126Q400 96 426 96Q450 97 455 124Z" fill="#e96249" stroke="#243947" stroke-width="5"/>
    <path d="M418 101l-3 16m17-16 3 16" stroke="#fff7e5" stroke-width="4" stroke-linecap="round"/>
    <path d="M398 125H461" stroke="#243947" stroke-width="6" stroke-linecap="round"/>

    <path d="M329 248Q341 275 365 303L397 365" fill="none" stroke="#243947" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M329 248Q341 275 365 303L397 365;M329 248Q324 289 367 324L397 407;M329 248Q341 275 365 303L397 365" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M329 248Q341 275 365 303L397 365" fill="none" stroke="#efaa45" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" values="M329 248Q341 275 365 303L397 365;M329 248Q324 289 367 324L397 407;M329 248Q341 275 365 303L397 365" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(397 391)">
    <g stroke="#243947" stroke-width="6" stroke-linecap="round">
      <path d="M0-27V27"/>
      <path d="M-10-27H10M-10 27H10" stroke-width="9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Speech stays still for readability -->
  <path d="M59 114H266Q281 114 281 129V170Q281 185 266 185H221L203 207L207 185H59Q44 185 44 170V129Q44 114 59 114Z" fill="#fffdf5" stroke="#243947" stroke-width="3"/>
  <text x="162" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#243947">
    <tspan x="162">“My transport policy?</tspan>
    <tspan x="162" dy="25">More cycle lanes.</tspan>
    <tspan x="162" dy="0"/>
  </text>
  <text x="162" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a54b35">And subsidized sardines.”</text>

  <text x="400" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243947">He pedals for the planet. The fish funds the campaign.</text>

  <rect x="0" y="535" width="800" height="65" fill="#243947"/>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fff7e5">2026-10-30 10:31:38 SGT (UTC+08:00)</text>
</svg>