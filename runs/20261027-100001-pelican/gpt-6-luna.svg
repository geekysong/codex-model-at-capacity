<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly carrying an absurdly large fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de5f5"/>
      <stop offset="1" stop-color="#e8f8d9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#656b78"/>
      <stop offset="1" stop-color="#343842"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink { stroke:#202735; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#202735; }
      .motion { stroke:#fff6a8; stroke-width:5; stroke-linecap:round; opacity:.9; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="100" r="48" fill="#fff4ad" opacity=".85"/>
  <path d="M0 420 Q130 350 260 420 T520 410 T800 400 V500 H0Z" fill="#93c77d"/>
  <path d="M0 465 Q180 420 350 462 T800 450 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 H800" stroke="#f5e8a6" stroke-width="8" stroke-dasharray="55 35" opacity=".8"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#17354a">THE BEAK PEDAL EXPRESS</text>
  <text x="400" y="96" text-anchor="middle" class="label" font-size="20" font-weight="700">“Why walk when you can commute with maximum fish?”</text>

  <g opacity=".75">
    <path d="M95 180 q25 -20 50 0 q25 -20 50 0" fill="none" class="ink" stroke-width="4"/>
    <path d="M615 180 q25 -20 50 0 q25 -20 50 0" fill="none" class="ink" stroke-width="4"/>
  </g>

  <g class="motion">
    <path d="M90 390 h45"/>
    <path d="M62 420 h55"/>
    <path d="M700 365 h42"/>
    <path d="M720 395 h58"/>
  </g>

  <!-- bicycle and rider bob together -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 4;0 0" dur="1.4s" repeatCount="indefinite"/>

    <!-- bicycle frame -->
    <g class="ink" fill="none">
      <path d="M220 455 L330 455 L400 335 L285 335 Z" fill="#e84e4e"/>
      <path d="M330 455 L455 455 L400 335"/>
      <path d="M285 335 L255 300"/>
      <path d="M255 300 L285 300"/>
      <path d="M455 455 L500 330"/>
      <path d="M475 330 L525 330"/>
      <path d="M400 335 L430 300"/>
    </g>

    <!-- wheels -->
    <g class="ink" fill="#d8eef0">
      <g>
        <circle cx="220" cy="455" r="68"/>
        <circle cx="220" cy="455" r="8" fill="#202735"/>
        <g>
          <path d="M220 455 L220 387 M220 455 L220 523 M220 455 L152 455 M220 455 L288 455 M220 455 L172 407 M220 455 L268 503 M220 455 L172 503 M220 455 L268 407" stroke-width="3"/>
          <animateTransform attributeName="transform" type="rotate" from="0 220 455" to="360 220 455" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>
      <g>
        <circle cx="455" cy="455" r="68"/>
        <circle cx="455" cy="455" r="8" fill="#202735"/>
        <g>
          <path d="M455 455 L455 387 M455 455 L455 523 M455 455 L387 455 M455 455 L523 455 M455 455 L407 407 M455 455 L503 503 M455 455 L407 503 M455 455 L503 407" stroke-width="3"/>
          <animateTransform attributeName="transform" type="rotate" from="0 455 455" to="360 455 455" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- pedals -->
    <g class="ink" fill="none">
      <circle cx="330" cy="455" r="14" fill="#f5c84c"/>
      <path d="M330 455 L300 430 M330 455 L360 480"/>
      <path d="M290 425 h-25 M355 485 h25"/>
      <animateTransform attributeName="transform" type="rotate" from="0 330 455" to="360 330 455" dur="1.1s" repeatCount="indefinite"/>
    </g>

    <!-- pelican body -->
    <g class="ink">
      <ellipse cx="365" cy="265" rx="82" ry="102" fill="#f4f1e7"/>
      <path d="M310 245 Q270 270 286 338 Q322 360 356 324 Q338 282 310 245Z" fill="#c9d5dc"/>
      <ellipse cx="420" cy="155" rx="58" ry="68" fill="#f4f1e7"/>
      <path d="M457 161 Q530 160 610 193 Q623 205 603 218 Q520 224 447 193Z" fill="#f39b3d"/>
      <path d="M476 185 Q535 191 600 205 Q535 229 475 207Z" fill="#e77832"/>
      <circle cx="438" cy="142" r="9" fill="#202735"/>
      <path d="M410 100 Q440 70 472 96" fill="none"/>
      <path d="M396 118 Q415 84 447 77" fill="none"/>
      <path d="M347 337 Q365 365 391 337" fill="none"/>
      <!-- wing -->
      <path d="M350 245 Q395 260 405 320 Q370 340 335 315Z" fill="#d8e1e5"/>
      <!-- legs -->
      <path d="M345 330 L330 402 L315 438" fill="none"/>
      <path d="M395 330 L410 402 L430 438" fill="none"/>
      <path d="M300 440 q18 -10 32 0" fill="none"/>
      <path d="M416 440 q18 -10 32 0" fill="none"/>
    </g>

    <!-- ridiculous fish cargo -->
    <g class="ink">
      <path d="M90 250 Q165 195 255 235 Q280 250 255 265 Q165 310 90 250Z" fill="#7ed0d4"/>
      <path d="M90 250 L58 225 L65 275Z" fill="#55aeb8"/>
      <circle cx="230" cy="245" r="6" fill="#202735"/>
      <path d="M150 223 Q165 250 150 277 M185 218 Q200 250 185 282" fill="none" stroke-width="3"/>
      <path d="M255 250 Q280 235 292 214 Q302 250 292 286 Q278 265 255 250Z" fill="#f4bf4f"/>
      <path d="M106 250 Q155 250 220 250" fill="none" stroke="#fff6a8" stroke-width="4" stroke-dasharray="8 8"/>
    </g>
    <path d="M287 235 Q250 235 245 250" class="ink" fill="none"/>
  </g>

  <g class="label" font-weight="800">
    <rect x="535" y="270" width="205" height="76" rx="16" fill="#fffdf0" stroke="#202735" stroke-width="5"/>
    <text x="637" y="300" text-anchor="middle" font-size="18">OFFICIAL POLICY:</text>
    <text x="637" y="326" text-anchor="middle" font-size="17">MORE BEAK, LESS TRAFFIC</text>
    <path d="M535 320 L495 300" fill="none" stroke="#202735" stroke-width="4"/>
  </g>

  <text x="400" y="570" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-27 10:11:05 SGT (UTC+08:00)</text>
</svg>