<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe8ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17425a" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#173042;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#173042}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="52" fill="#fff3a6" opacity=".8"/>
  <path d="M0 425 Q130 385 260 425 T520 425 T800 420 V600 H0Z" fill="#8bd17c"/>
  <path d="M0 478 Q170 445 340 480 T800 470 V600 H0Z" fill="#56ad67"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="42" font-weight="900" fill="#14364d">THE PELICAN EXPRESS</text>
  <text x="400" y="98" text-anchor="middle" class="label" font-size="20" font-style="italic">“Why fly when you can wobble?”</text>

  <g filter="url(#shadow)">
    <g id="bike">
      <circle cx="275" cy="445" r="78" fill="#eef8ff" class="ink"/>
      <circle cx="585" cy="445" r="78" fill="#eef8ff" class="ink"/>
      <g fill="none" class="ink">
        <path d="M275 445 L370 335 L470 445 L275 445 L420 445"/>
        <path d="M370 335 L345 300"/>
        <path d="M345 300 L390 300"/>
        <path d="M470 445 L500 320"/>
        <path d="M500 320 L545 320"/>
        <path d="M500 320 L520 285"/>
        <path d="M420 445 L395 485"/>
        <path d="M420 445 L455 485"/>
      </g>
      <g id="spokes" fill="none" stroke="#5c8ba0" stroke-width="3">
        <path d="M275 367V523 M197 445H353 M220 390L330 500 M220 500L330 390"/>
        <path d="M585 367V523 M507 445H663 M530 390L640 500 M530 500L640 390"/>
      </g>
      <circle cx="420" cy="445" r="15" fill="#ffb52e" class="ink"/>
      <g id="pedal">
        <path d="M420 445 L385 475 M420 445 L455 415" fill="none" class="ink"/>
        <circle cx="380" cy="480" r="8" fill="#ff7043" class="ink"/>
        <circle cx="460" cy="410" r="8" fill="#ff7043" class="ink"/>
      </g>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="420" cy="285" rx="112" ry="78" fill="#f7f5e9" class="ink"/>
      <path d="M350 278 Q300 250 315 183 Q330 135 380 165 Q420 193 405 250Z" fill="#d8e4e6" class="ink"/>
      <circle cx="361" cy="191" r="12" fill="#173042"/>
      <circle cx="365" cy="187" r="4" fill="#fff"/>
      <path d="M320 205 Q245 188 190 215 Q248 245 330 235Z" fill="#f28b42" class="ink"/>
      <path d="M203 214 Q245 224 310 222" fill="none" stroke="#c7582b" stroke-width="4"/>
      <path d="M410 275 Q455 215 500 257 Q530 290 493 332 Q450 348 410 315Z" fill="#e7eeee" class="ink"/>
      <path d="M406 333 Q420 385 390 415" fill="none" class="ink"/>
      <path d="M470 333 Q490 380 520 405" fill="none" class="ink"/>
      <path d="M375 414 q-25 12 -45 0 M520 405 q24 12 40 0" fill="none" class="ink"/>
      <path d="M385 305 Q415 330 455 307" fill="none" stroke="#d0a04a" stroke-width="6"/>
      <path d="M338 245 Q365 263 390 250" fill="none" stroke="#9bb5bd" stroke-width="6"/>
      <path d="M382 345 Q420 365 463 344" fill="none" stroke="#173042" stroke-width="5"/>
      <path d="M399 355 Q420 370 443 354" fill="none" stroke="#173042" stroke-width="4"/>
      <text x="535" y="205" class="label" font-size="18" font-weight="bold" transform="rotate(8 535 205)">HONK!</text>
    </g>
  </g>

  <g fill="#fff" stroke="#173042" stroke-width="4">
    <path d="M92 300 q34-45 68 0 q-34 38-68 0Z"/>
    <path d="M650 255 q30-35 58 0 q-29 30-58 0Z"/>
  </g>
  <text x="400" y="545" text-anchor="middle" class="label" font-size="21" font-weight="bold">A beak, two wheels, and absolutely no sense of direction.</text>
  <text x="400" y="580" text-anchor="middle" class="label" font-size="16">2026-10-27 10:00:01 SGT (UTC+08:00)</text>

  <animateTransform href="#spokes" attributeName="transform" type="rotate" from="0 275 445" to="360 275 445" dur="1.4s" repeatCount="indefinite"/>
  <animateTransform href="#spokes" attributeName="transform" type="rotate" from="0 585 445" to="360 585 445" dur="1.4s" repeatCount="indefinite"/>
  <animateTransform href="#pedal" attributeName="transform" type="rotate" from="0 420 445" to="360 420 445" dur="1.4s" repeatCount="indefinite"/>
</svg>