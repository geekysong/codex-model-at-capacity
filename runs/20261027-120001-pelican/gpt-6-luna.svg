<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of a pelican riding a bicycle, with looping wheel and pedaling animation.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe8ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b66"/>
      <stop offset="1" stop-color="#292d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <style>
      .ink { stroke:#202832; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family: Arial, Helvetica, sans-serif; fill:#202832; }
      .small { font-size:18px; font-weight:bold; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".9"/>
  <path d="M70 145 Q125 105 180 145 T290 145" fill="none" stroke="#fff" stroke-width="10" opacity=".8"/>
  <path d="M540 150 Q585 115 630 150 T720 150" fill="none" stroke="#fff" stroke-width="9" opacity=".75"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#173b59">
    PELICAN EXPRESS
  </text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="20" font-weight="700" fill="#9b2d20">
    “Why fly when you can pedal dramatically?”
  </text>

  <path d="M0 390 Q110 350 220 390 T440 390 T660 390 T880 390 L880 600 L0 600Z" fill="url(#road)"/>
  <path d="M0 470 H800" stroke="#f8d65c" stroke-width="8" stroke-dasharray="48 28" opacity=".9"/>
  <ellipse cx="402" cy="478" rx="245" ry="24" fill="#121820" opacity=".35" filter="url(#shadow)"/>

  <g id="bike">
    <g id="rearWheel">
      <circle cx="250" cy="420" r="78" fill="#29313a" class="ink"/>
      <circle cx="250" cy="420" r="66" fill="#d7edf2" stroke="#202832" stroke-width="5"/>
      <g stroke="#718792" stroke-width="3">
        <path d="M250 354V486 M184 420H316 M203 373L297 467 M297 373L203 467"/>
      </g>
      <circle cx="250" cy="420" r="9" fill="#e94f37" class="ink"/>
    </g>
    <g id="frontWheel">
      <circle cx="584" cy="420" r="78" fill="#29313a" class="ink"/>
      <circle cx="584" cy="420" r="66" fill="#d7edf2" stroke="#202832" stroke-width="5"/>
      <g stroke="#718792" stroke-width="3">
        <path d="M584 354V486 M518 420H650 M537 373L631 467 M631 373L537 467"/>
      </g>
      <circle cx="584" cy="420" r="9" fill="#e94f37" class="ink"/>
    </g>
    <path d="M250 420 L360 330 L470 420 L250 420 L420 420 L360 330 L584 420 L548 300" fill="none" stroke="#e94f37" stroke-width="9" stroke-linejoin="round"/>
    <path d="M548 300 L575 285" stroke="#202832" stroke-width="8"/>
    <path d="M338 332 L330 290" stroke="#202832" stroke-width="8"/>
    <path d="M315 289 H350" stroke="#202832" stroke-width="8"/>
    <circle cx="360" cy="420" r="18" fill="#f7b32b" class="ink"/>
    <g id="pedal" transform-origin="360 420">
      <path d="M360 420 L394 393 M360 420 L327 448" stroke="#202832" stroke-width="7"/>
      <rect x="390" y="386" width="25" height="9" rx="4" fill="#202832"/>
      <rect x="315" y="444" width="25" height="9" rx="4" fill="#202832"/>
      <animateTransform attributeName="transform" type="rotate" from="0 360 420" to="360 360 420" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 250 420" to="360 250 420" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="397" cy="282" rx="84" ry="102" fill="#f4f1df" class="ink"/>
    <path d="M344 252 Q300 295 316 355 Q360 330 390 286Z" fill="#d9d6c5" class="ink"/>
    <path d="M448 263 Q488 295 474 355 Q438 334 413 286Z" fill="#d9d6c5" class="ink"/>
    <ellipse cx="397" cy="178" rx="67" ry="65" fill="#f4f1df" class="ink"/>
    <path d="M351 194 Q391 176 445 197 L545 230 Q559 236 547 249 Q535 260 515 254 L426 227 Q384 218 351 223Z" fill="#f2a23a" class="ink"/>
    <path d="M514 251 Q532 267 546 257" fill="none" stroke="#202832" stroke-width="6"/>
    <circle cx="420" cy="164" r="11" fill="#202832"/>
    <circle cx="424" cy="160" r="3.5" fill="#fff"/>
    <path d="M365 145 Q390 122 417 142" fill="none" stroke="#202832" stroke-width="7"/>
    <path d="M377 321 Q397 343 416 321" fill="none" stroke="#202832" stroke-width="6"/>
    <path d="M362 355 L350 405" stroke="#f2a23a" stroke-width="12" class="ink"/>
    <path d="M432 355 L449 405" stroke="#f2a23a" stroke-width="12" class="ink"/>
    <path d="M350 405 L328 418" stroke="#f2a23a" stroke-width="9" class="ink"/>
    <path d="M449 405 L475 415" stroke="#f2a23a" stroke-width="9" class="ink"/>
    <path d="M351 260 Q328 239 321 215" fill="none" stroke="#202832" stroke-width="7"/>
    <path d="M443 259 Q463 238 470 216" fill="none" stroke="#202832" stroke-width="7"/>
    <text x="400" y="115" text-anchor="middle" class="label small" fill="#9b2d20">LOCAL BIRD, GLOBAL TRAFFIC</text>
  </g>

  <path d="M105 310 Q130 285 158 305" fill="none" stroke="#202832" stroke-width="5"/>
  <path d="M106 327 Q132 302 160 322" fill="none" stroke="#202832" stroke-width="5"/>
  <text x="110" y="278" class="label" font-size="17" font-weight="700">HONK!</text>

  <rect x="42" y="520" width="716" height="52" rx="14" fill="#fff8df" stroke="#202832" stroke-width="4"/>
  <text x="400" y="543" text-anchor="middle" class="label" font-size="19" font-weight="700">
    A beak, two wheels, and absolutely no sense of direction.
  </text>
  <text x="400" y="563" text-anchor="middle" class="label" font-size="14">
    2026-10-27 12:01:36 SGT (UTC+08:00)
  </text>
</svg>