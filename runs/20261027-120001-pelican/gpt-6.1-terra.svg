<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while chasing a fish-shaped traffic sign.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b66"/>
      <stop offset="1" stop-color="#30343c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#111" flood-opacity=".25"/>
    </filter>
    <style>
      .ink { stroke:#1d2430; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#1d2430; }
      .small { font-size:18px; font-weight:700; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="45" fill="#fff3a6" opacity=".9"/>
  <path d="M0 385 Q150 335 300 380 T600 370 T800 390 V450 H0Z" fill="#7acb78"/>
  <path d="M0 440 Q190 405 380 440 T800 430 V600 H0Z" fill="url(#road)"/>
  <path d="M0 515 H800" stroke="#f9dc6b" stroke-width="9" stroke-dasharray="50 30"/>
  
  <g filter="url(#shadow)">
    <rect x="42" y="30" width="716" height="78" rx="20" fill="#fff8dc" class="ink"/>
    <text x="400" y="72" text-anchor="middle" class="label" font-size="38" font-weight="900">PELICAN PEDAL PANIC!</text>
    <text x="400" y="96" text-anchor="middle" class="label" font-size="18" font-weight="700">“One bird. Two wheels. Zero idea where the brakes are.”</text>
  </g>

  <g transform="translate(0 8)">
    <g class="ink" fill="none">
      <circle cx="235" cy="440" r="78" stroke="#eef2f5" stroke-width="10"/>
      <circle cx="585" cy="440" r="78" stroke="#eef2f5" stroke-width="10"/>
      <circle cx="235" cy="440" r="9" fill="#ffcc33"/>
      <circle cx="585" cy="440" r="9" fill="#ffcc33"/>
      <path d="M235 440 L350 340 L470 440 L235 440 M350 340 L585 440 M470 440 L510 315 M350 340 L320 292"/>
      <path d="M470 440 L430 292 L320 292"/>
      <path d="M500 315 Q535 300 565 312" stroke="#e64b4b" stroke-width="10"/>
    </g>
    
    <g>
      <circle cx="350" cy="440" r="18" fill="#f15b4a" class="ink"/>
      <g transform="translate(350 440)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <path d="M0 0 L-52 -15" stroke="#1d2430" stroke-width="8" stroke-linecap="round"/>
        <path d="M0 0 L45 25" stroke="#1d2430" stroke-width="8" stroke-linecap="round"/>
        <rect x="-67" y="-24" width="22" height="12" rx="5" fill="#ffcc33"/>
        <rect x="43" y="19" width="22" height="12" rx="5" fill="#ffcc33"/>
      </g>
    </g>

    <g transform="translate(0 0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="370" cy="275" rx="78" ry="90" fill="#f5f1e8" class="ink"/>
      <path d="M310 255 Q258 230 245 177 Q291 174 340 210 Q350 227 350 250Z" fill="#f5f1e8" class="ink"/>
      <path d="M322 205 Q350 150 415 160 Q456 166 469 200 Q434 232 376 226Z" fill="#f5f1e8" class="ink"/>
      <path d="M432 177 Q475 178 525 211 Q491 258 426 228Z" fill="#efb343" class="ink"/>
      <path d="M493 208 Q555 220 591 247 Q555 270 491 249Z" fill="#f29f38" class="ink"/>
      <circle cx="418" cy="187" r="10" fill="#1d2430"/>
      <circle cx="421" cy="184" r="3.5" fill="#fff"/>
      <path d="M330 276 Q375 308 430 274" fill="none" class="ink"/>
      <path d="M350 340 L320 390 M415 340 L465 390" fill="none" class="ink" stroke-width="12"/>
      <path d="M307 391 Q320 403 336 391 M455 391 Q470 403 484 391" fill="none" class="ink" stroke-width="8"/>
      <path d="M347 230 Q310 275 325 330" fill="none" stroke="#d7d0c0" stroke-width="12"/>
      <path d="M410 235 Q443 275 429 330" fill="none" stroke="#d7d0c0" stroke-width="12"/>
      <path d="M355 246 Q382 260 410 246" fill="none" stroke="#e64b4b" stroke-width="7"/>
      <text x="367" y="305" text-anchor="middle" class="label" font-size="20" font-weight="900" fill="#e64b4b">HONK!</text>
    </g>
  </g>

  <g transform="translate(615 170)">
    <path d="M0 75 L0 0" stroke="#1d2430" stroke-width="7"/>
    <path d="M0 0 Q40 -20 76 0 Q40 20 0 0Z" fill="#ffcc33" class="ink"/>
    <path d="M15 0 Q40 -8 62 0 Q40 8 15 0Z" fill="#f15b4a"/>
    <text x="38" y="6" text-anchor="middle" class="label" font-size="16" font-weight="900">FISH?</text>
  </g>

  <g transform="translate(0 0)">
    <rect x="32" y="548" width="736" height="34" rx="10" fill="#fff8dc" stroke="#1d2430" stroke-width="3"/>
    <text x="400" y="571" text-anchor="middle" class="label small">2026-10-27 12:02:53 SGT (UTC+08:00)</text>
  </g>
</svg>