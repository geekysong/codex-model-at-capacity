<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>Projectile motion with landing continuation inset</title>
  <desc>Scale: 10 pixels per meter. Launch speed: horizontal 20 meters per second, vertical 15 meters per second. Gravity: 10 meters per second squared. The landing lies beyond the main canvas at x=700, so a same-scale inset shows the final segment.</desc>
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172536">
    <text x="30" y="25">Projectile motion · 10 px/m · no air resistance</text>
    <text x="30" y="47">vₓ = 20 m/s · vᵧ = 15 m/s · g = 10 m/s²</text>
    <text x="30" y="69">Total flight time: 3 s</text>
  </g>

  <path d="M50 350H550" fill="none" stroke="#465260" stroke-width="2"/>
  <path d="M100 350 Q325 12.5 550 265.625" fill="none" stroke="#146bc1" stroke-width="3"/>
  <path d="M542 255 L550 265.625 L537 263" fill="none" stroke="#146bc1" stroke-width="2"/>
  <circle cx="100" cy="350" r="4" fill="#172536"/>
  <circle cx="400" cy="237.5" r="4" fill="#146bc1"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#172536">
    <text x="55" y="325">launch: 0 m, 0 m</text>
    <text x="290" y="216">apex: 30 m, 11.25 m</text>
    <text x="404" y="291">Continues to landing ↗</text>
  </g>

  <rect x="385" y="83" width="195" height="112" rx="5" fill="#f4f8fc" stroke="#abb9c7"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#172536">
    <text x="397" y="100">Landing inset · same scale</text>
    <text x="397" y="184">landing: 60 m, 0 m</text>
  </g>
  <path d="M480 160H565" stroke="#465260" stroke-width="2"/>
  <path d="M500 108 Q520 130 540 160" fill="none" stroke="#146bc1" stroke-width="3"/>
  <circle cx="540" cy="160" r="4" fill="#146bc1"/>

  <path d="M30 373H570" stroke="#d5dce3"/>
  <text x="300" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#172536">2026-10-25 08:33:56 SGT (UTC+08:00)</text>
</svg>