<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Tour de Fish</title>
  <desc id="desc">A determined pelican pedals a bicycle with spinning wheels, carrying a fish who objects to being called sustainable cargo.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#dfd6bd" opacity=".35"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke: #24343b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #71848a; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M36 102H764" stroke="#24343b" stroke-width="3"/>
  <text x="400" y="57" text-anchor="middle" font-size="43" font-weight="900" fill="#24343b">THE TOUR DE FISH</text>
  <text x="400" y="85" text-anchor="middle" font-size="16" letter-spacing="3" fill="#53696f">BIG BILL. ZERO EMISSIONS.</text>

  <!-- A single seaside cycling scene -->
  <rect x="36" y="116" width="728" height="363" rx="22" fill="#dceee9"/>
  <path d="M37 330 Q160 307 287 330 T535 327 T763 331V434H37Z" fill="#a9d8d3"/>
  <path d="M55 351h84m34 18h55m373-20h80m18 23h43" fill="none" stroke="#f0faf0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="690" cy="166" r="30" fill="#f7c85d"/>
  <path d="M89 172q12-13 24 0q12-13 24 0m429-23q10-10 20 0q10-10 20 0" fill="none" stroke="#718c91" stroke-width="3"/>
  <path d="M37 409Q204 394 401 411T763 410V479H37Z" fill="#e6ce9b"/>
  <path d="M38 451H762" stroke="#bfa473" stroke-width="3"/>
  <ellipse cx="416" cy="456" rx="244" ry="13" fill="#6f7869" opacity=".18"/>

  <!-- Fish passenger's complaint -->
  <path d="M80 204Q69 204 69 192V137Q69 125 83 125H286Q299 125 299 139V192Q299 204 286 204H155L139 225L137 204Z" fill="#fffdf3" stroke="#24343b" stroke-width="3"/>
  <text x="184" y="155" text-anchor="middle" font-size="18" font-weight="700" fill="#24343b">“I was promised</text>
  <text x="184" y="181" text-anchor="middle" font-size="18" font-weight="700" fill="#24343b">a CARP-pool.”</text>

  <!-- Wheels: explicit continuous SMIL rotation -->
  <g>
    <circle cx="248" cy="391" r="65" fill="#f8f2df" class="ink" stroke-width="9"/>
    <circle cx="248" cy="391" r="56" fill="#dceee9" stroke="#a5b8b5" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0 248 391" to="360 248 391" dur="1.6s" repeatCount="indefinite"/>
      <path d="M248 335v112m-56-56h112m-96-40 80 80m-80 0 80-80"/>
      <path d="M248 336a55 55 0 0 1 47 27" fill="none" stroke="#ee7956" stroke-width="6"/>
    </g>
    <circle cx="248" cy="391" r="8" fill="#24343b"/>
  </g>
  <g>
    <circle cx="568" cy="391" r="65" fill="#f8f2df" class="ink" stroke-width="9"/>
    <circle cx="568" cy="391" r="56" fill="#dceee9" stroke="#a5b8b5" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0 568 391" to="360 568 391" dur="1.6s" repeatCount="indefinite"/>
      <path d="M568 335v112m-56-56h112m-96-40 80 80m-80 0 80-80"/>
      <path d="M568 336a55 55 0 0 1 47 27" fill="none" stroke="#ee7956" stroke-width="6"/>
    </g>
    <circle cx="568" cy="391" r="8" fill="#24343b"/>
  </g>

  <!-- Rear carrier and profoundly dissatisfied fish -->
  <path d="M205 307H292M222 309l26 82m30-82-30 82" fill="none" class="ink"/>
  <path d="M190 268h107l-9 37h-89Z" fill="#d6a15e" class="ink"/>
  <path d="M211 272v28m21-28v28m21-28v28m21-28v28" stroke="#9e6c38" stroke-width="3"/>
  <g class="ink">
    <path d="M254 252l29-20v37Z" fill="#ea8b75"/>
    <path d="M197 254Q218 223 261 251Q228 281 197 254Z" fill="#75b8a3"/>
    <path d="M224 239l10-13 11 13" fill="#75b8a3"/>
    <circle cx="211" cy="249" r="3" fill="#24343b" stroke="none"/>
    <path d="M203 261h12m-10-20 12 3" fill="none" stroke-width="3"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M248 391l81-97 58 97Zm81-97h171L387 391m113-97 68 97" stroke="#24343b" stroke-width="11"/>
    <path d="M248 391l81-97 58 97Zm81-97h171L387 391m113-97 68 97" stroke="#e66d4e" stroke-width="6"/>
    <path d="M329 294l-12-37m183 37-14-50 36-12 16 9" stroke-width="7"/>
    <path d="M291 256h47" stroke-width="12"/>
    <path d="M251 392l136 13m-136-13 136-15" stroke-width="2"/>
  </g>
  <circle cx="387" cy="391" r="17" fill="#f3c55e" class="ink"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 387 391" to="360 387 391" dur="1.6s" repeatCount="indefinite"/>
    <path d="M366 378l42 26" stroke="#24343b" stroke-width="6"/>
    <path d="M356 378h20m23 26h20" stroke="#24343b" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Pelican: enormous pouch, tiny athletic ambitions -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M347 279l-13 39 42 44" fill="none" stroke="#c48335" stroke-width="10" stroke-linejoin="round">
      <animate attributeName="d" values="M347 279l-13 39 42 44;M347 279l-3 52 47 44;M347 279l-13 39 42 44" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M288 232l-37-14 17 34-23 4 52 22" fill="#fffdf2" class="ink"/>
    <path d="M288 216Q286 186 331 180Q369 172 402 202L427 216Q434 174 423 157Q414 134 441 129Q469 124 477 148Q487 178 469 213Q456 248 414 277Q384 299 335 286Q288 277 288 216Z" fill="#fffdf2" class="ink"/>
    <path d="M301 223Q335 197 391 225Q375 266 325 262Z" fill="#e3e8df" class="ink"/>
    <path d="M319 231l34 15m-22-21 35 13" fill="none" stroke="#9aaba7" stroke-width="3" stroke-linecap="round"/>
    <path d="M391 225Q431 241 479 243" fill="none" stroke="#24343b" stroke-width="15" stroke-linecap="round"/>
    <path d="M391 222Q432 237 479 240" fill="none" stroke="#fffdf2" stroke-width="10" stroke-linecap="round"/>
    <path d="M478 237l12-4 7 8" fill="none" class="ink"/>

    <path d="M367 279L359 330 402 380" fill="none" stroke="#edaa42" stroke-width="12" stroke-linejoin="round">
      <animate attributeName="d" values="M367 279L359 330 402 380;M367 279L382 321 372 369;M367 279L359 330 402 380" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M398 374l-5 15 36 1-13-12Z" fill="#f3b447" class="ink">
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 -11;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- Bill and stretchy pouch -->
    <path d="M468 162L654 178Q609 238 536 214Q495 202 468 173Z" fill="#f4b65f" class="ink"/>
    <path d="M473 158L664 176 473 180Z" fill="#f4cb66" class="ink"/>
    <path d="M514 190Q561 216 609 192" fill="none" stroke="#d88c42" stroke-width="3"/>
    <ellipse cx="458" cy="151" rx="12" ry="15" fill="white" stroke="#24343b" stroke-width="3"/>
    <circle cx="463" cy="153" r="4" fill="#24343b"/>
    <path d="M446 130l21 5" class="ink" fill="none"/>

    <!-- Aerodynamic helmet, optimistically sized -->
    <path d="M418 132Q419 104 449 106Q477 106 482 131Z" fill="#e66d4e" class="ink"/>
    <path d="M438 111l-3 15m18-15v15m14-11 4 12" stroke="#843f37" stroke-width="4"/>
    <path d="M426 134l9 35 17 7" fill="none" stroke="#24343b" stroke-width="3"/>
    <path d="M422 184l-30-5 13 18-32 1 37 13Z" fill="#e66d4e" class="ink"/>
  </g>

  <!-- Motion marks -->
  <path d="M150 344h34m-45 16h34m466 59h28" fill="none" stroke="#718c91" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="513" text-anchor="middle" font-size="22" font-weight="700" fill="#24343b">He cycles to work. His lunch files a complaint.</text>
  <path d="M36 539H764" stroke="#c6b993" stroke-width="2"/>
  <text x="400" y="572" text-anchor="middle" font-size="19" fill="#24343b">2026-11-05 20:00:01 SGT (UTC+08:00)</text>
</svg>