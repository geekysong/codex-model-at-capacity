<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">WINGING IT</title>
  <desc id="desc">A smug pelican rides a bicycle, pedaling furiously while a fish looks unimpressed.</desc>
  <style>
    text { font-family: "Trebuchet MS", Arial, sans-serif; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .rider { animation: bob .55s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-5px); } }
  </style>

  <rect width="800" height="600" fill="#b8e7f1"/>
  <circle cx="690" cy="105" r="48" fill="#ffd66e"/>
  <path d="M0 330 Q130 285 260 325 T520 320 T800 310 V600 H0Z" fill="#86cfa1"/>
  <path d="M0 405 Q180 390 350 410 T800 395 V600 H0Z" fill="#65b97f"/>
  <path d="M70 385h660" stroke="#f7f0d5" stroke-width="8" stroke-dasharray="26 22"/>
  <path d="M112 208q-20-17 0-30m31 18q-15-17 4-29m508 47q-18-15 2-27" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <text id="title" x="400" y="65" text-anchor="middle" font-size="38" font-weight="900" letter-spacing="3" fill="#173b4a">WINGING IT</text>
  <text x="400" y="96" text-anchor="middle" font-size="17" font-weight="700" fill="#315d68">A bird-brained commute, with excellent beak control.</text>

  <!-- Bicycle -->
  <g fill="none" stroke="#243d4c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <g class="wheel">
      <circle cx="245" cy="420" r="70" stroke="#263f4b" stroke-width="7"/>
