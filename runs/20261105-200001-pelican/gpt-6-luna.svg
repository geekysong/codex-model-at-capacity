  <g class="rider">
    <path d="M366 292q-9-48 27-74 43-30 87 5 28 21 22 63-7 48-68 55-49 6-68-49Z" fill="#fff8e8" stroke="#243d4c" stroke-width="6"/>
    <path d="M385 267q-21-20-18-49 4-37 35-46 36-11 61 15 18 19 14 46-25 25-92 34Z" fill="#f5f2e6" stroke="#243d4c" stroke-width="6"/>
    <path d="M393 213q18-19 43-8 13 6 17 20-22 23-56 14-15-8-4-26Z" fill="#263f4b"/>
