      <path d="M245 350v140M175 420h140M195 370l100 100m0-100L195 470" stroke="#718b91" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="555" cy="420" r="70" stroke="#263f4b" stroke-width="7"/>
      <circle cx="555" cy="420" r="8" fill="#263f4b"/>
      <path d="M555 350v140M485 420h140M505 370l100 100m0-100L505 470" stroke="#718b91" stroke-width="3"/>
    </g>
    <path d="M245 420l92-105 77 105H245l70-38 99 38 62-115"/>
    <path d="M318 301l26 0m128-8h30"/>
    <path d="M337 315l-19-24"/>
  </g>
  <circle cx="337" cy="382" r="12" fill="#ef6a4a" stroke="#243d4c" stroke-width="5"/>
