  <path d="M618 305q20-18 47-2l-8 28-38-4Z" fill="#fff" stroke="#243d4c" stroke-width="3"/>
  <text x="638" y="317" font-size="12" font-weight="900" text-anchor="middle" fill="#243d4c">2/10</text>

  <path d="M270 273q-24-13-43 3m40 13q-27-3-39 15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="165" y="265" font-size="16" font-weight="800" fill="#315d68" transform="rotate(-8 165 265)">HONK IF IMPRESSED</text>

  <rect x="0" y="530" width="800" height="70" fill="#173b4a"/>
  <text x="400" y="556" text-anchor="middle" font-size="16" font-weight="700" fill="#fff8e8">“I’m not late. I’m taking the scenic route to lunch.”</text>
  <text x="400" y="585" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd66e">2026-11-05 20:02:32 SGT (UTC+08:00)</text>
