  <rect x="0" y="366" width="600" height="34" fill="#f1f5f9"/>
  <text x="300" y="388" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-10-25 11:32:43 SGT (UTC+08:00)</text>
</svg>