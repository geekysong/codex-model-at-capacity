    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M443 270 l5 -8 M450 276 l5 -8"/>
    <path d="M441 345 l6 10 M451 345 l6 10"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="54" y="322">launch: 0 m, 0 m</text>
    <text x="320" y="215">apex: 30 m, 11.25 m</text>
    <text x="448" y="292">landing:</text>
    <text x="448" y="311">60 m, 0 m</text>
