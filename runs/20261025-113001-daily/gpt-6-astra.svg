    <text x="50" y="30" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="50" y="56">vₓ = 20 m/s · vᵧ = 15 m/s · g = 10 m/s²</text>
    <text x="50" y="80">Total flight time: 3 s · No air resistance</text>
    <text x="50" y="110">Scale: 10 px/m on each side of the axis break</text>
    <text x="50" y="134">Horizontal interval 34–56 m omitted to fit the canvas.</text>
  </g>

  <path d="M50 350 H550" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Before the axis break: x = 100 + 200t, y = 350 - 150t + 50t².
