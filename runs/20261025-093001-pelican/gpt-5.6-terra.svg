<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Into History</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .bird { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: top center; animation: pedal .55s linear infinite alternate; }
    .leg.back { animation-delay: -.55s; }
    .dust { animation: puff 1.1s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(20deg); } }
    @keyframes puff { 0% { opacity: .75; transform: translateX(0) scale(.4); } 100% { opacity: 0; transform: translateX(-38px) scale(1.2); } }
  </style>

  <rect width="800" height="600" fill="#b9e9f5"/>
  <path d="M0 330 Q115 270 220 326 T430 318 T625 320 T800 290 V475 H0Z" fill="#8dcc63"/>
  <path d="M0 394 Q175 365 330 397 T620 380 T800 395 V475 H0Z" fill="#559d4e"/>
  <path d="M0 462 H800" stroke="#444b4d" stroke-width="13"/>
  <path d="M0 475 H800" stroke="#f6cf4b" stroke-width="7" stroke-dasharray="34 24"/>

  <g opacity=".8">
    <path d="M102 293 l-12-54 22 46 9-70 9 70 25-44-17 55" fill="#3f873e"/>
    <path d="M680 306 l-8-47 19 38 7-62 10 62 25-37-17 48" fill="#3f873e"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="67" font-size="42" font-weight="900" fill="#173e55" stroke="#fff" stroke-width="3" paint-order="stroke">PELICAN PEDALS INTO HISTORY</text>
    <text x="400" y="98" font-size="18" font-weight="700" fill="#24596a">“Because waiting for fish to come to you is for amateurs.”</text>
  </g>

  <g class="dust" fill="#e9ddbd">
    <circle cx="104" cy="444" r="11"/><circle cx="80" cy="450" r="7"/><circle cx="58" cy="455" r="4"/>
  </g>

