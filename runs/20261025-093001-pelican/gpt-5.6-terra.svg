  <g font-family="Arial, sans-serif" font-weight="800">
    <path d="M557 174 Q652 147 680 203 Q650 247 568 230 L546 250 L551 221 Q530 194 557 174Z" fill="#fffdf0" stroke="#263940" stroke-width="4"/>
    <text x="614" y="199" text-anchor="middle" font-size="18" fill="#263940">NO LICENCE?</text>
    <text x="614" y="220" text-anchor="middle" font-size="18" fill="#263940">NO PROBLEM!</text>
  </g>

  <rect x="0" y="510" width="800" height="90" fill="#173e55"/>
  <text x="400" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#f8df6d">A pelican on a bicycle: proof that confidence outruns qualifications.</text>
