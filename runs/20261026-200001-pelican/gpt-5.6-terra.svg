    <path class="thin" d="M503 265 q24 3 39 20" fill="none"/>
    <path class="ink" d="M418 286 q-15 40 10 63 l39-2 q13-18-9-32 l-8-30Z" fill="#f5a85e"/>
    <path class="ink" d="M474 290 q16 27 42 36 l24-25 q-13-20-43-34Z" fill="#f5a85e"/>
    <path class="thin" d="M428 342 h38 M506 323 h31" fill="none"/>
    <path class="ink" d="M382 283 q-38 8-52 35 q12 22 39 14 q19-9 31-30Z" fill="#f6f4df"/>
    <path class="thin" d="M340 315 q15 5 28 1" fill="none"/>
  </g>

  <g transform="translate(589 216)">
    <path class="ink" d="M0 79 q13-78 86-79 q67 4 76 72 v42 H0Z" fill="#fff7df"/>
    <path class="ink" d="M18 111 h126" fill="none"/>
    <text x="81" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#19243a">BIKE LANE</text>
    <text x="81" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#d75b4b">NOT A RUNWAY</text>
    <path class="thin" d="M81 111v83" fill="none"/>
  </g>

  <rect x="22" y="531" width="756" height="52" rx="13" fill="#19243a"/>
  <text x="400" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#fff7df">A pelican on a bicycle: proof that confidence needs no license.</text>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#aee8f5">2026-10-26 20:03:20 SGT (UTC+08:00)</text>
