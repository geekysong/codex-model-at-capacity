<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past Priorities</title>
  <desc id="desc">A satirical cartoon of a large pelican riding a tiny bicycle, with animated wheels, pedals, and bobbing.</desc>
  <style>
    .ink{stroke:#19243a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#19243a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
    .bob{animation:bob .7s ease-in-out infinite alternate}
    .pedal{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-7px) rotate(-1deg)}}
  </style>

  <rect width="800" height="600" fill="#aee8f5"/>
  <path d="M0 345 Q125 305 245 344 T480 334 T800 342 V520 H0Z" fill="#82c86b"/>
  <path d="M0 410 Q130 385 270 417 T540 399 T800 417 V520 H0Z" fill="#66ad5c"/>
  <path d="M0 477 H800" stroke="#f7d35d" stroke-width="14" stroke-dasharray="34 25"/>
  <path d="M0 490 H800" stroke="#4b5964" stroke-width="62"/>
  <path d="M0 490 H800" stroke="#d8e3e4" stroke-width="4" stroke-dasharray="26 18"/>

  <g class="thin" fill="#fff" opacity=".9">
    <path d="M88 120 q24-30 48 0 q26-21 45 9 q-55 15-109 5Z"/>
    <path d="M603 103 q22-27 44 1 q26-19 46 10 q-54 13-106 3Z"/>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="900" fill="#19243a">PELICAN PEDALS PAST PRIORITIES</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#30465b">“Why fly when you can make traffic personally miserable?”</text>

  <g class="thin">
    <path d="M126 310 l-12-44" stroke="#4e7e43"/>
    <path d="M118 277 l-21-16 M119 279 l20-15" stroke="#4e7e43"/>
    <path d="M710 325 l9-52" stroke="#4e7e43"/>
    <path d="M717 288 l22-14 M716 295 l-20-12" stroke="#4e7e43"/>
  </g>

  <g transform="translate(0,0)">
    <g class="wheel">
      <circle class="ink" cx="278" cy="432" r="78" fill="#e9f3f5"/>
      <circle class="ink" cx="278" cy="432" r="13" fill="#f6b83d"/>
      <g class="thin" stroke="#6a7e87">
        <path d="M278 354v156 M200 432h156 M223 377l110 110 M333 377L223 487"/>
      </g>
      <circle class="thin" cx="278" cy="432" r="66" fill="none"/>
    </g>
    <g class="wheel">
      <circle class="ink" cx="541" cy="432" r="78" fill="#e9f3f5"/>
      <circle class="ink" cx="541" cy="432" r="13" fill="#f6b83d"/>
      <g class="thin" stroke="#6a7e87">
        <path d="M541 354v156 M463 432h156 M486 377l110 110 M596 377L486 487"/>
      </g>
      <circle class="thin" cx="541" cy="432" r="66" fill="none"/>
    </g>

    <g class="ink" fill="none">
      <path d="M278 432 L360 292 L457 432 Z"/>
      <path d="M360 292 L497 302 L541 432"/>
      <path d="M457 432 L541 432"/>
      <path d="M497 302 l20-48 h38"/>
      <path d="M355 291 l-19-34 h-42"/>
    </g>
    <path class="ink" d="M316 254 h-47" fill="none"/>
    <path class="ink" d="M507 254 h54" fill="none"/>
    <path class="ink" d="M561 254 q-1-21 20-20 q18 4 5 24" fill="#d75b4b"/>

    <g class="pedal">
      <circle class="ink" cx="457" cy="432" r="20" fill="#f6b83d"/>
      <path class="ink" d="M457 432 l51 28 M457 432 l-51-28" fill="none"/>
