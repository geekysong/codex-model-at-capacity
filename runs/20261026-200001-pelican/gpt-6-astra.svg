<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A proud pelican pedals a bicycle with spinning wheels, carrying a fish in its enormous bill pouch. The fish asks for a refund.</desc>
  <defs>
    <pattern id="sky" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff7df"/>
      <circle cx="3" cy="3" r="1" fill="#efdfbc"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 388 Q130 350 265 386 T540 380 T800 384 V520 H0Z" fill="#b9d9bd"/>
  <path d="M0 448 Q400 424 800 448 V520 H0Z" fill="#e8bf80"/>
  <path d="M0 489 H800" stroke="#fff4d4" stroke-width="5" stroke-dasharray="42 29"/>
  <ellipse cx="402" cy="466" rx="250" ry="14" fill="#493f33" opacity=".13"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#23333a">
    <text x="400" y="64" font-size="48" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="99" font-size="18" font-weight="bold">ZERO EMISSIONS. EXCESS BAGGAGE.</text>
  </g>

  <!-- Wheels rotate continuously around their own hubs. -->
  <g stroke="#23333a" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(245 409)">
      <circle r="80" fill="#fff8e6" stroke-width="12"/>
      <circle r="70" fill="none" stroke="#e6a94a" stroke-width="3"/>
      <g stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-68 0H68 M0-68V68 M-48-48L48 48 M-48 48L48-48"/>
        <path d="M-26-63L26 63 M-63-26L63 26 M-63 26L63-26 M-26 63L26-63" opacity=".45"/>
        <path d="M0-69L0-59" stroke="#ed6549" stroke-width="7"/>
      </g>
      <circle r="9" fill="#23333a"/>
    </g>
    <g transform="translate(565 409)">
      <circle r="80" fill="#fff8e6" stroke-width="12"/>
      <circle r="70" fill="none" stroke="#e6a94a" stroke-width="3"/>
      <g stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-68 0H68 M0-68V68 M-48-48L48 48 M-48 48L48-48"/>
        <path d="M-26-63L26 63 M-63-26L63 26 M-63 26L63-26 M-26 63L26-63" opacity=".45"/>
        <path d="M0-69L0-59" stroke="#ed6549" stroke-width="7"/>
      </g>
      <circle r="9" fill="#23333a"/>
    </g>

    <!-- Bicycle frame. -->
    <path d="M245 409L323 310L390 409H245L323 310H518L390 409 M518 310L565 409"
          fill="none" stroke-width="13"/>
    <path d="M245 409L323 310L390 409H245L323 310H518L390 409 M518 310L565 409"
          fill="none" stroke="#ec634b" stroke-width="7"/>
    <path d="M323 310L315 285 M518 310L505 270L537 258" fill="none" stroke-width="8"/>
    <path d="M292 284H340" stroke-width="13"/>
    <path d="M531 259L550 255" stroke-width="10"/>
    <circle cx="512" cy="269" r="10" fill="#edc34e" stroke-width="3"/>
    <circle cx="390" cy="409" r="19" fill="#f5e9cd" stroke-width="4"/>
  </g>

  <!-- The rider bobs; all lettering remains stationary. -->
  <g stroke="#23333a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>

    <path d="M311 254L247 223L269 270L245 266L302 301" fill="#fffdf0"/>
    <path d="M337 282L345 329L384 365" fill="none" stroke="#df8c39" stroke-width="11">
      <animate attributeName="d" values="M337 282L345 329L384 365;M337 282L325 338L367 383;M337 282L345 329L384 365" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <path d="M291 250Q293 215 337 210L391 214Q412 192 411 166Q408 131 443 132Q471 132 473 157Q471 181 449 204L430 250Q418 291 368 302Q312 310 291 278Z"
          fill="#fffdf0"/>
    <path d="M313 227Q362 207 402 242Q379 278 327 268Q351 256 355 246Q333 253 313 227Z"
          fill="#d4dfd8"/>
    <path d="M326 248L352 240 M337 260L367 248" fill="none" stroke="#94aaa2" stroke-width="3"/>

    <!-- Racing scarf and determined wing. -->
    <path d="M415 199L444 211L433 224L409 213Z" fill="#ed634c"/>
    <path d="M414 205Q373 191 349 204L365 216L350 225Q390 228 418 214" fill="#ed634c"/>
    <path d="M389 235Q438 234 466 265L505 269" fill="none" stroke-width="14"/>
    <path d="M389 235Q438 234 466 265L505 269" fill="none" stroke="#fffdf0" stroke-width="8"/>

    <!-- An absurdly capacious bill, with a disgruntled passenger. -->
    <path d="M463 164L638 183Q601 252 534 238Q481 225 463 164Z" fill="#f5bf60"/>
    <path d="M464 163L642 177L651 189L466 180Z" fill="#ef963f"/>
    <path d="M497 198Q530 216 567 210" fill="none" stroke="#de9547" stroke-width="3"/>
    <path d="M555 209L539 195L540 218Z" fill="#69a9aa"/>
    <path d="M549 207Q570 186 598 204Q578 226 549 207Z" fill="#82c5bf"/>
    <circle cx="586" cy="202" r="3" fill="#23333a" stroke="none"/>
    <path d="M576 196L588 197 M590 211L597 210" fill="none" stroke-width="2"/>

    <ellipse cx="450" cy="157" rx="11" ry="14" fill="white"/>
    <circle cx="455" cy="158" r="4" fill="#23333a" stroke="none"/>
    <path d="M435 139L456 143" fill="none" stroke-width="5"/>
    <path d="M411 139Q415 109 447 115Q470 118 476 140Z" fill="#ec634b"/>
    <path d="M428 119L423 136 M444 118L441 137 M459 123L457 138" fill="none" stroke="#ffe6a6" stroke-width="5"/>
    <path d="M407 140H480" fill="none"/>

    <path d="M366 289L389 336L413 391" fill="none" stroke="#eda044" stroke-width="12">
      <animate attributeName="d" values="M366 289L389 336L413 391;M366 289L410 331L426 373;M366 289L389 336L413 391" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M410 385L431 393L405 400L398 393Z" fill="#eda044">
      <animateTransform attributeName="transform" type="translate" values="0 0;13 -18;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(390 409)" stroke="#23333a" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite" additive="sum"/>
    <path d="M-21 16L21-16"/>
    <path d="M-31 16H-11 M11-16H31" stroke-width="7"/>
  </g>

  <g fill="none" stroke="#23333a" stroke-width="3" stroke-linecap="round">
    <path d="M186 289H230 M171 304H220 M190 319H212"/>
    <path d="M487 253L480 245 M501 248L499 237"/>
  </g>

  <path d="M603 268L590 224L629 267H738Q751 267 751 280V324Q751 338 738 338H590Q577 338 577 325V281Q577 268 590 268Z"
        fill="white" stroke="#23333a" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#23333a">
    <text x="664" y="294" font-size="17" font-weight="bold">“I paid for</text>
    <text x="664" y="317" font-size="17" font-weight="bold">a SEA view.”</text>
  </g>

  <rect y="520" width="800" height="80" fill="#23333a"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="549" fill="#fff4d4" font-size="21" font-weight="bold">He took up cycling. His lunch took up complaining.</text>
    <text x="400" y="581" fill="#ffffff" font-size="17">2026-10-26 20:00:01 SGT (UTC+08:00)</text>
  </g>
</svg>