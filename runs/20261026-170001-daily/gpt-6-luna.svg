<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Knight moves from square 6 on a 4 by 4 grid</title>
  <desc id="desc">Squares 4, 8, 9, 13, and 15 are shaded. The knight can reach five squares in one move.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <text x="40" y="35" font-size="18" font-weight="700">Knight moves from square 6</text>
    <g stroke="#364152" stroke-width="2">
      <rect x="40" y="55" width="64" height="64" fill="#e5e7eb"/>
      <rect x="104" y="55" width="64" height="64" fill="#e5e7eb"/>
      <rect x="168" y="55" width="64" height="64" fill="#e5e7eb"/>
      <rect x="232" y="55" width="64" height="64" fill="#e5e7eb"/>
      <rect x="40" y="119" width="64" height="64" fill="#e5e7eb"/>
      <rect x="104" y="119" width="64" height="64" fill="#f4c95d"/>
      <rect x="168" y="119" width="64" height="64" fill="#e5e7eb"/>
      <rect x="232" y="119" width="64" height="64" fill="#e5e7eb"/>
      <rect x="40" y="183" width="64" height="64" fill="#e5e7eb"/>
      <rect x="104" y="183" width="64" height="64" fill="#e5e7eb"/>
      <rect x="168" y="183" width="64" height="64" fill="#e5e7eb"/>
      <rect x="232" y="183" width="64" height="64" fill="#e5e7eb"/>
      <rect x="40" y="247" width="64" height="64" fill="#e5e7eb"/>
      <rect x="104" y="247" width="64" height="64" fill="#e5e7eb"/>
      <rect x="168" y="247" width="64" height="64" fill="#e5e7eb"/>
      <rect x="232" y="247" width="64" height="64" fill="#e5e7eb"/>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle" dominant-baseline="middle">
      <text x="72" y="87">1</text><text x="136" y="87">2</text><text x="200" y="87">3</text><text x="264" y="87">4</text>
      <text x="72" y="151">5</text><text x="136" y="151">6</text><text x="200" y="151">7</text><text x="264" y="151">8</text>
      <text x="72" y="215">9</text><text x="136" y="215">10</text><text x="200" y="215">11</text><text x="264" y="215">12</text>
      <text x="72" y="279">13</text><text x="136" y="279">14</text><text x="200" y="279">15</text><text x="264" y="279">16</text>
    </g>
    <g fill="#263449">
      <text x="340" y="90" font-size="19" font-weight="700">One-move destinations</text>
      <rect x="340" y="108" width="18" height="18" rx="3" fill="#f4c95d" stroke="#364152"/>
      <text x="369" y="123" font-size="16">Reachable square</text>
      <text x="340" y="166" font-size="17" font-weight="700">Count: 5 shaded squares</text>
      <text x="340" y="199" font-size="17">Numbers: 4, 8, 9, 13, 15</text>
      <text x="340" y="241" font-size="15">A knight moves two squares in</text>
      <text x="340" y="263" font-size="15">one direction, then one sideways.</text>
    </g>
    <line x1="30" y1="330" x2="570" y2="330" stroke="#c7cdd6" stroke-width="1"/>
    <text x="300" y="365" font-size="14" text-anchor="middle" fill="#263449">2026-10-26 17:05:31 SGT (UTC+08:00)</text>
  </g>
</svg>