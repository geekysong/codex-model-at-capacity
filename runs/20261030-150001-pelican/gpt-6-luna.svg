  </g>
  <text x="400" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="900" fill="#183044">THE TOUR DE BEAK</text>
  <text x="400" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#426273">“I trained for this. Mostly by standing in a pond.”</text>
