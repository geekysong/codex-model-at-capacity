<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Tour de Beak</title>
  <desc id="desc">A determined pelican rides a bicycle with spinning wheels, chasing a fish on a stick.</desc>
  <defs>
    <style>
      .ink{stroke:#183044;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .rider{transform-box:fill-box;transform-origin:50% 100%;animation:bob .55s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px) rotate(-1deg)}}
    </style>
  </defs>
