<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Pedal Lobby</title>
  <desc id="description">A smug pelican rides a bicycle with an enormous bill and a basket of fish. The wheels spin, the pedals turn, and the pelican bobs in a looping animation.</desc>
  <defs>
    <pattern id="sky" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff7df"/>
      <circle cx="3" cy="3" r="1" fill="#eadfbd"/>
    </pattern>
    <g id="wheel">
      <circle r="83" fill="#fffaf0" stroke="#243543" stroke-width="10"/>
      <circle r="72" fill="none" stroke="#a5b8b9" stroke-width="3"/>
