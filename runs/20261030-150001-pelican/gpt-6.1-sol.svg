        <path d="M-72 0H72M0-72V72M-51-51L51 51M-51 51L51-51M-66-28L66 28M-28-66L28 66M-66 28L66-28M-28 66L28-66"/>
      </g>
      <path d="M31-67A74 74 0 0 1 66-31" fill="none" stroke="#f4b73e" stroke-width="7" stroke-linecap="round"/>
      <circle r="9" fill="#243543"/>
    </g>
    <g id="fish">
      <path d="M-22 0Q-3-19 20 0Q-3 19-22 0L-34-12V12Z" fill="#64b5b5" stroke="#243543" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="10" cy="-2" r="2.5" fill="#243543"/>
    </g>
  </defs>

