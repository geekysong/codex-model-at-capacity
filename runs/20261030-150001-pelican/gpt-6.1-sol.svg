  <text x="400" y="69" text-anchor="middle" fill="#fff7df" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900" letter-spacing="1">THE PELICAN PEDAL LOBBY</text>
  <text x="400" y="124" text-anchor="middle" fill="#243543" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold">Zero emissions. Enormous bill.</text>

  <g fill="#dbe9dc">
    <path d="M0 369Q75 310 148 360Q212 304 282 365Q358 318 430 370Q523 305 601 361Q695 313 800 355V476H0Z"/>
  </g>
