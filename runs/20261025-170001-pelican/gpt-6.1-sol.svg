<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish-filled bill pouch. The wheels spin, its feet pedal, and its body bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#e8dfc5"/>
      <circle cx="17" cy="18" r=".7" fill="#e8dfc5"/>
    </pattern>
    <style>
      text { font-family: Georgia, serif; fill: #203343; }
      .ink { stroke: #203343; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #203343; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect width="800" height="600" fill="url(#paper)" opacity=".65"/>
  <rect x="18" y="18" width="764" height="564" rx="18" fill="none" stroke="#203343" stroke-width="3"/>

  <text x="400" y="68" text-anchor="middle" font-size="44" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="96" text-anchor="middle" font-size="16" font-style="italic">The only cyclist with a built-in seafood buffet.</text>

  <!-- One sunny seaside scene -->
  <path d="M40 352 Q155 325 268 348 T510 345 T760 347 L760 461 L40 461Z" fill="#d9e9dc"/>
  <path d="M40 367 Q170 347 270 367 T510 366 T760 364" fill="none" stroke="#9dc9c2" stroke-width="3"/>
  <circle cx="693" cy="155" r="29" fill="#f9cc60"/>
  <path d="M72 173q15-17 30 0q15-17 30 0 M168 143q11-13 22 0q11-13 22 0" fill="none" stroke="#83999d" stroke-width="3"/>
  <path d="M45 463H755" class="ink" fill="none"/>
  <ellipse cx="401" cy="458" rx="237" ry="11" fill="#203343" opacity=".12"/>

  <!-- Speech bubble -->
  <path d="M61 201Q61 183 80 183H265Q283 183 283 201V245Q283 262 265 262H179L151 283L156 262H80Q61 262 61 245Z" fill="#fffdf2" class="thin"/>
  <text x="172" y="215" text-anchor="middle" font-size="19" font-weight="bold">“I carb-load</text>
  <text x="172" y="241" text-anchor="middle" font-size="19" font-weight="bold">on sardines.”</text>

  <!-- Wheels: stationary tires, rotating spokes -->
  <g transform="translate(255 416)">
    <circle r="75" fill="#fff8e8" class="ink" stroke-width="9"/>
    <circle r="64" fill="none" stroke="#a9babb" stroke-width="2"/>
    <g stroke="#73898c" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      <path d="M-25-60L25 60M-60-25L60 25M-60 25L60-25M-25 60L25-60"/>
      <rect x="-5" y="-62" width="10" height="16" rx="3" fill="#f4c151" stroke="none"/>
    </g>
    <circle r="8" fill="#203343"/>
  </g>
  <g transform="translate(548 416)">
    <circle r="75" fill="#fff8e8" class="ink" stroke-width="9"/>
    <circle r="64" fill="none" stroke="#a9babb" stroke-width="2"/>
    <g stroke="#73898c" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      <path d="M-25-60L25 60M-60-25L60 25M-60 25L60-25M-25 60L25-60"/>
      <rect x="-5" y="-62" width="10" height="16" rx="3" fill="#f4c151" stroke="none"/>
    </g>
    <circle r="8" fill="#203343"/>
  </g>

  <!-- Bicycle -->
  <path d="M255 416L329 321L395 416Z M329 321H508L395 416 M508 321L548 416 M329 321L319 296 M508 321L499 283L527 271" fill="none" stroke="#203343" stroke-width="12" stroke-linejoin="round"/>
  <path d="M255 416L329 321L395 416Z M329 321H508L395 416 M508 321L548 416" fill="none" stroke="#e66c50" stroke-width="7" stroke-linejoin="round"/>
  <path d="M298 295H345" class="ink" stroke-width="10"/>
  <path d="M515 272H538Q550 272 550 284" fill="none" class="ink"/>
  <path d="M271 410L392 406M271 422L392 426" stroke="#203343" stroke-width="2" fill="none"/>
  <circle cx="395" cy="416" r="19" fill="#f3bf57" class="thin"/>

  <!-- Pelican and moving legs -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M340 299L369 351L395 396" fill="none" stroke="#203343" stroke-width="16" stroke-linecap="round"/>
    <path d="M340 299L369 351L395 396" fill="none" stroke="#efaa42" stroke-width="10" stroke-linecap="round"/>
    <path d="M278 260L250 239L259 270L243 266L277 291" fill="#fffdf0" class="ink"/>
    <path d="M282 252Q313 220 365 240Q400 250 422 217L450 193Q462 226 436 262Q416 298 371 310Q323 327 285 298Q268 278 282 252Z" fill="#fffdf0" class="ink"/>
    <path d="M298 267Q337 247 380 265Q358 302 313 292" fill="#d6e2df" class="thin"/>
    <path d="M313 272Q338 278 359 270M309 281Q331 288 346 282" fill="none" stroke="#8baba9" stroke-width="2"/>
    <path d="M418 248Q412 201 437 172Q461 149 487 170Q505 186 490 207L463 217L447 254" fill="#fffdf0" class="ink"/>

    <!-- Vast bill pouch with visible fish -->
    <path d="M481 196L653 207Q625 265 564 267Q508 267 481 210Z" fill="#efb65a" class="ink"/>
    <path d="M498 213Q544 237 630 217Q604 253 559 253Q522 250 498 213Z" fill="#f8d18b"/>
    <g transform="translate(553 235) rotate(9)">
      <path d="M-23 0Q-4-18 18 0Q-4 18-23 0L-36 10V-10Z" fill="#73b8ba" class="thin"/>
      <circle cx="9" cy="-2" r="2.5" fill="#203343"/>
    </g>
    <path d="M480 194L657 204L665 213L484 211Z" fill="#f5c852" class="ink"/>
    <circle cx="474" cy="183" r="6" fill="#203343"/>
    <circle cx="476" cy="181" r="1.7" fill="white"/>
    <path d="M463 169L481 172" class="thin"/>
    <path d="M434 171Q447 141 479 152L491 164L437 165Z" fill="#df6550" class="ink"/>
    <path d="M444 156L448 165M456 151L461 164M469 153L475 165" stroke="#fff2d0" stroke-width="3"/>

    <!-- Wing on handlebar -->
    <path d="M384 264Q431 278 479 279L522 275Q522 289 505 291L471 294Q427 301 392 288" fill="#fffdf0" class="ink"/>
  </g>

  <!-- Animated crank, webbed feet -->
  <g transform="translate(395 416)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-26 0H26" class="ink"/>
      <g transform="translate(26 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-8-11L17-5L23 3H-15Z" fill="#eda339" class="thin"/>
          <path d="M-14 7H22" class="thin"/>
        </g>
      </g>
      <g transform="translate(-26 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-8-11L17-5L23 3H-15Z" fill="#eda339" class="thin"/>
          <path d="M-14 7H22" class="thin"/>
        </g>
      </g>
    </g>
    <circle r="6" fill="#203343"/>
  </g>

  <path d="M161 389H130M158 402H113M163 415H139" fill="none" stroke="#83999d" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="520" text-anchor="middle" font-size="21" font-weight="bold">All the gear. Absolutely no idea where the brakes are.</text>

  <!-- Dedicated, unobstructed timestamp footer -->
  <path d="M45 540H755" stroke="#b9b5a4" stroke-width="1"/>
  <text x="400" y="565" text-anchor="middle" font-family="sans-serif" font-size="17">2026-10-25 17:01:30 SGT (UTC+08:00)</text>
</svg>