<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Through Town</title>
  <desc id="desc">A satirical cartoon of a proud pelican riding a tiny bicycle, with animated spinning wheels and bobbing motion.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: 50% 100%; animation: bob .55s ease-in-out infinite alternate; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .7s linear infinite; }
    .flag { animation: flap .45s ease-in-out infinite alternate; transform-origin: left center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes flap { to { transform: skewY(-8deg) scaleX(1.08); } }
  </style>

  <rect width="800" height="600" fill="#bfe9ff"/>
  <path d="M0 305 Q110 245 225 302 T440 289 T650 295 T800 265 V430 H0Z" fill="#8bd27a"/>
  <path d="M0 365 Q175 335 340 365 T800 350 V480 H0Z" fill="#65b95c"/>
  <path d="M0 424 H800 V480 H0Z" fill="#4f5963"/>
  <path d="M0 453 H800" stroke="#ffe169" stroke-width="9" stroke-dasharray="42 28"/>
  <path d="M0 485 H800" stroke="#d8e4e7" stroke-width="5"/>

  <g stroke="#425363" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M85 300 V222 M85 238 L128 211 M85 257 L42 228" fill="none"/>
    <path d="M676 294 V214 M676 230 L719 201 M676 249 L634 223" fill="none"/>
  </g>
  <g fill="#fff5a8" stroke="#425363" stroke-width="4">
    <circle cx="85" cy="218" r="13"/><circle cx="128" cy="207" r="12"/><circle cx="42" cy="224" r="12"/>
    <circle cx="676" cy="210" r="13"/><circle cx="719" cy="197" r="12"/><circle cx="634" cy="219" r="12"/>
  </g>

  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#213547">PELICAN FOR MAYOR!</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#3f5968">“Finally, a candidate with a bigger mouth than promises.”</text>

  <g class="flag">
    <path d="M564 179 L682 204 L566 235Z" fill="#ff6464" stroke="#384957" stroke-width="4"/>
    <text x="601" y="215" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="white">SQUAWK!</text>
    <path d="M560 172 V283" stroke="#384957" stroke-width="7"/>
  </g>

