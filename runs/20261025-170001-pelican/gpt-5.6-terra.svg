    <text x="400" y="526" text-anchor="middle" font-size="20" font-weight="800" fill="#253541">A pelican on a bicycle: proving balance is mostly confidence.</text>
    <text x="400" y="579" text-anchor="middle" font-size="16" font-weight="700" fill="#213547">2026-10-25 17:03:06 SGT (UTC+08:00)</text>
