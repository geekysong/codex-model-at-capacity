<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be7ff"/>
      <stop offset="1" stop-color="#f8f0c7"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="1" stop-color="#3d4148"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#24333b" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="120" r="58" fill="#fff2a8" opacity=".9"/>
  <path d="M0 300 Q120 250 240 300 T480 290 T800 300 V430 H0Z" fill="#77b85a"/>
  <path d="M0 350 Q180 315 350 355 T800 340 V450 H0Z" fill="#4d954d"/>
  <path d="M0 420 Q180 390 350 425 T800 410 V600 H0Z" fill="url(#road)"/>
  <path d="M0 508 Q180 475 350 510 T800 495" fill="none" stroke="#f7d65a" stroke-width="9" stroke-dasharray="48 32"/>
  
  <g fill="#fff" opacity=".8">
    <path d="M105 112 q25-24 50 0 q25-24 50 0 q-20 8-100 8z"/>
    <path d="M505 75 q20-20 40 0 q20-20 40 0 q-18 8-80 8z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="68" font-size="42" font-weight="900" fill="#173b4a" stroke="#fff3c4" stroke-width="5" paint-order="stroke">
      THE BEAK SPEEDWAY
    </text>
    <text x="400" y="103" font-size="17" font-weight="700" fill="#173b4a" letter-spacing="3">
      A VERY SERIOUS COMMUTER
    </text>
  </g>

  <!-- bicycle shadow -->
  <ellipse cx="414" cy="478" rx="220" ry="22" fill="#18252c" opacity=".35"/>

  <!-- bicycle -->
  <g stroke="#202b31" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#shadow)">
    <circle cx="270" cy="440" r="72" stroke="#ecf1ed" stroke-width="7"/>
    <circle cx="570" cy="440" r="72" stroke="#ecf1ed" stroke-width="7"/>
    <path d="M270 440 L355 330 L445 440 L270 440 M355 330 L570 440 M445 440 L525 330 L570 440"/>
    <path d="M520 330 L548 303 M525 330 L505 303"/>
    <path d="M338 330 L315 304"/>
    <path d="M350 330 L382 330"/>
    <circle cx="445" cy="440" r="19" fill="#ffcc3d"/>
    <path d="M445 440 l-27 27 M445 440 l30-25"/>
    <circle cx="418" cy="467" r="7" fill="#202b31"/>
    <circle cx="475" cy="415" r="7" fill="#202b31"/>
  </g>

  <!-- pelican body -->
  <g stroke="#29343a" stroke-width="5" stroke-linejoin="round" filter="url(#shadow)">
    <ellipse cx="405" cy="270" rx="92" ry="111" fill="#f4f0df"/>
    <ellipse cx="435" cy="287" rx="57" ry="88" fill="#d9e2df"/>
    <path d="M350 260 Q305 315 350 365 Q395 397 424 345 Q390 326 378 278Z" fill="#fffdf0"/>
    
    <!-- wing -->
    <path d="M379 247 Q320 267 330 347 Q365 371 406 328 Q420 290 379 247Z" fill="#9eb1b0"/>
    <path d="M351 278 Q372 300 390 330" fill="none" stroke="#627575" stroke-width="4"/>
    <path d="M345 294 Q367 314 382 341" fill="none" stroke="#627575" stroke-width="4"/>
    
    <!-- neck and head -->
    <path d="M366 216 Q350 150 405 128 Q468 105 505 158 Q528 195 500 240 Q460 265 410 238Z" fill="#f4f0df"/>
    <ellipse cx="454" cy="163" rx="57" ry="48" fill="#f4f0df"/>
    <path d="M470 178 Q530 172 623 205 Q652 217 624 233 Q548 243 466 213Z" fill="#f29c45"/>
    <path d="M481 201 Q554 220 626 218 Q596 265 520 240 Q485 228 466 213Z" fill="#e47f39"/>
    <path d="M510 216 Q555 231 603 229" fill="none" stroke="#b9572d" stroke-width="4"/>
    
    <!-- eye and brow -->
    <circle cx="466" cy="157" r="11" fill="#fff"/>
    <circle cx="469" cy="158" r="5" fill="#1c2930" stroke="none"/>
    <path d="M444 137 Q467 122 487 137" fill="none" stroke="#29343a" stroke-width="7"/>
    
    <!-- hat -->
    <path d="M397 121 Q428 75 493 105 L508 130 Q449 115 397 138Z" fill="#e84c3d"/>
    <path d="M392 127 Q447 111 510 132" fill="none" stroke="#29343a" stroke-width="7"/>
    <path d="M445 94 Q457 72 478 88" fill="none" stroke="#e84c3d" stroke-width="12"/>
    
    <!-- legs -->
    <path d="M386 350 L376 421 L414 440" fill="none" stroke="#f29c45" stroke-width="15"/>
    <path d="M438 351 L466 420 L442 440" fill="none" stroke="#f29c45" stroke-width="15"/>
    <path d="M366 421 Q390 414 414 440" fill="none" stroke="#29343a" stroke-width="8"/>
    <path d="M442 440 Q460 420 479 416" fill="none" stroke="#29343a" stroke-width="8"/>
    
    <!-- handlebars grip -->
    <path d="M520 330 Q543 319 560 309" fill="none" stroke="#29343a" stroke-width="8"/>
    <path d="M548 303 L567 296 M548 303 L558 315" fill="none" stroke="#29343a" stroke-width="6"/>
  </g>

  <!-- tiny traffic ticket -->
  <g transform="rotate(-10 640 365)">
    <rect x="615" y="342" width="125" height="62" rx="8" fill="#fff8d9" stroke="#29343a" stroke-width="4"/>
    <text x="677" y="365" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#29343a">SPEEDING?</text>
    <text x="677" y="386" text-anchor="middle" font-family="Arial" font-size="12" fill="#d64a38">BY BEAK POWER</text>
  </g>

  <!-- caption -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="150" y="535" width="500" height="43" rx="21" fill="#fff8d9" stroke="#29343a" stroke-width="4"/>
    <text x="400" y="563" font-size="19" font-weight="800" fill="#29343a">
      “I’m cutting my carbon bill — one waddle at a time!”
    </text>
  </g>
</svg>