<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#9de8ff"/>
      <stop offset="1" stop-color="#e7fbff"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#707986"/>
      <stop offset="1" stop-color="#3e4652"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="105" r="48" fill="#ffd866" opacity=".9"/>
  <path d="M0 405 Q120 350 240 405 T480 405 T800 390 V600 H0Z" fill="#a7d99a"/>
  <path d="M0 455 Q180 430 360 455 T800 445 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 Q180 495 360 520 T800 510" fill="none" stroke="#e6c86a" stroke-width="8" stroke-dasharray="38 24"/>

  <text x="400" y="66" text-anchor="middle" font-family="Impact, sans-serif" font-size="42" fill="#18384b" stroke="#fff" stroke-width="3" paint-order="stroke">
    THE GREAT BEAK-OUT
  </text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#28556b">
    A PELICAN ON A BICYCLE
  </text>

  <!-- motion lines -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8">
    <path d="M95 275h72"/>
    <path d="M70 305h84"/>
    <path d="M120 335h55"/>
  </g>

  <!-- bicycle shadow -->
  <ellipse cx="430" cy="492" rx="210" ry="22" fill="#202631" opacity=".3"/>

  <!-- bicycle -->
  <g fill="none" stroke="#e34b3b" stroke-width="9" stroke-linejoin="round">
    <circle cx="315" cy="448" r="70" fill="#eaf8ff" stroke="#263746" stroke-width="8"/>
    <circle cx="555" cy="448" r="70" fill="#eaf8ff" stroke="#263746" stroke-width="8"/>
    <path d="M315 448 L390 340 L470 448 L315 448 L430 448 L390 340"/>
    <path d="M470 448 L555 448 L490 350"/>
    <path d="M382 335h38"/>
    <path d="M480 350h42"/>
  </g>
  <g fill="none" stroke="#263746" stroke-width="4">
    <circle cx="315" cy="448" r="8"/>
    <circle cx="555" cy="448" r="8"/>
    <path d="M315 448l-32-28M315 448l31 27M555 448l-19-32M555 448l28 25"/>
  </g>
  <path d="M380 340q-12-20-30-18" fill="none" stroke="#263746" stroke-width="9" stroke-linecap="round"/>
  <path d="M488 349q8-23 27-22" fill="none" stroke="#263746" stroke-width="9" stroke-linecap="round"/>

  <!-- pelican body -->
  <g filter="url(#shadow)">
    <ellipse cx="425" cy="265" rx="78" ry="103" fill="#f7f5ed" stroke="#243642" stroke-width="6" transform="rotate(-12 425 265)"/>
    <path d="M389 242q-65 22-61 95 3 36 42 25 25-8 48-45z" fill="#d6dce0" stroke="#243642" stroke-width="6"/>
    <path d="M374 355q31 17 65 0l18 36q-48 24-91 0z" fill="#f4bd55" stroke="#243642" stroke-width="6"/>
    <!-- neck -->
    <path d="M429 181q-6 76 39 111" fill="none" stroke="#f7f5ed" stroke-width="44" stroke-linecap="round"/>
    <path d="M429 181q-6 76 39 111" fill="none" stroke="#243642" stroke-width="6" stroke-linecap="round" opacity=".85"/>
    <!-- head -->
    <circle cx="426" cy="144" r="57" fill="#f7f5ed" stroke="#243642" stroke-width="6"/>
    <path d="M385 151q-30 1-71-13-28-9-46-2 30 26 69 39 31 11 53 0z" fill="#f0a941" stroke="#243642" stroke-width="6"/>
    <path d="M273 137q21 17 50 25" fill="none" stroke="#c77e2c" stroke-width="5"/>
    <circle cx="443" cy="133" r="9" fill="#243642"/>
    <circle cx="446" cy="130" r="3" fill="#fff"/>
    <!-- helmet -->
    <path d="M383 111q11-40 51-45 38 7 49 45z" fill="#ef4f58" stroke="#243642" stroke-width="6"/>
    <path d="M375 111h115" stroke="#243642" stroke-width="7" stroke-linecap="round"/>
    <path d="M425 70v35" stroke="#ffd866" stroke-width="7"/>
    <!-- wing -->
    <path d="M435 245q41 7 58 48-19 21-45 2l-28-28z" fill="#cdd5da" stroke="#243642" stroke-width="6"/>
    <!-- feet/pedals -->
    <path d="M405 380q-8 28-22 42M461 380q18 27 29 45" stroke="#f0a941" stroke-width="12" stroke-linecap="round"/>
    <path d="M376 425h-27M489 427h28" stroke="#243642" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- comic accents -->
  <path d="M555 225q28-34 57-3" fill="none" stroke="#e34b3b" stroke-width="6" stroke-linecap="round"/>
  <text x="614" y="222" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#e34b3b">WHEEE!</text>
  <path d="M597 239l-18 18" stroke="#e34b3b" stroke-width="5"/>
  <path d="M590 278q18 13 34 0" fill="none" stroke="#243642" stroke-width="5" stroke-linecap="round"/>

  <!-- caption -->
  <rect x="112" y="548" width="576" height="38" rx="19" fill="#fff8df" stroke="#243642" stroke-width="4"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#243642">
    “No traffic jam can stop a bird with a pedal-powered beak!”
  </text>
</svg>