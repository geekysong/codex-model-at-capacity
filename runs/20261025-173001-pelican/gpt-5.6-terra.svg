<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past All Reason</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: 50% 100%; animation: bob .55s ease-in-out infinite alternate; }
    .leg-a { transform-box: fill-box; transform-origin: 50% 0%; animation: pedalA 1s linear infinite; }
    .leg-b { transform-box: fill-box; transform-origin: 50% 0%; animation: pedalB 1s linear infinite; }
    .blink { animation: blink 4s step-end infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { to { transform: rotate(360deg); } }
    @keyframes pedalB { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 94%,98% { transform: scaleY(.08); } }
  </style>

  <rect width="800" height="600" fill="#bdeaff"/>
