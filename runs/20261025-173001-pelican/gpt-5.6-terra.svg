  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="65" font-size="38" font-weight="900" fill="#183a54">PELICAN PEDALS PAST ALL REASON</text>
    <text x="400" y="99" font-size="18" font-weight="700" fill="#245a79">“Why fly when you can inconvenience traffic?”</text>
  </g>

