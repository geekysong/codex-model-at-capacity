<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels, bobbing as it pedals. A fish peers from its pouch.</desc>
  <defs>
    <style>
      .title { font: 900 38px sans-serif; fill: #183b46; letter-spacing: 1px; }
      .caption { font: 700 20px sans-serif; fill: #183b46; }
      .footer { font: 14px sans-serif; fill: #536971; }
      .ink { stroke: #183b46; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { animation: spin 2s linear infinite; transform-box: fill-box; transform-origin: center; }
      .rider { animation: bob .7s ease-in-out infinite alternate; }
      .pedals { animation: spin 2s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(4px) rotate(1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e9"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#e7f5f2" stroke="#183b46" stroke-width="4"/>
  <text x="400" y="70" text-anchor="middle" class="title">THE DAILY COMMUTE</text>

