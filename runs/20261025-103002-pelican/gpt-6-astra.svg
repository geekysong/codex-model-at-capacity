<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a bicycle with a huge fish-filled bill, ignoring a small sign that says no oversized baggage. Wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0L12 12M12 0L0 12" stroke="#9b683f" stroke-width="2"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke:#253440; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#253440; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <path d="M0 140Q210 105 415 143T800 131V445H0Z" fill="#d9eef0"/>
  <circle cx="692" cy="174" r="42" fill="#ffd56c"/>
  <path d="M41 198H153M71 183H130M613 237H739" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <text x="400" y="60" text-anchor="middle" font-size="43" font-weight="900" fill="#253440" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-size="18" fill="#536775">ONE RIDER. THREE FISH. ZERO AERODYNAMICS.</text>

  <!-- A single seaside cycle lane -->
  <path d="M0 390Q150 367 320 393T800 379V472H0Z" fill="#aac9a0"/>
  <path d="M0 423H800V493H0Z" fill="#b9bec0"/>
  <path d="M0 470H800" stroke="#fff5dc" stroke-width="5" stroke-dasharray="38 25"/>
  <ellipse cx="402" cy="451" rx="233" ry="17" fill="#253440" opacity=".12"/>

  <g>
    <path d="M99 326V427" class="ink" fill="none"/>
    <rect x="30" y="255" width="139" height="78" rx="9" fill="#fff5dc" class="thin"/>
    <text x="99" y="278" text-anchor="middle" font-size="15" font-weight="bold" fill="#253440">NO OVERSIZED</text>
    <text x="99" y="299" text-anchor="middle" font-size="15" font-weight="bold" fill="#253440">BAGGAGE</text>
    <text x="99" y="321" text-anchor="middle" font-size="12" fill="#a64937">Yes, even your face.</text>
  </g>

  <!-- Bicycle wheels rotate about their own hubs -->
  <g transform="translate(253 396)">
    <circle r="68" fill="#edf7f1" class="ink"/>
    <circle r="60" fill="none" stroke="#fff5dc" stroke-width="4"/>
    <g stroke="#758b92" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-60 0H60M0-60V60M-42-42L42 42M-42 42L42-42M-55-23L55 23M-23-55L23 55"/>
    </g>
    <circle r="7" fill="#253440"/>
  </g>
  <g transform="translate(553 396)">
    <circle r="68" fill="#edf7f1" class="ink"/>
    <circle r="60" fill="none" stroke="#fff5dc" stroke-width="4"/>
    <g stroke="#758b92" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-60 0H60M0-60V60M-42-42L42 42M-42 42L42-42M-55-23L55 23M-23-55L23 55"/>
    </g>
    <circle r="7" fill="#253440"/>
  </g>

  <!-- Far leg -->
  <path d="M357 299L393 337L376 385" fill="none" stroke="#d68c39" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M357 299L393 337L376 385;M357 302L366 347L412 384;M357 299L393 337L376 385" dur=".9s" repeatCount="indefinite"/>
  </path>

  <!-- Frame -->
  <g fill="none" stroke="#df5a4d" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M253 396L329 310L390 396ZM329 310H506L390 396M506 310L553 396"/>
    <path d="M329 310L319 289M506 310L494 273"/>
  </g>
  <path d="M296 288H343" stroke="#253440" stroke-width="12" stroke-linecap="round"/>
  <path d="M494 273L516 258H537" class="ink" fill="none"/>
  <path d="M253 396L390 407L390 384Z" fill="none" stroke="#536775" stroke-width="3"/>
  <circle cx="390" cy="396" r="18" fill="#fff5dc" class="thin"/>

  <!-- Pelican bobs gently; his enormous bill is the luggage -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M300 251L264 236L276 269L252 267L294 290" fill="#fffdf4" class="ink"/>
    <path d="M294 252C307 222 351 219 383 241C402 255 397 288 367 302C334 316 289 296 286 277Z" fill="#fffdf4" class="ink"/>
    <path d="M348 254C372 239 383 218 385 184C387 158 403 145 424 153C448 161 447 191 433 211L410 249C403 268 392 282 376 283" fill="#fffdf4" class="ink"/>
    <path d="M308 251Q336 241 362 270Q341 290 310 269" fill="#d3e2df" class="thin"/>
    <path d="M364 254Q411 281 497 266" fill="none" stroke="#253440" stroke-width="18" stroke-linecap="round"/>
    <path d="M364 251Q411 278 497 263" fill="none" stroke="#fffdf4" stroke-width="12" stroke-linecap="round"/>
    <path d="M487 261L509 255M488 265L510 265" class="thin" fill="none"/>

    <!-- Huge elastic pouch -->
    <path d="M437 186L661 207Q630 285 527 269Q462 255 437 202Z" fill="#f6b756" class="ink"/>
    <path d="M448 202Q519 222 643 211" fill="none" stroke="#d58c35" stroke-width="3"/>
    <g fill="#71abb4" class="thin">
      <path d="M511 228Q530 208 557 228Q534 250 511 235L499 245V218Z"/>
      <path d="M562 241Q582 220 607 237Q588 258 565 247L553 257V231Z"/>
    </g>
    <circle cx="546" cy="227" r="3" fill="#253440"/>
    <circle cx="596" cy="236" r="3" fill="#253440"/>
    <path d="M443 181L665 199L680 210L443 202Z" fill="#ffd876" class="ink"/>
    <path d="M664 199L680 210L662 214" fill="#e08a40" class="thin"/>

    <!-- Smug face and cycling helmet -->
    <circle cx="422" cy="176" r="9" fill="white" class="thin"/>
    <circle cx="425" cy="176" r="3.5" fill="#253440"/>
    <path d="M414 162L432 165" class="thin" fill="none"/>
    <path d="M383 157Q389 123 421 129Q447 132 451 156Z" fill="#df5a4d" class="ink"/>
    <path d="M400 137L397 148M416 135L414 147M432 139L433 149" stroke="#fff5dc" stroke-width="5" stroke-linecap="round"/>
    <path d="M389 158L402 197L436 159" fill="none" stroke="#536775" stroke-width="3"/>

    <path d="M341 295L363 337L412 384" fill="none" stroke="#253440" stroke-width="16" stroke-linecap="round">
      <animate attributeName="d" values="M341 295L363 337L412 384;M341 295L401 326L376 385;M341 295L363 337L412 384" dur=".9s" repeatCount="indefinite"/>
    </path>
    <path d="M341 295L363 337L412 384" fill="none" stroke="#f6b756" stroke-width="10" stroke-linecap="round">
      <animate attributeName="d" values="M341 295L363 337L412 384;M341 295L401 326L376 385;M341 295L363 337L412 384" dur=".9s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(390 396)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".9s" repeatCount="indefinite"/>
      <path d="M-23 0H23" class="thin"/>
      <path d="M-31 0H-15M15 0H31" stroke="#253440" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#253440"/>
  </g>

  <!-- Readable static speech bubble -->
  <path d="M536 120H746Q759 120 759 133V168Q759 181 746 181H570L548 190L552 181H536Q523 181 523 168V133Q523 120 536 120Z" fill="#fffdf4" class="thin"/>
  <text x="641" y="145" text-anchor="middle" font-size="18" font-weight="bold" fill="#253440">“It's a hydration</text>
  <text x="641" y="168" text-anchor="middle" font-size="18" font-weight="bold" fill="#253440">pouch.”</text>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="499" width="800" height="101" fill="#fff5dc"/>
  <text x="400" y="533" text-anchor="middle" font-size="22" font-weight="bold" fill="#253440">He cycles to work. His lunch carpools.</text>
  <path d="M105 551H695" stroke="#d8cbaa" stroke-width="2"/>
  <text x="400" y="579" text-anchor="middle" font-size="17" fill="#445560">2026-10-25 10:30:02 SGT (UTC+08:00)</text>
</svg>