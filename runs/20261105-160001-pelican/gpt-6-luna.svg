<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Beakdown Lane</title>
  <desc id="desc">A smug pelican pedals a bicycle while carrying an absurdly large fish in its beak.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke: #183744; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: view-box; transform-origin: 260px 390px; animation: spin 2.4s linear infinite; }
      .wheel.rear { transform-origin: 540px 390px; }
      .rider { transform-box: view-box; transform-origin: 405px 340px; animation: bob .6s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-5px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#c8eff0"/>
  <path d="M0 0H800V332Q610 300 420 332T0 326Z" fill="#f9dc8b"/>
  <circle cx="690" cy="102" r="42" fill="#ff9e62"/>
  <path d="M0 339Q190 325 390 344T800 334V494H0Z" fill="#85c9a5"/>
  <path d="M0 436Q180 425 370 441T800 431V504H0Z" fill="#5aa98d"/>
  <path d="M0 477H800" stroke="#244e54" stroke-width="9"/>
  <path d="M0 484H800" stroke="#fff2c5" stroke-width="3" stroke-dasharray="28 22"/>

  <text x="36" y="58" font-size="34" font-weight="900" fill="#173c49">THE BEAKDOWN LANE</text>
  <text x="39" y="86" font-size="16" font-weight="700" fill="#27545b">“I’m not late. I’m making excellent time.”</text>

  <!-- Floating traffic sign -->
  <g transform="rotate(-7 102 214)">
    <path d="M102 252V300" stroke="#42615c" stroke-width="8"/>
    <rect x="36" y="173" width="133" height="81" rx="12" fill="#fff7d7" class="ink"/>
    <text x="102" y="201" text-anchor="middle" font-size="13" font-weight="900" fill="#1c4049">BIKE LANE</text>
    <text x="102" y="226" text-anchor="middle" font-size="13" font-weight="900" fill="#1c4049">NO FISHING</text>
    <path d="M51 237L151 190" stroke="#e35d54" stroke-width="5"/>
  </g>

  <!-- Bicycle wheels -->
  <g class="wheel">
    <circle cx="260" cy="390" r="62" fill="#f7f6e8" stroke="#173c49" stroke-width="8"/>
    <circle cx="260" cy="390" r="7" fill="#f08653"/>
    <path d="M260 328V452M198 390H322M216 346L304 434M304 346L216 434" stroke="#4e8790" stroke-width="3"/>
  </g>
  <g class="wheel rear">
    <circle cx="540" cy="390" r="62" fill="#f7f6e8" stroke="#173c49" stroke-width="8"/>
    <circle cx="540" cy="390" r="7" fill="#f08653"/>
    <path d="M540 328V452M478 390H602M496 346L584 434M584 346L496 434" stroke="#4e8790" stroke-width="3"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M260 390L348 390L405 300L260 390M348 390L461 390L405 300L540 390"/>
    <path d="M405 300L393 274M379 274H414"/>
    <path d="M461 390L480 307M462 307H500"/>
    <path d="M375 277L405 300" stroke-width="8"/>
  </g>
  <circle cx="348" cy="390" r="19" fill="#ffb84e" class="ink"/>
  <circle cx="348" cy="390" r="6" fill="#183744"/>
  <path d="M348 390L332 364M348 390L365 416" class="ink" fill="none"/>
  <path d="M374 274Q397 260 421 274" fill="none" stroke="#ec684b" stroke-width="10" stroke-linecap="round"/>
  <path d="M490 297Q515 286 534 301" fill="none" stroke="#ec684b" stroke-width="10" stroke-linecap="round"/>

  <!-- Pelican and pedaling motion -->
  <g class="rider">
    <!-- tail and body -->
    <path d="M364 278Q339 263 326 279Q333 294 361 291Z" fill="#f4f0da" class="ink"/>
    <ellipse cx="394" cy="267" rx="47" ry="35" fill="#f7f3e4" class="ink"/>
    <path d="M380 272Q397 249 418 267Q406 286 381 282Z" fill="#83bdc1" stroke="#183744" stroke-width="4"/>
    <!-- neck -->
    <path d="M418 261Q433 235 426 208Q422 193 434 183" fill="none" stroke="#f7f3e4" stroke-width="20" stroke-linecap="round"/>
    <path d="M418 261Q433 235 426 208Q422 193 434 183" fill="none" stroke="#183744" stroke-width="5" stroke-linecap="round"/>
    <!-- head -->
    <ellipse cx="444" cy="171" rx="31" ry="25" fill="#f7f3e4" class="ink"/>
    <path d="M420 181Q390 188 356 177Q389 170 422 166Z" fill="#f3a44a" class="ink"/>
    <path d="M356 177Q378 184 398 181Q388 198 366 192Z" fill="#ee765d" stroke="#183744" stroke-width="4"/>
    <circle cx="454" cy="165" r="4.5" fill="#183744"/>
    <path d="M430 151Q444 141 459 150" fill="none" stroke="#183744" stroke-width="4"/>
    <path d="M433 178Q447 185 459 176" fill="none" stroke="#f6bb56" stroke-width="4"/>
    <!-- helmet -->
    <path d="M415 160Q420 132 447 130Q469 132 476 158Z" fill="#ed6655" class="ink"/>
    <path d="M409 160H480" stroke="#183744" stroke-width="5" stroke-linecap="round"/>
    <path d="M440 134L444 157" stroke="#ffd381" stroke-width="4"/>
    <!-- legs on pedals -->
    <path d="M386 286Q366 310 348 390" fill="none" stroke="#f7f3e4" stroke-width="13" stroke-linecap="round"/>
    <path d="M411 286Q432 322 365 416" fill="none" stroke="#f7f3e4" stroke-width="13" stroke-linecap="round"/>
    <path d="M386 286Q366 310 348 390M411 286Q432 322 365 416" fill="none" stroke="#183744" stroke-width="4" stroke-linecap="round"/>
    <!-- wing gripping handlebars -->
    <path d="M391 263Q416 269 432 298L482 307" fill="none" stroke="#f7f3e4" stroke-width="14" stroke-linecap="round"/>
    <path d="M391 263Q416 269 432 298L482 307" fill="none" stroke="#183744" stroke-width="4" stroke-linecap="round"/>
    <path d="M477 302Q485 299 489 305" fill="none" stroke="#f3a44a" stroke-width="9" stroke-linecap="round"/>
    <!-- absurd fish cargo -->
    <path d="M479 225Q505 207 535 224Q508 242 479 225Z" fill="#8ec9d0" class="ink"/>
    <path d="M535 224L553 211L551 237Z" fill="#f3a44a" class="ink"/>
    <circle cx="491" cy="222" r="3.5" fill="#183744"/>
    <path d="M501 214Q508 224 501 234" fill="none" stroke="#4e8790" stroke-width="3"/>
  </g>

  <path d="M553 209Q574 194 590 208M558 231Q579 239 593 227" fill="none" stroke="#183744" stroke-width="3" stroke-linecap="round"/>
  <text x="596" y="205" font-size="13" font-weight="900" fill="#173c49">HONK IF</text>
  <text x="596" y="222" font-size="13" font-weight="900" fill="#173c49">YOU’RE A FISH</text>

  <rect x="213" y="468" width="384" height="35" rx="17" fill="#fff7d7" stroke="#183744" stroke-width="3"/>
  <text x="405" y="491" text-anchor="middle" font-size="15" font-weight="800" fill="#173c49">Local bird insists the pannier is “just a very long lunch.”</text>

  <path d="M20 521H780" stroke="#173c49" stroke-width="2" opacity=".28"/>
  <text x="400" y="559" text-anchor="middle" font-size="16" font-weight="700" fill="#173c49">2026-11-05 16:02:56 SGT (UTC+08:00)</text>
</svg>