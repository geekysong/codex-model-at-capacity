<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Bill Power: a pelican riding a bicycle</title>
  <desc id="desc">A proud pelican pedals a tiny bicycle with an enormous fish-filled bill. The wheels spin, the pedals turn, and the pelican bobs. Caption: Zero emissions. Enormous overhead.</desc>
  <defs>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#253b42" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#fff4d9"/>
  <rect width="800" height="600" fill="url(#grain)"/>
  <path d="M32 109H768" stroke="#243c43" stroke-width="3"/>
  <text x="400" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="49" font-weight="900" letter-spacing="5" fill="#203b42">BILL POWER</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#56716f">THE FUTURE OF PERSONAL TRANSPORT</text>

  <!-- One continuous seaside cycling scene -->
  <circle cx="692" cy="169" r="36" fill="#f6cb5b"/>
  <path d="M32 346Q150 318 267 344T503 340T768 333V461H32Z" fill="#c8e3d7"/>
  <path d="M32 373Q194 351 323 376T594 371T768 367" fill="none" stroke="#93c3b7" stroke-width="3"/>
  <path d="M99 176q12-14 24 0q12-14 24 0M573 150q9-10 18 0q9-10 18 0" fill="none" stroke="#597b79" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 461H768" stroke="#263d43" stroke-width="4"/>
  <ellipse cx="421" cy="466" rx="245" ry="11" fill="#263d43" opacity=".12"/>

  <!-- Bicycle wheels -->
  <g fill="#fff6df" stroke="#243b43">
    <circle cx="264" cy="387" r="73" stroke-width="10"/>
    <circle cx="582" cy="387" r="73" stroke-width="10"/>
  </g>
  <g transform="translate(264 387)" stroke="#77918e" stroke-width="3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
      <path d="M-61-20A64 64 0 0 1-43-47" fill="none" stroke="#efaa37" stroke-width="6"/>
    </g>
  </g>
  <g transform="translate(582 387)" stroke="#77918e" stroke-width="3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
      <path d="M-61-20A64 64 0 0 1-43-47" fill="none" stroke="#efaa37" stroke-width="6"/>
    </g>
  </g>

  <!-- Comically undersized frame -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M264 387L329 289L396 387ZM329 289H530L396 387M530 289L582 387" stroke="#243b43" stroke-width="12"/>
    <path d="M264 387L329 289L396 387ZM329 289H530L396 387M530 289L582 387" stroke="#e76850" stroke-width="7"/>
    <path d="M329 289L319 267M530 289L514 253L544 241" stroke="#243b43" stroke-width="8"/>
    <path d="M299 266H345M539 241H557" stroke="#243b43" stroke-width="12"/>
    <path d="M264 387L396 387" stroke="#243b43" stroke-width="3"/>
  </g>
  <g fill="#f6c352" stroke="#243b43" stroke-width="3">
    <circle cx="264" cy="387" r="7"/>
    <circle cx="582" cy="387" r="7"/>
  </g>

  <!-- Rider, neck, and fabulously impractical cargo bill -->
  <g stroke="#243b43" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M339 273Q350 314 389 355" fill="none" stroke="#dba345" stroke-width="12"/>
    <path d="M298 214L258 190L275 233L251 227L291 253" fill="#fffdf0"/>
    <path d="M289 222Q289 191 329 190Q365 190 387 228Q406 252 384 274Q349 292 313 271Q289 255 289 222" fill="#fffdf0"/>
    <path d="M359 244Q382 226 387 191L390 164Q391 140 416 140Q445 142 446 164Q445 186 424 202L422 236Q416 273 379 279" fill="#fffdf0"/>
    <path d="M309 218Q344 205 371 250Q337 267 309 218Z" fill="#d8e0d5"/>
    <path d="M321 226L350 246M332 220L360 243" fill="none" stroke="#9fb4aa" stroke-width="3"/>
    <!-- Wing gripping the bars -->
    <path d="M364 234Q420 270 468 255L540 242" fill="none" stroke="#243b43" stroke-width="15"/>
    <path d="M364 234Q420 270 468 255L540 242" fill="none" stroke="#fffdf0" stroke-width="9"/>
    <!-- Pouch and bill -->
    <path d="M437 178L697 187Q677 259 576 257Q489 255 437 178Z" fill="#f5bd59"/>
    <path d="M442 165L710 180Q713 185 695 193L441 186Z" fill="#f3a442"/>
    <path d="M469 194Q520 239 577 240" fill="none" stroke="#d5913c" stroke-width="3"/>
    <!-- Fish peeking from the cargo hold -->
    <path d="M578 179Q602 151 638 171L654 157L651 181Z" fill="#71b5b5" stroke-width="3"/>
    <circle cx="601" cy="169" r="3" fill="#243b43" stroke="none"/>
    <path d="M614 170L626 178" fill="none" stroke-width="2"/>
    <!-- Face -->
    <ellipse cx="425" cy="163" rx="10" ry="13" fill="white" stroke-width="2"/>
    <circle cx="429" cy="162" r="4" fill="#243b43" stroke="none"/>
    <path d="M416 145L432 143" fill="none" stroke-width="4"/>
    <!-- Helmet -->
    <path d="M382 145Q383 119 411 119Q438 120 443 142Z" fill="#e76850"/>
    <path d="M399 124L395 139M415 124L414 139M431 128L432 139" fill="none" stroke-width="3"/>
    <path d="M390 146Q393 179 414 184" fill="none" stroke-width="3"/>
    <!-- Windblown necktie -->
    <path d="M391 202L371 204L354 186L325 184L345 208L374 216L393 208Z" fill="#e76850" stroke-width="2"/>
  </g>

  <!-- Pedaling leg and rotating crank -->
  <path d="M361 278L373 315" stroke="#edb248" stroke-width="12" stroke-linecap="round"/>
  <path fill="none" stroke="#edb248" stroke-width="11" stroke-linecap="round">
    <animate attributeName="d" values="M373 315L404 338L422 387;M373 315L379 352L396 413;M373 315L354 345L370 387;M373 315L371 329L396 361;M373 315L404 338L422 387" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(396 387)">
    <g stroke="#243b43" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-26 0H26"/>
      <path d="M-26-8V8M26-8V8" stroke-width="8"/>
      <ellipse cx="26" cy="-4" rx="16" ry="7" fill="#efb446" stroke-width="2"/>
    </g>
    <circle r="9" fill="#fff4d9" stroke="#243b43" stroke-width="4"/>
  </g>

  <!-- Editorial gag -->
  <path d="M76 235Q66 235 66 224V192Q66 181 79 181H216Q229 181 229 194V224Q229 235 216 235H184L196 256L157 235Z" fill="white" stroke="#243b43" stroke-width="3"/>
  <text x="147" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#243b43">
    <tspan x="147">“I expense it</tspan>
    <tspan x="147" dy="19">as a company bill.”</tspan>
  </text>
  <g fill="none" stroke="#597b79" stroke-width="3" stroke-linecap="round">
    <path d="M173 322H207M162 336H193M159 350H183"/>
  </g>

  <!-- Spacious, static caption and timestamp footer -->
  <rect x="32" y="493" width="736" height="82" rx="10" fill="#203b42"/>
  <text x="400" y="525" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#fff4d9">Zero emissions. Enormous overhead.</text>
  <text x="400" y="557" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#c9e3d6">2026-11-05 16:00:01 SGT (UTC+08:00)</text>
</svg>