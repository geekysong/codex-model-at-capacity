<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a bicycle along the waterfront, carrying fish in its enormous bill beneath a sign banning fishing. The wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
    <pattern id="water" width="80" height="24" patternUnits="userSpaceOnUse">
      <path d="M4 13q13-8 26 0t26 0" fill="none" stroke="#8dc9cb" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff8e7"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="none" stroke="#243746" stroke-width="4"/>

  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="3" fill="#243746">TOUR DE BEAK</text>
  <text x="400" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#526775">The waterfront’s least aerodynamic athlete.</text>

  <circle cx="687" cy="164" r="32" fill="#ffd66c"/>
  <path d="M40 299Q160 277 278 301T520 299T760 300V397H40Z" fill="#bce2df"/>
  <path d="M40 314H760V397H40Z" fill="url(#water)"/>
  <path d="M55 218q12-14 24 0q12-14 24 0M631 233q10-12 20 0q10-12 20 0" fill="none" stroke="#708b95" stroke-width="3" stroke-linecap="round"/>

  <path d="M40 398H760V485H40Z" fill="#e4d4b6"/>
  <path d="M40 398H760" stroke="#243746" stroke-width="5"/>
  <path d="M72 467H160M630 467H726" stroke="#fff8e7" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="391" cy="456" rx="225" ry="13" fill="#b6a789" opacity=".42"/>

  <!-- An inconvenient rule, creatively interpreted. -->
  <path d="M690 279V397" stroke="#586874" stroke-width="8"/>
  <rect x="624" y="238" width="132" height="66" rx="7" fill="#fffdf6" stroke="#243746" stroke-width="3"/>
  <text x="690" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c5493d">NO FISHING</text>
  <text x="690" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#243746">CYCLISTS WELCOME</text>

  <!-- Speech balloon stays still for easy reading. -->
  <path d="M83 126H335Q352 126 352 143V192Q352 209 335 209H255L275 237L228 209H83Q66 209 66 192V143Q66 126 83 126Z" fill="#fff" stroke="#243746" stroke-width="3"/>
  <text x="209" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243746">“It’s not fishing.</text>
  <text x="209" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243746">It’s meal delivery.”</text>

  <!-- Bicycle wheels: rotating spokes inside fixed tires. -->
  <g fill="#fffaf0" stroke="#243746" stroke-width="8">
    <circle cx="253" cy="401" r="66"/>
    <circle cx="551" cy="401" r="66"/>
  </g>
  <g fill="none" stroke="#8a9da2" stroke-width="2.5">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 253 401" to="360 253 401" dur="1.6s" repeatCount="indefinite"/>
      <path d="M253 339V463M191 401H315M209 357L297 445M209 445L297 357"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 551 401" to="360 551 401" dur="1.6s" repeatCount="indefinite"/>
      <path d="M551 339V463M489 401H613M507 357L595 445M507 445L595 357"/>
    </g>
  </g>
  <g fill="none" stroke="#dc5848" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M253 401L326 316L389 401Z"/>
    <path d="M326 316H497L389 401M497 316L551 401"/>
    <path d="M326 316L315 289M497 316L486 279L512 265H537"/>
  </g>
  <path d="M295 289H338" stroke="#243746" stroke-width="12" stroke-linecap="round"/>
  <path d="M522 265H541" stroke="#243746" stroke-width="10" stroke-linecap="round"/>
  <circle cx="253" cy="401" r="7" fill="#243746"/>
  <circle cx="551" cy="401" r="7" fill="#243746"/>
  <circle cx="389" cy="401" r="17" fill="#f4c859" stroke="#243746" stroke-width="4"/>

  <!-- The rider and webbed-foot pedaling loop. -->
  <g stroke="#243746" stroke-width="3.5" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>

    <path d="M350 301Q367 334 416 360L405 382" fill="none" stroke="#c28b35" stroke-width="10" stroke-linecap="round">
      <animate attributeName="d" values="M350 301Q367 334 416 360L405 382;M350 301Q362 345 387 368L373 418;M350 301Q367 334 416 360L405 382" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <path d="M285 263L251 275L283 286" fill="#dce4df"/>
    <path d="M282 263Q274 211 321 201Q363 194 389 228Q405 247 386 279Q372 306 323 302Q285 300 282 263Z" fill="#fffdf4"/>
    <path d="M310 231Q345 221 368 250Q344 281 301 272Q326 258 310 231Z" fill="#d8e2de"/>
    <path d="M362 226Q391 213 401 180Q407 150 430 146Q460 141 465 169Q468 193 446 207L418 261Q411 280 384 279" fill="#fffdf4"/>
    <path d="M400 252Q446 267 492 267" fill="none" stroke="#243746" stroke-width="5" stroke-linecap="round"/>
    <path d="M491 261L506 265L493 273" fill="#fffdf4"/>

    <!-- Comically oversized bill and bulging fish pouch. -->
    <path d="M453 177L625 190Q606 235 540 249Q490 254 449 199Z" fill="#f4bf51"/>
    <path d="M455 177L632 186L625 197L451 191Z" fill="#f6a443"/>
    <path d="M474 204Q529 235 589 207" fill="none" stroke="#d78f35" stroke-width="2.5"/>
    <g fill="#88b8b6" stroke-width="2">
      <path d="M501 215Q515 198 535 213L547 205V225L535 217Q516 232 501 215Z"/>
      <path d="M550 225Q564 210 580 222L590 215V232L580 226Q564 239 550 225Z"/>
    </g>
    <g fill="#243746" stroke="none">
      <circle cx="510" cy="213" r="2"/>
      <circle cx="557" cy="222" r="2"/>
    </g>

    <circle cx="444" cy="169" r="12" fill="#fff"/>
    <circle cx="449" cy="170" r="5" fill="#243746" stroke="none"/>
    <path d="M432 150L452 155" fill="none" stroke-width="4" stroke-linecap="round"/>

    <!-- Tiny racing helmet and dramatic scarf. -->
    <path d="M414 147Q427 122 452 137L464 151Z" fill="#dc5848"/>
    <path d="M432 134L427 147M444 136L442 149" fill="none" stroke="#fff8e7" stroke-width="3"/>
    <path d="M402 207L418 215L410 228L396 220Z" fill="#dc5848"/>
    <path d="M399 213Q370 203 350 219L363 224L350 234Q382 235 405 220" fill="#dc5848"/>

    <path d="M333 293Q321 330 365 349L405 382" fill="none" stroke="#e6a63d" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" values="M333 293Q321 330 365 349L405 382;M333 293Q316 330 343 364L373 418;M333 293Q321 330 365 349L405 382" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M397 377L422 379L430 389L394 389Z" fill="#f4b848">
      <animateTransform attributeName="transform" type="translate" values="0 0;-32 36;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g stroke="#243746" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 389 401" to="360 389 401" dur="1.6s" repeatCount="indefinite"/>
    <path d="M373 419L405 383"/>
    <path d="M363 419H383M395 383H415"/>
  </g>

  <path d="M185 336L163 332M180 350H150M187 364L166 370" stroke="#708b95" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#243746">He carb-loads. The carbs are all fish.</text>
  <path d="M52 537H748" stroke="#cbbb9c" stroke-width="2"/>
  <text x="400" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#354d5b">2026-10-31 00:31:34 SGT (UTC+08:00)</text>
</svg>