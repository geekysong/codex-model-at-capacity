<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Patrol</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly delivering absolutely nothing.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#626b78"/>
      <stop offset="1" stop-color="#303641"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .rider{animation:bob .8s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 355 Q130 290 260 350 T520 345 T800 330 V430 H0Z" fill="#9bc77b"/>
  <path d="M0 405 Q170 370 330 410 T800 390 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 H800" stroke="#f6d365" stroke-width="10" stroke-dasharray="55 35"/>

  <g aria-label="title and caption">
    <rect x="34" y="28" width="732" height="96" rx="22" fill="#fff8df" class="ink" filter="url(#shadow)"/>
    <text x="400" y="72" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN PEDAL PATROL</text>
    <text x="400" y="103" text-anchor="middle" class="label" font-size="17" font-weight="700">“Delivering big beaks, bigger promises, and absolutely no mail.”</text>
  </g>

  <g class="rider" filter="url(#shadow)">
    <!-- bicycle frame -->
    <g aria-label="bicycle">
      <circle cx="252" cy="447" r="72" fill="none" stroke="#17202a" stroke-width="10"/>
      <circle cx="590" cy="447" r="72" fill="none" stroke="#17202a" stroke-width="10"/>
      <g class="wheel">
        <circle cx="252" cy="447" r="62" fill="none" stroke="#f4f7fa" stroke-width="3"/>
        <path d="M252 375V519M180 447H324M201 396L303 498M303 396L201 498" stroke="#dbe4ec" stroke-width="3"/>
      </g>
      <g class="wheel">
        <circle cx="590" cy="447" r="62" fill="none" stroke="#f4f7fa" stroke-width="3"/>
        <path d="M590 375V519M518 447H662M539 396L641 498M641 396L539 498" stroke="#dbe4ec" stroke-width="3"/>
      </g>
      <path d="M252 447 L350 355 L465 447 L252 447 M350 355 L390 447 M465 447 L520 350" fill="none" stroke="#ef5b5b" stroke-width="12"/>
      <path d="M520 350 L570 350" stroke="#17202a" stroke-width="9"/>
      <path d="M340 350 L310 340" stroke="#17202a" stroke-width="9"/>
      <circle cx="390" cy="447" r="18" fill="#f4c542" class="ink"/>
      <path d="M390 447 l-35 20 M390 447 l28 24" stroke="#17202a" stroke-width="7"/>
      <path d="M355 467 h-28 M418 471 h28" stroke="#17202a" stroke-width="7"/>
      <path d="M520 350 Q545 318 570 350" fill="none" stroke="#17202a" stroke-width="7"/>
    </g>

    <!-- pelican -->
    <g aria-label="pelican">
      <ellipse cx="396" cy="286" rx="84" ry="105" fill="#f4f1e8" class="ink"/>
      <path d="M342 293 Q365 255 414 268 Q447 279 458 322 Q420 347 371 335Z" fill="#d9e2e8" class="ink"/>
      <path d="M438 219 Q493 190 552 228 Q574 242 557 258 Q495 270 440 253Z" fill="#f0a23b" class="ink"/>
      <path d="M552 228 Q594 242 618 265 Q582 282 550 258Z" fill="#e47d2f" class="ink"/>
      <circle cx="450" cy="218" r="10" fill="#17202a"/>
      <path d="M374 210 Q346 172 376 145 Q405 123 431 151 Q444 169 431 196" fill="#f4f1e8" class="ink"/>
      <path d="M377 147 Q391 128 412 143" fill="none" stroke="#f4c542" stroke-width="10"/>
      <path d="M374 320 Q350 370 329 402" fill="none" stroke="#ef5b5b" stroke-width="12"/>
      <path d="M430 325 Q450 370 471 402" fill="none" stroke="#ef5b5b" stroke-width="12"/>
      <path d="M329 402 l-22 18 M471 402 l23 18" stroke="#17202a" stroke-width="8"/>
      <path d="M360 260 Q390 245 417 260" fill="none" stroke="#17202a" stroke-width="5"/>
      <path d="M338 285 Q310 275 292 291 Q315 304 343 301" fill="#f4c542" class="ink"/>
      <path d="M397 367 Q426 378 448 362" fill="none" stroke="#17202a" stroke-width="5"/>
      <path d="M404 378 Q430 393 455 378" fill="none" stroke="#17202a" stroke-width="5"/>
    </g>

    <!-- satirical placard -->
    <g transform="rotate(-7 610 295)">
      <rect x="574" y="265" width="150" height="78" rx="10" fill="#fff8df" class="ink"/>
      <text x="649" y="294" text-anchor="middle" class="label" font-size="16" font-weight="900">MAKE</text>
      <text x="649" y="315" text-anchor="middle" class="label" font-size="16" font-weight="900">WADDLE</text>
      <text x="649" y="336" text-anchor="middle" class="label" font-size="16" font-weight="900">GREAT</text>
      <path d="M574 304 L540 318" stroke="#17202a" stroke-width="7"/>
    </g>
  </g>

  <g aria-label="footer">
    <rect x="34" y="548" width="732" height="38" rx="12" fill="#fff8df" class="ink"/>
    <text x="400" y="574" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 12:30:01 SGT (UTC+08:00)</text>
  </g>
</svg>