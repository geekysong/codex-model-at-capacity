<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle of Power</title>
  <desc id="desc">A proud pelican pedals a bicycle while a tiny fish files a complaint.</desc>
  <defs>
    <style>
      .ink{stroke:#17324d;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .7s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>
  <rect width="800" height="600" fill="#d9f3f2"/>
  <circle cx="670" cy="105" r="48" fill="#ffd166"/>
  <path d="M0 390Q120 340 240 390T480 380T800 385V600H0Z" fill="#a8d8a0"/>
  <path d="M0 460Q150 440 300 465T600 455T800 460V600H0Z" fill="#79bd83"/>
  <text x="400" y="54" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="31" font-weight="900" fill="#17324d">THE PELICAN CYCLE OF POWER</text>
  <text x="400" y="83" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="17" font-weight="700" fill="#365b6d">“On the bright side, the commute is mostly fish.”</text>

  <!-- bicycle -->
  <g fill="none" class="ink" stroke-width="7">
    <g class="wheel">
      <circle cx="225" cy="408" r="66" stroke="#17324d" fill="#f8fbf8"/>
      <path d="M225 342V474M159 408H291M178 361L272 455M272 361L178 455" stroke="#76a6af" stroke-width="3"/>
      <circle cx="225" cy="408" r="7" fill="#ef6b55" stroke="#17324d" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="575" cy="408" r="66" stroke="#17324d" fill="#f8fbf8"/>
      <path d="M575 342V474M509 408H641M528 361L622 455M622 361L528 455" stroke="#76a6af" stroke-width="3"/>
      <circle cx="575" cy="408" r="7" fill="#ef6b55" stroke="#17324d" stroke-width="4"/>
    </g>
    <path d="M225 408L345 408L405 315L475 408L345 408L318 350M405 315L438 315M475 408L575 408" stroke="#e84f3d" stroke-width="10"/>
    <path d="M302 345L334 345M422 312L449 312M575 408L590 388L610 388" stroke-width="6"/>
  </g>
  <circle cx="345" cy="408" r="13" fill="#ffd166" class="ink" stroke-width="4"/>
  <path d="M345 408L374 431M345 408L316 386M367 434L382 430M309 383L324 380" class="ink" fill="none" stroke-width="5"/>

  <!-- expressive pelican -->
  <g class="rider">
    <path d="M334 218Q335 165 384 148Q432 139 453 184Q463 209 443 244L417 281L352 269Z" fill="#fffdf5" class="ink" stroke-width="5"/>
    <path d="M352 265Q378 277 412 274L404 315L363 315Z" fill="#ef6b55" class="ink" stroke-width="4"/>
    <path d="M373 188Q390 170 415 184Q434 195 429 219Q423 246 395 251Q368 245 365 219Z" fill="#fffdf5" class="ink" stroke-width="4"/>
    <path d="M410 204Q461 195 511 216Q519 222 509 230Q465 240 417 226Z" fill="#f4a62a" class="ink" stroke-width="4"/>
    <path d="M426 225Q464 238 502 230Q486 258 445 257Q426 251 426 225Z" fill="#ef6b55" class="ink" stroke-width="4"/>
    <circle cx="413" cy="199" r="5" fill="#17324d"/>
    <path d="M385 183Q395 175 404 183" fill="none" class="ink" stroke-width="3"/>
    <!-- helmet -->
    <path d="M358 180Q362 150 393 145Q420 146 432 173L359 184Z" fill="#55b7bd" class="ink" stroke-width="4"/>
    <path d="M356 182L436 176" class="ink" fill="none" stroke-width="5"/>
    <!-- wings on handlebars -->
    <path d="M371 255Q338 274 325 306Q346 300 364 292Q350 312 347 326Q377 310 392 282Z" fill="#fffdf5" class="ink" stroke-width="4"/>
    <path d="M348 300L370 286M355 311L375 294" class="ink" fill="none" stroke-width="2"/>
    <!-- legs -->
    <path d="M378 306L349 346L345 397M404 305L423 343L350 400" fill="none" class="ink" stroke-width="8"/>
    <path d="M333 398L356 398M338 404L360 404M340 411L363 411" class="ink" fill="none" stroke-width="4"/>
    <!-- necktie -->
    <path d="M389 268L403 273L397 287L407 301L390 307L382 290L390 279Z" fill="#ffd166" class="ink" stroke-width="3"/>
  </g>

  <!-- tiny disgruntled fish in the beak pouch -->
  <g transform="translate(454 235)">
    <path d="M0 0Q18 -18 38 0Q18 18 0 0Z" fill="#7dd3c7" class="ink" stroke-width="3"/>
    <path d="M0 0L-12 -10L-12 10Z" fill="#f4a62a" class="ink" stroke-width="3"/>
    <circle cx="27" cy="-3" r="2.5" fill="#17324d"/>
    <path d="M10 6Q17 12 23 7" fill="none" class="ink" stroke-width="2"/>
  </g>
  <path d="M493 223Q520 202 538 216" fill="none" stroke="#17324d" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="541" y="215" font-family="Trebuchet MS, sans-serif" font-size="14" font-weight="700" fill="#17324d">I demand a seat!</text>

  <!-- little sign -->
  <path d="M91 337V430M64 338H143V383H64Z" fill="#fff4d6" class="ink" stroke-width="4"/>
  <text x="103" y="357" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="12" font-weight="900" fill="#17324d">BIKE LANE</text>
  <text x="103" y="375" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="700" fill="#e84f3d">BEAKS ONLY</text>

  <path d="M0 500H800" stroke="#17324d" stroke-width="3" opacity=".35"/>
  <rect x="0" y="520" width="800" height="80" fill="#17324d"/>
  <text x="400" y="555" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="18" font-weight="700" fill="#fffdf5">A bird of few gears, and one very passenger-minded beak.</text>
  <text x="400" y="584" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="14" font-weight="600" fill="#ffd166">2026-11-02 00:02:35 SGT (UTC+08:00)</text>
</svg>