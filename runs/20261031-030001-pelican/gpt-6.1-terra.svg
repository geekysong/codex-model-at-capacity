<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDAL POWER</title>
  <desc id="desc">A pelican pedals a bicycle along a seaside road, carrying a fish in its enormous beak.</desc>
  <defs>
    <style>
      .ink { stroke:#24313a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 1s ease-in-out infinite alternate; }
      .pedals { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedals { animation:none; } }
    </style>
    <pattern id="road" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 30h17 M30 10h10" stroke="#bcc6bf" stroke-width="2" opacity=".45"/>
    </pattern>
  </defs>

