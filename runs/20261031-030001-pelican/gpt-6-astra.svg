<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A smug pelican pedals a bicycle with an enormous fish-filled bill. The wheels spin, its feet pedal, and its body bobs. A roadside sign promises payment in exposure.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#e7ddc7" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "Trebuchet MS", Arial, sans-serif; }
    .outline { stroke:#203743; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .spoke { stroke:#718f99; stroke-width:3; }
  </style>

  <rect width="800" height="600" fill="#fff5dc"/>
  <path d="M0 129Q200 100 400 129T800 125V486H0Z" fill="#d7edf0"/>
  <circle cx="695" cy="180" r="37" fill="#ffd16c"/>
  <g fill="#fff" opacity=".8">
    <path d="M42 206Q36 186 58 184Q70 155 92 181Q117 177 122 206Z"/>
    <path d="M560 157Q558 141 576 141Q588 122 606 143Q629 140 630 157Z"/>
  </g>

  <text x="400" y="53" text-anchor="middle" font-size="37" font-weight="900" fill="#203743">THE PELICAN DELIVERY ECONOMY</text>
  <text x="400" y="87" text-anchor="middle" font-size="19" fill="#50626a">ZERO EMISSIONS. OUTRAGEOUS BILL.</text>

  <path d="M0 437Q180 416 360 438T800 429V492H0Z" fill="#aac39c"/>
  <path d="M0 460H800V509H0Z" fill="#b4b6ad"/>
  <path d="M20 484H115M151 484H246M282 484H377M413 484H508M544 484H639M675 484H770" stroke="#f9f1d9" stroke-width="5"/>

  <g class="outline">
    <path d="M691 330V450" fill="none" stroke="#7c6954"/>
    <rect x="612" y="267" width="160" height="88" rx="8" fill="#fff5dc"/>
  </g>
  <text x="692" y="293" text-anchor="middle" font-size="16" font-weight="bold" fill="#203743">NOW HIRING!</text>
  <text x="692" y="318" text-anchor="middle" font-size="15" fill="#203743">Paid in exposure.</text>
  <text x="692" y="341" text-anchor="middle" font-size="13" font-style="italic" fill="#6a7779">Bring your own wings.</text>

  <ellipse cx="355" cy="463" rx="246" ry="13" fill="#203743" opacity=".14"/>

  <!-- Wheel hubs stay fixed while the spokes and reflective dots rotate. -->
  <g transform="translate(209 393)">
    <circle r="72" fill="#eff8ed" class="outline" stroke-width="9"/>
    <circle r="62" fill="none" stroke="#fff5dc" stroke-width="4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44M-57-24L57 24M-24-57L24 57M-57 24L57-24M-24 57L24-57" class="spoke"/>
      <rect x="34" y="-5" width="16" height="10" rx="3" fill="#ffbd4b"/>
    </g>
    <circle r="9" fill="#203743"/>
  </g>
  <g transform="translate(505 393)">
    <circle r="72" fill="#eff8ed" class="outline" stroke-width="9"/>
    <circle r="62" fill="none" stroke="#fff5dc" stroke-width="4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44M-57-24L57 24M-24-57L24 57M-57 24L57-24M-24 57L24-57" class="spoke"/>
      <rect x="34" y="-5" width="16" height="10" rx="3" fill="#ffbd4b"/>
    </g>
    <circle r="9" fill="#203743"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M209 393L287 299L339 393ZM287 299H459L339 393M459 299L505 393" stroke="#203743" stroke-width="13"/>
    <path d="M209 393L287 299L339 393ZM287 299H459L339 393M459 299L505 393" stroke="#e96955" stroke-width="7"/>
    <path d="M287 299L277 276M459 299L446 263L470 245H490" stroke="#203743" stroke-width="8"/>
    <path d="M260 276H297" stroke="#203743" stroke-width="12"/>
    <path d="M209 393L339 381Q357 393 339 405Z" stroke="#596a6c" stroke-width="3"/>
  </g>

  <!-- Pelican and legs bob together above the bicycle frame. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>

    <path d="M310 273L318 327L359 366" fill="none" stroke="#203743" stroke-width="13" stroke-linecap="round"/>
    <path d="M310 273L318 327L359 366" fill="none" stroke="#e8a239" stroke-width="7" stroke-linecap="round"/>

    <path d="M253 232L209 215L223 249L195 244L238 270" fill="#fffdf2" class="outline"/>
    <path d="M245 213Q281 183 327 204Q350 200 352 172L348 142Q350 117 375 120Q403 123 400 151L391 211Q386 252 345 273Q287 300 249 272Q226 255 245 213Z" fill="#fffdf2" class="outline"/>
    <path d="M265 220Q301 202 332 222Q324 261 270 258L285 246L264 246" fill="#dae2df" class="outline"/>
    <path d="M337 221Q376 256 447 258L467 247" fill="none" stroke="#203743" stroke-width="13" stroke-linecap="round"/>
    <path d="M337 221Q376 256 447 258L467 247" fill="none" stroke="#fffdf2" stroke-width="7" stroke-linecap="round"/>

    <!-- An oversized transparent pouch reveals the cargo. -->
    <path d="M389 159L576 172Q543 239 428 215Q395 206 389 159Z" fill="#f8c166" class="outline"/>
    <path d="M435 190Q458 171 485 190L502 178V202L486 194Q458 211 435 190Z" fill="#78b7b8" stroke="#203743" stroke-width="3"/>
    <circle cx="447" cy="188" r="3" fill="#203743"/>
    <path d="M496 211Q513 193 534 202L549 191L546 211L532 207Q517 222 496 211Z" fill="#e7eee4" stroke="#203743" stroke-width="3"/>
    <circle cx="506" cy="207" r="2.5" fill="#203743"/>
    <path d="M389 151Q465 145 583 171L392 177Z" fill="#f4a63c" class="outline"/>
    <path d="M366 145L389 148" stroke="#203743" stroke-width="4" stroke-linecap="round"/>
    <circle cx="380" cy="151" r="4" fill="#203743"/>
    <path d="M357 133Q377 121 398 136" fill="none" stroke="#203743" stroke-width="5"/>

    <path d="M342 128Q343 102 373 102Q402 101 409 129Z" fill="#e96955" class="outline"/>
    <path d="M359 108L355 122M375 106V121M389 109L394 123" stroke="#fff5dc" stroke-width="5" stroke-linecap="round"/>
    <path d="M349 130L358 164L371 169" fill="none" stroke="#203743" stroke-width="3"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 285 271;9 285 271;-5 285 271" dur=".8s" repeatCount="indefinite"/>
      <path d="M285 271L273 324L323 375" fill="none" stroke="#203743" stroke-width="14" stroke-linecap="round"/>
      <path d="M285 271L273 324L323 375" fill="none" stroke="#f4ac40" stroke-width="8" stroke-linecap="round"/>
      <path d="M318 367L341 377L351 388L310 384Z" fill="#f4ac40" class="outline"/>
    </g>
  </g>

  <g transform="translate(339 393)">
    <circle r="16" fill="#fff5dc" class="outline"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-22-14L22 14" stroke="#203743" stroke-width="5"/>
      <path d="M-32-14H-12M12 14H32" stroke="#203743" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#e96955"/>
  </g>

  <path d="M146 310H188M130 331H177M147 352H173" stroke="#678f98" stroke-width="4" stroke-linecap="round"/>

  <rect x="0" y="510" width="800" height="90" fill="#fff5dc"/>
  <text x="400" y="541" text-anchor="middle" font-size="22" font-weight="bold" fill="#203743">“I deliver by bike. The bill still flies.”</text>
  <path d="M126 556H674" stroke="#c6bfae"/>
  <text x="400" y="582" text-anchor="middle" font-size="17" fill="#435762">2026-10-31 03:00:01 SGT (UTC+08:00)</text>
</svg>