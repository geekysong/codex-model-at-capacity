    <path d="M423 270L436 278L446 268" fill="none" class="outline"/>
    <path d="M319 303Q346 324 369 360L396 394" fill="none" stroke="#eda73c" stroke-width="12" stroke-linecap="round"/>
    <path d="M475 144Q490 135 484 126Q474 130 475 144" fill="#5bb9cc" stroke="#20323e" stroke-width="2"/>
  </g>

  <g class="pedals" stroke="#20323e" stroke-width="5" stroke-linecap="round">
    <path d="M359 421H407"/>
    <path d="M352 413V429M414 413V429" stroke-width="9"/>
    <path d="M350 411Q359 400 371 412Z" fill="#f5af3e" stroke-width="3"/>
    <path d="M395 431Q407 442 418 430Z" fill="#f5af3e" stroke-width="3"/>
  </g>

  <path d="M151 356H196M142 376H181M164 396H187" stroke="#71999b" stroke-width="4" stroke-linecap="round"/>
  <path d="M94 159Q88 141 111 138H291Q313 139 310 162V194Q310 213 288 213H205L185 234L189 213H111Q92 213 94 194Z" fill="#fffdf3" stroke="#20323e" stroke-width="3"/>
  <text x="202" y="169" text-anchor="middle" font-size="18" font-weight="bold" fill="#20323e">“My personal trainer</text>
  <text x="202" y="193" text-anchor="middle" font-size="18" font-weight="bold" fill="#20323e">said to eat on the go.”</text>

  <rect x="0" y="526" width="800" height="74" fill="#20323e"/>
  <text x="400" y="553" text-anchor="middle" font-size="19" font-weight="bold" fill="#fff5dc">This pelican’s cycling diet is mostly catch-and-roll.</text>
  <text x="400" y="581" text-anchor="middle" font-size="16" fill="#ffffff">2026-10-31 03:01:01 SGT (UTC+08:00)</text>
</svg>