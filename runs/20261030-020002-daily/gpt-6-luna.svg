<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down map of a five by five city grid with a shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4">
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">City block route map</text>

  <!-- Streets -->
  <g stroke="#aeb7c2" stroke-width="3" stroke-linecap="round">
    <path d="M100 70H500 M100 130H500 M100 190H500 M100 250H500 M100 310H500"/>
    <path d="M100 70V310 M200 70V310 M300 70V310 M400 70V310 M500 70V310"/>
  </g>

  <!-- Shortest path: 8 street segments -->
  <path d="M100 70H200 M200 70H300 M300 70H400 M400 70H500 M500 70V130 M500 130V190 M500 190V250 M500 250V310"
        fill="none" stroke="#1677e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections and labels -->
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <g fill="#fff" stroke="#7f8b99" stroke-width="2">
      <circle cx="100" cy="70" r="5"/><circle cx="200" cy="70" r="5"/><circle cx="300" cy="70" r="5"/><circle cx="400" cy="70" r="5"/><circle cx="500" cy="70" r="5"/>
      <circle cx="100" cy="130" r="5"/><circle cx="200" cy="130" r="5"/><circle cx="300" cy="130" r="5"/><circle cx="400" cy="130" r="5"/><circle cx="500" cy="130" r="5"/>
      <circle cx="100" cy="190" r="5"/><circle cx="200" cy="190" r="5"/><circle cx="300" cy="190" r="5"/><circle cx="400" cy="190" r="5"/><circle cx="500" cy="190" r="5"/>
      <circle cx="100" cy="250" r="5"/><circle cx="200" cy="250" r="5"/><circle cx="300" cy="250" r="5"/><circle cx="400" cy="250" r="5"/><circle cx="500" cy="250" r="5"/>
      <circle cx="100" cy="310" r="5"/><circle cx="200" cy="310" r="5"/><circle cx="300" cy="310" r="5"/><circle cx="400" cy="310" r="5"/><circle cx="500" cy="310" r="5"/>
    </g>
    <g fill="#333" stroke="none">
      <text x="100" y="54">A1</text><text x="200" y="54">B1</text><text x="300" y="54">C1</text><text x="400" y="54">D1</text><text x="500" y="54">E1</text>
      <text x="100" y="114">A2</text><text x="200" y="114">B2</text><text x="300" y="114">C2</text><text x="400" y="114">D2</text><text x="500" y="114">E2</text>
      <text x="100" y="174">A3</text><text x="200" y="174">B3</text><text x="300" y="174">C3</text><text x="400" y="174">D3</text><text x="500" y="174">E3</text>
      <text x="100" y="234">A4</text><text x="200" y="234">B4</text><text x="300" y="234">C4</text><text x="400" y="234">D4</text><text x="500" y="234">E4</text>
      <text x="100" y="294">A5</text><text x="200" y="294">B5</text><text x="300" y="294">C5</text><text x="400" y="294">D5</text><text x="500" y="294">E5</text>
    </g>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#d62728" stroke-width="5" stroke-linecap="round">
    <path d="M192 122L208 138 M208 122L192 138"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M392 242L408 258 M408 242L392 258"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="70" r="11" fill="#1b9e5a" stroke="#fff" stroke-width="3"/>
  <text x="100" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#167a43">START A1</text>
  <circle cx="500" cy="310" r="11" fill="#f39c12" stroke="#fff" stroke-width="3"/>
  <text x="500" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#a86300">END E5</text>

  <!-- Route summary and date footer -->
  <text x="300" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#145db2">Shortest route: 8 street segments</text>
  <text x="300" y="384" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333">2026-10-30 02:03:49 SGT (UTC+08:00)</text>
</svg>