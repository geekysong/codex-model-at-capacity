<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid route from A1 to E5</title>
  <desc id="desc">A five by five grid of intersections. The blue route travels from A1 across the top row to E1, then down to E5, avoiding blocked intersections B2, C3, and D4. The route has eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">City grid route</text>

  <g stroke="#cbd5e1" stroke-width="3" fill="none">
    <path d="M120 65H400 M120 125H400 M120 185H400 M120 245H400 M120 305H400"/>
    <path d="M120 65V305 M190 65V305 M260 65V305 M330 65V305 M400 65V305"/>
  </g>

  <path d="M120 65H400V305" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#475569">
    <circle cx="120" cy="65" r="4"/><circle cx="190" cy="65" r="4"/><circle cx="260" cy="65" r="4"/><circle cx="330" cy="65" r="4"/><circle cx="400" cy="65" r="4"/>
    <circle cx="120" cy="125" r="4"/><circle cx="190" cy="125" r="4"/><circle cx="260" cy="125" r="4"/><circle cx="330" cy="125" r="4"/><circle cx="400" cy="125" r="4"/>
    <circle cx="120" cy="185" r="4"/><circle cx="190" cy="185" r="4"/><circle cx="260" cy="185" r="4"/><circle cx="330" cy="185" r="4"/><circle cx="400" cy="185" r="4"/>
    <circle cx="120" cy="245" r="4"/><circle cx="190" cy="245" r="4"/><circle cx="260" cy="245" r="4"/><circle cx="330" cy="245" r="4"/><circle cx="400" cy="245" r="4"/>
    <circle cx="120" cy="305" r="4"/><circle cx="190" cy="305" r="4"/><circle cx="260" cy="305" r="4"/><circle cx="330" cy="305" r="4"/><circle cx="400" cy="305" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M183 118l14 14 M197 118l-14 14"/>
    <path d="M253 178l14 14 M267 178l-14 14"/>
    <path d="M323 238l14 14 M337 238l-14 14"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1e293b">
    <text x="120" y="53" text-anchor="middle">A1</text><text x="190" y="53" text-anchor="middle">B1</text><text x="260" y="53" text-anchor="middle">C1</text><text x="330" y="53" text-anchor="middle">D1</text><text x="400" y="53" text-anchor="middle">E1</text>
    <text x="120" y="113" text-anchor="middle">A2</text><text x="190" y="113" text-anchor="middle">B2</text><text x="260" y="113" text-anchor="middle">C2</text><text x="330" y="113" text-anchor="middle">D2</text><text x="400" y="113" text-anchor="middle">E2</text>
    <text x="120" y="173" text-anchor="middle">A3</text><text x="190" y="173" text-anchor="middle">B3</text><text x="260" y="173" text-anchor="middle">C3</text><text x="330" y="173" text-anchor="middle">D3</text><text x="400" y="173" text-anchor="middle">E3</text>
    <text x="120" y="233" text-anchor="middle">A4</text><text x="190" y="233" text-anchor="middle">B4</text><text x="260" y="233" text-anchor="middle">C4</text><text x="330" y="233" text-anchor="middle">D4</text><text x="400" y="233" text-anchor="middle">E4</text>
    <text x="120" y="293" text-anchor="middle">A5</text><text x="190" y="293" text-anchor="middle">B5</text><text x="260" y="293" text-anchor="middle">C5</text><text x="330" y="293" text-anchor="middle">D5</text><text x="400" y="293" text-anchor="middle">E5</text>
  </g>

  <circle cx="120" cy="65" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="400" cy="305" r="7" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="76" y="70" text-anchor="end" fill="#15803d">Start</text>
    <text x="420" y="310" fill="#6d28d9">End</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#1e293b">
    <text x="300" y="341" text-anchor="middle" font-weight="700">Route: 8 street segments</text>
    <text x="300" y="365" text-anchor="middle" font-size="12" fill="#64748b">Red X = blocked intersection</text>
  </g>
  <path d="M35 375H565" stroke="#cbd5e1"/>
  <text x="300" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">2026-10-30 02:04:02 SGT (UTC+08:00)</text>
</svg>