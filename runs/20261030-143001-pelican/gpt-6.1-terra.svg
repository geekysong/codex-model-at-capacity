<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A cheerful pelican pedals a bicycle with a fish passenger in its bill.</desc>
  <defs>
    <style>
      .ink{stroke:#24334a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#fffdf5;stroke:#24334a;stroke-width:9}
      .spoke{stroke:#9bb2bc;stroke-width:3}
      .label{font-family:Arial,sans-serif;fill:#24334a}
      .rider{animation:bob 1.1s ease-in-out infinite}
      .spin{animation:spin 1.1s linear infinite}
      .pedals{animation:spin 1.1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e8"/>
  <path d="M0 320 Q110 290 210 321 T420 315 T650 310 T800 320 V484 H0Z" fill="#d9efdd"/>
  <circle cx="694" cy="119" r="40" fill="#ffd45e"/>
  <g fill="#fff" opacity=".85">
    <path d="M82 156q8-25 34-17 17-28 42-6 30-5 35 23z"/>
    <path d="M570 204q7-21 29-15 15-25 37-5 26-4 31 20z"/>
  </g>

  <text x="400" y="66" text-anchor="middle" class="label" font-size="42" font-weight="900" letter-spacing="1">THE PELICAN EXPRESS</text>
  <path d="M0 465H800" stroke="#9cba96" stroke-width="5"/>
  <path d="M55 480h90m35 0h80m370 0h115" stroke="#bdd2aa" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(220 395)">
    <g class="spin">
      <circle r="86" class="wheel"/>
      <circle r="67" fill="none" stroke="#d9e4df" stroke-width="3"/>
      <g class="spoke">
        <path d="M-80 0H80M0-80V80M-57-57L57 57M57-57L-57 57"/>
      </g>
      <circle r="9" fill="#f8b846" stroke="#24334a" stroke-width="4"/>
    </g>
  </g>
  <g transform="translate(581 395)">
    <g class="spin">
      <circle r="86" class="wheel"/>
      <circle r="67" fill="none" stroke="#d9e4df" stroke-width="3"/>
      <g class="spoke">
        <path d="M-80 0H80M0-80V80M-57-57L57 57M57-57L-57 57"/>
      </g>
      <circle r="9" fill="#f8b846" stroke="#24334a" stroke-width="4"/>
    </g>
  </g>

  <g fill="none" stroke="#e95744" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 395L305 283 385 395Z"/>
    <path d="M305 283H477L385 395"/>
    <path d="M477 283L581 395"/>
  </g>
  <g fill="none" class="ink">
