  <rect x="0" y="503" width="800" height="97" fill="#24334a"/>
  <text x="400" y="539" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff8e8">Fresh fish delivery. No hands, no problem.</text>
