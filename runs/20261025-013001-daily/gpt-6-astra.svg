<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="50" y="30" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="50" y="55">vₓ = 20 m/s · vᵧ = 15 m/s · g = 10 m/s²</text>
    <text x="50" y="80">Total flight time: 3 s · No air resistance</text>
    <text x="50" y="105">Scale: 10 px/m; horizontal axis break: 32–56 m</text>
    <text x="50" y="127" font-size="12">The axis break omits part of the trajectory to fit the canvas.</text>
  </g>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#475569" stroke-width="2"/>

  <!-- x = 100 + 200t; y = 350 - 150t + 50t².
       Horizontal coordinates beyond 56 m are shifted left by 200 px.
       A 40 px axis-break gap represents the omitted interval 32–56 m. -->
  <g fill="none" stroke="#2563eb" stroke-width="3">
    <path d="M100 350 Q260 230 420 238"/>
    <path d="M460 322 Q480 335 500 350"/>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M428 356 l8 -12 M442 356 l8 -12"/>
    <path d="M416 244 l8 -12 M456 328 l8 -12"/>
  </g>

  <g fill="#172033">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="55" y="315">launch: 0 m, 0 m</text>
    <text x="326" y="215">apex: 30 m, 11.25 m</text>
    <text x="445" y="279">
      <tspan x="445">landing:</tspan>
      <tspan x="445" dy="18">60 m, 0 m</tspan>
    </text>
  </g>

  <rect x="0" y="369" width="600" height="31" fill="#f1f5f9"/>
  <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-10-25 01:33:26 SGT (UTC+08:00)</text>
</svg>