<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Pedal Economy</title>
  <desc id="description">A smug pelican rides a bicycle with an enormous fish-filled bill, ignoring a fuel station. Wheels spin, feet pedal, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bfeaf0"/>
      <stop offset="1" stop-color="#fff3cc"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd16c"/>
      <stop offset="1" stop-color="#f49a50"/>
    </linearGradient>
    <style>
      .ink{stroke:#253546;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .type{font-family:Arial,Helvetica,sans-serif;fill:#253546}
      .spoke{stroke:#70818b;stroke-width:3}
    </style>
    <g id="wheel">
      <circle r="77" fill="#fffcf0" fill-opacity=".7" stroke="#253546" stroke-width="11"/>
      <circle r="65" fill="none" stroke="#a4b7bd" stroke-width="3"/>
      <g class="spoke">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <circle r="10" fill="#ffd15b" stroke="#253546" stroke-width="4"/>
      <path d="M-8-66H8" stroke="#ef6b54" stroke-width="6"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff8e9"/>
  <rect x="18" y="18" width="764" height="499" rx="24" fill="url(#sky)" stroke="#253546" stroke-width="4"/>
  <circle cx="691" cy="140" r="39" fill="#ffdc79"/>
  <g fill="#fff" opacity=".8">
    <path d="M46 161c-4-22 27-36 44-20 5-33 54-32 60-2 29-12 48 12 39 29H46Z"/>
    <path d="M479 135c-1-15 16-25 29-18 8-22 37-21 45 1 19-5 33 7 30 20H479Z"/>
  </g>

  <text class="type" x="400" y="65" font-size="35" font-weight="900" text-anchor="middle" letter-spacing="1">THE PELICAN PEDAL ECONOMY</text>
  <text class="type" x="400" y="94" font-size="17" text-anchor="middle">One bird. Two wheels. An outrageous storage solution.</text>

  <!-- A single seaside commute -->
  <path d="M20 362Q185 334 337 359T780 351V435H20Z" fill="#87c7bc"/>
  <path d="M20 386Q243 368 420 387T780 379V503Q780 517 764 517H36Q18 517 18 499Z" fill="#d4d4c6"/>
  <path d="M34 471H142M605 471H764" stroke="#fff6d9" stroke-width="7" stroke-dasharray="42 22"/>
  <ellipse cx="382" cy="480" rx="236" ry="16" fill="#253546" opacity=".12"/>

  <g transform="translate(659 264)">
    <path d="M0 0H78V160H0Z" fill="#e88873" class="ink"/>
    <rect x="10" y="13" width="58" height="44" rx="5" fill="#fff6d9" stroke="#253546" stroke-width="4"/>
    <text class="type" x="39" y="33" text-anchor="middle" font-size="13" font-weight="bold">FUEL</text>
    <text class="type" x="39" y="50" text-anchor="middle" font-size="13">$$$</text>
    <path d="M78 45q29-2 25 42l-4 35q-2 14-14 7V77" fill="none" class="ink"/>
    <path d="M-7 161H85" class="ink"/>
  </g>

  <!-- Wheels rotate around their own hubs -->
  <g transform="translate(226 407)">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(535 407)">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Bicycle -->
  <g fill="none" class="ink">
    <path d="M226 407L300 302L366 407Z M300 302H477L366 407M477 302L535 407" stroke="#e65b48" stroke-width="10"/>
    <path d="M300 302L286 277M270 277H309" stroke-width="8"/>
    <path d="M535 407L471 274L487 251H516" stroke-width="8"/>
    <path d="M510 251H529" stroke="#253546" stroke-width="13"/>
    <path d="M226 319Q158 321 144 384M548 319Q604 329 614 379" stroke="#f3b947" stroke-width="8"/>
  </g>
  <circle cx="366" cy="407" r="19" fill="#ffe6a0" class="ink"/>

  <!-- The far leg pedals behind the body -->
  <g class="ink" fill="none" stroke="#e59b43" stroke-width="11">
    <path d="M344 281L325 342L345 398">
      <animate attributeName="d" values="M344 281L325 342L345 398;M344 281L382 337L388 416;M344 281L325 342L345 398" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Bobbing pelican -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M277 238L232 218L253 259L228 269L286 282" fill="#fffdf2" class="ink"/>
    <path d="M275 224C290 191 348 190 380 214C407 233 408 276 379 293C346 315 284 296 273 266Z" fill="#fffdf2" class="ink"/>
    <path d="M294 234Q334 223 366 268Q324 283 292 249" fill="#d9e5df" class="ink"/>
    <path d="M369 233C370 202 388 176 395 158C404 136 435 134 447 154C463 182 430 200 426 219L425 251" fill="#fffdf2" class="ink"/>
    <!-- Extravagantly large bill and translucent grocery pouch -->
    <path d="M442 171L617 191Q593 266 505 258Q457 247 439 193Z" fill="url(#pouch)" class="ink"/>
    <g fill="#77b5bb" stroke="#253546" stroke-width="3">
      <path d="M478 222Q504 199 530 220L542 207L543 234L529 225Q503 246 478 222Z"/>
      <path d="M536 239Q558 220 580 231L591 222L589 244L579 237Q556 255 536 239Z"/>
      <circle cx="488" cy="220" r="2.5" fill="#253546" stroke="none"/>
      <circle cx="545" cy="236" r="2.5" fill="#253546" stroke="none"/>
    </g>
    <path d="M441 169L620 187L615 196L442 190Z" fill="#ffd660" class="ink"/>
    <path d="M414 133L400 119M422 131L420 113M431 133L437 119" fill="none" class="ink"/>
    <circle cx="430" cy="161" r="7" fill="#253546"/>
    <circle cx="432" cy="159" r="2" fill="#fff"/>
    <path d="M420 147L439 151" fill="none" class="ink"/>
    <!-- Wing gripping the handlebar -->
    <path d="M365 244Q401 273 449 264L485 251" fill="none" stroke="#253546" stroke-width="16" stroke-linecap="round"/>
    <path d="M365 244Q401 273 449 264L485 251" fill="none" stroke="#fffdf2" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Near leg and rotating crank -->
  <path d="M367 288L401 344L388 416" fill="none" stroke="#253546" stroke-width="14" stroke-linecap="round">
    <animate attributeName="d" values="M367 288L401 344L388 416;M367 288L347 350L345 398;M367 288L401 344L388 416" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M367 288L401 344L388 416" fill="none" stroke="#edab49" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M367 288L401 344L388 416;M367 288L347 350L345 398;M367 288L401 344L388 416" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(366 407)">
    <g class="ink">
      <path d="M-22-9L22 9" fill="none"/>
      <path d="M12 9H33M-33-9H-12" fill="none" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <path d="M76 194Q67 180 81 171H249Q266 174 263 192V222Q261 236 246 236H203L185 255L188 236H88Q74 235 76 222Z" fill="#fffdf2" stroke="#253546" stroke-width="3"/>
    <text class="type" x="169" y="197" text-anchor="middle" font-size="17" font-weight="bold">“My fuel costs?</text>
    <text class="type" x="169" y="220" text-anchor="middle" font-size="17" font-weight="bold">Peanuts. Well, fish.”</text>
  </g>

  <!-- Dedicated caption and timestamp footer -->
  <text class="type" x="400" y="549" text-anchor="middle" font-size="21" font-weight="bold">He cycles to save money. His bill keeps getting bigger.</text>
  <text class="type" x="400" y="581" text-anchor="middle" font-size="17">2026-10-26 07:01:02 SGT (UTC+08:00)</text>
</svg>