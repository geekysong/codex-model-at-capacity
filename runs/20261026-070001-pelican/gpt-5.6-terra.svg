  </g>

  <rect y="510" width="800" height="90" fill="#26313b"/>
  <text x="400" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#f8d45c">One bird. Two wheels. Zero qualified transportation planners.</text>
  <text x="400" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff">2026-10-26 07:02:26 SGT (UTC+08:00)</text>
