<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past Common Sense</title>
  <desc id="desc">A satirical cartoon of an anxious pelican riding a tiny bicycle beneath a dramatic sky.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .pelican { transform-box: fill-box; transform-origin: 50% 100%; animation: bob .55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: 50% 0%; animation: pedal .55s ease-in-out infinite alternate; }
    .leg2 { transform-box: fill-box; transform-origin: 50% 0%; animation: pedal .55s ease-in-out infinite alternate-reverse; }
    .cloud { animation: drift 7s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(1deg); } }
    @keyframes pedal { to { transform: rotate(22deg); } }
    @keyframes drift { to { transform: translateX(24px); } }
  </style>

  <rect width="800" height="600" fill="#bcecff"/>
  <path d="M0 294 Q120 250 230 300 T450 285 T650 302 T800 270 V455 H0Z" fill="#86cd78"/>
  <path d="M0 396 Q135 370 270 402 T550 390 T800 402 V476 H0Z" fill="#52a95a"/>
  <path d="M0 465 H800 V490 H0Z" fill="#58636b"/>
  <path d="M0 478 H800" stroke="#f6d64a" stroke-width="7" stroke-dasharray="38 23"/>

  <g class="cloud" fill="#fff" opacity=".88">
    <path d="M72 115c0-18 16-31 34-28 8-24 44-26 54 1 28-7 47 26 25 43H83c-15 0-23-8-23-16 0-8 5-15 12-17z"/>
    <path d="M605 135c0-15 14-27 29-24 10-22 41-19 48 5 25-3 38 29 13 42h-91c-14 0-20-8-20-15 0-5 7-10 21-8z"/>
  </g>

  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#26313b">PELICAN PEDALS PAST COMMON SENSE</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#485661">“It’s not emissions-free if the rider emits panic.”</text>

  <g aria-label="bicycle">
    <g class="wheel">
      <circle cx="250" cy="419" r="69" fill="#e9f2f5" stroke="#27333d" stroke-width="10"/>
