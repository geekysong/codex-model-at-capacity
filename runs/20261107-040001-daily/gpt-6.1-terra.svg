<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Robot path on a 5 by 5 grid</title>
  <desc id="desc">The robot starts in the top-left cell facing right and finishes in row 3, column 4, facing right.</desc>
  <rect width="600" height="400" fill="white"/>

  <!-- Visited cells -->
  <g fill="#d9efff">
    <rect x="150" y="35" width="60" height="60"/>
    <rect x="210" y="35" width="60" height="60"/>
    <rect x="270" y="35" width="60" height="60"/>
    <rect x="270" y="95" width="60" height="60"/>
    <rect x="270" y="155" width="60" height="60"/>
    <rect x="330" y="155" width="60" height="60"/>
  </g>

  <!-- Grid -->
  <g fill="none" stroke="#52616b" stroke-width="1.5">
    <rect x="150" y="35" width="300" height="300"/>
    <path d="M210 35V335 M270 35V335 M330 35V335 M390 35V335
             M150 95H450 M150 155H450 M150 215H450 M150 275H450"/>
  </g>

  <!-- Path and markers -->
  <polyline points="180,65 240,65 300,65 300,125 300,185 360,185"
            fill="none" stroke="#d62e2e" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 55 L190 65 L170 75 Z" fill="#263746" stroke="white" stroke-width="1.5"/>
  <circle cx="360" cy="185" r="10" fill="#16833a" stroke="white" stroke-width="2"/>

  <g font-family="Arial, sans-serif" fill="#202b33" font-size="15">
    <text x="138" y="70" text-anchor="end">Start</text>
    <text x="465" y="180">Row 3, column 4</text>
    <text x="465" y="203">Facing: Right</text>
  </g>

  <line x1="30" y1="354" x2="570" y2="354" stroke="#d5dce0"/>
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="15" fill="#263746">2026-11-07 04:04:21 SGT (UTC+08:00)</text>
</svg>