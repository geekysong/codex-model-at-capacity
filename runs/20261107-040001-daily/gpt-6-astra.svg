<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>

  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222">Commands: F, F, R, F, F, L, F</text>

  <!-- Visited cells -->
  <g fill="#cceeff">
    <rect x="150" y="50" width="60" height="60"/>
    <rect x="210" y="50" width="60" height="60"/>
    <rect x="270" y="50" width="60" height="60"/>
    <rect x="270" y="110" width="60" height="60"/>
    <rect x="270" y="170" width="60" height="60"/>
    <rect x="330" y="170" width="60" height="60"/>
  </g>

  <!-- Centered 5 × 5 grid -->
  <path d="M150 50H450V350H150Z
           M210 50V350 M270 50V350 M330 50V350 M390 50V350
           M150 110H450 M150 170H450 M150 230H450 M150 290H450"
        fill="none" stroke="#444" stroke-width="1.5"/>

  <!-- Connected path through cell centers -->
  <polyline points="180,80 240,80 300,80 300,140 300,200 360,200"
            fill="none" stroke="#d62828" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Robot at the starting cell, facing right -->
  <g stroke="#243746" stroke-width="2">
    <rect x="165" y="67" width="27" height="26" rx="5" fill="#e7edf2"/>
    <path d="M178 67V61" fill="none"/>
    <circle cx="178" cy="59" r="3" fill="#ffbf47"/>
    <circle cx="184" cy="75" r="2" fill="#243746" stroke="none"/>
    <circle cx="184" cy="85" r="2" fill="#243746" stroke="none"/>
    <path d="M192 74L202 80L192 86Z" fill="#243746"/>
  </g>

  <!-- Final position -->
  <circle cx="360" cy="200" r="12" fill="#168447" stroke="white" stroke-width="2"/>

  <!-- Labels outside the grid -->
  <g font-family="Arial, sans-serif" fill="#222">
    <text x="135" y="76" text-anchor="end" font-size="15">Start</text>
    <text x="135" y="96" text-anchor="end" font-size="14">Facing Right</text>

    <text x="465" y="181" font-size="16" font-weight="bold">Final cell</text>
    <text x="465" y="202" font-size="15">Row 3, Col 4</text>
    <text x="465" y="224" font-size="15">Facing Right</text>
  </g>

  <!-- Dedicated footer -->
  <text x="300" y="385" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="15" fill="#333">2026-11-07 04:03:25 SGT (UTC+08:00)</text>
</svg>