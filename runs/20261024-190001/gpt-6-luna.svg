<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f4e79"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #1f2937; font-size: 18px; }
      .small { font-family: Arial, sans-serif; fill: #1f2937; font-size: 16px; }
      .bold { font-weight: bold; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>

  <!-- title -->
  <text x="300" y="36" text-anchor="middle" class="label bold" font-size="24">Level Seesaw in Static Equilibrium</text>

  <!-- seesaw beam -->
  <rect x="90" y="184" width="420" height="18" rx="5" fill="#b8793b" stroke="#6b4226" stroke-width="3"/>

  <!-- pivot -->
  <path d="M300 202 L260 280 L340 280 Z" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <line x1="245" y1="280" x2="355" y2="280" stroke="#334155" stroke-width="5"/>
  <text x="300" y="307" text-anchor="middle" class="small bold">pivot</text>

  <!-- left mass -->
  <line x1="150" y1="202" x2="150" y2="238" stroke="#334155" stroke-width="3"/>
  <rect x="115" y="238" width="70" height="55" rx="6" fill="#d95f59" stroke="#8f2d2d" stroke-width="3"/>
  <text x="150" y="272" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="bold">6 kg</text>

  <!-- right mass -->
  <line x1="450" y1="202" x2="450" y2="238" stroke="#334155" stroke-width="3"/>
  <rect x="415" y="238" width="70" height="55" rx="6" fill="#4f9d69" stroke="#27613b" stroke-width="3"/>
  <text x="450" y="272" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="bold">4 kg</text>

  <!-- force arrows -->
  <line x1="150" y1="225" x2="150" y2="325" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="150" y="348" text-anchor="middle" class="small">weight force</text>

  <line x1="450" y1="225" x2="450" y2="325" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="348" text-anchor="middle" class="small">weight force</text>

  <!-- distance dimensions -->
  <line x1="150" y1="145" x2="300" y2="145" stroke="#374151" stroke-width="2"/>
  <line x1="150" y1="136" x2="150" y2="154" stroke="#374151" stroke-width="2"/>
  <line x1="300" y1="136" x2="300" y2="154" stroke="#374151" stroke-width="2"/>
  <text x="225" y="133" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="110" x2="450" y2="110" stroke="#374151" stroke-width="2"/>
  <line x1="300" y1="101" x2="300" y2="119" stroke="#374151" stroke-width="2"/>
  <line x1="450" y1="101" x2="450" y2="119" stroke="#374151" stroke-width="2"/>
  <text x="375" y="98" text-anchor="middle" class="label">x = 3 m</text>

  <!-- equilibrium equation -->
  <text x="300" y="378" text-anchor="middle" class="label bold">6 × 2 = 4 × 3</text>
  <text x="520" y="72" text-anchor="middle" fill="#166534" font-family="Arial, sans-serif" font-size="24" font-weight="bold">balanced</text>
  <path d="M470 82 Q520 100 570 82" fill="none" stroke="#166534" stroke-width="2"/>
</svg>