<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f4e79"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Level seesaw -->
  <line x1="100" y1="200" x2="500" y2="200" stroke="#333" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="200" r="9" fill="#222"/>
  <path d="M265 285 L300 200 L335 285 Z" fill="#888" stroke="#333" stroke-width="3"/>
  <line x1="245" y1="285" x2="355" y2="285" stroke="#333" stroke-width="6" stroke-linecap="round"/>

  <!-- Masses -->
  <rect x="155" y="125" width="50" height="50" rx="5" fill="#d9534f" stroke="#8b1e1e" stroke-width="3"/>
  <text x="180" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>

  <rect x="395" y="125" width="50" height="50" rx="5" fill="#4f81bd" stroke="#1f4e79" stroke-width="3"/>
  <text x="420" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="80" x2="180" y2="120" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="180" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f4e79">F = 6g</text>

  <line x1="420" y1="80" x2="420" y2="120" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="420" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f4e79">F = 4g</text>

  <!-- Distance dimensions -->
  <line x1="180" y1="225" x2="300" y2="225" stroke="#555" stroke-width="2"/>
  <line x1="180" y1="218" x2="180" y2="232" stroke="#555" stroke-width="2"/>
  <line x1="300" y1="218" x2="300" y2="232" stroke="#555" stroke-width="2"/>
  <text x="240" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#333">2 m</text>

  <line x1="300" y1="225" x2="420" y2="225" stroke="#555" stroke-width="2"/>
  <line x1="420" y1="218" x2="420" y2="232" stroke="#555" stroke-width="2"/>
  <text x="360" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#333">x = 3 m</text>

  <!-- Torque equation and status -->
  <text x="300" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#222">6 × 2 = 4 × 3</text>
  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2e7d32">BALANCED</text>
</svg>