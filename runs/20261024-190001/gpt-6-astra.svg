<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <style>
    .label { font-family: Arial, sans-serif; fill: #1f2937; font-size: 20px; }
    .small { font-size: 17px; }
    .bold { font-weight: bold; }
    .beam { stroke: #374151; stroke-width: 12; stroke-linecap: round; }
    .dim { stroke: #6b7280; stroke-width: 2; }
    .arrow { stroke: #dc2626; stroke-width: 4; fill: none; }
  </style>

  <!-- Level seesaw -->
  <line x1="90" y1="170" x2="510" y2="170" class="beam"/>
  <circle cx="300" cy="170" r="8" fill="#111827"/>

  <!-- Pivot -->
  <polygon points="270,245 330,245 300,170" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
  <line x1="255" y1="245" x2="345" y2="245" stroke="#374151" stroke-width="6"/>
  <text x="300" y="275" text-anchor="middle" class="label small">pivot</text>

  <!-- Left mass -->
  <line x1="130" y1="170" x2="130" y2="225" stroke="#374151" stroke-width="3"/>
  <rect x="95" y="225" width="70" height="45" rx="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
  <text x="130" y="254" text-anchor="middle" class="label bold">6 kg</text>

  <!-- Right mass -->
  <line x1="470" y1="170" x2="470" y2="225" stroke="#374151" stroke-width="3"/>
  <rect x="435" y="225" width="70" height="45" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
  <text x="470" y="254" text-anchor="middle" class="label bold">4 kg</text>

  <!-- Force arrows -->
  <line x1="130" y1="195" x2="130" y2="285" class="arrow"/>
  <polygon points="130,300 121,282 139,282" fill="#dc2626"/>
  <text x="130" y="325" text-anchor="middle" class="label small">6g downward</text>

  <line x1="470" y1="195" x2="470" y2="285" class="arrow"/>
  <polygon points="470,300 461,282 479,282" fill="#dc2626"/>
  <text x="470" y="325" text-anchor="middle" class="label small">4g downward</text>

  <!-- Distance dimensions -->
  <line x1="130" y1="125" x2="300" y2="125" class="dim"/>
  <line x1="130" y1="117" x2="130" y2="133" class="dim"/>
  <line x1="300" y1="117" x2="300" y2="133" class="dim"/>
  <text x="215" y="112" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="125" x2="470" y2="125" class="dim"/>
  <line x1="470" y1="117" x2="470" y2="133" class="dim"/>
  <text x="385" y="112" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equilibrium statement -->
  <text x="300" y="365" text-anchor="middle" class="label bold">6 × 2 = 4 × 3</text>
  <text x="300" y="392" text-anchor="middle" class="label bold" fill="#15803d">balanced</text>
</svg>