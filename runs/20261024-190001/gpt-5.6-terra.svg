<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4e79"/>
    </marker>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222">
    Level Seesaw — Static Equilibrium
  </text>

  <!-- Seesaw beam -->
  <rect x="80" y="180" width="440" height="18" rx="5" fill="#b9783c" stroke="#5d3a1a" stroke-width="2"/>
  <line x1="300" y1="174" x2="300" y2="204" stroke="#5d3a1a" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,198 270,260 330,260" fill="#777" stroke="#333" stroke-width="2"/>
  <line x1="255" y1="260" x2="345" y2="260" stroke="#333" stroke-width="4"/>
  <text x="300" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">pivot</text>

  <!-- Left suspension -->
  <line x1="150" y1="198" x2="150" y2="255" stroke="#333" stroke-width="3"/>
  <rect x="118" y="255" width="64" height="48" rx="5" fill="#d9534f" stroke="#8b2522" stroke-width="2"/>
  <text x="150" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">6 kg</text>

  <!-- Right suspension -->
  <line x1="450" y1="198" x2="450" y2="255" stroke="#333" stroke-width="3"/>
  <rect x="418" y="255" width="64" height="48" rx="5" fill="#4f81bd" stroke="#24486f" stroke-width="2"/>
  <text x="450" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="235" x2="150" y2="315" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="162" y="324" font-family="Arial, sans-serif" font-size="15" fill="#1f4e79">weight</text>
  <line x1="450" y1="235" x2="450" y2="315" stroke="#1f4e79" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="462" y="324" font-family="Arial, sans-serif" font-size="15" fill="#1f4e79">weight</text>

  <!-- Distance dimension lines -->
  <line x1="150" y1="145" x2="300" y2="145" stroke="#444" stroke-width="2" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <line x1="150" y1="150" x2="150" y2="180" stroke="#444" stroke-width="1.5"/>
  <line x1="300" y1="150" x2="300" y2="180" stroke="#444" stroke-width="1.5"/>
  <text x="225" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222">2 m</text>

  <line x1="300" y1="105" x2="450" y2="105" stroke="#444" stroke-width="2" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <line x1="300" y1="110" x2="300" y2="180" stroke="#444" stroke-width="1.5"/>
  <line x1="450" y1="110" x2="450" y2="180" stroke="#444" stroke-width="1.5"/>
  <text x="375" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#222">x = 3 m</text>

  <!-- Torque equation -->
  <text x="300" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222">
    6 × 2 = 4 × 3
  </text>

  <!-- Balanced label -->
  <text x="300" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#238636">
    BALANCED
  </text>
</svg>