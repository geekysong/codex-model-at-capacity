<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff19a"/>
      <stop offset=".5" stop-color="#f7b936"/>
      <stop offset="1" stop-color="#cc7818"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#3b3150" flood-opacity=".25"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#ffffff" opacity=".5"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#dots)" opacity=".25"/>

  <text x="400" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#28233b" letter-spacing="1">
    PREMIUM MODEL
  </text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#d14b3f">
    Same promise. Smaller engine.
  </text>

  <!-- service booth -->
  <rect x="60" y="125" width="680" height="370" rx="24" fill="#fffdf7" stroke="#28233b" stroke-width="6" filter="url(#shadow)"/>
  <rect x="60" y="125" width="680" height="90" rx="24" fill="#4d3d82"/>
  <rect x="60" y="185" width="680" height="30" fill="#4d3d82"/>
  <text x="400" y="174" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900" fill="#fff">THE CLOUD ORACLE™</text>
  <text x="400" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#e8ddff">Now with 100% more premium-ish!</text>

  <!-- left bait display -->
  <rect x="100" y="250" width="280" height="190" rx="18" fill="#fff4c2" stroke="#28233b" stroke-width="5"/>
  <text x="240" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900" fill="#28233b">WHAT YOU ORDER</text>
  <polygon points="240,302 252,327 280,331 260,350 265,378 240,365 215,378 220,350 200,331 228,327" fill="url(#gold)" stroke="#7d4c18" stroke-width="4"/>
  <text x="240" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#b06b12">ULTRA-MEGA</text>
  <text x="240" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#28233b">reasoning • nuance • sparkle</text>

  <!-- arrow -->
  <path d="M397 340 C432 300 469 300 505 340" fill="none" stroke="#d14b3f" stroke-width="9" stroke-linecap="round"/>
  <polygon points="503,319 530,343 495,352" fill="#d14b3f"/>
  <text x="450" y="285" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#d14b3f" transform="rotate(-8 450 285)">tiny terms apply</text>

  <!-- right reveal -->
  <rect x="520" y="250" width="220" height="190" rx="18" fill="#d9e1eb" stroke="#28233b" stroke-width="5"/>
  <text x="630" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#28233b">WHAT ARRIVES</text>
  <path d="M564 305 h132 a10 10 0 0 1 10 10 v62 a10 10 0 0 1-10 10 H564 a10 10 0 0 1-10-10 v-62 a10 10 0 0 1 10-10z" fill="#f5f7fa" stroke="#596579" stroke-width="4"/>
  <circle cx="596" cy="342" r="18" fill="#f0b34b" stroke="#28233b" stroke-width="3"/>
  <circle cx="668" cy="342" r="18" fill="#f0b34b" stroke="#28233b" stroke-width="3"/>
  <circle cx="601" cy="339" r="4" fill="#28233b"/>
  <circle cx="663" cy="339" r="4" fill="#28233b"/>
  <path d="M610 362 Q632 375 654 362" fill="none" stroke="#28233b" stroke-width="4" stroke-linecap="round"/>
  <text x="630" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#d14b3f">BUDGET BOT</text>
  <text x="630" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#28233b">“Have you tried turning it off?”</text>

  <!-- trapdoor / fine print -->
  <path d="M80 465 H720" stroke="#28233b" stroke-width="5"/>
  <text x="400" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#6f7480">
    *Premium branding may contain traces of actual premium.
  </text>

  <!-- customer -->
  <g transform="translate(92 492)">
    <circle cx="0" cy="0" r="25" fill="#f3b27f" stroke="#28233b" stroke-width="4"/>
    <path d="M-21 -6 Q0 -34 22 -6" fill="#4b2f29" stroke="#28233b" stroke-width="4"/>
    <circle cx="-9" cy="2" r="3" fill="#28233b"/>
    <circle cx="9" cy="2" r="3" fill="#28233b"/>
    <path d="M-8 14 Q0 8 8 14" fill="none" stroke="#28233b" stroke-width="3"/>
    <path d="M-30 35 Q0 17 30 35 L34 78 H-34Z" fill="#5d8fd4" stroke="#28233b" stroke-width="4"/>
    <text x="0" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#28233b">CUSTOMER</text>
  </g>

  <!-- speech bubble -->
  <path d="M150 505 Q180 460 278 474 Q330 481 322 520 Q315 548 257 543 L226 568 L223 542 Q164 544 150 505Z" fill="#fff" stroke="#28233b" stroke-width="4"/>
  <text x="235" y="507" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#28233b">I paid for the</text>
  <text x="235" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#d14b3f">big brain!</text>

  <!-- seller -->
  <g transform="translate(680 492)">
    <circle cx="0" cy="0" r="25" fill="#f3b27f" stroke="#28233b" stroke-width="4"/>
    <path d="M-24 -5 Q0 -30 24 -5 L18 -18 Q0 -39 -18 -18Z" fill="#4b2f29" stroke="#28233b" stroke-width="4"/>
    <circle cx="-9" cy="3" r="3" fill="#28233b"/>
    <circle cx="9" cy="3" r="3" fill="#28233b"/>
    <path d="M-8 14 Q0 20 8 14" fill="none" stroke="#28233b" stroke-width="3"/>
    <path d="M-31 35 Q0 17 31 35 L34 78 H-34Z" fill="#d14b3f" stroke="#28233b" stroke-width="4"/>
    <text x="0" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="900" fill="#28233b">MARKETING</text>
  </g>

  <path d="M540 507 Q570 470 655 478 Q708 484 703 518 Q697 544 645 541 L620 563 L616 540 Q554 541 540 507Z" fill="#fff" stroke="#28233b" stroke-width="4"/>
  <text x="622" y="509" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#28233b">It has the same</text>
  <text x="622" y="529" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#4d3d82">logo!</text>

  <text x="400" y="588" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#28233b">
    Bait: “frontier intelligence”  •  Switch: “frontier-themed”
  </text>
</svg>