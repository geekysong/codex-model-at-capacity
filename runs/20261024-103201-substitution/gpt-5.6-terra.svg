<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7dc"/>
      <stop offset="1" stop-color="#f7d9a8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe889"/>
      <stop offset="1" stop-color="#e8a92e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf3f8"/>
      <stop offset="1" stop-color="#7e8e9e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5b3b29" flood-opacity=".28"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#7b4d35" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="600" fill="url(#dots)" opacity=".35"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="35" font-weight="900" fill="#3b2118" letter-spacing="1">
    PREMIUM MODEL™
  </text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="700" fill="#b43e27">
    “The smartest thing on the planet!”
  </text>

  <!-- stage -->
  <path d="M80 490 Q400 445 720 490 L720 545 Q400 575 80 545Z" fill="#8e4e36" opacity=".2"/>
  <rect x="110" y="145" width="580" height="330" rx="25" fill="#fffdf4" stroke="#3b2118" stroke-width="7" filter="url(#shadow)"/>
  <path d="M110 145h580v58H110z" fill="#cf3d2d"/>
  <text x="400" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="24" font-weight="900" fill="#fff7dc">TRUSTED SERVICE DESK</text>

  <!-- customer -->
  <g transform="translate(150 268)">
    <ellipse cx="95" cy="193" rx="92" ry="18" fill="#8a533a" opacity=".25"/>
    <path d="M35 190 Q40 120 92 116 Q148 120 156 190Z" fill="#2f70a7" stroke="#3b2118" stroke-width="6"/>
    <circle cx="95" cy="76" r="55" fill="#f3b27f" stroke="#3b2118" stroke-width="6"/>
    <path d="M43 63 Q49 7 98 13 Q143 12 151 62 Q122 40 95 43 Q67 39 43 63Z" fill="#4e2c24"/>
    <circle cx="76" cy="77" r="6" fill="#3b2118"/>
    <circle cx="114" cy="77" r="6" fill="#3b2118"/>
    <path d="M78 103 Q96 114 115 101" fill="none" stroke="#3b2118" stroke-width="5" stroke-linecap="round"/>
    <path d="M145 129 Q183 122 207 147" fill="none" stroke="#3b2118" stroke-width="10" stroke-linecap="round"/>
    <path d="M207 147 l-10 -4 5 13" fill="#3b2118"/>
    <text x="95" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="20" font-weight="900" fill="#3b2118">CUSTOMER</text>
  </g>

  <!-- premium sign -->
  <g transform="translate(245 235)" filter="url(#shadow)">
    <path d="M0 0 h285 l-22 170 H22Z" fill="url(#gold)" stroke="#3b2118" stroke-width="7"/>
    <text x="142" y="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="25" font-weight="900" fill="#3b2118">YOU ORDERED</text>
    <text x="142" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="38" font-weight="900" fill="#b43e27">ULTRA-AI</text>
    <text x="142" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="18" font-weight="700" fill="#3b2118">reasoning • speed • wisdom</text>
    <path d="M43 145 H240" stroke="#3b2118" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- clerk -->
  <g transform="translate(530 252)">
    <ellipse cx="82" cy="211" rx="78" ry="16" fill="#8a533a" opacity=".25"/>
    <path d="M24 204 Q27 126 82 123 Q137 127 143 204Z" fill="#b43e27" stroke="#3b2118" stroke-width="6"/>
    <circle cx="82" cy="79" r="52" fill="#e7a776" stroke="#3b2118" stroke-width="6"/>
    <path d="M31 70 Q39 16 86 18 Q128 16 136 68 Q111 48 82 49 Q55 47 31 70Z" fill="#292329"/>
    <rect x="43" y="70" width="31" height="18" rx="8" fill="#fff" stroke="#3b2118" stroke-width="4"/>
    <rect x="91" y="70" width="31" height="18" rx="8" fill="#fff" stroke="#3b2118" stroke-width="4"/>
    <path d="M74 79h17" stroke="#3b2118" stroke-width="4"/>
    <circle cx="58" cy="79" r="4" fill="#3b2118"/>
    <circle cx="106" cy="79" r="4" fill="#3b2118"/>
    <path d="M65 105 Q82 95 99 105" fill="none" stroke="#3b2118" stroke-width="5"/>
    <path d="M28 133 Q-5 112 -18 84" fill="none" stroke="#3b2118" stroke-width="10" stroke-linecap="round"/>
    <path d="M-19 84 l2 14 10-8" fill="#3b2118"/>
    <text x="82" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="20" font-weight="900" fill="#3b2118">THE VENDOR</text>
  </g>

  <!-- trapdoor / substitute -->
  <g transform="translate(300 397)" filter="url(#shadow)">
    <path d="M0 0 H205 L188 106 H17Z" fill="url(#metal)" stroke="#3b2118" stroke-width="7"/>
    <text x="102" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="16" font-weight="900" fill="#3b2118">ACTUAL DELIVERY</text>
    <rect x="28" y="43" width="150" height="50" rx="9" fill="#28313a" stroke="#3b2118" stroke-width="5"/>
    <text x="103" y="76" text-anchor="middle" font-family="Courier New, monospace"
          font-size="24" font-weight="900" fill="#ffcf48">TINY-BOT v0.3</text>
    <path d="M102 105 v23" stroke="#3b2118" stroke-width="5"/>
    <path d="M84 128 h36" stroke="#3b2118" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- speech bubbles -->
  <g filter="url(#shadow)">
    <path d="M122 205 Q132 125 252 130 Q340 133 342 193 Q345 245 250 249 Q185 251 152 230 L122 246 L134 216 Q119 215 122 205Z"
          fill="#fff" stroke="#3b2118" stroke-width="6"/>
    <text x="232" y="169" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="20" font-weight="900" fill="#3b2118">“It will write</text>
    <text x="232" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="20" font-weight="900" fill="#3b2118">like a genius!”</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M510 190 Q560 128 665 151 Q731 165 715 218 Q704 256 637 254 L666 278 L614 253 Q548 259 518 229 Q499 211 510 190Z"
          fill="#fff" stroke="#3b2118" stroke-width="6"/>
    <text x="613" y="192" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="19" font-weight="900" fill="#b43e27">“Surprise!</text>
    <text x="613" y="219" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="19" font-weight="900" fill="#b43e27">Same vibes,</text>
    <text x="613" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="19" font-weight="900" fill="#b43e27">lower wattage.”</text>
  </g>

  <text x="400" y="580" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="21" font-weight="900" fill="#3b2118">
    PREMIUM PRICE. BUDGET BRAIN. PLEASE ENJOY YOUR “UPGRADE.”
  </text>
</svg>