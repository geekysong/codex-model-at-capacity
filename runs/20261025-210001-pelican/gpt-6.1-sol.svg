  <title id="title">Beak Hour: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle with fish in its basket and an enormous bill stretched over the handlebars. Wheels spin, pedals turn, and the pelican gently bobs.</desc>
