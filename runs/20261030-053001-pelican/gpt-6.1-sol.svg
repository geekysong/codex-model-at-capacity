<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Pedal Lobby</title>
  <desc id="description">A pompous pelican cycles along the waterfront with a fish in its enormous bill pouch, declaring its bicycle a company car. Wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bfeaf1"/>
      <stop offset="1" stop-color="#eff9ec"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc765"/>
      <stop offset="1" stop-color="#f18d48"/>
    </linearGradient>
    <pattern id="water" width="90" height="24" patternUnits="userSpaceOnUse">
      <path d="M8 15h38m16-7h19" stroke="#65adb7" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="72" fill="#f4fbeb" stroke="#243746" stroke-width="11"/>
      <circle r="64" fill="none" stroke="#fff" stroke-width="3"/>
      <g stroke="#60818a" stroke-width="2.5">
        <path d="M-63 0H63M0-63V63M-45-45l90 90M-45 45l90-90"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      </g>
      <circle r="8" fill="#243746"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="18" y="18" width="764" height="473" rx="23" fill="url(#sky)" stroke="#243746" stroke-width="4"/>
  <circle cx="690" cy="151" r="38" fill="#ffda75"/>
  <path d="M49 180c18-27 44-24 57-5 26-25 51-9 57 8H49zm495-55c15-21 36-19 46-4 20-17 42-7 47 8h-93z" fill="#fff" opacity=".8"/>

  <text x="400" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#243746">THE PELICAN PEDAL LOBBY</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="3" fill="#396674">BIG BILL. ZERO GAS.</text>

  <path d="M20 331q120-17 239 0t242 0 279 0v84H20z" fill="#92ccd0"/>
  <path d="M20 343h760v60H20z" fill="url(#water)"/>
  <path d="M20 413q330-24 760 0v57q0 19-20 19H40q-20 0-20-19z" fill="#ddc49b"/>
  <path d="M45 466h710" stroke="#a38765" stroke-width="3" stroke-dasharray="28 18"/>
  <ellipse cx="394" cy="456" rx="222" ry="13" fill="#705c49" opacity=".18"/>

  <!-- The wheels turn independently of the stable bicycle frame. -->
  <use href="#wheel" x="263" y="382"/>
  <use href="#wheel" x="550" y="382"/>

  <g fill="none" stroke="#243746" stroke-linecap="round" stroke-linejoin="round">
    <path d="M263 382l82-116 51 116H263l215-116-82 116m82-116 72 116" stroke-width="13"/>
    <path d="M263 382l82-116 51 116H263l215-116-82 116m82-116 72 116" stroke="#ee6254" stroke-width="7"/>
    <path d="M345 266l-9-29m-23 0h49" stroke-width="10"/>
    <path d="M478 266l-13-47 29-9" stroke-width="8"/>
    <path d="M483 210h24" stroke-width="12"/>
    <path d="M395 382l-48-111" stroke="#b7433c" stroke-width="3"/>
    <circle cx="396" cy="382" r="20" fill="#f9df9f" stroke-width="5"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <!-- Feet rock with the crank. -->
    <path d="M360 306q34 10 61 47l-25 29" fill="none" stroke="#ed9b43" stroke-width="14" stroke-linecap="round"/>
    <path d="M371 391l26-9 13 6" fill="none" stroke="#d78032" stroke-width="9" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-8 396 382;8 396 382;-8 396 382" dur=".9s" repeatCount="indefinite"/>
    </path>

    <!-- Tail, belly, neck, and extravagant bill form one readable bird. -->
    <path d="M309 250l-35-23 10 43-21-4 35 35" fill="#fffdf0" stroke="#243746" stroke-width="4" stroke-linejoin="round"/>
    <path d="M316 221c-42 10-48 63-20 91 20 22 77 19 101-7 24-27 17-52 17-78l9-45c5-24 34-26 43-8 8 16-8 34-19 49-13 19-5 43-15 67-9 21-27 34-49 35" fill="#fffdf0" stroke="#243746" stroke-width="4"/>
    <path d="M317 241c-28 25-15 61 14 66 29 5 56-13 61-42-19 13-39 12-55 0" fill="#d8e2df" stroke="#243746" stroke-width="3"/>
    <path d="M416 210l25 11-13 12-14-10z" fill="#ed6252" stroke="#243746" stroke-width="3"/>
    <path d="M427 232l13 4-3 32-13-13z" fill="#ed6252" stroke="#243746" stroke-width="3"/>
    <path d="M374 255q42 7 113-41" fill="none" stroke="#243746" stroke-width="16" stroke-linecap="round"/>
    <path d="M374 252q42 7 111-41" fill="none" stroke="#fffdf0" stroke-width="11" stroke-linecap="round"/>

    <path d="M454 181l177 20c-27 56-93 87-153 28-13-12-20-29-24-48z" fill="url(#pouch)" stroke="#243746" stroke-width="4"/>
    <path d="M454 178l182 18q9 2-2 9l-181-9" fill="#ffd470" stroke="#243746" stroke-width="4" stroke-linejoin="round"/>

    <!-- A distinctly unimpressed passenger. -->
    <path d="M526 225q22-25 48-7l17-12-1 29-17-8q-24 19-47-2z" fill="#66b4bf" stroke="#243746" stroke-width="3"/>
    <circle cx="537" cy="220" r="3" fill="#243746"/>
    <path d="M544 231l12-3m2-13 5 11" fill="none" stroke="#243746" stroke-width="2"/>

    <ellipse cx="446" cy="173" rx="11" ry="13" fill="#fff" stroke="#243746" stroke-width="3"/>
    <circle cx="450" cy="172" r="4" fill="#243746"/>
    <path d="M433 154l23-3" stroke="#243746" stroke-width="5" stroke-linecap="round"/>
    <path d="M415 151l55-8-13-12-4-22-37 6 4 22-11 10z" fill="#243746"/>
    <path d="M419 132l35-5" stroke="#ef6657" stroke-width="7"/>
  </g>

  <g transform="translate(396 382)" stroke="#243746" stroke-width="6" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-22 0h44"/>
      <path d="M-29-4h14m0 8h-14M15-4h14m0 8H15" stroke-width="4"/>
    </g>
    <circle r="5" fill="#243746" stroke="none"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#243746">
    <path d="M63 201q0-15 15-15h178q15 0 15 15v49q0 15-15 15h-19l19 29-49-29H78q-15 0-15-15z" fill="#fffdf5" stroke="#243746" stroke-width="3"/>
    <text x="167" y="217" text-anchor="middle" font-size="20" font-weight="bold">“It’s a company car.</text>
    <text x="167" y="245" text-anchor="middle" font-size="20" font-weight="bold">I’m the company.”</text>
  </g>

  <text x="400" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#243746">He pedals for the planet. The fish pays the fare.</text>
  <path d="M65 544h670" stroke="#d9c9a8" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#42515a">2026-10-30 05:31:15 SGT (UTC+08:00)</text>
</svg>