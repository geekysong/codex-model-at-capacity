<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly pretending it has everything under control.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6570"/>
      <stop offset="1" stop-color="#343a42"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ink{stroke:#202631;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202631}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .body{animation:bob 1.1s ease-in-out infinite}
      .pedal{animation:pedal .8s linear infinite}
      .dash{animation:roadmove 1.4s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
      @keyframes roadmove{to{transform:translateX(-80px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="112" r="47" fill="#fff4b0" opacity=".85"/>
  <path d="M0 285 Q110 230 220 280 T450 270 T800 250 V390 H0Z" fill="#8acb83"/>
  <path d="M0 335 Q130 300 260 338 T520 325 T800 310 V430 H0Z" fill="#62ad70"/>
  <path d="M0 400 L800 360 V600 H0Z" fill="url(#road)"/>
  <g class="dash" fill="#f8df76">
    <rect x="20" y="482" width="92" height="12" rx="6"/>
    <rect x="190" y="474" width="92" height="12" rx="6"/>
    <rect x="360" y="466" width="92" height="12" rx="6"/>
    <rect x="530" y="458" width="92" height="12" rx="6"/>
    <rect x="700" y="450" width="92" height="12" rx="6"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="42" width="644" height="92" rx="24" fill="#fffdf4" class="ink"/>
    <text x="400" y="82" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN PEDAL PANIC</text>
    <text x="400" y="112" text-anchor="middle" class="label" font-size="19" font-weight="700">“All beak, no brakes, absolutely no plan.”</text>
  </g>

  <!-- bicycle -->
  <g class="bike" fill="none" class="ink">
    <g class="wheel ink wheel">
      <circle cx="265" cy="430" r="79" fill="#d9eef5"/>
      <circle cx="265" cy="430" r="10" fill="#202631"/>
      <path d="M265 351V509 M186 430H344 M209 374L321 486 M321 374L209 486"/>
    </g>
    <g class="wheel ink wheel">
      <circle cx="535" cy="430" r="79" fill="#d9eef5"/>
      <circle cx="535" cy="430" r="10" fill="#202631"/>
      <path d="M535 351V509 M456 430H614 M479 374L591 486 M591 374L479 486"/>
    </g>
    <path d="M265 430 L360 315 L455 430 L265 430 M360 315 L535 430 M455 430 L500 310" stroke="#d94f45" stroke-width="12"/>
    <path d="M490 300h44 M500 310l-22-22" stroke="#202631" stroke-width="8"/>
    <path d="M341 314h-38" stroke="#202631" stroke-width="11"/>
    <circle cx="360" cy="315" r="13" fill="#f4c542" stroke="#202631" stroke-width="5"/>
    <g class="pedal" transform-origin="360 315">
      <circle cx="360" cy="315" r="32" stroke="#202631" stroke-width="5"/>
      <path d="M360 315l26 20 M386 335h18 M360 315l-25-20 M335 295h-18" stroke="#202631" stroke-width="6"/>
    </g>
  </g>

  <!-- pelican -->
  <g class="body" filter="url(#shadow)">
    <ellipse cx="395" cy="250" rx="105" ry="91" fill="#f5f3e9" class="ink"/>
    <path d="M320 250 Q290 205 310 157 Q330 125 365 151 Q390 173 375 217Z" fill="#dce8ea" class="ink"/>
    <path d="M450 193 Q505 165 558 196 Q585 212 553 231 L455 246Z" fill="#ef8e45" class="ink"/>
    <path d="M450 218 Q513 213 557 228 Q523 270 458 248Z" fill="#f5a65b" class="ink"/>
    <circle cx="429" cy="177" r="16" fill="#fff" class="ink"/>
    <circle cx="433" cy="177" r="6" fill="#202631"/>
    <path d="M414 142 Q443 121 465 139" fill="none" stroke="#202631" stroke-width="7"/>
    <path d="M345 304 Q325 330 339 356 M426 320 Q439 345 431 365" fill="none" stroke="#ef8e45" stroke-width="15"/>
    <path d="M336 356l-28 14 M431 365l27 10" fill="none" stroke="#202631" stroke-width="7"/>
    <path d="M330 205 Q362 220 382 247" fill="none" stroke="#202631" stroke-width="6"/>
    <path d="M505 190 Q520 160 548 158" fill="none" stroke="#202631" stroke-width="7"/>
    <text x="391" y="274" text-anchor="middle" class="label" font-size="18" font-weight="900" fill="#d94f45">HONK!</text>
  </g>

  <!-- comic motion marks -->
  <path d="M160 245l-38-18 M155 270l-46-3 M165 295l-39 17" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M625 250l38-18 M630 274l47-2 M620 298l40 17" stroke="#fff" stroke-width="8" stroke-linecap="round"/>

  <g>
    <rect x="170" y="525" width="460" height="48" rx="14" fill="#202631"/>
    <text x="400" y="556" text-anchor="middle" fill="#fffdf4" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">2026-10-29 10:01:22 SGT (UTC+08:00)</text>
  </g>
</svg>