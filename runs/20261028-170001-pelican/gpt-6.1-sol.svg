<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE PELICAN EXPRESS</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an oversized fish-shaped briefcase.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ef"/>
      <stop offset="1" stop-color="#d9f5e8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b66"/>
      <stop offset="1" stop-color="#30343d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#25313b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202a35;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202a35}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .rider{transform-box:fill-box;transform-origin:50% 90%;animation:bob 1.2s ease-in-out infinite}
      .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 355 Q110 315 220 350 T450 342 T680 350 T800 335 V425 H0Z" fill="#93c47d"/>
  <path d="M0 410 Q180 385 350 415 T800 400 V600 H0Z" fill="url(#road)"/>
  <path d="M0 530 H800" stroke="#f6d36b" stroke-width="8" stroke-dasharray="55 30"/>

  <g filter="url(#shadow)">
    <rect x="38" y="28" width="724" height="82" rx="20" fill="#fff6d9" class="ink"/>
    <text x="400" y="70" text-anchor="middle" class="label" font-size="38" font-weight="900" letter-spacing="2">THE PELICAN EXPRESS</text>
    <text x="400" y="96" text-anchor="middle" class="label" font-size="16" font-weight="700">“Why fly when you can pedal into public office?”</text>
  </g>

  <g class="rider" filter="url(#shadow)">
    <!-- bicycle -->
    <g>
      <g class="wheel">
        <circle cx="220" cy="447" r="68" fill="#eff7f5" class="ink"/>
        <circle cx="220" cy="447" r="10" fill="#ef6c5b" class="ink"/>
        <path d="M220 379V515 M152 447H288 M172 399L268 495 M268 399L172 495" stroke="#7b8791" stroke-width="3"/>
      </g>
      <g class="wheel">
        <circle cx="555" cy="447" r="68" fill="#eff7f5" class="ink"/>
        <circle cx="555" cy="447" r="10" fill="#ef6c5b" class="ink"/>
        <path d="M555 379V515 M487 447H623 M507 399L603 495 M603 399L507 495" stroke="#7b8791" stroke-width="3"/>
      </g>
      <path d="M220 447 L345 447 L430 370 L555 447 L430 447 L345 447 L300 390 Z" fill="none" class="ink"/>
      <path d="M430 370 L452 330 M430 370 L400 335" fill="none" class="ink"/>
      <path d="M292 388 L270 374 H235" fill="none" class="ink"/>
      <path d="M452 330 H478" fill="none" class="ink"/>
      <circle cx="345" cy="447" r="18" fill="#ffd166" class="ink"/>
      <g class="pedal">
        <path d="M345 447 L375 470 M345 447 L315 424" stroke="#202a35" stroke-width="6"/>
        <path d="M370 470 h25 M290 424 h25" stroke="#202a35" stroke-width="6"/>
      </g>
      <path d="M400 335 Q420 320 445 332" fill="none" stroke="#202a35" stroke-width="7"/>
      <!-- ridiculous fish briefcase -->
      <path d="M500 270 Q565 220 635 270 Q565 320 500 270Z" fill="#f28c64" class="ink"/>
      <path d="M635 270 l28 -20 v40 z" fill="#ffd166" class="ink"/>
      <circle cx="580" cy="260" r="5" fill="#202a35"/>
      <path d="M545 232 q5 -18 18 0" fill="none" class="ink"/>
    </g>

    <!-- pelican -->
    <g>
      <ellipse cx="405" cy="280" rx="67" ry="88" fill="#f4f1df" class="ink"/>
      <path d="M365 258 Q405 215 452 245 L470 280 Q424 309 365 286Z" fill="#e8e0c3" class="ink"/>
      <path d="M455 254 Q535 255 590 285 Q535 317 455 300 Q425 284 455 254Z" fill="#f39a61" class="ink"/>
      <path d="M582 285 Q612 280 630 291 Q610 300 583 297" fill="#e87855" class="ink"/>
      <circle cx="430" cy="236" r="13" fill="#fff" class="ink"/>
      <circle cx="434" cy="237" r="5" fill="#202a35"/>
      <path d="M380 224 Q405 190 440 214" fill="#f39a61" class="ink"/>
      <path d="M378 300 Q330 333 350 377 Q385 352 412 321" fill="#d9d2b7" class="ink"/>
      <path d="M398 351 L370 410 M435 350 L470 408" fill="none" class="ink"/>
      <path d="M354 376 l-18 12 M354 376 l-4 18 M470 408 l18 9 M470 408 l3 18" fill="none" class="ink"/>
      <path d="M390 181 q28 -34 57 0" fill="none" stroke="#202a35" stroke-width="5"/>
      <text x="405" y="160" text-anchor="middle" class="label" font-size="18" font-weight="900" fill="#d94f45">HONK IF YOU'RE HUNGRY</text>
    </g>
  </g>

  <g transform="translate(72 140)">
    <path d="M0 35 Q35 0 70 35 Q35 48 0 35Z" fill="#fff" opacity=".8"/>
    <path d="M85 55 Q120 20 155 55 Q120 68 85 55Z" fill="#fff" opacity=".8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="52" y="548" width="696" height="34" rx="10" fill="#fff6d9" class="ink"/>
    <text x="400" y="571" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 17:01:10 SGT (UTC+08:00)</text>
  </g>
</svg>