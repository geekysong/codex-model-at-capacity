<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly ignoring traffic laws.</desc>
  <style>
    .ink{stroke:#18202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,sans-serif;fill:#18202a}
  </style>

  <rect width="800" height="600" fill="#bfe9f5"/>
  <rect y="430" width="800" height="170" fill="#f7d98b"/>
  <path d="M0 448 Q120 420 240 450 T480 448 T800 450" fill="none" stroke="#d29c52" stroke-width="8"/>
  <path d="M0 500 Q140 475 280 505 T560 500 T800 505" fill="none" stroke="#d29c52" stroke-width="7"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="42" font-weight="900">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="98" text-anchor="middle" class="label" font-size="20" font-weight="700">One bird. Two wheels. Zero knowledge of traffic etiquette.</text>

  <g transform="translate(0,0)">
    <g aria-label="bicycle">
      <g transform="translate(300 420)">
        <circle r="67" fill="#eaf7fb" class="ink"/>
        <g>
          <path d="M0 0 L0 -67 M0 0 L58 34 M0 0 L-58 34 M0 0 L0 67 M0 0 L-58 -34 M0 0 L58 -34" stroke="#5b8791" stroke-width="4"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
        </g>
        <circle r="9" fill="#f05b4f" class="ink"/>
      </g>
      <g transform="translate(575 420)">
        <circle r="67" fill="#eaf7fb" class="ink"/>
        <g>
          <path d="M0 0 L0 -67 M0 0 L58 34 M0 0 L-58 34 M0 0 L0 67 M0 0 L-58 -34 M0 0 L58 -34" stroke="#5b8791" stroke-width="4"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
        </g>
        <circle r="9" fill="#f05b4f" class="ink"/>
      </g>

      <path d="M300 420 L390 300 L575 420 L300 420 L470 420 L390 300 L450 270" fill="none" class="ink" stroke="#e84f3d" stroke-width="10"/>
      <path d="M450 270 L490 250" class="ink" fill="none"/>
      <path d="M490 250 q18 -8 30 8" class="ink" fill="none"/>
      <path d="M390 300 L365 260" class="ink" fill="none"/>
      <path d="M347 260 L382 260" class="ink" fill="none"/>
      <circle cx="470" cy="420" r="22" fill="none" class="ink"/>
      <path d="M470 420 l-28 -24 M470 420 l30 20" class="ink" fill="none"/>
      <circle cx="442" cy="396" r="7" fill="#18202a"/>
      <circle cx="500" cy="440" r="7" fill="#18202a"/>
      <path d="M418 302 Q430 285 450 275" fill="none" class="ink"/>
      <path d="M575 420 L606 370" class="ink" fill="none"/>
      <path d="M596 365 l24 10" class="ink" fill="none"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1s" repeatCount="indefinite"/>
      <path d="M380 300 Q350 220 390 150 Q430 105 500 145 Q535 170 530 245 L500 315 Q445 340 380 300Z" fill="#fffdf4" class="ink"/>
      <path d="M425 158 Q450 105 510 125 Q553 140 560 185 Q520 174 485 198Z" fill="#fffdf4" class="ink"/>
      <path d="M535 177 Q620 175 695 220 Q620 250 530 220Z" fill="#f5a33b" class="ink"/>
      <path d="M690 220 q28 8 38 25 q-35 2 -62 -10" fill="#ed8b2c" class="ink"/>
      <circle cx="505" cy="155" r="9" fill="#18202a"/>
      <path d="M502 185 q20 15 37 0" fill="none" class="ink"/>
      <path d="M398 215 Q355 230 330 270 Q375 265 425 245" fill="#dceef1" class="ink"/>
      <path d="M418 300 L400 355 M478 310 L500 360" class="ink" fill="none"/>
      <path d="M385 355 q22 12 40 0 M485 360 q22 12 40 0" fill="none" class="ink"/>
      <path d="M430 235 q30 18 52 0" fill="none" stroke="#e84f3d" stroke-width="7"/>
      <text x="425" y="205" class="label" font-size="17" font-weight="700" transform="rotate(-8 425 205)">HONK!</text>
      <path d="M350 180 l-30 -18 M365 155 l-18 -30" stroke="#f05b4f" stroke-width="6"/>
    </g>
  </g>

  <rect x="88" y="350" width="180" height="62" rx="14" fill="#fff8d8" class="ink"/>
  <text x="178" y="377" text-anchor="middle" class="label" font-size="18" font-weight="800">LICENSE?</text>
  <text x="178" y="399" text-anchor="middle" class="label" font-size="18" font-weight="800">“I HAVE A BEAK.”</text>
  <path d="M268 380 L325 350" fill="none" class="ink"/>

  <text x="400" y="555" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 17:02:55 SGT (UTC+08:00)</text>
