  <rect x="0" y="504" width="800" height="96" fill="#20333d"/>
  <text x="400" y="539" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#fff4d9">He rides for fitness. The fish ride against their will.</text>
