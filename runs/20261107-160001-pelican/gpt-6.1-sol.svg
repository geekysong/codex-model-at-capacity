  </g>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" fill="#20333d">TOUR DE FISH</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#53716f">ONE BIRD. TWO WHEELS. ZERO SHAME.</text>

  <ellipse cx="401" cy="475" rx="259" ry="15" fill="#20333d" opacity=".12"/>
  <path d="M80 478H722" stroke="#20333d" stroke-width="4" stroke-linecap="round"/>

