<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish-filled beak pouch. The wheels spin, the pedals turn, and the rider bobs in an endless loop.</desc>
  <defs>
