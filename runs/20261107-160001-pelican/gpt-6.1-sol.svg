    <text x="65" y="24" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#20333d">“It’s called</text>
    <text x="65" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#20333d">carp-loading.”</text>
