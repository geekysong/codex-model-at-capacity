        <path d="M-73 0H73M0-73V73M-52-52L52 52M-52 52L52-52"/>
      </g>
      <circle r="9" fill="#20333d"/>
    </g>
    <g id="fish">
      <path d="M-20 0Q0-20 22 0Q0 20-20 0L-33-12V12Z" fill="#62b7c2" stroke="#20333d" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="12" cy="-2" r="2.5" fill="#20333d"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
