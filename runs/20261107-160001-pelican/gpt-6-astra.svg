<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A smug pelican pedals a bicycle with an enormous fish-filled bill, declaring the load aerodynamic. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="7" r="1" fill="#dfd4b8" opacity=".35"/>
    </pattern>
    <g id="spokes" stroke="#39474c" stroke-width="3">
      <path d="M-72 0H72M0-72V72M-51-51L51 51M-51 51L51-51"/>
      <circle r="11" fill="#f5bb43" stroke="#24363d" stroke-width="4"/>
    </g>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #24363d; }
      .ink { stroke: #24363d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M30 103H770" stroke="#24363d" stroke-width="3"/>
  <text x="400" y="62" text-anchor="middle" font-size="48" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="88" text-anchor="middle" font-size="16" letter-spacing="2">THE COMMUTE HAS A CATCH.</text>

  <!-- A single sunny coastal road -->
  <circle cx="692" cy="158" r="32" fill="#f5bb43"/>
  <g fill="none" stroke="#b7c8c0" stroke-width="3" stroke-linecap="round">
    <path d="M52 189q13-14 26 0q13-14 26 0M628 226q10-10 20 0q10-10 20 0"/>
    <path d="M35 382Q160 350 262 380T493 378T767 373"/>
  </g>
  <path d="M30 443H770L740 482H60Z" fill="#e3d6b9"/>
  <path d="M30 443H770" stroke="#24363d" stroke-width="4"/>
  <ellipse cx="414" cy="448" rx="240" ry="12" fill="#24363d" opacity=".12"/>
  <path d="M69 461H143M657 461H731" stroke="#fff6df" stroke-width="5" stroke-linecap="round"/>

  <!-- Speech bubble stays still and readable -->
  <path d="M60 129H294Q310 129 310 145V200Q310 216 294 216H231L251 243L205 216H60Q44 216 44 200V145Q44 129 60 129Z" fill="white" class="ink"/>
  <text x="177" y="163" text-anchor="middle" font-size="22" font-weight="bold">“It’s not baggage.</text>
  <text x="177" y="193" text-anchor="middle" font-size="24" font-weight="bold">It’s AERO.”</text>

  <!-- Rotating wheels, with offset valve markers to make rotation clear -->
  <g transform="translate(245 365)">
    <circle r="78" fill="#fffaf0" class="ink" stroke-width="9"/>
    <circle r="69" fill="none" stroke="#a9b9b6" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#spokes"/>
      <path d="M0-69V-59" stroke="#e85e46" stroke-width="7"/>
    </g>
  </g>
  <g transform="translate(586 365)">
    <circle r="78" fill="#fffaf0" class="ink" stroke-width="9"/>
    <circle r="69" fill="none" stroke="#a9b9b6" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#spokes"/>
      <path d="M0-69V-59" stroke="#e85e46" stroke-width="7"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 365L325 266L389 365H245L521 268H325M389 365L521 268L586 365" stroke="#24363d" stroke-width="13"/>
    <path d="M245 365L325 266L389 365H245L521 268H325M389 365L521 268L586 365" stroke="#e85e46" stroke-width="7"/>
    <path d="M325 266L312 240M521 268L510 232L546 219L560 225" stroke="#24363d" stroke-width="7"/>
    <path d="M294 240H335" stroke="#24363d" stroke-width="13"/>
    <path d="M548 220L561 225" stroke="#65b5ab" stroke-width="10"/>
  </g>
  <circle cx="389" cy="365" r="23" fill="#f5bb43" class="ink"/>
  <path d="M245 365L389 344Q412 346 411 365Q412 384 389 387L245 371Z" fill="none" stroke="#24363d" stroke-width="2"/>

  <!-- Pelican and tiny pumping legs -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M338 242L344 297L405 340" fill="none" stroke="#24363d" stroke-width="17" stroke-linecap="round"/>
    <path d="M338 242L344 297L405 340" fill="none" stroke="#efa538" stroke-width="10" stroke-linecap="round"/>
    <path d="M359 248L402 296L378 380" fill="none" stroke="#24363d" stroke-width="17" stroke-linecap="round">
      <animate attributeName="d" values="M359 248L402 296L378 380;M359 248L381 291L400 350;M359 248L402 296L378 380" dur=".8s" repeatCount="indefinite"/>
    </path>
    <path d="M359 248L402 296L378 380" fill="none" stroke="#efa538" stroke-width="10" stroke-linecap="round">
      <animate attributeName="d" values="M359 248L402 296L378 380;M359 248L381 291L400 350;M359 248L402 296L378 380" dur=".8s" repeatCount="indefinite"/>
    </path>

    <path d="M319 207L283 179L293 217L269 211L303 241" fill="#fffdf5" class="ink"/>
    <path d="M301 208Q302 167 349 166Q378 166 386 192L401 221Q386 265 337 256Q299 251 301 208Z" fill="#fffdf5" class="ink"/>
    <path d="M313 197Q350 182 371 209L394 232Q350 250 321 226" fill="#d4e5df" class="ink"/>
    <path d="M357 176Q377 153 383 120Q391 102 411 112Q436 125 422 152L413 180Q414 202 435 210L418 230Q378 213 357 176Z" fill="#fffdf5" class="ink"/>
    <!-- Helmet -->
    <path d="M379 129Q378 101 408 102Q437 102 441 128Z" fill="#e85e46" class="ink"/>
    <path d="M394 109L391 121M409 108V120M423 112L427 122" stroke="#fff6df" stroke-width="5" stroke-linecap="round"/>
    <path d="M384 130L402 153L428 131" fill="none" stroke="#24363d" stroke-width="3"/>
    <!-- Eye and eyebrow -->
    <circle cx="420" cy="144" r="12" fill="white" stroke="#24363d" stroke-width="3"/>
    <circle cx="424" cy="144" r="4" fill="#24363d"/>
    <path d="M409 131L430 134" stroke="#24363d" stroke-width="4" stroke-linecap="round"/>

    <!-- Absurdly capacious bill pouch -->
    <path d="M431 158L657 169Q623 257 534 263Q466 257 431 158Z" fill="#f5bb43" class="ink"/>
    <path d="M450 177Q474 236 528 244Q596 246 631 185" fill="#ffd979" stroke="#dc9636" stroke-width="3"/>
    <g class="ink" stroke-width="3">
      <path d="M483 208Q512 183 543 209Q512 232 483 208L469 220V194Z" fill="#65b5ab"/>
      <circle cx="532" cy="205" r="3" fill="#24363d" stroke="none"/>
      <path d="M550 223Q576 198 606 218Q582 242 550 223L539 236L535 211Z" fill="#85aabe"/>
      <circle cx="596" cy="216" r="3" fill="#24363d" stroke="none"/>
    </g>
    <path d="M430 151Q535 145 670 168L656 180L431 168Z" fill="#efa538" class="ink"/>
    <path d="M453 159L626 169" stroke="#ffe3a2" stroke-width="3" stroke-linecap="round"/>
    <!-- Wing reaches the handlebars -->
    <path d="M350 196Q388 205 427 237L511 229" fill="none" stroke="#24363d" stroke-width="18" stroke-linecap="round"/>
    <path d="M350 196Q388 205 427 237L511 229" fill="none" stroke="#d4e5df" stroke-width="11" stroke-linecap="round"/>
    <path d="M503 227L518 223M504 231L520 230" stroke="#24363d" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(389 365)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-25 0H25" stroke="#24363d" stroke-width="6"/>
      <path d="M-34-4H-16M16 4H34" stroke="#24363d" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="6" fill="#fff6df" stroke="#24363d" stroke-width="3"/>
  </g>
  <g stroke="#24363d" stroke-width="4" stroke-linecap="round">
    <path d="M145 298H195M159 314H184M111 330H170"/>
  </g>

  <!-- Caption and dedicated timestamp footer -->
  <text x="400" y="513" text-anchor="middle" font-size="24" font-weight="bold">He bought a racing bike. His bill stayed enormous.</text>
  <path d="M30 539H770" stroke="#24363d" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" font-size="20">2026-11-07 16:00:01 SGT (UTC+08:00)</text>
</svg>