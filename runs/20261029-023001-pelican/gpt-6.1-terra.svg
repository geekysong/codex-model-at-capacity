<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <style>
      .ink{stroke:#243447;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,sans-serif;fill:#243447}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#dff4ff"/>
  <rect y="455" width="800" height="145" fill="#b9e39b"/>
  <path d="M0 455 Q130 420 260 455 T520 455 T800 455" fill="none" stroke="#83bd72" stroke-width="8"/>

  <text x="400" y="42" text-anchor="middle" class="label" font-size="31" font-weight="800">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="72" text-anchor="middle" class="label" font-size="17" font-style="italic">“Why fly when you can pedal dramatically?”</text>

  <g opacity=".75" fill="#fff">
    <circle cx="115" cy="135" r="28"/><circle cx="145" cy="128" r="38"/><circle cx="185" cy="140" r="25"/>
    <circle cx="650" cy="125" r="30"/><circle cx="690" cy="118" r="42"/><circle cx="735" cy="132" r="26"/>
  </g>

  <g filter="url(#shadow)">
    <g id="bike">
      <g>
        <circle cx="245" cy="430" r="72" fill="#f7fbff" class="ink"/>
        <circle cx="575" cy="430" r="72" fill="#f7fbff" class="ink"/>
        <g stroke="#8aa0b2" stroke-width="2">
          <path d="M245 358v144M173 430h144M194 379l102 102M296 379L194 481"/>
          <path d="M575 358v144M503 430h144M524 379l102 102M626 379L524 481"/>
        </g>
        <g fill="none" class="ink">
          <path d="M245 430 L335 330 L445 430 L245 430 L390 430 L335 330"/>
          <path d="M445 430 L510 335 L575 430"/>
          <path d="M335 330 L320 305"/>
          <path d="M510 335 L530 300"/>
        </g>
        <path d="M309 301h38" class="ink" fill="none"/>
        <path d="M520 296h38" class="ink" fill="none"/>
        <circle cx="390" cy="430" r="17" fill="#ffca3a" class="ink"/>
        <path d="M390 430l-28-31M390 430l32 29" class="ink" fill="none"/>
        <circle cx="358" cy="399" r="8" fill="#243447"/>
        <circle cx="422" cy="459" r="8" fill="#243447"/>
      </g>

      <g id="spinningWheels">
        <g transform="translate(245 430)">
          <circle r="61" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-dasharray="14 18"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        </g>
        <g transform="translate(575 430)">
          <circle r="61" fill="none" stroke="#ff6b6b" stroke-width="6" stroke-dasharray="14 18"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <g id="pelican" class="ink">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="405" cy="245" rx="92" ry="112" fill="#f7f7f2"/>
      <path d="M350 245 Q300 290 330 355 Q375 330 403 278Z" fill="#d8e3e8"/>
      <path d="M455 185 Q510 143 547 194 Q530 241 474 235Z" fill="#f7f7f2"/>
      <circle cx="475" cy="171" r="49" fill="#f7f7f2"/>
      <circle cx="490" cy="160" r="8" fill="#243447"/>
      <path d="M505 177 Q587 169 620 200 Q570 232 500 208Z" fill="#f6a43a"/>
      <path d="M505 208 Q558 222 615 202" fill="none" stroke="#d47723" stroke-width="5"/>
      <path d="M376 347 Q372 380 350 405" fill="none"/>
      <path d="M438 347 Q446 379 474 405" fill="none"/>
      <path d="M337 405h35M460 405h35" fill="none"/>
      <path d="M365 285 Q408 310 450 284" fill="none" stroke="#e6a83a" stroke-width="8"/>
      <path d="M365 285 Q405 270 450 284" fill="none" stroke="#e6a83a" stroke-width="8"/>
      <path d="M370 390 L335 350" fill="none"/>
      <path d="M463 390 L495 350" fill="none"/>
      <path d="M335 350 L320 305M495 350 L530 300" fill="none"/>
    </g>
  </g>

  <g class="label">
    <text x="120" y="330" font-size="18" font-weight="700">NO WINGS?</text>
    <text x="120" y="354" font-size="18" font-weight="700">NO PROBLEM!</text>
    <path d="M205 360 Q260 330 315 300" fill="none" stroke="#243447" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <text x="400" y="530" text-anchor="middle" class="label" font-size="18" font-weight="700">A beak, two wheels, and absolutely no sense of traffic laws.</text>
  <rect x="0" y="555" width="800" height="45" fill="#243447"/>
  <text x="400" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">2026-10-29 02:33:02 SGT (UTC+08:00)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#243447"/>
    </marker>
  </defs>
</svg>