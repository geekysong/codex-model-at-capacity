<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f5"/>
      <stop offset="1" stop-color="#e7f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="1" stop-color="#353535"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#173042" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#17212b;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
      .bold{font-weight:800}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="116" r="55" fill="#fff7b0" opacity=".75"/>
  <path d="M0 380 Q150 330 300 372 T600 365 T800 350 V600 H0Z" fill="#8bc27b"/>
  <path d="M0 455 Q180 420 370 448 T800 430 V600 H0Z" fill="#6ea664"/>
  <path d="M0 505 Q175 478 370 500 T800 484 V600 H0Z" fill="url(#road)"/>
  <path d="M0 545 H800" stroke="#f6d76b" stroke-width="8" stroke-dasharray="50 30" opacity=".9"/>

  <g filter="url(#shadow)">
    <rect x="42" y="30" width="716" height="82" rx="22" fill="#fffdf3" class="ink"/>
    <text x="400" y="69" text-anchor="middle" class="label bold" font-size="32">THE PELICAN PEDAL EXPRESS</text>
    <text x="400" y="96" text-anchor="middle" class="label" font-size="17">“When the beak is full, every commute becomes a seafood delivery.”</text>
  </g>

  <!-- bicycle -->
  <g class="ink" fill="none">
    <circle cx="244" cy="466" r="76" stroke="#1b2630" stroke-width="9"/>
    <circle cx="559" cy="466" r="76" stroke="#1b2630" stroke-width="9"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 244 466" to="360 244 466" dur="2s" repeatCount="indefinite"/>
      <circle cx="244" cy="466" r="65" stroke="#d9e5e9" stroke-width="3"/>
      <path d="M244 466L244 390M244 466L310 466M244 466L204 518M244 466L184 438M244 466L294 508M244 466L300 420" stroke="#d9e5e9" stroke-width="3"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 559 466" to="360 559 466" dur="2s" repeatCount="indefinite"/>
      <circle cx="559" cy="466" r="65" stroke="#d9e5e9" stroke-width="3"/>
      <path d="M559 466L559 390M559 466L625 466M559 466L519 518M559 466L499 438M559 466L609 508M559 466L615 420" stroke="#d9e5e9" stroke-width="3"/>
    </g>
    <path d="M244 466 L343 350 L452 466 L244 466 M343 350 L559 466 M452 466 L500 348 L559 466 M486 348 H530" stroke="#e7473f" stroke-width="10"/>
    <circle cx="452" cy="466" r="14" fill="#f3bd38"/>
    <path d="M452 466L418 438M452 466L485 493" stroke="#17212b" stroke-width="7"/>
  </g>

  <!-- pedaling motion -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <!-- pelican body -->
    <ellipse cx="397" cy="289" rx="92" ry="112" fill="#f5f1e6" class="ink"/>
    <path d="M346 280 Q390 212 447 250 Q476 272 465 330 Q451 365 410 371 Q362 361 346 330Z" fill="#d8e1e4" class="ink"/>
    <path d="M404 253 Q444 206 477 226 Q498 239 487 276 Q474 311 435 306Z" fill="#f5f1e6" class="ink"/>
    <!-- neck/head -->
    <ellipse cx="455" cy="188" rx="61" ry="57" fill="#f5f1e6" class="ink"/>
    <path d="M475 211 Q566 215 625 246 Q638 254 625 266 Q544 270 461 247Z" fill="#f0a83a" class="ink"/>
    <path d="M480 236 Q558 247 624 256" fill="none" stroke="#c87925" stroke-width="5"/>
    <circle cx="474" cy="176" r="9" fill="#17212b"/>
    <circle cx="477" cy="173" r="3" fill="#fff"/>
    <path d="M440 140 Q457 120 480 133" fill="none" stroke="#d98f2d" stroke-width="8"/>
    <!-- wing -->
    <path d="M375 274 Q324 295 344 348 Q365 367 405 323 Q420 302 410 280Z" fill="#c8d4d9" class="ink"/>
    <!-- fish in beak -->
    <path d="M561 234 Q601 202 641 224 L661 212 L658 244 L677 259 L649 267 Q609 281 570 257Z" fill="#6ab7c8" class="ink"/>
    <circle cx="624" cy="235" r="4" fill="#17212b"/>
    <path d="M591 229L603 259M615 219L626 268" stroke="#3d8495" stroke-width="4"/>
    <!-- legs -->
    <path d="M382 355 L369 421 L421 456 M427 357 L454 416 L420 455" fill="none" class="ink"/>
    <path d="M419 455 Q442 449 458 462 Q441 476 416 468Z" fill="#f0a83a" class="ink"/>
    <path d="M369 421 Q345 420 331 434 Q347 447 375 439Z" fill="#f0a83a" class="ink"/>
    <!-- handlebars grip -->
    <path d="M497 348 Q510 334 530 348" fill="none" class="ink"/>
  </g>

  <!-- speech bubble -->
  <g filter="url(#shadow)">
    <path d="M594 322 Q690 285 742 329 Q768 353 748 390 Q728 423 649 409 L620 431 L625 401 Q583 382 594 322Z" fill="#fffdf3" class="ink"/>
    <text x="670" y="355" text-anchor="middle" class="label bold" font-size="20">HONK IF YOU</text>
    <text x="670" y="379" text-anchor="middle" class="label bold" font-size="20">LOVE FISH TAX!</text>
  </g>

  <text x="400" y="578" text-anchor="middle" class="label" font-size="15">2026-10-29 02:31:09 SGT (UTC+08:00)</text>
</svg>