<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#222">Shortest path length: 8</text>

  <g transform="translate(150,50)">
    <rect x="0" y="0" width="300" height="300" fill="#f7f7f7" stroke="#222" stroke-width="2"/>

    <!-- blocked cells -->
    <rect x="120" y="0" width="60" height="60" fill="#4a4a4a"/>
    <rect x="120" y="60" width="60" height="60" fill="#4a4a4a"/>
    <rect x="120" y="120" width="60" height="60" fill="#4a4a4a"/>
    <rect x="0" y="120" width="60" height="60" fill="#4a4a4a"/>
    <rect x="180" y="180" width="60" height="60" fill="#4a4a4a"/>
    <rect x="60" y="240" width="60" height="60" fill="#4a4a4a"/>

    <!-- start and goal -->
    <rect x="0" y="0" width="60" height="60" fill="#39a852"/>
    <rect x="240" y="240" width="60" height="60" fill="#d64545"/>

    <!-- grid -->
    <g stroke="#222" stroke-width="2" fill="none">
      <path d="M60 0V300 M120 0V300 M180 0V300 M240 0V300"/>
      <path d="M0 60H300 M0 120H300 M0 180H300 M0 240H300"/>
    </g>

    <!-- shortest path -->
    <polyline points="30,30 30,90 90,90 90,150 90,210 150,210 150,270 210,270 270,270"
              fill="none" stroke="#1976d2" stroke-width="8"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- path step labels -->
    <g font-family="Arial, sans-serif" font-size="18" font-weight="bold"
       text-anchor="middle" dominant-baseline="middle" fill="white">
      <text x="30" y="30">0</text>
      <text x="30" y="90">1</text>
      <text x="90" y="90">2</text>
      <text x="90" y="150">3</text>
      <text x="90" y="210">4</text>
      <text x="150" y="210">5</text>
      <text x="150" y="270">6</text>
      <text x="210" y="270">7</text>
      <text x="270" y="270">8</text>
    </g>
  </g>

  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#222">2026-10-28 07:32:39 SGT (UTC+08:00)</text>
</svg>