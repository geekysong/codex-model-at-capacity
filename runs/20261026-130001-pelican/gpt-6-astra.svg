<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Peak Beak Commuting</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish-filled delivery basket, passing a sign that taxes cars but lets beaks travel free. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#decfa9"/>
    </pattern>
    <g id="wheel">
      <circle r="69" fill="#fff9e9" stroke="#253642" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#e3a953" stroke-width="3"/>
      <g stroke="#71858b" stroke-width="3">
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
      </g>
      <circle r="9" fill="#253642"/>
      <path d="M-12-58H12" stroke="#ef7253" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <rect width="800" height="515" fill="url(#dots)" opacity=".4"/>
  <path d="M0 334Q126 296 260 330T540 323T800 322V484H0Z" fill="#dce7cf"/>
  <g fill="#fffdf4" opacity=".9">
    <path d="M42 174Q31 147 60 145Q65 112 95 130Q119 117 132 145Q155 148 150 174Z"/>
    <path d="M631 168Q623 146 645 139Q656 114 680 130Q703 117 719 146Q746 145 752 168Z"/>
  </g>

  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="900" letter-spacing="2" fill="#253642">PEAK BEAK COMMUTING</text>
  <path d="M182 76H618" stroke="#ef7253" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#586c70">THE CITY'S MOST INFLATED DELIVERY BILL.</text>

  <!-- Roadside satire -->
  <g stroke="#253642" stroke-linejoin="round">
    <path d="M98 274V434" stroke-width="9"/>
    <rect x="28" y="206" width="141" height="90" rx="10" fill="#fffdf2" stroke-width="4"/>
  </g>
  <g text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">
    <text x="98" y="233" font-size="16" fill="#253642">CONGESTION TAX</text>
    <text x="98" y="258" font-size="19" fill="#d6543c">CARS: $20</text>
    <text x="98" y="283" font-size="18" fill="#277a70">BEAKS: FREE</text>
  </g>

  <path d="M0 484H800" stroke="#253642" stroke-width="5"/>
  <ellipse cx="419" cy="480" rx="244" ry="13" fill="#253642" opacity=".13"/>
  <g stroke="#fffdf2" stroke-width="5" stroke-linecap="round">
    <path d="M28 501H128M665 501H765"/>
  </g>

  <!-- Individually spinning wheels -->
  <g transform="translate(255 409)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(579 409)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Bicycle -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 409L331 308L405 409ZM331 308H530L405 409M530 308L579 409" fill="none" stroke="#253642" stroke-width="14"/>
    <path d="M255 409L331 308L405 409ZM331 308H530L405 409M530 308L579 409" fill="none" stroke="#28a99a" stroke-width="8"/>
    <path d="M331 308L320 281M530 308L517 267L547 254" fill="none" stroke="#253642" stroke-width="9"/>
    <path d="M298 283H347" stroke="#253642" stroke-width="13"/>
    <path d="M540 253L556 251" stroke="#ef7253" stroke-width="12"/>
    <path d="M232 329H303M245 329L255 392" fill="none" stroke="#253642" stroke-width="5"/>
    <path d="M543 318H625L638 265H552Z" fill="#d7a26b" stroke="#253642" stroke-width="4"/>
    <path d="M554 278H633M550 292H629M563 266L568 316M586 266V316M611 266L605 316" fill="none" stroke="#8e633f" stroke-width="3"/>
  </g>

  <!-- Basket cargo -->
  <g stroke="#253642" stroke-width="3" stroke-linejoin="round">
    <path d="M573 267Q557 238 580 224Q600 241 587 267" fill="#81b8bb"/>
    <path d="M580 227L565 217L580 211L591 215Z" fill="#81b8bb"/>
    <circle cx="580" cy="248" r="3" fill="#253642" stroke="none"/>
    <path d="M598 266Q590 242 613 236L622 224L625 239Q641 260 615 270" fill="#a4c8b9"/>
    <circle cx="608" cy="253" r="3" fill="#253642" stroke="none"/>
  </g>
  <rect x="562" y="280" width="60" height="24" rx="3" fill="#fff6df"/>
  <text x="592" y="297" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#253642">LUNCH</text>

  <!-- Pelican and animated pedaling -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M325 272Q359 293 372 336L405 388" fill="none" stroke="#b77c33" stroke-width="11" stroke-linecap="round"/>
    <path d="M279 261L244 249L259 278L239 281Q275 302 306 281" fill="#fffdf4" stroke="#253642" stroke-width="4" stroke-linejoin="round"/>
    <path d="M284 220Q300 188 348 201Q374 211 384 251Q391 284 350 298Q304 309 279 280Q263 254 284 220Z" fill="#fffdf4" stroke="#253642" stroke-width="4"/>
    <path d="M341 218Q377 198 380 160Q383 132 407 134Q432 137 429 165Q424 207 397 248L375 275" fill="#fffdf4" stroke="#253642" stroke-width="4" stroke-linecap="round"/>
    <path d="M422 164L565 182Q536 210 479 215Q442 212 422 181Z" fill="#efb74f" stroke="#253642" stroke-width="4" stroke-linejoin="round"/>
    <path d="M426 163L565 182L427 182Z" fill="#ffdb70" stroke="#253642" stroke-width="4" stroke-linejoin="round"/>
    <path d="M441 189Q463 204 491 202" fill="none" stroke="#d28b3d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="413" cy="155" r="5" fill="#253642"/>
    <path d="M401 144L419 141" stroke="#253642" stroke-width="4" stroke-linecap="round"/>
    <path d="M379 140Q378 112 405 111Q432 111 434 136Z" fill="#ef7253" stroke="#253642" stroke-width="4"/>
    <path d="M393 115L393 130M407 114L409 130M422 119L424 131" stroke="#fff6df" stroke-width="4" stroke-linecap="round"/>
    <path d="M382 140L397 173" fill="none" stroke="#253642" stroke-width="3"/>
    <path d="M372 204L393 216L380 233L362 218Z" fill="#ef7253" stroke="#253642" stroke-width="3"/>
    <path d="M367 215Q340 205 326 220Q317 239 345 251Q383 269 424 259L539 255" fill="#e5e8df" stroke="#253642" stroke-width="5" stroke-linecap="round"/>
    <path d="M345 238Q373 255 416 248" fill="none" stroke="#a3b2ac" stroke-width="3" stroke-linecap="round"/>
    <path d="M344 290L362 337L405 395" fill="none" stroke="#e6a644" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M344 290L362 337L405 395;M344 290L389 332L425 409;M344 290L370 354L405 423;M344 290L349 340L385 409;M344 290L362 337L405 395" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g transform="translate(405 409)">
    <circle r="20" fill="#fff6df" stroke="#253642" stroke-width="5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M0-18V18" stroke="#253642" stroke-width="6"/>
      <path d="M-13-18H13M-13 18H13" stroke="#e6a644" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#253642"/>
  </g>

  <!-- Motion marks -->
  <g fill="none" stroke="#71858b" stroke-width="3" stroke-linecap="round">
    <path d="M192 357H222M180 370H210M662 384H690">
      <animate attributeName="opacity" values=".3;1;.3" dur=".7s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Dedicated, stationary caption and timestamp footer -->
  <rect x="0" y="518" width="800" height="82" fill="#253642"/>
  <text x="400" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff6df">Zero emissions. Unlimited fish breath.</text>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#f6d990">2026-10-26 13:00:01 SGT (UTC+08:00)</text>
</svg>