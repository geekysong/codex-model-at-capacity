<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, carrying a fish in its enormous beak pouch. Wheels spin, legs pedal, and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1"/>
    <g id="wheel">
      <circle r="76" fill="#fff8e5" stroke="#243443" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#a4bec2" stroke-width="3"/>
