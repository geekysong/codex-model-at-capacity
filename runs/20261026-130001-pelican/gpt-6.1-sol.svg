  </g>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#243443">TOUR DE FISH</text>
  <text x="400" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#587278">ONE BIRD. TWO WHEELS. ZERO AERODYNAMICS.</text>

