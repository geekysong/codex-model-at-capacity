    <circle cx="253" cy="405" r="43" fill="none" stroke="#e8b84f" stroke-width="3"/>
    <path d="M253 349 V461 M197 405 H309 M213 365 L293 445 M213 445 L293 365" fill="none" stroke="#87999a" stroke-width="3"/>
    <circle cx="253" cy="405" r="6" fill="#26333a"/>
  </g>
  <g class="wheel">
    <circle cx="560" cy="405" r="57" fill="#fff9e9" stroke="#26333a" stroke-width="9"/>
    <circle cx="560" cy="405" r="43" fill="none" stroke="#e8b84f" stroke-width="3"/>
    <path d="M560 349 V461 M504 405 H616 M520 365 L600 445 M520 445 L600 365" fill="none" stroke="#87999a" stroke-width="3"/>
    <circle cx="560" cy="405" r="6" fill="#26333a"/>
  </g>

  <g fill="none" class="ink">
    <path d="M253 405 L328 317 L399 405 Z" stroke="#dc6a50" stroke-width="9"/>
    <path d="M328 317 L470 316 L399 405 L560 405 L501 294" stroke="#dc6a50" stroke-width="9"/>
    <path d="M470 316 L501 294 L487 273 H459" stroke="#26333a" stroke-width="6"/>
