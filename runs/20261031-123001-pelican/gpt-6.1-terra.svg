    <path d="M395 132 L400 116 L409 130 L417 115 L422 132" fill="#d46f53" stroke="#26333a" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="408" cy="158" rx="10" ry="12" fill="#fff" stroke="#26333a" stroke-width="3"/>
    <circle cx="411" cy="160" r="4" fill="#26333a"/>
    <path d="M418 170 Q476 166 540 179 Q497 192 433 190Z" fill="#f4a949" class="ink"/>
