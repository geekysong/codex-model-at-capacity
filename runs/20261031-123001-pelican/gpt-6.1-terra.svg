<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN IN THE BIKE LANE</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle with spinning wheels and bobbing as it pedals.</desc>
  <defs>
    <style>
      .ink { stroke:#26333a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob .8s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-7px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation-duration:8s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f7eacb"/>
  <rect x="20" y="20" width="760" height="560" rx="20" fill="#fff9e9" stroke="#26333a" stroke-width="5"/>
  <text x="400" y="78" text-anchor="middle" fill="#26333a" font-family="Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="2">PELICAN IN THE BIKE LANE</text>

  <rect x="40" y="96" width="720" height="370" rx="14" fill="#b8e4e2"/>
  <circle cx="674" cy="153" r="36" fill="#ffd36a"/>
