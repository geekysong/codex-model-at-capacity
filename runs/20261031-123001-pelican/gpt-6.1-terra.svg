    <path d="M383 392 L415 418 M373 390 H389 M409 420 H425" fill="none" stroke="#26333a" stroke-width="5" stroke-linecap="round"/>
    <circle cx="399" cy="405" r="4" fill="#26333a"/>
  </g>

