    <path d="M464 197 Q483 204 505 195" fill="none" stroke="#c77c36" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M605 205 Q651 191 690 207 L690 254 Q651 244 605 258Z" fill="#fff9e9" stroke="#26333a" stroke-width="4"/>
  <path d="M605 258 L585 271 L598 251" fill="#fff9e9" stroke="#26333a" stroke-width="4" stroke-linejoin="round"/>
  <text x="647" y="225" text-anchor="middle" fill="#26333a" font-family="Arial,sans-serif" font-size="15" font-weight="bold">NICE</text>
  <text x="647" y="244" text-anchor="middle" fill="#26333a" font-family="Arial,sans-serif" font-size="15" font-weight="bold">POUCH!</text>

  <text x="400" y="504" text-anchor="middle" fill="#26333a" font-family="Arial, sans-serif" font-size="20" font-weight="bold">He insists the bike lane is a pelican-only lane.</text>
