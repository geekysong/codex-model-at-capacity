  <path d="M40 423 H760 V466 H40Z" fill="#66777a"/>
  <path d="M65 445 H165 M225 445 H325 M385 445 H485 M545 445 H645 M705 445 H745" stroke="#fff4cf" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(105 225)">
    <path d="M0 160 V31" fill="none" stroke="#53676a" stroke-width="7"/>
    <rect x="-35" y="0" width="70" height="72" rx="8" fill="#fff9e9" stroke="#26333a" stroke-width="4"/>
    <text x="0" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#26333a">BIKE</text>
    <text x="0" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#26333a">LANE</text>
    <path d="M-20 55 H20 M12 49 L20 55 L12 61" fill="none" stroke="#d26b4f" stroke-width="3"/>
  </g>

  <g class="wheel" transform="translate(0 0)">
