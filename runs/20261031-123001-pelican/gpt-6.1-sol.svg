      .ink{stroke:#243047;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#243047;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:Arial,Helvetica,sans-serif;fill:#243047}
    </style>
    <pattern id="basket" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e5ad62"/>
      <path d="M0 7H14M7 0V14" stroke="#9c663c" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fff8e6" stroke="#243047" stroke-width="10"/>
      <circle r="64" fill="#dff4f1" stroke="#8cb8b6" stroke-width="2"/>
      <g stroke="#657b91" stroke-width="3">
        <path d="M-64 0H64M0-64V64M-45-45L45 45M-45 45L45-45"/>
      </g>
      <circle r="10" fill="#ffca58" class="thin"/>
      <path d="M-8-64H8" stroke="#f26e59" stroke-width="7"/>
    </g>
  </defs>

