    <path d="M599 256l-14 12" stroke="#fffdf0" stroke-width="5"/>
    <text x="677" y="282" text-anchor="middle" font-size="18" font-weight="bold">“We ordered</text>
    <text x="677" y="308" text-anchor="middle" font-size="18" font-weight="bold">a CARPOOL!”</text>
  </g>

  <path d="M111 284l-22-11m15 32H76m32 20-22 9" fill="none" stroke="#fff8df" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="519" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#243744">He calls it cycling. The fish call it public transport.</text>

