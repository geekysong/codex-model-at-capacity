<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a tiny bicycle along a seaside road, carrying three alarmed fish in its enormous bill pouch. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="road" width="100" height="12" patternUnits="userSpaceOnUse">
      <path d="M15 6h42" stroke="#fff4ce" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fff9e8" stroke="#243744" stroke-width="12"/>
      <circle r="65" fill="#d7eeec" stroke="#fdf6df" stroke-width="3"/>
      <g stroke="#66868a" stroke-width="3">
        <path d="M-64 0H64M0-64V64M-45-45l90 90M-45 45l90-90"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <circle r="10" fill="#edaa35" stroke="#243744" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <path d="M0 123Q220 99 400 124T800 116V432H0Z" fill="#c9e9e7"/>
