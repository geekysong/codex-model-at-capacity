  </g>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" letter-spacing="3" fill="#243744">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#617b7c">ZERO EMISSIONS. EXCESS BAGGAGE.</text>

  <path d="M0 417Q390 400 800 417V487H0Z" fill="#819194"/>
  <rect y="463" width="800" height="12" fill="url(#road)"/>
  <ellipse cx="396" cy="446" rx="242" ry="14" fill="#344b51" opacity=".17"/>

