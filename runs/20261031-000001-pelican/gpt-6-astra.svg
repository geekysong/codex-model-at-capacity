<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN EXPRESS</title>
  <desc id="desc">A smug pelican cycles along the waterfront with an enormous beak full of fish, ignoring a sign advertising free flight. Wheels spin and the bird bobs in a looping animation.</desc>
  <defs>
    <pattern id="water" width="80" height="28" patternUnits="userSpaceOnUse">
      <path d="M10 14h32m15 0h12" fill="none" stroke="#80c6cc" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5db"/>
  <text x="400" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="900" letter-spacing="2" fill="#173d45">PELICAN EXPRESS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#83533a">ZERO EMISSIONS. EXCESS BAGGAGE.</text>

  <!-- Waterfront -->
  <rect x="0" y="258" width="800" height="178" fill="#b8e2df"/>
  <rect x="0" y="273" width="800" height="155" fill="url(#water)"/>
  <circle cx="692" cy="168" r="38" fill="#ffd26a"/>
  <g fill="#fffdf3">
    <path d="M53 205c-8-21 20-37 34-24 3-26 44-29 51-2 24-7 37 12 29 26Z"/>
    <path d="M566 227c-7-15 13-29 26-18 6-21 35-18 39 3 18-3 26 6 23 15Z"/>
  </g>
  <path d="M0 432H800V502H0Z" fill="#c1aa8a"/>
  <path d="M0 435H800" stroke="#173d45" stroke-width="5"/>
  <path d="M21 480h95m64 0h94m64 0h94m64 0h94m64 0h94" stroke="#fff5db" stroke-width="5" stroke-dasharray="28 16"/>
  <ellipse cx="418" cy="449" rx="241" ry="15" fill="#173d45" opacity=".14"/>

  <!-- Pointed advice -->
  <path d="M101 283v150" stroke="#675849" stroke-width="9"/>
  <path d="M34 243h121l34 32-34 32H34Z" fill="#fffdf3" stroke="#173d45" stroke-width="4" stroke-linejoin="round"/>
  <text x="105" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#173d45">FLYING</text>
  <text x="105" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#173d45">STILL FREE</text>

  <!-- Spinning wheels -->
  <g stroke="#173d45">
    <g transform="translate(263 389)">
      <circle r="67" fill="#fff5db" stroke-width="12"/>
      <circle r="57" fill="#d9ece1" stroke-width="2"/>
      <g stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-56 0H56M0-56V56M-40-40l80 80M-40 40l80-80"/>
        <path d="M0-57a57 57 0 0 1 40 17" fill="none" stroke="#ef7750" stroke-width="6"/>
      </g>
      <circle r="8" fill="#173d45"/>
    </g>
    <g transform="translate(582 389)">
      <circle r="67" fill="#fff5db" stroke-width="12"/>
      <circle r="57" fill="#d9ece1" stroke-width="2"/>
      <g stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-56 0H56M0-56V56M-40-40l80 80M-40 40l80-80"/>
        <path d="M0-57a57 57 0 0 1 40 17" fill="none" stroke="#ef7750" stroke-width="6"/>
      </g>
      <circle r="8" fill="#173d45"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M263 389l91-105 62 105H263l65-91h202L416 389m114-91 52 91m-52-91-15-46 34-12" stroke="#173d45" stroke-width="13"/>
    <path d="M263 389l91-105 62 105H263m91-105 176 14L416 389m114-91 52 91" stroke="#e95644" stroke-width="7"/>
    <path d="M354 284l-11-25" stroke="#173d45" stroke-width="8"/>
    <path d="M319 259h57" stroke="#173d45" stroke-width="14"/>
    <path d="M547 240l19-4" stroke="#173d45" stroke-width="10"/>
  </g>
  <circle cx="416" cy="389" r="18" fill="#fff5db" stroke="#173d45" stroke-width="5"/>
  <g transform="translate(416 389)">
    <g stroke="#173d45" stroke-width="6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-23 0H23"/>
      <path d="M-30-5h14M16 5h14"/>
    </g>
  </g>

  <!-- Pelican and its very inefficient luggage -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M350 266l-19 44 59 47" fill="none" stroke="#b27626" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M350 266l-19 44 59 47;M350 266l-5 54 69 58;M350 266l-19 44 59 47" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M376 272l24 48 34 51" fill="none" stroke="#efac38" stroke-width="14" stroke-linecap="round">
      <animate attributeName="d" values="M376 272l24 48 34 51;M376 272l-4 55 25 67;M376 272l24 48 34 51" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M426 365l28 9-29 9Z" fill="#f6b43c" stroke="#173d45" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-37 23;0 0" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <path d="M309 225l-55-24 27 43-35 1 62 28" fill="#fffdf3" stroke="#173d45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M291 216c15-37 62-50 107-22 16-15 18-39 13-58-6-25 6-42 26-40 32 4 40 36 23 60-18 26 12 74-11 104-26 38-134 38-153 3-8-15-10-31-5-47Z" fill="#fffdf3" stroke="#173d45" stroke-width="4"/>
    <path d="M319 218c28-24 60-14 79 9l-35 28c-16 6-35-9-44-37Z" fill="#d6e2d9" stroke="#173d45" stroke-width="4"/>
    <path d="M372 216q57 22 151 29" fill="none" stroke="#173d45" stroke-width="17" stroke-linecap="round"/>
    <path d="M372 213q57 22 151 29" fill="none" stroke="#fffdf3" stroke-width="10" stroke-linecap="round"/>

    <!-- Overloaded bill pouch -->
    <path d="M450 151h236c-17 66-85 89-157 70-41-10-66-36-79-70Z" fill="#f6bd55" stroke="#173d45" stroke-width="4"/>
    <path d="M475 168q53 65 155 26" fill="none" stroke="#db8b36" stroke-width="3"/>

    <g stroke="#173d45" stroke-width="3" stroke-linejoin="round">
      <path d="M509 158q23-36 52-1l16-15v30l-16-13q-26 27-52-1Z" fill="#65b9ba"/>
      <circle cx="523" cy="154" r="3" fill="#173d45" stroke="none"/>
      <path d="M582 175q20-31 46-2l17-12v27l-17-12q-24 23-46-1Z" fill="#86b899"/>
      <circle cx="594" cy="173" r="3" fill="#173d45" stroke="none"/>
    </g>
    <path d="M447 143l247 6-9 13-237-4Z" fill="#ffd46a" stroke="#173d45" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="441" cy="125" r="10" fill="white" stroke="#173d45" stroke-width="3"/>
    <circle cx="445" cy="125" r="4" fill="#173d45"/>
    <path d="M426 111l22-4" stroke="#173d45" stroke-width="5" stroke-linecap="round"/>
    <path d="M409 105q25-27 48 4Z" fill="#e95644" stroke="#173d45" stroke-width="3"/>
    <path d="M402 107h65" stroke="#173d45" stroke-width="5" stroke-linecap="round"/>
    <path d="M416 181l35 9-18 16-9-12-43 10 21-24Z" fill="#e95644" stroke="#173d45" stroke-width="3"/>
  </g>

  <!-- Deadpan commentary -->
  <path d="M603 280h144q13 0 13 13v37q0 13-13 13H603q-13 0-13-13v-37q0-13 13-13Z" fill="#fffdf3" stroke="#173d45" stroke-width="3"/>
  <path d="M610 281l-13-30 42 30" fill="#fffdf3" stroke="#173d45" stroke-width="3" stroke-linejoin="round"/>
  <path d="M613 281h24" stroke="#fffdf3" stroke-width="5"/>
  <text x="675" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173d45">“We were told</text>
  <text x="675" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#173d45">this was a flight.”</text>

  <!-- Separate, stationary caption and timestamp footer -->
  <rect x="0" y="502" width="800" height="98" fill="#173d45"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="#fff5db">He took up cycling to reduce his airfare.</text>
  <path d="M140 550H660" stroke="#68888a"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#fff5db">2026-10-31 00:00:01 SGT (UTC+08:00)</text>
</svg>