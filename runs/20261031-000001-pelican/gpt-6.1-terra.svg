<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican pedals a bicycle with a fish in its enormous beak pouch. The wheels spin and the rider bobs.</desc>
  <style>
    .ink { stroke:#263747; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
    .rider { animation:bob 0.7s ease-in-out infinite alternate; }
    .pedals { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes bob { to { transform:translateY(-5px); } }
    @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedals { animation:none; } }
  </style>
  <rect width="800" height="600" fill="#f6e8c8"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#fff8e9" stroke="#263747" stroke-width="4"/>
  <text x="400" y="72" text-anchor="middle" font-family="Verdana, sans-serif" font-size="35" font-weight="900" fill="#263747">THE DAILY COMMUTE</text>
