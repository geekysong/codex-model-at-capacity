<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b68"/>
      <stop offset="1" stop-color="#252a35"/>
    </linearGradient>
    <style>
      .ink{stroke:#202532;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202532}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .ride{animation:bob 1.2s ease-in-out infinite}
      .leg{transform-box:fill-box;transform-origin:top center;animation:pedal .8s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes pedal{from{transform:rotate(18deg)}to{transform:rotate(-24deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="670" cy="105" r="52" fill="#ffd86b" stroke="#202532" stroke-width="6"/>
  <path d="M0 390 Q120 330 240 390 T480 390 T720 390 T960 390 V600 H0Z" fill="#82bf73"/>
  <path d="M0 445 Q180 400 360 445 T720 445 T1080 445 V600 H0Z" fill="#65a95e"/>
  <path d="M0 475 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M35 530 H155 M215 530 H335 M395 530 H515 M575 530 H695" stroke="#f8d86a" stroke-width="10" stroke-linecap="round"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="34" font-weight="900" fill="#ffffff" stroke="#202532" stroke-width="2" paint-order="stroke">
    THE GREAT PELICAN COMMUTE
  </text>
  <text x="400" y="92" text-anchor="middle" class="label" font-size="19" font-weight="700">
    “When your beak is bigger than your basket, improvise.”
  </text>

