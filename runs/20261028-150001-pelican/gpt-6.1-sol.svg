<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Peloton</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly large fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e9f8df"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59616d"/>
      <stop offset="1" stop-color="#303640"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink { stroke:#17212b; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#17212b; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .rider { transform-box:fill-box; transform-origin:center bottom; animation:bob .55s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin .8s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 340 Q120 285 240 335 T480 325 T800 320 L800 430 L0 430Z" fill="#9dcc75"/>
  <path d="M0 420 Q190 390 390 420 T800 410 L800 600 L0 600Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f6df72" stroke-width="10" stroke-dasharray="55 35"/>
  <path d="M0 552 H800" stroke="#fff" stroke-width="3" opacity=".35"/>

  <text x="40" y="58" class="label" font-size="34" font-weight="900">THE PELICAN PELOTON</text>
  <text x="42" y="91" class="label" font-size="18" font-weight="700">“He has a beak for speed… and absolutely no brakes.”</text>

  <g class="rider" filter="url(#shadow)">
    <!-- bicycle -->
    <g aria-label="bicycle">
      <g class="wheel">
        <circle cx="248" cy="438" r="68" fill="#d9e5ea" class="ink"/>
        <circle cx="248" cy="438" r="10" fill="#17212b"/>
        <path d="M248 370V506M180 438H316M200 390L296 486M296 390L200 486" stroke="#6c8792" stroke-width="4"/>
      </g>
      <g class="wheel">
        <circle cx="570" cy="438" r="68" fill="#d9e5ea" class="ink"/>
        <circle cx="570" cy="438" r="10" fill="#17212b"/>
        <path d="M570 370V506M502 438H638M522 390L618 486M618 390L522 486" stroke="#6c8792" stroke-width="4"/>
      </g>
      <path d="M248 438 L350 330 L470 438 L248 438 L410 438 L350 330 L570 438 L470 438" fill="none" class="ink"/>
      <path d="M350 330 L330 288 M318 288 H360" fill="none" class="ink"/>
      <path d="M470 438 L495 344 H535" fill="none" class="ink"/>
      <path d="M410 438 L390 476" fill="none" class="ink"/>
      <g class="pedal">
        <circle cx="410" cy="438" r="18" fill="#f4b942" class="ink"/>
        <path d="M410 438l25 18M410 438l-20-18" class="ink"/>
      </g>
      <path d="M535 344 Q550 326 570 337" fill="none" class="ink"/>
    </g>

    <!-- pelican -->
    <g aria-label="pelican">
      <ellipse cx="412" cy="245" rx="77" ry="91" fill="#f7f1df" class="ink"/>
      <path d="M365 228 Q318 270 354 330 Q397 302 430 260Z" fill="#d5e6eb" class="ink"/>
      <circle cx="407" cy="139" r="48" fill="#f7f1df" class="ink"/>
      <path d="M430 148 Q520 142 581 176 Q520 204 432 181 Q410 168 430 148Z" fill="#f2a83b" class="ink"/>
      <path d="M445 177 Q505 194 558 178 Q520 242 444 210Z" fill="#ed8e32" class="ink"/>
      <circle cx="424" cy="134" r="8" fill="#17212b"/>
      <path d="M404 112 Q427 94 450 108" fill="none" class="ink"/>
      <path d="M371 296 Q345 340 367 367" fill="none" class="ink"/>
      <path d="M437 299 Q460 341 447 371" fill="none" class="ink"/>
      <path d="M367 366 l-28 12 M447 370 l29 10" class="ink"/>
      <path d="M376 216 Q408 237 445 214" fill="none" class="ink"/>
      <path d="M351 194 Q323 177 337 151" fill="none" class="ink"/>
      <path d="M343 151 Q325 132 341 119" fill="none" class="ink"/>
      <!-- absurd fish cargo -->
      <g transform="translate(475 263) rotate(-8)">
        <path d="M0 25 Q55 -5 116 25 Q55 55 0 25Z" fill="#8dd1d8" class="ink"/>
        <path d="M116 25 l35 -28 v56z" fill="#5daab5" class="ink"/>
        <circle cx="22" cy="20" r="5" fill="#17212b"/>
        <path d="M48 8 Q66 25 48 42" fill="none" class="ink"/>
        <text x="18" y="82" class="label" font-size="15" font-weight="700">EMERGENCY SNACK</text>
      </g>
      <path d="M450 272 Q510 283 545 307" fill="none" class="ink"/>
      <path d="M450 272 Q505 251 548 270" fill="none" class="ink"/>
    </g>
  </g>

  <g transform="translate(635 245)">
    <path d="M0 0 q35 -25 70 0 q-35 25 -70 0Z" fill="#fff" opacity=".85"/>
    <text x="8" y="7" class="label" font-size="16" font-weight="700">HONK!</text>
  </g>

  <rect x="24" y="566" width="752" height="26" rx="8" fill="#f7f1df" opacity=".95"/>
  <text x="400" y="585" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 15:01:14 SGT (UTC+08:00)</text>
</svg>