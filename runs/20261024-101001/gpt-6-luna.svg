<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17132e"/>
      <stop offset="1" stop-color="#080914"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25204a"/>
      <stop offset="1" stop-color="#11152d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset=".45" stop-color="#91a8bf"/>
      <stop offset="1" stop-color="#46546b"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4f9a"/>
      <stop offset="1" stop-color="#9d145d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 410 Q180 350 400 410 T800 395 V600 H0Z" fill="url(#floor)"/>
  <g opacity=".35" fill="#7040ff">
    <circle cx="90" cy="90" r="3"/><circle cx="150" cy="145" r="2"/><circle cx="690" cy="115" r="3"/>
    <circle cx="735" cy="205" r="2"/><circle cx="50" cy="260" r="2"/><circle cx="620" cy="250" r="2"/>
  </g>

  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" letter-spacing="4" fill="#ff6db0">THE EXCLUSIVE MODEL LOUNGE</text>

  <!-- club doorway -->
  <rect x="500" y="130" width="255" height="300" rx="18" fill="#090a17" stroke="#734cff" stroke-width="6"/>
  <rect x="520" y="150" width="215" height="260" rx="12" fill="#151331" stroke="#302760" stroke-width="3"/>
  <path d="M535 390 Q625 300 720 390" fill="none" stroke="#ff3d88" stroke-width="5" opacity=".55"/>
  <circle cx="630" cy="275" r="72" fill="#4d2cb5" opacity=".18" filter="url(#soft)"/>

  <!-- glowing FULL sign -->
  <g filter="url(#glow)">
    <rect x="555" y="168" width="145" height="48" rx="8" fill="#ff174f" stroke="#ff8aa7" stroke-width="3"/>
    <text x="627" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="29" fill="#fff">FULL</text>
  </g>

  <!-- one model inside -->
  <g transform="translate(615 270)">
    <ellipse cx="0" cy="55" rx="47" ry="12" fill="#090913"/>
    <rect x="-31" y="-20" width="62" height="70" rx="15" fill="url(#metal)" stroke="#c8e8ff" stroke-width="3"/>
    <rect x="-23" y="-8" width="46" height="26" rx="7" fill="#11182d"/>
    <circle cx="-10" cy="5" r="5" fill="#62ffda"/><circle cx="10" cy="5" r="5" fill="#62ffda"/>
    <path d="M-13 32 Q0 42 13 32" fill="none" stroke="#252b43" stroke-width="4"/>
    <path d="M-31 3 L-47 20 M31 3 L47 20" stroke="#9cb6cc" stroke-width="8" stroke-linecap="round"/>
    <path d="M-18 50 L-23 70 M18 50 L23 70" stroke="#8199b4" stroke-width="9" stroke-linecap="round"/>
    <rect x="-38" y="73" width="76" height="20" rx="10" fill="#ff4e9b"/>
    <text x="0" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">VIP MODEL</text>
  </g>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(535 425)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#7e91b0" stroke-width="10"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#29354b" stroke-width="4"/>
    <path d="M-27 -27 L27 27 M27 -27 L-27 27" stroke="#657b99" stroke-width="4"/>
    <path d="M-18 38 Q-10 62 8 53 Q25 70 39 47" fill="none" stroke="#ff6b35" stroke-width="7"/>
    <path d="M-35 48 Q-19 71 -2 58" fill="none" stroke="#ffbd42" stroke-width="5"/>
    <text x="0" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ff9c63">SERVERS</text>
  </g>
  <g transform="translate(700 425)">
    <circle cx="0" cy="0" r="43" fill="none" stroke="#7e91b0" stroke-width="10"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#29354b" stroke-width="4"/>
    <path d="M-23 -23 L23 23 M23 -23 L-23 23" stroke="#657b99" stroke-width="4"/>
    <path d="M-17 33 Q-3 57 14 39 Q29 57 40 34" fill="none" stroke="#ff5936" stroke-width="7"/>
  </g>

  <!-- velvet rope -->
  <path d="M85 392 Q250 485 470 397" fill="none" stroke="#8b123e" stroke-width="13"/>
  <path d="M85 392 Q250 485 470 397" fill="none" stroke="#ff477f" stroke-width="4" stroke-dasharray="12 12"/>
  <g fill="#d8b36a" stroke="#fff0ad" stroke-width="2">
    <circle cx="85" cy="392" r="12"/><rect x="80" y="392" width="10" height="105"/>
    <circle cx="470" cy="397" r="12"/><rect x="465" y="397" width="10" height="105"/>
  </g>

  <!-- robot bouncer -->
  <g transform="translate(385 255)">
    <ellipse cx="0" cy="222" rx="91" ry="17" fill="#090914" opacity=".8"/>
    <rect x="-54" y="82" width="108" height="135" rx="25" fill="url(#metal)" stroke="#d8ecff" stroke-width="4"/>
    <rect x="-61" y="-5" width="122" height="103" rx="25" fill="url(#metal)" stroke="#e4f3ff" stroke-width="4"/>
    <rect x="-48" y="17" width="96" height="54" rx="13" fill="#0c1327" stroke="#526984" stroke-width="3"/>
    <circle cx="-23" cy="44" r="10" fill="#ff365d"/><circle cx="23" cy="44" r="10" fill="#ff365d"/>
    <path d="M-22 78 Q0 66 22 78" fill="none" stroke="#27334b" stroke-width="6"/>
    <path d="M0 -5 V-28" stroke="#b8d4e8" stroke-width="6"/>
    <circle cx="0" cy="-36" r="10" fill="#ff3e8c" filter="url(#glow)"/>
    <path d="M-54 112 L-90 146 M54 112 L91 91" stroke="#a6bfd2" stroke-width="15" stroke-linecap="round"/>
    <path d="M-90 146 L-106 135 M91 91 L108 103" stroke="#ff4e8f" stroke-width="9" stroke-linecap="round"/>
    <path d="M-28 216 L-34 246 M28 216 L34 246" stroke="#718aa4" stroke-width="16" stroke-linecap="round"/>
    <path d="M-55 248 H-17 M17 248 H55" stroke="#d6eafa" stroke-width="10" stroke-linecap="round"/>
    <rect x="-37" y="126" width="74" height="31" rx="8" fill="#222b43"/>
    <text x="0" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff6e9d">BOUNCER.EXE</text>
    <path d="M-90 146 Q-127 128 -142 105" fill="none" stroke="#d5e7f4" stroke-width="7" stroke-linecap="round"/>
    <path d="M-143 104 l-18 5 12 14" fill="#ff4d86"/>
  </g>

  <!-- tired developer queue -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(65 315)">
      <circle cx="0" cy="0" r="22" fill="#b77c55"/><path d="M-19 -5 Q0 -35 20 -7" fill="#4b2a20"/>
      <path d="M-12 8 Q0 15 12 8" fill="none" stroke="#402017" stroke-width="3"/>
      <path d="M-27 35 Q0 18 27 35 V84 H-27Z" fill="#4e9bd6"/>
      <text x="0" y="108" text-anchor="middle" font-size="12" fill="#c6d5ff">DEV #1</text>
    </g>
    <g transform="translate(145 360)">
      <circle cx="0" cy="0" r="21" fill="#8e5a42"/><path d="M-20 -4 Q0 -31 20 -3" fill="#17171f"/>
      <path d="M-12 8 Q0 2 12 8" fill="none" stroke="#42251b" stroke-width="3"/>
      <path d="M-27 35 Q0 18 27 35 V84 H-27Z" fill="#d14d72"/>
      <text x="0" y="108" text-anchor="middle" font-size="12" fill="#c6d5ff">DEV #2</text>
    </g>
    <g transform="translate(230 395)">
      <circle cx="0" cy="0" r="22" fill="#d49a72"/><path d="M-20 -4 Q0 -35 20 -4" fill="#8c5b34"/>
      <path d="M-12 9 Q0 2 12 9" fill="none" stroke="#49271b" stroke-width="3"/>
      <path d="M-27 35 Q0 18 27 35 V84 H-27Z" fill="#55b58b"/>
      <text x="0" y="108" text-anchor="middle" font-size="12" fill="#c6d5ff">DEV #3</text>
    </g>
    <g transform="translate(315 420)">
      <circle cx="0" cy="0" r="21" fill="#a66d4e"/><path d="M-20 -4 Q0 -32 20 -4" fill="#302b39"/>
      <path d="M-12 8 Q0 2 12 8" fill="none" stroke="#43251d" stroke-width="3"/>
      <path d="M-27 35 Q0 18 27 35 V84 H-27Z" fill="#d9a33f"/>
      <text x="0" y="108" text-anchor="middle" font-size="12" fill="#c6d5ff">DEV #4</text>
    </g>
  </g>

  <!-- rejection speech bubble -->
  <path d="M174 188 Q174 130 266 130 H354 Q430 130 430 188 Q430 235 354 235 H260 L220 258 225 235 Q174 225 174 188Z" fill="#fff" stroke="#ff4b91" stroke-width="4"/>
  <text x="302" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#211737">Selected model is</text>
  <text x="302" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#d51d65">at capacity.</text>
  <text x="302" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#211737">Please try a different model.</text>

  <!-- caption -->
  <rect x="72" y="545" width="656" height="36" rx="18" fill="#0c0d1c" stroke="#ff4f9a" stroke-width="2"/>
  <text x="400" y="569" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffd5e8">When the only model with a guest list says: “at capacity.”</text>
</svg>