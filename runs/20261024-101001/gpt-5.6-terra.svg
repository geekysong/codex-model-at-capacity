    <ellipse cx="86" cy="68" rx="64" ry="17" fill="none" stroke="#ffb85c" stroke-width="5" stroke-dasharray="12 8"/>
    <circle cx="86" cy="64" r="17" fill="#f0a44e" stroke="#36203f" stroke-width="4"/>
    <circle cx="80" cy="60" r="3" fill="#36203f"/><circle cx="92" cy="60" r="3" fill="#36203f"/>
    <path d="M78 69 Q87 77 96 69" fill="none" stroke="#36203f" stroke-width="3"/>
    <path d="M20 76 Q42 93 65 78 M107 78 Q130 94 153 75" fill="none" stroke="#ff784c" stroke-width="8" stroke-linecap="round"/>
    <text x="86" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffcf86">HAMSTER-POWERED CLOUD</text>
  </g>

