      <rect x="-20" y="55" width="40" height="22" rx="3" fill="#20283d"/><text x="0" y="71" text-anchor="middle" font-size="10" font-family="Arial" fill="#7cf3ff">404</text>
    </g>
    <g transform="translate(270 397) scale(1.05)">
      <circle cx="0" cy="0" r="25" fill="#e0ae87"/><path d="M-25 -4 Q0 -38 25 -4" fill="#9e4d49"/><path d="M-12 10 Q0 18 12 10" fill="none"/><path d="M-33 45 Q0 20 33 45 V92 H-33Z" fill="#5db47d"/><path d="M-17 45 L0 66 L17 45" fill="#f1cc68"/>
      <rect x="-20" y="55" width="40" height="22" rx="3" fill="#20283d"/><text x="0" y="71" text-anchor="middle" font-size="9" font-family="Arial" fill="#7cf3ff">SHIP</text>
    </g>
    <g transform="translate(355 428) scale(.82)">
      <circle cx="0" cy="0" r="25" fill="#b97862"/><path d="M-25 -4 Q0 -34 25 -4" fill="#29233d"/><path d="M-12 11 Q0 4 12 11" fill="none"/><path d="M-33 45 Q0 20 33 45 V92 H-33Z" fill="#8b6dcc"/><rect x="-20" y="55" width="40" height="22" rx="3" fill="#20283d"/><text x="0" y="71" text-anchor="middle" font-size="9" font-family="Arial" fill="#7cf3ff">Zzz</text>
    </g>
  </g>

  <g transform="translate(60 535)">
    <rect width="680" height="45" rx="22" fill="#120e22" stroke="#ff4dbd" stroke-width="3"/>
    <text x="340" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#fff">“Selected model is at capacity. Please try a different model.”</text>
  </g>

  <text x="400" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ffef72" filter="url(#softGlow)">THE EXCLUSIVE CLUB WHERE EVERYONE IS WAITLISTED</text>
</svg>