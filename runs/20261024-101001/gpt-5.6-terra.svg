    <circle cx="34" cy="76" r="5" fill="#ff4f9a"/>
    <circle cx="51" cy="76" r="5" fill="#62f7d4"/>
    <path d="M25 92 Q55 84 93 94" fill="none" stroke="#ffcc55" stroke-width="4"/>
    <path d="M15 120 Q32 138 52 124 Q67 115 82 130 Q98 143 113 126" fill="none" stroke="#ff8b4a" stroke-width="7" stroke-linecap="round"/>
    <text x="56" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffd2ed">SERVER FARM</text>
  </g>

  <g transform="translate(210 340)">
