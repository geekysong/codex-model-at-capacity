    <path d="M60 55 Q101 15 142 55" fill="#303b63" stroke="#10152e" stroke-width="6"/>
    <rect x="67" y="55" width="68" height="26" rx="13" fill="#11172e" stroke="#72f5ff" stroke-width="4"/>
    <circle cx="84" cy="68" r="6" fill="#ff4ca5"/><circle cx="118" cy="68" r="6" fill="#ff4ca5"/>
    <path d="M83 96 Q101 107 119 96" fill="none" stroke="#14172b" stroke-width="5"/>
    <path d="M58 132 L18 174" stroke="#a8d7dc" stroke-width="17" stroke-linecap="round"/>
    <path d="M144 132 L185 156" stroke="#a8d7dc" stroke-width="17" stroke-linecap="round"/>
    <path d="M18 174 L3 163" stroke="#a8d7dc" stroke-width="12" stroke-linecap="round"/>
    <path d="M185 156 L207 145" stroke="#a8d7dc" stroke-width="12" stroke-linecap="round"/>
    <text x="101" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#fff">BOUNCER-BOT 3000</text>
  </g>

  <!-- velvet rope -->
  <path d="M420 377 Q475 438 548 381" fill="none" stroke="#e52b76" stroke-width="9"/>
  <circle cx="420" cy="377" r="11" fill="#ffd45b" stroke="#6d315d" stroke-width="4"/>
  <circle cx="548" cy="381" r="11" fill="#ffd45b" stroke="#6d315d" stroke-width="4"/>

  <!-- queue of tired developers -->
  <g stroke="#17152d" stroke-width="4">
    <g transform="translate(105 405)">
      <circle cx="0" cy="0" r="25" fill="#d99472"/><path d="M-25 -4 Q0 -35 25 -5" fill="#3a2948"/><path d="M-12 9 Q0 18 12 9" fill="none"/><path d="M-33 45 Q0 20 33 45 V92 H-33Z" fill="#4d86bb"/><path d="M-13 45 L2 64 L17 45" fill="#f5c85e"/>
