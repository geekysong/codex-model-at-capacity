<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152d"/>
      <stop offset="1" stop-color="#32152d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#281936"/>
      <stop offset=".5" stop-color="#5b204b"/>
      <stop offset="1" stop-color="#281936"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset=".5" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#27e7ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 438 Q200 390 400 430 T800 420 V600 H0Z" fill="url(#floor)"/>
  <path d="M0 455 Q200 420 400 450 T800 440" fill="none" stroke="#d52b9d" stroke-width="3" opacity=".5"/>

  <g opacity=".25" stroke="#7e48b7" stroke-width="2">
    <path d="M80 0V380M160 0V380M240 0V380M320 0V380M400 0V380M480 0V380M560 0V380M640 0V380M720 0V380"/>
    <path d="M0 90H800M0 170H800M0 250H800M0 330H800"/>
  </g>

  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff72d8">WHERE IDEAS COME TO PARTY</text>

  <g filter="url(#glow)">
    <rect x="548" y="108" width="190" height="82" rx="12" fill="#190f27" stroke="#ff3dba" stroke-width="5"/>
    <text x="643" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="900" fill="#ff72d8">TONIGHT'S STATUS</text>
    <text x="643" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="900" fill="#fff">FULL</text>
  </g>

  <!-- melting server stack -->
  <g transform="translate(55 285)">
    <path d="M0 105 Q18 90 10 65 Q7 43 24 35 Q44 28 57 43 Q72 26 95 39 Q112 47 105 69 Q125 77 111 102 Q91 119 65 111 Q37 125 0 105Z" fill="#5c879a" stroke="#171d35" stroke-width="5"/>
