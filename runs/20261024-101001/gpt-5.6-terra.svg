    <path d="M48 218 L58 104 L143 104 L155 218Z" fill="#22243d" stroke="#0d1023" stroke-width="6"/>
    <path d="M76 117 L101 159 L126 117" fill="none" stroke="#f04da9" stroke-width="6"/>
