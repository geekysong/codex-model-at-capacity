<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152d"/>
      <stop offset="1" stop-color="#090914"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#252044"/>
      <stop offset="1" stop-color="#120f26"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b87"/>
      <stop offset="1" stop-color="#c91851"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="690" cy="86" r="120" fill="#542d78" opacity=".25" filter="url(#soft)"/>
  <circle cx="105" cy="175" r="130" fill="#173c6f" opacity=".2" filter="url(#soft)"/>
  <path d="M0 420 Q220 365 420 430 T800 400 V600 H0Z" fill="url(#floor)"/>
  <path d="M0 475 Q230 420 430 480 T800 460" fill="none" stroke="#392e62" stroke-width="3"/>

  <text x="400" y="55" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="2">CODEX NIGHTCLUB</text>
  <text x="400" y="83" text-anchor="middle" fill="#ffcf6e" font-family="Arial, sans-serif" font-size="15" font-weight="700">THE HOTTEST DOOR IN COMPUTING</text>

  <!-- club facade -->
  <rect x="520" y="110" width="245" height="300" rx="18" fill="#211936" stroke="#8c4eaa" stroke-width="4"/>
  <rect x="545" y="235" width="195" height="175" rx="10" fill="#0d0c1d" stroke="#4e356b" stroke-width="3"/>
  <path d="M545 270h195M545 305h195M545 340h195M545 375h195" stroke="#251b3c" stroke-width="3"/>
  <path d="M575 250v145M615 250v145M655 250v145M695 250v145" stroke="#211735" stroke-width="3"/>
  <circle cx="642" cy="188" r="48" fill="#ff315d" opacity=".3" filter="url(#glow)"/>
  <rect x="570" y="145" width="145" height="86" rx="12" fill="url(#sign)" stroke="#ffb2bd" stroke-width="3"/>
  <text x="642" y="180" text-anchor="middle" fill="#fff7ef" font-family="Arial, sans-serif" font-size="26" font-weight="900">FULL</text>
  <text x="642" y="207" text-anchor="middle" fill="#ffe3e8" font-family="Arial, sans-serif" font-size="13" font-weight="700">TRY AGAIN LATER</text>
  <path d="M566 413 Q642 370 718 413" fill="none" stroke="#ff4e87" stroke-width="7" opacity=".8"/>

  <!-- melting hamster servers -->
  <g transform="translate(555 430)">
    <ellipse cx="74" cy="69" rx="103" ry="24" fill="#070711" opacity=".7"/>
    <path d="M8 30 Q8 0 38 0 H120 Q145 0 145 28 V58 Q145 73 130 75 H25 Q8 72 8 55Z" fill="#55738c" stroke="#9fd3dc" stroke-width="3"/>
    <rect x="28" y="15" width="96" height="16" rx="4" fill="#1d293c"/>
    <circle cx="40" cy="23" r="4" fill="#ff466e"/>
    <circle cx="54" cy="23" r="4" fill="#ffd166"/>
    <circle cx="68" cy="23" r="4" fill="#65e6a8"/>
    <path d="M26 57 Q35 72 48 58 Q60 45 72 60 Q84 77 98 57 Q112 43 124 59 Q133 70 143 58" fill="none" stroke="#78f1d2" stroke-width="5"/>
    <circle cx="76" cy="88" r="14" fill="#d7a15d"/>
    <circle cx="52" cy="88" r="13" fill="#d7a15d"/>
    <ellipse cx="64" cy="96" rx="24" ry="17" fill="#d7a15d"/>
    <circle cx="58" cy="92" r="2" fill="#251b26"/>
    <circle cx="70" cy="92" r="2" fill="#251b26"/>
    <path d="M60 99q5 5 10 0" fill="none" stroke="#251b26" stroke-width="2"/>
    <path d="M41 52 q-12 15 0 27 M115 53 q13 13 1 27" fill="none" stroke="#ff9f58" stroke-width="5" stroke-linecap="round"/>
    <path d="M17 82 Q34 78 42 88 T66 89 Q82 78 96 89 T122 89 Q136 79 149 87" fill="none" stroke="#ff5c62" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- bouncer -->
  <g transform="translate(330 160)">
    <ellipse cx="88" cy="338" rx="112" ry="22" fill="#070711" opacity=".6"/>
    <rect x="40" y="128" width="102" height="190" rx="30" fill="#354d68" stroke="#a6d9e5" stroke-width="4"/>
    <rect x="55" y="165" width="72" height="95" rx="12" fill="#11192b" stroke="#5f8da5" stroke-width="3"/>
    <rect x="67" y="180" width="48" height="25" rx="5" fill="#ff3366"/>
    <text x="91" y="198" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" font-weight="900">NOPE</text>
    <path d="M70 224h42" stroke="#7cead2" stroke-width="5" stroke-linecap="round"/>
    <path d="M72 243h28" stroke="#7cead2" stroke-width="5" stroke-linecap="round"/>
    <circle cx="91" cy="88" r="67" fill="#4b6781" stroke="#b2e2e8" stroke-width="4"/>
    <path d="M48 55 Q91 15 134 55" fill="none" stroke="#1e2b43" stroke-width="16"/>
    <rect x="42" y="70" width="98" height="48" rx="18" fill="#11192b" stroke="#7fa8b9" stroke-width="3"/>
    <circle cx="70" cy="94" r="10" fill="#ff3e69" filter="url(#glow)"/>
    <circle cx="112" cy="94" r="10" fill="#ff3e69" filter="url(#glow)"/>
    <path d="M80 108 Q91 115 102 108" fill="none" stroke="#ffcb70" stroke-width="3"/>
    <path d="M142 169 Q190 150 205 181" fill="none" stroke="#a6d9e5" stroke-width="16" stroke-linecap="round"/>
    <path d="M202 181 l25 17" stroke="#ffcb70" stroke-width="9" stroke-linecap="round"/>
    <path d="M40 170 Q5 180 0 213" fill="none" stroke="#a6d9e5" stroke-width="16" stroke-linecap="round"/>
    <path d="M0 213 l-16 22" stroke="#ffcb70" stroke-width="9" stroke-linecap="round"/>
    <rect x="58" y="308" width="28" height="57" rx="12" fill="#263950"/>
    <rect x="101" y="308" width="28" height="57" rx="12" fill="#263950"/>
    <path d="M45 365h48M95 365h48" stroke="#a6d9e5" stroke-width="10" stroke-linecap="round"/>
    <path d="M91 21v-22" stroke="#a6d9e5" stroke-width="5"/>
    <circle cx="91" cy="-7" r="8" fill="#ff466e" filter="url(#glow)"/>
  </g>

  <!-- velvet rope -->
  <path d="M245 405 Q280 450 340 421" fill="none" stroke="#7d173e" stroke-width="8"/>
  <path d="M245 405 Q280 450 340 421" fill="none" stroke="#ff4278" stroke-width="3"/>
  <path d="M245 405v48M340 421v45" stroke="#d6a45c" stroke-width="8"/>
  <circle cx="245" cy="405" r="10" fill="#ffd27a"/>
  <circle cx="340" cy="421" r="10" fill="#ffd27a"/>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(36 405)">
      <ellipse cx="55" cy="116" rx="52" ry="13" fill="#080812" opacity=".6"/>
      <circle cx="55" cy="32" r="28" fill="#e1a77c"/>
      <path d="M27 31q7-38 57-17" fill="#46302b"/>
      <rect x="25" y="62" width="60" height="58" rx="13" fill="#4e8cbd"/>
      <path d="M25 76h60" stroke="#9cdbff" stroke-width="4"/>
      <path d="M85 80l35 30" stroke="#e1a77c" stroke-width="11" stroke-linecap="round"/>
      <rect x="103" y="101" width="43" height="27" rx="3" fill="#282f46" stroke="#8bb7d7" stroke-width="2"/>
      <text x="55" y="150" text-anchor="middle" fill="#c6bfe0" font-size="12">DEV #1</text>
    </g>
    <g transform="translate(145 432)">
      <ellipse cx="55" cy="89" rx="49" ry="12" fill="#080812" opacity=".6"/>
      <circle cx="55" cy="27" r="27" fill="#ad765a"/>
      <path d="M28 25q15-36 57-6" fill="#171923"/>
      <rect x="24" y="57" width="63" height="55" rx="13" fill="#c15c70"/>
      <path d="M35 47l-12 22M75 47l12 22" stroke="#ad765a" stroke-width="8"/>
      <path d="M39 27h12M66 27h12" stroke="#24233b" stroke-width="5"/>
      <text x="55" y="140" text-anchor="middle" fill="#c6bfe0" font-size="12">DEV #2</text>
    </g>
    <g transform="translate(245 452)">
      <ellipse cx="55" cy="70" rx="46" ry="11" fill="#080812" opacity=".6"/>
      <circle cx="55" cy="22" r="24" fill="#efbd91"/>
      <path d="M30 20q3-30 51-17" fill="#dd8e4e"/>
      <rect x="26" y="49" width="58" height="48" rx="12" fill="#5ea36f"/>
      <path d="M30 64h50" stroke="#c8ffd0" stroke-width="3"/>
      <text x="55" y="122" text-anchor="middle" fill="#c6bfe0" font-size="12">DEV #3</text>
    </g>
  </g>

  <!-- rejected ticket -->
  <g transform="rotate(-8 220 280)">
    <rect x="90" y="250" width="230" height="68" rx="12" fill="#f5e9cd" stroke="#d4b56b" stroke-width="3"/>
    <text x="205" y="278" text-anchor="middle" fill="#3f284b" font-family="Arial, sans-serif" font-size="15" font-weight="900">SELECTED MODEL</text>
    <text x="205" y="301" text-anchor="middle" fill="#d12e59" font-family="Arial, sans-serif" font-size="18" font-weight="900">IS AT CAPACITY</text>
    <path d="M112 311l185-1" stroke="#d4b56b" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <!-- caption -->
  <rect x="32" y="535" width="736" height="44" rx="14" fill="#0c0b18" stroke="#63477d" stroke-width="2"/>
  <text x="400" y="563" text-anchor="middle" fill="#ffe6a3" font-family="Arial, sans-serif" font-size="18" font-weight="800">
    “SORRY, THE CLUB IS AT CAPACITY — EVEN THE SERVERS ARE RUNNING ON EMPTY.”
  </text>
</svg>