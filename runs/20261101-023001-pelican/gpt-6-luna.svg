<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE TOUR DE BEAK</title>
  <desc id="desc">A pompous pelican rides a bicycle, pedaling furiously while a fish enjoys the ride in its beak pouch.</desc>
  <defs>
    <style>
      .ink{stroke:#183044;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:none;stroke:#183044;stroke-width:8}
      .spoke{stroke:#557080;stroke-width:3}
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#183044}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pedal{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .rolling{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:pedal .55s ease-in-out infinite}
    </style>
  </defs>

  <rect width="800" height="600" fill="#d9f3f0"/>
  <circle cx="690" cy="105" r="51" fill="#ffd166"/>
  <path d="M0 360 Q130 315 250 360 T500 350 T800 355 V510 H0Z" fill="#94d8b0"/>
  <path d="M0 425 Q120 394 245 428 T510 420 T800 425" fill="none" stroke="#6dbb9a" stroke-width="5"/>
  <path d="M45 367l28-74 28 74M66 330h25M605 362l26-82 31 82M622 327h30" fill="none" stroke="#468c79" stroke-width="7" stroke-linecap="round"/>

  <text id="title" class="txt" x="400" y="54" text-anchor="middle" font-size="31" font-weight="900" letter-spacing="2">THE TOUR DE BEAK</text>
  <text class="txt" x="400" y="82" text-anchor="middle" font-size="17" font-weight="700">“Training for the Tour de France. Pacing himself for the fish.”</text>

  <ellipse cx="404" cy="490" rx="265" ry="19" fill="#73b898" opacity=".5"/>
  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M222 421 L331 421 L390 326 L278 326 Z" stroke="#ef6a5b" stroke-width="10"/>
    <path d="M331 421 L390 326 L486 421 L331 421" stroke="#ef6a5b" stroke-width="10"/>
    <path d="M390 326 L486 421 L527 326" stroke="#ef6a5b" stroke-width="10"/>
    <path d="M390 326 L405 292 M379 292h53" stroke-width="8"/>
    <path d="M527 326h-20l-12-18" stroke-width="8"/>
  </g>

  <!-- Spinning wheels -->
  <g class="rolling">
    <circle class="wheel" cx="222" cy="421" r="68"/>
    <circle cx="222" cy="421" r="7" fill="#183044"/>
    <path class="spoke" d="M222 353v136M154 421h136M174 373l96 96M270 373l-96 96"/>
  </g>
  <g class="rolling">
    <circle class="wheel" cx="527" cy="421" r="68"/>
    <circle cx="527" cy="421" r="7" fill="#183044"/>
    <path class="spoke" d="M527 353v136M459 421h136M479 373l96 96M575 373l-96 96"/>
  </g>
  <circle cx="331" cy="421" r="17" fill="#ffd166" class="ink"/>
  <path d="M331 421l21-16M331 421l-17 20" class="ink" fill="none"/>
  <circle cx="352" cy="405" r="7" fill="#183044"/>
  <circle cx="314" cy="441" r="7" fill="#183044"/>
  <path d="M278 322h-48q-10 0-10 9v7h58" class="ink" fill="#183044"/>
  <path d="M500 308h32" class="ink" fill="none"/>

  <!-- Pelican riding proudly -->
  <g class="rider">
    <path d="M350 296 Q337 250 365 222 Q398 193 437 215 Q462 230 455 267 Q449 300 420 314 L381 325Z" fill="#fffaf0" class="ink"/>
    <path d="M368 262 Q397 237 438 252 L447 281 Q423 306 381 301Z" fill="#4aa6a0" class="ink"/>
    <path d="M377 297l-12 27M414 306l-10 21" fill="none" class="ink"/>
    <path d="M360 325l-13 4M403 327l-13 4" fill="none" class="ink"/>
    <!-- neck and head -->
    <path d="M402 252 Q422 221 416 187 Q410 156 432 141" fill="none" stroke="#fffaf0" stroke-width="26" stroke-linecap="round"/>
    <path d="M402 252 Q422 221 416 187 Q410 156 432 141" fill="none" stroke="#183044" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="448" cy="135" rx="39" ry="31" fill="#fffaf0" class="ink"/>
    <path d="M467 143 Q520 138 563 158 Q536 177 475 162Z" fill="#ff9f43" class="ink"/>
    <path d="M476 159 Q520 179 549 166 Q540 197 505 198 Q480 193 476 159Z" fill="#f07f68" class="ink"/>
    <path d="M500 164q17 4 27 0" fill="none" stroke="#c95c51" stroke-width="3"/>
    <circle cx="458" cy="128" r="5" fill="#183044"/>
    <path d="M440 117q-8 6-15 1" fill="none" stroke="#183044" stroke-width="3"/>
    <!-- cap -->
    <path d="M421 111 Q440 82 470 103 L477 116 Q448 105 422 123Z" fill="#ef6a5b" class="ink"/>
    <path d="M436 103l-1-14M449 102l3-16M461 105l7-12" stroke="#ffd166" stroke-width="4" stroke-linecap="round"/>
    <!-- flapping wing -->
    <path d="M381 257 Q352 239 345 260 Q359 278 386 279" fill="#f3d8b8" class="ink"/>
    <!-- tiny fish in pouch -->
    <path d="M501 181q12-9 25 0-13 10-25 0m25 0 9-7v14z" fill="#ffd166" stroke="#183044" stroke-width="3"/>
    <circle cx="507" cy="179" r="1.8" fill="#183044"/>
  </g>

  <!-- speech bubble -->
  <path d="M574 206 Q581 174 615 177 L700 177 Q730 179 728 210 L722 240 Q719 257 699 257 L641 257 620 277 624 256 Q578 257 574 230Z" fill="#fff" class="ink"/>
  <text class="txt" x="651" y="207" text-anchor="middle" font-size="15" font-weight="800">I call this</text>
  <text class="txt" x="651" y="230" text-anchor="middle" font-size="17" font-weight="900">a peloton!</text>
  <path d="M605 282q-6-12-12-15M594 291q-8-9-15-10" fill="none" stroke="#183044" stroke-width="3" stroke-linecap="round"/>

  <!-- road dashes -->
  <path d="M55 510h95m42 0h70m240 0h90m38 0h120" stroke="#fff6d8" stroke-width="7" stroke-linecap="round"/>

  <rect x="0" y="532" width="800" height="68" fill="#183044"/>
  <text class="txt" x="400" y="557" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" style="fill:#fff">Pelican power: one bird, two wheels, and a very captive passenger.</text>
  <text class="txt" x="400" y="584" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd166" style="fill:#ffd166">2026-11-01 02:32:12 SGT (UTC+08:00)</text>
</svg>