<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>The Pelican Commuter</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>

  <rect width="800" height="600" fill="#bde9f2"/>
  <circle cx="675" cy="105" r="48" fill="#ffd95a" stroke="#1d2935" stroke-width="6"/>
  <path d="M0 420 Q120 380 240 420 T480 420 T800 410 V600 H0Z" fill="#8bd17c"/>
  <path d="M0 470 Q180 430 360 470 T800 460" fill="none" stroke="#4b9d61" stroke-width="7"/>
  <path d="M60 515 Q210 490 340 520 T650 510 T800 520" fill="none" stroke="#d4b05d" stroke-width="18" stroke-linecap="round"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#173142" stroke="#ffffff" stroke-width="5" paint-order="stroke">THE PELICAN COMMUTER</text>
  <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173142">“NO FISH? NO PROBLEM. I’M STILL TAKING THE FAST LANE.”</text>

  <!-- bicycle -->
  <g stroke="#263746" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="245" cy="450" r="67" fill="#d7f4f4"/>
    <circle cx="570" cy="450" r="67" fill="#d7f4f4"/>
    <path d="M245 450 L335 320 L430 450 L245 450 L385 450 L335 320 L570 450"/>
    <path d="M335 320 L320 286"/>
    <path d="M308 286 L336 286"/>
    <path d="M430 450 L452 360"/>
    <path d="M438 360 L470 360"/>
    <circle cx="430" cy="450" r="13" fill="#f0b429"/>
    <path d="M430 450 L407 420 M430 450 L458 478"/>
  </g>

  <!-- pelican body -->
  <ellipse cx="405" cy="260" rx="104" ry="116" fill="#f5f1df" stroke="#263746" stroke-width="7"/>
  <path d="M350 252 Q405 215 470 257 Q444 300 390 310 Q350 297 350 252Z" fill="#d8d4c2" stroke="#263746" stroke-width="6"/>
  <path d="M365 280 Q400 303 449 278 Q430 340 382 335 Q357 315 365 280Z" fill="#eab05a" stroke="#263746" stroke-width="6"/>

  <!-- pelican head -->
  <ellipse cx="392" cy="160" rx="78" ry="78" fill="#f8f4e6" stroke="#263746" stroke-width="7"/>
  <path d="M338 123 Q365 83 421 91 Q454 101 467 132 Q432 118 398 130 Q366 142 338 123Z" fill="#d8d4c2" stroke="#263746" stroke-width="6"/>
  <circle cx="414" cy="145" r="9" fill="#263746"/>
  <circle cx="417" cy="141" r="3" fill="#ffffff"/>
  <path d="M449 164 Q520 145 604 173 Q621 180 604 194 L461 212 Q437 205 449 164Z" fill="#e8a541" stroke="#263746" stroke-width="7"/>
  <path d="M466 189 Q531 181 602 188" fill="none" stroke="#b87527" stroke-width="5"/>
  <path d="M380 174 Q398 188 419 176" fill="none" stroke="#263746" stroke-width="5"/>

  <!-- helmet -->
  <path d="M330 117 Q348 67 402 64 Q450 65 470 112 L454 122 Q413 101 365 119Z" fill="#e85b4f" stroke="#263746" stroke-width="7"/>
  <path d="M350 91 Q395 73 445 98" fill="none" stroke="#ffd95a" stroke-width="9"/>

  <!-- wing and handlebars -->
  <path d="M350 245 Q287 264 301 335 Q319 367 364 319 L392 274Z" fill="#f8f4e6" stroke="#263746" stroke-width="7"/>
  <path d="M462 247 Q505 260 476 316 Q458 338 436 306" fill="#f8f4e6" stroke="#263746" stroke-width="7"/>
  <path d="M474 304 Q500 324 470 360" fill="none" stroke="#263746" stroke-width="7"/>
  <path d="M470 360 Q488 344 506 360" fill="none" stroke="#263746" stroke-width="7"/>

  <!-- legs -->
  <path d="M380 342 L350 423 L410 450" fill="none" stroke="#e8a541" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440 338 L468 417 L430 450" fill="none" stroke="#e8a541" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M341 423 L365 430" stroke="#263746" stroke-width="7"/>
  <path d="M462 416 L485 423" stroke="#263746" stroke-width="7"/>

  <!-- comic motion -->
  <path d="M150 335 L105 315 M145 370 L92 365 M632 327 L684 308" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <text x="92" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#e85b4f" transform="rotate(-12 92 300)">FLAP!</text>
  <text x="620" y="300" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#e85b4f" transform="rotate(12 620 300)">HONK!</text>

  <!-- caption plaque -->
  <rect x="158" y="535" width="484" height="42" rx="21" fill="#fff6d8" stroke="#263746" stroke-width="5"/>
  <text x="400" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#263746">A pelican on a bicycle: all beak, no brakes.</text>
</svg>