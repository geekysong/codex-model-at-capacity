<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>THE PELICAN EXPRESS</title>
  <desc>A satirical cartoon pelican rides a bicycle while carrying an oversized fish-shaped briefcase.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e8f7e9"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777b80"/>
      <stop offset="1" stop-color="#45484d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#24323a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202a30;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#202a30;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .caption{font-family:Arial,Helvetica,sans-serif;font-weight:700;letter-spacing:1px}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="54" fill="#fff4b0" opacity=".9"/>
  <path d="M0 380 Q130 315 260 375 T520 365 T800 350 V455 H0Z" fill="#82b885"/>
  <path d="M0 420 Q150 365 300 420 T590 410 T800 405 V480 H0Z" fill="#5d9b69"/>
  <path d="M0 467 Q220 435 400 468 T800 460 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 Q160 480 320 510 T650 500 T800 505" fill="none" stroke="#c7cbd0" stroke-width="8" stroke-dasharray="28 24" opacity=".8"/>

  <!-- title banner -->
  <g filter="url(#shadow)">
    <path d="M92 42 Q400 13 708 42 L690 115 Q400 90 110 115Z" fill="#e84c3d" class="ink"/>
    <text x="400" y="86" text-anchor="middle" class="caption" font-size="39" fill="#fff8dc">THE PELICAN EXPRESS</text>
  </g>

  <!-- comic birds in sky -->
  <path d="M125 178 q18 -16 36 0 q18 -16 36 0" fill="none" class="thin"/>
  <path d="M565 174 q15 -13 30 0 q15 -13 30 0" fill="none" class="thin"/>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <circle cx="270" cy="455" r="82" fill="none" class="ink"/>
    <circle cx="570" cy="455" r="82" fill="none" class="ink"/>
    <circle cx="270" cy="455" r="8" fill="#202a30"/>
    <circle cx="570" cy="455" r="8" fill="#202a30"/>
    <path d="M270 455 L356 330 L470 455 L270 455 L420 455 L570 455 L470 455 L420 330 L356 330" fill="none" stroke="#f2b632" stroke-width="11" stroke-linejoin="round"/>
    <path d="M420 330 L405 290 M394 290 H430" fill="none" class="ink"/>
    <path d="M350 330 L326 305 H292" fill="none" class="ink"/>
    <path d="M470 455 l-18 52 M452 507 h39" fill="none" class="ink"/>
    <circle cx="420" cy="455" r="18" fill="#ef6c3b" class="ink"/>
    <path d="M420 455 l-38 -36 M420 455 l40 35" fill="none" class="thin"/>
    <path d="M248 372 Q270 355 292 372" fill="none" class="ink"/>
    <rect x="240" y="351" width="62" height="18" rx="9" fill="#ef6c3b" class="ink"/>
  </g>

  <!-- pelican body -->
  <g filter="url(#shadow)">
    <ellipse cx="404" cy="252" rx="90" ry="112" fill="#f5f1df" class="ink"/>
    <path d="M350 241 Q320 290 348 345 Q380 365 419 336 Q445 296 430 247Z" fill="#d9e6e3" class="ink"/>
    <path d="M430 175 Q488 151 536 191 Q558 220 535 251 Q502 273 451 242Z" fill="#f5f1df" class="ink"/>
    <ellipse cx="514" cy="208" rx="12" ry="13" fill="#202a30"/>
    <circle cx="518" cy="203" r="4" fill="#fff"/>
    <path d="M527 225 Q613 231 662 265 Q625 302 535 275 Q493 264 451 242Z" fill="#f2a755" class="ink"/>
    <path d="M530 248 Q591 259 634 277 Q594 299 545 278" fill="#ef8751" class="thin"/>
    <path d="M475 264 Q507 282 544 279" fill="none" class="thin"/>
    <path d="M366 184 Q337 153 350 126 Q375 135 389 168" fill="#d9e6e3" class="ink"/>
    <path d="M438 177 Q460 133 492 127 Q500 154 473 190" fill="#d9e6e3" class="ink"/>

    <!-- scarf -->
    <path d="M344 203 Q405 223 466 199 L460 229 Q402 251 349 228Z" fill="#e84c3d" class="ink"/>
    <path d="M453 219 Q490 250 472 302 L441 272Z" fill="#e84c3d" class="ink"/>

    <!-- wing and wing hand -->
    <path d="M365 257 Q322 274 331 320 Q350 342 385 316 L414 276Z" fill="#eef0e7" class="ink"/>
    <path d="M443 265 Q477 292 493 326" fill="none" class="ink"/>
    <path d="M491 326 l18 -8 M491 326 l5 20 M491 326 l-12 13" fill="none" class="thin"/>

    <!-- legs -->
    <path d="M383 337 L397 407 L430 433" fill="none" class="ink"/>
    <path d="M430 340 L451 402 L421 432" fill="none" class="ink"/>
    <path d="M421 432 q18 9 35 2 M430 433 q-14 13 -29 10" fill="none" class="thin"/>
    <path d="M397 407 q-17 15 -34 8 M451 402 q18 12 34 4" fill="none" class="thin"/>
  </g>

  <!-- fish briefcase -->
  <g transform="translate(550 315) rotate(10)" filter="url(#shadow)">
    <path d="M0 20 Q62 -15 122 21 Q92 70 26 66Z" fill="#6eb8c7" class="ink"/>
    <path d="M122 21 l40 -25 l-9 39 l9 35 l-40 -25" fill="#6eb8c7" class="ink"/>
    <circle cx="35" cy="25" r="6" fill="#202a30"/>
    <path d="M55 38 q20 12 39 0" fill="none" class="thin"/>
    <path d="M49 7 v-22 q0 -13 13 -13 h26 q13 0 13 13 V4" fill="none" class="ink"/>
    <text x="62" y="57" text-anchor="middle" class="caption" font-size="13" fill="#203039">BILLS</text>
  </g>

  <!-- motion lines and sweat -->
  <path d="M160 425 h48 M145 451 h55 M618 386 h45" fill="none" stroke="#f7f0bd" stroke-width="7" stroke-linecap="round"/>
  <path d="M330 142 q-12 -22 4 -36 M345 151 q-5 -17 9 -28" fill="none" stroke="#4e9db0" stroke-width="6" stroke-linecap="round"/>
  <path d="M615 340 q18 -15 36 0" fill="none" class="thin"/>

  <!-- caption -->
  <g filter="url(#shadow)">
    <path d="M116 530 Q400 510 684 530 L672 586 Q400 570 128 586Z" fill="#fff8dc" class="ink"/>
    <text x="400" y="557" text-anchor="middle" class="caption" font-size="21" fill="#26343a">“I’M JUST TRYING TO KEEP MY BILLS AFLOAT!”</text>
  </g>
</svg>