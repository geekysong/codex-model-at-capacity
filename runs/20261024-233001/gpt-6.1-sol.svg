<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A level seesaw has a 6 kilogram mass 2 metres left of the pivot and a 4 kilogram mass 3 metres right. Equal opposing torques give 6 times 2 equals 4 times 3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#dc4b35"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#203047">
    <text x="300" y="40" font-size="26" font-weight="700" fill="#23825b">balanced</text>

    <!-- Distances are proportional: 100 px per metre. -->
    <g stroke="#64748b" stroke-width="1.5" fill="none">
      <path d="M50 88V120M250 88V120M550 88V120"/>
      <path d="M50 102H250M250 102H550"/>
      <path d="m50 102 8-4m-8 4 8 4m242-4-8-4m8 4-8 4"/>
      <path d="m250 102 8-4m-8 4 8 4m292-4-8-4m8 4-8 4"/>
    </g>
    <rect x="118" y="85" width="64" height="30" fill="#fff"/>
    <rect x="335" y="85" width="130" height="30" fill="#fff"/>
    <text x="150" y="107" font-size="20">2 m</text>
    <text x="400" y="107" font-size="20" font-weight="700">x = 3 m</text>

    <!-- Horizontal beam and pivot. -->
    <rect x="30" y="145" width="540" height="14" rx="5" fill="#36566f"/>
    <path d="M250 159 219 219H281Z" fill="#a4b4c4" stroke="#36566f" stroke-width="2"/>
    <path d="M207 222H293" stroke="#36566f" stroke-width="4" stroke-linecap="round"/>
    <text x="250" y="246" font-size="16">pivot</text>

    <!-- Suspended masses. -->
    <g stroke="#36566f" stroke-width="3">
      <path d="M50 159V188M550 159V188"/>
      <rect x="17" y="188" width="66" height="51" rx="6" fill="#e5edf5"/>
      <rect x="517" y="188" width="66" height="51" rx="6" fill="#e5edf5"/>
    </g>
    <text x="50" y="220" font-size="21" font-weight="700">6 kg</text>
    <text x="550" y="220" font-size="21" font-weight="700">4 kg</text>

    <!-- Downward gravitational forces. -->
    <g stroke="#dc4b35" stroke-width="3" marker-end="url(#arrow)">
      <path d="M50 244V290"/>
      <path d="M550 244V290"/>
    </g>
    <text x="88" y="278" font-size="18" fill="#bc3927">6g</text>
    <text x="512" y="278" font-size="18" fill="#bc3927">4g</text>

    <text x="300" y="310" font-size="17">Equal opposing torques (g cancels)</text>
    <text x="300" y="345" font-size="27" font-weight="700">6×2 = 4×3</text>
    <text x="300" y="378" font-size="21">x = (6×2) / 4 = 3 m</text>
  </g>
</svg>