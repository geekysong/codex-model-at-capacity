<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A 6 kilogram mass hangs 2 meters left of the pivot, and a 4 kilogram mass hangs 3 meters right. Equal opposing torques keep the seesaw level: 6 times 2 equals 4 times 3.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#dc493a"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172b40">
    <text x="300" y="40" font-size="26" font-weight="700" fill="#16805d">balanced</text>

    <g stroke="#52677d" stroke-width="1.5" fill="none">
      <path d="M100 79V133M260 79V133M500 79V133" stroke-dasharray="4 4"/>
      <path d="M100 92H260M260 92H500"/>
      <path d="M100 86V98M260 86V98M500 86V98"/>
    </g>
    <rect x="152" y="77" width="56" height="29" fill="#f8fafc"/>
    <rect x="323" y="77" width="114" height="29" fill="#f8fafc"/>
    <text x="180" y="98" font-size="20">2 m</text>
    <text x="380" y="98" font-size="20" font-weight="700">x = 3 m</text>

    <rect x="65" y="137" width="470" height="14" rx="4" fill="#314e6b"/>
    <path d="M260 151L228 212H292Z" fill="#b9c9d8" stroke="#314e6b" stroke-width="2"/>
    <circle cx="260" cy="151" r="5" fill="#172b40"/>
    <path d="M218 215H302" stroke="#314e6b" stroke-width="4" stroke-linecap="round"/>
    <text x="260" y="241" font-size="16">pivot</text>

    <g stroke="#52677d" stroke-width="3">
      <path d="M100 151V180"/>
      <path d="M500 151V180"/>
    </g>
    <rect x="65" y="180" width="70" height="54" rx="7" fill="#deebf7" stroke="#314e6b" stroke-width="2"/>
    <rect x="470" y="180" width="60" height="44" rx="7" fill="#deebf7" stroke="#314e6b" stroke-width="2"/>
    <text x="100" y="214" font-size="22" font-weight="700">6 kg</text>
    <text x="500" y="209" font-size="20" font-weight="700">4 kg</text>

    <g stroke="#dc493a" stroke-width="3" marker-end="url(#arrow)">
      <path d="M100 238V292"/>
      <path d="M500 228V264"/>
    </g>
    <text x="146" y="274" font-size="18" fill="#bd352b">6g ↓</text>
    <text x="546" y="255" font-size="18" fill="#bd352b">4g ↓</text>

    <text x="300" y="324" font-size="19">Equal opposing torques: 6g × 2 = 4g × x</text>
    <text x="300" y="355" font-size="24" font-weight="700">6×2 = 4×3</text>
    <text x="300" y="384" font-size="20" font-weight="700" fill="#16805d">x = (6 × 2) / 4 = 3 m</text>
  </g>
</svg>