<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="A balanced level seesaw. A 6 kilogram mass hangs 2 meters left of the pivot and a 4 kilogram mass hangs 3 meters right. Torque equation: 6 times 2 equals 4 times 3.">
  <rect width="600" height="400" fill="#f7f9fc"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Level seesaw in static equilibrium</text>

  <!-- Level beam -->
  <line x1="90" y1="190" x2="510" y2="190" stroke="#34495e" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="190" r="10" fill="#17324d"/>

  <!-- Pivot -->
  <path d="M300 202 L265 270 L335 270 Z" fill="#7f8c8d" stroke="#52616b" stroke-width="2"/>
  <line x1="245" y1="272" x2="355" y2="272" stroke="#52616b" stroke-width="5" stroke-linecap="round"/>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#34495e">pivot</text>

  <!-- Left hanger and mass -->
  <line x1="150" y1="196" x2="150" y2="244" stroke="#34495e" stroke-width="3"/>
  <rect x="112" y="244" width="76" height="52" rx="8" fill="#4c8eda"/>
  <text x="150" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">6 kg</text>

  <!-- Right hanger and mass -->
  <line x1="450" y1="196" x2="450" y2="244" stroke="#34495e" stroke-width="3"/>
  <rect x="412" y="244" width="76" height="52" rx="8" fill="#e88b45"/>
  <text x="450" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="112" x2="150" y2="174" stroke="#2874a6" stroke-width="4"/>
  <path d="M140 164 L150 180 L160 164" fill="none" stroke="#2874a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2874a6">weight</text>

  <line x1="450" y1="112" x2="450" y2="174" stroke="#c65d21" stroke-width="4"/>
  <path d="M440 164 L450 180 L460 164" fill="none" stroke="#c65d21" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#c65d21">weight</text>

  <!-- Distance markers -->
  <line x1="150" y1="215" x2="300" y2="215" stroke="#6c7a89" stroke-width="2"/>
  <line x1="150" y1="207" x2="150" y2="223" stroke="#6c7a89" stroke-width="2"/>
  <line x1="300" y1="207" x2="300" y2="223" stroke="#6c7a89" stroke-width="2"/>
  <text x="225" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#34495e">2 m</text>

  <line x1="300" y1="215" x2="450" y2="215" stroke="#6c7a89" stroke-width="2"/>
  <line x1="450" y1="207" x2="450" y2="223" stroke="#6c7a89" stroke-width="2"/>
  <text x="375" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#34495e">x = 3 m</text>

  <!-- Equilibrium statement -->
  <rect x="135" y="326" width="330" height="52" rx="12" fill="#e5f4eb" stroke="#63a77a" stroke-width="2"/>
  <text x="300" y="349" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#247447">6 × 2 = 4 × 3</text>
  <text x="300" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#247447">balanced</text>
</svg>