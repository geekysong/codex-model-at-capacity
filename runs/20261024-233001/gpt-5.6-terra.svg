<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw torque equation</title>
  <desc id="desc">A level seesaw with a 6 kilogram mass two metres left of the pivot and a 4 kilogram mass three metres right, in static equilibrium.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#1f2937"/>
    </marker>
    <style>
      .line { stroke:#1f2937; stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#475569; stroke-width:2; fill:none; }
      .label { font-family:Arial, sans-serif; fill:#1f2937; font-size:20px; font-weight:600; }
      .small { font-family:Arial, sans-serif; fill:#334155; font-size:17px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="42" text-anchor="middle" class="label" font-size="26">Static Equilibrium</text>

  <!-- Seesaw -->
  <line x1="75" y1="205" x2="525" y2="205" class="line" stroke-width="10"/>
  <circle cx="300" cy="205" r="7" fill="#1f2937"/>

  <!-- Pivot -->
  <path d="M300 212 L255 290 L345 290 Z" fill="#94a3b8" stroke="#1f2937" stroke-width="4"/>
  <line x1="238" y1="291" x2="362" y2="291" class="line"/>
  <text x="300" y="322" text-anchor="middle" class="small">pivot</text>

  <!-- Left mass -->
  <line x1="150" y1="205" x2="150" y2="243" class="line"/>
  <rect x="120" y="243" width="60" height="50" rx="5" fill="#60a5fa" stroke="#1f2937" stroke-width="3"/>
  <text x="150" y="274" text-anchor="middle" class="label">6 kg</text>

  <!-- Right mass -->
  <line x1="450" y1="205" x2="450" y2="243" class="line"/>
  <rect x="420" y="243" width="60" height="50" rx="5" fill="#f59e0b" stroke="#1f2937" stroke-width="3"/>
  <text x="450" y="274" text-anchor="middle" class="label">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="130" x2="150" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="105" y="125" class="small">weight</text>
  <line x1="450" y1="130" x2="450" y2="190" class="line" marker-end="url(#arrow)"/>
  <text x="405" y="125" class="small">weight</text>
  <line x1="300" y1="260" x2="300" y2="222" class="line" marker-end="url(#arrow)"/>
  <text x="315" y="250" class="small">support force</text>

  <!-- Distance labels -->
  <line x1="150" y1="175" x2="300" y2="175" class="thin"/>
  <line x1="150" y1="168" x2="150" y2="182" class="thin"/>
  <line x1="300" y1="168" x2="300" y2="182" class="thin"/>
  <text x="225" y="165" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="175" x2="450" y2="175" class="thin"/>
  <line x1="450" y1="168" x2="450" y2="182" class="thin"/>
  <text x="375" y="165" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equation -->
  <rect x="145" y="340" width="310" height="42" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="368" text-anchor="middle" class="label">6 × 2 = 4 × 3</text>
  <text x="510" y="368" text-anchor="middle" fill="#15803d" font-family="Arial, sans-serif" font-size="21" font-weight="700">balanced</text>
</svg>