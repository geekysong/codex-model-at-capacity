<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Big Bill, Small Carbon Footprint</title>
  <desc id="desc">A smug pelican pedals a bicycle along the waterfront, carrying fish in its enormous bill. The wheels spin and the bird bobs in a looping animation.</desc>
  <defs>
