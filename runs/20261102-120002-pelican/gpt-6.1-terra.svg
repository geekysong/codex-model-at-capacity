<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A self-important pelican rides a bicycle with spinning wheels, a bobbing body, and a fish peeking out of its bill.</desc>
  <defs>
    <pattern id="spokes" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#f6cb78"/>
    </pattern>
    <style>
      .ink { stroke:#26343b; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 0.6s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6db"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#f9eac8" stroke="#26343b" stroke-width="4"/>
  <text x="400" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="2" fill="#26343b">THE DAILY COMMUTE</text>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#b25236">A VERY IMPORTANT BUSINESS BIRD</text>

