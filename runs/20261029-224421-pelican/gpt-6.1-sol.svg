<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle with a huge fish-filled bill, while a sign declares that oversized baggage costs extra. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bceef4"/>
      <stop offset="1" stop-color="#fff8dc"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffca55"/>
      <stop offset="1" stop-color="#ef8d3c"/>
    </linearGradient>
    <pattern id="road" width="160" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 10h75" stroke="#fff3bc" stroke-width="6" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="65" fill="#fff8df" stroke="#273742" stroke-width="11"/>
      <circle r="55" fill="none" stroke="#9baeb3" stroke-width="2"/>
      <g stroke="#7b9098" stroke-width="2">
        <path d="M0-58V58M-58 0H58M-41-41l82 82M-41 41l82-82"/>
        <path d="M-22-54l44 108M-54-22l108 44M-54 22l108-44M-22 54l44-108"/>
      </g>
      <path d="M37-44l8 9" stroke="#ef654b" stroke-width="7" stroke-linecap="round"/>
      <circle r="8" fill="#273742"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="16" y="16" width="768" height="510" rx="25" fill="url(#sky)" stroke="#273742" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#243640">
    <text x="400" y="64" font-size="39" font-weight="900" letter-spacing="2">TOUR DE FISH</text>
    <text x="400" y="96" font-size="17" font-weight="bold">ONE BIRD. TWO WHEELS. NO WEIGHT LIMIT.</text>
  </g>

  <g fill="#fff" opacity=".78">
    <path d="M49 157c-5-23 25-36 41-20 9-30 51-23 53 2 28-9 45 15 35 27H49Z"/>
    <path d="M567 140c-1-21 28-32 43-15 10-23 40-17 45 5 28-8 45 16 31 24H567Z"/>
  </g>
  <path d="M18 370q112-53 220-5t220-4 190 5 134-8v95H18Z" fill="#a7caa2"/>
  <path d="M18 408q150-42 310 0t300-4 154-4v53H18Z" fill="#78ab91"/>
  <path d="M18 437H782V502H18Z" fill="#69767b"/>
  <path d="M18 477H782" stroke="url(#road)" stroke-width="15"/>
  <rect x="18" y="474" width="764" height="20" fill="url(#road)"/>
  <ellipse cx="382" cy="459" rx="224" ry="13" fill="#23333e" opacity=".17"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <path d="M683 302v136" stroke="#695344" stroke-width="9"/>
    <rect x="610" y="246" width="147" height="78" rx="9" fill="#fff8da" stroke="#273742" stroke-width="3"/>
    <text x="683" y="269" font-size="14" font-weight="bold" fill="#b64735">OVERSIZED</text>
    <text x="683" y="288" font-size="14" font-weight="bold" fill="#b64735">BAGGAGE: +$20</text>
    <text x="683" y="310" font-size="12" fill="#273742">YES, THAT BILL.</text>
  </g>

  <g transform="translate(235 390)">
    <use href="#wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(524 390)">
    <use href="#wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
    </use>
  </g>

  <g stroke="#273742" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 390l76-105 54 105H235l87-76h143l-100 76m100-76 59 76m-59-76-12-43" fill="none" stroke-width="12"/>
    <path d="M235 390l76-105 54 105H235l87-76h143l-100 76m100-76 59 76" fill="none" stroke="#e9534e" stroke-width="7"/>
    <path d="M311 285l-8-23" fill="none" stroke-width="8"/>
    <path d="M282 262h48" fill="none" stroke-width="12"/>
    <path d="M453 271l-5-18h35q17 0 14 15" fill="none" stroke-width="7"/>
    <circle cx="365" cy="390" r="19" fill="#a4b7b7" stroke-width="4"/>
    <path d="M235 390h130" stroke="#687c83" stroke-width="3"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".65s" repeatCount="indefinite"/>
    <g stroke="#273742" stroke-width="4" stroke-linejoin="round">
      <path d="M326 279q22 23 32 49l-17 39" fill="none" stroke="#dd913b" stroke-width="11"/>
      <path d="M326 279q22 23 32 49l-17 39" fill="none" stroke="#ffc456" stroke-width="6"/>
      <path d="M330 369l30 4" stroke-width="8"/>
      <path d="M263 261l-40-18 20 38 36 5" fill="#fffdf0"/>
      <path d="M268 221q17-37 56-22 48 16 54 57-29 42-81 28-43-13-29-63Z" fill="#fffdf0"/>
      <path d="M286 227q18 43 63 32-10-24-29-31" fill="#dfe8e4"/>
      <path d="M344 235q36-25 30-68-3-25 15-37 25-15 47 7 13 18-1 41-28 39-17 73" fill="#fffdf0"/>
      <path d="M382 141q20-16 39-3" fill="none"/>
      <path d="M375 137q4-28 31-28 27 0 37 28Z" fill="#e9534e"/>
      <path d="M389 116l4 14m14-17 2 16m12-10 2 12" fill="none" stroke="#fff1bf" stroke-width="3"/>
      <circle cx="417" cy="152" r="6" fill="#273742" stroke="none"/>
      <circle cx="419" cy="150" r="1.8" fill="white" stroke="none"/>
      <path d="M407 140l17 3" fill="none" stroke-width="3"/>
      <path d="M433 164l153 17q-27 91-105 50-40-21-48-67Z" fill="url(#pouch)"/>
      <path d="M432 160l165 18-10 13-155-17Z" fill="#ffd165"/>
      <path d="M455 194q51 30 98 5" fill="none" stroke="#d67d34" stroke-width="2"/>
      <path d="M476 207q20-23 45-4l15-11-1 24-15-8q-23 14-44-1Z" fill="#8bbbbb" stroke-width="2"/>
      <circle cx="486" cy="205" r="2.5" fill="#273742" stroke="none"/>
      <path d="M339 230q31 19 59 14l54 12" fill="none" stroke-width="13"/>
      <path d="M339 230q31 19 59 14l54 12" fill="none" stroke="#fffdf0" stroke-width="8"/>
      <path d="M447 251l9 13m-1-14 8 11" fill="none" stroke-width="3"/>
    </g>
  </g>

  <g transform="translate(365 390)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
      <path d="M-23 0H23" stroke="#273742" stroke-width="6" stroke-linecap="round"/>
      <path d="M-30-5v10M30-5v10" stroke="#273742" stroke-width="10"/>
      <circle r="5" fill="#e7e8d6"/>
    </g>
  </g>

  <g stroke="#273742" stroke-linecap="round" stroke-linejoin="round">
    <path d="M332 280l52 49-13 38" fill="none" stroke-width="13">
      <animate attributeName="d" values="M332 280l52 49-13 38;M332 280l34 54-17 44;M332 280l52 49-13 38" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M332 280l52 49-13 38" fill="none" stroke="#ffc456" stroke-width="8">
      <animate attributeName="d" values="M332 280l52 49-13 38;M332 280l34 54-17 44;M332 280l52 49-13 38" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M360 368l30 3-11 7-22-4Z" fill="#ffc456" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-22 11;0 0" dur="1.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#273742">
    <path d="M101 202q-14-9-10-29 5-20 30-20h119q24 0 24 23v23q0 22-25 22h-74l-23 20 4-20h-25q-14 0-20-19Z" fill="#fffdf4" stroke="#273742" stroke-width="3"/>
    <text x="177" y="180" text-anchor="middle" font-size="16" font-weight="bold">“It's all</text>
    <text x="177" y="203" text-anchor="middle" font-size="16" font-weight="bold">carry-on!”</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#273742">
    <text x="400" y="553" font-size="18" font-weight="bold">He bought a bicycle. The bill was enormous.</text>
    <text x="400" y="584" font-size="16">2026-10-29 22:46:12 SGT (UTC+08:00)</text>
  </g>
</svg>