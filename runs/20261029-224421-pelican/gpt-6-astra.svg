<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Tour de Beak</title>
  <desc id="description">A determined pelican pedals a bicycle with a fish in its enormous bill pouch. Both wheels spin, the pedals turn, and the pelican bobs in a seamless loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#ddcda7" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M35 113H765" stroke="#263b42" stroke-width="3"/>
  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="900" fill="#263b42">THE TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-family="sans-serif" font-size="18" letter-spacing="3" fill="#a34b32">ELITE ATHLETE. UNLIMITED SNACK STORAGE.</text>

  <!-- One breezy seaside scene -->
  <path d="M0 356Q100 340 200 356T400 356T600 356T800 356V475H0Z" fill="#bce1df"/>
  <path d="M0 388Q120 371 240 388T480 388T720 388T960 388" fill="none" stroke="#80bcbf" stroke-width="3"/>
  <path d="M0 442Q200 421 400 439T800 433V530H0Z" fill="#e7d198"/>
  <path d="M30 522H770" stroke="#263b42" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="405" cy="515" rx="247" ry="10" fill="#263b42" opacity=".12"/>

  <g fill="none" stroke="#263b42" stroke-width="3" stroke-linecap="round">
    <path d="M90 213h67M111 235h51M66 257h73"/>
    <path d="M659 178q12-14 24 0q12-14 24 0"/>
    <path d="M92 315q10-11 20 0q10-11 20 0"/>
  </g>

  <!-- Stationary speech balloon -->
  <path d="M570 129H736Q752 129 752 145V217Q752 233 736 233H625L596 255L602 233H570Q554 233 554 217V145Q554 129 570 129Z" fill="#fffdf5" stroke="#263b42" stroke-width="3"/>
  <text x="653" y="160" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#263b42">
    <tspan x="653">“It's not cargo.</tspan>
    <tspan x="653" dy="26">It's carb</tspan>
    <tspan x="653" dy="26">loading.”</tspan>
  </text>

  <!-- Spinning bicycle wheels -->
  <g transform="translate(246 454)">
    <circle r="64" fill="#fff9e8" stroke="#263b42" stroke-width="10"/>
    <circle r="54" fill="none" stroke="#dc8e55" stroke-width="2"/>
    <g stroke="#68898b" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-56 0H56M0-56V56M-40-40L40 40M-40 40L40-40"/>
      <path d="M21-52L-21 52M-52-21L52 21M-21-52L21 52M-52 21L52-21"/>
      <rect x="36" y="-5" width="15" height="10" rx="3" fill="#f3b63e" stroke="none"/>
    </g>
    <circle r="8" fill="#263b42"/>
  </g>
  <g transform="translate(571 454)">
    <circle r="64" fill="#fff9e8" stroke="#263b42" stroke-width="10"/>
    <circle r="54" fill="none" stroke="#dc8e55" stroke-width="2"/>
    <g stroke="#68898b" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-56 0H56M0-56V56M-40-40L40 40M-40 40L40-40"/>
      <path d="M21-52L-21 52M-52-21L52 21M-21-52L21 52M-52 21L52-21"/>
      <rect x="36" y="-5" width="15" height="10" rx="3" fill="#f3b63e" stroke="none"/>
    </g>
    <circle r="8" fill="#263b42"/>
  </g>

  <!-- Bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246 454L328 350L391 454ZM328 350H527L391 454M527 350L571 454" stroke="#263b42" stroke-width="13"/>
    <path d="M246 454L328 350L391 454ZM328 350H527L391 454M527 350L571 454" stroke="#e75b43" stroke-width="7"/>
    <path d="M328 350L316 326M527 350L516 312L546 302" stroke="#263b42" stroke-width="9"/>
    <path d="M294 325H342M538 301L552 303" stroke="#263b42" stroke-width="13"/>
    <path d="M246 454L391 440Q410 453 391 468L246 463Z" stroke="#263b42" stroke-width="3"/>
  </g>
  <circle cx="391" cy="454" r="19" fill="#f8eaca" stroke="#263b42" stroke-width="4"/>

  <!-- Bobbing pelican and its overstuffed lunch pouch -->
  <g stroke="#263b42" stroke-width="4" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M301 281L253 260L271 303L243 295L284 327" fill="#fdfbf2"/>
    <path d="M287 274Q305 238 361 256Q396 274 408 248L419 190Q425 163 450 171Q480 180 469 212L449 273Q443 322 383 336Q318 352 284 315Z" fill="#fffdf4"/>
    <path d="M290 277Q338 251 378 277L404 315Q348 343 298 317Z" fill="#1f9296"/>
    <path d="M322 274Q348 271 370 286L409 309L502 306Q513 302 518 311Q516 321 502 320L405 327Q361 322 334 303" fill="#fffdf4"/>
    <path d="M300 296Q313 312 333 318" fill="none" stroke="#137579"/>
    <rect x="295" y="278" width="41" height="30" rx="5" fill="#fff4d9" stroke-width="2"/>
    <text x="315" y="300" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#263b42" stroke="none">01</text>

    <!-- Comically capacious bill -->
    <path d="M465 207L634 218Q612 291 542 292Q484 283 465 222Z" fill="#f7bd58"/>
    <path d="M466 203Q541 198 644 215L637 227L465 221Z" fill="#f28b3c"/>
    <path d="M488 235Q506 273 548 277" fill="none" stroke="#d88b37" stroke-width="3"/>
    <path d="M539 250Q563 229 593 249L612 237L608 263L593 255Q565 277 539 250Z" fill="#72bec0" stroke-width="3"/>
    <circle cx="550" cy="249" r="3" fill="#263b42" stroke="none"/>
    <path d="M563 242L569 252L563 262" fill="none" stroke-width="2"/>

    <!-- Helmet, eye, and expression -->
    <circle cx="453" cy="194" r="10" fill="white" stroke-width="2"/>
    <circle cx="457" cy="195" r="4" fill="#263b42" stroke="none"/>
    <path d="M441 180L460 184" fill="none" stroke-width="4"/>
    <path d="M414 176Q416 142 445 143Q474 143 480 174Z" fill="#e75b43"/>
    <path d="M431 151L428 165M446 150L446 165M460 154L464 166" fill="none" stroke-width="5"/>
    <path d="M420 177L435 216L450 220" fill="none" stroke-width="3"/>

    <!-- Bent pedaling leg -->
    <path d="M362 332L343 380L390 420" fill="none" stroke="#263b42" stroke-width="15"/>
    <path d="M362 332L343 380L390 420" fill="none" stroke="#ed9b3d" stroke-width="9"/>
    <path d="M385 414L412 423L397 431L377 425Z" fill="#f4a13c"/>
  </g>

  <g transform="translate(391 454)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-25 0H25" stroke="#263b42" stroke-width="6" stroke-linecap="round"/>
      <path d="M-33-6H-17M17 6H33" stroke="#263b42" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="6" fill="#e75b43"/>
  </g>

  <!-- Dedicated, unobstructed footer -->
  <rect x="0" y="533" width="800" height="67" fill="#263b42"/>
  <text x="400" y="559" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#fff4d9">This pelican cycles to work. His lunch gets a free ride.</text>
  <text x="400" y="585" text-anchor="middle" font-family="monospace" font-size="16" fill="#bce1df">2026-10-29 22:44:21 SGT (UTC+08:00)</text>
</svg>