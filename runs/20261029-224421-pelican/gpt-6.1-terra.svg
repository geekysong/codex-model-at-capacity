  <path d="M40 425h720v48H40z" fill="#d7ab7b"/>
  <path d="M50 430h700" stroke="#fff2d3" stroke-width="4" stroke-dasharray="24 17"/>

  <g transform="translate(625 251)">
    <path d="M27 0v174" class="ink" fill="none"/>
    <rect x="-30" y="-20" width="114" height="78" rx="8" fill="#fff9ec" class="ink"/>
    <text x="27" y="8" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#253345">BIKE LANE</text>
    <text x="27" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#253345">NO FLYING</text>
    <path d="M5 43h45" stroke="#e66c51" stroke-width="3"/>
  </g>

  <g fill="none" class="ink">
