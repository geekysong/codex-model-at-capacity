<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican in the Bike Lane</title>
  <desc id="desc">A cheerful pelican rides a bicycle while its wheels spin and its body bobs.</desc>
  <defs>
    <style>
      .ink { stroke:#253345; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.4s linear infinite; }
      .rider { animation:bob .7s ease-in-out infinite alternate; }
      .pedal { transform-origin:394px 402px; animation:spin 1.4s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation-duration:5s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8eac9"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#fff8e9" stroke="#253345" stroke-width="4"/>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="31" fill="#253345" letter-spacing="1">PELICAN IN THE BIKE LANE</text>
  <path d="M52 86H748" stroke="#e7a24a" stroke-width="4" stroke-linecap="round"/>

  <rect x="40" y="105" width="720" height="368" rx="15" fill="#bce6e5"/>
  <circle cx="654" cy="160" r="37" fill="#ffd36d"/>
