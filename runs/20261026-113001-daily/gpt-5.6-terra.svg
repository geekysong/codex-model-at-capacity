<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Knight moves from square 6</title>
  <desc id="desc">A four by four numbered grid with squares 4, 12, 13, and 15 shaded as reachable by a knight from square 6.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="40" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Knight moves from square 6</text>

  <g stroke="#334155" stroke-width="2">
    <rect x="40" y="45" width="60" height="60" fill="#ffffff"/>
    <rect x="100" y="45" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="45" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="45" width="60" height="60" fill="#fbbf24"/>
    <rect x="40" y="105" width="60" height="60" fill="#ffffff"/>
    <rect x="100" y="105" width="60" height="60" fill="#bfdbfe"/>
    <rect x="160" y="105" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="105" width="60" height="60" fill="#ffffff"/>
    <rect x="40" y="165" width="60" height="60" fill="#ffffff"/>
    <rect x="100" y="165" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="165" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="165" width="60" height="60" fill="#fbbf24"/>
    <rect x="40" y="225" width="60" height="60" fill="#fbbf24"/>
    <rect x="100" y="225" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="225" width="60" height="60" fill="#fbbf24"/>
    <rect x="220" y="225" width="60" height="60" fill="#ffffff"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937">
    <text x="70" y="75">1</text><text x="130" y="75">2</text><text x="190" y="75">3</text><text x="250" y="75">4</text>
    <text x="70" y="135">5</text><text x="130" y="135">6</text><text x="190" y="135">7</text><text x="250" y="135">8</text>
    <text x="70" y="195">9</text><text x="130" y="195">10</text><text x="190" y="195">11</text><text x="250" y="195">12</text>
    <text x="70" y="255">13</text><text x="130" y="255">14</text><text x="190" y="255">15</text><text x="250" y="255">16</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="330" y="80" font-size="20" font-weight="bold">Legend</text>
    <rect x="330" y="100" width="20" height="20" fill="#bfdbfe" stroke="#334155" stroke-width="1"/>
    <text x="365" y="116" font-size="16">Starting square: 6</text>
    <rect x="330" y="140" width="20" height="20" fill="#fbbf24" stroke="#334155" stroke-width="1"/>
    <text x="365" y="156" font-size="16">Reachable in one move</text>
    <text x="330" y="205" font-size="18" font-weight="bold">Shaded squares: 4</text>
    <text x="330" y="235" font-size="18">4, 12, 13, 15</text>
  </g>

  <line x1="30" y1="335" x2="570" y2="335" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#475569">2026-10-26 11:34:31 SGT (UTC+08:00)</text>
</svg>