<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6673"/>
      <stop offset="1" stop-color="#303846"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#16202c" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#182536; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#182536; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .rider { transform-box:fill-box; transform-origin:center bottom; animation:bob .8s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
    </style>
  </defs>

