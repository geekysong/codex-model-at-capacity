    <text x="400" y="67" text-anchor="middle" class="label" font-size="34" font-weight="800">THE GREAT PELICAN GRAND PRIX</text>
    <text x="400" y="96" text-anchor="middle" class="label" font-size="18" font-weight="700" fill="#d34d3f">“Why pedal when you can simply wing it?”</text>
