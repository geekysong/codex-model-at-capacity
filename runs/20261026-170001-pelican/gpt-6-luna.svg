<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Two-Wheel Commute</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle, with spinning wheels and a bobbing rider.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.8s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

