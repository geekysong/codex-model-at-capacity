    <path d="M369 323 q-13 41-3 71" fill="none" stroke-width="11"/>
    <path d="M430 327 q37 23 39 65" fill="none" stroke-width="11"/>
    <path d="M362 392 h25 M463 393 h26" fill="none" stroke-width="12"/>
    <path d="M340 275 q-47 5-65 42" fill="none" stroke-width="12"/>
    <path d="M275 317 q-25 0-32 20" fill="none" stroke-width="10"/>
