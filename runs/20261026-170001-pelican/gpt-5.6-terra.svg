    <path d="M408 416 L455 306"/>
    <path d="M328 300 L305 286"/>
    <path d="M286 286 h38"/>
    <path d="M455 306 L478 265 L516 256"/>
    <path d="M516 256 q17-16 28 0"/>
  </g>
  <g class="pedal" stroke="#24313a" stroke-width="7" stroke-linecap="round" fill="none">
