  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="63" font-size="40" font-weight="900" fill="#24313a">THE PELICAN PEDAL PROTEST</text>
    <text x="400" y="98" font-size="20" font-weight="bold" fill="#38505c">“If cars get lanes, I get a beak lane!”</text>
    <text x="400" y="535" font-size="22" font-weight="bold" fill="#24313a">A pelican on a bicycle: parking enforcement’s worst feathered nightmare.</text>
  </g>

  <rect y="556" width="800" height="44" fill="#24313a"/>
  <text x="400" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffffff">2026-10-26 17:03:33 SGT (UTC+08:00)</text>
</svg>