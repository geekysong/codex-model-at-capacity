<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past the Parking Police</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle, with spinning wheels and a bobbing rider.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
      .bob { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
      @keyframes pedal { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 360 Q100 310 200 355 T400 345 T600 350 T800 320 V475 H0Z" fill="#79c95b"/>
  <path d="M0 429 Q170 397 320 430 T600 417 T800 435 V500 H0Z" fill="#58656b"/>
  <path d="M0 469 H800" stroke="#f8df4d" stroke-width="10" stroke-dasharray="45 28"/>

  <g fill="#fff" opacity=".9">
    <path d="M90 100 q28-31 56 0 q25-22 49 4 q-50 18-113 3Z"/>
    <path d="M615 90 q22-25 45 0 q22-18 43 6 q-44 14-91 3Z"/>
  </g>

  <g stroke="#2a363d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M650 359 v-121 q0-18 18-18 h37" fill="none"/>
    <rect x="659" y="177" width="108" height="53" rx="8" fill="#ffe75a"/>
    <path d="M675 193 h75 M675 210 h53" opacity=".65"/>
    <path d="M690 242 h54" fill="none"/>
    <text x="713" y="213" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" stroke="none" fill="#263238">NO BIKES!</text>
  </g>

  <g class="spin" stroke="#24313a" stroke-width="8" fill="none">
    <circle cx="258" cy="416" r="78"/>
    <path d="M258 338V494 M180 416H336 M203 361L313 471 M313 361L203 471" stroke-width="4" opacity=".7"/>
    <circle cx="258" cy="416" r="10" fill="#f5d84b"/>
  </g>
  <g class="spin" stroke="#24313a" stroke-width="8" fill="none">
    <circle cx="500" cy="416" r="78"/>
    <path d="M500 338V494 M422 416H578 M445 361L555 471 M555 361L445 471" stroke-width="4" opacity=".7"/>
    <circle cx="500" cy="416" r="10" fill="#f5d84b"/>
  </g>

  <g stroke="#24313a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M258 416 L328 300 L408 416 Z"/>
