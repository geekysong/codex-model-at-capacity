<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Fish Commute</title>
  <desc id="desc">A smug pelican bicycles along the waterfront with an enormous beak full of fish. The wheels spin, the pedals turn, and the pelican bobs in a looping animation.</desc>
