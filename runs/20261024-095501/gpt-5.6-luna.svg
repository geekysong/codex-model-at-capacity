<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15102d"/>
      <stop offset="1" stop-color="#32164a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e5ef"/>
      <stop offset=".45" stop-color="#6d7d91"/>
      <stop offset="1" stop-color="#263445"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b8f"/>
      <stop offset="1" stop-color="#ff174d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 455 Q180 420 360 452 T800 438 V600 H0Z" fill="#100d21"/>
  <circle cx="90" cy="92" r="32" fill="#ffdb67" opacity=".8"/>
  <circle cx="90" cy="92" r="45" fill="#ffdb67" opacity=".12" filter="url(#soft)"/>
  <g fill="#ffdb67" opacity=".7">
    <circle cx="185" cy="75" r="3"/><circle cx="690" cy="78" r="3"/><circle cx="735" cy="145" r="2"/>
    <circle cx="625" cy="54" r="2"/><circle cx="270" cy="105" r="2"/><circle cx="530" cy="125" r="3"/>
  </g>

  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#fff4d6" letter-spacing="1">
    CODEX NIGHTCLUB
  </text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff8fb4">
    WHERE YOUR REQUESTS GO TO WAIT
  </text>

  <!-- Club facade -->
  <rect x="430" y="125" width="330" height="350" rx="18" fill="#211a38" stroke="#8f4f9f" stroke-width="5"/>
  <path d="M420 160 Q595 105 770 160" fill="none" stroke="#ff4f8d" stroke-width="9" opacity=".8"/>
  <path d="M450 175 H740" stroke="#f9a7d0" stroke-width="3" opacity=".55"/>

  <!-- FULL sign -->
  <rect x="500" y="112" width="190" height="82" rx="13" fill="#4d122f" stroke="#ff568d" stroke-width="5"/>
  <rect x="512" y="124" width="166" height="58" rx="8" fill="url(#sign)" filter="url(#glow)"/>
  <text x="595" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="900" fill="#fff7dc">FULL</text>

  <!-- Door and exclusive model -->
  <rect x="535" y="232" width="120" height="220" rx="9" fill="#0b0e19" stroke="#8bd7e7" stroke-width="4"/>
  <path d="M548 245 H642" stroke="#8bd7e7" stroke-width="2"/>
  <text x="595" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#78f4ff">VIP MODEL ONLY</text>
  <g transform="translate(595 350)">
    <rect x="-30" y="-43" width="60" height="57" rx="13" fill="url(#metal)" stroke="#b9f6ff" stroke-width="3"/>
    <circle cx="-12" cy="-20" r="6" fill="#ff3d75"/>
    <circle cx="12" cy="-20" r="6" fill="#ff3d75"/>
    <path d="M-16 -1 Q0 10 16 -1" fill="none" stroke="#101827" stroke-width="4"/>
    <path d="M-20 -47 L-30 -65 M20 -47 L30 -65" stroke="#b9f6ff" stroke-width="4"/>
    <circle cx="-31" cy="-67" r="5" fill="#ffd35e"/><circle cx="31" cy="-67" r="5" fill="#ffd35e"/>
    <text x="0" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#a7f9ff">SELECTED</text>
  </g>

  <!-- Bouncer -->
  <g transform="translate(385 280)">
    <ellipse cx="0" cy="166" rx="66" ry="13" fill="#080914" opacity=".7"/>
    <rect x="-43" y="-19" width="86" height="104" rx="23" fill="url(#metal)" stroke="#182333" stroke-width="5"/>
    <rect x="-35" y="-4" width="70" height="48" rx="11" fill="#172132"/>
    <circle cx="-15" cy="20" r="8" fill="#ff405f"/>
    <circle cx="15" cy="20" r="8" fill="#ff405f"/>
    <path d="M-19 34 Q0 45 19 34" fill="none" stroke="#8ff3ff" stroke-width="4"/>
    <path d="M-44 3 L-71 27 M44 3 L72 19" stroke="#a8b9c9" stroke-width="14" stroke-linecap="round"/>
    <path d="M-71 27 L-83 44" stroke="#a8b9c9" stroke-width="10" stroke-linecap="round"/>
    <path d="M72 19 L91 4" stroke="#a8b9c9" stroke-width="10" stroke-linecap="round"/>
    <path d="M-28 84 L-42 157 M28 84 L44 157" stroke="#738397" stroke-width="17" stroke-linecap="round"/>
    <path d="M-58 158 H-27 M28 158 H59" stroke="#d5e3eb" stroke-width="12" stroke-linecap="round"/>
    <path d="M-5 -52 V-20" stroke="#a8b9c9" stroke-width="5"/>
    <circle cx="-5" cy="-58" r="8" fill="#ffe06b"/>
    <text x="0" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#101827">BOUNCER v1.0</text>
    <path d="M-112 -8 Q-145 -42 -165 -28" fill="none" stroke="#ffe7a3" stroke-width="3"/>
    <text x="-195" y="-49" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#ffe7a3">NOPE.</text>
  </g>

  <!-- Velvet rope -->
  <path d="M302 438 Q370 390 445 438" fill="none" stroke="#e02b67" stroke-width="8"/>
  <path d="M302 438 Q370 390 445 438" fill="none" stroke="#ff719e" stroke-width="3" stroke-dasharray="9 12"/>
  <g fill="#d8c2a3" stroke="#6d4b54" stroke-width="4">
    <circle cx="302" cy="438" r="11"/><circle cx="445" cy="438" r="11"/>
    <path d="M296 448 V492 H308 V448Z"/><path d="M439 448 V492 H451 V448Z"/>
  </g>

  <!-- Queue of tired developers -->
  <g stroke="#171522" stroke-width="4">
    <g transform="translate(90 388)">
      <ellipse cx="0" cy="94" rx="42" ry="10" fill="#090914" stroke="none"/>
      <circle cx="0" cy="0" r="28" fill="#c98768"/>
      <path d="M-27 -5 Q-17 -39 23 -27 Q34 -9 25 3 Q7 -9 -27 -5Z" fill="#402a39"/>
      <path d="M-10 1 L-5 4 M10 1 L15 4" stroke="#34202e" stroke-width="5"/>
      <path d="M-8 17 Q0 12 8 17" fill="none"/>
      <path d="M-27 31 Q0 17 27 31 L35 92 H-35Z" fill="#4774a8"/>
      <path d="M-17 49 H17 M-17 64 H13" stroke="#d9efff" stroke-width="3"/>
      <path d="M-22 92 L-29 117 M22 92 L29 117" stroke="#28263d" stroke-width="13"/>
      <path d="M-39 119 H-17 M17 119 H39" stroke="#d5e3eb" stroke-width="8"/>
      <text x="0" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff0c7" stroke="none">DEV #404</text>
    </g>

    <g transform="translate(185 407)">
      <ellipse cx="0" cy="75" rx="40" ry="9" fill="#090914" stroke="none"/>
      <circle cx="0" cy="0" r="25" fill="#8e5b49"/>
      <path d="M-26 -2 Q-18 -35 25 -22 L20 6 Q3 -5 -26 -2Z" fill="#1d263a"/>
      <path d="M-16 25 Q0 13 17 25 L30 77 H-30Z" fill="#6f3f82"/>
      <path d="M-18 43 H18" stroke="#f0b9ff" stroke-width="3"/>
      <path d="M-20 77 L-27 104 M20 77 L28 104" stroke="#28263d" stroke-width="12"/>
      <path d="M-38 106 H-16 M16 106 H38" stroke="#d5e3eb" stroke-width="8"/>
      <text x="0" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff0c7" stroke="none">DEV #503</text>
    </g>

    <g transform="translate(275 394)">
      <ellipse cx="0" cy="88" rx="42" ry="10" fill="#090914" stroke="none"/>
      <circle cx="0" cy="0" r="27" fill="#d49a72"/>
      <path d="M-28 -3 Q-17 -39 27 -23 L24 8 Q4 -10 -28 -3Z" fill="#8b523d"/>
      <path d="M-20 30 Q0 17 21 30 L32 88 H-32Z" fill="#2d8b82"/>
      <path d="M-17 49 L17 49 M-13 62 L10 62" stroke="#caffed" stroke-width="3"/>
      <path d="M-20 88 L-28 116 M20 88 L28 116" stroke="#28263d" stroke-width="13"/>
      <path d="M-39 118 H-17 M17 118 H39" stroke="#d5e3eb" stroke-width="8"/>
      <text x="0" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff0c7" stroke="none">DEV #999</text>
    </g>
  </g>

  <!-- speech bubble -->
  <path d="M78 230 Q78 165 220 165 Q310 165 310 226 Q310 282 225 286 L197 315 L190 284 Q78 284 78 230Z" fill="#fff6df" stroke="#321d3a" stroke-width="5"/>
  <text x="194" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#362039">“Selected model is</text>
  <text x="194" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#d52862">at capacity.”</text>
  <text x="194" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#362039">Please try a different life.</text>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(610 505)">
    <path d="M-100 0 Q-80 -35 -53 0 T0 0 T53 0 T100 0" fill="none" stroke="#ff704d" stroke-width="16" stroke-linecap="round"/>
    <path d="M-94 2 Q-72 -22 -52 2 T-10 2 T32 2 T75 2" fill="none" stroke="#ffd05a" stroke-width="5"/>
    <g fill="#9aa9b5" stroke="#20243b" stroke-width="4">
      <rect x="-86" y="-71" width="46" height="64" rx="8"/>
      <rect x="-23" y="-88" width="46" height="81" rx="8"/>
      <rect x="40" y="-66" width="46" height="59" rx="8"/>
    </g>
    <g fill="#ff4d67">
      <circle cx="-63" cy="-52" r="5"/><circle cx="-63" cy="-32" r="5"/>
      <circle cx="0" cy="-68" r="5"/><circle cx="0" cy="-48" r="5"/>
      <circle cx="63" cy="-48" r="5"/><circle cx="63" cy="-28" r="5"/>
    </g>
    <path d="M-75 -4 Q-72 18 -62 27 Q-51 37 -44 20 Q-35 4 -25 20 Q-15 37 -7 18 Q1 1 11 21 Q21 39 31 17 Q42 -2 51 18 Q61 35 70 15" fill="none" stroke="#ff9b45" stroke-width="8"/>
    <text x="0" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#ffd9a2">SERVER FITNESS CLUB</text>
  </g>

  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#ffe9b0">
    When the bouncer says “at capacity,” even the servers start sweating.
  </text>
</svg>