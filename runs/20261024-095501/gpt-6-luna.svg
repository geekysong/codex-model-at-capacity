<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17162b"/>
      <stop offset="1" stop-color="#35214b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241633"/>
      <stop offset="1" stop-color="#0c0b18"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="95" cy="95" r="70" fill="#322755" opacity=".45"/>
  <circle cx="720" cy="120" r="105" fill="#4c225d" opacity=".35"/>
  <path d="M0 430 Q180 390 365 430 T800 420 V600 H0Z" fill="url(#floor)"/>

  <text x="400" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#fff">
    CODEX NIGHTCLUB
  </text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ff8bdc">
    THE HOTTEST MODEL IN TOWN
  </text>

  <!-- Club facade -->
  <rect x="530" y="120" width="235" height="285" rx="18" fill="#10101d" stroke="#8b4e9f" stroke-width="5"/>
  <rect x="553" y="145" width="189" height="118" rx="12" fill="#16152b" stroke="#f447a6" stroke-width="4"/>
  <text x="647" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#ff75c8">MODEL</text>
  <text x="647" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="900" fill="#fff">FULL</text>
  <text x="647" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ff75c8">TRY AGAIN LATER</text>
  <circle cx="578" cy="305" r="9" fill="#41ff9a"/>
  <circle cx="607" cy="305" r="9" fill="#ffcf4a"/>
  <circle cx="636" cy="305" r="9" fill="#ff4d86"/>
  <circle cx="665" cy="305" r="9" fill="#4cc8ff"/>
  <circle cx="694" cy="305" r="9" fill="#b88cff"/>
  <rect x="575" y="337" width="145" height="13" rx="6" fill="#6c3d79"/>
  <rect x="575" y="365" width="98" height="13" rx="6" fill="#4c2b58"/>

  <!-- Bouncer -->
  <ellipse cx="465" cy="397" rx="67" ry="16" fill="#090812" opacity=".7"/>
  <rect x="431" y="237" width="68" height="142" rx="28" fill="#25263c" stroke="#080912" stroke-width="5"/>
  <path d="M430 267 Q465 238 500 267 L493 294 Q465 279 437 294Z" fill="#de3f8e"/>
  <rect x="449" y="319" width="33" height="56" rx="8" fill="#131521"/>
  <circle cx="465" cy="207" r="38" fill="#8b98a7" stroke="#080912" stroke-width="5"/>
  <path d="M435 195 Q465 168 495 195 L490 211 Q465 199 440 211Z" fill="#313849"/>
  <circle cx="452" cy="211" r="5" fill="#ff4d87"/>
  <circle cx="478" cy="211" r="5" fill="#ff4d87"/>
  <path d="M451 229 Q465 238 479 229" fill="none" stroke="#1c1b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M430 290 L386 334" stroke="#8b98a7" stroke-width="18" stroke-linecap="round"/>
  <path d="M500 290 L538 327" stroke="#8b98a7" stroke-width="18" stroke-linecap="round"/>
  <path d="M382 332 L343 316" stroke="#8b98a7" stroke-width="15" stroke-linecap="round"/>
  <path d="M538 327 L572 306" stroke="#8b98a7" stroke-width="15" stroke-linecap="round"/>
  <text x="465" y="411" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" fill="#fff">B O U N C E R</text>

  <!-- Velvet rope -->
  <path d="M78 364 Q250 420 424 369" fill="none" stroke="#e32669" stroke-width="8"/>
  <path d="M78 364 Q250 420 424 369" fill="none" stroke="#ff7eb4" stroke-width="3" opacity=".7"/>
  <circle cx="78" cy="364" r="11" fill="#e9c56b" stroke="#fff1ad" stroke-width="3"/>
  <circle cx="424" cy="369" r="11" fill="#e9c56b" stroke="#fff1ad" stroke-width="3"/>
  <rect x="66" y="365" width="24" height="80" fill="#b98e3c"/>
  <rect x="412" y="370" width="24" height="75" fill="#b98e3c"/>

  <!-- Queue of tired developers -->
  <g stroke="#11111d" stroke-width="4">
    <circle cx="102" cy="292" r="23" fill="#d89b78"/>
    <path d="M79 286 Q102 260 125 286 L121 274 Q101 250 82 274Z" fill="#31303b"/>
    <rect x="76" y="315" width="52" height="70" rx="15" fill="#4e8ac7"/>
    <path d="M88 340 L119 340" stroke="#b8e7ff" stroke-width="5"/>
    <path d="M91 354 L116 354" stroke="#b8e7ff" stroke-width="5"/>
    <path d="M128 340 L157 348" stroke="#d89b78" stroke-width="13" stroke-linecap="round"/>
    <text x="101" y="405" text-anchor="middle" font-size="13" font-family="Arial" font-weight="900" fill="#fff">DEV 1</text>

    <circle cx="194" cy="333" r="22" fill="#9b674f"/>
    <path d="M172 327 Q195 301 217 327 L214 310 Q194 292 175 310Z" fill="#d7c6b0"/>
    <rect x="169" y="356" width="51" height="72" rx="15" fill="#72b36d"/>
    <path d="M180 372 L208 372" stroke="#173b25" stroke-width="5"/>
    <path d="M181 388 L211 388" stroke="#173b25" stroke-width="5"/>
    <text x="194" y="448" text-anchor="middle" font-size="13" font-family="Arial" font-weight="900" fill="#fff">DEV 2</text>

    <circle cx="286" cy="302" r="23" fill="#e0ad91"/>
    <path d="M263 297 Q286 271 309 297 L305 278 Q285 257 267 278Z" fill="#262331"/>
    <rect x="260" y="325" width="52" height="75" rx="15" fill="#d65f76"/>
    <path d="M270 344 L301 344" stroke="#ffd2d8" stroke-width="5"/>
    <path d="M274 358 L296 358" stroke="#ffd2d8" stroke-width="5"/>
    <text x="286" y="421" text-anchor="middle" font-size="13" font-family="Arial" font-weight="900" fill="#fff">DEV 3</text>

    <circle cx="365" cy="350" r="21" fill="#c78868"/>
    <path d="M344 344 Q365 319 386 344 L383 328 Q365 309 347 328Z" fill="#4b2934"/>
    <rect x="342" y="373" width="48" height="63" rx="15" fill="#b48ad8"/>
    <text x="366" y="455" text-anchor="middle" font-size="13" font-family="Arial" font-weight="900" fill="#fff">DEV 4</text>
  </g>

  <!-- exhausted effects -->
  <text x="53" y="250" font-family="Arial" font-size="18" font-weight="900" fill="#ffcf4a" transform="rotate(-12 53 250)">zzz...</text>
  <text x="232" y="235" font-family="Arial" font-size="19" font-weight="900" fill="#7ce7ff" transform="rotate(10 232 235)">503?</text>
  <path d="M151 280 q12 -17 24 0 q12 -17 24 0" fill="none" stroke="#fff" stroke-width="3"/>

  <!-- melting server hamster wheels -->
  <g transform="translate(560 475)">
    <circle r="48" fill="none" stroke="#63d8e8" stroke-width="8" opacity=".8"/>
    <circle r="34" fill="none" stroke="#63d8e8" stroke-width="4"/>
    <path d="M-34 -10 L34 10 M-25 26 L25 -26" stroke="#63d8e8" stroke-width="4"/>
    <ellipse cx="0" cy="-5" rx="14" ry="10" fill="#c98b62"/>
    <circle cx="-5" cy="-8" r="2" fill="#111"/>
    <path d="M-9 2 Q0 10 9 2" fill="none" stroke="#111" stroke-width="2"/>
    <path d="M-41 42 Q-20 58 0 43 Q22 60 43 42" fill="none" stroke="#ff7a48" stroke-width="8" stroke-linecap="round"/>
    <path d="M-18 60 Q0 72 18 59" fill="none" stroke="#ffcf4a" stroke-width="5"/>
  </g>
  <text x="560" y="545" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#ff9b63">SERVER FARM: MELTING</text>

  <!-- one model inside -->
  <g transform="translate(645 390)">
    <rect x="-35" y="-25" width="70" height="48" rx="12" fill="#56e0a1" stroke="#10261f" stroke-width="4"/>
    <circle cx="-13" cy="-2" r="6" fill="#10261f"/>
    <circle cx="13" cy="-2" r="6" fill="#10261f"/>
    <path d="M-17 12 Q0 24 17 12" fill="none" stroke="#10261f" stroke-width="4"/>
    <text x="0" y="47" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900" fill="#56e0a1">ONE MODEL</text>
  </g>

  <!-- caption -->
  <rect x="34" y="548" width="732" height="38" rx="19" fill="#090812" stroke="#f447a6" stroke-width="2"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#fff">
    “Selected model is at capacity.” — The bouncer has one job, and it’s saying no.
  </text>
</svg>