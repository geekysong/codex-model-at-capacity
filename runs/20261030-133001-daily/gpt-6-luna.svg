<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City block route from A1 to E5</title>
  <desc id="desc">A five by five city grid. The blue shortest route from A1 to E5 avoids blocked intersections B2, C3, and D4. It uses eight street segments.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#17212b">City route map</text>

  <!-- Streets -->
  <g stroke="#aab4bf" stroke-width="3" stroke-linecap="round">
    <path d="M120 72H440 M120 132H440 M120 192H440 M120 252H440 M120 312H440"/>
    <path d="M120 72V312 M200 72V312 M280 72V312 M360 72V312 M440 72V312"/>
  </g>

  <!-- Shortest route: A1 → A2 → A3 → A4 → A5 → B5 → C5 → D5 → E5 (8 segments) -->
  <path d="M120 72V312H440" fill="none" stroke="#1674d1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#697786" stroke-width="2">
    <circle cx="120" cy="72" r="7"/><circle cx="200" cy="72" r="7"/><circle cx="280" cy="72" r="7"/><circle cx="360" cy="72" r="7"/><circle cx="440" cy="72" r="7"/>
    <circle cx="120" cy="132" r="7"/><circle cx="200" cy="132" r="7"/><circle cx="280" cy="132" r="7"/><circle cx="360" cy="132" r="7"/><circle cx="440" cy="132" r="7"/>
    <circle cx="120" cy="192" r="7"/><circle cx="200" cy="192" r="7"/><circle cx="280" cy="192" r="7"/><circle cx="360" cy="192" r="7"/><circle cx="440" cy="192" r="7"/>
    <circle cx="120" cy="252" r="7"/><circle cx="200" cy="252" r="7"/><circle cx="280" cy="252" r="7"/><circle cx="360" cy="252" r="7"/><circle cx="440" cy="252" r="7"/>
    <circle cx="120" cy="312" r="7"/><circle cx="200" cy="312" r="7"/><circle cx="280" cy="312" r="7"/><circle cx="360" cy="312" r="7"/><circle cx="440" cy="312" r="7"/>
  </g>

  <!-- Start and end -->
  <circle cx="120" cy="72" r="12" fill="#16864a" stroke="#fff" stroke-width="3"/>
  <text x="120" y="46" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#12683a">START</text>
  <circle cx="440" cy="312" r="12" fill="#c0392b" stroke="#fff" stroke-width="3"/>
  <text x="440" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#9f2d23">END</text>

  <!-- Blocked intersections: B2, C3, D4 -->
  <g stroke="#d32f2f" stroke-width="5" stroke-linecap="round">
    <path d="M191 123L209 141 M209 123L191 141"/>
    <path d="M271 183L289 201 M289 183L271 201"/>
    <path d="M351 243L369 261 M369 243L351 261"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="sans-serif" font-size="11" fill="#273746" text-anchor="middle">
    <text x="120" y="61">A1</text><text x="200" y="61">B1</text><text x="280" y="61">C1</text><text x="360" y="61">D1</text><text x="440" y="61">E1</text>
    <text x="120" y="126">A2</text><text x="200" y="126">B2</text><text x="280" y="126">C2</text><text x="360" y="126">D2</text><text x="440" y="126">E2</text>
    <text x="120" y="186">A3</text><text x="200" y="186">B3</text><text x="280" y="186">C3</text><text x="360" y="186">D3</text><text x="440" y="186">E3</text>
    <text x="120" y="246">A4</text><text x="200" y="246">B4</text><text x="280" y="246">C4</text><text x="360" y="246">D4</text><text x="440" y="246">E4</text>
    <text x="120" y="306">A5</text><text x="200" y="306">B5</text><text x="280" y="306">C5</text><text x="360" y="306">D5</text><text x="440" y="306">E5</text>
  </g>

  <text x="300" y="367" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1674d1">Route length: 8 street segments</text>
  <text x="300" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">2026-10-30 13:34:03 SGT (UTC+08:00)</text>
</svg>