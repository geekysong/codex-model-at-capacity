<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, its enormous beak carrying fish. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1">
      <rect width="1" height="1" fill="#fff"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke:#203641; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .spoke { stroke:#75949b; stroke-width:3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6dc"/>
  <path d="M0 355 Q140 310 275 351 T540 340 T800 350 V465 H0Z" fill="#d4e9d5"/>
  <circle cx="697" cy="132" r="38" fill="#ffd268"/>
  <path d="M56 153 Q79 128 101 153 Q122 132 144 153 M603 218 Q624 197 645 218 Q666 198 687 218" fill="none" stroke="#b5ccca" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="62" text-anchor="middle" fill="#203641" font-size="46" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="94" text-anchor="middle" fill="#557078" font-size="18" letter-spacing="2">THE COMMUTE HAS GONE COMPLETELY PELICAN.</text>

  <ellipse cx="404" cy="446" rx="276" ry="16" fill="#203641" opacity=".12"/>
  <path d="M74 445 H726" stroke="#203641" stroke-width="5" stroke-linecap="round"/>
  <path d="M93 460 H161 M616 460 H674" stroke="#9db1aa" stroke-width="3" stroke-linecap="round"/>

  <!-- Wheels rotate around their own hubs. -->
  <g transform="translate(247 369)">
    <circle r="70" fill="#fffdf0" class="ink" stroke-width="9"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-65 0 H65 M0-65 V65 M-46-46 L46 46 M-46 46 L46-46" class="spoke"/>
      <path d="M-21-59 A63 63 0 0 1 21-59" fill="none" stroke="#e8a83f" stroke-width="6"/>
    </g>
    <circle r="8" fill="#203641"/>
  </g>
  <g transform="translate(557 369)">
    <circle r="70" fill="#fffdf0" class="ink" stroke-width="9"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-65 0 H65 M0-65 V65 M-46-46 L46 46 M-46 46 L46-46" class="spoke"/>
      <path d="M-21-59 A63 63 0 0 1 21-59" fill="none" stroke="#e8a83f" stroke-width="6"/>
    </g>
    <circle r="8" fill="#203641"/>
  </g>

  <!-- Bicycle frame. -->
  <path d="M247 369 L324 266 L393 369 Z M324 266 H500 L393 369 M500 266 L557 369" fill="none" stroke="#203641" stroke-width="12" stroke-linejoin="round"/>
  <path d="M247 369 L324 266 L393 369 Z M324 266 H500 L393 369 M500 266 L557 369" fill="none" stroke="#ef6752" stroke-width="7" stroke-linejoin="round"/>
  <path d="M324 266 L313 243 M500 266 L485 224 L512 208 L527 212" fill="none" class="ink"/>
  <path d="M290 242 H337" stroke="#203641" stroke-width="12" stroke-linecap="round"/>
  <path d="M373 367 H256" stroke="#203641" stroke-width="4"/>
  <circle cx="393" cy="369" r="17" fill="#fff6dc" class="ink"/>

  <!-- The rider bobs as it pedals. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M300 233 L265 210 L277 247 L303 255" fill="#f4f1df" class="ink"/>
    <path d="M307 235 C276 199 285 151 329 145 C359 139 382 155 393 181 L421 219 C421 245 389 263 347 259 C326 258 311 249 307 235Z" fill="#fffdf2" class="ink"/>
    <path d="M312 183 C320 168 351 173 374 204 C364 224 342 235 324 228 C339 222 342 210 335 203" fill="#dbe2da" class="ink"/>
    <path d="M370 179 C373 152 365 131 384 117 C401 105 426 114 430 132 L437 169 L422 201" fill="#fffdf2" class="ink"/>
    <path d="M424 145 C486 141 572 149 648 178 L433 179Z" fill="#ffbd49" class="ink"/>
    <path d="M434 179 L645 180 C610 238 519 258 455 219Z" fill="#ffd978" class="ink"/>
    <path d="M449 186 Q532 218 622 186" fill="none" stroke="#e9a741" stroke-width="3"/>

    <!-- A very unimpressed passenger. -->
    <path d="M494 201 Q517 179 547 198 L561 185 L558 213 L545 204 Q519 223 494 201Z" fill="#73bcc1" stroke="#203641" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="505" cy="199" r="3" fill="#203641"/>
    <path d="M513 193 L521 195" stroke="#203641" stroke-width="2" stroke-linecap="round"/>

    <circle cx="409" cy="139" r="6" fill="#203641"/>
    <circle cx="411" cy="137" r="1.8" fill="white"/>
    <path d="M399 126 L415 123" stroke="#203641" stroke-width="4" stroke-linecap="round"/>
    <path d="M376 120 Q390 91 417 112 L430 120 L375 124Z" fill="#ef6752" class="ink"/>
    <path d="M393 106 L398 118 M406 109 L411 118" stroke="#fff6dc" stroke-width="3" stroke-linecap="round"/>
    <path d="M381 133 L371 145" stroke="#203641" stroke-width="3"/>
    <path d="M390 225 Q429 229 447 215 L489 222" fill="none" stroke="#203641" stroke-width="11" stroke-linecap="round"/>
    <path d="M390 225 Q429 229 447 215 L489 222" fill="none" stroke="#e4e8db" stroke-width="6" stroke-linecap="round"/>

    <!-- Articulated legs move toward alternating pedal positions. -->
    <path d="M339 249 L348 296 L371 349" fill="none" stroke="#d99231" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" values="M339 249 L348 296 L371 349;M339 249 L372 291 L415 389;M339 249 L348 296 L371 349" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M359 252 L397 295 L415 389" fill="none" stroke="#f3ae38" stroke-width="10" stroke-linecap="round">
      <animate attributeName="d" values="M359 252 L397 295 L415 389;M359 252 L350 306 L371 349;M359 252 L397 295 L415 389" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(393 369)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="42" to="402" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-29 0 H29" stroke="#203641" stroke-width="6" stroke-linecap="round"/>
      <path d="M-29-10 V10 M29-10 V10" stroke="#203641" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#ef6752"/>
  </g>

  <path d="M181 253 H228 M163 273 H215 M183 293 H221" stroke="#8caaa7" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(66 330)">
    <rect width="109" height="56" rx="9" fill="#fffdf2" stroke="#203641" stroke-width="3"/>
    <path d="M55 56 V104" stroke="#203641" stroke-width="5"/>
    <text x="54" y="23" text-anchor="middle" fill="#203641" font-size="14" font-weight="bold">BIKE LANE</text>
    <text x="54" y="43" text-anchor="middle" fill="#d2523c" font-size="13" font-weight="bold">BEAK LIMIT: 1</text>
  </g>

  <rect x="0" y="484" width="800" height="116" fill="#203641"/>
  <text x="400" y="521" text-anchor="middle" fill="#fff6dc" font-size="25" font-weight="bold">All beak. No brakes.</text>
  <text x="400" y="550" text-anchor="middle" fill="#b9d5d2" font-size="16">His carbon footprint is tiny. His fish bill is enormous.</text>
  <text x="400" y="581" text-anchor="middle" fill="#fff6dc" font-size="16">2026-10-25 20:31:30 SGT (UTC+08:00)</text>
</svg>