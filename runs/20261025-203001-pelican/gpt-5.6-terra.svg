    <path d="M645 154 l20 -35 16 38 26 -27 4 42z"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#263349">
    <text x="400" y="73" text-anchor="middle" font-size="43" font-weight="900">PELICAN PEDAL PANIC!</text>
    <text x="400" y="105" text-anchor="middle" font-size="18" font-weight="700">“I was promised a vehicle with more beak-room.”</text>
  </g>

