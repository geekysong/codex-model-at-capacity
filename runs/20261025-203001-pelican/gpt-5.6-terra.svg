<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle with spinning wheels and bobbing motion.</desc>
  <style>
    .wheel { animation: spin 1s linear infinite; transform-origin: center; }
    .rider { animation: bob .55s ease-in-out infinite alternate; }
    .leg { animation: pedal .55s linear infinite; transform-origin: 410px 378px; }
    .leg2 { animation: pedal 0.55s linear infinite reverse; transform-origin: 410px 378px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { 50% { transform: rotate(25deg); } }
  </style>

