<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a bicycle, its enormous pouch full of fish. The wheels spin and the rider bobs above a seaside road.</desc>
  <defs>
    <pattern id="road" width="140" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 10h65" stroke="#fff6dc" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="81" fill="#fff9e9" stroke="#243748" stroke-width="12"/>
      <circle r="69" fill="none" stroke="#b3cbd0" stroke-width="3"/>
      <g stroke="#718c98" stroke-width="2.5">
        <path d="M-69 0H69M0-69V69M-49-49L49 49M-49 49L49-49M-64-26L64 26M-26-64L26 64M-64 26L64-26M-26 64L26-64"/>
      </g>
      <path d="M46-51L55-42" stroke="#f8b538" stroke-width="8" stroke-linecap="round"/>
      <circle r="9" fill="#243748"/>
    </g>
    <g id="fish">
      <path d="M-19 0Q-2-19 19 0Q-2 19-19 0L-29 10V-10Z" fill="#7dc6bd" stroke="#243748" stroke-width="2.5"/>
      <circle cx="10" cy="-2" r="2.5" fill="#243748"/>
      <path d="M0-7L-4 3" fill="none" stroke="#358d91" stroke-width="2"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5df"/>
  <rect x="16" y="16" width="768" height="568" rx="22" fill="none" stroke="#243748" stroke-width="3"/>
  <text x="400" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#243748">TOUR DE BEAK</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#a64b31">ZERO EMISSIONS. QUESTIONABLE CARGO.</text>

  <rect x="34" y="117" width="732" height="371" rx="18" fill="#cce9e6"/>
  <circle cx="107" cy="180" r="36" fill="#ffd16b"/>
  <path d="M37 344Q150 324 272 345T511 340T765 345V425H34Z" fill="#88c9ca"/>
  <g fill="none" stroke="#e8faf0" stroke-width="4" stroke-linecap="round">
    <path d="M63 366h60m39 14h82m332-22h70m32 26h58"/>
    <path d="M84 277q12-15 24 0q12-15 24 0M141 244q9-12 18 0q9-12 18 0" stroke="#50858d" stroke-width="3"/>
  </g>
  <path d="M34 419Q400 401 766 419V470Q766 488 748 488H52Q34 488 34 470Z" fill="#e6bb85"/>
  <path d="M34 452H766V478H34Z" fill="url(#road)"/>
  <ellipse cx="392" cy="448" rx="256" ry="12" fill="#293e4b" opacity=".13"/>

  <g transform="translate(237 365)">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0 237 365" to="360 237 365" dur="1.6s" repeatCount="indefinite" additive="sum"/>
  </g>
  <!-- Each spoke assembly rotates about its own wheel hub. -->
  <g transform="translate(552 365)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- Rear wheel's locally centered rotating spokes overlay. -->
  <circle cx="237" cy="365" r="87" fill="#fff9e9"/>
  <g transform="translate(237 365)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M237 365L310 263L376 365H237L485 278L376 365M310 263L485 278M552 365L479 251" fill="none" stroke="#243748" stroke-width="13"/>
    <path d="M237 365L310 263L376 365H237M310 263L485 278L376 365M552 365L479 251" fill="none" stroke="#ea6450" stroke-width="7"/>
    <path d="M310 264L301 242M479 253L471 230L502 221" fill="none" stroke="#243748" stroke-width="8"/>
    <path d="M280 243H326M498 220L514 224" stroke="#243748" stroke-width="11"/>
    <path d="M236 349L378 351Q393 365 378 379L236 381" fill="none" stroke="#6a7f85" stroke-width="3"/>
    <circle cx="376" cy="365" r="22" fill="#ffdc79" stroke="#243748" stroke-width="5"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M338 273L345 309L376 337" fill="none" stroke="#243748" stroke-width="13" stroke-linecap="round"/>
    <path d="M338 273L345 309L376 337" fill="none" stroke="#edaa46" stroke-width="8" stroke-linecap="round"/>
    <path d="M273 220L238 198L253 235L229 226L254 253" fill="#fffdf2" stroke="#243748" stroke-width="4" stroke-linejoin="round"/>
    <path d="M264 216Q297 188 347 205Q372 218 389 185L407 161Q429 161 434 188L414 233Q400 281 352 285Q284 286 264 250Q253 232 264 216Z" fill="#fffdf2" stroke="#243748" stroke-width="4"/>
    <path d="M279 228Q309 213 350 232Q370 242 400 234Q379 263 339 263Q301 264 279 228Z" fill="#d8e5df" stroke="#243748" stroke-width="3"/>
    <path d="M370 223Q418 249 483 229" fill="none" stroke="#243748" stroke-width="17" stroke-linecap="round"/>
    <path d="M370 220Q418 246 483 226" fill="none" stroke="#fffdf2" stroke-width="11" stroke-linecap="round"/>

    <path d="M409 171Q391 150 408 134Q424 116 449 129Q467 140 459 164L451 181Z" fill="#fffdf2" stroke="#243748" stroke-width="4"/>
    <path d="M402 139Q411 112 442 119Q460 123 464 140Z" fill="#ee6452" stroke="#243748" stroke-width="4"/>
    <path d="M414 130L418 122M428 129L431 120M442 132L445 124" stroke="#243748" stroke-width="4" stroke-linecap="round"/>
    <path d="M415 148L452 153" stroke="#243748" stroke-width="5"/>
    <path d="M422 148L423 160Q435 169 443 153" fill="#243748"/>
    <path d="M448 165Q521 164 605 190Q539 201 453 186Z" fill="#ffc35e" stroke="#243748" stroke-width="4" stroke-linejoin="round"/>
    <path d="M452 185L599 191Q583 250 529 258Q470 261 452 185Z" fill="#f5ba77" stroke="#243748" stroke-width="4"/>
    <use href="#fish" transform="translate(492 212) rotate(20)"/>
    <use href="#fish" transform="translate(553 218) rotate(-16)"/>
    <use href="#fish" transform="translate(524 241) rotate(8)"/>
    <path d="M454 181Q527 195 599 191" fill="none" stroke="#243748" stroke-width="3"/>

    <path d="M356 276L391 311L377 347" fill="none" stroke="#243748" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M356 276L391 311L377 347;M356 276L364 322L377 379;M356 276L391 311L377 347" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M356 276L391 311L377 347" fill="none" stroke="#ffb94e" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" values="M356 276L391 311L377 347;M356 276L364 322L377 379;M356 276L391 311L377 347" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M370 345L397 350L367 355Z" fill="#ffb94e" stroke="#243748" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 32;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(376 365)">
    <g>
      <path d="M0-19V19" stroke="#243748" stroke-width="5"/>
      <path d="M-9-19H9M-9 19H9" stroke="#243748" stroke-width="6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <path d="M612 133H731Q743 133 743 146V192Q743 205 731 205H638L616 222L622 205H612Q600 205 600 192V146Q600 133 612 133Z" fill="#fffdf2" stroke="#243748" stroke-width="3"/>
  <text x="672" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243748">
    <tspan x="672">“It’s all</tspan>
    <tspan x="672" dy="23">leg work.”</tspan>
  </text>

  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#243748">He took up cycling to reduce his bill.</text>
  <path d="M75 540H725" stroke="#c9b997" stroke-width="1.5"/>
  <text x="400" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#354c59">2026-10-25 20:30:01 SGT (UTC+08:00)</text>
</svg>