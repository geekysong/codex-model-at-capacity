<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN POWER</title>
  <desc id="desc">A pelican rides a bicycle with fish in its enormous bill. The wheels spin and the pelican bobs as it pedals.</desc>
  <defs>
    <pattern id="sky" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="12" r="2" fill="#fff" opacity=".35"/>
      <circle cx="57" cy="49" r="3" fill="#fff" opacity=".25"/>
    </pattern>
    <g id="wheel">
      <circle r="92" fill="#fffaf0" stroke="#203b46" stroke-width="12"/>
      <circle r="78" fill="none" stroke="#e8b54c" stroke-width="3"/>
      <g stroke="#66818a" stroke-width="3">
        <path d="M-78 0H78M0-78V78M-55-55 55 55M55-55-55 55"/>
        <path d="M-72-30 72 30M-72 30 72-30M-30-72 30 72M30-72-30 72" opacity=".65"/>
      </g>
      <circle r="10" fill="#e86f51" stroke="#203b46" stroke-width="4"/>
    </g>
    <style>
      .ink { stroke:#203b46; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { animation: spin 1.8s linear infinite; transform-box:fill-box; transform-origin:center; }
      .rider { animation: bob .9s ease-in-out infinite alternate; }
      .crank { animation: spin 1.8s linear infinite; transform-origin:365px 411px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .wheel,.rider,.crank { animation-duration:6s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f9e8bb"/>
