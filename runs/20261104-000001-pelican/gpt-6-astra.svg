<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a bicycle with a fish riding in its enormous beak pouch. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#fff" stroke-width="2" opacity=".15"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #183342; }
    .ink { stroke: #183342; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="600" fill="#fff4d9"/>
  <path d="M0 345Q130 280 260 338T520 325T800 340V480H0Z" fill="#c9dfc0"/>
  <circle cx="691" cy="148" r="42" fill="#ffc964"/>
  <path d="M50 187H156M75 201H132M609 248H747" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <text x="400" y="61" text-anchor="middle" font-size="49" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-size="17" letter-spacing="2">ZERO EMISSIONS. EXTREME FISH BREATH.</text>

  <!-- A single coastal cycling scene -->
  <path d="M0 453H800V490H0Z" fill="#b4c6bf"/>
  <path d="M0 477H800" stroke="#fff4d9" stroke-width="4" stroke-dasharray="38 27"/>
  <ellipse cx="410" cy="452" rx="255" ry="13" fill="#183342" opacity=".12"/>

  <g class="ink" fill="none">
    <circle cx="246" cy="382" r="70" fill="#fff9e8" stroke-width="10"/>
    <circle cx="579" cy="382" r="70" fill="#fff9e8" stroke-width="10"/>
  </g>
  <g transform="translate(246 382)">
    <g stroke="#71888b" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-64 0H64M0-64V64M-45-45L45 45M-45 45L45-45M-59-24L59 24M-24-59L24 59M-59 24L59-24M-24 59L24-59"/>
      <path d="M-18-61L0-64" stroke="#f6a52d" stroke-width="7"/>
    </g>
  </g>
  <g transform="translate(579 382)">
    <g stroke="#71888b" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-64 0H64M0-64V64M-45-45L45 45M-45 45L45-45M-59-24L59 24M-24-59L24 59M-59 24L59-24M-24 59L24-59"/>
      <path d="M-18-61L0-64" stroke="#f6a52d" stroke-width="7"/>
    </g>
  </g>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M246 382L330 280L395 382ZM330 280H530L395 382M530 280L579 382" stroke="#183342" stroke-width="14"/>
    <path d="M246 382L330 280L395 382ZM330 280H530L395 382M530 280L579 382" stroke="#ed6554" stroke-width="8"/>
    <path d="M330 280L319 257M530 280L519 244L552 229" stroke="#183342" stroke-width="8"/>
    <path d="M552 229Q579 224 574 245" stroke="#183342" stroke-width="9"/>
    <path d="M246 382L395 396Q417 382 395 368Z" stroke="#183342" stroke-width="3"/>
    <path d="M296 258H341" stroke="#183342" stroke-width="12"/>
  </g>
  <circle cx="246" cy="382" r="7" fill="#183342"/>
  <circle cx="579" cy="382" r="7" fill="#183342"/>
  <circle cx="395" cy="382" r="17" fill="#fff4d9" class="ink"/>
  <g transform="translate(395 382)">
    <g class="ink">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-24 0H24" fill="none"/>
      <path d="M-32 0H-17M17 0H32" stroke-width="8"/>
    </g>
  </g>

  <!-- Pelican and passenger bob together; all lettering stays still -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M298 229L253 214L269 245L249 248L289 268" fill="#fffdf4" class="ink"/>
    <path d="M333 278L357 320L389 351" fill="none" stroke="#183342" stroke-width="15" stroke-linecap="round"/>
    <path d="M333 278L357 320L389 351" fill="none" stroke="#efad48" stroke-width="9" stroke-linecap="round"/>
    <path d="M380 345L417 353L400 364L378 360Z" fill="#f7b444" class="ink">
      <animateTransform attributeName="transform" type="translate" values="0 0;5 9;0 0" dur=".8s" repeatCount="indefinite"/>
    </path>
    <path d="M279 223Q279 176 328 167Q361 165 378 191L402 214Q423 202 424 170L423 149Q425 119 449 120Q475 121 475 151L465 194Q454 255 397 279Q342 298 302 269Q281 253 279 223Z" fill="#fffdf4" class="ink"/>
    <path d="M291 217Q315 191 350 210L389 253Q342 273 306 245" fill="#d8e6e4" class="ink"/>
    <path d="M316 222L343 239M330 216L358 236" fill="none" stroke="#90a9aa" stroke-width="4" stroke-linecap="round"/>
    <path d="M379 215Q421 245 480 231L550 232" fill="none" stroke="#183342" stroke-width="15" stroke-linecap="round"/>
    <path d="M379 215Q421 245 480 231L550 232" fill="none" stroke="#fffdf4" stroke-width="10" stroke-linecap="round"/>

    <!-- A very aerodynamic helmet -->
    <path d="M413 139Q420 101 454 105Q482 106 489 137Z" fill="#ed6554" class="ink"/>
    <path d="M432 115L429 129M450 113L450 128M468 118L472 130" stroke="#183342" stroke-width="5" stroke-linecap="round"/>
    <path d="M420 140L431 168L455 172" fill="none" stroke="#183342" stroke-width="3"/>
    <ellipse cx="456" cy="151" rx="12" ry="15" fill="white" stroke="#183342" stroke-width="3"/>
    <circle cx="461" cy="152" r="4" fill="#183342"/>
    <path d="M443 134L466 140" stroke="#183342" stroke-width="5" stroke-linecap="round"/>

    <!-- The bill doubles as a suspiciously comfortable passenger seat -->
    <path d="M474 164L658 174Q619 230 537 217Q496 210 474 164Z" fill="#f8c26c" class="ink"/>
    <path d="M474 155L670 171L477 176Z" fill="#ffda77" class="ink"/>
    <path d="M510 186Q559 214 612 194" fill="none" stroke="#d48c47" stroke-width="3"/>

    <!-- Smug fish peeking over the bill -->
    <path d="M551 158L534 141L535 169Z" fill="#54b7ae" class="ink"/>
    <path d="M544 155Q562 131 591 144Q605 151 607 163Q578 175 544 155Z" fill="#77cfc0" class="ink"/>
    <circle cx="592" cy="150" r="7" fill="white" stroke="#183342" stroke-width="2"/>
    <circle cx="594" cy="150" r="2.5" fill="#183342"/>
    <path d="M583 162Q592 166 598 160M563 148L568 156L560 160" fill="none" stroke="#183342" stroke-width="2.5"/>
  </g>

  <g>
    <path d="M90 119H267Q280 119 280 132V170Q280 183 267 183H202L185 205L184 183H90Q77 183 77 170V132Q77 119 90 119Z" fill="#fffdf4" stroke="#183342" stroke-width="3"/>
    <text x="179" y="145" text-anchor="middle" font-size="18" font-weight="700">“My trainer said</text>
    <text x="179" y="169" text-anchor="middle" font-size="18" font-weight="700">carry protein.”</text>
  </g>
  <path d="M173 313H143M174 331H125M167 349H143" stroke="#71888b" stroke-width="4" stroke-linecap="round"/>

  <!-- Dedicated footer keeps the caption and timestamp clear of the scene -->
  <rect y="495" width="800" height="105" fill="#183342"/>
  <text x="400" y="533" text-anchor="middle" font-size="23" font-weight="700" style="fill:#fff4d9">One pelican. Two wheels. A very nervous lunch.</text>
  <text x="400" y="575" text-anchor="middle" font-size="19" style="fill:#fff4d9">2026-11-04 00:00:01 SGT (UTC+08:00)</text>
</svg>