    <text x="683" y="239" font-size="17" font-weight="bold" fill="#26313d">BIKE LANE</text>
    <path d="M631 251H735" stroke="#b44b37" stroke-width="2"/>
    <text x="683" y="272" font-size="13" font-weight="bold" fill="#b44b37">NO WIDE LOADS*</text>
    <text x="683" y="290" font-size="10" fill="#26313d">*especially smug ones</text>
  </g>

