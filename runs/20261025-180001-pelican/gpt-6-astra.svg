  <g stroke="#26313d" stroke-width="3" stroke-linecap="round">
    <path d="M160 365H199M147 383H184M164 403H177" opacity=".6"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#26313d">
    <path d="M51 119H272Q287 119 287 134V167Q287 182 272 182H195L218 203L172 182H51Q36 182 36 167V134Q36 119 51 119Z" fill="#fffdf4" stroke="#26313d" stroke-width="3"/>
    <text x="161" y="145" text-anchor="middle" font-size="18" font-weight="bold">“My lunch has its own</text>
    <text x="161" y="168" text-anchor="middle" font-size="18" font-weight="bold">commuting allowance.”</text>
  </g>

  <rect x="0" y="504" width="800" height="96" fill="#26313d"/>
  <text x="400" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff3d4">He rides to work. His lunch rides first class.</text>
  <path d="M90 550H710" stroke="#6b777a" stroke-width="1"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff3d4">2026-10-25 18:00:01 SGT (UTC+08:00)</text>
