        <path d="M-54 0H54M0-54V54M-38-38L38 38M-38 38L38-38"/>
      </g>
      <path d="M43-36L49-29" stroke="#fdbb3e" stroke-width="7" stroke-linecap="round"/>
      <circle r="8" fill="#26313d"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fbf0d4"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M30 95H770" stroke="#26313d" stroke-width="3"/>
  <text x="400" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="900" letter-spacing="2" fill="#26313d">THE PELICAN EXPRESS</text>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="3" fill="#b44b37">BIG BILL. ZERO EMISSIONS.</text>

  <g fill="#fffdf4" opacity=".9">
    <path d="M43 203Q42 180 66 180Q77 152 102 169Q127 162 132 188Q155 186 158 203Z"/>
    <path d="M555 155Q556 133 578 136Q589 115 608 129Q633 123 640 148Q662 145 668 155Z"/>
  </g>
  <path d="M0 378Q110 330 224 366Q345 330 460 362Q601 318 800 365V477H0Z" fill="#d4debb"/>
  <path d="M0 411Q168 389 337 411Q571 384 800 406V485H0Z" fill="#bacb9e"/>
  <path d="M0 464H800V504H0Z" fill="#dfcfad"/>
  <path d="M35 473H765" stroke="#26313d" stroke-width="3"/>
  <ellipse cx="380" cy="470" rx="217" ry="10" fill="#26313d" opacity=".12"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
