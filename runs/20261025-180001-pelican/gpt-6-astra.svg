<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A smug pelican pedals a bicycle, carrying a fish in its enormous bill pouch while a sign promotes the new bike lane. Wheels spin and the rider bobs continuously.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#bcad8a" opacity=".2"/>
      <circle cx="12" cy="13" r=".6" fill="#bcad8a" opacity=".18"/>
    </pattern>
    <g id="wheel">
      <circle r="65" fill="#fff7df" stroke="#26313d" stroke-width="10"/>
      <circle r="55" fill="none" stroke="#bcc7c5" stroke-width="3"/>
