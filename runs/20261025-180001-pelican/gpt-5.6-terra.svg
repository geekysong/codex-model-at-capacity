<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past Potholes</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle while carrying an absurdly large fish bill.</desc>
  <style>
    .wheel { animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
    .rider { animation: bob .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
    .legA { animation: pedalA .55s linear infinite; transform-box: fill-box; transform-origin: 50% 0%; }
    .legB { animation: pedalB .55s linear infinite; transform-box: fill-box; transform-origin: 50% 0%; }
    .dust { animation: puff 1.1s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(32deg); } }
    @keyframes pedalB { 50% { transform: rotate(-32deg); } }
    @keyframes puff { 0% { opacity:0; transform:translateX(0) scale(.4); } 35% {opacity:.8;} 100% {opacity:0; transform:translateX(-42px) scale(1.5);} }
  </style>

  <rect width="800" height="600" fill="#bde8f5"/>
