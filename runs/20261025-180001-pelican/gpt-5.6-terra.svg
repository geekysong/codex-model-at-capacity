  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#17324d">PELICAN FOR MAYOR!</text>
  <text x="400" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#315b6e">“Finally, a candidate who can carry the whole catch.”</text>

