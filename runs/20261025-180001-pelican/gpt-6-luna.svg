<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A smug pelican pedals a bicycle while a fish rides in its beak. The wheels spin and the pelican bobs.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { fill: none; stroke: #263746; stroke-width: 9; }
      .spoke { stroke: #536675; stroke-width: 2; }
      .frame { fill: none; stroke: #e45b38; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .ink { stroke: #263746; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spin { transform-origin: center; animation: spin 2.8s linear infinite; }
      .ride { animation: bob 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f6e9c9"/>
  <path d="M0 0h800v18H0z" fill="#263746"/>
  <text id="title" x="400" y="65" text-anchor="middle" font-size="35" font-weight="900" letter-spacing="2" fill="#263746">THE PELICAN COMMUTE</text>
  <text x="400" y="94" text-anchor="middle" font-size="16" font-weight="700" fill="#a4472e">“Bike lanes are for the birds.”</text>

  <g opacity=".7" fill="#fff9eb">
    <path d="M110 160h90a18 18 0 0 0 0-36 26 26 0 0 0-49-7 22 22 0 0 0-41 16z"/>
    <path d="M626 154h71a15 15 0 0 0 0-30 22 22 0 0 0-42-6 19 19 0 0 0-35 13z"/>
  </g>
  <path d="M0 441h800" stroke="#a9b67a" stroke-width="5"/>
  <path d="M0 449h800v91H0z" fill="#d7cfaa"/>
  <path d="M40 486h75m70 0h75m70 0h75m70 0h75m70 0h75m70 0h75" stroke="#fff9eb" stroke-width="6" stroke-linecap="round"/>

  <!-- Bicycle -->
  <g>
    <circle class="wheel" cx="230" cy="390" r="69"/>
    <circle class="wheel" cx="570" cy="390" r="69"/>
    <g class="spin">
      <path class="spoke" d="M230 321v138M161 390h138M181 341l98 98m0-98-98 98"/>
    </g>
    <g class="spin">
      <path class="spoke" d="M570 321v138M501 390h138M521 341l98 98m0-98-98 98"/>
    </g>
    <path class="frame" d="M230 390l100-91 77 91H230l54-109m46 18h61"/>
    <circle cx="330" cy="299" r="8" fill="#263746"/>
    <circle cx="407" cy="390" r="8" fill="#263746"/>
    <path d="M269 277h48m-40-9v18" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
    <path d="M390 278h49m-6-10v20" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
    <path d="M407 390l31 19m-52-1 18-18" stroke="#263746" stroke-width="5" stroke-linecap="round"/>
    <circle cx="407" cy="390" r="10" fill="#e6a52e" stroke="#263746" stroke-width="4"/>
    <path d="M404 390l-24 26m30-25 22 25" stroke="#263746" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Animated rider -->
  <g class="ride">
    <!-- tail feathers -->
    <path d="M318 246q-50-15-58 16 31 19 64 5" fill="#fffdf4" class="ink"/>
    <path d="M279 257l-23 5m40-3-21 14" stroke="#d4c9aa" stroke-width="3"/>
    <!-- body -->
    <ellipse cx="365" cy="236" rx="66" ry="54" fill="#fffdf4" class="ink"/>
    <path d="M346 260q20 19 44 0" fill="none" stroke="#d4c9aa" stroke-width="4"/>
    <!-- neck -->
    <path d="M398 235q-10-48 7-76 14-22 42-17 24 5 19 29-5 19-27 23l-5 62" fill="#fffdf4" class="ink"/>
    <!-- head -->
    <ellipse cx="452" cy="146" rx="41" ry="34" fill="#fffdf4" class="ink"/>
    <path d="M422 158q34 3 67 17 38 17 57 6-19 29-58 17-35-10-70-9z" fill="#f0a12e" stroke="#263746" stroke-width="5" stroke-linejoin="round"/>
    <path d="M448 184q28 7 55 8-17 15-43 4z" fill="#e77742"/>
    <circle cx="466" cy="141" r="5" fill="#263746"/>
    <path d="M463 128q16-12 28 2" fill="none" stroke="#263746" stroke-width="4" stroke-linecap="round"/>
    <!-- fish in beak -->
    <path d="M523 171q23-19 46 0-23 20-46 0zm46 0 13-10v20z" fill="#68aab0" stroke="#263746" stroke-width="3"/>
    <circle cx="534" cy="168" r="2.5" fill="#263746"/>
    <path d="M531 177q12 7 22 0" fill="none" stroke="#fff9eb" stroke-width="2"/>
    <!-- wing -->
    <path d="M339 218q34-34 62-4-6 31-42 39-23-6-20-35z" fill="#e9e1cb" stroke="#263746" stroke-width="4"/>
    <path d="M351 221l25 23m-13-29 25 19" stroke="#c4b99e" stroke-width="3"/>
    <!-- legs pedaling -->
    <path d="M378 277q17 26 30 32l-20 27m20-27 28 25" fill="none" stroke="#e77742" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M381 337l-17 2m72-5 18 2" stroke="#263746" stroke-width="6" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M418 132q8-38 41-39 35 0 43 35l-77 7z" fill="#e45b38" stroke="#263746" stroke-width="5"/>
    <path d="M451 98l7 31m22-25 8 25" stroke="#f6b28f" stroke-width="3"/>
    <path d="M414 135h89" stroke="#263746" stroke-width="5" stroke-linecap="round"/>
    <!-- handlebars grip -->
    <path d="M439 278l21-47m-5-5 14 6" fill="none" stroke="#263746" stroke-width="6" stroke-linecap="round"/>
  </g>

  <path d="M119 311q-19-10-32 4 14 15 32 4" fill="#e45b38"/>
  <text x="400" y="523" text-anchor="middle" font-size="18" font-weight="800" fill="#263746">He’s late for the tide—and still insists on taking the scenic route.</text>
  <text x="400" y="575" text-anchor="middle" font-size="14" font-weight="700" letter-spacing=".5" fill="#536675">2026-10-25 18:02:38 SGT (UTC+08:00)</text>
</svg>