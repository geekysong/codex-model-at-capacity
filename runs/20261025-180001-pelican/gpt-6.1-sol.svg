<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="description">A smug pelican pedals a bicycle with a huge fish-filled beak pouch, passing a sign that says no fishing. The wheels spin and the rider bobs continuously.</desc>
  <defs>
    <pattern id="paper" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.7" fill="#dccfa9" opacity=".35"/>
      <circle cx="15" cy="16" r=".5" fill="#dccfa9" opacity=".3"/>
    </pattern>
    <g id="wheel">
      <circle r="91" fill="#fffaf0" stroke="#243b43" stroke-width="11"/>
      <circle r="80" fill="none" stroke="#97b4b6" stroke-width="3"/>
      <g stroke="#91a4a4" stroke-width="2.5">
        <path d="M0-79V79M-79 0H79M-56-56L56 56M-56 56L56-56M-30-73L30 73M-73-30L73 30M-73 30L73-30M-30 73L30-73"/>
      </g>
      <path d="M-58-60A83 83 0 0 1-25-79" fill="none" stroke="#f5b840" stroke-width="7" stroke-linecap="round"/>
      <circle r="11" fill="#f5b840" stroke="#243b43" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="2" fill="#243b43">TOUR DE FISH</text>
  <path d="M236 74H564" stroke="#ef7356" stroke-width="6" stroke-linecap="round"/>
  <text x="400" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#65797a">THE MOST SUSPICIOUS CARGO BIKE IN TOWN</text>

  <!-- One coastal roadside scene. -->
  <path d="M0 355Q130 329 259 356T516 351T800 345V475H0Z" fill="#c4e2da"/>
  <path d="M0 387Q119 365 214 388T419 383T625 385T800 374" fill="none" stroke="#93c6c0" stroke-width="3"/>
  <path d="M33 377H84M680 365H747M705 403H773" stroke="#fff7df" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 464Q350 447 800 465V521H0Z" fill="#dfc9a2"/>
  <path d="M0 480H800" stroke="#b39a78" stroke-width="3"/>
  <ellipse cx="400" cy="479" rx="267" ry="13" fill="#8d826c" opacity=".18"/>

  <g transform="translate(62 221)">
    <path d="M39 67V241" stroke="#685b49" stroke-width="9"/>
    <rect width="100" height="76" rx="8" fill="#fffaf0" stroke="#243b43" stroke-width="4"/>
    <text x="50" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="19" fill="#243b43">NO</text>
    <text x="50" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#243b43">FISHING</text>
    <path d="M10 66L90 10" stroke="#e56d52" stroke-width="5" opacity=".8"/>
  </g>

  <!-- Wheels rotate around fixed hubs. -->
  <g transform="translate(252 383)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(596 383)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 383L336 270L405 383ZM336 270H551L405 383M551 270L596 383" stroke="#243b43" stroke-width="13"/>
    <path d="M252 383L336 270L405 383ZM336 270H551L405 383M551 270L596 383" stroke="#e9654c" stroke-width="7"/>
    <path d="M336 270L324 244M551 270L537 225L562 205L582 207" stroke="#243b43" stroke-width="9"/>
    <path d="M303 244H346M569 207H588" stroke="#243b43" stroke-width="13"/>
    <path d="M251 383L401 397L415 370L259 373Z" stroke="#243b43" stroke-width="3"/>
  </g>
  <circle cx="405" cy="383" r="22" fill="#f5b840" stroke="#243b43" stroke-width="4"/>

  <!-- Pelican and feet bob subtly; typography stays still. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>

    <path d="M360 292Q378 327 405 345L423 372" fill="none" stroke="#b77c34" stroke-width="12" stroke-linecap="round"/>
    <path d="M422 365L443 378L412 381Z" fill="#edac3f" stroke="#243b43" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-7 9;0 0;7 -9;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <path d="M312 253L276 237L295 280L278 289L326 300" fill="#fffdf4" stroke="#243b43" stroke-width="4" stroke-linejoin="round"/>
    <path d="M325 234Q333 189 383 197Q423 205 442 253Q448 282 420 302Q371 326 326 294Q310 280 325 234Z" fill="#fffdf4" stroke="#243b43" stroke-width="4"/>
    <path d="M349 246Q386 224 415 269Q391 291 357 277" fill="#dde6dd" stroke="#243b43" stroke-width="3"/>
    <path d="M360 257L381 270M369 248L393 264" stroke="#a8bcb5" stroke-width="3" stroke-linecap="round"/>

    <path d="M409 235Q434 211 430 186Q421 153 445 140Q473 125 488 151Q498 170 483 188Q469 207 472 233" fill="#fffdf4" stroke="#243b43" stroke-width="4"/>
    <!-- Helmet and a very confident face. -->
    <path d="M427 151Q423 122 452 119Q477 116 487 143Z" fill="#ef7356" stroke="#243b43" stroke-width="4"/>
    <path d="M440 124L445 145M456 122L461 142M472 127L477 141" stroke="#fff2d4" stroke-width="5" stroke-linecap="round"/>
    <path d="M436 151L449 182L470 158" fill="none" stroke="#243b43" stroke-width="3"/>
    <circle cx="471" cy="156" r="8" fill="white" stroke="#243b43" stroke-width="2"/>
    <circle cx="474" cy="156" r="3" fill="#243b43"/>
    <path d="M462 143L479 146" stroke="#243b43" stroke-width="3" stroke-linecap="round"/>

    <!-- Enormous pelican pouch, with fish silhouettes. -->
    <path d="M482 171L653 182Q633 249 560 258Q502 257 482 190Z" fill="#f4be67" stroke="#243b43" stroke-width="4"/>
    <path d="M482 170Q567 157 669 180L653 189L483 187Z" fill="#f6a839" stroke="#243b43" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#73aeb0" stroke="#243b43" stroke-width="2.5">
      <path d="M527 218Q545 197 565 217L578 207V229L565 221Q545 242 527 218Z"/>
      <path d="M584 225Q599 207 617 219L628 207L630 229L617 224Q599 242 584 225Z"/>
    </g>
    <circle cx="535" cy="216" r="2.5" fill="#243b43"/>
    <circle cx="591" cy="222" r="2.5" fill="#243b43"/>
    <path d="M510 204Q515 235 539 244" fill="none" stroke="#ffe2a0" stroke-width="4" stroke-linecap="round"/>

    <path d="M421 249Q469 270 490 252L552 219" fill="none" stroke="#243b43" stroke-width="13" stroke-linecap="round"/>
    <path d="M421 249Q469 270 490 252L552 219" fill="none" stroke="#fffdf4" stroke-width="8" stroke-linecap="round"/>
    <path d="M359 301L355 331L390 376" fill="none" stroke="#e3a13c" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M359 301L355 331L390 376;M359 301L380 330L421 390;M359 301L355 331L390 376" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M389 369L414 383L378 387Z" fill="#f5b840" stroke="#243b43" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;31 14;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(405 383)">
    <g stroke="#243b43" stroke-width="5" stroke-linecap="round">
      <path d="M-23 0H23"/>
      <path d="M-30-5V5M30-5V5" stroke-width="9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle r="6" fill="#243b43"/>
  </g>

  <path d="M176 340H199M166 355H193M180 370H197" stroke="#65797a" stroke-width="4" stroke-linecap="round"/>
  <text x="672" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#243b43" transform="rotate(8 672 300)">“Just commuting!”</text>

  <rect x="0" y="521" width="800" height="79" fill="#243b43"/>
  <text x="400" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff7df">He traded his carbon footprint for a sardine-print.</text>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#e0ebe4">2026-10-25 18:01:28 SGT (UTC+08:00)</text>
</svg>