  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#667f81">THE COMMUTE HAS A CATCH.</text>

  <g stroke="#263844" stroke-width="3" stroke-linejoin="round">
