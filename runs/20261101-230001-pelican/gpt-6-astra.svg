<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle while carrying fish in its enormous bill pouch. The wheels spin and the pelican bobs in a looping animation.</desc>
  <defs>
    <pattern id="spokes" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#fff"/>
    </pattern>
    <g id="wheel">
      <circle r="79" fill="#fcf5dc" stroke="#263844" stroke-width="12"/>
      <circle r="69" fill="none" stroke="#a7b9bc" stroke-width="3"/>
