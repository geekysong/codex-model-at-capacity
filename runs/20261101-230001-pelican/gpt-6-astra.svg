        <path d="M-68 0H68M0-68V68M-48-48L48 48M-48 48L48-48"/>
      </g>
      <path d="M0-72A72 72 0 0 1 36-62" fill="none" stroke="#f8b83f" stroke-width="6"/>
      <circle r="9" fill="#263844"/>
    </g>
    <g id="fish">
