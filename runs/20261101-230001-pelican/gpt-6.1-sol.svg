<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Express</title>
  <desc id="description">A determined pelican pedals a bicycle with a huge fish-filled beak pouch. The wheels spin, the pedals turn, and the pelican bobs in a looping cartoon animation.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1"/>
    <g id="wheel">
      <circle r="76" fill="#fff9e8" stroke="#243747" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#a8b9ba" stroke-width="3"/>
      <g stroke="#82989e" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <circle r="9" fill="#edab3e" stroke="#243747" stroke-width="4"/>
    </g>
    <g id="fish">
      <path d="M-20 0Q0-19 23 0Q0 19-20 0L-33-12V12Z" fill="#75c8c6" stroke="#243747" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="13" cy="-2" r="2.5" fill="#243747"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5da"/>
  <circle cx="681" cy="167" r="49" fill="#ffd778"/>
  <path d="M0 371Q111 334 225 365T450 358T800 360V493H0Z" fill="#c6dfcf"/>
  <g fill="#fffdf5">
    <path d="M54 170Q45 146 70 141Q78 112 104 132Q131 129 132 152Q153 170 128 177H65Z"/>
    <path d="M551 128Q543 109 564 104Q577 83 594 102Q620 102 618 123Z"/>
  </g>

  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="2" fill="#243747">THE PELICAN EXPRESS</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#63716e">ONE BIRD. TWO WHEELS. ABSURD DELIVERY QUOTAS.</text>

  <g stroke="#243747" stroke-linecap="round" stroke-linejoin="round">
    <path d="M73 436H735" stroke-width="5"/>
    <path d="M92 458H162M627 458H701M390 467H469" stroke="#a6b9ab" stroke-width="4"/>
    <ellipse cx="403" cy="440" rx="236" ry="12" fill="#243747" opacity=".1" stroke="none"/>

    <g transform="translate(256 358)">
      <g>
        <use href="#wheel"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(564 358)">
      <g>
        <use href="#wheel"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      </g>
    </g>

    <path d="M256 358L335 265L405 358ZM335 265H508L405 358M508 265L564 358" fill="none" stroke="#e86349" stroke-width="12"/>
    <path d="M335 265L324 240M307 240H349" fill="none" stroke-width="9"/>
    <path d="M508 265L492 224L518 209L541 215" fill="none" stroke-width="8"/>
    <path d="M533 214L546 218" stroke="#e86349" stroke-width="10"/>

    <path d="M209 272H292V308H209Z" fill="#e9ad49" stroke-width="4"/>
    <path d="M220 272V256M281 272V256M215 256H286" fill="none" stroke-width="4"/>
    <text x="251" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243747" stroke="none">TIPS: 0</text>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".75s" repeatCount="indefinite"/>
      <!-- Far leg -->
      <path d="M365 261L389 297L379 344" fill="none" stroke="#c88c35" stroke-width="12"/>
      <path d="M368 345L396 345" stroke="#c88c35" stroke-width="13"/>

      <!-- Body and tail -->
      <path d="M323 221L281 202L297 243L280 250L322 260" fill="#fffdf3" stroke-width="4"/>
      <path d="M320 204Q345 179 380 200Q408 214 407 246Q403 275 365 279Q323 280 310 249Q299 227 320 204Z" fill="#fffdf3" stroke-width="4"/>
      <path d="M323 222Q346 207 378 233Q369 260 339 253Q322 247 323 222Z" fill="#dbe5df" stroke-width="3"/>
      <path d="M327 228L359 243M323 238L346 248" fill="none" stroke="#9aadaa" stroke-width="3"/>

      <!-- Neck and head -->
      <path d="M372 215Q397 201 395 178L392 150Q389 123 413 117Q441 111 452 135Q460 154 442 167L429 172Q433 208 404 235" fill="#fffdf3" stroke-width="4"/>
      <path d="M402 119L399 106M411 115L414 101M421 115L428 105" fill="none" stroke-width="4"/>

      <!-- Outsize delivery pouch -->
      <path d="M440 153L604 168Q593 230 528 239Q466 241 440 171Z" fill="#f3bb5e" stroke-width="4"/>
      <g transform="translate(501 203) rotate(-12)">
        <use href="#fish"/>
      </g>
      <g transform="translate(557 199) rotate(17)">
        <use href="#fish"/>
      </g>
      <path d="M441 146L615 161L604 173L440 165Z" fill="#f09a38" stroke-width="4"/>
      <path d="M602 173L610 178" fill="none" stroke-width="3"/>

      <!-- Expression -->
      <circle cx="430" cy="139" r="8" fill="white" stroke-width="2"/>
      <circle cx="433" cy="140" r="3.5" fill="#243747" stroke="none"/>
      <path d="M420 128L439 125" fill="none" stroke-width="4"/>
      <path d="M458 119Q465 108 468 121Q467 128 461 126Z" fill="#7ec9dc" stroke-width="2"/>

      <!-- Wing reaches the handlebar -->
      <path d="M382 225Q416 240 450 230L497 219" fill="none" stroke-width="18"/>
      <path d="M382 225Q416 240 450 230L497 219" fill="none" stroke="#fffdf3" stroke-width="11"/>

      <!-- Near leg gently pedals -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-4 371 264;7 371 264;-4 371 264" dur="1.5s" repeatCount="indefinite"/>
        <path d="M371 265L420 292L421 337" fill="none" stroke="#eeac3d" stroke-width="13"/>
        <path d="M414 338L442 338L433 329" fill="#eeac3d" stroke="#eeac3d" stroke-width="9"/>
      </g>
    </g>

    <circle cx="405" cy="358" r="19" fill="#fff5da" stroke-width="5"/>
    <g transform="translate(405 358)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
        <path d="M-22 17L22-17" stroke-width="6"/>
        <path d="M-32 17H-13M13-17H32" stroke-width="7"/>
      </g>
    </g>

    <path d="M170 329H140M175 344H127M177 359H148" fill="none" stroke="#779d98" stroke-width="4">
      <animate attributeName="opacity" values=".3;1;.3" dur=".75s" repeatCount="indefinite"/>
    </path>
  </g>

  <g font-family="Arial, sans-serif" fill="#243747">
    <path d="M77 185Q77 171 91 171H255Q269 171 269 185V217Q269 231 255 231H213L224 250L185 231H91Q77 231 77 217Z" fill="#ffffff" stroke="#243747" stroke-width="3"/>
    <text x="173" y="195" text-anchor="middle" font-size="16" font-weight="bold">“Paid in exposure.</text>
    <text x="173" y="217" text-anchor="middle" font-size="16" font-weight="bold">Mostly headwind.”</text>
  </g>

  <text x="400" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#243747">His beak holds more than his pension fund.</text>

  <rect x="0" y="529" width="800" height="71" fill="#243747"/>
  <text x="400" y="571" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fff5da">2026-11-01 23:01:19 SGT (UTC+08:00)</text>
</svg>