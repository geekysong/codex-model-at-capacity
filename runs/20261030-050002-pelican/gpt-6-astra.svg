<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a tiny bicycle with a fish in its enormous bill. The wheels spin, the pedals turn, and the bird bobs. A roadside sign says No fishing while cycling.</desc>
  <defs>
    <pattern id="spokes" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 20L20 0" stroke="#fff" stroke-opacity=".15"/>
    </pattern>
    <g id="wheel">
      <circle r="72" fill="#fff5dc" stroke="#263643" stroke-width="10"/>
      <circle r="62" fill="none" stroke="#91b5b0" stroke-width="3"/>
      <g stroke="#607c86" stroke-width="3">
        <path d="M-61 0H61M0-61V61M-43-43L43 43M-43 43L43-43"/>
      </g>
      <path d="M-20-59A62 62 0 0 1 20-59" fill="none" stroke="#f5b941" stroke-width="7"/>
      <circle r="8" fill="#263643"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4db"/>
  <path d="M0 117Q205 86 401 120T800 108V456H0Z" fill="#c9e9e3"/>
  <circle cx="674" cy="163" r="40" fill="#f8cb65"/>
  <g fill="#f5fcf6">
    <path d="M47 184Q40 161 65 161Q76 132 99 157Q126 151 134 184Z"/>
    <path d="M493 150Q485 134 504 129Q517 106 537 128Q561 125 567 150Z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#263643">
    <text x="400" y="59" font-size="47" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="91" font-size="17" letter-spacing="2">ONE BIRD. TWO WHEELS. ZERO SELF-AWARENESS.</text>
  </g>

  <path d="M0 419Q180 398 338 421T800 414V480H0Z" fill="#92b5a0"/>
  <path d="M0 448H800V485H0Z" fill="#e0cba6"/>
  <path d="M24 468H123M174 468H273M610 468H711" stroke="#fff4db" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="362" cy="455" rx="221" ry="13" fill="#263643" opacity=".13"/>

  <!-- Roadside bureaucracy -->
  <path d="M679 311V443" stroke="#637879" stroke-width="9"/>
  <rect x="602" y="239" width="156" height="86" rx="9" fill="#fff8e8" stroke="#263643" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#263643" font-weight="bold" font-size="18">
    <text x="680" y="264">NO FISHING</text>
    <text x="680" y="288">WHILE</text>
    <text x="680" y="312">CYCLING</text>
  </g>

  <!-- Wheels rotate independently around their axles. -->
  <g transform="translate(221 379)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(501 379)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- A conspicuously undersized racing bicycle. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M221 379L290 285L346 379ZM290 285H456L346 379M456 285L501 379" stroke="#263643" stroke-width="13"/>
    <path d="M221 379L290 285L346 379ZM290 285H456L346 379M456 285L501 379" stroke="#e9624e" stroke-width="8"/>
    <path d="M290 285L283 264M456 285L448 250L471 237L489 244" stroke="#263643" stroke-width="8"/>
    <path d="M264 263H304" stroke="#263643" stroke-width="12"/>
    <path d="M482 244H496" stroke="#e9624e" stroke-width="10"/>
  </g>
  <circle cx="346" cy="379" r="23" fill="#e6f0e8" stroke="#263643" stroke-width="5"/>

  <!-- Pelican and its ridiculous lunch commute. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" dur="1.6s" repeatCount="indefinite"/>
    <path d="M284 260Q272 294 310 318L346 354" fill="none" stroke="#d28c36" stroke-width="12" stroke-linecap="round"/>
    <path d="M233 225L184 205L204 247L180 248L230 271" fill="#fffdf0" stroke="#263643" stroke-width="4" stroke-linejoin="round"/>
    <path d="M222 211Q241 179 301 193Q339 197 348 164Q352 139 374 140Q402 144 396 173L384 233Q375 280 318 281Q246 289 222 255Z" fill="#fffdf0" stroke="#263643" stroke-width="4"/>
    <path d="M237 220Q269 199 319 226Q310 264 267 260Q250 251 237 220Z" fill="#d9e8df" stroke="#263643" stroke-width="4"/>
    <path d="M253 233Q274 246 299 239" fill="none" stroke="#98b3ad" stroke-width="4" stroke-linecap="round"/>
    <path d="M322 222Q369 252 449 247" fill="none" stroke="#263643" stroke-width="13" stroke-linecap="round"/>
    <path d="M322 219Q369 249 449 244" fill="none" stroke="#fffdf0" stroke-width="8" stroke-linecap="round"/>
    <path d="M290 267L324 302L330 355" fill="none" stroke="#e7a03d" stroke-width="13" stroke-linecap="round"/>
    <path d="M330 351L354 361L318 365Z" fill="#efa841" stroke="#263643" stroke-width="3"/>

    <!-- Pouch, fish, and beak -->
    <path d="M389 175L570 183Q519 242 421 210Q398 200 389 175Z" fill="#f3bd65" stroke="#263643" stroke-width="4"/>
    <path d="M447 196Q467 171 497 193L517 181L513 204L495 198Q469 215 447 196Z" fill="#71b7bd" stroke="#263643" stroke-width="3"/>
    <circle cx="460" cy="192" r="3" fill="#263643"/>
    <path d="M389 172Q471 161 573 180L575 185L391 186Z" fill="#f2a342" stroke="#263643" stroke-width="4" stroke-linejoin="round"/>
    <path d="M358 162Q374 153 387 160" fill="none" stroke="#263643" stroke-width="4"/>
    <path d="M357 163L369 177L385 162Z" fill="#263643"/>
    <path d="M361 164L368 168" stroke="#fff" stroke-width="2"/>
    <path d="M349 144Q349 116 379 115Q404 117 409 143Z" fill="#e9624e" stroke="#263643" stroke-width="4"/>
    <path d="M362 123L359 138M376 121L376 138M390 125L394 139" stroke="#fff4db" stroke-width="4"/>
    <path d="M346 144H413" stroke="#263643" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(346 379)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-22 0H22" stroke="#263643" stroke-width="6"/>
      <path d="M-25-7V7M25-7V7" stroke="#263643" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M77 302Q64 302 64 287V234Q64 220 79 220H168Q183 220 183 235V280Q183 295 168 295H136L147 316L116 302Z" fill="#fffdf0" stroke="#263643" stroke-width="3"/>
    <text x="123" y="248" text-anchor="middle" font-size="19" font-weight="bold" fill="#263643">“It’s called</text>
    <text x="123" y="275" text-anchor="middle" font-size="22" font-weight="bold" fill="#263643">CARP-ool.”</text>
  </g>

  <rect y="485" width="800" height="115" fill="#fff4db"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#263643">
    <text x="400" y="521" font-size="23" font-weight="bold">His bicycle is lightweight. His lunch is not.</text>
    <path d="M100 543H700" stroke="#c7b68e" stroke-width="2"/>
    <text x="400" y="575" font-size="19">2026-10-30 05:00:02 SGT (UTC+08:00)</text>
  </g>
</svg>