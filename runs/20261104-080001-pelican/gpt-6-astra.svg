<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Power</title>
  <desc id="desc">A smug pelican cycles along the waterfront with fish in its enormous bill pouch while its wheels spin and its body bobs.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke:#203642; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#203642; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <g id="wheel">
      <circle r="79" fill="#fff9e9" stroke="#203642" stroke-width="11"/>
      <circle r="68" fill="#dcefe9" stroke="#83a9a9" stroke-width="2"/>
      <g stroke="#547d85" stroke-width="3">
        <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
      </g>
      <circle r="11" fill="#f4bd47" class="ink"/>
      <path d="M48-48L56-56" stroke="#ff7653" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g id="fish">
      <path d="M-17 0Q0-20 22 0Q0 18-17 0L-31-11V11Z" fill="#8bc8bd" class="thin"/>
      <circle cx="12" cy="-2" r="2.5" fill="#203642"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <path d="M0 122Q180 82 370 120T800 113V430H0Z" fill="#d8eee8"/>
  <circle cx="697" cy="170" r="36" fill="#f6cb63"/>
  <g fill="none" stroke="#9cc7c5" stroke-width="3">
    <path d="M0 325H132M21 344H168M616 325H800M642 348H780"/>
    <path d="M48 192q13-15 26 0q13-15 26 0M600 220q10-12 20 0q10-12 20 0"/>
  </g>

  <text x="400" y="54" text-anchor="middle" font-size="38" font-weight="900" fill="#203642">PELICAN PEDAL POWER</text>
  <text x="400" y="88" text-anchor="middle" font-size="18" font-weight="bold" letter-spacing="2" fill="#416977">BIG BILL. ZERO FUEL BUDGET.</text>

  <path d="M0 438Q400 422 800 438V509H0Z" fill="#e2cda4"/>
  <path d="M0 480H800" stroke="#fff5dc" stroke-width="4" stroke-dasharray="38 25"/>
  <ellipse cx="400" cy="452" rx="261" ry="13" fill="#bba982" opacity=".45"/>

  <g transform="translate(244 371)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(570 371)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M244 371L317 267L395 371ZM317 267H514L395 371M514 267L570 371" stroke="#203642" stroke-width="14"/>
    <path d="M244 371L317 267L395 371ZM317 267H514L395 371M514 267L570 371" stroke="#ec6650" stroke-width="8"/>
    <path d="M317 267L307 246M514 267L500 232L532 218" stroke="#203642" stroke-width="8"/>
    <path d="M288 245H328M528 218H545" stroke="#203642" stroke-width="12"/>
    <path d="M244 371L395 371" stroke="#203642" stroke-width="3"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <!-- Far leg -->
    <path d="M347 257L373 309L381 354" fill="none" stroke="#b67d35" stroke-width="12" stroke-linecap="round"/>
    <path d="M267 218L224 194L237 234L215 230L264 264" fill="#faf9e9" class="ink"/>
    <path d="M267 192C296 174 358 183 382 211C403 239 374 278 327 280C283 281 248 257 249 230Z" fill="#fffdf0" class="ink"/>
    <path d="M280 215Q322 196 354 232Q324 267 280 239L303 236L283 229" fill="#c2d6d3" class="ink"/>

    <!-- Long neck, determined face -->
    <path d="M357 215C347 190 356 153 373 133C383 122 399 121 410 132C425 147 412 167 402 178L395 219Q383 242 366 232" fill="#fffdf0" class="ink"/>
    <path d="M404 153L561 174Q532 219 450 204Q415 195 401 173Z" fill="#f3bb55" class="ink"/>
    <path d="M411 154L572 170Q577 175 565 180L407 173Z" fill="#ffda77" class="ink"/>
    <path d="M429 184Q476 213 535 184" fill="none" stroke="#d39139" stroke-width="3"/>
    <g transform="translate(477 190) rotate(12) scale(.67)">
      <use href="#fish"/>
    </g>
    <path d="M512 191L520 185L526 196" fill="#8bc8bd" class="thin"/>
    <circle cx="400" cy="146" r="9" fill="white" class="thin"/>
    <circle cx="404" cy="146" r="4" fill="#203642"/>
    <path d="M387 131L407 135" fill="none" class="ink"/>

    <!-- Tiny helmet and ridiculous tie -->
    <path d="M366 129Q371 101 395 106Q417 108 421 133Z" fill="#ec6650" class="ink"/>
    <path d="M380 112L376 125M395 111L393 127" stroke="#943f36" stroke-width="4"/>
    <path d="M368 132Q371 161 390 166" fill="none" class="thin"/>
    <path d="M397 201L411 210L402 220L416 246L396 253L393 222L386 215Z" fill="#26868d" class="thin"/>

    <!-- Wing reaching the handlebar -->
    <path d="M354 221Q400 251 449 230L526 216Q537 214 538 222Q529 236 504 233L451 250Q393 272 354 240" fill="#fffdf0" class="ink"/>

    <!-- Animated near leg -->
    <g>
      <path d="M335 266L348 313L409 365" fill="none" stroke="#203642" stroke-width="16" stroke-linecap="round"/>
      <path d="M335 266L348 313L409 365" fill="none" stroke="#efae42" stroke-width="10" stroke-linecap="round"/>
      <path d="M405 356L429 366L437 377H401Z" fill="#efae42" class="ink"/>
      <animateTransform attributeName="transform" type="rotate" values="-5 335 266;7 335 266;-5 335 266" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <circle cx="395" cy="371" r="18" fill="#f4bd47" class="ink"/>
  <g transform="translate(395 371)">
    <g>
      <path d="M-24 0H24" stroke="#203642" stroke-width="6"/>
      <path d="M-33 0H-17M17 0H33" stroke="#203642" stroke-width="9" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <path d="M73 127H257Q270 127 270 140V176Q270 189 257 189H212L231 213L188 189H73Q60 189 60 176V140Q60 127 73 127Z" fill="#fffdf4" class="ink"/>
    <text x="165" y="153" text-anchor="middle" font-size="18" font-weight="bold" fill="#203642">“Company car?</text>
    <text x="165" y="177" text-anchor="middle" font-size="18" font-weight="bold" fill="#203642">I took the perch.”</text>
  </g>

  <g transform="translate(674 275)">
    <path d="M0 40V160" stroke="#536d69" stroke-width="8"/>
    <rect x="-61" y="-11" width="122" height="61" rx="6" fill="#fffdf0" class="ink"/>
    <text x="0" y="14" text-anchor="middle" font-size="16" font-weight="bold" fill="#203642">FISH MARKET</text>
    <path d="M-27 33H30L20 25M30 33L20 41" fill="none" class="ink"/>
  </g>

  <rect y="509" width="800" height="91" fill="#203642"/>
  <text x="400" y="540" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff5dc">He cycles to save money. The bill is still enormous.</text>
  <path d="M125 554H675" stroke="#5e7982" stroke-width="1"/>
  <text x="400" y="579" text-anchor="middle" font-size="17" fill="#fff5dc">2026-11-04 08:00:01 SGT (UTC+08:00)</text>
</svg>