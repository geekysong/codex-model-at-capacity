<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Power: The Beak Takes the Bike</title>
  <desc>A satirical cartoon pelican rides a bicycle while pretending to be a serious commuter.</desc>
  <defs>
    <style>
      .ink{stroke:#252525;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#252525}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#bfe9ff"/>
  <path d="M0 430 Q120 380 240 430 T480 430 T800 420 V600 H0Z" fill="#8bd17c"/>
  <path d="M0 470 Q160 445 320 470 T640 465 T800 470" fill="none" stroke="#5aaf63" stroke-width="8"/>
  <circle cx="690" cy="105" r="48" fill="#ffd45c" class="ink"/>
  <g fill="#fff" opacity=".9">
    <path d="M110 130 q28-25 56 0 q28-25 56 0 q-10 25-56 25t-56-25Z"/>
    <path d="M545 165 q24-22 48 0 q24-22 48 0 q-9 22-48 22t-48-22Z"/>
  </g>

  <text x="400" y="52" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN POWER</text>
  <text x="400" y="84" text-anchor="middle" class="label" font-size="18" font-weight="700">When the commute gets tough, grow a bigger beak.</text>

  <g id="bike" filter="url(#shadow)">
    <g class="ink" fill="none">
      <circle cx="245" cy="455" r="82" fill="#eaf7ff"/>
      <circle cx="590" cy="455" r="82" fill="#eaf7ff"/>
      <path d="M245 455 L350 340 L430 455 Z"/>
      <path d="M350 340 L470 340 L590 455"/>
      <path d="M350 340 L315 455"/>
      <path d="M470 340 L430 455"/>
      <path d="M470 340 L500 305"/>
      <path d="M488 305 h45"/>
      <path d="M350 340 h-45"/>
    </g>
    <g stroke="#6c9fb8" stroke-width="3" opacity=".8">
      <path d="M245 373v164M163 455h164M187 397l116 116M187 513l116-116"/>
      <path d="M590 373v164M508 455h164M532 397l116 116M532 513l116-116"/>
    </g>
    <g fill="#ff6b5c" class="ink">
      <circle cx="350" cy="455" r="17"/>
      <path d="M350 455 l-43 -28 l8 -12 l48 25Z"/>
      <path d="M350 455 l37 28 l-8 12 l-44-27Z"/>
    </g>
    <g fill="#252525">
      <circle cx="307" cy="427" r="9"/>
      <circle cx="387" cy="483" r="9"/>
    </g>
    <path d="M330 329 q20-18 42 0" fill="none" class="ink"/>
    <rect x="327" y="300" width="62" height="29" rx="8" fill="#ffcf4a" class="ink"/>
    <text x="358" y="321" text-anchor="middle" class="label" font-size="14" font-weight="900">HONK</text>
  </g>

  <g id="pelican" class="ink" transform="translate(0 0)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="405" cy="280" rx="82" ry="96" fill="#f7f7f2"/>
    <path d="M355 242 q-34 45-18 100 q24 55 77 34 q33-14 31-55 q-3-54-35-79Z" fill="#d7e4e7"/>
    <path d="M365 197 q30-45 88-27 q42 13 48 58 q4 30-22 52 q-35 29-80 4 q-42-23-34-87Z" fill="#fffdf5"/>
    <path d="M429 215 q49-31 139 8 q18 8 0 24 q-53 46-132 19Z" fill="#f09b50"/>
    <path d="M444 247 q57 13 110 0 q-37 39-101 17Z" fill="#f6b86d"/>
    <circle cx="464" cy="213" r="12" fill="#252525"/>
    <circle cx="468" cy="209" r="4" fill="#fff"/>
    <path d="M404 184 q-12-25 5-39 q20 18 7 43Z" fill="#e8eef0"/>
    <path d="M385 347 q-16 39-7 71" fill="none"/>
    <path d="M432 347 q16 40 8 73" fill="none"/>
    <path d="M389 414 q-22 13-43 4" fill="none"/>
    <path d="M439 420 q22 10 42-2" fill="none"/>
    <path d="M358 273 q-27 14-38 42 q26 17 51-8" fill="#d7e4e7"/>
    <path d="M340 301 q-10 24-6 44" fill="none"/>
    <path d="M474 332 q47 14 73 44 q-36 26-72-3" fill="#d7e4e7"/>
    <path d="M536 375 q15 18 27 23" fill="none"/>
    <text x="387" y="294" class="label" font-size="13" font-weight="900" transform="rotate(-8 387 294)">SERIOUSLY?</text>
  </g>

  <g class="ink">
    <path d="M604 247 q18-25 42-3 l-7 34 q-24 7-38-8Z" fill="#ffcf4a"/>
    <path d="M620 239 l13-27 l10 30" fill="#ffcf4a"/>
    <circle cx="625" cy="226" r="4" fill="#252525"/>
  </g>
  <text x="650" y="285" class="label" font-size="16" font-weight="700">LOCAL TRAFFIC REPORT:</text>
  <text x="650" y="307" class="label" font-size="16">“Beak congestion.”</text>

  <path d="M90 520 Q190 500 290 520" fill="none" stroke="#4b9b52" stroke-width="5"/>
  <text x="400" y="548" text-anchor="middle" class="label" font-size="19" font-weight="700">Caption: One bird. Two wheels. Zero interest in bird law.</text>
  <text x="400" y="581" text-anchor="middle" class="label" font-size="14">2026-10-28 20:30:01 SGT (UTC+08:00)</text>

  <style>
    #bike g:nth-of-type(1){transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</svg>