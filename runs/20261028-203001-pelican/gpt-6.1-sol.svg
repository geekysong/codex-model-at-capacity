    <text x="0" y="-24" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN PEDAL POWER!</text>
    <path d="M-30 -5 l30 22 30-22" fill="#fff4bd" class="ink"/>
  </g>

  <g id="bike" transform="translate(0 8)">
