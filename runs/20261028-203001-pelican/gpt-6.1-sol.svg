<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican pedals a bicycle while carrying an absurdly large fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f5"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f7885"/>
      <stop offset="1" stop-color="#3f4752"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17212b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#202733; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family: "Trebuchet MS", Arial, sans-serif; fill:#202733; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".9"/>
  <path d="M0 350 Q130 285 260 345 T520 335 T800 345 L800 445 L0 445Z" fill="#8bcf8a"/>
  <path d="M0 405 Q150 350 300 402 T600 392 T800 405 L800 470 L0 470Z" fill="#55a96a"/>
