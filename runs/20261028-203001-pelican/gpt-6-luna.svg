<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle while carrying an absurdly large fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b66"/>
      <stop offset="1" stop-color="#272b35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1d2330" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <text x="400" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#18202a" stroke="#ffffff" stroke-width="3" paint-order="stroke">
    THE PELICAN EXPRESS
  </text>
  <text x="400" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#253444">
    “Delivering fish faster than common sense.”
  </text>

  <g opacity=".75" fill="#ffffff">
    <path d="M92 142c22-26 45-25 66-4 21-18 52-10 58 13-33-8-76 4-124-9z"/>
    <path d="M586 132c19-22 40-21 58-3 19-15 43-8 50 12-27-7-63 3-108-9z"/>
  </g>

  <rect x="0" y="438" width="800" height="98" fill="url(#road)"/>
  <path d="M0 464h800" stroke="#f7d36a" stroke-width="6" stroke-dasharray="34 24" opacity=".9"/>
  <path d="M0 520h800" stroke="#151921" stroke-width="5"/>

  <g transform="translate(0,-8)" filter="url(#shadow)">
    <!-- bicycle frame -->
    <g stroke="#d84d3e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M260 430 L345 337 L430 430 L260 430 L390 430 L345 337"/>
      <path d="M345 337 L405 319"/>
      <path d="M405 319 L430 343"/>
      <path d="M390 430 L477 337"/>
      <path d="M477 337 L500 348"/>
    </g>

    <!-- wheels -->
    <g fill="#202630" stroke="#12161d" stroke-width="5">
      <circle cx="260" cy="430" r="66"/>
      <circle cx="477" cy="430" r="66"/>
    </g>
    <g fill="none" stroke="#9aa5b3" stroke-width="3">
      <circle cx="260" cy="430" r="56"/>
      <circle cx="477" cy="430" r="56"/>
    </g>

    <g stroke="#aeb9c6" stroke-width="2" opacity=".85">
      <g id="spokesLeft">
        <path d="M260 374V486M204 430H316M220 390L300 470M220 470L300 390"/>
      </g>
      <g id="spokesRight">
        <path d="M477 374V486M421 430H533M437 390L517 470M437 470L517 390"/>
      </g>
    </g>

    <g fill="#687484" stroke="#1c222b" stroke-width="3">
      <circle cx="260" cy="430" r="8"/>
      <circle cx="477" cy="430" r="8"/>
    </g>

    <!-- spinning wheel motion -->
    <animateTransform href="#spokesLeft" attributeName="transform" type="rotate" from="0 260 430" to="360 260 430" dur="1.1s" repeatCount="indefinite"/>
    <animateTransform href="#spokesRight" attributeName="transform" type="rotate" from="0 477 430" to="360 477 430" dur="1.1s" repeatCount="indefinite"/>

    <!-- pelican body bob -->
    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>

      <!-- tail feathers -->
      <path d="M287 279l-58-35 20 55-38 3 67 24z" fill="#f4f0df" stroke="#272d36" stroke-width="5"/>
      <!-- body -->
      <ellipse cx="340" cy="260" rx="80" ry="67" fill="#f5f1df" stroke="#272d36" stroke-width="5"/>
      <path d="M311 304c22 18 61 17 82-4" fill="none" stroke="#d2b895" stroke-width="8"/>
      <!-- wing -->
      <path d="M330 238c-42 7-51 40-32 64 29 11 63-6 72-34z" fill="#d7d0bd" stroke="#272d36" stroke-width="5"/>
      <path d="M321 248l27 33M310 262l32 31" stroke="#aaa28e" stroke-width="4"/>
      <!-- neck -->
      <path d="M365 223c-8-34 5-69 34-80l36 38-22 54z" fill="#f5f1df" stroke="#272d36" stroke-width="5"/>
      <!-- head -->
      <ellipse cx="414" cy="136" rx="45" ry="39" fill="#f5f1df" stroke="#272d36" stroke-width="5"/>
      <!-- crest -->
      <path d="M387 107l-11-28 26 17 11-28 13 30 25-13-6 31z" fill="#e7a83c" stroke="#272d36" stroke-width="5"/>
      <!-- beak -->
      <path d="M438 145c45 0 78 11 111 31-35 22-74 20-113 5z" fill="#f0a637" stroke="#272d36" stroke-width="5"/>
      <path d="M445 160c35 5 61 9 89 15" stroke="#c27926" stroke-width="4"/>
      <!-- eye and monocle -->
      <circle cx="421" cy="130" r="7" fill="#17202a"/>
      <circle cx="421" cy="130" r="14" fill="none" stroke="#4b5968" stroke-width="3"/>
      <path d="M435 131h13" stroke="#4b5968" stroke-width="3"/>
      <!-- feet -->
      <path d="M316 321l-3 34M371 321l4 34" stroke="#e59a2e" stroke-width="8" stroke-linecap="round"/>
      <path d="M303 355h25M362 355h25" stroke="#e59a2e" stroke-width="7" stroke-linecap="round"/>

      <!-- ridiculous fish cargo -->
      <g transform="translate(245 187) rotate(-12)">
        <path d="M0 30c27-28 86-30 121 0-35 30-94 28-121 0z" fill="#70c5d2" stroke="#27323b" stroke-width="4"/>
        <path d="M119 30l31-25-7 25 7 25z" fill="#4b9baa" stroke="#27323b" stroke-width="4"/>
        <circle cx="22" cy="24" r="4" fill="#17202a"/>
        <path d="M42 16c18 8 18 21 0 29" fill="none" stroke="#3e8d9b" stroke-width="3"/>
        <path d="M52 2l10-18 10 20M76 1l14-16 6 22" fill="#e5b344" stroke="#27323b" stroke-width="3"/>
        <text x="63" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#17333a">FRESH!</text>
      </g>
      <!-- handle grip -->
      <path d="M405 319h28" stroke="#202630" stroke-width="10" stroke-linecap="round"/>
      <!-- pedal crank and pedaling -->
      <g transform="translate(390 430)">
        <circle r="13" fill="#e59a2e" stroke="#202630" stroke-width="4"/>
        <g>
          <path d="M0 0l34-20M34-20h18" stroke="#202630" stroke-width="5" stroke-linecap="round"/>
          <path d="M0 0l-30 22M-30 22h-18" stroke="#202630" stroke-width="5" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(575 282)">
    <path d="M0 0q72-30 133 0" fill="none" stroke="#27313b" stroke-width="4"/>
    <text x="67" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#27313b">
      HONK IF YOU
    </text>
    <text x="67" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#27313b">
      LIKE FISH!
    </text>
  </g>

  <text x="400" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#18202a">
    2026-10-28 20:32:28 SGT (UTC+08:00)
  </text>
</svg>