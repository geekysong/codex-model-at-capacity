  <text x="400" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="900" fill="#243744" letter-spacing="1">THE PELICAN PEDAL EXPRESS</text>
  <text x="400" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#3b6873">Two wheels. One very suspicious lunch.</text>

