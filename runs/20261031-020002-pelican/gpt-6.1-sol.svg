<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a bicycle with a fish dangling ahead of its enormous bill. Its wheels spin and its body bobs continuously.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#c8eff4"/>
      <stop offset="1" stop-color="#fff3cf"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc95b"/>
      <stop offset="1" stop-color="#f38944"/>
    </linearGradient>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #173348; }
      .outline { stroke: #173348; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .speed { stroke: #67a9b0; stroke-width: 4; stroke-linecap: round; }
    </style>
    <g id="wheel">
      <circle r="76" fill="#f6ffff" fill-opacity=".65" stroke="#173348" stroke-width="10"/>
      <circle r="64" fill="none" stroke="#83a7ad" stroke-width="2"/>
      <g stroke="#62818e" stroke-width="3">
        <path d="M-69 0H69M0-69V69M-49-49 49 49M-49 49 49-49"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#ffcf55" stroke="#173348" stroke-width="4"/>
    </g>
  </defs>

  <path fill="url(#sky)" d="M0 0H800V600H0Z"/>
  <circle cx="705" cy="144" r="43" fill="#ffda70"/>
