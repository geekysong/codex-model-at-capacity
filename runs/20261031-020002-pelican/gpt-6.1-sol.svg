  </g>

  <text x="400" y="59" text-anchor="middle" font-size="44" font-weight="900" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="91" text-anchor="middle" font-size="18" font-weight="bold">ONE BIRD. TWO WHEELS. ZERO SELF-CONTROL.</text>

