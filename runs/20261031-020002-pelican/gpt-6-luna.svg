<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Peloton</title>
  <desc id="desc">A smug pelican pedals a bicycle, its enormous beak full of fish, as a tiny fish cheers from the road.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke: #183143; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#dff5f3"/>
  <circle cx="690" cy="110" r="52" fill="#ffd66b"/>
  <path d="M0 330 Q120 280 235 323 T475 318 T800 300 V510 H0Z" fill="#a9dca8"/>
  <path d="M0 390 Q145 340 285 378 T570 370 T800 355 V520 H0Z" fill="#79c58d"/>
  <path d="M0 477 Q200 455 400 474 T800 462 V600 H0Z" fill="#f8d99a"/>
  <path d="M0 501 Q180 480 360 499 T800 488" fill="none" stroke="#bd9455" stroke-width="4" stroke-dasharray="20 15"/>

  <text x="400" y="62" text-anchor="middle" font-size="38" font-weight="900" letter-spacing="1.5" fill="#183143">THE PELICAN PELOTON</text>
  <text x="400" y="94" text-anchor="middle" font-size="17" font-weight="700" fill="#42616b">One bird. Two wheels. Several questionable snacks.</text>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <g class="wheel">
      <circle cx="250" cy="420" r="62" stroke="#183143" stroke-width="7"/>
      <circle cx="250" cy="420" r="7" fill="#f06449"/>
      <path d="M250 358V482M188 420H312M206 376L294 464M294 376L206 464" stroke="#6d8990" stroke-width="2.5"/>
    </g>
    <g class="wheel">
      <circle cx="550" cy="420" r="62" stroke="#183143" stroke-width="7"/>
      <circle cx="550" cy="420" r="7" fill="#f06449"/>
      <path d="M550 358V482M488 420H612M506 376L594 464M594 376L506 464" stroke="#6d8990" stroke-width="2.5"/>
    </g>
    <path d="M250 420L345 420L390 340L250 420L330 345L345 420L550 420L390 340L435 345"/>
    <path d="M326 339H396M424 340L449 340"/>
    <path d="M245 408L234 396M550 420L564 430M345 420L331 432"/>
  </g>
  <circle cx="345" cy="420" r="12" fill="#f06449" class="ink"/>
  <path d="M345 420L320 397M345 420L370 443M311 393H329M363 447H379" fill="none" class="ink"/>

  <!-- Rider bobbing as one expressive character -->
  <g class="rider">
    <!-- tail -->
    <path d="M341 260 Q305 267 292 298 Q324 293 348 278Z" fill="#f7f5e8" class="ink"/>
    <!-- body -->
    <ellipse cx="394" cy="259" rx="67" ry="83" fill="#fffdf3" class="ink"/>
    <path d="M374 305 Q395 326 419 307" fill="none" stroke="#d7d4c8" stroke-width="4"/>
    <!-- wing -->
    <path d="M368 250 Q399 226 434 249 Q417 277 379 275Z" fill="#f0ede0" class="ink"/>
    <path d="M382 255L413 250M387 265L417 260" fill="none" stroke="#c9c7bd" stroke-width="3"/>
    <!-- long neck -->
    <path d="M421 232 Q442 192 432 150 Q428 124 451 112 Q472 103 487 124 Q473 146 461 161 Q465 203 447 250Z" fill="#fffdf3" class="ink"/>
    <!-- crest -->
    <path d="M439 113 Q424 95 433 87 Q449 92 453 108 Q458 91 475 89 Q477 105 463 119" fill="#fffdf3" class="ink"/>
    <!-- beak and absurd pouch -->
    <path d="M471 125 Q535 111 599 130 Q566 150 490 150Z" fill="#f5a13d" class="ink"/>
    <path d="M488 145 Q523 149 556 138 Q551 181 523 187 Q497 184 488 145Z" fill="#f06449" class="ink"/>
    <path d="M490 151 Q510 159 540 153" fill="none" stroke="#c94a3c" stroke-width="3"/>
    <!-- fish sticking out -->
    <path d="M531 157 Q548 143 564 156 Q550 170 531 157Z" fill="#68c5c6" stroke="#183143" stroke-width="3"/>
    <path d="M563 156L575 149L574 163Z" fill="#68c5c6" stroke="#183143" stroke-width="3"/>
    <circle cx="541" cy="155" r="2.5" fill="#183143"/>
    <!-- face -->
    <circle cx="462" cy="126" r="4.5" fill="#183143"/>
    <path d="M451 118 Q463 112 472 119" fill="none" stroke="#183143" stroke-width="3"/>
    <!-- legs pedaling -->
    <path d="M379 318 Q360 341 345 400M415 317 Q438 340 345 420" fill="none" stroke="#f5a13d" stroke-width="9" stroke-linecap="round"/>
    <path d="M379 318 Q360 341 345 400M415 317 Q438 340 345 420" fill="none" stroke="#183143" stroke-width="3" stroke-linecap="round"/>
    <!-- scarf -->
    <path d="M432 183 Q451 192 462 180 L468 195 Q448 207 427 196Z" fill="#e85b4a" class="ink"/>
    <path d="M435 195 Q421 219 432 231 Q444 222 448 204Z" fill="#e85b4a" class="ink"/>
  </g>

  <!-- Tiny outraged fish spectator -->
  <g transform="translate(633 389)">
    <path d="M0 15 Q24 -3 48 15 Q24 34 0 15Z" fill="#68c5c6" stroke="#183143" stroke-width="4"/>
    <path d="M47 15L62 5V25Z" fill="#68c5c6" stroke="#183143" stroke-width="4"/>
    <circle cx="12" cy="13" r="3" fill="#183143"/>
    <path d="M13 31L7 40M30 31L36 40" stroke="#f06449" stroke-width="4" stroke-linecap="round"/>
    <text x="25" y="-12" text-anchor="middle" font-size="14" font-weight="800" fill="#183143">THAT'S MY LUNCH!</text>
  </g>

  <path d="M126 359 Q152 347 171 358" fill="none" stroke="#183143" stroke-width="3" stroke-linecap="round"/>
  <text x="143" y="345" text-anchor="middle" font-size="17" fill="#183143">wheee!</text>

  <!-- Dedicated footer with comfortable separation from the scene -->
  <rect x="0" y="530" width="800" height="70" fill="#183143"/>
  <text x="400" y="558" text-anchor="middle" font-size="17" font-weight="700" fill="#fffdf3">“Why fly when you can arrive dramatically?”</text>
  <text x="400" y="585" text-anchor="middle" font-size="15" font-weight="600" fill="#ffd66b">2026-10-31 02:02:23 SGT (UTC+08:00)</text>
</svg>