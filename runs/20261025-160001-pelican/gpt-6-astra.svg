<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle, carrying fish in its enormous bill pouch. Both wheels spin as the pelican bobs and pedals.</desc>
  <defs>
    <pattern id="sky" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#e3e9dc"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect y="100" width="800" height="381" fill="#eef4e8"/>
  <rect y="100" width="800" height="381" fill="url(#sky)"/>
  <circle cx="681" cy="168" r="43" fill="#ffd976"/>
  <path d="M0 364 Q100 326 202 365 T420 359 T650 358 T800 350 V481 H0Z" fill="#cfdfb8"/>
  <path d="M0 424 Q200 407 400 424 T800 422 V481 H0Z" fill="#b8cd9e"/>

  <text x="400" y="57" text-anchor="middle" font-family="sans-serif" font-size="45" font-weight="900" letter-spacing="3" fill="#203c40">TOUR DE BEAK</text>
  <text x="400" y="85" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#647067">ZERO EMISSIONS. QUESTIONABLE CARGO.</text>

  <!-- Single coastal road scene -->
  <path d="M0 461 H800 V502 H0Z" fill="#d4c8ac"/>
  <path d="M28 483 H128 M196 483 H296 M364 483 H464 M532 483 H632 M700 483 H780" stroke="#fff7df" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="400" cy="463" rx="242" ry="11" fill="#29474a" opacity=".13"/>

  <!-- Bicycle wheels rotate about their own hubs -->
  <g transform="translate(235 390)">
    <circle r="70" fill="#f9f5df" stroke="#203c40" stroke-width="12"/>
    <circle r="60" fill="none" stroke="#e4a34e" stroke-width="3"/>
    <g stroke="#688083" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-59 0 H59 M0-59 V59 M-42-42 L42 42 M-42 42 L42-42"/>
      <path d="M0-59 L9-58" stroke="#ed7250" stroke-width="7"/>
    </g>
    <circle r="8" fill="#203c40"/>
  </g>
  <g transform="translate(555 390)">
    <circle r="70" fill="#f9f5df" stroke="#203c40" stroke-width="12"/>
    <circle r="60" fill="none" stroke="#e4a34e" stroke-width="3"/>
    <g stroke="#688083" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-59 0 H59 M0-59 V59 M-42-42 L42 42 M-42 42 L42-42"/>
      <path d="M0-59 L9-58" stroke="#ed7250" stroke-width="7"/>
    </g>
    <circle r="8" fill="#203c40"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 390 L317 291 L372 390 Z M317 291 L500 291 L372 390 M500 291 L555 390" stroke="#203c40" stroke-width="13"/>
    <path d="M235 390 L317 291 L372 390 Z M317 291 L500 291 L372 390 M500 291 L555 390" stroke="#ef7654" stroke-width="7"/>
    <path d="M317 291 L308 264 M500 291 L486 247 L514 234" stroke="#203c40" stroke-width="8"/>
    <path d="M283 264 H329 M507 234 H535" stroke="#203c40" stroke-width="12"/>
    <path d="M235 390 L372 390" stroke="#203c40" stroke-width="3"/>
  </g>

  <!-- Animated rider -->
  <g stroke="#203c40" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M307 269 L342 322 L357 361" fill="none" stroke="#d99836" stroke-width="12">
      <animate attributeName="d" values="M307 269 L342 322 L357 361;M307 269 L319 331 L387 415;M307 269 L342 322 L357 361" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- Tail, body, long neck -->
    <path d="M281 241 L220 216 L243 258 L216 251 L272 286" fill="#fffdf2"/>
    <path d="M264 203 Q283 177 340 193 Q371 202 383 231 Q408 212 405 165 Q401 130 422 119 Q446 109 459 132 Q472 153 454 182 Q443 198 448 233 Q444 278 388 290 Q318 302 276 272 Q248 251 264 203Z" fill="#fffdf2"/>
    <!-- Cycling jersey -->
    <path d="M266 206 Q301 190 343 202 L364 230 L386 282 Q331 302 286 278 Q258 257 266 206Z" fill="#35a9aa"/>
    <path d="M269 248 Q309 270 368 257 L377 276 Q323 293 282 270Z" fill="#f6d469" stroke="none"/>
    <rect x="283" y="220" width="48" height="33" rx="5" fill="#fff7df" stroke-width="2"/>
    <text x="307" y="244" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="900" fill="#203c40" stroke="none">01</text>
    <!-- Wing gripping handlebar -->
    <path d="M345 212 Q386 223 411 245 Q450 254 501 234 Q508 230 512 239 Q467 279 409 269 Q367 255 345 234" fill="#fffdf2"/>
    <path d="M369 235 Q397 258 421 258" fill="none" stroke="#a4b6b1" stroke-width="3"/>

    <!-- Huge bill pouch and visibly unimpressed fish -->
    <path d="M452 166 L660 172 Q619 259 535 229 Q481 215 452 166Z" fill="#f4c26c"/>
    <path d="M470 177 Q532 194 635 180" fill="none" stroke="#d49743" stroke-width="2"/>
    <g transform="translate(552 200) rotate(9)">
      <path d="M-29 0 Q-7-22 24-3 L41-17 L38 13 L23 6 Q-8 23-29 0Z" fill="#78afb2" stroke-width="3"/>
      <circle cx="-14" cy="-2" r="5" fill="#fffdf2" stroke-width="2"/>
      <circle cx="-13" cy="-1" r="2" fill="#203c40" stroke="none"/>
      <path d="M-21-8 L-9-6 M-23 7 H-15" fill="none" stroke-width="2"/>
    </g>
    <path d="M450 153 L675 166 Q687 173 663 177 L451 173Z" fill="#efaa3e"/>
    <!-- Face and helmet -->
    <circle cx="444" cy="143" r="10" fill="white"/>
    <circle cx="448" cy="144" r="4" fill="#203c40" stroke="none"/>
    <path d="M431 130 L450 133" fill="none"/>
    <path d="M400 128 Q399 94 428 94 Q457 94 464 123Z" fill="#ef7654"/>
    <path d="M416 102 L420 118 M431 100 L437 116 M447 105 L452 117" fill="none" stroke-width="5"/>
    <path d="M406 129 Q408 156 428 163" fill="none" stroke-width="3"/>
    <!-- Near leg flexes with the pedal cycle -->
    <path d="M331 277 L366 323 L387 415" fill="none" stroke="#eda63b" stroke-width="14">
      <animate attributeName="d" values="M331 277 L366 323 L387 415;M331 277 L398 316 L357 365;M331 277 L366 323 L387 415" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M375 410 L405 419 L369 423Z" fill="#eda63b" stroke-width="3">
      <animate attributeName="d" values="M375 410 L405 419 L369 423Z;M345 360 L375 369 L339 373Z;M375 410 L405 419 L369 423Z" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="372" cy="390" r="17" fill="#fff7df" stroke="#203c40" stroke-width="4"/>
  <g transform="translate(372 390)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-30" to="330" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0-30 V30" stroke="#203c40" stroke-width="5"/>
      <path d="M-10-30 H10 M-10 30 H10" stroke="#203c40" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Fixed speech and motion accents keep lettering readable -->
  <path d="M82 136 Q82 121 99 121 H266 Q282 121 282 137 V181 Q282 196 265 196 H207 L228 218 L180 196 H99 Q82 196 82 180Z" fill="#fffdf2" stroke="#203c40" stroke-width="3"/>
  <text x="182" y="151" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#203c40">
    <tspan x="182">“It's all</tspan>
    <tspan x="182" dy="26">carry-on.”</tspan>
  </text>
  <path d="M124 300 H178 M141 316 H188 M104 331 H167" fill="none" stroke="#829b92" stroke-width="4" stroke-linecap="round"/>
  <path d="M476 111 L484 102 M484 128 L497 124" stroke="#67a9b4" stroke-width="4" stroke-linecap="round"/>

  <!-- Reserved footer: no scene elements or animation enter this area -->
  <rect y="502" width="800" height="98" fill="#fff7df"/>
  <path d="M45 505 H755" stroke="#203c40" stroke-width="2"/>
  <text x="400" y="539" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#203c40">He bought a bicycle to cut his carbon footprint.</text>
  <text x="400" y="565" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#53665f">The fish are still demanding a refund.</text>
  <text x="400" y="589" text-anchor="middle" font-family="monospace" font-size="14" fill="#203c40">2026-10-25 16:00:01 SGT (UTC+08:00)</text>
</svg>