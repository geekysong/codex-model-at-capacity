<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down city grid with a shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4">
  <rect width="600" height="400" fill="#f7f5ef"/>
  <text x="300" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#263746">CITY BLOCK ROUTE</text>
  <text x="300" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#607080">5 × 5 intersection grid · blocked intersections shown in red</text>

  <!-- Street grid -->
  <g stroke="#c9c6bc" stroke-width="10" stroke-linecap="round">
    <path d="M100 90H500 M100 140H500 M100 190H500 M100 240H500 M100 290H500"/>
    <path d="M100 90V290 M200 90V290 M300 90V290 M400 90V290 M500 90V290"/>
  </g>
  <g stroke="#fffdf8" stroke-width="2" stroke-linecap="round">
    <path d="M100 90H500 M100 140H500 M100 190H500 M100 240H500 M100 290H500"/>
    <path d="M100 90V290 M200 90V290 M300 90V290 M400 90V290 M500 90V290"/>
  </g>

  <!-- Column headers and row labels -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#52616c" text-anchor="middle">
    <text x="100" y="73">A</text><text x="200" y="73">B</text><text x="300" y="73">C</text><text x="400" y="73">D</text><text x="500" y="73">E</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#52616c" text-anchor="middle">
    <text x="68" y="94">1</text><text x="68" y="144">2</text><text x="68" y="194">3</text><text x="68" y="244">4</text><text x="68" y="294">5</text>
  </g>

  <!-- Shortest valid route: 8 street segments -->
  <path d="M100 90 H200 V90 H300 V90 H400 V90 H500 V140 H500 V190 H500 V240 H500 V290"
        fill="none" stroke="#1976d2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections and labels -->
  <g fill="#344955" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">
    <g><circle cx="100" cy="90" r="3.5"/><text x="100" y="110">A1</text></g>
    <g><circle cx="200" cy="90" r="3.5"/><text x="200" y="110">B1</text></g>
    <g><circle cx="300" cy="90" r="3.5"/><text x="300" y="110">C1</text></g>
    <g><circle cx="400" cy="90" r="3.5"/><text x="400" y="110">D1</text></g>
    <g><circle cx="500" cy="90" r="3.5"/><text x="500" y="110">E1</text></g>

    <g><circle cx="100" cy="140" r="3.5"/><text x="100" y="160">A2</text></g>
    <g><circle cx="300" cy="140" r="3.5"/><text x="300" y="160">C2</text></g>
    <g><circle cx="400" cy="140" r="3.5"/><text x="400" y="160">D2</text></g>
    <g><circle cx="500" cy="140" r="3.5"/><text x="500" y="160">E2</text></g>

    <g><circle cx="100" cy="190" r="3.5"/><text x="100" y="210">A3</text></g>
    <g><circle cx="200" cy="190" r="3.5"/><text x="200" y="210">B3</text></g>
    <g><circle cx="400" cy="190" r="3.5"/><text x="400" y="210">D3</text></g>
    <g><circle cx="500" cy="190" r="3.5"/><text x="500" y="210">E3</text></g>

    <g><circle cx="100" cy="240" r="3.5"/><text x="100" y="260">A4</text></g>
    <g><circle cx="200" cy="240" r="3.5"/><text x="200" y="260">B4</text></g>
    <g><circle cx="300" cy="240" r="3.5"/><text x="300" y="260">C4</text></g>
    <g><circle cx="500" cy="240" r="3.5"/><text x="500" y="260">E4</text></g>

    <g><circle cx="100" cy="290" r="3.5"/><text x="100" y="310">A5</text></g>
    <g><circle cx="200" cy="290" r="3.5"/><text x="200" y="310">B5</text></g>
    <g><circle cx="300" cy="290" r="3.5"/><text x="300" y="310">C5</text></g>
    <g><circle cx="400" cy="290" r="3.5"/><text x="400" y="310">D5</text></g>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#d63838" stroke-width="4" stroke-linecap="round">
    <path d="M192 132L208 148 M208 132L192 148"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M392 232L408 248 M408 232L392 248"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#c52d2d">
    <text x="214" y="137">B2</text>
    <text x="314" y="187">C3</text>
    <text x="414" y="237">D4</text>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="90" r="9" fill="#159447" stroke="#fff" stroke-width="2"/>
  <text x="82" y="87" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#11773a">START</text>
  <circle cx="500" cy="290" r="9" fill="#e28b1a" stroke="#fff" stroke-width="2"/>
  <text x="518" y="294" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9a5707">END</text>

  <!-- Route summary and required timestamp footer -->
  <rect x="36" y="329" width="528" height="53" rx="8" fill="#ffffff" stroke="#d9d6cc"/>
  <line x1="36" y1="356" x2="564" y2="356" stroke="#ece9e1"/>
  <text x="52" y="348" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#185da5">Shortest route: 8 street segments</text>
  <text x="52" y="374" font-family="Arial, sans-serif" font-size="12" fill="#52616c">2026-10-30 18:05:00 SGT (UTC+08:00)</text>
</svg>