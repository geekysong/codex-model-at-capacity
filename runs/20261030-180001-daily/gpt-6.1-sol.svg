<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest city street route from A1 to E5</title>
  <desc id="desc">A five-column, five-row intersection map. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- Streets -->
  <g fill="none" stroke="#b5bfcc" stroke-width="5" stroke-linecap="round">
    <path d="M100 60H500 M100 122H500 M100 184H500 M100 246H500 M100 308H500"/>
    <path d="M100 60V308 M200 60V308 M300 60V308 M400 60V308 M500 60V308"/>
  </g>

  <!-- Shortest route: 4 eastward and 4 southward segments -->
  <path d="M100 60H500V308" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#64748b" stroke-width="2">
    <circle cx="200" cy="60" r="5"/><circle cx="300" cy="60" r="5"/>
    <circle cx="400" cy="60" r="5"/><circle cx="500" cy="60" r="5"/>
    <circle cx="100" cy="122" r="5"/><circle cx="300" cy="122" r="5"/>
    <circle cx="400" cy="122" r="5"/><circle cx="500" cy="122" r="5"/>
    <circle cx="100" cy="184" r="5"/><circle cx="200" cy="184" r="5"/>
    <circle cx="400" cy="184" r="5"/><circle cx="500" cy="184" r="5"/>
    <circle cx="100" cy="246" r="5"/><circle cx="200" cy="246" r="5"/>
    <circle cx="300" cy="246" r="5"/><circle cx="500" cy="246" r="5"/>
    <circle cx="100" cy="308" r="5"/><circle cx="200" cy="308" r="5"/>
    <circle cx="300" cy="308" r="5"/><circle cx="400" cy="308" r="5"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 114L208 130 M208 114L192 130"/>
    <path d="M292 176L308 192 M308 176L292 192"/>
    <path d="M392 238L408 254 M408 238L392 254"/>
  </g>

  <!-- Start and end -->
  <circle cx="100" cy="60" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="308" r="8" fill="#2563eb" stroke="#fff" stroke-width="2"/>

  <!-- Intersection labels -->
  <g fill="#172033" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <text x="100" y="39" font-weight="700">A1 · START</text>
    <text x="200" y="42">B1</text>
    <text x="300" y="42">C1</text>
    <text x="400" y="42">D1</text>
    <text x="500" y="42">E1</text>

    <text x="100" y="104">A2</text>
    <text x="200" y="104">B2</text>
    <text x="300" y="104">C2</text>
    <text x="400" y="104">D2</text>
    <text x="500" y="104">E2</text>

    <text x="100" y="166">A3</text>
    <text x="200" y="166">B3</text>
    <text x="300" y="166">C3</text>
    <text x="400" y="166">D3</text>
    <text x="500" y="166">E3</text>

    <text x="100" y="228">A4</text>
    <text x="200" y="228">B4</text>
    <text x="300" y="228">C4</text>
    <text x="400" y="228">D4</text>
    <text x="500" y="228">E4</text>

    <text x="100" y="290">A5</text>
    <text x="200" y="290">B5</text>
    <text x="300" y="290">C5</text>
    <text x="400" y="290">D5</text>
    <text x="500" y="334" font-weight="700">E5 · END</text>
  </g>

  <!-- Dedicated footer -->
  <rect x="0" y="348" width="600" height="52" fill="#e8eef6"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="369" fill="#1d4ed8" font-size="16" font-weight="700">Shortest route: 8 street segments</text>
    <text x="300" y="390" fill="#334155" font-size="14">2026-10-30 18:04:33 SGT (UTC+08:00)</text>
  </g>
</svg>