<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican rides a bicycle with a huge fish-filled bill, insisting that this counts as traveling light. Wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#c6edf0"/>
      <stop offset="1" stop-color="#f9f0d3"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffcf55"/>
      <stop offset="1" stop-color="#f18c43"/>
    </linearGradient>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #213d48; }
      .ink { stroke: #213d48; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #213d48; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="wheel">
      <circle r="72" fill="#f9f4dc" stroke="#213d48" stroke-width="10"/>
      <circle r="61" fill="none" stroke="#acbbc0" stroke-width="3"/>
      <g stroke="#718b92" stroke-width="2">
        <path d="M-61 0H61M0-61V61M-43-43L43 43M-43 43L43-43"/>
        <path d="M-23-56L23 56M-56-23L56 23M-56 23L56-23M-23 56L23-56"/>
      </g>
      <circle r="9" fill="#f6bc46" stroke="#213d48" stroke-width="3"/>
      <path d="M-9-65H9" stroke="#ef6a4e" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="15" y="15" width="770" height="570" rx="22" fill="none" stroke="#213d48" stroke-width="3"/>
  <text x="400" y="67" text-anchor="middle" font-size="47" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="95" text-anchor="middle" font-size="16" letter-spacing="2">THE COMMUTE. THE CATCH. THE AUDACITY.</text>

  <rect x="31" y="114" width="738" height="365" rx="16" fill="url(#sky)"/>
  <circle cx="682" cy="171" r="32" fill="#f7cd69"/>
  <path d="M35 331Q130 303 221 331T411 329T601 328T769 327V438H31Z" fill="#9fc8bd"/>
  <path d="M31 374Q167 340 307 374T591 370T769 371V441H31Z" fill="#729f91"/>
  <path d="M88 164q17-17 34 0q17-17 34 0M570 142q12-12 24 0q12-12 24 0" fill="none" stroke="#729da2" stroke-width="3" stroke-linecap="round"/>
  <path d="M31 432H769V463Q769 479 753 479H47Q31 479 31 463Z" fill="#e2d9bd"/>
  <path d="M45 454H163M193 454H311M341 454H459M489 454H607M637 454H755" stroke="#fff9e9" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="407" cy="435" rx="235" ry="15" fill="#213d48" opacity=".14"/>

  <g>
    <path d="M109 432V281" class="ink" fill="none"/>
    <rect x="48" y="244" width="122" height="61" rx="7" fill="#fff9e9" class="thin"/>
    <text x="109" y="268" font-size="14" font-weight="bold" text-anchor="middle">BIKE LANE</text>
    <text x="109" y="289" font-size="12" text-anchor="middle">NO WIDE LOADS</text>
    <path d="M64 296H153" stroke="#ef6a4e" stroke-width="2"/>
  </g>

  <g transform="translate(258 361)">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0 258 361" to="360 258 361" dur="1.8s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(560 361)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- The rear wheel rotates about its local hub. -->
  <circle cx="258" cy="361" r="72" fill="none" stroke="#213d48" stroke-width="10"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 361L328 269L401 361H258L468 271L401 361M468 271L560 361" stroke="#213d48" stroke-width="13"/>
    <path d="M258 361L328 269L401 361H258L468 271L401 361M468 271L560 361" stroke="#e95d49" stroke-width="7"/>
    <path d="M328 269L321 250M468 271L488 225L513 226" stroke="#213d48" stroke-width="7"/>
    <path d="M304 248H341" stroke="#213d48" stroke-width="12"/>
    <path d="M491 226Q542 244 548 326" stroke="#213d48" stroke-width="2"/>
  </g>
  <circle cx="401" cy="361" r="21" fill="#f5c657" class="thin"/>
  <g transform="translate(401 361)">
    <g class="thin" fill="#213d48">
      <path d="M0 0L25 22M0 0L-25-22" fill="none"/>
      <path d="M16 22H37M-36-22H-15" stroke-width="6"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M335 274Q339 303 377 316L392 340" fill="none" stroke="#213d48" stroke-width="12" stroke-linecap="round"/>
    <path d="M335 274Q339 303 377 316L392 340" fill="none" stroke="#edaa42" stroke-width="7" stroke-linecap="round"/>
    <path d="M383 339L411 343L399 351L379 348Z" fill="#f3b34a" class="thin"/>
    <path d="M289 230L248 211L262 248L239 252L292 272" fill="#f9faf2" class="ink"/>
    <path d="M287 203Q320 174 361 197Q391 215 390 246Q381 282 341 284Q288 284 274 254Q264 227 287 203Z" fill="#fffdf1" class="ink"/>
    <path d="M294 220Q321 208 353 231Q341 257 304 258Q318 249 320 238Q301 238 294 220Z" fill="#c9d5d1" class="thin"/>
    <path d="M359 214Q390 215 393 185L389 157Q385 132 406 128Q430 125 438 149L440 187Q444 220 415 243L383 259" fill="#fffdf1" class="ink"/>
    <path d="M431 164L612 179Q593 240 504 227Q450 217 431 187Z" fill="url(#pouch)" class="ink"/>
    <path d="M434 160L622 177L433 181Z" fill="#ffdb67" class="ink"/>
    <path d="M457 188Q511 211 580 190" fill="none" stroke="#bc713a" stroke-width="3" opacity=".7"/>
    <g transform="translate(512 204) rotate(10)">
      <path d="M-26 0Q-4-20 23 0Q-4 19-26 0L-39-12V12Z" fill="#79b7ba" class="thin"/>
      <circle cx="12" cy="-2" r="3" fill="#213d48"/>
    </g>
    <circle cx="419" cy="151" r="10" fill="white" class="thin"/>
    <circle cx="423" cy="151" r="4" fill="#213d48"/>
    <path d="M408 135L429 140" fill="none" class="thin"/>
    <path d="M386 139Q402 111 432 133L439 143L384 143Z" fill="#e95d49" class="ink"/>
    <path d="M400 126L404 138M414 125L419 138" class="thin" fill="none"/>
    <path d="M384 182L372 196L404 204L397 189" fill="#e95d49" class="thin"/>
    <path d="M375 193L340 183L347 200L326 204L371 212Z" fill="#e95d49" class="thin"/>
    <path d="M358 227Q409 234 441 245L486 226" fill="none" stroke="#213d48" stroke-width="12" stroke-linecap="round"/>
    <path d="M358 227Q409 234 441 245L486 226" fill="none" stroke="#e7eee5" stroke-width="7" stroke-linecap="round"/>
    <path d="M352 268L377 292L365 326L386 341" fill="none" stroke="#213d48" stroke-width="11" stroke-linecap="round"/>
    <path d="M352 268L377 292L365 326L386 341" fill="none" stroke="#f5b84a" stroke-width="6" stroke-linecap="round"/>
    <path d="M380 338L409 345L395 354L373 347Z" fill="#f5b84a" class="thin"/>
  </g>

  <g>
    <path d="M553 267L531 246L568 256" fill="#fffdf1" class="thin"/>
    <rect x="543" y="256" width="193" height="64" rx="14" fill="#fffdf1" class="thin"/>
    <text x="639" y="282" text-anchor="middle" font-size="18" font-weight="bold">“I packed light.”</text>
    <text x="639" y="305" text-anchor="middle" font-size="14">— six fish, one ego</text>
  </g>

  <path d="M192 304H221M180 318H211M199 332H219" fill="none" stroke="#fff9e9" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="512" text-anchor="middle" font-size="21" font-weight="bold">Zero emissions. Unlimited carry-on.</text>
  <text x="400" y="536" text-anchor="middle" font-size="15">A pelican’s cycling plan: pedal less, bill more.</text>
  <path d="M58 549H742" stroke="#c6c9b9" stroke-width="1"/>
  <text x="400" y="572" text-anchor="middle" font-size="16">2026-10-31 17:01:45 SGT (UTC+08:00)</text>
</svg>