<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican's Two-Wheeled Tax Audit</title>
  <desc id="desc">A smug pelican pedals a bicycle while carrying an absurdly long receipt. The wheels spin and the pelican bobs gently.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.8s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .7s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#eaf7f4"/>
  <path d="M0 420 Q170 390 330 418 T800 406 V550 H0Z" fill="#bde5d6"/>
  <path d="M0 465 Q170 445 330 466 T800 452" fill="none" stroke="#93cdb8" stroke-width="4"/>
  <circle cx="91" cy="122" r="39" fill="#ffd66b"/>
  <path d="M0 350 Q96 292 188 350 M600 338 Q690 282 800 344" fill="none" stroke="#c4e7dc" stroke-width="8" stroke-linecap="round"/>

  <text x="400" y=" fifty" visibility="hidden">.</text>
  <text x="400" y="55" text-anchor="middle" font-size="34" font-weight="900" letter-spacing="1.2" fill="#173d4a">THE PELICAN'S TWO-WHEELED TAX AUDIT</text>
  <text x="400" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#426874">“I’m cycling off these fish expenses.”</text>

  <!-- Long, ridiculous receipt -->
  <path d="M565 182 Q596 175 626 184 L617 327 Q594 338 573 326Z" fill="#fffdf3" stroke="#465c60" stroke-width="3"/>
  <path d="M579 199h29 M578 211h31 M577 223h26 M576 235h30 M575 247h23 M574 259h31 M573 271h27 M572 283h30 M571 295h23" stroke="#9ba9a4" stroke-width="2"/>
  <text x="589" y="316" text-anchor="middle" font-size="12" font-weight="800" fill="#e05b45">FISH: $$$</text>
  <path d="M582 182 Q576 158 559 146" fill="none" stroke="#526975" stroke-width="3" stroke-linecap="round"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#e35f4b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M248 412 L344 412 L402 318 L300 318 Z"/>
    <path d="M344 412 L402 318 L477 412 Z"/>
    <path d="M402 318 L423 291"/>
    <path d="M408 286 L439 286"/>
    <path d="M300 318 L284 294"/>
    <path d="M269 294 L297 294"/>
  </g>
  <g fill="none" stroke="#284d5a" stroke-width="5">
    <circle class="wheel" cx="248" cy="412" r="68"/>
    <circle class="wheel" cx="477" cy="412" r="68"/>
  </g>
  <g stroke="#6c9297" stroke-width="2">
    <path d="M248 344v136 M180 412h136 M200 364l96 96 M200 460l96-96"/>
    <path d="M477 344v136 M409 412h136 M429 364l96 96 M429 460l96-96"/>
  </g>
  <circle cx="344" cy="412" r="10" fill="#f0b84d" stroke="#284d5a" stroke-width="3"/>
  <path d="M344 412l31 18 M344 412l-28-20" stroke="#284d5a" stroke-width="5" stroke-linecap="round"/>
  <path d="M375 430h17 M307 392h17" stroke="#284d5a" stroke-width="5" stroke-linecap="round"/>

  <!-- Pelican rider -->
  <g class="rider">
    <path d="M327 285 Q337 241 380 236 Q416 241 420 283 L400 327 L348 326Z" fill="#f7f2df" stroke="#31525c" stroke-width="4"/>
    <path d="M349 317 Q372 295 403 313 L396 337 Q368 339 344 331Z" fill="#e8b845" stroke="#31525c" stroke-width="3"/>
    <path d="M359 299 Q371 317 394 318" fill="none" stroke="#31525c" stroke-width="3"/>
    <path d="M354 275 Q344 238 359 208 Q376 181 408 197 Q433 211 419 244 Q411 269 389 282Z" fill="#fffdf3" stroke="#31525c" stroke-width="4"/>
    <path d="M402 218 Q451 208 476 225 Q454 242 411 238Z" fill="#f1a43b" stroke="#31525c" stroke-width="4"/>
    <path d="M425 230 Q453 235 470 225 Q454 249 427 252Z" fill="#ec7651" stroke="#31525c" stroke-width="3"/>
    <circle cx="398" cy="214" r="5" fill="#243d45"/>
    <path d="M384 198 Q393 186 408 194" fill="none" stroke="#31525c" stroke-width="4" stroke-linecap="round"/>
    <path d="M340 254 Q318 268 309 302 L332 312 Q351 289 365 272" fill="#f7f2df" stroke="#31525c" stroke-width="4"/>
    <path d="M309 302 L330 307" stroke="#31525c" stroke-width="4" stroke-linecap="round"/>
    <path d="M400 260 Q426 270 438 292" fill="none" stroke="#31525c" stroke-width="9" stroke-linecap="round"/>
    <path d="M438 292l-13-5" stroke="#f1a43b" stroke-width="7" stroke-linecap="round"/>
    <path d="M357 326 Q350 354 340 381" fill="none" stroke="#31525c" stroke-width="10" stroke-linecap="round"/>
    <path d="M397 328 Q389 355 375 386" fill="none" stroke="#31525c" stroke-width="10" stroke-linecap="round"/>
    <path d="M340 381l-15 12 M375 386l14 8" stroke="#f1a43b" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Motion marks and joke callout -->
  <path d="M118 283h42 M104 301h34 M134 319h31" stroke="#5cae9a" stroke-width="5" stroke-linecap="round"/>
  <path d="M518 142 Q553 119 596 148" fill="none" stroke="#426874" stroke-width="2.5" stroke-dasharray="5 5"/>
  <rect x="501" y="104" width="180" height="39" rx="18" fill="#fff" stroke="#426874" stroke-width="2"/>
  <text x="591" y="130" text-anchor="middle" font-size="15" font-weight="800" fill="#31525c">“Deductible? I hope so.”</text>

  <path d="M0 510 H800" stroke="#568c7b" stroke-width="3"/>
  <text x="400" y="541" text-anchor="middle" font-size="14" font-weight="700" fill="#31525c">A pelican pedals past the taxman, beak full of receipts and absolutely no regrets.</text>
  <text x="400" y="580" text-anchor="middle" font-size="16" font-weight="800" fill="#173d4a">2026-10-26 04:31:48 SGT (UTC+08:00)</text>
</svg>