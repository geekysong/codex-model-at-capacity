<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDALS</title>
  <desc id="desc">A self-important pelican rides a bicycle with a fish in its bill while the wheels spin and its body bobs.</desc>
  <defs>
    <style>
      .ink { stroke:#24323d; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#24323d; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .rider { animation:bob 1.1s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
    </style>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#f5d88c" opacity=".55"/>
    </pattern>
  </defs>

