<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican cycles along the waterfront with a fish in its enormous bill pouch. Bicycle spokes spin, pedals turn, and the pelican bobs in a seamless loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#b9ecf3"/>
      <stop offset="1" stop-color="#fff3cc"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc65c"/>
      <stop offset="1" stop-color="#f28c47"/>
    </linearGradient>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #203b44; }
      .ink { stroke: #203b44; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #7b9296; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e7"/>
  <rect x="16" y="16" width="768" height="473" rx="24" fill="url(#sky)" stroke="#203b44" stroke-width="4"/>
  <circle cx="674" cy="116" r="44" fill="#ffd36c"/>
  <path d="M59 146q24-22 48 0q24-22 48 0M561 164q18-17 36 0q18-17 36 0" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <text x="400" y="69" text-anchor="middle" font-size="43" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="99" text-anchor="middle" font-size="17" font-weight="bold">THE COMMUTE HAS A CATCH.</text>

  <path d="M18 341q90-18 180 0t180 0t180 0t224 0v88H18Z" fill="#78c9ce"/>
  <path d="M33 368h85m28 14h68m353-17h100m23 22h61" fill="none" stroke="#ddffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M18 419Q400 395 782 419v46q0 22-22 22H40q-22 0-22-22Z" fill="#dfcb9f"/>
  <path d="M40 465h112m486 0h114" stroke="#fff7dd" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="393" cy="450" rx="225" ry="17" fill="#9b885f" opacity=".23"/>

  <!-- A waterfront sign sets the joke in the same scene. -->
  <path d="M106 323v99" class="ink" fill="none"/>
  <rect x="43" y="263" width="126" height="65" rx="8" fill="#fff8e7" class="ink"/>
  <text x="106" y="288" text-anchor="middle" font-size="17" font-weight="bold">BIKE LANE</text>
  <text x="106" y="311" text-anchor="middle" font-size="14">NO TRAWLING</text>

  <!-- Rotating wheels: tires stay crisp while spokes turn. -->
  <g transform="translate(260 389)">
    <circle r="65" fill="#f9f7df" fill-opacity=".55" class="ink" stroke-width="10"/>
    <circle r="56" fill="none" stroke="#fff8e7" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-57 0H57M0-57V57M-40-40l80 80M-40 40l80-80"/>
      <path d="M-52-22L52 22M-22-52L22 52M-52 22L52-22M-22 52L22-52"/>
    </g>
    <circle r="8" fill="#203b44"/>
  </g>
  <g transform="translate(553 389)">
    <circle r="65" fill="#f9f7df" fill-opacity=".55" class="ink" stroke-width="10"/>
    <circle r="56" fill="none" stroke="#fff8e7" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-57 0H57M0-57V57M-40-40l80 80M-40 40l80-80"/>
      <path d="M-52-22L52 22M-22-52L22 52M-52 22L52-22M-22 52L22-52"/>
    </g>
    <circle r="8" fill="#203b44"/>
  </g>

  <path d="M260 389l69-110 62 110H260l102-71h157l-128 71m128-71 34 71m-34-71-15-53" fill="none" stroke="#203b44" stroke-width="12" stroke-linejoin="round"/>
  <path d="M260 389l69-110 62 110H260l102-71h157l-128 71m128-71 34 71m-34-71-15-53" fill="none" stroke="#e95d52" stroke-width="6" stroke-linejoin="round"/>
  <path d="M329 279l-8-30m-22 0h53m152 16 26-16h24" fill="none" class="ink"/>
  <path d="M299 246q26-10 53 0" fill="none" stroke="#203b44" stroke-width="12" stroke-linecap="round"/>
  <circle cx="391" cy="389" r="19" fill="#f6c44c" class="ink"/>

  <!-- The rider bobs gently; all lettering remains still. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M309 271l-49-28 17 40-22 2 42 25" fill="#fafbf2" class="ink"/>
    <path d="M337 292l21 42 36 25" fill="none" stroke="#203b44" stroke-width="13" stroke-linecap="round"/>
    <path d="M337 292l21 42 36 25" fill="none" stroke="#f3ac40" stroke-width="7" stroke-linecap="round"/>
    <path d="M393 353l24 11-29 7" fill="#efa73e" class="ink"/>
    <path d="M301 241q13-41 65-31l35 21q21-19 28-62 5-35 30-40 35-7 46 23 8 25-16 45-26 22-21 49 10 57-57 69-74 13-110-34Z" fill="#fffef2" class="ink"/>
    <path d="M317 243q55-35 81 8-11 39-54 30m2-37 30 17m-43-1 25 15" fill="#e1e8dc" class="ink"/>
    <path d="M398 252q49 29 116 5" fill="none" stroke="#203b44" stroke-width="17" stroke-linecap="round"/>
    <path d="M398 252q49 29 116 5" fill="none" stroke="#f8faf0" stroke-width="11" stroke-linecap="round"/>
    <path d="M505 254l15 5" stroke="#203b44" stroke-width="7" stroke-linecap="round"/>

    <!-- An absurdly capacious beak, with an unimpressed passenger. -->
    <path d="M487 176l203 17q-27 92-111 72-57-14-92-89Z" fill="url(#pouch)" class="ink"/>
    <path d="M486 173l208 18q11 2 7 10l-212-9Z" fill="#ffd75e" class="ink"/>
    <path d="M556 229q30-25 59-2l20-13-2 31-19-10q-31 21-58-6Z" fill="#68bcb5" stroke="#203b44" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="568" cy="226" r="3" fill="#203b44"/>
    <path d="M579 237l12-1" stroke="#203b44" stroke-width="2" stroke-linecap="round"/>
    <path d="M455 156l20 2m5 0 18-1" stroke="#203b44" stroke-width="10" stroke-linecap="round"/>
    <path d="M475 156l7-1" stroke="#203b44" stroke-width="4"/>
    <path d="M445 133q27-28 58 3" fill="#e95d52" class="ink"/>
    <path d="M454 124l8 10m10-14 4 14m9-10 2 11" stroke="#fff0d4" stroke-width="3"/>
    <path d="M443 137l62 3" stroke="#203b44" stroke-width="6" stroke-linecap="round"/>
    <path d="M431 198l-28 13 18 14-33 4" fill="#e95d52" class="ink"/>
  </g>

  <g transform="translate(391 389)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#203b44" stroke-width="6"/>
      <path d="M-32-5h16v10h-16zm48 0h16v10H16Z" fill="#203b44"/>
    </g>
    <circle r="6" fill="#fff8e7" stroke="#203b44" stroke-width="3"/>
  </g>

  <path d="M193 344h32m-46 17h34" stroke="#fff8e7" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="524" text-anchor="middle" font-size="23" font-weight="bold">He took up cycling. The fish took up praying.</text>
  <path d="M52 545H748" stroke="#d4c8ae" stroke-width="2"/>
  <text x="400" y="574" text-anchor="middle" font-size="18">2026-11-02 20:01:54 SGT (UTC+08:00)</text>
</svg>