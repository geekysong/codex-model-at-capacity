<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Two-Wheeled Midlife Crisis</title>
  <desc id="desc">A pompous pelican pedals a bicycle while a fish rides in its enormous beak.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.8s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .7s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#b9e7e7"/>
  <rect y="390" width="800" height="140" fill="#f6d88a"/>
  <path d="M0 390 Q110 365 220 390 T440 390 T660 390 T880 390" fill="none" stroke="#fff4cc" stroke-width="8"/>
  <circle cx="695" cy="105" r="46" fill="#ffcc55"/>
  <path d="M45 390 Q90 320 135 390 M120 390 Q165 310 210 390" fill="none" stroke="#63a8a0" stroke-width="12" stroke-linecap="round"/>
  <path d="M0 492 Q120 470 250 492 T500 492 T800 492" fill="none" stroke="#d8a94c" stroke-width="3"/>

  <text id="title" x="400" y="55" text-anchor="middle" font-size="31" font-weight="900" fill="#173b48" letter-spacing="1">THE PELICAN’S TWO-WHEELED CRISIS</text>
  <text x="400" y="83" text-anchor="middle" font-size="16" font-weight="700" fill="#315b61">“I’m cutting carbs. The fish is just carrying me.”</text>

  <!-- bicycle -->
  <g fill="none" stroke="#244957" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <g class="wheel">
      <circle cx="255" cy="400" r="72" stroke="#304e57" stroke-width="7"/>
      <path d="M255 328V472 M183 400H327 M204 349L306 451 M306 349L204 451" stroke="#77949a" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="545" cy="400" r="72" stroke="#304e57" stroke-width="7"/>
      <path d="M545 328V472 M473 400H617 M494 349L596 451 M596 349L494 451" stroke="#77949a" stroke-width="3"/>
    </g>
    <path d="M255 400 L350 400 L315 320 L255 400 M350 400 L430 400 L390 300 L315 320 M430 400 L545 400 M430 400 L480 320 L545 400"/>
    <path d="M303 316 L327 316 M379 295 L403 295 M472 320 L493 320"/>
    <path d="M350 400 L371 378 M371 378 L389 390 M350 400 L330 420 M330 420 L314 410"/>
  </g>
  <circle cx="350" cy="400" r="10" fill="#f27b4a" stroke="#244957" stroke-width="4"/>
  <path d="M380 288 Q392 280 405 288" fill="none" stroke="#244957" stroke-width="6" stroke-linecap="round"/>
  <path d="M462 312 Q478 304 497 312" fill="none" stroke="#244957" stroke-width="6" stroke-linecap="round"/>

  <!-- rider -->
  <g class="rider">
    <!-- tail and body -->
    <path d="M334 258 Q299 244 285 269 Q309 279 340 278" fill="#f8f4e9" stroke="#273f48" stroke-width="4"/>
    <ellipse cx="371" cy="260" rx="66" ry="49" fill="#fffdf5" stroke="#273f48" stroke-width="5"/>
    <path d="M338 248 Q366 222 405 246 Q420 260 405 277 Q375 291 345 272Z" fill="#d5e8e5"/>
    <path d="M398 254 Q427 230 444 247 Q435 267 408 272" fill="#fffdf5" stroke="#273f48" stroke-width="4"/>
    <!-- neck -->
    <path d="M393 253 Q420 194 438 143 Q450 117 472 127 Q489 136 475 161 Q453 198 442 260" fill="#fffdf5" stroke="#273f48" stroke-width="5"/>
    <!-- head -->
    <ellipse cx="465" cy="123" rx="39" ry="32" fill="#fffdf5" stroke="#273f48" stroke-width="5"/>
    <path d="M490 126 Q555 118 610 145 Q565 158 506 153 Q489 148 490 126Z" fill="#f4a53c" stroke="#273f48" stroke-width="5"/>
    <path d="M500 152 Q548 157 589 147 Q564 174 519 167 Q504 164 500 152Z" fill="#ec7655" stroke="#273f48" stroke-width="4"/>
    <circle cx="477" cy="116" r="7" fill="#183642"/>
    <circle cx="479" cy="114" r="2.5" fill="#fff"/>
    <path d="M455 87 Q470 78 483 88" fill="none" stroke="#273f48" stroke-width="4" stroke-linecap="round"/>
    <!-- fish in beak -->
    <path d="M551 130 Q570 114 590 130 Q570 146 551 130Z" fill="#70c5ce" stroke="#244957" stroke-width="3"/>
    <path d="M590 130 L603 120 L603 140Z" fill="#f27b4a" stroke="#244957" stroke-width="2"/>
    <circle cx="562" cy="127" r="2.5" fill="#173b48"/>
    <!-- scarf -->
    <path d="M431 151 Q451 160 477 151 L472 166 Q449 173 424 161Z" fill="#ef6654" stroke="#273f48" stroke-width="3"/>
    <path d="M447 165 Q438 188 449 201 Q458 190 459 168" fill="#ef6654" stroke="#273f48" stroke-width="3"/>
    <!-- wing -->
    <path d="M345 245 Q371 220 405 246 Q389 268 355 270 Q343 262 345 245Z" fill="#f1eee3" stroke="#273f48" stroke-width="4"/>
    <path d="M357 248 Q374 251 390 246 M360 258 Q376 260 388 255" fill="none" stroke="#a6b7b3" stroke-width="3" stroke-linecap="round"/>
    <!-- legs pedaling -->
    <path d="M357 286 Q363 324 344 351 L350 398" fill="none" stroke="#f0a13b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M395 284 Q420 311 403 340 L369 379" fill="none" stroke="#f0a13b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M339 397 Q350 390 360 399 L359 407 Q344 411 335 405Z" fill="#e98d31" stroke="#273f48" stroke-width="3"/>
    <path d="M365 376 Q373 370 382 378 L378 386 Q366 389 360 383Z" fill="#e98d31" stroke="#273f48" stroke-width="3"/>
    <!-- wing on handlebars -->
    <path d="M423 250 Q444 258 472 316" fill="none" stroke="#fffdf5" stroke-width="15" stroke-linecap="round"/>
    <path d="M423 250 Q444 258 472 316" fill="none" stroke="#273f48" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- comic accents -->
  <path d="M618 105 L630 94 M624 119 L640 116 M612 91 L618 78" stroke="#f27b4a" stroke-width="4" stroke-linecap="round"/>
  <text x="628" y="184" font-size="18" font-weight="900" fill="#315b61">HONK!</text>
  <path d="M625 190 Q645 203 654 218" fill="none" stroke="#315b61" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="70" y="315" width="135" height="48" rx="12" fill="#fff8e5" stroke="#315b61" stroke-width="3"/>
  <text x="137" y="336" text-anchor="middle" font-size="13" font-weight="800" fill="#315b61">ECO-FRIENDLY</text>
  <text x="137" y="353" text-anchor="middle" font-size="13" font-weight="800" fill="#315b61">FISH DELIVERY</text>

  <!-- footer kept clear of the scene -->
  <path d="M0 530 H800" stroke="#315b61" stroke-width="2" opacity=".35"/>
  <text x="400" y="565" text-anchor="middle" font-size="16" font-weight="700" fill="#173b48">2026-11-02 20:03:16 SGT (UTC+08:00)</text>
</svg>