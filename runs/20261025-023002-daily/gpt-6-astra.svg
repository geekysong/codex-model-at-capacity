  <rect x="0" y="378" width="600" height="22" fill="#edf1f5"/>
  <text x="300" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#172033">2026-10-25 02:33:07 SGT (UTC+08:00)</text>
