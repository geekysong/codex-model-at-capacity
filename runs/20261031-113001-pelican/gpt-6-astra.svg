  <path d="M64 132H285Q299 132 299 146V184Q299 198 285 198H265L278 217L239 198H64Q50 198 50 184V146Q50 132 64 132Z" fill="#fffef5" stroke="#263b44" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#263b44">
    <text x="174" y="159" font-size="19" font-weight="bold">“It’s a commuter bag.</text>
    <text x="174" y="184" font-size="19" font-weight="bold">The fish is my lunch.”</text>
  </g>

  <rect y="504" width="800" height="96" fill="#fff5dc"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#263b44">
    <text x="400" y="536" font-size="21" font-weight="bold">The pelican cycles to work. His lunch gets a chauffeur.</text>
    <path d="M120 552H680" stroke="#b5a486" stroke-width="1"/>
    <text x="400" y="578" font-size="17">2026-10-31 11:30:01 SGT (UTC+08:00)</text>
