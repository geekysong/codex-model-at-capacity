<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican on a bicycle</title>
  <desc id="description">An earnest pelican pedals a tiny bicycle with a fish in its enormous beak pouch. The wheels spin, its feet pedal, and its body bobs. A sign announces a bike lane with a beak surcharge.</desc>
  <defs>
    <pattern id="grain" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r="1" fill="#56432f" opacity=".06"/>
      <circle cx="14" cy="17" r=".7" fill="#56432f" opacity=".06"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fff9e7" stroke="#263b44" stroke-width="12"/>
      <circle r="66" fill="none" stroke="#a5b4b7" stroke-width="3"/>
      <g stroke="#82959b" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <path d="M-6-64H6" stroke="#ffb547" stroke-width="7" stroke-linecap="round"/>
      <circle r="9" fill="#263b44"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <rect width="800" height="600" fill="url(#grain)"/>
  <path d="M0 325Q140 280 270 321T540 316T800 310V458H0Z" fill="#d8e8dc"/>
  <path d="M0 366Q150 337 300 369T600 360T800 366V458H0Z" fill="#b6d5c5"/>

