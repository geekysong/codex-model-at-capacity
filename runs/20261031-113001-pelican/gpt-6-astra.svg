  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#263b44">
    <text x="672" y="203" font-size="20" font-weight="bold">BIKE LANE</text>
    <text x="672" y="239" font-size="15">BEAK SURCHARGE</text>
    <text x="672" y="263" font-size="20" font-weight="bold">$12</text>
  </g>

