<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle with spinning wheels and bobbing as it pedals.</desc>
  <rect width="800" height="600" fill="#fff7dd"/>
  <circle cx="700" cy="118" r="42" fill="#ffd35a"/>
  <path d="M0 365 Q115 326 230 361 T470 353 T800 354 V472 H0Z" fill="#d9eab8"/>
  <path d="M0 413 Q145 394 290 414 T570 409 T800 411 V472 H0Z" fill="#b5d79e"/>
  <path d="M0 472 H800 V522 H0Z" fill="#e4be83"/>
  <path d="M0 474 H800" stroke="#493d38" stroke-width="5"/>
  <path d="M27 455 h55 M100 455 h28 M683 452 h70" stroke="#77955e" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="2" fill="#273947">THE PELICAN EXPRESS</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#61736a">THE COMMUTE HAS TAKEN FLIGHT. SORT OF.</text>

  <!-- Motion lines -->
  <g fill="none" stroke="#819985" stroke-width="4" stroke-linecap="round">
    <path d="M83 286 h55 M59 304 h72 M90 322 h43"/>
    <path d="M91 370 h33 M65 385 h49"/>
  </g>

  <!-- Wheels -->
  <g stroke="#283a43" stroke-width="7" fill="#fff5da">
    <circle cx="245" cy="397" r="73"/>
    <circle cx="553" cy="397" r="73"/>
  </g>
  <g stroke="#82929a" stroke-width="3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 245 397" to="360 245 397" dur="2s" repeatCount="indefinite"/>
      <path d="M245 328 V466 M176 397 H314 M196 348 L294 446 M196 446 L294 348"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 553 397" to="360 553 397" dur="2s" repeatCount="indefinite"/>
      <path d="M553 328 V466 M484 397 H622 M504 348 L602 446 M504 446 L602 348"/>
    </g>
  </g>
  <g fill="#283a43">
    <circle cx="245" cy="397" r="7"/>
    <circle cx="553" cy="397" r="7"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#e45846" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 397 L330 298 L385 397 Z"/>
    <path d="M330 298 H476 L385 397"/>
    <path d="M476 298 L553 397"/>
  </g>
  <g fill="none" stroke="#283a43" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M330 298 L318 271"/>
    <path d="M298 271 H341"/>
    <path d="M476 298 L462 260 H490 Q502 260 502 271"/>
  </g>
  <path d="M300 267 Q319 258 344 266 L341 273 H300Z" fill="#283a43"/>
  <circle cx="385" cy="397" r="18" fill="#fff5da" stroke="#283a43" stroke-width="5"/>
  <g stroke="#283a43" stroke-width="6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 385 397" to="360 385 397" dur="1.2s" repeatCount="indefinite"/>
    <path d="M385 397 L404 416 M385 397 L366 378"/>
    <path d="M396 419 H412 M358 375 H374" stroke-width="7"/>
  </g>

  <!-- Pelican and rider bob together -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 3;0 0" dur="1.2s" repeatCount="indefinite"/>
    <!-- Tail -->
    <path d="M302 238 Q267 216 258 187 Q288 193 321 213" fill="#e6e7d6" stroke="#283a43" stroke-width="5" stroke-linejoin="round"/>
    <!-- Body -->
    <path d="M299 205 Q346 174 403 200 Q440 219 425 259 Q409 291 358 286 Q312 285 293 257 Q281 237 299 205Z" fill="#faf9ed" stroke="#283a43" stroke-width="5"/>
    <!-- Wing -->
    <path d="M317 222 Q354 199 405 221 Q401 260 360 269 Q330 270 317 250 Q347 252 366 237 Q339 244 317 242Z" fill="#e5e9df" stroke="#283a43" stroke-width="4" stroke-linejoin="round"/>
    <!-- Neck and head -->
    <path d="M387 215 Q407 193 400 166 Q393 131 415 111 Q433 94 454 108 Q469 119 465 140 Q463 157 449 169 Q441 178 447 193 Q451 205 466 211" fill="#faf9ed" stroke="#283a43" stroke-width="5" stroke-linecap="round"/>
    <!-- Pouch and bill -->
    <path d="M451 145 Q492 151 554 166 Q546 203 510 213 Q482 220 462 190 Q452 176 451 145Z" fill="#f5bd58" stroke="#283a43" stroke-width="5" stroke-linejoin="round"/>
    <path d="M450 143 Q504 142 582 161 Q590 164 582 169 Q520 171 452 157Z" fill="#f6a73b" stroke="#283a43" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="449" cy="127" r="9" fill="#fff" stroke="#283a43" stroke-width="3"/>
    <circle cx="452" cy="127" r="3.5" fill="#283a43"/>
    <path d="M436 113 Q444 107 452 111" fill="none" stroke="#283a43" stroke-width="3" stroke-linecap="round"/>
    <!-- Helmet -->
    <path d="M406 111 Q419 86 446 91 Q463 94 470 111 L464 116 Q437 104 408 119Z" fill="#52a5ad" stroke="#283a43" stroke-width="4"/>
    <path d="M423 94 L417 111 M439 93 L438 110" stroke="#d4f0e9" stroke-width="3"/>
    <!-- Legs reaching pedals -->
    <path d="M348 281 Q352 314 375 331 L399 357" fill="none" stroke="#d89539" stroke-width="8" stroke-linecap="round"/>
    <path d="M399 357 L412 361 L401 366 L388 362" fill="#f0aa42" stroke="#283a43" stroke-width="3" stroke-linejoin="round"/>
    <path d="M376 283 Q385 310 369 331 L354 349" fill="none" stroke="#d89539" stroke-width="8" stroke-linecap="round"/>
    <path d="M354 349 L339 352 L350 358 L362 354" fill="#f0aa42" stroke="#283a43" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Bell and basket -->
  <path d="M489 262 Q489 250 500 250 Q511 250 511 262Z" fill="#ffd35a" stroke="#283a43" stroke-width="4"/>
  <path d="M500 250 V245" stroke="#283a43" stroke-width="3"/>
  <path d="M514 284 H582 L573 322 H526Z" fill="#c6925d" stroke="#283a43" stroke-width="5" stroke-linejoin="round"/>
  <path d="M523 295 H576 M527 307 H573 M539 285 L544 321 M559 285 L557 321" stroke="#805b3d" stroke-width="3"/>
  <path d="M530 283 Q530 269 541 266 Q552 270 552 284 M552 284 Q553 267 564 264 Q576 271 573 284" fill="#82ad70" stroke="#283a43" stroke-width="3"/>

  <text x="400" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#273947">He carries his lunch. The bicycle carries his ambition.</text>
  <text x="400" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#52605d">2026-10-31 11:32:26 SGT (UTC+08:00)</text>
</svg>