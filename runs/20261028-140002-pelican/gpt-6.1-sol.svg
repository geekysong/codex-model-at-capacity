<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical pelican rides a bicycle while proudly delivering absolutely nothing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9e7ff"/>
      <stop offset="1" stop-color="#fff4c2"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#202020"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#191919;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#191919}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
      .bob{animation:bob .8s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="685" cy="105" r="52" fill="#ffd45a" opacity=".9"/>
  <path d="M0 355 Q120 295 245 350 T505 340 T800 330 L800 470 L0 470Z" fill="#8bcf78"/>
  <path d="M0 410 Q180 375 370 415 T800 400 L800 470 L0 470Z" fill="#64ad62"/>
  <rect y="455" width="800" height="105" fill="url(#road)"/>
  <path d="M0 512 H800" stroke="#ffe98a" stroke-width="9" stroke-dasharray="55 35" opacity=".85"/>

  <g class="label" text-anchor="middle">
    <text x="400" y="62" font-size="38" font-weight="900" fill="#16384a">PELICAN PEDAL PANIC!</text>
    <text x="400" y="94" font-size="18" font-weight="700" fill="#244b57">“A beak-first commute with absolutely no cargo capacity.”</text>
  </g>

  <g filter="url(#shadow)">
    <g class="wheelSpin">
      <circle cx="238" cy="430" r="72" fill="#d9f3ff" stroke="#191919" stroke-width="10"/>
      <circle cx="238" cy="430" r="12" fill="#191919"/>
      <path d="M238 358V502M166 430H310M187 379L289 481M289 379L187 481" stroke="#65747a" stroke-width="4"/>
    </g>
    <g class="wheelSpin">
      <circle cx="563" cy="430" r="72" fill="#d9f3ff" stroke="#191919" stroke-width="10"/>
      <circle cx="563" cy="430" r="12" fill="#191919"/>
      <path d="M563 358V502M491 430H635M512 379L614 481M614 379L512 481" stroke="#65747a" stroke-width="4"/>
    </g>

    <path d="M238 430 L350 300 L563 430 L405 430 L350 300 M405 430 L350 300" fill="none" stroke="#e34b3c" stroke-width="13"/>
    <path d="M350 300 L315 270 M563 430 L590 315" fill="none" stroke="#191919" stroke-width="9"/>
    <path d="M575 315 Q610 295 638 315" fill="none" stroke="#191919" stroke-width="9"/>
    <path d="M307 269 Q336 253 360 268" fill="none" stroke="#191919" stroke-width="9"/>
    <circle cx="405" cy="430" r="18" fill="#ffd34f" class="ink"/>
    <path d="M405 430 L373 382 M405 430 L446 470" stroke="#191919" stroke-width="8"/>
  </g>

  <g class="bob" filter="url(#shadow)">
    <path d="M315 283 Q318 210 383 179 Q449 149 500 190 Q536 218 516 277 Q500 322 448 333 Q382 347 337 318Z" fill="#f6f0df" class="ink"/>
    <path d="M386 180 Q358 119 390 89 Q420 61 457 85 Q482 101 475 139 L451 194Z" fill="#f6f0df" class="ink"/>
    <path d="M455 113 Q524 96 617 126 Q646 136 619 158 Q546 188 455 164Z" fill="#f28f3b" class="ink"/>
    <path d="M605 140 Q631 142 650 154" fill="none" stroke="#191919" stroke-width="6"/>
    <circle cx="430" cy="121" r="10" fill="#191919"/>
    <circle cx="433" cy="117" r="3" fill="#fff"/>
    <path d="M369 187 Q335 217 330 253" fill="none" stroke="#f28f3b" stroke-width="28" stroke-linecap="round"/>
    <path d="M472 205 Q521 220 548 260" fill="none" stroke="#f28f3b" stroke-width="28" stroke-linecap="round"/>
    <path d="M370 314 Q356 351 354 390" fill="none" stroke="#f28f3b" stroke-width="18" stroke-linecap="round"/>
    <path d="M452 322 Q458 360 479 395" fill="none" stroke="#f28f3b" stroke-width="18" stroke-linecap="round"/>
    <path d="M342 390 Q359 400 379 390 M470 395 Q489 407 507 398" fill="none" stroke="#191919" stroke-width="8"/>
    <path d="M382 251 Q416 270 459 248" fill="none" stroke="#191919" stroke-width="7"/>
    <text x="421" y="219" class="label" font-size="18" font-weight="900" text-anchor="middle" transform="rotate(-8 421 219)">NO FISH</text>
    <path d="M344 165 Q322 148 302 160" fill="none" stroke="#191919" stroke-width="6"/>
    <path d="M299 160 l-18 -5 M301 166 l-19 4" stroke="#191919" stroke-width="5"/>
  </g>

  <g class="label">
    <path d="M590 190 Q650 170 710 205" fill="none" stroke="#191919" stroke-width="4"/>
    <text x="685" y="185" font-size="20" font-weight="800">“I demand</text>
    <text x="685" y="210" font-size="20" font-weight="800">a bike lane!”</text>
    <path d="M637 218 l-35 22" fill="none" stroke="#191919" stroke-width="4"/>
  </g>

  <rect x="0" y="560" width="800" height="40" fill="#f5e7bd"/>
  <text x="400" y="585" class="label" text-anchor="middle" font-size="16" font-weight="700">2026-10-28 14:01:14 SGT (UTC+08:00)</text>
</svg>