<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly large fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f8"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#616977"/>
      <stop offset="1" stop-color="#303642"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#183044" flood-opacity=".3"/>
    </filter>
    <style>
      .ink { stroke:#1c2633; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#1c2633; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .rider { transform-box:fill-box; transform-origin:center bottom; animation:bob .8s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0) rotate(-1deg); } to { transform:translateY(-5px) rotate(1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff3a6" opacity=".9"/>
  <path d="M0 300 Q120 245 250 292 T520 285 T800 270 V410 H0Z" fill="#8ecb8f"/>
  <path d="M0 350 Q160 315 320 350 T650 340 T800 330 V430 H0Z" fill="#5ca875"/>
  <path d="M0 405 Q180 380 370 405 T800 395 V600 H0Z" fill="url(#road)"/>
  <path d="M0 465 Q200 440 400 465 T800 455" fill="none" stroke="#f6d56a" stroke-width="8" stroke-dasharray="38 26"/>

  <g filter="url(#shadow)">
    <rect x="38" y="30" width="724" height="95" rx="22" fill="#fff7dc" class="ink"/>
    <text x="400" y="74" text-anchor="middle" class="label" font-size="36" font-weight="900">THE PELICAN PEDAL EXPRESS</text>
    <text x="400" y="106" text-anchor="middle" class="label" font-size="18" font-weight="700">“Why fly when you can wobble with confidence?”</text>
  </g>

  <g class="rider">
    <!-- bicycle frame -->
    <g class="ink" fill="none">
      <path d="M230 440 L335 440 L292 350 Z"/>
      <path d="M335 440 L405 345 L292 350"/>
      <path d="M292 350 L265 318"/>
      <path d="M405 345 L438 325"/>
      <path d="M438 325 L460 330"/>
      <path d="M265 318 L248 318"/>
    </g>

    <!-- wheels -->
    <g class="wheel" fill="none" class="ink">
      <circle cx="230" cy="440" r="70" stroke="#1c2633" stroke-width="8" fill="#d9f3ff"/>
      <circle cx="230" cy="440" r="7" fill="#1c2633"/>
      <path d="M230 370V510 M160 440H300 M180 390L280 490 M280 390L180 490" stroke="#5b7d94" stroke-width="3"/>
    </g>
    <g class="wheel" fill="none">
      <circle cx="405" cy="440" r="70" stroke="#1c2633" stroke-width="8" fill="#d9f3ff"/>
      <circle cx="405" cy="440" r="7" fill="#1c2633"/>
      <path d="M405 370V510 M335 440H475 M355 390L455 490 M455 390L355 490" stroke="#5b7d94" stroke-width="3"/>
    </g>

    <!-- crank and pedals -->
    <g class="pedal">
      <circle cx="335" cy="440" r="13" fill="#f7b733" class="ink"/>
      <path d="M335 440 L362 418 M335 440 L309 462" class="ink"/>
      <path d="M359 414 l15 4 M305 459 l-15 4" class="ink"/>
    </g>

    <!-- pelican body -->
    <ellipse cx="330" cy="270" rx="73" ry="91" fill="#f4f0df" class="ink"/>
    <path d="M276 290 Q328 322 378 287 Q363 350 311 346 Q278 334 276 290Z" fill="#d9d1bd" class="ink"/>
    <path d="M302 233 Q328 201 363 220 Q390 236 378 275 Q353 299 316 278Z" fill="#fffdf3" class="ink"/>
    <!-- wing -->
    <path d="M303 267 Q350 251 375 286 Q346 312 305 299Z" fill="#c9c2af" class="ink"/>
    <!-- head and beak -->
    <ellipse cx="335" cy="185" rx="57" ry="52" fill="#f8f3df" class="ink"/>
    <path d="M365 185 Q432 180 487 207 Q432 232 363 213 Q349 202 365 185Z" fill="#f2a63b" class="ink"/>
    <path d="M369 206 Q433 211 480 208" fill="none" stroke="#9c5425" stroke-width="4"/>
    <circle cx="348" cy="176" r="9" fill="#1c2633"/>
    <circle cx="351" cy="173" r="3" fill="#fff"/>
    <path d="M315 141 Q330 121 350 139" fill="none" class="ink"/>
    <!-- feet -->
    <path d="M302 341 L286 382 M354 340 L374 380" class="ink"/>
    <path d="M278 383 Q293 374 307 384 M366 382 Q380 372 395 383" fill="none" class="ink"/>
    <!-- rider helmet -->
    <path d="M292 143 Q331 108 370 141 L372 154 L292 154Z" fill="#ef5964" class="ink"/>
    <path d="M302 151 H364" class="ink"/>
    <!-- absurd fish cargo -->
    <g transform="translate(395 245) rotate(-8)">
      <path d="M0 0 Q55 -35 112 0 Q55 35 0 0Z" fill="#8bd3d0" class="ink"/>
      <path d="M112 0 L143 -25 L137 0 L143 25Z" fill="#6fb7bc" class="ink"/>
      <circle cx="24" cy="-5" r="5" fill="#1c2633"/>
      <path d="M55 -25 Q70 0 55 25" fill="none" stroke="#378d99" stroke-width="4"/>
      <text x="45" y="8" class="label" font-size="13" font-weight="900">FISH</text>
    </g>
    <path d="M377 270 Q407 265 424 254" fill="none" class="ink"/>
  </g>

  <g class="label" font-weight="700">
    <text x="90" y="190" font-size="20" fill="#28566b">LOCAL NEWS:</text>
    <text x="90" y="216" font-size="16">Bird insists this is</text>
    <text x="90" y="238" font-size="16">“peak transportation.”</text>
    <path d="M195 250 Q228 270 270 285" fill="none" stroke="#28566b" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="48" y="540" width="704" height="42" rx="12" fill="#fff7dc" class="ink"/>
    <text x="400" y="567" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 14:02:26 SGT (UTC+08:00)</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#28566b"/>
    </marker>
  </defs>
</svg>