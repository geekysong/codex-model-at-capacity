<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican on a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle while carrying fish in its enormous bill pouch. Both wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M75 8V142M8 75H142M28 28L122 122M28 122L122 28" stroke="#739393" stroke-width="3"/>
    </pattern>
    <g id="wheel">
      <circle r="74" fill="#f7f5df" stroke="#243940" stroke-width="12"/>
      <circle r="65" fill="none" stroke="#adc6be" stroke-width="3"/>
      <g stroke="#739393" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <path d="M-15-68L8-68" stroke="#ffb62f" stroke-width="7" stroke-linecap="round"/>
      <circle r="9" fill="#243940"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5d8"/>
  <path d="M0 335Q145 270 285 330T580 315T800 325V482H0Z" fill="#d9e7c6"/>
  <circle cx="699" cy="154" r="41" fill="#ffd36a"/>
  <g fill="#fffdf1">
    <path d="M58 190Q40 164 67 156Q72 129 99 145Q123 125 140 152Q174 150 173 175Q174 192 152 192Z"/>
    <path d="M519 179Q502 157 524 148Q530 126 551 138Q571 118 589 141Q619 135 626 163Q628 180 606 180Z"/>
  </g>

  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#243940">TOUR DE FISH</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#a54c32">BIG BILL. TINY BIKE. ZERO SHAME.</text>

  <!-- Speech balloon stays still for readability. -->
  <path d="M79 220Q66 220 66 204V143Q66 127 83 127H274Q290 127 290 143V201Q290 218 274 218H248L262 244L220 220Z" fill="#fffef6" stroke="#243940" stroke-width="3"/>
  <text x="178" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#243940">
    <tspan x="178">“It's not cargo.</tspan>
    <tspan x="178" dy="27">It's my lunch break.”</tspan>
  </text>

  <path d="M0 464H800" stroke="#9bb59a" stroke-width="4"/>
  <ellipse cx="414" cy="466" rx="240" ry="13" fill="#243940" opacity=".12"/>

  <!-- Spinning wheels. -->
  <g transform="translate(260 386)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(566 386)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ridiculously small racing bicycle. -->
  <g stroke="#243940" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 386L337 279L402 386H260L510 281L402 386M510 281L566 386" fill="none" stroke-width="13"/>
    <path d="M260 386L337 279L402 386H260L510 281L402 386M510 281L566 386" fill="none" stroke="#ed684d" stroke-width="7"/>
    <path d="M337 279L326 250M510 281L499 245L532 233Q550 230 550 245" fill="none" stroke-width="8"/>
    <path d="M302 251H351" stroke-width="13"/>
    <path d="M498 245L529 235" stroke="#66a8a0" stroke-width="9"/>
    <circle cx="402" cy="386" r="16" fill="#ffe5a2" stroke-width="4"/>
    <path d="M264 386H402" stroke-width="3"/>
  </g>

  <!-- Rider bobs gently above the frame. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <g stroke="#243940" stroke-width="4" stroke-linejoin="round">
      <path d="M306 259L271 242L280 274L258 276L302 295" fill="#fffdf2"/>
      <path d="M321 264Q343 299 367 320L390 367" fill="none" stroke="#d99028" stroke-width="12">
        <animate attributeName="d" values="M321 264Q343 299 367 320L390 367;M321 264Q337 303 352 332L414 402;M321 264Q343 299 367 320L390 367" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M295 218Q310 185 364 199Q402 216 399 251Q390 291 345 290Q302 285 295 218Z" fill="#fffdf2"/>
      <path d="M302 221Q331 201 373 226L386 267Q346 295 312 268Z" fill="#299c9b"/>
      <path d="M318 229Q350 219 374 243L357 264Q331 266 318 229Z" fill="#fffdf2"/>
      <path d="M371 240Q407 257 441 242L499 243" fill="none" stroke="#243940" stroke-width="18"/>
      <path d="M371 240Q407 257 441 242L499 243" fill="none" stroke="#fffdf2" stroke-width="11"/>
      <path d="M363 212Q405 188 398 162Q388 129 418 125Q451 126 443 167Q434 201 412 230L394 254" fill="#fffdf2"/>
      <!-- Vast orange pouch containing visibly unimpressed fish. -->
      <path d="M439 165L635 181Q591 255 488 231Q457 215 439 165Z" fill="#f5ba4c"/>
      <path d="M441 161L642 176Q652 178 641 185L442 180Z" fill="#ffc960"/>
      <path d="M454 183Q486 204 503 210" fill="none" stroke="#e39430" stroke-width="3"/>
      <path d="M503 210Q526 188 554 210Q529 232 503 210L490 199V221Z" fill="#72b8b2" stroke-width="2.5"/>
      <circle cx="543" cy="208" r="3" fill="#243940" stroke="none"/>
      <path d="M563 202Q582 186 603 198Q583 218 563 202L552 195L554 212Z" fill="#91c5c1" stroke-width="2.5"/>
      <circle cx="594" cy="198" r="2.5" fill="#243940" stroke="none"/>
      <circle cx="429" cy="151" r="10" fill="white"/>
      <circle cx="433" cy="152" r="4" fill="#243940" stroke="none"/>
      <path d="M418 137L439 141" fill="none" stroke-width="4"/>
      <!-- Racing helmet. -->
      <path d="M395 134Q391 103 420 102Q448 101 455 130Z" fill="#ed684d"/>
      <path d="M407 109L408 127M421 108L424 127M434 110L440 127" fill="none" stroke-width="4"/>
      <path d="M391 134L458 130" fill="none" stroke-width="6"/>
      <path d="M348 279Q379 290 393 321L414 402" fill="none" stroke="#efac35" stroke-width="13">
        <animate attributeName="d" values="M348 279Q379 290 393 321L414 402;M348 279Q394 281 413 311L390 367;M348 279Q379 290 393 321L414 402" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="344" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#243940" transform="rotate(12 344 247)">07</text>
  </g>

  <g transform="translate(402 386)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="55" to="415" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-23 0H23" stroke="#243940" stroke-width="6" stroke-linecap="round"/>
      <path d="M23-12V12M-23-12V12" stroke="#d99028" stroke-width="10" stroke-linecap="round"/>
      <circle r="5" fill="#243940"/>
    </g>
  </g>

  <g fill="none" stroke="#568c89" stroke-width="3" stroke-linecap="round">
    <path d="M182 292H221M169 307H207M191 322H218"/>
    <path d="M465 127Q476 118 476 111M478 144L492 138"/>
  </g>

  <rect x="0" y="491" width="800" height="109" fill="#243940"/>
  <text x="400" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff5d8">He heard cycling would help shrink his bill.</text>
  <path d="M135 547H665" stroke="#71898b"/>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff5d8">2026-10-25 23:30:01 SGT (UTC+08:00)</text>
</svg>