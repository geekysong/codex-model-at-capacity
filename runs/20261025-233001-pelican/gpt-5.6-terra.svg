    <path d="M250 400 L350 286 L430 400 Z"/>
    <path d="M350 286 L485 275 L525 400"/>
    <path d="M485 275 L510 225 L548 225"/>
    <path d="M335 285 L310 255 L270 255"/>
    <path d="M430 400 L405 387"/>
  </g>
  <path d="M274 249 L318 249" stroke="#24304c" stroke-width="13" stroke-linecap="round"/>
  <path d="M542 221 q31-19 39 8" fill="none" stroke="#24304c" stroke-width="9" stroke-linecap="round"/>

  <g class="rider" stroke="#24304c" stroke-linejoin="round">
    <path d="M358 292 Q346 214 405 175 Q468 163 476 245 L453 315Z" fill="#f7f5eb" stroke-width="7"/>
    <path d="M362 239 Q328 180 354 128 Q376 89 423 116 Q450 138 427 181 L403 225Z" fill="#f7f5eb" stroke-width="7"/>
    <path d="M393 122 Q414 84 454 106 Q477 123 462 149 Q446 164 414 151Z" fill="#f7f5eb" stroke-width="7"/>
    <circle cx="416" cy="142" r="8" fill="#24304c" stroke="none"/>
    <circle cx="419" cy="139" r="2.5" fill="#fff" stroke="none"/>
