    <path d="M372 247 Q335 265 315 305" fill="none" stroke="#f7f5eb" stroke-width="18" stroke-linecap="round"/>
    <path d="M452 249 Q486 258 506 230" fill="none" stroke="#f7f5eb" stroke-width="18" stroke-linecap="round"/>
    <path d="M314 307 q-20 14 -34 3" fill="none" stroke="#f6a734" stroke-width="11" stroke-linecap="round"/>
    <path d="M507 231 q18 7 29-4" fill="none" stroke="#f6a734" stroke-width="11" stroke-linecap="round"/>
  </g>

  <g class="leg" stroke="#24304c" stroke-linecap="round" stroke-linejoin="round">
