    <path d="M414 289 L405 387 L354 350" fill="none" stroke="#f7f5eb" stroke-width="18"/>
    <path d="M355 349 q-23-5-34 8" fill="none" stroke="#f6a734" stroke-width="13"/>
  </g>

  <g transform="rotate(-8 294 178)" stroke="#24304c" stroke-width="5">
    <path d="M296 179 Q228 126 181 170 Q212 232 292 207Z" fill="#f6a734"/>
    <path d="M196 165 L165 130 L219 146 L230 113 L259 151" fill="none"/>
    <text x="198" y="198" font-family="sans-serif" font-size="15" font-weight="bold" fill="#24304c" stroke="none">EGGS</text>
  </g>

  <g font-family="sans-serif" fill="#24304c">
    <path d="M639 274 q27-25 53 2 q-22 20-51 8" fill="#fff" stroke="#24304c" stroke-width="4"/>
    <circle cx="666" cy="275" r="3" fill="#24304c"/>
    <text x="608" y="323" font-size="16" font-weight="bold">“HE’S GOT A BAG!”</text>
  </g>

  <rect y="518" width="800" height="82" fill="#24304c"/>
  <text x="400" y="550" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffe67a">A bicycle: the only vehicle where “carry-on luggage” becomes a lifestyle.</text>
  <text x="400" y="579" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">2026-10-25 23:33:04 SGT (UTC+08:00)</text>
</svg>