<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle with wildly oversized cargo in its beak.</desc>
  <style>
    .wheel { animation: spin 1.3s linear infinite; transform-box: fill-box; transform-origin: center; }
    .rider { animation: bob .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center bottom; }
    .leg { animation: pedal .65s linear infinite; transform-box: fill-box; transform-origin: 405px 388px; }
    .leg2 { animation: pedal  .65s linear infinite reverse; transform-box: fill-box; transform-origin: 405px 388px; }
    .dust { animation: puff 1s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes puff { 0% { opacity: .9; transform: translateX(0) scale(.5); } 100% { opacity: 0; transform: translateX(-38px) scale(1.5); } }
  </style>

  <rect width="800" height="600" fill="#9ee6f2"/>
  <path d="M0 322 Q115 270 220 318 T440 300 T650 314 T800 280 V470 H0Z" fill="#7dcb72"/>
  <path d="M0 410 Q180 365 350 412 T800 390 V500 H0Z" fill="#f6d465"/>
  <path d="M0 455 Q180 430 340 459 T800 445 V500 H0Z" fill="#d3a44f"/>
  <circle cx="95" cy="92" r="45" fill="#ffe67a"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="270" cy="100" rx="55" ry="18"/><ellipse cx="315" cy="95" rx="42" ry="22"/>
    <ellipse cx="625" cy="142" rx="65" ry="19"/><ellipse cx="680" cy="135" rx="40" ry="25"/>
  </g>

  <text x="400" y="64" text-anchor="middle" font-family="Impact, sans-serif" font-size="42" fill="#24304c" stroke="#fff" stroke-width="4" paint-order="stroke">PELICAN PEDAL PANIC!</text>
  <text x="400" y="94" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#24304c">“I said I’d carry the groceries. Nobody asked how.”</text>

  <g class="dust" fill="#f4e3af">
    <circle cx="155" cy="420" r="12"/><circle cx="128" cy="432" r="8"/><circle cx="105" cy="425" r="5"/>
  </g>

  <g class="wheel" stroke="#24304c" stroke-width="7" fill="none">
    <circle cx="250" cy="400" r="75" fill="#d9edf1"/>
    <path d="M250 325V475M175 400H325M197 347L303 453M303 347L197 453"/>
    <circle cx="250" cy="400" r="10" fill="#f25c54"/>
  </g>
  <g class="wheel" stroke="#24304c" stroke-width="7" fill="none">
    <circle cx="525" cy="400" r="75" fill="#d9edf1"/>
    <path d="M525 325V475M450 400H600M472 347L578 453M578 347L472 453"/>
    <circle cx="525" cy="400" r="10" fill="#f25c54"/>
  </g>

