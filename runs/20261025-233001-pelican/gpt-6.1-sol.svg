      <path d="M-35 0H35" stroke="#263744" stroke-width="7"/>
      <path d="M-35-9V9M35-9V9" stroke="#263744" stroke-width="12"/>
    </g>
    <circle r="5" fill="#263744"/>
  </g>

  <g font-family="Arial, sans-serif">
    <path d="M70 117H243Q257 117 257 131V168Q257 182 243 182H176L154 204L158 182H70Q56 182 56 168V131Q56 117 70 117Z" fill="#fffdf5" stroke="#263744" stroke-width="3"/>
    <text x="156" y="144" text-anchor="middle" font-size="18" font-weight="bold" fill="#263744">“I commute</text>
    <text x="156" y="167" text-anchor="middle" font-size="18" font-weight="bold" fill="#263744">on fish fuel.”</text>
  </g>

  <rect y="521" width="800" height="79" fill="#263744"/>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff8e7">His carbon footprint is tiny. His lunch overhang is not.</text>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#f9ca69">2026-10-25 23:31:35 SGT (UTC+08:00)</text>
</svg>