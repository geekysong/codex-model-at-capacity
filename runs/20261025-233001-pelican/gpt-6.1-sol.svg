<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Beak Hour Traffic</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish in its enormous bill pouch. The wheels spin, the pedals turn, and the pelican bobs in a seamless loop.</desc>
  <defs>
    <pattern id="sky" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#ded8c5"/>
    </pattern>
    <g id="wheel">
      <circle r="83" fill="#fffdf5" stroke="#263744" stroke-width="10"/>
      <circle r="72" fill="none" stroke="#a5b3af" stroke-width="2"/>
      <g stroke="#637b82" stroke-width="3">
        <path d="M-74 0H74M0-74V74M-52-52L52 52M-52 52L52-52"/>
      </g>
      <circle r="10" fill="#f9bb43" stroke="#263744" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff8e7"/>
  <rect y="100" width="800" height="414" fill="#f4edda"/>
  <rect y="100" width="800" height="414" fill="url(#sky)"/>
  <path d="M0 410Q170 385 330 412T800 403V514H0Z" fill="#d4dfcb"/>
  <circle cx="695" cy="167" r="38" fill="#f9c95c"/>
  <path d="M60 174q15-17 30 0q15-17 30 0M595 216q12-14 24 0q12-14 24 0" fill="none" stroke="#9bafa4" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="2" fill="#263744">BEAK HOUR TRAFFIC</text>
  <text x="400" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586761">One bird. Two wheels. Absolutely no lane discipline.</text>

  <g transform="translate(640 270)">
    <path d="M0 12V172" stroke="#63746c" stroke-width="8"/>
    <rect x="-58" y="-28" width="116" height="74" rx="10" fill="#fffdf5" stroke="#263744" stroke-width="4"/>
    <text x="0" y="1" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#263744">BIKE LANE</text>
    <text x="0" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b14b40">BILL LIMIT: 1 m</text>
  </g>

  <ellipse cx="351" cy="478" rx="239" ry="15" fill="#71857b" opacity=".19"/>
  <path d="M40 482H760" stroke="#536c65" stroke-width="4"/>
  <g stroke="#fff8e7" stroke-width="6">
    <path d="M35 505H130M210 505H305M385 505H480M560 505H655M735 505H790"/>
  </g>

  <g transform="translate(223 390)">
