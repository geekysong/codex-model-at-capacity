    <path d="M311 257L347 303L379 411" fill="none" stroke="#e9a13b" stroke-width="10" stroke-linecap="round">
      <animate attributeName="d" values="M311 257L347 303L379 411;M311 257L304 313L325 369;M311 257L347 303L379 411" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(352 390)">
    <circle r="19" fill="#f7bd43" stroke="#263744" stroke-width="4"/>
    <g>
