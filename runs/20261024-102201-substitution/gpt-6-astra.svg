<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e7"/>
      <stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset="1" stop-color="#e8a928"/>
    </linearGradient>
    <linearGradient id="cheap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e0ea"/>
      <stop offset="1" stop-color="#7e8b99"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#23344d" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 470 Q200 420 400 470 T800 460 V600 H0Z" fill="#b8d5ec" opacity=".55"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="34" font-weight="900" fill="#17253d">PREMIUM MODEL</text>
  <text x="400" y="99" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="25" font-weight="800" fill="#d33b32">★ GUARANTEED ★</text>

  <!-- sales booth -->
  <rect x="54" y="145" width="692" height="330" rx="24" fill="#fff" stroke="#17253d" stroke-width="6" filter="url(#shadow)"/>
  <rect x="54" y="145" width="692" height="64" rx="22" fill="#ef4c45"/>
  <text x="400" y="188" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="25" font-weight="900" fill="#fff">THE FUTURE OF INTELLIGENCE</text>

  <!-- left premium display -->
  <rect x="91" y="244" width="282" height="183" rx="16" fill="#edf5ff" stroke="#17253d" stroke-width="5"/>
  <text x="232" y="273" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="18" font-weight="900" fill="#17253d">WHAT YOU ORDERED</text>
  <rect x="157" y="295" width="151" height="104" rx="20" fill="url(#gold)" stroke="#9b6716" stroke-width="5"/>
  <circle cx="195" cy="335" r="12" fill="#17253d"/>
  <circle cx="270" cy="335" r="12" fill="#17253d"/>
  <path d="M194 365 Q232 390 271 365" fill="none" stroke="#17253d" stroke-width="8" stroke-linecap="round"/>
  <path d="M232 294 V276 M212 282 L232 265 L252 282" fill="none" stroke="#9b6716" stroke-width="6"/>
  <text x="232" y="419" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="15" font-weight="800" fill="#8a5a10">TITANIUM THINKER X</text>

  <!-- curtain -->
  <path d="M393 215 Q423 240 409 270 T416 324 T407 378 T424 443 L500 443 Q478 402 493 360 T484 292 T502 215Z"
        fill="#b92532" stroke="#7e1c27" stroke-width="5"/>
  <path d="M427 218 Q450 252 439 285 T446 345 T439 405 T452 443" fill="none" stroke="#e76a67" stroke-width="8"/>
  <path d="M467 218 Q490 252 479 285 T486 345 T479 405 T492 443" fill="none" stroke="#7e1c27" stroke-width="8"/>
  <text x="451" y="475" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="15" font-weight="900" fill="#7e1c27">*quiet substitution*</text>

  <!-- right cheap display -->
  <rect x="496" y="244" width="216" height="183" rx="16" fill="#f5f7fa" stroke="#17253d" stroke-width="5"/>
  <text x="604" y="273" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="18" font-weight="900" fill="#17253d">WHAT ARRIVED</text>
  <rect x="550" y="303" width="108" height="85" rx="14" fill="url(#cheap)" stroke="#536171" stroke-width="5"/>
  <circle cx="578" cy="336" r="9" fill="#26313d"/>
  <circle cx="630" cy="336" r="9" fill="#26313d"/>
  <path d="M578 365 Q604 350 630 365" fill="none" stroke="#26313d" stroke-width="6" stroke-linecap="round"/>
  <path d="M604 303 V286 M587 294 L604 280 L621 294" fill="none" stroke="#536171" stroke-width="5"/>
  <text x="604" y="419" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="15" font-weight="900" fill="#536171">BUDGET BOT 2.0</text>

  <!-- salesperson -->
  <circle cx="703" cy="119" r="28" fill="#f2c19b" stroke="#17253d" stroke-width="4"/>
  <path d="M679 112 Q702 79 727 111" fill="#49342d" stroke="#17253d" stroke-width="4"/>
  <path d="M678 153 Q703 135 728 153 L735 218 H670Z" fill="#ef4c45" stroke="#17253d" stroke-width="4"/>
  <path d="M719 160 L754 177" stroke="#17253d" stroke-width="7" stroke-linecap="round"/>
  <path d="M750 174 l18 4 -13 12" fill="none" stroke="#17253d" stroke-width="5"/>
  <text x="648" y="112" text-anchor="end" font-family="Arial,Helvetica,sans-serif"
        font-size="16" font-weight="800" fill="#17253d">“Same vibes!”</text>

  <!-- customer -->
  <circle cx="109" cy="526" r="25" fill="#f2c19b" stroke="#17253d" stroke-width="4"/>
  <path d="M85 518 Q109 487 133 518" fill="#49342d" stroke="#17253d" stroke-width="4"/>
  <path d="M84 559 Q109 540 134 559" fill="#4d83b5" stroke="#17253d" stroke-width="4"/>
  <path d="M129 518 l32 10" stroke="#17253d" stroke-width="5"/>
  <path d="M158 527 q18 5 29 -7" fill="none" stroke="#17253d" stroke-width="5"/>
  <text x="204" y="550" font-family="Arial,Helvetica,sans-serif"
        font-size="21" font-weight="900" fill="#17253d">“I paid for the rocket.”</text>

  <rect x="260" y="520" width="470" height="51" rx="25" fill="#17253d"/>
  <text x="495" y="553" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
        font-size="20" font-weight="900" fill="#fff">…and got a paper airplane.</text>
</svg>