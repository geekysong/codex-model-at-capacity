<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#f2e5c7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff08a"/>
      <stop offset=".45" stop-color="#f5bd32"/>
      <stop offset="1" stop-color="#b96c0b"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a80732"/>
      <stop offset=".5" stop-color="#ef4264"/>
      <stop offset="1" stop-color="#8c092d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#5e3b25" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#27232a;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#27232a}
      .bold{font-weight:900}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 470 Q200 430 400 470 T800 460 V600 H0Z" fill="#d8c29e"/>
  <path d="M0 487 Q190 450 400 486 T800 480" fill="none" stroke="#b49a70" stroke-width="4"/>

  <!-- title -->
  <text x="400" y="58" text-anchor="middle" class="txt bold" font-size="34">PREMIUM MODEL™</text>
  <text x="400" y="94" text-anchor="middle" class="txt bold" font-size="23" fill="#b20d39">NOW WITH 100% MORE MARKETING</text>

  <!-- spotlight -->
  <path d="M175 125 L625 125 L715 470 L85 470Z" fill="#fff6c9" opacity=".55"/>
  <ellipse cx="400" cy="482" rx="275" ry="25" fill="#8c7658" opacity=".32"/>

  <!-- ornate premium cabinet -->
  <g filter="url(#shadow)">
    <rect x="175" y="155" width="450" height="300" rx="25" fill="#302c35" class="ink"/>
    <rect x="195" y="175" width="410" height="260" rx="18" fill="url(#gold)" class="ink"/>
    <rect x="215" y="195" width="370" height="220" rx="12" fill="#fff7cf" class="ink"/>
    <path d="M215 250 H585 M215 360 H585" stroke="#d39b27" stroke-width="5"/>
    <circle cx="235" cy="220" r="8" fill="#ef4264" class="ink"/>
    <circle cx="265" cy="220" r="8" fill="#4fae67" class="ink"/>
    <circle cx="295" cy="220" r="8" fill="#4c91d8" class="ink"/>
    <text x="400" y="239" text-anchor="middle" class="txt bold" font-size="28">ULTRA-INTELLIGENCE</text>
    <text x="400" y="274" text-anchor="middle" class="txt bold" font-size="17" fill="#8c5b00">THE THINKING MACHINE OF TOMORROW</text>
    <rect x="248" y="292" width="304" height="47" rx="23" fill="#fff" class="ink"/>
    <text x="400" y="323" text-anchor="middle" class="txt bold" font-size="22">PREMIUM ACCESS</text>
    <text x="400" y="388" text-anchor="middle" class="txt bold" font-size="19" fill="#a80732">$99.99 / MONTH</text>
  </g>

  <!-- curtain pulled aside -->
  <path d="M205 180 Q260 205 285 260 Q300 330 270 425 L205 455Z" fill="url(#curtain)" class="ink"/>
  <path d="M595 180 Q540 205 515 260 Q500 330 530 425 L595 455Z" fill="url(#curtain)" class="ink"/>
  <path d="M225 193 Q260 240 247 420 M575 193 Q540 240 553 420" fill="none" stroke="#ff8ba0" stroke-width="6" opacity=".65"/>

  <!-- tiny weak model -->
  <g filter="url(#shadow)">
    <rect x="330" y="302" width="140" height="105" rx="12" fill="#9aa0aa" class="ink"/>
    <rect x="345" y="317" width="110" height="65" rx="8" fill="#dce1e6" class="ink"/>
    <circle cx="380" cy="348" r="9" fill="#27232a"/>
    <circle cx="420" cy="348" r="9" fill="#27232a"/>
    <path d="M375 366 Q400 355 425 366" fill="none" class="ink"/>
    <path d="M362 407 L342 435 M438 407 L458 435" class="ink"/>
  </g>
  <text x="400" y="292" text-anchor="middle" class="txt bold" font-size="17" fill="#a80732">ACTUAL MODEL INSIDE</text>
  <text x="400" y="455" text-anchor="middle" class="txt bold" font-size="20">"I can autocomplete a grocery list."</text>

  <!-- salesman -->
  <g>
    <ellipse cx="675" cy="430" rx="67" ry="15" fill="#8c7658" opacity=".35"/>
    <circle cx="672" cy="213" r="38" fill="#f3bd8c" class="ink"/>
    <path d="M636 207 Q670 150 708 204 Q690 186 665 190 Q650 194 636 207Z" fill="#302c35" class="ink"/>
    <path d="M646 222 Q660 215 669 224 M681 224 Q691 215 700 221" fill="none" class="ink"/>
    <path d="M660 241 Q674 250 687 240" fill="none" class="ink"/>
    <path d="M625 272 Q672 250 719 272 L738 422 Q672 447 606 422Z" fill="#3d6bb3" class="ink"/>
    <path d="M650 270 L672 303 L694 270" fill="#fff" class="ink"/>
    <path d="M672 303 L672 412" stroke="#27232a" stroke-width="4"/>
    <path d="M614 292 L570 355" class="ink"/>
    <path d="M730 292 L772 250" class="ink"/>
    <path d="M770 250 L782 260" class="ink"/>
    <path d="M770 250 L768 236" class="ink"/>
    <path d="M770 250 L756 251" class="ink"/>
    <text x="672" y="470" text-anchor="middle" class="txt bold" font-size="18">SALESMAN</text>
  </g>

  <!-- customer -->
  <g>
    <ellipse cx="125" cy="480" rx="62" ry="13" fill="#8c7658" opacity=".35"/>
    <circle cx="125" cy="350" r="34" fill="#9b603e" class="ink"/>
    <path d="M94 343 Q125 300 157 343 Q145 328 125 328 Q106 328 94 343Z" fill="#302c35" class="ink"/>
    <circle cx="114" cy="354" r="5" fill="#27232a"/>
    <circle cx="137" cy="354" r="5" fill="#27232a"/>
    <path d="M112 370 Q125 378 139 369" fill="none" class="ink"/>
    <path d="M82 405 Q125 380 168 405 L184 477 L66 477Z" fill="#5a9d68" class="ink"/>
    <path d="M93 419 L54 450 M157 419 L205 439" class="ink"/>
    <path d="M45 445 Q31 455 45 466 Q59 476 68 462" fill="#f3bd8c" class="ink"/>
    <path d="M200 434 Q214 428 220 441 Q225 454 209 460" fill="#f3bd8c" class="ink"/>
    <text x="125" y="510" text-anchor="middle" class="txt bold" font-size="18">CUSTOMER</text>
  </g>

  <!-- speech bubbles -->
  <path d="M92 276 Q38 245 68 205 Q100 171 162 197 Q200 215 176 250 Q160 273 130 274 L112 294Z" fill="#fff" class="ink"/>
  <text x="121" y="222" text-anchor="middle" class="txt bold" font-size="16">I PAID FOR</text>
  <text x="121" y="244" text-anchor="middle" class="txt bold" font-size="16">THE BIG BRAIN!</text>

  <path d="M708 148 Q760 119 783 157 Q801 190 767 212 Q744 225 719 209 L700 224 L704 201 Q682 180 708 148Z" fill="#fff" class="ink"/>
  <text x="743" y="170" text-anchor="middle" class="txt bold" font-size="15">IT'S JUST</text>
  <text x="743" y="190" text-anchor="middle" class="txt bold" font-size="15">RESTING.</text>

  <!-- caption -->
  <rect x="205" y="532" width="390" height="43" rx="21" fill="#27232a"/>
  <text x="400" y="560" text-anchor="middle" fill="#fff" class="txt bold" font-size="18">BAIT. SWITCH. BILL. REPEAT.</text>
</svg>