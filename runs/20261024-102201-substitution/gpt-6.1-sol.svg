<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f7f1df"/>
  <rect x="24" y="22" width="752" height="556" rx="22" fill="#fffaf0" stroke="#222" stroke-width="5"/>
  
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#222">
    PREMIUM MODEL™
  </text>
  <text x="400" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#d33">
    “The smartest answer in the room!”
  </text>

  <!-- salesman booth -->
  <rect x="55" y="145" width="690" height="315" rx="18" fill="#d9ecff" stroke="#222" stroke-width="5"/>
  <rect x="55" y="145" width="690" height="58" rx="18" fill="#3489d1" stroke="#222" stroke-width="5"/>
  <text x="400" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="white">
    SERVICE COUNTER
  </text>

  <!-- customer -->
  <circle cx="170" cy="300" r="45" fill="#f0b27a" stroke="#222" stroke-width="5"/>
  <path d="M125 291 Q170 245 215 291 Q205 258 170 252 Q135 258 125 291" fill="#5a3525" stroke="#222" stroke-width="5"/>
  <circle cx="153" cy="305" r="5" fill="#222"/>
  <circle cx="187" cy="305" r="5" fill="#222"/>
  <path d="M150 325 Q170 340 190 325" fill="none" stroke="#222" stroke-width="4"/>
  <path d="M116 390 Q170 350 224 390 L235 458 L105 458 Z" fill="#5b8bd9" stroke="#222" stroke-width="5"/>
  <text x="170" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="white">CUSTOMER</text>

  <!-- salesman -->
  <circle cx="630" cy="285" r="43" fill="#f0b27a" stroke="#222" stroke-width="5"/>
  <path d="M586 275 Q630 225 674 275 Q665 238 630 238 Q595 238 586 275" fill="#202b43" stroke="#222" stroke-width="5"/>
  <circle cx="615" cy="290" r="5" fill="#222"/>
  <circle cx="646" cy="290" r="5" fill="#222"/>
  <path d="M610 310 Q630 325 651 310" fill="none" stroke="#222" stroke-width="4"/>
  <path d="M575 375 Q630 340 685 375 L700 458 L560 458 Z" fill="#d94b45" stroke="#222" stroke-width="5"/>
  <text x="630" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="white">MARKETING</text>

  <!-- speech bubble bait -->
  <path d="M215 218 Q300 155 430 205 Q470 220 435 265 Q350 292 245 260 L215 280 L225 252 Q195 240 215 218Z" fill="white" stroke="#222" stroke-width="5"/>
  <text x="325" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="900" fill="#222">Here is your</text>
  <text x="325" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#d33">ULTRA-PREMIUM AI!</text>

  <!-- hidden trapdoor -->
  <rect x="300" y="385" width="205" height="72" rx="10" fill="#ffe082" stroke="#222" stroke-width="5"/>
  <text x="402" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#222">ACTUAL MODEL</text>
  <text x="402" y="441" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#d33">“MAYBE-2B”</text>
  <path d="M402 365 L402 385" stroke="#222" stroke-width="5" stroke-dasharray="8 7"/>

  <!-- weak robot -->
  <rect x="344" y="475" width="116" height="73" rx="18" fill="#9ba3ad" stroke="#222" stroke-width="5"/>
  <rect x="361" y="492" width="82" height="38" rx="8" fill="#dff7ff" stroke="#222" stroke-width="4"/>
  <circle cx="380" cy="511" r="6" fill="#d33"/>
  <circle cx="424" cy="511" r="6" fill="#d33"/>
  <path d="M383 522 Q402 516 421 522" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M402 475 L402 461" stroke="#222" stroke-width="5"/>
  <circle cx="402" cy="456" r="7" fill="#d33" stroke="#222" stroke-width="3"/>
  <text x="402" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#222">“I can summarize...”</text>

  <!-- fine print -->
  <text x="400" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#555">
    *Premium branding may contain budget intelligence.
  </text>

  <!-- caption -->
  <rect x="88" y="120" width="185" height="34" rx="10" fill="#ffe082" stroke="#222" stroke-width="4"/>
  <text x="180" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#222">BAIT</text>
  <path d="M273 137 L292 137" stroke="#222" stroke-width="5"/>
  <rect x="525" y="120" width="185" height="34" rx="10" fill="#ff9d8f" stroke="#222" stroke-width="4"/>
  <text x="617" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#222">SWITCH</text>
  
  <text x="400" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="900" fill="#222">
    Same shiny promise. Smaller brain.
  </text>
</svg>