<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8df"/>
      <stop offset="1" stop-color="#f5e7c3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset=".45" stop-color="#ffc928"/>
      <stop offset="1" stop-color="#d88900"/>
    </linearGradient>
    <linearGradient id="tin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e0e5"/>
      <stop offset=".5" stop-color="#8e9aa4"/>
      <stop offset="1" stop-color="#4f5962"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#5b3d25" flood-opacity=".28"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#d6b76a" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="18" y="18" width="764" height="564" rx="28" fill="none" stroke="#3b2b22" stroke-width="5"/>
  <rect x="30" y="30" width="740" height="540" rx="22" fill="url(#dots)" opacity=".55"/>

  <text x="400" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#2d201c" letter-spacing="1">PREMIUM MODEL</text>
  <text x="400" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#c33b25">™ (TERMS MAY SHRINK)</text>

  <!-- stage -->
  <rect x="68" y="174" width="664" height="316" rx="18" fill="#fffdf4" stroke="#3b2b22" stroke-width="5" filter="url(#shadow)"/>
  <path d="M68 174 Q130 235 191 174 Q252 235 313 174 Q374 235 435 174 Q496 235 557 174 Q618 235 732 174 L732 228 L68 228Z" fill="#bd2e2e" stroke="#3b2b22" stroke-width="5"/>
  <path d="M68 174 Q130 235 191 174 Q252 235 313 174 Q374 235 435 174 Q496 235 557 174 Q618 235 732 174" fill="none" stroke="#f5bd3d" stroke-width="8"/>

  <!-- customer -->
  <g transform="translate(113 315)">
    <circle cx="44" cy="30" r="29" fill="#f0b486" stroke="#3b2b22" stroke-width="5"/>
    <path d="M19 24 Q22 -11 53 4 Q73 12 69 34 Q59 15 40 14 Q29 15 19 24Z" fill="#43332b" stroke="#3b2b22" stroke-width="4"/>
    <circle cx="35" cy="35" r="3" fill="#3b2b22"/>
    <circle cx="55" cy="35" r="3" fill="#3b2b22"/>
    <path d="M37 49 Q45 55 54 48" fill="none" stroke="#3b2b22" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 73 Q44 57 70 73 L82 143 L7 143Z" fill="#3f79b9" stroke="#3b2b22" stroke-width="5"/>
    <path d="M29 83 L59 83" stroke="#d6ecff" stroke-width="4"/>
    <path d="M72 94 Q104 85 123 105" fill="none" stroke="#f0b486" stroke-width="14" stroke-linecap="round"/>
    <path d="M118 104 L152 101" stroke="#3b2b22" stroke-width="5" stroke-linecap="round"/>
    <rect x="144" y="83" width="69" height="43" rx="7" fill="#f9fbff" stroke="#3b2b22" stroke-width="5"/>
    <text x="178" y="101" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#3b2b22">PREMIUM</text>
    <text x="178" y="117" text-anchor="middle" font-family="Arial" font-size="11" fill="#3b2b22">SUBSCRIBER</text>
    <path d="M152 101 Q180 78 205 101" fill="none" stroke="#f0b486" stroke-width="10"/>
  </g>

  <!-- grand premium robot sign -->
  <g transform="translate(474 240)" filter="url(#shadow)">
    <rect x="0" y="0" width="188" height="205" rx="25" fill="url(#gold)" stroke="#3b2b22" stroke-width="6"/>
    <path d="M94 -22 L94 0" stroke="#3b2b22" stroke-width="6"/>
    <circle cx="94" cy="-28" r="9" fill="#ffdf55" stroke="#3b2b22" stroke-width="5"/>
    <rect x="25" y="35" width="138" height="75" rx="17" fill="#fff4be" stroke="#3b2b22" stroke-width="5"/>
    <circle cx="65" cy="72" r="12" fill="#39a95b" stroke="#3b2b22" stroke-width="4"/>
    <circle cx="123" cy="72" r="12" fill="#39a95b" stroke="#3b2b22" stroke-width="4"/>
    <path d="M58 91 Q94 112 130 91" fill="none" stroke="#3b2b22" stroke-width="5" stroke-linecap="round"/>
    <text x="94" y="139" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#3b2b22">ULTRA</text>
    <text x="94" y="161" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#3b2b22">GENIUS MODE</text>
    <path d="M28 181 L160 181" stroke="#3b2b22" stroke-width="5"/>
    <text x="94" y="198" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#3b2b22">NOW WITH 100% MORE HYPE</text>
  </g>

  <!-- hidden cheap robot -->
  <g transform="translate(360 374)" filter="url(#shadow)">
    <path d="M25 37 L142 20 L158 151 L38 166Z" fill="url(#tin)" stroke="#3b2b22" stroke-width="6"/>
    <path d="M49 50 L131 39 L139 101 L57 112Z" fill="#252c33" stroke="#3b2b22" stroke-width="5"/>
    <circle cx="82" cy="77" r="7" fill="#e84b42"/>
    <circle cx="111" cy="73" r="7" fill="#e84b42"/>
    <path d="M78 95 Q103 88 123 94" fill="none" stroke="#e84b42" stroke-width="5"/>
    <path d="M83 18 L87 0" stroke="#3b2b22" stroke-width="5"/>
    <circle cx="89" cy="-5" r="6" fill="#e84b42" stroke="#3b2b22" stroke-width="4"/>
    <path d="M29 123 L5 136" stroke="#3b2b22" stroke-width="9" stroke-linecap="round"/>
    <path d="M145 112 L168 121" stroke="#3b2b22" stroke-width="9" stroke-linecap="round"/>
    <text x="99" y="137" text-anchor="middle" font-family="Arial" font-size="13" font-weight="900" fill="#fff">BUDGET BOT</text>
  </g>

  <!-- substitution arrow and labels -->
  <path d="M300 275 C347 232 407 226 458 258" fill="none" stroke="#c33b25" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12"/>
  <path d="M447 240 L465 258 L440 268" fill="none" stroke="#c33b25" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="359" y="218" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#c33b25">MARKETING</text>
  <text x="359" y="238" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#c33b25">MAGIC</text>

  <path d="M343 463 Q400 438 458 463" fill="none" stroke="#c33b25" stroke-width="5"/>
  <text x="400" y="486" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#c33b25">THE “MODEL UPDATE”</text>

  <!-- tiny fine print -->
  <text x="400" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#3b2b22">CAPTION: SAME PRICE. FEWER THOUGHTS.</text>
  <text x="400" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6e5548">*Premium appearance shown for illustration. Actual intelligence may be replaced by a smaller appliance.</text>
</svg>