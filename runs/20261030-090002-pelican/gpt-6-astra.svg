<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A determined pelican pedals a bicycle along a seaside path, carrying one tiny fish in an enormous beak pouch. Wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="water" width="90" height="28" patternUnits="userSpaceOnUse">
      <path d="M5 15q15-10 30 0t30 0" fill="none" stroke="#7abfc5" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#193e49">TOUR DE FISH</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="3" fill="#49646a">ONE BIRD. TWO WHEELS. ZERO AERODYNAMICS.</text>

  <rect x="24" y="108" width="752" height="382" rx="23" fill="#ccebea"/>
  <circle cx="105" cy="171" r="33" fill="#ffd166"/>
  <path d="M49 277Q220 254 384 276T751 270V385H49Z" fill="#9ed6d5"/>
  <path d="M24 294H776V385H24Z" fill="url(#water)"/>
  <path d="M24 366Q202 347 407 369T776 358V467Q776 490 753 490H47Q24 490 24 467Z" fill="#e3c798"/>
  <path d="M39 445H760" stroke="#fff4d9" stroke-width="5" stroke-dasharray="30 22"/>
  <ellipse cx="382" cy="459" rx="230" ry="13" fill="#9c865e" opacity=".22"/>

  <!-- Seaside race sign -->
  <path d="M696 297V407" stroke="#785f49" stroke-width="8"/>
  <path d="M643 277H728L747 298 728 319H643Z" fill="#fff4d9" stroke="#193e49" stroke-width="3"/>
  <text x="693" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#193e49">FINISH LINE</text>
  <text x="693" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#193e49">AT THE PIER</text>

  <!-- Wheels: rotation is local to each axle -->
  <g fill="#fff9e9" stroke="#193e49">
    <circle cx="234" cy="402" r="69" stroke-width="11"/>
    <circle cx="543" cy="402" r="69" stroke-width="11"/>
  </g>
  <g stroke="#68878a" stroke-width="3">
    <g transform="translate(234 402)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
        <path d="M-63 0H63M0-63V63M-45-45 45 45M-45 45 45-45"/>
        <path d="M0-63A63 63 0 0 1 45-45" fill="none" stroke="#f5b844" stroke-width="5"/>
      </g>
    </g>
    <g transform="translate(543 402)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
        <path d="M-63 0H63M0-63V63M-45-45 45 45M-45 45 45-45"/>
        <path d="M0-63A63 63 0 0 1 45-45" fill="none" stroke="#f5b844" stroke-width="5"/>
      </g>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M234 402 300 312 361 402 234 402M300 312H493L361 402M493 312 543 402" stroke="#193e49" stroke-width="13"/>
    <path d="M234 402 300 312 361 402 234 402M300 312H493L361 402M493 312 543 402" stroke="#ee6553" stroke-width="7"/>
    <path d="M300 312 290 290M493 312 481 276 510 263" stroke="#193e49" stroke-width="8"/>
    <path d="M510 263q23-2 20 15" stroke="#193e49" stroke-width="9"/>
    <path d="M270 289H318" stroke="#193e49" stroke-width="13"/>
    <path d="M234 402 361 390M234 402 361 414" stroke="#52686a" stroke-width="3"/>
  </g>

  <!-- Far leg -->
  <path d="M328 293 389 333 344 390" fill="none" stroke="#cf8b35" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M328 293 389 333 344 390;M328 293 375 351 378 414;M328 293 389 333 344 390" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Pelican and expressive head bob together -->
  <g stroke="#193e49" stroke-width="4" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".75s" repeatCount="indefinite"/>

    <path d="M290 265 239 235 252 278 283 285" fill="#fffdf0"/>
    <path d="M273 255Q288 209 344 218Q368 223 377 250Q393 272 369 296Q321 324 277 291Z" fill="#fffdf0"/>
    <path d="M312 243Q321 266 354 282Q318 298 295 276" fill="#d8e2dc"/>
    <path d="M353 249Q380 222 373 188Q370 159 391 147Q419 132 434 155Q446 178 428 199Q414 217 414 247Q409 278 372 289" fill="#fffdf0"/>

    <!-- Racing helmet -->
    <path d="M373 158Q371 124 402 122Q434 123 441 153Z" fill="#ef6554"/>
    <path d="M385 143 391 131M400 142 404 129M415 142 417 131" stroke="#fff4d9" stroke-width="5" stroke-linecap="round"/>
    <path d="M380 157 396 183 426 159" fill="none" stroke-width="3"/>

    <!-- Eye and fiercely ambitious eyebrow -->
    <circle cx="419" cy="165" r="11" fill="white"/>
    <circle cx="424" cy="166" r="4.5" fill="#193e49" stroke="none"/>
    <path d="M407 149 431 155" fill="none" stroke-width="5" stroke-linecap="round"/>

    <!-- Vast pouch, tiny passenger -->
    <path d="M430 177 611 190Q584 251 515 258Q458 261 430 177Z" fill="#f3b963"/>
    <path d="M431 174Q510 167 623 187L611 198 432 188Z" fill="#ffd56c"/>
    <path d="M453 199Q469 231 496 239" fill="none" stroke="#db9846" stroke-width="3"/>
    <g transform="translate(549 224)" stroke-width="2">
      <path d="M-21 0Q-5-17 15-1L27-10V11L15 4Q-5 19-21 0Z" fill="#73b8bd"/>
      <circle cx="-11" cy="-2" r="2.5" fill="#193e49" stroke="none"/>
      <path d="M-12 7-5 5" fill="none"/>
    </g>

    <!-- Wing holding the bars -->
    <path d="M351 246Q401 255 429 275L513 268Q518 279 506 282L425 289Q384 283 348 264" fill="#f8fbef"/>
    <path d="M496 270 498 281M503 269 506 280" fill="none" stroke-width="2"/>

    <!-- Race bib -->
    <path d="M278 259 312 266 307 293 274 286Z" fill="#fff4d9" stroke-width="2"/>
    <text x="293" y="283" text-anchor="middle" transform="rotate(11 293 278)" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#193e49" stroke="none">01</text>
  </g>

  <!-- Near leg and webbed foot pedal continuously -->
  <path d="M332 298 318 348 382 402" fill="none" stroke="#eda646" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M332 298 318 348 382 402;M332 298 301 360 361 423;M332 298 307 345 340 402;M332 298 335 341 361 381;M332 298 318 348 382 402" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <circle cx="361" cy="402" r="16" fill="#fff4d9" stroke="#193e49" stroke-width="4"/>
  <g transform="translate(361 402)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-21 0H21" stroke="#193e49" stroke-width="5"/>
      <g transform="translate(21 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
          <path d="M-7-8 13-5 23 3 9 6-12 3Z" fill="#f4b44e" stroke="#193e49" stroke-width="3"/>
          <path d="M-13 8H24" stroke="#193e49" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Static speech bubble keeps lettering readable -->
  <path d="M80 199Q67 199 67 185V134Q67 120 82 120H264Q279 120 279 135V185Q279 199 264 199H231L253 220 205 199Z" fill="#fffdf4" stroke="#193e49" stroke-width="3"/>
  <text x="173" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#193e49">“It's not cargo.</text>
  <text x="173" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#193e49">It's my coach.”</text>

  <path d="M143 329H177M124 344H166M145 359H171" stroke="#6a9698" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193e49">He bought a racing bike. The beak still sets the speed limit.</text>
  <path d="M55 544H745" stroke="#c5b99d" stroke-width="1.5"/>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3b5359">2026-10-30 09:00:02 SGT (UTC+08:00)</text>
</svg>