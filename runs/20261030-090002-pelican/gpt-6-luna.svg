<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">WHEEL DEAL</title>
  <desc id="desc">A smug pelican pedals a bicycle, carrying a tiny fish in its beak. The wheels spin and the pelican bobs along.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
      .rider { animation: bob .65s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8e9c8"/>
  <path d="M0 395 Q170 365 335 395 T800 386 V600 H0Z" fill="#c7dfbd"/>
  <path d="M0 425 Q200 410 400 425 T800 415" fill="none" stroke="#8fb18c" stroke-width="3"/>
  <circle cx="90" cy="105" r="38" fill="#f4bd58"/>
  <path d="M90 48v-18M90 180v-18M33 105h-18M165 105h-18M50 65 37 52M143 158l-13-13M130 65l13-13M37 158l13-13" stroke="#e7a83f" stroke-width="5" stroke-linecap="round"/>

  <text id="title" x="400" y="68" text-anchor="middle" font-size="40" font-weight="900" letter-spacing="2" fill="#183a47">WHEEL DEAL</text>
  <text x="400" y="99" text-anchor="middle" font-size="16" font-weight="700" fill="#42616a">Local bird insists this counts as “going places.”</text>

  <!-- Bicycle -->
  <g fill="none" stroke="#183a47" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 390 330 295 410 390 245 390 285 315"/>
    <path d="M410 390 490 295 515 390 410 390"/>
    <path d="M490 295h43M278 314h46"/>
    <path d="M330 295h38"/>
  </g>
  <g class="wheel" fill="#f8e9c8" stroke="#183a47" stroke-width="7">
    <circle cx="245" cy="390" r="67"/>
    <path d="M245 323v134M178 390h134M198 343l94 94M292 343l-94 94" fill="none" stroke="#5c7c82" stroke-width="3"/>
  </g>
  <g class="wheel" fill="#f8e9c8" stroke="#183a47" stroke-width="7">
    <circle cx="515" cy="390" r="67"/>
    <path d="M515 323v134M448 390h134M468 343l94 94M562 343l-94 94" fill="none" stroke="#5c7c82" stroke-width="3"/>
  </g>
  <circle cx="410" cy="390" r="10" fill="#e66b4e" stroke="#183a47" stroke-width="4"/>
  <path d="M410 390 381 357m29 33 35 18" stroke="#183a47" stroke-width="5" stroke-linecap="round"/>
  <path d="M370 348h-20m65 67h22" stroke="#183a47" stroke-width="6" stroke-linecap="round"/>

  <!-- Pelican and its gentle riding bob -->
  <g class="rider">
    <!-- tail feathers -->
    <path d="M337 235q-38-20-52 5 24-5 43 12" fill="#4c91a0" stroke="#183a47" stroke-width="4"/>
    <!-- body -->
    <ellipse cx="373" cy="235" rx="66" ry="51" fill="#fffdf3" stroke="#183a47" stroke-width="5"/>
    <path d="M331 237q27-45 72-27 22 10 24 34-42 17-96 11" fill="#74b8c0" stroke="#183a47" stroke-width="4"/>
    <!-- neck -->
    <path d="M412 222q4-57 31-72 21-10 35 7 12 15-3 30l-23 37" fill="#fffdf3" stroke="#183a47" stroke-width="5"/>
    <!-- head -->
    <ellipse cx="472" cy="151" rx="38" ry="31" fill="#fffdf3" stroke="#183a47" stroke-width="5"/>
    <path d="M466 134q20-21 41-2" fill="none" stroke="#183a47" stroke-width="5" stroke-linecap="round"/>
    <circle cx="486" cy="147" r="5" fill="#183a47"/>
    <path d="M502 158q62 4 79 22-37 16-75 4" fill="#f0a84b" stroke="#183a47" stroke-width="5" stroke-linejoin="round"/>
    <path d="M507 164q37 7 67 16-31 12-65 1" fill="#e88752" stroke="#183a47" stroke-width="3"/>
    <!-- fish dangling from beak -->
    <path d="M570 187q13 6 15 17l12-7-2 17-13-5q-9 8-17 2-8-7 0-17z" fill="#79b9ce" stroke="#183a47" stroke-width="3"/>
    <circle cx="568" cy="195" r="2.5" fill="#183a47"/>
    <path d="M573 189q-10 13 0 22" fill="none" stroke="#4d8796" stroke-width="2"/>
    <!-- wing and smug expression -->
    <path d="M351 225q25-33 59-8 12 10 11 25-34 21-70-17" fill="#e4f1e9" stroke="#183a47" stroke-width="4"/>
    <path d="M468 140q10-9 20 0" fill="none" stroke="#183a47" stroke-width="3" stroke-linecap="round"/>
    <!-- legs, one on pedal -->
    <path d="M379 270q20 21 35 46l-20 31M402 267q-8 25 7 47l26 16" fill="none" stroke="#e88752" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M385 346l18 8M428 329l14 8" stroke="#183a47" stroke-width="5" stroke-linecap="round"/>
    <!-- handlebars held with wing/feather -->
    <path d="M422 208q30 28 62 49l6 35" fill="none" stroke="#fffdf3" stroke-width="11" stroke-linecap="round"/>
    <path d="M490 292l13-7" stroke="#e88752" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- comic motion marks -->
  <path d="M153 280h34m-47 15h31M584 268h31m-25 15h24" stroke="#e66b4e" stroke-width="4" stroke-linecap="round"/>
  <path d="M350 167q-22-18-40-7" fill="none" stroke="#e66b4e" stroke-width="3" stroke-linecap="round"/>
  <text x="298" y="149" font-size="14" font-weight="900" fill="#b74f3c" transform="rotate(-9 298 149)">HONK!</text>

  <rect x="0" y="500" width="800" height="100" fill="#183a47"/>
  <text x="400" y="541" text-anchor="middle" font-size="17" font-weight="700" fill="#fffdf3">“I’m not pedaling for exercise. I’m fleeing the fish market.”</text>
  <text x="400" y="579" text-anchor="middle" font-size="15" font-weight="600" fill="#f4d798">2026-10-30 09:02:22 SGT (UTC+08:00)</text>
</svg>