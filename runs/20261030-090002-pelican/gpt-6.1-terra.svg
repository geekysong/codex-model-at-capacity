  </g>

  <g class="rider">
    <path d="M350 266q-16 41 21 68q27 18 50 39" fill="none" stroke="#e69a39" stroke-width="9" stroke-linecap="round"/>
    <path d="M420 373l20 5" fill="none" stroke="#e69a39" stroke-width="9" stroke-linecap="round"/>
    <path d="M322 262q-49-22-56-60q21 20 47 18" fill="#e9e8d8" class="ink"/>
