    <circle cx="507" cy="185" r="1.8" fill="#263640"/>
    <circle cx="462" cy="132" r="13" fill="#fff" stroke="#263640" stroke-width="3"/>
    <circle cx="466" cy="133" r="4.5" fill="#263640"/>
