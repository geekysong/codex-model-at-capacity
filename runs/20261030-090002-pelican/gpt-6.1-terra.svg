<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A pelican rides a bicycle with a fish in its enormous bill. The wheels spin and the rider bobs.</desc>
  <defs>
    <style>
      .ink { stroke: #263640; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #71828a; stroke-width: 3; stroke-linecap: round; }
      .headline { font: 900 38px sans-serif; letter-spacing: 2px; fill: #263640; }
      .caption { font: 700 21px sans-serif; fill: #263640; }
      .date { font: 15px sans-serif; fill: #53656c; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { animation: bob 0.7s ease-in-out infinite alternate; }
      .leg { transform-origin: 405px 371px; animation: pedal 2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-5px) rotate(-1deg); } }
      @keyframes pedal { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f9f1d8"/>
  <rect x="17" y="17" width="766" height="566" rx="22" fill="#fffaf0" stroke="#263640" stroke-width="4"/>
  <text class="headline" x="400" y="69" text-anchor="middle">THE PELICAN EXPRESS</text>
  <path d="M48 87H752" stroke="#e8c66a" stroke-width="4"/>

  <circle cx="680" cy="135" r="34" fill="#f5c85c"/>
  <path d="M65 190q26-22 52 0q26-22 52 0M590 187q21-18 42 0q21-18 42 0" fill="none" stroke="#c5dfe0" stroke-width="7" stroke-linecap="round"/>
  <path d="M43 431q110-18 224 0t242 0t248 0v45H43z" fill="#d6e8cf"/>
  <path d="M45 472H755" stroke="#263640" stroke-width="5" stroke-linecap="round"/>
  <path d="M76 453h60m22 0h28m474 0h66" stroke="#a6c7ad" stroke-width="5" stroke-linecap="round"/>

  <g class="wheel">
    <circle cx="235" cy="392" r="78" fill="#fffaf0" stroke="#263640" stroke-width="10"/>
    <circle cx="235" cy="392" r="67" fill="none" stroke="#e5ad55" stroke-width="4"/>
    <path class="spoke" d="M235 325v134M168 392h134M188 345l94 94M282 345l-94 94"/>
    <circle cx="235" cy="392" r="7" fill="#263640"/>
  </g>
  <g class="wheel">
    <circle cx="560" cy="392" r="78" fill="#fffaf0" stroke="#263640" stroke-width="10"/>
    <circle cx="560" cy="392" r="67" fill="none" stroke="#e5ad55" stroke-width="4"/>
    <path class="spoke" d="M560 325v134M493 392h134M513 345l94 94M607 345l-94 94"/>
    <circle cx="560" cy="392" r="7" fill="#263640"/>
  </g>

  <path d="M235 392l96-116 74 116H235l145-106h130l50 106M510 286l-12-35h-31" fill="none" stroke="#d35c46" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M322 259h42" stroke="#263640" stroke-width="9" stroke-linecap="round"/>
  <path d="M491 250q12-19 30-10" fill="none" stroke="#263640" stroke-width="7" stroke-linecap="round"/>
