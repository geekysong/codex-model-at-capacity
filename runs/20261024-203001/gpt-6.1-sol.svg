<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f4e79"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #222; font-size: 20px; }
      .small { font-family: Arial, sans-serif; fill: #222; font-size: 17px; }
      .bold { font-weight: bold; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="80" y="188" width="440" height="24" rx="8" fill="#c98b4a" stroke="#70451f" stroke-width="3"/>
  <circle cx="300" cy="200" r="7" fill="#70451f"/>

  <!-- Pivot -->
  <path d="M300 212 L260 290 L340 290 Z" fill="#777" stroke="#444" stroke-width="3"/>
  <line x1="250" y1="290" x2="350" y2="290" stroke="#444" stroke-width="5"/>
  <text x="300" y="320" text-anchor="middle" class="label bold">pivot</text>

  <!-- Left hanging mass -->
  <line x1="130" y1="212" x2="130" y2="255" stroke="#333" stroke-width="3"/>
  <rect x="102" y="255" width="56" height="48" rx="5" fill="#8ecae6" stroke="#1f4e79" stroke-width="3"/>
  <text x="130" y="285" text-anchor="middle" class="small bold">6 kg</text>

  <!-- Right hanging mass -->
  <line x1="470" y1="212" x2="470" y2="255" stroke="#333" stroke-width="3"/>
  <rect x="442" y="255" width="56" height="48" rx="5" fill="#ffb4a2" stroke="#9d2c2c" stroke-width="3"/>
  <text x="470" y="285" text-anchor="middle" class="small bold">4 kg</text>

  <!-- Force arrows -->
  <line x1="130" y1="245" x2="130" y2="330" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="130" y="352" text-anchor="middle" class="small">weight</text>
  <line x1="470" y1="245" x2="470" y2="330" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="470" y="352" text-anchor="middle" class="small">weight</text>

  <!-- Distance indicators -->
  <line x1="130" y1="155" x2="300" y2="155" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="147" x2="130" y2="163" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="147" x2="300" y2="163" stroke="#333" stroke-width="2"/>
  <text x="215" y="145" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="115" x2="470" y2="115" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="107" x2="300" y2="123" stroke="#333" stroke-width="2"/>
  <line x1="470" y1="107" x2="470" y2="123" stroke="#333" stroke-width="2"/>
  <text x="385" y="105" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Heading and torque equation -->
  <text x="300" y=" forty" text-anchor="middle" class="label bold">LEVEL SEESAW</text>
  <text x="300" y=" seventy" text-anchor="middle" class="label">6 × 2 = 4 × 3</text>
  <text x="300" y="95" text-anchor="middle" class="label bold" fill="#16803c">balanced</text>
</svg>