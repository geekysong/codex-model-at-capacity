<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle, carrying fish in its enormous bill pouch. The wheels spin, the pedals turn, and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M60 5V115M5 60H115M21 21L99 99M21 99L99 21" stroke="#718995" stroke-width="2"/>
    </pattern>
    <style>
      .ink{stroke:#233541;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#233541}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <rect x="0" y="104" width="800" height="384" fill="#cdeef0"/>
  <circle cx="696" cy="162" r="35" fill="#ffd36b"/>
  <path d="M0 353Q113 319 219 351T451 345T800 339V488H0Z" fill="#9fcdaf"/>
  <path d="M0 388Q190 367 388 389T800 381V488H0Z" fill="#7bb795"/>
  <path d="M0 438H800V488H0Z" fill="#e1c79d"/>
  <path d="M24 467H110M665 467H758" stroke="#fff6df" stroke-width="6" stroke-linecap="round"/>

  <text x="400" y="57" text-anchor="middle" class="label" font-size="43" font-weight="900" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="87" text-anchor="middle" class="label" font-size="18">One bird. Two wheels. Absolutely no aerodynamics.</text>

  <!-- Stationary roadside gag -->
  <path d="M106 326V438" class="ink" fill="none"/>
  <rect x="40" y="262" width="132" height="70" rx="9" fill="#fffaf0" class="ink"/>
  <text x="106" y="286" text-anchor="middle" class="label" font-size="15" font-weight="bold">BIKE LANE</text>
  <text x="106" y="309" text-anchor="middle" class="label" font-size="14">NO TRAWLING</text>

  <ellipse cx="429" cy="446" rx="207" ry="13" fill="#233541" opacity=".13"/>

  <!-- Wheels rotate around their hubs -->
  <g transform="translate(297 387)">
    <circle r="64" fill="#fcf5df" stroke="#233541" stroke-width="10"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0-58V58M-58 0H58M-41-41L41 41M-41 41L41-41" stroke="#718995" stroke-width="2.5"/>
      <path d="M-20-54A58 58 0 0 1 18-55" fill="none" stroke="#f28b52" stroke-width="5"/>
    </g>
    <circle r="7" fill="#233541"/>
  </g>
  <g transform="translate(568 387)">
    <circle r="64" fill="#fcf5df" stroke="#233541" stroke-width="10"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0-58V58M-58 0H58M-41-41L41 41M-41 41L41-41" stroke="#718995" stroke-width="2.5"/>
      <path d="M-20-54A58 58 0 0 1 18-55" fill="none" stroke="#f28b52" stroke-width="5"/>
    </g>
    <circle r="7" fill="#233541"/>
  </g>

  <!-- Bicycle frame -->
  <path d="M297 387L360 302L414 387ZM360 302H518L414 387M518 302L568 387M414 387L391 294" fill="none" stroke="#233541" stroke-width="12" stroke-linejoin="round"/>
  <path d="M297 387L360 302L414 387ZM360 302H518L414 387M518 302L568 387M414 387L391 294" fill="none" stroke="#ef6351" stroke-width="7" stroke-linejoin="round"/>
  <path d="M518 302L507 268L535 254L552 263" fill="none" class="ink"/>
  <path d="M373 295H409" stroke="#233541" stroke-width="12" stroke-linecap="round"/>
  <path d="M297 387L414 387" stroke="#53636b" stroke-width="3"/>
  <circle cx="414" cy="387" r="17" fill="#f8d465" class="ink"/>

  <!-- Rider -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <!-- tail and body -->
    <path d="M332 265L281 245L301 281L279 279L320 305Z" fill="#fefdf5" class="ink"/>
    <path d="M322 233Q368 210 408 239Q443 262 413 287Q359 316 318 285Q300 268 322 233Z" fill="#fffdf4" class="ink"/>
    <path d="M326 246Q356 229 392 253Q378 284 337 278L354 263" fill="#d8e4de" class="ink"/>
    <!-- long neck -->
    <path d="M392 249Q437 237 423 199Q405 151 440 138Q474 124 491 149Q499 166 481 180Q457 195 468 220Q481 258 428 281" fill="#fffdf4" class="ink"/>
    <!-- enormous bill -->
    <path d="M478 160L650 184Q659 188 649 193L483 187Z" fill="#ffbd50" class="ink"/>
    <path d="M486 186L647 192Q620 270 549 253Q499 240 486 186Z" fill="#f7a16b" class="ink"/>
    <path d="M500 196Q546 243 620 207" fill="none" stroke="#df784d" stroke-width="3"/>
    <!-- fish in pouch -->
    <path d="M548 218Q564 201 586 219L598 209L596 229L584 223Q563 238 548 218Z" fill="#75bdc6" stroke="#233541" stroke-width="2"/>
    <circle cx="557" cy="216" r="2.5" fill="#233541"/>
    <!-- face and racing helmet -->
    <circle cx="465" cy="153" r="5" fill="#233541"/>
    <path d="M454 140L474 143" class="ink" fill="none"/>
    <path d="M424 137Q423 104 456 104Q486 106 492 134Z" fill="#ef6351" class="ink"/>
    <path d="M443 111L440 128M459 110L460 128M476 116L480 130" stroke="#fff6df" stroke-width="4" stroke-linecap="round"/>
    <path d="M431 137L443 176L457 179" fill="none" stroke="#233541" stroke-width="3"/>
    <!-- wing reaches handlebars -->
    <path d="M386 253Q435 287 505 263L513 269Q447 307 394 280" fill="#fefdf5" class="ink"/>
    <!-- cycling number -->
    <rect x="331" y="239" width="42" height="33" rx="4" fill="#fff0a1" stroke="#233541" stroke-width="2" transform="rotate(-9 352 255)"/>
    <text x="352" y="263" text-anchor="middle" class="label" font-size="23" font-weight="bold">01</text>
    <!-- expressive sweat -->
    <path d="M506 132Q514 119 516 132Q516 141 510 140Z" fill="#42a4c1"/>
  </g>

  <!-- Pedaling legs and crank -->
  <path d="M370 291L392 332L414 362" fill="none" stroke="#e8a443" stroke-width="11" stroke-linecap="round">
    <animate attributeName="d" values="M370 291L392 332L414 362;M370 291L436 329L414 412;M370 291L392 332L414 362" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M391 292L443 329L414 412" fill="none" stroke="#f8bc55" stroke-width="11" stroke-linecap="round">
    <animate attributeName="d" values="M391 292L443 329L414 412;M391 292L389 330L414 362;M391 292L443 329L414 412" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(414 387)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0-25V25" stroke="#233541" stroke-width="5"/>
      <path d="M-11-25H11M-11 25H11" stroke="#233541" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="6" fill="#fff6df" stroke="#233541" stroke-width="3"/>
  </g>

  <!-- Speech stays still and readable -->
  <path d="M555 111H751Q765 111 765 125V151Q765 165 751 165H635L617 176L621 165H555Q541 165 541 151V125Q541 111 555 111Z" fill="#fffdf4" stroke="#233541" stroke-width="3"/>
  <text x="653" y="133" text-anchor="middle" class="label" font-size="16" font-weight="bold">“My fuel economy?</text>
  <text x="653" y="153" text-anchor="middle" class="label" font-size="16" font-weight="bold">Thirty fish per mile.”</text>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="488" width="800" height="112" fill="#fff6df"/>
  <path d="M36 489H764" stroke="#233541" stroke-width="2"/>
  <text x="400" y="525" text-anchor="middle" class="label" font-size="21" font-weight="bold">He bought a bicycle to reduce his carbon fin-print.</text>
  <text x="400" y="570" text-anchor="middle" class="label" font-size="17">2026-10-25 18:31:32 SGT (UTC+08:00)</text>
</svg>