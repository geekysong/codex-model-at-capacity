<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A determined pelican rides a bicycle, carrying a tiny briefcase and a very long beak.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-3px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#bde8ef"/>
  <rect y="416" width="800" height="184" fill="#f4d98b"/>
  <path d="M0 410 Q130 380 255 411 T510 407 T800 410" fill="none" stroke="#fff5d8" stroke-width="8"/>
  <circle cx="695" cy="112" r="48" fill="#ffd76a"/>
  <g fill="#fff" opacity=".8">
    <path d="M84 138q8-20 27-13 10-22 32-8 22-2 24 19H84z"/>
    <path d="M510 91q7-17 23-11 8-19 26-7 18-1 20 18h-69z"/>
  </g>
  <text x="400" y="53" text-anchor="middle" font-size="35" font-weight="900" fill="#153c53">THE PELICAN COMMUTE</text>
  <text x="400" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#31586a">“On time means whenever the fish truck arrives.”</text>

  <!-- bicycle frame -->
  <g stroke="#d8493e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M245 389 L342 389 L405 300 L305 300 Z"/>
    <path d="M342 389 L305 300"/>
    <path d="M405 300 L475 389"/>
    <path d="M397 290 L430 290 M305 300 L278 278"/>
  </g>
  <g fill="none" stroke="#243f4a" stroke-width="7">
    <g class="wheel">
      <circle cx="245" cy="389" r="65"/>
      <path d="M245 324v130 M180 389h130 M199 343l92 92 M291 343l-92 92"/>
    </g>
    <g class="wheel">
      <circle cx="475" cy="389" r="65"/>
      <path d="M475 324v130 M410 389h130 M429 343l92 92 M521 343l-92 92"/>
    </g>
  </g>
  <circle cx="342" cy="389" r="10" fill="#ffd76a" stroke="#243f4a" stroke-width="4"/>
  <path d="M342 389l28 21 M342 389l-20 24" stroke="#243f4a" stroke-width="6" stroke-linecap="round"/>
  <path d="M285 272h42" stroke="#243f4a" stroke-width="8" stroke-linecap="round"/>
  <path d="M391 289l18-17" stroke="#243f4a" stroke-width="7" stroke-linecap="round"/>

  <!-- rider -->
  <g class="rider">
    <!-- tail feathers -->
    <path d="M322 252q-36-19-47 7 24 4 40 20" fill="#f5f0df" stroke="#243f4a" stroke-width="4"/>
    <!-- body -->
    <ellipse cx="364" cy="237" rx="62" ry="48" fill="#f7f3e7" stroke="#243f4a" stroke-width="5"/>
    <path d="M347 246q24-33 51-8-13 29-44 27" fill="#d8e4e1"/>
    <!-- neck and head -->
    <path d="M386 223q-4-37 20-61" fill="none" stroke="#f7f3e7" stroke-width="23" stroke-linecap="round"/>
    <path d="M386 223q-4-37 20-61" fill="none" stroke="#243f4a" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="414" cy="151" rx="35" ry="30" fill="#f7f3e7" stroke="#243f4a" stroke-width="5"/>
    <!-- beak -->
    <path d="M441 157 L529 176 Q537 179 530 187 Q487 201 432 173 Z" fill="#f3a43b" stroke="#243f4a" stroke-width="4"/>
    <path d="M449 176q31 38 70 11" fill="#ee765c" stroke="#243f4a" stroke-width="4"/>
    <circle cx="424" cy="144" r="5" fill="#243f4a"/>
    <path d="M402 121q15-22 33-8" fill="none" stroke="#243f4a" stroke-width="4" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M383 139q7-33 39-29 24 4 29 28z" fill="#53a8a0" stroke="#243f4a" stroke-width="4"/>
    <path d="M378 140h75" stroke="#243f4a" stroke-width="5" stroke-linecap="round"/>
    <!-- wing/handlebar reach -->
    <path d="M393 234q33 15 32 43l-16 16" fill="none" stroke="#f7f3e7" stroke-width="17" stroke-linecap="round"/>
    <path d="M393 234q33 15 32 43l-16 16" fill="none" stroke="#243f4a" stroke-width="4" stroke-linecap="round"/>
    <!-- legs pedaling -->
    <path d="M357 269q-16 23-15 54l-5 52" fill="none" stroke="#f7f3e7" stroke-width="15" stroke-linecap="round"/>
    <path d="M357 269q-16 23-15 54l-5 52" fill="none" stroke="#243f4a" stroke-width="4" stroke-linecap="round"/>
    <path d="M365 269q19 22 1 47l-22 23" fill="none" stroke="#f7f3e7" stroke-width="15" stroke-linecap="round"/>
    <path d="M365 269q19 22 1 47l-22 23" fill="none" stroke="#243f4a" stroke-width="4" stroke-linecap="round"/>
    <path d="M325 375l24 1 M333 340l19 8" stroke="#243f4a" stroke-width="7" stroke-linecap="round"/>
    <!-- briefcase -->
    <rect x="286" y="207" width="35" height="31" rx="4" fill="#d8493e" stroke="#243f4a" stroke-width="4"/>
    <path d="M295 207v-7h17v7 M292 221h22" fill="none" stroke="#243f4a" stroke-width="3"/>
    <path d="M301 223l8 0" stroke="#ffd76a" stroke-width="4"/>
  </g>

  <!-- roadside sign and comic accents -->
  <path d="M617 287v99" stroke="#795a3b" stroke-width="8"/>
  <rect x="567" y="245" width="111" height="56" rx="7" fill="#fff8dc" stroke="#795a3b" stroke-width="4"/>
  <text x="622" y="268" text-anchor="middle" font-size="12" font-weight="900" fill="#29454c">BIKE LANE</text>
  <text x="622" y="287" text-anchor="middle" font-size="12" font-weight="700" fill="#d8493e">FISH EXPRESS</text>
  <path d="M549 163l-12-8 M554 150l-5-13 M548 176l-15 1" stroke="#d8493e" stroke-width="4" stroke-linecap="round"/>
  <text x="571" y="155" font-size="15" font-weight="900" fill="#d8493e">HONK!</text>
  <g fill="#50756a">
    <path d="M88 411q-2-44 7-72 9 29 8 72z"/>
    <path d="M78 412q-20-32-17-53 23 18 31 50z"/>
    <path d="M105 412q18-31 15-52-23 17-30 49z"/>
  </g>
  <path d="M55 414h83" stroke="#795a3b" stroke-width="7" stroke-linecap="round"/>
  <text x="400" y="492" text-anchor="middle" font-size="18" font-weight="800" fill="#29454c">He’s cutting traffic, emissions, and the lunch queue.</text>
  <path d="M0 517h800" stroke="#c9a85c" stroke-width="2"/>
  <text x="400" y="557" text-anchor="middle" font-size="16" font-weight="700" fill="#29454c">2026-10-25 18:32:34 SGT (UTC+08:00)</text>
</svg>