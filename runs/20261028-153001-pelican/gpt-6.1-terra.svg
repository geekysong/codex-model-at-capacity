<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Patrol</title>
  <desc id="desc">A funny pelican rides a bicycle while chasing a fish-shaped traffic sign.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b69"/>
      <stop offset="1" stop-color="#292d38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#233044" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202637;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#202637}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#202637}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .pedal{transform-box:fill-box;transform-origin:center;animation:pedal .9s ease-in-out infinite}
      .pelican{transform-box:fill-box;transform-origin:center;animation:bob 1.2s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pedal{0%,100%{transform:rotate(0deg)}50%{transform:rotate(180deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="710" cy="90" r="42" fill="#ffd86b" opacity=".9"/>
  <path d="M0 280 Q100 220 205 275 T410 265 T620 275 T800 245 V390 H0Z" fill="#8ccf8a"/>
  <path d="M0 325 Q150 285 290 330 T560 315 T800 300 V410 H0Z" fill="#65ae73"/>
  <path d="M0 405 H800 V560 H0Z" fill="url(#road)"/>
  <path d="M0 470 H800" stroke="#f7d96b" stroke-width="10" stroke-dasharray="70 38" opacity=".9"/>

  <g filter="url(#shadow)">
    <rect x="38" y="28" width="420" height="82" rx="18" fill="#fff4bf" class="ink"/>
    <text x="62" y="66" class="label" font-size="31">PELICAN PEDAL PATROL</text>
    <text x="64" y="94" class="small">“Beak first, brakes second!”</text>
  </g>

  <g transform="translate(640 185)">
    <path d="M0 0 L35 25 L0 50 Z" fill="#ff7b54" class="ink"/>
    <path d="M35 25 H92" class="ink" fill="none"/>
    <ellipse cx="52" cy="25" rx="28" ry="15" fill="#ffe07a" class="ink"/>
    <circle cx="63" cy="20" r="3" fill="#202637"/>
    <text x="42" y="67" text-anchor="middle" class="small">FISH?</text>
  </g>

  <g transform="translate(0 8)">
    <g class="wheel">
      <circle cx="205" cy="455" r="72" fill="#252936" class="ink"/>
      <circle cx="205" cy="455" r="58" fill="#d6e3e8" stroke="#202637" stroke-width="5"/>
      <path d="M205 397V513 M147 455H263 M164 414L246 496 M246 414L164 496" stroke="#667586" stroke-width="4"/>
      <circle cx="205" cy="455" r="9" fill="#ffcc5c" class="ink"/>
    </g>
    <g class="wheel">
      <circle cx="505" cy="455" r="72" fill="#252936" class="ink"/>
      <circle cx="505" cy="455" r="58" fill="#d6e3e8" stroke="#202637" stroke-width="5"/>
      <path d="M505 397V513 M447 455H563 M464 414L546 496 M546 414L464 496" stroke="#667586" stroke-width="4"/>
      <circle cx="505" cy="455" r="9" fill="#ffcc5c" class="ink"/>
    </g>

    <path d="M205 455 L305 350 L505 455 L405 455 Z" fill="none" class="ink"/>
    <path d="M305 350 L365 455 M365 455 L405 345 M405 345 L440 345" fill="none" class="ink"/>
    <path d="M292 341 H323" class="ink" fill="none"/>
    <path d="M393 337 Q405 325 417 337" class="ink" fill="none"/>
    <circle cx="365" cy="455" r="24" fill="#ffcc5c" class="ink"/>
    <g class="pedal">
      <path d="M365 455 L342 430 M365 455 L391 481" class="ink" fill="none"/>
      <path d="M330 425 H349 M385 486 H404" class="ink" fill="none"/>
    </g>

    <g class="pelican">
      <ellipse cx="350" cy="260" rx="72" ry="92" fill="#f5f1df" class="ink"/>
      <path d="M310 285 Q350 315 397 280 Q389 345 345 350 Q315 342 310 285Z" fill="#d7e0e5" class="ink"/>
      <path d="M335 176 Q385 140 423 180 Q441 204 418 230 Q391 252 347 229Z" fill="#f5f1df" class="ink"/>
      <path d="M408 196 Q500 205 542 238 Q503 270 412 238Z" fill="#f5a45b" class="ink"/>
      <path d="M421 215 Q474 226 523 239" stroke="#c66d3b" stroke-width="5" fill="none"/>
      <circle cx="397" cy="194" r="7" fill="#202637"/>
      <path d="M380 177 Q397 160 414 175" class="ink" fill="none"/>
      <path d="M327 339 L300 405 M383 337 L414 405" class="ink" fill="none"/>
      <path d="M292 405 Q305 414 318 405 M405 405 Q419 414 431 405" class="ink" fill="none"/>
      <path d="M310 244 Q345 265 381 241" stroke="#202637" stroke-width="5" fill="none"/>
      <path d="M305 225 Q287 198 306 178" class="ink" fill="none"/>
      <circle cx="287" cy="176" r="8" fill="#ff6f61" class="ink"/>
      <path d="M294 170 Q275 148 292 130" class="ink" fill="none"/>
      <circle cx="276" cy="126" r="7" fill="#ff6f61" class="ink"/>
      <path d="M416 279 Q451 287 467 314" class="ink" fill="none"/>
      <path d="M463 312 l22 -9 l-10 20" fill="#ffcc5c" class="ink"/>
    </g>
  </g>

  <g transform="translate(55 515)">
    <rect x="0" y="0" width="690" height="60" rx="12" fill="#fff" opacity=".92" class="ink"/>
    <text x="345" y="25" text-anchor="middle" class="small" font-size="15">Some birds migrate. This one commutes.</text>
    <text x="345" y="48" text-anchor="middle" class="small" font-size="14">2026-10-28 15:32:07 SGT (UTC+08:00)</text>
  </g>
</svg>