<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedals Against the Tide</title>
  <desc>A satirical cartoon pelican rides a bicycle while pretending it is a serious commute.</desc>
  <style>
    .ink{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .wheel{fill:none;stroke:#17202a;stroke-width:8}
    .spoke{stroke:#5b6770;stroke-width:3}
    .label{font-family:Arial,sans-serif;fill:#17202a}
    .bob{animation:bob 1.2s ease-in-out infinite}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  </style>

  <rect width="800" height="600" fill="#b9e7f5"/>
  <rect y="390" width="800" height="210" fill="#f4d28a"/>
  <path d="M0 430 Q130 395 260 430 T520 430 T800 430" fill="none" stroke="#d59c58" stroke-width="8"/>
  <path d="M0 480 Q170 450 340 480 T800 480" fill="none" stroke="#d59c58" stroke-width="6"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="36" font-weight="900">PELICAN PEDALS AGAINST THE TIDE</text>
  <text x="400" y="96" text-anchor="middle" class="label" font-size="19" font-style="italic">“Why fly when you can make traffic?”</text>

  <g>
    <circle cx="245" cy="410" r="78" class="wheel"/>
    <circle cx="555" cy="410" r="78" class="wheel"/>
    <g class="spin">
      <line x1="245" y1="332" x2="245" y2="488" class="spoke"/>
      <line x1="167" y1="410" x2="323" y2="410" class="spoke"/>
      <line x1="190" y1="355" x2="300" y2="465" class="spoke"/>
      <line x1="300" y1="355" x2="190" y2="465" class="spoke"/>
    </g>
    <g class="spin">
      <line x1="555" y1="332" x2="555" y2="488" class="spoke"/>
      <line x1="477" y1="410" x2="633" y2="410" class="spoke"/>
      <line x1="500" y1="355" x2="610" y2="465" class="spoke"/>
      <line x1="610" y1="355" x2="500" y2="465" class="spoke"/>
    </g>
    <path d="M245 410 L330 300 L470 300 L555 410 L410 410 Z" fill="#e85d4a" class="ink"/>
    <path d="M330 300 L390 410 M470 300 L410 410" fill="none" class="ink"/>
    <circle cx="410" cy="410" r="18" fill="#f2b544" class="ink"/>
    <path d="M410 410 l55 35 M410 410 l-55 -35" fill="none" class="ink"/>
    <path d="M470 300 L490 252 L515 252" fill="none" class="ink"/>
    <path d="M330 300 L305 252 L280 252" fill="none" class="ink"/>
    <path d="M490 252 L525 235" fill="none" class="ink"/>
    <path d="M280 252 L250 235" fill="none" class="ink"/>
  </g>

  <g class="bob">
    <ellipse cx="405" cy="278" rx="112" ry="82" fill="#f7f4e8" class="ink"/>
    <path d="M350 235 Q400 180 470 220 L520 275 Q450 305 365 285 Z" fill="#dce8e8" class="ink"/>
    <path d="M455 232 Q500 178 560 210 Q590 228 570 250 Q530 270 485 260 Z" fill="#f7f4e8" class="ink"/>
    <ellipse cx="558" cy="218" rx="43" ry="27" fill="#f2a43b" class="ink"/>
    <path d="M575 225 Q625 240 648 220 Q620 205 575 202" fill="#ee8e32" class="ink"/>
    <circle cx="552" cy="208" r="7" fill="#17202a"/>
    <path d="M365 285 Q340 320 330 355" fill="none" class="ink"/>
    <path d="M455 285 Q475 320 495 350" fill="none" class="ink"/>
    <path d="M330 355 l-28 12 M330 355 l25 15 M495 350 l-25 18 M495 350 l32 5" fill="none" class="ink"/>
    <path d="M342 250 Q300 220 275 245" fill="none" class="ink"/>
    <path d="M470 270 Q505 300 530 285" fill="none" class="ink"/>
    <path d="M385 185 l-12 -28 M410 180 l2 -32 M435 185 l15 -27" fill="none" stroke="#e85d4a" stroke-width="8"/>
    <text x="405" y="315" text-anchor="middle" class="label" font-size="18" font-weight="bold">SERIOUS COMMUTER</text>
  </g>

  <path d="M125 275 Q150 250 180 275" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  <path d="M650 150 Q675 125 705 150" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>

  <rect x="55" y="535" width="690" height="42" rx="12" fill="#fff4cf" stroke="#17202a" stroke-width="3"/>
  <text x="400" y="562" text-anchor="middle" class="label" font-size="18" font-weight="700">2026-10-28 15:30:22 SGT (UTC+08:00)</text>
</svg>