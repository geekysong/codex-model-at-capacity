<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Pelican Express: Flight Cancelled</title>
  <desc id="description">A determined pelican pedals a bicycle with a fish passenger in its enormous bill. Wheels spin, pedals turn, and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r=".7" fill="#d9c9a7" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff3d8"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M40 100H760" stroke="#182f38" stroke-width="4"/>
  <text x="400" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="900" fill="#182f38">PELICAN EXPRESS</text>
  <text x="400" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="3" fill="#ae4836">FLIGHT CANCELLED. LEGS DEPLOYED.</text>

  <g fill="#fffdf3" stroke="#d6dece" stroke-width="2">
    <path d="M57 185c-17-23 8-43 28-32 6-31 50-29 58-5 29-8 42 25 21 37Z"/>
    <path d="M614 169c-15-17 2-37 22-31 9-26 47-23 53 2 24-6 42 15 28 29Z"/>
  </g>
  <path d="M40 425Q144 392 242 425T443 423T649 416T760 426V476H40Z" fill="#d9dfb3"/>
  <ellipse cx="399" cy="466" rx="258" ry="15" fill="#263d42" opacity=".13"/>
  <path d="M45 472H755" stroke="#182f38" stroke-width="4" stroke-linecap="round"/>

  <!-- Wheels rotate around their own hubs. -->
  <g fill="#fff9e9" stroke="#182f38">
    <circle cx="240" cy="389" r="76" stroke-width="10"/>
    <circle cx="578" cy="389" r="76" stroke-width="10"/>
  </g>
  <g stroke="#75878a" stroke-width="3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 240 389" to="360 240 389" dur="1.6s" repeatCount="indefinite"/>
      <path d="M240 318V460M169 389H311M190 339L290 439M190 439L290 339"/>
      <path d="M231 319H249" stroke="#eb9c35" stroke-width="7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 578 389" to="360 578 389" dur="1.6s" repeatCount="indefinite"/>
      <path d="M578 318V460M507 389H649M528 339L628 439M528 439L628 339"/>
      <path d="M569 319H587" stroke="#eb9c35" stroke-width="7"/>
    </g>
  </g>

  <!-- Bicycle frame and fittings. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 389L323 284L389 389ZM323 284H528L389 389M528 284L578 389" stroke="#182f38" stroke-width="14"/>
    <path d="M240 389L323 284L389 389ZM323 284H528L389 389M528 284L578 389" stroke="#e55e49" stroke-width="8"/>
    <path d="M323 284L311 261M528 284L515 246L548 232" stroke="#182f38" stroke-width="8"/>
    <path d="M286 259H332M540 232H560" stroke="#182f38" stroke-width="12"/>
    <path d="M240 389L389 402L409 389L389 375Z" stroke="#182f38" stroke-width="3"/>
  </g>
  <circle cx="240" cy="389" r="8" fill="#182f38"/>
  <circle cx="578" cy="389" r="8" fill="#182f38"/>
  <circle cx="389" cy="389" r="20" fill="#f7cf70" stroke="#182f38" stroke-width="4"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 389 389" to="360 389 389" dur="1.6s" repeatCount="indefinite"/>
    <path d="M365 389H413" stroke="#182f38" stroke-width="7"/>
    <path d="M358 389H372M406 389H420" stroke="#182f38" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Pelican and webbed feet bob together. -->
  <g stroke="#182f38" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M324 284L354 326L373 369" fill="none" stroke="#d78c31" stroke-width="12"/>
    <path d="M373 366L351 380L388 381L396 370Z" fill="#f2ae42"/>
    <path d="M351 282L402 309L421 347" fill="none" stroke="#182f38" stroke-width="13"/>
    <path d="M351 282L402 309L421 347" fill="none" stroke="#f2ae42" stroke-width="8"/>
    <path d="M420 343L403 360L442 359L445 351Z" fill="#ffbd50"/>

    <path d="M286 248L243 224L255 253L234 251L282 278" fill="#f9fcf4"/>
    <path d="M278 228Q300 188 354 204Q385 213 394 254Q390 289 352 298Q290 302 273 270Z" fill="#fffef5"/>
    <path d="M302 229Q347 210 369 253Q336 278 300 251" fill="#d7e1d9"/>
    <path d="M308 239L338 251M319 229L349 242" fill="none" stroke="#9cadab" stroke-width="3"/>

    <path d="M349 215Q386 197 380 164Q371 132 401 123Q437 117 446 146Q451 177 422 195L413 246Q402 266 378 255" fill="#fffef5"/>
    <path d="M391 126L379 112L397 117L397 105L411 120" fill="#fffef5"/>
    <path d="M418 167Q490 164 570 182Q540 237 468 226Q440 219 431 188Z" fill="#f5bd63"/>
    <path d="M424 162Q510 154 584 178Q551 191 432 183Z" fill="#ffda76"/>
    <path d="M445 190Q463 216 494 216" fill="none" stroke="#d78c31" stroke-width="3"/>

    <!-- A thoroughly unimpressed fish passenger. -->
    <path d="M489 205Q511 185 536 202L552 191L551 216L536 208Q512 226 489 205Z" fill="#6fb8b1" stroke-width="3"/>
    <circle cx="501" cy="203" r="3" fill="#182f38" stroke="none"/>
    <path d="M498 195L505 197M511 205L518 205" fill="none" stroke-width="2"/>

    <ellipse cx="423" cy="147" rx="11" ry="14" fill="white"/>
    <circle cx="427" cy="149" r="4" fill="#182f38" stroke="none"/>
    <path d="M411 133L431 129" fill="none"/>
    <path d="M378 210Q419 228 455 238L546 232" fill="none" stroke="#182f38" stroke-width="17"/>
    <path d="M378 210Q419 228 455 238L546 232" fill="none" stroke="#eef2e9" stroke-width="10"/>
    <path d="M379 191L405 205L384 217L366 202Z" fill="#e55e49"/>
    <path d="M375 201L330 180L341 201L320 209L369 213" fill="#e55e49"/>
  </g>

  <g fill="none" stroke="#182f38" stroke-width="3" stroke-linecap="round">
    <path d="M192 264H230M173 281H221M192 298H212"/>
    <path d="M451 127l9-11M462 139l14-5"/>
  </g>

  <path d="M590 251Q590 238 603 238H739Q752 238 752 251V311Q752 324 739 324H603Q590 324 590 311V289L563 275L590 279Z" fill="#fffdf5" stroke="#182f38" stroke-width="3"/>
  <text x="671" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#182f38">
    <tspan x="671">“I paid for</tspan>
    <tspan x="671" dy="21">extra legroom.”</tspan>
  </text>
  <text x="671" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#52676b">— the fish</text>

  <text x="400" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#182f38">He traded his wings for a cycle lane.</text>
  <text x="400" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#774b36">The baggage fees are still astronomical.</text>

  <rect x="0" y="555" width="800" height="45" fill="#182f38"/>
  <text x="400" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff3d8">2026-10-29 23:00:01 SGT (UTC+08:00)</text>
</svg>