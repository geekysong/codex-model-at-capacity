        <path d="M-60 0H60M0-60V60M-43-43L43 43M-43 43L43-43"/>
      </g>
      <circle r="8" fill="#ed704b" stroke="#233640" stroke-width="3"/>
      <path d="M43-43L49-49" stroke="#ed704b" stroke-width="8"/>
    </g>
    <g id="fish">
      <path d="M0 0Q17-15 36 0Q17 15 0 0L-11 10V-10Z" fill="#6eb9b8" stroke="#233640" stroke-width="2"/>
      <circle cx="28" cy="-2" r="2.5" fill="#233640"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="15" y="15" width="770" height="570" rx="20" fill="url(#sky)" stroke="#233640" stroke-width="3"/>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="39" font-weight="900" letter-spacing="2" fill="#233640">THE PELICAN COMMUTER</text>
  <text x="400" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#674b3d">ONE BIKE. SIX FISH. ABSOLUTELY NO SELF-AWARENESS.</text>

