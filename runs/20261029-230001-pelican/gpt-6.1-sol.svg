<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Commuter</title>
  <desc id="description">A smug pelican pedals a tiny bicycle, carrying an enormous beak full of fish beneath a sign advertising a small cycle lane. Wheels spin, legs pedal, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#fff6cf"/>
      <stop offset="1" stop-color="#f8dfb0"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc65b"/>
      <stop offset="1" stop-color="#ee9450"/>
    </linearGradient>
    <g id="wheel" fill="none">
      <circle r="70" fill="#fff9e9" stroke="#233640" stroke-width="10"/>
      <circle r="60" stroke="#d09f65" stroke-width="2"/>
