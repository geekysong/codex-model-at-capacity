  </path>
  <g transform="translate(357 391)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0-19V19" stroke="#233640" stroke-width="5"/>
      <path d="M-11-19H11M-11 19H11" stroke="#233640" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="none" stroke="#674b3d" stroke-width="3" stroke-linecap="round">
    <path d="M139 303H186M151 316H178M126 329H168">
      <animate attributeName="opacity" values=".3;1;.3" dur=".8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g>
    <path d="M68 184Q56 184 56 171V130Q56 116 71 116H284Q298 116 298 130V171Q298 184 283 184H260L274 207L232 184Z" fill="#fffdf3" stroke="#233640" stroke-width="3"/>
    <text x="177" y="144" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#233640">“I travel light.”</text>
    <text x="177" y="169" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#674b3d">— six fish in hand luggage</text>
  </g>

  <rect x="27" y="499" width="746" height="73" rx="8" fill="#fff9e9"/>
  <text x="400" y="525" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#233640">His carbon footprint is tiny. His fishprint is alarming.</text>
  <text x="400" y="555" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#674b3d">2026-10-29 23:01:54 SGT (UTC+08:00)</text>
</svg>