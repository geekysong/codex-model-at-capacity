  </g>
  <text x="674" y="225" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#233640">CYCLE LANE</text>
  <text x="674" y="249" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#cc573f">BEAKS EXTRA</text>

