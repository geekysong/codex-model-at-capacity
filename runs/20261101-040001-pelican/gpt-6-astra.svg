<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle, carrying fish in its enormous bill beneath a sign advertising sustainable delivery. Wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12V12" fill="none" stroke="#966437" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #183440; }
    .outline { stroke: #183440; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="800" height="600" fill="#fff5dc"/>
  <path d="M0 130 Q230 100 410 135T800 125V470H0Z" fill="#d5eef0"/>
  <circle cx="697" cy="182" r="41" fill="#ffd374"/>
  <path d="M35 222Q52 199 69 222Q86 199 103 222M644 255Q659 238 674 255Q689 238 704 255" fill="none" stroke="#87b6be" stroke-width="3"/>
  
  <text x="400" y="57" text-anchor="middle" font-size="43" font-weight="900" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="88" text-anchor="middle" font-size="17" font-weight="bold">ZERO EMISSIONS. MASSIVE BILL.</text>

  <!-- One coastal delivery scene -->
  <path d="M0 415Q180 395 342 420T800 407V485H0Z" fill="#b3cfb3"/>
  <path d="M0 450H800V496H0Z" fill="#d2c4a6"/>
  <path d="M22 476H100M158 476H236M294 476H372M430 476H508M566 476H644M702 476H780" stroke="#fff5dc" stroke-width="5"/>
  <ellipse cx="400" cy="452" rx="232" ry="15" fill="#183440" opacity=".12"/>

  <g class="outline">
    <path d="M102 299V439" fill="none" stroke="#8c7155" stroke-width="8"/>
    <path d="M37 269H152L177 294L152 319H37Z" fill="#fff5dc"/>
  </g>
  <text x="101" y="290" text-anchor="middle" font-size="13" font-weight="bold">BIKE LANE</text>
  <text x="101" y="308" text-anchor="middle" font-size="12">NO SEAPLANES</text>

  <!-- Spokes rotate around fixed wheel hubs -->
  <g transform="translate(268 390)">
    <circle r="64" fill="#edf5ea" class="outline" stroke-width="8"/>
    <g stroke="#68858b" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-59 0H59M0-59V59M-42-42L42 42M-42 42L42-42"/>
      <path d="M0-53V-44" stroke="#ffb83e" stroke-width="7"/>
    </g>
    <circle r="7" fill="#183440"/>
  </g>
  <g transform="translate(555 390)">
    <circle r="64" fill="#edf5ea" class="outline" stroke-width="8"/>
    <g stroke="#68858b" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-59 0H59M0-59V59M-42-42L42 42M-42 42L42-42"/>
      <path d="M0-53V-44" stroke="#ffb83e" stroke-width="7"/>
    </g>
    <circle r="7" fill="#183440"/>
  </g>

  <g fill="none" class="outline">
    <path d="M268 390L331 306L398 390ZM331 306H508L398 390M508 306L555 390" stroke="#dd5a49" stroke-width="9"/>
    <path d="M331 306L320 281M555 390L505 278L526 266" stroke-width="7"/>
    <path d="M302 280H343" stroke-width="10"/>
    <path d="M520 265L540 265" stroke-width="9"/>
    <path d="M398 390L268 390" stroke-width="2"/>
  </g>
  <circle cx="398" cy="390" r="19" fill="#efc561" class="outline"/>
  <g transform="translate(398 390)">
    <g class="outline">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-23 0H23" fill="none"/>
      <path d="M-29-5H-17M17 5H29" stroke-width="6"/>
    </g>
  </g>

  <!-- Rear delivery crate -->
  <path d="M222 313H289" stroke="#183440" stroke-width="5"/>
  <path d="M221 273H287L279 310H229Z" fill="#d8a460" class="outline"/>
  <path d="M224 278H284L278 307H230Z" fill="url(#basket)"/>
  <rect x="231" y="282" width="45" height="19" rx="3" fill="#fff5dc"/>
  <text x="253" y="296" text-anchor="middle" font-size="11" font-weight="bold">GIG BIRD</text>

  <!-- The oversized cyclist gently bobs -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M342 292Q350 331 390 348L408 378" fill="none" stroke="#183440" stroke-width="13" stroke-linecap="round"/>
    <path d="M342 292Q350 331 390 348L408 378" fill="none" stroke="#efa63e" stroke-width="8" stroke-linecap="round"/>
    <path d="M407 370L432 382L397 387Z" fill="#f4b444" class="outline">
      <animateTransform attributeName="transform" type="rotate" values="-8 407 378;8 407 378;-8 407 378" dur=".8s" repeatCount="indefinite"/>
    </path>

    <path d="M300 257L265 236L280 270L256 262Q282 297 321 298" fill="#fdfcf0" class="outline"/>
    <path d="M299 232Q323 199 377 218Q387 193 389 171Q391 138 421 141Q455 145 448 176Q438 206 439 240Q431 292 376 306Q315 311 296 276Q286 254 299 232Z" fill="#fffdf0" class="outline"/>
    <path d="M318 240Q365 216 397 249Q374 279 325 278Q344 267 348 254Q333 263 318 264" fill="#dce5dd" class="outline"/>
    
    <!-- Enormous pouch full of fish -->
    <path d="M438 177L628 190Q596 264 473 239Q449 231 438 177Z" fill="#f5b75f" class="outline"/>
    <path d="M450 181L637 188L626 200L447 194Z" fill="#ffd777" class="outline"/>
    <path d="M481 217Q502 200 524 215L539 205L537 224L524 219Q499 237 481 217Z" fill="#78adb1" stroke="#183440" stroke-width="2"/>
    <circle cx="491" cy="215" r="2.5" fill="#183440"/>
    <path d="M548 218Q565 204 584 214L596 205L595 224L582 219Q564 230 548 218Z" fill="#8abdba" stroke="#183440" stroke-width="2"/>
    <circle cx="556" cy="216" r="2.5" fill="#183440"/>

    <ellipse cx="424" cy="170" rx="10" ry="13" fill="white" stroke="#183440" stroke-width="3"/>
    <circle cx="428" cy="172" r="4" fill="#183440"/>
    <path d="M411 151L434 156" fill="none" class="outline"/>
    <path d="M388 147Q389 120 418 119Q445 120 453 145Z" fill="#dc5b48" class="outline"/>
    <path d="M410 123L406 140M425 123L427 141" stroke="#fff5dc" stroke-width="4"/>
    <path d="M394 145L407 190L435 190" fill="none" stroke="#183440" stroke-width="3"/>

    <path d="M390 250Q440 277 522 267" fill="none" stroke="#183440" stroke-width="17" stroke-linecap="round"/>
    <path d="M390 250Q440 277 522 267" fill="none" stroke="#fffdf0" stroke-width="11" stroke-linecap="round"/>
    <path d="M461 158Q468 145 472 158Q473 166 466 166Z" fill="#63b7d0"/>
  </g>

  <g>
    <path d="M525 115H743Q757 115 757 129V163Q757 177 743 177H650L633 187L636 177H525Q511 177 511 163V129Q511 115 525 115Z" fill="#fffdf3" stroke="#183440" stroke-width="3"/>
    <text x="634" y="140" text-anchor="middle" font-size="17" font-weight="bold">“Paid in exposure.</text>
    <text x="634" y="161" text-anchor="middle" font-size="17" font-weight="bold">Mostly headwind.”</text>
  </g>

  <!-- Reserved, stationary caption and timestamp footer -->
  <rect y="499" width="800" height="101" fill="#fff5dc"/>
  <path d="M40 501H760" stroke="#183440" stroke-width="2"/>
  <text x="400" y="535" text-anchor="middle" font-size="20" font-weight="bold">He carries the whole catch. The app takes the net profit.</text>
  <text x="400" y="576" text-anchor="middle" font-size="17">2026-11-01 04:00:01 SGT (UTC+08:00)</text>
</svg>