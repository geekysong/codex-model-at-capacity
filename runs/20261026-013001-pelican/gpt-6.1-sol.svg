      </path>
      <path d="M359 335L388 334L397 341L367 344Z" fill="#efad42" stroke-width="3">
        <animateTransform attributeName="transform" type="translate" values="0 0;-19 24;0 0" dur="1.8s" repeatCount="indefinite"/>
      </path>
    </g>

    <circle cx="374" cy="375" r="16" fill="#fff3d0" stroke-width="4"/>
    <g transform="translate(374 375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M0-27V27" stroke-width="6"/>
        <path d="M-12-27H12M-12 27H12" stroke-width="6"/>
      </g>
    </g>

    <rect x="174" y="225" width="105" height="56" rx="7" fill="#fbd36c" stroke-width="4"/>
    <path d="M174 240H279" stroke="#d19737" stroke-width="3"/>
    <path d="M204 225V212H250V225" fill="none" stroke-width="4"/>
    <path d="M201 255Q221 240 240 255Q221 271 201 255L193 247V263Z" fill="#68b4bc" stroke-width="2"/>
    <circle cx="234" cy="253" r="2" fill="#263844" stroke="none"/>
  </g>

  <g font-family="sans-serif" fill="#263844">
    <path d="M580 241Q577 223 598 223H721Q740 223 740 242V297Q740 314 721 314H613L589 333L594 311Q580 308 580 294Z" fill="#fffdf0" stroke="#263844" stroke-width="3"/>
    <text x="660" y="250" text-anchor="middle" font-size="17" font-weight="bold">
      <tspan x="660">“Huge bill.</tspan>
      <tspan x="660" dy="24">Tiny paycheck.”</tspan>
    </text>
    <text x="400" y="526" text-anchor="middle" font-size="21" font-weight="bold">He delivers one fish. The platform takes the other nineteen.</text>
    <path d="M70 547H730" stroke="#b5b6a6" stroke-width="1"/>
    <text x="400" y="577" text-anchor="middle" font-size="18">2026-10-26 01:31:15 SGT (UTC+08:00)</text>
  </g>
