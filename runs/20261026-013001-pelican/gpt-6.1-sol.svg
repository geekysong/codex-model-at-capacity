      <path d="M462 184Q519 220 578 187" fill="none" stroke="#c47c33" stroke-width="3"/>
      <circle cx="428" cy="137" r="12" fill="#fff" stroke-width="3"/>
      <circle cx="433" cy="138" r="4" fill="#263844" stroke="none"/>
      <path d="M412 118L437 121" fill="none" stroke-width="5"/>
      <path d="M389 115Q416 83 446 113Z" fill="#e95350" stroke-width="4"/>
      <path d="M394 102L437 102M418 91V112" fill="none" stroke="#a73638" stroke-width="3"/>
      <path d="M393 187L374 220L412 239L428 200" fill="#2c9b9c" stroke-width="3"/>
