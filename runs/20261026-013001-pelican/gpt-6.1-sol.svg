<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A smug pelican pedals a bicycle with a huge bill and a tiny fish delivery. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bceaf5"/>
      <stop offset="1" stop-color="#f5f7de"/>
    </linearGradient>
    <linearGradient id="bill" x2="0" y2="1">
      <stop stop-color="#ffcd54"/>
      <stop offset="1" stop-color="#ef9638"/>
    </linearGradient>
    <pattern id="road" width="80" height="12" patternUnits="userSpaceOnUse">
      <path d="M10 6h38" stroke="#fff9d9" stroke-width="4"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fcf6db" stroke="#263844" stroke-width="10"/>
      <circle r="65" fill="#d9edf0" stroke="#82949b" stroke-width="3"/>
      <g stroke="#637984" stroke-width="3">
        <path d="M-64 0H64M0-64V64M-45-45L45 45M-45 45L45-45"/>
        <path d="M-24-59L24 59M-59-24L59 24M-59 24L59-24M-24 59L24-59"/>
      </g>
      <circle cy="-66" r="6" fill="#ffcf48"/>
      <circle r="10" fill="#f08754" stroke="#263844" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff8e9"/>
  <rect x="18" y="18" width="764" height="477" rx="24" fill="url(#sky)" stroke="#263844" stroke-width="4"/>
  <text x="400" y="65" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="900" fill="#243844">THE GIG ECONOMY HAS WINGS</text>
  <path d="M61 127q18-30 38-5 20-44 46-7 31-7 34 19H61Z M630 115q12-26 31-8 20-32 40-2 28-5 31 17H630Z" fill="#fff" opacity=".8"/>

  <path d="M20 386Q160 343 286 380T540 374T780 385V467H20Z" fill="#9ec5a1"/>
  <path d="M20 421H780V472H20Z" fill="#667d84"/>
  <rect x="20" y="446" width="760" height="12" fill="url(#road)"/>
  <ellipse cx="409" cy="452" rx="252" ry="13" fill="#263844" opacity=".15"/>

  <g stroke="#263844" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(230 375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>
    <g transform="translate(570 375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <path d="M230 375L316 271L374 375ZM316 271H520L374 375M520 271L570 375" fill="none" stroke="#e95350" stroke-width="12"/>
    <path d="M316 271L303 245M520 271L505 226L531 215" fill="none" stroke-width="9"/>
    <path d="M281 245H330" fill="none" stroke-width="12"/>
    <path d="M530 214L552 209" fill="none" stroke-width="10"/>
    <circle cx="531" cy="207" r="8" fill="#ffd056" stroke-width="3"/>
    <path d="M180 284H276M193 284L218 345" fill="none" stroke-width="5"/>

