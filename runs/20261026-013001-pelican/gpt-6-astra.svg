<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Plan</title>
  <desc id="desc">A smug pelican rides a bicycle with an enormous fish-filled bill. The wheels spin and the bird bobs as it pedals. A sign promises a zero-emissions commute, except for the fish breath.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#decfa9" opacity=".45"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fff9e7" stroke="#263641" stroke-width="10"/>
      <circle r="66" fill="none" stroke="#a5b9bd" stroke-width="3"/>
      <g stroke="#6c858d" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <circle r="9" fill="#e9ad3c" stroke="#263641" stroke-width="4"/>
      <path d="M48-45L57-36" stroke="#ee6852" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d6"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 352Q170 300 325 351T800 326V488H0Z" fill="#d8e6cb"/>
  <g fill="#fffdf1" opacity=".9">
    <path d="M48 163q-6-24 20-27 10-31 40-10 30-9 36 20 23 2 23 17Z"/>
    <path d="M609 147q-3-22 20-23 15-24 35-6 29-7 34 16 23-1 24 13Z"/>
  </g>

  <g font-family="Verdana, sans-serif" text-anchor="middle" fill="#263641">
    <text x="400" y="54" font-size="37" font-weight="900" letter-spacing="1">THE PELICAN PEDAL PLAN</text>
    <text x="400" y="86" font-size="17">One bird. Two wheels. A wildly oversized lunch.</text>
  </g>

  <g transform="translate(594 239)" stroke="#263641" stroke-linejoin="round">
    <path d="M62 60V211" fill="none" stroke-width="8"/>
    <path d="M0 0H139V85H0Z" fill="#ffe078" stroke-width="4" transform="rotate(5 69 42)"/>
    <g fill="#263641" stroke="none" font-family="Verdana, sans-serif" text-anchor="middle" font-weight="bold" transform="rotate(5 69 42)">
      <text x="69" y="25" font-size="17">BIKE LANE</text>
      <text x="69" y="49" font-size="12">NO WIDE LOADS</text>
      <text x="69" y="72" font-size="21">→</text>
    </g>
  </g>

  <ellipse cx="350" cy="466" rx="244" ry="15" fill="#263641" opacity=".12"/>
