    <path d="M318 145L324 178 337 184" fill="none" stroke="#263641" stroke-width="3"/>
  </g>

  <g font-family="Verdana, sans-serif" fill="#263641">
    <path d="M64 112H267Q279 112 279 124V182Q279 194 267 194H253L274 214 232 194H64Q52 194 52 182V124Q52 112 64 112Z" fill="white" stroke="#263641" stroke-width="3"/>
    <text x="166" y="141" text-anchor="middle" font-size="18" font-weight="bold">“I reduced my</text>
    <text x="166" y="168" text-anchor="middle" font-size="18" font-weight="bold">carbon wingprint.”</text>
  </g>

  <rect x="0" y="496" width="800" height="104" fill="#263641"/>
  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <text x="400" y="530" fill="#fff4d6" font-size="20" font-weight="bold">Zero emissions. Unregulated fish breath.</text>
    <path d="M84 547H716" stroke="#7f9197" stroke-width="1"/>
    <text x="400" y="577" fill="#ffffff" font-size="18">2026-10-26 01:30:01 SGT (UTC+08:00)</text>
  </g>
