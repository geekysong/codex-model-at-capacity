    <path d="M242 207Q219 242 243 274 265 298 316 281 345 272 353 241L360 176Q374 160 358 143 344 130 324 143 308 155 311 181L305 215Q276 197 242 207Z" fill="#fffdf1" stroke="#263641" stroke-width="4"/>
