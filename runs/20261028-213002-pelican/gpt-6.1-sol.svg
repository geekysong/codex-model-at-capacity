<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN POWER: The Bicycle Bird</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#d9f4f7"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#606978"/>
      <stop offset="1" stop-color="#303744"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#18202c" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202633;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202633}
      .bold{font-weight:800}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="115" r="54" fill="#fff5b3" opacity=".9"/>
  <path d="M0 385 Q130 320 260 382 T520 370 T800 360 V470 H0Z" fill="#86c982"/>
  <path d="M0 430 Q190 390 390 425 T800 415 V600 H0Z" fill="url(#road)"/>
  <path d="M0 518 H800" stroke="#f8dc67" stroke-width="8" stroke-dasharray="42 30"/>

  <g filter="url(#shadow)">
    <rect x="38" y="30" width="724" height="86" rx="22" fill="#fff" stroke="#202633" stroke-width="6"/>
    <text x="400" y="76" text-anchor="middle" class="label bold" font-size=" thirty">PELICAN POWER!</text>
    <text x="400" y="101" text-anchor="middle" class="label" font-size="19">When your commute has a beak, every stop is a fish market.</text>
  </g>

  <g id="bike" class="ink" fill="none">
    <circle cx="245" cy="455" r="78" stroke="#202633" stroke-width="10"/>
    <circle cx="590" cy="455" r="78" stroke="#202633" stroke-width="10"/>
    <g stroke="#7fd3e8" stroke-width="3" opacity=".8">
      <path d="M245 377V533M167 455H323M190 400L300 510M300 400L190 510"/>
      <path d="M590 377V533M512 455H668M535 400L645 510M645 400L535 510"/>
    </g>
    <path d="M245 455 L350 365 L470 455 L350 455 Z" stroke="#202633" stroke-width="9"/>
    <path d="M350 365 L410 335" stroke-width="9"/>
    <path d="M410 335 L445 345 M410 335 L430 312" stroke-width="8"/>
    <path d="M470 455 L500 365" stroke-width="9"/>
    <path d="M500 365 L535 365" stroke-width="9"/>
    <circle cx="350" cy="455" r="20" fill="#f6c74f"/>
    <path d="M350 455 L320 430 M350 455 L380 480" stroke-width="8"/>
    <circle cx="320" cy="430" r="8" fill="#f6c74f"/>
    <circle cx="380" cy="480" r="8" fill="#f6c74f"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;8 -2;0 0;-8 2;0 0" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <g id="pelican" class="ink">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 5;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="410" cy="292" rx="73" ry="91" fill="#f4f0df"/>
    <path d="M365 250 Q402 190 466 217 Q497 235 490 283 Q480 320 443 337 Q392 339 365 310Z" fill="#f4f0df"/>
    <path d="M445 232 Q475 202 505 220 Q530 239 511 270 Q488 294 450 280Z" fill="#f4f0df"/>
    <path d="M490 246 Q610 226 666 266 Q614 305 493 283 Q470 271 490 246Z" fill="#f2a33f"/>
    <path d="M520 268 Q585 278 642 264" stroke="#d4772b" stroke-width="5" fill="none"/>
    <circle cx="484" cy="239" r="8" fill="#202633" stroke="none"/>
    <path d="M466 219 Q493 198 513 220" fill="none" stroke="#d4772b" stroke-width="7"/>
    <path d="M382 330 L363 395 M443 333 L467 395" stroke="#e28d31" stroke-width="13"/>
    <path d="M363 395 l-20 12 M363 395 l18 12 M467 395 l-20 12 M467 395 l18 12" stroke="#e28d31" stroke-width="8"/>
    <path d="M373 282 Q400 303 430 280" fill="none" stroke="#202633" stroke-width="5"/>
    <text x="396" y="263" text-anchor="middle" class="label bold" font-size="18">HONK!</text>
    <path d="M380 205 Q410 180 445 204" fill="none" stroke="#fff" stroke-width="7"/>
    <path d="M391 365 Q425 377 454 358" fill="none" stroke="#202633" stroke-width="6"/>
  </g>

  <g class="ink">
    <path d="M610 190 Q650 160 690 190" fill="none"/>
    <path d="M635 180 q20 -30 40 0" fill="none"/>
    <text x="650" y="155" text-anchor="middle" class="label bold" font-size="17">NO PARKING?</text>
    <text x="650" y="175" text-anchor="middle" class="label" font-size="15">NO PROBLEM.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="28" y="548" width="744" height="38" rx="10" fill="#fff" stroke="#202633" stroke-width="4"/>
    <text x="400" y="574" text-anchor="middle" class="label" font-size="16">2026-10-28 21:31:07 SGT (UTC+08:00)</text>
  </g>
</svg>