<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle while carrying an absurdly oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#586579"/>
      <stop offset="1" stop-color="#303846"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#132033" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202838;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202838}
      .small{font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .pedalSpin{transform-box:fill-box;transform-origin:center;animation:spin 1.3s linear infinite}
      .riderBob{animation:bob 1.3s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".9"/>
  <path d="M0 385 Q110 320 220 372 T450 360 T800 350 V470 H0Z" fill="#9bd38c"/>
  <path d="M0 430 Q160 388 315 426 T610 418 T800 400 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f7d66a" stroke-width="8" stroke-dasharray="38 24" opacity=".85"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#17324d">THE PELICAN CYCLE</text>
  <text x="400" y="88" text-anchor="middle" class="label" font-size="20" font-weight="700">“Why pedal when you can just wing it?”</text>

  <g filter="url(#shadow)">
    <g class="wheelSpin">
      <circle cx="250" cy="433" r="78" fill="#eaf7ff" class="ink"/>
      <circle cx="250" cy="433" r="10" fill="#ef6b50" class="ink"/>
      <path d="M250 355V511 M172 433H328 M195 378L305 488 M305 378L195 488" stroke="#7792a7" stroke-width="4"/>
    </g>
    <g class="wheelSpin">
      <circle cx="560" cy="433" r="78" fill="#eaf7ff" class="ink"/>
      <circle cx="560" cy="433" r="10" fill="#ef6b50" class="ink"/>
      <path d="M560 355V511 M482 433H638 M505 378L615 488 M615 378L505 488" stroke="#7792a7" stroke-width="4"/>
    </g>

    <g class="ink" fill="none">
      <path d="M250 433 L360 355 L560 433 L430 433 Z" fill="#f29b4b"/>
      <path d="M360 355 L430 433 L395 320"/>
      <path d="M395 320 L350 320"/>
      <path d="M560 433 L610 345"/>
      <path d="M610 345 L650 345"/>
    </g>
    <circle cx="430" cy="433" r="17" fill="#ef6b50" class="ink"/>
    <g class="pedalSpin">
      <path d="M430 433 L470 465 M430 433 L392 400" class="ink"/>
      <rect x="465" y="462" width="30" height="9" rx="4" fill="#202838"/>
      <rect x="368" y="394" width="30" height="9" rx="4" fill="#202838"/>
    </g>

    <g class="riderBob">
      <path d="M355 270 Q382 226 430 245 Q464 258 475 301 L455 350 Q415 368 373 345 L345 315Z" fill="#f7fbff" class="ink"/>
      <path d="M365 278 Q400 250 452 276 L440 305 Q400 292 370 310Z" fill="#f4c542" class="ink"/>
      <ellipse cx="420" cy="214" rx="54" ry="48" fill="#f7fbff" class="ink"/>
      <path d="M384 214 Q420 182 463 208 L510 231 Q525 239 510 252 L462 249 Q423 242 384 233Z" fill="#f4c542" class="ink"/>
      <path d="M458 211 Q478 205 491 217" fill="none" class="ink"/>
      <circle cx="432" cy="204" r="6" fill="#202838"/>
      <path d="M390 176 Q420 148 456 170" fill="none" class="ink"/>
      <path d="M400 176 Q410 151 424 159" fill="#ef6b50" class="ink"/>
      <path d="M433 173 Q444 148 458 164" fill="#ef6b50" class="ink"/>

      <path d="M375 324 L345 395 L385 433" fill="none" class="ink"/>
      <path d="M448 323 L474 390 L450 430" fill="none" class="ink"/>
      <path d="M345 395 L322 405" fill="none" class="ink"/>
      <path d="M450 430 L474 436" fill="none" class="ink"/>

      <path d="M383 292 L336 325" fill="none" class="ink"/>
      <path d="M452 291 L493 326" fill="none" class="ink"/>
      <path d="M330 323 L305 315" fill="none" class="ink"/>
      <path d="M493 326 L518 317" fill="none" class="ink"/>

      <path d="M470 273 Q525 247 584 274 Q610 286 595 305 Q526 302 472 294Z" fill="#f4c542" class="ink"/>
      <path d="M525 267 Q565 250 602 270" fill="none" stroke="#202838" stroke-width="5"/>
      <path d="M573 282 Q597 273 612 285" fill="none" class="ink"/>
    </g>
  </g>

  <g transform="translate(88 270)">
    <path d="M0 34 Q30 0 65 22" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".8"/>
    <path d="M40 58 Q70 24 105 46" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".8"/>
  </g>

  <g transform="translate(590 150)">
    <path d="M0 0 Q35 -28 70 0 Q35 10 0 0Z" fill="#ffffff" class="ink"/>
    <text x="35" y="42" text-anchor="middle" class="label small">FISH TAX?</text>
  </g>

  <text x="400" y="555" text-anchor="middle" class="label" font-size="18" font-weight="700">
    A bird with a big beak, a bigger ego, and absolutely no brakes.
  </text>
  <text x="400" y="583" text-anchor="middle" class="label" font-size="15" font-weight="700">
    2026-10-28 19:02:36 SGT (UTC+08:00)
  </text>
</svg>