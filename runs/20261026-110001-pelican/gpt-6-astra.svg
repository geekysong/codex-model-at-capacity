<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, carrying a fish in its enormous bill pouch. The wheels spin, the pedals turn, and the pelican bobs. Caption: Zero emissions. Suspicious fish mileage.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1"/>
    <g id="wheel">
      <circle r="77" fill="#faf4df" stroke="#213845" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#b4bdaf" stroke-width="2"/>
      <g stroke="#738c92" stroke-width="3">
        <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#f4b64a" stroke="#213845" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#faf4df"/>
  <path d="M0 145Q190 100 390 148T800 137V477H0Z" fill="#dceddf"/>
  <circle cx="694" cy="172" r="39" fill="#f5c658"/>
  <g fill="#fffaf0">
    <path d="M48 193q-15-25 13-34 10-35 39-12 29-14 35 14 28 1 21 32Z"/>
    <path d="M474 166q-12-18 8-27 6-23 27-13 23-15 33 12 23-3 25 28Z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#213845" text-anchor="middle">
    <text x="400" y="63" font-size="46" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
    <text x="400" y="96" font-size="17" font-weight="700" letter-spacing="2">ONE BIRD. TWO WHEELS. NO SELF-AWARENESS.</text>
  </g>

  <!-- The single cycling scene -->
  <path d="M0 452Q200 436 400 450T800 447V488H0Z" fill="#c0cdb3"/>
  <path d="M34 472H766" stroke="#889c86" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="413" cy="466" rx="246" ry="12" fill="#213845" opacity=".12"/>

  <g stroke="#213845" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(246 385)"><use href="#wheel"/></g>
    <g transform="translate(578 385)"><use href="#wheel"/></g>

    <!-- Bicycle frame -->
    <g fill="none" stroke-width="10">
      <path d="M246 385L322 275 385 385ZM322 275H509L385 385M509 275L578 385" stroke="#213845" stroke-width="14"/>
      <path d="M246 385L322 275 385 385ZM322 275H509L385 385M509 275L578 385" stroke="#e56d53"/>
      <path d="M509 275L496 231 521 216" stroke="#213845"/>
      <path d="M322 275L311 253" stroke="#213845"/>
    </g>
    <path d="M284 251H337" stroke-width="13"/>
    <path d="M517 215H540Q552 217 548 229" fill="none" stroke-width="9"/>
    <path d="M246 385L385 372Q407 384 385 399L246 392Z" fill="#f5c658" stroke-width="3"/>
    <circle cx="385" cy="385" r="19" fill="#213845"/>

    <!-- Pelican: bobbing body, bill, and determined expression -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
      <path d="M279 243L242 222 251 258 228 252Q248 279 285 275" fill="#fffdf2" stroke-width="4"/>
      <path d="M281 201Q312 175 357 194Q388 204 401 174L411 145Q420 122 447 132Q470 141 458 165L428 212Q416 250 379 267Q319 286 285 258Q268 239 281 201Z" fill="#fffdf2" stroke-width="4"/>
      <path d="M300 211Q323 194 354 216L383 246Q336 265 304 241" fill="#cadbd9" stroke-width="4"/>
      <path d="M312 219L347 241M327 213L362 238" fill="none" stroke="#93aaa9" stroke-width="3"/>

      <!-- A wing gripping the handlebar -->
      <path d="M366 207Q419 245 478 219L522 214Q535 216 529 226L481 233Q420 267 373 237" fill="#fffdf2" stroke-width="4"/>

      <!-- An extravagantly oversized pouch -->
      <path d="M451 164L657 173Q615 251 524 218Q476 201 451 164Z" fill="#f4b451" stroke-width="4"/>
      <path d="M456 166L668 166 657 181 453 175Z" fill="#ed8b43" stroke-width="4"/>
      <path d="M490 189Q543 218 602 195" fill="none" stroke="#d9853d" stroke-width="2"/>

      <!-- Passenger fish -->
      <g transform="translate(553 199) rotate(8)" stroke-width="2.5">
        <path d="M-24 0L-39-12V12Z" fill="#599b9d"/>
        <ellipse rx="27" ry="12" fill="#80bec0"/>
        <circle cx="15" cy="-3" r="5" fill="#fffdf2"/>
        <circle cx="17" cy="-3" r="2" fill="#213845" stroke="none"/>
        <path d="M4 4L-6 9M22 5H26" fill="none"/>
      </g>
      <circle cx="440" cy="151" r="10" fill="white" stroke-width="2"/>
      <circle cx="444" cy="153" r="4" fill="#213845" stroke="none"/>
      <path d="M428 138L450 143" fill="none" stroke-width="4"/>

      <!-- Comically small cycling helmet -->
      <path d="M409 135Q415 107 441 112Q461 116 467 137Z" fill="#e56d53" stroke-width="4"/>
      <path d="M426 118L423 129M440 118L442 130M454 123L458 132" stroke-width="4"/>
      <path d="M413 137Q407 162 427 168" fill="none" stroke-width="2"/>

      <!-- Bent leg with a small pedaling movement -->
      <path d="M350 261L373 305 400 346" fill="none" stroke="#213845" stroke-width="12"/>
      <path d="M350 261L373 305 400 346" fill="none" stroke="#eda04b" stroke-width="7"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5 373 305;7 373 305;-5 373 305" dur=".8s" repeatCount="indefinite"/>
        <path d="M373 305L398 346" fill="none" stroke="#eda04b" stroke-width="8"/>
        <path d="M396 339L423 350 393 354Z" fill="#eda04b" stroke-width="3"/>
      </g>
    </g>

    <!-- Continuously rotating crank and pedals -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 385 385" to="360 385 385" dur="1.6s" repeatCount="indefinite"/>
      <path d="M364 412L406 358" stroke="#e9eee4" stroke-width="7"/>
      <path d="M353 412H375M395 358H417" stroke-width="7"/>
    </g>
    <circle cx="385" cy="385" r="7" fill="#f5c658" stroke-width="3"/>

    <!-- Speed marks -->
    <path d="M135 297H200M151 315H188M120 333H183" fill="none" stroke="#789a8e" stroke-width="4"/>
  </g>

  <!-- Fish passenger's commentary -->
  <path d="M608 255Q608 243 622 243H750Q763 243 763 256V295Q763 307 750 307H622Q608 307 608 295V270L587 222 624 243" fill="#fffdf2" stroke="#213845" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#213845" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
    <text x="685" y="269">“I ordered</text>
    <text x="685" y="291">a CARPOOL.”</text>
  </g>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="490" width="800" height="110" fill="#213845"/>
  <text x="400" y="529" text-anchor="middle" fill="#fff7df" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Zero emissions. Suspicious fish mileage.</text>
  <path d="M160 545H640" stroke="#607681"/>
  <text x="400" y="575" text-anchor="middle" fill="#fff7df" font-family="Arial, Helvetica, sans-serif" font-size="17">2026-10-26 11:00:01 SGT (UTC+08:00)</text>
</svg>