  <title id="title">Shortest route through a city grid</title>
  <desc id="desc">A route from A1 to E5 follows eight street segments and avoids blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172033">City grid: A1 to E5</text>

  <g fill="#e7e5de" stroke="#d3d0c7" stroke-width="1">
