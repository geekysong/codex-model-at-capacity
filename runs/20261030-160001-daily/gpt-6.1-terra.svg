  <path d="M30 350H570" stroke="#cbd5e1"/>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 16:05:19 SGT (UTC+08:00)</text>
