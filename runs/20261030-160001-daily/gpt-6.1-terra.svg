    <rect x="96" y="122" width="84" height="44" rx="3"/><rect x="196" y="122" width="84" height="44" rx="3"/><rect x="296" y="122" width="84" height="44" rx="3"/><rect x="396" y="122" width="84" height="44" rx="3"/>
    <rect x="96" y="182" width="84" height="44" rx="3"/><rect x="196" y="182" width="84" height="44" rx="3"/><rect x="296" y="182" width="84" height="44" rx="3"/><rect x="396" y="182" width="84" height="44" rx="3"/>
    <rect x="96" y="242" width="84" height="44" rx="3"/><rect x="196" y="242" width="84" height="44" rx="3"/><rect x="296" y="242" width="84" height="44" rx="3"/><rect x="396" y="242" width="84" height="44" rx="3"/>
  </g>

  <g stroke="#94a3b8" stroke-width="3" fill="none">
    <path d="M88 54H488 M88 114H488 M88 174H488 M88 234H488 M88 294H488"/>
    <path d="M88 54V294 M188 54V294 M288 54V294 M388 54V294 M488 54V294"/>
  </g>
  <path d="M88 54 H488 V294" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#334155">
    <circle cx="188" cy="54" r="3"/><circle cx="288" cy="54" r="3"/><circle cx="388" cy="54" r="3"/><circle cx="488" cy="54" r="3"/>
    <circle cx="88" cy="114" r="3"/><circle cx="288" cy="114" r="3"/><circle cx="388" cy="114" r="3"/><circle cx="488" cy="114" r="3"/>
    <circle cx="88" cy="174" r="3"/><circle cx="188" cy="174" r="3"/><circle cx="388" cy="174" r="3"/><circle cx="488" cy="174" r="3"/>
    <circle cx="88" cy="234" r="3"/><circle cx="188" cy="234" r="3"/><circle cx="288" cy="234" r="3"/><circle cx="488" cy="234" r="3"/>
    <circle cx="88" cy="294" r="3"/><circle cx="188" cy="294" r="3"/><circle cx="288" cy="294" r="3"/><circle cx="388" cy="294" r="3"/>
  </g>
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M182 108l12 12m0-12-12 12"/>
    <path d="M282 168l12 12m0-12-12 12"/>
    <path d="M382 228l12 12m0-12-12 12"/>
  </g>
  <circle cx="88" cy="54" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="488" cy="294" r="7" fill="#7c3aed" stroke="#fff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="12" fill="#172033">
