<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de8ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636e"/>
      <stop offset="1" stop-color="#2f3740"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#17202a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
      .bold{font-weight:900}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff5a8" opacity=".85"/>
  <path d="M0 390 Q120 330 240 382 T480 374 T800 360 V480 H0Z" fill="#8bd17c"/>
  <path d="M0 430 Q180 395 360 430 T800 416 V480 H0Z" fill="#5eaf68"/>
  <path d="M0 470 H800 V565 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f9df67" stroke-width="8" stroke-dasharray="48 28"/>

  <text x="400" y="58" text-anchor="middle" class="label bold" font-size="38" fill="#123b54">THE GREAT PELICAN GETAWAY</text>
  <text x="400" y="92" text-anchor="middle" class="label" font-size="20">“Why fly when you can pedal past the fish market?”</text>

  <g id="bike" filter="url(#shadow)">
    <g id="wheels">
      <circle cx="250" cy="445" r="72" fill="none" class="ink"/>
      <circle cx="550" cy="445" r="72" fill="none" class="ink"/>
      <g stroke="#d9edf2" stroke-width="3">
        <path d="M250 373V517M178 445H322M199 394L301 496M301 394L199 496"/>
        <path d="M550 373V517M478 445H622M499 394L601 496M601 394L499 496"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 250 445" to="360 250 445" dur="2s" repeatCount="indefinite"/>
    </g>
    <path d="M250 445 L350 350 L550 445 L430 445 Z" fill="none" class="ink"/>
    <path d="M350 350 L325 300 M430 445 L470 330 M470 330 L530 330" fill="none" class="ink"/>
    <path d="M325 300 L285 300 M470 330 L510 300" fill="none" class="ink"/>
    <circle cx="430" cy="445" r="14" fill="#f6c744" class="ink"/>
    <g id="pedal">
      <path d="M430 445 L395 475 M430 445 L463 414" fill="none" class="ink"/>
      <circle cx="395" cy="475" r="8" fill="#ef6b55" class="ink"/>
      <circle cx="463" cy="414" r="8" fill="#ef6b55" class="ink"/>
      <animateTransform attributeName="transform" type="rotate" from="0 430 445" to="360 430 445" dur="1.3s" repeatCount="indefinite"/>
    </g>
    <path d="M315 300 L290 270" fill="none" class="ink"/>
    <path d="M285 300 Q270 284 278 270" fill="none" class="ink"/>
  </g>

  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.3s" repeatCount="indefinite"/>
    <ellipse cx="390" cy="245" rx="78" ry="92" fill="#f4f1df" class="ink"/>
    <path d="M330 220 Q292 166 325 126 Q365 106 404 140 Q420 178 390 215Z" fill="#d9e7e8" class="ink"/>
    <circle cx="360" cy="157" r="9" fill="#17202a"/>
    <path d="M385 170 Q458 165 530 205 Q480 250 386 213 Q352 196 385 170Z" fill="#f3a53b" class="ink"/>
    <path d="M397 201 Q455 212 526 205 Q475 258 395 220Z" fill="#e77a42" class="ink"/>
    <path d="M530 205 Q548 211 557 204" fill="none" class="ink"/>
    <path d="M345 225 Q300 250 282 305" fill="none" stroke="#d9e7e8" stroke-width="28" stroke-linecap="round"/>
    <path d="M430 225 Q473 254 488 304" fill="none" stroke="#d9e7e8" stroke-width="28" stroke-linecap="round"/>
    <path d="M327 310 Q390 285 463 310" fill="none" class="ink"/>
    <path d="M350 310 L330 350 M450 310 L470 350" fill="none" stroke="#ed8d35" stroke-width="16" stroke-linecap="round"/>
    <path d="M330 350 L310 350 M470 350 L490 350" fill="none" class="ink"/>
    <path d="M345 118 Q382 88 420 119" fill="none" stroke="#ef6b55" stroke-width="13" stroke-linecap="round"/>
    <path d="M340 117 Q330 88 348 72 Q365 89 360 115" fill="#ef6b55" class="ink"/>
    <path d="M390 116 Q390 82 415 73 Q428 95 414 120" fill="#ef6b55" class="ink"/>
    <path d="M305 184 Q285 205 285 225" fill="none" stroke="#ef6b55" stroke-width="10" stroke-linecap="round"/>
    <path d="M468 182 Q488 203 491 222" fill="none" stroke="#ef6b55" stroke-width="10" stroke-linecap="round"/>
    <path d="M310 250 Q285 235 270 249" fill="none" class="ink"/>
    <path d="M470 250 Q495 235 510 249" fill="none" class="ink"/>
    <path d="M300 244 Q282 255 274 275" fill="none" stroke="#17202a" stroke-width="5"/>
    <path d="M480 244 Q498 255 506 275" fill="none" stroke="#17202a" stroke-width="5"/>
  </g>

  <g transform="translate(565 250) rotate(8)">
    <ellipse cx="0" cy="0" rx="82" ry="38" fill="#79b85a" class="ink"/>
    <path d="M-62 -5 Q0 -44 63 -5" fill="none" stroke="#d8ef8a" stroke-width="10"/>
    <circle cx="63" cy="-5" r="20" fill="#f0b44b" class="ink"/>
    <circle cx="69" cy="-10" r="4" fill="#17202a"/>
    <path d="M-83 0 L-108 -12 M-83 10 L-110 17" fill="none" class="ink"/>
    <text x="0" y="8" text-anchor="middle" class="label bold" font-size="18" fill="#244d2b">LUNCH</text>
  </g>

  <g transform="translate(35 535)">
    <rect x="0" y="0" width="730" height="45" rx="12" fill="#fff8df" stroke="#17202a" stroke-width="3"/>
    <text x="365" y="29" text-anchor="middle" class="label" font-size="17">2026-10-28 22:31:52 SGT (UTC+08:00)</text>
  </g>
</svg>