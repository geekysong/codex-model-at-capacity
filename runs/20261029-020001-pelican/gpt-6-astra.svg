<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Powered Transit</title>
  <desc>A satirical pelican rides a bicycle while taking flight from ordinary transportation.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#173042" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#162733;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,sans-serif;fill:#162733}
      .small{font-family:Arial,sans-serif;font-size:17px;font-weight:bold}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="705" cy="105" r="52" fill="#fff5b0" opacity=".9"/>
  <path d="M0 300 Q110 260 220 300 T440 300 T660 300 T880 300 V440 H0Z" fill="#9bd48e"/>
  <path d="M0 355 Q150 320 300 355 T600 355 T900 355 V455 H0Z" fill="#70b875"/>

  <g opacity=".75" fill="#fff">
    <path d="M90 125 q25-25 50 0 q35-12 48 17 H65 q5-18 25-17Z"/>
    <path d="M510 90 q22-22 44 0 q30-10 42 14 H485 q6-15 25-14Z"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="38" y="30" width="724" height="86" rx="22" fill="#fff" opacity=".94" class="ink"/>
    <text x="400" y="70" text-anchor="middle" class="label" font-size="33" font-weight="900">THE GREAT PELICAN COMMUTE</text>
    <text x="400" y="98" text-anchor="middle" class="label" font-size="18" font-style="italic">When the bus is late, grow a beak and pedal harder.</text>
  </g>

  <path d="M0 440 H800" stroke="#f7d76d" stroke-width="8" stroke-dasharray="44 26"/>
  <rect x="0" y="450" width="800" height="150" fill="url(#road)"/>

  <g id="bike" transform="translate(0 0)">
    <g id="wheel1">
      <circle cx="245" cy="430" r="74" fill="#27313a" class="ink"/>
      <circle cx="245" cy="430" r="61" fill="#d7e1e7" stroke="#162733" stroke-width="5"/>
      <g stroke="#70828b" stroke-width="3">
        <path d="M245 369V491M184 430H306M202 387L288 473M288 387L202 473"/>
      </g>
      <circle cx="245" cy="430" r="10" fill="#f35d4f" class="ink"/>
    </g>
    <g id="wheel2">
      <circle cx="555" cy="430" r="74" fill="#27313a" class="ink"/>
      <circle cx="555" cy="430" r="61" fill="#d7e1e7" stroke="#162733" stroke-width="5"/>
      <g stroke="#70828b" stroke-width="3">
        <path d="M555 369V491M494 430H616M512 387L598 473M598 387L512 473"/>
      </g>
      <circle cx="555" cy="430" r="10" fill="#f35d4f" class="ink"/>
    </g>

    <path d="M245 430 L330 300 L470 430 L245 430 L400 430 L470 300" fill="none" stroke="#ef5b4d" stroke-width="12" stroke-linejoin="round"/>
    <path d="M470 300 L520 278" fill="none" stroke="#162733" stroke-width="9"/>
    <path d="M510 276 L550 276" stroke="#162733" stroke-width="9" stroke-linecap="round"/>
    <path d="M330 300 L315 268" stroke="#162733" stroke-width="9"/>
    <path d="M292 265 L338 265" stroke="#162733" stroke-width="10" stroke-linecap="round"/>
    <circle cx="400" cy="430" r="13" fill="#f7d76d" class="ink"/>
    <path d="M400 430 L365 386 M400 430 L431 470" stroke="#162733" stroke-width="7"/>
    <circle cx="361" cy="382" r="8" fill="#f7d76d" class="ink"/>
    <circle cx="435" cy="474" r="8" fill="#f7d76d" class="ink"/>

    <g id="pelican" class="ink">
      <ellipse cx="396" cy="246" rx="82" ry="95" fill="#f4f0dc"/>
      <path d="M355 205 Q395 151 446 190 Q470 215 449 258 Q410 279 365 258Z" fill="#d8e0df"/>
      <path d="M356 220 Q320 195 281 220 Q319 238 357 251Z" fill="#e8894f"/>
      <path d="M283 220 Q318 255 359 251 Q324 270 278 242Z" fill="#f2a15d"/>
      <circle cx="414" cy="203" r="12" fill="#fff"/>
      <circle cx="417" cy="204" r="5" fill="#162733" stroke="none"/>
      <path d="M400 290 Q423 310 444 286" fill="none"/>
      <path d="M352 264 Q318 295 327 335" fill="none" stroke-width="17"/>
      <path d="M443 263 Q470 292 465 330" fill="none" stroke-width="17"/>
      <path d="M336 332 L300 383" fill="none" stroke-width="12"/>
      <path d="M463 329 L505 377" fill="none" stroke-width="12"/>
      <path d="M292 383 L322 387" fill="none" stroke-width="9"/>
      <path d="M500 377 L530 384" fill="none" stroke-width="9"/>
      <path d="M350 163 Q390 125 440 158" fill="none" stroke-width="8"/>
      <path d="M365 164 Q391 139 423 155" fill="none" stroke-width="5"/>
    </g>

    <g transform="translate(350 137)">
      <path d="M0 0 q38-28 75 0" fill="none" stroke="#ef5b4d" stroke-width="8"/>
      <path d="M8 0 q-4-25 10-40 M66 0 q4-25-10-40" fill="none" stroke="#162733" stroke-width="7"/>
      <text x="38" y="-50" text-anchor="middle" class="label small" font-size="15">HONK!</text>
    </g>
  </g>

  <g transform="translate(0 0)">
    <path d="M615 325 q20-28 42 0 q18-28 40 0" fill="none" stroke="#162733" stroke-width="5"/>
    <text x="650" y="300" text-anchor="middle" class="label small">CARPOOL?</text>
  </g>

  <g class="label">
    <rect x="35" y="525" width="730" height="55" rx="12" fill="#fff" opacity=".95" class="ink"/>
    <text x="400" y="549" text-anchor="middle" font-size="17" font-weight="bold">“I’m reducing my carbon footprint,” says the pelican,</text>
    <text x="400" y="570" text-anchor="middle" font-size="17" font-weight="bold">“one suspiciously large foot at a time.”</text>
  </g>

  <text x="400" y="594" text-anchor="middle" class="label" font-size="13" font-weight="bold">2026-10-29 02:00:01 SGT (UTC+08:00)</text>

  <animateTransform href="#bike" attributeName="transform" type="translate"
    values="0 0; 0 -7; 0 0; 0 -5; 0 0" dur="1.4s" repeatCount="indefinite"/>
  <animateTransform href="#wheel1" attributeName="transform" type="rotate"
    values="0 245 430; 360 245 430" dur="1.1s" repeatCount="indefinite"/>
  <animateTransform href="#wheel2" attributeName="transform" type="rotate"
    values="0 555 430; 360 555 430" dur="1.1s" repeatCount="indefinite"/>
</svg>