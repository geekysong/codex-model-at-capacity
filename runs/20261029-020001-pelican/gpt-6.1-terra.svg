<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICAN COMMUTE</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b66"/>
      <stop offset="1" stop-color="#292d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#20252b;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .bob{animation:bob .8s ease-in-out infinite alternate}
      .pedal{animation:pedal .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
      text{font-family:Arial,Helvetica,sans-serif}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="105" r="48" fill="#ffd86b" opacity=".85"/>
  <path d="M0 245 Q120 205 245 245 T500 240 T800 230 L800 365 L0 365Z" fill="#9acb8c"/>
  <path d="M0 315 Q150 275 300 320 T600 312 T800 290 L800 390 L0 390Z" fill="#73aa70"/>
  <rect y="365" width="800" height="190" fill="url(#road)"/>
  <path d="M0 470 H800" stroke="#f5d76e" stroke-width="7" stroke-dasharray="38 30" opacity=".9"/>
  <path d="M0 390 H800" stroke="#20252b" stroke-width="8"/>

  <g filter="url(#shadow)">
    <rect x="34" y="28" width="732" height="76" rx="18" fill="#fff8dc" class="ink"/>
    <text x="400" y="76" text-anchor="middle" font-size="39" font-weight="900" fill="#cf3f36" letter-spacing="2">THE GREAT PELICAN COMMUTE</text>
  </g>

  <g transform="translate(0,8)">
    <g class="wheel" aria-label="rear wheel">
      <circle cx="235" cy="455" r="70" fill="#dce8ef" class="ink"/>
      <circle cx="235" cy="455" r="10" fill="#cf3f36" class="ink"/>
      <path d="M235 385V525 M165 455H305 M185 405L285 505 M285 405L185 505" stroke="#71808d" stroke-width="4"/>
    </g>
    <g class="wheel" aria-label="front wheel">
      <circle cx="570" cy="455" r="70" fill="#dce8ef" class="ink"/>
      <circle cx="570" cy="455" r="10" fill="#cf3f36" class="ink"/>
      <path d="M570 385V525 M500 455H640 M520 405L620 505 M620 405L520 505" stroke="#71808d" stroke-width="4"/>
    </g>

    <g class="ink" fill="none">
      <path d="M235 455 L345 350 L470 455 L235 455 L410 455 L570 455 L470 350 L410 455"/>
      <path d="M345 350 L325 315"/>
      <path d="M325 315 H375"/>
      <path d="M470 350 L500 315 H535"/>
    </g>
    <path d="M400 444 L430 470" class="ink" fill="none"/>
    <g class="pedal" transform-origin="400px 455px">
      <circle cx="400" cy="455" r="12" fill="#f2b134" class="ink"/>
      <path d="M400 455 L370 430 M400 455 L430 480" class="ink" fill="none"/>
      <path d="M360 425h-22 M432 485h22" class="ink" fill="none"/>
    </g>

    <g class="bob">
      <ellipse cx="410" cy="350" rx="82" ry="68" fill="#f4f0dc" class="ink"/>
      <path d="M360 350 Q410 305 465 340 Q450 380 395 385Z" fill="#d8d2b7" class="ink"/>
      <ellipse cx="438" cy="286" rx="57" ry="55" fill="#f4f0dc" class="ink"/>
      <path d="M462 278 Q535 255 615 285 Q550 320 462 302Z" fill="#ef9142" class="ink"/>
      <path d="M466 300 Q540 330 610 290" fill="none" class="ink"/>
      <circle cx="461" cy="270" r="8" fill="#20252b"/>
      <path d="M397 326 Q420 300 447 324" fill="none" class="ink"/>
      <path d="M372 356 Q330 390 320 430" fill="none" class="ink"/>
      <path d="M445 366 Q485 395 505 430" fill="none" class="ink"/>
      <path d="M319 430 L300 451 M505 430 L530 452" class="ink" fill="none"/>
      <path d="M379 302 Q398 252 446 248" fill="none" class="ink"/>
      <path d="M383 297 Q360 270 370 246" fill="none" class="ink"/>
      <path d="M430 243 Q457 220 480 240" fill="#cf3f36" class="ink"/>
      <path d="M480 240 Q472 267 445 266Z" fill="#cf3f36" class="ink"/>
      <path d="M355 346 Q325 350 305 332" fill="none" stroke="#cf3f36" stroke-width="12"/>
      <path d="M498 345 Q530 350 550 334" fill="none" stroke="#cf3f36" stroke-width="12"/>
      <path d="M385 402 Q420 420 455 402" fill="none" stroke="#cf3f36" stroke-width="7"/>
      <text x="407" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#20252b">“HONK IF YOU’RE HUNGRY!”</text>
    </g>

    <g transform="translate(555,218) rotate(8)">
      <path d="M0 20 Q65 -8 135 18 Q95 62 25 55Z" fill="#72b6d4" class="ink"/>
      <path d="M20 29 Q72 10 124 28" fill="none" stroke="#eaf7ff" stroke-width="8"/>
      <path d="M136 18 l32 -18 l-8 30Z" fill="#ef9142" class="ink"/>
      <circle cx="151" cy="9" r="3" fill="#20252b"/>
      <text x="70" y="48" text-anchor="middle" font-size="15" font-weight="900" fill="#20252b">LUNCH</text>
    </g>
  </g>

  <g transform="translate(55,505)">
    <rect width="690" height="43" rx="14" fill="#fff8dc" class="ink"/>
    <text x="345" y="29" text-anchor="middle" font-size="22" font-weight="700" fill="#20252b">Caption: “When the fish refuses to take the bus, the pelican pedals.”</text>
  </g>

  <text x="400" y="584" text-anchor="middle" font-size="16" font-weight="700" fill="#20252b">2026-10-29 02:03:33 SGT (UTC+08:00)</text>
</svg>