    <path d="M595 160q3-24 30-21q18-32 43-8q33-6 40 29Z"/>
  </g>

  <text x="400" y="60" text-anchor="middle" font-family="sans-serif" font-size="45" font-weight="900" fill="#203341" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="92" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#42626a">THE COMMUTE HAS A CATCH.</text>

