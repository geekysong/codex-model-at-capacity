    <path d="M160 174Q145 170 145 155V127Q145 111 163 111H321Q338 111 338 127V155Q338 172 321 172H214L190 194L194 172Z" fill="#fffdf1" stroke="#203341" stroke-width="3"/>
    <text x="242" y="137" text-anchor="middle" font-size="17" font-weight="800">“I travel light.”</text>
    <text x="242" y="158" text-anchor="middle" font-size="13">(Lunch travels first class.)</text>
