<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with a fish in its enormous bill pouch, passing a sign that says no free rides. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="road" width="110" height="12" patternUnits="userSpaceOnUse">
      <path d="M10 6H65" stroke="#fff4d6" stroke-width="5" stroke-linecap="round"/>
    </pattern>
