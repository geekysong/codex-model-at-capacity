      <circle r="72" fill="#e8f6f1" stroke="#203341" stroke-width="10"/>
      <circle r="61" fill="none" stroke="#f6a848" stroke-width="3"/>
      <g stroke="#52717b" stroke-width="3">
        <path d="M-60 0H60M0-60V60M-43-43L43 43M-43 43L43-43"/>
      </g>
      <circle r="9" fill="#203341"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
