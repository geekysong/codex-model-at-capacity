<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with spinning wheels, carrying a fish in its enormous bill beneath the slogan: aerodynamic in theory.</desc>
