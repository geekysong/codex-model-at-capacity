    <tspan x="670">“The fish is</tspan>
    <tspan x="670" dy="23">my coach.”</tspan>
  </text>

  <rect x="0" y="510" width="800" height="90" fill="#253b42"/>
  <text x="400" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff4d9">All the gear. Absolutely no idea where the lake is.</text>
