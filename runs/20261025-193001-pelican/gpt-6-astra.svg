<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Pelican Commute</title>
  <desc id="desc">A smug pelican in a tiny commuter helmet pedals a bicycle, carrying a fish in its enormous bill. Both wheels spin, its feet pedal, and the pelican bobs gently. Caption: Huge bill. Zero gas money.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r=".7" fill="#dacfb8" opacity=".3"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fff9e9" stroke="#25343c" stroke-width="12"/>
      <circle r="67" fill="none" stroke="#e5a744" stroke-width="3"/>
      <g stroke="#839496" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <circle r="9" fill="#25343c"/>
      <path d="M48-47L55-39" stroke="#ef704b" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M25 98H775" stroke="#25343c" stroke-width="3"/>
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="#a34a35">THE COMMUTER CHRONICLES</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#25343c">THE DAILY PELICAN COMMUTE</text>

  <!-- A single seaside street. -->
  <circle cx="125" cy="174" r="42" fill="#f6ce65"/>
  <path d="M40 355Q145 328 250 350T475 346T760 352V475H40Z" fill="#d5e8dc"/>
  <path d="M45 375Q158 363 210 375M594 375Q674 361 754 374" fill="none" stroke="#a7c9be" stroke-width="3"/>
  <path d="M40 505H760" stroke="#25343c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="397" cy="502" rx="237" ry="9" fill="#25343c" opacity=".12"/>

  <g stroke="#25343c" stroke-linejoin="round">
    <!-- Roadside destination sign. -->
    <path d="M104 295V473" stroke-width="7"/>
    <path d="M48 254H145L168 278L145 302H48Z" fill="#ef704b" stroke-width="3"/>
    <text x="104" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff6df" stroke="none">FISH</text>
    <text x="104" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff6df" stroke="none">DRIVE-THRU</text>
  </g>

  <!-- Wheel rotations are local to their hubs. -->
  <g transform="translate(260 425)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(535 425)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 425L323 327L379 425ZM323 327H485L379 425M485 327L535 425" stroke="#25343c" stroke-width="13"/>
    <path d="M260 425L323 327L379 425ZM323 327H485L379 425M485 327L535 425" stroke="#36a99c" stroke-width="7"/>
    <path d="M323 327L314 306M535 425L480 291L498 273H524" stroke="#25343c" stroke-width="8"/>
    <path d="M295 306H335" stroke="#25343c" stroke-width="13"/>
    <path d="M516 273H531" stroke="#ef704b" stroke-width="10"/>
    <path d="M525 282Q562 311 516 344" stroke="#25343c" stroke-width="2"/>
    <path d="M260 416L378 408Q401 424 378 442L260 434Z" stroke="#25343c" stroke-width="3"/>
    <circle cx="379" cy="425" r="21" fill="#fff6df" stroke="#25343c" stroke-width="5"/>
  </g>

  <!-- Far leg pedals in opposition to the near leg. -->
  <path d="M350 306Q359 347 394 375L379 401" fill="none" stroke="#b6742b" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M350 306Q359 347 394 375L379 401;M350 306Q359 347 413 392L403 425;M350 306Q359 347 393 417L379 449;M350 306Q359 347 365 397L355 425;M350 306Q359 347 394 375L379 401" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- The rider bobs without moving any lettering. -->
  <g stroke="#25343c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M292 272L248 249L264 283L241 279L285 310" fill="#fdfdf3"/>
    <path d="M284 247Q311 217 368 236Q403 248 415 213L428 179Q442 151 469 157Q495 160 490 187Q487 205 464 216L449 259Q432 312 370 322Q307 328 282 296Q268 272 284 247Z" fill="#fffef3"/>
    <path d="M301 260Q343 241 384 276Q367 301 326 296Q351 287 354 276Q331 285 311 277" fill="#d6dfd8"/>
    <!-- Wing reaches the handlebars. -->
    <path d="M378 254Q410 266 438 282L508 274Q519 276 516 283L438 295Q399 290 376 275" fill="#e3e9df"/>
    <!-- Vast, slightly ridiculous bill and pouch. -->
    <path d="M480 188L670 209Q624 224 590 258Q551 279 512 241L479 206Z" fill="#f6bb53"/>
    <path d="M480 188Q559 184 676 207L669 216L484 207Z" fill="#ef8e3e"/>
    <path d="M511 217Q539 250 579 252" fill="none" stroke="#d88b35" stroke-width="3"/>
    <!-- A fish peeks out: lunch is already packed. -->
    <path d="M580 225Q600 214 619 228L632 217L630 239L617 234Q596 245 580 225Z" fill="#77bdb3" stroke-width="2.5"/>
    <circle cx="591" cy="226" r="2.5" fill="#25343c" stroke="none"/>
    <path d="M601 225L606 232" fill="none" stroke-width="2"/>
    <!-- Unimpressed expression. -->
    <circle cx="469" cy="179" r="10" fill="white" stroke-width="2"/>
    <circle cx="473" cy="180" r="3.5" fill="#25343c" stroke="none"/>
    <path d="M458 170L480 174" stroke-width="4"/>
    <!-- Tiny helmet. -->
    <path d="M432 158Q430 133 455 129Q480 127 488 157Z" fill="#ef704b"/>
    <path d="M441 137L446 151M455 134L460 150M469 137L475 151" stroke-width="3"/>
    <path d="M435 160Q442 199 458 202L478 193" fill="none" stroke-width="3"/>
  </g>

  <!-- Near leg follows the pedal around the crank. -->
  <path d="M356 312Q333 356 354 396L379 449" fill="none" stroke="#25343c" stroke-width="17" stroke-linecap="round">
    <animate attributeName="d" values="M356 312Q333 356 354 396L379 449;M356 312Q326 351 336 383L355 425;M356 312Q344 344 361 368L379 401;M356 312Q365 349 388 378L403 425;M356 312Q333 356 354 396L379 449" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <path d="M356 312Q333 356 354 396L379 449" fill="none" stroke="#efac42" stroke-width="10" stroke-linecap="round">
    <animate attributeName="d" values="M356 312Q333 356 354 396L379 449;M356 312Q326 351 336 383L355 425;M356 312Q344 344 361 368L379 401;M356 312Q365 349 388 378L403 425;M356 312Q333 356 354 396L379 449" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(379 425)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M0-24V24" stroke="#25343c" stroke-width="6"/>
      <g transform="translate(0 24)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <path d="M-10-5L4-8L22 2L-11 3Z" fill="#efac42" stroke="#25343c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-13 7H23" stroke="#25343c" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>
      <circle r="5" fill="#25343c"/>
    </g>
  </g>

  <g fill="none" stroke="#25343c" stroke-width="3" stroke-linecap="round">
    <path d="M197 326H235M207 339H229M600 453H626"/>
  </g>
  <text x="400" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#25343c">Huge bill. Zero gas money.</text>

  <rect x="0" y="554" width="800" height="46" fill="#25343c"/>
  <text x="400" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff6df">2026-10-25 19:30:01 SGT (UTC+08:00)</text>
</svg>