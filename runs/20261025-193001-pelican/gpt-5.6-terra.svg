<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon of a proud pelican riding an undersized bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.3s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center bottom; animation: bob .65s ease-in-out infinite alternate; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .65s linear infinite; }
    .beak { transform-box: fill-box; transform-origin: left center; animation: squawk 1.8s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes squawk { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }
  </style>

  <rect width="800" height="600" fill="#b9e9f5"/>
  <path d="M0 360 Q100 310 200 360 T400 350 T600 365 T800 340 V520 H0Z" fill="#8dcc75"/>
  <path d="M0 416 Q120 380 245 417 T485 402 T800 422 V520 H0Z" fill="#6ead59"/>
  <path d="M0 470 Q150 430 310 475 T590 455 T800 470 V520 H0Z" fill="#d9b560"/>
  <path d="M0 478 Q180 453 350 485 T800 475" fill="none" stroke="#b48a43" stroke-width="8" stroke-dasharray="12 15"/>

  <g fill="#fff" opacity=".85">
    <ellipse cx="123" cy="105" rx="42" ry="15"/>
    <ellipse cx="158" cy="105" rx="32" ry="13"/>
    <ellipse cx="623" cy="139" rx="50" ry="16"/>
    <ellipse cx="665" cy="137" rx="34" ry="13"/>
  </g>

  <text x="400" y="60" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="38" fill="#17324d">PELICAN PEDALS FOR PROGRESS!</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-style="italic" fill="#31546c">“The economy may wobble, but this bird refuses to coast.”</text>

