  <rect y="520" width="800" height="80" fill="#17324d"/>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffffff">A majestic commuter, bravely reducing the national fish deficit one wobble at a time.</text>
  <text x="400" y="579" text-anchor="middle" font-family="monospace" font-size="15" fill="#b9e9f5">2026-10-25 19:33:05 SGT (UTC+08:00)</text>
