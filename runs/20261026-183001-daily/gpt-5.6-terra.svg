<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Knight moves from square 6 on a 4 by 4 grid</title>
  <desc id="desc">Squares 4, 12, 13, and 15 are reachable in one knight move from square 6.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="40" y="24" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">4×4 Knight Move Grid</text>

  <g stroke="#374151" stroke-width="2">
    <rect x="40" y="40" width="55" height="55" fill="#f8fafc"/>
    <rect x="95" y="40" width="55" height="55" fill="#f8fafc"/>
    <rect x="150" y="40" width="55" height="55" fill="#f8fafc"/>
    <rect x="205" y="40" width="55" height="55" fill="#fbbf24"/>

    <rect x="40" y="95" width="55" height="55" fill="#f8fafc"/>
    <rect x="95" y="95" width="55" height="55" fill="#dbeafe"/>
    <rect x="150" y="95" width="55" height="55" fill="#f8fafc"/>
    <rect x="205" y="95" width="55" height="55" fill="#f8fafc"/>

    <rect x="40" y="150" width="55" height="55" fill="#f8fafc"/>
    <rect x="95" y="150" width="55" height="55" fill="#f8fafc"/>
    <rect x="150" y="150" width="55" height="55" fill="#f8fafc"/>
    <rect x="205" y="150" width="55" height="55" fill="#fbbf24"/>

    <rect x="40" y="205" width="55" height="55" fill="#fbbf24"/>
    <rect x="95" y="205" width="55" height="55" fill="#f8fafc"/>
    <rect x="150" y="205" width="55" height="55" fill="#fbbf24"/>
    <rect x="205" y="205" width="55" height="55" fill="#f8fafc"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111827">
    <text x="67.5" y="67.5">1</text><text x="122.5" y="67.5">2</text><text x="177.5" y="67.5">3</text><text x="232.5" y="67.5">4</text>
    <text x="67.5" y="122.5">5</text><text x="122.5" y="122.5" fill="#1d4ed8">6</text><text x="177.5" y="122.5">7</text><text x="232.5" y="122.5">8</text>
    <text x="67.5" y="177.5">9</text><text x="122.5" y="177.5">10</text><text x="177.5" y="177.5">11</text><text x="232.5" y="177.5">12</text>
    <text x="67.5" y="232.5">13</text><text x="122.5" y="232.5">14</text><text x="177.5" y="232.5">15</text><text x="232.5" y="232.5">16</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="310" y="72" font-size="22" font-weight="bold">Legend</text>
    <rect x="310" y="94" width="22" height="22" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
    <text x="344" y="111" font-size="16">Starting square: 6</text>
    <rect x="310" y="132" width="22" height="22" fill="#fbbf24" stroke="#374151" stroke-width="2"/>
    <text x="344" y="149" font-size="16">Reachable in one move</text>
    <text x="310" y="191" font-size="18" font-weight="bold">Shaded squares: 4</text>
    <text x="310" y="222" font-size="18">Numbers: 4, 12, 13, 15</text>
  </g>

  <line x1="40" y1="330" x2="560" y2="330" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="365" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">2026-10-26 18:35:11 SGT (UTC+08:00)</text>
</svg>