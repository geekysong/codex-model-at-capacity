<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedals Into Trouble</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly making a very questionable delivery.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de5ff"/>
      <stop offset="1" stop-color="#f7f0c2"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b68"/>
      <stop offset="1" stop-color="#292d38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#18202b" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="55" fill="#fff4a8" opacity=".85"/>
  <path d="M0 270 Q120 210 240 270 T480 265 T800 255 V390 H0Z" fill="#8acb91"/>
  <path d="M0 330 Q130 280 270 330 T540 325 T800 315 V420 H0Z" fill="#5aaf78"/>
  <rect y="390" width="800" height="210" fill="url(#road)"/>
  <path d="M0 470 Q180 445 360 470 T800 470" fill="none" stroke="#f8d66d" stroke-width="8" stroke-dasharray="46 30" opacity=".9"/>

  <g filter="url(#shadow)">
    <rect x="38" y="28" width="724" height="104" rx="22" fill="#fffdf2" stroke="#263746" stroke-width="5"/>
    <text x="400" y="73" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#d4473d">PELICAN EXPRESS</text>
    <text x="400" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#263746">“When the beak is bigger than the budget.”</text>
  </g>

  <g id="bike" stroke="#202b38" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke-width="9">
      <circle cx="245" cy="470" r="78" fill="#d7edf2"/>
      <circle cx="570" cy="470" r="78" fill="#d7edf2"/>
      <path d="M245 470 L355 365 L430 470 L245 470 L355 365 L570 470 L520 350 L430 470"/>
      <path d="M520 350 L570 330 M520 350 L500 315"/>
      <path d="M350 365 L330 330"/>
    </g>
    <g fill="#ef6b51" stroke-width="6">
      <circle cx="355" cy="365" r="14"/>
      <circle cx="430" cy="470" r="13"/>
    </g>
    <g id="pedals" stroke-width="6">
      <path d="M430 470 L394 438 M430 470 L466 502"/>
      <path d="M382 432 h25 M454 495 h25"/>
      <animateTransform attributeName="transform" type="rotate" from="0 430 470" to="360 430 470" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g fill="none" stroke="#eaf7f8" stroke-width="3" opacity=".75">
      <path d="M245 398 V542 M173 470 H317 M190 415 L300 525 M190 525 L300 415"/>
      <path d="M570 398 V542 M498 470 H642 M515 415 L625 525 M515 525 L625 415"/>
    </g>
    <g stroke="#202b38" stroke-width="7">
      <path d="M570 470 L570 330"/>
      <path d="M570 330 Q600 315 625 328"/>
    </g>
    <g fill="#f3c24f" stroke-width="5">
      <path d="M552 324 Q570 305 592 322 L587 344 Q568 350 551 337Z"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <g id="pelican" stroke="#202b38" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M365 350 Q333 315 343 268 Q355 218 409 213 Q459 208 475 252 Q489 291 456 326 L431 355Z" fill="#f7f5e8" stroke-width="7"/>
    <path d="M386 230 Q377 178 414 157 Q449 139 477 164 Q505 190 481 240 Q459 218 426 218Z" fill="#f7f5e8" stroke-width="7"/>
    <path d="M471 177 Q530 185 600 223 Q626 238 603 256 Q546 261 473 235Z" fill="#eaa65a" stroke-width="7"/>
    <path d="M600 223 Q624 232 637 246 Q620 266 600 256" fill="#d98244" stroke-width="6"/>
    <circle cx="465" cy="190" r="8" fill="#202b38" stroke="none"/>
    <path d="M383 263 Q418 282 455 262" fill="none" stroke="#202b38" stroke-width="6"/>
    <path d="M374 291 Q342 320 312 337 Q299 346 311 358 Q349 354 394 322Z" fill="#e5e1ce" stroke-width="7"/>
    <path d="M430 351 L423 386 M455 344 L473 381" fill="none" stroke="#eaa65a" stroke-width="8"/>
    <path d="M410 388 q16 9 29 0 M463 383 q14 8 27 0" fill="none" stroke="#eaa65a" stroke-width="7"/>
    <path d="M488 287 q44 15 56 54" fill="none" stroke="#d4473d" stroke-width="8"/>
    <rect x="535" y="302" width="74" height="51" rx="8" fill="#d4473d" stroke-width="6"/>
    <text x="572" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#fffdf2" stroke="none">TAXES</text>
  </g>

  <g font-family="Arial, sans-serif" font-weight="700" fill="#263746">
    <path d="M175 185 Q242 150 316 188" fill="none" stroke="#263746" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="176" y="170" font-size="19">HONK IF YOU</text>
    <text x="176" y="194" font-size="19">HATE TRAFFIC</text>
    <path d="M307 197 L345 233" fill="none" stroke="#263746" stroke-width="4"/>
  </g>

  <rect x="90" y="548" width="620" height="34" rx="12" fill="#fffdf2" stroke="#263746" stroke-width="3"/>
  <text x="400" y="571" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263746">2026-10-29 07:02:23 SGT (UTC+08:00)</text>
</svg>