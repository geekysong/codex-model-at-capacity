<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical pelican pedals a bicycle while carrying an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555c68"/>
      <stop offset="1" stop-color="#272d38"/>
    </linearGradient>
    <style>
      .ink{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
      .wheel{fill:none;stroke:#17202a;stroke-width:10}
      .spoke{stroke:#8994a3;stroke-width:3}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="115" r="58" fill="#ffd86b" opacity=".9"/>
  <path d="M0 355 Q140 300 280 350 T560 345 T800 330 V430 H0Z" fill="#8ccf76"/>
  <path d="M0 400 Q170 365 350 405 T800 390 V470 H0Z" fill="#5eaa64"/>
  <rect y="430" width="800" height="120" fill="url(#road)"/>
  <path d="M0 495 H800" stroke="#f5d76e" stroke-width="8" stroke-dasharray="48 28"/>

  <text x="40" y="62" class="label" font-size="34" font-weight="900">THE GREAT BEAK ESCAPE</text>
  <text x="42" y="96" class="label" font-size="20" font-weight="700">A pelican discovers that traffic laws are mostly suggestions.</text>

  <g transform="translate(0 0)">
    <g id="bike">
      <circle cx="245" cy="438" r="78" class="wheel"/>
      <circle cx="580" cy="438" r="78" class="wheel"/>
      <g class="spokes">
        <path d="M245 360V516M167 438H323M190 383L300 493M300 383L190 493" class="spoke"/>
        <path d="M580 360V516M502 438H658M525 383L635 493M635 383L525 493" class="spoke"/>
      </g>
      <path d="M245 438 L345 350 L470 438 L245 438 L405 438 L345 350 L580 438 L470 438" fill="none" class="ink" stroke="#d94f4f"/>
      <path d="M345 350 L325 315" class="ink"/>
      <path d="M310 312 H350" class="ink"/>
      <path d="M470 438 L500 390" class="ink"/>
      <path d="M488 385 H520" class="ink"/>
      <circle cx="405" cy="438" r="13" fill="#f4b942" class="ink"/>
      <g id="pedal">
        <path d="M405 438 L435 466" class="ink"/>
        <path d="M435 466 h27" class="ink"/>
        <path d="M405 438 L375 410" class="ink"/>
        <path d="M348 410 h27" class="ink"/>
        <animateTransform attributeName="transform" type="rotate" values="0 405 438;360 405 438" dur="1.5s" repeatCount="indefinite"/>
      </g>
      <g opacity=".95">
        <animateTransform attributeName="transform" type="rotate" values="0 245 438;360 245 438" dur="1.5s" repeatCount="indefinite"/>
        <circle cx="245" cy="438" r="68" class="wheel"/>
      </g>
      <g opacity=".95">
        <animateTransform attributeName="transform" type="rotate" values="0 580 438;360 580 438" dur="1.5s" repeatCount="indefinite"/>
        <circle cx="580" cy="438" r="68" class="wheel"/>
      </g>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.5s" repeatCount="indefinite"/>
      <path d="M340 300 Q360 245 420 250 Q470 254 480 300 Q484 334 450 354 Q400 382 350 350 Q330 334 340 300Z" fill="#f7f5ed" class="ink"/>
      <path d="M370 270 Q345 204 393 170 Q450 131 506 176 Q530 195 518 230 Q505 267 470 275 Q430 286 370 270Z" fill="#fffdf5" class="ink"/>
      <path d="M500 205 Q576 211 646 254 Q662 264 646 278 Q570 300 500 250Z" fill="#f3a83b" class="ink"/>
      <path d="M516 245 Q575 265 639 263" fill="none" stroke="#c77a22" stroke-width="5"/>
      <ellipse cx="452" cy="202" rx="9" ry="13" fill="#17202a"/>
      <path d="M420 163 Q455 132 493 158" fill="none" stroke="#e8a43c" stroke-width="9"/>
      <path d="M389 337 Q370 385 350 414" fill="none" class="ink"/>
      <path d="M445 345 Q450 387 430 414" fill="none" class="ink"/>
      <path d="M340 414 h35 M416 414 h35" class="ink"/>
      <path d="M355 290 Q400 315 450 290" fill="none" stroke="#d9d4c7" stroke-width="8"/>
      <path d="M362 275 Q385 250 403 260" fill="none" stroke="#17202a" stroke-width="5"/>
      <path d="M470 183 Q492 170 510 185" fill="none" stroke="#17202a" stroke-width="5"/>
      <path d="M548 230 Q560 214 576 226" fill="none" stroke="#17202a" stroke-width="5"/>
      <text x="374" y="220" class="label" font-size="16" font-weight="700">HONK!</text>
    </g>

    <g id="fish">
      <path d="M520 150 Q585 112 650 150 Q684 170 650 190 Q585 225 520 190 Q500 170 520 150Z" fill="#79c8d9" class="ink"/>
      <path d="M520 150 L482 130 L492 170 L482 210 L520 190" fill="#5aa7bb" class="ink"/>
      <circle cx="625" cy="163" r="6" fill="#17202a"/>
      <path d="M550 150 Q575 170 550 190" fill="none" stroke="#438d9e" stroke-width="5"/>
      <text x="548" y="178" class="label" font-size="15" font-weight="800">LUNCH?</text>
    </g>
  </g>

  <text x="400" y="535" text-anchor="middle" class="label" font-size="22" font-weight="800">“Why fly when you can pedal dramatically?”</text>
  <rect x="18" y="558" width="764" height="30" rx="8" fill="#ffffff" opacity=".85"/>
  <text x="400" y="580" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-29 07:00:01 SGT (UTC+08:00)</text>
</svg>