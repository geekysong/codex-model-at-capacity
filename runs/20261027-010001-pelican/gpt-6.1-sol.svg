<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Express</title>
  <desc id="desc">A determined pelican pedals a bicycle carrying one tiny fish beneath a sign advertising a massive delivery fee. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#293743" opacity=".06"/>
      <circle cx="12" cy="12" r=".6" fill="#293743" opacity=".05"/>
    </pattern>
    <g id="wheel">
      <circle r="75" fill="#fffdf5" stroke="#243747" stroke-width="11"/>
      <circle r="64" fill="none" stroke="#c1cdd0" stroke-width="2"/>
      <g stroke="#83989f" stroke-width="3">
        <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#ef6b48" stroke="#243747" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M25 104H775" stroke="#243747" stroke-width="3"/>
  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="3" fill="#243747">PELICAN EXPRESS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#57656a">THE GIG ECONOMY HAS GROWN WINGS. AND STILL NEEDS A BIKE.</text>

  <!-- A single sunny waterfront street. -->
  <circle cx="695" cy="158" r="31" fill="#ffc956"/>
  <path d="M0 360Q130 338 250 359T500 358T800 347V441H0Z" fill="#bde0dc"/>
  <path d="M32 385H120M151 372H211M600 382H675M709 370H772" stroke="#80bab9" stroke-width="3" stroke-linecap="round"/>
  <path d="M0 438H800V510H0Z" fill="#e3c8a1"/>
  <path d="M0 439H800" stroke="#243747" stroke-width="4"/>
  <path d="M38 481H112M659 481H742" stroke="#fff4d9" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="403" cy="449" rx="253" ry="15" fill="#243747" opacity=".12"/>

  <!-- The delivery rate sign. -->
  <path d="M110 244V433" stroke="#657f85" stroke-width="8"/>
  <rect x="30" y="146" width="160" height="111" rx="9" fill="#fffdf5" stroke="#243747" stroke-width="4"/>
  <text x="110" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#243747">FISH DELIVERY</text>
  <text x="110" y="209" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="900" fill="#d95336">$19.99</text>
  <text x="110" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#243747">fish sold separately</text>

  <!-- Bicycle wheels and frame. -->
  <use href="#wheel" x="255" y="404"/>
  <use href="#wheel" x="573" y="404"/>
  <g fill="none" stroke="#243747" stroke-linejoin="round" stroke-linecap="round">
    <path d="M255 404L323 300L399 404ZM323 300L526 300L399 404M526 300L573 404" stroke-width="13"/>
    <path d="M255 404L323 300L399 404ZM323 300L526 300L399 404M526 300L573 404" stroke="#ed7050" stroke-width="7"/>
    <path d="M399 404L358 282M337 281H380" stroke-width="10"/>
    <path d="M573 404L511 253L533 235H555" stroke-width="9"/>
    <path d="M551 235H570" stroke="#397e87" stroke-width="12"/>
    <path d="M231 317H297" stroke-width="6"/>
  </g>
  <circle cx="399" cy="404" r="21" fill="#fff4d9" stroke="#243747" stroke-width="5"/>
  <g transform="translate(399 404)">
    <g stroke="#243747" stroke-width="6" stroke-linecap="round">
      <path d="M-24 0H24"/>
      <path d="M-27-6V6M27-6V6" stroke-width="9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- The pelican: enormous delivery capacity, tiny paycheck. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M337 276Q301 303 290 281L301 248Z" fill="#fffdf5" stroke="#243747" stroke-width="4"/>
    <path d="M352 281L348 331L388 380" fill="none" stroke="#243747" stroke-width="14" stroke-linecap="round"/>
    <path d="M352 281L348 331L388 380" fill="none" stroke="#edb24c" stroke-width="8" stroke-linecap="round"/>
    <path d="M379 379L409 386L405 395L374 390Z" fill="#efaa43" stroke="#243747" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="-5 389 385;8 389 385;-5 389 385" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M365 281L397 326L412 372" fill="none" stroke="#243747" stroke-width="13" stroke-linecap="round"/>
    <path d="M365 281L397 326L412 372" fill="none" stroke="#ffc65b" stroke-width="7" stroke-linecap="round"/>
    <path d="M405 369L435 375L432 385L402 381Z" fill="#ffc65b" stroke="#243747" stroke-width="3"/>

    <path d="M310 256Q303 197 349 188Q383 182 401 207L409 246Q406 285 365 294Q329 298 310 256Z" fill="#fffdf5" stroke="#243747" stroke-width="4"/>
    <path d="M329 215Q357 208 379 239Q362 265 334 257Q349 246 342 236" fill="#dce5df" stroke="#243747" stroke-width="3"/>
    <path d="M372 215Q408 219 420 199L428 162Q432 137 457 140Q484 145 477 171L465 217Q447 258 402 253" fill="#fffdf5" stroke="#243747" stroke-width="4"/>
    <path d="M473 164L610 193Q567 213 474 193Z" fill="#ffc457" stroke="#243747" stroke-width="4" stroke-linejoin="round"/>
    <path d="M477 194Q484 256 562 211L610 193Q550 213 477 194Z" fill="#efa257" stroke="#243747" stroke-width="4"/>
    <path d="M492 205Q510 228 548 215" fill="none" stroke="#ce7740" stroke-width="3"/>
    <circle cx="461" cy="164" r="5" fill="#243747"/>
    <path d="M448 151L466 148" stroke="#243747" stroke-width="4" stroke-linecap="round"/>
    <path d="M428 141Q450 119 478 142Z" fill="#397e87" stroke="#243747" stroke-width="4"/>
    <path d="M455 141H490" stroke="#243747" stroke-width="5" stroke-linecap="round"/>
    <path d="M403 242Q452 258 474 240L550 236" fill="none" stroke="#243747" stroke-width="13" stroke-linecap="round"/>
    <path d="M403 242Q452 258 474 240L550 236" fill="none" stroke="#fffdf5" stroke-width="7" stroke-linecap="round"/>
    <path d="M408 230L421 244L409 260L398 244Z" fill="#ed7050" stroke="#243747" stroke-width="2"/>
  </g>

  <!-- One very unimpressed passenger. -->
  <path d="M553 266H645L632 325H566Z" fill="#e6b877" stroke="#243747" stroke-width="4"/>
  <path d="M563 283H640M566 299H636M580 269L586 322M605 269V323M629 269L622 323" fill="none" stroke="#a87848" stroke-width="3"/>
  <path d="M576 264Q594 240 617 260L633 248V275L616 267Q595 281 576 264Z" fill="#70b8bc" stroke="#243747" stroke-width="3"/>
  <circle cx="587" cy="260" r="3" fill="#243747"/>
  <path d="M591 269H600" stroke="#243747" stroke-width="2"/>
  <path d="M638 207Q647 186 670 190H746Q763 190 763 207V246Q763 261 746 261H674L651 277L656 256Q638 255 638 240Z" fill="#fffdf5" stroke="#243747" stroke-width="3"/>
  <text x="701" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243747">“I ordered</text>
  <text x="701" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243747">a cab.”</text>

  <rect y="510" width="800" height="90" fill="#243747"/>
  <text x="400" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff4d9">His bill is enormous. His take-home pay? Peanuts.</text>
  <path d="M100 556H700" stroke="#70838b"/>
  <text x="400" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fff4d9">2026-10-27 01:01:59 SGT (UTC+08:00)</text>
</svg>