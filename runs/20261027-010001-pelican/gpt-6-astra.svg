<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle carrying fish, proudly avoiding expensive fuel. Bicycle wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#c9eff5"/>
      <stop offset="1" stop-color="#f8f4dc"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffcf69"/>
      <stop offset="1" stop-color="#f28a53"/>
    </linearGradient>
    <g id="wheel">
      <circle r="66" fill="#fbf8e8" stroke="#233744" stroke-width="10"/>
      <circle r="57" fill="none" stroke="#9cb4b9" stroke-width="2"/>
      <g stroke="#809ba4" stroke-width="3">
        <path d="M-55 0H55M0-55V55M-39-39L39 39M-39 39L39-39"/>
      </g>
      <circle r="9" fill="#efb549" stroke="#233744" stroke-width="4"/>
      <path d="M-12-61H12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff9eb"/>
  <rect x="16" y="16" width="768" height="514" rx="24" fill="url(#sky)" stroke="#233744" stroke-width="3"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#233744">
    <text x="400" y="68" font-size="45" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="98" font-size="17" letter-spacing="2">ONE BIRD. TWO WHEELS. ZERO DIGNITY.</text>
  </g>

