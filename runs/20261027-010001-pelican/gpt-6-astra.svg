  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#233744" font-size="21" font-weight="bold">
    <text x="171" y="151">“I run on fish.</text>
    <text x="171" y="179">And blind optimism.”</text>
  </g>
  <g fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <path d="M165 345H206M148 360H187M177 375H200"/>
  </g>

  <text x="400" y="511" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#233744">The pelican beat fuel prices. Hills remain undefeated.</text>
