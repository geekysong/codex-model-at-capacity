    <path d="M54 178c-11-21 18-39 33-24 2-26 47-27 51 0 27-7 39 24 17 29H60Z"/>
    <path d="M577 143c-9-17 12-30 24-20 7-25 42-19 43 2 22-5 34 16 15 23h-76Z"/>
  </g>
