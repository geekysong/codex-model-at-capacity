    <text x="697" y="236" font-size="19" font-weight="bold">PETROL</text>
    <text x="697" y="271" font-size="26" font-weight="bold">$?!</text>
    <text x="697" y="289" font-size="11">PER EXISTENTIAL CRISIS</text>
  </g>

