<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Lobby</title>
  <desc id="desc">A smug pelican pedals a bicycle carrying fish. The wheels spin, the pedals turn, and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12V12" fill="none" stroke="#915d32" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <circle r="82" fill="#fff8df" stroke="#203447" stroke-width="12"/>
      <circle r="69" fill="none" stroke="#f2b544" stroke-width="3"/>
      <g stroke="#8299a1" stroke-width="3">
        <path d="M-73 0H73M0-73V73M-52-52L52 52M-52 52L52-52M-28-67L28 67M-67-28L67 28M-67 28L67-28M-28 67L28-67"/>
      </g>
      <circle r="9" fill="#203447"/>
      <path d="M54-43L62-34" stroke="#ec634b" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5da"/>
  <circle cx="690" cy="159" r="48" fill="#f8cd62"/>
  <path d="M0 386Q124 344 235 385T480 378T800 374V514H0Z" fill="#cbdcc2"/>
  <path d="M0 436Q190 420 390 440T800 431V520H0Z" fill="#a7c7b5"/>
  <g fill="#fffdf1" opacity=".9">
    <path d="M44 184Q43 164 65 163Q79 134 103 161Q131 157 135 184Z"/>
    <path d="M536 133Q539 111 563 117Q577 96 592 120Q615 118 618 133Z"/>
  </g>

  <text x="400" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="900" fill="#203447">THE PELICAN PEDAL LOBBY</text>
  <text x="400" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#ae4b37">BIG BEAK. SMALL CARBON FOOTPRINT.</text>

  <!-- Road and stationary bicycle frame -->
  <ellipse cx="408" cy="493" rx="286" ry="15" fill="#203447" opacity=".13"/>
  <path d="M86 494H716" stroke="#203447" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(238 406)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(566 406)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 406L325 300L386 406H238L325 300H514L386 406M514 300L566 406" stroke="#203447" stroke-width="14"/>
    <path d="M238 406L325 300L386 406H238M325 300H514L386 406M514 300L566 406" stroke="#ef6650" stroke-width="8"/>
    <path d="M325 300L314 275M514 300L501 256L529 242" stroke="#203447" stroke-width="9"/>
    <path d="M292 274H339" stroke="#203447" stroke-width="14"/>
    <path d="M523 242H543" stroke="#334f59" stroke-width="12"/>
  </g>
  <path d="M238 398H385Q399 405 385 417H238" fill="none" stroke="#536b72" stroke-width="3"/>

  <!-- A cargo basket full of lobbying expenses -->
  <path d="M542 275L554 332H629L643 275Z" fill="#d8a363" stroke="#203447" stroke-width="4"/>
  <path d="M542 275L554 332H629L643 275Z" fill="url(#basket)"/>
  <g stroke="#203447" stroke-width="3" stroke-linejoin="round">
    <path d="M565 272Q577 238 604 264L624 250L620 277L604 268Q583 289 565 272Z" fill="#6db4b4"/>
    <circle cx="576" cy="267" r="3" fill="#203447" stroke="none"/>
    <path d="M588 272Q597 242 620 259L636 247L636 270L620 263Q606 282 588 272Z" fill="#9cc7bf"/>
    <circle cx="600" cy="262" r="3" fill="#203447" stroke="none"/>
  </g>
  <rect x="555" y="289" width="75" height="28" rx="4" fill="#fff5da" stroke="#203447" stroke-width="2"/>
  <text x="592" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="800" fill="#203447">BIOFUEL</text>

  <!-- Pelican and animated pedaling -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M332 275Q356 298 371 333L386 375" fill="none" stroke="#b87c36" stroke-width="14" stroke-linecap="round"/>
    <path d="M257 235L220 228L241 255L216 257L264 278" fill="#fffef2" stroke="#203447" stroke-width="4" stroke-linejoin="round"/>
    <path d="M268 200Q306 178 355 205Q390 223 375 267Q364 293 315 290Q263 291 249 257Q237 225 268 200Z" fill="#fffef2" stroke="#203447" stroke-width="5"/>
    <path d="M344 237Q371 224 375 192L378 157Q381 131 405 132Q433 132 431 155L424 219Q420 253 373 270" fill="#fffef2" stroke="#203447" stroke-width="5"/>
    <path d="M276 220Q305 209 340 238Q326 264 283 253L300 243L279 237" fill="#dce8df" stroke="#203447" stroke-width="4" stroke-linejoin="round"/>

    <!-- Outrageously aerodynamic beak -->
    <path d="M421 168L575 190Q525 230 459 207Q433 199 421 177Z" fill="#f7b94b" stroke="#203447" stroke-width="4" stroke-linejoin="round"/>
    <path d="M421 164Q476 158 578 190L424 179Z" fill="#f7d162" stroke="#203447" stroke-width="4" stroke-linejoin="round"/>
    <path d="M443 186Q478 209 529 199" fill="none" stroke="#df8e38" stroke-width="3"/>
    <circle cx="405" cy="156" r="12" fill="white" stroke="#203447" stroke-width="3"/>
    <circle cx="409" cy="156" r="4" fill="#203447"/>
    <path d="M392 140L416 144" stroke="#203447" stroke-width="4" stroke-linecap="round"/>

    <!-- Bicycle helmet -->
    <path d="M374 137Q375 108 405 109Q433 110 439 137Z" fill="#ef6650" stroke="#203447" stroke-width="4"/>
    <path d="M388 118L386 128M403 116V127M417 119L420 129" stroke="#203447" stroke-width="4" stroke-linecap="round"/>
    <path d="M379 138L389 176L408 182" fill="none" stroke="#203447" stroke-width="3"/>

    <path d="M345 229Q389 220 420 238L490 250Q508 255 525 243" fill="none" stroke="#203447" stroke-width="15" stroke-linecap="round"/>
    <path d="M345 229Q389 220 420 238L490 250Q508 255 525 243" fill="none" stroke="#fffef2" stroke-width="10" stroke-linecap="round"/>
  </g>

  <path d="M340 280Q313 326 349 353L404 391" fill="none" stroke="#eda849" stroke-width="15" stroke-linecap="round">
    <animate attributeName="d" values="M340 280Q313 326 349 353L404 391;M340 276Q366 315 387 348L368 421;M340 280Q313 326 349 353L404 391" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(386 406)">
    <g>
      <path d="M-24 0H24" stroke="#203447" stroke-width="7" stroke-linecap="round"/>
      <path d="M-27-9V9M27-9V9" stroke="#203447" stroke-width="9" stroke-linecap="round"/>
      <circle r="10" fill="#f6cd65" stroke="#203447" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="-40" to="320" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Fixed speech and captions stay readable -->
  <path d="M63 212Q63 198 77 198H202Q216 198 216 212V264Q216 277 202 277H170L189 299L146 277H77Q63 277 63 264Z" fill="#fffdf3" stroke="#203447" stroke-width="3"/>
  <text x="139" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#203447">
    <tspan x="139">“My other ride</tspan>
    <tspan x="139" dy="21">is a taxpayer-</tspan>
    <tspan x="139" dy="21">funded yacht.”</tspan>
  </text>

  <rect x="0" y="518" width="800" height="82" fill="#203447"/>
  <text x="400" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff5da">He pedals for the planet. He bills it to the fish.</text>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#dce8df">2026-10-31 23:00:02 SGT (UTC+08:00)</text>
</svg>