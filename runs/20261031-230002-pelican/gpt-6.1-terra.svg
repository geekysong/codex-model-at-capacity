<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A cheerful pelican rides a bicycle, delivering an oversized fish while its wheels turn and its body bobs.</desc>
  <defs>
    <style>
      .ink { stroke: #263b46; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #263b46; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.5s linear infinite; }
      .rider { animation: bob 0.65s ease-in-out infinite alternate; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: spin 2.5s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedal { animation: none; } }
    </style>
  </defs>

