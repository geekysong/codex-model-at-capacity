<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE DAILY WADDLE</title>
  <desc id="desc">A smug pelican pedals a bicycle past a sign that reads “CARBON NEUTRALISH.”</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center; animation: bob .6s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
  </style>

  <rect width="800" height="600" fill="#d9f3f2"/>
  <circle cx="700" cy="115" r="54" fill="#ffd166"/>
  <path d="M0 356 Q120 315 235 350 T470 345 T800 330 V510 H0Z" fill="#a8d98f"/>
  <path d="M0 405 Q180 380 360 409 T800 390 V520 H0Z" fill="#80c879"/>
  <path d="M0 478H800" stroke="#434957" stroke-width="9"/>
  <path d="M0 483H800" stroke="#f7f2db" stroke-width="3" stroke-dasharray="28 25"/>

  <text x="40" y="62" font-size="34" font-weight="900" letter-spacing="1" fill="#19324a">THE DAILY WADDLE</text>
  <text x="42" y="94" font-size="17" font-weight="700" fill="#36566a">Local bird pedals furiously to avoid a very small errand.</text>

  <g transform="translate(627 275) rotate(5)">
    <path d="M0 0V106" stroke="#72543a" stroke-width="9"/>
    <rect x="-69" y="-26" width="139" height="49" rx="7" fill="#fff4c6" stroke="#72543a" stroke-width="4"/>
    <text x="0" y="-5" text-anchor="middle" font-size="13" font-weight="900" fill="#364b45">CARBON</text>
    <text x="0" y="12" text-anchor="middle" font-size="13" font-weight="900" fill="#364b45">NEUTRALISH</text>
  </g>

  <g class="wheel" fill="none" stroke="#26384c" stroke-width="7">
    <circle cx="224" cy="420" r="66"/>
    <path d="M224 354V486M158 420H290M177 373L271 467M271 373L177 467"/>
  </g>
  <g class="wheel" fill="none" stroke="#26384c" stroke-width="7">
    <circle cx="482" cy="420" r="66"/>
    <path d="M482 354V486M416 420H548M435 373L529 467M529 373L435 467"/>
  </g>

  <g fill="none" stroke="#e24b3b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M224 420L323 420L385 344L482 420L323 420L274 356L224 420"/>
    <path d="M482 420L511 347"/>
    <path d="M489 347H531"/>
    <path d="M258 348H290"/>
    <path d="M323 420L353 391"/>
  </g>
  <circle cx="323" cy="420" r="13" fill="#f6b544" stroke="#26384c" stroke-width="4"/>
  <path d="M323 420L350 439M323 420L298 401" stroke="#26384c" stroke-width="6" stroke-linecap="round"/>

  <g class="rider">
    <!-- Pelican body and neck -->
    <path d="M282 250 Q289 210 335 203 Q373 199 392 232 Q402 257 385 278 Q363 298 326 286 Q292 277 282 250Z" fill="#fffdf4" stroke="#273548" stroke-width="5"/>
    <path d="M350 222 Q366 187 357 158 Q350 136 371 122 Q394 107 421 123 Q438 137 428 157 Q417 174 391 168 Q381 166 379 179 Q379 202 392 229" fill="#fffdf4" stroke="#273548" stroke-width="5"/>
    <path d="M383 155 Q424 148 467 159 Q478 163 469 172 Q440 190 389 176Z" fill="#f2a53a" stroke="#273548" stroke-width="4"/>
    <path d="M388 171 Q426 177 461 170 Q448 193 419 199 Q396 196 388 171Z" fill="#e77836" stroke="#273548" stroke-width="4"/>
    <path d="M402 176 Q420 182 440 176" fill="none" stroke="#9d4a2c" stroke-width="3"/>
    <!-- Face -->
    <circle cx="401" cy="139" r="5.5" fill="#273548"/>
    <path d="M392 127 Q402 121 412 128" fill="none" stroke="#273548" stroke-width="4" stroke-linecap="round"/>
    <!-- Wing and feather details -->
    <path d="M302 239 Q330 219 365 239 Q373 250 362 263 Q336 278 309 261Z" fill="#e9edf0" stroke="#273548" stroke-width="4"/>
    <path d="M321 241L345 261M337 236L359 253" stroke="#aab7c0" stroke-width="3"/>
    <!-- Cyclist cap -->
    <path d="M366 119 Q381 92 409 105 Q420 110 424 126 Q399 119 377 132Z" fill="#e24b3b" stroke="#273548" stroke-width="4"/>
    <path d="M377 130Q404 119 433 129" fill="none" stroke="#273548" stroke-width="5" stroke-linecap="round"/>
    <!-- legs on pedals -->
    <path d="M337 277L354 333L323 391M369 278L383 321L350 391" fill="none" stroke="#f2a53a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M313 393L337 393M340 394L362 394" stroke="#273548" stroke-width="7" stroke-linecap="round"/>
    <!-- handlebar wing-arm -->
    <path d="M365 244L407 282L442 298" fill="none" stroke="#fffdf4" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M365 244L407 282L442 298" fill="none" stroke="#273548" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M104 302l-20-10M115 324l-26 1M127 281l-13-21" stroke="#fffdf4" stroke-width="5" stroke-linecap="round"/>
  <path d="M507 251 Q522 231 538 251 Q554 231 569 251" fill="none" stroke="#fffdf4" stroke-width="5" stroke-linecap="round"/>
  <rect x="40" y="508" width="720" height="1" fill="#7b9b91"/>
  <text x="400" y="541" text-anchor="middle" font-size="16" font-weight="700" fill="#26384c">“I’m cutting down on car trips,” he honked, commuting to the pond.</text>
  <text x="400" y="577" text-anchor="middle" font-size="15" font-weight="700" fill="#405d6e">2026-10-31 23:02:22 SGT (UTC+08:00)</text>
</svg>