<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical pelican rides a bicycle while carrying an absurdly tiny helmet.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe8ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#69727c"/>
      <stop offset="1" stop-color="#353b43"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#14202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17232b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17232b}
      .small{font-size:17px;font-weight:700}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="104" cy="105" r="46" fill="#ffe77a" opacity=".9"/>
  <path d="M0 330 Q140 285 280 325 T560 320 T800 315 V430 H0Z" fill="#a4d97d"/>
  <path d="M0 370 Q160 330 320 365 T640 360 T800 350 V430 H0Z" fill="#78bd68"/>
  <rect y="420" width="800" height="180" fill="url(#road)"/>
  <path d="M0 500 H800" stroke="#f4d35e" stroke-width="8" stroke-dasharray="42 28"/>
  <path d="M40 451 C95 430 145 430 195 451" fill="none" stroke="#e8f6f8" stroke-width="5" opacity=".6"/>
  <path d="M600 451 C660 430 715 430 770 451" fill="none" stroke="#e8f6f8" stroke-width="5" opacity=".6"/>

  <g class="label" font-weight="900">
    <text x="400" y="62" text-anchor="middle" font-size="39" fill="#173f5f" stroke="#ffffff" stroke-width="8" paint-order="stroke">PELICAN PEDAL PANIC</text>
    <text x="400" y="92" text-anchor="middle" font-size="19" fill="#d1495b">“Because walking is for birds with less ambition.”</text>
  </g>

  <g filter="url(#shadow)">
    <g id="bike">
      <g id="wheelRear">
        <circle cx="270" cy="430" r="76" fill="#e9eef2" class="ink"/>
        <circle cx="270" cy="430" r="11" fill="#d1495b" class="ink"/>
        <g stroke="#60717d" stroke-width="3">
          <path d="M270 354V506 M194 430H346 M216 376L324 484 M324 376L216 484"/>
        </g>
      </g>
      <g id="wheelFront">
        <circle cx="590" cy="430" r="76" fill="#e9eef2" class="ink"/>
        <circle cx="590" cy="430" r="11" fill="#d1495b" class="ink"/>
        <g stroke="#60717d" stroke-width="3">
          <path d="M590 354V506 M514 430H666 M536 376L644 484 M644 376L536 484"/>
        </g>
      </g>
      <path d="M270 430 L350 315 L490 430 L270 430 L430 430 L350 315 L520 315 L590 430" fill="none" class="ink" stroke="#d1495b"/>
      <path d="M350 315 L330 286" class="ink" fill="none"/>
      <path d="M312 284 H350" class="ink" fill="none"/>
      <path d="M520 315 L536 278" class="ink" fill="none"/>
      <path d="M510 276 H551" class="ink" fill="none"/>
      <circle cx="430" cy="430" r="25" fill="#f2c14e" class="ink"/>
      <path d="M430 430 l-26 -20 M430 430 l28 18" class="ink" fill="none"/>
      <circle cx="402" cy="410" r="8" fill="#17232b"/>
      <circle cx="458" cy="448" r="8" fill="#17232b"/>
      <path d="M580 349 Q614 330 640 349" class="ink" fill="none"/>
      <path d="M590 346 L590 330" class="ink"/>
    </g>

    <g id="pelican">
      <g id="pelicanBody">
        <ellipse cx="414" cy="255" rx="104" ry="91" fill="#f7f4ed" class="ink"/>
        <path d="M348 225 Q300 244 292 293 Q340 300 373 267Z" fill="#d9e2e5" class="ink"/>
        <path d="M380 314 Q418 350 475 327 L500 286 Q450 299 401 282Z" fill="#c5d2d8" class="ink"/>
        <path d="M397 176 Q420 142 457 160 Q478 174 469 205 L437 227 L398 209Z" fill="#f7f4ed" class="ink"/>
        <path d="M437 178 Q499 165 559 196 Q523 224 460 223 Q431 217 412 202Z" fill="#f29f61" class="ink"/>
        <path d="M438 205 Q496 218 554 196 Q527 247 454 241Z" fill="#e6814e" class="ink"/>
        <circle cx="439" cy="181" r="9" fill="#17232b"/>
        <circle cx="442" cy="178" r="3" fill="#ffffff"/>
        <path d="M415 169 Q430 150 451 157" fill="none" stroke="#d1495b" stroke-width="8"/>
        <path d="M405 165 Q392 137 415 124 Q433 114 447 129 L457 157" fill="#d1495b" class="ink"/>
        <path d="M402 134 Q410 111 434 116" fill="none" class="ink"/>
        <path d="M381 274 Q367 323 380 348" class="ink" fill="none"/>
        <path d="M455 278 Q467 321 454 347" class="ink" fill="none"/>
        <path d="M373 348 h-25 M450 347 h27" class="ink" fill="none"/>
        <path d="M350 267 Q330 249 320 226" class="ink" fill="none"/>
        <path d="M474 263 Q502 250 514 225" class="ink" fill="none"/>
        <path d="M327 217 Q292 191 276 164" fill="none" stroke="#f7f4ed" stroke-width="25" class="ink"/>
        <path d="M505 226 Q530 247 548 274" fill="none" stroke="#f7f4ed" stroke-width="24" class="ink"/>
        <path d="M278 164 q-8-18 6-27 q14-8 24 8" fill="none" class="ink"/>
        <path d="M548 274 q16 12 25 0" fill="none" class="ink"/>
        <rect x="367" y="112" width="61" height="28" rx="8" fill="#48a9a6" class="ink" transform="rotate(-9 397 126)"/>
        <text x="397" y="132" text-anchor="middle" font-size="14" class="label" fill="#ffffff">TINY HELMET</text>
      </g>
    </g>
  </g>

  <g class="label">
    <path d="M112 176 Q160 142 230 171" fill="none" stroke="#17232b" stroke-width="4"/>
    <text x="112" y="151" font-size="18" font-weight="900">NO LICENSE.</text>
    <text x="112" y="173" font-size="18" font-weight="900">JUST FLAIR.</text>
    <path d="M650 180 q48-25 90 4" fill="none" stroke="#17232b" stroke-width="4"/>
    <text x="646" y="158" font-size="18" font-weight="900">BEAK-FAST</text>
    <text x="646" y="180" font-size="18" font-weight="900">COMMUTER!</text>
  </g>

  <g class="label" font-size="18" font-weight="700">
    <rect x="178" y="548" width="444" height="35" rx="10" fill="#ffffff" opacity=".92" stroke="#17232b" stroke-width="3"/>
    <text x="400" y="572" text-anchor="middle">2026-10-27 07:01:33 SGT (UTC+08:00)</text>
  </g>

  <g>
    <animateTransform xlink:href="#wheelRear" attributeName="transform" type="rotate" from="0 270 430" to="360 270 430" dur="1.2s" repeatCount="indefinite"/>
    <animateTransform xlink:href="#wheelFront" attributeName="transform" type="rotate" from="0 590 430" to="360 590 430" dur="1.2s" repeatCount="indefinite"/>
    <animateTransform xlink:href="#bike" attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="0.6s" repeatCount="indefinite"/>
    <animateTransform xlink:href="#pelicanBody" attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.6s" repeatCount="indefinite"/>
  </g>
</svg>