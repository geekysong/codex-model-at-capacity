<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN POWER</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#f8f2c6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#263238;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#263238}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="120" r="58" fill="#fff6a8" opacity=".9"/>
  <path d="M0 400 Q140 350 280 405 T560 395 T800 410 V520 H0Z" fill="#8bd17c"/>
  <path d="M0 455 Q180 420 350 462 T800 450 V520 H0Z" fill="#5faf68"/>

  <text x="400" y="66" text-anchor="middle" class="label" font-size="44" font-weight="900" letter-spacing="3">PELICAN POWER</text>
  <text x="400" y="103" text-anchor="middle" class="label" font-size="21" font-weight="700">“Why walk when you can wobble with style?”</text>

  <g filter="url(#shadow)">
    <ellipse cx="390" cy="505" rx="265" ry="22" fill="#263238" opacity=".2"/>

    <g id="bike">
      <g id="rearWheel">
        <circle cx="250" cy="430" r="72" fill="#f4f4f4" class="ink"/>
        <circle cx="250" cy="430" r="9" fill="#263238"/>
        <g stroke="#607d8b" stroke-width="4">
          <path d="M250 358V502M178 430H322M199 379L301 481M199 481L301 379"/>
        </g>
      </g>
      <g id="frontWheel">
        <circle cx="565" cy="430" r="72" fill="#f4f4f4" class="ink"/>
        <circle cx="565" cy="430" r="9" fill="#263238"/>
        <g stroke="#607d8b" stroke-width="4">
          <path d="M565 358V502M493 430H637M514 379L616 481M514 481L616 379"/>
        </g>
      </g>

      <path d="M250 430 L350 330 L455 430 L565 430 L455 430 L400 365 L350 330 L300 430 Z" fill="none" class="ink"/>
      <path d="M455 430 L430 315" fill="none" class="ink"/>
      <path d="M410 315 H455" fill="none" class="ink"/>
      <path d="M350 330 L325 294" fill="none" class="ink"/>
      <path d="M300 294 H350" fill="none" class="ink"/>
      <circle cx="455" cy="430" r="17" fill="#ffca28" class="ink"/>
      <path d="M455 430 l-32 22 M455 430 l28 22" class="ink" fill="none"/>
      <path d="M390 350 L425 350" class="ink" fill="none"/>
      <path d="M532 350 L565 430" class="ink" fill="none"/>
      <path d="M520 345 L548 340" class="ink" fill="none"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="392" cy="270" rx="94" ry="105" fill="#f7f7f7" class="ink"/>
      <path d="M330 286 Q365 330 415 312 Q450 300 468 270 Q432 282 405 262 Q375 240 330 286Z" fill="#d7e4ea" class="ink"/>
      <ellipse cx="392" cy="182" rx="70" ry="62" fill="#ffffff" class="ink"/>
      <path d="M430 190 Q535 188 584 228 Q540 260 430 230 Q397 215 430 190Z" fill="#f5a623" class="ink"/>
      <path d="M431 230 Q500 250 568 231 Q520 286 433 246Z" fill="#ffbf3c" class="ink"/>
      <circle cx="420" cy="172" r="11" fill="#263238"/>
      <circle cx="424" cy="168" r="3" fill="#fff"/>
      <path d="M354 158 Q378 130 405 145" fill="none" class="ink"/>
      <path d="M357 220 Q333 246 344 276" fill="none" class="ink"/>
      <path d="M432 301 Q470 332 484 371" fill="none" class="ink"/>
      <path d="M484 371 Q500 386 519 376" fill="none" class="ink"/>
      <path d="M352 308 Q330 344 338 382" fill="none" class="ink"/>
      <path d="M338 382 Q350 396 369 386" fill="none" class="ink"/>
      <path d="M370 384 L350 430" class="ink" fill="none"/>
      <path d="M480 374 L455 430" class="ink" fill="none"/>
      <path d="M350 430 l-22 3 M350 430 l18 8" class="ink" fill="none"/>
      <path d="M455 430 l-18 7 M455 430 l22 2" class="ink" fill="none"/>
      <path d="M330 251 Q290 230 275 198" fill="none" class="ink"/>
      <path d="M275 198 Q290 184 308 195" fill="#c8d9df" class="ink"/>
      <text x="286" y="120" class="label" font-size="18" font-weight="700" transform="rotate(-12 286 120)">BEAKFAST EXPRESS!</text>
    </g>
  </g>

  <g class="label" font-size="18" font-weight="700">
    <text x="92" y="545">NO LICENSE. NO PROBLEM.</text>
    <text x="708" y="545" text-anchor="end">HONK IF YOU LOVE FISH</text>
  </g>

  <rect x="0" y="558" width="800" height="42" fill="#263238"/>
  <text x="400" y="585" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">2026-10-27 07:00:43 SGT (UTC+08:00)</text>

  <animateTransform href="#rearWheel" attributeName="transform" type="rotate" from="0 250 430" to="360 250 430" dur="1.2s" repeatCount="indefinite"/>
  <animateTransform href="#frontWheel" attributeName="transform" type="rotate" from="0 565 430" to="360 565 430" dur="1.2s" repeatCount="indefinite"/>
</svg>