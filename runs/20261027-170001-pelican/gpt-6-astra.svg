<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PEL-I-CAN RIDE?</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an enormous fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#18232d" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#18232d;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#18232d}
      .small{font-size:18px;font-weight:700}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="42" fill="#fff5a8" opacity=".8"/>
  <path d="M0 265 Q120 215 245 260 T500 255 T800 245 V370 H0Z" fill="#b9e7c3"/>
  <path d="M0 320 Q160 280 320 320 T640 315 T800 300 V390 H0Z" fill="#79bd83"/>
  <path d="M0 405 Q210 375 400 405 T800 400 V600 H0Z" fill="url(#road)"/>
  <path d="M0 480 H800" stroke="#f8d56b" stroke-width="8" stroke-dasharray="48 30"/>

  <g class="label" text-anchor="middle">
    <text x="400" y="58" font-size="40" font-weight="900" letter-spacing="3">PEL-I-CAN RIDE?</text>
    <text x="400" y="88" font-size="19" font-weight="700">A beak, two wheels, and absolutely no helmet plan.</text>
  </g>

  <g filter="url(#shadow)">
