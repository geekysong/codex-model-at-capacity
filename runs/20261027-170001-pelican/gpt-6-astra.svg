  <g class="label">
    <text x="45" y="365" font-size="22" font-weight="900">LOCAL BIRD</text>
    <text x="45" y="390" font-size="18" font-weight="700">IGNORES TRAFFIC LAWS</text>
    <path d="M170 380 Q230 365 278 330" fill="none" stroke="#18232d" stroke-width="4"/>
    <path d="M278 330 l-12 3 l7 10" fill="none" stroke="#18232d" stroke-width="4"/>
  </g>

  <rect x="20" y="548" width="760" height="38" rx="12" fill="#fff9df" stroke="#18232d" stroke-width="3"/>
  <text x="400" y="573" text-anchor="middle" class="label small">2026-10-27 17:00:01 SGT (UTC+08:00)</text>
</svg>