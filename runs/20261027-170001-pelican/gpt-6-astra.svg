      <path d="M355 250 Q315 265 326 318 Q340 351 388 332 L410 300Z" fill="#d7e2e3" class="ink"/>
      <path d="M332 284 Q285 308 250 292 Q220 277 210 300 Q252 342 330 322 Q365 313 385 292Z" fill="#e89a45" class="ink"/>
      <path d="M214 300 Q270 316 333 300" fill="none" stroke="#a9552e" stroke-width="5"/>
      <ellipse cx="386" cy="220" rx="50" ry="45" fill="#f6f3e8" class="ink"/>
      <circle cx="401" cy="207" r="9" fill="#18232d"/>
      <circle cx="404" cy="204" r="3" fill="#fff"/>
      <path d="M420 221 Q451 230 461 251 Q435 261 410 247" fill="#e89a45" class="ink"/>
      <path d="M387 174 Q404 151 421 174" fill="none" class="ink"/>
