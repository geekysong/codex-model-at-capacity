        <ellipse cx="402" cy="394" rx="18" ry="8" fill="#e89a45" class="ink"/>
        <ellipse cx="412" cy="394" rx="18" ry="8" fill="#e89a45" class="ink"/>
      </g>
      <g transform="rotate(-8 320 215)">
        <path d="M320 220 Q275 175 226 207 Q265 242 329 245Z" fill="#f6f3e8" class="ink"/>
        <path d="M244 207 Q276 205 313 229" fill="none" stroke="#c6d4d5" stroke-width="6"/>
      </g>
      <path d="M349 203 Q324 179 337 157 Q355 142 371 165" fill="#f6f3e8" class="ink"/>
      <path d="M336 157 Q350 165 364 158" fill="none" class="ink"/>
      <path d="M462 220 Q505 192 542 220 Q514 245 466 247Z" fill="#f6f3e8" class="ink"/>
    </g>

    <g transform="translate(505 245) rotate(12)">
      <path d="M0 30 Q48 -6 100 12 Q122 22 105 42 Q55 65 0 48Z" fill="#73b7d1" class="ink"/>
      <path d="M100 12 L133 0 L115 29 L133 47 L102 42" fill="#e89a45" class="ink"/>
      <circle cx="104" cy="22" r="4" fill="#18232d"/>
      <path d="M18 36 Q51 22 84 30" fill="none" stroke="#d9f1f4" stroke-width="5"/>
    </g>
    <path d="M575 246 Q620 230 654 250" fill="none" stroke="#18232d" stroke-width="6"/>
    <text x="650" y="238" class="label" font-size="18" font-weight="700" text-anchor="middle" transform="rotate(-8 650 238)">FRESH CATCH!</text>
