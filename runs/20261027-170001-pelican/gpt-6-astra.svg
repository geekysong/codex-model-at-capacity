      <path d="M388 327 L378 361 M423 328 L438 360" class="ink"/>
      <path d="M370 360 Q388 369 402 358 M430 359 Q448 369 462 358" fill="none" class="ink"/>
      <path d="M363 256 Q414 280 452 265" fill="none" stroke="#18232d" stroke-width="6"/>
      <path d="M379 230 Q400 245 422 232" fill="none" stroke="#18232d" stroke-width="5"/>
      <path d="M371 285 Q398 302 428 283" fill="none" stroke="#e85d45" stroke-width="8"/>
