        <circle cx="250" cy="430" r="72" stroke="#eaf4f8" stroke-width="8"/>
        <circle cx="550" cy="430" r="72" stroke="#eaf4f8" stroke-width="8"/>
        <path d="M250 430 L355 330 L455 430 L250 430 M355 330 L405 430 M355 330 L315 430 M455 430 L550 430 M455 430 L505 345 L550 430"/>
      </g>
      <g stroke="#9ed8e8" stroke-width="4">
        <path d="M250 358V502 M178 430H322 M199 379L301 481 M199 481L301 379"/>
        <path d="M550 358V502 M478 430H622 M499 379L601 481 M499 481L601 379"/>
      </g>
      <g fill="#e85d45" class="ink">
        <circle cx="355" cy="330" r="12"/>
        <circle cx="455" cy="430" r="12"/>
      </g>
      <g id="crank" transform-origin="455 430">
        <circle cx="455" cy="430" r="18" fill="#f3c64d" class="ink"/>
        <path d="M455 430 L425 400 M455 430 L485 460" class="ink"/>
        <ellipse cx="415" cy="394" rx="18" ry="8" fill="#f3c64d" class="ink"/>
        <ellipse cx="495" cy="466" rx="18" ry="8" fill="#f3c64d" class="ink"/>
        <animateTransform attributeName="transform" type="rotate" from="0 455 430" to="360 455 430" dur="1.1s" repeatCount="indefinite"/>
      </g>
      <path d="M500 345 Q535 325 565 342" fill="none" class="ink"/>
      <path d="M550 342 L570 320" class="ink"/>
    </g>

