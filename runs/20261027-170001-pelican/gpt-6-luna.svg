<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#596575"/>
      <stop offset="1" stop-color="#303844"/>
    </linearGradient>
    <style>
      .ink{stroke:#202733;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202733}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .bob{animation:bob .8s ease-in-out infinite alternate}
      .pedal{animation:pedal 1.1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-7px)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd86b" opacity=".9"/>
  <path d="M0 360 Q120 285 240 355 T480 350 T800 330 V430 H0Z" fill="#83bf86"/>
  <path d="M0 400 Q180 365 360 405 T800 390 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f4d35e" stroke-width="8" stroke-dasharray="42 28" opacity=".8"/>

  <text x="400" y="55" text-anchor="middle" class="label" font-size="34" font-weight="900">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="88" text-anchor="middle" class="label" font-size="18" font-style="italic">“Why fly when you can pedal dramatically?”</text>

