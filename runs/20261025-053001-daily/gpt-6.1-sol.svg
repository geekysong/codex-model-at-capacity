<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="50" y="28" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="50" y="52">vₓ = 20 m/s · vᵧ = 15 m/s · g = 10 m/s²</text>
    <text x="50" y="74">Total flight time: 3 s</text>
    <text x="50" y="96">Scale: 10 px/m; horizontal distance measured from launch.</text>
    <text x="50" y="121">Landing would be at x = 700 px, outside this canvas.</text>
    <text x="50" y="141">The final segment below is shifted 200 px left to show it.</text>
  </g>

  <path d="M50 350 H550" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- x = 100 + 200t; y = 350 - 150t + 50t² -->
  <path d="M100 350 Q315 188.75 530 258.625"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <!-- Final segment, t = 2.8 to 3, translated horizontally by -200 px. -->
  <path d="M460 322 Q480 335 500 350"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>

  <g fill="#2563eb">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="55" y="317">launch: 0 m, 0 m</text>
    <text x="325" y="216">apex: 30 m, 11.25 m</text>
    <text x="410" y="296">landing: 60 m, 0 m</text>
    <text x="345" y="316" font-size="12">shifted segment →</text>
  </g>

  <path d="M524 252 l5 9 M531 254 l5 9"
        stroke="#2563eb" stroke-width="2" fill="none"/>

  <rect x="0" y="367" width="600" height="33" fill="#f1f5f9"/>
  <text x="300" y="389" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-10-25 05:34:08 SGT (UTC+08:00)</text>
</svg>