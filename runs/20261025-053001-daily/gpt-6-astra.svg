<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="50" y="30">Projectile motion — total flight time: 3 s</text>
    <text x="50" y="55">Initial velocity: (20, 15) m/s; gravity: 10 m/s²</text>
    <text x="50" y="80">Scale: 10 px/m; horizontal axis broken to fit the canvas.</text>
    <text x="50" y="105">Distances measured from launch; no air resistance.</text>
  </g>

  <!-- Physical coordinates: x = 100 + 200t, y = 350 - 150t + 50t².
       Omit x = 440 to 660 (22 m), representing the omission by a
       20 px break. Coordinates after the break are shifted 200 px left. -->
  <path d="M50 350 H550" fill="none" stroke="#465366" stroke-width="2"/>
  <path d="M100 350 Q270 222.5 440 239.5
           M460 322 Q470 335 480 350"
        fill="none" stroke="#1769aa" stroke-width="3"/>

  <g fill="#1769aa">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="480" cy="350" r="4"/>
  </g>

  <g stroke="#465366" stroke-width="2" fill="none">
    <path d="M435 245 L445 234 M455 328 L465 317"/>
    <path d="M443 344 L449 356 M451 344 L457 356"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="310" y="215">apex: 30 m, 11.25 m</text>
    <text x="65" y="373">launch: 0 m, 0 m</text>
    <text x="380" y="373">landing: 60 m, 0 m</text>
    <text x="472" y="270">Axis break:</text>
    <text x="472" y="290">22 m omitted</text>
  </g>

  <text x="50" y="395" font-family="Arial, sans-serif" font-size="12" fill="#172033">2026-10-25 05:33:16 SGT (UTC+08:00)</text>
</svg>