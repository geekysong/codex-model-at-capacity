<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly large fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#f4fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#252525"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#173042" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17212b;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,sans-serif;fill:#17212b}
      .bold{font-weight:800}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".9"/>
  <path d="M0 390 Q130 335 260 390 T520 390 T800 375 V470 H0Z" fill="#9bd27d"/>
  <path d="M0 425 Q160 385 320 430 T640 420 T800 430 V470 H0Z" fill="#68b467"/>
  <path d="M0 470 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 525 H800" stroke="#f6d768" stroke-width="8" stroke-dasharray="45 28" opacity=".9"/>

  <g filter="url(#shadow)">
    <rect x="40" y="28" width="720" height="82" rx="18" fill="#fff" stroke="#17212b" stroke-width="6"/>
    <text x="400" y="75" text-anchor="middle" class="label bold" font-size="38">THE PELICAN PEDAL PANIC</text>
    <text x="400" y="98" text-anchor="middle" class="label" font-size="16">“Fresh fish delivery… at bird speed.”</text>
  </g>

  <!-- bicycle -->
  <g id="bike" class="ink" fill="none">
    <g id="rearWheel">
      <circle cx="255" cy="455" r="78" fill="#d8f2ff"/>
      <circle cx="255" cy="455" r="10" fill="#17212b"/>
      <g stroke="#4a7180" stroke-width="3">
        <path d="M255 377V533M177 455H333M200 400L310 510M310 400L200 510"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 255 455" to="360 255 455" dur="2s" repeatCount="indefinite"/>
    </g>
    <g id="frontWheel">
      <circle cx="585" cy="455" r="78" fill="#d8f2ff"/>
      <circle cx="585" cy="455" r="10" fill="#17212b"/>
      <g stroke="#4a7180" stroke-width="3">
        <path d="M585 377V533M507 455H663M530 400L640 510M640 400L530 510"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 585 455" to="360 585 455" dur="2s" repeatCount="indefinite"/>
    </g>
    <path d="M255 455 L350 365 L455 455 L255 455 L410 455 L350 365 L585 455 L548 360" stroke-width="9"/>
    <path d="M455 455 L430 390" stroke-width="8"/>
    <circle cx="455" cy="455" r="18" fill="#ffcc39"/>
    <path d="M425 475 L485 435" stroke="#17212b" stroke-width="7"/>
    <path d="M548 360 L565 345 M548 360 L525 362" stroke-width="8"/>
    <path d="M338 362 L320 345" stroke-width="8"/>
    <g id="pedals">
      <path d="M350 365 L330 390 M350 365 L375 340" stroke-width="7"/>
      <circle cx="350" cy="365" r="8" fill="#ffcc39"/>
      <animateTransform attributeName="transform" type="rotate" from="0 350 365" to="360 350 365" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pelican bobbing with the ride -->
  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <!-- body -->
    <ellipse cx="390" cy="285" rx="100" ry="118" fill="#f5f7f2" class="ink"/>
    <path d="M335 350 Q390 385 445 350 L435 420 Q390 450 345 420Z" fill="#e6b640" class="ink"/>
    <!-- wing -->
    <path d="M345 270 Q285 305 315 375 Q350 350 395 305Z" fill="#d5e4e5" class="ink"/>
    <path d="M330 315 Q350 335 370 345" fill="none" stroke="#70858c" stroke-width="5"/>
    <!-- neck/head -->
    <path d="M345 210 Q330 145 385 130 Q450 112 490 170 Q510 225 465 255 Q405 280 345 210Z" fill="#f5f7f2" class="ink"/>
    <circle cx="438" cy="170" r="11" fill="#17212b"/>
    <circle cx="442" cy="166" r="3.5" fill="#fff"/>
    <!-- crest -->
    <path d="M388 132 Q380 105 402 118 Q420 91 432 122 Q458 105 454 145" fill="#e8b736" class="ink"/>
    <!-- enormous beak and fish -->
    <path d="M455 188 Q560 165 650 205 Q560 242 455 220 Q425 209 455 188Z" fill="#f2b84b" class="ink"/>
    <path d="M540 190 Q590 177 630 205 Q590 220 540 215" fill="#f7d36c" stroke="#a66c1c" stroke-width="4"/>
    <path d="M620 202 L660 180 L650 210 L675 230 L625 218Z" fill="#6bc0dc" class="ink"/>
    <circle cx="650" cy="201" r="5" fill="#17212b"/>
    <text x="548" y="272" class="label bold" font-size="18" transform="rotate(7 548 272)">LOCAL FISH</text>
    <!-- legs -->
    <path d="M360 390 L350 430 L330 450 M425 390 L440 430 L462 450" fill="none" class="ink"/>
    <path d="M320 452 Q340 462 355 452 M450 452 Q468 462 485 452" fill="none" class="ink"/>
    <!-- sweat and joke -->
    <path d="M303 215 Q286 235 302 248 Q318 235 303 215Z" fill="#6ed3ef" stroke="#16708a" stroke-width="4"/>
    <text x="225" y="175" class="label bold" font-size="20" transform="rotate(-8 225 175)">HONK!</text>
    <text x="222" y="197" class="label" font-size="14" transform="rotate(-8 222 197)">I meant “squawk”!</text>
  </g>

  <g class="label">
    <rect x="535" y="315" width="205" height="66" rx="12" fill="#fff" stroke="#17212b" stroke-width="4"/>
    <text x="637" y="341" text-anchor="middle" font-size="17" class="bold">Rush-hour hero</text>
    <text x="637" y="364" text-anchor="middle" font-size="15">with a built-in lunchbox.</text>
  </g>

  <text x="400" y="574" text-anchor="middle" class="label" font-size="15">2026-10-27 05:00:41 SGT (UTC+08:00)</text>
</svg>