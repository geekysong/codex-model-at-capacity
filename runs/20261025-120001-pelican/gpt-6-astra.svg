  <text x="157" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#233845">“It’s not cargo.</text>
  <text x="157" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#233845">It’s my lunch break.”</text>

  <rect x="0" y="501" width="800" height="99" fill="#233845"/>
  <text x="400" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#fff4d9">He took up cycling to lower his carbon fin-print.</text>
  <path d="M120 552H680" stroke="#6d858a"/>
