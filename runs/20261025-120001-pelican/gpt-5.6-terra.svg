    <path d="M280 256h-43" stroke="#26323d" stroke-width="9" stroke-linecap="round"/>
    <path d="M531 258l23-35" stroke="#26323d" stroke-width="8" stroke-linecap="round"/>
    <path d="M543 223h35" stroke="#26323d" stroke-width="8" stroke-linecap="round"/>
