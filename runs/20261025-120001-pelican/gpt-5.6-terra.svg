    <circle cx="394" cy="148" r="2.5" fill="#fff"/><circle cx="423" cy="145" r="2.5" fill="#fff"/>
    <path d="M394 176q14 11 27-2" fill="none" stroke="#273144" stroke-width="4" stroke-linecap="round"/>
    <path d="M344 276q32 17 80 6" fill="none" stroke="#d0d7c6" stroke-width="4"/>
    <path d="M360 288q28 13 68 5" fill="none" stroke="#d0d7c6" stroke-width="4"/>

    <path d="M311 282q-43-34-79-13q-20 11-9 31q19 16 59 4l32 5z" fill="#69a9c8" stroke="#273144" stroke-width="5"/>
    <path d="M221 285q17-14 32-2q-10 19-31 13z" fill="#f7f0d5"/>
    <text x="267" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#273144">FISH</text>
  </g>

  <g>
    <path d="M92 342q28-28 58-2v37H92z" fill="#fff8dc" stroke="#273144" stroke-width="4"/>
    <path d="M105 342v-21h32v21" fill="#f28b4b" stroke="#273144" stroke-width="4"/>
    <circle cx="112" cy="358" r="5" fill="#273144"/><circle cx="131" cy="358" r="5" fill="#273144"/>
    <text x="121" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#273144">SLOW DOWN!</text>
  </g>

  <rect y="530" width="800" height="70" fill="#273144"/>
  <text x="26" y="558" font-size="19" font-weight="bold" fill="#ffe66a">Caption: He said it was “sustainable transport.” The fish remain unconvinced.</text>
  <text x="26" y="584" font-size="15" fill="#fff">2026-10-25 12:02:38 SGT (UTC+08:00)</text>
</svg>