    <path d="M329 204q-8-89 60-98q54-7 76 50q-59 34-136 48z" fill="#dfe5d4"/>
    <path d="M434 147q30-11 53 7q23 18 21 39q-39 24-77 8z" fill="#f3aa38" stroke="#273144" stroke-width="5"/>
    <path d="M438 171q78 5 99 36q-16 31-91 13z" fill="#f8c45c" stroke="#273144" stroke-width="5"/>
    <path d="M452 207q58 14 88 1q-14 35-69 35q-23-1-28-15z" fill="#e97a58" stroke="#273144" stroke-width="4"/>
    <path d="M342 229q-34 12-42 50q39 1 65-26z" fill="#8ea4a8" stroke="#273144" stroke-width="5"/>
    <path d="M451 238q42 14 48 57q-43-5-62-35z" fill="#8ea4a8" stroke="#273144" stroke-width="5"/>
    <path d="M351 252q4 84 47 92q38-12 38-101z" fill="#f3f5e8" stroke="#273144" stroke-width="5"/>
    <path d="M370 321l-35 63h34l35-53m19-3l34 57h33l-46-78" fill="none" stroke="#f3aa38" stroke-width="18" stroke-linecap="round"/>
    <g class="blink" transform-origin="401 151">
      <ellipse cx="392" cy="151" rx="8" ry="11" fill="#273144"/>
      <ellipse cx="421" cy="148" rx="8" ry="11" fill="#273144"/>
