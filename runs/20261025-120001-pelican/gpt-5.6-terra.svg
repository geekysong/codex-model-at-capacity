<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN EXPRESS: NO BEAKS ON SPOKES</title>
  <desc id="desc">A satirical cartoon of an exuberant pelican riding a bicycle, delivering fish faster than common sense allows.</desc>
  <defs>
    <style>
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite; }
      .bob { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .55s linear infinite; }
      .blink { animation: blink 3.2s infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
      @keyframes pedal { to { transform: rotate(360deg); } }
      @keyframes blink { 0%,44%,48%,100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } }
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#79d9ef"/><stop offset="1" stop-color="#e9fbce"/>
    </linearGradient>
    <linearGradient id="road" x2="1">
      <stop stop-color="#59616b"/><stop offset=".5" stop-color="#777f89"/><stop offset="1" stop-color="#59616b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="104" cy="105" r="46" fill="#ffe66a"/>
  <path d="M0 250 Q95 195 190 248 T380 239 T570 251 T800 220 V360H0Z" fill="#9bcf78"/>
  <path d="M0 315 Q170 275 340 325 T800 302 V420H0Z" fill="#69ae62"/>
  <path d="M0 375H800V526H0Z" fill="url(#road)"/>
  <path d="M0 446H800" stroke="#fff5a4" stroke-width="12" stroke-dasharray="52 35" opacity=".9"/>
  <path d="M0 526H800" stroke="#e4b95c" stroke-width="8"/>

  <g fill="#fff" opacity=".92">
    <path d="M206 100c14-25 45-19 49 0 22-13 46 4 38 21h-101c-6-12 1-20 14-21z"/>
    <path d="M594 138c12-20 38-18 45-1 18-10 37 5 33 19h-88c-5-11 0-17 10-18z"/>
  </g>

  <g transform="translate(575 248)">
    <rect x="0" y="26" width="132" height="74" rx="8" fill="#f7f0d5" stroke="#473f3a" stroke-width="4"/>
    <path d="M10 30h112v-34H10z" fill="#ed5b4f" stroke="#473f3a" stroke-width="4"/>
    <text x="66" y="18" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">FISH TAX OFFICE</text>
    <text x="66" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#473f3a">NO FREE LUNCHES</text>
    <path d="M52 73q12-13 24 0q-12 14-24 0m5 0h14" fill="none" stroke="#4d89a8" stroke-width="3"/>
  </g>

  <text x="400" y="52" text-anchor="middle" font-size="34" font-weight="900" fill="#273144" stroke="#fff" stroke-width="3" paint-order="stroke">PELICAN EXPRESS</text>
  <text x="400" y="79" text-anchor="middle" font-size="17" font-weight="bold" fill="#273144">“BECAUSE WALKING WITH A FISH BAG LOOKS SUSPICIOUS.”</text>

  <g>
    <g class="wheel">
      <circle cx="245" cy="412" r="74" fill="#dfe9eb" stroke="#26323d" stroke-width="11"/>
      <circle cx="245" cy="412" r="7" fill="#ef584b"/>
      <g stroke="#91a6aa" stroke-width="3">
        <path d="M245 338v148M171 412h148M193 360l104 104M297 360L193 464"/>
      </g>
    </g>
    <g class="wheel">
      <circle cx="510" cy="412" r="74" fill="#dfe9eb" stroke="#26323d" stroke-width="11"/>
      <circle cx="510" cy="412" r="7" fill="#ef584b"/>
      <g stroke="#91a6aa" stroke-width="3">
        <path d="M510 338v148M436 412h148M458 360l104 104M562 360L458 464"/>
      </g>
    </g>

    <g fill="none" stroke="#c73e43" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
