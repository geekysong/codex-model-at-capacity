<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">An indignant pelican rides a bicycle with spinning wheels and bobbing pedals, carrying a fish who demands a faster ride.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#c8eff5"/>
      <stop offset="1" stop-color="#fff6d8"/>
    </linearGradient>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#dca461"/>
      <path d="M0 0H12M0 0V12" fill="none" stroke="#9a6537" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <circle r="83" fill="#fffaf0" stroke="#243440" stroke-width="11"/>
      <circle r="73" fill="none" stroke="#8fa4ac" stroke-width="2"/>
      <g stroke="#8fa4ac" stroke-width="3">
        <path d="M-73 0H73M0-73V73M-52-52L52 52M-52 52L52-52"/>
        <path d="M-28-67L28 67M-67-28L67 28M-67 28L67-28M-28 67L28-67"/>
      </g>
      <circle r="10" fill="#ffcd57" stroke="#243440" stroke-width="4"/>
      <path d="M-9-79H9" stroke="#ff745d" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff9ec"/>
  <rect x="16" y="16" width="768" height="568" rx="24" fill="url(#sky)" stroke="#243440" stroke-width="4"/>

  <text x="400" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="900" letter-spacing="3" fill="#243440">TOUR DE BEAK</text>
  <path d="M229 79H571" stroke="#f47756" stroke-width="5" stroke-linecap="round"/>

  <g fill="#fff" opacity=".8">
    <path d="M62 144C42 123 66 103 85 117C94 88 133 94 138 119C171 114 180 143 157 148H67Z"/>
    <path d="M611 116C598 98 619 83 638 94C650 72 680 81 683 101C709 96 724 117 706 126H622Z"/>
  </g>
  <circle cx="708" cy="169" r="31" fill="#ffd76b"/>
  <path d="M30 385Q150 336 260 378T490 369T770 374V478H30Z" fill="#b9d6a1"/>
  <path d="M20 440Q400 424 780 440V486H20Z" fill="#d8c7a9"/>
  <path d="M51 466H143M531 466H622M667 466H741" stroke="#fff4d9" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="405" cy="457" rx="269" ry="15" fill="#243440" opacity=".13"/>

  <!-- A single moving bicycle scene. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(237 365)">
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0 237 365" to="360 237 365" dur="1.4s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g transform="translate(568 365)">
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0 568 365" to="360 568 365" dur="1.4s" repeatCount="indefinite" additive="sum"/>
    </g>

    <path d="M237 365L321 265L382 365ZM321 265H505L382 365M505 265L568 365" fill="none" stroke="#243440" stroke-width="14"/>
    <path d="M237 365L321 265L382 365ZM321 265H505L382 365M505 265L568 365" fill="none" stroke="#ec6152" stroke-width="8"/>
    <path d="M321 265L310 240M505 265L487 222L521 210" fill="none" stroke="#243440" stroke-width="9"/>
    <path d="M520 210L541 211" fill="none" stroke="#89513f" stroke-width="12"/>
    <path d="M287 240Q313 231 338 240" fill="none" stroke="#243440" stroke-width="14"/>
    <path d="M245 365L378 350Q402 365 378 382L245 377Z" fill="none" stroke="#697c84" stroke-width="4"/>
    <circle cx="382" cy="365" r="21" fill="#f7cf64" stroke="#243440" stroke-width="5"/>

    <path d="M534 247L541 286H608L619 247Z" fill="url(#basket)" stroke="#243440" stroke-width="4"/>
    <path d="M529 247H624" stroke="#243440" stroke-width="6"/>
    <g transform="translate(573 232)">
      <path d="M-25 0Q-5-24 23-4L38-15L36 9L22 4Q-3 24-25 0Z" fill="#6cb5b2" stroke="#243440" stroke-width="3"/>
      <circle cx="-12" cy="-3" r="3.5" fill="#243440"/>
      <path d="M-19 6L-10 8M3-12L10-20L16-8" fill="none" stroke="#243440" stroke-width="2"/>
    </g>

    <!-- Pelican and legs gently bounce together. -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 -5;0 0" dur="1.4s" repeatCount="indefinite"/>
      <path d="M340 265L355 305L399 347" fill="none" stroke="#243440" stroke-width="15"/>
      <path d="M340 265L355 305L399 347" fill="none" stroke="#f2ad49" stroke-width="9"/>
      <path d="M395 341L421 352L394 359L382 351Z" fill="#f2ad49" stroke="#243440" stroke-width="3"/>

      <path d="M292 207L263 185L274 225L253 218L286 251" fill="#fffdf4" stroke="#243440" stroke-width="4"/>
      <path d="M298 173C267 191 270 242 300 260C330 280 382 271 402 244C424 216 413 189 387 180Z" fill="#fffdf4" stroke="#243440" stroke-width="4"/>
      <path d="M303 194Q323 181 360 197Q382 209 373 242Q337 255 307 226Q324 230 337 224Q310 218 303 194Z" fill="#e0e6dd" stroke="#243440" stroke-width="3"/>
      <path d="M381 213C361 179 361 141 388 119C410 102 443 114 449 137C453 157 435 171 420 177L427 211" fill="#fffdf4" stroke="#243440" stroke-width="4"/>

      <!-- Proudly oversized bill and expandable pouch. -->
      <path d="M431 148L582 171Q545 195 451 196Q431 188 424 166Z" fill="#f4b04d" stroke="#243440" stroke-width="4"/>
      <path d="M444 161Q465 225 526 195L582 171Z" fill="#ffc977" stroke="#243440" stroke-width="3"/>
      <path d="M431 148L584 169L441 169" fill="#ffd66e" stroke="#243440" stroke-width="4"/>
      <circle cx="420" cy="139" r="6" fill="#243440"/>
      <circle cx="422" cy="137" r="1.7" fill="#fff"/>
      <path d="M405 128L426 130" stroke="#243440" stroke-width="5"/>
      <path d="M381 117Q406 87 439 115L442 122L379 122Z" fill="#ed6152" stroke="#243440" stroke-width="4"/>
      <path d="M393 107L397 119M408 103L411 119M423 108L426 119" stroke="#fff1d4" stroke-width="4"/>
      <path d="M435 122L454 124" stroke="#243440" stroke-width="5"/>
      <path d="M382 192L396 215L380 225L366 198Z" fill="#3d9da1" stroke="#243440" stroke-width="3"/>
      <path d="M394 216Q434 234 461 216L449 239Q416 243 386 229" fill="#3d9da1" stroke="#243440" stroke-width="3"/>
      <path d="M365 228Q407 247 485 223" fill="none" stroke="#243440" stroke-width="13"/>
      <path d="M365 228Q407 247 485 223" fill="none" stroke="#e0e6dd" stroke-width="8"/>
      <path d="M483 220L495 216" stroke="#243440" stroke-width="8"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5 333 263;6 333 263;-5 333 263" dur="1.4s" repeatCount="indefinite"/>
        <path d="M333 263L319 311L368 366" fill="none" stroke="#243440" stroke-width="15"/>
        <path d="M333 263L319 311L368 366" fill="none" stroke="#f2ad49" stroke-width="9"/>
        <path d="M366 358L394 374L363 381L353 371Z" fill="#f2ad49" stroke="#243440" stroke-width="3"/>
      </g>
    </g>

    <g transform="translate(382 365)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <path d="M-24 0H24" stroke="#243440" stroke-width="6"/>
        <path d="M-35 0H-17M17 0H35" stroke="#243440" stroke-width="9"/>
      </g>
    </g>

    <path d="M124 274H178M138 293H188M111 313H173" stroke="#fffdf4" stroke-width="7"/>

    <path d="M565 198L551 178H550Q532 178 532 160V135Q532 119 548 119H688Q704 119 704 135V160Q704 178 688 178H582Z" fill="#fffdf4" stroke="#243440" stroke-width="3"/>
    <text x="618" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243440">FASTER!</text>
    <text x="618" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#243440">I’m late for school!</text>
  </g>

  <rect x="32" y="489" width="736" height="78" rx="13" fill="#fff9ec"/>
  <text x="400" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#243440">He bought a bicycle. The fish still want a flying start.</text>
  <path d="M110 531H690" stroke="#d8c7a9" stroke-width="1.5"/>
  <text x="400" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#344650">2026-10-25 12:01:13 SGT (UTC+08:00)</text>
</svg>