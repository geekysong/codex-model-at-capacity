<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#17324d">STATIC EQUILIBRIUM</text>

  <!-- level seesaw -->
  <line x1="90" y1="190" x2="510" y2="190" stroke="#6b4f2a" stroke-width="12" stroke-linecap="round"/>
  <line x1="90" y1="178" x2="510" y2="178" stroke="#b88445" stroke-width="3" stroke-linecap="round"/>

  <!-- pivot -->
  <polygon points="300,190 268,270 332,270" fill="#4b6675"/>
  <line x1="255" y1="270" x2="345" y2="270" stroke="#2f4652" stroke-width="8" stroke-linecap="round"/>
  <circle cx="300" cy="190" r="8" fill="#263c48"/>
  <text x="300" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#263c48">pivot</text>

  <!-- left mass and hanger -->
  <line x1="170" y1="190" x2="170" y2="235" stroke="#263c48" stroke-width="4"/>
  <rect x="140" y="235" width="60" height="48" rx="6" fill="#d9534f" stroke="#8f2926" stroke-width="3"/>
  <text x="170" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">6 kg</text>

  <!-- right mass and hanger -->
  <line x1="430" y1="190" x2="430" y2="235" stroke="#263c48" stroke-width="4"/>
  <rect x="400" y="235" width="60" height="48" rx="6" fill="#4c9f70" stroke="#2d6b49" stroke-width="3"/>
  <text x="430" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">4 kg</text>

  <!-- downward force arrows -->
  <line x1="170" y1="112" x2="170" y2="178" stroke="#d9534f" stroke-width="5"/>
  <polygon points="170,190 160,170 180,170" fill="#d9534f"/>
  <text x="170" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8f2926">F = 6g</text>

  <line x1="430" y1="112" x2="430" y2="178" stroke="#4c9f70" stroke-width="5"/>
  <polygon points="430,190 420,170 440,170" fill="#4c9f70"/>
  <text x="430" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2d6b49">F = 4g</text>

  <!-- distance dimension lines -->
  <line x1="170" y1="330" x2="300" y2="330" stroke="#34495e" stroke-width="2"/>
  <line x1="170" y1="322" x2="170" y2="338" stroke="#34495e" stroke-width="2"/>
  <line x1="300" y1="322" x2="300" y2="338" stroke="#34495e" stroke-width="2"/>
  <polygon points="170,330 182,324 182,336" fill="#34495e"/>
  <polygon points="300,330 288,324 288,336" fill="#34495e"/>
  <text x="235" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#34495e">2 m</text>

  <line x1="300" y1="330" x2="430" y2="330" stroke="#34495e" stroke-width="2"/>
  <line x1="430" y1="322" x2="430" y2="338" stroke="#34495e" stroke-width="2"/>
  <polygon points="300,330 312,324 312,336" fill="#34495e"/>
  <polygon points="430,330 418,324 418,336" fill="#34495e"/>
  <text x="365" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#34495e">x = 3 m</text>

  <!-- equation and result -->
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17324d">6 × 2 = 4 × 3</text>
  <text x="520" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2d6b49">balanced</text>
</svg>