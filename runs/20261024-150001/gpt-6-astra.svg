<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17324d">Balanced Seesaw</text>

  <!-- level seesaw beam -->
  <rect x="90" y="214" width="420" height="14" rx="7" fill="#8b5a2b"/>
  <line x1="300" y1="210" x2="300" y2="230" stroke="#5b3a1d" stroke-width="3"/>

  <!-- pivot -->
  <polygon points="300,228 260,300 340,300" fill="#4f6d7a"/>
  <line x1="250" y1="300" x2="350" y2="300" stroke="#263238" stroke-width="6"/>
  <text x="300" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#263238">pivot</text>

  <!-- left mass -->
  <line x1="180" y1="228" x2="180" y2="278" stroke="#263238" stroke-width="3"/>
  <rect x="148" y="278" width="64" height="48" rx="6" fill="#d95f59" stroke="#8f302d" stroke-width="2"/>
  <text x="180" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>

  <!-- right mass -->
  <line x1="420" y1="228" x2="420" y2="278" stroke="#263238" stroke-width="3"/>
  <rect x="388" y="278" width="64" height="48" rx="6" fill="#4d9de0" stroke="#245b8d" stroke-width="2"/>
  <text x="420" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>

  <!-- force arrows -->
  <line x1="180" y1="150" x2="180" y2="268" stroke="#b22222" stroke-width="4"/>
  <polygon points="180,278 171,260 189,260" fill="#b22222"/>
  <text x="180" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#b22222">force</text>

  <line x1="420" y1="150" x2="420" y2="268" stroke="#b22222" stroke-width="4"/>
  <polygon points="420,278 411,260 429,260" fill="#b22222"/>
  <text x="420" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#b22222">force</text>

  <!-- distance indicators -->
  <line x1="180" y1="190" x2="300" y2="190" stroke="#222" stroke-width="2"/>
  <line x1="180" y1="182" x2="180" y2="198" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="182" x2="300" y2="198" stroke="#222" stroke-width="2"/>
  <text x="240" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2 m</text>

  <line x1="300" y1="350" x2="420" y2="350" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="342" x2="300" y2="358" stroke="#222" stroke-width="2"/>
  <line x1="420" y1="342" x2="420" y2="358" stroke="#222" stroke-width="2"/>
  <text x="360" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">x = 3 m</text>

  <!-- torque equation -->
  <text x="300" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17324d">6 × 2 = 4 × 3</text>
</svg>