<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #111827; font-size: 18px; }
      .small { font-family: Arial, sans-serif; fill: #111827; font-size: 16px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="90" y="177" width="420" height="16" rx="8" fill="#8b5e34" stroke="#4b3621" stroke-width="2"/>

  <!-- Pivot -->
  <polygon points="300,193 260,275 340,275" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <line x1="245" y1="275" x2="355" y2="275" stroke="#334155" stroke-width="6"/>
  <text x="300" y="305" text-anchor="middle" class="label">pivot</text>

  <!-- Left mass -->
  <line x1="150" y1="193" x2="150" y2="247" stroke="#111827" stroke-width="3"/>
  <rect x="116" y="247" width="68" height="48" rx="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  <text x="150" y="277" text-anchor="middle" class="label" fill="white">6 kg</text>

  <!-- Right mass -->
  <line x1="450" y1="193" x2="450" y2="247" stroke="#111827" stroke-width="3"/>
  <rect x="416" y="247" width="68" height="48" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="450" y="277" text-anchor="middle" class="label" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="225" x2="150" y2="315" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="150" y="337" text-anchor="middle" class="small">6g downward</text>

  <line x1="450" y1="225" x2="450" y2="315" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="337" text-anchor="middle" class="small">4g downward</text>

  <!-- Distance dimensions -->
  <line x1="150" y1="145" x2="300" y2="145" stroke="#374151" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="225" y="134" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="145" x2="450" y2="145" stroke="#374151" stroke-width="2"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="375" y="134" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equilibrium annotation -->
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#166534">BALANCED</text>
  <text x="300" y="90" text-anchor="middle" class="label">6 × 2 = 4 × 3</text>
  <text x="300" y="115" text-anchor="middle" class="small">equal torques about the pivot</text>
</svg>