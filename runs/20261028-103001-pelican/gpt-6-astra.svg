<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT PELICYCLE</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying a fish.</desc>
  <style>
    .ink{stroke:#182433;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,sans-serif;fill:#182433}
  </style>

  <rect width="800" height="600" fill="#dff6ff"/>
  <rect y="430" width="800" height="110" fill="#9bd27b"/>
  <path d="M0 470 Q120 440 240 470 T480 470 T720 470 T960 470" fill="none" stroke="#5b9d55" stroke-width="8"/>
  <circle cx="675" cy="105" r="46" fill="#ffd45a" class="ink"/>
  <path d="M80 150 Q125 110 170 150 Q125 135 80 150Z" fill="#fff" class="ink"/>
  <path d="M590 170 Q635 130 680 170 Q635 155 590 170Z" fill="#fff" class="ink"/>

  <text x="400" y="62" text-anchor="middle" font-size="38" font-weight="900" class="label">THE GREAT PELICYCLE</text>
  <text x="400" y="94" text-anchor="middle" font-size="19" class="label">“Why walk when you can wobble with style?”</text>

