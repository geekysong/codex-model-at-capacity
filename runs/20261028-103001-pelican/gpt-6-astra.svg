  </g>

  <path d="M120 395 Q145 370 170 395" fill="none" stroke="#fff" stroke-width="8"/>
  <path d="M625 345 Q650 320 675 345" fill="none" stroke="#fff" stroke-width="8"/>

  <text x="400" y="500" text-anchor="middle" font-size="23" font-weight="700" class="label">A beak-first commute through the boulevard of bad ideas.</text>
  <text x="400" y="570" text-anchor="middle" font-size="16" class="label">2026-10-28 10:30:01 SGT (UTC+08:00)</text>
</svg>