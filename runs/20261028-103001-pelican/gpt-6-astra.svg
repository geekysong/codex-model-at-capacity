  </g>

  <g id="pelican" class="ink">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M345 300 Q335 220 395 165 Q455 110 520 165 Q560 198 545 250 Q532 300 480 315 L420 330Z" fill="#f4f0e7"/>
    <path d="M405 165 Q420 112 475 108 Q535 105 552 155 Q520 142 490 158 Q450 180 405 165Z" fill="#e8e1d4"/>
    <path d="M500 180 Q555 160 665 205 Q690 215 665 233 Q575 250 510 220Z" fill="#f4b044"/>
    <path d="M660 205 Q700 212 710 230 Q685 240 665 233" fill="#e58b2f"/>
    <circle cx="484" cy="160" r="9" fill="#182433"/>
    <path d="M430 210 Q455 230 480 210" fill="none"/>
    <path d="M390 282 Q355 320 345 360 M470 300 Q470 350 450 380" fill="none"/>
    <path d="M345 360 L315 380 M450 380 L425 398" fill="none"/>
    <path d="M392 278 Q420 300 450 315" fill="none"/>
    <path d="M382 300 Q350 355 390 390" fill="none"/>
    <path d="M390 390 L430 390" fill="none"/>
    <path d="M390 390 L365 420" fill="none"/>
    <path d="M430 390 L465 420" fill="none"/>
    <path d="M365 420 L345 420 M465 420 L485 420" fill="none"/>
    <path d="M530 175 Q560 145 580 125" fill="none"/>
    <path d="M580 125 l18 8 -15 10" fill="#f4b044"/>
