        <path d="M0-63V63M-63 0H63M-45-45l90 90M45-45l-90 90"/>
      </g>
      <circle r="11" fill="#253144"/>
      <circle r="5" fill="#f8d067"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </g>
  </defs>

