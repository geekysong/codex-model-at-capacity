  <text x="400" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="900" letter-spacing="1" fill="#253144">THE PELICAN EXPRESS</text>
  <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#49636a">TWO WHEELS. ONE VERY LARGE LUNCH BOX.</text>

