<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A cheerful pelican pedals a bicycle with a fish peeking from its enormous beak. The wheels rotate and the rider bobs in a looping animation.</desc>
