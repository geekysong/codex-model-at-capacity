<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican pedals for lunch</title>
  <desc id="description">A determined pelican rides a bicycle with spinning wheels, wobbling pedals, and an enormous beak full of fish. A roadside sign advertises free fish uphill.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1" patternUnits="userSpaceOnUse"/>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke: #243346; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #243346; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="none" stroke="#243346" stroke-width="4"/>
  <text x="400" y="65" text-anchor="middle" font-size="43" font-weight="900" fill="#243346">TOUR DE FISH</text>
  <text x="400" y="94" text-anchor="middle" font-size="17" font-weight="bold" fill="#8b4c3a">ALL THE AMBITION. NONE OF THE AERODYNAMICS.</text>

  <!-- A single sunny seaside road -->
  <path d="M25 285 Q140 260 250 284 T480 280 T775 279 L775 440 L25 440Z" fill="#c6e8e2"/>
  <path d="M26 322 Q160 302 295 324 T570 323 T774 321" fill="none" stroke="#86c6c5" stroke-width="4"/>
  <circle cx="112" cy="174" r="34" fill="#ffd36b"/>
  <path d="M65 242 Q85 220 105 242 Q125 217 148 242" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  <path d="M24 423 Q350 399 776 420 L776 496 L24 496Z" fill="#dfb68b"/>
  <path d="M26 459 Q365 439 774 456" fill="none" stroke="#fff4d4" stroke-width="4" stroke-dasharray="30 25"/>

  <!-- Questionable motivational signage -->
  <path d="M677 250 L677 411" class="ink" fill="none"/>
  <path d="M607 224 H711 L744 250 L711 276 H607Z" fill="#ffe071" class="ink"/>
  <text x="670" y="246" text-anchor="middle" font-size="19" font-weight="900" fill="#243346">FREE FISH</text>
  <text x="670" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#243346">UPHILL. OBVIOUSLY.</text>

  <ellipse cx="384" cy="444" rx="235" ry="15" fill="#906c56" opacity=".2"/>

  <!-- Wheels: rotating spokes remain inside stationary tires -->
  <g transform="translate(245 370)">
    <circle r="73" fill="#fff9e9" class="ink"/>
    <circle r="63" fill="none" stroke="#e4aa63" stroke-width="3"/>
    <g stroke="#667e88" stroke-width="3">
      <path d="M-63 0H63 M0-63V63 M-45-45L45 45 M-45 45L45-45"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#243346"/>
  </g>
  <g transform="translate(535 370)">
    <circle r="73" fill="#fff9e9" class="ink"/>
    <circle r="63" fill="none" stroke="#e4aa63" stroke-width="3"/>
    <g stroke="#667e88" stroke-width="3">
      <path d="M-63 0H63 M0-63V63 M-45-45L45 45 M-45 45L45-45"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#243346"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#dc5b4e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 370 L308 281 L371 370 Z M308 281 L490 281 L371 370 M490 281 L535 370"/>
    <path d="M308 281 L298 255 M490 281 L477 243 L493 228"/>
  </g>
  <path d="M276 255 H321 M493 228 L515 230" fill="none" stroke="#243346" stroke-width="10" stroke-linecap="round"/>
  <path d="M245 370 L371 385 L386 370" class="thin"/>
  <circle cx="371" cy="370" r="19" fill="#ffc85c" class="ink"/>

  <!-- Far leg -->
  <path d="M354 260 Q414 291 395 328 L353 366" fill="none" stroke="#d9a543" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M354 260 Q414 291 395 328 L353 366;M354 260 Q402 295 380 321 L389 374;M354 260 Q414 291 395 328 L353 366" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Pelican and its tiny vertical bounce -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".75s" repeatCount="indefinite"/>
    <path d="M280 222 L238 201 L258 242 L236 244 L285 270" fill="#fffdf4" class="ink"/>
    <path d="M282 205 Q315 174 363 202 Q390 223 369 256 Q344 278 296 257 Q265 245 282 205Z" fill="#fffdf4" class="ink"/>
    <path d="M299 218 Q335 210 353 238 Q318 253 294 234" fill="#d6e4df" class="ink"/>

    <!-- Long curved neck -->
    <path d="M351 213 Q388 192 382 163 Q375 127 412 120 Q445 116 451 142 L433 176 Q425 214 381 242" fill="#fffdf4" class="ink"/>
    <path d="M385 143 Q411 112 447 137 L443 150 L387 155Z" fill="#df5d4e" class="ink"/>
    <path d="M391 137 Q419 123 441 141 M412 128 L412 145 M428 131 L429 145" class="thin"/>
    <path d="M388 155 L379 165" class="thin"/>
    <circle cx="429" cy="158" r="11" fill="white" stroke="#243346" stroke-width="3"/>
    <circle cx="433" cy="159" r="4" fill="#243346"/>
    <path d="M420 142 L440 148" class="thin"/>

    <!-- An absurdly oversized cargo pouch -->
    <path d="M444 171 L603 188 Q563 264 478 229 Q449 214 444 171Z" fill="#f8bf5d" class="ink"/>
    <path d="M443 167 L611 182 L604 193 L444 181Z" fill="#ffdc79" class="ink"/>
    <path d="M471 201 Q518 232 573 203" fill="none" stroke="#df9645" stroke-width="3"/>

    <!-- Fish poking out of the pouch -->
    <g transform="translate(527 180) rotate(-15)">
      <path d="M-28 0 Q-8-25 23-3 L37-16 L34 10 L23 4 Q-8 24-28 0Z" fill="#70b9b3" stroke="#243346" stroke-width="3"/>
      <circle cx="-15" cy="-3" r="3" fill="#243346"/>
      <path d="M-4-8 L1 6" class="thin"/>
    </g>

    <!-- Wing reaches for the handlebars -->
    <path d="M354 215 Q391 228 414 246 L492 229" fill="none" stroke="#243346" stroke-width="15" stroke-linecap="round"/>
    <path d="M354 213 Q391 226 414 243 L490 227" fill="none" stroke="#fffdf4" stroke-width="9" stroke-linecap="round"/>
    <path d="M484 222 L498 225 L490 234" class="thin"/>
    <path d="M452 132 Q459 125 461 132 Q465 140 457 142Z" fill="#72bfc9"/>
  </g>

  <!-- Near leg and rotating crank -->
  <path d="M326 258 Q314 299 345 321 L389 374" fill="none" stroke="#edb747" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M326 258 Q314 299 345 321 L389 374;M326 258 Q302 308 331 336 L353 366;M326 258 Q314 299 345 321 L389 374" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(371 370)">
    <g>
      <path d="M-20 0H20" stroke="#243346" stroke-width="6" stroke-linecap="round"/>
      <path d="M14-4H31 M-31 4H-14" stroke="#243346" stroke-width="7" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
    </g>
    <circle r="5" fill="#243346"/>
  </g>

  <!-- Readable, stationary joke -->
  <path d="M84 123 H288 Q302 123 302 138 V183 Q302 198 287 198 H258 L277 217 L231 198 H84 Q69 198 69 183 V138 Q69 123 84 123Z" fill="white" stroke="#243346" stroke-width="3"/>
  <text x="185" y="151" text-anchor="middle" font-size="19" font-weight="bold" fill="#243346">“It's not a pouch.</text>
  <text x="185" y="178" text-anchor="middle" font-size="19" font-weight="bold" fill="#243346">It's a lunch gearbox.”</text>

  <rect x="25" y="496" width="750" height="77" rx="12" fill="#fff5dc"/>
  <text x="400" y="523" text-anchor="middle" font-size="21" font-weight="bold" fill="#243346">He trained for the race. His beak trained for the buffet.</text>
  <path d="M80 540 H720" stroke="#d9bd90" stroke-width="1"/>
  <text x="400" y="562" text-anchor="middle" font-size="16" fill="#465264">2026-10-30 13:01:36 SGT (UTC+08:00)</text>
</svg>