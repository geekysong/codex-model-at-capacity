<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly hauling an absurdly oversized beak.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdeeff"/>
      <stop offset="1" stop-color="#fff4c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17324d" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#17324d;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17324d}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 430 Q120 390 240 430 T480 425 T800 420 V520 H0Z" fill="#9ed36a"/>
  <path d="M0 480 Q150 440 300 478 T600 470 T800 465 V540 H0Z" fill="#74b85d"/>
  <g fill="#fff" opacity=".75">
    <path d="M80 120 q30-28 60 0 q30-28 60 0 q-30 22-60 0 q-30 22-60 0z"/>
    <path d="M580 105 q25-24 50 0 q25-24 50 0 q-25 20-50 0 q-25 20-50 0z"/>
  </g>

  <text x="400" y="68" text-anchor="middle" class="label" font-size="38" font-weight="900" letter-spacing="2">THE PELICAN PEDAL EXPRESS</text>
  <text x="400" y="103" text-anchor="middle" class="label" font-size="20" font-style="italic">“When your beak is this big, every commute is a parade.”</text>

  <g filter="url(#shadow)">
    <g class="bicycle">
      <g fill="none" class="ink">
        <circle cx="245" cy="415" r="82" fill="#eaf8ff"/>
        <circle cx="560" cy="415" r="82" fill="#eaf8ff"/>
        <path d="M245 415 L350 285 L455 415 L245 415 L405 415 L350 285"/>
        <path d="M455 415 L500 300 L560 415"/>
        <path d="M490 300 L530 285"/>
        <path d="M350 285 L330 255"/>
        <path d="M315 255 L345 255"/>
      </g>
      <g class="wheel-spokes" fill="none" stroke="#5f9db8" stroke-width="3">
        <path d="M245 333v164M163 415h164M187 357l116 116M187 473l116-116"/>
        <path d="M560 333v164M478 415h164M502 357l116 116M502 473l116-116"/>
      </g>
      <g fill="#ffcf4a" class="ink">
        <circle cx="350" cy="285" r="14"/>
        <circle cx="455" cy="415" r="14"/>
      </g>
    </g>

    <g class="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.6s" repeatCount="indefinite"/>
      <path d="M334 300 Q315 232 355 177 Q395 124 456 155 Q504 180 488 239 Q475 286 425 302Z" fill="#f7f8f2" class="ink"/>
      <path d="M369 194 Q402 145 453 164 Q490 177 481 217 Q465 248 422 240 Q390 236 369 194Z" fill="#fff" class="ink"/>
      <path d="M455 185 Q520 165 668 217 Q690 225 668 239 Q531 276 450 226Z" fill="#f2a63b" class="ink"/>
      <path d="M465 225 Q552 259 668 238 Q642 287 548 270 Q484 258 445 231Z" fill="#e98732" class="ink"/>
      <circle cx="453" cy="184" r="10" fill="#17324d"/>
      <circle cx="456" cy="181" r="3" fill="#fff"/>
      <path d="M384 170 Q405 144 430 148" fill="none" class="ink"/>
      <path d="M373 246 Q347 270 349 308" fill="none" class="ink"/>
      <path d="M421 250 Q438 269 430 305" fill="none" class="ink"/>
      <path d="M348 305 L318 320 M430 305 L461 319" fill="none" class="ink"/>
      <path d="M348 305 Q372 319 396 306" fill="none" class="ink"/>
      <path d="M430 305 Q450 319 472 309" fill="none" class="ink"/>
      <path d="M351 220 Q325 208 318 184" fill="none" stroke="#d7dcd9" stroke-width="14" stroke-linecap="round"/>
      <path d="M365 260 Q397 278 432 260" fill="none" stroke="#e6b24e" stroke-width="6"/>
      <g class="feet">
        <animateTransform attributeName="transform" type="rotate" values="-18 390 306;18 390 306;-18 390 306" dur="1.1s" repeatCount="indefinite"/>
        <path d="M350 305 L390 355 M430 305 L390 355" fill="none" class="ink"/>
        <path d="M378 354 L402 354" fill="none" class="ink"/>
      </g>
    </g>
  </g>

  <g class="wheel-spin" fill="none" stroke="#ff6b5b" stroke-width="7" stroke-linecap="round">
    <path d="M245 333 l0 18 M245 479 l0 -18"/>
    <path d="M560 333 l0 18 M560 479 l0 -18"/>
    <animateTransform attributeName="transform" type="rotate" from="0 245 415" to="360 245 415" dur="2s" repeatCount="indefinite"/>
  </g>
  <g fill="#17324d">
    <path d="M120 365 q22-18 44 0" fill="none" stroke="#17324d" stroke-width="6"/>
    <path d="M650 345 q22-18 44 0" fill="none" stroke="#17324d" stroke-width="6"/>
  </g>

  <rect x="34" y="548" width="732" height="34" rx="10" fill="#fff9df" stroke="#17324d" stroke-width="3"/>
  <text x="400" y="571" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 07:30:01 SGT (UTC+08:00)</text>
</svg>