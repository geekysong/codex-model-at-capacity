<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical pelican rides a bicycle while trying to deliver a fish.</desc>
  <style>
    .ink{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#17202a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .wheel{fill:none;stroke:#17202a;stroke-width:8}
    .spoke{stroke:#4b5966;stroke-width:2}
    .label{font-family:Arial,sans-serif;fill:#17202a}
    .comic{font-family:Impact,Arial Black,sans-serif;letter-spacing:2px}
  </style>

  <rect width="800" height="600" fill="#d8f3ff"/>
  <path d="M0 420 Q130 385 260 420 T520 420 T800 412 V600 H0Z" fill="#9bd27c"/>
  <path d="M0 475 Q170 445 330 478 T650 470 T800 478 V600 H0Z" fill="#78b85d"/>
  <path d="M0 515 Q180 490 360 520 T800 515" fill="none" stroke="#4c914d" stroke-width="5"/>

  <text x="400" y="62" text-anchor="middle" class="comic" font-size="42" fill="#f04b3e" stroke="#17202a" stroke-width="2">PELICAN PEDAL PANIC!</text>
  <text x="400" y="96" text-anchor="middle" class="label" font-size="20" font-weight="bold">“He wanted a fish delivery job. The union said: try cycling.”</text>

