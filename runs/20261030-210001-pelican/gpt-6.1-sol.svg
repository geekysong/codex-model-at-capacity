<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A smug pelican pedals a bicycle with a giant fish-filled bill beneath a sign demanding smaller delivery vehicles. Wheels spin and the pelican bobs in a continuous animation.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#163344}
      .outline{stroke:#163344;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .spoke{stroke:#a2b9bf;stroke-width:3}
    </style>
    <pattern id="road" width="100" height="12" patternUnits="userSpaceOnUse">
      <path d="M15 6H65" stroke="#e3c886" stroke-width="4"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <path d="M0 350Q140 310 280 350T560 340T800 350V484H0Z" fill="#d9e9c8"/>
  <circle cx="711" cy="119" r="39" fill="#ffd269"/>
  <path d="M30 145Q62 117 94 145Q126 117 158 145" fill="none" stroke="#d7e5da" stroke-width="14" stroke-linecap="round"/>

  <text x="400" y="50" text-anchor="middle" font-size="35" font-weight="900" letter-spacing="1">THE GIG ECONOMY TAKES WING</text>
  <text x="400" y="80" text-anchor="middle" font-size="16" letter-spacing="2">ONE BIRD. TWO WHEELS. ZERO TRUNK SPACE.</text>

  <!-- A municipal opinion, safely outside the rider's path. -->
  <path d="M102 249V405" stroke="#718579" stroke-width="8"/>
  <rect x="27" y="178" width="151" height="83" rx="8" fill="#fffdf4" stroke="#163344" stroke-width="4"/>
  <text x="102" y="201" text-anchor="middle" font-size="13" font-weight="bold">CITY DELIVERY RULE</text>
  <text x="102" y="226" text-anchor="middle" font-size="20" font-weight="900">DOWNSIZE</text>
  <text x="102" y="247" text-anchor="middle" font-size="15">YOUR VEHICLE</text>

  <ellipse cx="412" cy="466" rx="248" ry="14" fill="#163344" opacity=".12"/>
  <path d="M0 481H800" stroke="#163344" stroke-width="4"/>
  <rect y="488" width="800" height="12" fill="url(#road)"/>

  <!-- Rotating wheel assemblies. -->
  <g transform="translate(239 411)">
    <circle r="65" fill="#fffbed" stroke="#163344" stroke-width="10"/>
    <circle r="57" fill="none" stroke="#e3ad57" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path class="spoke" d="M-56 0H56M0-56V56M-40-40L40 40M-40 40L40-40"/>
      <rect x="-5" y="-51" width="10" height="16" rx="3" fill="#f5ac31"/>
    </g>
    <circle r="8" fill="#163344"/>
  </g>
  <g transform="translate(570 411)">
    <circle r="65" fill="#fffbed" stroke="#163344" stroke-width="10"/>
    <circle r="57" fill="none" stroke="#e3ad57" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path class="spoke" d="M-56 0H56M0-56V56M-40-40L40 40M-40 40L40-40"/>
      <rect x="-5" y="-51" width="10" height="16" rx="3" fill="#f5ac31"/>
    </g>
    <circle r="8" fill="#163344"/>
  </g>

  <!-- Bicycle frame, chain, and steering. -->
  <path d="M239 411L340 318L391 411ZM340 318H510L391 411M510 318L570 411M340 318L330 295" fill="none" stroke="#163344" stroke-width="13" stroke-linejoin="round"/>
  <path d="M239 411L340 318L391 411ZM340 318H510L391 411M510 318L570 411" fill="none" stroke="#ef7158" stroke-width="7" stroke-linejoin="round"/>
  <path d="M510 318L494 273L525 258H546" fill="none" class="outline"/>
  <path d="M311 295H353" stroke="#163344" stroke-width="12" stroke-linecap="round"/>
  <path d="M239 402L391 395Q414 410 391 427L239 420Z" fill="none" stroke="#718579" stroke-width="3"/>
  <circle cx="391" cy="411" r="19" fill="#e0d9bb" stroke="#163344" stroke-width="4"/>

  <!-- The absurdly efficient courier. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M301 269L261 251L282 285" fill="#fffdf6" class="outline"/>
    <path d="M301 206Q336 176 381 210Q414 247 365 292Q322 308 290 279Q269 244 301 206Z" fill="#fffdf6" class="outline"/>
    <path d="M306 221Q320 246 355 254Q350 279 324 281Q301 267 306 221Z" fill="#c6d9d7" class="outline"/>
    <path d="M367 237Q399 213 395 176L392 157Q393 130 417 130Q444 132 444 157L436 202Q429 240 396 268" fill="#fffdf6" class="outline"/>

    <!-- Tiny helmet, enormous business model. -->
    <path d="M390 144Q390 113 419 110Q446 111 452 141Z" fill="#ef7158" class="outline"/>
    <path d="M398 124L407 133M417 119L425 131M435 125L440 134" stroke="#fff2cd" stroke-width="4" stroke-linecap="round"/>
    <path d="M398 145L407 176" fill="none" stroke="#163344" stroke-width="3"/>
    <circle cx="426" cy="154" r="5" fill="#163344"/>
    <path d="M417 143L431 140" stroke="#163344" stroke-width="3" stroke-linecap="round"/>

    <!-- Bill pouch with fish plainly visible. -->
    <path d="M440 166L662 185Q640 259 552 255Q481 251 440 186Z" fill="#ffc263" class="outline"/>
    <path d="M466 194Q520 229 580 222Q622 218 643 194" fill="none" stroke="#e89a44" stroke-width="3"/>
    <g fill="#74babc" stroke="#163344" stroke-width="3" stroke-linejoin="round">
      <path d="M491 214Q515 186 548 211Q522 237 491 214ZM548 211L562 196V225Z"/>
      <path d="M567 225Q588 202 615 221Q596 244 567 225ZM615 221L628 209V232Z"/>
    </g>
    <circle cx="503" cy="211" r="3" fill="#163344"/>
    <circle cx="578" cy="221" r="3" fill="#163344"/>
    <path d="M440 165L668 182L665 192L441 183Z" fill="#ffda7e" class="outline"/>
    <path d="M470 174L646 186" stroke="#fff1bd" stroke-width="3"/>

    <path d="M368 257Q411 286 494 274" fill="none" class="outline"/>
    <path d="M482 272L497 268L504 279" fill="none" class="outline"/>

    <!-- Pedaling leg flexes gently with the crank. -->
    <path d="M346 286L369 337L411 389" fill="none" stroke="#163344" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M346 286L369 337L411 389;M346 286L346 350L371 433;M346 286L369 337L411 389" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M346 286L369 337L411 389" fill="none" stroke="#f6b64e" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" values="M346 286L369 337L411 389;M346 286L346 350L371 433;M346 286L369 337L411 389" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(391 411)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-45" to="315" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-28 0H28" stroke="#163344" stroke-width="6" stroke-linecap="round"/>
      <circle cx="28" r="7" fill="#f6b64e" stroke="#163344" stroke-width="3"/>
      <circle cx="-28" r="7" fill="#f6b64e" stroke="#163344" stroke-width="3"/>
    </g>
  </g>

  <path d="M656 302Q684 285 713 307" fill="none" stroke="#163344" stroke-width="3"/>
  <rect x="636" y="304" width="127" height="48" rx="9" fill="#fffdf4" stroke="#163344" stroke-width="3"/>
  <text x="699" y="324" text-anchor="middle" font-size="13" font-weight="bold">CARGO BIKE?</text>
  <text x="699" y="342" text-anchor="middle" font-size="15" font-weight="900">CARGO BEAK.</text>

  <text x="400" y="534" text-anchor="middle" font-size="21" font-weight="bold">He bills by the mile. The fish pay through the beak.</text>
  <path d="M40 552H760" stroke="#d2c5a5" stroke-width="2"/>
  <text x="400" y="580" text-anchor="middle" font-size="17">2026-10-30 21:01:32 SGT (UTC+08:00)</text>
</svg>