  <title id="title">The Pelican Delivery Service</title>
  <desc id="desc">A pompous pelican pedals a bicycle with fish in its enormous bill pouch, advertising free shipping while struggling uphill. Wheels spin and the pelican bobs in a looping animation.</desc>
