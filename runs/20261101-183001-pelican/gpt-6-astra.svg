<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a fish dangling from its enormous beak. The wheels spin, the pedals turn, and the bird bobs. Caption: Why pay for delivery when you ARE the cargo bike?</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fff6dc"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fff6dc" stroke="#21313d" stroke-width="10"/>
      <circle r="66" fill="none" stroke="#dfaa51" stroke-width="3"/>
      <g stroke="#668a91" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <circle r="9" fill="#21313d"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6dc"/>
  <path d="M0 344Q170 310 325 348T800 330V496H0Z" fill="#d9e8cf"/>
  <g fill="#ffffff" opacity=".8">
    <path d="M66 163Q50 137 79 130Q93 101 120 126Q154 120 158 151Q173 164 151 169H77Z"/>
    <path d="M614 143Q603 120 628 116Q642 90 667 113Q700 106 706 138Z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#21313d">
    <text x="400" y="64" font-size="48" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
    <text x="400" y="94" font-size="17" font-weight="700" letter-spacing="2">ZERO EMISSIONS. QUESTIONABLE BALANCE.</text>
  </g>

  <ellipse cx="401" cy="487" rx="256" ry="13" fill="#a5b798" opacity=".5"/>
  <path d="M69 489H731" stroke="#21313d" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#668a91" stroke-width="4" stroke-linecap="round">
    <path d="M123 319H177M104 338H158M134 357H170"/>
  </g>

  <!-- Rotating wheels -->
  <g transform="translate(253 408)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(553 408)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Cheerfully undersized bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M253 408L326 309L392 408ZM326 309H508L392 408M508 309L553 408" stroke="#21313d" stroke-width="14"/>
    <path d="M253 408L326 309L392 408ZM326 309H508L392 408M508 309L553 408" stroke="#ef6651" stroke-width="8"/>
    <path d="M326 309L315 284M508 309L495 273L523 262" stroke="#21313d" stroke-width="9"/>
    <path d="M294 284H337M519 262H542" stroke="#21313d" stroke-width="13"/>
    <path d="M255 408L392 408" stroke="#21313d" stroke-width="3"/>
  </g>

  <!-- Pelican and expressive cargo -->
  <g stroke="#21313d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M309 276L298 334L376 386" fill="none" stroke="#e99b32" stroke-width="13"/>
    <path d="M267 248L223 225L245 278L279 287" fill="#f8faf1"/>
    <path d="M263 215Q309 176 364 219Q388 237 403 224L420 181Q428 153 453 160Q478 166 473 193L460 260Q447 289 400 300Q323 320 275 286Q247 262 263 215Z" fill="#fffef5"/>
    <path d="M285 227Q331 211 380 258Q345 286 296 265Q320 259 335 249Q308 251 285 227Z" fill="#dce7e4"/>
    <path d="M391 247Q437 270 491 273" fill="none" stroke="#fffef5" stroke-width="17"/>
    <path d="M391 247Q437 270 491 273" fill="none" stroke-width="3"/>
    <path d="M486 268L502 270L508 281" fill="none"/>

    <!-- Long beak and extravagant pouch -->
    <path d="M468 189L655 218Q619 279 550 271Q486 266 468 206Z" fill="#f6bb53"/>
    <path d="M474 207Q513 250 572 253" fill="none" stroke="#d68d35" stroke-width="3"/>
    <path d="M466 185Q543 181 664 214L657 223L472 208Z" fill="#ffd76b"/>
    <path d="M480 200L643 215" fill="none" stroke-width="2"/>
    <circle cx="452" cy="184" r="13" fill="white"/>
    <circle cx="457" cy="185" r="5" fill="#21313d" stroke="none"/>
    <path d="M435 164L459 158" fill="none"/>
    <path d="M426 150Q447 127 474 151L475 161H425Z" fill="#ef6651"/>
    <path d="M440 140V153M453 137V153M466 143V155" fill="none" stroke-width="3"/>
    <path d="M425 161H482" fill="none"/>

    <!-- Fish caught in the beak, unimpressed -->
    <g transform="translate(627 228)">
      <path d="M0 0Q-23 18-12 44L-24 59L-6 55L5 67L9 45Q29 18 0 0Z" fill="#76b8b8"/>
      <path d="M-9 28L-22 28L-12 37" fill="#4e919a"/>
      <circle cx="3" cy="16" r="6" fill="white" stroke-width="2"/>
      <circle cx="5" cy="17" r="2" fill="#21313d" stroke="none"/>
      <path d="M-3 29L6 31" fill="none" stroke-width="2"/>
    </g>
    <path d="M486 157Q493 144 497 153Q498 160 490 162Z" fill="#76b8b8" stroke-width="2"/>
  </g>

  <!-- Turning crank and webbed foot -->
  <circle cx="392" cy="408" r="16" fill="#fff6dc" stroke="#21313d" stroke-width="4"/>
  <g transform="translate(392 408)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-23 0H23" stroke="#21313d" stroke-width="6"/>
      <path d="M-30-5H-16M16 5H30" stroke="#21313d" stroke-width="6"/>
      <path d="M15-8L31-13L40-3L17 0Z" fill="#e99b32" stroke="#21313d" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#21313d" text-anchor="middle">
    <rect x="54" y="505" width="692" height="40" rx="10" fill="#ffe1a0"/>
    <text x="400" y="531" font-size="21" font-weight="700">Why pay for delivery when you ARE the cargo bike?</text>
    <path d="M80 560H720" stroke="#c7ba9d" stroke-width="1"/>
    <text x="400" y="583" font-size="17">2026-11-01 18:30:01 SGT (UTC+08:00)</text>
  </g>
</svg>