<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A determined pelican rides a bicycle, its enormous beak carrying an overdue parking ticket.</desc>
  <defs>
    <style>
      .ink{stroke:#243247;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.8s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .7s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#d9f3ed"/>
  <circle cx="683" cy="145" r="57" fill="#ffd166"/>
  <path d="M0 355 Q115 315 225 355 T450 350 T800 345 V520 H0Z" fill="#9bd3b1"/>
  <path d="M0 420 Q170 390 340 420 T800 410 V520 H0Z" fill="#79bd9d"/>

  <text id="title" x="400" y="57" text-anchor="middle" fill="#243247" font-family="Verdana, sans-serif" font-size="31" font-weight="900" letter-spacing="1">THE PELICAN EXPRESS</text>
  <text x="400" y="86" text-anchor="middle" fill="#53657a" font-family="Verdana, sans-serif" font-size="15" font-weight="700">One bird. Two wheels. Absolutely no breadcrumbs for parking.</text>

  <!-- Motion streaks -->
  <path d="M85 244h93M62 264h70M111 284h54" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path d="M641 302h75M670 322h55" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".7"/>

  <!-- Bicycle frame -->
  <g fill="none" class="ink" stroke-width="8">
    <g class="wheel">
      <circle cx="245" cy="407" r="78" stroke="#243247" stroke-width="8"/>
      <circle cx="245" cy="407" r="7" fill="#ef476f" stroke="#243247" stroke-width="4"/>
      <path d="M245 329v156M167 407h156M190 352l110 110M300 352 190 462" stroke="#668096" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="568" cy="407" r="78" stroke="#243247" stroke-width="8"/>
      <circle cx="568" cy="407" r="7" fill="#ef476f" stroke="#243247" stroke-width="4"/>
      <path d="M568 329v156M490 407h156M513 352l110 110M623 352 513 462" stroke="#668096" stroke-width="3"/>
    </g>
    <path d="M245 407 350 315 415 407 245 407M350 315h104l114 92M415 407l47-92M450 304h59M462 315l-12-18"/>
    <circle cx="415" cy="407" r="21" fill="#ffd166" stroke="#243247" stroke-width="5"/>
    <path d="M415 407l-28 27M415 407l33 20" stroke-width="6"/>
    <path d="M339 302h-43q-10 0-8 9t14 9h41" stroke-width="7"/>
    <path d="M457 315v-18M448 297h18" stroke-width="6"/>
  </g>

  <!-- Pedal crank animation -->
  <g class="ink" stroke-width="5">
    <path d="M415 407l-28 27M415 407l33 20" />
    <circle cx="387" cy="434" r="5" fill="#ef476f"/>
    <circle cx="448" cy="427" r="5" fill="#ef476f"/>
  </g>

  <!-- Pelican rider -->
  <g class="rider">
    <!-- tail and body -->
    <path d="M364 275q-40-31-62 1 26 1 39 27" fill="#f7f5ee" class="ink" stroke-width="5"/>
    <ellipse cx="393" cy="267" rx="61" ry="54" fill="#f7f5ee" class="ink" stroke-width="5"/>
    <path d="M368 293q35 14 67-3" fill="none" stroke="#d5d2c8" stroke-width="4"/>
    <!-- wing -->
    <path d="M378 255q43-27 62 8-30 4-48 24" fill="#d9e3e4" class="ink" stroke-width="4"/>
    <path d="M390 260q23-9 37 4" fill="none" stroke="#9aabb0" stroke-width="3"/>
    <!-- neck -->
    <path d="M424 251q-4-50 16-75l37 11q-28 29-15 72" fill="#f7f5ee" class="ink" stroke-width="5"/>
    <!-- head -->
    <circle cx="455" cy="165" r="42" fill="#f7f5ee" class="ink" stroke-width="5"/>
    <path d="M428 143q-16-17-13-32 21 5 30 26" fill="#ef476f" class="ink" stroke-width="4"/>
    <circle cx="469" cy="158" r="5.5" fill="#243247"/>
    <circle cx="470" cy="156" r="1.8" fill="#fff"/>
    <!-- huge beak / satirical ticket pouch -->
    <path d="M489 168q88-20 150 13-51 33-151 8z" fill="#ff9f43" class="ink" stroke-width="5"/>
    <path d="M516 180q57-5 98 2" fill="none" stroke="#d9782e" stroke-width="3"/>
    <path d="M532 178l7-17 55 4-4 18" fill="#fff3c4" class="ink" stroke-width="2"/>
    <text x="563" y="175" text-anchor="middle" fill="#b94448" font-family="Verdana, sans-serif" font-size="8" font-weight="900" transform="rotate(3 563 175)">PARKING FINE</text>
    <text x="563" y="183" text-anchor="middle" fill="#243247" font-family="Verdana, sans-serif" font-size="6" font-weight="700" transform="rotate(3 563 175)">EXPIRED: YESTERDAY</text>
    <!-- legs and feet on pedals -->
    <path d="M397 305l11 42 27 22" fill="none" class="ink" stroke-width="8"/>
    <path d="M431 369q13-3 24 7l-3 8-27-2" fill="#ff9f43" class="ink" stroke-width="4"/>
    <path d="M427 293l-16 43-22 16" fill="none" class="ink" stroke-width="8"/>
    <path d="M389 352q-13-3-22 7l3 8 27-2" fill="#ff9f43" class="ink" stroke-width="4"/>
    <!-- handlebars grip -->
    <path d="M458 264l-4 29" fill="none" class="ink" stroke-width="7"/>
    <path d="M451 292q8-4 14 1" fill="none" stroke="#ff9f43" stroke-width="9" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M419 150q9-35 39-37 29 0 41 24l-70 2z" fill="#ef476f" class="ink" stroke-width="4"/>
    <path d="M432 138q18-19 40-15" fill="none" stroke="#ff91a8" stroke-width="4"/>
  </g>

  <!-- Ground and sign -->
  <path d="M72 489h658" stroke="#496d61" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(75 322)">
    <path d="M26 95v67" stroke="#765d43" stroke-width="7"/>
    <rect x="0" y="0" width="104" height="96" rx="8" fill="#fff3c4" class="ink" stroke-width="4"/>
    <text x="52" y="27" text-anchor="middle" fill="#243247" font-family="Verdana, sans-serif" font-size="11" font-weight="900">BIKE LANE</text>
    <text x="52" y="49" text-anchor="middle" fill="#ef476f" font-family="Verdana, sans-serif" font-size="11" font-weight="900">BIRDS</text>
    <text x="52" y="69" text-anchor="middle" fill="#ef476f" font-family="Verdana, sans-serif" font-size="11" font-weight="900">ONLY</text>
    <path d="M25 79h54" stroke="#243247" stroke-width="3"/>
  </g>
  <text x="559" y="506" text-anchor="middle" fill="#365c52" font-family="Verdana, sans-serif" font-size="13" font-style="italic">“I’m not late. I’m migrating at bicycle speed.”</text>

  <rect x="0" y="530" width="800" height="70" fill="#243247"/>
  <text x="400" y="557" text-anchor="middle" fill="#fff3c4" font-family="Verdana, sans-serif" font-size="16" font-weight="800">Beak first. Questions later.</text>
  <text x="400" y="583" text-anchor="middle" fill="#d9f3ed" font-family="Verdana, sans-serif" font-size="14" font-weight="600">2026-11-01 18:31:51 SGT (UTC+08:00)</text>
</svg>