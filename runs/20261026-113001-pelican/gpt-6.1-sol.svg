<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a tiny bicycle while carrying a fish in its enormous bill. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a9e3ef"/>
      <stop offset="1" stop-color="#f4fcf8"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc45c"/>
      <stop offset="1" stop-color="#ed893b"/>
    </linearGradient>
    <pattern id="road" width="110" height="10" patternUnits="userSpaceOnUse">
      <path d="M10 5h48" stroke="#fff5d4" stroke-width="5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff8e8"/>
  <path d="M0 0h800v443H0z" fill="url(#sky)"/>
  <circle cx="692" cy="126" r="43" fill="#ffdc75"/>
  <g fill="#fff" opacity=".8">
    <path d="M48 149c-9-24 21-39 38-25 6-30 49-28 54 1 26-9 45 22 24 33H48z"/>
    <path d="M551 179c-7-18 14-34 31-23 12-25 43-18 46 5 26-5 35 20 19 25h-96z"/>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="900" fill="#173a48" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#365966">Zero emissions. Excessive carry-on.</text>

  <path d="M0 363Q97 318 198 361T411 356T615 354T800 349v99H0z" fill="#91c8a2"/>
  <path d="M0 402Q182 366 360 402T800 392v65H0z" fill="#61a987"/>
  <rect y="441" width="800" height="75" fill="#53656b"/>
  <rect y="488" width="800" height="10" fill="url(#road)"/>
  <path d="M0 441h800" stroke="#314c54" stroke-width="5"/>
  <ellipse cx="402" cy="459" rx="220" ry="13" fill="#233c43" opacity=".22"/>

  <!-- A perfectly serious roadside sporting authority. -->
  <g stroke="#26434b" stroke-width="4" stroke-linejoin="round">
    <path d="M690 320v120" fill="none"/>
    <rect x="622" y="258" width="142" height="66" rx="9" fill="#fff6d9"/>
  </g>
  <g text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#26434b">
    <text x="693" y="284" font-size="15">CYCLE LANE</text>
    <text x="693" y="307" font-size="13">NO WIDE LOADS</text>
  </g>

  <!-- Wheels: each spoke assembly rotates around its own hub. -->
  <g fill="#d9eff0" stroke="#233b47">
    <circle cx="244" cy="389" r="68" stroke-width="12"/>
    <circle cx="540" cy="389" r="68" stroke-width="12"/>
  </g>
  <g stroke="#73939c" stroke-width="3">
    <g transform="translate(244 389)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <path d="M-62 0H62M0-62V62M-44-44l88 88M-44 44l88-88"/>
        <path d="M-53-31L53 31M-31 53L31-53" opacity=".65"/>
      </g>
    </g>
    <g transform="translate(540 389)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <path d="M-62 0H62M0-62V62M-44-44l88 88M-44 44l88-88"/>
        <path d="M-53-31L53 31M-31 53L31-53" opacity=".65"/>
      </g>
    </g>
  </g>
  <g fill="none" stroke="#243b46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 389l84-112 60 112H244l69-86h181l-106 86M494 303l46 86" stroke-width="13"/>
    <path d="M244 389l84-112 60 112H244l69-86h181l-106 86" stroke="#ed5c57" stroke-width="7"/>
    <path d="M328 277l-8-28M300 248h54" stroke-width="9"/>
    <path d="M540 389l-53-125 24-21h27" stroke-width="9"/>
  </g>
  <path d="M295 246q29-13 64 0l-7 11h-51z" fill="#273e48"/>
  <path d="M523 242h20" stroke="#e7b267" stroke-width="12" stroke-linecap="round"/>
  <circle cx="244" cy="389" r="8" fill="#273e48"/>
  <circle cx="540" cy="389" r="8" fill="#273e48"/>

  <!-- The rider and its spectacularly impractical luggage. -->
  <g stroke="#263d47" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M318 245q-54-9-72-48l48 12q-5-31 17-56 38-42 85-10 30 23 24 65l-32 52z" fill="#fffdf0"/>
    <path d="M322 161q-28 20-13 54 14 27 51 13 9-31-15-46" fill="#d9e5df"/>
    <path d="M395 206q-7-48 1-86 8-34 34-27 23 9 17 37l-12 63q-4 35-32 43" fill="#fffdf0"/>
    <path d="M384 211q39 4 71 39l52-5" fill="none" stroke="#263d47" stroke-width="16"/>
    <path d="M384 208q39 4 71 39l52-5" fill="none" stroke="#f7f8e9" stroke-width="10"/>
    <path d="M353 246l49 58-24 65" fill="none" stroke="#e6a04c" stroke-width="13">
      <animate attributeName="d" values="M353 246l49 58-24 65;M353 246l23 68 42 58;M353 246l49 58-24 65" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M415 117q47-14 137 25l63 20-175 16z" fill="#ffcd5e"/>
    <path d="M440 178q52 90 154-10l-89 7z" fill="url(#pouch)"/>
    <path d="M444 158l168 4" fill="none" stroke="#a75b2e" stroke-width="3"/>
    <path d="M519 181q21-24 41-6l18-11-2 23 15 17-28-4q-25 17-44-2z" fill="#74b7b7" stroke-width="3"/>
    <circle cx="532" cy="185" r="3" fill="#263d47" stroke="none"/>
    <path d="M549 180l4 16" fill="none" stroke-width="2"/>
    <circle cx="432" cy="126" r="11" fill="white"/>
    <circle cx="437" cy="128" r="4" fill="#263d47" stroke="none"/>
    <path d="M421 109l20 4" fill="none" stroke-width="5"/>
    <path d="M395 106q-1-35 30-36 31 0 38 33z" fill="#ed5c57"/>
    <path d="M412 78l5 22m14-25 5 26" stroke="#ffe0ac" stroke-width="5"/>
    <path d="M394 105h72" stroke-width="6"/>
    <path d="M397 119l-9 18" fill="none" stroke-width="3"/>
    <path d="M280 204l-31 10 20 10" fill="#fffdf0"/>
  </g>

  <!-- The crank and pedals loop with the wheels. -->
  <g transform="translate(388 389)">
    <circle r="17" fill="#344e59" stroke="#213945" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-27 0h54" stroke="#c9d8d6" stroke-width="6"/>
      <path d="M-35-6h16v12h-16zM19-6h16v12H19z" fill="#e7a047" stroke="#263d47" stroke-width="3"/>
    </g>
    <circle r="5" fill="#f4f5e7"/>
  </g>

  <g fill="none" stroke="#fff6d9" stroke-width="4" stroke-linecap="round">
    <path d="M119 357h40M99 376h47M122 396h30">
      <animate attributeName="opacity" values=".3;1;.3" dur=".7s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect y="516" width="800" height="84" fill="#fff8e8"/>
  <path d="M28 517h744" stroke="#dbcfb5" stroke-width="2"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#243e48">He bought a bicycle to cut his seafood miles.</text>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4d5c61">2026-10-26 11:31:26 SGT (UTC+08:00)</text>
</svg>