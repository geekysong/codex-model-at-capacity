<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past Practicality</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a tiny bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
    .rider { animation: bob .6s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: 400px 385px; animation: pedal .6s linear infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(18deg); } }
  </style>

  <rect width="800" height="600" fill="#b9e8f4"/>
  <path d="M0 322 Q110 280 220 322 T440 316 T650 319 T800 290 V465 H0Z" fill="#90d36e"/>
  <path d="M0 450 Q180 410 350 448 T800 430 V492 H0Z" fill="#667f4d"/>
  <path d="M0 472 H800" stroke="#454545" stroke-width="13"/>
  <path d="M0 490 H800" stroke="#f5d64e" stroke-width="5" stroke-dasharray="34 21"/>

  <g font-family="Arial, sans-serif">
    <text x="400" y="58" text-anchor="middle" font-size="37" font-weight="900" fill="#243449">PELICAN PEDALS PAST PRACTICALITY</text>
    <text x="400" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#41566a">“Why fly when you can arrive sweaty and smug?”</text>
  </g>

  <g class="wheel">
    <circle cx="278" cy="419" r="62" fill="#eaf5f7" stroke="#28343a" stroke-width="10"/>
