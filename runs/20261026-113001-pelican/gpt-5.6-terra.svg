    <text x="614" y="268" font-family="Arial, sans-serif" font-size="12" fill="#32495a">*except the pelican’s opinions</text>
  </g>

  <rect x="0" y="512" width="800" height="88" fill="#243449"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f8dc67">AERODYNAMICS: OPTIONAL. DRAMA: STANDARD.</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ffffff">2026-10-26 11:32:49 SGT (UTC+08:00)</text>
