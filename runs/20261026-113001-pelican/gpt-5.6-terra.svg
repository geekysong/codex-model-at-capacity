    <path d="M305 292 Q248 288 221 315 Q280 339 368 327 Q374 302 305 292Z" fill="#f6b64c" stroke="#28343a" stroke-width="7"/>
    <path d="M242 315 Q278 307 315 320" fill="none" stroke="#cf7934" stroke-width="5"/>

    <ellipse cx="430" cy="231" rx="31" ry="27" fill="#fffdf0" stroke="#28343a" stroke-width="6"/>
    <circle cx="438" cy="231" r="8" fill="#263238"/>
