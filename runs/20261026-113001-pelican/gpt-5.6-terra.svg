    <circle cx="514" cy="419" r="7" fill="#ef615b"/>
    <path d="M514 357V481 M452 419H576 M470 375L558 463 M558 375L470 463" stroke="#819da4" stroke-width="3"/>
  </g>

  <g stroke="#28343a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M278 419 L362 329 L449 419 Z"/>
    <path d="M362 329 L474 325 L514 419"/>
    <path d="M449 419 L493 354"/>
    <path d="M474 325 L500 292 L539 292"/>
    <path d="M350 328 L332 307 L372 307"/>
    <path d="M449 419 L425 444"/>
