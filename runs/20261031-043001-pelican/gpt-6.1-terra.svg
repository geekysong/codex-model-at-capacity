<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN IN THE BIKE LANE</title>
  <desc id="desc">A smug pelican pedals a bicycle past a snail, carrying far too many fish in its enormous beak.</desc>
  <style>
    .wheel { animation: spin 2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .rider { animation: bob 1s ease-in-out infinite; }
    .pedals { animation: spin 2s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedals { animation: none; } }
  </style>

  <rect width="800" height="600" fill="#fff6df"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#d9f3f2" stroke="#26383c" stroke-width="5"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="900" letter-spacing="2" fill="#26383c">PELICAN IN THE BIKE LANE</text>
  <path d="M50 92 H750" stroke="#26383c" stroke-width="3" stroke-linecap="round"/>

  <circle cx="675" cy="151" r="35" fill="#ffd76a" stroke="#26383c" stroke-width="3"/>
