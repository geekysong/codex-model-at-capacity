<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle carrying one tiny fish in its enormous bill. Spoked wheels rotate, pedals turn, and the pelican bobs. A roadside sign declares this a low carbon, high carb lane.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1" fill="#163948" opacity=".035"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #163948; }
      .outline { stroke: #163948; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #64848b; stroke-width: 3; }
    </style>
  </defs>

  <path fill="#fff3d9" d="M0 0h800v600H0z"/>
  <path fill="url(#paper)" d="M0 0h800v600H0z"/>
  <text x="400" y="60" text-anchor="middle" font-size="47" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-size="18" font-weight="bold" letter-spacing="1">ALL THE GEAR. ONE TINY FISH.</text>

  <!-- One sunny coastal bicycle lane -->
  <rect x="30" y="118" width="740" height="374" rx="25" fill="#c8e8e5"/>
  <circle cx="105" cy="184" r="36" fill="#ffd366"/>
  <path d="M31 345 Q190 298 350 344 T770 332 V430 H31Z" fill="#8ec9c2"/>
  <path d="M31 370 Q210 344 365 371 T770 359 V433 H31Z" fill="#b6d7b8"/>
  <path d="M30 420H770V467Q770 492 745 492H55Q30 492 30 467Z" fill="#e3c995"/>
  <path d="M51 475H749" stroke="#fff3d9" stroke-width="5" stroke-dasharray="35 25"/>
  <ellipse cx="410" cy="467" rx="243" ry="12" fill="#163948" opacity=".12"/>

  <!-- Roadside satire -->
  <path d="M678 252V415" stroke="#163948" stroke-width="8"/>
  <rect x="598" y="174" width="153" height="100" rx="12" fill="#fff8e7" class="outline"/>
  <text x="674" y="201" text-anchor="middle" font-size="17" font-weight="900">LOW CARBON</text>
  <path d="M612 214H737" stroke="#e89d65" stroke-width="2"/>
  <text x="674" y="238" text-anchor="middle" font-size="20" font-weight="900">HIGH CARB</text>
  <text x="674" y="258" text-anchor="middle" font-size="12">CYCLISTS &amp; SEABIRDS</text>

  <!-- Rotating wheels -->
  <g transform="translate(260 406)">
    <circle r="69" fill="#fff8e7" class="outline" stroke-width="9"/>
    <circle r="59" fill="#d9ece2" stroke="#e59459" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
      <path d="M-22-54L22 54M-54-22L54 22M-54 22L54-22M-22 54L22-54"/>
      <path d="M-10-58H10" stroke="#ed6549" stroke-width="7"/>
    </g>
    <circle r="8" fill="#163948"/>
  </g>
  <g transform="translate(555 406)">
    <circle r="69" fill="#fff8e7" class="outline" stroke-width="9"/>
    <circle r="59" fill="#d9ece2" stroke="#e59459" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
      <path d="M-22-54L22 54M-54-22L54 22M-54 22L54-22M-22 54L22-54"/>
      <path d="M-10-58H10" stroke="#ed6549" stroke-width="7"/>
    </g>
    <circle r="8" fill="#163948"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 406L341 322L399 406H260L332 306M341 322H514L399 406M514 322L555 406M514 322L502 284"
          stroke="#163948" stroke-width="13"/>
    <path d="M260 406L341 322L399 406H260M341 322H514L399 406M514 322L555 406"
          stroke="#ed6549" stroke-width="7"/>
    <path d="M502 284L530 279Q547 280 539 296" stroke="#163948" stroke-width="8"/>
    <path d="M313 306H356" stroke="#163948" stroke-width="12"/>
  </g>
  <circle cx="399" cy="406" r="19" fill="#fff3d9" class="outline"/>
  <circle cx="523" cy="278" r="7" fill="#ffd366" stroke="#163948" stroke-width="3"/>

  <!-- Pelican and pedaling feet -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M360 296L377 347L399 385" fill="none" stroke="#163948" stroke-width="14" stroke-linecap="round"/>
    <path d="M360 296L377 347L399 385" fill="none" stroke="#e9a43f" stroke-width="8" stroke-linecap="round"/>
    <path d="M371 303L354 355L380 411" fill="none" stroke="#163948" stroke-width="14" stroke-linecap="round"/>
    <path d="M371 303L354 355L380 411" fill="none" stroke="#ffbf50" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" values="M371 303L354 355L380 411;M371 303L383 355L417 411;M371 303L354 355L380 411" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- Tail, body, and long neck -->
    <path d="M307 267L269 238L278 276L259 271L300 303Z" fill="#fffdf0" class="outline"/>
    <path d="M301 246Q322 216 373 234Q393 235 400 200L405 177Q411 146 438 152Q465 158 458 190L447 237Q440 269 407 284Q391 321 343 314Q299 309 291 278Q288 262 301 246Z"
          fill="#fffdf0" class="outline"/>
    <path d="M306 260Q342 242 389 266Q365 297 323 286" fill="#d7e3dc" class="outline"/>
    <path d="M327 268L353 277M340 261L368 270" fill="none" stroke="#9ab6b1" stroke-width="3" stroke-linecap="round"/>

    <!-- Wing reaches the handlebars -->
    <path d="M388 261Q431 261 458 279L505 282" fill="none" stroke="#163948" stroke-width="17" stroke-linecap="round"/>
    <path d="M388 261Q431 261 458 279L503 282" fill="none" stroke="#fffdf0" stroke-width="11" stroke-linecap="round"/>

    <!-- Preposterously capacious bill -->
    <path d="M450 190L582 209Q568 255 505 252Q460 250 450 190Z" fill="#ffbd61" class="outline"/>
    <path d="M451 186L593 207L453 210Z" fill="#ffdb71" class="outline"/>
    <path d="M473 218Q484 242 508 242" fill="none" stroke="#e38f49" stroke-width="3" stroke-linecap="round"/>

    <!-- One disappointed fish -->
    <path d="M520 230L506 220V239Z" fill="#419caa" stroke="#163948" stroke-width="2"/>
    <ellipse cx="534" cy="230" rx="17" ry="9" fill="#6ebcc1" stroke="#163948" stroke-width="2"/>
    <circle cx="543" cy="227" r="2.5" fill="#163948"/>
    <path d="M540 235H546" stroke="#163948" stroke-width="2"/>

    <!-- Smug face and aerodynamic helmet -->
    <circle cx="440" cy="179" r="5" fill="#163948"/>
    <path d="M430 168L445 170" stroke="#163948" stroke-width="4" stroke-linecap="round"/>
    <path d="M399 162Q403 128 434 132Q461 134 469 160Z" fill="#ed6549" class="outline"/>
    <path d="M418 140L414 152M435 139L434 152M451 144L454 153" stroke="#fff3d9" stroke-width="5" stroke-linecap="round"/>
    <path d="M406 166L419 195L433 195" fill="none" stroke="#163948" stroke-width="3"/>

    <!-- Race number -->
    <rect x="319" y="286" width="42" height="26" rx="4" fill="#fff3d9" stroke="#163948" stroke-width="2"/>
    <text x="340" y="305" text-anchor="middle" font-size="19" font-weight="bold">01</text>
  </g>

  <!-- Visible orbiting crank and webbed foot -->
  <g transform="translate(399 406)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-22 0H22" stroke="#163948" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(22 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <path d="M-9-7L4-9L18 2L8 3L4 7L-1 3L-11 4Z" fill="#ffbf50" stroke="#163948" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-12 9H15" stroke="#163948" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>
    </g>
    <circle r="5" fill="#163948"/>
  </g>

  <!-- Static speech stays readable -->
  <path d="M133 142H311Q326 142 326 157V199Q326 213 311 213H281L298 234L256 213H133Q118 213 118 198V157Q118 142 133 142Z"
        fill="#fffdf0" stroke="#163948" stroke-width="3" stroke-linejoin="round"/>
  <text x="222" y="171" text-anchor="middle" font-size="19" font-weight="bold">“My other ride</text>
  <text x="222" y="196" text-anchor="middle" font-size="19" font-weight="bold">is a tailwind.”</text>

  <!-- Dedicated footer -->
  <text x="400" y="530" text-anchor="middle" font-size="22" font-weight="bold">He cycles to work. His lunch gets a chauffeur.</text>
  <path d="M135 548H665" stroke="#d3b990" stroke-width="1.5"/>
  <text x="400" y="578" text-anchor="middle" font-size="17">2026-10-31 04:30:01 SGT (UTC+08:00)</text>
</svg>