<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A determined pelican rides a bicycle with a fish-filled bill pouch. The wheels spin and the pelican bobs as it pedals.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#aee3eb"/>
      <stop offset="1" stop-color="#eef8df"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd15e"/>
      <stop offset="1" stop-color="#f59a46"/>
    </linearGradient>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #183c43; }
      .ink { stroke: #183c43; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #f8f0d3; stroke-width: 4; }
    </style>
    <g id="wheel">
      <circle r="77" fill="#29444a" stroke="#183c43" stroke-width="5"/>
      <circle r="65" fill="#c5e5dc" stroke="#f8f0d3" stroke-width="5"/>
