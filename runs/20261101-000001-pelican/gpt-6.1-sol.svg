        <path d="M-63 0H63M0-63V63M-45-45L45 45M-45 45L45-45"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#f7bf4b" stroke="#183c43" stroke-width="4"/>
    </g>
  </defs>

