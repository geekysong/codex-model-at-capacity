<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle carrying one fish while its enormous bill carries the rest. Wheels spin and the pelican bobs continuously.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0H10" stroke="#fff"/>
    </pattern>
    <g id="wheel">
      <circle r="79" fill="#fff5db" stroke="#233b45" stroke-width="12"/>
      <g stroke="#6e9598" stroke-width="3">
        <path d="M-73 0H73M0-73V73M-52-52L52 52M-52 52L52-52"/>
      </g>
      <circle r="10" fill="#ef815c" stroke="#233b45" stroke-width="4"/>
      <path d="M-27-68A73 73 0 0 1 27-68" fill="none" stroke="#f6b844" stroke-width="6"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#243c45" stroke-width="3"/>
  <text x="400" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#243c45">THE GIG PELICAN</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#9b4c36">ZERO EMISSIONS. MASSIVE OVERHEAD.</text>

  <path d="M45 397Q160 367 269 393T496 387T755 392V480H45Z" fill="#c9dcd0"/>
  <path d="M47 464H753" stroke="#243c45" stroke-width="4"/>
  <ellipse cx="394" cy="465" rx="240" ry="12" fill="#243c45" opacity=".12"/>

  <!-- One very optimistic roadside sign -->
  <path d="M696 287V438" stroke="#526d70" stroke-width="7"/>
  <rect x="635" y="218" width="119" height="81" rx="9" fill="#fffdf2" stroke="#243c45" stroke-width="4"/>
  <text x="694" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#243c45">BIKE LANE</text>
  <text x="694" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#243c45">BILLS WELCOME</text>
  <path d="M668 281H724L715 274M724 281L715 288" fill="none" stroke="#d65a3c" stroke-width="3"/>

  <!-- Rotating wheels -->
  <g transform="translate(244 382)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(550 382)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#243c45" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 382L318 278L378 382H244L468 284L550 382M318 278H468M378 382L318 260M468 284L454 249L491 233" stroke-width="14"/>
    <path d="M244 382L318 278L378 382H244L468 284L550 382M318 278H468" stroke="#e66d4c" stroke-width="8"/>
    <path d="M294 258H341" stroke-width="13"/>
    <path d="M479 233H502" stroke-width="11"/>
  </g>
  <circle cx="378" cy="382" r="24" fill="#f7bd4a" stroke="#243c45" stroke-width="5"/>

  <!-- Tiny cargo, enormous job -->
  <path d="M158 298H253L245 340H168Z" fill="#f5b447" stroke="#243c45" stroke-width="4"/>
  <path d="M180 299V337M202 299V339M225 299V337M164 319H249" stroke="#bd7a32" stroke-width="3"/>
  <path d="M178 294Q204 274 228 292Q208 309 184 298L168 305V286Z" fill="#66b9bc" stroke="#243c45" stroke-width="3"/>
  <circle cx="220" cy="291" r="3" fill="#243c45"/>
  <path d="M161 345H269" stroke="#243c45" stroke-width="6"/>

  <!-- Pelican and pedaling legs -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M345 264L369 315L398 349" fill="none" stroke="#b57832" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M345 264L369 315L398 349;M345 264L335 329L358 402;M345 264L369 315L398 349" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M326 259L323 325L358 402" fill="none" stroke="#efae3b" stroke-width="15" stroke-linecap="round">
      <animate attributeName="d" values="M326 259L323 325L358 402;M326 259L371 307L398 349;M326 259L323 325L358 402" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M347 404L380 408L366 393Z" fill="#efae3b" stroke="#243c45" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 -53;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <path d="M286 214L247 206L268 240Q267 281 327 283Q386 281 402 231L382 189Z" fill="#fffdf3" stroke="#243c45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M361 239Q404 229 407 194L408 170Q408 142 438 141Q467 143 465 169L450 197Q439 226 419 252" fill="#fffdf3" stroke="#243c45" stroke-width="5"/>
    <path d="M294 226Q324 208 353 232L390 250Q345 283 304 250" fill="#d8e2d8" stroke="#243c45" stroke-width="4"/>
    <path d="M346 231Q396 257 475 232" fill="none" stroke="#243c45" stroke-width="13" stroke-linecap="round"/>
    <path d="M346 229Q396 251 475 230" fill="none" stroke="#d8e2d8" stroke-width="7" stroke-linecap="round"/>

    <!-- The bill is its own delivery van -->
    <path d="M457 176L626 185Q592 259 501 224Q471 211 457 176Z" fill="#f5bb48" stroke="#243c45" stroke-width="5"/>
    <path d="M459 174Q539 160 632 182L627 190L456 185Z" fill="#f28e43" stroke="#243c45" stroke-width="4"/>
    <path d="M498 205l14-7 15 12 15-7 16 12 17-10 13 5" fill="none" stroke="#c1842f" stroke-width="3"/>
    <text x="546" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#684b25" transform="rotate(5 546 219)">EXCESS BAGGAGE</text>
    <circle cx="445" cy="164" r="6" fill="#243c45"/>
    <circle cx="447" cy="162" r="2" fill="white"/>
    <path d="M432 150L450 147" stroke="#243c45" stroke-width="4" stroke-linecap="round"/>
    <path d="M410 145Q415 117 445 120Q469 123 472 146Z" fill="#e76d4e" stroke="#243c45" stroke-width="4"/>
    <path d="M428 124L425 141M443 123L443 142M458 129L460 143" stroke="#923c30" stroke-width="4"/>
  </g>

  <g transform="translate(378 382)" stroke="#243c45" stroke-width="6">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-21 23L21-23"/>
      <path d="M-31 23H-11M11-23H31" stroke-width="8"/>
    </g>
  </g>

  <!-- Stationary speech keeps the joke readable -->
  <path d="M70 133H288Q302 133 302 147V185Q302 199 288 199H268L283 222L245 199H70Q56 199 56 185V147Q56 133 70 133Z" fill="#fffdf4" stroke="#243c45" stroke-width="3"/>
  <text x="179" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#243c45">“I’m paid per delivery.</text>
  <text x="179" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#243c45">The bill is extra.”</text>

  <text x="400" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#243c45">One pelican. Two wheels. A beakful of unpaid overtime.</text>
  <path d="M70 530H730" stroke="#c7b99b" stroke-width="2"/>
  <text x="400" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#243c45">2026-11-01 00:00:01 SGT (UTC+08:00)</text>
</svg>