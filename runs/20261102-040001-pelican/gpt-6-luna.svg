<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Two-Wheel Tax Plan</title>
  <desc id="desc">A smug pelican pedals a bicycle while carrying a fish in its beak. The caption reads: “He promised a balanced budget. Then he ate the auditor.”</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke: #243746; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.8s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#b9e8e4"/>
  <path d="M0 0h800v91H0z" fill="#173b4c"/>
  <text id="title" x="400" y="42" text-anchor="middle" fill="#fff4c2" font-size="27" font-weight="900" letter-spacing="1">THE PELICAN’S TWO-WHEEL TAX PLAN</text>
  <text x="400" y="70" text-anchor="middle" fill="#b9e8e4" font-size="14" font-weight="700">A campaign promise with a very large catch</text>

  <circle cx="99" cy="151" r="38" fill="#ffd66b"/>
  <path d="M0 323q103-36 204 0t204 0 204 0 188 0v202H0z" fill="#72bd83"/>
  <path d="M0 377q117-31 232 0t232 0 232 0 104 0v148H0z" fill="#4f9f74"/>
  <path d="M0 460h800" stroke="#e5d994" stroke-width="5" stroke-dasharray="28 22"/>

  <!-- bicycle frame -->
  <g fill="none" class="ink" stroke-width="7">
    <path d="M208 399L288 302l97 97-177 0 80-97h83l66 97"/>
    <path d="M286 300l-30-17m25 18h33"/>
    <path d="M449 396l12-94m-12 0h38"/>
  </g>
  <g class="wheel" fill="none" stroke="#243746" stroke-width="6">
    <circle cx="208" cy="399" r="66" fill="#d9f3e7"/>
    <circle cx="208" cy="399" r="8" fill="#f2634f"/>
    <path d="M208 333v132M142 399h132m-111-47 93 94m0-94-93 94"/>
  </g>
  <g class="wheel" fill="none" stroke="#243746" stroke-width="6">
    <circle cx="449" cy="399" r="66" fill="#d9f3e7"/>
    <circle cx="449" cy="399" r="8" fill="#f2634f"/>
    <path d="M449 333v132m-66-66h132m-113-47 93 94m0-94-93 94"/>
  </g>
  <g class="ink" stroke-width="5" fill="none">
    <circle cx="321" cy="399" r="18" stroke="#f2634f"/>
    <path d="M321 399l-38-28m38 28 34 25m-43-61-12-7m51 69 12 6"/>
  </g>

  <!-- pelican, bobbing with the ride -->
  <g class="rider">
    <path d="M291 289q-8-59 34-91 38-30 81-3 34 21 28 67-3 33-27 50l-69 8q-34-3-47-31z" fill="#fff8e8" class="ink" stroke-width="5"/>
    <path d="M321 262q32-35 72-20 26 10 34 34l-25 42q-38 18-74-3z" fill="#f2a44c" class="ink" stroke-width="4"/>
    <path d="M365 232q-5-31 20-50 27-21 53 2 17 15 8 37l-30 22z" fill="#fff8e8" class="ink" stroke-width="5"/>
    <path d="M410 226q35-11 70 5l-34 21q-18 7-38-3z" fill="#f2a44c" class="ink" stroke-width="4"/>
    <path d="M438 237q24 10 39 28-32 14-63-1l-10-17z" fill="#f2634f" class="ink" stroke-width="4"/>
    <circle cx="425" cy="207" r="4.5" fill="#243746"/>
    <path d="M407 192q18-12 34 0" fill="none" class="ink" stroke-width="3"/>
    <path d="M321 293q-33 25-42 61l20 12 34-38m69-10q26 26 29 59l-21 7-27-39" fill="#fff8e8" class="ink" stroke-width="5"/>
    <path d="M299 359l-16 12 18 7 22-8m90 14 18 7 17-12-23-5" fill="#f2634f" class="ink" stroke-width="4"/>
    <!-- tiny campaign sash -->
    <path d="M322 263l77 38-10 17-77-38z" fill="#f2634f"/>
    <text x="357" y="299" text-anchor="middle" fill="#fff" font-size="9" font-weight="900" transform="rotate(26 357 299)">VOTE FISH</text>
  </g>

  <path d="M527 185q36-24 69 0l-6 31q-29-13-59 0z" fill="#fff8e8" class="ink" stroke-width="3"/>
  <text x="561" y="199" text-anchor="middle" fill="#243746" font-size="12" font-weight="800">I’M CUTTING</text>
  <text x="561" y="214" text-anchor="middle" fill="#243746" font-size="12" font-weight="800">CARBS!</text>
  <path d="M516 222l-31 19" fill="none" class="ink" stroke-width="3"/>

  <rect x="117" y="482" width="566" height="50" rx="12" fill="#173b4c"/>
  <text x="400" y="504" text-anchor="middle" fill="#fff4c2" font-size="17" font-weight="800">“He promised a balanced budget.</text>
  <text x="400" y="524" text-anchor="middle" fill="#fff4c2" font-size="17" font-weight="800">Then he ate the auditor.”</text>
  <text x="400" y="570" text-anchor="middle" fill="#173b4c" font-size="14" font-weight="700">2026-11-02 04:02:13 SGT (UTC+08:00)</text>
</svg>