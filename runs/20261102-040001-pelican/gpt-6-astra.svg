<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, carrying fish in its enormous bill while a sign prohibits fishing. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="road" width="100" height="10" patternUnits="userSpaceOnUse">
      <path d="M15 5H65" stroke="#fff6dc" stroke-width="4" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="none" stroke="#223741" stroke-width="4"/>
  
  <text x="400" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="3" fill="#223741">TOUR DE BEAK</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#b94e39">ZERO EMISSIONS. SUSPICIOUS CARGO.</text>

  <!-- Seaside backdrop -->
  <rect x="37" y="117" width="726" height="346" rx="18" fill="#bce4df"/>
  <circle cx="118" cy="183" r="39" fill="#ffd272"/>
  <path d="M49 283Q150 263 260 285T480 284T751 279V410H49Z" fill="#79bebd"/>
  <g fill="none" stroke="#e6fff1" stroke-width="3" stroke-linecap="round">
    <path d="M66 307h68m35 16h65m337-19h68m41 25h48"/>
    <path d="M77 349h54m449 4h53"/>
  </g>
  <path d="M37 385Q210 363 393 389T763 382V463H37Z" fill="#e4cb94"/>
  <path d="M37 421H763V463H37Z" fill="#75858a"/>
  <rect x="37" y="446" width="726" height="10" fill="url(#road)"/>
  <ellipse cx="379" cy="431" rx="210" ry="12" fill="#223741" opacity=".16"/>

  <!-- Official advice, poorly received -->
  <path d="M690 258V414" stroke="#6d6554" stroke-width="9"/>
  <rect x="624" y="205" width="126" height="68" rx="7" fill="#fff5dc" stroke="#223741" stroke-width="4"/>
  <text x="687" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#b94e39">NO FISHING</text>
  <text x="687" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#223741">YES, EVEN YOU.</text>

  <!-- Rotating wheels -->
  <g stroke="#223741">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 238 371" to="360 238 371" dur="1.5s" repeatCount="indefinite"/>
      <circle cx="238" cy="371" r="58" fill="#fff5dc" stroke-width="10"/>
      <circle cx="238" cy="371" r="48" fill="#bce4df" stroke-width="2"/>
      <path d="M238 323V419M190 371H286M204 337L272 405M204 405L272 337" fill="none" stroke-width="2"/>
      <path d="M215 319A57 57 0 0 1 244 314" fill="none" stroke="#fff5dc" stroke-width="4"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 518 371" to="360 518 371" dur="1.5s" repeatCount="indefinite"/>
      <circle cx="518" cy="371" r="58" fill="#fff5dc" stroke-width="10"/>
      <circle cx="518" cy="371" r="48" fill="#bce4df" stroke-width="2"/>
      <path d="M518 323V419M470 371H566M484 337L552 405M484 405L552 337" fill="none" stroke-width="2"/>
      <path d="M495 319A57 57 0 0 1 524 314" fill="none" stroke="#fff5dc" stroke-width="4"/>
    </g>
  </g>

  <!-- A very small bicycle for a very large commuter -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 371L301 292L354 371ZM301 292H465L354 371M465 292L518 371" stroke="#223741" stroke-width="13"/>
    <path d="M238 371L301 292L354 371ZM301 292H465L354 371M465 292L518 371" stroke="#e85d49" stroke-width="7"/>
    <path d="M301 292L292 270M465 292L452 257L474 248" stroke="#223741" stroke-width="7"/>
    <path d="M271 269H313M470 248H491" stroke="#223741" stroke-width="10"/>
    <path d="M238 371L354 371" stroke="#223741" stroke-width="4"/>
  </g>
  <circle cx="238" cy="371" r="6" fill="#223741"/>
  <circle cx="518" cy="371" r="6" fill="#223741"/>

  <!-- Rider bobbing with effort -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".75s" repeatCount="indefinite"/>
    <!-- Tail and body -->
    <path d="M276 240L211 221L239 252L208 248L263 279" fill="#fffdf0" stroke="#223741" stroke-width="4" stroke-linejoin="round"/>
    <path d="M269 195C220 210 230 266 279 282C327 302 383 273 390 231L397 190L362 166C340 180 339 211 329 222C312 198 292 193 269 195Z" fill="#fffdf0" stroke="#223741" stroke-width="4"/>
    <!-- Racing jersey -->
    <path d="M254 211Q293 193 329 222L350 211L367 245Q337 288 281 277Q253 263 246 241Z" fill="#e85d49" stroke="#223741" stroke-width="4"/>
    <path d="M251 241Q298 261 350 235" fill="none" stroke="#ffd272" stroke-width="14"/>
    <rect x="269" y="222" width="41" height="34" rx="6" fill="#fff5dc" stroke="#223741" stroke-width="2"/>
    <text x="289" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#223741">01</text>
    <!-- Wing on handlebars -->
    <path d="M325 226Q352 257 400 256L474 249Q466 238 451 240L397 239L355 211" fill="#fffdf0" stroke="#223741" stroke-width="4" stroke-linejoin="round"/>
    <path d="M443 244l13 8m-25-7 12 9" stroke="#223741" stroke-width="2"/>

    <!-- Neck, head, enormous cargo pouch -->
    <path d="M358 214C365 196 345 176 351 151C359 120 402 120 416 142Q430 162 414 182L395 194L393 229" fill="#fffdf0" stroke="#223741" stroke-width="4"/>
    <path d="M409 164L591 181Q579 239 514 249Q450 245 409 183Z" fill="#f3b969" stroke="#223741" stroke-width="4"/>
    <path d="M431 191Q463 224 509 231Q551 227 573 194" fill="none" stroke="#ce884e" stroke-width="3"/>
    <!-- Fish peering out of the pouch -->
    <path d="M502 183Q520 157 543 178L559 167L556 191L540 187Q516 201 502 183Z" fill="#69afb3" stroke="#223741" stroke-width="3"/>
    <circle cx="517" cy="179" r="5" fill="#fffdf0"/>
    <circle cx="518" cy="179" r="2" fill="#223741"/>
    <path d="M409 162L600 180L590 189L410 181Z" fill="#ffd272" stroke="#223741" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="398" cy="153" r="11" fill="#fff" stroke="#223741" stroke-width="3"/>
    <circle cx="402" cy="154" r="4" fill="#223741"/>
    <path d="M386 136L409 142" stroke="#223741" stroke-width="4" stroke-linecap="round"/>
    <!-- Aerodynamic helmet -->
    <path d="M345 143Q350 113 381 114Q410 113 422 139L345 143Z" fill="#e85d49" stroke="#223741" stroke-width="4"/>
    <path d="M365 120l-5 14m24-16-2 15m17-10 5 11" stroke="#223741" stroke-width="4" stroke-linecap="round"/>
    <path d="M356 147L374 178L393 181" fill="none" stroke="#223741" stroke-width="3"/>
    <!-- Exertion -->
    <path d="M333 155Q317 143 322 136Q334 137 333 155Z" fill="#409fae"/>
  </g>

  <!-- Pedaling leg -->
  <path d="M303 278L324 318L354 345" fill="none" stroke="#223741" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M303 278L324 318L354 345;M303 278L306 343L354 397;M303 278L324 318L354 345" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M303 278L324 318L354 345" fill="none" stroke="#efb653" stroke-width="7" stroke-linecap="round">
    <animate attributeName="d" values="M303 278L324 318L354 345;M303 278L306 343L354 397;M303 278L324 318L354 345" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <circle cx="354" cy="371" r="14" fill="#fff5dc" stroke="#223741" stroke-width="4"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 354 371" to="360 354 371" dur="1.5s" repeatCount="indefinite"/>
    <path d="M354 345V397" stroke="#223741" stroke-width="5"/>
    <path d="M344 345h20m-20 52h20" stroke="#223741" stroke-width="7" stroke-linecap="round"/>
  </g>
  <circle cx="354" cy="371" r="5" fill="#e85d49"/>

  <!-- Motion marks -->
  <g stroke="#fff5dc" stroke-width="5" stroke-linecap="round">
    <path d="M126 373h31m-49 17h40m425-11h24"/>
  </g>

  <!-- Dedicated caption and timestamp footer -->
  <text x="400" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#223741">“It’s not fishing. It’s a meal on wheels.”</text>
  <path d="M69 523H731" stroke="#d6c8a8" stroke-width="2"/>
  <text x="400" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#223741">2026-11-02 04:00:01 SGT (UTC+08:00)</text>
</svg>