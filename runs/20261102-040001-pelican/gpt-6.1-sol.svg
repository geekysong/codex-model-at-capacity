<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A proud pelican pedals a bicycle with a fish dangling from its enormous bill. Both wheels spin, its legs pedal, and its body bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10 10 0" stroke="#fff" stroke-width="2" opacity=".25"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke: #203548; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #73949c; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e6"/>
  <circle cx="693" cy="139" r="45" fill="#ffd36c"/>
  <path d="M0 394 Q140 345 280 389 T560 381 T800 378 V474 H0Z" fill="#d6e8c1"/>
  <path d="M0 429 Q240 413 800 429 V474 H0Z" fill="#b2cfa9"/>
  <path d="M0 459 H800" stroke="#203548" stroke-width="5"/>
  <path d="M50 475 H150 M235 475 H335 M420 475 H520 M605 475 H705" stroke="#dcba80" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="61" text-anchor="middle" font-size="48" font-weight="900" fill="#203548" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="91" text-anchor="middle" font-size="18" fill="#56646c">THE COMMUTE HAS A CATCH.</text>

  <ellipse cx="404" cy="453" rx="251" ry="10" fill="#203548" opacity=".12"/>

  <!-- Each complete wheel turns around its own hub. -->
  <g transform="translate(248 377)">
    <circle r="76" fill="#fff8e6" stroke="#203548" stroke-width="12"/>
    <circle r="68" fill="none" stroke="#9fc7cc" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path class="spoke" d="M-67 0H67 M0-67V67 M-47-47 47 47 M-47 47 47-47 M-62-26 62 26 M-26-62 26 62 M-62 26 62-26 M-26 62 26-62"/>
      <path d="M47-47 55-55" stroke="#f09932" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="9" fill="#203548"/>
  </g>
  <g transform="translate(570 377)">
    <circle r="76" fill="#fff8e6" stroke="#203548" stroke-width="12"/>
    <circle r="68" fill="none" stroke="#9fc7cc" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path class="spoke" d="M-67 0H67 M0-67V67 M-47-47 47 47 M-47 47 47-47 M-62-26 62 26 M-26-62 26 62 M-62 26 62-26 M-26 62 26-62"/>
      <path d="M47-47 55-55" stroke="#f09932" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="9" fill="#203548"/>
  </g>

  <!-- Bicycle frame and handlebars. -->
  <path d="M248 377 325 278 384 377 248 377 M325 278 523 278 384 377 M523 278 570 377"
        fill="none" stroke="#203548" stroke-width="13" stroke-linejoin="round"/>
  <path d="M248 377 325 278 384 377 248 377 M325 278 523 278 384 377 M523 278 570 377"
        fill="none" stroke="#e65e4e" stroke-width="7" stroke-linejoin="round"/>
  <path d="M325 278 315 251 M523 278 512 241 535 224 558 224" class="ink" fill="none"/>
  <path d="M292 249 H340" stroke="#203548" stroke-width="13" stroke-linecap="round"/>
  <path d="M547 224 H566" stroke="#5b8990" stroke-width="10" stroke-linecap="round"/>
  <circle cx="384" cy="377" r="23" fill="#f4c35a" class="ink"/>
  <path d="M248 377 384 354 M248 377 384 400" stroke="#203548" stroke-width="3" fill="none"/>

  <!-- Far leg and pedal follow an offset cycle. -->
  <path d="M340 262 333 311 360 377" fill="none" stroke="#d68d30" stroke-width="11" stroke-linecap="round">
    <animate attributeName="d" values="M340 262 333 311 360 377;M340 262 370 309 384 353;M340 262 386 338 408 377;M340 262 340 350 384 401;M340 262 333 311 360 377" dur=".8s" repeatCount="indefinite"/>
  </path>

  <!-- Pelican body gently bobs while the bicycle stays stable. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M304 220 261 205 281 240 262 248 309 259" fill="#e5eeeb" class="ink"/>
    <path d="M304 182 C274 206 286 254 324 267 C357 281 411 263 425 232 L440 183 411 164Z" fill="#fffdf4" class="ink"/>
    <path d="M312 210 Q348 192 381 219 Q357 249 320 239" fill="#c9dcdb" class="ink"/>
    <path d="M379 211 Q408 207 427 173 L440 142" fill="none" stroke="#203548" stroke-width="37" stroke-linecap="round"/>
    <path d="M379 211 Q408 207 427 173 L440 142" fill="none" stroke="#fffdf4" stroke-width="27" stroke-linecap="round"/>
    <ellipse cx="449" cy="139" rx="39" ry="33" fill="#fffdf4" class="ink"/>

    <!-- Oversized bill and expandable grocery-bag pouch. -->
    <path d="M472 144 670 165 Q626 221 550 223 Q489 215 472 158Z" fill="#f3ba59" class="ink"/>
    <path d="M475 139 674 157 Q683 161 672 166 L475 158Z" fill="#ffcf70" class="ink"/>
    <path d="M502 178 Q548 207 605 191" fill="none" stroke="#d18e39" stroke-width="3"/>
    <text x="552" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#704724" transform="rotate(7 552 198)">LUNCH</text>

    <circle cx="454" cy="135" r="7" fill="#203548"/>
    <circle cx="456" cy="133" r="2" fill="white"/>
    <path d="M439 119 456 115" class="ink" fill="none"/>
    <path d="M415 118 Q442 84 477 113 L480 121 413 121Z" fill="#e65e4e" class="ink"/>
    <path d="M438 100 434 117 M454 101 457 117" stroke="#fff8e6" stroke-width="4"/>
    <path d="M423 159 442 175 461 162" fill="none" stroke="#203548" stroke-width="3"/>

    <!-- Wing reaches the handlebar. -->
    <path d="M380 221 Q420 245 452 229 L532 219 Q546 223 538 232 L452 245 Q417 260 390 246"
          fill="#e1eae5" class="ink"/>
    <path d="M514 223 520 235 M525 222 531 233" stroke="#73949c" stroke-width="2"/>

    <!-- A fish passenger protests from the bill. -->
    <g transform="translate(649 188)">
      <animateTransform attributeName="transform" type="translate" values="649 188;649 193;649 188" dur=".8s" repeatCount="indefinite"/>
      <path d="M0-16 C-19-5-17 24 0 34 C17 24 19-5 0-16Z" fill="#66b8bf" class="ink"/>
      <path d="M0 34-13 47 0 44 13 47Z" fill="#66b8bf" class="ink"/>
      <circle cx="-4" cy="-1" r="4" fill="white"/>
      <circle cx="-4" cy="-1" r="2" fill="#203548"/>
      <path d="M-5 13 Q0 8 5 13" fill="none" stroke="#203548" stroke-width="2"/>
    </g>
  </g>

  <!-- Near leg flexes with the rotating crank. -->
  <path d="M352 263 389 307 408 377" fill="none" stroke="#efa942" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M352 263 389 307 408 377;M352 263 351 338 384 401;M352 263 327 322 360 377;M352 263 370 302 384 353;M352 263 389 307 408 377" dur=".8s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(384 377)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#203548" stroke-width="6"/>
      <g transform="translate(24 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur=".8s" repeatCount="indefinite"/>
          <path d="M-12-5 3-8 17-1 10 5H-12Z" fill="#f5b947" stroke="#203548" stroke-width="3"/>
        </g>
      </g>
      <g transform="translate(-24 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur=".8s" repeatCount="indefinite"/>
          <path d="M-11 0H12" stroke="#203548" stroke-width="6" stroke-linecap="round"/>
        </g>
      </g>
    </g>
    <circle r="6" fill="#203548"/>
  </g>

  <path d="M181 296H216 M163 315H205 M179 335H210" stroke="#73949c" stroke-width="4" stroke-linecap="round"/>
  <path d="M99 150 Q99 130 119 130 H275 Q295 130 295 150 V177 Q295 197 275 197 H223 L208 215 210 197 H119 Q99 197 99 177Z" fill="white" stroke="#203548" stroke-width="3"/>
  <text x="197" y="156" text-anchor="middle" font-size="17" font-weight="bold" fill="#203548">
    <tspan x="197">“My bill includes</tspan>
    <tspan x="197" dy="23">free delivery.”</tspan>
  </text>

  <rect x="0" y="491" width="800" height="109" fill="#fff8e6"/>
  <text x="400" y="521" text-anchor="middle" font-size="21" font-weight="bold" fill="#203548">A pelican on a bicycle: all bill, zero emissions.</text>
  <path d="M70 542 H730" stroke="#d9c9a6" stroke-width="2"/>
  <text x="400" y="574" text-anchor="middle" font-size="18" fill="#344c59">2026-11-02 04:01:12 SGT (UTC+08:00)</text>
</svg>