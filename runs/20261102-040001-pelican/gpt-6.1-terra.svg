    <path d="M390 398l22 25m-44-50 22 25" fill="none" class="thin"/>
    <path d="M402 425h24m-71-54h24" fill="none" class="ink"/>
  </g>

  <g class="rider">
    <path d="M349 306q-17 30-4 63l29 38m-31-99q30 24 60 33l14 28" fill="none" stroke="#e6a044" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
