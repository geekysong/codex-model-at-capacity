  <rect x="0" y="518" width="800" height="82" fill="#fffaf0"/>
  <path d="M0 518h800" stroke="#d7e6dc" stroke-width="3"/>
  <text x="400" y="548" text-anchor="middle" class="caption">His lunch insists on riding in the front.</text>
