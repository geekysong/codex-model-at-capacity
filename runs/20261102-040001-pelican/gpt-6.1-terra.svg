<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican pedals a bicycle with fish in its beak while the wheels spin and its body bobs.</desc>
  <defs>
    <style>
      .ink{stroke:#283340;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#283340;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .title{font:900 38px sans-serif;letter-spacing:2px;fill:#283340}
      .caption{font:700 22px sans-serif;fill:#283340}
      .date{font:16px sans-serif;fill:#42515d}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .rider{animation:bob 1s ease-in-out infinite}
      .pedal{transform-origin:390px 398px;animation:spin 2s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @media (prefers-reduced-motion:reduce){.wheel,.rider,.pedal{animation:none}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#eaf7f4"/>
  <circle cx="674" cy="125" r="46" fill="#ffd777"/>
  <path d="M75 171q23-28 48 0h35q-5-23-31-25-14-28-40-10-18-6-31 12-21-2-24 23z" fill="#fff" opacity=".9"/>
  <path d="M559 215q18-21 37 0h30q-4-19-25-20-13-22-32-7-16-5-25 10-16-1-20 17z" fill="#fff" opacity=".85"/>
  <text x="400" y="66" text-anchor="middle" class="title">THE DAILY COMMUTE</text>

  <path d="M0 474q120-23 245-5t267-2q155-20 288 7v126H0z" fill="#c7e9cb"/>
  <path d="M0 500h800" stroke="#91c39f" stroke-width="5"/>
  <path d="M47 482h70m32 0h27m496 0h68" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>

  <g class="wheel">
    <circle cx="210" cy="406" r="80" fill="#fffdf5" class="ink"/>
    <circle cx="210" cy="406" r="65" fill="none" stroke="#a9c9c6" stroke-width="3"/>
    <path d="M210 326v160m-80-80h160m-136-56 112 112m0-112L154 462" fill="none" stroke="#a9c9c6" stroke-width="3"/>
    <circle cx="210" cy="406" r="9" fill="#f0b35a" class="thin"/>
  </g>
  <g class="wheel">
    <circle cx="548" cy="406" r="80" fill="#fffdf5" class="ink"/>
    <circle cx="548" cy="406" r="65" fill="none" stroke="#a9c9c6" stroke-width="3"/>
