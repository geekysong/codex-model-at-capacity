    <circle cx="548" cy="406" r="9" fill="#f0b35a" class="thin"/>
  </g>

  <path d="M210 406l107-114 73 106H210l129-96 82 0 127 104-40-153" fill="none" stroke="#e86f55" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M317 292l-12-22m-29-2h61" fill="none" class="ink"/>
