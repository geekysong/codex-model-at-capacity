<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Against All Beaks</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#d9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#586577"/>
      <stop offset="1" stop-color="#303947"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#202938;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202938}
      .wheel{fill:none;stroke:#202938;stroke-width:9}
      .spoke{stroke:#718094;stroke-width:3}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".85"/>
  <path d="M0 340 Q130 285 260 340 T520 330 T800 325 V420 H0Z" fill="#8ed07b"/>
  <path d="M0 382 Q190 350 390 385 T800 375 V430 H0Z" fill="#62ad69"/>
  <path d="M0 420 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 520 H800" stroke="#f8d36b" stroke-width="8" stroke-dasharray="50 28" opacity=".9"/>
  
  <g class="label" text-anchor="middle">
    <text x="400" y="58" font-size="34" font-weight="900" fill="#fefefe" stroke="#202938" stroke-width="3" paint-order="stroke">
      PELICAN PEDALS AGAINST ALL BEAKS
    </text>
    <text x="400" y="92" font-size="18" font-weight="700">“Why fly when you can make traffic everyone else’s problem?”</text>
  </g>

  <g filter="url(#shadow)">
    <g id="bike">
      <g id="rearWheel">
        <circle cx="240" cy="450" r="74" class="wheel"/>
        <circle cx="240" cy="450" r="9" fill="#202938"/>
        <g class="spoke">
          <path d="M240 385V515M175 450H305M194 404L286 496M286 404L194 496"/>
        </g>
      </g>
      <g id="frontWheel">
        <circle cx="590" cy="450" r="74" class="wheel"/>
        <circle cx="590" cy="450" r="9" fill="#202938"/>
        <g class="spoke">
          <path d="M590 385V515M525 450H655M544 404L636 496M636 404L544 496"/>
        </g>
      </g>
      <path d="M240 450 L350 365 L470 450 L240 450 L410 450 L350 365 L590 450" fill="none" class="ink" stroke="#df493e" stroke-width="11"/>
      <path d="M470 450 L510 350 L590 450" fill="none" class="ink" stroke="#df493e" stroke-width="11"/>
      <path d="M505 350 L555 350" class="ink" fill="none"/>
      <path d="M334 363 L310 330" class="ink" fill="none"/>
      <circle cx="410" cy="450" r="14" fill="#f6c945" class="ink"/>
      <path d="M410 450 l-25 20 M410 450 l25 -20" class="ink" fill="none"/>
      <ellipse cx="386" cy="471" rx="12" ry="7" fill="#202938"/>
      <ellipse cx="434" cy="430" rx="12" ry="7" fill="#202938"/>
    </g>

    <g id="rider">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
      <path d="M375 260 Q430 245 466 287 L490 350 Q465 382 420 364 L370 315Z" fill="#f7fbff" class="ink"/>
      <path d="M378 298 Q425 325 475 300" fill="none" stroke="#7e9aac" stroke-width="6"/>
      <path d="M407 350 L435 445" class="ink" fill="none"/>
      <path d="M435 445 L468 450" class="ink" fill="none"/>
      <path d="M407 350 L365 438" class="ink" fill="none"/>
      <path d="M365 438 L340 450" class="ink" fill="none"/>
      <path d="M368 289 Q350 238 376 190 Q407 139 465 164 Q507 182 504 232 Q500 278 458 300 Q405 321 368 289Z" fill="#f2a23a" class="ink"/>
      <path d="M390 215 Q432 184 477 216 Q463 253 426 267 Q400 258 390 215Z" fill="#fff1c7" class="ink"/>
      <circle cx="443" cy="199" r="10" fill="#fff" class="ink"/>
      <circle cx="447" cy="201" r="4" fill="#202938"/>
      <path d="M472 225 Q558 218 612 252 Q560 294 474 266 Q446 254 472 225Z" fill="#f06b45" class="ink"/>
      <path d="M529 247 Q555 247 582 257" fill="none" stroke="#202938" stroke-width="5"/>
      <path d="M471 226 Q518 204 573 221" fill="none" stroke="#ffd37a" stroke-width="10"/>
      <path d="M376 238 Q335 220 326 187" fill="none" class="ink"/>
      <path d="M326 187 Q351 204 373 196" fill="none" class="ink"/>
      <path d="M392 316 Q350 335 326 374" class="ink" fill="none"/>
      <path d="M326 374 L348 392" class="ink" fill="none"/>
      <path d="M463 310 Q500 326 523 364" class="ink" fill="none"/>
      <path d="M523 364 L505 383" class="ink" fill="none"/>
      <path d="M393 163 Q414 125 452 131 Q476 136 482 163" fill="#df493e" class="ink"/>
      <path d="M389 157 Q430 127 478 157" fill="none" stroke="#fff4d6" stroke-width="8"/>
      <text x="485" y="125" class="label" font-size="20" font-weight="900" transform="rotate(8 485 125)">HONK!</text>
    </g>

    <g transform="translate(0 8)">
      <path d="M530 207 Q580 170 634 193 Q674 210 682 249 Q639 268 591 251 Q554 239 530 207Z" fill="#6b4b35" class="ink"/>
      <path d="M552 204 Q599 188 650 214" fill="none" stroke="#f3bf69" stroke-width="9"/>
      <circle cx="648" cy="223" r="6" fill="#202938"/>
      <path d="M682 249 L716 255" class="ink" fill="none"/>
      <text x="610" y="186" class="label" font-size="16" font-weight="800" text-anchor="middle">EMERGENCY FISH</text>
    </g>
  </g>

  <g class="label">
    <path d="M95 170 Q145 130 205 162" fill="none" stroke="#202938" stroke-width="5"/>
    <text x="105" y="145" font-size="18" font-weight="800">LOCAL BIRD</text>
    <text x="105" y="166" font-size="18" font-weight="800">DISCOVERS LEGS</text>
  </g>

  <rect x="30" y="548" width="740" height="36" rx="10" fill="#17202d" opacity=".9"/>
  <text x="400" y="572" text-anchor="middle" class="label" font-size="16" font-weight="700" fill="#ffffff">
    2026-10-28 20:00:01 SGT (UTC+08:00)
  </text>

  <style>
    #rearWheel,#frontWheel{transform-box:fill-box;transform-origin:center}
    #rearWheel{animation:spin 2s linear infinite}
    #frontWheel{animation:spin 2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</svg>