<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly large fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de8ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#535866"/>
      <stop offset="1" stop-color="#292d38"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202735;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202735}
      .tiny{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#202735}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="115" r="55" fill="#fff3a6" opacity=".8"/>
  <path d="M70 155 Q120 115 170 155 T270 155" fill="none" stroke="#fff" stroke-width="12" opacity=".75"/>
  <path d="M520 180 Q570 140 620 180 T720 180" fill="none" stroke="#fff" stroke-width="10" opacity=".65"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#b1273f">THE PELICAN EXPRESS</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="20" font-weight="700">“When the beak is bigger than the budget.”</text>

  <path d="M0 430 Q130 390 260 425 T520 420 T800 410 L800 600 L0 600Z" fill="#9bd47e"/>
  <path d="M0 475 L800 455 L800 600 L0 600Z" fill="url(#road)"/>
  <path d="M0 530 L800 510" stroke="#f8df75" stroke-width="8" stroke-dasharray="55 35" opacity=".9"/>

  <g transform="translate(0 8)" filter="url(#shadow)">
    <!-- bicycle -->
    <g class="ink" fill="none">
      <circle cx="270" cy="465" r="76" stroke="#e8f1f5" stroke-width="9">
        <animateTransform attributeName="transform" type="rotate" from="0 270 465" to="360 270 465" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="590" cy="465" r="76" stroke="#e8f1f5" stroke-width="9">
        <animateTransform attributeName="transform" type="rotate" from="0 590 465" to="360 590 465" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M270 465 L365 350 L470 465 L270 465 L410 465 L365 350 L590 465 L535 337 L470 465" stroke="#d74752" stroke-width="10"/>
      <path d="M535 337 L555 318 M535 337 L518 310" stroke="#202735" stroke-width="8"/>
      <circle cx="410" cy="465" r="18" fill="#ffd34f"/>
      <path d="M410 465 L385 434 M410 465 L442 488" stroke="#202735" stroke-width="7"/>
      <path d="M385 434 L363 442 M442 488 L462 480" stroke="#202735" stroke-width="7"/>
    </g>

    <!-- pedaling legs -->
    <g class="ink" fill="#f1a65b">
      <path d="M410 298 Q405 350 390 406 Q382 432 385 434"/>
      <path d="M430 301 Q450 350 442 388 Q438 410 442 488"/>
      <ellipse cx="365" cy="442" rx="25" ry="10" fill="#202735"/>
      <ellipse cx="462" cy="480" rx="25" ry="10" fill="#202735"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 7;0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- pelican body -->
    <g class="ink">
      <ellipse cx="410" cy="255" rx="82" ry="105" fill="#f6f2df"/>
      <path d="M360 215 Q325 255 350 315 Q375 340 405 314 Q382 266 405 223Z" fill="#d8dce0"/>
      <path d="M405 160 Q435 105 490 130 Q525 148 514 205 Q505 252 458 267 L410 250Z" fill="#f6f2df"/>
      <path d="M483 157 Q540 157 622 194 Q650 207 622 225 Q545 242 471 213Z" fill="#f2a43d"/>
      <path d="M483 194 Q553 205 625 210 Q552 254 466 226Z" fill="#f7bc50"/>
      <circle cx="477" cy="159" r="9" fill="#202735"/>
      <path d="M470 142 Q486 128 501 140" fill="none"/>
      <path d="M391 170 Q350 137 330 174 Q319 197 350 213 L405 225" fill="#f6f2df"/>
      <path d="M357 185 Q371 203 397 204" fill="none"/>
      <path d="M435 345 Q425 370 433 397" fill="none" stroke="#d74752" stroke-width="12"/>
      <path d="M426 389 Q451 400 468 388" fill="none" stroke="#202735" stroke-width="7"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0;0 5;0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- absurd fish cargo -->
    <g class="ink" transform="translate(575 270) rotate(-8)">
      <path d="M0 20 Q70 -35 145 20 Q70 75 0 20Z" fill="#67c7d8"/>
      <path d="M143 20 L185 -8 L176 20 L185 48Z" fill="#ef7890"/>
      <circle cx="34" cy="11" r="7" fill="#202735"/>
      <path d="M65 5 Q85 20 65 35" fill="none"/>
      <text x="83" y="105" text-anchor="middle" class="label" font-size="18" font-weight="800" fill="#b1273f">EMERGENCY LUNCH</text>
    </g>

    <!-- speech bubble -->
    <path d="M95 265 Q95 205 180 205 L280 205 Q335 205 335 255 Q335 305 280 305 L190 305 L155 335 L160 305 L145 305 Q95 305 95 265Z" fill="#fff" class="ink"/>
    <text x="215" y="245" text-anchor="middle" class="label" font-size="20" font-weight="800">MOVE OVER!</text>
    <text x="215" y="272" text-anchor="middle" class="label" font-size="17">I’m late for fish school!</text>
  </g>

  <text x="400" y="565" text-anchor="middle" class="tiny" font-weight="700">2026-10-28 20:02:10 SGT (UTC+08:00)</text>
</svg>