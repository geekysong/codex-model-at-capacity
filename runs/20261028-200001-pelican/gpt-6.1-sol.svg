<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#292929"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#18212b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .title{font:900 38px Impact,Arial,sans-serif;letter-spacing:2px;fill:#18212b}
      .caption{font:700 18px Arial,sans-serif;fill:#18212b}
      .small{font:700 14px Arial,sans-serif;fill:#18212b}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
      .rider{animation:bob .6s ease-in-out infinite alternate}
      .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="48" fill="#ffd65a" opacity=".9"/>
  <path d="M0 300 Q120 240 240 300 T480 300 T720 300 T960 300 V390 H0Z" fill="#9bcf8a"/>
  <path d="M0 350 Q140 310 280 350 T560 350 T840 350 V410 H0Z" fill="#72ad72"/>
  <rect y="390" width="800" height="210" fill="url(#road)"/>
  <path d="M0 500 H800" stroke="#e7d56b" stroke-width="8" stroke-dasharray="40 30"/>

  <text x="400" y="58" text-anchor="middle" class="title">THE GREAT PELICAN GETAWAY</text>
  <text x="400" y="87" text-anchor="middle" class="caption">He has a license to bill... and absolutely no idea how gears work.</text>

  <g class="rider" filter="url(#shadow)">
    <!-- bicycle frame -->
    <g>
      <circle cx="245" cy="470" r="78" fill="none" stroke="#e94d4d" stroke-width="9"/>
      <circle cx="555" cy="470" r="78" fill="none" stroke="#e94d4d" stroke-width="9"/>
      <g class="wheel">
        <circle cx="245" cy="470" r="69" fill="none" stroke="#f4f4f4" stroke-width="3"/>
        <path d="M245 401V539M176 470H314M196 421L294 519M294 421L196 519" stroke="#f4f4f4" stroke-width="2"/>
      </g>
      <g class="wheel">
        <circle cx="555" cy="470" r="69" fill="none" stroke="#f4f4f4" stroke-width="3"/>
        <path d="M555 401V539M486 470H624M506 421L604 519M604 421L506 519" stroke="#f4f4f4" stroke-width="2"/>
      </g>
      <path d="M245 470 L345 390 L445 470 Z M345 390 L555 470 M445 470 L420 375 L500 350" fill="none" stroke="#f04e4e" stroke-width="9"/>
      <path d="M400 370 h48" stroke="#18212b" stroke-width="8"/>
      <circle cx="445" cy="470" r="18" fill="#ffc94d" class="pedal"/>
      <path d="M445 470 l35 20 M445 470 l-30 -22" stroke="#18212b" stroke-width="6"/>
    </g>

    <!-- pelican body -->
    <ellipse cx="390" cy="275" rx="93" ry="108" fill="#f7f3e8" class="ink"/>
    <path d="M320 278 Q290 250 305 210 Q325 170 370 190 Q400 207 406 250" fill="#d8e7e8" class="ink"/>
    <ellipse cx="397" cy="165" rx="56" ry="62" fill="#f7f3e8" class="ink"/>
    <path d="M432 164 Q500 155 573 190 Q522 227 430 197Z" fill="#f3a544" class="ink"/>
    <path d="M440 194 Q490 211 558 193 Q508 260 440 221Z" fill="#e88939" class="ink"/>
    <circle cx="414" cy="153" r="8" fill="#18212b"/>
    <path d="M426 130 Q455 110 479 130" fill="none" class="ink"/>
    <path d="M343 265 Q388 310 434 270" fill="none" stroke="#c0b8a7" stroke-width="7"/>
    <path d="M350 319 Q390 350 430 320" fill="none" class="ink"/>
    <path d="M362 361 L344 421 M424 361 L447 421" class="ink" fill="none"/>
    <path d="M330 420 q18 14 32 0 M431 420 q18 14 32 0" class="ink" fill="none"/>
    <!-- wing and scarf -->
    <path d="M325 250 Q270 285 309 342 Q347 326 369 274Z" fill="#eef4f1" class="ink"/>
    <path d="M350 202 Q395 224 445 203" fill="none" stroke="#ef5350" stroke-width="14"/>
    <path d="M435 207 Q478 250 453 294" fill="none" stroke="#ef5350" stroke-width="12"/>
    <!-- feet on pedals -->
    <ellipse cx="420" cy="421" rx="18" ry="10" fill="#f3a544" class="ink"/>
    <ellipse cx="355" cy="421" rx="18" ry="10" fill="#f3a544" class="ink"/>
  </g>

  <g transform="translate(610 275)">
    <path d="M0 0 q24 -20 48 0 q-24 20 -48 0" fill="#fff" class="ink"/>
    <circle cx="23" cy="0" r="4" fill="#18212b"/>
    <text x="58" y="6" class="small">“Beak easy!”</text>
  </g>

  <g transform="translate(55 410)">
    <path d="M0 42 Q30 0 60 42" fill="#f5d36a" class="ink"/>
    <path d="M14 40 Q30 18 46 40" fill="#fff" class="ink"/>
    <text x="0" y="76" class="small">HONK IF YOU</text>
    <text x="0" y="93" class="small">FEAR BIRDS</text>
  </g>

  <rect x="18" y="558" width="764" height="30" rx="8" fill="#fff" opacity=".92"/>
  <text x="400" y="579" text-anchor="middle" class="small">2026-10-28 20:00:56 SGT (UTC+08:00)</text>
</svg>