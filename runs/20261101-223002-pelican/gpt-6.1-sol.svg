        <path d="M-69 0H69M0-69V69M-49-49L49 49M-49 49L49-49"/>
      </g>
      <circle r="9" fill="#233b48"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff3d6"/>
  <path d="M0 320Q150 270 310 316T610 300T800 315V490H0Z" fill="#c8e1cf"/>
