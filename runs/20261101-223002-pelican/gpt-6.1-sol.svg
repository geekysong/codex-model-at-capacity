    <path d="M546 189c-7-19 18-33 33-17 11-26 47-18 46 7 28-6 34 20 12 24h-82Z"/>
  </g>

  <text x="400" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#213b48">TOUR DE FISH</text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#997035">BIG BILL. TINY BIKE. NO BRAKES.</text>

  <path d="M491 126h205q18 0 18 18v54q0 18-18 18H548l-32 25 7-25h-32q-18 0-18-18v-54q0-18 18-18Z" fill="#fffdf4" stroke="#233b48" stroke-width="3"/>
  <text x="594" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#233b48">
    <tspan x="594">“It's not baggage.</tspan>
    <tspan x="594" dy="27">It's AERO-DINNER.”</tspan>
  </text>

