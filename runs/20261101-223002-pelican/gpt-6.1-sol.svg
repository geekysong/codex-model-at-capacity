<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="description">An expressive pelican pedals a tiny bicycle with a huge fish-filled bill, insisting that its cargo is aerodynamic. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fff8dd" stroke="#233b48" stroke-width="9"/>
      <circle r="67" fill="none" stroke="#e8a747" stroke-width="3"/>
