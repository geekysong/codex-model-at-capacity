<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <clipPath id="mainClip">
      <rect x="50" y="225" width="500" height="126"/>
    </clipPath>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="50" y="30" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="50" y="59">Initial horizontal speed: 20 m/s</text>
    <text x="50" y="82">Initial vertical speed: 15 m/s</text>
    <text x="50" y="105">Gravity: 10 m/s²; no air resistance</text>
    <text x="50" y="128">Scale: 10 px/m</text>
    <text x="50" y="157" font-weight="bold">Total flight time: 3 s</text>
    <text x="50" y="182" font-size="12">Landing lies beyond the main view; see detail.</text>
  </g>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#374151" stroke-width="2"/>

  <g clip-path="url(#mainClip)">
    <path d="M 100,350 Q 400,125 700,350"
          fill="none" stroke="#1769aa" stroke-width="3"/>
  </g>

  <circle cx="100" cy="350" r="4" fill="#172033"/>
  <circle cx="400" cy="237.5" r="4" fill="#172033"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="60" y="372">launch: 0 m, 0 m</text>
    <text x="300" y="216">apex: 30 m, 11.25 m</text>
    <text x="365" y="307" font-size="12">Trajectory continues beyond x = 550 px</text>
  </g>

  <rect x="410" y="45" width="165" height="133" rx="5"
        fill="#f8fafc" stroke="#94a3b8"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="420" y="65" font-size="12" font-weight="bold">Landing detail · 10 px/m</text>
    <text x="420" y="84" font-size="12">Main-view position: (700,350)</text>
  </g>
  <!-- Detail uses the same 10 px/m scale, translated by (-160,-210). -->
  <path d="M 460,88 Q 500,110 540,140"
        fill="none" stroke="#1769aa" stroke-width="3"/>
  <line x1="425" y1="140" x2="565" y2="140" stroke="#374151" stroke-width="2"/>
  <circle cx="540" cy="140" r="4" fill="#172033"/>
  <text x="420" y="165" font-family="Arial, sans-serif" font-size="14" fill="#172033">landing: 60 m, 0 m</text>

  <rect x="0" y="380" width="600" height="20" fill="#eef2f6"/>
  <text x="300" y="394" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12" fill="#172033">2026-10-25 02:04:16 SGT (UTC+08:00)</text>
</svg>