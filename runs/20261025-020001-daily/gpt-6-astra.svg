<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="30" y="28" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="30" y="52" font-size="14">Initial velocity: horizontal 20 m/s, vertical 15 m/s</text>
    <text x="30" y="75" font-size="14">Gravity: 10 m/s² · No air resistance · Flight time: 3 s</text>
    <text x="30" y="108" font-size="12">Scale constraint: 10 px/m puts landing at x=700, outside this canvas.</text>
    <text x="30" y="127" font-size="12">The trajectory below is uniformly reduced to 70% to fit (7 px/m).</text>
  </g>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#475569" stroke-width="2"/>

  <g transform="translate(30 105) scale(0.7)">
    <path d="M 100,350 Q 400,125 700,350" fill="none" stroke="#2563eb" stroke-width="3"/>
  </g>

  <g fill="#2563eb">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="310" cy="271.25" r="4"/>
    <circle cx="520" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="36" y="313">launch:</text>
    <text x="36" y="332">0 m, 0 m</text>
    <text x="240" y="251">apex: 30 m, 11.25 m</text>
    <text x="490" y="306">landing:</text>
    <text x="490" y="325">60 m, 0 m</text>
  </g>

  <rect x="0" y="365" width="600" height="35" fill="#f1f5f9"/>
  <text x="300" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-10-25 02:03:31 SGT (UTC+08:00)</text>
</svg>