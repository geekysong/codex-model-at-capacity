    <text x="200" y="43">B1</text><text x="300" y="43">C1</text><text x="400" y="43">D1</text><text x="500" y="43">E1</text>
    <text x="100" y="103">A2</text><text x="200" y="103">B2</text><text x="300" y="103">C2</text><text x="400" y="103">D2</text><text x="500" y="103">E2</text>
