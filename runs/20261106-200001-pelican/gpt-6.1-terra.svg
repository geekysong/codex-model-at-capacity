    <path d="M389 384 Q402 386 412 397" fill="none" stroke="#e99a45" stroke-width="9" stroke-linecap="round"/>
    <path d="M367 300 Q385 319 408 323 L432 350" fill="none" stroke="#e99a45" stroke-width="12" stroke-linecap="round"/>
    <path d="M429 349 Q443 347 454 353" fill="none" stroke="#e99a45" stroke-width="9" stroke-linecap="round"/>

    <path d="M288 269 Q264 260 248 238 Q249 272 274 286" fill="#e8e6dc" class="ink"/>
    <ellipse cx="331" cy="264" rx="77" ry="53" fill="#fffdf4" class="ink" transform="rotate(-8 331 264)"/>
    <path d="M287 255 Q323 231 366 255 Q347 288 310 285 Q293 282 287 255Z" fill="#dce5df" class="thin"/>
    <path d="M347 217 Q382 195 378 166 Q376 145 394 133 Q415 119 435 135 Q452 150 446 171 Q440 188 427 198 Q417 210 421 237" fill="#fffdf4" class="ink"/>
    <path d="M431 155 Q477 151 527 165 Q486 177 442 177 Z" fill="#f4a339" class="ink"/>
    <path d="M441 175 Q482 179 520 166 Q506 216 472 225 Q443 231 427 198" fill="#f7bd58" class="ink"/>
    <path d="M447 183 Q464 190 483 188" fill="none" stroke="#d78633" stroke-width="3" stroke-linecap="round"/>
    <circle cx="420" cy="153" r="11" fill="#fff" class="thin"/>
    <circle cx="423" cy="153" r="4" fill="#253447"/>
    <path d="M402 138 Q411 130 422 134" fill="none" stroke="#253447" stroke-width="4" stroke-linecap="round"/>
    <path d="M389 135 Q402 114 428 124 L442 133 Q422 129 405 138Z" fill="#de6658" class="thin"/>
    <path d="M405 120 Q414 105 426 111 L434 124" fill="#de6658" class="thin"/>
    <path d="M387 251 Q411 260 430 282 L462 286" fill="none" stroke="#dce5df" stroke-width="16" stroke-linecap="round"/>
    <path d="M387 251 Q411 260 430 282 L462 286" fill="none" stroke="#253447" stroke-width="3" stroke-linecap="round"/>
    <path d="M458 286 Q469 277 476 286" fill="none" stroke="#253447" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(621 275) rotate(5)">
    <rect x="0" y="0" width="132" height="64" rx="8" fill="#fffaf0" class="thin"/>
    <text x="66" y="26" text-anchor="middle" fill="#253447" font-family="Arial, sans-serif" font-size="14" font-weight="bold">BIKE LANE</text>
    <text x="66" y="48" text-anchor="middle" fill="#df6658" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ISH →</text>
    <path d="M65 64 V128" stroke="#253447" stroke-width="5"/>
  </g>

  <rect y="510" width="800" height="90" fill="#253447"/>
  <text x="400" y="544" text-anchor="middle" fill="#fff4db" font-family="Arial, sans-serif" font-size="21" font-weight="bold">“My other vehicle is a very large mouth.”</text>
  <text x="400" y="579" text-anchor="middle" fill="#cbd9d5" font-family="Arial, sans-serif" font-size="15">2026-11-06 20:03:05 SGT (UTC+08:00)</text>
</svg>