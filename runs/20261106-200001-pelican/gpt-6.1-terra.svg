<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels and bobbing pedals beneath a satirical caption.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#eabf86" opacity=".45"/>
    </pattern>
    <style>
      .ink { stroke:#253447; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#253447; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { animation: spin 2s linear infinite; transform-box:fill-box; transform-origin:center; }
      .rider { animation: bob 1s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center; }
      .pedals { animation: spin 2s linear infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .wheel,.rider,.pedals { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff4db"/>
  <rect width="800" height="510" fill="url(#dots)"/>
  <circle cx="655" cy="150" r="46" fill="#ffd06a"/>
  <path d="M0 365 Q110 334 220 364 T440 361 T800 357 V470 H0Z" fill="#b9dcc5"/>
  <path d="M0 402 Q180 380 355 404 T800 395 V470 H0Z" fill="#8bc5aa"/>
  <path d="M0 464 H800" stroke="#253447" stroke-width="5"/>
  <path d="M0 477 H800" stroke="#d6a46c" stroke-width="3" stroke-dasharray="18 15"/>

  <text x="400" y="64" text-anchor="middle" fill="#253447" font-family="Arial, sans-serif" font-size="42" font-weight="900" letter-spacing="2">THE DAILY COMMUTE</text>
  <text x="400" y="92" text-anchor="middle" fill="#98543e" font-family="Arial, sans-serif" font-size="17" font-weight="bold">ONE BIRD. TWO WHEELS. ZERO REGRETS.</text>

  <g fill="none" stroke="#fffaf0" stroke-width="8" stroke-linecap="round" opacity=".9">
    <path d="M87 173 h83 M70 192 h58 M125 211 h56"/>
    <path d="M91 322 h54 M110 339 h80"/>
  </g>

  <g class="wheel">
    <circle cx="250" cy="408" r="68" fill="#fffaf0" class="ink"/>
    <circle cx="250" cy="408" r="57" fill="none" stroke="#d48b67" stroke-width="4"/>
    <g stroke="#9aa9a6" stroke-width="3">
      <path d="M250 351 V465 M193 408 H307 M210 368 L290 448 M290 368 L210 448"/>
    </g>
    <circle cx="250" cy="408" r="7" fill="#253447"/>
  </g>
  <g class="wheel">
    <circle cx="550" cy="408" r="68" fill="#fffaf0" class="ink"/>
    <circle cx="550" cy="408" r="57" fill="none" stroke="#d48b67" stroke-width="4"/>
    <g stroke="#9aa9a6" stroke-width="3">
      <path d="M550 351 V465 M493 408 H607 M510 368 L590 448 M590 368 L510 448"/>
    </g>
    <circle cx="550" cy="408" r="7" fill="#253447"/>
  </g>

  <g fill="none" class="ink">
    <path d="M250 408 L329 326 L390 408 Z" stroke="#df6658" stroke-width="9"/>
    <path d="M329 326 L480 326 L390 408" stroke="#df6658" stroke-width="9"/>
    <path d="M480 326 L550 408 M464 290 L480 326" stroke="#253447" stroke-width="7"/>
    <path d="M459 289 Q475 276 493 286 L501 292" stroke="#253447" stroke-width="7"/>
    <path d="M329 326 L319 300 M300 298 H345" stroke="#253447" stroke-width="7"/>
  </g>
  <circle cx="390" cy="408" r="22" fill="#f3bd70" class="thin"/>
  <g class="pedals">
    <path d="M375 394 L405 422" fill="none" stroke="#253447" stroke-width="5" stroke-linecap="round"/>
    <path d="M365 393 H380 M400 423 H415" fill="none" stroke="#253447" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g class="rider">
