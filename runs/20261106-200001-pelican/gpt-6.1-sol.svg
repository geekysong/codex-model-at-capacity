<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Fish-Fueled Commute</title>
  <desc id="description">A smug pelican pedals a bicycle, carrying a fish in its enormous bill beneath a sign promising a bike lane eventually. The wheels spin and the pelican gently bobs.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#decfa9" opacity=".35"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fffaf0" stroke="#253542" stroke-width="10"/>
      <circle r="66" fill="none" stroke="#d0b891" stroke-width="2"/>
      <g stroke="#647683" stroke-width="3">
        <path d="M-69 0H69M0-69V69M-49-49L49 49M-49 49L49-49"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#e6ab39" stroke="#253542" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect width="800" height="540" fill="url(#paper)"/>
  <path d="M0 297Q135 266 262 294T521 281T800 286V462H0Z" fill="#d5e5d3"/>
  <g fill="#b1c8bd" opacity=".75">
    <path d="M24 281V220H63V281M71 280V196H117V279M126 280V238H162V280"/>
    <path d="M625 284V227H659V284M670 284V198H717V284M728 285V240H775V285"/>
  </g>

  <text x="400" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#253542">THE FISH-FUELED COMMUTE</text>
  <path d="M106 69H694" stroke="#e86e43" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#58616a">One bird. Two wheels. Absolutely no lane discipline.</text>

  <!-- The city's ambitious infrastructure program. -->
  <path d="M680 221V421" stroke="#59685e" stroke-width="9"/>
  <rect x="601" y="139" width="157" height="92" rx="7" fill="#fffdf2" stroke="#253542" stroke-width="4"/>
  <text x="679" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#253542">BIKE LANE</text>
  <text x="679" y="191" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#253542">COMING</text>
  <text x="679" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#d75b35">EVENTUALLY*</text>

  <path d="M0 448H800V528H0Z" fill="#e6ceb0"/>
  <path d="M0 449H800" stroke="#9c907c" stroke-width="4"/>
  <path d="M29 486H113M656 486H747" stroke="#fff7df" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="379" cy="461" rx="255" ry="14" fill="#7b7868" opacity=".19"/>

  <!-- Bicycle wheels really rotate, with the hubs fixed in place. -->
  <g transform="translate(226 379)"><use href="#wheel"/></g>
  <g transform="translate(543 379)"><use href="#wheel"/></g>

  <g stroke="#253542" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 379L306 272L372 379ZM306 272H472L372 379M472 272L543 379" fill="none" stroke="#253542" stroke-width="13"/>
    <path d="M226 379L306 272L372 379ZM306 272H472L372 379M472 272L543 379" fill="none" stroke="#e86e43" stroke-width="6"/>
    <path d="M306 272L294 246M274 244H321" fill="none"/>
    <path d="M472 272L459 232L486 218H511" fill="none"/>
    <path d="M508 218L519 227" stroke-width="11"/>
    <circle cx="372" cy="379" r="22" fill="#f0bd4d"/>
    <path d="M227 379H372" fill="none" stroke-width="3"/>
  </g>

  <!-- Pelican and feet bob gently as one readable character. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M307 303L335 337L364 367" fill="none" stroke="#253542" stroke-width="13" stroke-linecap="round"/>
    <path d="M307 303L335 337L364 367" fill="none" stroke="#efb441" stroke-width="7" stroke-linecap="round"/>
    <path d="M351 368L383 369L374 380H348Z" fill="#edaa35" stroke="#253542" stroke-width="4"/>

    <!-- Tail, body and folded wing. -->
    <path d="M278 239L217 207L234 251L211 251L268 284Z" fill="#fffdf4" stroke="#253542" stroke-width="5" stroke-linejoin="round"/>
    <path d="M269 216C297 183 369 191 390 222C416 254 386 300 344 310C302 321 253 284 253 250Z" fill="#fffdf4" stroke="#253542" stroke-width="5"/>
    <path d="M281 228Q333 213 365 257Q326 293 284 259" fill="#dde6df" stroke="#253542" stroke-width="4"/>
    <path d="M294 243L333 264M305 235L348 254" stroke="#95aaa3" stroke-width="3" stroke-linecap="round"/>

    <!-- Long neck and expressive head. -->
    <path d="M355 224C371 207 368 177 376 153C384 127 415 115 438 132C458 147 451 170 431 185C414 198 414 230 392 248" fill="#fffdf4" stroke="#253542" stroke-width="5"/>
    <path d="M386 135L375 116L394 121L398 107L412 123" fill="#fffdf4" stroke="#253542" stroke-width="4" stroke-linejoin="round"/>

    <!-- Oversized bill and elastic throat pouch. -->
    <path d="M431 161L587 176Q548 248 459 218Q437 208 431 161Z" fill="#f4c765" stroke="#253542" stroke-width="5"/>
    <path d="M432 158L591 174L580 185L431 177Z" fill="#f19d3f" stroke="#253542" stroke-width="4" stroke-linejoin="round"/>
    <path d="M457 191Q509 222 551 195" fill="none" stroke="#d69236" stroke-width="3"/>
    <!-- Fish passenger. -->
    <path d="M479 194Q497 177 524 190L540 180L537 199L522 196Q499 210 479 194Z" fill="#72b9be" stroke="#253542" stroke-width="3"/>
    <circle cx="491" cy="191" r="3" fill="#253542"/>
    <path d="M510 188L507 199" stroke="#367a84" stroke-width="2"/>

    <circle cx="425" cy="148" r="11" fill="white" stroke="#253542" stroke-width="3"/>
    <circle cx="429" cy="148" r="4" fill="#253542"/>
    <path d="M411 132L433 136" stroke="#253542" stroke-width="5" stroke-linecap="round"/>

    <!-- A necktie lends the commute unnecessary importance. -->
    <path d="M388 204L404 211L397 220L403 252L386 263L380 245L388 219L382 211Z" fill="#e86e43" stroke="#253542" stroke-width="3"/>
    <path d="M380 248Q425 264 473 233" fill="none" stroke="#253542" stroke-width="12" stroke-linecap="round"/>
    <path d="M380 248Q425 264 473 233" fill="none" stroke="#fffdf4" stroke-width="7" stroke-linecap="round"/>

    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 335 296;7 335 296;-5 335 296" dur="1.8s" repeatCount="indefinite"/>
      <path d="M335 296L391 320L395 383" fill="none" stroke="#253542" stroke-width="13" stroke-linecap="round"/>
      <path d="M335 296L391 320L395 383" fill="none" stroke="#efb441" stroke-width="7" stroke-linecap="round"/>
      <path d="M384 380L415 387L423 398L383 398Z" fill="#efa934" stroke="#253542" stroke-width="4"/>
    </g>
  </g>

  <!-- Fixed lettering stays still while the bird rides. -->
  <g font-family="Arial, sans-serif" fill="#253542">
    <path d="M118 124H287Q301 124 301 138V178Q301 191 287 191H220L205 211L207 191H118Q104 191 104 178V138Q104 124 118 124Z" fill="#fffdf4" stroke="#253542" stroke-width="3"/>
    <text x="202" y="150" text-anchor="middle" font-size="18" font-weight="bold">“My lunch has</text>
    <text x="202" y="175" text-anchor="middle" font-size="18" font-weight="bold">a chauffeur.”</text>
    <text x="400" y="510" text-anchor="middle" font-size="20" font-weight="bold">He skipped the gas station. The fish is less thrilled.</text>
  </g>

  <rect x="0" y="540" width="800" height="60" fill="#253542"/>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fff4d9">2026-11-06 20:01:24 SGT (UTC+08:00)</text>
</svg>