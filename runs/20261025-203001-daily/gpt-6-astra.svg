<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>Projectile motion with a horizontal axis break</title>
  <desc>Horizontal speed 20 m/s, vertical speed 15 m/s, gravity 10 m/s². Flight time 3 seconds, apex at 30 meters and 11.25 meters high, landing at 60 meters. Scale is 10 pixels per meter on each displayed segment. A horizontal break omits distances from 32 to 56 meters so the landing fits the canvas.</desc>
  <defs>
    <path id="trajectory" d="M100 350 Q400 125 700 350"/>
    <clipPath id="first-segment">
      <rect x="95" y="120" width="325" height="235"/>
    </clipPath>
    <clipPath id="last-segment">
      <rect x="660" y="120" width="45" height="235"/>
    </clipPath>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="30" y="30" font-size="19" font-weight="bold">Projectile motion</text>
    <text x="30" y="56" font-size="14">vₓ = 20 m/s · vᵧ₀ = 15 m/s · g = 10 m/s²</text>
    <text x="30" y="80" font-size="14">Total flight time: 3 s · No air resistance</text>
    <text x="30" y="108" font-size="13">Scale: 10 px/m; horizontal axis break omits x = 32–56 m.</text>
    <text x="30" y="129" font-size="13">The break allows the 60 m range to fit this canvas.</text>
  </g>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#475569" stroke-width="2"/>

  <g fill="none" stroke="#2563eb" stroke-width="3">
    <use href="#trajectory" clip-path="url(#first-segment)"/>
    <g transform="translate(-200 0)">
      <use href="#trajectory" clip-path="url(#last-segment)"/>
    </g>
  </g>

  <g stroke="#64748b" stroke-width="2">
    <path d="M426 274 l8 -12 M436 274 l8 -12"/>
  </g>
  <text x="435" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">axis break</text>

  <g fill="#172033">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="55" y="373">launch: 0 m, 0 m</text>
    <text x="335" y="216">apex: 30 m, 11.25 m</text>
    <text x="550" y="373" text-anchor="end">landing: 60 m, 0 m</text>
  </g>

  <text x="300" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">2026-10-25 20:33:48 SGT (UTC+08:00)</text>
</svg>