<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a huge beak full of fish. The wheels spin, the pedals turn, and the rider bobs above a seaside road.</desc>
  <defs>
    <pattern id="road" width="160" height="16" patternUnits="userSpaceOnUse">
      <path d="M15 8h70" stroke="#fff8df" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="spokes" stroke="#78959a" stroke-width="3">
      <path d="M-68 0H68M0-68V68M-48-48l96 96M-48 48l96-96"/>
      <circle r="58" fill="none" stroke="#ebba48" stroke-width="5" stroke-dasharray="9 20"/>
    </g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke:#19383e; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6dc"/>
  <path d="M0 105H800V449H0Z" fill="#d6f0ec"/>
  <circle cx="706" cy="175" r="40" fill="#ffd369"/>
  <path d="M0 348Q110 326 220 348T440 348T660 348T880 348V447H0Z" fill="#8fc8c8"/>
  <path d="M15 372h85m548-7h110M56 398h63m561-4h92" fill="none" stroke="#d6f0ec" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="55" text-anchor="middle" font-size="43" font-weight="900" fill="#19383e" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#517275">ONE BIRD. TWO WHEELS. ZERO AERODYNAMICS.</text>

  <!-- A single seaside road -->
  <path d="M0 444H800V510H0Z" fill="#53686a"/>
  <rect y="480" width="800" height="16" fill="url(#road)"/>
  <ellipse cx="406" cy="454" rx="224" ry="12" fill="#344e52" opacity=".24"/>

  <!-- Roadside joke -->
  <path d="M695 326v119" class="ink" fill="none"/>
  <rect x="634" y="270" width="122" height="66" rx="8" fill="#fff6dc" class="ink"/>
  <text x="695" y="296" text-anchor="middle" fill="#19383e" font-size="16" font-weight="bold">BIKE LANE</text>
  <text x="695" y="320" text-anchor="middle" fill="#b34d35" font-size="14" font-weight="bold">NO TRAWLING</text>

  <!-- Wheels rotate independently about their hubs -->
  <g transform="translate(257 389)">
    <circle r="76" fill="#e8f4e9" stroke="#19383e" stroke-width="12"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle r="9" fill="#19383e"/>
  </g>
  <g transform="translate(552 389)">
    <circle r="76" fill="#e8f4e9" stroke="#19383e" stroke-width="12"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle r="9" fill="#19383e"/>
  </g>

  <!-- Absurdly small racing bicycle -->
  <path d="M257 389l75-113 60 113H257l-8-2m83-111h162L392 389m102-113 58 113" fill="none" stroke="#19383e" stroke-width="13" stroke-linejoin="round"/>
  <path d="M257 389l75-113 60 113H257m75-113h162L392 389m102-113 58 113" fill="none" stroke="#e86d4d" stroke-width="7" stroke-linejoin="round"/>
  <path d="M332 276l-12-34m174 34-14-39 34-18q18-6 22 8" fill="none" class="ink"/>
  <path d="M294 244h52" stroke="#19383e" stroke-width="13" stroke-linecap="round"/>
  <path d="M263 389h128" stroke="#667b7b" stroke-width="4"/>

  <!-- Pelican and expressive cargo bob together -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M303 259l37 36 42 58" fill="none" stroke="#19383e" stroke-width="15" stroke-linecap="round"/>
    <path d="M303 259l37 36 42 58" fill="none" stroke="#eeae40" stroke-width="9" stroke-linecap="round"/>
    <path d="M270 231l-45-39 8 50-27-7 44 41" fill="#f8f8eb" class="ink"/>
    <path d="M255 223q-6-66 72-75 66-8 86 38l-7 47q-25 62-98 44-47-9-53-54Z" fill="#fffdf1" class="ink"/>
    <path d="M301 197q43-29 82 12l-65 36q-27-7-17-48Z" fill="#dce5dd" class="ink"/>
    <path d="M361 186q-13-59 14-81 28-19 48 5 17 20 4 49l-16 53" fill="#fffdf1" class="ink"/>

    <!-- Helmet -->
    <path d="M363 119q-4-35 31-35 35-1 43 34Z" fill="#e86d4d" class="ink"/>
    <path d="M381 94l-3 15m19-19 1 18m16-13 5 14" stroke="#fff6dc" stroke-width="5" stroke-linecap="round"/>
    <path d="M369 121l26 40 27-34" fill="none" stroke="#19383e" stroke-width="3"/>

    <!-- Eye and determined eyebrow -->
    <circle cx="413" cy="132" r="13" fill="white" class="ink"/>
    <circle cx="418" cy="134" r="5" fill="#19383e"/>
    <path d="M402 112l24 7" class="ink" fill="none"/>

    <!-- Giant fish-filled pouch -->
    <path d="M428 147l197 18q-38 77-134 62-55-10-63-80Z" fill="#f4b95a" class="ink"/>
    <g fill="#6bada9" stroke="#19383e" stroke-width="3" stroke-linejoin="round">
      <path d="M465 188q23-22 47 0-24 23-47 0l-14 13v-27Z"/>
      <path d="M525 198q22-21 44 0-22 21-44 0l-12 11v-24Z"/>
      <path d="M553 174q22-18 42 0-20 19-42 0l-13 11v-22Z"/>
    </g>
    <g fill="#fff">
      <circle cx="501" cy="185" r="5"/>
      <circle cx="559" cy="195" r="5"/>
      <circle cx="584" cy="172" r="5"/>
    </g>
    <g fill="#19383e">
      <circle cx="502" cy="185" r="2"/>
      <circle cx="560" cy="195" r="2"/>
      <circle cx="585" cy="172" r="2"/>
    </g>
    <path d="M426 142q91-7 210 22l-209 4Z" fill="#ffd16a" class="ink"/>
    <path d="M436 176q-3 19 9 29" fill="none" stroke="#d98a43" stroke-width="4"/>

    <!-- Wing stretched toward handlebars -->
    <path d="M352 204q43 12 66 34l68-9-7 16-66 10q-45-13-73-34" fill="#fffdf1" class="ink"/>
    <path d="M469 233l7 10m-18-9 6 11" fill="none" stroke="#19383e" stroke-width="3"/>

    <path d="M326 269l52 25 14 66" fill="none" stroke="#19383e" stroke-width="15" stroke-linecap="round"/>
    <path d="M326 269l52 25 14 66" fill="none" stroke="#ffc653" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Crank and webbed pedal feet -->
  <circle cx="392" cy="389" r="21" fill="#fff6dc" class="ink"/>
  <g transform="translate(392 389)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-26 0H26" stroke="#19383e" stroke-width="6"/>
      <g transform="translate(26 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-14-8l27 1 7 10h-35Z" fill="#ffc653" stroke="#19383e" stroke-width="3"/>
          <path d="M-16 7h36" stroke="#19383e" stroke-width="5"/>
        </g>
      </g>
      <g transform="translate(-26 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-14-8l27 1 7 10h-35Z" fill="#eeae40" stroke="#19383e" stroke-width="3"/>
          <path d="M-16 7h36" stroke="#19383e" stroke-width="5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Readable static speech -->
  <path d="M53 137q0-13 13-13h204q13 0 13 13v57q0 13-13 13h-34l18 26-49-26H66q-13 0-13-13Z" fill="#fffdf1" stroke="#19383e" stroke-width="3"/>
  <text x="168" y="156" text-anchor="middle" font-size="19" font-weight="bold" fill="#19383e">“It’s called</text>
  <text x="168" y="184" text-anchor="middle" font-size="22" font-weight="bold" fill="#b34d35">carp-loading.”</text>

  <!-- Dedicated footer, clear of the scene -->
  <rect y="510" width="800" height="90" fill="#fff6dc"/>
  <text x="400" y="545" text-anchor="middle" font-size="21" font-weight="bold" fill="#19383e">He rides to work. His lunch rides first class.</text>
  <path d="M110 559H690" stroke="#d7cbae" stroke-width="1"/>
  <text x="400" y="583" text-anchor="middle" font-size="16" fill="#435b60">2026-10-26 23:30:02 SGT (UTC+08:00)</text>
</svg>