<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican with an enormous fish-filled bill pedals a tiny bicycle past a no-fishing sign. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.7" fill="#d9cda9" opacity=".3"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke: #23303b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #23303b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff3d6"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M25 103H775" stroke="#23303b" stroke-width="3"/>
  <text x="400" y="57" text-anchor="middle" font-size="43" font-weight="900" fill="#23303b" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="85" text-anchor="middle" font-size="17" font-weight="bold" fill="#986044">ALL BEAK. NO BRAKES.</text>

  <!-- One seaside scene -->
  <path d="M0 355Q100 336 204 355T414 352T620 355T800 345V444H0Z" fill="#b9ddd9"/>
  <path d="M22 374h57m34 15h70m400-16h54m54 17h73" fill="none" stroke="#77b6b5" stroke-width="3"/>
  <path d="M0 423Q210 413 404 424T800 420V494H0Z" fill="#e6cb95"/>
  <path d="M0 464H800" stroke="#bda06f" stroke-width="3"/>
  <ellipse cx="387" cy="453" rx="218" ry="13" fill="#8d7658" opacity=".19"/>

  <!-- Unhelpful municipal policy -->
  <path d="M689 253V427" class="ink" fill="none"/>
  <rect x="629" y="204" width="121" height="79" rx="7" fill="#fffdf4" class="fine"/>
  <text x="689" y="228" text-anchor="middle" font-size="15" font-weight="bold" fill="#23303b">NO FISHING</text>
  <path d="M664 252q15-19 31 0q-16 19-31 0l-10-9v18Z" fill="#82bcbc" class="fine"/>
  <path d="M658 271l58-33" stroke="#d95643" stroke-width="6"/>
  <text x="689" y="307" text-anchor="middle" font-size="12" fill="#705845">TECHNICALLY LEGAL.</text>

  <!-- Speech bubble -->
  <path d="M58 137Q58 122 76 122H276Q295 122 295 141V177Q295 192 278 192H216L193 216L197 192H77Q58 192 58 176Z" fill="#fffdf6" class="fine"/>
  <text x="176" y="151" text-anchor="middle" font-size="19" font-weight="bold" fill="#23303b">“I was told this</text>
  <text x="176" y="176" text-anchor="middle" font-size="19" font-weight="bold" fill="#23303b">was a fish lane.”</text>

  <!-- Wheels: the entire spoke assemblies rotate -->
  <g>
    <circle cx="239" cy="395" r="59" fill="#fff9e7" class="ink" stroke-width="8"/>
    <circle cx="239" cy="395" r="50" fill="none" stroke="#a9b4b5" stroke-width="3"/>
    <g stroke="#647782" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 239 395" to="360 239 395" dur="1.4s" repeatCount="indefinite"/>
      <path d="M180 395h118M239 336v118M197 353l84 84M197 437l84-84"/>
      <path d="M224 338l30 114M182 380l114 30M210 344l58 102M188 424l102-58"/>
      <path d="M239 339v10" stroke="#e6733f" stroke-width="7"/>
    </g>
    <circle cx="239" cy="395" r="7" fill="#23303b"/>
  </g>
  <g>
    <circle cx="526" cy="395" r="59" fill="#fff9e7" class="ink" stroke-width="8"/>
    <circle cx="526" cy="395" r="50" fill="none" stroke="#a9b4b5" stroke-width="3"/>
    <g stroke="#647782" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 526 395" to="360 526 395" dur="1.4s" repeatCount="indefinite"/>
      <path d="M467 395h118M526 336v118M484 353l84 84M484 437l84-84"/>
      <path d="M511 338l30 114M469 380l114 30M497 344l58 102M475 424l102-58"/>
      <path d="M526 339v10" stroke="#e6733f" stroke-width="7"/>
    </g>
    <circle cx="526" cy="395" r="7" fill="#23303b"/>
  </g>

  <!-- A bicycle much too small for its passenger -->
  <g fill="none" stroke="#23303b" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M239 395l75-103 63 103H239l226-91-88 91M465 304l61 91M314 292h151"/>
  </g>
  <g fill="none" stroke="#e65b4f" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M239 395l75-103 63 103H239l226-91-88 91M314 292h151"/>
  </g>
  <path d="M465 304l-15-52h27q24 0 17 20" fill="none" class="ink"/>
  <path d="M314 292l-9-28" class="ink"/>
  <path d="M282 264h51" stroke="#23303b" stroke-width="12" stroke-linecap="round"/>
  <path d="M247 381h-33v-25h51" class="fine" fill="none"/>
  <rect x="203" y="341" width="70" height="23" rx="4" fill="#e7bd65" class="fine"/>
  <text x="238" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#23303b">BAIT-ERY</text>

  <!-- Pelican and animated pedaling silhouette -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M343 276l37 48-31 51" fill="none" stroke="#b17630" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" values="M343 276l37 48-31 51;M343 276l12 59 44 57;M343 276l37 48-31 51" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M313 210l-41-25 8 43-31 13 55 21" fill="#faf9e9" class="ink"/>
    <path d="M293 228Q286 183 327 181Q363 178 378 214Q392 246 354 273Q322 295 297 271Q283 254 293 228Z" fill="#fffdf0" class="ink"/>
    <path d="M302 222Q328 209 350 226Q345 251 310 257" fill="#d9e6dd" class="fine"/>
    <path d="M348 208Q381 188 369 156Q360 125 387 115Q421 104 433 133Q447 171 415 202L381 242" fill="#fffdf0" class="ink"/>
    <!-- Racing cap and highly focused face -->
    <path d="M367 130Q371 100 403 108Q425 111 433 132Z" fill="#e65b4f" class="ink"/>
    <path d="M375 113l8 15m12-18 7 18" stroke="#fff3d6" stroke-width="4"/>
    <path d="M428 131h23" class="ink"/>
    <circle cx="416" cy="148" r="10" fill="white" class="fine"/>
    <circle cx="420" cy="149" r="4" fill="#23303b"/>
    <path d="M406 132l21 5" class="fine" fill="none"/>

    <!-- The enormous pouch is the joke -->
    <path d="M430 159L613 174Q593 241 507 230Q453 224 430 175Z" fill="#efba64" class="ink"/>
    <path d="M434 158L619 171Q628 177 611 182L432 176Z" fill="#f69a3e" class="ink"/>
    <path d="M456 184Q492 218 547 211" fill="none" stroke="#d39042" stroke-width="3"/>
    <path d="M506 199q19-17 39 0l14-10v21l-14-11q-20 17-39 0Z" fill="#90bcbc" class="fine"/>
    <circle cx="516" cy="196" r="2.5" fill="#23303b"/>
    <path d="M566 192q10-5 15-3" fill="none" class="fine"/>

    <path d="M342 232Q393 248 450 254" fill="none" stroke="#23303b" stroke-width="16" stroke-linecap="round"/>
    <path d="M342 232Q393 248 450 254" fill="none" stroke="#edf1e5" stroke-width="10" stroke-linecap="round"/>
    <path d="M321 273l15 58 64 35" fill="none" stroke="#df9b36" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M321 273l15 58 64 35;M321 273l49 40-19 53;M321 273l15 58 64 35" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M390 363l20 5-8 11-23-6Z" fill="#f2ac3f" class="fine">
      <animate attributeName="d" values="M390 363l20 5-8 11-23-6Z;M341 363l20 5-8 11-23-6Z;M390 363l20 5-8 11-23-6Z" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <!-- Fluttering neck scarf -->
    <path d="M380 197l27 9-12 14-20-13-27 6 8-15-20-9Z" fill="#e65b4f" class="fine"/>
  </g>

  <circle cx="377" cy="395" r="15" fill="#d5dddc" class="fine"/>
  <g class="fine" fill="none">
    <animateTransform attributeName="transform" type="rotate" from="0 377 395" to="360 377 395" dur="1.4s" repeatCount="indefinite"/>
    <path d="M354 395h46"/>
    <path d="M349 390v10m56-10v10" stroke-width="7"/>
  </g>
  <path d="M141 402h-33m43 17h-27m20-38h-18" fill="none" stroke="#986044" stroke-width="3" stroke-linecap="round"/>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="494" width="800" height="106" fill="#23303b"/>
  <text x="400" y="527" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff3d6">He traded his wings for wheels. The baggage stayed.</text>
  <path d="M80 546H720" stroke="#71808a" stroke-width="1"/>
  <text x="400" y="576" text-anchor="middle" font-size="18" fill="#ffffff">2026-10-26 23:01:46 SGT (UTC+08:00)</text>
</svg>