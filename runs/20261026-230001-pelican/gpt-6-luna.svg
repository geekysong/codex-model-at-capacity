    <text x="54" y="29" text-anchor="middle" font-size="12" font-weight="900" fill="#173c43">NEW PARKING</text>
    <text x="54" y="49" text-anchor="middle" font-size="15" font-weight="900" fill="#e06442">BEAK VALET</text>
    <text x="54" y="69" text-anchor="middle" font-size="11" font-weight="700" fill="#173c43">CARRY-ON: 1 PELICAN</text>
  </g>

