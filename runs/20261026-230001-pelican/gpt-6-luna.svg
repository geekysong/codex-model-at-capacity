<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">WHEEL DEAL</title>
  <desc id="description">A smug pelican rides a bicycle, its enormous beak full of paperwork, while a tiny sign advertises its beak as carry-on luggage.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.8s linear infinite; }
      .rider { transform-box: view-box; transform-origin: 400px 330px; animation: bob .7s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-.6deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff2cf"/>
  <path d="M0 409 Q105 392 205 409 T410 407 T615 408 T800 399 V600 H0Z" fill="#d8edcf"/>
  <path d="M0 430 Q180 415 360 431 T800 422" fill="none" stroke="#91bd83" stroke-width="4"/>
  <circle cx="692" cy="104" r="43" fill="#ffd15c"/>
  <path d="M54 393 l22-79 22 79 M61 368h30 M55 383h37" fill="none" stroke="#6d9e75" stroke-width="5" stroke-linecap="round"/>
  <path d="M116 394 l18-63 18 63 M121 372h27" fill="none" stroke="#6d9e75" stroke-width="5" stroke-linecap="round"/>

  <rect x="47" y="42" width="365" height="83" rx="18" fill="#173c43"/>
  <text id="title" x="68" y="99" font-size="43" font-weight="900" letter-spacing="1.5" fill="#fff2cf">WHEEL DEAL!</text>
  <text x="51" y="155" font-size="19" font-weight="700" fill="#173c43">Big beak. Bigger commute.</text>

