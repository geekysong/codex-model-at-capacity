    <path class="leg2" d="M386 394 L418 421 L370 397" fill="none" stroke="#ef9c43" stroke-width="13" stroke-linecap="round"/>
    <path d="M365 298 Q350 234 383 196 Q435 154 484 204 Q517 240 488 312 Q455 343 365 298Z" fill="#f8f6e9" stroke-width="7"/>
    <path d="M383 215 Q408 181 447 198 Q469 210 477 234 Q432 220 383 238Z" fill="#f0b857" stroke-width="5"/>
