    <path d="M382 266 Q433 276 489 255 Q478 303 425 312 Q392 306 382 266Z" fill="#f7c66b" stroke-width="4"/>
    <ellipse cx="429" cy="217" rx="13" ry="15" fill="white" stroke-width="5"/>
    <circle cx="432" cy="219" r="6" fill="#293d48" stroke="none"/>
    <path d="M394 201 Q414 183 438 195" fill="none" stroke="#293d48" stroke-width="7"/>
    <path d="M396 313 Q424 330 459 309 L476 356 Q433 383 389 353Z" fill="#d9e1dd" stroke-width="5"/>
    <path d="M393 317 Q361 326 342 348 Q360 362 381 350" fill="#d9e1dd" stroke-width="5"/>
    <path d="M450 357 Q476 345 489 324" fill="none" stroke="#293d48" stroke-width="7" stroke-linecap="round"/>
    <path d="M482 326 L492 307 L497 332" fill="#ef9c43" stroke-width="4"/>
  </g>

  <g transform="rotate(-7 178 294)">
    <path d="M145 261 L210 261 L201 322 L153 322Z" fill="#fff8df" stroke="#315047" stroke-width="5"/>
    <text x="155" y="283" font-family="sans-serif" font-size="15" font-weight="bold" fill="#315047">HONK IF</text>
    <text x="150" y="304" font-family="sans-serif" font-size="15" font-weight="bold" fill="#315047">YOU RECYCLE</text>
    <path d="M176 322 L166 357 M183 322 L194 357" stroke="#315047" stroke-width="5"/>
  </g>

  <rect x="0" y="530" width="800" height="70" fill="#263b46"/>
  <text x="400" y="57" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#263b46">PELICAN PEDAL PANIC</text>
  <text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#315047">“I carry my lunch in the front basket. It carries emotional baggage.”</text>
  <text x="400" y="560" text-anchor="middle" font-family="monospace" font-size="16" fill="#fff8df">2026-10-26 23:03:33 SGT (UTC+08:00)</text>
  <text x="400" y="583" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#aee8f5">A pelican proves that sustainable transport can still be gloriously ridiculous.</text>
</svg>