<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A smug pelican pedals a tiny bicycle along the waterfront, carrying a fish in its enormous bill pouch. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="water" width="65" height="22" patternUnits="userSpaceOnUse">
      <path d="M8 12q12 6 25 0" fill="none" stroke="#96d8dc" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke:#233744; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .spoke { stroke:#758b91; stroke-width:3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <path d="M0 143Q200 113 400 148T800 139V431H0Z" fill="#d7f1ec"/>
  <circle cx="698" cy="176" r="39" fill="#ffc75b"/>
  <path d="M0 314Q180 295 362 317T800 306V433H0Z" fill="#b6e4e4"/>
  <path d="M0 326H800V432H0Z" fill="url(#water)"/>

  <text x="400" y="66" text-anchor="middle" font-size="48" font-weight="900" fill="#233744" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="104" text-anchor="middle" font-size="19" fill="#49616a">ZERO EMISSIONS. EXTREME BEAK RESISTANCE.</text>

  <!-- A single waterfront road -->
  <path d="M0 425Q400 413 800 425V511H0Z" fill="#dbcfb4"/>
  <path d="M0 438H800" stroke="#b9ab8c" stroke-width="4"/>
  <path d="M25 478H117M639 478H757" stroke="#fff6db" stroke-width="6" stroke-dasharray="24 17"/>
  <ellipse cx="373" cy="458" rx="211" ry="15" fill="#a49577" opacity=".25"/>

  <!-- Roadside satire -->
  <path d="M686 411V315" class="ink" fill="none"/>
  <rect x="622" y="265" width="128" height="64" rx="8" fill="#fffaf0" class="ink"/>
  <text x="686" y="291" text-anchor="middle" font-size="16" font-weight="bold" fill="#233744">NO FLYING</text>
  <text x="686" y="314" text-anchor="middle" font-size="16" font-weight="bold" fill="#233744">LOOPHOLE: ✓</text>

  <!-- Wheels, with continuously revolving spokes -->
  <g transform="translate(238 390)">
    <circle r="65" fill="#fff8e7" stroke="#233744" stroke-width="11"/>
    <circle r="56" fill="none" stroke="#d69b57" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-56 0H56M0-56V56M-40-40L40 40M-40 40L40-40"/>
      <path d="M20-52L-20 52M-52-20L52 20"/>
      <path d="M-8-54H8" stroke="#ed6c4d" stroke-width="7"/>
    </g>
    <circle r="8" fill="#233744"/>
  </g>
  <g transform="translate(512 390)">
    <circle r="65" fill="#fff8e7" stroke="#233744" stroke-width="11"/>
    <circle r="56" fill="none" stroke="#d69b57" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-56 0H56M0-56V56M-40-40L40 40M-40 40L40-40"/>
      <path d="M20-52L-20 52M-52-20L52 20"/>
      <path d="M-8-54H8" stroke="#ed6c4d" stroke-width="7"/>
    </g>
    <circle r="8" fill="#233744"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#df5547" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 390L306 298L358 390ZM306 298H465L358 390M465 298L512 390"/>
    <path d="M306 298L296 273M465 298L452 265"/>
  </g>
  <path d="M275 274H319" class="ink" fill="none" stroke-width="10"/>
  <path d="M452 265L444 248H474" class="ink" fill="none"/>
  <path d="M474 248q15 0 12 15" class="ink" fill="none"/>
  <circle cx="358" cy="390" r="17" fill="#f5c65d" class="ink"/>

  <!-- Far leg -->
  <path d="M322 278Q372 302 346 365" fill="none" stroke="#d79b39" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M322 278Q372 302 346 365;M322 278Q322 324 370 409;M322 278Q372 302 346 365" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- The pelican gently bobs; the title and caption stay still -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" dur="1.6s" repeatCount="indefinite"/>
    <!-- Tail and body -->
    <path d="M276 242L233 221L246 251L228 252L277 272" fill="#fafcf4" class="ink"/>
    <path d="M266 232Q279 198 330 205Q362 208 374 241Q374 278 329 285Q282 285 266 259Z" fill="#fffdf3" class="ink"/>
    <path d="M281 235Q301 222 341 240Q330 272 299 260Z" fill="#dce4df" class="ink"/>
    <path d="M293 240L322 251M292 250L310 258" fill="none" stroke="#94a9a6" stroke-width="3" stroke-linecap="round"/>
    <!-- Neck -->
    <path d="M338 221Q365 210 359 180Q352 149 379 145Q407 145 402 172Q393 202 394 223L367 252" fill="#fffdf3" class="ink"/>
    <!-- Head -->
    <path d="M363 166Q355 135 381 127Q413 119 429 147L422 176L391 183Z" fill="#fffdf3" class="ink"/>
    <path d="M369 133L360 119M378 129L377 114M387 128L392 115" fill="none" stroke="#233744" stroke-width="4" stroke-linecap="round"/>
    <!-- Enormous bill pouch -->
    <path d="M412 162L577 170Q554 226 492 224Q440 222 412 176Z" fill="#ffc567" class="ink"/>
    <path d="M422 172Q471 185 553 177" fill="none" stroke="#dd9447" stroke-width="3"/>
    <!-- A distinctly unimpressed fish in the pouch -->
    <path d="M481 199L466 187L468 208Z" fill="#64b9b5" class="ink" stroke-width="3"/>
    <path d="M477 198Q497 179 520 199Q499 218 477 198Z" fill="#87cec1" stroke="#233744" stroke-width="3"/>
    <circle cx="510" cy="197" r="2.5" fill="#233744"/>
    <path d="M516 203L506 203" stroke="#233744" stroke-width="2"/>
    <path d="M408 153L582 163L577 172L411 166Z" fill="#f6ad42" class="ink"/>
    <!-- Smug eye and cycling glasses -->
    <path d="M378 146H401L397 158H382Z" fill="#233744"/>
    <path d="M379 149L369 145M401 147L412 151" fill="none" stroke="#233744" stroke-width="4"/>
    <path d="M385 148L389 153" stroke="#b9ece5" stroke-width="2"/>
    <!-- A determined wing holds the handlebar -->
    <path d="M350 228Q400 266 468 246" fill="none" stroke="#233744" stroke-width="14" stroke-linecap="round"/>
    <path d="M350 228Q400 266 468 246" fill="none" stroke="#fffdf3" stroke-width="8" stroke-linecap="round"/>
    <!-- Tiny racing scarf -->
    <path d="M365 202L389 207L385 219L362 213Z" fill="#ed6c4d" stroke="#233744" stroke-width="3"/>
    <path d="M365 208Q334 185 314 202L332 208L314 220Q344 224 365 208Z" fill="#ed6c4d" stroke="#233744" stroke-width="3"/>
  </g>

  <!-- Moving crank and front foot -->
  <g transform="translate(358 390)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#233744" stroke-width="6"/>
      <path d="M-24-7V7M24-7V7" stroke="#233744" stroke-width="8"/>
    </g>
  </g>
  <path d="M333 279Q399 312 382 390" fill="none" stroke="#efa93f" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M333 279Q399 312 382 390;M333 279Q362 317 358 414;M333 279Q320 330 334 390;M333 279Q363 310 358 366;M333 279Q399 312 382 390" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M372 390L393 390L386 382" fill="#efa93f" stroke="#233744" stroke-width="3" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;-24 24;-48 0;-24 -24;0 0" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- Fixed caption and generously separated timestamp footer -->
  <rect y="511" width="800" height="89" fill="#fff7df"/>
  <text x="400" y="541" text-anchor="middle" font-size="22" font-weight="bold" fill="#233744">“I bought the bike. Lunch still rides for free.”</text>
  <path d="M70 558H730" stroke="#dbcfb4" stroke-width="2"/>
  <text x="400" y="582" text-anchor="middle" font-size="17" fill="#49616a">2026-10-26 21:32:08 SGT (UTC+08:00)</text>
</svg>