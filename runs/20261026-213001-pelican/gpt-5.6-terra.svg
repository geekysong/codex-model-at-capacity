<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past the Traffic</title>
  <desc id="desc">A satirical cartoon of an expressive pelican riding a bicycle.</desc>
  <style>
    .wheel { transform-origin: center; animation: spin 1.1s linear infinite; }
    .bob { animation: bob .7s ease-in-out infinite alternate; }
    .legA { transform-origin: 405px 370px; animation: pedalA 1.1s linear infinite; }
    .legB { transform-origin: 405px 370px; animation: pedalB 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(28deg); } }
    @keyframes pedalB { 50% { transform: rotate(-28deg); } }
  </style>

  <rect width="800" height="600" fill="#9ee4f4"/>
  <path d="M0 170 Q120 120 245 176 T470 162 T800 175 V345 H0Z" fill="#c7eea5"/>
  <path d="M0 342 Q140 312 260 341 T520 332 T800 344 V470 H0Z" fill="#5cbd65"/>
  <rect y="398" width="800" height="78" fill="#575b63"/>
  <path d="M0 426 H800" stroke="#fff4a8" stroke-width="8" stroke-dasharray="38 22"/>

  <g opacity=".9">
    <rect x="632" y="213" width="103" height="139" rx="8" fill="#f6d35d" stroke="#543e43" stroke-width="5"/>
    <text x="684" y="250" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#543e43">CAR LANE</text>
    <path d="M650 280 h68" stroke="#543e43" stroke-width="6"/>
    <text x="684" y="316" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#543e43">NO BIRDS</text>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#193447" stroke="#fff" stroke-width="5" paint-order="stroke">PELICAN: PEDAL TO THE BEAK!</text>
  <text x="400" y="94" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#244757">“No parking? Fine. I’ll take the bike lane.”</text>

  <g>
    <g class="wheel">
      <circle cx="300" cy="406" r="62" fill="#d8e9ed" stroke="#25323b" stroke-width="8"/>
      <circle cx="300" cy="406" r="8" fill="#f4ba45" stroke="#25323b" stroke-width="4"/>
      <path d="M300 344V468M238 406H362M256 362L344 450M344 362L256 450" stroke="#7a8c91" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="503" cy="406" r="62" fill="#d8e9ed" stroke="#25323b" stroke-width="8"/>
