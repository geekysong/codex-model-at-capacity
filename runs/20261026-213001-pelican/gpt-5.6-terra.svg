  <g transform="translate(82 286)">
    <path d="M0 35 Q-5 2 38 0 Q80 4 80 35 Q78 64 39 66 Q4 64 0 35Z" fill="#fff" stroke="#25323b" stroke-width="5"/>
    <path d="M65 47 l25 18 -29 1" fill="#fff" stroke="#25323b" stroke-width="5" stroke-linejoin="round"/>
    <text x="40" y="29" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#25323b">HONK?</text>
    <text x="40" y="49" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#25323b">I SQUAWK.</text>
  </g>

  <rect y="500" width="800" height="100" fill="#193447"/>
  <path d="M0 500 H800" stroke="#f4ba45" stroke-width="6"/>
  <text x="32" y="537" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fff">A pelican on a bicycle:</text>
  <text x="32" y="567" font-family="sans-serif" font-size="18" fill="#d9f3fa">proof that traffic rules need more imagination.</text>
  <text x="768" y="574" text-anchor="end" font-family="sans-serif" font-size="15" fill="#fff">2026-10-26 21:33:52 SGT (UTC+08:00)</text>
