<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican cycles along the waterfront with fish in its enormous bill. Both bicycle wheels spin as the pelican bobs and pedals. Caption: Why pay for delivery when you are the cargo bike?</desc>
  <defs>
    <pattern id="water" width="100" height="30" patternUnits="userSpaceOnUse">
      <path d="M10 15h32m20 7h20" fill="none" stroke="#7bbfc6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="82" fill="#f9f4df" stroke="#253946" stroke-width="12"/>
      <circle r="71" fill="none" stroke="#93a5a6" stroke-width="3"/>
      <g stroke="#879b9c" stroke-width="2.5">
        <path d="M-70 0H70M0-70V70M-50-50L50 50M-50 50L50-50M-65-27L65 27M-27-65L27 65M-65 27L65-27M-27 65L27-65"/>
      </g>
      <path d="M-18-72A74 74 0 0 1 18-72" fill="none" stroke="#f2a43b" stroke-width="6"/>
      <circle r="9" fill="#253946"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <path d="M0 110H800V430H0Z" fill="#d7edeb"/>
  <circle cx="687" cy="168" r="36" fill="#ffce67"/>
  <g fill="#fffaf0">
    <path d="M57 174q2-22 24-19 11-28 33-10 25-8 31 16 18 0 20 13Z"/>
    <path d="M597 230q0-18 20-18 10-24 29-10 22-6 27 15 20-1 23 13Z"/>
  </g>
  <path d="M0 321Q190 308 400 325T800 319V430H0Z" fill="#a9d8d7"/>
  <rect y="333" width="800" height="97" fill="url(#water)"/>
  <path d="M0 430H800V501H0Z" fill="#e1cbb0"/>
  <path d="M0 474H800" stroke="#fff4dc" stroke-width="5" stroke-dasharray="35 24"/>
  <ellipse cx="389" cy="470" rx="253" ry="14" fill="#253946" opacity=".12"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#253946">
    <text x="400" y="57" font-size="43" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="88" font-size="17" letter-spacing="2">ZERO EMISSIONS. EXTREME FISH BREATH.</text>
  </g>

  <!-- Rotating wheels remain centered on their axles. -->
  <g transform="translate(231 386)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(565 386)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M231 386L318 292 378 386H231L318 292H506L378 386M506 292L565 386" stroke="#253946" stroke-width="13"/>
    <path d="M231 386L318 292 378 386H231L318 292H506L378 386M506 292L565 386" stroke="#e66a4e" stroke-width="7"/>
    <path d="M318 292L307 268M506 292L493 250 521 233" stroke="#253946" stroke-width="9"/>
    <path d="M518 233h28q14 0 14 12" stroke="#253946" stroke-width="9"/>
    <path d="M284 267h48" stroke="#253946" stroke-width="13"/>
    <path d="M231 386L378 397 391 378 235 378Z" stroke="#56676a" stroke-width="3"/>
  </g>
  <circle cx="378" cy="386" r="20" fill="#f9e6c3" stroke="#253946" stroke-width="5"/>

  <!-- Pelican and its absurdly roomy cargo pouch. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M321 259L343 314 378 354" fill="none" stroke="#253946" stroke-width="15" stroke-linecap="round"/>
    <path d="M321 259L343 314 378 354" fill="none" stroke="#efa840" stroke-width="9" stroke-linecap="round"/>

    <path d="M292 259Q252 248 246 217L223 205 248 201 231 182 268 190Q290 161 336 175L366 202Q376 222 357 254 330 278 292 259Z" fill="#fffdf1" stroke="#253946" stroke-width="5" stroke-linejoin="round"/>
    <path d="M337 229Q375 228 367 191L356 168Q347 143 369 127 387 116 404 135 415 149 401 176L399 197Q408 239 373 259L340 262" fill="#fffdf1" stroke="#253946" stroke-width="5"/>
    <path d="M295 201Q335 186 352 216L400 242 454 240" fill="#e1e6dc" stroke="#253946" stroke-width="5" stroke-linecap="round"/>
    <path d="M453 239L489 245 521 235" fill="none" stroke="#253946" stroke-width="6" stroke-linecap="round"/>
    <path d="M271 230q24 14 46 0m-39 12q18 8 32 0" fill="none" stroke="#a4b4af" stroke-width="3" stroke-linecap="round"/>

    <path d="M398 153L602 169Q572 231 492 221 426 217 398 171Z" fill="#ffc15d" stroke="#253946" stroke-width="5" stroke-linejoin="round"/>
    <path d="M403 173Q464 189 575 176" fill="none" stroke="#db863f" stroke-width="3"/>
    <g transform="translate(481 193) rotate(8)">
      <path d="M-25 0Q-7-19 18 0L33-12V12L18 0Q-7 19-25 0Z" fill="#76bfc0" stroke="#253946" stroke-width="3"/>
      <circle cx="-14" cy="-2" r="3" fill="#253946"/>
    </g>
    <g transform="translate(546 193) rotate(-17)">
      <path d="M-19 0Q-3-14 14 0L26-9V9L14 0Q-3 14-19 0Z" fill="#e8eee0" stroke="#253946" stroke-width="3"/>
      <circle cx="-10" cy="-2" r="2.5" fill="#253946"/>
    </g>
    <path d="M396 151L614 163 599 174 399 166" fill="#f3a541" stroke="#253946" stroke-width="5" stroke-linejoin="round"/>

    <ellipse cx="387" cy="145" rx="11" ry="14" fill="white" stroke="#253946" stroke-width="3"/>
    <circle cx="391" cy="147" r="4" fill="#253946"/>
    <path d="M374 128L396 133" stroke="#253946" stroke-width="5" stroke-linecap="round"/>
    <path d="M350 132Q346 105 371 104 396 103 404 127Z" fill="#e66a4e" stroke="#253946" stroke-width="4"/>
    <path d="M365 109l-1 14m15-14 3 15" stroke="#fff1d5" stroke-width="4" stroke-linecap="round"/>
    <path d="M354 164l-23 8 21 10 13-13" fill="#e66a4e" stroke="#253946" stroke-width="3"/>
    <path d="M338 173L304 159 309 178 333 180" fill="#e66a4e" stroke="#253946" stroke-width="3"/>

    <path d="M327 255L348 307 378 354" fill="none" stroke="#253946" stroke-width="15" stroke-linecap="round">
      <animate attributeName="d" values="M327 255L348 307 378 354;M327 255L323 329 378 418;M327 255L348 307 378 354" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M327 255L348 307 378 354" fill="none" stroke="#ffc15d" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" values="M327 255L348 307 378 354;M327 255L323 329 378 418;M327 255L348 307 378 354" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(378 386)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M0-32V32" stroke="#253946" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(0 -32)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <path d="M-15 0h30" stroke="#253946" stroke-width="7" stroke-linecap="round"/>
          <path d="M-12-3L-6-12 15-4 21 0H-12Z" fill="#ffc15d" stroke="#253946" stroke-width="3"/>
        </g>
      </g>
      <g transform="translate(0 32)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <path d="M-14 0h28" stroke="#253946" stroke-width="7" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <g stroke="#253946" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M156 296h38m-55 16h43m-20 17h24"/>
    <path d="M423 126q8-12 5-17m9 22q12-7 12-16"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#253946" text-anchor="middle">
    <rect x="613" y="269" width="154" height="65" rx="12" fill="#fffaf0" stroke="#253946" stroke-width="3"/>
    <path d="M621 324l-23 19 39-10" fill="#fffaf0" stroke="#253946" stroke-width="3" stroke-linejoin="round"/>
    <text x="690" y="294" font-size="17" font-weight="bold">“It's all</text>
    <text x="690" y="317" font-size="17" font-weight="bold">carry-on.”</text>
  </g>

  <rect y="501" width="800" height="99" fill="#fff6df"/>
  <text x="400" y="536" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#253946">Why pay for delivery when you ARE the cargo bike?</text>
  <path d="M95 553H705" stroke="#d8c8ac" stroke-width="1.5"/>
  <text x="400" y="580" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#41545c">2026-11-03 12:00:01 SGT (UTC+08:00)</text>
