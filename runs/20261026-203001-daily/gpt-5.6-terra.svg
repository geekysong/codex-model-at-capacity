    <text x="70" y="150">5</text><text x="130" y="150" font-weight="bold">6</text><text x="190" y="150">7</text><text x="250" y="150">8</text>
    <text x="70" y="210">9</text><text x="130" y="210">10</text><text x="190" y="210">11</text><text x="250" y="210">12</text>
