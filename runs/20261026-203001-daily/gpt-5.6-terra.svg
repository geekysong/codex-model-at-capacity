    <rect x="100" y="60" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="60" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="60" width="60" height="60" fill="#bfdbfe"/>
    <rect x="40" y="120" width="60" height="60" fill="#ffffff"/>
