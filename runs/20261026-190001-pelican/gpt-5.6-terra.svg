    <text x="629" y="143" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#37414c">BIKE LANE</text>
    <text x="629" y="164" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#37414c">for everyone*</text>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="41" font-weight="900" fill="#21344b">PELICAN PEDAL PANIC!</text>
  <text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#406078">“They said: use your bill to pay the bill.”</text>

