<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle through town.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .bob { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
    .legA { transform-box: fill-box; transform-origin: 50% 0%; animation: pedalA 1.1s linear infinite; }
    .legB { transform-box: fill-box; transform-origin: 50% 0%; animation: pedalB 1.1s linear infinite; }
    .blink { animation: blink 3.5s step-end infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 0%,100% { transform: rotate(27deg); } 50% { transform: rotate(-28deg); } }
    @keyframes pedalB { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(27deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 94%,96% { transform: scaleY(.08); } }
  </style>

