<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican rides a bicycle with spinning wheels and bobbing pedals, carrying fish in its enormous bill beneath a sign declaring a no-fly zone.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bceaf0"/>
      <stop offset="1" stop-color="#fff4cf"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd872"/>
      <stop offset="1" stop-color="#f5a447"/>
    </linearGradient>
    <pattern id="road" width="120" height="10" patternUnits="userSpaceOnUse">
      <path d="M15 5h55" stroke="#fff1c7" stroke-width="5"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#f4fcf5" fill-opacity=".45" stroke="#273d49" stroke-width="11"/>
      <circle r="65" fill="none" stroke="#fff9df" stroke-width="3"/>
      <g stroke="#617e86" stroke-width="2.5">
        <path d="M-66 0H66M0-66V66M-47-47l94 94M-47 47l94-94"/>
      </g>
      <circle r="9" fill="#ffd665" stroke="#273d49" stroke-width="4"/>
      <path d="M-8-68H8" stroke="#ed654b" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="14" y="14" width="772" height="572" rx="22" fill="none" stroke="#263d48" stroke-width="4"/>
  <path d="M17 110H783V493H17Z" fill="url(#sky)"/>

  <text x="400" y="67" text-anchor="middle" font-family="sans-serif" font-size="45" font-weight="900" letter-spacing="3" fill="#263d48">TOUR DE BEAK</text>
  <text x="400" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#a44d35">ZERO EMISSIONS. QUESTIONABLE AERODYNAMICS.</text>

  <g fill="#fffdf0" opacity=".9">
    <path d="M45 165q8-27 33-16 17-34 44-7 30-6 36 23Z"/>
    <path d="M587 152q13-24 34-12 18-30 39-4 27-5 34 16Z"/>
  </g>
  <circle cx="716" cy="200" r="32" fill="#ffdc78"/>
  <path d="M17 456q93-47 187-11t174-4 174 4 231-10v58H17Z" fill="#a9c9a3"/>
  <path d="M17 484H783v9H17Z" fill="#657e7c"/>

  <!-- A small municipal sign supplies the joke's setting. -->
  <g stroke="#273d49" stroke-width="4" stroke-linejoin="round">
    <path d="M114 273V473" fill="none"/>
    <rect x="43" y="215" width="142" height="71" rx="8" fill="#fffaf0"/>
  </g>
  <text x="114" y="243" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="900" fill="#b24937">NO-FLY ZONE</text>
  <text x="114" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#273d49">Bikes encouraged.</text>

  <ellipse cx="401" cy="485" rx="226" ry="10" fill="#314d52" opacity=".18"/>
  <g fill="none" stroke="#fffdf1" stroke-width="4" stroke-linecap="round" opacity=".85">
    <path d="M185 340h-45M174 357h-65M184 375h-39"/>
  </g>

  <!-- Spokes and tire markers rotate around each wheel hub. -->
  <g transform="translate(280 413)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(532 413)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 413l70-112 56 112H280l176-107-50 107M350 301l106 5M456 306l76 107" stroke="#273d49" stroke-width="13"/>
    <path d="M280 413l70-112 56 112H280l176-107-50 107M350 301l106 5M456 306l76 107" stroke="#e7644e" stroke-width="7"/>
    <path d="M350 301l-11-29M456 306l-13-51 29-9" stroke="#273d49" stroke-width="9"/>
    <path d="M321 274h43" stroke="#273d49" stroke-width="14"/>
    <path d="M471 246l15 2" stroke="#b85b3e" stroke-width="11"/>
    <path d="M288 413h111" stroke="#273d49" stroke-width="3"/>
  </g>

  <!-- Pelican and legs bob gently while the typography stays still. -->
  <g stroke="#273d49" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".85s" repeatCount="indefinite"/>

    <path d="M346 278l-60-29 20 43-31 3 60 34" fill="#fbf9e9" stroke-width="4"/>
    <path d="M329 266q27-49 83-33 41 8 46 40 2 37-40 59-44 22-81-7-21-17-8-59Z" fill="#fffdf1" stroke-width="4"/>
    <path d="M352 269q40-22 67 3-10 32-51 34l16-15-21 1 10-13Z" fill="#d4ded8" stroke-width="3"/>

    <path d="M414 265q37-21 35-62-2-38 31-44 34-5 39 24 4 17-14 30-19 15-12 46 2 30-34 42" fill="#fffdf1" stroke-width="5"/>
    <path d="M471 159q-8-19 3-28M481 158q1-21 13-25M490 159q12-15 23-12" fill="none" stroke-width="4"/>

    <!-- Huge bill with one unimpressed passenger. -->
    <path d="M508 192l157 33q-35 60-110 42-38-9-47-55Z" fill="url(#pouch)" stroke-width="4"/>
    <path d="M506 190l167 36-5 12-160-26Z" fill="#f5bd58" stroke-width="4"/>
    <path d="M551 246q19-18 38-1l14-9-2 21-13-7q-21 13-37-4Z" fill="#72b5bb" stroke-width="2.5"/>
    <circle cx="562" cy="244" r="2.5" fill="#273d49" stroke="none"/>
    <path d="M574 251l8 1" fill="none" stroke-width="2"/>
    <circle cx="495" cy="184" r="10" fill="#fff" stroke-width="2.5"/>
    <circle cx="499" cy="186" r="4" fill="#273d49" stroke="none"/>
    <path d="M483 169l20 5" fill="none" stroke-width="4"/>

    <!-- Wing gripping the handlebars. -->
    <path d="M403 277q28 19 56-25l17-4" fill="none" stroke-width="15"/>
    <path d="M403 274q28 19 56-25l17-4" fill="none" stroke="#f6f5e8" stroke-width="9"/>

    <g fill="none" stroke="#dc973d" stroke-width="10">
      <path d="M390 325l-19 40 56 35">
        <animate attributeName="d" values="M390 325l-19 40 56 35;M390 325l32 30-37 69;M390 325l-19 40 56 35" dur="1.7s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M415 397l22 5-5 8-22-1Z" fill="#f6b34d" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-40 21;0 0" dur="1.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="406" cy="413" r="16" fill="#fff1c7" stroke="#273d49" stroke-width="4"/>
  <g transform="translate(406 413)">
    <g stroke="#273d49" stroke-width="5" stroke-linecap="round">
      <path d="M-22 0H22"/>
      <path d="M-29-4h14M15 4h14" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
    </g>
  </g>
  <circle cx="406" cy="413" r="4" fill="#273d49"/>

  <!-- Caption and timestamp occupy their own stationary footer. -->
  <rect x="22" y="499" width="756" height="77" rx="8" fill="#fff9e9"/>
  <text x="400" y="525" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#273d49">“I switched to cycling. Still working on the bill.”</text>
  <path d="M102 539H698" stroke="#d3c6aa" stroke-width="1.5"/>
  <text x="400" y="563" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#445964">2026-10-26 19:01:49 SGT (UTC+08:00)</text>
</svg>