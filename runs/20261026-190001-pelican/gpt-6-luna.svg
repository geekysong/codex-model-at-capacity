    <path d="M380 341 L410 341" stroke="#173b52" stroke-width="9" stroke-linecap="round"/>
    <circle cx="345" cy="430" r="13" fill="#ffd766" stroke="#173b52" stroke-width="4"/>
    <path d="M345 430 L322 453 M345 430 L368 407" stroke="#173b52" stroke-width="6" stroke-linecap="round"/>
