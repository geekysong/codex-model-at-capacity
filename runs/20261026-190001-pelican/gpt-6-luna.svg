<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE TOUR DE BEAK</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle past a sign that says “Fish market: uphill.”</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
      .rider { animation: bob .48s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#bcecf0"/>
  <circle cx="686" cy="118" r="48" fill="#ffd766"/>
  <path d="M0 348 Q120 288 240 345 T480 333 T800 335 V600 H0Z" fill="#86c77c"/>
  <path d="M0 404 Q180 378 360 405 T800 390 V600 H0Z" fill="#55a96c"/>
  <path d="M0 470 Q200 454 400 475 T800 458" fill="none" stroke="#f8e6a2" stroke-width="6" stroke-dasharray="20 19"/>

  <text x="400" y="57" text-anchor="middle" font-size="38" font-weight="900" letter-spacing="2" fill="#173b52">THE TOUR DE BEAK</text>
  <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#315b68">One bird. Two wheels. Absolutely no fish in the pannier.</text>

  <g transform="translate(84 228) rotate(-8)">
    <rect x="0" y="0" width="150" height="91" rx="8" fill="#fff6d9" stroke="#274b50" stroke-width="4"/>
    <path d="M18 91 L8 126 M132 91 L145 126" stroke="#674e37" stroke-width="8"/>
    <text x="75" y="35" text-anchor="middle" font-size="16" font-weight="900" fill="#b84a37">FISH MARKET</text>
    <text x="75" y="61" text-anchor="middle" font-size="15" font-weight="700" fill="#274b50">UPHILL 3 km</text>
    <text x="75" y="80" text-anchor="middle" font-size="13" fill="#274b50">Sorry, legs only.</text>
  </g>

