      <circle cx="248" cy="430" r="8" fill="#e65b42"/>
      <path d="M248 368V492 M186 430H310 M204 386L292 474 M292 386L204 474" stroke="#6e9ea0" stroke-width="3"/>
    </g>
    <g class="wheel">
