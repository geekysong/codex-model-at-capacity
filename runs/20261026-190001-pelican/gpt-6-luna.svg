    <text x="20" y="-22" text-anchor="middle" font-size="13" font-weight="700" fill="#315b68">Nice pace!</text>
  </g>

  <path d="M167 430 Q190 421 207 430 M605 430 Q624 419 644 428" fill="none" stroke="#fff6d9" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="523" text-anchor="middle" font-size="17" font-weight="800" fill="#173b52">“I’m not slow. I’m carrying my own lunch.”</text>
