<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with an enormous beak full of fish. The wheels spin, the pedals turn, and the pelican bobs as it rides.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r=".8" fill="#cdbf9d" opacity=".22"/>
      <circle cx="13" cy="15" r=".6" fill="#cdbf9d" opacity=".18"/>
    </pattern>
    <style>
      .ink{stroke:#24343a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#24343a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:Arial,Helvetica,sans-serif;fill:#24343a}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M32 104H768" stroke="#24343a" stroke-width="3"/>
  <text x="400" y="65" text-anchor="middle" font-size="49" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="91" text-anchor="middle" font-size="15" letter-spacing="3">THE WORLD’S LEAST AERODYNAMIC ATHLETE</text>

  <!-- A single seaside cycling scene -->
  <path d="M33 339Q144 307 250 336T469 329T766 337V445H33Z" fill="#c6e7df"/>
  <path d="M35 371Q140 351 248 373T475 366T765 373" fill="none" stroke="#91c9bf" stroke-width="3"/>
  <circle cx="674" cy="175" r="39" fill="#ffd06c"/>
  <path d="M80 186q14-16 28 0q14-16 28 0M658 259q11-13 22 0q11-13 22 0" fill="none" stroke="#709b99" stroke-width="3" stroke-linecap="round"/>
  <path d="M34 443H766" stroke="#24343a" stroke-width="5" stroke-linecap="round"/>
  <path d="M57 464H149M196 464H269M571 464H671M708 464H749" stroke="#d5bc8e" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="407" cy="444" rx="237" ry="12" fill="#24343a" opacity=".12"/>

  <!-- Wind streaks -->
  <g stroke="#709b99" stroke-width="4" stroke-linecap="round">
    <path d="M100 274H168M79 293H145M119 312H166">
      <animate attributeName="opacity" values=".3;1;.3" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Wheels: rotating spokes inside steady tires -->
  <g transform="translate(266 371)">
    <circle r="70" fill="#fff5dc" class="ink" stroke-width="9"/>
    <circle r="59" fill="none" stroke="#ddcba9" stroke-width="2"/>
    <g stroke="#718181" stroke-width="2.5">
      <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      <path d="M-25-60L25 60M-60-25L60 25M-60 25L60-25M-25 60L25-60"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#24343a"/>
  </g>
  <g transform="translate(571 371)">
    <circle r="70" fill="#fff5dc" class="ink" stroke-width="9"/>
    <circle r="59" fill="none" stroke="#ddcba9" stroke-width="2"/>
    <g stroke="#718181" stroke-width="2.5">
      <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      <path d="M-25-60L25 60M-60-25L60 25M-60 25L60-25M-25 60L25-60"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#24343a"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M266 371L331 278L400 371Z" stroke="#df624d" stroke-width="9"/>
    <path d="M331 278H516L400 371" stroke="#df624d" stroke-width="9"/>
    <path d="M571 371L516 278L506 248" stroke="#df624d" stroke-width="9"/>
    <path d="M331 278L321 255"/>
    <path d="M505 249L524 238L549 240"/>
  </g>
  <path d="M298 252Q322 242 348 251L343 259H303Z" fill="#24343a" class="thin"/>
  <path d="M270 350Q287 302 330 302" fill="none" stroke="#e6ac48" stroke-width="5" stroke-linecap="round"/>
  <circle cx="400" cy="371" r="20" fill="#fff5dc" class="ink"/>
  <path d="M270 371L400 354M270 371L400 389" fill="none" stroke="#24343a" stroke-width="2"/>

  <!-- Pelican and its remarkably unhelpful cargo -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M305 222L267 210L282 243L309 252" fill="#fffdf1" class="ink"/>
    <path d="M304 207Q293 233 312 255Q342 280 387 251L414 216Q405 185 373 184Z" fill="#fffdf1" class="ink"/>
    <path d="M311 226Q339 243 373 214Q372 247 345 253" fill="#d6e3df" class="thin"/>
    <!-- Racing jersey -->
    <path d="M348 191Q369 176 396 191L412 212L393 234L369 214Z" fill="#329a9a" class="ink"/>
    <path d="M374 190L390 223" stroke="#ffe39a" stroke-width="8"/>
    <path d="M390 207Q433 223 493 241L515 239" fill="none" stroke="#fffdf1" stroke-width="17" stroke-linecap="round"/>
    <path d="M390 207Q433 223 493 241L515 239" fill="none" class="thin"/>
    <!-- Long neck -->
    <path d="M371 193Q377 165 402 143Q425 127 443 147Q450 164 426 178L405 205" fill="#fffdf1" class="ink"/>
    <path d="M425 153Q446 150 456 166L443 181L420 176" fill="#fffdf1" class="ink"/>
    <!-- Helmet -->
    <path d="M400 146Q403 118 431 119Q453 120 461 145Z" fill="#e45e4c" class="ink"/>
    <path d="M419 125L415 139M433 126L433 139M446 131L450 140" class="thin" fill="none"/>
    <path d="M409 149L425 178L443 152" fill="none" class="thin"/>
    <!-- Huge pouch, fish silhouettes visible -->
    <path d="M447 171L629 194Q596 266 519 244Q468 231 447 171Z" fill="#f4ba6e" class="ink"/>
    <g fill="#77a7aa" class="thin">
      <path d="M493 211Q514 193 537 209L551 200L548 219L538 214Q512 233 493 211Z"/>
      <path d="M548 226Q564 209 586 219L598 210L596 230L585 225Q566 240 548 226Z"/>
    </g>
    <circle cx="501" cy="209" r="2.5" fill="#24343a"/>
    <circle cx="556" cy="223" r="2.5" fill="#24343a"/>
    <path d="M447 164L650 184Q657 187 648 193L448 181Z" fill="#f5bd45" class="ink"/>
    <circle cx="438" cy="157" r="5" fill="#24343a"/>
    <path d="M428 147L444 150" class="thin" fill="none"/>
    <!-- Bent pedaling leg -->
    <path d="M349 251L374 295L400 338" fill="none" stroke="#e7a52f" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" values="M349 251L374 295L400 338;M349 251L353 310L400 362;M349 251L374 295L400 338" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Turning crank -->
  <g transform="translate(400 371)">
    <g>
      <path d="M0-28V28" class="ink" fill="none"/>
      <path d="M-10-28H10M-10 28H10" stroke="#24343a" stroke-width="7" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="6" fill="#df624d"/>
  </g>

  <!-- Speech stays steady and readable -->
  <path d="M505 119H735Q749 119 749 133V155Q749 169 735 169H563L542 184L548 169H505Q491 169 491 155V133Q491 119 505 119Z" fill="#fffdf4" class="thin"/>
  <text x="620" y="142" text-anchor="middle" font-size="17" font-weight="700">“It’s all lean protein!”</text>
  <text x="620" y="160" text-anchor="middle" font-size="12">— the pelican’s cycling coach</text>

  <text x="400" y="507" text-anchor="middle" font-size="23" font-weight="800">He carb-loads. The carbs are fish.</text>
  <text x="400" y="532" text-anchor="middle" font-size="16">One bicycle. Two wings. Absolutely no plan for hills.</text>

  <path d="M32 550H768" stroke="#24343a" stroke-width="2"/>
  <text x="400" y="578" text-anchor="middle" font-size="17" font-weight="600">2026-11-07 20:01:09 SGT (UTC+08:00)</text>
</svg>