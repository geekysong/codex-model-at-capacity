  <path d="M105 482 H695" class="ground"/>
  <text x="400" y="515" text-anchor="middle" font-size="14" font-weight="700" fill="#486068">Local traffic report: one lane, two wheels, zero fish left behind.</text>
  <path d="M162 132 q13 -15 26 0 q13 -15 26 0 M567 159 q11 -13 22 0 q11 -13 22 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <rect x="0" y="548" width="800" height="52" fill="#26343a"/>
  <text x="400" y="580" text-anchor="middle" font-size="18" font-weight="700" letter-spacing=".4" fill="#fff">2026-11-07 20:02:11 SGT (UTC+08:00)</text>
</svg>