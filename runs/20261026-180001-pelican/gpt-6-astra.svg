<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">An ambitious pelican pedals a tiny bicycle with a fish-filled beak pouch. The wheels spin, its feet pedal, and its body bobs continuously.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff6df"/>
      <circle cx="4" cy="7" r="1" fill="#ebdbb8" opacity=".45"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fffaf0" stroke="#243340" stroke-width="11"/>
      <circle r="67" fill="none" stroke="#9cafad" stroke-width="3"/>
      <g stroke="#708b91" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <path d="M-20-63A66 66 0 0 1 20-63" fill="none" stroke="#ffb72b" stroke-width="6"/>
      <circle r="10" fill="#243340"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 385Q140 335 275 377T540 365T800 377V485H0Z" fill="#c9ddd0"/>
  <g fill="#fffdf4" opacity=".9">
    <path d="M45 155Q39 130 66 130Q84 100 109 128Q142 123 147 155Z"/>
    <path d="M626 172Q620 148 642 144Q659 117 682 142Q714 135 726 172Z"/>
  </g>

  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#243340">TOUR DE FISH</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#647579">ONE BIRD. TWO WHEELS. ZERO SELF-AWARENESS.</text>

  <g stroke="#243340" stroke-width="3" stroke-linejoin="round">
    <path d="M555 117H749Q761 117 761 129V203Q761 215 749 215H586L555 237L562 215H555Q543 215 543 203V129Q543 117 555 117Z" fill="#fffdf5"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#243340" font-size="21" font-weight="bold">
    <text x="652" y="147">“I only ride</text>
    <text x="652" y="174">for the</text>
    <text x="652" y="201">health benefits.”</text>
  </g>

  <ellipse cx="408" cy="476" rx="247" ry="14" fill="#243340" opacity=".13"/>
  <path d="M50 482H752" stroke="#243340" stroke-width="4" stroke-linecap="round"/>

  <g transform="translate(255 396)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(556 396)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M255 396L329 285L390 396ZM329 285H506L390 396M506 285L556 396" stroke="#243340" stroke-width="15"/>
    <path d="M255 396L329 285L390 396ZM329 285H506L390 396M506 285L556 396" stroke="#ed6550" stroke-width="9"/>
    <path d="M329 285L318 263M506 285L492 246L528 233" stroke="#243340" stroke-width="9"/>
    <path d="M295 263H342M520 232L540 234" stroke="#243340" stroke-width="12"/>
    <path d="M265 396H390" stroke="#243340" stroke-width="5"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <!-- The pelican's far leg -->
    <path d="M344 259Q418 283 407 348" fill="none" stroke="#b66b28" stroke-width="13" stroke-linecap="round"/>

    <!-- Tail, plump body, long neck, and enormous pouch -->
    <g stroke="#243340" stroke-width="4" stroke-linejoin="round">
      <path d="M282 231L229 211L247 244L221 244L277 267Z" fill="#e4e9df"/>
      <path d="M281 210Q314 182 357 204Q399 223 389 257Q380 285 323 281Q271 278 263 245Z" fill="#fffef0"/>
      <path d="M354 235Q386 213 386 175Q382 145 410 137Q442 130 453 153Q463 179 437 199Q420 216 417 247Q411 269 380 273" fill="#fffef0"/>
      <path d="M282 222Q326 210 361 246Q332 270 294 251L311 249L286 239L307 239Z" fill="#c0d0ce"/>
      <path d="M438 173L582 188Q550 262 463 228Q449 209 438 173Z" fill="#f5b449"/>
      <path d="M439 170L593 185L578 196L441 185Z" fill="#ffc955"/>
    </g>

    <!-- Fish cargo peeking through the pouch -->
    <g stroke="#243340" stroke-width="2" stroke-linejoin="round">
      <path d="M476 209Q494 191 518 208L532 198L530 220L516 215Q494 230 476 209Z" fill="#62b6b6"/>
      <circle cx="487" cy="207" r="2.8" fill="#243340" stroke="none"/>
      <path d="M500 207L506 212L500 218" fill="none"/>
    </g>
    <text x="503" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#593b26" transform="rotate(9 503 242)">FUEL TANK</text>

    <!-- Eye, smug eyebrow, and a comically small racing helmet -->
    <ellipse cx="432" cy="159" rx="10" ry="12" fill="white" stroke="#243340" stroke-width="3"/>
    <circle cx="436" cy="160" r="4" fill="#243340"/>
    <path d="M419 143L438 140" stroke="#243340" stroke-width="4" stroke-linecap="round"/>
    <path d="M391 143Q389 119 413 117Q437 115 448 138Z" fill="#ed6550" stroke="#243340" stroke-width="4"/>
    <path d="M403 124L407 136M416 122L420 135M429 125L434 135" stroke="#243340" stroke-width="4" stroke-linecap="round"/>
    <path d="M398 143Q399 178 420 183" fill="none" stroke="#243340" stroke-width="3"/>

    <!-- Wing reaches the handlebars -->
    <path d="M359 231Q414 259 450 244L526 233" fill="none" stroke="#243340" stroke-width="18" stroke-linecap="round"/>
    <path d="M359 229Q414 255 450 241L522 232" fill="none" stroke="#e6ecdf" stroke-width="11" stroke-linecap="round"/>
    <path d="M346 276L374 323" stroke="#eaaa3f" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Crank, ankle, and webbed foot turn together -->
  <circle cx="390" cy="396" r="24" fill="#f7d889" stroke="#243340" stroke-width="4"/>
  <g transform="translate(390 396)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-23-20L23 20" stroke="#243340" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(23 20)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
          <path d="M-9-8L-8-33" stroke="#eaaa3f" stroke-width="11" stroke-linecap="round"/>
          <path d="M-11-10L5-8L22 3L9 4L4 9L-4 5L-17 7Z" fill="#ffbf45" stroke="#243340" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-19 12H22" stroke="#243340" stroke-width="6" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <g stroke="#647579" stroke-width="4" stroke-linecap="round">
    <path d="M163 306H210M145 323H196M169 340H209"/>
  </g>
  <g transform="translate(95 390)">
    <path d="M0 83V-31" stroke="#796e56" stroke-width="7"/>
    <path d="M-55-48H33L54-27L33-6H-55Z" fill="#ffcf60" stroke="#243340" stroke-width="3"/>
    <text x="-5" y="-22" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#243340">FISH BUFFET</text>
  </g>

  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#243340">His carbon footprint is tiny. His lunch budget isn't.</text>

  <path d="M40 545H760" stroke="#c7b895" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#45535b">2026-10-26 18:00:01 SGT (UTC+08:00)</text>
</svg>