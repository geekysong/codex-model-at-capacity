<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon of an enormous pelican riding a tiny bicycle, with animated spinning wheels and bobbing rider.</desc>
  <rect width="800" height="600" fill="#dff4ff"/>
  <path d="M0 315 Q115 270 225 320 T440 300 T620 325 T800 292 V475 H0Z" fill="#a9dc75"/>
  <path d="M0 438 Q160 409 320 439 T610 421 T800 436 V475 H0Z" fill="#86bd59"/>
  <path d="M0 474 H800 V505 H0Z" fill="#59636d"/>
  <path d="M0 505 H800" stroke="#fff7c7" stroke-width="6" stroke-dasharray="30 22"/>
  <g fill="#fff" opacity=".8">
    <path d="M86 102 q21-30 44 0 q30-25 56 3 q-45 17-100 7Z"/>
    <path d="M602 86 q18-24 38 0 q25-18 48 3 q-39 14-86 6Z"/>
  </g>

  <text x="400" y="57" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34" fill="#203447" stroke="#fff" stroke-width="5" paint-order="stroke">PELICAN PEDALS TO GLORY</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#36586e">Local bird discovers the only thing bigger than its bill is its confidence.</text>

  <!-- roadside satire sign -->
  <g transform="translate(83 212)">
    <path d="M33 84 V156" stroke="#765332" stroke-width="10"/>
    <rect x="0" y="0" width="142" height="88" rx="10" fill="#ffe166" stroke="#72522d" stroke-width="6"/>
    <text x="71" y="31" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" fill="#403221">BIKE LANE</text>
    <text x="71" y="56" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" fill="#403221">FOR BIRDS</text>
    <text x="71" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#403221">(apparently)</text>
  </g>

  <!-- bicycle -->
  <g stroke="#243341" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(300 425)">
      <circle r="69" fill="none" stroke-width="10"/>
      <circle r="7" fill="#f4c542" stroke-width="4"/>
      <g stroke-width="3" opacity=".8">
        <path d="M0-61V61M-61 0H61M-43-43L43 43M43-43L-43 43"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 300 425" to="360 300 425" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(540 425)">
      <circle r="69" fill="none" stroke-width="10"/>
      <circle r="7" fill="#f4c542" stroke-width="4"/>
      <g stroke-width="3" opacity=".8">
        <path d="M0-61V61M-61 0H61M-43-43L43 43M43-43L-43 43"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 540 425" to="360 540 425" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <path d="M300 425 L373 318 L445 425 Z M373 318 L478 316 L540 425 M445 425 L478 316 M478 316 L507 272 M472 269 H526 M373 318 L350 285 M326 282 H371" fill="none" stroke-width="9"/>
    <path d="M445 425 L478 425" stroke-width="7"/>
    <circle cx="445" cy="425" r="19" fill="#f4c542" stroke-width="6"/>
    <path d="M428 439 L458 411 M462 445 H493 M402 450 H432" stroke-width="7"/>
  </g>

  <!-- pelican rider -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.75s" repeatCount="indefinite"/>
    <!-- body -->
    <ellipse cx="416" cy="272" rx="84" ry="109" fill="#f5f2e7" stroke="#243341" stroke-width="6"/>
    <path d="M388 177 Q420 110 467 153 Q497 194 472 252 Q452 209 388 177Z" fill="#e9e4d5" stroke="#243341" stroke-width="6"/>
    <!-- wing gripping handlebar -->
    <path d="M433 266 Q498 275 520 306 Q528 321 513 328 Q488 316 465 304 L431 294Z" fill="#d9d4c7" stroke="#243341" stroke-width="6"/>
    <path d="M500 314 q14 8 25-7" fill="none" stroke="#ee9b37" stroke-width="8"/>
    <!-- comically huge bill -->
    <path d="M385 192 Q326 190 267 226 Q245 239 267 254 Q330 278 402 256 Q423 234 414 207Z" fill="#f3a638" stroke="#243341" stroke-width="6"/>
    <path d="M270 253 Q333 272 401 253 Q388 300 322 296 Q279 291 270 253Z" fill="#f8c75a" stroke="#243341" stroke-width="5"/>
    <path d="M294 263 Q340 275 380 261" fill="none" stroke="#d87a2d" stroke-width="4"/>
    <!-- face -->
    <circle cx="394" cy="184" r="16" fill="#fff" stroke="#243341" stroke-width="5"/>
    <circle cx="399" cy="186" r="6" fill="#243341"/>
    <path d="M370 169 q18-18 36-5" fill="none" stroke="#243341" stroke-width="6"/>
    <path d="M421 210 q13 4 22-5" fill="none" stroke="#243341" stroke-width="4"/>
    <!-- legs pedaling -->
    <g stroke="#e58d2b" stroke-width="13" stroke-linecap="round">
      <path d="M401 363 Q393 399 431 426"/>
      <path d="M449 363 Q471 392 461 441"/>
    </g>
    <g fill="#f3a638" stroke="#243341" stroke-width="4">
      <path d="M421 427 q18-8 34 4 q-7 15-30 11Z"/>
      <path d="M450 441 q18-7 34 5 q-8 14-30 10Z"/>
    </g>
    <g transform="rotate(0 445 425)">
      <animateTransform attributeName="transform" type="rotate" values="0 445 425;180 445 425;360 445 425" dur="1.2s" repeatCount="indefinite"/>
      <path d="M445 425 L474 404 M445 425 L417 446" stroke="#243341" stroke-width="7" stroke-linecap="round"/>
    </g>
    <!-- helmet -->
    <path d="M365 147 Q405 105 458 139 L466 159 L360 165Z" fill="#e94f52" stroke="#243341" stroke-width="6"/>
    <path d="M382 138 L398 157 M413 127 L421 156 M442 137 L440 158" stroke="#fff" stroke-width="5"/>
  </g>

  <!-- motion marks -->
  <g fill="none" stroke="#44758a" stroke-width="5" stroke-linecap="round">
    <path d="M587 314 h52"><animate attributeName="opacity" values="0;1;0" dur=".7s" repeatCount="indefinite"/></path>
    <path d="M604 337 h70"><animate attributeName="opacity" values="1;0;1" dur=".7s" repeatCount="indefinite"/></path>
    <path d="M616 360 h40"><animate attributeName="opacity" values="0;1;0" dur=".7s" repeatCount="indefinite"/></path>
  </g>

  <rect x="0" y="525" width="800" height="75" fill="#203447"/>
  <text x="400" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff7c7">“I don’t need a bigger bike,” says bird who absolutely needs a bigger bike.</text>
  <text x="400" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dff4ff">2026-10-26 18:03:35 SGT (UTC+08:00)</text>
</svg>