<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish riding in its enormous bill. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#dbcfae" opacity=".3"/>
    </pattern>
    <g id="spokes" stroke="#263b49" stroke-width="3">
      <circle r="83" fill="#fff6d7" stroke-width="12"/>
      <circle r="70" fill="none" stroke="#e6ab42" stroke-width="3"/>
      <path d="M-76 0H76M0-76V76M-54-54L54 54M-54 54L54-54"/>
      <circle r="9" fill="#e87943"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 332Q125 285 245 326T500 320T800 315V491H0Z" fill="#d6e8cc"/>
  <path d="M0 399Q190 373 391 399T800 390V514H0Z" fill="#b7d2b1"/>
  <path d="M0 461Q400 446 800 461V514H0Z" fill="#e7ca93"/>
  <path d="M29 483H107M651 483H755" stroke="#fff8e4" stroke-width="6" stroke-linecap="round"/>

  <text x="400" y="65" text-anchor="middle" font-family="Verdana, sans-serif" font-size="45" font-weight="900" fill="#233d45" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="98" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" fill="#74563e">Zero emissions. Unreasonable seafood capacity.</text>

  <!-- A roadside verdict -->
  <g stroke="#263b49" stroke-width="4" stroke-linejoin="round">
    <path d="M689 300V445" fill="none"/>
    <path d="M623 254H744V326H623Z" fill="#fff6df"/>
  </g>
  <text x="683" y="280" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#263b49">BIKE LANE</text>
  <text x="683" y="305" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" fill="#263b49">NO TRAWLING</text>

  <ellipse cx="382" cy="473" rx="245" ry="15" fill="#74583e" opacity=".16"/>

  <!-- Each wheel rotates around its own hub. -->
  <g transform="translate(230 389)">
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(540 389)">
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 389L310 292L371 389ZM310 292H490L371 389M490 292L540 389" stroke="#263b49" stroke-width="13"/>
    <path d="M230 389L310 292L371 389ZM310 292H490L371 389M490 292L540 389" stroke="#e96847" stroke-width="7"/>
    <path d="M310 292L299 268M490 292L477 252L501 235H523" stroke="#263b49" stroke-width="8"/>
    <path d="M277 267H326" stroke="#263b49" stroke-width="12"/>
    <path d="M230 389H371" stroke="#687b78" stroke-width="4"/>
  </g>
  <circle cx="371" cy="389" r="19" fill="#e6ab42" stroke="#263b49" stroke-width="4"/>

  <!-- Pedaling crank -->
  <g transform="translate(371 389)">
    <g stroke="#263b49" stroke-width="6" stroke-linecap="round">
      <path d="M-26 0H26"/>
      <path d="M-33-5V5M33-5V5" stroke-width="10"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- The rider bobs without moving any text. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <!-- Far leg -->
    <path d="M341 268L326 326L349 370" fill="none" stroke="#bc7d35" stroke-width="12" stroke-linecap="round"/>
    <!-- Body and neck -->
    <path d="M284 237Q270 275 306 294Q350 313 392 270Q410 251 414 223L419 182Q420 164 441 166L457 185Q464 192 476 185Q487 170 472 151Q448 123 417 138Q391 148 388 184L380 216Q333 192 284 237Z" fill="#fffdf1" stroke="#263b49" stroke-width="5" stroke-linejoin="round"/>
    <path d="M289 243Q324 220 362 240Q357 271 315 275" fill="#e5e6d4" stroke="#263b49" stroke-width="4"/>
    <path d="M285 247L253 245L279 267" fill="#fffdf1" stroke="#263b49" stroke-width="4"/>
    <!-- Near leg and webbed foot -->
    <path d="M357 278L390 322L389 374" fill="none" stroke="#e9a13d" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M357 278L390 322L389 374;M357 278L372 330L354 389;M357 278L390 322L389 374" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M389 367L412 382L380 383Z" fill="#f3b345" stroke="#263b49" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;-35 15;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <!-- Wing reaching for handlebar -->
    <path d="M364 239Q416 250 445 236L501 235" fill="none" stroke="#263b49" stroke-width="17" stroke-linecap="round"/>
    <path d="M364 237Q416 248 445 234L498 233" fill="none" stroke="#fffdf1" stroke-width="11" stroke-linecap="round"/>
    <!-- Vast bill and sagging pouch -->
    <path d="M466 177L631 192Q589 251 515 223Q480 212 466 177Z" fill="#f5bb54" stroke="#263b49" stroke-width="4"/>
    <path d="M465 170L642 187L632 196L468 189Z" fill="#f08439" stroke="#263b49" stroke-width="4" stroke-linejoin="round"/>
    <!-- Fish passenger visible in the pouch -->
    <path d="M534 211Q555 190 580 208L599 197L596 220L580 213Q555 231 534 211Z" fill="#74b7b1" stroke="#263b49" stroke-width="3"/>
    <circle cx="546" cy="207" r="3" fill="#263b49"/>
    <path d="M558 211L566 216" stroke="#263b49" stroke-width="2"/>
    <!-- Face and racing helmet -->
    <circle cx="448" cy="163" r="6" fill="#263b49"/>
    <circle cx="450" cy="161" r="2" fill="white"/>
    <path d="M438 150L454 153" stroke="#263b49" stroke-width="4" stroke-linecap="round"/>
    <path d="M403 143Q414 115 446 124Q463 128 469 145Z" fill="#e96847" stroke="#263b49" stroke-width="4"/>
    <path d="M421 128L417 140M438 128L437 141M452 133L454 142" stroke="#fff6df" stroke-width="4"/>
    <path d="M407 144Q404 173 422 184" fill="none" stroke="#263b49" stroke-width="3"/>
    <path d="M397 186L370 178L378 194L357 199L390 205" fill="#e96847" stroke="#263b49" stroke-width="3"/>
  </g>

  <!-- Passenger commentary -->
  <path d="M551 128Q551 113 568 113H738Q753 113 753 128V153Q753 168 738 168H602L584 187L587 168H568Q551 168 551 153Z" fill="white" stroke="#263b49" stroke-width="3"/>
  <text x="652" y="136" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#263b49">“I ordered</text>
  <text x="652" y="156" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" fill="#263b49">a carpool.”</text>

  <path d="M128 317L161 310M112 338L151 335M121 359H150" stroke="#718d88" stroke-width="4" stroke-linecap="round"/>

  <!-- Dedicated caption and timestamp footer -->
  <rect y="514" width="800" height="86" fill="#263b49"/>
  <text x="400" y="548" text-anchor="middle" font-family="Verdana, sans-serif" font-size="19" font-weight="bold" fill="#fff6df">He cycles to work. His lunch gets a free commute.</text>
  <text x="400" y="580" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" fill="#f6ce83">2026-10-31 11:01:02 SGT (UTC+08:00)</text>
</svg>