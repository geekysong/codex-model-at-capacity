<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on the Move</title>
  <desc id="desc">A dignified pelican rides a bicycle, pedaling past a sign that says “Climate meeting: around the corner.”</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.8s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f7e9c8"/>
  <path d="M0 380 Q150 335 300 374 T600 365 T800 376 V530 H0Z" fill="#9dc8a2"/>
  <path d="M0 436 Q170 415 340 438 T800 426" fill="none" stroke="#78ad84" stroke-width="5"/>
  <rect x="0" y="500" width="800" height="100" fill="#425568"/>
  <path d="M0 545 H800" stroke="#f6d36d" stroke-width="5" stroke-dasharray="36 24"/>

  <text id="title" x="400" y="62" text-anchor="middle" font-size="34" font-weight="900" fill="#18364a">THE PELICAN COMMUTE</text>
  <text x="400" y="91" text-anchor="middle" font-size="16" font-weight="700" fill="#49616c">“I’d take the car, but I’m trying to cut my beakprint.”</text>

  <g aria-label="Roadside sign">
    <path d="M665 192 V370" stroke="#765439" stroke-width="12"/>
    <rect x="575" y="154" width="190" height="94" rx="8" fill="#fff8e7" stroke="#765439" stroke-width="5"/>
    <text x="670" y="185" text-anchor="middle" font-size="15" font-weight="800" fill="#344b55">CLIMATE MEETING</text>
    <text x="670" y="210" text-anchor="middle" font-size="14" fill="#344b55">just around</text>
    <text x="670" y="231" text-anchor="middle" font-size="14" fill="#344b55">the corner →</text>
  </g>

  <g aria-label="Bicycle">
    <g class="wheel" transform="translate(258 420)">
      <circle r="62" fill="#f7e9c8" stroke="#203d50" stroke-width="8"/>
      <circle r="7" fill="#203d50"/>
