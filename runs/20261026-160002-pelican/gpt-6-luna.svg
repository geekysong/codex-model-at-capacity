  <text x="400" y="559" text-anchor="middle" font-size="17" font-weight="700" fill="#fff8e7">Two wheels, one beak, absolutely no parking fees.</text>
  <text x="400" y="585" text-anchor="middle" font-size="14" font-weight="600" fill="#f6d36d">2026-10-26 16:02:38 SGT (UTC+08:00)</text>
