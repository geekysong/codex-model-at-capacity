<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with a huge fish-filled bill. The wheels spin, the pedals turn, and the pelican bobs. A sign declares the bicycle lane a no-fly zone.</desc>
  <defs>
    <pattern id="sky" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fff4d9"/>
      <circle cx="3" cy="3" r="1" fill="#eadcbe"/>
    </pattern>
    <g id="spokes" stroke="#54616b" stroke-width="3">
      <path d="M0-75V75M-75 0H75M-53-53L53 53M-53 53L53-53"/>
      <circle r="67" fill="none" stroke="#f7be37" stroke-width="5" stroke-dasharray="13 92"/>
    </g>
    <g id="fish">
      <path d="M-20 0Q0-18 24 0Q0 18-20 0L-34 12V-12Z" fill="#66c4bc" stroke="#243440" stroke-width="3"/>
      <circle cx="15" cy="-2" r="3" fill="#243440"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 386Q120 350 240 382T480 378T800 370V504H0Z" fill="#cee1c5"/>
