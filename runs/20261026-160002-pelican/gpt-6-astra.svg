  <rect x="0" y="504" width="800" height="96" fill="#243440"/>
  <text x="400" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#fff4d9">One pelican. Two wheels. Six unpaid passengers.</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#f7be37">2026-10-26 16:00:02 SGT (UTC+08:00)</text>
