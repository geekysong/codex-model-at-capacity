  <g font-family="Arial, sans-serif" fill="#243440">
    <path d="M95 142Q95 127 111 127H276Q292 127 292 143V181Q292 197 276 197H249L266 218L220 197H111Q95 197 95 181Z" fill="#fffdf2" stroke="#243440" stroke-width="3"/>
