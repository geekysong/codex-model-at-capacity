  <ellipse cx="385" cy="464" rx="245" ry="15" fill="#243440" opacity=".13"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" fill="#243440" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#95602f">THE COMMUTE IS EASY. THE CARGO IS JUDGING.</text>

  <g stroke="#243440" stroke-linejoin="round">
    <path d="M701 294V431" stroke-width="8"/>
    <rect x="637" y="220" width="130" height="79" rx="8" fill="#fff9e9" stroke-width="4" transform="rotate(5 702 260)"/>
    <g font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#243440" stroke="none" text-anchor="middle" transform="rotate(5 702 260)">
      <text x="702" y="250">BIKE LANE</text>
      <text x="702" y="278" fill="#bc4939">NO FLYING</text>
    </g>
  </g>

  <g fill="none" stroke="#243440" stroke-linecap="round">
    <path d="M109 306H170M89 324H150M116 342H159" stroke-width="5"/>
  </g>

