<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the Panic Express</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle.</desc>
  <defs>
    <style>
      .line{stroke:#182433;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .thin{stroke:#182433;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .wheel{animation:spin 1.4s linear infinite;transform-origin:center}
      .bob{animation:bob .7s ease-in-out infinite alternate;transform-origin:400px 335px}
      .pedal{animation:pedal .7s linear infinite;transform-origin:400px 409px}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-8px) rotate(-1deg)}}
    </style>
  </defs>

