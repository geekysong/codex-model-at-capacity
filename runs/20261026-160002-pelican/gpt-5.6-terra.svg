  <text x="625" y="177" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#182433">BIKE LANE</text>
  <text x="625" y="197" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#182433">probably</text>

  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="37" font-weight="900" fill="#182433">PELICAN PEDALS THE PANIC EXPRESS</text>
  <text x="400" y="92" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#34485a">“I was told this was a low-carbon beak-to-work scheme.”</text>

