<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Pelican Pedal-Off</title>
  <desc id="desc">A smug pelican rides a bicycle while fish cheer from the roadside.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#d8f4f5"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666b78"/>
      <stop offset="1" stop-color="#343846"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="105" cy="95" r="45" fill="#fff3a8" opacity=".85"/>
  <path d="M0 330 Q110 270 220 330 T440 325 T660 320 T800 330 V430 H0Z" fill="#8acb82"/>
  <path d="M0 390 Q170 350 330 390 T650 385 T800 395 V600 H0Z" fill="url(#road)"/>

  <text x="400" y="62" text-anchor="middle" font-family="Verdana, sans-serif" font-weight="900" font-size="31" fill="#17324d" stroke="#ffffff" stroke-width="3" paint-order="stroke">
    THE GREAT PELICAN PEDAL-OFF
  </text>
  <text x="400" y="94" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" fill="#17324d">
    “Why walk when you can wobble with style?”
  </text>

  <g fill="#f7e7b2" stroke="#573f32" stroke-width="4">
    <path d="M90 360 q-18-38 12-54 q28-14 48 13 q18-20 42-5 q28 17 5 48 q-16 23-54 16 q-36 13-53-18Z"/>
    <path d="M665 350 q-15-34 13-49 q27-15 45 10 q20-17 40-1 q25 17 4 44 q-16 20-49 14 q-36 12-53-18Z"/>
  </g>
  <g fill="#573f32">
    <circle cx="130" cy="336" r="5"/><circle cx="177" cy="332" r="5"/>
    <circle cx="704" cy="327" r="5"/><circle cx="750" cy="325" r="5"/>
  </g>
  <g font-family="Verdana, sans-serif" font-size="15" fill="#573f32" font-weight="bold">
    <text x="86" y="405">“Quack? That’s a pelican!”</text>
    <text x="641" y="397">“Full beak ahead!”</text>
  </g>

  <g id="bike" stroke="#202837" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" fill="none">
    <g stroke="#f2f4f5" stroke-width="5">
      <circle cx="265" cy="440" r="70"/>
      <circle cx="535" cy="440" r="70"/>
    </g>
    <g id="wheelLeft" stroke="#f2f4f5" stroke-width="3">
      <path d="M265 370V510 M195 440H335 M215 390L315 490 M315 390L215 490"/>
      <animateTransform attributeName="transform" type="rotate" from="0 265 440" to="360 265 440" dur="2s" repeatCount="indefinite"/>
    </g>
    <g id="wheelRight" stroke="#f2f4f5" stroke-width="3">
      <path d="M535 370V510 M465 440H605 M485 390L585 490 M585 390L485 490"/>
      <animateTransform attributeName="transform" type="rotate" from="0 535 440" to="360 535 440" dur="2s" repeatCount="indefinite"/>
    </g>
    <path d="M265 440 L350 345 L445 440 L265 440 M350 345 L535 440 M445 440 L490 350 L535 440"/>
    <path d="M337 335 h35 M350 345 l-4-27"/>
    <path d="M480 350 h28"/>
    <circle cx="445" cy="440" r="13" fill="#f5b642"/>
    <path d="M445 440 l-30-20 M445 440 l29 20"/>
  </g>

  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M350 330 q-14-78 38-105 q54-27 93 15 q29 31 15 78 q-12 39-57 49 q-57 13-89-37Z" fill="#f4f1e4" stroke="#573f32" stroke-width="5"/>
    <path d="M390 238 q-9-45 18-64 q31-21 61 2 q25 20 15 58 q-10 34-47 37 q-38 1-47-33Z" fill="#fff8df" stroke="#573f32" stroke-width="5"/>
    <path d="M430 230 q28-12 91 15 q31 13 53 7 q-7 25-43 34 q-50 12-92-10Z" fill="#f09a46" stroke="#573f32" stroke-width="5"/>
    <path d="M525 251 q35 8 55 1 q-10 18-37 22" fill="#e77935" stroke="#573f32" stroke-width="4"/>
    <circle cx="447" cy="205" r="7" fill="#202837"/>
    <path d="M438 190 q16-16 31-1" fill="none" stroke="#573f32" stroke-width="4"/>
    <path d="M372 300 q35 21 67 3" fill="none" stroke="#c8c0aa" stroke-width="8"/>
    <path d="M390 303 q-14 50-2 94" fill="none" stroke="#f09a46" stroke-width="13"/>
    <path d="M452 300 q12 52 4 96" fill="none" stroke="#f09a46" stroke-width="13"/>
    <g stroke="#573f32" stroke-width="6">
      <path d="M388 391 l-25 49"/>
      <path d="M456 392 l30 48"/>
    </g>
    <g stroke="#f09a46" stroke-width="6">
      <path d="M363 440 l-22 4"/>
      <path d="M363 440 l18 12"/>
      <path d="M486 440 l19 5"/>
      <path d="M486 440 l-13 13"/>
    </g>
    <path d="M395 270 q-23 17-31 47" fill="none" stroke="#d9d1bd" stroke-width="6"/>
    <path d="M468 270 q25 15 35 39" fill="none" stroke="#d9d1bd" stroke-width="6"/>
    <g id="pedalLeg">
      <animateTransform attributeName="transform" type="rotate" values="-18 445 440;18 445 440;-18 445 440" dur="1.2s" repeatCount="indefinite"/>
      <path d="M445 440 L415 420" fill="none" stroke="#573f32" stroke-width="7"/>
      <path d="M415 420 l-19 6" fill="none" stroke="#f09a46" stroke-width="7"/>
    </g>
  </g>

  <g font-family="Verdana, sans-serif" font-weight="bold">
    <path d="M555 160 q45-35 91 0 l-9 42 q-42 16-80-2Z" fill="#fff9dc" stroke="#573f32" stroke-width="4"/>
    <text x="600" y="182" text-anchor="middle" font-size="16" fill="#573f32">BEAK POWER!</text>
  </g>

  <rect x="28" y="548" width="744" height="36" rx="10" fill="#172334" opacity=".9"/>
  <text x="400" y="572" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" fill="#ffffff">
    2026-10-29 15:30:07 SGT (UTC+08:00)
  </text>
</svg>