<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican cycles along a seaside road with fish in its enormous bill pouch. Bicycle wheels spin, pedals turn, and the rider bobs in a looping animation.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a9e4ef"/>
      <stop offset="1" stop-color="#ecf8ed"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd66a"/>
      <stop offset="1" stop-color="#f6a342"/>
    </linearGradient>
    <style>
      .outline{stroke:#203443;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .type{font-family:Arial,Helvetica,sans-serif;fill:#203443}
      .spoke{stroke:#73909b;stroke-width:3}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect x="16" y="16" width="768" height="502" rx="24" fill="url(#sky)" stroke="#203443" stroke-width="4"/>

  <text x="400" y="68" text-anchor="middle" class="type" font-size="43" font-weight="900" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="99" text-anchor="middle" class="type" font-size="17" font-weight="bold">ZERO EMISSIONS. QUESTIONABLE AERODYNAMICS.</text>

  <circle cx="690" cy="158" r="37" fill="#ffdb72"/>
  <g fill="#fff" opacity=".85">
    <path d="M55 164q10-24 34-13 17-31 41-8 26-8 32 21Z"/>
    <path d="M584 135q10-18 27-9 15-22 34-3 21-4 26 12Z"/>
  </g>
  <path d="M18 338 Q139 321 260 338T501 338T782 337V410H18Z" fill="#60b8bf"/>
  <g fill="none" stroke="#dcffff" stroke-width="3" opacity=".7">
    <path d="M42 356h70m49 14h88m300-14h87m44 22h64"/>
  </g>
  <path d="M18 392Q190 370 385 395T782 391V515H18Z" fill="#d6cb9f"/>
  <path d="M18 435Q350 418 782 434V496H18Z" fill="#78888a"/>
  <path d="M36 474h95m64 0h95m64 0h95m64 0h95m64 0h74" stroke="#fff2c6" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="394" cy="461" rx="229" ry="15" fill="#203443" opacity=".15"/>

  <!-- Roadside satire -->
  <g class="outline">
    <path d="M94 323v104" fill="none" stroke-width="7"/>
    <path d="M42 268h109v65H42Z" fill="#fff7df"/>
  </g>
  <text x="96" y="292" text-anchor="middle" class="type" font-size="15" font-weight="bold">BIKE LANE</text>
  <text x="96" y="316" text-anchor="middle" class="type" font-size="17" font-weight="bold">NO DIVING</text>

  <!-- Wheels rotate around stationary hubs -->
  <g>
    <circle cx="249" cy="390" r="68" fill="#f7fbef" class="outline" stroke-width="10"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 249 390" to="360 249 390" dur="1.8s" repeatCount="indefinite"/>
      <g class="spoke">
        <path d="M249 326v128m-64-64h128m-109-45 90 90m-90 0 90-90"/>
      </g>
      <path d="M229 329l13-3" stroke="#ffcc47" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle cx="249" cy="390" r="8" fill="#203443"/>

    <circle cx="539" cy="390" r="68" fill="#f7fbef" class="outline" stroke-width="10"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 539 390" to="360 539 390" dur="1.8s" repeatCount="indefinite"/>
      <g class="spoke">
        <path d="M539 326v128m-64-64h128m-109-45 90 90m-90 0 90-90"/>
      </g>
      <path d="M519 329l13-3" stroke="#ffcc47" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle cx="539" cy="390" r="8" fill="#203443"/>
  </g>

  <!-- Bicycle -->
  <g fill="none" class="outline">
    <path d="M249 390l68-115 71 115H249l192-113-53 113m53-113 98 113" stroke="#e75045" stroke-width="10"/>
    <path d="M317 275l-12-33m136 35-12-49 42-11" stroke-width="7"/>
    <path d="M286 243h48" stroke-width="12"/>
    <path d="M456 219l20-3" stroke-width="9"/>
    <path d="M435 237q57-10 75 55" stroke-width="2"/>
    <path d="M251 385l137-8m-137 18 137 8" stroke="#54616b" stroke-width="3"/>
  </g>
  <circle cx="388" cy="390" r="17" fill="#f7f2d9" class="outline"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 388 390" to="360 388 390" dur="1.8s" repeatCount="indefinite"/>
    <path d="M369 367l38 46" fill="none" class="outline"/>
    <path d="M358 367h22m16 46h22" stroke="#203443" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Pelican rider -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M321 270l-17 53 57 42" fill="none" stroke="#203443" stroke-width="15" stroke-linejoin="round"/>
    <path d="M321 270l-17 53 57 42" fill="none" stroke="#f6ad42" stroke-width="9" stroke-linejoin="round"/>
    <path d="M348 365l27 9-7-17" fill="#f6ad42" class="outline"/>
    <path d="M280 244l-40 11 22-37" fill="#f8fbf0" class="outline"/>
    <path d="M277 213q-18 30 6 57 23 25 76 3l29-42-30-50Z" fill="#fffdf1" class="outline"/>
    <path d="M299 215q-2 41 46 29l36-24" fill="#e0e9dd" class="outline"/>
    <path d="M354 216q42 14 73 12l32-8" fill="none" class="outline" stroke-width="12"/>
    <path d="M355 216q42 14 73 12l32-8" fill="none" stroke="#e0e9dd" stroke-width="7"/>
    <path d="M347 208q-9-32 3-60 12-29 36-24 33 5 26 36l-9 33q-8 25-20 40" fill="#fffdf1" class="outline"/>

    <!-- Oversized bill and fish-filled pouch -->
    <path d="M404 157l230 32q-10 65-99 64-78 0-131-66Z" fill="url(#pouch)" class="outline"/>
    <g class="outline" stroke-width="3">
      <path d="M467 207q24-25 47 0-21 21-47 0l-15 12v-24Z" fill="#79bbc2"/>
      <circle cx="504" cy="204" r="3" fill="#203443" stroke="none"/>
      <path d="M545 221q24-25 47 0-21 21-47 0l-14 12v-24Z" fill="#a3cb87"/>
      <circle cx="582" cy="218" r="3" fill="#203443" stroke="none"/>
    </g>
    <path d="M403 155q108 0 236 32l-6 14-230-24Z" fill="#ffca48" class="outline"/>
    <path d="M420 177l191 19" fill="none" stroke="#d68a35" stroke-width="2"/>
    <circle cx="392" cy="149" r="12" fill="white" stroke="#203443" stroke-width="3"/>
    <circle cx="397" cy="150" r="5" fill="#203443"/>
    <path d="M378 132l24 3" fill="none" class="outline" stroke-width="4"/>

    <!-- Tiny cycling helmet -->
    <path d="M359 128q-3-32 29-34 30-1 34 28Z" fill="#e75045" class="outline"/>
    <path d="M371 115l7-14m8 12 4-15m9 14-1-12" stroke="#fff7df" stroke-width="4" stroke-linecap="round"/>
    <path d="M367 127l16 47 22-40" fill="none" stroke="#203443" stroke-width="3"/>
  </g>

  <!-- Motion marks -->
  <g stroke="#203443" stroke-width="4" stroke-linecap="round">
    <path d="M185 282h42m-58 18h43m-19 19h24"/>
  </g>
  <path d="M576 285q23-21 54-5l21-14-3 29q-23 26-66 7Z" fill="#fffdf1" stroke="#203443" stroke-width="3"/>
  <text x="612" y="295" text-anchor="middle" class="type" font-size="17" font-weight="bold">WHEE!</text>

  <!-- Dedicated caption and timestamp footer -->
  <text x="400" y="549" text-anchor="middle" class="type" font-size="21" font-weight="bold">He bought a bicycle. Still carries everything in his mouth.</text>
  <text x="400" y="581" text-anchor="middle" class="type" font-size="17">2026-10-31 05:01:04 SGT (UTC+08:00)</text>
</svg>