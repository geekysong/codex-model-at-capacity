<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A cheerful pelican rides a bicycle with spinning wheels and a gentle pedaling motion.</desc>
  <defs>
    <style>
      .ink { stroke: #26323a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #26323a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
      .rider { animation: bob 0.7s ease-in-out infinite alternate; }
      .pedal { transform-origin: 384px 398px; animation: spin 1.4s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedal { animation-duration: 5s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e7"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#e4f5f4" stroke="#26323a" stroke-width="4"/>
  <text x="400" y="72" text-anchor="middle" font-family="Verdana, sans-serif" font-size="35" font-weight="900" fill="#26323a">THE PELICAN EXPRESS</text>
  <text x="400" y="102" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#47777b">TWO WHEELS. ONE VERY LARGE BEAK.</text>

