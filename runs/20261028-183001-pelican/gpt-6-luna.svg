<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7ff"/>
      <stop offset="1" stop-color="#e7fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#535b67"/>
      <stop offset="1" stop-color="#252b35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".28"/>
    </filter>
    <style>
      .ink { stroke:#202832; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#202832; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite; }
      .rider { animation:bob .8s ease-in-out infinite alternate; transform-origin:center bottom; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".9"/>
  <path d="M0 330 Q90 275 180 330 T360 330 T540 330 T800 325 L800 470 L0 470Z" fill="#78bd72"/>
  <path d="M0 390 Q130 350 270 390 T530 390 T800 380 L800 470 L0 470Z" fill="#4d9a63"/>
  <path d="M0 455 L800 455 L800 600 L0 600Z" fill="url(#road)"/>
  <path d="M0 510 L800 510" stroke="#f5d76e" stroke-width="8" stroke-dasharray="55 35" opacity=".85"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="35" font-weight="900" fill="#143b55">
    THE GREAT PELICYCLE
  </text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="18" font-weight="700" fill="#24566e">
    “Why pedal when you can dramatically wing it?”
  </text>

