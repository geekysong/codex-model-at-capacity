<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon of an oversized pelican proudly riding a tiny bicycle.</desc>
  <style>
    .wheel { animation: spin 1.4s linear infinite; transform-origin: center; }
    .pelican { animation: bob .7s ease-in-out infinite alternate; transform-origin: 410px 365px; }
    .leg-a { animation: pedalA 1.4s linear infinite; transform-origin: 425px 407px; }
    .leg-b { animation: pedalB 1.4s linear infinite; transform-origin: 425px 407px; }
    .dust { animation: puff 1.4s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(28deg); } }
    @keyframes pedalB { 50% { transform: rotate(-28deg); } }
    @keyframes puff { 0% { opacity:0; transform:translate(0,0) scale(.5) } 30% { opacity:.8 } 100% { opacity:0; transform:translate(-30px,-13px) scale(1.4) } }
    text { font-family: Arial, Helvetica, sans-serif; }
  </style>

