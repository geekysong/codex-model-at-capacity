  <text x="400" y="61" text-anchor="middle" font-size="39" font-weight="900" fill="#26334d" stroke="#fff" stroke-width="5" paint-order="stroke">PELICAN PEDALS TO GLORY!</text>
  <text x="400" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#38465d">“Finally, a transport policy with a big enough pouch.”</text>

