      .wheel{animation:spin 1.25s linear infinite;transform-box:fill-box;transform-origin:center}
      .bob{animation:bob .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      .pedal{animation:pedal .8s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-7px) rotate(-1deg)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
    </style>
