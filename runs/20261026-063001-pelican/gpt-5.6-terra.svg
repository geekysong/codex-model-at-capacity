<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN TOUR DE SNACKS</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle with an absurdly oversized beak basket.</desc>
  <defs>
