<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pedal to the Pelican</title>
  <desc id="desc">A smug pelican rides a bicycle, proudly carrying a tiny fish and a very large parking ticket.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { fill: none; stroke: #263746; stroke-width: 9; }
      .spoke { stroke: #526575; stroke-width: 2; }
      .frame { fill: none; stroke: #e45e43; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .ink { stroke: #263746; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #263746; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="wheel">
      <circle class="wheel" r="65"/>
      <circle fill="#fffdf5" stroke="#263746" stroke-width="3" r="7"/>
      <g class="spokes">
        <path class="spoke" d="M0-7V-61 M0 7V61 M-7 0H-61 M7 0H61 M-5-5L-43-43 M5 5L43 43 M5-5L43-43 M-5 5L-43 43"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#f9e9bd"/>
  <path d="M0 400 Q130 385 260 400 T520 400 T800 394V505H0Z" fill="#a9d6b6"/>
  <path d="M0 422 Q150 407 300 422 T600 420 T800 415" fill="none" stroke="#77b994" stroke-width="4"/>

  <text id="title" x="400" y="54" text-anchor="middle" font-size="34" font-weight="900" fill="#263746">PEDAL TO THE PELICAN</text>
  <text x="400" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#526575">He’s going places. Mostly wherever the fish are.</text>

  <!-- Clouds and a little roadside audience -->
  <g fill="#fff8e7" opacity=".9">
    <path d="M92 139c-1-14 21-21 31-9 6-18 36-17 39 3 19-2 23 23 6 27H104c-18 0-24-15-12-21z"/>
    <path d="M647 132c1-12 18-17 26-7 6-14 29-12 31 4 16-2 19 19 5 21h-52c-15 0-20-13-10-18z"/>
  </g>
  <g transform="translate(684 348)">
    <path d="M0 45v-32" stroke="#263746" stroke-width="5"/>
    <circle cx="0" cy="0" r="13" fill="#f4b35e" stroke="#263746" stroke-width="3"/>
    <path d="M-8-3q8-7 16 0M-5 6q5 5 10 0" fill="none" stroke="#263746" stroke-width="2"/>
    <path d="M-19 48q19-20 38 0" fill="#7161a8" stroke="#263746" stroke-width="3"/>
    <text x="0" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#263746">WOW.</text>
  </g>

  <!-- Bicycle wheels -->
  <g transform="translate(245 373)"><use href="#wheel"/></g>
  <g transform="translate(555 373)"><use href="#wheel"/></g>

  <!-- Frame -->
  <path class="frame" d="M245 373L348 373 410 278 470 373 348 373 410 278 555 373"/>
  <path class="frame" d="M470 373L555 373"/>
  <path class="fine" d="M470 373l-10-102"/>
  <path class="fine" d="M445 268h51"/>
  <path class="fine" d="M338 358h49"/>
  <path class="fine" d="M410 278l-27-8"/>
  <circle cx="348" cy="373" r="15" fill="#f4bd49" stroke="#263746" stroke-width="4"/>
  <path d="M348 373l31-24m-31 24 25 29" fill="none" stroke="#263746" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(348 373)">
    <path d="M-13-5h26" stroke="#263746" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M327 245h73q12 0 12 9t-12 9h-73q-12 0-12-9t12-9z" fill="#263746"/>
  <path d="M457 265q15-10 31 0" fill="none" stroke="#263746" stroke-width="6" stroke-linecap="round"/>

  <!-- Basket -->
  <path d="M485 211h83l-9 49h-65z" fill="#e7aa52" stroke="#263746" stroke-width="4"/>
  <path d="M490 223h75M488 238h72M501 212l5 47m21-47v47m21-47-4 47" stroke="#bd7838" stroke-width="3"/>
  <path d="M503 211q12-22 24 0q10-18 20 0" fill="#79a85b" stroke="#263746" stroke-width="3"/>
  <path d="M520 210q-3-11 8-15" fill="none" stroke="#263746" stroke-width="3"/>

  <!-- Pelican bobbing rider -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.1s" repeatCount="indefinite"/>
    <!-- tail and body -->
    <path d="M414 180q-42-18-63 14 23-4 34 13-22 4-24 20 37-2 65-22z" fill="#fffdf5" class="ink"/>
    <ellipse cx="434" cy="205" rx="58" ry="48" fill="#fffdf5" class="ink"/>
    <path d="M397 210q36-5 56 31-27 12-51-6" fill="#d9e9e8" stroke="#263746" stroke-width="3"/>
    <!-- neck -->
    <path d="M459 202q2-52 35-78l24 14q-28 27-23 71" fill="#fffdf5" class="ink"/>
    <path d="M481 136q13-14 28-3" fill="none" stroke="#d9e9e8" stroke-width="8"/>
    <!-- head -->
    <ellipse cx="507" cy="117" rx="35" ry="29" fill="#fffdf5" class="ink"/>
    <path d="M478 124q35-12 68 2-21 29-55 19-12-4-13-21z" fill="#f2b84b" stroke="#263746" stroke-width="4"/>
    <path d="M486 138q25 2 48-8" fill="none" stroke="#c97c35" stroke-width="3"/>
    <circle cx="516" cy="109" r="5" fill="#263746"/>
    <path d="M522 95q7-13 15-4" fill="none" stroke="#263746" stroke-width="3"/>
    <!-- necktie -->
    <path d="M469 174l15-8 11 12-10 11-8-6-11 2z" fill="#e45e43" stroke="#263746" stroke-width="3"/>
    <!-- wing -->
    <path d="M408 191q30-23 57 0-12 29-43 27" fill="#f1f3eb" stroke="#263746" stroke-width="3"/>
    <path d="M419 201q17-7 31 1" fill="none" stroke="#9aaeb1" stroke-width="2"/>
    <!-- handlebars grip -->
    <path d="M456 263q18-8 35 1" fill="none" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
    <!-- legs pedaling -->
    <path d="M423 235l-31 48 19 22" fill="none" stroke="#f2b84b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M423 235l-31 48 19 22;M423 235l-10 59-2 24;M423 235l-31 48 19 22" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M455 237l20 44-27 14" fill="none" stroke="#f2b84b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M455 237l20 44-27 14;M455 237l-25 35-22 5;M455 237l20 44-27 14" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M410 305l13 2m-18-4 8 10m48-20-11 7" stroke="#263746" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- The joke -->
  <path d="M92 238q0-17 18-17h155q18 0 18 17v67q0 17-18 17h-68l-21 18 3-18h-69q-18 0-18-17z" fill="#fffdf5" stroke="#263746" stroke-width="3"/>
  <text x="171" y="250" text-anchor="middle" font-size="15" font-weight="800" fill="#263746">“I’m on a seafood</text>
  <text x="171" y="271" text-anchor="middle" font-size="15" font-weight="800" fill="#263746">diet. I see fish,</text>
  <text x="171" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#263746">I pedal faster!”</text>
  <path d="M284 248q17-9 31 1" fill="none" stroke="#263746" stroke-width="3" stroke-linecap="round"/>
  <path d="M299 240l4 9-9 1" fill="#263746"/>

  <!-- Road sign -->
  <path d="M107 343v55" stroke="#263746" stroke-width="5"/>
  <path d="M72 322h93v44H72z" fill="#f2b84b" stroke="#263746" stroke-width="4"/>
  <text x="118" y="341" text-anchor="middle" font-size="12" font-weight="900" fill="#263746">BIKE LANE</text>
  <text x="118" y="357" text-anchor="middle" font-size="11" font-weight="800" fill="#263746">FISH EXIT →</text>

  <!-- Footer, clear of the scene -->
  <rect x="0" y="505" width="800" height="95" fill="#263746"/>
  <text x="400" y="535" text-anchor="middle" font-size="14" font-weight="700" fill="#fffdf5">One bird. Two wheels. Absolutely no license.</text>
  <path d="M150 550h500" stroke="#71828b" stroke-width="1"/>
  <text x="400" y="579" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf5">2026-10-26 06:32:24 SGT (UTC+08:00)</text>
</svg>