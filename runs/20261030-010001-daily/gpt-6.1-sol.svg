<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>City street map with an eight-segment shortest route from A1 to E5</title>
  <desc>A five-by-five intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172033">City Streets: A1 to E5</text>

  <g stroke="#d4d9e0" stroke-width="4" fill="none">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <path d="M100 60H500V300" fill="none" stroke="#1565d8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <g fill="#64748b">
    <circle cx="100" cy="60" r="4"/><circle cx="200" cy="60" r="4"/><circle cx="300" cy="60" r="4"/><circle cx="400" cy="60" r="4"/><circle cx="500" cy="60" r="4"/>
    <circle cx="100" cy="120" r="4"/><circle cx="200" cy="120" r="4"/><circle cx="300" cy="120" r="4"/><circle cx="400" cy="120" r="4"/><circle cx="500" cy="120" r="4"/>
    <circle cx="100" cy="180" r="4"/><circle cx="200" cy="180" r="4"/><circle cx="300" cy="180" r="4"/><circle cx="400" cy="180" r="4"/><circle cx="500" cy="180" r="4"/>
    <circle cx="100" cy="240" r="4"/><circle cx="200" cy="240" r="4"/><circle cx="300" cy="240" r="4"/><circle cx="400" cy="240" r="4"/><circle cx="500" cy="240" r="4"/>
    <circle cx="100" cy="300" r="4"/><circle cx="200" cy="300" r="4"/><circle cx="300" cy="300" r="4"/><circle cx="400" cy="300" r="4"/><circle cx="500" cy="300" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M192 112L208 128 M208 112L192 128"/>
    <path d="M292 172L308 188 M308 172L292 188"/>
    <path d="M392 232L408 248 M408 232L392 248"/>
  </g>

  <circle cx="100" cy="60" r="8" fill="#16a34a" stroke="white" stroke-width="2"/>
  <circle cx="500" cy="300" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="110" y="48">A1 · Start</text>
    <text x="210" y="48">B1</text>
    <text x="310" y="48">C1</text>
    <text x="410" y="48">D1</text>
    <text x="510" y="48">E1</text>

    <text x="110" y="108">A2</text>
    <text x="210" y="108">B2</text>
    <text x="310" y="108">C2</text>
    <text x="410" y="108">D2</text>
    <text x="510" y="108">E2</text>

    <text x="110" y="168">A3</text>
    <text x="210" y="168">B3</text>
    <text x="310" y="168">C3</text>
    <text x="410" y="168">D3</text>
    <text x="510" y="168">E3</text>

    <text x="110" y="228">A4</text>
    <text x="210" y="228">B4</text>
    <text x="310" y="228">C4</text>
    <text x="410" y="228">D4</text>
    <text x="510" y="228">E4</text>

    <text x="110" y="288">A5</text>
    <text x="210" y="288">B5</text>
    <text x="310" y="288">C5</text>
    <text x="410" y="288">D5</text>
    <text x="510" y="288">E5 · End</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14">
    <text x="300" y="332" text-anchor="middle" fill="#1565d8" font-weight="bold">Shortest route: 8 street segments</text>
    <text x="300" y="353" text-anchor="middle" fill="#b91c1c">Red X = blocked intersection</text>
  </g>

  <path d="M30 366H570" stroke="#d4d9e0"/>
  <text x="300" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 01:03:49 SGT (UTC+08:00)</text>
</svg>