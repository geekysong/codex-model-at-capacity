<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street route from A1 to E5</title>
  <desc id="desc">A five by five grid of intersections. The blue route travels along the top row from A1 to E1, then down to E5, avoiding blocked intersections B2, C3, and D4. The route uses eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">City street route</text>

  <g stroke="#b9c3cf" stroke-width="4" stroke-linecap="round">
    <path d="M120 65H480 M120 125H480 M120 185H480 M120 245H480 M120 305H480"/>
    <path d="M120 65V305 M210 65V305 M300 65V305 M390 65V305 M480 65V305"/>
  </g>

  <path d="M120 65H480V305" fill="none" stroke="#1671d9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#fff" stroke="#64748b" stroke-width="2">
    <circle cx="210" cy="65" r="5"/><circle cx="300" cy="65" r="5"/><circle cx="390" cy="65" r="5"/><circle cx="480" cy="65" r="5"/>
    <circle cx="120" cy="125" r="5"/><circle cx="300" cy="125" r="5"/><circle cx="390" cy="125" r="5"/><circle cx="480" cy="125" r="5"/>
    <circle cx="120" cy="185" r="5"/><circle cx="210" cy="185" r="5"/><circle cx="390" cy="185" r="5"/><circle cx="480" cy="185" r="5"/>
    <circle cx="120" cy="245" r="5"/><circle cx="210" cy="245" r="5"/><circle cx="300" cy="245" r="5"/><circle cx="480" cy="245" r="5"/>
    <circle cx="120" cy="305" r="5"/><circle cx="210" cy="305" r="5"/><circle cx="300" cy="305" r="5"/><circle cx="390" cy="305" r="5"/>
  </g>

  <g stroke="#d52c36" stroke-width="4" stroke-linecap="round">
    <path d="M203 118l14 14 M217 118l-14 14"/>
    <path d="M293 178l14 14 M307 178l-14 14"/>
    <path d="M383 238l14 14 M397 238l-14 14"/>
  </g>

  <circle cx="120" cy="65" r="9" fill="#16834a" stroke="#fff" stroke-width="2"/>
  <circle cx="480" cy="305" r="9" fill="#7c3aed" stroke="#fff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#263449">
    <text x="120" y="53" text-anchor="middle">A1</text><text x="210" y="53" text-anchor="middle">B1</text><text x="300" y="53" text-anchor="middle">C1</text><text x="390" y="53" text-anchor="middle">D1</text><text x="480" y="53" text-anchor="middle">E1</text>
    <text x="120" y="113" text-anchor="middle">A2</text><text x="210" y="113" text-anchor="middle">B2</text><text x="300" y="113" text-anchor="middle">C2</text><text x="390" y="113" text-anchor="middle">D2</text><text x="480" y="113" text-anchor="middle">E2</text>
    <text x="120" y="173" text-anchor="middle">A3</text><text x="210" y="173" text-anchor="middle">B3</text><text x="300" y="173" text-anchor="middle">C3</text><text x="390" y="173" text-anchor="middle">D3</text><text x="480" y="173" text-anchor="middle">E3</text>
    <text x="120" y="233" text-anchor="middle">A4</text><text x="210" y="233" text-anchor="middle">B4</text><text x="300" y="233" text-anchor="middle">C4</text><text x="390" y="233" text-anchor="middle">D4</text><text x="480" y="233" text-anchor="middle">E4</text>
    <text x="120" y="293" text-anchor="middle">A5</text><text x="210" y="293" text-anchor="middle">B5</text><text x="300" y="293" text-anchor="middle">C5</text><text x="390" y="293" text-anchor="middle">D5</text><text x="480" y="293" text-anchor="middle">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="105" y="69" text-anchor="end" fill="#16834a">Start</text>
    <text x="495" y="309" fill="#7c3aed">End</text>
  </g>

  <text x="300" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#165cae">Route: 8 street segments</text>
  <line x1="35" y1="357" x2="565" y2="357" stroke="#d7dee7"/>
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#46556a">2026-10-30 01:04:22 SGT (UTC+08:00)</text>
