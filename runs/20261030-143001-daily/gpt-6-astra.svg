<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid: shortest route from A1 to E5</title>
  <desc id="desc">An eight-segment route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, avoiding blocked intersections B2, C3, and D4.</desc>

  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">City Grid · A1 to E5</text>

  <!-- Streets -->
  <g stroke="#cbd5e1" stroke-width="8" stroke-linecap="round">
    <path d="M120 70H480 M120 130H480 M120 190H480 M120 250H480 M120 310H480"/>
    <path d="M120 70V310 M210 70V310 M300 70V310 M390 70V310 M480 70V310"/>
  </g>

  <!-- Shortest route: four segments east, four segments south -->
  <path d="M120 70H480V310" fill="none" stroke="#2563eb" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Intersections -->
  <g fill="#ffffff" stroke="#64748b" stroke-width="2">
    <circle cx="120" cy="70" r="5"/><circle cx="210" cy="70" r="5"/><circle cx="300" cy="70" r="5"/><circle cx="390" cy="70" r="5"/><circle cx="480" cy="70" r="5"/>
    <circle cx="120" cy="130" r="5"/><circle cx="300" cy="130" r="5"/><circle cx="390" cy="130" r="5"/><circle cx="480" cy="130" r="5"/>
    <circle cx="120" cy="190" r="5"/><circle cx="210" cy="190" r="5"/><circle cx="390" cy="190" r="5"/><circle cx="480" cy="190" r="5"/>
    <circle cx="120" cy="250" r="5"/><circle cx="210" cy="250" r="5"/><circle cx="300" cy="250" r="5"/><circle cx="480" cy="250" r="5"/>
    <circle cx="120" cy="310" r="5"/><circle cx="210" cy="310" r="5"/><circle cx="300" cy="310" r="5"/><circle cx="390" cy="310" r="5"/><circle cx="480" cy="310" r="5"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M202 122L218 138 M218 122L202 138"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M382 242L398 258 M398 242L382 258"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e293b" text-anchor="middle">
    <text x="120" y="55">A1</text><text x="210" y="55">B1</text><text x="300" y="55">C1</text><text x="390" y="55">D1</text><text x="480" y="55">E1</text>
    <text x="120" y="115">A2</text><text x="210" y="115">B2</text><text x="300" y="115">C2</text><text x="390" y="115">D2</text><text x="480" y="115">E2</text>
    <text x="120" y="175">A3</text><text x="210" y="175">B3</text><text x="300" y="175">C3</text><text x="390" y="175">D3</text><text x="480" y="175">E3</text>
    <text x="120" y="235">A4</text><text x="210" y="235">B4</text><text x="300" y="235">C4</text><text x="390" y="235">D4</text><text x="480" y="235">E4</text>
    <text x="120" y="295">A5</text><text x="210" y="295">B5</text><text x="300" y="295">C5</text><text x="390" y="295">D5</text><text x="480" y="295">E5</text>
  </g>

  <!-- Start and end markers -->
  <circle cx="120" cy="70" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="480" cy="310" r="8" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <text x="98" y="75" text-anchor="end" fill="#15803d">START</text>
    <text x="500" y="315" fill="#6d28d9">END</text>
  </g>

  <!-- Separate footer -->
  <path d="M24 333H576" stroke="#cbd5e1"/>
  <text x="300" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">Shortest route: 8 street segments</text>
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 14:33:46 SGT (UTC+08:00)</text>
</svg>