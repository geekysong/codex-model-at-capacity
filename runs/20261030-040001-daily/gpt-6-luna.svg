<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down city street grid with a shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4">
  <rect width="600" height="400" fill="#f7f5ef"/>
  <text x="300" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263445">CITY BLOCK ROUTE</text>

  <!-- Streets -->
  <g stroke="#aab3bb" stroke-width="3" stroke-linecap="round">
    <path d="M90 70H410 M90 130H410 M90 190H410 M90 250H410 M90 310H410"/>
    <path d="M90 70V310 M170 70V310 M250 70V310 M330 70V310 M410 70V310"/>
  </g>

  <!-- Shortest route: 8 street segments -->
  <path d="M90 70H170 V130 H250 V190 H330 V250 H410 V310"
        fill="none" stroke="#1673e6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#475569" stroke-width="2">
    <circle cx="90" cy="70" r="7"/><circle cx="170" cy="70" r="7"/><circle cx="250" cy="70" r="7"/><circle cx="330" cy="70" r="7"/><circle cx="410" cy="70" r="7"/>
    <circle cx="90" cy="130" r="7"/><circle cx="170" cy="130" r="7"/><circle cx="250" cy="130" r="7"/><circle cx="330" cy="130" r="7"/><circle cx="410" cy="130" r="7"/>
    <circle cx="90" cy="190" r="7"/><circle cx="170" cy="190" r="7"/><circle cx="250" cy="190" r="7"/><circle cx="330" cy="190" r="7"/><circle cx="410" cy="190" r="7"/>
    <circle cx="90" cy="250" r="7"/><circle cx="170" cy="250" r="7"/><circle cx="250" cy="250" r="7"/><circle cx="330" cy="250" r="7"/><circle cx="410" cy="250" r="7"/>
    <circle cx="90" cy="310" r="7"/><circle cx="170" cy="310" r="7"/><circle cx="250" cy="310" r="7"/><circle cx="330" cy="310" r="7"/><circle cx="410" cy="310" r="7"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M163 123l14 14m0-14l-14 14"/>
    <path d="M243 183l14 14m0-14l-14 14"/>
    <path d="M323 243l14 14m0-14l-14 14"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="90" cy="70" r="11" fill="#16a34a" stroke="#fff" stroke-width="3"/>
  <text x="90" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#166534">START A1</text>
  <circle cx="410" cy="310" r="11" fill="#7c3aed" stroke="#fff" stroke-width="3"/>
  <text x="410" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#6d28d9">END E5</text>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
    <text x="90" y="91">A1</text><text x="170" y="91">B1</text><text x="250" y="91">C1</text><text x="330" y="91">D1</text><text x="410" y="91">E1</text>
    <text x="90" y="151">A2</text><text x="170" y="151">B2</text><text x="250" y="151">C2</text><text x="330" y="151">D2</text><text x="410" y="151">E2</text>
    <text x="90" y="211">A3</text><text x="170" y="211">B3</text><text x="250" y="211">C3</text><text x="330" y="211">D3</text><text x="410" y="211">E3</text>
    <text x="90" y="271">A4</text><text x="170" y="271">B4</text><text x="250" y="271">C4</text><text x="330" y="271">D4</text><text x="410" y="271">E4</text>
    <text x="90" y="331">A5</text><text x="170" y="331">B5</text><text x="250" y="331">C5</text><text x="330" y="331">D5</text><text x="410" y="331">E5</text>
  </g>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#263445">
    <path d="M455 112h35" stroke="#1673e6" stroke-width="6" stroke-linecap="round"/>
    <text x="500" y="117">Route</text>
    <path d="M465 142l14 14m0-14l-14 14" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>
    <text x="490" y="154">Blocked</text>
    <text x="455" y="205" font-weight="700">Total: 8 street segments</text>
  </g>

  <line x1="30" y1="360" x2="570" y2="360" stroke="#d4d8dc" stroke-width="1"/>
  <text x="300" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 04:03:58 SGT (UTC+08:00)</text>
</svg>