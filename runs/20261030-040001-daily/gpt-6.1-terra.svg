<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street route from A1 to E5</title>
  <desc id="desc">A five-by-five grid of labeled intersections. A blue route follows the top row and rightmost column from A1 to E5, avoiding blocked intersections B2, C3, and D4. The route has eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172033">City Street Route</text>

  <!-- City blocks -->
  <g fill="#e5eaf0" stroke="#d3dae3" stroke-width="1">
    <rect x="157" y="73" width="56" height="31" rx="3"/>
    <rect x="237" y="73" width="56" height="31" rx="3"/>
    <rect x="317" y="73" width="56" height="31" rx="3"/>
    <rect x="397" y="73" width="56" height="31" rx="3"/>
    <rect x="157" y="128" width="56" height="31" rx="3"/>
    <rect x="237" y="128" width="56" height="31" rx="3"/>
    <rect x="317" y="128" width="56" height="31" rx="3"/>
    <rect x="397" y="128" width="56" height="31" rx="3"/>
    <rect x="157" y="183" width="56" height="31" rx="3"/>
    <rect x="237" y="183" width="56" height="31" rx="3"/>
    <rect x="317" y="183" width="56" height="31" rx="3"/>
    <rect x="397" y="183" width="56" height="31" rx="3"/>
    <rect x="157" y="238" width="56" height="31" rx="3"/>
    <rect x="237" y="238" width="56" height="31" rx="3"/>
    <rect x="317" y="238" width="56" height="31" rx="3"/>
    <rect x="397" y="238" width="56" height="31" rx="3"/>
  </g>

  <!-- Streets -->
  <g stroke="#8794a5" stroke-width="3" stroke-linecap="round">
    <path d="M145 61H465 M145 116H465 M145 171H465 M145 226H465 M145 281H465"/>
    <path d="M145 61V281 M225 61V281 M305 61V281 M385 61V281 M465 61V281"/>
  </g>

  <!-- Shortest route: four segments east, then four south -->
  <path d="M145 61H465V281" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersection markers -->
  <g fill="#fff" stroke="#526174" stroke-width="1.5">
    <circle cx="145" cy="61" r="4"/><circle cx="225" cy="61" r="4"/><circle cx="305" cy="61" r="4"/><circle cx="385" cy="61" r="4"/><circle cx="465" cy="61" r="4"/>
    <circle cx="145" cy="116" r="4"/><circle cx="225" cy="116" r="4"/><circle cx="305" cy="116" r="4"/><circle cx="385" cy="116" r="4"/><circle cx="465" cy="116" r="4"/>
    <circle cx="145" cy="171" r="4"/><circle cx="225" cy="171" r="4"/><circle cx="305" cy="171" r="4"/><circle cx="385" cy="171" r="4"/><circle cx="465" cy="171" r="4"/>
    <circle cx="145" cy="226" r="4"/><circle cx="225" cy="226" r="4"/><circle cx="305" cy="226" r="4"/><circle cx="385" cy="226" r="4"/><circle cx="465" cy="226" r="4"/>
    <circle cx="145" cy="281" r="4"/><circle cx="225" cy="281" r="4"/><circle cx="305" cy="281" r="4"/><circle cx="385" cy="281" r="4"/><circle cx="465" cy="281" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M218 109L232 123 M232 109L218 123"/>
    <path d="M298 164L312 178 M312 164L298 178"/>
    <path d="M378 219L392 233 M392 219L378 233"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#273447">
    <text x="153" y="54">A1</text><text x="233" y="54">B1</text><text x="313" y="54">C1</text><text x="393" y="54">D1</text><text x="473" y="54">E1</text>
    <text x="153" y="109">A2</text><text x="237" y="109">B2</text><text x="313" y="109">C2</text><text x="393" y="109">D2</text><text x="473" y="109">E2</text>
    <text x="153" y="164">A3</text><text x="233" y="164">B3</text><text x="317" y="164">C3</text><text x="393" y="164">D3</text><text x="473" y="164">E3</text>
    <text x="153" y="219">A4</text><text x="233" y="219">B4</text><text x="313" y="219">C4</text><text x="397" y="219">D4</text><text x="473" y="219">E4</text>
    <text x="153" y="274">A5</text><text x="233" y="274">B5</text><text x="313" y="274">C5</text><text x="393" y="274">D5</text><text x="473" y="274">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    <text x="106" y="65" text-anchor="end" fill="#1d4ed8">Start</text>
    <text x="482" y="295" fill="#1d4ed8">End</text>
  </g>
  <text x="300" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">Route: 8 street segments</text>
  <path d="M35 349H565" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">2026-10-30 04:04:12 SGT (UTC+08:00)</text>
</svg>