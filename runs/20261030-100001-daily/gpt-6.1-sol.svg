    <circle cx="100" cy="125" r="5"/><circle cx="300" cy="125" r="5"/><circle cx="400" cy="125" r="5"/><circle cx="500" cy="125" r="5"/>
    <circle cx="100" cy="185" r="5"/><circle cx="200" cy="185" r="5"/><circle cx="400" cy="185" r="5"/><circle cx="500" cy="185" r="5"/>
    <circle cx="100" cy="245" r="5"/><circle cx="200" cy="245" r="5"/><circle cx="300" cy="245" r="5"/><circle cx="500" cy="245" r="5"/>
    <circle cx="100" cy="305" r="5"/><circle cx="200" cy="305" r="5"/><circle cx="300" cy="305" r="5"/><circle cx="400" cy="305" r="5"/>
  </g>

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 117L208 133 M208 117L192 133"/>
    <path d="M292 177L308 193 M308 177L292 193"/>
    <path d="M392 237L408 253 M408 237L392 253"/>
