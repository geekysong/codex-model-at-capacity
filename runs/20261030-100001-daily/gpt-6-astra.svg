<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest street route from A1 to E5</title>
  <desc id="desc">A five-column, five-row street grid. The blue route follows A1 to E1, then E1 to E5, covering eight street segments and avoiding blocked intersections B2, C3, and D4.</desc>

  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033">City Street Map</text>

  <!-- City blocks and streets -->
  <rect x="100" y="60" width="400" height="240" fill="#e2e8f0"/>
  <g stroke="#ffffff" stroke-width="16">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <!-- Shortest route: four segments east, four segments south -->
  <path d="M100 60H500V300" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#475569">
    <circle cx="200" cy="60" r="4"/><circle cx="300" cy="60" r="4"/><circle cx="400" cy="60" r="4"/><circle cx="500" cy="60" r="4"/>
    <circle cx="100" cy="120" r="4"/><circle cx="300" cy="120" r="4"/><circle cx="400" cy="120" r="4"/><circle cx="500" cy="120" r="4"/>
    <circle cx="100" cy="180" r="4"/><circle cx="200" cy="180" r="4"/><circle cx="400" cy="180" r="4"/><circle cx="500" cy="180" r="4"/>
    <circle cx="100" cy="240" r="4"/><circle cx="200" cy="240" r="4"/><circle cx="300" cy="240" r="4"/><circle cx="500" cy="240" r="4"/>
    <circle cx="100" cy="300" r="4"/><circle cx="200" cy="300" r="4"/><circle cx="300" cy="300" r="4"/><circle cx="400" cy="300" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 113L207 127 M207 113L193 127"/>
    <path d="M293 173L307 187 M307 173L293 187"/>
    <path d="M393 233L407 247 M407 233L393 247"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#172033">
    <text x="100" y="46">A1</text><text x="200" y="46">B1</text><text x="300" y="46">C1</text><text x="400" y="46">D1</text><text x="500" y="46">E1</text>
    <text x="100" y="106">A2</text><text x="200" y="106">B2</text><text x="300" y="106">C2</text><text x="400" y="106">D2</text><text x="500" y="106">E2</text>
    <text x="100" y="166">A3</text><text x="200" y="166">B3</text><text x="300" y="166">C3</text><text x="400" y="166">D3</text><text x="500" y="166">E3</text>
    <text x="100" y="226">A4</text><text x="200" y="226">B4</text><text x="300" y="226">C4</text><text x="400" y="226">D4</text><text x="500" y="226">E4</text>
    <text x="100" y="286">A5</text><text x="200" y="286">B5</text><text x="300" y="286">C5</text><text x="400" y="286">D5</text><text x="500" y="286">E5</text>
  </g>

  <circle cx="100" cy="60" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="300" r="7" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    <text x="81" y="65" text-anchor="end" fill="#15803d">START</text>
    <text x="518" y="305" fill="#6d28d9">END</text>
  </g>

  <text x="300" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">Shortest route: 8 street segments</text>

  <path d="M24 351H576" stroke="#cbd5e1"/>
  <text x="300" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-10-30 10:03:18 SGT (UTC+08:00)</text>
</svg>