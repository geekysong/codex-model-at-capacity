<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A proud pelican pedals a bicycle with a fish tucked into its enormous bill pouch. The wheels spin, the pedals turn, and the bird bobs along.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="0.7" fill="#dfd4b9" opacity=".35"/>
      <circle cx="14" cy="16" r=".6" fill="#dfd4b9" opacity=".3"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fff9e7" stroke="#243b43" stroke-width="10"/>
      <circle r="68" fill="none" stroke="#d8b988" stroke-width="3"/>
      <g stroke="#728b8b" stroke-width="2">
        <path d="M-67 0H67M0-67V67M-47-47 47 47M-47 47 47-47"/>
        <path d="m-62-26 124 52m-88 36 52-124m-88 88 124-52m-88-36 52 124"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#edaa41" stroke="#243b43" stroke-width="4"/>
    </g>
  </defs>

  <path fill="#fff5dc" d="M0 0h800v600H0z"/>
  <path fill="url(#paper)" d="M0 0h800v600H0z"/>
  <circle cx="688" cy="155" r="48" fill="#f6cd69" opacity=".6"/>
  <path d="M0 449q95-28 190-4t201-5 207 4 202-12v75H0Z" fill="#dce6cc"/>
  <path d="M0 478h800" stroke="#243b43" stroke-width="3"/>
  <ellipse cx="398" cy="481" rx="240" ry="12" fill="#243b43" opacity=".09"/>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" letter-spacing="3" fill="#243b43">TOUR DE BEAK</text>
  <path d="M245 82h310" stroke="#df6543" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#617474">THE COMMUTE HAS GONE FOWL.</text>

  <!-- One very determined coastal commuter. -->
  <g stroke="#243b43" stroke-linecap="round" stroke-linejoin="round">
    <path d="M116 348H74m50 24H92m37 24H61" fill="none" stroke-width="4"/>
    <use href="#wheel" x="249" y="399"/>
    <use href="#wheel" x="566" y="399"/>

    <g fill="none" stroke-width="9">
      <path d="m249 399 78-119 73 119H249l203-119H327" stroke="#df6543"/>
      <path d="m400 399 52-119 114 119" stroke="#df6543"/>
      <path d="m566 399-55-169" stroke="#243b43"/>
      <path d="m511 230 29-18 20 5" stroke="#243b43" stroke-width="7"/>
      <path d="m327 280-12-33" stroke-width="7"/>
    </g>
    <path d="M292 245q14-12 48-5l4 10h-51Z" fill="#243b43" stroke-width="4"/>

    <circle cx="400" cy="399" r="23" fill="#fff5dc" stroke-width="5"/>
    <circle cx="400" cy="399" r="14" fill="#b4c6b8" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 399" to="360 400 399" dur="1.5s" repeatCount="indefinite"/>
      <path d="M377 379 423 419" stroke-width="5"/>
      <path d="M367 379h20m26 40h20" stroke-width="7"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".75s" repeatCount="indefinite"/>
      <!-- Legs and oversized webbed feet. -->
      <path d="m359 275 12 48 44 51" fill="none" stroke="#e9a23d" stroke-width="12">
        <animate attributeName="d" values="m359 275 12 48 44 51;m359 275 30 38 13 71;m359 275 12 48 44 51" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="m415 370 22 13-37 4 6-15" fill="#efb248" stroke-width="3">
        <animateTransform attributeName="transform" type="translate" values="0 0;-12 10;0 0" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="m337 276-8 56 45 72" fill="none" stroke="#f2b448" stroke-width="13">
        <animate attributeName="d" values="m337 276-8 56 45 72;m337 276-23 65 72 47;m337 276-8 56 45 72" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="m373 397 24 17-41 3 7-18" fill="#f2b448" stroke-width="3">
        <animateTransform attributeName="transform" type="translate" values="0 0;12 -16;0 0" dur="1.5s" repeatCount="indefinite"/>
      </path>

      <!-- Tail, round body, and folded racing wing. -->
      <path d="m306 239-57-33 15 30-28-4 59 43" fill="#fffdf3" stroke-width="4"/>
      <path d="M305 205c-42 6-51 53-18 76 28 20 93 12 111-18 15-25-1-65-37-69Z" fill="#fffdf3" stroke-width="4"/>
      <path d="M298 222q48-21 79 15-9 41-59 27l-23-12 33 2-30-15 34 5" fill="#d5dfd8" stroke-width="3"/>
      <path d="M367 218c-14-33-9-60 14-76 16-10 37-3 43 14 7 23-23 39-12 68l-17 27" fill="#fffdf3" stroke-width="4"/>

      <!-- Helmet, suspicious eyebrow, and the magnificent pouch. -->
      <path d="M367 151q-4-37 29-36 28 2 34 31Z" fill="#df6543" stroke-width="4"/>
      <path d="m389 120-5 21m20-20 4 18" fill="none" stroke="#fff0cf" stroke-width="5"/>
      <path d="m420 142 17 3" stroke-width="5"/>
      <path d="M410 164q83 1 152 20-54 10-138 6c-6 39-22 49-37 35-17-18-5-38 23-61Z" fill="#f0b24e" stroke-width="4"/>
      <path d="M413 172q82 1 149 12l-139 6" fill="#ffcf66" stroke-width="3"/>
      <path d="M414 194q27 6 54-1" fill="none" stroke="#c58133" stroke-width="2"/>
      <circle cx="409" cy="157" r="5" fill="#243b43" stroke="none"/>
      <path d="m400 147 15 3" stroke-width="3"/>
      <!-- A smug passenger in the bill pouch. -->
      <path d="m423 208 13-9q20-9 31 4-12 14-30 5l-14 8Z" fill="#73aba5" stroke-width="2"/>
      <circle cx="458" cy="202" r="2" fill="#243b43" stroke="none"/>
      <path d="m443 200 4-7 8 6" fill="#73aba5" stroke-width="2"/>

      <!-- Wing gripping the handlebars. -->
      <path d="M383 233q38 19 63-1l71-12" fill="none" stroke-width="13"/>
      <path d="M383 231q38 19 63-1l70-12" fill="none" stroke="#fffdf3" stroke-width="8"/>
      <path d="m511 215 10 3-6 10" fill="none" stroke-width="3"/>
      <path d="m375 192 16 7-10 18-16-7" fill="#df6543" stroke-width="2"/>
      <path d="m370 207-33 8 24 13 20-16" fill="#df6543" stroke-width="2"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif" fill="#243b43">
    <path d="M587 250h153q14 0 14 14v57q0 14-14 14h-98l-28 19 8-19h-35q-14 0-14-14v-57q0-14 14-14Z" fill="#fffdf3" stroke="#243b43" stroke-width="3"/>
    <text x="663" y="278" text-anchor="middle" font-size="17" font-weight="700">“My lunch gets</text>
    <text x="663" y="302" text-anchor="middle" font-size="17" font-weight="700">a free ride.”</text>
    <text x="400" y="519" text-anchor="middle" font-size="22" font-weight="700">Two wheels. One bill. Zero road manners.</text>
  </g>

  <path d="M45 544h710" stroke="#cbbd9f" stroke-width="1.5"/>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#465b60">2026-10-30 16:01:20 SGT (UTC+08:00)</text>
</svg>