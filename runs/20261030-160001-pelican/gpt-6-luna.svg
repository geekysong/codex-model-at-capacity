<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A very serious pelican rides a bicycle, with a fish in its beak and a basket full of traffic tickets.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .65s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#bdefff"/>
  <path d="M0 360 Q110 330 210 358 T420 350 T650 357 T800 340 V600 H0Z" fill="#dff6d7"/>
  <path d="M0 465H800" stroke="#52636a" stroke-width="8"/>
  <path d="M0 479H800" stroke="#f8f0c6" stroke-width="4" stroke-dasharray="28 24"/>

  <text id="title" x="400" y="58" text-anchor="middle" font-size="34" font-weight="900" fill="#17324d">THE PELICAN COMMUTE</text>
  <text x="400" y="87" text-anchor="middle" font-size="17" font-weight="700" fill="#31556b">He’s late. The fish is on time.</text>

  <g fill="#fff" opacity=".8">
    <path d="M95 147c0-12 10-21 22-21 7-17 33-15 37 3 14-1 22 8 22 18H95Z"/>
    <path d="M586 130c0-10 9-18 19-18 6-15 29-13 32 3 12-1 19 7 19 15h-70Z"/>
  </g>
  <g fill="#f4a261">
    <path d="M103 397v-48h42v48h-8v-35h-26v35z"/>
    <path d="M670 398v-66h58v66h-9v-51h-40v51z"/>
  </g>
  <g fill="#fff4d8">
    <rect x="112" y="357" width="10" height="11"/><rect x="128" y="357" width="10" height="11"/>
    <rect x="681" y="343" width="12" height="13"/><rect x="704" y="343" width="12" height="13"/>
    <rect x="681" y="366" width="12" height="13"/><rect x="704" y="366" width="12" height="13"/>
  </g>

  <!-- bicycle frame -->
  <g fill="none" stroke="#d94f30" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 410L333 410L383 330L250 410"/>
    <path d="M333 410L416 410L383 330L333 410"/>
    <path d="M416 410L440 325"/>
    <path d="M426 323h39"/>
    <path d="M233 326h41"/>
    <path d="M250 410L233 326"/>
  </g>
  <g fill="none" stroke="#243746" stroke-width="5">
    <circle class="wheel" cx="250" cy="410" r="56"/>
    <circle class="wheel" cx="416" cy="410" r="56"/>
    <circle cx="333" cy="410" r="12"/>
    <path d="M333 410l-31 22m31-22 29 20" stroke-linecap="round"/>
  </g>
  <g stroke="#243746" stroke-width="5" stroke-linecap="round">
    <path d="M292 432h-18m76 18h18"/>
  </g>
  <path d="M302 320h59" stroke="#243746" stroke-width="9" stroke-linecap="round"/>
  <path d="M430 321l18-15" stroke="#243746" stroke-width="6" stroke-linecap="round"/>

  <!-- basket and ludicrous cargo -->
  <path d="M439 329h80l-12 53h-57z" fill="#f2b84b" stroke="#8c5d24" stroke-width="4"/>
  <path d="M444 341h70M441 355h74M438 369h70" stroke="#fff0bd" stroke-width="3"/>
  <path d="M454 319l7-24 22 6 8 20" fill="#fff" stroke="#345" stroke-width="3"/>
  <text x="482" y="319" text-anchor="middle" font-size="11" font-weight="900" fill="#c33">PARKING</text>
  <text x="482" y="331" text-anchor="middle" font-size="10" font-weight="900" fill="#c33">TICKET!</text>

  <!-- expressive pelican -->
  <g class="rider">
    <path d="M326 287Q333 242 373 236Q409 239 416 278L401 318Q370 330 342 310Z" fill="#fffdf4" stroke="#253b48" stroke-width="4"/>
    <path d="M350 302q21 17 43 1l-10 24h-34z" fill="#f2a9a1" stroke="#253b48" stroke-width="3"/>
    <path d="M375 321l-18 48m31-45 14 42" stroke="#253b48" stroke-width="7" stroke-linecap="round"/>
    <path d="M351 367l-16 5m67-6 16 4" stroke="#e79d28" stroke-width="6" stroke-linecap="round"/>
    <path d="M357 255Q370 211 403 220Q433 230 423 263L404 285Q388 260 357 255Z" fill="#fffdf4" stroke="#253b48" stroke-width="4"/>
    <circle cx="408" cy="240" r="5" fill="#253b48"/>
    <circle cx="410" cy="238" r="1.7" fill="#fff"/>
    <path d="M420 249Q465 250 480 269Q456 281 414 264Z" fill="#f5a623" stroke="#253b48" stroke-width="4"/>
    <path d="M453 266q13 8 23 1q-4 16-19 13z" fill="#f28c28" stroke="#253b48" stroke-width="3"/>
    <path d="M478 263q10-7 15-1q-3 7-12 8" fill="#84b85a" stroke="#253b48" stroke-width="3"/>
    <path d="M356 275l-26 38 35-8 11-22" fill="#f5a623" stroke="#253b48" stroke-width="4"/>
    <path d="M354 306l-18 14m28-18-12 20" stroke="#253b48" stroke-width="5" stroke-linecap="round"/>
    <path d="M342 312l-27 10" stroke="#253b48" stroke-width="6" stroke-linecap="round"/>
    <path d="M314 322l-12-8m12 8-10 8" stroke="#e79d28" stroke-width="4" stroke-linecap="round"/>
    <path d="M378 226l-7-17m23 14 5-18" stroke="#253b48" stroke-width="3" stroke-linecap="round"/>
    <path d="M372 208q-8-7-12 0m51-3q8-7 12 0" fill="none" stroke="#253b48" stroke-width="3"/>
    <path d="M390 264q10-11 20-2" fill="none" stroke="#253b48" stroke-width="3" stroke-linecap="round"/>
  </g>

  <path d="M535 247q17-19 32-3" fill="none" stroke="#ef7852" stroke-width="4" stroke-linecap="round"/>
  <path d="M548 226l7-11m8 13 12-7" stroke="#ef7852" stroke-width="4" stroke-linecap="round"/>
  <text x="583" y="253" font-size="15" font-weight="700" fill="#31556b">HONK!</text>

  <rect x="118" y="500" width="564" height="2" rx="1" fill="#a9c7bd"/>
  <text x="400" y="530" text-anchor="middle" font-size="16" font-weight="700" fill="#28495b">“I demand a lane—and a fish-shaped parking permit!”</text>
  <text x="400" y="576" text-anchor="middle" font-size="15" font-weight="700" fill="#17324d">2026-10-30 16:02:44 SGT (UTC+08:00)</text>
</svg>