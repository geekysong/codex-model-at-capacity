<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A smug pelican rides a bicycle with spinning wheels and gently bobs along a seaside road.</desc>
  <defs>
    <style>
      .ink { stroke: #263342; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { animation: bob 1s ease-in-out infinite; }
      .cloud { animation: drift 8s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes drift { to { transform: translateX(18px); } }
    </style>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#fff" opacity=".45"/>
    </pattern>
  </defs>

