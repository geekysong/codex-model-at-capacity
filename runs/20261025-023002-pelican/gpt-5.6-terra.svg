<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDALS TO POWER</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding an undersized bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: 50% 85%; animation: bob .58s ease-in-out infinite alternate; }
    .legA { transform-box: fill-box; transform-origin: 50% 0%; animation: pedalA 1.15s linear infinite; }
    .legB { transform-box: fill-box; transform-origin: 50% 0%; animation: pedalB 1.15s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { to { transform: rotate(360deg); } }
    @keyframes pedalB { to { transform: rotate(360deg); } }
  </style>

