    <text x="72" y="156">5</text><text x="136" y="156" font-weight="700">6</text><text x="200" y="156">7</text><text x="264" y="156">8</text>
    <text x="72" y="220">9</text><text x="136" y="220">10</text><text x="200" y="220">11</text><text x="264" y="220">12</text>
