<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827">
    Static Equilibrium
  </text>
  <text x="300" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#111827">
    6 × 2 = 4 × 3
  </text>
  <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#15803d">
    balanced
  </text>

  <!-- seesaw beam -->
  <rect x="90" y="207" width="420" height="18" rx="9" fill="#8b5e34" stroke="#4b3421" stroke-width="3"/>

  <!-- pivot -->
  <polygon points="300,225 265,290 335,290" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <circle cx="300" cy="216" r="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="300" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">pivot</text>

  <!-- hanging supports -->
  <line x1="140" y1="225" x2="140" y2="272" stroke="#1f2937" stroke-width="3"/>
  <line x1="460" y1="225" x2="460" y2="272" stroke="#1f2937" stroke-width="3"/>

  <!-- masses -->
  <rect x="105" y="272" width="70" height="48" rx="6" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
  <rect x="425" y="272" width="70" height="48" rx="6" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
  <text x="140" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">6 kg</text>
  <text x="460" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111827">4 kg</text>

  <!-- force arrows -->
  <line x1="140" y1="250" x2="140" y2="268" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="250" x2="460" y2="268" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="140" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">F = 6g</text>
  <text x="460" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">F = 4g</text>

  <!-- distance markers -->
  <line x1="140" y1="185" x2="300" y2="185" stroke="#475569" stroke-width="2"/>
  <line x1="140" y1="178" x2="140" y2="192" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="178" x2="300" y2="192" stroke="#475569" stroke-width="2"/>
  <text x="220" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#111827">2 m</text>

  <line x1="300" y1="145" x2="460" y2="145" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="138" x2="300" y2="152" stroke="#475569" stroke-width="2"/>
  <line x1="460" y1="138" x2="460" y2="152" stroke="#475569" stroke-width="2"/>
  <text x="380" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#111827">3 m (x)</text>
</svg>