<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDAL POWER</title>
  <desc id="desc">A proud pelican pedals a bicycle along a seaside road, carrying a fish in its oversized bill.</desc>
  <defs>
    <style>
      .title { font: 900 42px Georgia, serif; fill: #173f53; letter-spacing: 2px; }
      .caption { font: italic 22px Georgia, serif; fill: #173f53; }
      .footer { font: 16px sans-serif; fill: #36505a; }
      .outline { stroke: #173f53; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #50717a; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f9f1d5"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#d9f1ed" stroke="#173f53" stroke-width="4"/>
  <text class="title" x="400" y="68" text-anchor="middle">PELICAN PEDAL POWER</text>

  <circle cx="684" cy="126" r="35" fill="#ffce55"/>
  <g fill="#fffdf5" opacity=".9">
    <ellipse cx="135" cy="130" rx="56" ry="18"/>
    <ellipse cx="170" cy="120" rx="35" ry="22"/>
    <ellipse cx="500" cy="112" rx="48" ry="15"/>
    <ellipse cx="530" cy="104" rx="30" ry="20"/>
  </g>
  <path d="M20 325 Q120 305 220 325 T420 325 T620 325 T780 320 V406 H20Z" fill="#8cd1cf"/>
  <path d="M20 351 Q70 341 120 351 T220 351 T320 351 T420 351 T520 351 T620 351 T780 351" fill="none" stroke="#f9f1d5" stroke-width="4" opacity=".8"/>
  <path d="M20 408 Q180 395 350 408 T780 405 V495 H20Z" fill="#e2bf80"/>
  <path d="M20 468 H780" stroke="#c2955f" stroke-width="4" stroke-dasharray="22 18"/>

  <!-- Wheels and their spokes rotate around fixed hubs. -->
  <g transform="translate(240 397)">
    <g>
      <circle r="76" fill="#fff9e9" stroke="#173f53" stroke-width="9"/>
      <circle r="66" fill="none" stroke="#e46d4c" stroke-width="5"/>
      <g class="spoke">
        <path d="M-65 0 H65 M0 -65 V65 M-46 -46 L46 46 M-46 46 L46 -46"/>
      </g>
      <circle r="8" fill="#173f53"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(575 397)">
    <g>
      <circle r="76" fill="#fff9e9" stroke="#173f53" stroke-width="9"/>
      <circle r="66" fill="none" stroke="#e46d4c" stroke-width="5"/>
      <g class="spoke">
        <path d="M-65 0 H65 M0 -65 V65 M-46 -46 L46 46 M-46 46 L46 -46"/>
      </g>
      <circle r="8" fill="#173f53"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#df644d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 397 L330 290 L405 397 Z"/>
    <path d="M330 290 H493 L405 397"/>
    <path d="M493 290 L575 397"/>
  </g>
  <g class="outline" fill="none">
    <path d="M320 276 H353 M330 276 L335 290"/>
    <path d="M493 290 L477 260 H454"/>
    <path d="M477 260 Q488 245 505 254"/>
  </g>
  <path d="M305 273 Q328 264 355 271 L356 280 H307Z" fill="#173f53"/>

  <!-- Pedals turn with the rider's feet. -->
  <g transform="translate(405 397)">
    <g>
      <path d="M-29 0 H29" stroke="#173f53" stroke-width="6" stroke-linecap="round"/>
      <path d="M-38 0 H-20 M20 0 H38" stroke="#173f53" stroke-width="7" stroke-linecap="round"/>
      <circle r="10" fill="#f3b84b" stroke="#173f53" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Rider bobs gently above the bicycle. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M350 262 Q322 290 330 325 Q335 344 360 348 L377 332 Q359 323 370 296Z" fill="#f2ac3d" class="outline"/>
    <path d="M331 323 Q316 332 310 345 Q325 349 341 341 L356 332" fill="#f2ac3d" class="outline"/>
    <path d="M395 270 Q400 308 421 329 L438 344 Q448 351 459 345 Q457 336 444 330 L431 313 L429 279Z" fill="#f2ac3d" class="outline"/>
    <path d="M328 220 Q315 250 331 272 Q357 297 413 283 Q444 275 455 248 Q462 218 437 199 Q407 178 367 190 Q340 197 328 220Z" fill="#fffdf4" class="outline"/>
    <path d="M342 226 Q371 205 405 225 Q418 234 427 245 Q408 265 378 264 Q353 262 342 246Z" fill="#e1e5dc" class="outline"/>
    <path d="M417 241 Q440 247 459 265" fill="none" class="outline"/>
    <path d="M453 263 Q467 257 475 264" fill="none" class="outline"/>
    <path d="M333 216 Q312 200 316 172 Q320 142 349 132 Q380 122 398 144 Q411 160 405 185 L415 205" fill="#fffdf4" class="outline"/>
    <path d="M326 146 Q341 126 365 128 Q385 129 397 145" fill="none" stroke="#173f53" stroke-width="5" stroke-linecap="round"/>
    <path d="M320 164 Q283 154 222 169 Q219 176 229 182 Q272 191 320 188Z" fill="#f5ad3c" class="outline"/>
    <path d="M226 182 Q254 220 301 215 Q323 212 333 187Z" fill="#f8c85b" class="outline"/>
    <path d="M243 191 Q270 203 299 197" fill="none" stroke="#ce8534" stroke-width="3"/>
    <ellipse cx="360" cy="158" rx="14" ry="17" fill="#fff" stroke="#173f53" stroke-width="4"/>
    <circle cx="355" cy="160" r="5" fill="#173f53"/>
    <path d="M344 138 Q356 131 370 137" fill="none" stroke="#173f53" stroke-width="4" stroke-linecap="round"/>
    <!-- Fish peeking out of the pelican's pouch -->
    <path d="M269 194 Q279 183 294 190 L302 184 L301 199 L293 194 Q280 201 269 194Z" fill="#74bfc8" stroke="#173f53" stroke-width="2"/>
    <circle cx="277" cy="192" r="1.8" fill="#173f53"/>
    <path d="M371 124 L378 111 L391 126" fill="#e46d4c" stroke="#173f53" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <path d="M100 381 l24 -7 M102 398 h28 M110 415 l20 6" fill="none" stroke="#a77e55" stroke-width="4" stroke-linecap="round"/>
  <text class="caption" x="400" y="521" text-anchor="middle">His commute is a little fishy.</text>
  <path d="M55 540 H745" stroke="#9ab9b2" stroke-width="2"/>
  <text class="footer" x="400" y="566" text-anchor="middle">2026-10-31 13:02:16 SGT (UTC+08:00)</text>
</svg>