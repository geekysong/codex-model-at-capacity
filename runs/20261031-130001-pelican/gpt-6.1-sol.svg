<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Peak Beak Commuting</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish in its front basket. The wheels spin and the pelican bobs in a looping cartoon animation.</desc>
  <defs>
    <pattern id="spokes" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 20L20 0" stroke="#e9d9b5" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <circle r="75" fill="#fff7df" stroke="#263b40" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#a6bcbc" stroke-width="3"/>
      <g stroke="#789395" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#263b40"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
  <path d="M0 131Q200 108 400 132T800 124V490H0Z" fill="#dcf0e9"/>
  <circle cx="682" cy="177" r="43" fill="#ffd473"/>
  <g fill="#fffdf0">
    <path d="M51 204q-12-25 14-29q8-31 34-15q28-5 30 24q23 1 21 20Z"/>
    <path d="M519 162q-10-21 11-26q8-23 28-11q25-4 27 19q20 0 20 18Z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#243b3e" text-anchor="middle">
    <text x="400" y="59" font-size="39" font-weight="900" letter-spacing="2">PEAK BEAK COMMUTING</text>
    <text x="400" y="94" font-size="19">Zero emissions. Extremely high fish consumption.</text>
  </g>

  <path d="M0 456Q180 440 400 455T800 450V508H0Z" fill="#aac8b5"/>
  <path d="M0 485H800" stroke="#6c9384" stroke-width="3"/>
  <ellipse cx="400" cy="476" rx="244" ry="13" fill="#759a88" opacity=".25"/>

  <!-- The bicycle -->
  <use href="#wheel" x="240" y="398"/>
  <use href="#wheel" x="555" y="398"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 398L321 293L380 398ZM321 293H497L380 398M497 293L555 398" stroke="#263b40" stroke-width="13"/>
    <path d="M240 398L321 293L380 398ZM321 293H497L380 398M497 293L555 398" stroke="#f26b50" stroke-width="7"/>
    <path d="M321 293L310 273M497 293L483 251L510 234H534" stroke="#263b40" stroke-width="9"/>
    <path d="M286 272H332" stroke="#263b40" stroke-width="13"/>
    <path d="M240 398L380 398" stroke="#536c6c" stroke-width="4"/>
  </g>
  <circle cx="380" cy="398" r="22" fill="#ffe5ac" stroke="#263b40" stroke-width="5"/>

  <!-- A very fresh passenger -->
  <path d="M529 267H618L605 320H541Z" fill="#e9b763" stroke="#263b40" stroke-width="4" stroke-linejoin="round"/>
  <path d="M537 282H613M540 297H609M550 269L556 317M569 269V319M590 269L584 318" fill="none" stroke="#b47c3b" stroke-width="3"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".75s" repeatCount="indefinite"/>
    <path d="M550 263q24-33 45-7l20-13v30l-20-10q-25 19-45 0Z" fill="#70b9b3" stroke="#263b40" stroke-width="3"/>
    <circle cx="565" cy="255" r="4" fill="#fff"/>
    <circle cx="566" cy="255" r="2" fill="#263b40"/>
    <path d="M574 265q6 5 10-2" fill="none" stroke="#263b40" stroke-width="2"/>
  </g>

  <!-- The self-satisfied rider -->
  <g stroke="#263b40" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".75s" repeatCount="indefinite"/>

    <path d="M319 304Q337 331 364 352L380 398" fill="none" stroke="#df9a35" stroke-width="13">
      <animate attributeName="d" values="M319 304Q337 331 364 352L380 398;M319 304Q349 319 397 349L380 398;M319 304Q337 331 364 352L380 398" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M268 286L235 297L253 269" fill="#fffdf1" stroke-width="4"/>
    <path d="M282 223Q303 193 347 213Q378 224 380 261Q378 303 336 311Q286 317 269 285Q261 260 282 223Z" fill="#fffdf1" stroke-width="4"/>
    <path d="M292 242Q330 225 355 252Q351 282 310 282Q335 269 329 258" fill="#d8e5df" stroke-width="3"/>
    <path d="M342 230Q355 198 345 166Q338 141 358 132Q382 125 393 147Q400 165 385 194L376 242" fill="#fffdf1" stroke-width="4"/>
    <!-- Long bill and bill pouch -->
    <path d="M388 161L510 183Q461 228 395 191Z" fill="#ffc665" stroke-width="4"/>
    <path d="M390 162L515 181L392 178" fill="#f5a239" stroke-width="4"/>
    <path d="M402 186Q449 210 491 189" fill="none" stroke="#dc8f36" stroke-width="2"/>
    <circle cx="374" cy="150" r="7" fill="#fff" stroke-width="2"/>
    <circle cx="377" cy="150" r="3" fill="#263b40" stroke="none"/>
    <path d="M362 137L381 134" stroke-width="4"/>
    <!-- Aerodynamic helmet, optimistically sized -->
    <path d="M345 139Q339 112 366 109Q390 108 396 133Z" fill="#ed624c" stroke-width="4"/>
    <path d="M355 119L358 130M368 116L371 128M381 120L383 128" fill="none" stroke-width="3"/>
    <path d="M349 140L359 169L373 170" fill="none" stroke-width="3"/>
    <!-- Wing reaching the handlebars -->
    <path d="M351 241Q403 275 481 250" fill="none" stroke-width="17"/>
    <path d="M351 241Q403 275 481 250" fill="none" stroke="#fffdf1" stroke-width="10"/>
    <path d="M478 246L490 247M477 252L488 255" stroke-width="3"/>

    <path d="M332 304Q308 337 339 365L399 389" fill="none" stroke="#efa93c" stroke-width="13">
      <animate attributeName="d" values="M332 304Q308 337 339 365L399 389;M332 304Q368 328 357 366L361 409;M332 304Q308 337 339 365L399 389" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(380 398)">
    <g stroke="#263b40" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-23 0H23"/>
      <path d="M-30-4V4M30-4V4" stroke-width="9"/>
    </g>
    <circle r="5" fill="#263b40"/>
  </g>

  <!-- Roadside commentary -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <path d="M90 331V440" stroke="#637f73" stroke-width="6"/>
    <rect x="25" y="283" width="130" height="62" rx="7" fill="#fffdf1" stroke="#637f73" stroke-width="3"/>
    <text x="90" y="309" font-size="16" fill="#344f45" font-weight="bold">BIKE LANE</text>
    <text x="90" y="331" font-size="13" fill="#344f45">NO FREE LOADING</text>
    <path d="M625 353q25-17 53-4" fill="none" stroke="#789b8c" stroke-width="3"/>
    <text x="685" y="383" font-size="17" font-weight="bold" fill="#344f45" transform="rotate(-8 685 383)">HONK!</text>
  </g>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="508" width="800" height="92" fill="#243b3e"/>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="400" y="541" fill="#fff5d9" font-size="21" font-weight="bold">“My lunch gets a free ride. I get the bill.”</text>
    <text x="400" y="579" fill="#d3e6dc" font-size="17">2026-10-31 13:01:04 SGT (UTC+08:00)</text>
  </g>
</svg>