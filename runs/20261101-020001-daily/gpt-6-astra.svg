<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>5×5 Hamiltonian path — 24 moves</title>
  <desc>A serpentine path visits all 25 cells exactly once, starting at the top-left green circle and ending at the bottom-right red circle.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="30" font-size="22" font-weight="700" fill="#0f172a">Visit every cell: 24 moves</text>
    <text x="300" y="50" font-size="13" fill="#475569">25 cells · each visited exactly once</text>
  </g>

  <rect x="170" y="62" width="260" height="260" fill="white" stroke="#64748b" stroke-width="2"/>
  <path d="M222 62V322 M274 62V322 M326 62V322 M378 62V322
           M170 114H430 M170 166H430 M170 218H430 M170 270H430"
        fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <polyline points="196,88 248,88 300,88 352,88 404,88
                    404,140 352,140 300,140 248,140 196,140
                    196,192 248,192 300,192 352,192 404,192
                    404,244 352,244 300,244 248,244 196,244
                    196,296 248,296 300,296 352,296 404,296"
            fill="none" stroke="#2563eb" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="196" y="77">1</text>
    <text x="248" y="77">2</text>
    <text x="300" y="77">3</text>
    <text x="352" y="77">4</text>
    <text x="404" y="77">5</text>

    <text x="196" y="161">10</text>
    <text x="248" y="128">9</text>
    <text x="300" y="128">8</text>
    <text x="352" y="128">7</text>
    <text x="404" y="161">6</text>

    <text x="196" y="213">11</text>
    <text x="248" y="180">12</text>
    <text x="300" y="180">13</text>
    <text x="352" y="180">14</text>
    <text x="404" y="180">15</text>

    <text x="196" y="265">20</text>
    <text x="248" y="232">19</text>
    <text x="300" y="232">18</text>
    <text x="352" y="232">17</text>
    <text x="404" y="265">16</text>

    <text x="196" y="317">21</text>
    <text x="248" y="284">22</text>
    <text x="300" y="284">23</text>
    <text x="352" y="284">24</text>
    <text x="404" y="284">25</text>
  </g>

  <circle cx="196" cy="88" r="7" fill="#16a34a" stroke="white" stroke-width="2"/>
  <circle cx="404" cy="296" r="7" fill="#dc2626" stroke="white" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <circle cx="224" cy="342" r="5" fill="#16a34a"/>
    <text x="235" y="347">Start: 1</text>
    <circle cx="324" cy="342" r="5" fill="#dc2626"/>
    <text x="335" y="347">End: 25</text>
  </g>

  <path d="M30 360H570" stroke="#cbd5e1"/>
  <text x="300" y="382" font-family="Arial, sans-serif" font-size="14"
        text-anchor="middle" fill="#334155">2026-11-01 02:02:52 SGT (UTC+08:00)</text>
</svg>