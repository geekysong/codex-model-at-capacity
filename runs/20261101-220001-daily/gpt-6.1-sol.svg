  <text x="300" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Visit every cell exactly once</text>

  <rect x="175" y="65" width="250" height="250" fill="white"/>
  <path d="M175 65H425 M175 115H425 M175 165H425 M175 215H425 M175 265H425 M175 315H425
           M175 65V315 M225 65V315 M275 65V315 M325 65V315 M375 65V315 M425 65V315"
        fill="none" stroke="#94a3b8" stroke-width="1"/>

