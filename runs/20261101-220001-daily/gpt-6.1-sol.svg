<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">5×5 Hamiltonian Path — 24 Moves</title>
  <desc id="desc">A continuous serpentine path visits all 25 cells exactly once, starting at the top-left green circle and ending at the bottom-right red circle. Numbers above the path show visit order.</desc>

  <rect width="600" height="400" fill="#f8fafc"/>
