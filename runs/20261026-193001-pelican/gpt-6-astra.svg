<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle, carrying fish in its enormous bill beneath a no fishing sign. Wheels spin and the rider bobs continuously.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12V12H0Z" fill="#e8b867" stroke="#926432" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff4da"/>
  <path d="M0 355Q150 325 290 353T570 342T800 352V484H0Z" fill="#c9d9b0"/>
  <path d="M0 430Q210 413 420 433T800 425V515H0Z" fill="#e4c89e"/>
  <path d="M36 478H119M657 478H750" stroke="#fff4da" stroke-width="6" stroke-linecap="round"/>

  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="39" font-weight="900" fill="#183b43">THE PELICAN COMMUTE</text>
  <text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#84613b">ONE BIRD. TWO WHEELS. ZERO DIGNITY.</text>

  <g stroke="#183b43" stroke-linejoin="round">
    <path d="M690 235V427" stroke-width="8"/>
    <rect x="630" y="169" width="121" height="85" rx="9" fill="#fffdf3" stroke-width="4"/>
    <text x="690" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" stroke="none" fill="#183b43">NO FISHING</text>
    <path d="M664 225Q681 207 698 225Q681 243 664 225L652 215V235Z" fill="#7eb8b3" stroke-width="2"/>
    <circle cx="691" cy="222" r="2" fill="#183b43" stroke="none"/>
    <path d="M658 241L713 207" stroke="#da5943" stroke-width="5"/>
  </g>

  <ellipse cx="393" cy="470" rx="246" ry="13" fill="#b99d76" opacity=".38"/>

  <!-- Each wheel rotates around its own stationary axle. -->
  <g fill="#fff4da" stroke="#183b43">
    <circle cx="242" cy="394" r="73" stroke-width="12"/>
    <circle cx="552" cy="394" r="73" stroke-width="12"/>
  </g>
  <g stroke="#739398" stroke-width="3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 242 394" to="360 242 394" dur="1.6s" repeatCount="indefinite"/>
      <path d="M242 327V461M175 394H309M195 347L289 441M195 441L289 347"/>
      <path d="M262 331A66 66 0 0 1 288 347" stroke="#f5b943" stroke-width="6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 552 394" to="360 552 394" dur="1.6s" repeatCount="indefinite"/>
      <path d="M552 327V461M485 394H619M505 347L599 441M505 441L599 347"/>
      <path d="M572 331A66 66 0 0 1 598 347" stroke="#f5b943" stroke-width="6"/>
    </g>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M242 394L316 285L374 394H242L488 285H316M374 394L488 285L552 394" fill="none" stroke="#183b43" stroke-width="12"/>
    <path d="M242 394L316 285L374 394H242L488 285H316M374 394L488 285L552 394" fill="none" stroke="#df6350" stroke-width="7"/>
    <path d="M316 285L305 262M488 285L478 251Q473 235 493 235H515" fill="none" stroke="#183b43" stroke-width="8"/>
    <path d="M283 260H326" stroke="#183b43" stroke-width="12"/>
    <circle cx="242" cy="394" r="8" fill="#183b43"/>
    <circle cx="552" cy="394" r="8" fill="#183b43"/>
    <circle cx="374" cy="394" r="21" fill="#efc86b" stroke="#183b43" stroke-width="4"/>
  </g>

  <!-- Feet and crank complete a continuous pedal cycle. -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 374 394" to="360 374 394" dur="1.6s" repeatCount="indefinite"/>
    <path d="M346 394H402" stroke="#183b43" stroke-width="6"/>
    <g transform="translate(402 394)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-16 0H15" stroke="#183b43" stroke-width="7"/>
        <path d="M-13-5L-3-17L17-6Z" fill="#eead3f" stroke="#183b43" stroke-width="3"/>
      </g>
    </g>
    <g transform="translate(346 394)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-16 0H15" stroke="#183b43" stroke-width="7"/>
        <path d="M-13-5L-3-17L17-6Z" fill="#eead3f" stroke="#183b43" stroke-width="3"/>
      </g>
    </g>
  </g>

  <g stroke="#183b43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>

    <path d="M339 277L365 320L389 370" fill="none" stroke="#e8a43a" stroke-width="11">
      <animate attributeName="d" values="M339 277L365 320L389 370;M339 277L335 328L359 370;M339 277L365 320L389 370" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M288 235L238 210L255 246L225 240L263 270" fill="#fffdf2"/>
    <path d="M271 223Q289 193 350 206Q380 209 391 172Q394 139 422 143Q455 147 447 180L433 225Q424 272 368 290Q300 310 268 276Q252 257 271 223Z" fill="#fffdf2"/>
    <path d="M288 238Q318 212 364 239L334 271Q307 278 288 238Z" fill="#dce5df"/>
    <path d="M352 241Q402 266 454 247L486 236" fill="none" stroke-width="14"/>
    <path d="M352 241Q402 266 454 247L486 236" fill="none" stroke="#fffdf2" stroke-width="8"/>

    <!-- The oversized bill doubles as a suspicious grocery bag. -->
    <path d="M438 179L613 190Q592 260 513 248Q465 240 438 195Z" fill="#efb75c"/>
    <path d="M474 219Q501 195 536 218L554 203L551 232L535 224Q502 241 474 219Z" fill="#78aaa6" stroke-width="3"/>
    <circle cx="486" cy="217" r="3" fill="#183b43" stroke="none"/>
    <path d="M517 236Q539 216 566 230L581 216L581 242L565 236Q538 250 517 236Z" fill="#b6cfbd" stroke-width="3"/>
    <circle cx="529" cy="233" r="3" fill="#183b43" stroke="none"/>
    <path d="M438 176L619 187L611 199L440 193Z" fill="#f5ca63"/>
    <path d="M449 202L454 211" fill="none" stroke-width="2"/>
    <circle cx="427" cy="166" r="10" fill="white"/>
    <circle cx="431" cy="167" r="4" fill="#183b43" stroke="none"/>
    <path d="M414 151L436 156" fill="none" stroke-width="5"/>
    <path d="M394 143Q398 119 424 121Q446 123 452 146Z" fill="#df6350"/>
    <path d="M407 127L404 140M422 125L422 141M437 130L440 142" stroke="#fff4da" stroke-width="3"/>
    <path d="M389 146H457" stroke-width="5"/>
    <path d="M398 178L383 188L369 177L375 199L391 198" fill="#47a29b" stroke-width="3"/>
  </g>

  <g fill="#183b43" font-family="sans-serif">
    <path d="M100 128H302Q316 128 316 142V178Q316 192 302 192H251L269 216L227 192H100Q86 192 86 178V142Q86 128 100 128Z" fill="#fffdf3" stroke="#183b43" stroke-width="3"/>
    <text x="201" y="153" text-anchor="middle" font-size="17" font-weight="700">“It’s called</text>
    <text x="201" y="178" text-anchor="middle" font-size="20" font-weight="900">carp-pooling.”</text>
    <path d="M155 289H212M171 310H224M140 330H199" fill="none" stroke="#84613b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <rect x="0" y="515" width="800" height="85" fill="#183b43"/>
  <text x="400" y="545" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff4da">He downsized his wheels. The bill stayed enormous.</text>
  <text x="400" y="579" text-anchor="middle" font-family="monospace" font-size="17" fill="#fff4da">2026-10-26 19:30:01 SGT (UTC+08:00)</text>
</svg>