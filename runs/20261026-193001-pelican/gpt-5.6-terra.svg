<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a pelican cycling with an oversized beak full of fish.</desc>
  <defs>
    <style>
      .line{stroke:#18243a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .thin{stroke:#18243a;stroke-width:3;stroke-linecap:round;fill:none}
      .wheel{animation:spin 1.25s linear infinite;transform-origin:center}
      .bob{animation:bob .75s ease-in-out infinite alternate;transform-origin:410px 335px}
      .pedal{animation:pedal .75s linear infinite;transform-origin:420px 420px}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-9px) rotate(-1deg)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
    </style>
    <radialGradient id="sky" cx=".5" cy=".1" r="1">
      <stop stop-color="#e6f9ff"/>
      <stop offset="1" stop-color="#84ccea"/>
    </radialGradient>
    <linearGradient id="road" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#6a7685"/>
      <stop offset="1" stop-color="#434f60"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="92" cy="104" r="49" fill="#ffe578"/>
  <path d="M0 322 Q130 260 267 318 T540 300 T800 318 V410 H0Z" fill="#68bd82"/>
  <path d="M0 390 Q145 355 293 383 T547 366 T800 388 V504 H0Z" fill="url(#road)"/>
  <path d="M0 445 H800" stroke="#fff3a7" stroke-width="9" stroke-dasharray="52 34"/>

  <g fill="#fff" opacity=".85">
    <path d="M150 135 q19-22 39 0q23-21 42 3q-30 13-81 4Z"/>
    <path d="M625 123 q18-19 37 0q22-17 39 5q-32 12-76 2Z"/>
  </g>

  <g transform="translate(42 38)">
    <path d="M0 22 Q20 0 41 22L36 49H6Z" fill="#fff" stroke="#18243a" stroke-width="4"/>
    <text x="21" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#18243a">!</text>
  </g>

  <text x="400" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#18243a" stroke="#fff" stroke-width="5" paint-order="stroke">PELICAN PEDAL PANIC</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#24435c">“No lane is too narrow when your beak has cargo.”</text>

  <g class="wheel">
    <circle cx="273" cy="430" r="67" fill="#dce8ee" stroke="#18243a" stroke-width="8"/>
    <circle cx="273" cy="430" r="8" fill="#f05853" stroke="#18243a" stroke-width="4"/>
    <g class="thin" opacity=".8">
      <path d="M273 363V497M206 430H340M226 383L320 477M320 383L226 477"/>
    </g>
  </g>
  <g class="wheel">
    <circle cx="548" cy="430" r="67" fill="#dce8ee" stroke="#18243a" stroke-width="8"/>
    <circle cx="548" cy="430" r="8" fill="#f05853" stroke="#18243a" stroke-width="4"/>
    <g class="thin" opacity=".8">
      <path d="M548 363V497M481 430H615M501 383L595 477M595 383L501 477"/>
    </g>
  </g>

  <g class="line">
    <path d="M273 430 L355 302 L454 430 Z"/>
    <path d="M355 302 L480 302 L548 430"/>
    <path d="M454 430 L548 430"/>
    <path d="M480 302 L509 250 L553 247"/>
    <path d="M334 302 L371 302"/>
    <path d="M454 430 L420 420"/>
  </g>
  <path d="M326 293 q24-18 53 0l-8 12h-38Z" fill="#f05853" stroke="#18243a" stroke-width="5"/>

  <g class="pedal">
