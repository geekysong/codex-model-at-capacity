    <path d="M394 302 Q426 269 465 287 Q440 332 401 341Z" fill="#a4d5e3"/>
    <path d="M387 356 Q346 350 311 373 Q299 383 313 394 Q351 407 403 387Z" fill="#ffd55e" stroke="#18243a" stroke-width="6"/>
    <path d="M312 374 Q351 379 386 367" class="thin"/>
    <path d="M317 386 q17 9 31-1q17 11 32-2" class="thin" stroke="#f05853"/>
    <circle cx="425" cy="309" r="15" fill="#fff" stroke="#18243a" stroke-width="4"/>
    <circle cx="430" cy="311" r="6" fill="#18243a"/>
    <path d="M451 334 q18 10 30-2" class="thin"/>
    <path d="M475 367 Q509 375 526 347 Q535 333 522 327 Q496 334 472 349Z" fill="#f5f4e9" stroke="#18243a" stroke-width="6"/>
    <path d="M405 392 Q395 428 371 447" class="line"/>
    <path d="M462 399 Q472 430 454 448" class="line"/>
    <path d="M369 447 h28 M451 448 h28" class="line"/>
    <path d="M450 286 Q470 242 497 267 Q505 280 486 305" fill="#f5f4e9" stroke="#18243a" stroke-width="6"/>
    <path d="M482 272 q9-16 20-8" class="thin"/>
  </g>

  <g transform="translate(560 245)">
    <path d="M0 40 Q29 0 61 39" fill="none" stroke="#18243a" stroke-width="5"/>
    <rect x="8" y="38" width="48" height="36" rx="6" fill="#fff5bd" stroke="#18243a" stroke-width="4"/>
    <text x="32" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e24e4a">SLOW!</text>
  </g>

  <g transform="translate(116 340)">
    <path d="M0 31 Q28 0 56 31" fill="#e76955" stroke="#18243a" stroke-width="5"/>
    <rect x="9" y="28" width="38" height="25" rx="4" fill="#f8f1d8" stroke="#18243a" stroke-width="4"/>
    <text x="28" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#18243a">BEEP</text>
  </g>

  <rect x="0" y="514" width="800" height="86" fill="#18243a"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff5bd">A pelican on a bicycle: proof that confidence needs no handlebars.</text>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d7edf4">2026-10-26 19:33:19 SGT (UTC+08:00)</text>
</svg>