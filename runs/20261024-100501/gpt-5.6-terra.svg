  <text x="116" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffc7eb">queue status:</text>
  <text x="116" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ff79c8">still waiting...</text>

  <rect x="300" y="515" width="430" height="55" rx="14" fill="#080a15" stroke="#ff3cac" stroke-width="3"/>
  <text x="515" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#fff">
