  <rect x="382" y="295" width="96" height="62" rx="14" fill="url(#metal)" stroke="#cbd5e8" stroke-width="3"/>
  <rect x="394" y="307" width="72" height="34" rx="8" fill="#11182c"/>
  <circle cx="416" cy="323" r="7" fill="#00f0ff" filter="url(#glow)"/>
