<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152d"/>
      <stop offset="1" stop-color="#33203d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26152e"/>
      <stop offset=".5" stop-color="#5a2347"/>
      <stop offset="1" stop-color="#26152e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55f7ff"/>
      <stop offset="1" stop-color="#b45cff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 455 Q190 410 400 455 T800 455 V600 H0Z" fill="url(#floor)"/>
  <path d="M0 470 Q180 430 400 470 T800 470" fill="none" stroke="#8b3b72" stroke-width="4" opacity=".5"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="31" font-weight="900" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="4" fill="#67f6ff">THE EXCLUSIVE MODEL LOUNGE</text>

  <g opacity=".85">
