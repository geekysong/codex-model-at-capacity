  <!-- caption -->
  <rect x="32" y="545" width="736" height="38" rx="12" fill="#111322" stroke="#ff63be" stroke-width="2"/>
  <text x="400" y="571" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="19" fill="#fff">“Selected model is at capacity. Please try a different model.”</text>
