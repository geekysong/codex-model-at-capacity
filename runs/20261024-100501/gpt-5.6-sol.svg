<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152d"/>
      <stop offset="1" stop-color="#30234a"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35214d"/>
      <stop offset="0.5" stop-color="#7d285d"/>
      <stop offset="1" stop-color="#35214d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5df5ff"/>
      <stop offset="1" stop-color="#ff4edb"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 425 Q200 385 400 425 T800 425 V600 H0Z" fill="url(#floor)"/>
  <path d="M0 465 Q200 425 400 465 T800 465" fill="none" stroke="#ff4edb" stroke-width="3" opacity=".55"/>
  <path d="M0 520 Q200 480 400 520 T800 520" fill="none" stroke="#5df5ff" stroke-width="2" opacity=".35"/>

  <text x="400" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="900" fill="#fff">
    CODEX NIGHTCLUB: SELECTED MODEL
  </text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ff77e8">
    THE HOTTEST DOOR IN COMPUTING
  </text>

  <!-- club facade -->
  <rect x="210" y="110" width="490" height="330" rx="22" fill="#111322" stroke="#5df5ff" stroke-width="4"/>
  <rect x="230" y="130" width="450" height="275" rx="15" fill="#1b1932" stroke="#ff4edb" stroke-width="2"/>
  <path d="M250 385 L660 385" stroke="#5df5ff" stroke-width="5" filter="url(#softGlow)"/>
  <circle cx="275" cy="165" r="7" fill="#5df5ff" filter="url(#softGlow)"/>
  <circle cx="645" cy="165" r="7" fill="#ff4edb" filter="url(#softGlow)"/>

  <!-- FULL sign -->
  <g filter="url(#glow)">
    <rect x="318" y="150" width="275" height="90" rx="12" fill="#3c0d38" stroke="#ff4edb" stroke-width="5"/>
    <text x="455" y="212" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900" fill="#fff" stroke="#ff4edb" stroke-width="2">FULL</text>
  </g>

  <!-- tiny exclusive guest -->
  <g transform="translate(555 275)">
    <circle cx="0" cy="-20" r="18" fill="#b9f2ff" stroke="#111" stroke-width="4"/>
    <rect x="-18" y="0" width="36" height="48" rx="10" fill="#5df5ff" stroke="#111" stroke-width="4"/>
    <path d="M-10 18 H10 M-10 30 H10" stroke="#111" stroke-width="4"/>
    <text x="0" y="78" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff">ONE MODEL</text>
    <text x="0" y="94" text-anchor="middle" font-family="Arial" font-size="12" fill="#ff77e8">VIP ONLY</text>
  </g>

  <!-- bouncer -->
  <g transform="translate(360 250)">
    <ellipse cx="0" cy="145" rx="78" ry="16" fill="#120e20" opacity=".7"/>
    <rect x="-58" y="35" width="116" height="115" rx="22" fill="#747f98" stroke="#0a0b13" stroke-width="6"/>
    <rect x="-48" y="-35" width="96" height="78" rx="20" fill="#9eabc4" stroke="#0a0b13" stroke-width="6"/>
    <rect x="-31" y="-15" width="62" height="35" rx="10" fill="#17223a"/>
    <circle cx="-13" cy="2" r="7" fill="#ff4edb" filter="url(#softGlow)"/>
    <circle cx="13" cy="2" r="7" fill="#5df5ff" filter="url(#softGlow)"/>
    <path d="M-27 33 Q0 50 27 33" fill="none" stroke="#121522" stroke-width="5"/>
    <path d="M-60 62 Q-98 55 -111 79" fill="none" stroke="#747f98" stroke-width="18" stroke-linecap="round"/>
    <path d="M60 62 Q104 52 126 25" fill="none" stroke="#747f98" stroke-width="18" stroke-linecap="round"/>
    <path d="M-111 79 l-20 18 M126 25 l15 -19" stroke="#ffdb7d" stroke-width="10" stroke-linecap="round"/>
    <rect x="-35" y="74" width="70" height="28" rx="6" fill="#202946" stroke="#5df5ff" stroke-width="2"/>
    <text x="0" y="94" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#fff">NOPE</text>
    <path d="M-27 150 L-39 205 M27 150 L39 205" stroke="#747f98" stroke-width="20" stroke-linecap="round"/>
    <path d="M-50 208 H-20 M20 208 H50" stroke="#0a0b13" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- velvet rope -->
  <g>
    <circle cx="185" cy="410" r="13" fill="#e9c26b" stroke="#6b3d30" stroke-width="4"/>
    <circle cx="520" cy="410" r="13" fill="#e9c26b" stroke="#6b3d30" stroke-width="4"/>
    <path d="M185 410 Q350 495 520 410" fill="none" stroke="#d92768" stroke-width="9"/>
    <path d="M185 410 Q350 485 520 410" fill="none" stroke="#ff7b9c" stroke-width="3" opacity=".7"/>
  </g>

  <!-- queue of tired developers -->
  <g stroke="#171525" stroke-width="4">
    <g transform="translate(90 365)">
      <circle cx="0" cy="0" r="22" fill="#f0b18b"/><path d="M-22 -4 Q0 -28 23 -3" fill="#3a2637"/>
      <path d="M-30 33 Q0 14 30 33 V92 H-30Z" fill="#4e9fe8"/>
      <path d="M-17 58 q17 10 34 0" fill="none"/><path d="M-16 86 l-17 28 M16 86 l18 28" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="132" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff" stroke="none">retry</text>
    </g>
    <g transform="translate(170 425)">
      <circle cx="0" cy="0" r="22" fill="#8c5a44"/><path d="M-22 -5 Q0 -31 23 -4" fill="#15121d"/>
      <path d="M-30 33 Q0 14 30 33 V92 H-30Z" fill="#f08b5b"/>
      <path d="M-16 60 Q0 50 16 60" fill="none"/><path d="M-16 86 l-17 28 M16 86 l18 28" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="132" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff" stroke="none">again?</text>
    </g>
    <g transform="translate(55 510)">
      <circle cx="0" cy="0" r="22" fill="#f2c49d"/><path d="M-22 -4 Q0 -30 23 -2" fill="#e1d6c8"/>
      <path d="M-30 33 Q0 14 30 33 V85 H-30Z" fill="#7c65d8"/>
      <path d="M-16 60 Q0 48 16 60" fill="none"/><path d="M-16 80 l-17 25 M16 80 l18 25" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="125" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff" stroke="none">day 3</text>
    </g>
    <g transform="translate(145 535)">
      <circle cx="0" cy="0" r="22" fill="#d58f6e"/><path d="M-22 -3 Q0 -29 23 -2" fill="#242a38"/>
      <path d="M-30 33 Q0 14 30 33 V78 H-30Z" fill="#4ec4a1"/>
      <path d="M-14 58 Q0 48 14 58" fill="none"/><path d="M-16 75 l-17 20 M16 75 l18 20" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="117" text-anchor="middle" font-family="Arial" font-size="13" fill="#fff" stroke="none">still loading</text>
    </g>
  </g>

  <!-- melting hamster-wheel servers -->
  <g transform="translate(665 470)">
    <ellipse cx="0" cy="0" rx="65" ry="48" fill="none" stroke="#8bd3ff" stroke-width="10" opacity=".75"/>
    <ellipse cx="0" cy="0" rx="42" ry="30" fill="none" stroke="#8bd3ff" stroke-width="5"/>
    <path d="M-45 20 Q-20 39 0 29 Q24 18 45 25" fill="none" stroke="#ffb34d" stroke-width="9" stroke-linecap="round"/>
    <path d="M-20 39 q8 24 18 0 q8 28 18 0 q8 22 18 0" fill="none" stroke="#ff633d" stroke-width="7"/>
    <circle cx="-8" cy="-3" r="14" fill="#d7a078" stroke="#291b2c" stroke-width="4"/>
    <circle cx="-13" cy="-7" r="3" fill="#111"/>
    <circle cx="0" cy="-7" r="3" fill="#111"/>
    <path d="M-10 5 Q-2 11 6 5" fill="none" stroke="#111" stroke-width="3"/>
    <text x="0" y="82" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#ffd37b">SERVER SWEAT</text>
  </g>

  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">
    “Selected model is at capacity.” — The bouncer has a PhD in saying no.
  </text>
</svg>