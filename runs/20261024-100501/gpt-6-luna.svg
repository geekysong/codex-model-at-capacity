<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152b"/>
      <stop offset="1" stop-color="#35204d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171225"/>
      <stop offset=".5" stop-color="#5d245e"/>
      <stop offset="1" stop-color="#171225"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 465 Q200 420 400 465 T800 465 V600 H0Z" fill="url(#floor)"/>
  <g opacity=".35" fill="#ff4fb3">
    <circle cx="75" cy="90" r="3"/><circle cx="160" cy="145" r="2"/><circle cx="690" cy="105" r="3"/>
    <circle cx="745" cy="190" r="2"/><circle cx="520" cy="78" r="2"/><circle cx="300" cy="115" r="2"/>
  </g>

  <text x="400" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#fff">
    CODEX NIGHTCLUB
  </text>
  <text x="400" y="79" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ff85d2">
    THE HOTTEST MODEL IN TOWN
  </text>

  <!-- club facade -->
  <rect x="485" y="115" width="275" height="345" rx="18" fill="#211630" stroke="#f24cae" stroke-width="5"/>
  <rect x="515" y="150" width="215" height="178" rx="12" fill="#0e1021" stroke="#7c55ff" stroke-width="4"/>
  <text x="622" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#82f7ff">EXCLUSIVE</text>
  <text x="622" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">MODEL LOUNGE</text>
  <circle cx="622" cy="265" r="34" fill="#7c55ff" opacity=".35" filter="url(#glow)"/>
  <circle cx="622" cy="265" r="25" fill="#9c7bff"/>
  <path d="M608 270 q14-28 28 0 M610 252 h5 M629 252 h5" fill="none" stroke="#17152b" stroke-width="5" stroke-linecap="round"/>
  <text x="622" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c9c4ff">ONE MODEL INSIDE</text>

  <!-- full sign -->
  <rect x="545" y="350" width="155" height="72" rx="10" fill="#11121b" stroke="#ff334f" stroke-width="5"/>
  <text x="622" y="399" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="900" fill="#ff334f" filter="url(#glow)">FULL</text>

  <!-- bouncer -->
  <ellipse cx="435" cy="420" rx="83" ry="18" fill="#0c0b18" opacity=".65"/>
  <rect x="388" y="292" width="92" height="125" rx="35" fill="#353b51" stroke="#10111c" stroke-width="5"/>
  <rect x="397" y="330" width="74" height="77" rx="22" fill="#202536"/>
  <circle cx="434" cy="252" r="45" fill="#59657d" stroke="#10111c" stroke-width="5"/>
  <rect x="397" y="232" width="75" height="28" rx="10" fill="#151724"/>
  <circle cx="418" cy="246" r="7" fill="#ff4e72" filter="url(#smallGlow)"/>
  <circle cx="451" cy="246" r="7" fill="#ff4e72" filter="url(#smallGlow)"/>
  <path d="M417 275 Q434 286 451 275" fill="none" stroke="#9ba9c5" stroke-width="4"/>
  <path d="M388 326 L349 354" stroke="#10111c" stroke-width="18" stroke-linecap="round"/>
  <path d="M480 326 L518 351" stroke="#10111c" stroke-width="18" stroke-linecap="round"/>
  <rect x="328" y="344" width="82" height="42" rx="8" fill="#ffdd75" stroke="#10111c" stroke-width="4" transform="rotate(-12 328 344)"/>
  <text x="370" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#17152b" transform="rotate(-12 370 371)">SORRY!</text>
  <text x="434" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9ba9c5">BOUNCER v2.0</text>

  <!-- velvet rope -->
  <path d="M90 465 Q250 500 390 466 Q470 446 540 464" fill="none" stroke="#d82c55" stroke-width="8"/>
  <circle cx="90" cy="465" r="11" fill="#f2c878" stroke="#722541" stroke-width="4"/>
  <circle cx="540" cy="464" r="11" fill="#f2c878" stroke="#722541" stroke-width="4"/>

  <!-- queue developers -->
  <g stroke="#17152b" stroke-width="4">
    <circle cx="105" cy="405" r="25" fill="#d59b7c"/>
    <path d="M75 455 q30-48 60 0" fill="#4a79b8"/>
    <path d="M82 396 q24-30 47 0" fill="#3c2a27"/>
    <rect x="88" y="401" width="13" height="9" fill="none"/><rect x="111" y="401" width="13" height="9" fill="none"/>
    <path d="M101 405h10" stroke-width="3"/>
    <path d="M96 424 q9 7 18 0" fill="none"/>

    <circle cx="185" cy="429" r="24" fill="#8d5c47"/>
    <path d="M156 478 q30-46 59 0" fill="#d16b4f"/>
    <path d="M160 418 q25-29 50 1" fill="#191522"/>
    <path d="M174 432 q11-8 22 0" fill="none"/>

    <circle cx="270" cy="410" r="25" fill="#e1b18c"/>
    <path d="M239 462 q31-49 62 0" fill="#5ea88e"/>
    <path d="M244 401 q27-35 53 1" fill="#d9d9e5"/>
    <path d="M258 416 q12 8 24 0" fill="none"/>

    <circle cx="335" cy="452" r="22" fill="#b97559"/>
    <path d="M307 493 q28-43 56 0" fill="#8572c7"/>
    <path d="M311 442 q24-28 47 1" fill="#30202b"/>
    <path d="M324 461 q10 6 20 0" fill="none"/>
  </g>

  <!-- tired details -->
  <g fill="#b8bdd6" font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <text x="71" y="493" transform="rotate(-8 71 493)">99 retries</text>
    <text x="158" y="518" transform="rotate(6 158 518)">still waiting...</text>
    <text x="245" y="490" transform="rotate(-5 245 490)">coffee.exe</text>
  </g>
  <path d="M214 389 q-10 8 0 16 M226 387 q-10 8 0 16" fill="none" stroke="#8c8fa9" stroke-width="3"/>

  <!-- melting servers -->
  <g transform="translate(35 520)">
    <rect x="0" y="0" width="185" height="55" rx="8" fill="#20263d" stroke="#7790c7" stroke-width="4"/>
    <rect x="18" y="14" width="44" height="26" rx="4" fill="#101525"/>
    <rect x="70" y="14" width="44" height="26" rx="4" fill="#101525"/>
    <rect x="122" y="14" width="44" height="26" rx="4" fill="#101525"/>
    <circle cx="29" cy="27" r="4" fill="#ff476d"/><circle cx="81" cy="27" r="4" fill="#ffdc61"/><circle cx="133" cy="27" r="4" fill="#62f6c5"/>
    <path d="M25 55 q8 18 16 0 M78 55 q8 23 17 0 M140 55 q8 15 16 0" fill="none" stroke="#ff713f" stroke-width="6" stroke-linecap="round"/>
    <text x="92" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b8bdd6">SERVER FARM (WARM)</text>
  </g>

  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="900" fill="#fff">
    “SELECTED MODEL IS AT CAPACITY. TRY A DIFFERENT MODEL.”
  </text>
</svg>