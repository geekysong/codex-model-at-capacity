<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152d"/>
      <stop offset="1" stop-color="#35163d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#271438"/>
      <stop offset=".5" stop-color="#5a1f55"/>
      <stop offset="1" stop-color="#241331"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff5b5b"/>
      <stop offset="1" stop-color="#ffb52e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="105" cy="100" r="70" fill="#5d2b86" opacity=".28" filter="url(#soft)"/>
  <circle cx="700" cy="150" r="95" fill="#e12570" opacity=".18" filter="url(#soft)"/>
  <path d="M0 470 Q200 430 400 470 T800 460 V600 H0Z" fill="url(#floor)"/>

  <text x="400" y="48" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" fill="#fff">CODEX NIGHTCLUB</text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#f6b9f1">where the prompt goes to wait outside</text>

  <!-- glowing FULL sign -->
  <g filter="url(#glow)">
    <rect x="560" y="92" width="180" height="76" rx="15" fill="url(#sign)" stroke="#ffd36a" stroke-width="5"/>
    <text x="650" y="142" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="37" fill="#30152e">FULL</text>
  </g>
  <path d="M575 168 l-15 35 M725 168 l15 35" stroke="#d8a4c9" stroke-width="6"/>

  <!-- club doorway -->
  <rect x="470" y="190" width="260" height="250" rx="18" fill="#100d1c" stroke="#c34cbb" stroke-width="6"/>
  <path d="M500 420 V235 Q600 175 700 235 V420" fill="#24143a"/>
  <circle cx="600" cy="270" r="60" fill="#672467" opacity=".7"/>
  <text x="600" y="333" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="20" fill="#ff8fe9">EXCLUSIVE</text>
  <text x="600" y="357" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#fff">ONE MODEL INSIDE</text>

  <!-- server hamster wheel -->
  <g transform="translate(590 405)">
    <circle r="57" fill="#302d43" stroke="#ff765c" stroke-width="9"/>
    <circle r="43" fill="none" stroke="#f3aa55" stroke-width="5"/>
    <path d="M0-43V43 M-43 0H43 M-30-30L30 30 M30-30L-30 30" stroke="#f3aa55" stroke-width="4"/>
    <ellipse cx="0" cy="3" rx="17" ry="11" fill="#ffcf67"/>
    <circle cx="-6" cy="0" r="2" fill="#25142d"/><circle cx="6" cy="0" r="2" fill="#25142d"/>
    <path d="M-7 8 Q0 14 7 8" fill="none" stroke="#25142d" stroke-width="2"/>
    <path d="M-55 54 Q-35 73 0 69 T55 54" fill="none" stroke="#ff514c" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="600" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffb69d">SERVERS: *melting*</text>

  <!-- bouncer robot -->
  <g transform="translate(325 235)">
    <ellipse cx="75" cy="245" rx="78" ry="17" fill="#100b1a" opacity=".6"/>
    <rect x="13" y="93" width="125" height="147" rx="28" fill="#8994a8" stroke="#20243b" stroke-width="6"/>
    <rect x="25" y="108" width="101" height="68" rx="14" fill="#1d2035"/>
    <circle cx="52" cy="142" r="10" fill="#ff4d78"/>
    <circle cx="98" cy="142" r="10" fill="#ff4d78"/>
    <path d="M50 160 Q75 178 101 160" fill="none" stroke="#ff9ec2" stroke-width="5"/>
    <rect x="45" y="188" width="60" height="25" rx="7" fill="#30354a"/>
    <text x="75" y="206" text-anchor="middle" font-family="Arial Black" font-size="15" fill="#70f5ff">NOPE</text>
    <rect x="35" y="45" width="80" height="63" rx="18" fill="#aab5c7" stroke="#20243b" stroke-width="6"/>
    <path d="M75 45V25" stroke="#20243b" stroke-width="6"/>
    <circle cx="75" cy="18" r="8" fill="#ff647f"/>
    <path d="M35 73 H115" stroke="#59647a" stroke-width="4"/>
    <path d="M18 127 L-25 102 M132 127 L190 105" stroke="#8994a8" stroke-width="18" stroke-linecap="round"/>
    <path d="M-25 102 l-25 4 M190 105 l25 -7" stroke="#ff647f" stroke-width="8" stroke-linecap="round"/>
    <path d="M46 240 V268 M104 240 V268" stroke="#8994a8" stroke-width="18" stroke-linecap="round"/>
  </g>
  <text x="400" y="215" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="16" fill="#ffdf8a">BOUNCER BOT v1.0</text>
  <path d="M250 275 Q320 250 395 285" fill="none" stroke="#ff8bcb" stroke-width="4" stroke-dasharray="7 8"/>
  <text x="260" y="265" font-family="Arial Black, sans-serif" font-size="17" fill="#fff">ACCESS DENIED</text>

  <!-- velvet rope -->
  <path d="M110 420 Q220 360 340 418 Q405 450 475 425" fill="none" stroke="#c92359" stroke-width="10"/>
  <path d="M110 420 V505 M475 425 V505" stroke="#e8bb70" stroke-width="10"/>
  <circle cx="110" cy="420" r="13" fill="#ffe09a"/>
  <circle cx="475" cy="425" r="13" fill="#ffe09a"/>

  <!-- queue of tired developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(55 345)">
      <circle cx="34" cy="28" r="22" fill="#d99773"/><path d="M14 25 Q35 0 56 25" fill="#4c2e43"/>
      <rect x="13" y="52" width="43" height="70" rx="13" fill="#4d83c3"/><path d="M35 75 v25" stroke="#ffd35d" stroke-width="4"/>
      <path d="M13 65 L-7 98 M56 65 L77 100" stroke="#d99773" stroke-width="11" stroke-linecap="round"/>
      <path d="M19 122 h-9 M52 122 h9" stroke="#25243c" stroke-width="8"/>
      <text x="34" y="148" text-anchor="middle" font-size="13" fill="#fff">dev_01</text>
    </g>
    <g transform="translate(155 365)">
      <circle cx="34" cy="28" r="22" fill="#8b5a43"/><path d="M13 23 Q35 3 57 24" fill="#191727"/>
      <path d="M22 34 Q34 42 46 34" fill="none" stroke="#2b1e27" stroke-width="3"/>
      <rect x="12" y="52" width="45" height="67" rx="13" fill="#7c4ca8"/>
      <path d="M12 64 L-8 92 M57 64 L78 92" stroke="#8b5a43" stroke-width="11" stroke-linecap="round"/>
      <path d="M18 120 h-10 M51 120 h10" stroke="#25243c" stroke-width="8"/>
      <text x="34" y="145" text-anchor="middle" font-size="13" fill="#fff">dev_02</text>
    </g>
    <g transform="translate(255 350)">
      <circle cx="34" cy="28" r="22" fill="#e5b28b"/><path d="M12 23 Q34 2 57 23" fill="#d94e67"/>
      <path d="M22 37 Q34 30 46 37" fill="none" stroke="#44233d" stroke-width="3"/>
      <rect x="12" y="52" width="45" height="70" rx="13" fill="#3caa91"/>
      <path d="M12 66 L-8 95 M57 66 L78 95" stroke="#e5b28b" stroke-width="11" stroke-linecap="round"/>
      <path d="M18 123 h-10 M51 123 h10" stroke="#25243c" stroke-width="8"/>
      <text x="34" y="148" text-anchor="middle" font-size="13" fill="#fff">dev_03</text>
    </g>
  </g>

  <!-- speech bubble -->
  <path d="M65 205 Q65 155 130 155 H280 Q335 155 335 205 V235 Q335 265 285 265 H170 L125 295 V265 H115 Q65 265 65 205Z" fill="#fff8df" stroke="#2a1c3b" stroke-width="5"/>
  <text x="200" y="195" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="18" fill="#322044">“Selected model is at</text>
  <text x="200" y="220" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="18" fill="#e03b63">capacity.”</text>

  <!-- caption -->
  <rect x="40" y="535" width="720" height="42" rx="20" fill="#100d1c" stroke="#ff6b9c" stroke-width="3"/>
  <text x="400" y="563" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="19" fill="#fff">TONIGHT’S SPECIAL: THE MODEL IS AT CAPACITY — TRY AGAIN TOMORROW.</text>
</svg>