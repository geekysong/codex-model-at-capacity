<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#172033">
    <text x="50" y="28" font-size="16" font-weight="bold">Projectile motion</text>
    <text x="50" y="50">vₓ = 20 m/s · vᵧ = 15 m/s · g = 10 m/s²</text>
    <text x="50" y="72">Total flight time: 3 s</text>
    <text x="50" y="100">At 10 px/m, landing is at x = 700, outside this canvas.</text>
    <text x="50" y="119">The final trajectory segment is shown in the inset.</text>
  </g>

  <path d="M50 350H550" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- x(t)=100+200t; y(t)=350-150t+50t². -->
  <path d="M100 350 Q325 181.25 550 265.625"
        fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="100" cy="350" r="4" fill="#172033"/>
  <circle cx="400" cy="237.5" r="4" fill="#172033"/>

  <g font-family="Arial, sans-serif" font-size="12" fill="#172033">
    <text x="60" y="326">launch: 0 m, 0 m</text>
    <text x="338" y="217">apex: 30 m, 11.25 m</text>
  </g>

  <!-- Same 10 px/m scale; inset translates world coordinates by (-200,-160). -->
  <rect x="340" y="132" width="210" height="67" rx="4"
        fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M350 190H540" fill="none" stroke="#334155"/>
  <path d="M350 105.625 Q425 133.75 500 190"
        fill="none" stroke="#2563eb" stroke-width="2.5"
        clip-path="url(#insetClip)"/>
  <defs>
    <clipPath id="insetClip">
      <rect x="341" y="151" width="208" height="46"/>
    </clipPath>
  </defs>
  <circle cx="500" cy="190" r="4" fill="#172033"/>
  <text x="350" y="147" font-family="Arial, sans-serif" font-size="12" fill="#172033">landing: 60 m, 0 m</text>

  <text x="50" y="385" font-family="Arial, sans-serif" font-size="13" fill="#172033">2026-10-25 17:04:36 SGT (UTC+08:00)</text>
</svg>