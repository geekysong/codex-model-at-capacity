            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Starting robot, facing right -->
  <g stroke="#263746" stroke-width="2">
    <path d="M171 67V61" fill="none"/>
    <circle cx="171" cy="59" r="2.5" fill="#607d8b"/>
    <rect x="163" y="68" width="25" height="24" rx="5" fill="#d9e1e8"/>
    <circle cx="181" cy="75" r="2" fill="#263746" stroke="none"/>
    <circle cx="181" cy="85" r="2" fill="#263746" stroke="none"/>
    <path d="M190 75L199 80L190 85Z" fill="#263746"/>
  </g>

  <!-- Final position -->
  <circle cx="360" cy="200" r="12" fill="#179447" stroke="white" stroke-width="2"/>

  <!-- Labels outside the grid -->
  <g font-family="Arial, sans-serif" fill="#172b3a" font-size="14">
    <text x="466" y="195">Row 3, Col 4</text>
    <text x="466" y="219">Facing: Right</text>
  </g>

  <!-- Dedicated timestamp footer -->
  <text x="300" y="383" text-anchor="middle"
