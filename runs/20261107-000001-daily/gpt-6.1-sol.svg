    <rect x="150" y="50" width="60" height="60"/>
    <rect x="210" y="50" width="60" height="60"/>
    <rect x="270" y="50" width="60" height="60"/>
    <rect x="270" y="110" width="60" height="60"/>
    <rect x="270" y="170" width="60" height="60"/>
    <rect x="330" y="170" width="60" height="60"/>
  </g>

  <!-- Centered 300 × 300 grid -->
  <g fill="none" stroke="#45515c" stroke-width="1.5">
    <rect x="150" y="50" width="300" height="300"/>
    <path d="M210 50V350 M270 50V350 M330 50V350 M390 50V350
             M150 110H450 M150 170H450 M150 230H450 M150 290H450"/>
  </g>

  <!-- Connected path through cell centers -->
  <polyline points="180,80 240,80 300,80 300,140 300,200 360,200"
