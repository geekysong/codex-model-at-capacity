<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Robot path on a 5 by 5 grid</title>
  <desc id="desc">The robot starts in row 1, column 1, facing right. It finishes in row 3, column 4, facing right.</desc>

  <rect width="600" height="400" fill="#fff"/>

  <g fill="#d9efff">
    <rect x="150" y="30" width="60" height="60"/>
    <rect x="210" y="30" width="60" height="60"/>
    <rect x="270" y="30" width="60" height="60"/>
    <rect x="270" y="90" width="60" height="60"/>
    <rect x="270" y="150" width="60" height="60"/>
    <rect x="330" y="150" width="60" height="60"/>
  </g>

  <g fill="none" stroke="#45515d" stroke-width="1.5">
    <rect x="150" y="30" width="300" height="300"/>
    <path d="M210 30V330 M270 30V330 M330 30V330 M390 30V330"/>
    <path d="M150 90H450 M150 150H450 M150 210H450 M150 270H450"/>
  </g>

  <polyline points="180,60 240,60 300,60 300,120 300,180 360,180"
            fill="none" stroke="#d62828" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <g aria-label="Robot starting position, facing right">
    <circle cx="180" cy="60" r="14" fill="#34495e" stroke="#fff" stroke-width="2"/>
    <path d="M177 53 L188 60 L177 67 Z" fill="#fff"/>
  </g>

  <circle cx="360" cy="180" r="10" fill="#18853b" stroke="#fff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="15" fill="#202830">
    <text x="465" y="165" font-weight="bold">Final cell</text>
    <text x="465" y="188">Row 3, column 4</text>
    <text x="465" y="211">Facing: Right</text>
  </g>

  <line x1="30" y1="350" x2="570" y2="350" stroke="#d2d8dd"/>
  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="15" fill="#303840">2026-11-07 00:05:33 SGT (UTC+08:00)</text>
</svg>