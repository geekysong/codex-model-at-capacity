        <path d="M355 360 l-22 -18 M355 360 l24 18" stroke="#202536" stroke-width="6"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 355 360" to="360 355 360" dur="1.4s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <g id="pelican" class="ink">
      <ellipse cx="404" cy="260" rx="74" ry="92" fill="#f7f3e9"/>
      <path d="M352 250 Q319 293 350 335 Q391 350 423 318 L405 274Z" fill="#dfe7e7"/>
      <path d="M365 183 Q382 135 435 146 Q481 157 483 210 Q480 251 437 265 Q390 269 365 235Z" fill="#faf7ea"/>
      <path d="M438 183 Q504 172 580 211 Q598 221 580 235 Q508 247 440 223Z" fill="#f0a94b"/>
      <path d="M454 202 Q516 204 578 224" fill="none" stroke="#202536" stroke-width="5"/>
      <circle cx="430" cy="183" r="8" fill="#202536"/>
      <path d="M429 150 Q424 125 445 112" fill="none" stroke="#e44f3d" stroke-width="8"/>
      <path d="M391 325 Q378 359 368 393" fill="none" stroke="#f0a94b" stroke-width="14"/>
      <path d="M425 326 Q438 356 451 390" fill="none" stroke="#f0a94b" stroke-width="14"/>
      <path d="M361 394 l-24 8 M450 391 l25 7" fill="none" stroke="#202536" stroke-width="7"/>
      <path d="M350 229 Q310 216 286 238" fill="none" stroke="#202536" stroke-width="8"/>
