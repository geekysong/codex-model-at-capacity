        <g stroke="#8792a5" stroke-width="3" opacity=".8">
          <path d="M255 378V532M178 455H332M201 401L309 509M309 401L201 509"/>
          <path d="M585 378V532M508 455H662M531 401L639 509M639 401L531 509"/>
        </g>
      </g>
      <path d="M255 455 L355 360 L455 455 L255 455 L410 455 L355 360 L395 325" fill="none" stroke="#e44f3d" stroke-width="10"/>
      <path d="M395 325 L440 325" stroke="#202536" stroke-width="8"/>
      <path d="M455 455 L500 370" stroke="#202536" stroke-width="8"/>
      <path d="M490 370 L525 370" stroke="#202536" stroke-width="8"/>
      <circle cx="355" cy="360" r="13" fill="#ffd34e" stroke="#202536" stroke-width="5"/>
      <circle cx="455" cy="455" r="13" fill="#ffd34e" stroke="#202536" stroke-width="5"/>
      <circle cx="255" cy="455" r="13" fill="#ffd34e" stroke="#202536" stroke-width="5"/>
