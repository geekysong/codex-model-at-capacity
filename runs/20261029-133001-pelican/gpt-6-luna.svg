<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ecff"/>
      <stop offset="1" stop-color="#fff4c2"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#596273"/>
      <stop offset="1" stop-color="#252b38"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#202536;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,sans-serif;fill:#202536}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="115" r="54" fill="#ffd96b" opacity=".85"/>
  <path d="M0 340 Q125 280 250 340 T500 330 T800 340 V430 H0Z" fill="#8ccf8c"/>
  <path d="M0 410 Q180 365 360 410 T800 405 V600 H0Z" fill="url(#road)"/>
  <path d="M0 500 H800" stroke="#f9dd76" stroke-width="8" stroke-dasharray="48 34" opacity=".9"/>

  <g filter="url(#shadow)">
    <rect x="52" y="32" width="696" height="82" rx="22" fill="#fff9e8" stroke="#202536" stroke-width="6"/>
    <text x="400" y="78" text-anchor="middle" class="label" font-size="34" font-weight="900">THE GREAT PELICAN COMMUTE</text>
    <text x="400" y="101" text-anchor="middle" class="label" font-size="16" font-weight="700" fill="#c34d3d">Because traffic is for birds who forgot their bicycles.</text>
  </g>

  <g transform="translate(0 8)">
