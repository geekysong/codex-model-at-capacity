  <g class="label">
    <text x="400" y="565" text-anchor="middle" font-size="18" font-weight="700">A beak-first solution to rush hour: pedal hard, look dignified.</text>
    <text x="400" y="589" text-anchor="middle" font-size="14" font-weight="700">2026-10-29 13:30:08 SGT (UTC+08:00)</text>
  </g>
