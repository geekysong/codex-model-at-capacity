<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle, carrying a fish in its enormous bill beneath a sign advertising a bike lane. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1"/>
    <g id="wheel">
      <circle r="74" fill="#fff9df" stroke="#243548" stroke-width="12"/>
      <circle r="64" fill="none" stroke="#9cafb3" stroke-width="2"/>
      <g stroke="#748b96" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      </g>
      <circle r="9" fill="#ef7152" stroke="#243548" stroke-width="4"/>
      <path d="M-16-65H3" stroke="#ffd451" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <path d="M0 159Q170 114 323 159T800 143V477H0Z" fill="#d9edf0"/>
  <circle cx="690" cy="145" r="37" fill="#ffd15b"/>
  <g fill="#fff" opacity=".85">
    <path d="M50 180c-13-32 22-46 38-24 7-38 53-31 55-4 34-12 48 22 28 28Z"/>
    <path d="M524 201c-10-25 18-37 31-19 6-30 43-25 44-3 27-10 39 17 23 22Z"/>
  </g>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="3" fill="#243548">TOUR DE BEAK</text>
  <text x="400" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#47616a">Zero emissions. Excessive fish consumption.</text>

  <g stroke="#243548" stroke-width="4">
    <path d="M686 299V458" fill="none"/>
    <rect x="614" y="247" width="146" height="64" rx="8" fill="#ffd15b"/>
    <path d="M631 280h31m-10-9 10 9-10 9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="706" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#243548">BIKE</text>
  <text x="706" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#243548">LANE</text>

  <path d="M0 457Q380 448 800 457V511H0Z" fill="#d3c6a3"/>
  <path d="M0 483H800" stroke="#fff7df" stroke-width="4" stroke-dasharray="38 24"/>
  <ellipse cx="379" cy="458" rx="235" ry="11" fill="#243548" opacity=".12"/>

  <g transform="translate(246 380)">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0 246 380" to="360 246 380" dur="1.4s" repeatCount="indefinite" additive="sum"/>
  </g>
  <g transform="translate(510 380)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- Frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246 380L313 276 365 380H246L451 281 365 380M451 281L510 380" stroke="#243548" stroke-width="15"/>
    <path d="M246 380L313 276 365 380H246L451 281 365 380M451 281L510 380" stroke="#ef7152" stroke-width="8"/>
    <path d="M313 276L303 252M451 281L439 244 465 229 482 238" stroke="#243548" stroke-width="8"/>
    <path d="M281 251H328" stroke="#243548" stroke-width="12"/>
  </g>
  <circle cx="365" cy="380" r="17" fill="#ffd15b" stroke="#243548" stroke-width="4"/>
  <g transform="translate(365 380)">
    <g stroke="#243548" stroke-width="5" stroke-linecap="round">
      <path d="M-21 0H21"/>
      <path d="M-27-5V5M27-5V5" stroke-width="8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Pelican and its impressive cargo capacity -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M305 244Q329 282 343 307L373 357" fill="none" stroke="#b56a36" stroke-width="12" stroke-linecap="round"/>
    <path d="M372 356l-5 15 29 4" fill="none" stroke="#edaa45" stroke-width="12" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-6 343 307;8 343 307;-6 343 307" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <path d="M299 242L248 224 265 258 242 253Q276 285 322 268Z" fill="#fffdf0" stroke="#243548" stroke-width="4" stroke-linejoin="round"/>
    <path d="M286 207Q306 172 352 178Q383 177 393 218L373 260Q346 282 302 260Q278 247 286 207Z" fill="#fffdf0" stroke="#243548" stroke-width="4"/>
    <path d="M304 217Q327 194 359 211L373 245Q340 270 309 244" fill="#d6e0df" stroke="#243548" stroke-width="3"/>
    <path d="M335 218q26 6 42 25" fill="none" stroke="#8b9ca2" stroke-width="3"/>
    <path d="M370 218Q397 197 391 155Q383 118 411 112Q445 107 452 141L441 192Q431 225 401 239" fill="#fffdf0" stroke="#243548" stroke-width="4"/>
    <path d="M397 117l-10-14 20 6 4-14 10 14" fill="#fffdf0" stroke="#243548" stroke-width="3" stroke-linejoin="round"/>

    <path d="M435 150L612 162Q576 222 476 213Q443 208 435 150Z" fill="#f6b44e" stroke="#243548" stroke-width="4" stroke-linejoin="round"/>
    <path d="M440 149L618 159 443 173Z" fill="#ffdc78" stroke="#243548" stroke-width="4" stroke-linejoin="round"/>
    <path d="M463 184q58 25 111-3" fill="none" stroke="#cf8139" stroke-width="3"/>

    <g transform="translate(511 191) rotate(-7)">
      <path d="M-27 0Q0-21 25 0Q0 21-27 0L-42-12V12Z" fill="#77bfc0" stroke="#243548" stroke-width="2"/>
      <circle cx="14" cy="-2" r="3" fill="#243548"/>
      <path d="M-3-11l6-7 7 9" fill="#77bfc0" stroke="#243548" stroke-width="2"/>
    </g>
    <circle cx="426" cy="143" r="10" fill="white" stroke="#243548" stroke-width="3"/>
    <circle cx="430" cy="143" r="4" fill="#243548"/>
    <path d="M412 128l24-1" stroke="#243548" stroke-width="4" stroke-linecap="round"/>
    <path d="M379 228Q411 221 443 241" fill="none" stroke="#243548" stroke-width="5" stroke-linecap="round"/>
    <path d="M432 236l15 1-1 10" fill="none" stroke="#edaa45" stroke-width="9" stroke-linecap="round"/>

    <path d="M388 191l-17 20 19 8 12-25" fill="#ef7152" stroke="#243548" stroke-width="3"/>
    <path d="M378 204l-36-7 20 20 22-4" fill="#ef7152" stroke="#243548" stroke-width="3"/>
  </g>

  <g fill="none" stroke="#47616a" stroke-width="3" stroke-linecap="round">
    <path d="M145 326h39M128 342h49M156 357h20"/>
  </g>
  <path d="M77 228Q70 205 91 202H232Q251 203 247 224L241 249Q237 262 220 260H142L122 279 125 260H93Q73 261 77 228Z" fill="#fffdf0" stroke="#243548" stroke-width="3"/>
  <text x="161" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243548">“I carb-load</text>
  <text x="161" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243548">with carp.”</text>

  <rect y="511" width="800" height="89" fill="#243548"/>
  <text x="400" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff7df">His bicycle has two speeds: coast and boast.</text>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#d9edf0">2026-10-30 23:01:22 SGT (UTC+08:00)</text>
</svg>