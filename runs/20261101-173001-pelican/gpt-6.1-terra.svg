    <circle cx="425" cy="153" r="5" fill="#263342"/>
    <path d="M410 126q13-7 25-1" fill="none" stroke="#263342" stroke-width="5" stroke-linecap="round"/>
    <path d="M369 129q1-30 37-35 33-4 46 21l-4 11-78 12z" fill="#ee7158" class="outline"/>
