    <path d="M450 262q8-10 18-3" fill="none" stroke="#263342" stroke-width="7" stroke-linecap="round"/>

    <path d="M367 207q-10-29 1-60 12-30 44-32 35-1 47 26 8 19-4 41l-9 30" fill="#fffdf2" class="outline"/>
