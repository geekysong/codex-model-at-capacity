<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican in a tiny helmet rides a bicycle with spinning wheels and bobbing pedals.</desc>
  <defs>
    <style>
      .title { font: 900 43px sans-serif; fill: #263342; letter-spacing: 1px; }
      .caption { font: 700 21px sans-serif; fill: #263342; }
      .footer { font: 16px sans-serif; fill: #526273; }
      .outline { stroke: #263342; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { animation: bob 0.7s ease-in-out infinite alternate; }
      .pedals { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8f1da"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#e4f3ed" stroke="#263342" stroke-width="4"/>
  <text class="title" x="400" y="76" text-anchor="middle">THE DAILY COMMUTE</text>

  <circle cx="665" cy="145" r="35" fill="#ffd36b"/>
  <path d="M75 190c13-23 41-25 57-8 17-9 37-1 40 14H75zM530 142c10-19 32-21 44-7 14-8 31-1 33 11h-77z" fill="#fff" opacity=".9"/>
  <path d="M50 379q95-39 190-9t190 0 190 1 130-2v100H50z" fill="#b5d9bf"/>
  <path d="M45 449H755" stroke="#263342" stroke-width="6" stroke-linecap="round"/>
  <path d="M67 465h54m35 0h54m370 0h54m35 0h54" stroke="#fff8e5" stroke-width="5" stroke-linecap="round"/>

  <g class="wheel">
    <circle cx="230" cy="394" r="76" fill="#fff8e5" stroke="#263342" stroke-width="10"/>
    <circle cx="230" cy="394" r="62" fill="none" stroke="#8ca9a6" stroke-width="2"/>
    <g stroke="#829b9c" stroke-width="3">
      <path d="M230 318v152M154 394h152M176 340l108 108M284 340 176 448"/>
    </g>
    <circle cx="230" cy="394" r="8" fill="#263342"/>
  </g>
  <g class="wheel">
    <circle cx="550" cy="394" r="76" fill="#fff8e5" stroke="#263342" stroke-width="10"/>
    <circle cx="550" cy="394" r="62" fill="none" stroke="#8ca9a6" stroke-width="2"/>
    <g stroke="#829b9c" stroke-width="3">
      <path d="M550 318v152M474 394h152M496 340l108 108M604 340 496 448"/>
    </g>
    <circle cx="550" cy="394" r="8" fill="#263342"/>
  </g>

  <g fill="none" stroke="#e86c50" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 394 309 297 385 394H230l106-88 49 88 121-99 44 99"/>
    <path d="M309 297h-21M503 285l-8-24h-27"/>
  </g>
  <path d="M278 290h58" stroke="#263342" stroke-width="10" stroke-linecap="round"/>
  <path d="M463 260h25" stroke="#263342" stroke-width="9" stroke-linecap="round"/>
  <circle cx="385" cy="394" r="17" fill="#fff8e5" stroke="#263342" stroke-width="5"/>
  <g class="pedals">
    <path d="M374 374l22 40" stroke="#263342" stroke-width="6" stroke-linecap="round"/>
    <path d="M362 373h22M386 415h22" stroke="#263342" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="rider">
    <path d="M347 300q-5 31 34 66" fill="none" stroke="#e8a445" stroke-width="12" stroke-linecap="round"/>
    <path d="M381 366l-14 8h28" fill="none" stroke="#263342" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
