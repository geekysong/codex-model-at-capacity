  </g>

  <path d="M126 318l-28 4m37 13-39 8m43 9-25 9" stroke="#7aa59b" stroke-width="5" stroke-linecap="round"/>
  <path d="M610 270q-4-24 16-31h80q16 0 16 16v35q0 16-16 16h-62l-21 16 3-16q-16-2-16-18z" fill="#fffdf2" stroke="#263342" stroke-width="4"/>
  <text x="666" y="269" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#263342">NO FISH,</text>
  <text x="666" y="289" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#263342">NO FARE!</text>

  <text class="caption" x="400" y="512" text-anchor="middle">He takes the bike lane—and the whole lunch break.</text>
  <path d="M55 535H745" stroke="#b5ccc1" stroke-width="2"/>
  <text class="footer" x="400" y="560" text-anchor="middle">2026-11-01 17:32:07 SGT (UTC+08:00)</text>
</svg>