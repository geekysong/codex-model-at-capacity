<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A smug pelican rides a bicycle with spinning wheels and pedaling feet, carrying a fish in its enormous bill pouch beneath a sign promising a faster commute.</desc>
  <defs>
