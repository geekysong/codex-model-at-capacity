<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A smug pelican pedals a bicycle with an enormous bill. The wheels spin, its feet pedal, and the bird bobs. A roadside sign declares a bill-free bike lane.</desc>
