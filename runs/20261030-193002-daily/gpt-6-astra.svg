<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest street route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172033">City street map</text>

  <defs>
    <pattern id="blocks" x="100" y="60" width="100" height="60" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="82" height="42" rx="5" fill="#e2e8f0"/>
    </pattern>
  </defs>
  <rect x="100" y="60" width="400" height="240" fill="url(#blocks)"/>

  <g fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <path d="M100 60H500V300" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#ffffff" stroke="#64748b" stroke-width="2">
    <circle cx="100" cy="120" r="4"/><circle cx="100" cy="180" r="4"/>
    <circle cx="100" cy="240" r="4"/><circle cx="100" cy="300" r="4"/>
    <circle cx="200" cy="180" r="4"/><circle cx="200" cy="240" r="4"/>
    <circle cx="200" cy="300" r="4"/><circle cx="300" cy="120" r="4"/>
    <circle cx="300" cy="240" r="4"/><circle cx="300" cy="300" r="4"/>
    <circle cx="400" cy="120" r="4"/><circle cx="400" cy="180" r="4"/>
    <circle cx="400" cy="300" r="4"/>
  </g>
  <g fill="#ffffff" stroke="#2563eb" stroke-width="2">
    <circle cx="200" cy="60" r="4"/><circle cx="300" cy="60" r="4"/>
    <circle cx="400" cy="60" r="4"/><circle cx="500" cy="60" r="4"/>
    <circle cx="500" cy="120" r="4"/><circle cx="500" cy="180" r="4"/>
    <circle cx="500" cy="240" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M192 112L208 128 M208 112L192 128"/>
    <path d="M292 172L308 188 M308 172L292 188"/>
    <path d="M392 232L408 248 M408 232L392 248"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#172033">
    <text x="100" y="47">A1</text><text x="200" y="47">B1</text>
    <text x="300" y="47">C1</text><text x="400" y="47">D1</text><text x="500" y="47">E1</text>
    <text x="100" y="107">A2</text><text x="200" y="107">B2</text>
    <text x="300" y="107">C2</text><text x="400" y="107">D2</text><text x="500" y="107">E2</text>
    <text x="100" y="167">A3</text><text x="200" y="167">B3</text>
    <text x="300" y="167">C3</text><text x="400" y="167">D3</text><text x="500" y="167">E3</text>
    <text x="100" y="227">A4</text><text x="200" y="227">B4</text>
    <text x="300" y="227">C4</text><text x="400" y="227">D4</text><text x="500" y="227">E4</text>
    <text x="100" y="287">A5</text><text x="200" y="287">B5</text>
    <text x="300" y="287">C5</text><text x="400" y="287">D5</text><text x="500" y="287">E5</text>
  </g>

  <circle cx="100" cy="60" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="300" r="7" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <text x="80" y="65" text-anchor="end" fill="#15803d">START</text>
    <text x="518" y="305" fill="#1d4ed8">END</text>
  </g>

  <path d="M25 324H575" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="347" font-size="16" font-weight="bold" fill="#1d4ed8">Shortest route: 8 street segments</text>
    <text x="300" y="380" font-size="15" fill="#334155">2026-10-30 19:33:23 SGT (UTC+08:00)</text>
  </g>
</svg>