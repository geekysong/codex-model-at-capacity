<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican pedals a bicycle with spinning wheels and a bobbing motion.</desc>
  <defs>
    <style>
      .ink { stroke:#26313b; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.2s linear infinite; }
      .rider { animation:bob .6s ease-in-out infinite alternate; }
      .pedals { transform-origin:390px 405px; animation:spin 1.2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-6px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedals { animation-duration:4s; } }
    </style>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#fff" opacity=".4"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f8eacb"/>
  <rect x="20" y="20" width="760" height="500" rx="24" fill="#bfe6e3" stroke="#26313b" stroke-width="5"/>
