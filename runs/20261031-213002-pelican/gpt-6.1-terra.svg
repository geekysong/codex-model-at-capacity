    <circle cx="558" cy="405" r="8" fill="#26313b"/>
  </g>

  <g fill="none" stroke="#d95642" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 405 L330 300 L390 405 Z"/>
