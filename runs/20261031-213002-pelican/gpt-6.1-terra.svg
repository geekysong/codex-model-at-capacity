  <path d="M22 330 Q150 280 280 326 T530 323 T778 312 V495 Q778 520 754 520 H46 Q22 520 22 496Z" fill="url(#dots)"/>
  <circle cx="685" cy="106" r="38" fill="#ffd460" stroke="#26313b" stroke-width="4"/>
