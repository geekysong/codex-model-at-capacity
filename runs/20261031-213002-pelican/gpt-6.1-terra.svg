  <text x="400" y="78" text-anchor="middle" fill="#26313b" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2">THE DAILY COMMUTE</text>
  <text x="400" y="110" text-anchor="middle" fill="#45545b" font-family="Arial, sans-serif" font-size="17" font-weight="bold">ONE BIRD. TWO WHEELS. ZERO PARKING FEES.</text>

  <path d="M95 488 H705" fill="none" stroke="#26313b" stroke-width="5" stroke-linecap="round"/>
  <path d="M80 474 h46 m-24 -13 h28 M675 474 h42 m-28 -13 h28" fill="none" stroke="#b6925c" stroke-width="4" stroke-linecap="round"/>

  <g class="wheel">
