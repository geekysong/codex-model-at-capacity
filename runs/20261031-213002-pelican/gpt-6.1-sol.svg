<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle while carrying a fish in its enormous bill. Wheels spin, pedals turn, and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12L12 0" stroke="#f3dcad" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <circle cx="683" cy="143" r="54" fill="#ffcf66"/>
  <path d="M0 392Q150 338 310 385T800 372V534H0Z" fill="#c7dbbc"/>
  <path d="M0 442Q260 422 800 445V534H0Z" fill="#ead4ac"/>
  <path d="M0 493H800" stroke="#b99467" stroke-width="3"/>
  <path d="M40 511H110M260 511H330M480 511H550M700 511H770" stroke="#fff5dc" stroke-width="6"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#233c40">
    <text x="400" y="62" font-size="46" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
    <text x="400" y="94" font-size="18">Zero emissions. Suspiciously high sardine consumption.</text>
  </g>

  <!-- A roadside opinion -->
  <path d="M657 317V447" stroke="#826347" stroke-width="9"/>
  <rect x="588" y="276" width="143" height="63" rx="8" fill="#fffdf0" stroke="#233c40" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" text-anchor="middle" fill="#233c40">
    <text x="659" y="301" font-size="16">BIKE LANE</text>
    <text x="659" y="323" font-size="14">NO WIDE LOADS</text>
  </g>

  <ellipse cx="357" cy="478" rx="241" ry="13" fill="#826347" opacity=".17"/>

  <!-- Wheels: stationary tires, rotating hubs and spokes -->
  <g fill="#fff9e9" stroke="#233c40">
    <circle cx="216" cy="403" r="72" stroke-width="12"/>
    <circle cx="501" cy="403" r="72" stroke-width="12"/>
  </g>
  <g transform="translate(216 403)">
    <g stroke="#78918e" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-66 0H66M0-66V66M-47-47L47 47M-47 47L47-47"/>
      <path d="M-61-25L61 25M-25-61L25 61M-61 25L61-25M-25 61L25-61"/>
      <circle r="9" fill="#e26d44" stroke="#233c40"/>
      <rect x="40" y="-6" width="17" height="12" rx="3" fill="#ffbd46" stroke="none"/>
    </g>
  </g>
  <g transform="translate(501 403)">
    <g stroke="#78918e" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-66 0H66M0-66V66M-47-47L47 47M-47 47L47-47"/>
      <path d="M-61-25L61 25M-25-61L25 61M-61 25L61-25M-25 61L25-61"/>
      <circle r="9" fill="#e26d44" stroke="#233c40"/>
      <rect x="40" y="-6" width="17" height="12" rx="3" fill="#ffbd46" stroke="none"/>
    </g>
  </g>

  <!-- Comically undersized bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M216 403L284 306L350 403ZM284 306H452L350 403M452 306L501 403" stroke="#233c40" stroke-width="13"/>
    <path d="M216 403L284 306L350 403ZM284 306H452L350 403M452 306L501 403" stroke="#e6684b" stroke-width="7"/>
    <path d="M284 306L276 284M452 306L440 269L469 253" stroke="#233c40" stroke-width="9"/>
    <path d="M253 283H298M462 253H486" stroke="#233c40" stroke-width="12"/>
    <path d="M216 403L350 403" stroke="#536862" stroke-width="4"/>
  </g>

  <!-- Pelican rider -->
  <g stroke="#233c40" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M253 237L211 213L226 251L202 249L242 274" fill="#fcfcf0"/>
    <path d="M255 208C213 236 228 282 282 292C325 303 367 277 371 239L348 204Z" fill="#fffef4"/>
    <path d="M270 232Q299 213 336 237Q315 278 269 264Q286 257 293 246" fill="#d8e1d7"/>
    <path d="M335 236C350 211 341 181 349 155C356 131 394 132 409 149C423 170 408 188 390 193L389 240Q367 265 347 251" fill="#fffef4"/>
    <path d="M359 142L346 128L367 132L366 116L384 134" fill="#fffef4"/>
    <path d="M397 169L560 192Q521 250 417 216L395 191Z" fill="#f6b34c"/>
    <path d="M399 169L564 189L568 200L404 185" fill="#ffd574"/>
    <path d="M421 204Q477 229 525 210" fill="none" stroke="#cf843c" stroke-width="3"/>

    <!-- The passenger is also lunch -->
    <path d="M484 204Q506 181 532 199L546 186L544 211L531 207Q505 221 484 204Z" fill="#75b8ba" stroke-width="3"/>
    <circle cx="495" cy="201" r="2.5" fill="#233c40" stroke="none"/>
    <path d="M511 197L518 187L524 198" fill="#75b8ba" stroke-width="2"/>

    <!-- Sunglasses and determined eyebrow -->
    <path d="M365 157L389 159L386 173Q368 177 365 157Z" fill="#233c40"/>
    <path d="M389 160L404 163M359 155L365 157" fill="none" stroke-width="3"/>
    <path d="M368 149L389 152" fill="none"/>
    <path d="M344 213Q397 235 458 252" fill="none" stroke="#233c40" stroke-width="17"/>
    <path d="M344 213Q397 235 458 252" fill="none" stroke="#fffef4" stroke-width="10"/>
    <path d="M452 249L470 251L464 258" fill="#f6b34c" stroke-width="3"/>

    <!-- A fluttering tie: peak management energy -->
    <path d="M352 198L366 204L357 216L338 204Z" fill="#e6684b" stroke-width="2"/>
    <path d="M351 207L330 230L313 218L342 204Z" fill="#e6684b" stroke-width="2">
      <animate attributeName="d" values="M351 207L330 230L313 218L342 204Z;M351 207L320 219L311 204L342 204Z;M351 207L330 230L313 218L342 204Z" dur=".8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Flexible leg follows a pedaling rhythm -->
  <path d="M303 284L329 329L370 403" fill="none" stroke="#233c40" stroke-width="10" stroke-linecap="round">
    <animate attributeName="d" values="M303 284L329 329L370 403;M303 284L310 348L350 423;M303 284L308 333L330 403;M303 284L337 322L350 383;M303 284L329 329L370 403" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M303 284L329 329L370 403" fill="none" stroke="#edab46" stroke-width="6" stroke-linecap="round">
    <animate attributeName="d" values="M303 284L329 329L370 403;M303 284L310 348L350 423;M303 284L308 333L330 403;M303 284L337 322L350 383;M303 284L329 329L370 403" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(350 403)">
    <circle r="11" fill="#fff5dc" stroke="#233c40" stroke-width="4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-20 0H20" stroke="#233c40" stroke-width="5"/>
      <path d="M14-5L34 0L16 6Z" fill="#f6b34c" stroke="#233c40" stroke-width="2"/>
    </g>
  </g>

  <g fill="none" stroke="#78918e" stroke-width="3" stroke-linecap="round">
    <path d="M159 291H194M140 307H184M163 324H197"/>
  </g>

  <!-- Dedicated text footer -->
  <rect y="534" width="800" height="66" fill="#233c40"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="558" fill="#fff5dc" font-size="18" font-weight="bold">He calls it commuting. The fish calls it a hostile takeover.</text>
    <text x="400" y="584" fill="#ffdc8a" font-size="16">2026-10-31 21:31:05 SGT (UTC+08:00)</text>
  </g>
</svg>