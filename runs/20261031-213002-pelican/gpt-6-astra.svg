<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A determined pelican pedals a small bicycle with a huge beak full of fish. Its wheels spin and its body bobs in a looping animation.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0L10 10" stroke="#fff" stroke-width="1"/>
    </pattern>
    <g id="wheel">
      <circle r="73" fill="#fffdf0" stroke="#233747" stroke-width="12"/>
      <circle r="63" fill="none" stroke="#8fb8ba" stroke-width="3"/>
      <g stroke="#729399" stroke-width="3">
        <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44"/>
      </g>
      <path d="M-27-57A63 63 0 0 1 27-57" fill="none" stroke="#f5b83e" stroke-width="6"/>
      <circle r="9" fill="#233747"/>
    </g>
    <g id="fish">
      <path d="M-18 0Q0-19 22 0Q0 19-18 0L-31-12V12Z" fill="#61b8bb" stroke="#233747" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="12" cy="-2" r="3" fill="#233747"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6dd"/>
  <circle cx="665" cy="150" r="49" fill="#f8cd62"/>
  <g fill="#fff" opacity=".85">
    <path d="M49 173Q48 150 72 151Q84 124 106 148Q133 142 139 173Z"/>
    <path d="M508 145Q506 124 531 128Q543 104 564 127Q588 122 596 145Z"/>
  </g>

  <text x="400" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#233747" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#846044">ONE BIRD. TWO WHEELS. ZERO SELF-CONTROL.</text>

  <path d="M0 444Q163 421 337 442T800 438V505H0Z" fill="#d9e4c3"/>
  <path d="M0 481H800" stroke="#233747" stroke-width="4"/>
  <ellipse cx="393" cy="479" rx="240" ry="12" fill="#233747" opacity=".12"/>

  <g transform="translate(246 400)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(555 400)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246 400L319 300L379 400H246L493 300L379 400M319 300H493" stroke="#233747" stroke-width="13"/>
    <path d="M246 400L319 300L379 400H246L493 300L379 400M319 300H493" stroke="#e96a52" stroke-width="7"/>
    <path d="M555 400L487 282L484 265L508 256" stroke="#233747" stroke-width="9"/>
    <path d="M319 300L309 277" stroke="#233747" stroke-width="8"/>
    <path d="M289 276H334" stroke="#233747" stroke-width="13"/>
    <path d="M505 255L527 255" stroke="#578d91" stroke-width="12"/>
  </g>
  <circle cx="379" cy="400" r="19" fill="#f8cd62" stroke="#233747" stroke-width="5"/>
  <g transform="translate(379 400)">
    <g stroke="#233747" stroke-width="6" stroke-linecap="round">
      <path d="M-22 0H22"/>
      <path d="M-28-5V5M28-5V5" stroke-width="8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M330 284L356 326L393 371" fill="none" stroke="#233747" stroke-width="15" stroke-linecap="round"/>
    <path d="M330 284L356 326L393 371" fill="none" stroke="#e8a43f" stroke-width="9" stroke-linecap="round"/>
    <path d="M392 368L413 378L381 383Z" fill="#f7b941" stroke="#233747" stroke-width="4">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur=".8s" repeatCount="indefinite"/>
    </path>

    <path d="M271 240L226 220L247 257L222 250L262 282" fill="#fffdf4" stroke="#233747" stroke-width="5" stroke-linejoin="round"/>
    <path d="M266 231Q280 199 335 211Q365 219 369 185L366 162Q366 123 404 121Q443 123 440 160L427 216Q419 258 372 287Q328 311 282 285Q253 267 266 231Z" fill="#fffdf4" stroke="#233747" stroke-width="5"/>
    <path d="M276 245Q306 223 350 240Q347 272 296 278" fill="#dce8df" stroke="#233747" stroke-width="4"/>
    <path d="M294 248L318 251M288 259L310 262" stroke="#8da4a2" stroke-width="3" stroke-linecap="round"/>

    <path d="M367 162Q401 179 434 162" fill="none" stroke="#e96a52" stroke-width="13"/>
    <path d="M371 169L339 187L347 167L322 159L373 157" fill="#e96a52" stroke="#233747" stroke-width="3"/>

    <path d="M424 166L655 181Q631 261 522 246Q461 237 424 185Z" fill="#f3b44c" stroke="#233747" stroke-width="5"/>
    <path d="M444 188Q487 226 539 230Q599 235 630 195" fill="#fbd78a" stroke="#d79237" stroke-width="2"/>
    <use href="#fish" transform="translate(488 205) rotate(20) scale(.8)"/>
    <use href="#fish" transform="translate(546 213) rotate(-12) scale(.85)"/>
    <use href="#fish" transform="translate(595 204) rotate(15) scale(.7)"/>
    <path d="M428 164L663 178L650 190L427 184Z" fill="#ffd361" stroke="#233747" stroke-width="4" stroke-linejoin="round"/>

    <ellipse cx="416" cy="150" rx="10" ry="13" fill="#fff" stroke="#233747" stroke-width="3"/>
    <circle cx="421" cy="152" r="4" fill="#233747"/>
    <path d="M403 131L425 137" stroke="#233747" stroke-width="5" stroke-linecap="round"/>
    <path d="M361 132Q360 104 392 103Q419 104 430 124L361 132Z" fill="#61b8bb" stroke="#233747" stroke-width="4"/>
    <path d="M378 109L381 121M394 108L398 119" stroke="#233747" stroke-width="4" stroke-linecap="round"/>
    <path d="M358 132L436 124" stroke="#233747" stroke-width="6" stroke-linecap="round"/>

    <path d="M357 232Q397 231 433 250L510 256" fill="none" stroke="#233747" stroke-width="17" stroke-linecap="round"/>
    <path d="M357 232Q397 231 433 250L510 256" fill="none" stroke="#fffdf4" stroke-width="10" stroke-linecap="round"/>
    <path d="M491 250L500 260M501 250L510 260" stroke="#233747" stroke-width="3"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#233747">
    <path d="M67 196Q67 184 80 184H211Q224 184 224 197V242Q224 254 211 254H185L201 275L164 254H80Q67 254 67 242Z" fill="#fff" stroke="#233747" stroke-width="3"/>
    <text x="145" y="212" text-anchor="middle" font-size="18" font-weight="bold">“It's called</text>
    <text x="145" y="236" text-anchor="middle" font-size="18" font-weight="bold">carp-loading.”</text>
  </g>

  <g stroke="#729399" stroke-width="4" stroke-linecap="round">
    <path d="M134 328H190M147 344H185M119 360H175">
      <animate attributeName="opacity" values=".3;1;.3" dur=".8s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="0" y="505" width="800" height="95" fill="#233747"/>
  <text x="400" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff6dd">His bicycle is lightweight. His lunch has other plans.</text>
  <path d="M125 554H675" stroke="#68808a"/>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff6dd">2026-10-31 21:30:02 SGT (UTC+08:00)</text>
</svg>