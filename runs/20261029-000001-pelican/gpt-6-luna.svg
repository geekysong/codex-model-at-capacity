<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly delivering absolutely nothing.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe8ff"/>
      <stop offset="1" stop-color="#fff1bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#31404a" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#24313a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#24313a}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 420 Q130 350 260 420 T520 420 T800 410 V520 H0Z" fill="#8ed17c"/>
  <path d="M0 485 Q170 445 330 490 T650 480 T800 470 V540 H0Z" fill="#63b965"/>
  <path d="M0 530 H800" stroke="#43534a" stroke-width="8"/>

  <g filter="url(#shadow)">
    <rect x="38" y="28" width="724" height="88" rx="20" fill="#fff8df" class="ink"/>
    <text x="400" y="70" text-anchor="middle" class="label" font-size="36" font-weight="900">THE GREAT PELICAN COMMUTE</text>
    <text x="400" y="98" text-anchor="middle" class="label" font-size="18" font-weight="700">One bird. Two wheels. Zero cargo. Maximum confidence.</text>
  </g>

  <!-- bicycle frame -->
  <g class="ink" fill="none">
    <circle cx="270" cy="430" r="78" stroke-width="8"/>
    <circle cx="560" cy="430" r="78" stroke-width="8"/>
    <path d="M270 430 L355 330 L470 430 L270 430 M355 330 L420 330 L470 430 M355 330 L330 290"/>
    <path d="M470 430 L520 325 L585 325"/>
    <path d="M520 325 L548 285"/>
  </g>

  <!-- animated wheels -->
  <g fill="none" class="ink" stroke-width="3">
    <g>
      <circle cx="270" cy="430" r="62" stroke="#6b8790"/>
      <path d="M270 368V492 M208 430H332 M226 386L314 474 M314 386L226 474"/>
      <animateTransform attributeName="transform" type="rotate" from="0 270 430" to="360 270 430" dur="2s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="560" cy="430" r="62" stroke="#6b8790"/>
      <path d="M560 368V492 M498 430H622 M516 386L604 474 M604 386L516 474"/>
      <animateTransform attributeName="transform" type="rotate" from="0 560 430" to="360 560 430" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pelican body and bobbing rider -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="397" cy="273" rx="82" ry="67" fill="#f4f7f2" class="ink"/>
    <path d="M345 265 Q290 235 302 176 Q314 123 363 150 Q398 169 405 227Z" fill="#e7eee9" class="ink"/>
    <path d="M330 186 Q283 171 231 192 Q276 227 340 219Z" fill="#f3a33b" class="ink"/>
    <path d="M231 192 Q276 201 329 202" fill="none" stroke="#b96c20" stroke-width="5"/>
    <circle cx="351" cy="177" r="10" fill="#24313a"/>
    <circle cx="354" cy="173" r="3" fill="#fff"/>
    <path d="M368 229 Q413 204 452 239 Q470 258 453 286 Q420 310 371 292Z" fill="#d8e3df" class="ink"/>
    <path d="M394 281 Q412 311 440 327" fill="none" class="ink"/>
    <path d="M440 327 L469 350 M440 327 L420 353" fill="none" class="ink"/>
    <path d="M380 285 Q364 320 347 350" fill="none" class="ink"/>
    <path d="M347 350 L326 370 M347 350 L372 368" fill="none" class="ink"/>
    <path d="M346 350 L355 395 M440 327 L455 384" fill="none" class="ink"/>
    <path d="M355 395 L383 405 M455 384 L485 394" fill="none" class="ink"/>
    <path d="M382 404 L410 430 M410 430 L438 404" fill="none" class="ink"/>
    <g transform="translate(410 430)">
      <circle r="18" fill="#f4b942" class="ink"/>
      <path d="M0 0 L30 -12 M0 0 L-18 25" class="ink"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <path d="M386 251 Q408 263 429 249" fill="none" stroke="#24313a" stroke-width="5"/>
    <text x="480" y="213" class="label" font-size="18" font-weight="700" transform="rotate(8 480 213)">“Beep! I’m late for lunch!”</text>
  </g>

  <g class="label" font-weight="900">
    <text x="95" y="395" font-size="24" transform="rotate(-8 95 395)">HONK</text>
    <text x="642" y="365" font-size="22" transform="rotate(10 642 365)">FLAP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="548" width="620" height="34" rx="12" fill="#fff8df" class="ink"/>
    <text x="400" y="571" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-29 00:02:22 SGT (UTC+08:00)</text>
  </g>
</svg>