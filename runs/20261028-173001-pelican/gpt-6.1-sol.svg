<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#666a75"/>
      <stop offset="1" stop-color="#343741"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#111827" flood-opacity=".25"/>
    </filter>
    <style>
      .ink { stroke:#202533; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#202533; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff3a8" opacity=".85"/>
  <path d="M0 370 Q100 300 200 365 T400 350 T600 360 T800 330 V440 H0Z" fill="#9ccf8d"/>
  <path d="M0 420 Q160 390 300 425 T600 415 T800 430 V600 H0Z" fill="#78a96d"/>
  <rect y="455" width="800" height="145" fill="url(#road)"/>
  <path d="M0 525 H800" stroke="#f8d66d" stroke-width="8" stroke-dasharray="48 28"/>

  <g class="label" text-anchor="middle">
    <text x="400" y="72" font-size="42" font-weight="900" fill="#ffffff" stroke="#202533" stroke-width="3" paint-order="stroke">PELICAN PEDAL PANIC</text>
    <text x="400" y="108" font-size="21" font-weight="700">“When the beak is bigger than the bike, commute anyway.”</text>
  </g>

  <g filter="url(#shadow)">
    <g id="bike">
      <g fill="none" class="ink">
        <circle cx="250" cy="455" r="73" fill="#d9edf7"/>
        <circle cx="570" cy="455" r="73" fill="#d9edf7"/>
        <path d="M250 455 L355 335 L445 455 L250 455 L355 455 L570 455 L445 455 L400 355"/>
        <path d="M355 335 L325 300"/>
        <path d="M325 300 L295 300"/>
        <path d="M400 355 L425 322 L457 322"/>
        <path d="M445 455 L470 420"/>
      </g>
      <g id="wheelSpokes" stroke="#566070" stroke-width="3">
        <path d="M250 382V528 M177 455H323 M198 403L302 507 M198 507L302 403"/>
        <path d="M570 382V528 M497 455H643 M518 403L622 507 M518 507L622 403"/>
      </g>
      <g fill="#202533">
        <circle cx="250" cy="455" r="8"/>
        <circle cx="570" cy="455" r="8"/>
        <circle cx="355" cy="455" r="12"/>
      </g>
      <g fill="none" class="ink">
        <path d="M355 455 Q330 420 310 455"/>
        <path d="M355 455 Q380 490 400 455"/>
      </g>
      <g fill="#e85d3f" class="ink">
        <ellipse cx="355" cy="455" rx="13" ry="8"/>
        <ellipse cx="400" cy="455" rx="13" ry="8"/>
      </g>
      <path d="M458 320 Q475 305 492 320" fill="none" class="ink"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="396" cy="260" rx="92" ry="105" fill="#f3f1e8" class="ink"/>
      <path d="M332 245 Q355 188 417 192 Q473 195 481 255 Q450 232 418 248 Q380 268 332 245Z" fill="#d7d9d2" class="ink"/>
      <path d="M388 225 Q415 185 454 210 Q476 224 467 254 Q440 271 405 255Z" fill="#fffdf5" class="ink"/>
      <ellipse cx="443" cy="222" rx="9" ry="12" fill="#202533"/>
      <circle cx="446" cy="218" r="3" fill="#ffffff"/>
      <path d="M459 240 Q526 238 600 274 Q535 300 459 268Z" fill="#f0a33a" class="ink"/>
      <path d="M476 264 Q528 274 586 278 Q535 322 468 287Z" fill="#e78332" class="ink"/>
      <path d="M367 324 Q390 351 414 369" fill="none" class="ink"/>
      <path d="M414 369 Q441 388 464 414" fill="none" class="ink"/>
      <path d="M352 322 Q333 352 317 374" fill="none" class="ink"/>
      <path d="M317 374 Q299 398 292 425" fill="none" class="ink"/>
      <path d="M287 426 Q306 433 322 425" fill="none" class="ink"/>
      <path d="M457 414 Q476 423 490 412" fill="none" class="ink"/>
      <path d="M355 282 Q321 300 300 324" fill="none" stroke="#202533" stroke-width="18" stroke-linecap="round"/>
      <path d="M440 283 Q470 300 490 325" fill="none" stroke="#202533" stroke-width="18" stroke-linecap="round"/>
      <g class="label" text-anchor="middle">
        <text x="403" y="258" font-size="18" font-weight="900" fill="#202533">NO</text>
        <text x="403" y="278" font-size="18" font-weight="900" fill="#202533">FLYING?</text>
      </g>
    </g>
  </g>

  <g class="label">
    <path d="M615 170 Q690 140 742 188 Q760 208 742 228 Q700 250 635 226Z" fill="#ffffff" class="ink"/>
    <text x="689" y="192" font-size="18" font-weight="800" text-anchor="middle">“Beak first,</text>
    <text x="689" y="214" font-size="18" font-weight="800" text-anchor="middle">traffic laws later!”</text>
  </g>

  <g class="label" text-anchor="middle">
    <rect x="116" y="555" width="568" height="31" rx="10" fill="#fff8dc" stroke="#202533" stroke-width="3"/>
    <text x="400" y="577" font-size="16" font-weight="700">2026-10-28 17:30:04 SGT (UTC+08:00)</text>
  </g>

  <animateTransform xlink:href="#wheelSpokes" attributeName="transform" type="rotate" from="0 250 455" to="360 250 455" dur="2s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#wheelSpokes" attributeName="transform" type="rotate" from="0 570 455" to="360 570 455" dur="2s" repeatCount="indefinite"/>
</svg>