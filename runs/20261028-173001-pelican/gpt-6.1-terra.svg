<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Pelican Bicycle Escape</title>
  <desc id="desc">A satirical pelican rides a bicycle while carrying an absurdly tiny briefcase.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#626a78"/>
      <stop offset="1" stop-color="#343946"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17202b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17202b}
      .small{font-size:17px;font-weight:bold}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff5a8" opacity=".9"/>
  <path d="M0 365 Q120 315 240 360 T480 350 T800 340 V470 H0Z" fill="#83c77e"/>
  <path d="M0 430 Q200 390 400 430 T800 420 V600 H0Z" fill="url(#road)"/>
  <path d="M0 515 H800" stroke="#f7d76d" stroke-width="8" stroke-dasharray="52 32"/>

  <g filter="url(#shadow)">
    <rect x="70" y="42" width="660" height="78" rx="22" fill="#fff" stroke="#17202b" stroke-width="7"/>
    <text x="400" y="91" text-anchor="middle" class="label" font-size="34" font-weight="900">THE GREAT PELICAN GETAWAY</text>
  </g>
  <text x="400" y="148" text-anchor="middle" class="label" font-size="20" font-weight="700">“Why walk when you can pedal past responsibility?”</text>

  <g id="bike">
    <g id="wheels" fill="none" class="ink">
      <circle cx="250" cy="445" r="82" stroke-width="9"/>
      <circle cx="570" cy="445" r="82" stroke-width="9"/>
      <g stroke="#a8d6e6" stroke-width="3">
        <path d="M250 363V527M168 445H332M192 387L308 503M192 503L308 387"/>
        <path d="M570 363V527M488 445H652M512 387L628 503M512 503L628 387"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 410 445" to="360 410 445" dur="2.4s" repeatCount="indefinite"/>
    </g>

    <g class="ink" fill="none">
      <path d="M250 445 L350 360 L470 445 L570 445 L430 445 L350 360"/>
      <path d="M350 360 L325 315"/>
      <path d="M470 445 L500 350"/>
      <path d="M500 350 L540 330"/>
    </g>
    <rect x="312" y="307" width="58" height="18" rx="9" fill="#e85d4a" class="ink"/>
    <path d="M493 348 Q508 328 527 336" fill="none" class="ink"/>

    <g id="pelican" class="ink">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
        <path d="M385 337 Q370 282 405 230 Q440 180 500 209 Q535 226 525 270 Q516 310 476 328 L450 365Z" fill="#f5f0df"/>
        <path d="M405 230 Q380 198 402 166 Q425 135 460 157 Q493 175 500 209 Q447 195 405 230Z" fill="#fffaf0"/>
        <path d="M457 161 Q470 125 506 132 Q544 140 538 177 Q533 207 500 209Z" fill="#f5f0df"/>
        <circle cx="500" cy="166" r="7" fill="#17202b" stroke="none"/>
        <path d="M516 185 Q604 185 646 219 Q654 226 646 234 Q592 255 517 242 Q495 226 516 185Z" fill="#f2a33b"/>
        <path d="M546 215 Q591 218 632 226" stroke="#c46d23" stroke-width="4"/>
        <path d="M443 294 Q476 276 509 300 L526 338 Q482 359 438 332Z" fill="#d7e6ea"/>
        <path d="M405 252 Q430 270 449 309" fill="none"/>
        <path d="M475 331 Q465 378 437 405" fill="none"/>
        <path d="M474 330 Q505 364 535 390" fill="none"/>
        <path d="M437 405 L407 418 M535 390 L562 405" fill="none"/>
        <path d="M445 307 Q420 348 390 361" fill="none"/>
        <path d="M390 361 L365 349" fill="none"/>
      </g>
    </g>

    <g id="pedals" class="ink" fill="none">
      <circle cx="430" cy="445" r="18" stroke-width="5"/>
      <path d="M430 445 L405 420 M430 445 L455 470" stroke-width="5"/>
      <path d="M391 414 H414 M447 472 H470" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0 430 445" to="360 430 445" dur="1.1s" repeatCount="indefinite"/>
    </g>

    <g transform="translate(515 258) rotate(8)">
      <rect x="0" y="0" width="86" height="63" rx="8" fill="#c84d55" class="ink"/>
      <path d="M18 0 Q43 -28 68 0" fill="none" class="ink"/>
      <text x="43" y="39" text-anchor="middle" class="label" font-size="14" font-weight="900" fill="#fff">TAXES?</text>
    </g>
  </g>

  <g transform="translate(105 220)">
    <path d="M0 55 Q35 20 70 55" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
    <path d="M48 55 Q82 18 115 55" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g transform="translate(625 330)">
    <path d="M0 0 l18 -28 18 28 18 -28 18 28" fill="none" class="ink" stroke="#fff" stroke-width="5"/>
    <text x="42" y="54" text-anchor="middle" class="label small">HONK!</text>
  </g>

  <text x="400" y="566" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 17:31:47 SGT (UTC+08:00)</text>
</svg>