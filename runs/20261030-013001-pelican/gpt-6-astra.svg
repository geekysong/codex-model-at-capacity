<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle Scheme</title>
  <desc id="desc">A smug pelican with an enormous bill pedals a tiny bicycle, carrying fish beneath a sign announcing a bill reduction scheme. Wheels spin and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r="1" fill="#dbcba8" opacity=".25"/>
      <circle cx="17" cy="19" r=".8" fill="#dbcba8" opacity=".25"/>
    </pattern>
    <g id="wheel">
      <circle r="70" fill="#fff8df" stroke="#263640" stroke-width="10"/>
      <circle r="59" fill="none" stroke="#d1ba85" stroke-width="2"/>
      <g stroke="#6d848b" stroke-width="3">
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <circle r="8" fill="#263640"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff3d5"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 390Q145 360 270 390T540 384T800 391V491H0Z" fill="#d6e6d2"/>
  <circle cx="690" cy="145" r="39" fill="#f9c85d"/>
