    <path d="M524 139Q517 122 536 119Q547 99 565 117Q592 115 594 139Z"/>
  </g>

  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="37" font-weight="900" letter-spacing="1" fill="#25363d">THE PELICAN CYCLE SCHEME</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#6a6559">A very large bill. A very small transport budget.</text>

  <g stroke="#263640" stroke-linejoin="round">
    <path d="M114 280V421" stroke-width="8"/>
