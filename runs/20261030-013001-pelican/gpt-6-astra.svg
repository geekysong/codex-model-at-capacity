  <text x="696" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-style="italic" fill="#263640">honk!</text>

  <rect x="0" y="507" width="800" height="93" fill="#263640"/>
  <text x="400" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff3d5">He cut his carbon footprint. His bill remains enormous.</text>
