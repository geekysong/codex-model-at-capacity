  <text x="116" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#263640">
    <tspan x="116">BILL REDUCTION</tspan>
    <tspan x="116" dy="22">SCHEME</tspan>
    <tspan x="116" dy="23" font-size="14">Results may vary.</tspan>
  </text>

