<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#222">Balanced Seesaw</text>

  <!-- level beam -->
  <rect x="90" y="188" width="420" height="18" rx="4" fill="#8b5a2b" stroke="#4a3018" stroke-width="2"/>

  <!-- pivot -->
  <polygon points="300,206 270,270 330,270" fill="#6b7280" stroke="#374151" stroke-width="2"/>
  <circle cx="300" cy="197" r="8" fill="#f59e0b" stroke="#92400e" stroke-width="2"/>
  <text x="300" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">pivot</text>

  <!-- masses -->
  <rect x="155" y="128" width="50" height="50" rx="5" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
  <text x="180" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>
  <line x1="180" y1="178" x2="180" y2="188" stroke="#374151" stroke-width="3"/>

  <rect x="455" y="128" width="50" height="50" rx="5" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
  <text x="480" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>
  <line x1="480" y1="178" x2="480" y2="188" stroke="#374151" stroke-width="3"/>

  <!-- force arrows -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#111827"/>
    </marker>
  </defs>
  <line x1="180" y1="82" x2="180" y2="122" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="180" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">F = 6g</text>
  <line x1="480" y1="82" x2="480" y2="122" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">F = 4g</text>

  <!-- distance dimensions -->
  <line x1="180" y1="325" x2="300" y2="325" stroke="#374151" stroke-width="2"/>
  <line x1="180" y1="317" x2="180" y2="333" stroke="#374151" stroke-width="2"/>
  <line x1="300" y1="317" x2="300" y2="333" stroke="#374151" stroke-width="2"/>
  <text x="240" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">2 m</text>

  <line x1="300" y1="325" x2="480" y2="325" stroke="#374151" stroke-width="2"/>
  <line x1="480" y1="317" x2="480" y2="333" stroke="#374151" stroke-width="2"/>
  <text x="390" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">3 m (x)</text>

  <!-- torque equation -->
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#111827">6 × 2 = 4 × 3  →  x = 3 m</text>
</svg>