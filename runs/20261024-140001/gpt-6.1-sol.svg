<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <title>Level seesaw in static equilibrium</title>
  <desc>A 6 kilogram mass hangs 2 meters left of the pivot and a 4 kilogram mass hangs 3 meters right, producing balanced torques.</desc>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="90" y="190" width="420" height="20" rx="8" fill="#8b5e3c" stroke="#4a2f1d" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,210 260,290 340,290" fill="#607d8b" stroke="#263238" stroke-width="3"/>
  <circle cx="300" cy="200" r="8" fill="#263238"/>

  <!-- Left hanger and mass -->
  <line x1="180" y1="210" x2="180" y2="260" stroke="#263238" stroke-width="3"/>
  <rect x="145" y="260" width="70" height="50" rx="6" fill="#e57373" stroke="#8e2f2f" stroke-width="3"/>
  <text x="180" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">6 kg</text>

  <!-- Right hanger and mass -->
  <line x1="480" y1="210" x2="480" y2="260" stroke="#263238" stroke-width="3"/>
  <rect x="445" y="260" width="70" height="50" rx="6" fill="#64b5f6" stroke="#245a86" stroke-width="3"/>
  <text x="480" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="225" x2="180" y2="252" stroke="#b71c1c" stroke-width="4"/>
  <polygon points="180,260 172,246 188,246" fill="#b71c1c"/>
  <text x="180" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#8e2f2f">F = 6g downward</text>

  <line x1="480" y1="225" x2="480" y2="252" stroke="#1565c0" stroke-width="4"/>
  <polygon points="480,260 472,246 488,246" fill="#1565c0"/>
  <text x="480" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#245a86">F = 4g downward</text>

  <!-- Distance dimension lines -->
  <line x1="180" y1="165" x2="300" y2="165" stroke="#263238" stroke-width="2"/>
  <line x1="180" y1="158" x2="180" y2="172" stroke="#263238" stroke-width="2"/>
  <line x1="300" y1="158" x2="300" y2="172" stroke="#263238" stroke-width="2"/>
  <polygon points="180,165 192,160 192,170" fill="#263238"/>
  <polygon points="300,165 288,160 288,170" fill="#263238"/>
  <text x="240" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#263238">2 m</text>

  <line x1="300" y1="125" x2="480" y2="125" stroke="#263238" stroke-width="2"/>
  <line x1="300" y1="118" x2="300" y2="132" stroke="#263238" stroke-width="2"/>
  <line x1="480" y1="118" x2="480" y2="132" stroke="#263238" stroke-width="2"/>
  <polygon points="300,125 312,120 312,130" fill="#263238"/>
  <polygon points="480,125 468,120 468,130" fill="#263238"/>
  <text x="390" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#263238">x = 3 m</text>

  <!-- Explanation -->
  <text x="300" y=" forty" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#263238">BALANCED</text>
  <text x="300" y=" seventy" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#263238">6 × 2 = 4 × 3</text>
</svg>