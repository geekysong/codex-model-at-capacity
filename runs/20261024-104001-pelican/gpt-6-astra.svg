<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee8ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="1" stop-color="#343434"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#18344a" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd85c"/>
  <path d="M0 355 Q150 285 300 355 T610 350 T800 335 V600 H0Z" fill="#b8dc8b"/>
  <path d="M0 430 Q180 390 350 425 T800 410 V600 H0Z" fill="url(#road)"/>
  <path d="M0 507 H800" stroke="#f6d76a" stroke-width="8" stroke-dasharray="55 35" opacity=".8"/>
  <path d="M80 355 q35-25 70 0 q-35-6-70 0 M620 345 q35-25 70 0 q-35-6-70 0" fill="#fff" opacity=".9"/>

  <g filter="url(#shadow)">
    <text x="400" y="70" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="44" fill="#123b53" stroke="#fff" stroke-width="3" paint-order="stroke">THE BEAK BIKE</text>
    <text x="400" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d24b3f">“No hands, no brakes, no idea.”</text>
  </g>

  <!-- bicycle -->
  <g stroke="#202b35" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="270" cy="455" r="72" fill="#d8f1ff"/>
    <circle cx="590" cy="455" r="72" fill="#d8f1ff"/>
    <path d="M270 455 L365 330 L455 455 L270 455 M365 330 L590 455 M455 455 L510 350 L590 455"/>
    <path d="M349 330 H385 M510 350 H550"/>
    <path d="M365 330 L345 285 M345 285 H390"/>
    <path d="M455 455 q-18-36 10-55 q28 19 0 55"/>
    <path d="M445 400 l45 0"/>
    <path d="M510 350 l-12-28"/>
  </g>
  <g fill="#f15b4f" stroke="#202b35" stroke-width="6">
    <circle cx="365" cy="330" r="10"/>
    <circle cx="455" cy="455" r="10"/>
  </g>

  <!-- pelican body -->
  <g filter="url(#shadow)">
    <path d="M360 285 Q335 220 385 165 Q440 112 500 164 Q535 194 520 270 L475 340 Q420 358 360 285Z" fill="#f7f4e9" stroke="#263746" stroke-width="7"/>
    <path d="M388 190 Q405 155 445 150 Q482 146 505 175 Q464 188 438 230 Q415 255 390 240Z" fill="#e5edf0" stroke="#263746" stroke-width="6"/>
    <path d="M405 230 Q445 215 492 231 L560 271 Q580 285 560 299 L480 294 Q425 278 405 230Z" fill="#f5a04b" stroke="#263746" stroke-width="7"/>
    <path d="M425 244 Q467 250 525 282" fill="none" stroke="#c96b2e" stroke-width="5"/>
    <circle cx="442" cy="183" r="10" fill="#fff" stroke="#263746" stroke-width="5"/>
    <circle cx="445" cy="184" r="4" fill="#263746"/>
    <path d="M370 275 Q400 310 430 318" fill="none" stroke="#263746" stroke-width="8"/>
    <path d="M480 307 Q492 350 474 374" fill="none" stroke="#263746" stroke-width="8"/>
    <path d="M475 373 q-35 15-59 0 M474 373 q30 17 54 2" fill="none" stroke="#f5a04b" stroke-width="9"/>
    <path d="M389 319 Q350 345 329 378" fill="none" stroke="#263746" stroke-width="9"/>
    <path d="M329 378 q-20 12-29-4" fill="none" stroke="#f5a04b" stroke-width="9"/>
    <path d="M495 200 q32-21 50-1" fill="none" stroke="#263746" stroke-width="7"/>
  </g>

  <!-- helmet and goggles -->
  <path d="M382 173 Q405 125 456 139 Q473 143 486 157 L477 176 Q426 153 382 173Z" fill="#e74c3c" stroke="#263746" stroke-width="7"/>
  <path d="M407 174 h32 M448 174 h28" stroke="#263746" stroke-width="6"/>
  <circle cx="423" cy="174" r="15" fill="#8fe3f1" stroke="#263746" stroke-width="5"/>
  <circle cx="461" cy="174" r="15" fill="#8fe3f1" stroke="#263746" stroke-width="5"/>

  <!-- comic motion lines -->
  <g stroke="#d24b3f" stroke-width="6" stroke-linecap="round">
    <path d="M170 290 l-35-18"/>
    <path d="M185 320 l-43-4"/>
    <path d="M620 280 l42-25"/>
    <path d="M635 315 l48-5"/>
  </g>

  <g font-family="Arial, sans-serif" font-weight="bold">
    <text x="88" y="555" font-size="19" fill="#fff">LOCAL BIRD CLAIMS HE’S “TOTALLY IN CONTROL.”</text>
    <text x="650" y="390" font-size="32" fill="#d24b3f" transform="rotate(12 650 390)">HONK!</text>
  </g>

  <path d="M560 215 q22-18 42 0" fill="none" stroke="#263746" stroke-width="5"/>
  <path d="M565 207 q16-24 32 0" fill="none" stroke="#263746" stroke-width="5"/>
</svg>