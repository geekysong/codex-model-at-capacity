<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>THE GREAT PELICAN GETAWAY</title>
  <desc>A satirical cartoon of a pelican riding a bicycle while carrying an absurdly large fish.</desc>

  <rect width="800" height="600" fill="#bfe9f2"/>
  <circle cx="690" cy="92" r="48" fill="#ffd86b"/>
  <path d="M0 360 Q120 300 240 355 T480 345 T800 350 V600 H0Z" fill="#8bc7a1"/>
  <path d="M0 438 Q180 390 350 430 T800 420 V600 H0Z" fill="#555b63"/>
  <path d="M0 500 Q180 475 360 505 T800 492" fill="none" stroke="#f8df83" stroke-width="12" stroke-dasharray="38 28"/>

  <g opacity=".75" fill="#fff">
    <path d="M80 120 q30-30 60 0 q30-28 60 2 q-8 28-120 25z"/>
    <path d="M510 145 q25-25 50 0 q25-22 50 2 q-10 24-100 22z"/>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="Impact,Arial Black,sans-serif" font-size="40" fill="#19354a" stroke="#fff" stroke-width="4" paint-order="stroke">THE GREAT PELICAN GETAWAY</text>

  <!-- bicycle -->
  <g fill="none" stroke="#202b35" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="270" cy="470" r="72" fill="#d9eef2"/>
    <circle cx="570" cy="470" r="72" fill="#d9eef2"/>
    <path d="M270 470 L355 350 L445 470 L270 470 L390 470 L355 350"/>
    <path d="M445 470 L510 350 L570 470"/>
    <path d="M500 350 L548 350"/>
    <path d="M340 350 L315 322"/>
    <path d="M335 470 L370 505"/>
    <path d="M370 505 L400 505"/>
  </g>
  <g fill="#f04e45" stroke="#202b35" stroke-width="6">
    <circle cx="355" cy="470" r="13"/>
    <path d="M349 462 L320 430"/>
    <path d="M361 478 L392 500"/>
  </g>

  <!-- pelican body -->
  <g stroke="#263746" stroke-width="6" stroke-linejoin="round">
    <ellipse cx="405" cy="270" rx="83" ry="102" fill="#f7f4e9"/>
    <path d="M350 287 Q315 370 356 412 Q395 438 430 388 L455 302Z" fill="#e8edf0"/>
    <path d="M365 215 Q345 145 400 120 Q460 102 493 160 Q515 204 479 242 Q438 270 365 215Z" fill="#fffdf4"/>
    <path d="M444 167 Q475 135 505 158 Q520 183 489 211 L455 226Z" fill="#f7f4e9"/>
    <path d="M479 198 Q555 214 610 272 Q565 302 473 249Z" fill="#f39b49"/>
    <path d="M479 198 Q550 237 610 272" fill="none" stroke="#d46d32" stroke-width="4"/>
    <ellipse cx="433" cy="171" rx="10" ry="13" fill="#202b35"/>
    <circle cx="436" cy="166" r="3" fill="#fff" stroke="none"/>
    <path d="M390 143 Q415 123 442 140" fill="none" stroke="#263746" stroke-width="8"/>
    <path d="M381 354 Q420 370 458 350" fill="none" stroke="#263746" stroke-width="5"/>
    <path d="M380 378 L372 431" fill="none"/>
    <path d="M430 380 L445 430" fill="none"/>
    <path d="M358 430 L390 430" fill="none" stroke="#f39b49" stroke-width="10"/>
    <path d="M435 430 L467 430" fill="none" stroke="#f39b49" stroke-width="10"/>
  </g>

  <!-- wing gripping handlebar -->
  <path d="M350 270 Q405 300 478 335" fill="none" stroke="#dfe5e8" stroke-width="34" stroke-linecap="round"/>
  <path d="M350 270 Q405 300 478 335" fill="none" stroke="#263746" stroke-width="6" stroke-linecap="round"/>

  <!-- giant fish cargo -->
  <g stroke="#263746" stroke-width="5" stroke-linejoin="round">
    <path d="M205 270 Q260 220 345 260 Q300 320 215 305 Q185 292 205 270Z" fill="#72b7c7"/>
    <path d="M205 270 L170 238 L178 285 L145 310 L215 305" fill="#4d91a5"/>
    <circle cx="318" cy="266" r="6" fill="#202b35"/>
    <path d="M245 253 Q272 270 290 292" fill="none"/>
  </g>
  <path d="M177 286 Q205 298 220 301" fill="none" stroke="#f39b49" stroke-width="5"/>

  <!-- comic motion marks -->
  <g fill="none" stroke="#e85b45" stroke-width="7" stroke-linecap="round">
    <path d="M123 405 l-35 12"/>
    <path d="M132 430 l-42 5"/>
    <path d="M650 385 l38-18"/>
    <path d="M660 415 l43-4"/>
  </g>

  <g transform="translate(575 315)">
    <path d="M0 0 Q48-40 88 0 Q48 32 0 0Z" fill="#fff" stroke="#263746" stroke-width="4"/>
    <text x="44" y="7" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#263746">I'M LATE!</text>
  </g>

  <rect x="88" y="538" width="624" height="42" rx="21" fill="#19354a"/>
  <text x="400" y="566" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#fff">“NO HANDBARS? NO PROBLEM. JUST WING IT.”</text>
</svg>