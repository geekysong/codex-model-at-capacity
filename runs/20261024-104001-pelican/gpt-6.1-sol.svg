<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e9f7d2"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636b"/>
      <stop offset="1" stop-color="#30383e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#23313a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#263238;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#263238;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:2px}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="704" cy="95" r="48" fill="#ffe58b" opacity=".85"/>
  <path d="M0 330 Q120 275 245 325 T500 315 T800 300 V420 H0Z" fill="#acd48d"/>
  <path d="M0 375 Q180 330 355 375 T800 355 V440 H0Z" fill="#85b875"/>
  <g fill="#4c9b69" stroke="#2f684a" stroke-width="4">
    <path d="M82 340 q-20-48 18-77 q-7 38 20 63 q-3-43 29-61 q-8 50 16 75z"/>
    <path d="M650 335 q-18-50 14-78 q-5 37 22 63 q-4-45 28-61 q-8 48 15 76z"/>
  </g>

  <path d="M0 455 Q190 420 395 449 T800 438 V600 H0Z" fill="url(#road)"/>
  <path d="M0 510 Q200 480 400 510 T800 495" fill="none" stroke="#f7df72" stroke-width="7" stroke-dasharray="42 24"/>
  <g fill="#1f292e" opacity=".45">
    <ellipse cx="410" cy="536" rx="170" ry="24"/>
  </g>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" fill="#263238">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#37474f">A pelican discovers that traffic rules are mostly suggestions.</text>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <circle cx="260" cy="470" r="72" fill="none" class="ink"/>
    <circle cx="560" cy="470" r="72" fill="none" class="ink"/>
    <path d="M260 470 L350 350 L445 470 L260 470 L390 470 L350 350 L520 350 L560 470" fill="none" class="ink"/>
    <path d="M520 350 l22-35" fill="none" class="ink"/>
    <path d="M520 315 l48 0" fill="none" class="ink"/>
    <path d="M340 350 l-20-28" fill="none" class="ink"/>
    <path d="M316 321 l-40 0" fill="none" class="ink"/>
    <circle cx="390" cy="470" r="12" fill="#f4c542" class="thin"/>
    <path d="M390 470 l-35-30 M390 470 l35 28" fill="none" class="thin"/>
    <path d="M355 440 l-19 4 M425 498 l18-5" fill="none" class="thin"/>
  </g>

  <!-- pelican body -->
  <g filter="url(#shadow)">
    <ellipse cx="407" cy="265" rx="89" ry="112" fill="#f5f3e9" class="ink"/>
    <path d="M362 315 Q409 345 465 309 L470 364 Q412 395 354 359Z" fill="#d9e3df" class="ink"/>
    <path d="M366 210 Q415 178 456 213 L476 276 Q425 300 369 274Z" fill="#ffffff" class="thin"/>
    <path d="M374 291 Q407 314 449 294" fill="none" class="thin"/>
    <path d="M367 215 Q343 177 358 140 Q373 110 405 132 Q426 103 452 130 Q483 115 493 148 Q505 186 473 220Z" fill="#f6f5ec" class="ink"/>
    <path d="M390 151 Q423 139 456 151" fill="none" class="thin"/>
    <circle cx="390" cy="168" r="9" fill="#263238"/>
    <circle cx="458" cy="168" r="9" fill="#263238"/>
    <circle cx="393" cy="164" r="3" fill="#fff"/>
    <circle cx="461" cy="164" r="3" fill="#fff"/>
    <path d="M394 194 Q425 207 458 191 Q505 184 570 207 Q590 217 572 235 Q500 255 455 230 Q420 219 394 194Z" fill="#f2a43a" class="ink"/>
    <path d="M456 229 Q519 258 573 232 Q557 278 479 262Z" fill="#e88c2d" class="thin"/>
    <path d="M498 217 Q524 221 548 217" fill="none" class="thin"/>
    <path d="M373 263 Q338 279 323 323" fill="none" class="ink"/>
    <path d="M448 274 Q493 292 513 335" fill="none" class="ink"/>
    <path d="M323 322 l-24 35 M513 335 l25 31" fill="none" class="ink"/>
    <path d="M299 356 q20 18 40 3 M538 366 q-18 18-37 1" fill="none" class="ink"/>
    <path d="M370 352 L340 435 M451 352 L470 435" fill="none" class="ink"/>
    <path d="M340 435 q22 15 43 0 M470 435 q21 16 42 0" fill="none" class="ink"/>
    <path d="M357 236 Q326 220 309 248 Q295 272 322 286 Q346 296 371 270Z" fill="#dce7e3" class="thin"/>
    <path d="M454 239 Q487 221 504 248 Q516 273 489 286 Q470 294 449 272Z" fill="#dce7e3" class="thin"/>
    <path d="M384 119 Q405 89 427 119" fill="none" class="ink"/>
  </g>

  <!-- helmet and scarf -->
  <path d="M348 139 Q399 86 460 130 L466 151 Q401 127 351 161Z" fill="#e74c3c" class="ink"/>
  <path d="M365 121 Q385 99 409 94" fill="none" stroke="#ffb6a9" stroke-width="7"/>
  <path d="M474 256 Q528 270 555 307 Q526 313 493 286Z" fill="#e74c3c" class="ink"/>
  <path d="M550 305 l45 17 l-39 12Z" fill="#e74c3c" class="thin"/>

  <!-- sign gag -->
  <g transform="translate(625 360) rotate(7)">
    <path d="M0 0 L0 115" class="ink" fill="none"/>
    <rect x="-65" y="-63" width="144" height="65" rx="10" fill="#fff7c7" class="ink"/>
    <text x="7" y="-32" text-anchor="middle" class="label" font-size="18" fill="#263238">CAUTION</text>
    <text x="7" y="-10" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#d94b38">WIDE LOAD</text>
  </g>

  <!-- motion lines and caption -->
  <path d="M180 390 l-55-18 M188 420 l-67-3 M605 405 l55-18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <rect x="72" y="548" width="656" height="34" rx="17" fill="#263238" opacity=".9"/>
  <text x="400" y="571" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#fff">“I only took the bike lane because the fish lane was crowded!”</text>
</svg>