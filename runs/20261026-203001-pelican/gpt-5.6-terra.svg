<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Greatness</title>
  <desc id="desc">A funny cartoon pelican riding a bicycle, with spinning wheels and a bobbing rider.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: 390px 390px; animation: bob .65s ease-in-out infinite alternate; }
    .legA { transform-box: fill-box; transform-origin: 405px 402px; animation: pedalA 1s linear infinite; }
    .legB { transform-box: fill-box; transform-origin: 438px 402px; animation: pedalB 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(24deg); } }
    @keyframes pedalB { 50% { transform: rotate(-24deg); } }
  </style>

