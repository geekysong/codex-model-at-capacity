  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#17375e">PELICAN PEDALS TO GREATNESS!</text>
  <text x="400" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#315a6e">“No fish? No problem. I’ll cycle to the buffet.”</text>

