<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle</title>
  <desc id="desc">A smug pelican rides a bicycle, carrying a comically oversized fish in its bill.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#b8edee"/>
      <stop offset="1" stop-color="#fff1d3"/>
    </linearGradient>
    <linearGradient id="beak" x2="0" y2="1">
      <stop stop-color="#ffbd45"/>
      <stop offset="1" stop-color="#ef6b38"/>
    </linearGradient>
    <style>
      .ink{stroke:#193a43;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#fff8e9;stroke:#193a43;stroke-width:8}
      .spokes{stroke:#8ca9a2;stroke-width:3}
      .frame{fill:none;stroke:#ed5c42;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .wheelspin{transform-box:fill-box;transform-origin:center;animation:spin 2.8s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob 1.4s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="46" fill="#ffd36c"/>
  <path d="M0 360Q115 302 235 360T470 354T800 345V525H0Z" fill="#a8d5a4"/>
  <path d="M0 405Q160 365 300 410T590 400T800 390V530H0Z" fill="#77b78e"/>
  <path d="M0 478H800V548H0Z" fill="#f4d89b"/>
  <path d="M0 493H800" stroke="#c89d67" stroke-width="5" stroke-dasharray="22 18"/>
  <path d="M80 339q22-29 44 0m13 2q18-23 35 0m505 8q22-31 43 0" fill="none" stroke="#fff8e9" stroke-width="5" stroke-linecap="round"/>
  <text x="50" y="64" fill="#193a43" font-size="37" font-weight="900" letter-spacing="1">THE PELICAN CYCLE</text>
  <text x="53" y="94" fill="#42656a" font-size="16" font-weight="700">A beak ahead of the competition.</text>

  <g aria-label="Bicycle">
    <circle class="wheel" cx="250" cy="425" r="72"/>
    <circle class="wheel" cx="550" cy="425" r="72"/>
    <g class="wheelspin">
      <g class="spokes">
        <path d="M250 357V493M182 425H318M202 377L298 473M298 377L202 473"/>
        <path d="M550 357V493M482 425H618M502 377L598 473M598 377L502 473"/>
      </g>
    </g>
    <path class="frame" d="M250 425L350 425L315 345L250 425M350 425L430 335L550 425M315 345L430 335M430 335L448 425L350 425M430 335L477 330"/>
    <circle cx="350" cy="425" r="16" fill="#f8c94e" class="ink"/>
    <path d="M350 425L390 455M350 425L324 390" stroke="#193a43" stroke-width="7" stroke-linecap="round"/>
    <path d="M306 337h-42m-8 0h-18m231-13h45m-8 0h15" fill="none" stroke="#193a43" stroke-width="7" stroke-linecap="round"/>
    <path d="M304 331l-8 12m9-12 8 12M474 318l8 12m-8-12-8 12" stroke="#193a43" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g class="rider" aria-label="Pelican rider">
    <path d="M324 326Q315 282 340 246Q365 210 405 225Q442 237 446 280L432 327Z" fill="#fffdf2" class="ink"/>
    <path d="M340 266Q365 238 408 250Q427 270 430 315L371 324Q341 305 340 266Z" fill="#dbe9df" stroke="#193a43" stroke-width="4"/>
    <path d="M355 259Q374 235 408 248Q428 258 433 281Q410 298 378 285Z" fill="#fffdf2" stroke="#193a43" stroke-width="4"/>
    <path d="M406 255Q420 239 438 249Q455 261 447 281Q437 294 420 281Z" fill="#fffdf2" class="ink"/>
    <circle cx="435" cy="260" r="4.8" fill="#193a43"/>
    <path d="M447 263Q494 267 530 283Q539 288 532 297Q514 311 472 310Q451 308 433 292Z" fill="url(#beak)" class="ink"/>
    <path d="M457 297Q488 301 516 292Q502 320 473 317Q458 313 447 302Z" fill="#f08b63" stroke="#193a43" stroke-width="4"/>
    <path d="M480 275Q494 276 506 284L492 288Q484 284 480 275Z" fill="#6d8790" stroke="#193a43" stroke-width="3"/>
    <path d="M472 283l10 5" stroke="#fff4d5" stroke-width="3" stroke-linecap="round"/>
    <path d="M350 314Q340 340 345 365L387 364Q393 338 381 315" fill="#fffdf2" class="ink"/>
    <path d="M350 359L341 383L327 393M380 358L393 381L410 386" fill="none" stroke="#ef6b38" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M318 393l20 4m67-14 19 8" stroke="#193a43" stroke-width="6" stroke-linecap="round"/>
    <path d="M353 310Q337 327 326 337M387 312Q406 324 420 335" fill="none" stroke="#fffdf2" stroke-width="11" stroke-linecap="round"/>
    <path d="M326 337L306 337M420 335L443 327" fill="none" stroke="#ef6b38" stroke-width="7" stroke-linecap="round"/>
    <path d="M366 222q18-24 42-5" fill="none" stroke="#e85b45" stroke-width="7" stroke-linecap="round"/>
    <path d="M374 217l-1-13m14 9 4-14m10 17 9-10" stroke="#e85b45" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="#193a43">
    <path d="M616 345l18-8-9 17 17 7-20 2-3 18-7-17-18 3 14-12-8-15z"/>
    <path d="M167 325l13-6-6 13 13 5-15 2-2 14-5-13-14 2 11-9-6-11z"/>
  </g>
  <rect x="218" y="526" width="364" height="37" rx="18" fill="#193a43"/>
  <text x="400" y="551" text-anchor="middle" fill="#fff8e9" font-size="17" font-weight="800">“I’m commuting. The fish is my briefcase.”</text>

  <rect x="0" y="574" width="800" height="26" fill="#193a43"/>
  <text x="400" y="592" text-anchor="middle" fill="#fff8e9" font-size="12" font-weight="600" letter-spacing=".35">2026-10-26 20:33:13 SGT (UTC+08:00)</text>
</svg>