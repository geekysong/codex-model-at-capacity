<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The original bill-powered bicycle</title>
  <desc id="desc">A smug pelican pedals a bicycle with an enormous bill, while a fish rides in the front basket holding a sign demanding better public transport. Wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#fff5cd"/>
      <stop offset="1" stop-color="#ffe3b3"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffcd68"/>
      <stop offset="1" stop-color="#ee9141"/>
    </linearGradient>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12V12" fill="none" stroke="#98643b" stroke-width="2"/>
    </pattern>
    <style>
      .ink{stroke:#293944;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#293944}
      .spoke{stroke:#a5b4b5;stroke-width:2}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fffaf0"/>
  <rect x="16" y="16" width="768" height="508" rx="24" fill="url(#sky)" stroke="#293944" stroke-width="3"/>
  <text x="400" y="63" text-anchor="middle" class="label" font-size="35" font-weight="900">THE BILL-POWERED BICYCLE</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="17" font-weight="bold">Zero emissions. Enormous overhead.</text>

  <g fill="#fffaf0" opacity=".85">
    <path d="M55 165q10-24 32-12q20-31 43 0q28-5 34 20H55Z"/>
    <path d="M616 137q12-20 30-10q22-27 43 1q25-4 31 19H616Z"/>
  </g>
  <path d="M18 391Q149 356 270 384T515 380T782 377V522H18Z" fill="#d9ddb0"/>
  <path d="M18 440Q400 418 782 440V522H18Z" fill="#e7c99c"/>
  <path d="M49 483H145m482 0h121" stroke="#fff4db" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="406" cy="462" rx="242" ry="15" fill="#b99e7b" opacity=".35"/>

  <!-- Bicycle wheels rotate around their own hubs. -->
  <g transform="translate(258 392)">
    <circle r="70" fill="#fff9e8" class="ink" stroke-width="9"/>
    <circle r="60" fill="none" stroke="#e0b679" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <g class="spoke">
        <path d="M-60 0H60M0-60V60M-42-42L42 42M-42 42L42-42M-56-23L56 23M-23-56L23 56M-56 23L56-23M-23 56L23-56"/>
      </g>
      <path d="M42-42L49-49" stroke="#e46b48" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="7" fill="#293944"/>
  </g>
  <g transform="translate(557 392)">
    <circle r="70" fill="#fff9e8" class="ink" stroke-width="9"/>
    <circle r="60" fill="none" stroke="#e0b679" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <g class="spoke">
        <path d="M-60 0H60M0-60V60M-42-42L42 42M-42 42L42-42M-56-23L56 23M-23-56L23 56M-56 23L56-23M-23 56L23-56"/>
      </g>
      <path d="M42-42L49-49" stroke="#e46b48" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="7" fill="#293944"/>
  </g>

  <!-- Frame and handlebar. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 392L323 300L389 392ZM323 300H512L389 392M512 300L557 392" stroke="#293944" stroke-width="13"/>
    <path d="M258 392L323 300L389 392ZM323 300H512L389 392M512 300L557 392" stroke="#37a4a4" stroke-width="7"/>
    <path d="M323 300L312 280M512 300L492 253L516 239H543" stroke="#293944" stroke-width="7"/>
    <path d="M300 278H339" stroke="#293944" stroke-width="12"/>
    <path d="M386 383L266 384Q249 394 267 405L387 404Z" stroke="#7d8073" stroke-width="3"/>
  </g>
  <circle cx="389" cy="392" r="16" fill="#718e8d" class="ink"/>

  <!-- A fish passenger voices its opinion. -->
  <path d="M554 275L575 254L601 278" fill="none" class="ink"/>
  <path d="M610 279L637 262L633 286L651 300L620 298" fill="#5aaab3" class="ink"/>
  <ellipse cx="603" cy="280" rx="29" ry="19" fill="#78c8c8" class="ink"/>
  <circle cx="589" cy="275" r="6" fill="white"/>
  <circle cx="588" cy="276" r="2.5" fill="#293944"/>
  <path d="M580 286l9 1M605 269q-6 10 0 19" fill="none" stroke="#293944" stroke-width="2.5"/>
  <path d="M550 287H641L630 333H560Z" fill="#d9ae72" class="ink"/>
  <path d="M550 287H641L630 333H560Z" fill="url(#basket)"/>
  <path d="M558 307L530 288" fill="none" class="ink"/>
  <path d="M647 264L661 213" stroke="#785537" stroke-width="4"/>
  <g transform="rotate(7 676 184)">
    <rect x="614" y="155" width="122" height="58" rx="5" fill="#fffdf3" class="ink"/>
    <text x="675" y="179" text-anchor="middle" class="label" font-size="14" font-weight="bold">I REQUESTED</text>
    <text x="675" y="199" text-anchor="middle" class="label" font-size="16" font-weight="900">A WATER TAXI.</text>
  </g>

  <!-- The rider gently bobs while its feet pedal. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" dur="2s" repeatCount="indefinite"/>
    <path d="M301 286L263 302L276 269" fill="#fffaf0" class="ink"/>
    <path d="M306 225Q279 243 294 282Q308 310 354 302Q389 298 402 265L413 222Q422 195 401 183Q374 174 361 203L344 241" fill="#fffdf3" class="ink"/>
    <path d="M313 245Q320 225 354 233Q380 242 356 266Q345 277 324 277" fill="#e1e8df" class="ink"/>
    <path d="M328 245l20 8m-24 2 15 9" fill="none" stroke="#9baea7" stroke-width="3" stroke-linecap="round"/>
    <path d="M392 256Q427 267 458 249L503 245" fill="none" stroke="#293944" stroke-width="13" stroke-linecap="round"/>
    <path d="M392 255Q427 266 458 248L503 244" fill="none" stroke="#fffdf3" stroke-width="7" stroke-linecap="round"/>

    <!-- Head, eye and spectacular bill. -->
    <path d="M367 206Q350 189 363 164Q377 143 402 156Q424 168 417 191L405 210" fill="#fffdf3" class="ink"/>
    <path d="M374 155L365 144M383 152L380 140" fill="none" class="ink"/>
    <path d="M407 187L586 207Q570 243 505 256Q430 270 407 205Z" fill="url(#pouch)" class="ink"/>
    <path d="M406 182L600 204Q606 208 594 213L408 204Z" fill="#ffd76e" class="ink"/>
    <path d="M434 213Q474 243 531 235" fill="none" stroke="#c97d35" stroke-width="3"/>
    <circle cx="394" cy="177" r="10" fill="white" stroke="#293944" stroke-width="2"/>
    <circle cx="398" cy="177" r="4" fill="#293944"/>
    <path d="M382 162l20 4" fill="none" class="ink"/>
    <path d="M404 204q8 8 16 3" fill="none" stroke="#293944" stroke-width="2.5"/>

    <g fill="none" stroke="#dc9244" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M338 294L356 333L363 368">
        <animate attributeName="d" values="M338 294L356 333L363 368;M338 294L390 326L415 409;M338 294L356 333L363 368" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M354 294L396 337L415 409">
        <animate attributeName="d" values="M354 294L396 337L415 409;M354 294L350 335L363 368;M354 294L396 337L415 409" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#efab4f" stroke="#293944" stroke-width="2.5" stroke-linejoin="round">
      <path d="M363 364l-13 10 32 2-6-11Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;52 41;0 0" dur="2s" repeatCount="indefinite"/>
      </path>
      <path d="M415 405l-13 10 32 2-6-11Z">
        <animateTransform attributeName="transform" type="translate" values="0 0;-52 -41;0 0" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <g transform="translate(389 392)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
      <path d="M-26-24L26 24" stroke="#293944" stroke-width="5"/>
      <path d="M-37-24H-15M15 24H37" stroke="#293944" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#fff9e8"/>
  </g>

  <text x="400" y="504" text-anchor="middle" class="label" font-size="19" font-style="italic">He sold the car. Somehow, the bill got bigger.</text>
  <path d="M48 541H752" stroke="#d5c7ae" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" class="label" font-size="19">2026-10-26 20:31:58 SGT (UTC+08:00)</text>
</svg>