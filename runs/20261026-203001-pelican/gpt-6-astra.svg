<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A determined pelican pedals a bicycle with a giant fish-filled bill. The wheels spin and the pelican bobs continuously. A roadside sign announces a bike lane, except for bikes.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r=".7" fill="#dfd5ba"/>
    </pattern>
    <g id="spokes" stroke="#527980" stroke-width="3">
      <path d="M-64 0H64M0-64V64M-45-45L45 45M-45 45L45-45"/>
      <circle r="10" fill="#ffcd51" stroke="#203c45"/>
    </g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #203c45; }
      .outline { stroke: #203c45; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff4d8"/>
  <rect width="800" height="600" fill="url(#paper)" opacity=".55"/>
  <path d="M30 108H770" stroke="#203c45" stroke-width="3"/>
  <text x="400" y="65" font-size="48" font-weight="900" text-anchor="middle" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="94" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">BIG BILL. TINY CARBON FOOTPRINT.</text>

  <!-- One seaside street -->
  <circle cx="103" cy="181" r="39" fill="#ffd66b"/>
  <path d="M35 344Q120 321 205 343T375 343T545 343T765 337V443H35Z" fill="#addbd7"/>
  <path d="M38 368Q77 359 114 368M153 387Q190 378 228 387M602 367Q642 358 684 367M710 393H761" fill="none" stroke="#fff4d8" stroke-width="4"/>
  <path d="M0 435Q180 417 400 434T800 429V500H0Z" fill="#dbcfad"/>
  <path d="M0 482H800" stroke="#fff4d8" stroke-width="5" stroke-dasharray="44 26"/>
  <ellipse cx="395" cy="455" rx="226" ry="13" fill="#203c45" opacity=".13"/>

  <!-- Satirical roadside sign -->
  <path d="M704 264V433" stroke="#203c45" stroke-width="7"/>
  <rect x="625" y="169" width="150" height="102" rx="8" fill="#fffdf0" class="outline"/>
  <text x="700" y="199" text-anchor="middle" font-size="22" font-weight="900">BIKE LANE</text>
  <path d="M638 211H762" stroke="#203c45" stroke-width="2"/>
  <text x="700" y="234" text-anchor="middle" font-size="16" font-weight="bold">EXCEPT</text>
  <text x="700" y="255" text-anchor="middle" font-size="16" font-weight="bold">FOR BIKES</text>

  <!-- Bicycle wheels: stationary tires, continuously rotating spokes -->
  <g transform="translate(246 390)">
    <circle r="73" fill="#fff9e8" class="outline" stroke-width="9"/>
    <circle r="64" fill="none" stroke="#b4c9bd" stroke-width="3"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(548 390)">
    <circle r="73" fill="#fff9e8" class="outline" stroke-width="9"/>
    <circle r="64" fill="none" stroke="#b4c9bd" stroke-width="3"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M246 390L313 287L376 390ZM313 287L507 287L376 390M492 266L548 390" stroke="#203c45" stroke-width="13"/>
    <path d="M246 390L313 287L376 390ZM313 287L507 287L376 390M492 266L548 390" stroke="#e75e48" stroke-width="7"/>
    <path d="M313 287L301 266M492 266L482 242L518 230" stroke="#203c45" stroke-width="8"/>
    <path d="M280 266H326M513 230H530" stroke="#203c45" stroke-width="11"/>
    <path d="M250 311H208V365" stroke="#203c45" stroke-width="5"/>
  </g>
  <rect x="173" y="286" width="92" height="56" rx="6" fill="#f8cc62" class="outline"/>
  <text x="219" y="309" text-anchor="middle" font-size="13" font-weight="900">EMERGENCY</text>
  <text x="219" y="329" text-anchor="middle" font-size="17" font-weight="900">SARDINES</text>

  <!-- Pelican and its small rhythmic pedaling motion -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>

    <path d="M323 280L350 319L388 371" fill="none" stroke="#b58231" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M323 280L350 319L388 371;M323 280L339 329L365 387;M323 280L350 319L388 371" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <!-- Tail, body and upright neck -->
    <path d="M289 234L245 211L263 254L236 249L283 286" fill="#fffdf3" class="outline"/>
    <path d="M280 225C289 193 335 191 366 220C384 213 389 184 386 164C380 127 400 112 426 118C461 124 464 156 450 184C434 213 444 249 418 279C390 309 330 308 295 285C276 271 269 245 280 225Z" fill="#fffdf3" class="outline"/>

    <!-- Cycling jersey -->
    <path d="M282 222Q324 202 365 224L393 279Q349 314 296 283Q276 263 282 222Z" fill="#39a6a2" class="outline"/>
    <path d="M288 242L375 257" stroke="#fff4d8" stroke-width="14"/>
    <text x="331" y="279" font-size="26" font-weight="900" text-anchor="middle" transform="rotate(9 331 279)">01</text>

    <!-- Wing gripping the bars -->
    <path d="M329 225Q366 214 405 239L483 235Q494 232 498 242Q493 257 479 253L406 261Q365 259 338 246" fill="#fffdf3" class="outline"/>
    <path d="M468 241L479 250M458 242L468 252" fill="none" stroke="#203c45" stroke-width="2"/>

    <!-- Huge bill and pouch -->
    <path d="M442 160Q510 164 605 187Q568 268 486 248Q453 230 442 160Z" fill="#f5b75c" class="outline"/>
    <path d="M460 185Q522 196 579 192Q553 236 493 230Q471 218 460 185Z" fill="#ffd990"/>
    <g transform="translate(522 211) rotate(-8)">
      <path d="M-28 0Q-8-22 22 0Q-8 22-28 0L-42-12V12Z" fill="#75b8b6" stroke="#203c45" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="11" cy="-3" r="3" fill="#203c45"/>
      <path d="M1-8Q-5 0 1 8" fill="none" stroke="#203c45" stroke-width="2"/>
    </g>
    <path d="M443 155Q521 156 612 185Q537 199 445 177Z" fill="#ffce61" class="outline"/>

    <!-- Face and helmet -->
    <circle cx="428" cy="148" r="12" fill="white" stroke="#203c45" stroke-width="3"/>
    <circle cx="432" cy="149" r="4" fill="#203c45"/>
    <path d="M416 130L441 136" stroke="#203c45" stroke-width="5" stroke-linecap="round"/>
    <path d="M383 137Q387 107 416 112Q447 111 457 139Z" fill="#e75e48" class="outline"/>
    <path d="M403 117L399 131M420 117L421 132M436 123L442 134" stroke="#203c45" stroke-width="4" stroke-linecap="round"/>
    <path d="M390 140L403 175L419 173" fill="none" stroke="#203c45" stroke-width="3"/>
    <path d="M373 159Q364 169 371 173Q379 174 373 159" fill="#62b9d0"/>

    <!-- Near leg -->
    <path d="M337 289L317 334L366 399" fill="none" stroke="#203c45" stroke-width="15" stroke-linecap="round">
      <animate attributeName="d" values="M337 289L317 334L366 399;M337 289L339 332L390 383;M337 289L317 334L366 399" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M337 289L317 334L366 399" fill="none" stroke="#efaf43" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" values="M337 289L317 334L366 399;M337 289L339 332L390 383;M337 289L317 334L366 399" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M357 391L381 401L350 407Z" fill="#efaf43" stroke="#203c45" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;24 -16;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(376 390)">
    <circle r="12" fill="#ffce61" class="outline"/>
    <g stroke="#203c45" stroke-width="5">
      <path d="M-19 0H19"/>
      <path d="M-25-5V5M25-5V5" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Air streaks -->
  <path d="M183 225H218M158 245H208M166 264H226" fill="none" stroke="#527980" stroke-width="4" stroke-linecap="round"/>

  <!-- Separate caption and timestamp footer -->
  <rect x="0" y="500" width="800" height="100" fill="#fff4d8"/>
  <path d="M30 502H770" stroke="#203c45" stroke-width="3"/>
  <text x="400" y="535" text-anchor="middle" font-size="23" font-weight="bold">He pedals for the planet. He bills for the fish.</text>
  <text x="400" y="577" text-anchor="middle" font-size="17">2026-10-26 20:30:01 SGT (UTC+08:00)</text>
</svg>