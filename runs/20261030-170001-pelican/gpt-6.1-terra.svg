<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pedal Pelican</title>
  <desc id="desc">A pelican pedals a bicycle along a seaside road, with spinning wheels and a gentle bouncing motion.</desc>
  <defs>
    <style>
      .ink { stroke:#27333b; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .spoke { stroke:#fff4cd; stroke-width:4; stroke-linecap:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.8s linear infinite; }
      .rider { animation:bob .6s ease-in-out infinite alternate; }
      .pedal { transform-origin:390px 408px; animation:spin 1.8s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f7e7bc"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#fff9e9" stroke="#27333b" stroke-width="4"/>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#27333b" letter-spacing="2">PEDAL PELICAN</text>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#61747a">THE COAST'S MOST QUESTIONABLE COMMUTER</text>

