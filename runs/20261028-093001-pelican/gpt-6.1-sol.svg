<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d747d"/>
      <stop offset="1" stop-color="#343940"/>
    </linearGradient>
    <style>
      .ink{stroke:#20242a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#20242a}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob 1s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="45" fill="#ffe36e" opacity=".9"/>
  <path d="M0 390 Q130 330 260 385 T520 375 T800 380 V470 H0Z" fill="#9bcf87"/>
  <path d="M0 450 Q180 420 350 452 T800 445 V600 H0Z" fill="url(#road)"/>
