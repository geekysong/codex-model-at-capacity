    <circle cx="560" cy="445" r="9" fill="#20242a"/>
    <g stroke="#20242a" stroke-width="3">
      <path d="M560 387V503M502 445H618M519 404L601 486M601 404L519 486"/>
    </g>
  </g>

  <g class="ink" fill="none">
    <path d="M245 445 L330 335 L475 335 L560 445 L390 445 Z"/>
