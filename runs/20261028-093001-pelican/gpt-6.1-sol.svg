    <path d="M350 300 Q315 330 345 365 Q378 382 407 347" fill="#f4f0d6" class="ink"/>
    <path d="M425 278 Q470 260 515 282" fill="none" class="ink"/>
    <path d="M515 282 Q548 295 579 281 Q551 269 522 262Z" fill="#f6a63b" class="ink"/>
    <ellipse cx="424" cy="247" rx="14" ry="18" fill="#fff" class="ink"/>
