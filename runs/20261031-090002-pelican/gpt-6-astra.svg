<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A determined pelican pedals a bicycle with an enormous fish-filled beak pouch. The wheels spin, the pedals turn, and the pelican bobs in a looping cartoon animation.</desc>
  <defs>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#274447" opacity=".05"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <rect width="800" height="525" fill="url(#grain)"/>
  <circle cx="683" cy="158" r="49" fill="#ffcf59"/>
  <path d="M40 185h105m-81-15h54M605 229h132" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#203e43">
    <text x="400" y="62" font-size="46" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
    <text x="400" y="94" font-size="17" font-weight="bold" letter-spacing="2">THE COMMUTE HAS A CATCH.</text>
  </g>

  <!-- One seaside cycling scene -->
  <path d="M0 392Q125 369 250 389T500 386T800 381V452H0Z" fill="#a8d9ce"/>
  <path d="M0 421Q210 404 400 423T800 418V482H0Z" fill="#e5d8ad"/>
  <path d="M30 462H770" stroke="#203e43" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="406" cy="455" rx="245" ry="13" fill="#203e43" opacity=".12"/>

  <!-- Tiny roadside commentary -->
  <g stroke="#203e43" stroke-width="3">
    <path d="M699 354v91"/>
    <rect x="642" y="295" width="114" height="68" rx="7" fill="#fff9ec"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#203e43" font-weight="bold">
    <text x="699" y="317" font-size="13">BIKE LANE</text>
    <text x="699" y="337" font-size="12">NO TRAWLING</text>
    <path d="M676 350h44m-8-5 8 5-8 5" stroke="#203e43" stroke-width="2" fill="none"/>
  </g>

  <!-- Wheels: stationary tires, visibly rotating spokes -->
  <g stroke="#203e43" fill="none">
    <circle cx="245" cy="382" r="72" stroke-width="12" fill="#fff9e9"/>
    <circle cx="550" cy="382" r="72" stroke-width="12" fill="#fff9e9"/>
    <circle cx="245" cy="382" r="63" stroke="#86ada7" stroke-width="3"/>
    <circle cx="550" cy="382" r="63" stroke="#86ada7" stroke-width="3"/>
  </g>
  <g transform="translate(245 382)">
    <g stroke="#829998" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0H62M0-62V62M-44-44 44 44M-44 44 44-44"/>
      <rect x="-5" y="-58" width="10" height="17" rx="3" fill="#ffb946" stroke="none"/>
    </g>
  </g>
  <g transform="translate(550 382)">
    <g stroke="#829998" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0H62M0-62V62M-44-44 44 44M-44 44 44-44"/>
      <rect x="-5" y="-58" width="10" height="17" rx="3" fill="#ffb946" stroke="none"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M245 382 322 278 383 382ZM322 278H492L383 382M492 278 550 382" stroke="#203e43" stroke-width="13"/>
    <path d="M245 382 322 278 383 382ZM322 278H492L383 382M492 278 550 382" stroke="#ee6950" stroke-width="7"/>
    <path d="M322 278 311 254M492 278 477 235 509 223" stroke="#203e43" stroke-width="8"/>
    <path d="M294 253h43M505 222h18" stroke="#203e43" stroke-width="12"/>
    <path d="M245 382 381 396 392 370Z" stroke="#657b78" stroke-width="3"/>
  </g>
  <g fill="#203e43">
    <circle cx="245" cy="382" r="8"/>
    <circle cx="550" cy="382" r="8"/>
    <circle cx="383" cy="382" r="18"/>
  </g>

  <!-- Pelican and its wildly impractical grocery pouch -->
  <g stroke="#203e43" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M297 242 249 223 265 259 242 258 278 281" fill="#fffdf2"/>
    <path d="M280 236Q291 204 344 208Q373 204 387 178L410 154Q436 166 424 197L402 244Q382 277 333 279Q285 279 280 236Z" fill="#fffdf2"/>
    <path d="M299 236Q326 216 365 232L340 259Q315 260 299 236Z" fill="#d9e7df"/>
    <path d="M306 237 336 245M314 247l17 5" fill="none" stroke-width="2"/>
    <path d="M364 224Q411 213 439 229L483 235" fill="none" stroke-width="14"/>
    <path d="M364 224Q411 213 439 229L483 235" fill="none" stroke="#fffdf2" stroke-width="8"/>
    <path d="M479 232l18 5m-16-7 15 1" fill="none" stroke-width="3"/>

    <path d="M423 173 605 191Q589 280 520 279Q451 274 430 204Z" fill="#ffbf67"/>
    <path d="M448 215Q484 249 563 233" fill="none" stroke="#e69549" stroke-width="3"/>

    <!-- Suspiciously smug fish visible in the pouch -->
    <g transform="translate(512 235) rotate(-10)" stroke-width="2.5">
      <path d="M-27 0Q-4-24 24-3L39-14 36 8 24 3Q-4 21-27 0Z" fill="#68bcb9"/>
      <circle cx="-15" cy="-3" r="3" fill="#203e43" stroke="none"/>
      <path d="M-11 6q7 4 12-2M7-7 13-17 20-7" fill="none"/>
    </g>

    <path d="M394 171Q384 136 410 123Q439 112 454 140L449 173Z" fill="#fffdf2"/>
    <path d="M437 153Q515 153 612 185L444 185Z" fill="#ffda65"/>
    <path d="M453 175 586 182" fill="none" stroke-width="2"/>
    <circle cx="429" cy="144" r="11" fill="white" stroke-width="2.5"/>
    <circle cx="433" cy="145" r="4.5" fill="#203e43" stroke="none"/>
    <path d="m418 128 20 3" fill="none" stroke-width="4"/>

    <!-- Cycling helmet -->
    <path d="M388 130Q385 101 417 104Q446 103 454 127Z" fill="#ed6952"/>
    <path d="m405 111-3 11m16-12-1 12m14-10 3 11" fill="none" stroke-width="3"/>
    <path d="m393 131 9 36 17 6" fill="none" stroke-width="2"/>
    <path d="m385 181-35-10 10 17-30 8 46 4" fill="#ee6950"/>

    <!-- Legs flex in sync with the turning crank -->
    <path d="M333 272 349 316 405 382" fill="none" stroke="#e9a449" stroke-width="10">
      <animate attributeName="d" values="M333 272 349 316 405 382;M333 272 375 322 383 404;M333 272 365 303 361 382;M333 272 344 310 383 360;M333 272 349 316 405 382" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(383 382)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-22 0H22" stroke="#203e43" stroke-width="6"/>
      <path d="M16-5 40-5 44 5H16Z" fill="#ffbd53" stroke="#203e43" stroke-width="3"/>
      <path d="M-31 0h18" stroke="#203e43" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Motion marks -->
  <g fill="none" stroke="#203e43" stroke-width="3" stroke-linecap="round">
    <path d="M179 278h52m-66 14h37m-37 66h-27"/>
  </g>

  <text x="400" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#203e43">“I cycle to work. My lunch takes the pouch.”</text>

  <!-- Dedicated, unobstructed timestamp footer -->
  <rect x="0" y="531" width="800" height="69" fill="#203e43"/>
  <text x="400" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff5dc">2026-10-31 09:00:02 SGT (UTC+08:00)</text>
</svg>