  <path d="M20 477H780" stroke="#26313a" stroke-width="3"/>
  <text x="400" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#26313a">The pelican insists his bike lane is also a buffet.</text>
