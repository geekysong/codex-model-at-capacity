<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A smug pelican pedals a bicycle past a snail, with spinning wheels and a gentle riding motion.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1">
      <path d="M0 0"/>
    </pattern>
    <style>
      .ink { stroke:#26313a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#26313a; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob .7s ease-in-out infinite alternate; }
      .pedals { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedals { animation-duration:8s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f7efd8"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#fffaf0" stroke="#26313a" stroke-width="4"/>
  <path d="M20 100H780" stroke="#26313a" stroke-width="3"/>
  <text x="400" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#26313a">THE DAILY COMMUTE</text>

