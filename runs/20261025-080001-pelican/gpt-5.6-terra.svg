<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Power</title>
  <desc id="desc">A satirical cartoon of an overconfident pelican riding a bicycle, with spinning wheels and bobbing motion.</desc>
  <style>
    .ink{stroke:#17243a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#17243a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .wheel{animation:spin 1.25s linear infinite;transform-box:fill-box;transform-origin:center}
    .bob{animation:bob .65s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    .pedal{animation:pedal .7s linear infinite;transform-box:fill-box;transform-origin:center}
    .flag{animation:wave .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pedal{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-8px) rotate(-1deg)}}
    @keyframes wave{to{transform:skewY(-8deg)}}
  </style>

  <rect width="800" height="600" fill="#aee8f6"/>
  <path d="M0 122 Q95 79 190 121 T380 116 T570 108 T800 116 V0H0Z" fill="#72c9e4"/>
  <circle cx="99" cy="83" r="37" fill="#ffe170"/>
  <path d="M0 336 Q90 295 180 332 T355 324 T530 337 T800 319 V495H0Z" fill="#79c968"/>
  <path d="M0 389 Q93 357 198 386 T399 378 T608 391 T800 371 V495H0Z" fill="#4da85d"/>
  <path d="M0 460 Q159 437 319 458 T569 448 T800 456V495H0Z" fill="#d9b35c"/>
  <path d="M30 446 Q250 423 466 454 T766 441" fill="none" stroke="#f8e588" stroke-width="9" stroke-dasharray="20 17" opacity=".9"/>

  <g class="flag">
    <path class="ink" d="M664 90V245" fill="none"/>
    <path class="ink" d="M665 94 Q722 102 756 136 Q714 160 665 145Z" fill="#f34f54"/>
    <text x="678" y="133" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#fff">NO BRAKES!</text>
  </g>

  <g class="wheel">
    <circle class="ink" cx="255" cy="405" r="76" fill="#f7f8f2"/>
    <circle class="thin" cx="255" cy="405" r="12" fill="#ef5d50"/>
    <path class="thin" d="M255 329V481M179 405H331M201 351L309 459M309 351L201 459" fill="none" opacity=".75"/>
  </g>
  <g class="wheel">
    <circle class="ink" cx="539" cy="405" r="76" fill="#f7f8f2"/>
    <circle class="thin" cx="539" cy="405" r="12" fill="#ef5d50"/>
    <path class="thin" d="M539 329V481M463 405H615M485 351L593 459M593 351L485 459" fill="none" opacity=".75"/>
  </g>

  <g class="ink" fill="none">
