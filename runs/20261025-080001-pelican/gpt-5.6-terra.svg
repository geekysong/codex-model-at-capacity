  <path class="ink" d="M270 261 Q290 248 315 261L312 276H279Z" fill="#d94e48"/>
  <path class="ink" d="M485 261 Q510 243 535 263L498 267Z" fill="#e1b14e"/>

  <g class="pedal">
    <circle class="ink" cx="374" cy="405" r="20" fill="#f0bc43"/>
    <path class="ink" d="M374 405L411 431M374 405L337 379" fill="none"/>
    <path class="ink" d="M400 430H424M324 379H348" fill="none"/>
  </g>

