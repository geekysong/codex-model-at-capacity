  <rect x="30" y="18" width="740" height="72" rx="18" fill="#fff8d8" stroke="#17243a" stroke-width="5"/>
  <text x="400" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#17243a">PELICAN FOR PEDAL POWER!</text>

  <rect x="0" y="495" width="800" height="105" fill="#17243a"/>
  <text x="400" y="531" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff8d8">“Why fly when you can campaign uphill?”</text>
  <text x="400" y="573" text-anchor="middle" font-family="monospace" font-size="16" fill="#aee8f6">2026-10-25 08:02:10 SGT (UTC+08:00)</text>
</svg>