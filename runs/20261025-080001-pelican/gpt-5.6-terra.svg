    <path class="ink" d="M83 321 Q110 291 143 318 L150 375H75Z" fill="#f2d255"/>
    <circle class="ink" cx="114" cy="291" r="31" fill="#f8d8ae"/>
    <path class="ink" d="M85 281Q111 248 143 280Q126 269 85 281Z" fill="#654435"/>
    <circle cx="104" cy="291" r="4" fill="#17243a"/>
    <circle cx="124" cy="291" r="4" fill="#17243a"/>
