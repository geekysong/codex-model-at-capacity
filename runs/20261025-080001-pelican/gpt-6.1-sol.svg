<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with a fish in its front basket. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12M0 0V12" fill="none" stroke="#9b6635" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
  <circle cx="683" cy="145" r="48" fill="#ffcf56"/>
  <path d="M65 177h109m-80 18h52M575 229h104" fill="none" stroke="#e4d3ac" stroke-width="8" stroke-linecap="round"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#203b43">TOUR DE FISH</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="2" fill="#71654e">ONE BIRD. TWO WHEELS. ZERO SELF-DOUBT.</text>

  <ellipse cx="410" cy="466" rx="251" ry="16" fill="#d7c9a5"/>
  <path d="M60 475H740" stroke="#203b43" stroke-width="5" stroke-linecap="round"/>
  <path d="M80 492h64m66 0h64m66 0h64m66 0h64m66 0h64" stroke="#d2bf94" stroke-width="4" stroke-linecap="round"/>

  <!-- Wheels rotate in their own local coordinate systems. -->
  <g transform="translate(252 397)">
    <circle r="69" fill="#fffaf0" stroke="#203b43" stroke-width="12"/>
    <circle r="58" fill="none" stroke="#97b6af" stroke-width="3"/>
    <g stroke="#75958f" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
      <path d="M-59 0H59M0-59V59M-42-42L42 42M-42 42L42-42"/>
      <path d="M30-51L36-42" stroke="#ed8c43" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="8" fill="#203b43"/>
  </g>
  <g transform="translate(568 397)">
    <circle r="69" fill="#fffaf0" stroke="#203b43" stroke-width="12"/>
    <circle r="58" fill="none" stroke="#97b6af" stroke-width="3"/>
    <g stroke="#75958f" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
      <path d="M-59 0H59M0-59V59M-42-42L42 42M-42 42L42-42"/>
      <path d="M30-51L36-42" stroke="#ed8c43" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle r="8" fill="#203b43"/>
  </g>

  <!-- The comically undersized bicycle. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 397L329 294L391 397ZM329 294H514L391 397M514 294L568 397" stroke="#203b43" stroke-width="13"/>
    <path d="M252 397L329 294L391 397ZM329 294H514L391 397M514 294L568 397" stroke="#eb6352" stroke-width="7"/>
    <path d="M329 294L318 268M514 294L500 254L526 241" stroke="#203b43" stroke-width="9"/>
    <path d="M299 267H342M519 241H544" stroke="#203b43" stroke-width="12"/>
    <path d="M391 397L252 397" stroke="#203b43" stroke-width="4"/>
  </g>
  <circle cx="391" cy="397" r="22" fill="#f4b449" stroke="#203b43" stroke-width="5"/>

  <!-- Fish passenger and front basket. -->
  <path d="M550 292L544 317M615 292L602 331" fill="none" stroke="#203b43" stroke-width="4"/>
  <path d="M533 264Q570 238 606 260L630 243L627 276L607 269Q570 295 533 264Z" fill="#6bb7b1" stroke="#203b43" stroke-width="3"/>
  <circle cx="549" cy="261" r="4" fill="#203b43"/>
  <path d="M563 273l8-13 8 13" fill="none" stroke="#203b43" stroke-width="2"/>
  <path d="M529 278H635L623 327H541Z" fill="#e6b675" stroke="#203b43" stroke-width="4" stroke-linejoin="round"/>
  <path d="M529 278H635L623 327H541Z" fill="url(#basket)"/>
  <path d="M524 278H640" stroke="#203b43" stroke-width="6" stroke-linecap="round"/>

  <!-- Rider: body, neck, extravagant bill, and determined expression. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.65s" repeatCount="indefinite"/>
    <path d="M302 268L262 238L275 284" fill="#f9faf1" stroke="#203b43" stroke-width="4" stroke-linejoin="round"/>
    <path d="M287 250C278 204 327 175 376 199C397 209 409 235 400 259C385 292 314 298 287 270Z" fill="#fffef4" stroke="#203b43" stroke-width="4"/>
    <path d="M373 227C386 202 372 172 390 147C406 124 440 133 444 157L442 226C443 248 423 269 399 268" fill="#fffef4" stroke="#203b43" stroke-width="4"/>
    <path d="M438 167L585 185Q548 232 463 220Q445 211 438 190Z" fill="#ffc46a" stroke="#203b43" stroke-width="4" stroke-linejoin="round"/>
    <path d="M441 170L593 181L441 188Z" fill="#f19342" stroke="#203b43" stroke-width="3" stroke-linejoin="round"/>
    <path d="M469 199Q511 216 548 201" fill="none" stroke="#dc8b45" stroke-width="3" stroke-linecap="round"/>
    <circle cx="424" cy="156" r="8" fill="white" stroke="#203b43" stroke-width="3"/>
    <circle cx="427" cy="156" r="3.5" fill="#203b43"/>
    <path d="M411 141L431 145" stroke="#203b43" stroke-width="5" stroke-linecap="round"/>
    <path d="M393 132Q408 108 440 126L445 137Z" fill="#eb6352" stroke="#203b43" stroke-width="4"/>
    <path d="M400 132H451" stroke="#203b43" stroke-width="5" stroke-linecap="round"/>
    <path d="M304 222Q342 205 370 246Q340 267 310 249" fill="#e4e8dc" stroke="#203b43" stroke-width="3"/>
    <path d="M361 234Q408 254 449 245L524 241" fill="none" stroke="#203b43" stroke-width="14" stroke-linecap="round"/>
    <path d="M361 234Q408 254 449 245L524 241" fill="none" stroke="#fffef4" stroke-width="8" stroke-linecap="round"/>
    <path d="M324 277L344 326L382 368" fill="none" stroke="#203b43" stroke-width="13" stroke-linecap="round"/>
    <path d="M324 277L344 326L382 368" fill="none" stroke="#efa044" stroke-width="8" stroke-linecap="round"/>
    <path d="M369 370L399 372L390 359Z" fill="#efa044" stroke="#203b43" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g transform="translate(391 397)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
      <path d="M-26 0H26" stroke="#203b43" stroke-width="6" stroke-linecap="round"/>
      <path d="M-26-9V9M26-9V9" stroke="#203b43" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <path d="M190 301h43m-58 21h47m-20 21h23" fill="none" stroke="#b4a680" stroke-width="4" stroke-linecap="round"/>
  <path d="M624 352l10-9m-2 26h13" fill="none" stroke="#d18b42" stroke-width="3" stroke-linecap="round"/>

  <text x="400" y="531" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#203b43">“My carbon footprint? Mostly webbed.”</text>

  <path d="M40 550H760" stroke="#d5c49d" stroke-width="2"/>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#4c5148">2026-10-25 08:01:01 SGT (UTC+08:00)</text>
</svg>