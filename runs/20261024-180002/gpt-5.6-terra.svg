<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Level seesaw -->
  <line x1="110" y1="190" x2="490" y2="190" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
  <line x1="300" y1="190" x2="300" y2="245" stroke="#374151" stroke-width="4"/>
  <path d="M265 275 L335 275 L300 220 Z" fill="#9ca3af" stroke="#374151" stroke-width="3"/>
  <text x="300" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">pivot</text>

  <!-- Hanging masses -->
  <line x1="180" y1="190" x2="180" y2="240" stroke="#374151" stroke-width="3"/>
  <rect x="145" y="240" width="70" height="48" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="180" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e3a8a">6 kg</text>

  <line x1="480" y1="190" x2="480" y2="240" stroke="#374151" stroke-width="3"/>
  <rect x="445" y="240" width="70" height="48" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="3"/>
  <text x="480" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7c2d12">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="130" x2="180" y2="225" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="180" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">6g downward</text>

  <line x1="480" y1="130" x2="480" y2="225" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="480" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">4g downward</text>

  <!-- Distance dimensions -->
  <line x1="180" y1="325" x2="300" y2="325" stroke="#4b5563" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="180" y1="310" x2="180" y2="335" stroke="#4b5563" stroke-width="2"/>
  <line x1="300" y1="310" x2="300" y2="335" stroke="#4b5563" stroke-width="2"/>
  <text x="240" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">2 m</text>

  <line x1="300" y1="325" x2="480" y2="325" stroke="#4b5563" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="480" y1="310" x2="480" y2="335" stroke="#4b5563" stroke-width="2"/>
  <text x="390" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">x = 3 m</text>

  <!-- Equilibrium statement -->
  <text x="300" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#111827">6 × 2 = 4 × 3</text>
  <text x="300" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#047857">balanced</text>
</svg>