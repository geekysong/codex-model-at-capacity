<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #1f2937; font-size: 18px; }
      .small { font-family: Arial, sans-serif; fill: #1f2937; font-size: 16px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>

  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#166534">
    Balanced Seesaw
  </text>

  <!-- Level seesaw -->
  <rect x="75" y="188" width="450" height="24" rx="10" fill="#8d6e63" stroke="#4e342e" stroke-width="3"/>
  <line x1="300" y1="180" x2="300" y2="220" stroke="#263238" stroke-width="3"/>

  <!-- Pivot -->
  <path d="M270 300 L300 220 L330 300 Z" fill="#607d8b" stroke="#263238" stroke-width="3"/>
  <circle cx="300" cy="200" r="8" fill="#263238"/>
  <text x="300" y="325" text-anchor="middle" class="label">pivot</text>

  <!-- Left mass -->
  <line x1="150" y1="212" x2="150" y2="255" stroke="#37474f" stroke-width="3"/>
  <rect x="116" y="255" width="68" height="48" rx="6" fill="#90caf9" stroke="#1565c0" stroke-width="3"/>
  <text x="150" y="285" text-anchor="middle" class="label" font-weight="bold">6 kg</text>

  <!-- Right mass -->
  <line x1="450" y1="212" x2="450" y2="255" stroke="#37474f" stroke-width="3"/>
  <rect x="416" y="255" width="68" height="48" rx="6" fill="#ffcc80" stroke="#ef6c00" stroke-width="3"/>
  <text x="450" y="285" text-anchor="middle" class="label" font-weight="bold">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="248" x2="150" y2="220" stroke="#c62828" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="150" y="345" text-anchor="middle" class="small" fill="#c62828">downward force</text>
  <line x1="450" y1="248" x2="450" y2="220" stroke="#c62828" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="345" text-anchor="middle" class="small" fill="#c62828">downward force</text>

  <!-- Distance dimensions -->
  <line x1="150" y1="145" x2="300" y2="145" stroke="#37474f" stroke-width="2"/>
  <line x1="150" y1="136" x2="150" y2="154" stroke="#37474f" stroke-width="2"/>
  <line x1="300" y1="136" x2="300" y2="154" stroke="#37474f" stroke-width="2"/>
  <text x="225" y="137" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="105" x2="450" y2="105" stroke="#37474f" stroke-width="2"/>
  <line x1="300" y1="96" x2="300" y2="114" stroke="#37474f" stroke-width="2"/>
  <line x1="450" y1="96" x2="450" y2="114" stroke="#37474f" stroke-width="2"/>
  <text x="375" y="97" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equation -->
  <text x="300" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#111827">
    6 × 2 = 4 × 3
  </text>
</svg>