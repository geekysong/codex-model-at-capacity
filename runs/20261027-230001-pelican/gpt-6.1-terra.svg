<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee8ff"/>
      <stop offset="1" stop-color="#f8f3c4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="675" cy="105" r="55" fill="#ffd45a" opacity=".9"/>
  <path d="M0 390 Q150 330 300 390 T600 385 T800 370 V520 H0Z" fill="#77c96b"/>
  <path d="M0 470 Q180 430 360 470 T800 460 V540 H0Z" fill="#5da956"/>
  <path d="M0 515 Q200 490 400 520 T800 500 V600 H0Z" fill="#e7c47a"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#17324d" stroke="#fff" stroke-width="3" paint-order="stroke">
    THE GREAT PELICYCLE
  </text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">
    “Why waddle when you can pedal?”
  </text>

  <g filter="url(#shadow)">
    <ellipse cx="400" cy="485" rx="245" ry="24" fill="#3e6b43" opacity=".35"/>

    <g id="bike">
      <g fill="none" stroke="#d84332" stroke-width="9">
        <circle id="wheelBack" cx="270" cy="420" r="75"/>
        <circle id="wheelFront" cx="555" cy="420" r="75"/>
        <path d="M270 420 L350 300 L430 420 L270 420 M350 300 L555 420 M430 420 L470 300 L555 420"/>
        <path d="M350 300 L330 270 M315 270 H350 M470 300 L505 270 M492 270 H525"/>
      </g>
      <g stroke="#f7e8c2" stroke-width="3" opacity=".9">
        <path d="M270 345V495 M195 420H345 M217 367L323 473 M217 473L323 367"/>
        <path d="M555 345V495 M480 420H630 M502 367L608 473 M502 473L608 367"/>
      </g>
      <circle cx="390" cy="420" r="14" fill="#f2b632" stroke="#8f3b2f" stroke-width="5"/>
      <path d="M390 420 L360 395 M390 420 L420 445" stroke="#8f3b2f" stroke-width="7" stroke-linecap="round"/>
      <path d="M360 395 L340 395 M420 445 L440 445" stroke="#8f3b2f" stroke-width="7" stroke-linecap="round"/>
      <path d="M470 300 L478 277" stroke="#444" stroke-width="7"/>
      <path d="M330 270 L320 253" stroke="#444" stroke-width="7"/>
      <path d="M505 270 Q520 258 535 270" fill="none" stroke="#444" stroke-width="7" stroke-linecap="round"/>
      <path d="M315 270 Q300 258 285 270" fill="none" stroke="#444" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="405" cy="255" rx="82" ry="105" fill="#f5f1e6" stroke="#39434b" stroke-width="6"/>
      <path d="M350 230 Q310 250 315 330 Q350 318 380 275Z" fill="#d7dce0" stroke="#39434b" stroke-width="5"/>
      <path d="M462 230 Q500 250 495 330 Q460 318 432 275Z" fill="#d7dce0" stroke="#39434b" stroke-width="5"/>
      <circle cx="405" cy="155" r="63" fill="#fffaf0" stroke="#39434b" stroke-width="6"/>
      <path d="M430 165 Q510 160 610 190 Q520 230 430 205Z" fill="#f3a33b" stroke="#39434b" stroke-width="6"/>
      <path d="M448 185 Q520 183 590 195 Q520 210 450 205Z" fill="#f7c45a"/>
      <circle cx="425" cy="145" r="10" fill="#202a30"/>
      <circle cx="428" cy="141" r="3" fill="#fff"/>
      <path d="M383 125 Q400 110 415 125" fill="none" stroke="#39434b" stroke-width="6" stroke-linecap="round"/>
      <path d="M375 305 Q405 330 435 305" fill="none" stroke="#39434b" stroke-width="5"/>
      <path d="M374 350 L350 420 M435 350 L455 420" stroke="#e99b32" stroke-width="12" stroke-linecap="round"/>
      <path d="M350 420 L330 425 M455 420 L475 425" stroke="#39434b" stroke-width="7" stroke-linecap="round"/>
      <path d="M380 340 Q410 360 440 340" fill="none" stroke="#39434b" stroke-width="4"/>
      <path d="M455 270 Q520 245 545 290 Q500 305 455 292Z" fill="#eef2f3" stroke="#39434b" stroke-width="5"/>
      <text x="405" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#39434b">HONK!</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif" fill="#17324d">
    <text x="70" y="180" font-size="20" font-weight="700" transform="rotate(-8 70 180)">BEAKFAST EXPRESS</text>
    <path d="M170 190 Q210 210 250 230" fill="none" stroke="#17324d" stroke-width="3" stroke-dasharray="7 7"/>
    <text x="610" y="300" font-size="18" font-weight="700" transform="rotate(8 610 300)">NO FISH, JUST FLYING!</text>
  </g>

  <rect x="25" y="548" width="750" height="35" rx="10" fill="#fff8df" stroke="#17324d" stroke-width="2"/>
  <text x="400" y="572" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#17324d">
    2026-10-27 23:03:14 SGT (UTC+08:00)
  </text>

  <animateTransform xlink:href="#wheelBack" attributeName="transform" type="rotate" from="0 270 420" to="360 270 420" dur="1.5s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#wheelFront" attributeName="transform" type="rotate" from="0 555 420" to="360 555 420" dur="1.5s" repeatCount="indefinite"/>
</svg>