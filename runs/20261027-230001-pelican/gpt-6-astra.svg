<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical pelican rides a bicycle while proudly carrying an oversized bill.</desc>
  <style>
    .ink{stroke:#17324d;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,Helvetica,sans-serif;fill:#17324d}
  </style>

  <rect width="800" height="600" fill="#dff5ff"/>
  <rect y="390" width="800" height="210" fill="#f7d58a"/>
  <path d="M0 420 Q120 375 240 420 T480 420 T720 420 T960 420" fill="none" stroke="#e3b96a" stroke-width="10"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900">PELICAN PEDAL PANIC</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="19">“He forgot the map, so he followed the fish-shaped road signs.”</text>

  <g id="bike">
    <g fill="none" class="ink">
      <circle cx="245" cy="430" r="82" fill="#fff8df"/>
      <circle cx="585" cy="430" r="82" fill="#fff8df"/>
      <path d="M245 430 L365 300 L470 430 L245 430 M365 300 L585 430 M470 430 L535 310 L585 430"/>
      <path d="M535 310 L575 294 M535 310 L520 285"/>
    </g>
    <g id="wheelMarks" fill="none" stroke="#ef8354" stroke-width="8">
      <path d="M245 348 v18 M245 494 v18 M163 430 h18 M309 430 h18"/>
      <path d="M585 348 v18 M585 494 v18 M503 430 h18 M649 430 h18"/>
    </g>
    <circle cx="365" cy="300" r="13" fill="#ef8354" class="ink"/>
    <circle cx="470" cy="430" r="13" fill="#ef8354" class="ink"/>
    <circle cx="365" cy="430" r="13" fill="#ef8354" class="ink"/>
    <path d="M365 430 L335 385 M365 430 L405 465" fill="none" class="ink"/>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="407" cy="245" rx="94" ry="75" fill="#f5f7f2" class="ink"/>
    <path d="M348 235 Q330 168 377 142 Q430 112 465 158 Q486 186 470 233" fill="#f5f7f2" class="ink"/>
    <path d="M383 164 Q420 137 454 168 Q422 185 387 187" fill="#ef8354" class="ink"/>
    <path d="M451 184 Q520 171 615 201 Q644 211 615 231 Q526 245 452 220 Z" fill="#f29a61" class="ink"/>
    <path d="M462 220 Q536 249 615 231" fill="none" class="ink"/>
    <circle cx="430" cy="171" r="8" fill="#17324d"/>
    <path d="M377 277 Q350 327 361 365" fill="none" class="ink"/>
    <path d="M438 278 Q474 325 470 365" fill="none" class="ink"/>
    <path d="M350 365 q28 12 54 0 M457 365 q28 12 54 0" fill="none" class="ink"/>
    <path d="M376 217 Q400 231 432 218" fill="none" stroke="#ef8354" stroke-width="8"/>
    <path d="M390 248 Q430 270 468 246" fill="none" stroke="#17324d" stroke-width="5"/>
    <path d="M396 248 q20 18 39 0" fill="none" stroke="#17324d" stroke-width="4"/>
    <path d="M383 286 Q413 302 447 285" fill="none" stroke="#ef8354" stroke-width="7"/>
    <g>
      <path d="M388 205 Q417 185 443 207 L451 274 Q422 290 396 273 Z" fill="#fff" class="ink"/>
      <text x="420" y="235" text-anchor="middle" class="label" font-size="18" font-weight="700">TAX</text>
      <text x="420" y="256" text-anchor="middle" class="label" font-size="16">BILL</text>
    </g>
    <path d="M368 206 Q338 218 323 246" fill="none" class="ink"/>
    <path d="M465 202 Q491 218 500 242" fill="none" class="ink"/>
    <circle cx="323" cy="247" r="8" fill="#ef8354" class="ink"/>
    <circle cx="500" cy="243" r="8" fill="#ef8354" class="ink"/>
  </g>

  <g id="pedalMotion">
    <animateTransform attributeName="transform" type="rotate" values="0 365 430;360 365 430" dur="1.4s" repeatCount="indefinite"/>
    <path d="M365 430 L330 448 M365 430 L400 412" fill="none" class="ink"/>
    <rect x="313" y="444" width="25" height="8" rx="4" fill="#ef8354" class="ink"/>
    <rect x="397" y="405" width="25" height="8" rx="4" fill="#ef8354" class="ink"/>
  </g>

  <g opacity=".9">
    <path d="M96 195 q28 -20 56 0 q-28 20 -56 0z" fill="#fff" class="ink"/>
    <path d="M665 145 q24 -17 48 0 q-24 17 -48 0z" fill="#fff" class="ink"/>
  </g>

  <text x="400" y="535" text-anchor="middle" class="label" font-size="20" font-weight="700">LOCAL BIRD CLAIMS NEW TAX POLICY IS “FOR THE FLOCK”</text>
  <text x="400" y="575" text-anchor="middle" class="label" font-size="16">2026-10-27 23:00:01 SGT (UTC+08:00)</text>
</svg>