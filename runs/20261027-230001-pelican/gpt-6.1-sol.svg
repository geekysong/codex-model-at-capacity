  <path d="M98 160 Q125 132 154 160" fill="none" class="ink"/>
  <text x="95" y="190" class="label bold" font-size="20">LOCAL HERO</text>
  <text x="95" y="215" class="label" font-size="16">zero feathers harmed*</text>
  <text x="95" y="236" class="label" font-size="12">*ego mildly bruised</text>

