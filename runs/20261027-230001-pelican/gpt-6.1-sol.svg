<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an enormous fish.</desc>
  <style>
    .ink{stroke:#263238;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .wheel{fill:none;stroke:#263238;stroke-width:8}
    .spoke{stroke:#90a4ae;stroke-width:3}
    .label{font-family:Arial,sans-serif;fill:#263238}
    .bold{font-weight:800}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    .rotor{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
    .rider{animation:bob 1.1s ease-in-out infinite}
  </style>

  <rect width="800" height="600" fill="#dff5ff"/>
  <circle cx="690" cy="105" r="48" fill="#ffd166" opacity=".9"/>
  <path d="M0 390 Q130 345 250 385 T500 375 T800 390 V520 H0Z" fill="#9bd18b"/>
  <path d="M0 430 Q170 405 330 435 T650 425 T800 440 V520 H0Z" fill="#77b86a"/>

  <text x="400" y="62" text-anchor="middle" class="label bold" font-size="34">PELICAN PEDALS TO GLORY</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="18">“Why walk when you can wobble with purpose?”</text>

  <g>
    <circle cx="240" cy="454" r="78" class="wheel"/>
    <circle cx="590" cy="454" r="78" class="wheel"/>
    <g class="rotor">
      <g class="spoke">
        <line x1="240" y1="376" x2="240" y2="532"/><line x1="162" y1="454" x2="318" y2="454"/>
        <line x1="185" y1="399" x2="295" y2="509"/><line x1="295" y1="399" x2="185" y2="509"/>
      </g>
    </g>
    <g class="rotor">
      <g class="spoke">
        <line x1="590" y1="376" x2="590" y2="532"/><line x1="512" y1="454" x2="668" y2="454"/>
        <line x1="535" y1="399" x2="645" y2="509"/><line x1="645" y1="399" x2="535" y2="509"/>
      </g>
    </g>
    <path d="M240 454 L350 335 L470 454 L240 454 M350 335 L590 454 M470 454 L430 318" fill="none" class="ink"/>
    <path d="M430 318 L458 300 M430 318 L405 292" fill="none" class="ink"/>
    <circle cx="350" cy="335" r="12" fill="#ff7043" class="ink"/>
    <circle cx="470" cy="454" r="10" fill="#ff7043" class="ink"/>
    <path d="M350 335 L392 380 M350 335 L315 378" fill="none" class="ink"/>
    <circle cx="392" cy="380" r="7" fill="#263238"/>
    <circle cx="315" cy="378" r="7" fill="#263238"/>
  </g>

  <g class="rider">
    <path d="M345 330 Q320 270 350 210 Q380 160 430 185 Q470 207 461 270 L442 337Z" fill="#f7f3e3" class="ink"/>
    <path d="M365 220 Q392 180 435 198 Q473 216 456 250 Q434 268 390 250Z" fill="#fffdf5" class="ink"/>
    <ellipse cx="452" cy="255" rx="88" ry="28" fill="#f6b73c" class="ink" transform="rotate(9 452 255)"/>
    <path d="M505 262 Q540 280 566 260 Q578 249 565 238 Q532 237 498 247Z" fill="#e8942e" class="ink"/>
    <circle cx="430" cy="214" r="7" fill="#263238"/>
    <path d="M430 206 Q447 192 463 206" fill="none" class="ink"/>
    <path d="M391 298 Q420 320 445 306" fill="none" class="ink"/>
    <path d="M365 330 Q350 350 350 378" fill="none" class="ink"/>
    <path d="M443 330 Q470 350 480 379" fill="none" class="ink"/>
    <path d="M350 378 L315 378 M480 379 L515 379" fill="none" class="ink"/>
