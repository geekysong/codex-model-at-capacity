  <path d="M0 235 Q130 195 265 235 T530 222 T800 232" fill="none" stroke="#fff" stroke-width="14" opacity=".75"/>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#183047">PELICAN: TOUR DE SNACK</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#31546a">“I was told this was a bike lane, not a beak lane.”</text>

