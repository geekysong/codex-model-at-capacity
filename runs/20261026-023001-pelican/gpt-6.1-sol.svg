<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish in its enormous bill pouch. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#fff5ce"/>
      <stop offset="1" stop-color="#f9ddb0"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc44c"/>
      <stop offset="1" stop-color="#ee9142"/>
    </linearGradient>
    <pattern id="road" width="130" height="12" patternUnits="userSpaceOnUse">
      <path d="M15 6h65" stroke="#fff6da" stroke-width="4" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="20" y="20" width="760" height="470" rx="24" fill="url(#sky)"/>
  <circle cx="680" cy="145" r="44" fill="#f5b854" opacity=".65"/>
  <g fill="#fff9e9" opacity=".8">
    <path d="M64 171c-10-26 30-41 43-20 17-34 63-18 57 8 29-3 36 27 14 30H74c-22 0-28-15-10-18Z"/>
    <path d="M515 154c-5-19 24-31 36-13 14-24 46-12 43 6 25-3 28 21 9 24h-80c-17 0-22-12-8-17Z"/>
  </g>

  <text x="400" y="78" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="49" font-weight="900" fill="#253c42" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#8b533e" letter-spacing="2">ZERO EMISSIONS. MASSIVE CARRY-ON.</text>

  <path d="M20 407Q145 370 265 402T510 400T780 393V466H20Z" fill="#bdcba0"/>
  <path d="M20 438Q360 414 780 437V490H20Z" fill="#6e8581"/>
  <rect x="20" y="469" width="760" height="12" fill="url(#road)"/>
  <ellipse cx="391" cy="452" rx="226" ry="12" fill="#344d4b" opacity=".19"/>

  <g stroke="#293c40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spinning wheels -->
    <g transform="translate(247 389)">
      <circle r="65" fill="#fff4d8" stroke-width="10"/>
      <circle r="56" fill="none" stroke="#b6b8a3" stroke-width="2"/>
      <g stroke="#879793" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-57 0H57M0-57V57M-40-40l80 80M-40 40l80-80"/>
        <path d="M-22-53l44 106M-53-22l106 44M-53 22l106-44M-22 53l44-106"/>
        <path d="M0-59h12" stroke="#ee7249" stroke-width="5"/>
      </g>
      <circle r="7" fill="#293c40" stroke="none"/>
    </g>
    <g transform="translate(532 389)">
      <circle r="65" fill="#fff4d8" stroke-width="10"/>
      <circle r="56" fill="none" stroke="#b6b8a3" stroke-width="2"/>
      <g stroke="#879793" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-57 0H57M0-57V57M-40-40l80 80M-40 40l80-80"/>
        <path d="M-22-53l44 106M-53-22l106 44M-53 22l106-44M-22 53l44-106"/>
        <path d="M0-59h12" stroke="#ee7249" stroke-width="5"/>
      </g>
      <circle r="7" fill="#293c40" stroke="none"/>
    </g>

    <!-- Bicycle -->
    <path d="M247 389l69-96 63 96H247l223-84-91 84M316 293l154 12" fill="none" stroke-width="9" stroke="#d55c48"/>
    <path d="M532 389l-62-104-9-23 24-9 15 7" fill="none" stroke-width="8"/>
    <path d="M316 293l-8-24" fill="none" stroke-width="7"/>
    <path d="M282 267q23-10 52-1" fill="none" stroke-width="12"/>
    <path d="M247 389h132" stroke-width="3" opacity=".5"/>
    <circle cx="379" cy="389" r="17" fill="#ead5a9" stroke-width="4"/>

    <!-- Pelican and its tiny pedaling legs -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
      <path d="M326 263q-5 34 31 61l22 65" fill="none" stroke="#d28b32" stroke-width="10">
        <animate attributeName="d" values="M326 263q-5 34 31 61l22 65;M326 263q33 18 48 54l5 72;M326 263q-5 34 31 61l22 65" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M355 375l24 14 24 1" fill="none" stroke="#d28b32" stroke-width="8"/>
      <path d="M326 272q34 22 64 62l-24 29" fill="none" stroke="#f2ad3e" stroke-width="11">
        <animate attributeName="d" values="M326 272q34 22 64 62l-24 29;M326 272q-10 43 24 68l16 23;M326 272q34 22 64 62l-24 29" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M350 361l18 6 24-3" fill="none" stroke="#f2ad3e" stroke-width="8"/>

      <path d="M294 238l-39-21 15 38-34-6q29 36 67 26" fill="#f6f3df" stroke-width="4"/>
      <path d="M286 210q22-41 71-27 45 12 51 57-10 43-65 46-56-2-66-34Z" fill="#fffdf0" stroke-width="4"/>
      <path d="M296 221q32-24 66-2l-21 47q-30 5-45-13" fill="#d9e1d7" stroke-width="3"/>
      <path d="M305 234q15 6 25 4M303 245l20 5" fill="none" stroke="#9caeaa" stroke-width="3"/>

      <path d="M369 221q-5-35 8-72 8-24 31-24 32 1 32 28-1 18-24 39l-7 42" fill="#fffdf0" stroke-width="4"/>
      <path d="M389 130l-9-15 17 7 4-16 10 17" fill="#fffdf0" stroke-width="3"/>
      <path d="M422 160l174 19q-30 76-123 43-36-14-51-62Z" fill="url(#pouch)" stroke-width="4"/>
      <path d="M427 150l180 26-10 12-172-23Z" fill="#f4b43f" stroke-width="4"/>
      <path d="M592 178l15-2-4 12" fill="none" stroke-width="3"/>
      <!-- Fish passenger -->
      <path d="M490 203q22-22 52-3l16-11-2 24-16-8q-27 17-50-2Z" fill="#78aaa0" stroke-width="2.5"/>
      <circle cx="502" cy="200" r="3" fill="#293c40" stroke="none"/>
      <path d="M516 193l9-9 7 11" fill="#78aaa0" stroke-width="2"/>
      <path d="M470 219q54 21 88-8" fill="none" stroke="#ce7936" stroke-width="3"/>
      <!-- Smug eye and eyebrow -->
      <path d="M403 146q10-7 20 0" fill="none" stroke-width="4"/>
      <path d="M403 154h18" fill="none" stroke-width="3"/>
      <circle cx="413" cy="158" r="4" fill="#293c40" stroke="none"/>
      <!-- Wing gripping the handlebar -->
      <path d="M370 222q40 21 87 34l22-3" fill="none" stroke-width="18" stroke="#fffdf0"/>
      <path d="M370 230q42 22 87 31l22-4" fill="none" stroke-width="3"/>
      <path d="M465 251l4 11m4-13 4 11" stroke-width="2.5"/>
      <!-- Cycling scarf -->
      <path d="M379 194l36 11-6 13-34-10Z" fill="#d95846" stroke-width="3"/>
      <path d="M379 201q-33-21-62-11l17 10-18 10q33-10 59 4" fill="#d95846" stroke-width="3"/>
    </g>

    <g transform="translate(379 389)" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" from="0 379 389" to="360 379 389" dur="1.6s" repeatCount="indefinite" additive="sum"/>
      <path d="M0 0l19 19" fill="none"/>
      <path d="M10 20h20" stroke-width="6"/>
    </g>
  </g>

  <!-- Speech balloon -->
  <path d="M65 230q0-17 18-17h143q18 0 18 17v47q0 17-18 17h-16l13 25-40-25H83q-18 0-18-17Z" fill="#fffdf0" stroke="#293c40" stroke-width="3"/>
  <text x="155" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#293c40">
    <tspan x="155">“I brought my</tspan>
    <tspan x="155" dy="25">own fuel.”</tspan>
  </text>

  <path d="M151 349h35m-54 16h40m-19 17h25" stroke="#c08761" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="527" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#293c40">One pelican. Two wheels. A suspiciously fishy energy policy.</text>
  <path d="M95 548H705" stroke="#d8c8a9"/>
  <text x="400" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#586463">2026-10-26 02:31:20 SGT (UTC+08:00)</text>
</svg>