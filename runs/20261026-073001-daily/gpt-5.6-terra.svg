  <rect width="600" height="400" fill="#ffffff"/>
  <text x="40" y="28" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Knight moves from square 6</text>

  <g stroke="#374151" stroke-width="2">
    <rect x="40" y="50" width="60" height="60" fill="#ffffff"/>
    <rect x="100" y="50" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="50" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="50" width="60" height="60" fill="#fbbf24"/>
    <rect x="40" y="110" width="60" height="60" fill="#ffffff"/>
    <rect x="100" y="110" width="60" height="60" fill="#bfdbfe"/>
    <rect x="160" y="110" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="110" width="60" height="60" fill="#ffffff"/>
    <rect x="40" y="170" width="60" height="60" fill="#fbbf24"/>
    <rect x="100" y="170" width="60" height="60" fill="#ffffff"/>
    <rect x="160" y="170" width="60" height="60" fill="#ffffff"/>
    <rect x="220" y="170" width="60" height="60" fill="#fbbf24"/>
    <rect x="40" y="230" width="60" height="60" fill="#fbbf24"/>
