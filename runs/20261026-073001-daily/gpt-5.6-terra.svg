    <text x="70" y="80">1</text><text x="130" y="80">2</text><text x="190" y="80">3</text><text x="250" y="80">4</text>
    <text x="70" y="140">5</text><text x="130" y="140">6</text><text x="190" y="140">7</text><text x="250" y="140">8</text>
    <text x="70" y="200">9</text><text x="130" y="200">10</text><text x="190" y="200">11</text><text x="250" y="200">12</text>
