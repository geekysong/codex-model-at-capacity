<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Beak</title>
  <desc id="desc">A pelican pedals a bicycle with a fish in its bill, while its wheels spin and its body bobs.</desc>
  <style>
    .ink { stroke: #26333b; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
    .rider { animation: bob .7s ease-in-out infinite alternate; }
    .cloud { fill: #fff; opacity: .8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-5px) rotate(-1deg); } }
    @media (prefers-reduced-motion: reduce) { .wheel, .rider { animation: none; } }
  </style>
  <rect width="800" height="600" fill="#f8e9bd"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#e1f3ee" stroke="#26333b" stroke-width="4"/>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#26333b">THE DAILY BEAK</text>
  <text x="400" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="3" fill="#b05a45">LOCAL NEWS • UNLOCAL BIRD</text>
