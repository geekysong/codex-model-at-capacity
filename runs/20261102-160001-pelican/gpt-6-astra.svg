  <g font-family="Arial, sans-serif" fill="#253842">
    <path d="M64 218Q64 204 78 204H209Q223 204 223 218V265Q223 279 209 279H180L190 297L156 279H78Q64 279 64 265Z" fill="#fffaf0" stroke="#253842" stroke-width="3"/>
    <text x="143" y="233" text-anchor="middle" font-size="19" font-weight="bold">“It’s my</text>
    <text x="143" y="257" text-anchor="middle" font-size="19" font-weight="bold">fuel tank.”</text>
  </g>

  <rect y="511" width="800" height="89" fill="#fff6dc"/>
  <path d="M38 512H762" stroke="#253842" stroke-width="2"/>
  <text x="400" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#253842">This pelican bikes to work. The lunch bill is enormous.</text>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#42565e">2026-11-02 16:00:01 SGT (UTC+08:00)</text>
