    <text x="699" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" stroke="none" fill="#b9463a">NO FISHING</text>
    <text x="699" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" stroke="none" fill="#253842">YES, EVEN TO GO.</text>
  </g>

  <ellipse cx="378" cy="470" rx="221" ry="13" fill="#253842" opacity=".13"/>

  <g transform="translate(235 399)">
