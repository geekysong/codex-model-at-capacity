    <path d="M42 185Q45 160 73 168Q86 136 110 166Q141 157 148 185Z"/>
    <path d="M530 160Q540 143 557 151Q573 124 591 149Q615 143 625 160Z"/>
  </g>

  <text x="400" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#253842">THE SUSTAINABLE SEAFOOD COMMUTE</text>
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#52656a">Zero emissions. Suspiciously high fish consumption.</text>

  <path d="M0 323Q180 297 350 322T800 316V419H0Z" fill="#afd8d7"/>
  <path d="M0 337H800V418H0Z" fill="url(#water)"/>
  <path d="M0 418H800V510H0Z" fill="#d6cbb1"/>
  <path d="M0 420H800" stroke="#829792" stroke-width="5"/>
  <path d="M15 481H100M148 481H233M570 481H655M703 481H788" stroke="#fff8e5" stroke-width="6"/>

  <g stroke="#253842" stroke-linejoin="round">
