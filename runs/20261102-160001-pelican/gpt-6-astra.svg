<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The sustainable seafood commute</title>
  <desc id="desc">A smug pelican pedals a bicycle with an enormous fish-filled bill, passing a sign that says no fishing. The wheels spin and the pelican bobs in a looping animation.</desc>
  <defs>
    <pattern id="water" width="70" height="24" patternUnits="userSpaceOnUse">
      <path d="M5 12 Q18 5 31 12 T57 12" fill="none" stroke="#7fbfc5" stroke-width="2"/>
    </pattern>
    <g id="spokes" stroke="#38515b" stroke-width="3">
      <circle r="70" fill="#fff8e5" stroke="#253842" stroke-width="10"/>
      <circle r="60" fill="none" stroke="#a8b9b4" stroke-width="2"/>
      <path d="M-60 0H60 M0-60V60 M-42-42L42 42 M-42 42L42-42"/>
      <path d="M0-62L10-60" stroke="#ed8744" stroke-width="6"/>
      <circle r="8" fill="#253842"/>
    </g>
    <g id="fish">
      <path d="M-21 0Q-5-18 17 0Q-5 18-21 0L-33-10V10Z" fill="#76b7af" stroke="#253842" stroke-width="2"/>
      <circle cx="8" cy="-2" r="2.5" fill="#253842"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6dc"/>
  <path d="M0 114H800V418H0Z" fill="#d6edef"/>
  <circle cx="690" cy="172" r="38" fill="#f6ca69"/>
