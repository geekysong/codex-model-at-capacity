<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest street route from A1 to E5</title>
  <desc id="desc">A five-column, five-row street grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, totaling eight street segments and avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172033">City street map</text>

  <g fill="#e2e8f0">
    <rect x="100" y="60" width="400" height="240"/>
  </g>

  <g stroke="#94a3b8" stroke-width="5" fill="none">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <path d="M100 60H500V300" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#fff" stroke="#475569" stroke-width="2">
    <circle cx="100" cy="60" r="5"/><circle cx="200" cy="60" r="5"/><circle cx="300" cy="60" r="5"/><circle cx="400" cy="60" r="5"/><circle cx="500" cy="60" r="5"/>
    <circle cx="100" cy="120" r="5"/><circle cx="300" cy="120" r="5"/><circle cx="400" cy="120" r="5"/><circle cx="500" cy="120" r="5"/>
    <circle cx="100" cy="180" r="5"/><circle cx="200" cy="180" r="5"/><circle cx="400" cy="180" r="5"/><circle cx="500" cy="180" r="5"/>
    <circle cx="100" cy="240" r="5"/><circle cx="200" cy="240" r="5"/><circle cx="300" cy="240" r="5"/><circle cx="500" cy="240" r="5"/>
    <circle cx="100" cy="300" r="5"/><circle cx="200" cy="300" r="5"/><circle cx="300" cy="300" r="5"/><circle cx="400" cy="300" r="5"/><circle cx="500" cy="300" r="5"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M192 112L208 128 M208 112L192 128"/>
    <path d="M292 172L308 188 M308 172L292 188"/>
    <path d="M392 232L408 248 M408 232L392 248"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#172033" paint-order="stroke" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round">
    <text x="110" y="49">A1</text><text x="210" y="49">B1</text><text x="310" y="49">C1</text><text x="410" y="49">D1</text><text x="510" y="49">E1</text>
    <text x="110" y="109">A2</text><text x="210" y="109">B2</text><text x="310" y="109">C2</text><text x="410" y="109">D2</text><text x="510" y="109">E2</text>
    <text x="110" y="169">A3</text><text x="210" y="169">B3</text><text x="310" y="169">C3</text><text x="410" y="169">D3</text><text x="510" y="169">E3</text>
    <text x="110" y="229">A4</text><text x="210" y="229">B4</text><text x="310" y="229">C4</text><text x="410" y="229">D4</text><text x="510" y="229">E4</text>
    <text x="110" y="289">A5</text><text x="210" y="289">B5</text><text x="310" y="289">C5</text><text x="410" y="289">D5</text><text x="510" y="289">E5</text>
  </g>

  <circle cx="100" cy="60" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <text x="78" y="65" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">START</text>
  <circle cx="500" cy="300" r="8" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
  <text x="520" y="305" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">END</text>

  <text x="300" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">Shortest route: 8 street segments</text>

  <path d="M25 353H575" stroke="#cbd5e1"/>
  <text x="300" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 12:33:44 SGT (UTC+08:00)</text>
</svg>