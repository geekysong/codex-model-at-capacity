<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid shortest route from A1 to E5</title>
  <desc id="desc">An eight-segment route follows row 1 from A1 to E1, then column E to E5, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Shortest route: 8 street segments</text>

  <!-- City blocks -->
  <path d="M100 60H500V300H100Z" fill="#e2e8f0"/>
  <g stroke="#ffffff" stroke-width="14">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="2">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <!-- Shortest street route -->
  <path d="M100 60H500V300" fill="none" stroke="#2563eb" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <g fill="#475569">
    <circle cx="200" cy="60" r="4"/><circle cx="300" cy="60" r="4"/><circle cx="400" cy="60" r="4"/><circle cx="500" cy="60" r="4"/>
    <circle cx="100" cy="120" r="4"/><circle cx="300" cy="120" r="4"/><circle cx="400" cy="120" r="4"/><circle cx="500" cy="120" r="4"/>
    <circle cx="100" cy="180" r="4"/><circle cx="200" cy="180" r="4"/><circle cx="400" cy="180" r="4"/><circle cx="500" cy="180" r="4"/>
    <circle cx="100" cy="240" r="4"/><circle cx="200" cy="240" r="4"/><circle cx="300" cy="240" r="4"/><circle cx="500" cy="240" r="4"/>
    <circle cx="100" cy="300" r="4"/><circle cx="200" cy="300" r="4"/><circle cx="300" cy="300" r="4"/><circle cx="400" cy="300" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 113L207 127 M207 113L193 127"/>
    <path d="M293 173L307 187 M307 173L293 187"/>
    <path d="M393 233L407 247 M407 233L393 247"/>
  </g>

  <circle cx="100" cy="60" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="300" r="8" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">
    <text x="112" y="50">A1</text><text x="212" y="50">B1</text><text x="312" y="50">C1</text><text x="412" y="50">D1</text><text x="512" y="50">E1</text>
    <text x="112" y="110">A2</text><text x="212" y="110">B2</text><text x="312" y="110">C2</text><text x="412" y="110">D2</text><text x="512" y="110">E2</text>
    <text x="112" y="170">A3</text><text x="212" y="170">B3</text><text x="312" y="170">C3</text><text x="412" y="170">D3</text><text x="512" y="170">E3</text>
    <text x="112" y="230">A4</text><text x="212" y="230">B4</text><text x="312" y="230">C4</text><text x="412" y="230">D4</text><text x="512" y="230">E4</text>
    <text x="112" y="290">A5</text><text x="212" y="290">B5</text><text x="312" y="290">C5</text><text x="412" y="290">D5</text><text x="512" y="290">E5</text>
    <text x="82" y="65" text-anchor="end" fill="#15803d">START</text>
    <text x="500" y="326" text-anchor="middle" fill="#7c3aed">END</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13">
    <path d="M100 337H130" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
    <text x="140" y="342" fill="#334155">Route</text>
    <path d="M233 331L245 343 M245 331L233 343" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="255" y="342" fill="#334155">Blocked intersection</text>
  </g>

  <path d="M25 357H575" stroke="#cbd5e1"/>
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-10-30 12:33:09 SGT (UTC+08:00)</text>
</svg>