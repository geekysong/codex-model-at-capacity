<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#ffffff"/>

  <!-- Grid cells: dark when row + column is prime -->
  <g stroke="#000000" stroke-width="1">
    <rect x="60" y="50" width="60" height="60" fill="#333333"/>
    <rect x="120" y="50" width="60" height="60" fill="#333333"/>
    <rect x="180" y="50" width="60" height="60" fill="#eeeeee"/>
    <rect x="240" y="50" width="60" height="60" fill="#333333"/>
    <rect x="300" y="50" width="60" height="60" fill="#eeeeee"/>

    <rect x="60" y="110" width="60" height="60" fill="#333333"/>
    <rect x="120" y="110" width="60" height="60" fill="#eeeeee"/>
    <rect x="180" y="110" width="60" height="60" fill="#333333"/>
    <rect x="240" y="110" width="60" height="60" fill="#eeeeee"/>
    <rect x="300" y="110" width="60" height="60" fill="#333333"/>

    <rect x="60" y="170" width="60" height="60" fill="#eeeeee"/>
    <rect x="120" y="170" width="60" height="60" fill="#333333"/>
    <rect x="180" y="170" width="60" height="60" fill="#eeeeee"/>
    <rect x="240" y="170" width="60" height="60" fill="#333333"/>
    <rect x="300" y="170" width="60" height="60" fill="#eeeeee"/>

    <rect x="60" y="230" width="60" height="60" fill="#333333"/>
    <rect x="120" y="230" width="60" height="60" fill="#eeeeee"/>
    <rect x="180" y="230" width="60" height="60" fill="#333333"/>
    <rect x="240" y="230" width="60" height="60" fill="#eeeeee"/>
    <rect x="300" y="230" width="60" height="60" fill="#eeeeee"/>

    <rect x="60" y="290" width="60" height="60" fill="#eeeeee"/>
    <rect x="120" y="290" width="60" height="60" fill="#333333"/>
    <rect x="180" y="290" width="60" height="60" fill="#eeeeee"/>
    <rect x="240" y="290" width="60" height="60" fill="#eeeeee"/>
    <rect x="300" y="290" width="60" height="60" fill="#eeeeee"/>
  </g>

  <!-- Column numbers -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#000000" text-anchor="middle">
    <text x="90" y="35">1</text>
    <text x="150" y="35">2</text>
    <text x="210" y="35">3</text>
    <text x="270" y="35">4</text>
    <text x="330" y="35">5</text>
  </g>

  <!-- Row numbers -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#000000" text-anchor="middle">
    <text x="40" y="86">1</text>
    <text x="40" y="146">2</text>
    <text x="40" y="206">3</text>
    <text x="40" y="266">4</text>
    <text x="40" y="326">5</text>
  </g>

  <!-- Legend -->
  <g font-family="Arial, sans-serif" font-size="16" fill="#000000">
    <text x="400" y="75" font-weight="bold">Legend</text>
    <rect x="400" y="95" width="28" height="28" fill="#333333" stroke="#000000" stroke-width="1"/>
    <text x="440" y="116">Dark: row+col prime</text>
    <rect x="400" y="145" width="28" height="28" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
    <text x="440" y="166">Light: otherwise</text>
    <text x="400" y="215">Dark cells: 11</text>
  </g>

  <!-- Footer timestamp -->
  <text x="300" y="385" font-family="Arial, sans-serif" font-size="14" fill="#000000" text-anchor="middle">2026-10-29 01:03:55 SGT (UTC+08:00)</text>
</svg>