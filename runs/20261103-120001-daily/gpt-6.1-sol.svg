<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>79900</title>
  <desc>The union covers 79900 square pixels. A overlaps B by 8000 square pixels. B overlaps C by 2100 square pixels. A and C do not overlap.</desc>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M-2 2L2-2M0 7L7 0M5 9L9 5" fill="none" stroke="#263445" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#142033">
    <text x="300" y="30" text-anchor="middle" font-size="24" font-weight="700" aria-label="Total union area: 79900 square pixels">79900</text>

    <rect x="50" y="50" width="200" height="150" fill="#ef6b63" fill-opacity="0.45" stroke="#aa352e" stroke-width="2"/>
    <rect x="150" y="120" width="200" height="150" fill="#5698e8" fill-opacity="0.45" stroke="#235da4" stroke-width="2"/>
    <rect x="320" y="200" width="200" height="150" fill="#65bc83" fill-opacity="0.45" stroke="#287342" stroke-width="2"/>

    <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
    <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

    <g font-size="22" font-weight="700">
      <text x="92" y="98" text-anchor="middle">A</text>
      <text x="292" y="163" text-anchor="middle">B</text>
      <text x="435" y="309" text-anchor="middle">C</text>
    </g>

    <rect x="160" y="147" width="80" height="26" rx="4" fill="#fff" fill-opacity="0.95"/>
    <text x="200" y="165" text-anchor="middle" font-size="15" font-weight="700">8000 px²</text>

    <g transform="translate(335 235) rotate(-90)">
      <rect x="-30" y="-9" width="60" height="18" rx="3" fill="#fff" fill-opacity="0.95"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700">2100 px²</text>
    </g>

    <text x="300" y="372" text-anchor="middle" font-size="13">A and C do not overlap.</text>
    <text x="300" y="393" text-anchor="middle" font-size="13">2026-11-03 12:03:51 SGT (UTC+08:00)</text>
  </g>
</svg>