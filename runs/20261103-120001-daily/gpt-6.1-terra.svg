<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Total union area: 79,900 square pixels</title>
  <desc id="desc">Three overlapping rectangles. A and B overlap by 8,000 square pixels; B and C overlap by 2,100 square pixels. A and C do not overlap.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#172033" stroke-width="2" opacity="0.65"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#172033">Total union area: 79,900 px²</text>

  <rect x="50" y="50" width="200" height="150" fill="#4c91e8" fill-opacity="0.45" stroke="#205a9c" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#f1a33c" fill-opacity="0.45" stroke="#a15c00" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#65be83" fill-opacity="0.45" stroke="#277b49" stroke-width="2"/>

  <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

  <text x="80" y="85" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#172033">A</text>
  <text x="275" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#172033">B</text>
  <text x="475" y="325" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#172033">C</text>

  <rect x="159" y="149" width="82" height="22" rx="3" fill="#fff" opacity="0.94"/>
  <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172033">8,000 px²</text>
  <line x1="350" y1="235" x2="363" y2="235" stroke="#172033" stroke-width="1.5"/>
  <text x="368" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172033">2,100 px²</text>

  <text x="50" y="372" font-family="Arial, sans-serif" font-size="13" fill="#172033">A and C do not overlap.</text>
  <text x="50" y="391" font-family="Arial, sans-serif" font-size="13" fill="#172033">2026-11-03 12:04:19 SGT (UTC+08:00)</text>
</svg>