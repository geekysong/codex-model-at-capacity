<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly pretending it has everything under control.</desc>
  <style>
    .ink{stroke:#263238;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,sans-serif;fill:#263238}
    .wheel{fill:none;stroke:#263238;stroke-width:9}
    .spoke{stroke:#78909c;stroke-width:2}
  </style>

  <rect width="800" height="600" fill="#dff5ff"/>
  <circle cx="690" cy="105" r="52" fill="#ffd54f" stroke="#263238" stroke-width="5"/>
  <path d="M0 405 Q120 350 245 405 T500 400 T800 390 V520 H0Z" fill="#9ccc65"/>
  <path d="M0 470 Q160 430 310 470 T620 465 T800 455 V520 H0Z" fill="#7cb342"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900">THE GREAT PELICAN GETAWAY</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="18" font-weight="700">“No hands, no plan, no problem!”</text>

  <g id="bike">
    <g class="wheel">
      <circle cx="250" cy="425" r=" seventy" />
    </g>
    <g class="wheel">
      <circle cx="560" cy="425" r="70"/>
    </g>
    <g>
      <path class="spoke" d="M250 355V495M180 425H320M201 376L299 474M201 474L299 376"/>
      <path class="spoke" d="M560 355V495M490 425H630M511 376L609 474M511 474L609 376"/>
    </g>
    <path d="M250 425 L355 330 L560 425 L440 425 L355 330 L300 425 Z" fill="none" class="ink"/>
    <path d="M440 425 L470 350 L560 425" fill="none" class="ink"/>
    <path d="M470 350 L505 350" class="ink"/>
    <path d="M355 330 L330 292" class="ink"/>
    <path d="M305 292 H355" class="ink"/>
    <circle cx="440" cy="425" r="18" fill="#ffca28" class="ink"/>
    <path d="M440 425 l35 25 M440 425 l-25 -30" class="ink"/>
    <ellipse cx="440" cy="450" rx="17" ry="7" fill="#ef5350" class="ink"/>
    <ellipse cx="415" cy="395" rx="17" ry="7" fill="#ef5350" class="ink"/>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="400" cy="266" rx="82" ry="96" fill="#f5f7f8" class="ink"/>
    <path d="M350 220 Q330 135 395 125 Q460 130 451 220" fill="#eceff1" class="ink"/>
    <circle cx="393" cy="156" r="8" fill="#263238"/>
    <path d="M425 176 Q520 170 620 215 Q530 238 430 207Z" fill="#ffb74d" class="ink"/>
    <path d="M430 207 Q525 236 610 215 Q530 280 430 230Z" fill="#ffcc80" class="ink"/>
    <path d="M365 205 Q300 250 330 340" fill="none" stroke="#90a4ae" stroke-width="24" stroke-linecap="round"/>
    <path d="M430 220 Q470 270 455 335" fill="none" stroke="#90a4ae" stroke-width="24" stroke-linecap="round"/>
    <path d="M350 334 Q388 350 426 336" fill="none" class="ink"/>
    <path d="M382 352 L365 397 M430 350 L450 397" class="ink"/>
    <path d="M351 398 l-25 12 M351 398 l28 8 M450 398 l-26 13 M450 398 l30 4" class="ink"/>
    <path d="M343 237 Q375 214 410 238" fill="none" stroke="#263238" stroke-width="4"/>
    <text x="400" y="300" text-anchor="middle" class="label" font-size="16" font-weight="700">LICENSED</text>
    <text x="400" y="319" text-anchor="middle" class="label" font-size="16" font-weight="700">BIRD DRIVER</text>
  </g>

  <path d="M604 175 q38 -28 75 0" fill="none" stroke="#263238" stroke-width="4"/>
  <text x="640" y="160" class="label" font-size="16" font-weight="700">HONK!</text>

  <rect x="24" y="532" width="752" height="48" rx="12" fill="#fff8e1" stroke="#263238" stroke-width="3"/>
  <text x="400" y="552" text-anchor="middle" class="label" font-size="17" font-weight="700">A pelican pedals into traffic, proving that confidence is heavier than luggage.</text>
  <text x="400" y="571" text-anchor="middle" class="label" font-size="13">2026-10-29 10:31:16 SGT (UTC+08:00)</text>
</svg>