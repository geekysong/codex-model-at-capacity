<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#17152d"/>
      <stop offset="1" stop-color="#090914"/>
    </linearGradient>
    <linearGradient id="floor" x2="1">
      <stop stop-color="#271d46"/>
      <stop offset="1" stop-color="#0e0b1d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ink{stroke:#171323;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .txt{font-family:Arial,Helvetica,sans-serif;font-weight:900}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:700}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 430 Q190 390 400 430 T800 420 V600H0Z" fill="url(#floor)"/>
  <path d="M55 455H745" stroke="#7a4fb3" stroke-width="4" opacity=".6"/>
  <path d="M55 475H745" stroke="#382659" stroke-width="3"/>

  <!-- club facade -->
  <rect x="410" y="105" width="335" height="320" rx="24" fill="#261b43" class="ink"/>
  <path d="M425 155H730" stroke="#db3cff" stroke-width="8" filter="url(#glow)"/>
  <text x="578" y="143" text-anchor="middle" fill="#ff72e8" font-size="30" class="txt">THE MODEL CLUB</text>

  <!-- full sign -->
  <rect x="485" y="178" width="190" height="74" rx="13" fill="#ff174f" class="ink" filter="url(#glow)"/>
  <text x="580" y="230" text-anchor="middle" fill="#fff" font-size="46" class="txt">FULL</text>
  <circle cx="500" cy="193" r="5" fill="#ffd9e4"/>
  <circle cx="660" cy="193" r="5" fill="#ffd9e4"/>

  <!-- inside: lone model -->
  <ellipse cx="590" cy="335" rx="72" ry="18" fill="#0b0814" opacity=".7"/>
  <rect x="548" y="275" width="84" height="62" rx="16" fill="#67e8f9" class="ink"/>
  <circle cx="575" cy="301" r="8" fill="#10213b"/>
  <circle cx="606" cy="301" r="8" fill="#10213b"/>
  <path d="M570 320 Q590 334 610 320" fill="none" class="ink"/>
  <text x="590" y="366" text-anchor="middle" fill="#80f5ff" font-size="16" class="small">MODEL_01</text>
  <path d="M535 270 Q590 244 645 270" fill="none" stroke="#ffd34d" stroke-width="5"/>
  <text x="590" y="263" text-anchor="middle" fill="#ffd34d" font-size="14" class="small">exclusive access</text>

  <!-- bouncer -->
  <ellipse cx="330" cy="474" rx="92" ry="20" fill="#090712" opacity=".8"/>
  <rect x="277" y="270" width="105" height="165" rx="24" fill="#52627e" class="ink"/>
  <rect x="292" y="345" width="75" height="72" rx="12" fill="#202b45" class="ink"/>
  <circle cx="313" cy="372" r="8" fill="#ff315c" filter="url(#glow)"/>
  <circle cx="346" cy="372" r="8" fill="#ff315c" filter="url(#glow)"/>
  <path d="M310 398 Q330 410 350 398" fill="none" stroke="#ff315c" stroke-width="5"/>
  <rect x="265" y="222" width="129" height="67" rx="27" fill="#70809c" class="ink"/>
  <path d="M280 250H380" stroke="#26334e" stroke-width="10"/>
  <circle cx="330" cy="203" r="8" fill="#ffcc4d" class="ink"/>
  <path d="M330 211V223" class="ink" fill="none"/>
  <path d="M277 300 L225 335" class="ink" fill="none"/>
  <path d="M382 301 L425 338" class="ink" fill="none"/>
  <path d="M228 335 Q207 330 201 348" fill="none" stroke="#70809c" stroke-width="18"/>
  <path d="M425 338 Q447 335 456 350" fill="none" stroke="#70809c" stroke-width="18"/>
  <path d="M276 424 L252 477" class="ink" fill="none"/>
  <path d="M382 424 L407 477" class="ink" fill="none"/>
  <path d="M233 479H274M390 479H431" stroke="#20243a" stroke-width="14" class="ink"/>
  <rect x="286" y="438" width="87" height="27" rx="8" fill="#ffcc4d" class="ink"/>
  <text x="329" y="457" text-anchor="middle" font-size="14" class="txt">DENIED</text>

  <!-- velvet rope -->
  <path d="M185 410 Q260 455 410 410" fill="none" stroke="#d41468" stroke-width="9"/>
  <circle cx="185" cy="410" r="13" fill="#ffd34d" class="ink"/>
  <circle cx="410" cy="410" r="13" fill="#ffd34d" class="ink"/>

  <!-- queue of developers -->
  <g class="ink">
    <circle cx="92" cy="369" r="25" fill="#f2b28d"/>
    <path d="M67 364 Q92 332 117 364" fill="#40304d"/>
    <rect x="67" y="394" width="50" height="65" rx="14" fill="#5bd1b8"/>
    <path d="M74 414H110" stroke="#253d49" stroke-width="5"/>
    <path d="M81 459L72 500M104 459L114 500" fill="none"/>
    <path d="M67 500H85M105 500H123" stroke="#25213c" stroke-width="11"/>

    <circle cx="159" cy="392" r="23" fill="#c98163"/>
    <path d="M136 387 Q159 359 182 387" fill="#d6d0c5"/>
    <rect x="137" y="415" width="45" height="59" rx="13" fill="#e85d75"/>
    <path d="M145 470L138 507M174 470L183 507" fill="none"/>
    <path d="M129 507H147M175 507H193" stroke="#25213c" stroke-width="10"/>
    <path d="M143 403 Q159 415 175 403" fill="none"/>
  </g>

  <!-- exhausted developer -->
  <g class="ink">
    <circle cx="35" cy="472" r="24" fill="#e2a47d"/>
    <path d="M12 468 Q35 437 58 468" fill="#25243d"/>
    <path d="M20 470L29 475M42 475L51 470" stroke="#2a2133" stroke-width="5"/>
    <path d="M21 490 Q35 480 49 490" fill="none"/>
    <rect x="9" y="499" width="52" height="65" rx="13" fill="#4d83e6"/>
    <path d="M20 562L14 590M49 562L56 590" fill="none"/>
    <path d="M6 590H25M48 590H67" stroke="#25213c" stroke-width="11"/>
    <path d="M66 520 Q90 500 112 518" fill="none" stroke="#8cf5ff" stroke-width="4"/>
    <text x="89" y="512" fill="#8cf5ff" font-size="15" class="small">retry...</text>
  </g>

  <!-- melting hamster servers -->
  <g class="ink">
    <rect x="470" y="450" width="80" height="50" rx="8" fill="#68718c"/>
    <rect x="565" y="450" width="80" height="50" rx="8" fill="#68718c"/>
    <path d="M485 466H535M485 480H520M580 466H630M580 480H615" stroke="#39e8ff" stroke-width="5"/>
    <circle cx="540" cy="462" r="5" fill="#ff4d6d"/>
    <circle cx="635" cy="462" r="5" fill="#ff4d6d"/>
    <path d="M490 500 Q480 520 495 530 Q510 537 520 520 Q530 540 545 528 Q553 518 544 500" fill="#ff724d"/>
    <path d="M585 500 Q575 520 590 530 Q605 537 615 520 Q625 540 640 528 Q648 518 639 500" fill="#ff724d"/>
    <circle cx="510" cy="514" r="12" fill="#e8a47d"/>
    <circle cx="605" cy="514" r="12" fill="#e8a47d"/>
    <path d="M503 510L510 517M516 510L509 517M598 510L605 517M611 510L604 517" stroke="#38213d" stroke-width="3"/>
  </g>

  <!-- title and caption -->
  <text x="400" y=" fifty" text-anchor="middle" fill="#fff" font-size="36" class="txt">CODEX NIGHTCLUB</text>
  <rect x="32" y="38" width="736" height="68" rx="18" fill="#101022" stroke="#ffcc4d" stroke-width="4"/>
  <text x="400" y="83" text-anchor="middle" fill="#ffcc4d" font-size="29" class="txt">SELECTED MODEL IS AT CAPACITY</text>
  <text x="400" y="555" text-anchor="middle" fill="#f3eaff" font-size="20" class="small">“Please try a different model.” — says the bouncer, while the servers literally melt.</text>
</svg>