<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17152d"/>
      <stop offset="1" stop-color="#090914"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#7df9ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="120" cy="115" r="75" fill="#29204a" opacity=".45"/>
  <circle cx="700" cy="130" r="95" fill="#182e45" opacity=".4"/>
  <path d="M0 455 Q200 420 400 455 T800 445 V600 H0Z" fill="#07070f"/>

  <text x="400" y="48" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="30" fill="#fff" stroke="#ff4fd8" stroke-width="2" paint-order="stroke">CODEX NIGHTCLUB</text>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7df9ff">THE EXCLUSIVE MODEL LOUNGE</text>

  <!-- Club entrance -->
  <rect x="535" y="105" width="220" height="315" rx="16" fill="#111126" stroke="#7df9ff" stroke-width="4"/>
  <rect x="555" y="130" width="180" height="245" rx="10" fill="#21143b" stroke="#ff4fd8" stroke-width="3"/>
  <path d="M570 350 Q645 285 720 350" fill="none" stroke="#7df9ff" stroke-width="3" opacity=".8"/>
  <text x="645" y="170" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" fill="#ff4fd8" filter="url(#glow)">FULL</text>
  <text x="645" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#fff">ONE MODEL INSIDE</text>

  <!-- lone model inside -->
  <g transform="translate(642 265)">
    <rect x="-30" y="-38" width="60" height="48" rx="12" fill="#45e0c0" stroke="#d5fff5" stroke-width="3"/>
    <circle cx="-12" cy="-15" r="5" fill="#16142b"/><circle cx="12" cy="-15" r="5" fill="#16142b"/>
    <path d="M-16 0 Q0 12 16 0" fill="none" stroke="#16142b" stroke-width="3"/>
    <rect x="-25" y="10" width="50" height="62" rx="8" fill="#7754d9"/>
    <text x="0" y="42" text-anchor="middle" font-family="Arial Black" font-size="13" fill="#fff">VIP</text>
    <path d="M-25 25 L-48 48 M25 25 L48 48" stroke="#7754d9" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- robot bouncer -->
  <g transform="translate(485 250)">
    <ellipse cx="0" cy="157" rx="78" ry="18" fill="#000" opacity=".5"/>
    <rect x="-55" y="-30" width="110" height="92" rx="18" fill="#a7b7c8" stroke="#26354d" stroke-width="5"/>
    <rect x="-43" y="-18" width="86" height="58" rx="12" fill="#101a2e"/>
    <circle cx="-19" cy="10" r="8" fill="#ff4fd8" filter="url(#glow)"/>
    <circle cx="19" cy="10" r="8" fill="#7df9ff" filter="url(#glow)"/>
    <path d="M-22 29 Q0 40 22 29" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M-38 -33 L-25 -58 M38 -33 L25 -58" stroke="#a7b7c8" stroke-width="7"/>
    <circle cx="-25" cy="-61" r="7" fill="#ff4fd8"/><circle cx="25" cy="-61" r="7" fill="#7df9ff"/>
    <rect x="-70" y="62" width="140" height="94" rx="22" fill="#445775" stroke="#26354d" stroke-width="5"/>
    <path d="M-63 82 L-103 115 M63 82 L102 65" stroke="#a7b7c8" stroke-width="15" stroke-linecap="round"/>
    <path d="M-25 156 L-38 205 M25 156 L38 205" stroke="#a7b7c8" stroke-width="18" stroke-linecap="round"/>
    <rect x="-62" y="105" width="124" height="30" rx="8" fill="#151a32"/>
    <text x="0" y="126" text-anchor="middle" font-family="Arial Black" font-size="14" fill="#ffec74">NOPE</text>
  </g>

  <!-- velvet rope -->
  <path d="M385 390 Q445 430 525 390" fill="none" stroke="#a00045" stroke-width="12"/>
  <circle cx="385" cy="390" r="10" fill="#ffd66b"/><circle cx="525" cy="390" r="10" fill="#ffd66b"/>
  <path d="M385 390 V470 M525 390 V470" stroke="#c9a65a" stroke-width="7"/>

  <!-- queue developers -->
  <g font-family="Arial, sans-serif">
    <g transform="translate(80 350)">
      <circle cx="0" cy="0" r="26" fill="#d49a77"/><path d="M-26 0 Q0-35 26 0" fill="#36213b"/>
      <rect x="-28" y="27" width="56" height="72" rx="15" fill="#4c9bd8"/>
      <path d="M-28 48 L-58 76 M28 48 L58 78" stroke="#d49a77" stroke-width="11" stroke-linecap="round"/>
      <text x="0" y="123" text-anchor="middle" fill="#fff" font-size="15">dev #1</text>
      <text x="0" y="143" text-anchor="middle" fill="#ffec74" font-size="12">coffee: 0%</text>
    </g>
    <g transform="translate(205 375)">
      <circle cx="0" cy="0" r="25" fill="#8f604e"/><path d="M-25-2 Q0-33 25-2" fill="#e4d8c1"/>
      <rect x="-28" y="26" width="56" height="76" rx="15" fill="#d55a74"/>
      <path d="M-25 50 L-58 72 M25 50 L58 65" stroke="#8f604e" stroke-width="11" stroke-linecap="round"/>
      <text x="0" y="125" text-anchor="middle" fill="#fff" font-size="15">dev #27</text>
      <text x="0" y="145" text-anchor="middle" fill="#ffec74" font-size="12">still compiling...</text>
    </g>
    <g transform="translate(330 355)">
      <circle cx="0" cy="0" r="25" fill="#d7a47e"/><path d="M-25 0 Q0-39 25 0" fill="#20253d"/>
      <rect x="-28" y="26" width="56" height="78" rx="15" fill="#58b58a"/>
      <path d="M-25 50 L-60 80 M25 50 L60 74" stroke="#d7a47e" stroke-width="11" stroke-linecap="round"/>
      <text x="0" y="127" text-anchor="middle" fill="#fff" font-size="15">dev #99</text>
      <text x="0" y="147" text-anchor="middle" fill="#ffec74" font-size="12">retrying...</text>
    </g>
  </g>

  <!-- melting hamster servers -->
  <g transform="translate(90 160)">
    <rect x="0" y="0" width="180" height="92" rx="12" fill="#394967" stroke="#7df9ff" stroke-width="4"/>
    <rect x="18" y="18" width="144" height="18" rx="8" fill="#12182a"/>
    <circle cx="32" cy="27" r="5" fill="#ff4fd8"/><circle cx="48" cy="27" r="5" fill="#7df9ff"/>
    <rect x="18" y="52" width="144" height="18" rx="8" fill="#12182a"/>
    <path d="M20 92 Q36 110 52 92 T84 92 T116 92 T148 92 T176 92" fill="none" stroke="#ff7b4f" stroke-width="13" stroke-linecap="round"/>
    <circle cx="92" cy="18" r="16" fill="#d69359"/><circle cx="86" cy="16" r="3" fill="#111"/><circle cx="98" cy="16" r="3" fill="#111"/>
    <path d="M86 25 Q92 31 99 25" fill="none" stroke="#111" stroke-width="2"/>
    <text x="90" y="132" text-anchor="middle" font-family="Arial Black" font-size="14" fill="#ff7b4f">SERVER HAMSTERS</text>
    <text x="90" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">running on fumes</text>
  </g>

  <text x="400" y="548" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" fill="#fff">“Selected model is at capacity. Please try a different model.”</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7df9ff">Translation: the bouncer has one clipboard and infinite confidence.</text>
</svg>