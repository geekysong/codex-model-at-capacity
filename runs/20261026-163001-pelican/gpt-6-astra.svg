<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A smug pelican pedals a bicycle with an enormous beak full of fish, passing a sign for the carpool lane. Wheels spin and the pelican bobs in a looping animation.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#fff" stroke-width="1"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#fff8dc" stroke="#233642" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#e4b967" stroke-width="3"/>
