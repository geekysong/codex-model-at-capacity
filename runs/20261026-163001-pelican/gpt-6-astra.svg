      <path d="M-22 0H22" stroke="#233642" stroke-width="5"/>
      <path d="M-30 0H-14M14 0H30" stroke="#233642" stroke-width="7" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="-90" to="270" dur="2s" repeatCount="indefinite"/>
