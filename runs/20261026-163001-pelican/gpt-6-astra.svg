      <circle r="10" fill="#233642"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
  <rect x="16" y="16" width="768" height="568" rx="22" fill="none" stroke="#233642" stroke-width="4"/>
  <text x="400" y="66" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="900" fill="#233642">THE PELICAN EXPRESS</text>
  <text x="400" y="96" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" letter-spacing="3" fill="#a34a35">BIG BILL. ZERO GAS.</text>

