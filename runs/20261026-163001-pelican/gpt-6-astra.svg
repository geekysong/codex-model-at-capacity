  </g>
  <path d="M73 215Q73 201 88 201H211Q226 201 226 216V249Q226 263 211 263H172L183 281L150 263H88Q73 263 73 249Z" fill="#fffdf0" stroke="#233642" stroke-width="3"/>
  <text x="149" y="226" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#233642">
    <tspan x="149">“They’re all</tspan>
    <tspan x="149" dy="22">passengers.”</tspan>
  </text>

  <text x="400" y="516" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#233642">One pelican. Two wheels. Six very nervous commuters.</text>
  <path d="M58 537H742" stroke="#233642" stroke-width="2" opacity=".3"/>
  <text x="400" y="564" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#233642">2026-10-26 16:30:01 SGT (UTC+08:00)</text>
</svg>