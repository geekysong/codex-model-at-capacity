<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Express: Grounded by Budget Cuts</title>
  <desc id="desc">A helmeted pelican pedals a bicycle with spinning wheels, carrying a fish beneath a sign charging birds for airspace. Its enormous beak acts as the front luggage compartment.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="7" r="1" fill="#ded8bc" opacity=".35"/>
      <circle cx="17" cy="19" r=".7" fill="#ded8bc" opacity=".4"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff7dc"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M25 85H775" stroke="#203844" stroke-width="4"/>
  <text x="400" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#203844">PELICAN EXPRESS</text>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#a84d32">GROUNDED BY BUDGET CUTS</text>

  <!-- One seaside scene -->
  <path d="M0 362Q130 343 255 364T500 360T800 357V450H0Z" fill="#b9ded7"/>
  <path d="M0 391Q140 373 270 395T540 390T800 388V466H0Z" fill="#8fc7be"/>
  <path d="M35 380h61m522-8h51m45 31h51" stroke="#f7fff4" stroke-width="4" stroke-linecap="round"/>
  <path d="M0 447Q400 429 800 448V484H0Z" fill="#dfba80"/>
  <path d="M24 469H776" stroke="#a87d52" stroke-width="3" stroke-dasharray="22 16"/>
  <ellipse cx="386" cy="450" rx="242" ry="13" fill="#364b49" opacity=".15"/>

  <!-- Airspace toll sign -->
  <path d="M690 208V438" stroke="#584e42" stroke-width="9"/>
  <rect x="604" y="117" width="172" height="108" rx="9" fill="#fffdf0" stroke="#203844" stroke-width="4"/>
  <text x="690" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#203844">AIRSPACE TOLL</text>
  <text x="690" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" fill="#bd493b">$99</text>
  <text x="690" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#203844">PER FLAP</text>

  <!-- Bicycle wheels -->
  <g fill="#fff8e4" stroke="#203844">
    <circle cx="240" cy="375" r="72" stroke-width="11"/>
    <circle cx="543" cy="375" r="72" stroke-width="11"/>
  </g>
  <g transform="translate(240 375)">
    <g stroke="#718c90" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      <path d="M-24-60L24 60M-60 24L60-24" opacity=".65"/>
      <path d="M48-44L57-30" stroke="#ee9c34" stroke-width="7"/>
    </g>
  </g>
  <g transform="translate(543 375)">
    <g stroke="#718c90" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      <path d="M-24-60L24 60M-60 24L60-24" opacity=".65"/>
      <path d="M48-44L57-30" stroke="#ee9c34" stroke-width="7"/>
    </g>
  </g>

  <!-- Red frame and luggage rack -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 375L310 281L368 375Z M310 281L484 281L368 375 M484 281L543 375" stroke="#203844" stroke-width="13"/>
    <path d="M240 375L310 281L368 375Z M310 281L484 281L368 375 M484 281L543 375" stroke="#df5747" stroke-width="7"/>
    <path d="M484 281L474 243L502 225L521 229" stroke="#203844" stroke-width="9"/>
    <path d="M310 281L303 259M199 290H273M207 290L240 375" stroke="#203844" stroke-width="6"/>
    <path d="M368 375L240 375" stroke="#203844" stroke-width="4"/>
  </g>
  <rect x="278" y="250" width="58" height="13" rx="6" fill="#203844"/>

  <!-- Fish passenger -->
  <g stroke="#203844" stroke-width="3" stroke-linejoin="round">
    <path d="M185 286L176 251H265L256 286Z" fill="#c58a4c"/>
    <path d="M190 257L196 282M208 256L210 283M226 256V283M244 256L240 283" fill="none" stroke="#875b36" stroke-width="2"/>
    <path d="M197 248Q219 215 244 239L258 227L255 250L242 246Q220 263 197 248Z" fill="#74b7af"/>
    <circle cx="208" cy="241" r="3" fill="#203844" stroke="none"/>
    <path d="M219 237L227 246L220 252" fill="none"/>
  </g>

  <!-- Bobbing rider -->
  <g stroke="#203844" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <!-- Tail, body, long neck -->
    <path d="M291 232L265 209L303 215Q324 177 371 199Q390 206 400 231Q426 207 424 170L420 151Q414 128 435 121Q460 116 467 139Q477 181 462 218Q445 257 403 268Q326 290 291 232Z" fill="#fffdf0" stroke-width="4"/>
    <path d="M311 221Q346 193 386 226Q370 260 331 251" fill="#e2e7d7" stroke-width="3"/>
    <path d="M324 227Q348 225 369 234M326 239L353 245" fill="none" stroke="#9aa99f" stroke-width="2.5"/>
    <!-- Wing gripping the bars -->
    <path d="M376 223Q416 225 453 240L494 230" fill="none" stroke-width="13"/>
    <path d="M376 223Q416 225 453 240L494 230" fill="none" stroke="#fffdf0" stroke-width="8"/>
    <!-- Suspicious eye -->
    <ellipse cx="450" cy="144" rx="9" ry="11" fill="white" stroke-width="2"/>
    <circle cx="454" cy="146" r="3.5" fill="#203844" stroke="none"/>
    <path d="M440 130L460 136" fill="none" stroke-width="4"/>
    <!-- Giant beak and elastic pouch -->
    <path d="M464 151L594 166Q571 217 496 202Q473 190 464 151Z" fill="#f5b355" stroke-width="4"/>
    <path d="M465 151L601 163L590 174L469 169Z" fill="#f68d37" stroke-width="3"/>
    <path d="M490 180Q526 199 565 181" fill="none" stroke="#cb7b37" stroke-width="2"/>
    <!-- Tiny aerodynamic helmet -->
    <path d="M418 126Q421 97 447 100Q470 101 476 127Z" fill="#e34f42" stroke-width="4"/>
    <path d="M433 105L430 119M448 105V120M461 111L464 121" stroke="#fff3d3" stroke-width="4"/>
    <path d="M423 128L433 157L442 158" fill="none" stroke-width="2"/>
    <!-- Sweat -->
    <path d="M399 141Q384 152 396 158Q404 159 399 141Z" fill="#63b8d0" stroke-width="2"/>
    <path d="M386 121L377 113M390 136L377 133" stroke="#63b8d0" stroke-width="3"/>
  </g>

  <!-- Moving legs and crank -->
  <g fill="none" stroke="#203844" stroke-linecap="round" stroke-linejoin="round">
    <path d="M348 263L393 311L368 352" stroke-width="12">
      <animate attributeName="d" values="M348 263L393 311L368 352;M348 263L327 330L368 398;M348 263L393 311L368 352" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M348 263L393 311L368 352" stroke="#eeac43" stroke-width="7">
      <animate attributeName="d" values="M348 263L393 311L368 352;M348 263L327 330L368 398;M348 263L393 311L368 352" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="368" cy="375" r="15" fill="#fff7dc" stroke="#203844" stroke-width="4"/>
  <g transform="translate(368 375)">
    <g stroke="#203844" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M0-23V23"/>
      <path d="M-9-23H9M-9 23H9" stroke-width="7"/>
    </g>
  </g>
  <circle cx="240" cy="375" r="7" fill="#203844"/>
  <circle cx="543" cy="375" r="7" fill="#203844"/>

  <!-- Stationary speech keeps lettering readable -->
  <path d="M80 114H310Q326 114 326 130V174Q326 190 310 190H283L298 211L256 190H80Q64 190 64 174V130Q64 114 80 114Z" fill="white" stroke="#203844" stroke-width="3"/>
  <text x="195" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#203844">“Flying is free.*”</text>
  <text x="195" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#a84d32">*Terms have changed.</text>

  <text x="400" y="516" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#203844">This pelican has wings. The bicycle has fewer fees.</text>
  <path d="M35 539H765" stroke="#203844" stroke-width="2"/>
  <rect x="35" y="549" width="730" height="35" rx="6" fill="#203844"/>
  <text x="400" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#fff7dc">2026-10-26 16:31:56 SGT (UTC+08:00)</text>
</svg>