<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon of an overconfident pelican riding a bicycle, with spinning wheels and bobbing motion.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#8ee4ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#56616a"/>
      <stop offset=".5" stop-color="#3d464e"/>
      <stop offset="1" stop-color="#56616a"/>
    </linearGradient>
    <style>
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite; }
      .pelican { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: pedal 1.15s linear infinite; }
      .cloud { animation: drift 8s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pedal { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
      @keyframes drift { to { transform: translateX(35px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="705" cy="87" r="46" fill="#fff6a5"/>
  <g class="cloud" fill="#fff" opacity=".9">
    <circle cx="103" cy="108" r="22"/><circle cx="132" cy="96" r="29"/><circle cx="166" cy="111" r="20"/>
    <rect x="99" y="110" width="90" height="22" rx="11"/>
  </g>
  <g fill="#70c76a">
    <path d="M0 315 Q70 244 140 315 T280 315 T420 315 T560 315 T700 315 T840 315 V414 H0Z"/>
    <path d="M0 349 Q80 288 180 349 T360 349 T540 349 T720 349 T900 349 V426 H0Z" fill="#4da85c"/>
  </g>

  <path d="M0 388 Q200 355 400 386 T800 382 V510 H0Z" fill="url(#road)"/>
  <path d="M10 445 Q150 420 290 444 T570 443 T790 430" fill="none" stroke="#ffe66a" stroke-width="11" stroke-dasharray="48 34" stroke-linecap="round"/>
  <path d="M0 511 H800" stroke="#29343c" stroke-width="10"/>

  <text x="400" y="58" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="43" fill="#17334c" stroke="#fff" stroke-width="5" paint-order="stroke">
    PELICAN: PEDAL TO THE BEAK
  </text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#244557">
    “No hands? Please. I have wings and a five-year infrastructure plan.”
  </text>

  <!-- bicycle -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g class="wheel" fill="none" stroke="#202a31">
      <circle cx="286" cy="415" r="75" stroke-width="12"/>
      <circle cx="286" cy="415" r="9" fill="#f4f6f7" stroke-width="5"/>
      <path d="M286 340V490M211 415H361M233 362l106 106M339 362L233 468" stroke="#b8c4cb" stroke-width="3"/>
    </g>
    <g class="wheel" fill="none" stroke="#202a31">
      <circle cx="540" cy="415" r="75" stroke-width="12"/>
      <circle cx="540" cy="415" r="9" fill="#f4f6f7" stroke-width="5"/>
      <path d="M540 340V490M465 415H615M487 362l106 106M593 362L487 468" stroke="#b8c4cb" stroke-width="3"/>
    </g>
    <g fill="none" stroke="#ef4f45" stroke-width="10">
      <path d="M286 415 L355 302 L435 415 Z"/>
      <path d="M355 302 L490 298 L540 415 L435 415"/>
      <path d="M355 302 L337 279"/>
      <path d="M490 298 L512 253 L548 253"/>
    </g>
    <path d="M318 277 H360" stroke="#253139" stroke-width="13"/>
    <path d="M510 252 H570" stroke="#253139" stroke-width="11"/>
    <circle cx="435" cy="415" r="20" fill="#ffd34e" stroke="#253139" stroke-width="6"/>
    <g class="pedal" fill="none" stroke="#253139" stroke-width="7">
      <path d="M435 415 L470 450 M435 415 L400 380"/>
      <path d="M458 450 H483 M387 380 H412" stroke-width="10"/>
    </g>
  </g>

  <!-- pelican -->
  <g class="pelican" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail and body -->
    <path d="M347 310 Q292 326 272 274 Q316 274 351 250Z" fill="#f7f7ed" stroke="#263946" stroke-width="5"/>
    <ellipse cx="411" cy="267" rx="91" ry="79" fill="#f8f5e8" stroke="#263946" stroke-width="6"/>
    <path d="M370 245 Q402 226 439 252 Q422 293 371 288Z" fill="#d9e6e5" stroke="#263946" stroke-width="4"/>
    <!-- wing steering -->
    <path d="M423 277 Q486 281 526 253 Q548 240 565 256 Q520 308 439 325Z" fill="#eef2e8" stroke="#263946" stroke-width="6"/>
    <path d="M507 270 Q530 257 548 253" fill="none" stroke="#263946" stroke-width="4"/>
    <!-- neck/head -->
    <path d="M387 224 Q365 168 398 129 Q434 91 477 128 Q500 148 486 194 L469 247Z" fill="#faf8ec" stroke="#263946" stroke-width="6"/>
    <!-- big beak -->
    <path d="M424 149 Q487 127 555 153 Q570 161 551 178 Q492 207 414 195 Q395 191 402 174Z" fill="#ffb84c" stroke="#263946" stroke-width="6"/>
    <path d="M412 195 Q489 210 543 180 Q531 233 466 239 Q424 236 412 195Z" fill="#f28a4b" stroke="#263946" stroke-width="5"/>
    <path d="M431 199 Q472 218 515 194" fill="none" stroke="#b94939" stroke-width="4"/>
    <!-- smug eye -->
    <path d="M431 145 Q452 130 471 145" fill="none" stroke="#263946" stroke-width="6"/>
    <circle cx="453" cy="153" r="9" fill="#fff"/>
    <circle cx="456" cy="155" r="4" fill="#20252b"/>
    <path d="M469 165 Q480 170 487 163" fill="none" stroke="#263946" stroke-width="4"/>
    <!-- ridiculous helmet -->
    <path d="M388 133 Q407 80 461 95 Q489 101 499 129 Q443 115 388 145Z" fill="#ef4f45" stroke="#263946" stroke-width="6"/>
    <path d="M407 112 Q441 91 477 116" fill="none" stroke="#ffd45b" stroke-width="7"/>
    <!-- legs -->
    <path d="M380 324 L405 381 L430 406" fill="none" stroke="#f4a75a" stroke-width="13"/>
    <path d="M442 330 L429 383 L401 380" fill="none" stroke="#f4a75a" stroke-width="13"/>
    <path d="M422 406 H451" stroke="#f4a75a" stroke-width="14"/>
    <path d="M385 380 H412" stroke="#f4a75a" stroke-width="14"/>
  </g>

  <g transform="translate(590 250)">
    <path d="M0 48 Q50 7 98 38 L87 86 Q40 109 0 48Z" fill="#fffbea" stroke="#263946" stroke-width="5"/>
    <text x="49" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#263946">TOOT!</text>
    <path d="M8 86 L-5 102 M75 88 L88 104" stroke="#263946" stroke-width="5"/>
  </g>

  <rect y="528" width="800" height="72" fill="#17334c"/>
  <text x="400" y="554" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff8d6">
    A bird with a bill, a bike, and absolutely no brakes on confidence.
  </text>
  <text x="400" y="582" text-anchor="middle" font-family="monospace" font-size="15" fill="#9ee9ff">
    2026-10-26 16:33:46 SGT (UTC+08:00)
  </text>
</svg>