<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c62828"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #222; font-size: 18px; }
      .small { font-family: Arial, sans-serif; fill: #333; font-size: 16px; }
      .strong { font-family: Arial, sans-serif; fill: #176b3a; font-size: 26px; font-weight: bold; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>

  <!-- Seesaw beam -->
  <rect x="100" y="178" width="400" height="24" rx="8" fill="#c98b48" stroke="#70451f" stroke-width="3"/>
  <line x1="300" y1="170" x2="300" y2="210" stroke="#70451f" stroke-width="3"/>

  <!-- Pivot -->
  <path d="M270 285 L300 210 L330 285 Z" fill="#607d8b" stroke="#37474f" stroke-width="3"/>
  <line x1="250" y1="285" x2="350" y2="285" stroke="#37474f" stroke-width="6"/>
  <text x="300" y="315" text-anchor="middle" class="label">pivot</text>

  <!-- Left hanging mass -->
  <line x1="140" y1="202" x2="140" y2="255" stroke="#333" stroke-width="3"/>
  <rect x="112" y="255" width="56" height="48" rx="5" fill="#4f81bd" stroke="#244a73" stroke-width="3"/>
  <text x="140" y="285" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="bold">6 kg</text>

  <!-- Right hanging mass -->
  <line x1="460" y1="202" x2="460" y2="255" stroke="#333" stroke-width="3"/>
  <rect x="432" y="255" width="56" height="48" rx="5" fill="#e28b3c" stroke="#8a4d17" stroke-width="3"/>
  <text x="460" y="285" text-anchor="middle" fill="#fff" font-family="Arial" font-size="18" font-weight="bold">4 kg</text>

  <!-- Force arrows -->
  <line x1="140" y1="235" x2="140" y2="320" stroke="#c62828" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="140" y="345" text-anchor="middle" class="small" fill="#c62828">F = 6g</text>

  <line x1="460" y1="235" x2="460" y2="320" stroke="#c62828" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="460" y="345" text-anchor="middle" class="small" fill="#c62828">F = 4g</text>

  <!-- Distance dimensions -->
  <line x1="140" y1="145" x2="300" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="137" x2="140" y2="153" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="137" x2="300" y2="153" stroke="#333" stroke-width="2"/>
  <text x="220" y="133" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="110" x2="460" y2="110" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="102" x2="300" y2="118" stroke="#333" stroke-width="2"/>
  <line x1="460" y1="102" x2="460" y2="118" stroke="#333" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Torque equation and status -->
  <text x="300" y=" forty" text-anchor="middle" class="strong">balanced</text>
  <text x="300" y=" seventy" text-anchor="middle" class="label">6 × 2 = 4 × 3</text>
</svg>