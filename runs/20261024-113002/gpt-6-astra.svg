<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Level seesaw in static equilibrium: six kilogram mass two meters left of pivot and four kilogram mass three meters right, balanced.">
  <rect width="600" height="400" fill="white"/>
  <style>
    .label { font-family: Arial, sans-serif; fill: #1f2937; font-size: 18px; }
    .small { font-size: 16px; }
    .eq { font-family: Arial, sans-serif; fill: #111827; font-size: 24px; font-weight: bold; }
    .bold { font-weight: bold; }
  </style>

  <!-- level seesaw -->
  <line x1="90" y1="205" x2="510" y2="205" stroke="#7c4a21" stroke-width="16" stroke-linecap="round"/>
  <line x1="90" y1="198" x2="510" y2="198" stroke="#c0844a" stroke-width="3" stroke-linecap="round"/>

  <!-- pivot -->
  <polygon points="300,218 265,285 335,285" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <circle cx="300" cy="205" r="8" fill="#334155"/>
  <text x="300" y="312" text-anchor="middle" class="label bold">pivot</text>

  <!-- left mass -->
  <line x1="150" y1="205" x2="150" y2="260" stroke="#374151" stroke-width="3"/>
  <rect x="115" y="260" width="70" height="55" rx="5" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
  <text x="150" y="294" text-anchor="middle" class="label bold" fill="white">6 kg</text>

  <!-- right mass -->
  <line x1="450" y1="205" x2="450" y2="260" stroke="#374151" stroke-width="3"/>
  <rect x="415" y="260" width="70" height="55" rx="5" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  <text x="450" y="294" text-anchor="middle" class="label bold" fill="white">4 kg</text>

  <!-- force arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <line x1="150" y1="245" x2="150" y2="215" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="245" x2="450" y2="215" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="150" y="235" text-anchor="end" dx="-10" class="label small" fill="#dc2626">weight</text>
  <text x="450" y="235" text-anchor="start" dx="10" class="label small" fill="#dc2626">weight</text>

  <!-- distance dimensions -->
  <line x1="150" y1="165" x2="300" y2="165" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="158" x2="150" y2="172" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="158" x2="300" y2="172" stroke="#475569" stroke-width="2"/>
  <text x="225" y="153" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="165" x2="450" y2="165" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="158" x2="450" y2="172" stroke="#475569" stroke-width="2"/>
  <text x="375" y="153" text-anchor="middle" class="label">x = 3 m</text>

  <!-- equilibrium text -->
  <text x="300" y=" fifty" text-anchor="middle" class="eq" transform="translate(0,0)">balanced</text>
  <text x="300" y="355" text-anchor="middle" class="eq">6 × 2 = 4 × 3</text>
</svg>