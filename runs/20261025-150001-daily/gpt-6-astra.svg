<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172b3a" font-size="14">
    <text x="50" y="30" font-size="20" font-weight="bold">Projectile motion</text>
    <text x="50" y="57">Initial velocity: horizontal 20 m/s; vertical 15 m/s</text>
    <text x="50" y="81">Gravity: 10 m/s² · No air resistance</text>
    <text x="50" y="105">Total flight time: 3 s</text>
    <text x="50" y="137">Scale: 10 px/m; downward-positive canvas y</text>
    <text x="50" y="159" font-size="12">Axis break omits distances 33–55 m so the landing fits.</text>
    <text x="50" y="177" font-size="12">Coordinates below are horizontal distance and height from launch.</text>
  </g>

  <!-- Physical mapping before the break: x=100+200t, y=350-150t+50t².
       After the break, subtract 200 px from x. -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#586774" stroke-width="2"/>
  <g fill="none" stroke="#1479b8" stroke-width="3">
    <path d="M100 350 Q250 125 400 237.5 Q415 237.5 430 238.625"/>
    <path d="M450 315.625 Q475 331.25 500 350"/>
  </g>

  <g stroke="#586774" stroke-width="2" fill="none">
    <path d="M432 344 L438 356 M442 344 L448 356"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#586774">
    <text x="438" y="266">trajectory</text>
    <text x="438" y="283">continues below</text>
  </g>

  <g fill="#1479b8">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172b3a">
    <text x="55" y="308">launch: 0 m, 0 m</text>
    <text x="327" y="216">apex: 30 m, 11.25 m</text>
    <text x="399" y="304">landing: 60 m, 0 m</text>
  </g>

  <rect x="0" y="368" width="600" height="32" fill="#eef3f7"/>
  <text x="300" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172b3a">2026-10-25 15:03:50 SGT (UTC+08:00)</text>
</svg>