<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while carrying an absurdly large fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f5"/>
      <stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#292929"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#123" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#17212b; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#17212b; }
      .wheel { fill:none; stroke:#17212b; stroke-width:8; }
      .spoke { stroke:#7f9aaa; stroke-width:3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4a8" opacity=".9"/>
  <path d="M0 290 Q140 225 280 285 T560 275 T800 285 V390 H0Z" fill="#9bcf86"/>
  <path d="M0 345 Q150 305 300 345 T600 340 T800 350 V420 H0Z" fill="#6eae70"/>
  <path d="M0 408 Q180 385 360 410 T800 405 V600 H0Z" fill="url(#road)"/>
  <path d="M0 475 Q180 452 360 476 T800 470" fill="none" stroke="#e7d98a" stroke-width="8" stroke-dasharray="34 24"/>

  <g transform="translate(400 80)" filter="url(#shadow)">
    <rect x="-285" y="-58" width="570" height="75" rx="20" fill="#fff8df" class="ink"/>
    <text x="0" y="-10" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN PEDAL PANIC</text>
    <text x="0" y="13" text-anchor="middle" class="label" font-size="16" font-weight="700">When the beak is bigger than the bicycle budget.</text>
  </g>

  <g id="bicycle" transform="translate(0 5)">
    <g id="rearWheel">
      <circle cx="225" cy="430" r="78" class="wheel" fill="#cde8ef"/>
      <g>
        <line x1="225" y1="352" x2="225" y2="508" class="spoke"/>
        <line x1="147" y1="430" x2="303" y2="430" class="spoke"/>
        <line x1="170" y1="375" x2="280" y2="485" class="spoke"/>
        <line x1="280" y1="375" x2="170" y2="485" class="spoke"/>
      </g>
    </g>
    <g id="frontWheel">
      <circle cx="570" cy="430" r="78" class="wheel" fill="#cde8ef"/>
      <g>
        <line x1="570" y1="352" x2="570" y2="508" class="spoke"/>
        <line x1="492" y1="430" x2="648" y2="430" class="spoke"/>
        <line x1="515" y1="375" x2="625" y2="485" class="spoke"/>
        <line x1="625" y1="375" x2="515" y2="485" class="spoke"/>
      </g>
    </g>
    <path d="M225 430 L335 325 L455 430 L225 430 M335 325 L390 430 L455 430 M455 430 L570 430 L535 320" fill="none" class="ink" stroke="#dc4b3e"/>
    <path d="M520 320 L555 305" fill="none" class="ink"/>
    <circle cx="390" cy="430" r="15" fill="#f2c14e" class="ink"/>
    <path d="M390 430 L350 405 M390 430 L430 452" fill="none" class="ink"/>
    <path d="M330 322 L315 290" fill="none" class="ink"/>
    <path d="M300 285 L335 285" fill="none" class="ink"/>
    <animateTransform attributeName="transform" type="translate" values="0 5;0 0;0 5" dur="1.2s" repeatCount="indefinite"/>
  </g>

  <g id="spinningWheels">
    <animateTransform attributeName="transform" type="rotate" from="0 225 430" to="360 225 430" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <g id="pelican" transform="translate(0 0)" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="392" cy="280" rx="67" ry="82" fill="#f5f0df" class="ink"/>
    <path d="M350 270 Q315 330 345 370 Q385 392 417 350 L420 295Z" fill="#d8e0e2" class="ink"/>
    <path d="M412 283 Q475 245 535 275 Q563 290 535 303 Q475 321 414 310Z" fill="#f39a43" class="ink"/>
    <path d="M531 276 Q565 267 584 278 Q560 292 535 302" fill="#ed713d" class="ink"/>
    <circle cx="425" cy="237" r="10" fill="#17212b"/>
    <circle cx="428" cy="234" r="3" fill="#fff"/>
    <path d="M367 220 Q400 185 438 211" fill="none" class="ink"/>
    <path d="M372 348 Q335 385 315 412 M415 349 Q450 382 475 410" fill="none" class="ink"/>
    <path d="M315 412 Q299 423 286 414 M475 410 Q490 423 505 414" fill="none" class="ink"/>
    <path d="M355 250 Q375 266 397 255" fill="none" stroke="#17212b" stroke-width="5"/>
    <path d="M355 245 Q338 235 330 250" fill="none" stroke="#17212b" stroke-width="5"/>
    <path d="M472 270 Q525 225 570 238 Q590 244 580 260 L528 287Z" fill="#73b8d8" class="ink"/>
    <path d="M535 241 Q550 215 574 228" fill="none" class="ink"/>
    <text x="392" y="170" text-anchor="middle" class="label" font-size="20" font-weight="bold">“I demand feathers-only lanes!”</text>
  </g>

  <g transform="translate(640 365) rotate(-8)">
    <path d="M0 0 Q45 -25 86 0 Q45 25 0 0Z" fill="#ef6b53" class="ink"/>
    <circle cx="67" cy="-5" r="4" fill="#17212b"/>
    <path d="M5 0 L-22 -10 L-22 10Z" fill="#f4a941" class="ink"/>
    <text x="43" y="52" text-anchor="middle" class="label" font-size="14" font-weight="bold">EMERGENCY SNACK</text>
  </g>

  <g transform="translate(400 560)">
    <rect x="-360" y="-22" width="720" height="40" rx="12" fill="#fff8df" class="ink"/>
    <text x="0" y="5" text-anchor="middle" class="label" font-size="18" font-weight="700">2026-10-28 11:00:02 SGT (UTC+08:00)</text>
  </g>
</svg>