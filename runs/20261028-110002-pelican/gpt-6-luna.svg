<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican pedals an impossibly tiny bicycle while carrying a fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b66"/>
      <stop offset="1" stop-color="#242933"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17202a}
      .small{font-size:18px}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="55" fill="#fff5ad" opacity=".9"/>
  <path d="M0 390 Q145 325 285 390 T570 385 T800 380 L800 600 L0 600Z" fill="#8bd17c"/>
  <path d="M0 450 Q190 405 370 450 T800 442 L800 600 L0 600Z" fill="url(#road)"/>

  <g opacity=".25" fill="#fff">
    <path d="M82 125 q35-28 70 0 q-35 18-70 0Z"/>
    <path d="M505 155 q30-24 60 0 q-30 16-60 0Z"/>
  </g>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#fff" stroke="#17202a" stroke-width="2">THE GREAT PELICYCLE</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="20" font-weight="700">“Because walking is for birds with better judgment.”</text>

  <g filter="url(#shadow)">
    <!-- bicycle -->
    <g id="bike">
      <g class="wheel" transform="translate(250 455)">
        <circle r="72" fill="none" stroke="#17202a" stroke-width="10"/>
        <circle r="8" fill="#f4d35e" stroke="#17202a" stroke-width="4"/>
        <g stroke="#17202a" stroke-width="3">
          <path d="M0-65V65M-65 0H65M-46-46L46 46M46-46L-46 46"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      </g>
      <g class="wheel" transform="translate(555 455)">
        <circle r="72" fill="none" stroke="#17202a" stroke-width="10"/>
        <circle r="8" fill="#f4d35e" stroke="#17202a" stroke-width="4"/>
        <g stroke="#17202a" stroke-width="3">
          <path d="M0-65V65M-65 0H65M-46-46L46 46M46-46L-46 46"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
      </g>

      <path d="M250 455 L350 350 L555 455 L430 455 L350 350 L250 455 M350 350 L382 275 L430 455" fill="none" class="ink" stroke="#e84a5f" stroke-width="13"/>
      <path d="M382 275 l-18-18 M382 275 l23-4" class="ink" fill="none"/>
      <path d="M430 455 l35 35 M430 455 l-35 35" class="ink" fill="none"/>
      <circle cx="430" cy="455" r="17" fill="#f4d35e" class="ink"/>
      <path d="M408 455 h44 M430 433 v44" class="ink"/>

      <!-- pedaling legs -->
      <g>
        <path d="M377 354 Q420 385 430 455" fill="none" class="ink" stroke="#f5b642" stroke-width="18"/>
        <path d="M377 354 Q345 400 395 455" fill="none" class="ink" stroke="#f5b642" stroke-width="18"/>
        <ellipse cx="442" cy="472" rx="27" ry="9" fill="#e84a5f" class="ink"/>
        <ellipse cx="389" cy="472" rx="27" ry="9" fill="#e84a5f" class="ink"/>
        <animateTransform attributeName="transform" type="rotate" values="-8 400 400;8 400 400;-8 400 400" dur="1s" repeatCount="indefinite"/>
      </g>

      <!-- pelican body -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1s" repeatCount="indefinite"/>
        <ellipse cx="365" cy="285" rx="91" ry="108" fill="#f7f4e8" class="ink"/>
        <path d="M312 250 Q255 270 288 330 Q330 344 365 313 Q342 283 312 250Z" fill="#d9e2e5" class="ink"/>
        <ellipse cx="371" cy="165" rx="64" ry="66" fill="#fffdf4" class="ink"/>
        <path d="M416 178 Q508 176 585 216 Q509 267 414 215 Q391 201 416 178Z" fill="#f19a4a" class="ink"/>
        <path d="M418 188 Q502 207 566 218 Q500 234 422 211Z" fill="#e8743b"/>
        <circle cx="394" cy="153" r="10" fill="#17202a"/>
        <circle cx="397" cy="150" r="3" fill="#fff"/>
        <path d="M341 105 Q365 78 390 104" fill="none" class="ink"/>
        <path d="M340 215 Q365 230 391 215" fill="none" class="ink"/>
        <path d="M344 198 Q360 207 377 198" fill="none" stroke="#17202a" stroke-width="4"/>
        <!-- wing and fish -->
        <path d="M320 270 Q270 300 309 365 Q350 349 359 300Z" fill="#cbd8dc" class="ink"/>
        <path d="M286 343 Q256 328 237 350 Q259 371 293 363Z" fill="#62b7d1" class="ink"/>
        <path d="M238 350 l-18-12 l5 19 l-8 14 l22-7" fill="#4e9fb9" class="ink"/>
        <circle cx="275" cy="347" r="3" fill="#17202a"/>
        <path d="M309 365 Q285 392 320 405" fill="none" class="ink" stroke="#f5b642" stroke-width="13"/>
        <path d="M320 405 l-12 14 M320 405 l15 10" class="ink" fill="none"/>
        <path d="M416 249 Q438 263 455 286" fill="none" class="ink" stroke="#f5b642" stroke-width="15"/>
        <path d="M455 286 l24-10 M455 286 l22 12" class="ink" fill="none"/>
      </g>
    </g>
  </g>

  <path d="M615 322 q35-26 68 0" fill="none" class="ink"/>
  <text x="650" y="310" text-anchor="middle" class="label small" font-weight="700">HONK!</text>
  <text x="400" y="535" text-anchor="middle" class="label" font-size="22" font-weight="700">A beak-built commuter conquers traffic, dignity, and basic physics.</text>
  <text x="400" y="578" text-anchor="middle" class="label" font-size="16">2026-10-28 11:01:33 SGT (UTC+08:00)</text>
</svg>