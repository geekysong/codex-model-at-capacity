<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican rides a tiny bicycle with spinning wheels and bobbing pedals, carrying fish in its enormous bill beneath a sign for the Tour de Beak.</desc>
  <defs>
    <pattern id="road" width="100" height="10" patternUnits="userSpaceOnUse">
      <path d="M15 5h40" stroke="#fff1cf" stroke-width="5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff4d8"/>
  <circle cx="690" cy="169" r="52" fill="#ffd66c"/>
  <path d="M0 338Q140 267 270 329T540 315T800 324V475H0Z" fill="#b7d9bf"/>
  <path d="M0 387Q155 335 312 391T615 366T800 389V478H0Z" fill="#82b7a4"/>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="3" fill="#193b42">TOUR DE BEAK</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#57706b">ZERO EMISSIONS. QUESTIONABLE AERODYNAMICS.</text>

  <g stroke="#193b42" stroke-width="4" stroke-linejoin="round">
    <path d="M692 290v171" fill="none"/>
    <path d="M631 273h119l20 24-20 24H631Z" fill="#fff4d8"/>
  </g>
  <text x="693" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#193b42">FISH MARKET</text>
  <text x="693" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#193b42">ONE MORE HILL</text>

  <path d="M0 465H800V512H0Z" fill="#47616a"/>
  <rect y="490" width="800" height="10" fill="url(#road)"/>
  <ellipse cx="377" cy="465" rx="227" ry="12" fill="#193b42" opacity=".16"/>

  <g fill="none" stroke="#193b42" stroke-linecap="round">
    <path d="M114 276h72m-94 23h75m-47 24h43" stroke-width="5"/>
    <path d="M588 221q15-15 27 0q13-15 26 0M58 197q12-12 23 0q12-12 24 0" stroke-width="3"/>
  </g>

