      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-21 0H21" stroke="#193b42" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-21" r="6" fill="#f4ad4e" stroke="#193b42" stroke-width="3"/>
      <circle cx="21" r="6" fill="#f4ad4e" stroke="#193b42" stroke-width="3"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 9;0 0;0 -9;0 0" dur="1.4s" repeatCount="indefinite"/>
    <path d="M350 281l-8 48 49 54" fill="none" stroke="#193b42" stroke-width="14" stroke-linecap="round"/>
    <path d="M350 281l-8 48 49 54" fill="none" stroke="#f4ad4e" stroke-width="8" stroke-linecap="round"/>
    <path d="M384 376l-8 17 43 1-15-12Z" fill="#f4ad4e" stroke="#193b42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M377 399h43" stroke="#193b42" stroke-width="5" stroke-linecap="round"/>
