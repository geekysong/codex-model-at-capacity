  <rect y="512" width="800" height="88" fill="#fff4d8"/>
  <text x="400" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#193b42">He bought a bicycle to reduce his enormous bill.</text>
  <path d="M80 560H720" stroke="#c3c7b5"/>
  <text x="400" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#405a5d">2026-10-30 08:00:01 SGT (UTC+08:00)</text>
