    <circle r="60" fill="#d7e8dc" stroke="#fff4d8" stroke-width="3"/>
    <g stroke="#577b7d" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-59 0H59M0-59V59M-42-42L42 42M-42 42L42-42"/>
      <path d="M0-60A60 60 0 0 1 42-42" fill="none" stroke="#ef8158" stroke-width="6"/>
    </g>
    <circle r="8" fill="#193b42"/>
  </g>

