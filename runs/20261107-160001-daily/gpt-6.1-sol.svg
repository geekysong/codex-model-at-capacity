    <path d="M178 67V61" fill="none"/>
    <circle cx="178" cy="59" r="2" fill="#253449"/>
    <circle cx="183" cy="75" r="2" fill="#253449" stroke="none"/>
    <path d="M192 74L201 80L192 86Z" fill="#253449"/>
    <path d="M170 87H184" fill="none"/>
  </g>

  <!-- Final cell -->
  <circle cx="360" cy="200" r="12" fill="#15803d" stroke="white" stroke-width="2"/>

  <!-- Labels outside the grid -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#172033">
    <text x="465" y="184" font-weight="bold">Final cell</text>
    <text x="465" y="207">Row 3, Col 4</text>
    <text x="465" y="234">Facing: Right</text>
  </g>

  <!-- Dedicated footer -->
  <text x="300" y="384" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-11-07 16:04:03 SGT (UTC+08:00)</text>
