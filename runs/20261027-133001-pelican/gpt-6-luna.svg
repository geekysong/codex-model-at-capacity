<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Against All Odds</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an enormous fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ddcff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#657080"/>
      <stop offset="1" stop-color="#303846"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#173044" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#172333; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#172333; }
      .wheelSpin { transform-box:fill-box; transform-origin:center; animation:spin 1.8s linear infinite; }
      .pelicanBob { animation:bob .9s ease-in-out infinite; transform-origin:430px 270px; }
      .pedalMove { animation:pedal .9s ease-in-out infinite; transform-origin:355px 440px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
      @keyframes pedal { 0%,100% { transform:rotate(0deg); } 50% { transform:rotate(28deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="52" fill="#ffe27a" opacity=".9"/>
  <path d="M0 365 Q125 310 250 360 T500 350 T800 345 V455 H0Z" fill="#9bd38b"/>
  <path d="M0 425 Q180 390 360 420 T800 410 V600 H0Z" fill="url(#road)"/>
  <path d="M0 515 Q150 500 300 518 T600 515 T800 520" fill="none" stroke="#f5d76e" stroke-width="8" stroke-dasharray="34 28"/>

  <g class="label" font-weight="900" text-anchor="middle">
    <text x="400" y="62" font-size="34" fill="#fff" stroke="#172333" stroke-width="8" paint-order="stroke">PELICAN PEDALS AGAINST ALL ODDS</text>
    <text x="400" y="98" font-size="18" fill="#172333">“If the beak fits, the bike ships.”</text>
  </g>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <g class="wheelSpin ink" fill="#273342">
      <circle cx="205" cy="440" r="73" fill="#1e2935"/>
      <circle cx="205" cy="440" r="58" fill="#9aa8b6" stroke-width="5"/>
      <circle cx="205" cy="440" r="9" fill="#263443" stroke="none"/>
      <path d="M205 382V498 M147 440H263 M164 399L246 481 M246 399L164 481" fill="none" stroke="#e9f1f5" stroke-width="4"/>
    </g>
    <g class="wheelSpin ink" fill="#273342">
      <circle cx="520" cy="440" r="73" fill="#1e2935"/>
      <circle cx="520" cy="440" r="58" fill="#9aa8b6" stroke-width="5"/>
      <circle cx="520" cy="440" r="9" fill="#263443" stroke="none"/>
      <path d="M520 382V498 M462 440H578 M479 399L561 481 M561 399L479 481" fill="none" stroke="#e9f1f5" stroke-width="4"/>
    </g>
    <path d="M205 440 L330 330 L430 440 L205 440 L520 440 L430 440 L475 320" fill="none" class="ink" stroke="#e85d4a" stroke-width="12"/>
    <path d="M330 330 L475 320" fill="none" class="ink" stroke="#e85d4a" stroke-width="10"/>
    <path d="M475 320 L500 292" fill="none" class="ink" stroke="#172333" stroke-width="7"/>
    <path d="M492 292 Q515 282 535 292" fill="none" class="ink" stroke-width="7"/>
    <path d="M330 330 L300 286" fill="none" class="ink" stroke-width="8"/>
    <path d="M282 286 Q300 276 318 286" fill="none" class="ink" stroke-width="7"/>
    <circle cx="430" cy="440" r="18" fill="#f3b33d" class="ink"/>
    <g class="pedalMove">
      <path d="M430 440 L390 470 M430 440 L469 410" fill="none" class="ink" stroke-width="6"/>
      <path d="M375 474h30 M462 405h30" fill="none" class="ink" stroke-width="8"/>
    </g>
  </g>

  <!-- pelican -->
  <g class="pelicanBob" filter="url(#shadow)">
    <path d="M390 305 Q402 220 482 218 Q548 216 565 272 Q578 318 528 342 Q470 369 413 338Z" fill="#f7f4e8" class="ink"/>
    <path d="M432 232 Q427 176 465 145 Q505 113 548 139 Q573 155 567 190 Q562 226 522 245Z" fill="#f7f4e8" class="ink"/>
    <path d="M471 149 Q510 121 548 145 Q560 154 564 171 Q523 163 492 188Z" fill="#dbe8ed" stroke="#172333" stroke-width="5"/>
    <circle cx="525" cy="174" r="9" fill="#172333"/>
    <circle cx="528" cy="171" r="3" fill="#fff"/>
    <path d="M548 190 Q613 181 674 213 Q690 222 677 238 Q604 258 530 237Z" fill="#f3aa55" class="ink"/>
    <path d="M671 221 Q699 231 690 247 Q681 257 664 243" fill="#e28a46" class="ink"/>
    <path d="M557 216 Q605 231 657 229" fill="none" stroke="#b65c36" stroke-width="4"/>
    <path d="M435 255 Q392 238 360 269 Q391 290 438 292" fill="#d9e6ec" class="ink"/>
    <path d="M430 310 Q477 335 529 310" fill="none" class="ink" stroke-width="5"/>
    <path d="M455 338 L446 410 M515 340 L531 410" fill="none" class="ink" stroke-width="9"/>
    <path d="M432 409 Q450 400 464 411 M519 409 Q536 400 550 411" fill="none" class="ink" stroke-width="8"/>
    <path d="M495 200 Q520 208 540 202" fill="none" stroke="#172333" stroke-width="4"/>
    <!-- ridiculous fish cargo -->
    <path d="M392 251 Q344 213 300 238 Q270 256 300 279 Q345 305 397 276Z" fill="#78c6d9" class="ink"/>
    <path d="M301 239 L272 216 L277 259Z" fill="#f3aa55" class="ink"/>
    <circle cx="324" cy="250" r="5" fill="#172333"/>
    <path d="M350 237 Q371 255 350 275" fill="none" stroke="#327c9a" stroke-width="5"/>
  </g>

  <g class="label">
    <path d="M92 188 Q145 135 222 177" fill="none" stroke="#172333" stroke-width="4"/>
    <path d="M222 177 l-18 -2 l8 16" fill="#172333"/>
    <text x="92" y="143" font-size="20" font-weight="800">NO LICENSE.</text>
    <text x="92" y="166" font-size="20" font-weight="800">NO PROBLEM.</text>
  </g>

  <rect x="35" y="548" width="730" height="35" rx="10" fill="#fff6d5" stroke="#172333" stroke-width="3"/>
  <text x="400" y="572" text-anchor="middle" class="label" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">2026-10-27 13:31:32 SGT (UTC+08:00)</text>
</svg>