<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN IN THE BIKE LANE</title>
  <desc id="desc">A cheerful pelican pedals a bicycle while a fish peeks out of its enormous beak pouch.</desc>
  <defs>
    <style>
      .ink { stroke:#24313b; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#24313b; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .rider { animation:bob 1.1s ease-in-out infinite alternate; }
      .pedals { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedals { animation-duration:8s; } }
    </style>
  </defs>

