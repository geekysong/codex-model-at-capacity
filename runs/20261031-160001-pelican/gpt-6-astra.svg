<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a bicycle with a fish-filled bill pouch. Both wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <style>
      .ink{stroke:#203243;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .spoke{stroke:#64818a;stroke-width:3}
      .type{font-family:Arial,Helvetica,sans-serif;fill:#203243;text-anchor:middle}
    </style>
    <pattern id="road" width="100" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 6h38" stroke="#c2af8b" stroke-width="4" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <text class="type" x="400" y="61" font-size="46" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text class="type" x="400" y="90" font-size="16" letter-spacing="2">THE ONLY RIDER WITH A BUILT-IN GROCERY BAG</text>

  <rect x="30" y="108" width="740" height="391" rx="24" fill="#d9eee9"/>
  <circle cx="681" cy="174" r="39" fill="#ffcc69"/>
  <path d="M50 376Q130 330 210 373T390 372T580 370T750 365V474H50Z" fill="#b4d8c5"/>
  <path d="M87 162q15-20 30 0q15-20 30 0M614 254q12-17 24 0q12-17 24 0" fill="none" stroke="#84aaa7" stroke-width="4" stroke-linecap="round"/>
  <path d="M31 462H769V475Q769 499 745 499H55Q31 499 31 475Z" fill="#e2cfa8"/>
  <path d="M48 463H752" stroke="#203243" stroke-width="5"/>
  <rect x="48" y="479" width="704" height="12" fill="url(#road)"/>

  <!-- Roadside commentary -->
  <g class="ink">
    <path d="M111 361v99" fill="none" stroke="#7e6754"/>
    <rect x="54" y="281" width="114" height="83" rx="8" fill="#fff5dc"/>
  </g>
  <text class="type" x="111" y="308" font-size="15" font-weight="bold">NO FREE</text>
  <text class="type" x="111" y="330" font-size="19" font-weight="900">RIDES</text>
  <text class="type" x="111" y="350" font-size="12">fish included</text>

  <ellipse cx="405" cy="463" rx="235" ry="10" fill="#203243" opacity=".12"/>

  <!-- Spinning wheels -->
  <g transform="translate(270 414)">
    <circle r="70" fill="#f8f5e7" class="ink" stroke-width="9"/>
    <circle r="61" fill="#d9eee9" stroke="#97b3b4" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
      <path class="spoke" d="M-60 0H60M0-60V60M-43-43L43 43M-43 43L43-43"/>
      <path d="M-21-56A60 60 0 0 1 21-56" fill="none" stroke="#fff" stroke-width="5"/>
      <rect x="30" y="-5" width="15" height="10" rx="3" fill="#ffb647"/>
    </g>
    <circle r="9" fill="#203243"/>
  </g>
  <g transform="translate(550 414)">
    <circle r="70" fill="#f8f5e7" class="ink" stroke-width="9"/>
    <circle r="61" fill="#d9eee9" stroke="#97b3b4" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
      <path class="spoke" d="M-60 0H60M0-60V60M-43-43L43 43M-43 43L43-43"/>
      <path d="M-21-56A60 60 0 0 1 21-56" fill="none" stroke="#fff" stroke-width="5"/>
      <rect x="30" y="-5" width="15" height="10" rx="3" fill="#ffb647"/>
    </g>
    <circle r="9" fill="#203243"/>
  </g>

  <!-- Bicycle -->
  <path d="M270 414L330 322L397 414ZM330 322H511L397 414M511 322L550 414" fill="none" stroke="#203243" stroke-width="13" stroke-linejoin="round"/>
  <path d="M270 414L330 322L397 414ZM330 322H511L397 414M511 322L550 414" fill="none" stroke="#f16e56" stroke-width="7" stroke-linejoin="round"/>
  <path d="M330 322l-11-33M511 322l-14-48h33q18 0 15 16" fill="none" class="ink"/>
  <path d="M298 291h43" stroke="#203243" stroke-width="13" stroke-linecap="round"/>
  <path d="M397 402L272 404Q258 414 272 424L397 426" fill="none" stroke="#64818a" stroke-width="3"/>
  <circle cx="397" cy="414" r="20" fill="#ffd069" class="ink"/>

  <!-- Pelican and its moving legs -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".65s" repeatCount="indefinite"/>
    <path d="M341 283L363 342L397 386" fill="none" stroke="#203243" stroke-width="15" stroke-linecap="round">
      <animate attributeName="d" values="M341 283L363 342L397 386;M341 283L351 359L397 442;M341 283L363 342L397 386" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <path d="M341 283L363 342L397 386" fill="none" stroke="#efab47" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" values="M341 283L363 342L397 386;M341 283L351 359L397 442;M341 283L363 342L397 386" dur="1.3s" repeatCount="indefinite"/>
    </path>

    <path d="M301 248l-58-23 24 40-25 7 66 22" fill="#fffdf2" class="ink"/>
    <path d="M298 239Q332 214 376 236Q393 249 410 217L422 172Q433 149 455 164Q473 179 459 211L450 256Q439 297 389 306Q324 324 294 290Q277 266 298 239Z" fill="#fffdf2" class="ink"/>
    <path d="M306 252Q348 238 388 267Q370 300 326 286L340 274L319 273" fill="#c3d6d7" class="ink"/>
    <path d="M391 246Q434 277 493 276" fill="none" stroke="#203243" stroke-width="15" stroke-linecap="round"/>
    <path d="M391 242Q434 273 493 272" fill="none" stroke="#fffdf2" stroke-width="10" stroke-linecap="round"/>

    <!-- Enormous bill and fish cargo -->
    <path d="M459 184L659 211Q632 291 540 283Q491 279 462 215Z" fill="#f9b660" class="ink"/>
    <path d="M486 224Q541 242 621 223Q604 263 552 267Q506 267 486 224Z" fill="#f6cc86"/>
    <g transform="translate(548 246) rotate(-9)">
      <path d="M-31 0Q-8-26 22 0Q-8 24-31 0L-46-13V13Z" fill="#67bcb8" class="ink" stroke-width="3"/>
      <circle cx="9" cy="-3" r="3.5" fill="#203243"/>
      <path d="M-9-7l-5-14 17 10" fill="#67bcb8" stroke="#203243" stroke-width="3"/>
    </g>
    <path d="M458 182Q528 178 670 209L464 215" fill="#ffd05f" class="ink"/>
    <circle cx="449" cy="178" r="10" fill="white"/>
    <circle cx="453" cy="178" r="4" fill="#203243"/>
    <path d="M435 162l23 5" fill="none" class="ink"/>
    <path d="M416 154Q425 124 456 135Q478 140 478 160L415 160Z" fill="#ee6b54" class="ink"/>
    <path d="M430 140l-3 12M446 139l-2 13M461 143v10" stroke="#203243" stroke-width="4"/>
    <path d="M418 160l9 43 21-6" fill="none" stroke="#203243" stroke-width="3"/>
    <path d="M401 214l-45-11 12 16-25 10 57 5Z" fill="#ee6b54" class="ink" stroke-width="3"/>
    <path d="M483 155l10-13M493 169l16-4" stroke="#203243" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(397 414)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
      <path d="M0-28V28" stroke="#203243" stroke-width="7"/>
      <path d="M-11-28H11M-11 28H11" stroke="#203243" stroke-width="8" stroke-linecap="round"/>
      <circle r="7" fill="#fff5dc" stroke="#203243" stroke-width="3"/>
    </g>
  </g>

  <path d="M205 393h-25M199 410h-39M210 427h-23" stroke="#64818a" stroke-width="4" stroke-linecap="round"/>
  <text class="type" x="400" y="534" font-size="23" font-weight="bold">“I cycle to work. My lunch carpools.”</text>
  <path d="M70 552H730" stroke="#c9b997" stroke-width="2"/>
  <text class="type" x="400" y="580" font-size="18">2026-10-31 16:00:01 SGT (UTC+08:00)</text>
</svg>