<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican rides a tiny bicycle with a fish in its enormous bill. Wheels spin, feet pedal, and the pelican bobs. Caption: Zero emissions. Excess baggage.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#dfd5b8" opacity=".3"/>
      <circle cx="17" cy="19" r=".7" fill="#dfd5b8" opacity=".3"/>
    </pattern>
    <g id="spokes" stroke="#243b42" stroke-width="3">
      <path d="M-63 0H63 M0-63V63 M-45-45L45 45 M-45 45L45-45"/>
      <circle r="10" fill="#f5bb39"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M26 106H774" stroke="#243b42" stroke-width="3"/>
  <text x="400" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" letter-spacing="3" fill="#243b42">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="3" fill="#b04d38">THE COMMUTE HAS GONE FOWL</text>

  <!-- One seaside cycling scene -->
  <path d="M0 323Q110 295 219 322T432 320T650 319T800 308V446H0Z" fill="#cce7df"/>
  <path d="M0 361Q170 328 330 357T610 350T800 346" fill="none" stroke="#a6cec5" stroke-width="3"/>
  <path d="M33 178Q52 162 70 178Q88 162 106 178 M655 168Q668 155 681 168Q694 155 707 168" fill="none" stroke="#83a49c" stroke-width="3" stroke-linecap="round"/>
  <path d="M0 447H800V488H0Z" fill="#e5c59a"/>
  <path d="M0 449H800" stroke="#243b42" stroke-width="4"/>
  <ellipse cx="405" cy="454" rx="226" ry="14" fill="#7e7460" opacity=".18"/>

  <!-- A ridiculous official bike-lane sign -->
  <path d="M718 282V445" stroke="#243b42" stroke-width="7"/>
  <rect x="652" y="229" width="132" height="66" rx="8" fill="#fff9ec" stroke="#243b42" stroke-width="3"/>
  <text x="718" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#243b42">BIKE LANE</text>
  <text x="718" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b04d38">NO WIDE LOADS</text>

  <!-- Wheels: rotating spokes inside stationary tires -->
  <g fill="#fff7e5" stroke="#243b42">
    <circle cx="265" cy="378" r="70" stroke-width="10"/>
    <circle cx="555" cy="378" r="70" stroke-width="10"/>
  </g>
  <g transform="translate(265 378)">
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(555 378)">
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Tiny bicycle, enormous rider -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M265 378L335 288L402 378Z M335 288H503L402 378 M503 288L555 378" stroke="#243b42" stroke-width="12"/>
    <path d="M265 378L335 288L402 378Z M335 288H503L402 378 M503 288L555 378" stroke="#e46449" stroke-width="7"/>
    <path d="M335 288L324 264 M503 288L490 249L522 236" stroke="#243b42" stroke-width="8"/>
    <path d="M517 236H539" stroke="#243b42" stroke-width="11"/>
    <path d="M306 265H348" stroke="#243b42" stroke-width="13"/>
    <path d="M265 378L402 378" stroke="#243b42" stroke-width="3"/>
  </g>
  <circle cx="402" cy="378" r="16" fill="#ffe5a0" stroke="#243b42" stroke-width="4"/>

  <!-- Far webbed foot follows the opposite crank -->
  <g>
    <path d="M356 282L374 326L380 378" fill="none" stroke="#d59b30" stroke-width="10" stroke-linecap="round"/>
    <path d="M374 372L363 385L395 385L387 373Z" fill="#e9ab37" stroke="#243b42" stroke-width="3"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;12 -12;24 0;12 12;0 0" dur="1.4s" repeatCount="indefinite"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>

    <!-- Tail, body, neck and head -->
    <path d="M299 219L250 194L267 230L245 226L287 254" fill="#fffdf2" stroke="#243b42" stroke-width="4" stroke-linejoin="round"/>
    <path d="M291 214C318 184 376 191 399 223C411 239 410 264 388 279C359 299 310 285 287 261C275 248 277 230 291 214Z" fill="#fffdf2" stroke="#243b42" stroke-width="4"/>
    <path d="M372 236C395 214 388 185 403 164C414 148 435 146 451 158C469 172 459 195 441 207L432 257C426 278 406 284 383 272" fill="#fffdf2" stroke="#243b42" stroke-width="4"/>
    <path d="M306 222C325 211 365 218 377 245C356 259 331 254 314 240 M320 232L349 243" fill="#e3e9df" stroke="#243b42" stroke-width="3" stroke-linecap="round"/>
    <!-- Wing gripping the bars -->
    <path d="M381 235Q430 259 487 246L516 237" fill="none" stroke="#243b42" stroke-width="15" stroke-linecap="round"/>
    <path d="M381 233Q430 255 487 243L516 234" fill="none" stroke="#fffdf2" stroke-width="9" stroke-linecap="round"/>
    <path d="M511 231L520 244 M518 229L527 240" stroke="#243b42" stroke-width="3"/>

    <!-- Bill and gloriously overloaded pouch -->
    <path d="M451 184L622 201Q577 259 489 240Q459 232 451 184Z" fill="#efad55" stroke="#243b42" stroke-width="4"/>
    <path d="M453 182L638 195L622 204L452 200Z" fill="#ffd35e" stroke="#243b42" stroke-width="4" stroke-linejoin="round"/>
    <path d="M476 211Q524 241 587 217" fill="none" stroke="#cc793c" stroke-width="3"/>

    <!-- Fish passenger -->
    <path d="M514 218Q537 196 564 216L581 205L578 228L563 222Q539 238 514 218Z" fill="#77bdb6" stroke="#243b42" stroke-width="3"/>
    <circle cx="526" cy="216" r="3" fill="#243b42"/>
    <path d="M538 211L545 205L552 211" fill="#77bdb6" stroke="#243b42" stroke-width="2"/>
    <path d="M530 224L536 225" stroke="#243b42" stroke-width="2"/>

    <!-- Focused expression and undersized cycling helmet -->
    <ellipse cx="442" cy="175" rx="9" ry="12" fill="white" stroke="#243b42" stroke-width="3"/>
    <circle cx="446" cy="177" r="4" fill="#243b42"/>
    <path d="M432 159L452 164" stroke="#243b42" stroke-width="5" stroke-linecap="round"/>
    <path d="M397 155Q401 126 427 128Q453 128 459 153Z" fill="#e46449" stroke="#243b42" stroke-width="4"/>
    <path d="M413 133L410 146 M429 132L429 146 M444 136L447 147" stroke="#243b42" stroke-width="4" stroke-linecap="round"/>
    <path d="M403 156L414 187L430 191" fill="none" stroke="#243b42" stroke-width="3"/>
    <path d="M387 170Q377 162 380 156Q389 157 387 170Z" fill="#65bfc6"/>

    <!-- Rider's near leg -->
    <path d="M370 278L413 316L424 378" fill="none" stroke="#243b42" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M370 278L413 316L424 378;M370 278L411 307L402 356;M370 278L390 320L380 378;M370 278L416 336L402 400;M370 278L413 316L424 378" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M370 278L413 316L424 378" fill="none" stroke="#efb43e" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" values="M370 278L413 316L424 378;M370 278L411 307L402 356;M370 278L390 320L380 378;M370 278L416 336L402 400;M370 278L413 316L424 378" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(402 378)">
    <g>
      <path d="M-22 0H22" stroke="#243b42" stroke-width="5"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="424 378;402 356;380 378;402 400;424 378" dur="1.4s" repeatCount="indefinite"/>
    <path d="M-6-5L-13 7H24L12-4Z" fill="#ffc449" stroke="#243b42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-13 11H25" stroke="#243b42" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Stationary joke text stays legible -->
  <path d="M58 126H251Q265 126 265 140V192Q265 205 251 205H204L224 224L180 205H58Q44 205 44 191V140Q44 126 58 126Z" fill="white" stroke="#243b42" stroke-width="3"/>
  <text x="154" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#243b42">“It's mostly</text>
  <text x="154" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#243b42">carry-on.”</text>
  <path d="M168 310H212 M147 329H201 M172 348H194" stroke="#b04d38" stroke-width="4" stroke-linecap="round"/>

  <rect x="0" y="488" width="800" height="112" fill="#243b42"/>
  <text x="400" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#fff5dc">Zero emissions. Excess baggage.</text>
  <path d="M100 546H700" stroke="#839895" stroke-width="1"/>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff5dc">2026-10-25 05:30:01 SGT (UTC+08:00)</text>
</svg>