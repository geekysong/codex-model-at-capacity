  <g stroke="#203b47" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M346 271l40 47-16 48m-3-92 52 49-12 54" fill="none" stroke="#e3a039" stroke-width="12" stroke-linecap="round"/>
