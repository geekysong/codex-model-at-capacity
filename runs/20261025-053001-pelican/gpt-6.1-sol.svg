<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="description">A smug pelican with an enormous bill cycles along the waterfront, carrying a tiny fish as a passenger. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="water" width="70" height="22" patternUnits="userSpaceOnUse">
      <path d="M5 12h30m12 0h12" fill="none" stroke="#80c6ca" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5da"/>
  <circle cx="693" cy="130" r="47" fill="#ffd265"/>
  <path d="M0 330Q170 301 320 330T800 325V458H0Z" fill="#b7e1dc"/>
  <path d="M0 344H800V452H0Z" fill="url(#water)"/>
  <path d="M58 157q17-17 34 0q17-17 34 0m421-31q13-13 26 0q13-13 26 0" fill="none" stroke="#679498" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#203b47">TOUR DE FISH</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#53676a">One pelican. Two wheels. Absolutely no brakes for snacks.</text>

  <path d="M0 436H800V526H0Z" fill="#e4cda5"/>
  <path d="M0 444H800" stroke="#344b50" stroke-width="5"/>
  <path d="M40 489h100m90 0h100m90 0h100m90 0h100" stroke="#fff4d6" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="402" cy="459" rx="235" ry="13" fill="#b59b78" opacity=".35"/>

  <!-- The spinning wheels retain fixed hubs and circular tires. -->
  <g fill="#fff5da" stroke="#203b47" stroke-width="9">
    <circle cx="232" cy="384" r="73"/>
    <circle cx="566" cy="384" r="73"/>
  </g>
  <g stroke="#698389" stroke-width="3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 232 384" to="360 232 384" dur="1.4s" repeatCount="indefinite"/>
      <path d="M232 315v138m-69-69h138m-118-49 98 98m-98 0 98-98"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 566 384" to="360 566 384" dur="1.4s" repeatCount="indefinite"/>
      <path d="M566 315v138m-69-69h138m-118-49 98 98m-98 0 98-98"/>
    </g>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 384l94-110 67 110H232l77-81h194l-110 81m110-81 63 81m-63-81-15-44" stroke="#203b47" stroke-width="13"/>
    <path d="M232 384l94-110 67 110H232l77-81h194l-110 81m110-81 63 81" stroke="#ee6551" stroke-width="7"/>
    <path d="M326 274l-12-27m-27 0h59m142 12 26-22h39" stroke="#203b47" stroke-width="10"/>
  </g>
  <circle cx="393" cy="384" r="18" fill="#f9cc58" stroke="#203b47" stroke-width="5"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 393 384" to="360 393 384" dur="1.4s" repeatCount="indefinite"/>
    <path d="M367 384h52" stroke="#203b47" stroke-width="6"/>
    <path d="M357 384h19m34 0h19" stroke="#203b47" stroke-width="9" stroke-linecap="round"/>
  </g>
  <circle cx="232" cy="384" r="7" fill="#203b47"/>
  <circle cx="566" cy="384" r="7" fill="#203b47"/>

