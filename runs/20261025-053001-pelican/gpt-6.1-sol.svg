    <path d="M428 144l20-3" fill="none" stroke-width="4" stroke-linecap="round"/>

    <path d="M398 137q-2-38 37-40 35 0 42 33Z" fill="#ee6551" stroke-width="5"/>
    <path d="M410 114l7 19m14-26 5 24m14-19 6 17" fill="none" stroke="#fff5da" stroke-width="5"/>
    <path d="M401 138l83-9" stroke-width="6" stroke-linecap="round"/>
    <path d="M397 186l-36 7 20 16-32 13 54 5" fill="#ee6551" stroke-width="4"/>
  </g>

  <g stroke="#203b47" stroke-width="4" stroke-linejoin="round">
    <path d="M532 280h78l-10 51h-58Z" fill="#dbac6b"/>
    <path d="M542 296h59m-56 16h53m-37-31 3 49m19-49-3 49" fill="none" stroke="#a77740" stroke-width="2"/>
    <path d="M554 270q18-27 37-1l16-13-2 28-16-9q-20 15-35-5Z" fill="#6bc4ba"/>
    <circle cx="563" cy="266" r="3" fill="#203b47" stroke="none"/>
