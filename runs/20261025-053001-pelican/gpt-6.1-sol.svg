  <path d="M67 194q0-17 17-17h150q17 0 17 17v43q0 17-17 17h-37l-20 22 3-22H84q-17 0-17-17Z" fill="#fffdf4" stroke="#203b47" stroke-width="3"/>
  <text x="159" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#203b47">
    <tspan x="159">“My bill has</tspan>
    <tspan x="159" dy="24">right of way.”</tspan>
  </text>

  <rect y="526" width="800" height="74" fill="#203b47"/>
  <text x="400" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff5da">He bought a bicycle. The fish paid the bill.</text>
  <text x="400" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fff5da">2026-10-25 05:31:05 SGT (UTC+08:00)</text>
</svg>