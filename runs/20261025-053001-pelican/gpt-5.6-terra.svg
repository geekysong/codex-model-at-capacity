    <path d="M381 336q32 17 83 7" fill="none" stroke="#d8d1b4" stroke-width="4"/>
  </g>

  <g font-family="Arial Black, sans-serif" text-anchor="middle">
    <path d="M595 274q81-34 143 15l-13 76q-78 19-128-30Z" fill="#fff9e9" stroke="#25323d" stroke-width="4"/>
    <path d="M600 305l-23 17 29 3" fill="#fff9e9" stroke="#25323d" stroke-width="4"/>
    <text x="665" y="306" font-size="15" fill="#e84d4f">TOOT!</text>
    <text x="665" y="330" font-size="14" fill="#263646">MAKE WAY</text>
    <text x="665" y="349" font-size="14" fill="#263646">FOR BEAK!</text>
  </g>

  <rect y="480" width="800" height="120" fill="#263646"/>
  <text x="400" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#fff5d6">A pelican rides a bicycle: aerodynamic confidence, questionable steering.</text>
  <path d="M140 539h520" stroke="#f2c94c" stroke-width="2" opacity=".8"/>
  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d9edf5">2026-10-25 05:32:24 SGT (UTC+08:00)</text>
