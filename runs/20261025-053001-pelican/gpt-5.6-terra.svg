<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a tiny bicycle with animated spinning wheels and bobbing motion.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: 410px 330px; animation: bob .55s ease-in-out infinite alternate; }
    .leg-a { transform-box: fill-box; transform-origin: 406px 376px; animation: pedalA 1.1s linear infinite; }
    .leg-b { transform-box: fill-box; transform-origin: 446px 376px; animation: pedalB 1.1s linear infinite; }
    .dust { animation: puff 1.1s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(24deg); } }
    @keyframes pedalB { 50% { transform: rotate(-24deg); } }
    @keyframes puff { 0% { opacity: 0; transform: translateX(0) scale(.4); } 35% { opacity: .85; } 100% { opacity: 0; transform: translateX(-35px) scale(1.35); } }
  </style>

  <rect width="800" height="600" fill="#bfe9f7"/>
  <path d="M0 270 Q100 205 205 265 T410 255 T610 255 T800 215 V445 H0Z" fill="#83c85e"/>
  <path d="M0 385 Q100 360 220 387 T430 375 T630 390 T800 366 V472 H0Z" fill="#f2c94c"/>
  <path d="M0 442 Q150 412 300 440 T590 428 T800 440 V480 H0Z" fill="#6d5036"/>

  <g fill="#fff" opacity=".88">
    <path d="M68 105c20-30 48-11 47 8 30-22 56 10 31 26H55c-21-10-8-27 13-34Z"/>
    <path d="M635 93c17-27 43-10 42 7 26-19 50 9 28 24h-78c-18-9-7-24 8-31Z"/>
  </g>

  <text x="400" y="64" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="39" fill="#263646" stroke="#fff" stroke-width="6" paint-order="stroke" letter-spacing="1">PELICAN PEDAL PANIC!</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#34495e">“I was promised a bike lane, not a beak lane!”</text>

  <g class="dust" fill="#d8b56d">
    <ellipse cx="158" cy="440" rx="18" ry="8"/>
    <ellipse cx="128" cy="448" rx="12" ry="6"/>
  </g>

  <g stroke="#25323d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <g class="wheel">
      <circle cx="255" cy="429" r="66" fill="#f7f1dc"/>
      <circle cx="255" cy="429" r="57" fill="none"/>
      <path d="M255 372V486M198 429h114M215 389l80 80M295 389l-80 80" stroke="#8999a4" stroke-width="3"/>
      <circle cx="255" cy="429" r="8" fill="#f05b4f"/>
    </g>
    <g class="wheel">
      <circle cx="550" cy="429" r="66" fill="#f7f1dc"/>
      <circle cx="550" cy="429" r="57" fill="none"/>
      <path d="M550 372V486M493 429h114M510 389l80 80M590 389l-80 80" stroke="#8999a4" stroke-width="3"/>
      <circle cx="550" cy="429" r="8" fill="#f05b4f"/>
    </g>

    <path d="M255 429 340 326 426 429 255 429 390 429 485 315 550 429 426 429 485 315 448 315" fill="none" stroke="#e84d4f" stroke-width="10"/>
    <path d="M340 326h-31M485 315l17-43h46" fill="none" stroke-width="9"/>
    <path d="M502 272q24-19 48 0" fill="none" stroke-width="7"/>
    <path d="M426 429 443 449M432 456h23" fill="none" stroke-width="6"/>
  </g>

  <g class="rider" stroke="#25323d" stroke-linecap="round" stroke-linejoin="round">
    <g class="leg-a" stroke-width="13">
      <path d="M402 368 Q374 404 421 442" fill="none" stroke="#f7a948"/>
      <path d="M421 442q25 14 42 0" fill="none" stroke="#f7a948"/>
