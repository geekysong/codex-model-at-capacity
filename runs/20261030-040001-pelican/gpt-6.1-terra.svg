<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN DELIVERY</title>
  <desc id="desc">A smug pelican rides a bicycle with a fish in its enormous beak. The wheels spin and its feet pedal.</desc>
