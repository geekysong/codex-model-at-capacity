      <circle r="47" fill="none" stroke="#d5dfe0" stroke-width="3"/>
      <g stroke="#8aa0a2" stroke-width="2">
        <path d="M0-47v94M-47 0h94M-33-33l66 66M33-33l-66 66"/>
      </g>
      <circle r="7" fill="#263b44"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite" additive="sum"/>
    </g>
  </defs>

