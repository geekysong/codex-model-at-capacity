<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pedal Beak</title>
  <desc id="desc">A smug pelican rides a bicycle, pedaling past a sign that says “Local traffic is fishy.” The wheels turn and the rider bobs.</desc>
  <defs>
    <style>
      .ink{stroke:#17324d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#fff8e8;stroke:#17324d;stroke-width:7}
      .spoke{stroke:#6c8795;stroke-width:2}
      .frame{fill:none;stroke:#e4572e;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .small{font-family:Verdana,sans-serif}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .rolling{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .65s ease-in-out infinite}
    </style>
  </defs>

  <rect width="800" height="600" fill="#bde9ee"/>
  <circle cx="690" cy="105" r="48" fill="#ffd166"/>
  <path d="M0 352Q118 328 228 352T452 348T800 350V600H0Z" fill="#8dce83"/>
  <path d="M0 430Q150 405 300 430T600 426T800 430V600H0Z" fill="#65ae70"/>
  <path d="M0 487H800" stroke="#fff6df" stroke-width="5" stroke-dasharray="24 18" opacity=".9"/>

  <text x="400" y="54" text-anchor="middle" class="small" font-size="31" font-weight="900" fill="#17324d">PEDAL BEAK</text>
  <text x="400" y="83" text-anchor="middle" class="small" font-size="15" font-weight="700" fill="#31536a">A bird of very questionable cycling ability</text>

  <!-- roadside sign -->
  <path d="M101 294V385" stroke="#725b43" stroke-width="9"/>
  <rect x="38" y="230" width="128" height="68" rx="8" fill="#fff8e8" class="ink"/>
  <text x="102" y="256" text-anchor="middle" class="small" font-size="13" font-weight="800" fill="#17324d">LOCAL TRAFFIC</text>
  <text x="102" y="279" text-anchor="middle" class="small" font-size="17" font-weight="900" fill="#e4572e">IS FISHY</text>

  <!-- bicycle wheels -->
  <g class="rolling">
    <circle class="wheel" cx="244" cy="414" r="73"/>
    <path class="spoke" d="M244 341V487M171 414H317M192 362L296 466M296 362L192 466"/>
    <circle cx="244" cy="414" r="7" fill="#e4572e"/>
  </g>
  <g class="rolling">
    <circle class="wheel" cx="550" cy="414" r="73"/>
    <path class="spoke" d="M550 341V487M477 414H623M498 362L602 466M602 362L498 466"/>
    <circle cx="550" cy="414" r="7" fill="#e4572e"/>
  </g>

  <!-- frame, handlebars, saddle -->
  <path class="frame" d="M244 414L348 414L397 326L472 414L348 414L317 348"/>
  <path d="M309 344L326 344M389 326L420 326L432 339" fill="none" stroke="#17324d" stroke-width="7" stroke-linecap="round"/>
  <path d="M462 404L478 395L489 399" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="348" cy="414" r="13" fill="#ffd166" class="ink"/>
  <path d="M348 414L369 450L397 414" fill="none" stroke="#17324d" stroke-width="5"/>
  <path d="M361 447L378 451M390 410L401 417" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>

  <!-- animated pelican rider -->
  <g class="rider">
    <path d="M351 305Q366 271 402 277Q432 282 439 313L424 352L367 353Z" fill="#fff8e8" class="ink"/>
    <path d="M372 337Q409 329 435 349L422 368Q395 373 370 358Z" fill="#31536a" class="ink"/>
    <path d="M388 286Q367 253 385 219Q402 189 435 207Q461 222 447 252L429 282Z" fill="#fff8e8" class="ink"/>
    <path d="M429 237Q478 224 522 243Q529 246 522 252Q481 261 440 258Z" fill="#f4a62a" class="ink"/>
    <path d="M440 257Q478 258 511 253Q503 281 471 290Q447 289 430 269Z" fill="#ef7952" class="ink"/>
    <circle cx="426" cy="226" r="5" fill="#17324d"/>
    <path d="M398 206Q412 192 427 201" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
    <path d="M400 294Q414 281 430 295L419 316Z" fill="#dce8e5" stroke="#17324d" stroke-width="3"/>
    <path d="M376 348L353 376L350 409M425 353L399 375L381 404" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
    <path d="M344 407L361 410M375 402L390 407" stroke="#e4572e" stroke-width="8" stroke-linecap="round"/>
    <path d="M359 307L333 327L316 347M435 309L457 328L475 342" fill="none" stroke="#17324d" stroke-width="7" stroke-linecap="round"/>
    <path d="M309 345L322 350M470 340L482 344" stroke="#f4a62a" stroke-width="8" stroke-linecap="round"/>
    <path d="M363 279Q341 269 326 280" fill="none" stroke="#17324d" stroke-width="3" stroke-dasharray="5 6"/>
    <text x="474" y="199" class="small" font-size="14" font-weight="900" fill="#17324d">HONK!</text>
  </g>

  <path d="M90 447q12-15 24 0m25 8q9-12 18 0m497-11q12-15 24 0" fill="none" stroke="#fff8e8" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="536" text-anchor="middle" class="small" font-size="19" font-weight="800" fill="#17324d">“My commute is going swimmingly.”</text>
  <rect x="0" y="558" width="800" height="42" fill="#17324d"/>
  <text x="400" y="585" text-anchor="middle" class="small" font-size="16" font-weight="700" fill="#fff8e8">2026-10-30 00:32:38 SGT (UTC+08:00)</text>
</svg>