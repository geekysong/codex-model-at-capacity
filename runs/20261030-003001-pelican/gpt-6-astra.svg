<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a bicycle with a huge fish-filled bill, claiming to travel light. Wheels rotate and the rider bobs in a continuous loop.</desc>
