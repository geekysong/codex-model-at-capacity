<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a fish dangling from its handlebars. Wheels spin and the bird bobs in a continuous loop.</desc>
