  <rect y="500" width="800" height="100" fill="#203c43"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#fff4d7">He traded his wings for a two-wheel fish delivery gig.</text>
