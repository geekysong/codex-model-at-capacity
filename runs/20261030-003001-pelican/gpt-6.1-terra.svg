<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDAL POWER</title>
  <desc id="desc">A pelican rides a bicycle with fish in its bill. The wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
    <style>
      .outline { stroke:#24313a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 1s ease-in-out infinite; }
      .leg { transform-box:fill-box; transform-origin:top center; animation:pedal 1s ease-in-out infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(5px); } }
      @keyframes pedal { from { transform:rotate(-7deg); } to { transform:rotate(9deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f9f0d9"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#e6f4ed" stroke="#24313a" stroke-width="4"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="2" fill="#24313a">PELICAN PEDAL POWER</text>

