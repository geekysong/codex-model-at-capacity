    <text x="90" y="234">A4</text><text x="190" y="234">B4</text><text x="290" y="234">C4</text><text x="390" y="234">D4</text><text x="490" y="234">E4</text>
    <text x="90" y="294">A5</text><text x="190" y="294">B5</text><text x="290" y="294">C5</text><text x="390" y="294">D5</text><text x="490" y="294">E5</text>
