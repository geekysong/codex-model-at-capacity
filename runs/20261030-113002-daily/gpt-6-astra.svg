    <circle cx="490" cy="130" r="5"/><circle cx="490" cy="190" r="5"/><circle cx="490" cy="250" r="5"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M182 122L198 138 M198 122L182 138"/>
    <path d="M282 182L298 198 M298 182L282 198"/>
    <path d="M382 242L398 258 M398 242L382 258"/>
  </g>

