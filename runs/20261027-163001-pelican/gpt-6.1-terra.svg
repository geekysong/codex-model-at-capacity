<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical pelican rides a bicycle while chasing a fish-shaped prize.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555e6b"/>
      <stop offset="1" stop-color="#303744"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#253041" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202936;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202936}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .pelicanBob{animation:bob .8s ease-in-out infinite alternate}
      .pedalSpin{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="100" r="48" fill="#fff4a8" stroke="#e5b84c" stroke-width="5"/>
  <path d="M0 395 Q120 350 240 395 T480 395 T800 390 V600 H0Z" fill="#9bd18b"/>
  <path d="M0 455 Q200 420 400 458 T800 445 V600 H0Z" fill="#78b873"/>
  <path d="M0 490 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M30 535 H150 M220 535 H340 M410 535 H530 M600 535 H770" stroke="#f8df73" stroke-width="9" stroke-linecap="round"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="34" font-weight="900" fill="#17334c">THE PELICAN PEDAL EXPRESS</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="17" font-weight="700" fill="#3e596c">“Why fly when you can wobble dramatically?”</text>

  <g transform="translate(116 190)" filter="url(#shadow)">
    <path d="M0 26 Q35 0 71 25" fill="none" class="ink"/>
    <path d="M20 28 Q44 5 68 27" fill="none" stroke="#fff" stroke-width="8"/>
  </g>

  <g transform="translate(615 180)" filter="url(#shadow)">
    <path d="M0 26 Q35 0 71 25" fill="none" class="ink"/>
    <path d="M20 28 Q44 5 68 27" fill="none" stroke="#fff" stroke-width="8"/>
  </g>

  <g class="wheelSpin">
    <circle cx="290" cy="455" r="83" fill="#eef4f7" class="ink"/>
    <circle cx="290" cy="455" r="10" fill="#ffcf4a" class="ink"/>
    <g stroke="#6d8191" stroke-width="3">
      <path d="M290 372V538 M207 455H373 M231 396L349 514 M349 396L231 514"/>
    </g>
  </g>
  <g class="wheelSpin">
    <circle cx="575" cy="455" r="83" fill="#eef4f7" class="ink"/>
    <circle cx="575" cy="455" r="10" fill="#ffcf4a" class="ink"/>
    <g stroke="#6d8191" stroke-width="3">
      <path d="M575 372V538 M492 455H658 M516 396L634 514 M634 396L516 514"/>
    </g>
  </g>

  <g fill="none" class="ink">
    <path d="M290 455 L390 330 L575 455 L470 455 Z" stroke="#e84f3d" stroke-width="12"/>
    <path d="M390 330 L470 455 M390 330 L425 275 M425 275 H475" stroke="#e84f3d" stroke-width="10"/>
    <path d="M575 455 L585 300" stroke="#e84f3d" stroke-width="10"/>
    <path d="M585 300 Q620 280 644 298" stroke="#e84f3d" stroke-width="10"/>
  </g>

  <g class="pedalSpin">
    <circle cx="470" cy="455" r="14" fill="#ffd15a" class="ink"/>
    <path d="M470 455 L440 430 M470 455 L500 480" stroke="#202936" stroke-width="7"/>
    <rect x="426" y="421" width="23" height="9" rx="4" fill="#202936"/>
    <rect x="496" y="476" width="23" height="9" rx="4" fill="#202936"/>
  </g>

  <g class="pelicanBob">
    <path d="M374 281 Q406 238 466 258 Q520 277 523 343 L500 385 Q458 405 411 374 Q379 347 374 281Z" fill="#f5f7f2" class="ink"/>
    <path d="M392 286 Q419 255 456 267 Q487 278 493 314 Q464 335 427 321 Q402 310 392 286Z" fill="#dce7e8" class="ink"/>
    <circle cx="449" cy="278" r="10" fill="#202936"/>
    <circle cx="452" cy="275" r="3.5" fill="#fff"/>
    <path d="M416 302 Q384 302 352 317 Q322 331 293 318 Q278 311 288 298 Q326 263 382 247 Q416 238 438 254Z" fill="#f4a942" class="ink"/>
    <path d="M292 299 Q330 294 378 273" fill="none" stroke="#d87924" stroke-width="6"/>
    <path d="M474 342 Q500 356 518 387" fill="none" stroke="#f4a942" stroke-width="21" class="ink"/>
    <path d="M435 372 L425 420 M489 371 L508 425" fill="none" stroke="#f4a942" stroke-width="13" class="ink"/>
    <path d="M412 420 Q425 426 440 422 M496 425 Q512 431 526 424" fill="none" stroke="#f4a942" stroke-width="9" class="ink"/>
    <path d="M406 308 Q433 326 469 318" fill="none" stroke="#202936" stroke-width="5"/>
    <path d="M402 252 Q390 221 409 205" fill="none" class="ink"/>
    <path d="M410 208 Q426 193 438 209" fill="none" class="ink"/>
    <path d="M401 206 Q385 192 374 205" fill="none" class="ink"/>
    <path d="M388 346 Q362 363 350 392" fill="none" stroke="#f4a942" stroke-width="16" class="ink"/>
    <path d="M350 392 L333 416" fill="none" stroke="#f4a942" stroke-width="10" class="ink"/>
    <path d="M333 416 L350 423" fill="none" stroke="#f4a942" stroke-width="8" class="ink"/>
  </g>

  <g transform="translate(95 380)">
    <path d="M0 44 Q40 4 82 35 Q108 54 133 38" fill="none" stroke="#e84f3d" stroke-width="7" stroke-dasharray="12 12"/>
    <path d="M18 25 Q32 0 55 16 L86 35 Q53 50 18 25Z" fill="#ffd15a" class="ink"/>
    <circle cx="42" cy="24" r="4" fill="#202936"/>
    <path d="M86 35 L112 35" stroke="#202936" stroke-width="5"/>
    <text x="2" y="82" class="label" font-size="15" font-weight="700">FISH OF THE DAY</text>
  </g>

  <g transform="translate(632 315)">
    <path d="M0 0 L40 0 L31 22 L8 22Z" fill="#fff" class="ink"/>
    <path d="M7 8 H34" stroke="#e84f3d" stroke-width="5"/>
    <text x="20" y="16" text-anchor="middle" class="label" font-size="11" font-weight="900" fill="#e84f3d">HONK</text>
  </g>

  <text x="400" y="574" text-anchor="middle" class="label" font-size="15" font-weight="700">2026-10-27 16:33:31 SGT (UTC+08:00)</text>
</svg>