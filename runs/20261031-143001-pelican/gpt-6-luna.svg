<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle</title>
  <desc id="desc">A smug pelican rides a bicycle, proudly delivering one tiny fish. The wheels spin and the rider bobs.</desc>
  <defs>
    <style>
      .ink{stroke:#183044;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#f8fbf3;stroke:#183044;stroke-width:8}
      .spoke{stroke:#74a6a0;stroke-width:3}
      .frame{fill:none;stroke:#e05e43;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      .text{font-family:Arial,Helvetica,sans-serif;fill:#183044}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes ride{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .rolling{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .rider{animation:ride .6s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){.rolling,.rider{animation:none}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#d9f0e8"/>
  <circle cx="680" cy="105" r="47" fill="#ffd36e"/>
  <path d="M0 370 Q130 335 250 367 T510 360 T800 365 V520 H0Z" fill="#a9d7b8"/>
  <path d="M0 420 Q140 390 280 420 T560 414 T800 422" fill="none" stroke="#75b79b" stroke-width="5"/>
  <path d="M96 185h64m-42-20 22 20-22 20M566 206h52m-34-17 18 17-18 17" fill="none" stroke="#fff9e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <text id="title" x="400" y="56" text-anchor="middle" class="text" font-size="34" font-weight="900" letter-spacing="1">THE PELICAN CYCLE</text>
  <text x="400" y="87" text-anchor="middle" class="text" font-size="17" font-weight="700">“I’m on a strict one-fish-per-mile diet.”</text>

  <g aria-label="Bicycle wheels">
    <circle class="wheel" cx="260" cy="405" r="72"/>
    <circle class="wheel" cx="540" cy="405" r="72"/>
    <g class="rolling">
      <path class="spoke" d="M260 337v136M192 405h136M212 357l96 96m0-96-96 96"/>
    </g>
    <g class="rolling">
      <path class="spoke" d="M540 337v136M472 405h136M492 357l96 96m0-96-96 96"/>
    </g>
    <circle cx="260" cy="405" r="8" fill="#e05e43"/>
    <circle cx="540" cy="405" r="8" fill="#e05e43"/>
  </g>

  <g aria-label="Bicycle frame">
    <path class="frame" d="M260 405 352 315 420 405 340 405 352 315M420 405l74-107 46 107M478 298h39m-11-12v14M337 305l-13-16h-35"/>
    <path d="M340 405h-20m100 0h20" stroke="#183044" stroke-width="8" stroke-linecap="round"/>
    <path d="M352 315l-8 11m76 79-9-10" stroke="#f4a84f" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="rider" aria-label="Pelican cyclist">
    <!-- tail and body -->
    <path d="M351 257q-37-14-59 7 22 23 55 11" fill="#f5f1df" class="ink"/>
    <ellipse cx="371" cy="249" rx="56" ry="45" fill="#f5f1df" class="ink"/>
    <path d="M356 252q31-25 58 1-21 22-52 19" fill="#8fb7b1" stroke="#183044" stroke-width="4"/>
    <!-- long neck and head -->
    <path d="M385 232q17-49 5-79-5-12 9-18 20 0 28 21 10 29-10 82" fill="#f5f1df" class="ink"/>
    <circle cx="407" cy="145" r="29" fill="#f5f1df" class="ink"/>
    <!-- beak and ridiculous pouch -->
    <path d="M429 145 505 158 431 168Z" fill="#f0a33b" class="ink"/>
    <path d="M434 165q33 5 48 22-20 34-51 7" fill="#e8754e" stroke="#183044" stroke-width="5" stroke-linejoin="round"/>
    <path d="M444 185q17 5 27 0" fill="none" stroke="#b64e3b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="415" cy="139" r="4.5" fill="#183044"/>
    <path d="M423 125q10-7 18 0" fill="none" stroke="#183044" stroke-width="3" stroke-linecap="round"/>
    <!-- jaunty helmet -->
    <path d="M383 128q3-28 28-31 24-1 32 25Z" fill="#e05e43" class="ink"/>
    <path d="M378 128h70" stroke="#183044" stroke-width="6" stroke-linecap="round"/>
    <path d="M411 99q-8-13 5-18 15-2 12 12" fill="none" stroke="#183044" stroke-width="4" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M346 240q18-32 48-11-4 32-35 38" fill="#fffdf1" stroke="#183044" stroke-width="4"/>
    <!-- legs pedaling -->
    <path d="M366 282 351 333 385 356M389 282 421 323 385 356" fill="none" stroke="#e0a03b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M385 356l-18 5m18-5 13 9" stroke="#183044" stroke-width="5" stroke-linecap="round"/>
    <!-- wing on handlebar -->
    <path d="M407 236q39 4 74 55" fill="none" stroke="#f5f1df" stroke-width="13" stroke-linecap="round"/>
    <path d="M407 236q39 4 74 55" fill="none" stroke="#183044" stroke-width="4" stroke-linecap="round"/>
    <!-- tiny fish cargo -->
    <path d="M461 191q18-13 34 0-16 13-34 0Zm0 0-9-8v16Z" fill="#8cc9cd" stroke="#183044" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="487" cy="190" r="2" fill="#183044"/>
  </g>

  <path d="M553 300q24-24 39-2m-15-23q12 3 15 14" fill="none" stroke="#183044" stroke-width="4" stroke-linecap="round"/>
  <text x="590" y="278" class="text" font-size="15" font-weight="700">HONK!</text>

  <path d="M0 505h800v95H0z" fill="#183044"/>
  <text x="400" y="536" text-anchor="middle" fill="#fff9e8" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Local bird insists this counts as “fish delivery logistics.”</text>
  <text x="400" y="575" text-anchor="middle" fill="#ffd36e" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">2026-10-31 14:32:09 SGT (UTC+08:00)</text>
</svg>