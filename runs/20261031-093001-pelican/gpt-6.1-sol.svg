<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Fish-Powered Commute</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish in its enormous bill, passing a sign that promises a faster commute. Wheels spin, pedals turn, and the pelican bobs in a continuous loop.</desc>
