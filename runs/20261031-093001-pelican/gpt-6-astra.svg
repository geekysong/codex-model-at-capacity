<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A self-important pelican pedals a bicycle with a fish in its enormous bill pouch. The wheels spin, its foot pedals, and the bird bobs. A roadside sign declares a no-fly zone.</desc>
