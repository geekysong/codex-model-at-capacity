<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Peloton</title>
  <desc id="desc">A cheerful pelican rides a bicycle with spinning wheels and a bobbing body. The caption reads: His commute has a very large carbon beakprint.</desc>
  <defs>
    <style>
      .wheel { animation: spin 1.4s linear infinite; transform-box: fill-box; transform-origin: center; }
      .rider { animation: bob 0.7s ease-in-out infinite alternate; }
      .pedal { animation: spin 1.4s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedal { animation-duration: 5s; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e9"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#d9f2f2" stroke="#233746" stroke-width="4"/>
  <path d="M20 363 Q155 330 281 359 T548 354 T780 360 V498 H20Z" fill="#c2e0b2"/>
  <circle cx="683" cy="120" r="35" fill="#ffd66b"/>
  <path d="M71 153 q16-20 32 0 q16-20 32 0 M602 183 q12-15 24 0 q12-15 24 0" fill="none" stroke="#729ca3" stroke-width="4" stroke-linecap="round"/>
  <path d="M33 443 Q400 425 767 443" fill="none" stroke="#9fbd91" stroke-width="5"/>

  <text x="400" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#233746">THE PELICAN PELOTON</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#476471">ONE BIRD. TWO WHEELS. ZERO AERODYNAMICS.</text>

