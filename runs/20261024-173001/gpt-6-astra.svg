<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <style>
    .label{font-family:Arial,sans-serif;fill:#111}
    .line{stroke:#222;stroke-width:5;stroke-linecap:round}
    .arrow{stroke:#c62828;stroke-width:4;fill:none;marker-end:url(#arrowhead)}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- level seesaw -->
  <line x1="100" y1="190" x2="500" y2="190" class="line"/>
  <circle cx="300" cy="190" r="7" fill="#222"/>
  <path d="M270 270 L300 190 L330 270 Z" fill="#8ab4f8" stroke="#222" stroke-width="4"/>
  <line x1="240" y1="270" x2="360" y2="270" stroke="#222" stroke-width="5"/>

  <!-- masses -->
  <rect x="125" y="125" width="55" height="55" rx="6" fill="#607d8b" stroke="#222" stroke-width="3"/>
  <text x="152.5" y="160" text-anchor="middle" class="label" font-size="20" fill="white">6 kg</text>
  <line x1="152.5" y1="180" x2="152.5" y2="190" stroke="#222" stroke-width="3"/>

  <rect x="420" y="125" width="55" height="55" rx="6" fill="#607d8b" stroke="#222" stroke-width="3"/>
  <text x="447.5" y="160" text-anchor="middle" class="label" font-size="20" fill="white">4 kg</text>
  <line x1="447.5" y1="180" x2="447.5" y2="190" stroke="#222" stroke-width="3"/>

  <!-- force arrows -->
  <line x1="152.5" y1="105" x2="152.5" y2="175" class="arrow"/>
  <text x="152.5" y="92" text-anchor="middle" class="label" font-size="18" fill="#c62828">F = 6g</text>
  <line x1="447.5" y1="105" x2="447.5" y2="175" class="arrow"/>
  <text x="447.5" y="92" text-anchor="middle" class="label" font-size="18" fill="#c62828">F = 4g</text>

  <!-- distances -->
  <line x1="152.5" y1="220" x2="300" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="152.5" y1="214" x2="152.5" y2="226" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="214" x2="300" y2="226" stroke="#333" stroke-width="2"/>
  <text x="226" y="245" text-anchor="middle" class="label" font-size="20">2 m</text>

  <line x1="300" y1="220" x2="447.5" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="447.5" y1="214" x2="447.5" y2="226" stroke="#333" stroke-width="2"/>
  <text x="374" y="245" text-anchor="middle" class="label" font-size="20">x = 3 m</text>

  <text x="300" y="315" text-anchor="middle" class="label" font-size="26" font-weight="bold">6 × 2 = 4 × 3</text>
  <text x="300" y="350" text-anchor="middle" class="label" font-size="28" fill="#2e7d32" font-weight="bold">balanced</text>
</svg>