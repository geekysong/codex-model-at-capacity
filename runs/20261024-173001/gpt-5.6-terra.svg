<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b22222"/>
    </marker>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <text x="300" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#17365d">
    Level Seesaw — Static Equilibrium
  </text>

  <!-- Level beam -->
  <rect x="100" y="168" width="400" height="24" rx="5" fill="#c98b4a" stroke="#5b3a1e" stroke-width="3"/>
  <line x1="100" y1="180" x2="500" y2="180" stroke="#f3c98b" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,192 270,250 330,250" fill="#718096" stroke="#2d3748" stroke-width="3"/>
  <line x1="255" y1="250" x2="345" y2="250" stroke="#2d3748" stroke-width="5"/>
  <circle cx="300" cy="180" r="7" fill="#2d3748"/>

  <!-- Suspension lines -->
  <line x1="220" y1="192" x2="220" y2="245" stroke="#333" stroke-width="3"/>
  <line x1="420" y1="192" x2="420" y2="245" stroke="#333" stroke-width="3"/>

  <!-- Masses -->
  <rect x="188" y="245" width="64" height="48" rx="6" fill="#4f81bd" stroke="#1f4e79" stroke-width="3"/>
  <rect x="392" y="245" width="56" height="48" rx="6" fill="#70ad47" stroke="#38761d" stroke-width="3"/>
  <text x="220" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>
  <text x="420" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="220" y1="205" x2="220" y2="238" stroke="#b22222" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="420" y1="205" x2="420" y2="238" stroke="#b22222" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="220" y="220" text-anchor="end" dx="-10" font-family="Arial, sans-serif" font-size="16" fill="#b22222">F = 6g</text>
  <text x="420" y="220" text-anchor="start" dx="10" font-family="Arial, sans-serif" font-size="16" fill="#b22222">F = 4g</text>

  <!-- Distance dimensions -->
  <line x1="220" y1="325" x2="300" y2="325" stroke="#333" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="300" y1="325" x2="420" y2="325" stroke="#333" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <line x1="220" y1="300" x2="220" y2="335" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="300" x2="300" y2="335" stroke="#333" stroke-width="1.5"/>
  <line x1="420" y1="300" x2="420" y2="335" stroke="#333" stroke-width="1.5"/>
  <text x="260" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">2 m</text>
  <text x="360" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">x = 3 m</text>

  <!-- Torque equation and conclusion -->
  <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#17365d">
    6 × 2 = 4 × 3
  </text>
  <text x="300" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#228b22">
    BALANCED
  </text>
</svg>