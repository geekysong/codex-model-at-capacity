<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A determined pelican pedals a bicycle with an enormous pouch full of fish. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke: #203445; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #83939b; stroke-width: 3; }
    </style>
    <g id="wheel">
      <circle r="91" fill="#fffdf2" stroke="#203445" stroke-width="12"/>
      <circle r="79" fill="none" stroke="#edac45" stroke-width="3"/>
      <g class="spoke">
        <path d="M-78 0H78 M0-78V78 M-55-55L55 55 M-55 55L55-55"/>
      </g>
      <circle cx="0" cy="-79" r="6" fill="#ef704c"/>
      <circle r="10" fill="#203445"/>
    </g>
    <g id="fish">
      <path d="M-23 0Q-4-19 20 0Q-4 19-23 0L-35-12V12Z" fill="#71bdc1" stroke="#203445" stroke-width="3"/>
      <circle cx="10" cy="-2" r="3" fill="#203445"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7e4"/>
  <path d="M0 326Q160 295 315 327T800 320V485H0Z" fill="#d5e8d7"/>
  <circle cx="695" cy="160" r="43" fill="#f6c85a"/>
  <g fill="#fffdf5">
    <path d="M40 181Q40 157 65 159Q77 133 100 155Q129 147 135 181Z"/>
    <path d="M541 128Q542 108 563 111Q575 88 593 108Q618 103 623 128Z"/>
  </g>

  <text x="400" y="57" text-anchor="middle" font-size="43" font-weight="900" fill="#203445" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="87" text-anchor="middle" font-size="18" fill="#52636c">THE ONLY RIDER WITH A BUILT-IN LUNCH TRUCK.</text>

  <!-- A single coastal road -->
  <path d="M0 455H800V493H0Z" fill="#d8ccb7"/>
  <path d="M25 476H135M665 476H775" stroke="#fff7e4" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="406" cy="458" rx="275" ry="13" fill="#203445" opacity=".12"/>

  <!-- Roadside race sign -->
  <g class="ink">
    <path d="M88 294V447" fill="none" stroke="#8c7258"/>
    <path d="M32 249H145L163 276L145 303H32Z" fill="#fffdf2" stroke-width="3"/>
  </g>
  <text x="91" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#203445">FINISH LINE</text>
  <text x="91" y="290" text-anchor="middle" font-size="14" fill="#bd5539">FISH LINE?</text>

  <!-- Rotating wheels -->
  <g transform="translate(241 367)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(593 367)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g class="ink" fill="none">
    <path d="M241 367L321 272L393 367Z M321 272H539L393 367 M539 272L593 367" stroke="#203445" stroke-width="13"/>
    <path d="M241 367L321 272L393 367Z M321 272H539L393 367 M539 272L593 367" stroke="#ef704c" stroke-width="7"/>
    <path d="M321 272L309 246 M539 272L525 223L548 211H569"/>
    <path d="M287 246H334" stroke-width="12"/>
    <path d="M393 367L241 367" stroke-width="3"/>
  </g>

  <!-- Rider and pouch bob together, separate from stationary lettering -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" dur="1.7s" repeatCount="indefinite"/>
    <!-- Far leg -->
    <path d="M353 248L374 299L416 340" fill="none" stroke="#b47d30" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M353 248L374 299L416 340;M353 248L351 315L370 394;M353 248L374 299L416 340" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <!-- Tail and body -->
    <path class="ink" d="M300 214L254 196L273 229L247 228L288 252Z" fill="#fdfdf3"/>
    <path class="ink" d="M290 186Q330 158 391 184Q426 212 392 247Q348 275 294 247Q271 225 290 186Z" fill="#fffef5"/>
    <!-- Jersey -->
    <path class="ink" d="M307 183Q345 168 380 179L392 244Q353 267 310 250Z" fill="#62b6b3" stroke-width="3"/>
    <path d="M320 210H374V239H320Z" fill="#fff7e4"/>
    <text x="347" y="232" text-anchor="middle" font-size="23" font-weight="bold" fill="#203445">01</text>
    <!-- Curved neck -->
    <path class="ink" d="M377 199Q390 165 392 139Q394 113 423 115Q450 118 445 145L427 208Q416 235 391 240" fill="#fffef5"/>
    <!-- Huge throat pouch -->
    <path class="ink" d="M435 156L653 171Q628 246 558 259Q477 271 438 198Z" fill="#f3bc61"/>
    <path d="M455 179Q484 235 551 239Q608 237 634 188" fill="none" stroke="#d58e3e" stroke-width="3"/>
    <g transform="translate(500 205) rotate(16)"><use href="#fish"/></g>
    <g transform="translate(560 223) rotate(-12)"><use href="#fish"/></g>
    <g transform="translate(602 192) rotate(-22)"><use href="#fish"/></g>
    <!-- Long upper bill -->
    <path class="ink" d="M433 145Q539 138 671 166Q680 172 659 177L438 169Z" fill="#f4a445"/>
    <!-- Eye and attitude -->
    <circle cx="427" cy="135" r="9" fill="white" stroke="#203445" stroke-width="3"/>
    <circle cx="431" cy="136" r="4" fill="#203445"/>
    <path d="M416 120L437 124" stroke="#203445" stroke-width="5" stroke-linecap="round"/>
    <!-- Racing helmet -->
    <path class="ink" d="M386 119Q393 93 421 97Q446 99 451 120Z" fill="#ef704c" stroke-width="4"/>
    <path d="M404 103L400 113M420 102L418 113M434 107L436 114" stroke="#203445" stroke-width="4" stroke-linecap="round"/>
    <!-- Wing grips handlebars -->
    <path class="ink" d="M335 188Q367 181 409 212L525 216L533 228Q465 245 404 235Q365 226 335 208" fill="#fffef5"/>
    <path d="M352 200L397 220M359 211L388 225" fill="none" stroke="#9cacac" stroke-width="3" stroke-linecap="round"/>
    <!-- Near leg pedals -->
    <path d="M334 248L352 307L370 394" fill="none" stroke="#203445" stroke-width="17" stroke-linecap="round">
      <animate attributeName="d" values="M334 248L352 307L370 394;M334 248L392 284L416 340;M334 248L352 307L370 394" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M334 248L352 307L370 394" fill="none" stroke="#f4b54c" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" values="M334 248L352 307L370 394;M334 248L392 284L416 340;M334 248L352 307L370 394" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M357 393L388 394" stroke="#203445" stroke-width="9" stroke-linecap="round">
      <animate attributeName="d" values="M357 393L388 394;M403 339L434 340;M357 393L388 394" dur="1.7s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="393" cy="367" r="16" fill="#f4b54c" stroke="#203445" stroke-width="4"/>
  <g transform="translate(393 367)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.7s" repeatCount="indefinite"/>
      <path d="M-18 22L18-22" stroke="#203445" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Motion marks -->
  <path d="M156 329H181M135 345H172M146 362H168" fill="none" stroke="#52636c" stroke-width="4" stroke-linecap="round"/>

  <!-- Dedicated readable caption and timestamp footer -->
  <rect x="0" y="496" width="800" height="104" fill="#203445"/>
  <text x="400" y="530" text-anchor="middle" fill="#fff7e4" font-size="23" font-weight="bold">“I was told this was a low-carb commute.”</text>
  <text x="400" y="575" text-anchor="middle" fill="#fff7e4" font-size="18">2026-10-30 07:00:01 SGT (UTC+08:00)</text>
</svg>