<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A smug pelican rides a bicycle, pedaling past a sign that says “ROAD CLOSED TO FISH.”</desc>
  <style>
    text { font-family: system-ui, sans-serif; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center; animation: bob .6s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
  </style>

  <rect width="800" height="600" fill="#dff4f4"/>
  <circle cx="700" cy="110" r="48" fill="#ffd166"/>
  <path d="M0 365 Q145 300 280 358 T560 345 T800 350 V475 H0Z" fill="#a8d6a2"/>
  <path d="M0 420 H800 V550 H0Z" fill="#555b63"/>
  <path d="M0 432 H800" stroke="#f8e7a1" stroke-width="5" stroke-dasharray="36 26"/>
  <text x="400" y="62" text-anchor="middle" font-size="34" font-weight="900" fill="#16324f">THE PELICAN COMMUTE</text>
  <text x="400" y="94" text-anchor="middle" font-size="17" font-weight="600" fill="#31566b">“I’m cycling for the halibut.”</text>

  <!-- roadside gag -->
  <path d="M104 292 V414" stroke="#6b4b35" stroke-width="10"/>
  <rect x="32" y="244" width="146" height="70" rx="8" fill="#fff8dc" stroke="#263746" stroke-width="4"/>
  <text x="105" y="272" text-anchor="middle" font-size="14" font-weight="800" fill="#263746">ROAD CLOSED</text>
  <text x="105" y="294" text-anchor="middle" font-size="16" font-weight="900" fill="#d1495b">TO FISH</text>

  <!-- bicycle -->
  <g fill="none" stroke="#183b56" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g class="wheel">
      <circle cx="286" cy="438" r="54" stroke="#182a3a" stroke-width="6"/>
      <path d="M286 384V492 M232 438H340 M248 400L324 476 M324 400L248 476" stroke="#8fb3c8" stroke-width="2"/>
    </g>
    <g class="wheel">
      <circle cx="510" cy="438" r="54" stroke="#182a3a" stroke-width="6"/>
      <path d="M510 384V492 M456 438H564 M472 400L548 476 M548 400L472 476" stroke="#8fb3c8" stroke-width="2"/>
    </g>
    <path d="M286 438L365 438L332 370L286 438 M365 438L420 365L510 438 M332 370L420 365"/>
    <path d="M320 365H347 M412 356L426 356 M510 438L532 414"/>
    <circle cx="365" cy="438" r="13" fill="#f2a541" stroke="#183b56"/>
    <path d="M365 438L386 458 M365 438L346 455" stroke="#f2a541" stroke-width="6"/>
  </g>

  <!-- expressive pelican and pedaling legs -->
  <g class="rider">
    <!-- tail feathers -->
    <path d="M346 262 Q307 248 302 270 Q322 282 350 278" fill="#f4f1e8" stroke="#263746" stroke-width="4"/>
    <!-- body -->
    <ellipse cx="396" cy="274" rx="58" ry="72" fill="#f8f6ed" stroke="#263746" stroke-width="4"/>
    <path d="M372 304 Q396 286 422 304 Q415 342 393 345 Q375 338 372 304" fill="#f2a541" stroke="#263746" stroke-width="3"/>
    <!-- neck -->
    <path d="M424 271 Q444 239 428 202 Q421 184 434 169" fill="none" stroke="#f8f6ed" stroke-width="25" stroke-linecap="round"/>
    <path d="M424 271 Q444 239 428 202 Q421 184 434 169" fill="none" stroke="#263746" stroke-width="4" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="435" cy="161" r="32" fill="#f8f6ed" stroke="#263746" stroke-width="4"/>
    <path d="M450 166 Q498 165 536 181 Q516 194 468 185 Q448 182 435 174Z" fill="#f2a541" stroke="#263746" stroke-width="4"/>
    <path d="M468 183 Q501 193 526 184 Q511 209 474 198Z" fill="#e97853" stroke="#263746" stroke-width="3"/>
    <circle cx="445" cy="153" r="5" fill="#182a3a"/>
    <path d="M439 142 Q451 135 460 143" fill="none" stroke="#263746" stroke-width="3" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M405 150 Q413 116 444 119 Q466 121 472 146Z" fill="#ef476f" stroke="#263746" stroke-width="4"/>
    <path d="M403 150 Q440 145 471 151" fill="none" stroke="#263746" stroke-width="5" stroke-linecap="round"/>
    <!-- wings -->
    <path d="M365 248 Q337 259 349 287 Q370 292 391 271Z" fill="#e6e2d8" stroke="#263746" stroke-width="3"/>
    <path d="M355 269L380 268 M359 279L378 275" stroke="#b7b3aa" stroke-width="2"/>
    <!-- legs in cycling pose -->
    <path d="M390 335 Q393 369 366 389 L365 433 M416 334 Q425 359 445 374 L375 438" fill="none" stroke="#e97853" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M353 434L373 434 M368 440L388 440" stroke="#263746" stroke-width="6" stroke-linecap="round"/>
    <!-- wing on handlebars -->
    <path d="M438 252 Q463 246 478 266 L510 283" fill="none" stroke="#f8f6ed" stroke-width="14" stroke-linecap="round"/>
    <path d="M438 252 Q463 246 478 266 L510 283" fill="none" stroke="#263746" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="546" y="321" font-size="17" font-weight="800" fill="#16324f" transform="rotate(8 546 321)">HONK IF YOU'RE A</text>
  <text x="567" y="343" font-size="17" font-weight="800" fill="#16324f" transform="rotate(8 567 343)">SARDINE!</text>

  <rect x="0" y="550" width="800" height="50" fill="#16324f"/>
  <text x="400" y="582" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2026-10-30 07:02:28 SGT (UTC+08:00)</text>
</svg>