        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
      </g>
      <circle r="9" fill="#ffcc50" stroke="#233342" stroke-width="3"/>
      <path d="M37-47L46-39" stroke="#ff7855" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#paper)"/>
