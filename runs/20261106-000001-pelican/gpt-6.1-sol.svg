      <rect width="24" height="24" fill="#fff5dc"/>
      <circle cx="4" cy="7" r="1" fill="#e9dabc" opacity=".45"/>
      <circle cx="18" cy="20" r=".8" fill="#e9dabc" opacity=".45"/>
    </pattern>
    <g id="wheel">
      <circle r="68" fill="#fff8e9" stroke="#233342" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#d5a66b" stroke-width="2"/>
