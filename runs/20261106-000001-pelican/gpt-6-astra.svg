<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican cycles along the waterfront with a fish in its enormous bill pouch. Wheels spin and its body bobs as it pedals. Caption: Why fly economy when you can pedal first class?</desc>
  <defs>
    <pattern id="spokes" width="1" height="1" patternContentUnits="objectBoundingBox">
      <path d="M0 .5H1M.5 0V1M.146 .146L.854 .854M.146 .854L.854 .146" fill="none" stroke="#718994" stroke-width=".018"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke: #20343f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #20343f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Poster and waterfront -->
  <path fill="#fff6dc" d="M0 0H800V600H0z"/>
  <path fill="#c4e8e8" d="M22 115Q22 105 32 105H768Q778 105 778 115V461H22Z"/>
  <circle cx="689" cy="164" r="35" fill="#ffc756"/>
  <path d="M32 294Q151 278 263 295T488 295T778 293V414H22Z" fill="#85c9d2"/>
  <path d="M48 319h71m33 24h100m355-23h92m-56 37h95" stroke="#e2f6ed" stroke-width="4" stroke-linecap="round"/>
  <path d="M36 219q18-17 36 0m0 0q18-17 36 0m503 31q14-13 28 0m0 0q14-13 28 0" fill="none" stroke="#608d98" stroke-width="3"/>
  <path fill="#d8c7a0" d="M22 403H778V482H22Z"/>
  <path d="M23 462H777" stroke="#a5977d" stroke-width="3"/>
  <path d="M55 436h42m580 15h69M61 468h103" stroke="#fff6dc" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="64" text-anchor="middle" font-size="49" font-weight="900" letter-spacing="3" fill="#20343f">TOUR DE BEAK</text>
  <text x="400" y="91" text-anchor="middle" font-size="17" font-weight="bold" letter-spacing="2" fill="#926245">ZERO EMISSIONS. MASSIVE CARRY-ON.</text>

  <!-- Tiny municipal sign -->
  <path d="M98 355V405" class="thin" fill="none"/>
  <rect x="40" y="289" width="118" height="68" rx="7" fill="#fff9e8" class="thin"/>
  <text x="99" y="311" text-anchor="middle" font-size="13" font-weight="bold" fill="#20343f">BIKE LANE</text>
  <text x="99" y="330" text-anchor="middle" font-size="12" fill="#20343f">NO WIDE LOADS</text>
  <path d="M47 342L149 319" stroke="#de6148" stroke-width="3"/>

  <!-- Bicycle shadow -->
  <ellipse cx="408" cy="454" rx="235" ry="13" fill="#a99c80" opacity=".45"/>

  <!-- Wheels: rotating spokes inside stationary tires -->
  <g>
    <circle cx="250" cy="388" r="66" fill="#f2ead0" class="ink"/>
    <g>
      <circle cx="250" cy="388" r="59" fill="url(#spokes)"/>
      <path d="M250 329A59 59 0 0 1 279.5 337" fill="none" stroke="#efaa38" stroke-width="6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 388" to="360 250 388" dur="1.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="250" cy="388" r="66" fill="none" stroke="#20343f" stroke-width="9"/>
    <circle cx="250" cy="388" r="58" fill="none" stroke="#fff8e1" stroke-width="3"/>
  </g>
  <g>
    <circle cx="566" cy="388" r="66" fill="#f2ead0" class="ink"/>
    <g>
      <circle cx="566" cy="388" r="59" fill="url(#spokes)"/>
      <path d="M566 329A59 59 0 0 1 595.5 337" fill="none" stroke="#efaa38" stroke-width="6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 566 388" to="360 566 388" dur="1.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="566" cy="388" r="66" fill="none" stroke="#20343f" stroke-width="9"/>
    <circle cx="566" cy="388" r="58" fill="none" stroke="#fff8e1" stroke-width="3"/>
  </g>

  <!-- Frame -->
  <path d="M250 388L322 287L391 388ZM322 287H502L391 388M502 287L566 388M502 287L490 260" fill="none" stroke="#20343f" stroke-width="12" stroke-linejoin="round"/>
  <path d="M250 388L322 287L391 388ZM322 287H502L391 388M502 287L566 388" fill="none" stroke="#df5a49" stroke-width="7" stroke-linejoin="round"/>
  <path d="M322 287L315 269M490 261L503 240H532" class="ink" fill="none"/>
  <path d="M291 267Q316 258 340 267" fill="none" stroke="#20343f" stroke-width="12" stroke-linecap="round"/>
  <path d="M530 239q15 0 10 15" class="ink" fill="none"/>
  <circle cx="516" cy="233" r="8" fill="#ffc756" class="thin"/>
  <path d="M535 261Q596 281 575 346" fill="none" stroke="#20343f" stroke-width="2"/>
  <circle cx="250" cy="388" r="7" fill="#20343f"/>
  <circle cx="566" cy="388" r="7" fill="#20343f"/>
  <path d="M251 380L387 371Q413 371 413 389T387 406L250 395" fill="none" stroke="#54646a" stroke-width="3"/>
  <circle cx="391" cy="388" r="18" fill="#ffc756" class="thin"/>
  <g>
    <path d="M369 368L413 408" class="ink"/>
    <path d="M358 368H380M402 408H424" class="ink"/>
    <animateTransform attributeName="transform" type="rotate" from="0 391 388" to="360 391 388" dur="1.8s" repeatCount="indefinite"/>
  </g>

  <!-- Pelican, bobbing over the saddle -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>

    <!-- Pedaling legs -->
    <path d="M347 265L365 313L410 366" fill="none" stroke="#20343f" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M347 265L365 313L410 366;M347 265L399 322L374 405;M347 265L365 313L410 366" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M347 265L365 313L410 366" fill="none" stroke="#edaa41" stroke-width="7" stroke-linecap="round">
      <animate attributeName="d" values="M347 265L365 313L410 366;M347 265L399 322L374 405;M347 265L365 313L410 366" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M321 265L315 328L373 402" fill="none" stroke="#20343f" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M321 265L315 328L373 402;M321 265L349 309L409 366;M321 265L315 328L373 402" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M321 265L315 328L373 402" fill="none" stroke="#ffc756" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" values="M321 265L315 328L373 402;M321 265L349 309L409 366;M321 265L315 328L373 402" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- Tail and rounded body -->
    <path d="M265 235L213 213L229 246L207 242Q242 277 279 263" fill="#faf9ed" class="ink"/>
    <path d="M258 218Q281 183 343 204Q369 208 381 182L403 155Q426 151 437 171Q445 200 416 224Q400 240 391 259Q364 286 310 276Q260 269 258 218Z" fill="#fffdf0" class="ink"/>
    <path d="M277 226Q300 206 359 232Q343 269 300 255L289 245L317 248L296 236L330 241" fill="#d1dfdc" class="thin"/>

    <!-- Long neck -->
    <path d="M375 217Q397 192 389 169Q372 137 398 124Q429 112 448 137Q459 154 444 181L426 216" fill="#fffdf0" class="ink"/>

    <!-- Vast bill and elastic pouch -->
    <path d="M437 156L620 169Q586 241 504 232Q461 228 437 174Z" fill="#f3ad58" class="ink"/>
    <path d="M453 177Q499 224 573 193" fill="none" stroke="#d48639" stroke-width="3"/>

    <!-- Fish passenger -->
    <path d="M502 202L488 190L488 214Z" fill="#5c9f9e" class="thin"/>
    <ellipse cx="525" cy="202" rx="27" ry="13" fill="#87c9be" class="thin"/>
    <circle cx="539" cy="198" r="3" fill="#20343f"/>
    <path d="M520 191L526 185L532 190M548 205l-7 2" class="thin" fill="none"/>
    <path d="M443 150L626 163Q637 167 619 174L443 173Z" fill="#ffce58" class="ink"/>

    <!-- Face and cycling helmet -->
    <circle cx="424" cy="144" r="12" fill="white" class="thin"/>
    <circle cx="429" cy="143" r="4" fill="#20343f"/>
    <path d="M415 127L433 131" class="thin" fill="none"/>
    <path d="M383 128Q389 99 417 103Q447 103 451 127Z" fill="#e45f4b" class="ink"/>
    <path d="M400 111L396 122M415 109L413 122M429 112L431 122" class="thin" fill="none"/>
    <path d="M389 130L401 157L414 161" class="thin" fill="none"/>

    <!-- Wing reaching the bars -->
    <path d="M358 222Q389 223 428 241L507 236Q515 241 505 247L427 253Q391 250 366 239" fill="#fffdf0" class="ink"/>
    <path d="M488 240l7 7m1-9 7 8" class="thin" fill="none"/>
    <path d="M371 185L349 191L363 204L381 197Z" fill="#df5a49"/>
    <path d="M353 191Q326 177 308 190L328 193L310 205Q335 205 362 198" fill="#df5a49" class="thin"/>
  </g>

  <!-- Fish's complaint, well away from title and bill -->
  <path d="M635 207H747Q758 207 758 218V269Q758 280 747 280H635Q624 280 624 269V244L595 229L624 233V218Q624 207 635 207Z" fill="#fffdf0" class="thin"/>
  <text x="691" y="230" text-anchor="middle" font-size="15" font-weight="bold" fill="#20343f">“I paid for</text>
  <text x="691" y="251" text-anchor="middle" font-size="15" font-weight="bold" fill="#20343f">a SEA view.”</text>

  <!-- Reserved caption and timestamp footer -->
  <path d="M22 491H778" stroke="#20343f" stroke-width="2"/>
  <text x="400" y="523" text-anchor="middle" font-size="23" font-weight="bold" fill="#20343f">Why fly economy when you can pedal first class?</text>
  <rect x="22" y="544" width="756" height="40" rx="6" fill="#20343f"/>
  <text x="400" y="570" text-anchor="middle" font-size="18" fill="#fff6dc">2026-11-06 00:00:01 SGT (UTC+08:00)</text>
</svg>