<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Express</title>
  <desc id="desc">A cheerful pelican rides a bicycle with a fish in its enormous bill. The wheels spin and the pelican bobs as it pedals.</desc>
  <defs>
    <pattern id="spokes" width="100" height="100" patternUnits="userSpaceOnUse"/>
    <style>
      .ink{stroke:#263348;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#263348;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
      .rider{animation:bob .7s ease-in-out infinite alternate}
      .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.4s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
      @media (prefers-reduced-motion:reduce){.wheel,.rider,.pedal{animation:none}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#f7efd9"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#fffaf0" stroke="#263348" stroke-width="4"/>
  <path d="M22 45 Q22 22 45 22 H755 Q778 22 778 45 V112 H22Z" fill="#f7c85b"/>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="43" letter-spacing="2" fill="#263348">PELICAN EXPRESS</text>

  <rect x="40" y="125" width="720" height="325" rx="18" fill="#b9e4e6"/>
  <circle cx="665" cy="180" r="34" fill="#ffd56b"/>
  <path d="M82 188 q18-20 36 0 q18-20 36 0 M590 235 q12-13 24 0 q12-13 24 0" fill="none" stroke="#6caab1" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 358 Q150 335 250 354 T460 351 T760 353 V450 H40Z" fill="#8fc9aa"/>
  <path d="M40 404 Q210 390 350 405 T760 400 V450 H40Z" fill="#dfba80"/>
  <path d="M45 429 H755" stroke="#263348" stroke-width="4" stroke-linecap="round"/>
  <path d="M96 389 h48 M65 402 h30 M130 416 h42" stroke="#fffaf0" stroke-width="5" stroke-linecap="round" opacity=".8"/>

  <!-- Bicycle wheels -->
  <g class="wheel">
    <circle cx="252" cy="374" r="67" fill="#fffaf0" class="ink"/>
    <circle cx="252" cy="374" r="56" fill="none" stroke="#d86b56" stroke-width="4"/>
    <path d="M252 318 V430 M196 374 H308 M212 334 L292 414 M212 414 L292 334" fill="none" stroke="#84909a" stroke-width="3"/>
    <circle cx="252" cy="374" r="7" fill="#263348"/>
  </g>
  <g class="wheel">
    <circle cx="548" cy="374" r="67" fill="#fffaf0" class="ink"/>
    <circle cx="548" cy="374" r="56" fill="none" stroke="#d86b56" stroke-width="4"/>
    <path d="M548 318 V430 M492 374 H604 M508 334 L588 414 M508 414 L588 334" fill="none" stroke="#84909a" stroke-width="3"/>
    <circle cx="548" cy="374" r="7" fill="#263348"/>
  </g>

  <!-- Bicycle frame -->
  <path d="M252 374 L324 293 L390 374 Z M324 293 L477 298 L390 374 M477 298 L548 374 M468 281 L484 315" fill="none" stroke="#d95d4d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M252 374 L324 293 L390 374 Z M324 293 L477 298 L390 374 M477 298 L548 374" fill="none" stroke="#263348" stroke-width="2" stroke-linejoin="round"/>
  <path d="M312 281 H342" fill="none" class="ink"/>
  <path d="M474 286 L470 264 Q469 255 480 255 H499" fill="none" class="ink"/>
  <path d="M496 252 h18" fill="none" stroke="#d95d4d" stroke-width="8" stroke-linecap="round"/>
  <circle cx="390" cy="374" r="15" fill="#f7c85b" class="thin"/>
  <g class="pedal">
    <path d="M390 374 l20 18 M390 374 l-20-18" class="thin" fill="none"/>
    <path d="M402 394 h17 M361 354 h17" stroke="#263348" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Rider -->
  <g class="rider">
    <path d="M337 275 Q328 311 360 333 L382 364" fill="none" stroke="#e7a13c" stroke-width="9" stroke-linecap="round"/>
    <path d="M381 364 l20 3" fill="none" stroke="#263348" stroke-width="7" stroke-linecap="round"/>
    <path d="M367 270 Q401 294 398 324 L420 343" fill="none" stroke="#e7a13c" stroke-width="9" stroke-linecap="round"/>
    <path d="M416 344 l19 2" fill="none" stroke="#263348" stroke-width="7" stroke-linecap="round"/>
    <path d="M291 222 Q292 183 338 177 Q382 173 402 205 Q421 236 394 268 Q369 296 324 279 Q291 267 291 222Z" fill="#fffdf6" class="ink"/>
    <path d="M305 231 Q318 200 365 213 Q390 219 391 243 Q367 265 335 257 Q315 252 305 231Z" fill="#dce9e5" class="thin"/>
    <path d="M298 218 l-25-19 l8 28 l-22 4 l35 16" fill="#fffdf6" class="ink"/>
    <path d="M378 213 Q397 197 407 169 Q417 140 446 143 Q471 146 472 170 Q473 190 454 200 L427 220" fill="#fffdf6" class="ink"/>
    <path d="M422 166 Q445 154 466 164 L558 183 Q563 187 553 193 L468 207 Q439 211 425 190Z" fill="#f4ad43" class="ink"/>
    <path d="M425 190 Q448 241 501 223 Q534 212 553 193 Q488 203 425 190Z" fill="#f6cb77" class="ink"/>
    <path d="M454 190 Q484 192 514 188" fill="none" stroke="#c77635" stroke-width="3" stroke-linecap="round"/>
    <circle cx="451" cy="166" r="11" fill="#fff" class="thin"/>
    <circle cx="455" cy="167" r="4" fill="#263348"/>
    <path d="M439 149 Q452 142 463 151" fill="none" class="thin"/>
    <path d="M433 143 Q436 124 453 125 Q465 126 468 138Z" fill="#d95d4d" class="thin"/>
    <path d="M424 143 Q446 139 475 145" fill="none" stroke="#263348" stroke-width="5" stroke-linecap="round"/>
    <path d="M384 242 Q410 252 436 245 L478 260" fill="none" stroke="#fffdf6" stroke-width="15" stroke-linecap="round"/>
    <path d="M384 242 Q410 252 436 245 L478 260" fill="none" stroke="#263348" stroke-width="3" stroke-linecap="round"/>
    <path d="M472 258 q8-7 15 1" fill="none" class="thin"/>
    <!-- Fish peeking out of the pouch -->
    <path d="M479 211 Q492 200 507 211 Q493 220 479 211Z" fill="#80bec8" class="thin"/>
    <path d="M479 211 l-9-7 v14Z" fill="#80bec8" class="thin"/>
    <circle cx="501" cy="210" r="2" fill="#263348"/>
  </g>

  <path d="M625 319 l12-12 M635 337 l17-2 M610 304 l2-16" stroke="#263348" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="491" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#263348">“Two wheels. One very questionable lunch.”</text>
  <path d="M50 516 H750" stroke="#d8cdb6" stroke-width="2"/>
  <text x="400" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4e5966">2026-11-06 00:04:20 SGT (UTC+08:00)</text>
</svg>