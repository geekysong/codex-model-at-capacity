<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Patrol</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly claiming it is traffic enforcement.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b66"/>
      <stop offset="1" stop-color="#292d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#263238" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17212b;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
      .wheel{fill:none;stroke:#17212b;stroke-width:9}
      .spoke{stroke:#17212b;stroke-width:3}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="100" r="48" fill="#fff5b5" opacity=".85"/>
  <path d="M0 300 Q130 245 260 300 T520 300 T800 285 L800 430 L0 430Z" fill="#9bd38b"/>
  <path d="M0 390 Q180 350 360 390 T800 375 L800 600 L0 600Z" fill="url(#road)"/>
  <path d="M0 485 H800" stroke="#f7d34a" stroke-width="9" stroke-dasharray="48 28" opacity=".9"/>

  <g filter="url(#shadow)">
    <rect x="44" y="34" width="385" height="76" rx="20" fill="#fff" class="ink"/>
    <text x="68" y="84" class="label" font-size="34" font-weight="900">PELICAN PEDAL PATROL</text>
  </g>

  <g transform="translate(0 4)">
    <ellipse cx="410" cy="375" rx="178" ry="24" fill="#111923" opacity=".28"/>

    <g id="bike">
      <g id="rearWheel">
        <circle cx="255" cy="402" r="76" class="wheel" fill="#dce6ed"/>
        <circle cx="255" cy="402" r="10" fill="#f05b4f" class="ink"/>
        <g class="spoke">
          <path d="M255 326V478M179 402H331M201 348L309 456M309 348L201 456"/>
        </g>
      </g>
      <g id="frontWheel">
        <circle cx="560" cy="402" r="76" class="wheel" fill="#dce6ed"/>
        <circle cx="560" cy="402" r="10" fill="#f05b4f" class="ink"/>
        <g class="spoke">
          <path d="M560 326V478M484 402H636M506 348L614 456M614 348L506 456"/>
        </g>
      </g>
      <path d="M255 402 L350 300 L470 402 L255 402 L420 402 L350 300 L560 402" fill="none" class="ink"/>
      <path d="M470 402 L505 300 L560 402" fill="none" class="ink"/>
      <path d="M493 301 L535 301" class="ink"/>
      <path d="M338 300 L319 280" class="ink"/>
      <path d="M304 280 H347" class="ink"/>
      <circle cx="420" cy="402" r="18" fill="#f05b4f" class="ink"/>
      <path d="M420 402 L388 370 M420 402 L450 432" class="ink"/>
      <path d="M382 365 H365 M448 437 H465" class="ink"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1s" repeatCount="indefinite"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1s" repeatCount="indefinite"/>
      <ellipse cx="390" cy="250" rx="94" ry="105" fill="#f4f0dc" class="ink"/>
      <path d="M331 264 Q276 288 294 352 Q328 325 374 294Z" fill="#d7d8c5" class="ink"/>
      <path d="M306 291 Q350 309 374 294" fill="none" class="ink"/>
      <ellipse cx="414" cy="146" rx="76" ry="70" fill="#f4f0dc" class="ink"/>
      <path d="M454 150 Q585 154 618 195 Q588 224 454 190 Q430 180 454 150Z" fill="#f5a84b" class="ink"/>
      <path d="M458 190 Q535 214 600 195" fill="none" stroke="#d77a2e" stroke-width="6"/>
      <circle cx="438" cy="135" r="12" fill="#17212b"/>
      <circle cx="442" cy="131" r="4" fill="#fff"/>
      <path d="M374 104 Q408 76 450 101" fill="none" class="ink"/>
      <path d="M352 209 Q302 232 302 284" fill="none" class="ink"/>
      <path d="M441 230 Q494 250 510 302" fill="none" class="ink"/>
      <path d="M350 335 Q366 365 390 392" fill="none" class="ink"/>
      <path d="M426 337 Q414 370 401 398" fill="none" class="ink"/>
      <path d="M384 391 L415 391 M395 398 L425 398" class="ink"/>
      <path d="M384 391 L365 410 M415 391 L438 410" class="ink"/>
      <path d="M363 410 H347 M438 410 H454" class="ink"/>
      <path d="M365 408 L390 370" fill="none" stroke="#f05b4f" stroke-width="8"/>
      <path d="M438 409 L414 370" fill="none" stroke="#f05b4f" stroke-width="8"/>
      <path d="M365 408 L390 370 M438 409 L414 370" fill="none" stroke="#17212b" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" values="-18 402 389;18 402 389;-18 402 389" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M330 225 Q295 185 326 160" fill="none" stroke="#f05b4f" stroke-width="12"/>
      <path d="M323 162 Q356 171 359 196" fill="none" stroke="#17212b" stroke-width="6"/>
    </g>

    <g transform="translate(512 245) rotate(8)">
      <rect x="0" y="0" width="150" height="58" rx="12" fill="#ffec72" class="ink"/>
      <path d="M20 58 L36 78 L48 58" fill="#ffec72" class="ink"/>
      <text x="18" y="25" class="label" font-size="17" font-weight="800">HONK IF YOU</text>
      <text x="18" y="47" class="label" font-size="17" font-weight="800">FEAR BEAK LAW</text>
    </g>

    <g transform="translate(95 178)">
      <path d="M0 0 q35 -28 70 0" fill="none" stroke="#17212b" stroke-width="6"/>
      <text x="0" y="-10" class="label" font-size="20" font-weight="700">I OWN THE ROAD!</text>
    </g>
  </g>

  <text x="400" y="545" text-anchor="middle" class="label" font-size="23" font-weight="700">
    “A bird with a bike has two wheels and absolutely no brakes on the ego.”
  </text>
  <text x="400" y="580" text-anchor="middle" class="label" font-size="18">
    2026-10-28 08:30:33 SGT (UTC+08:00)
  </text>
</svg>