<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="50" y="28" font-size="17" font-weight="bold">Projectile motion</text>
    <text x="50" y="52">vₓ = 20 m/s · vᵧ₀ = 15 m/s · g = 10 m/s²</text>
    <text x="50" y="75">Total flight time: 3 s · No air resistance</text>
    <text x="50" y="101">Scale: 10 px/m; horizontal axis break omits 20 m.</text>
    <text x="50" y="122">Without a break, landing would be at x = 700 px, off canvas.</text>
  </g>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#374151" stroke-width="2"/>

  <!-- x = 100 + 200t, y = 350 − 150t + 50t².
       The final segment is translated left by 200 px across an axis break. -->
