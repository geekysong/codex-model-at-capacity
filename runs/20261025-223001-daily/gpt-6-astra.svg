        fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M400 237.5 Q410 237.5 420 238"
        fill="none" stroke="#2563eb" stroke-width="3"/>
  <path d="M440 309.5 Q470 327.5 500 350"
        fill="none" stroke="#2563eb" stroke-width="3"/>

  <g stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="426" y1="229" x2="426" y2="340"/>
    <line x1="434" y1="229" x2="434" y2="340"/>
  </g>
  <path d="M420 355 L426 345 L432 355 L438 345"
        fill="none" stroke="white" stroke-width="6"/>
  <path d="M420 355 L426 345 L432 355 L438 345"
        fill="none" stroke="#374151" stroke-width="2"/>

  <g fill="#2563eb">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="50" y="318">launch:</text>
    <text x="50" y="335">0 m, 0 m</text>
    <text x="310" y="214">apex: 30 m, 11.25 m</text>
    <text x="462" y="291">landing:</text>
    <text x="462" y="308">60 m, 0 m</text>
