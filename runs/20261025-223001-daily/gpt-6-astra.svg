  <rect x="0" y="369" width="600" height="31" fill="#f1f5f9"/>
  <text x="300" y="389" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="13" fill="#172033">2026-10-25 22:33:29 SGT (UTC+08:00)</text>
</svg>