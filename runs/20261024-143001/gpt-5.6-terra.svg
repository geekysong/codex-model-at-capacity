<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <style>
    .label{font-family:Arial,sans-serif;fill:#111;text-anchor:middle}
    .line{stroke:#111;stroke-width:4;fill:none}
    .thin{stroke:#333;stroke-width:2;fill:none}
    .mass{fill:#9ecae1;stroke:#174a63;stroke-width:3}
    .arrow{stroke:#c0392b;stroke-width:3;fill:none}
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="300" y="38" class="label" font-size="26" font-weight="bold">Balanced seesaw</text>

  <!-- level beam -->
  <rect x="85" y="178" width="430" height="16" rx="5" fill="#c98b4b" stroke="#6e431f" stroke-width="3"/>
  <line x1="85" y1="186" x2="515" y2="186" stroke="#f3c27b" stroke-width="3"/>

  <!-- pivot -->
  <path d="M278 194 L322 194 L300 250 Z" fill="#777" stroke="#333" stroke-width="3"/>
  <circle cx="300" cy="186" r="7" fill="#333"/>
  <text x="300" y="275" class="label" font-size="18">pivot</text>

  <!-- left rope and mass -->
  <line x1="170" y1="194" x2="170" y2="270" class="thin"/>
  <rect x="135" y="270" width="70" height="48" rx="6" class="mass"/>
  <text x="170" y="300" class="label" font-size="20" font-weight="bold">6 kg</text>

  <!-- right rope and mass -->
  <line x1="430" y1="194" x2="430" y2="270" class="thin"/>
  <rect x="395" y="270" width="70" height="48" rx="6" class="mass"/>
  <text x="430" y="300" class="label" font-size="20" font-weight="bold">4 kg</text>

  <!-- force arrows -->
  <line x1="170" y1="260" x2="170" y2="215" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="170" y="345" class="label" font-size="17" fill="#c0392b">downward force</text>
  <line x1="430" y1="260" x2="430" y2="215" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="430" y="345" class="label" font-size="17" fill="#c0392b">downward force</text>

  <!-- distance dimensions -->
  <line x1="170" y1="145" x2="300" y2="145" class="thin"/>
  <line x1="170" y1="137" x2="170" y2="153" class="thin"/>
  <line x1="300" y1="137" x2="300" y2="153" class="thin"/>
  <text x="235" y="132" class="label" font-size="19">2 m</text>

  <line x1="300" y1="145" x2="430" y2="145" class="thin"/>
  <line x1="430" y1="137" x2="430" y2="153" class="thin"/>
  <text x="365" y="132" class="label" font-size="19">x = 3 m</text>

  <!-- equation -->
  <text x="300" y="380" class="label" font-size="22" font-weight="bold">6 × 2 = 4 × 3</text>
</svg>