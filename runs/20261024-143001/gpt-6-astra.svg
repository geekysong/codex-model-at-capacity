<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4e79"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="90" y="170" width="420" height="16" rx="5" fill="#8b5a2b"/>
  <line x1="300" y1="150" x2="300" y2="205" stroke="#333" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,205 270,260 330,260" fill="#777" stroke="#333" stroke-width="3"/>
  <text x="300" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">pivot</text>

  <!-- Left hanging mass -->
  <line x1="150" y1="186" x2="150" y2="245" stroke="#333" stroke-width="3"/>
  <rect x="120" y="245" width="60" height="48" rx="5" fill="#d9534f" stroke="#8b1e1e" stroke-width="2"/>
  <text x="150" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">6 kg</text>

  <!-- Right hanging mass -->
  <line x1="450" y1="186" x2="450" y2="245" stroke="#333" stroke-width="3"/>
  <rect x="420" y="245" width="60" height="48" rx="5" fill="#4f81bd" stroke="#1f4e79" stroke-width="2"/>
  <text x="450" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="215" x2="150" y2="242" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="150" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f4e79">force ↓</text>

  <line x1="450" y1="215" x2="450" y2="242" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f4e79">force ↓</text>

  <!-- Distance labels -->
  <line x1="150" y1="135" x2="300" y2="135" stroke="#555" stroke-width="2"/>
  <line x1="150" y1="128" x2="150" y2="142" stroke="#555" stroke-width="2"/>
  <line x1="300" y1="128" x2="300" y2="142" stroke="#555" stroke-width="2"/>
  <text x="225" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">2 m</text>

  <line x1="300" y1="105" x2="450" y2="105" stroke="#555" stroke-width="2"/>
  <line x1="300" y1="98" x2="300" y2="112" stroke="#555" stroke-width="2"/>
  <line x1="450" y1="98" x2="450" y2="112" stroke="#555" stroke-width="2"/>
  <text x="375" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#333">x = 3 m</text>

  <!-- Equation and result -->
  <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#222">
    6 × 2 = 4 × 3
  </text>
  <text x="300" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#218739">
    balanced
  </text>
</svg>