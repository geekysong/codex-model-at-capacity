    <path d="M368 119Q365 91 395 91Q424 89 435 118Z" fill="#ef6950" stroke="#253c47" stroke-width="4"/>
    <path d="M386 98L383 113M402 97L405 113M416 101L421 113" stroke="#fff6db" stroke-width="5" stroke-linecap="round"/>
    <path d="M374 121L383 143L395 148" fill="none" stroke="#253c47" stroke-width="3"/>
