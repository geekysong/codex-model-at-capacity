<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A determined pelican pedals a bicycle with a huge beak full of fish past a no-fishing sign. The wheels spin, the pedals turn, and the pelican bobs continuously.</desc>
