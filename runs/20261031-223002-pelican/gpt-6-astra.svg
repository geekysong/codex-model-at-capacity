  <rect x="0" y="486" width="800" height="114" fill="#fff6db"/>
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#253c47">One pelican. Two wheels. A very fishy commute.</text>
  <path d="M70 542H730" stroke="#c5bda5" stroke-width="1.5"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#465b60">2026-10-31 22:30:02 SGT (UTC+08:00)</text>
