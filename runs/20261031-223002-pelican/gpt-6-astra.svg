  <g font-family="Arial, sans-serif" fill="#253c47">
    <path d="M65 125H260Q273 125 273 138V189Q273 202 260 202H214L234 222L192 202H65Q52 202 52 189V138Q52 125 65 125Z" fill="#fffef5" stroke="#253c47" stroke-width="3"/>
    <text x="162" y="155" text-anchor="middle" font-size="19" font-weight="bold">“It's called</text>
    <text x="162" y="181" text-anchor="middle" font-size="19" font-weight="bold">a bill of lading.”</text>
