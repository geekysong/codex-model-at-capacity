  <text x="400" y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="3" fill="#253c47">TOUR DE FISH</text>
  <text x="400" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#54716e">THE COMMUTE. THE CATCH. THE AUDACITY.</text>

