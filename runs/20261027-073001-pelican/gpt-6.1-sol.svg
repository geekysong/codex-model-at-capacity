<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>The Pelican Express</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f0"/>
      <stop offset="1" stop-color="#e8f8d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="54" fill="#ffd76a"/>
  <path d="M0 390 Q130 330 260 390 T520 385 T800 380 V600 H0Z" fill="#8acb72"/>
  <path d="M0 455 Q180 420 360 455 T800 445" fill="none" stroke="#4e9b5d" stroke-width="12"/>
  <path d="M0 510 Q180 480 360 510 T800 500" fill="none" stroke="#3d874f" stroke-width="8"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#173b4d" stroke="#ffffff" stroke-width="3" paint-order="stroke">
    THE PELICAN EXPRESS
  </text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#244b55">
    “Why fly when you can pedal like a government committee?”
  </text>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <g transform="translate(0,0)">
      <g transform="translate(245 432)">
        <circle r="72" fill="#eaf5f2" stroke="#173b4d" stroke-width="8"/>
        <g stroke="#76aab0" stroke-width="2">
          <path d="M-72 0H72M0-72V72M-51-51L51 51M51-51L-51 51"/>
        </g>
        <circle r="10" fill="#173b4d"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
          <path d="M0 0 L0 -52 M0 0 L45 25 M0 0 L-45 25" stroke="#ef6b4d" stroke-width="6" stroke-linecap="round"/>
        </g>
      </g>
      <g transform="translate(555 432)">
        <circle r="72" fill="#eaf5f2" stroke="#173b4d" stroke-width="8"/>
        <g stroke="#76aab0" stroke-width="2">
          <path d="M-72 0H72M0-72V72M-51-51L51 51M51-51L-51 51"/>
        </g>
        <circle r="10" fill="#173b4d"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
          <path d="M0 0 L0 -52 M0 0 L45 25 M0 0 L-45 25" stroke="#ef6b4d" stroke-width="6" stroke-linecap="round"/>
        </g>
      </g>
      <path d="M245 432 L350 315 L455 432 L245 432 L555 432 L455 432 L420 315 L350 315" fill="none" stroke="#173b4d" stroke-width="10" stroke-linejoin="round"/>
      <path d="M420 315 L430 280" stroke="#173b4d" stroke-width="9"/>
      <path d="M410 278 Q442 265 470 280" fill="none" stroke="#173b4d" stroke-width="9" stroke-linecap="round"/>
      <circle cx="350" cy="432" r="14" fill="#ef6b4d" stroke="#173b4d" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 350 432" to="360 350 432" dur="1.1s" repeatCount="indefinite"/>
        <path d="M350 432 L390 455 M350 432 L312 405" stroke="#173b4d" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="400" cy="460" rx="18" ry="7" fill="#ef6b4d"/>
        <ellipse cx="302" cy="399" rx="18" ry="7" fill="#ef6b4d"/>
      </g>
    </g>
  </g>

  <!-- pelican -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="404" cy="278" rx="96" ry="112" fill="#f7f2df" stroke="#173b4d" stroke-width="7"/>
    <path d="M350 300 Q392 330 444 306 L470 362 Q405 392 340 350Z" fill="#efc45e" stroke="#173b4d" stroke-width="7"/>
    <ellipse cx="408" cy="192" rx="63" ry="60" fill="#fff9e8" stroke="#173b4d" stroke-width="7"/>
    <path d="M448 207 Q560 190 626 238 Q566 288 448 248Z" fill="#f0a94b" stroke="#173b4d" stroke-width="7"/>
    <path d="M455 243 Q530 271 610 240 Q550 315 455 268Z" fill="#e78a3d" stroke="#173b4d" stroke-width="6"/>
    <circle cx="425" cy="185" r="10" fill="#173b4d"/>
    <circle cx="429" cy="181" r="3" fill="#ffffff"/>
    <path d="M376 163 Q403 137 433 153" fill="none" stroke="#173b4d" stroke-width="8" stroke-linecap="round"/>
    <path d="M350 255 Q300 275 292 324 Q330 333 372 292Z" fill="#d9e8e4" stroke="#173b4d" stroke-width="7"/>
    <path d="M360 365 Q350 402 334 425" fill="none" stroke="#ef8c3d" stroke-width="12" stroke-linecap="round"/>
    <path d="M446 365 Q454 401 470 425" fill="none" stroke="#ef8c3d" stroke-width="12" stroke-linecap="round"/>
    <path d="M321 427 Q340 438 357 427 M456 427 Q475 438 491 427" fill="none" stroke="#173b4d" stroke-width="7" stroke-linecap="round"/>
    <path d="M339 245 Q380 230 412 250" fill="none" stroke="#173b4d" stroke-width="6" stroke-linecap="round"/>
    <text x="405" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#173b4d">NO WINGS.</text>
    <text x="405" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#173b4d">NO PROBLEM.</text>
  </g>

  <path d="M150 250 Q180 220 210 250" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M640 300 Q670 270 700 300" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <rect x="105" y="530" width="590" height="42" rx="21" fill="#173b4d" opacity=".94"/>
  <text x="400" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
    Pelican-powered transport: all beak, zero brakes.
  </text>
  <text x="400" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#173b4d">
    2026-10-27 07:30:38 SGT (UTC+08:00)
  </text>
</svg>