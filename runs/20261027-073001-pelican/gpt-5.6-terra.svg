<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly pretending it is perfectly normal.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ecff"/>
      <stop offset="1" stop-color="#f8fdff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f5965"/>
      <stop offset="1" stop-color="#272e36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#20252b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#20252b}
      .small{font-size:18px;font-weight:700}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 380 Q130 300 260 365 T520 350 T800 365 V500 H0Z" fill="#9bd18b"/>
  <path d="M0 425 Q190 390 370 420 T800 410 V500 H0Z" fill="#74b96b"/>
  <rect y="455" width="800" height="95" fill="url(#road)"/>
  <path d="M0 500 H800" stroke="#f7d76b" stroke-width="8" stroke-dasharray="44 28"/>
  <ellipse cx="420" cy="476" rx="225" ry="27" fill="#172027" opacity=".35"/>

  <text x="400" y="54" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#b3261e">
    PELICAN PEDAL PANIC!
  </text>
  <text x="400" y="84" text-anchor="middle" class="label" font-size="20" font-weight="700">
    “Why walk when you can wobble with confidence?”
  </text>

  <!-- bicycle frame -->
  <g filter="url(#shadow)">
    <g fill="none" class="ink">
      <path d="M245 450 L350 350 L475 450 L245 450 L405 450 L350 350"/>
      <path d="M475 450 L535 345"/>
      <path d="M535 345 L578 350"/>
      <path d="M535 345 L520 320"/>
      <path d="M338 350 L326 325"/>
    </g>

    <!-- rear wheel -->
    <g transform="translate(245 450)">
      <circle r="67" fill="#eef6f8" class="ink"/>
      <circle r="10" fill="#e84b3c" class="ink"/>
      <g stroke="#65727b" stroke-width="3">
        <path d="M0-60V60 M-60 0H60 M-42-42L42 42 M42-42L-42 42"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 245 450" to="360 245 450" dur="2.2s" repeatCount="indefinite"/>
    </g>

    <!-- front wheel -->
    <g transform="translate(535 450)">
      <circle r="67" fill="#eef6f8" class="ink"/>
      <circle r="10" fill="#e84b3c" class="ink"/>
      <g stroke="#65727b" stroke-width="3">
        <path d="M0-60V60 M-60 0H60 M-42-42L42 42 M42-42L-42 42"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 535 450" to="360 535 450" dur="2.2s" repeatCount="indefinite"/>
    </g>

    <!-- crank -->
    <g transform="translate(405 450)">
      <circle r="13" fill="#f2c14e" class="ink"/>
      <path d="M0 0 L35 -24 M0 0 L-30 25" class="ink"/>
      <ellipse cx="47" cy="-28" rx="14" ry="6" fill="#e84b3c" class="ink"/>
      <ellipse cx="-42" cy="31" rx="14" ry="6" fill="#e84b3c" class="ink"/>
      <animateTransform attributeName="transform" type="rotate" from="0 405 450" to="360 405 450" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pelican rider -->
  <g transform="translate(0 0)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.1s" repeatCount="indefinite"/>

    <!-- tail feathers -->
    <path d="M292 275 Q250 235 226 260 Q245 285 276 296Z" fill="#d9e8ed" class="ink"/>
    <path d="M288 289 Q245 275 230 304 Q260 320 292 312Z" fill="#b8d3dc" class="ink"/>

    <!-- body -->
    <ellipse cx="340" cy="285" rx="77" ry="96" fill="#f6fbfc" class="ink"/>
    <path d="M306 244 Q345 210 389 247 Q368 275 320 276Z" fill="#d9e8ed" class="ink"/>
    <path d="M381 278 Q422 313 395 359 Q360 340 346 302Z" fill="#b7d3dc" class="ink"/>

    <!-- neck and head -->
    <path d="M328 223 Q305 185 326 140 Q348 103 392 130 Q417 151 398 205 L380 247Z" fill="#f6fbfc" class="ink"/>
    <ellipse cx="365" cy="132" rx="58" ry="52" fill="#f6fbfc" class="ink"/>
    <path d="M313 137 Q292 125 278 107 Q272 94 286 91 Q328 91 366 113Z" fill="#f3a43b" class="ink"/>
    <path d="M285 91 Q331 100 372 121 Q390 132 374 148 Q332 142 289 119 Q275 109 285 91Z" fill="#f7b64c" class="ink"/>
    <path d="M300 119 Q338 128 370 143" fill="none" stroke="#d47d28" stroke-width="5"/>
    <circle cx="382" cy="120" r="9" fill="#20252b"/>
    <circle cx="385" cy="117" r="3" fill="#fff"/>

    <!-- silly helmet -->
    <path d="M319 91 Q352 48 401 77 Q417 87 422 105 L319 105Z" fill="#e84b3c" class="ink"/>
    <path d="M334 75 Q365 53 397 76" fill="none" stroke="#ffd166" stroke-width="9"/>
    <circle cx="367" cy="56" r="8" fill="#ffd166" class="ink"/>

    <!-- wing holding handlebar -->
    <path d="M375 255 Q420 270 467 326 Q476 339 463 349 Q449 355 436 339 L388 307Z" fill="#d9e8ed" class="ink"/>
    <path d="M463 347 L493 335" class="ink"/>
    <circle cx="497" cy="333" r="7" fill="#f3a43b" class="ink"/>

    <!-- legs -->
    <path d="M326 350 Q345 391 382 426" fill="none" class="ink"/>
    <path d="M382 426 Q400 440 417 447" fill="none" class="ink"/>
    <path d="M360 356 Q382 391 396 418" fill="none" class="ink"/>
    <path d="M396 418 Q420 432 448 422" fill="none" class="ink"/>
    <path d="M408 447 q18 9 29 0" fill="none" stroke="#f3a43b" stroke-width="9"/>
    <path d="M445 422 q18 9 28 0" fill="none" stroke="#f3a43b" stroke-width="9"/>
  </g>

  <!-- gag speech bubble -->
  <path d="M535 145 Q635 105 716 153 Q752 176 720 214 Q683 246 584 222 L547 245 L554 216 Q520 192 535 145Z" fill="#fffdf2" class="ink"/>
  <text x="632" y="169" text-anchor="middle" class="label" font-size="20" font-weight="900">I’m not late—</text>
  <text x="632" y="195" text-anchor="middle" class="label" font-size="20" font-weight="900">I’m fashionably flightless!</text>

  <!-- motion marks -->
  <path d="M175 390 l-28 -12 M183 410 l-35 3 M600 390 l30 -15" stroke="#e84b3c" stroke-width="7" stroke-linecap="round">
    <animate attributeName="opacity" values=".2;1;.2" dur="1s" repeatCount="indefinite"/>
  </path>

  <rect x="0" y="550" width="800" height="50" fill="#fff7df"/>
  <text x="400" y="573" text-anchor="middle" class="label small">2026-10-27 07:31:51 SGT (UTC+08:00)</text>
  <text x="400" y="594" text-anchor="middle" class="label" font-size="13">A completely serious transportation solution, according to the pelican.</text>
</svg>