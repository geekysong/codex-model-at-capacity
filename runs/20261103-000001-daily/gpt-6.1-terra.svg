<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fff" fill-opacity=".45"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#222" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111">Total union area: 79900 px²</text>

  <rect x="50" y="50" width="200" height="150" fill="#4c9ed9" fill-opacity=".55" stroke="#23618d" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#e8a340" fill-opacity=".55" stroke="#946016" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#87bb64" fill-opacity=".55" stroke="#4d7833" stroke-width="2"/>

  <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

  <g font-family="Arial, sans-serif" fill="#111">
    <text x="90" y="90" font-size="20" font-weight="bold">A</text>
    <text x="280" y="165" font-size="20" font-weight="bold">B</text>
    <text x="410" y="300" font-size="20" font-weight="bold">C</text>

    <rect x="160" y="148" width="80" height="24" rx="3" fill="#fff" fill-opacity=".92"/>
    <text x="200" y="165" text-anchor="middle" font-size="13" font-weight="bold">8000 px²</text>

    <g transform="translate(335 235) rotate(-90)">
      <rect x="-29" y="-9" width="58" height="18" rx="3" fill="#fff" fill-opacity=".92"/>
      <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="bold">2100 px²</text>
    </g>

    <text x="50" y="374" font-size="13">A and C do not overlap.</text>
    <text x="550" y="374" text-anchor="end" font-size="13">2026-11-03 00:05:01 SGT (UTC+08:00)</text>
  </g>
</svg>