<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatchAB" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff" fill-opacity="0.82"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#34495e" stroke-width="2"/>
    </pattern>
    <pattern id="hatchBC" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff" fill-opacity="0.82"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8e44ad" stroke-width="2"/>
    </pattern>
    <pattern id="hatchAC" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ffffff" fill-opacity="0.82"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b03a2e" stroke-width="2"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #17202a; }
      .area { font-size: 13px; font-weight: 700; text-anchor: middle; }
      .rect-label { font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#17202a">Union area: 87,500 px²</text>

  <!-- Rectangles -->
  <rect x="50" y="50" width="200" height="150" fill="#e74c3c" fill-opacity="0.34" stroke="#922b21" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#3498db" fill-opacity="0.34" stroke="#1f618d" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#2ecc71" fill-opacity="0.34" stroke="#196f3d" stroke-width="2"/>

  <!-- Pairwise overlap regions -->
  <rect x="150" y="120" width="100" height="80" fill="url(#hatchAB)" stroke="#34495e" stroke-width="1"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatchBC)" stroke="#8e44ad" stroke-width="1"/>

  <!-- Labels in exclusive regions -->
  <text class="rect-label" x="72" y="88">A</text>
  <text class="rect-label" x="265" y="158">B</text>
  <text class="rect-label" x="465" y="320">C</text>

  <!-- Overlap area labels -->
  <rect x="154" y="145" width="92" height="30" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text class="area" x="200" y="164">A∩B: 8,000 px²</text>
  <rect x="354" y="219" width="120" height="30" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <text class="area" x="414" y="238">B∩C: 2,100 px²</text>

  <text x="300" y="374" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#17202a">A and C do not overlap.</text>
  <text x="300" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#17202a">2026-11-03 00:04:46 SGT (UTC+08:00)</text>
</svg>