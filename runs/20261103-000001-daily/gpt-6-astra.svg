    <rect x="50" y="50" width="200" height="150" fill="#4285f4" fill-opacity="0.38" stroke="#2458a5" stroke-width="2"/>
    <rect x="150" y="120" width="200" height="150" fill="#f4ac32" fill-opacity="0.38" stroke="#91600d" stroke-width="2"/>
    <rect x="320" y="200" width="200" height="150" fill="#35b87a" fill-opacity="0.38" stroke="#187346" stroke-width="2"/>

