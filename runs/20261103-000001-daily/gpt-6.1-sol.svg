<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>79900</title>
  <desc>Union area: 79900 square pixels. A and B overlap by 8000 square pixels. B and C overlap by 2100 square pixels. A and C do not overlap.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M-2,2 L2,-2 M0,8 L8,0 M6,10 L10,6" fill="none" stroke="#263445" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#152334" text-anchor="middle">
    <text x="300" y="29" font-size="24" font-weight="700" aria-label="Total union area in square pixels: 79900">79900</text>

    <rect x="50" y="50" width="200" height="150" fill="#ef6461" fill-opacity="0.48" stroke="#a62e2b" stroke-width="2"/>
    <rect x="150" y="120" width="200" height="150" fill="#4b9fea" fill-opacity="0.48" stroke="#24669f" stroke-width="2"/>
    <rect x="320" y="200" width="200" height="150" fill="#55bd82" fill-opacity="0.48" stroke="#247b48" stroke-width="2"/>

    <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
    <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

    <g font-size="20" font-weight="700">
      <text x="95" y="95">A</text>
      <text x="290" y="160">B</text>
      <text x="435" y="305">C</text>
    </g>

    <g font-size="13" font-weight="700">
      <rect x="163" y="149" width="74" height="23" rx="3" fill="#fff" fill-opacity="0.95"/>
      <text x="200" y="165">8000 px²</text>
      <g transform="translate(335 235) rotate(-90)">
        <rect x="-32" y="-10" width="64" height="20" rx="3" fill="#fff" fill-opacity="0.95"/>
        <text x="0" y="4">2100 px²</text>
      </g>
    </g>

    <text x="300" y="371" font-size="13">A and C do not overlap.</text>
    <text x="300" y="392" font-size="13">2026-11-03 00:04:24 SGT (UTC+08:00)</text>
  </g>
</svg>