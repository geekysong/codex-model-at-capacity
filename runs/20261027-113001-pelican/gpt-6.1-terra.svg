<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd7f7"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#292929"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#244" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffe27a" opacity=".9"/>
  <path d="M0 330 Q120 280 240 330 T480 330 T720 330 T960 330 V600 H0Z" fill="#8bc58a"/>
  <path d="M0 420 Q190 380 400 420 T800 420 V600 H0Z" fill="url(#road)"/>
  <path d="M0 510 H800" stroke="#f5d76e" stroke-width="8" stroke-dasharray="48 30" opacity=".85"/>

  <text x="400" y="55" text-anchor="middle" font-family="Verdana, sans-serif" font-size="34" font-weight="900" fill="#17324d" stroke="#fff" stroke-width="7" paint-order="stroke">
    THE GREAT PELICYCLE
  </text>
  <text x="400" y="88" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="700" fill="#17324d">
    “Why pedal when you can waddle with style?”
  </text>

  <g opacity=".7" fill="#fff">
    <ellipse cx="120" cy="135" rx="55" ry="18"/>
    <ellipse cx="165" cy="135" rx="35" ry="14"/>
    <ellipse cx="610" cy="180" rx="58" ry="16"/>
    <ellipse cx="655" cy="180" rx="32" ry="12"/>
  </g>

  <g filter="url(#shadow)">
    <g id="bike">
      <g id="rearWheel">
        <circle cx="245" cy="455" r="72" fill="#1e2730" stroke="#f5f1dc" stroke-width="8"/>
        <circle cx="245" cy="455" r="10" fill="#f5d76e"/>
        <g stroke="#c9d6dc" stroke-width="3">
          <path d="M245 383V527 M173 455H317 M194 404L296 506 M296 404L194 506"/>
        </g>
      </g>
      <g id="frontWheel">
        <circle cx="570" cy="455" r="72" fill="#1e2730" stroke="#f5f1dc" stroke-width="8"/>
        <circle cx="570" cy="455" r="10" fill="#f5d76e"/>
        <g stroke="#c9d6dc" stroke-width="3">
          <path d="M570 383V527 M498 455H642 M519 404L621 506 M621 404L519 506"/>
        </g>
      </g>
      <path d="M245 455 L350 340 L475 455 L245 455 L390 455 L350 340 L570 455" fill="none" stroke="#e94f37" stroke-width="11" stroke-linejoin="round"/>
      <path d="M350 340 L330 300 M330 300 H385" fill="none" stroke="#e94f37" stroke-width="10" stroke-linecap="round"/>
      <path d="M475 455 L500 325 M500 325 H535" fill="none" stroke="#e94f37" stroke-width="10" stroke-linecap="round"/>
      <circle cx="390" cy="455" r="18" fill="#f5d76e" stroke="#713f2b" stroke-width="5"/>
      <g id="pedal">
        <path d="M390 455 L420 430 M390 455 L360 480" stroke="#713f2b" stroke-width="6"/>
        <rect x="416" y="424" width="22" height="8" rx="4" fill="#f5d76e"/>
        <rect x="344" y="476" width="22" height="8" rx="4" fill="#f5d76e"/>
        <animateTransform attributeName="transform" type="rotate" from="0 390 455" to="360 390 455" dur="1.1s" repeatCount="indefinite"/>
      </g>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.1s" repeatCount="indefinite"/>
      <ellipse cx="395" cy="275" rx="92" ry="82" fill="#f7f2df" stroke="#384b56" stroke-width="7"/>
      <path d="M340 300 Q330 365 365 392 Q400 410 430 380 L448 305Z" fill="#f7f2df" stroke="#384b56" stroke-width="7"/>
      <path d="M356 215 Q380 175 432 191 Q463 201 470 237 Q445 220 416 224 Q382 230 356 215Z" fill="#e8eef0" stroke="#384b56" stroke-width="7"/>
      <circle cx="430" cy="219" r="11" fill="#24343e"/>
      <circle cx="434" cy="215" r="3" fill="#fff"/>
      <path d="M438 232 Q525 233 595 267 Q610 275 596 286 Q515 294 438 268Z" fill="#f2a84b" stroke="#384b56" stroke-width="7"/>
      <path d="M595 267 Q615 275 596 286" fill="none" stroke="#b96a27" stroke-width="5"/>
      <path d="M372 375 Q390 395 412 375" fill="none" stroke="#384b56" stroke-width="6" stroke-linecap="round"/>
      <path d="M345 260 Q300 280 293 325 Q323 313 354 294" fill="#dce7ea" stroke="#384b56" stroke-width="7"/>
      <path d="M350 336 Q320 348 305 373" fill="none" stroke="#e94f37" stroke-width="8" stroke-linecap="round"/>
      <path d="M425 338 Q455 347 472 372" fill="none" stroke="#e94f37" stroke-width="8" stroke-linecap="round"/>
      <path d="M305 373 Q302 394 318 400 M472 372 Q475 393 461 400" fill="none" stroke="#384b56" stroke-width="7" stroke-linecap="round"/>
      <path d="M362 392 L350 455 M442 392 L430 455" stroke="#e94f37" stroke-width="8" stroke-linecap="round"/>
      <path d="M343 456 Q350 466 366 462 M423 456 Q430 466 446 462" fill="none" stroke="#384b56" stroke-width="7" stroke-linecap="round"/>
      <text x="405" y="150" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="700" fill="#17324d">
        HONK IF YOU'RE HUNGRY
      </text>
    </g>
  </g>

  <g fill="#17324d" font-family="Verdana, sans-serif">
    <text x="400" y="545" text-anchor="middle" font-size="17" font-weight="700">
      A feathered commuter proves that balance is mostly beak and confidence.
    </text>
    <text x="400" y="578" text-anchor="middle" font-size="15" font-weight="700">
      2026-10-27 11:33:15 SGT (UTC+08:00)
    </text>
  </g>

  <animateTransform xlink:href="#rearWheel" attributeName="transform" type="rotate" from="0 245 455" to="360 245 455" dur="1.4s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#frontWheel" attributeName="transform" type="rotate" from="0 570 455" to="360 570 455" dur="1.4s" repeatCount="indefinite"/>
</svg>