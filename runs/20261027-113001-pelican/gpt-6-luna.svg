<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly delivering absolutely nothing.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555a68"/>
      <stop offset="1" stop-color="#292d38"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#111827" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#18212f;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#18212f;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#18212f}
      .bold{font-weight:800}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff3a6" opacity=".9"/>
  <path d="M0 175 Q90 125 180 175 T360 175 T540 175 T800 175" fill="none" stroke="#fff" stroke-width="10" opacity=".65"/>
  <path d="M0 245 Q120 205 240 245 T480 245 T800 235 L800 430 L0 430Z" fill="#9bd18b"/>
  <path d="M0 300 Q140 265 280 305 T560 295 T800 300 L800 430 L0 430Z" fill="#69af73"/>

  <text x="400" y="58" text-anchor="middle" class="label bold" font-size="34">THE PELICAN PEDAL EXPRESS</text>
  <text x="400" y="92" text-anchor="middle" class="label" font-size="18">“Delivering fish, feathers, and absolutely no sense of direction.”</text>

  <rect y="414" width="800" height="122" fill="url(#road)"/>
  <path d="M0 475 H800" stroke="#f8dc72" stroke-width="8" stroke-dasharray="54 34">
    <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="1.1s" repeatCount="indefinite"/>
  </path>

  <g transform="translate(0 0)" filter="url(#shadow)">
    <!-- bicycle -->
    <g class="thin" fill="none">
      <circle cx="255" cy="430" r="68" stroke="#111827" stroke-width="9"/>
      <circle cx="570" cy="430" r="68" stroke="#111827" stroke-width="9"/>
      <g stroke="#718096" stroke-width="3">
        <path d="M255 362V498M187 430H323M207 382L303 478M303 382L207 478"/>
        <path d="M570 362V498M502 430H638M522 382L618 478M618 382L522 478"/>
      </g>
      <path d="M255 430 L355 345 L570 430 L430 430 Z" stroke="#ef476f" stroke-width="8"/>
      <path d="M355 345 L430 430 M355 345 L335 320" stroke="#ef476f" stroke-width="8"/>
      <path d="M326 319 H365" stroke="#18212f" stroke-width="8"/>
      <path d="M570 430 L595 332" stroke="#ef476f" stroke-width="8"/>
      <path d="M580 333 H620" stroke="#18212f" stroke-width="8"/>
      <circle cx="430" cy="430" r="14" fill="#ffd166" stroke="#18212f" stroke-width="5"/>
      <path d="M430 430 L398 452 M430 430 L461 407" stroke="#18212f" stroke-width="7"/>
      <ellipse cx="395" cy="456" rx="16" ry="7" fill="#ffd166"/>
      <ellipse cx="465" cy="404" rx="16" ry="7" fill="#ffd166"/>
    </g>

    <!-- pelican bobbing -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="0.8s" repeatCount="indefinite"/>
      <ellipse cx="405" cy="298" rx="86" ry="72" fill="#f4f1e8" class="ink"/>
      <path d="M350 330 Q390 356 438 325 L458 365 Q396 390 336 351Z" fill="#d9d5c9" class="thin"/>
      <ellipse cx="425" cy="232" rx="54" ry="50" fill="#fffaf0" class="ink"/>
      <path d="M456 242 Q526 250 602 284 Q536 314 454 284Z" fill="#f4a261" class="ink"/>
      <path d="M458 283 Q528 285 592 284 Q540 338 455 300Z" fill="#f7b267" class="thin"/>
      <circle cx="441" cy="222" r="9" fill="#18212f"/>
      <circle cx="444" cy="219" r="3" fill="#fff"/>
      <path d="M470 211 Q489 201 501 213" fill="none" class="thin"/>
      <path d="M394 260 Q425 276 455 261" fill="none" class="thin"/>
      <path d="M377 286 Q350 251 323 240 Q300 232 290 252 Q322 270 354 306Z" fill="#e9e5da" class="ink"/>
      <path d="M368 291 Q349 320 326 341" fill="none" class="ink"/>
      <path d="M449 291 Q463 326 478 346" fill="none" class="ink"/>
      <path d="M317 240 Q297 215 270 224 Q285 247 307 257" fill="#f4a261" class="thin"/>
      <path d="M472 195 Q505 165 534 185" fill="none" stroke="#18212f" stroke-width="6"/>
      <path d="M489 178 Q510 155 532 169" fill="none" stroke="#ef476f" stroke-width="8"/>
      <path d="M498 177 Q522 178 535 194" fill="none" stroke="#ef476f" stroke-width="8"/>
      <path d="M366 340 L350 386 M443 340 L470 380" class="ink" fill="none"/>
      <path d="M350 386 Q339 395 326 389 M470 380 Q484 389 497 381" class="thin" fill="none"/>
      <path d="M343 371 Q383 382 421 368" fill="none" stroke="#ef476f" stroke-width="7"/>
      <text x="386" y="314" class="label bold" font-size="15" transform="rotate(-8 386 314)">HONK!</text>
    </g>
  </g>

  <g class="label">
    <path d="M105 350 Q145 318 190 342" fill="none" stroke="#18212f" stroke-width="4"/>
    <text x="92" y="330" font-size="20" class="bold">“I was told</text>
    <text x="92" y="354" font-size="20" class="bold">to wing it!”</text>
  </g>

  <rect x="0" y="536" width="800" height="64" fill="#172033"/>
  <text x="400" y="575" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="18">
    2026-10-27 11:32:05 SGT (UTC+08:00)
  </text>
</svg>