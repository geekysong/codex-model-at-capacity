  <g fill="#e2e8f0" stroke="#f8fafc" stroke-width="12">
    <path d="M130 65H450V289H130Z"/>
  </g>

  <g stroke="#94a3b8" stroke-width="3" fill="none">
    <path d="M130 65H450 M130 121H450 M130 177H450 M130 233H450 M130 289H450"/>
    <path d="M130 65V289 M210 65V289 M290 65V289 M370 65V289 M450 65V289"/>
  </g>

  <path d="M130 65H450V289" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#475569">
    <circle cx="130" cy="65" r="4"/><circle cx="210" cy="65" r="4"/><circle cx="290" cy="65" r="4"/><circle cx="370" cy="65" r="4"/><circle cx="450" cy="65" r="4"/>
    <circle cx="130" cy="121" r="4"/><circle cx="290" cy="121" r="4"/><circle cx="370" cy="121" r="4"/><circle cx="450" cy="121" r="4"/>
    <circle cx="130" cy="177" r="4"/><circle cx="210" cy="177" r="4"/><circle cx="370" cy="177" r="4"/><circle cx="450" cy="177" r="4"/>
    <circle cx="130" cy="233" r="4"/><circle cx="210" cy="233" r="4"/><circle cx="290" cy="233" r="4"/><circle cx="450" cy="233" r="4"/>
    <circle cx="130" cy="289" r="4"/><circle cx="210" cy="289" r="4"/><circle cx="290" cy="289" r="4"/><circle cx="370" cy="289" r="4"/><circle cx="450" cy="289" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M202 113L218 129 M218 113L202 129"/>
    <path d="M282 169L298 185 M298 169L282 185"/>
    <path d="M362 225L378 241 M378 225L362 241"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0f172a" paint-order="stroke" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round">
    <text x="130" y="52">A1</text><text x="210" y="52">B1</text><text x="290" y="52">C1</text><text x="370" y="52">D1</text><text x="450" y="52">E1</text>
    <text x="130" y="108">A2</text><text x="210" y="108">B2</text><text x="290" y="108">C2</text><text x="370" y="108">D2</text><text x="450" y="108">E2</text>
    <text x="130" y="164">A3</text><text x="210" y="164">B3</text><text x="290" y="164">C3</text><text x="370" y="164">D3</text><text x="450" y="164">E3</text>
    <text x="130" y="220">A4</text><text x="210" y="220">B4</text><text x="290" y="220">C4</text><text x="370" y="220">D4</text><text x="450" y="220">E4</text>
    <text x="130" y="276">A5</text><text x="210" y="276">B5</text><text x="290" y="276">C5</text><text x="370" y="276">D5</text><text x="450" y="276">E5</text>
