<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid with shortest route from A1 to E5</title>
  <desc id="desc">The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, using 8 street segments and avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- City blocks -->
  <defs>
    <pattern id="blocks" x="100" y="55" width="100" height="60" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="82" height="42" rx="5" fill="#e2e8f0"/>
    </pattern>
  </defs>
  <rect x="100" y="55" width="400" height="240" fill="url(#blocks)"/>

  <!-- Streets -->
  <g fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M100 55H500 M100 115H500 M100 175H500 M100 235H500 M100 295H500"/>
    <path d="M100 55V295 M200 55V295 M300 55V295 M400 55V295 M500 55V295"/>
  </g>

  <!-- Shortest route: four segments east and four south -->
  <path d="M100 55H500V295" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersection markers -->
  <g fill="#475569">
    <circle cx="100" cy="115" r="4"/><circle cx="300" cy="115" r="4"/><circle cx="400" cy="115" r="4"/>
    <circle cx="100" cy="175" r="4"/><circle cx="200" cy="175" r="4"/><circle cx="400" cy="175" r="4"/>
    <circle cx="100" cy="235" r="4"/><circle cx="200" cy="235" r="4"/><circle cx="300" cy="235" r="4"/>
    <circle cx="100" cy="295" r="4"/><circle cx="200" cy="295" r="4"/><circle cx="300" cy="295" r="4"/><circle cx="400" cy="295" r="4"/>
  </g>
  <g fill="#2563eb">
    <circle cx="200" cy="55" r="5"/><circle cx="300" cy="55" r="5"/><circle cx="400" cy="55" r="5"/><circle cx="500" cy="55" r="5"/>
    <circle cx="500" cy="115" r="5"/><circle cx="500" cy="175" r="5"/><circle cx="500" cy="235" r="5"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 108L207 122 M207 108L193 122"/>
    <path d="M293 168L307 182 M307 168L293 182"/>
    <path d="M393 228L407 242 M407 228L393 242"/>
  </g>

  <!-- Start and end -->
  <circle cx="100" cy="55" r="8" fill="#16a34a" stroke="white" stroke-width="2"/>
  <circle cx="500" cy="295" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="100" y="38">A1 · Start</text>
    <text x="200" y="38">B1</text>
    <text x="300" y="38">C1</text>
    <text x="400" y="38">D1</text>
    <text x="500" y="38">E1</text>

    <text x="100" y="98">A2</text>
    <text x="200" y="98">B2</text>
    <text x="300" y="98">C2</text>
    <text x="400" y="98">D2</text>
    <text x="500" y="98">E2</text>

    <text x="100" y="158">A3</text>
    <text x="200" y="158">B3</text>
    <text x="300" y="158">C3</text>
    <text x="400" y="158">D3</text>
    <text x="500" y="158">E3</text>

    <text x="100" y="218">A4</text>
    <text x="200" y="218">B4</text>
    <text x="300" y="218">C4</text>
    <text x="400" y="218">D4</text>
    <text x="500" y="218">E4</text>

    <text x="100" y="278">A5</text>
    <text x="200" y="278">B5</text>
    <text x="300" y="278">C5</text>
    <text x="400" y="278">D5</text>
    <text x="500" y="278">E5 · End</text>
  </g>

  <!-- Dedicated footer -->
  <rect x="0" y="322" width="600" height="78" fill="#eef2f7"/>
  <text x="300" y="347" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d4ed8">Shortest route: 8 street segments</text>
  <text x="300" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 07:33:37 SGT (UTC+08:00)</text>
</svg>