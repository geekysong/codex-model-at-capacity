<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="50" y="28" font-size="17" font-weight="bold">Projectile motion</text>
    <text x="50" y="52">Initial velocity: (20, 15) m/s · g = 10 m/s²</text>
    <text x="50" y="75">Scale: 10 px/m; horizontal axis broken to fit.</text>
    <text x="50" y="98">Total flight time: 3 s</text>
    <text x="50" y="121">Horizontal distances measured from launch.</text>
  </g>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#536171" stroke-width="2"/>

  <!-- True-scale trajectory: x=100+200t, y=350-150t+50t².
       The final section is translated 200 px left across an axis break. -->
  <g fill="none" stroke="#176bc1" stroke-width="2.5">
    <path d="M100 350 Q255 233.75 410 237.625"/>
    <path d="M440 278 Q470 309.5 500 350"/>
  </g>

  <g fill="#176bc1">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="57" y="326">launch: 0 m, 0 m</text>
    <text x="303" y="216">apex: 30 m, 11.25 m</text>
    <text x="426" y="326">landing:</text>
    <text x="426" y="342">60 m, 0 m</text>
    <text x="298" y="158">Axis break omits 31–54 m</text>
  </g>

  <g stroke="#536171" stroke-width="1.5" fill="none">
    <path d="M417 252 l5 -7 m3 12 l5 -7"/>
    <path d="M410 346 l5 8 m5 -8 l5 8"/>
  </g>

  <rect x="0" y="366" width="600" height="34" fill="#f0f3f7"/>
  <text x="300" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-10-25 09:33:40 SGT (UTC+08:00)</text>
</svg>