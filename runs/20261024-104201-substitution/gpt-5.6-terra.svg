<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bde9ff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff19a"/>
      <stop offset="1" stop-color="#e4a72c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#17324d" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="90" r="48" fill="#fff5b0" opacity=".8"/>
  <path d="M0 470 Q130 420 260 470 T520 465 T800 450 V600 H0Z" fill="#d5e7d1"/>
  <path d="M0 505 Q150 460 310 510 T620 500 T800 485 V600 H0Z" fill="#b8d4bb"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#17324d">PREMIUM MODEL</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#d34a3d" letter-spacing="2">THE BAIT-AND-SWITCH EDITION</text>

  <!-- billboard -->
  <g filter="url(#shadow)">
    <rect x="92" y="120" width="616" height="244" rx="22" fill="#fffdf5" stroke="#17324d" stroke-width="6"/>
    <rect x="113" y="141" width="574" height="94" rx="14" fill="url(#gold)" stroke="#8c5e16" stroke-width="4"/>
    <text x="400" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#17324d">ULTRA-MAX PRO™</text>
    <text x="400" y="211" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">UNLIMITED WISDOM • INSTANT GENIUS</text>
    <path d="M180 330 H620" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
    <path d="M238 330 V375 M562 330 V375" stroke="#17324d" stroke-width="8"/>
    <rect x="294" y="251" width="212" height="74" rx="12" fill="#fff" stroke="#17324d" stroke-width="5"/>
    <text x="400" y="281" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#17324d">NOW SERVING</text>
    <text x="400" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#d34a3d">THE GOOD STUFF!</text>
  </g>

  <!-- premium robot decoy -->
  <g transform="translate(155 245)">
    <rect x="0" y="16" width="110" height="98" rx="24" fill="#f2f7ff" stroke="#17324d" stroke-width="6"/>
    <rect x="16" y="0" width="78" height="60" rx="18" fill="#7ed5ee" stroke="#17324d" stroke-width="6"/>
    <circle cx="40" cy="28" r="8" fill="#17324d"/>
    <circle cx="70" cy="28" r="8" fill="#17324d"/>
    <path d="M36 45 Q55 58 74 45" fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <path d="M55 0 V-17" stroke="#17324d" stroke-width="5"/>
    <circle cx="55" cy="-23" r="7" fill="#ffcf4a" stroke="#17324d" stroke-width="4"/>
    <path d="M-8 50 H-30 M118 50 H140" stroke="#17324d" stroke-width="7" stroke-linecap="round"/>
    <text x="55" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="800" fill="#17324d">ADVERTISED</text>
  </g>

  <!-- trapdoor -->
  <path d="M315 358 L485 358 L530 425 L270 425 Z" fill="#513d30" stroke="#17324d" stroke-width="6"/>
  <path d="M340 367 L460 367 L490 409 L310 409 Z" fill="#1d2630"/>
  <text x="400" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#ffcf4a">SUBSCRIPTION FEE</text>

  <!-- cheap robot emerging -->
  <g transform="translate(330 384) rotate(-4)">
    <path d="M20 125 L145 125 L132 210 L31 210 Z" fill="#b7b9bd" stroke="#17324d" stroke-width="6"/>
    <rect x="26" y="65" width="112" height="85" rx="18" fill="#c9cbd0" stroke="#17324d" stroke-width="6"/>
    <rect x="42" y="15" width="80" height="63" rx="13" fill="#e3e5e8" stroke="#17324d" stroke-width="6"/>
    <circle cx="66" cy="42" r="8" fill="#d34a3d"/>
    <circle cx="99" cy="42" r="8" fill="#d34a3d"/>
    <path d="M60 62 Q82 53 105 64" fill="none" stroke="#17324d" stroke-width="5"/>
    <path d="M82 15 V-5" stroke="#17324d" stroke-width="5"/>
    <circle cx="82" cy="-12" r="6" fill="#d34a3d" stroke="#17324d" stroke-width="4"/>
    <path d="M13 102 L-25 132 M141 102 L173 128" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
    <path d="M52 210 L42 242 M114 210 L126 242" stroke="#17324d" stroke-width="9" stroke-linecap="round"/>
    <text x="82" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#d34a3d">ERROR 404</text>
    <text x="82" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#17324d">GENIUS NOT FOUND</text>
  </g>

  <!-- customer -->
  <g transform="translate(585 350)">
    <circle cx="52" cy="36" r="29" fill="#f2b184" stroke="#17324d" stroke-width="5"/>
    <path d="M26 33 Q50 0 78 31 Q58 18 31 45Z" fill="#4c2f29"/>
    <path d="M20 102 Q52 74 84 102 L96 196 H8Z" fill="#4f86c6" stroke="#17324d" stroke-width="6"/>
    <path d="M25 104 L-5 148 M80 104 L113 137" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
    <path d="M113 137 L137 122" stroke="#17324d" stroke-width="6"/>
    <circle cx="139" cy="120" r="12" fill="#ffcf4a" stroke="#17324d" stroke-width="4"/>
    <text x="52" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#17324d">CUSTOMER</text>
  </g>

  <!-- speech bubbles -->
  <path d="M605 230 Q705 185 765 237 Q775 289 704 296 L672 322 L670 292 Q603 288 605 230Z" fill="#fff" stroke="#17324d" stroke-width="5"/>
  <text x="686" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#17324d">“Why is it</text>
  <text x="686" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#d34a3d">just guessing?”</text>

  <path d="M94 420 Q188 390 260 430 Q276 472 210 486 L190 520 L173 488 Q102 480 94 420Z" fill="#fff" stroke="#17324d" stroke-width="5"/>
  <text x="178" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#17324d">“It’s premium…”</text>
  <text x="178" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#d34a3d">“…in the brochure.”</text>

  <!-- caption -->
  <rect x="120" y="548" width="560" height="38" rx="19" fill="#17324d"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="800" fill="#fff">PAY FOR THE ROCKET. RECEIVE THE WHEELBARROW.</text>
</svg>