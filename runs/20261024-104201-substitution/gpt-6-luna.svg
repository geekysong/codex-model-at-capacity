<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff3ff"/>
      <stop offset="1" stop-color="#fff7df"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.5" stop-color="#f5c84c"/>
      <stop offset="1" stop-color="#c98918"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#193247" flood-opacity=".25"/>
    </filter>
    <pattern id="brick" width="80" height="34" patternUnits="userSpaceOnUse">
      <rect width="80" height="34" fill="#f6d6b8"/>
      <path d="M0 33H80M40 0V16M0 16H80M20 16V33M60 16V33" stroke="#e6b995" stroke-width="3"/>
