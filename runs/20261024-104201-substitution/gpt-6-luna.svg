  <path d="M0 450H800M0 520H800" stroke="#b7c8cc" stroke-width="8"/>
  <path d="M0 580H800" stroke="#9eb1b6" stroke-width="10"/>

  <text x="400" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#182c3a" letter-spacing="1">THE PREMIUM MODEL BAIT-AND-SWITCH</text>
  <text x="400" y="87" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#c43e35">“Same genius. Much cheaper inside.”</text>

