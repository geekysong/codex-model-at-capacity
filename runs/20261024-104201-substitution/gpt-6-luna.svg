  <path d="M430 225Q472 190 515 225" fill="none" stroke="#f7c948" stroke-width="8" stroke-linecap="round"/>
  <path d="M507 208L520 224L499 229" fill="none" stroke="#f7c948" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="473" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#a36c11">THE FINE PRINT</text>

  <!-- caption -->
  <rect x="132" y="470" width="536" height="82" rx="18" fill="#fff4c7" stroke="#243746" stroke-width="6" filter="url(#shadow)"/>
  <text x="400" y="502" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#243746">“Your premium model is ready!”</text>
  <text x="400" y="529" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c43e35">Terms apply: premium means premium billing.</text>
