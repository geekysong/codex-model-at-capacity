  <path d="M565 371L622 381L612 448L555 438Z" fill="#fffef6" stroke="#4a5961" stroke-width="4"/>
  <text x="585" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="900" fill="#3d4c54" transform="rotate(10 585 397)">PREMIUM</text>
  <text x="584" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3d4c54" transform="rotate(10 584 414)">PRICE: $$$$$</text>
