  <path d="M175 271Q206 237 235 268L224 245Q205 225 185 244Z" fill="#273746" stroke="#1b2630" stroke-width="5"/>
  <circle cx="194" cy="279" r="4" fill="#273746"/>
  <circle cx="216" cy="279" r="4" fill="#273746"/>
  <path d="M193 294Q205 302 217 294" fill="none" stroke="#7f3d39" stroke-width="4"/>
  <path d="M178 315Q205 300 232 315L250 365H160Z" fill="#2c6f91" stroke="#203b4a" stroke-width="5"/>
