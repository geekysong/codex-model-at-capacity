<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f6efd9"/>
  <rect y="0" width="800" height="92" fill="#211b3b"/>
  <text x="400" y="58" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" fill="#ffd34d">PREMIUM MODEL</text>
  <text x="400" y="84" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="3">NOW WITH 100% MORE PROMISE</text>

  <!-- storefront -->
  <rect x="52" y="122" width="696" height="370" rx="18" fill="#fff" stroke="#211b3b" stroke-width="8"/>
  <rect x="52" y="122" width="696" height="72" rx="14" fill="#e94f37" stroke="#211b3b" stroke-width="8"/>
  <text x="400" y="170" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="900" fill="#fff">THE MODEL EMPORIUM</text>

  <!-- left bait poster -->
  <rect x="82" y="220" width="255" height="220" rx="12" fill="#ffe28a" stroke="#211b3b" stroke-width="6"/>
  <text x="209" y="254" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="900" fill="#211b3b">ADVERTISED</text>
  <text x="209" y="282" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#211b3b">GENIUS PRO MAX</text>
  <polygon points="209,298 222,326 253,330 230,349 236,380 209,365 182,380 188,349 165,330 196,326" fill="#ffd34d" stroke="#211b3b" stroke-width="5"/>
  <text x="209" y="414" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#211b3b">“Answers everything!”</text>

  <!-- curtain -->
  <path d="M365 210 Q400 230 435 210 L435 475 L365 475 Z" fill="#c63d55" stroke="#211b3b" stroke-width="6"/>
  <path d="M365 210 Q382 245 400 210 Q418 245 435 210" fill="none" stroke="#211b3b" stroke-width="5"/>
  <text x="400" y="194" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#211b3b">BEHIND THE CURTAIN</text>

  <!-- hidden premium robot peeking -->
  <g opacity="0.35">
    <rect x="470" y="250" width="160" height="170" rx="28" fill="#d6b36a" stroke="#211b3b" stroke-width="6"/>
    <rect x="492" y="205" width="116" height="70" rx="24" fill="#d6b36a" stroke="#211b3b" stroke-width="6"/>
    <circle cx="527" cy="238" r="9" fill="#211b3b"/><circle cx="573" cy="238" r="9" fill="#211b3b"/>
    <text x="550" y="320" text-anchor="middle" font-family="Arial" font-size="19" font-weight="900" fill="#211b3b">PREMIUM</text>
  </g>

  <!-- cheap robot -->
  <g>
    <rect x="505" y="292" width="145" height="128" rx="18" fill="#9aa3ad" stroke="#211b3b" stroke-width="7"/>
    <rect x="523" y="238" width="109" height="72" rx="15" fill="#b9c0c7" stroke="#211b3b" stroke-width="7"/>
    <circle cx="551" cy="270" r="8" fill="#211b3b"/><circle cx="604" cy="270" r="8" fill="#211b3b"/>
    <path d="M548 291 Q578 278 609 291" fill="none" stroke="#211b3b" stroke-width="6"/>
    <rect x="530" y="333" width="96" height="42" rx="8" fill="#f6efd9" stroke="#211b3b" stroke-width="4"/>
    <text x="578" y="361" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900" fill="#e94f37">BUDGET</text>
    <path d="M505 340 L474 370" stroke="#211b3b" stroke-width="8"/>
    <path d="M650 340 L681 370" stroke="#211b3b" stroke-width="8"/>
    <circle cx="474" cy="370" r="11" fill="#e94f37" stroke="#211b3b" stroke-width="5"/>
    <circle cx="681" cy="370" r="11" fill="#e94f37" stroke="#211b3b" stroke-width="5"/>
  </g>

  <!-- switch operator -->
  <circle cx="706" cy="245" r="25" fill="#ffd2ad" stroke="#211b3b" stroke-width="6"/>
  <path d="M681 245 Q706 195 731 245" fill="#211b3b"/>
  <rect x="685" y="270" width="42" height="92" rx="15" fill="#4f76c7" stroke="#211b3b" stroke-width="6"/>
  <path d="M706 362 L690 423 M706 362 L722 423" stroke="#211b3b" stroke-width="8"/>
  <path d="M685 300 L655 330" stroke="#211b3b" stroke-width="8"/>
  <text x="704" y="466" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="900" fill="#211b3b">SUBSTITUTION</text>
  <text x="704" y="481" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="900" fill="#211b3b">DEPARTMENT</text>

  <!-- customer and chat -->
  <g>
    <circle cx="130" cy="510" r="24" fill="#ffd2ad" stroke="#211b3b" stroke-width="6"/>
    <path d="M106 510 Q130 465 154 510" fill="#211b3b"/>
    <path d="M130 534 L130 582 M130 548 L100 568 M130 548 L160 568" stroke="#211b3b" stroke-width="9" stroke-linecap="round"/>
    <path d="M177 490 Q250 450 329 490 L329 545 Q250 570 177 545 Z" fill="#fff" stroke="#211b3b" stroke-width="6"/>
    <text x="253" y="515" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#211b3b">Please solve climate change.</text>
    <text x="253" y="538" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#e94f37">“Have you tried turning it off?”</text>
  </g>

  <!-- caption -->
  <rect x="180" y="548" width="440" height="38" rx="19" fill="#211b3b"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900" fill="#ffd34d">SAME SUBSCRIPTION. DIFFERENT BRAIN.</text>
</svg>