<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="1" stop-color="#f4d7a1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff08a"/>
      <stop offset="0.45" stop-color="#f7bd32"/>
      <stop offset="1" stop-color="#b96b12"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8eef2"/>
      <stop offset="1" stop-color="#7b8b97"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#6b3c18" flood-opacity=".28"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#e5b56a" opacity=".45"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)" opacity=".35"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#3d1d18" letter-spacing="1">
    PREMIUM MODEL™
  </text>
  <text x="400" y="101" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#a33c20">
    “The smartest engine in the universe!”
  </text>

  <rect x="42" y="135" width="716" height="370" rx="22" fill="#fffaf0" stroke="#4b261c" stroke-width="5" filter="url(#shadow)"/>
  <path d="M60 192 Q190 150 320 192 T580 192 T740 192 L740 485 L60 485Z" fill="#f3c66e" opacity=".25"/>

  <!-- left premium display -->
  <rect x="90" y="220" width="290" height="210" rx="18" fill="#241b2b" stroke="#512d26" stroke-width="6"/>
  <rect x="108" y="239" width="254" height="155" rx="10" fill="#111821"/>
  <text x="235" y="272" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#ffe58a">YOUR PREMIUM AI</text>

  <g transform="translate(235 326)" filter="url(#shadow)">
    <rect x="-63" y="-48" width="126" height="91" rx="25" fill="url(#gold)" stroke="#6e3d16" stroke-width="5"/>
    <rect x="-43" y="-25" width="32" height="24" rx="8" fill="#321d22"/>
    <rect x="11" y="-25" width="32" height="24" rx="8" fill="#321d22"/>
    <circle cx="-27" cy="-13" r="7" fill="#7ff6ff"/>
    <circle cx="27" cy="-13" r="7" fill="#7ff6ff"/>
    <path d="M-35 16 Q0 40 35 16" fill="none" stroke="#321d22" stroke-width="7" stroke-linecap="round"/>
    <path d="M0 -48 L0 -69" stroke="#6e3d16" stroke-width="6"/>
    <circle cx="0" cy="-77" r="10" fill="#ffdf55" stroke="#6e3d16" stroke-width="4"/>
    <rect x="-82" y="-6" width="18" height="54" rx="9" fill="#d08b1e" stroke="#6e3d16" stroke-width="4"/>
    <rect x="64" y="-6" width="18" height="54" rx="9" fill="#d08b1e" stroke="#6e3d16" stroke-width="4"/>
  </g>
  <text x="235" y="420" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff0a6">1,000,000 TOKENS</text>

  <!-- arrow -->
  <path d="M407 320 L478 320" stroke="#bc3b24" stroke-width="12" stroke-linecap="round"/>
  <path d="M462 298 L490 320 L462 342" fill="none" stroke="#bc3b24" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right hidden substitution -->
  <rect x="500" y="220" width="220" height="210" rx="18" fill="#3b2b35" stroke="#512d26" stroke-width="6"/>
  <rect x="518" y="239" width="184" height="155" rx="10" fill="#17151c"/>
  <text x="610" y="269" text-anchor="middle" font-family="Arial" font-size="17" font-weight="800" fill="#ff8d74">ACTUAL ENGINE</text>
  <g transform="translate(610 340)" filter="url(#shadow)">
    <rect x="-43" y="-32" width="86" height="69" rx="18" fill="url(#steel)" stroke="#384953" stroke-width="5"/>
    <rect x="-28" y="-16" width="18" height="15" rx="4" fill="#19252c"/>
    <rect x="10" y="-16" width="18" height="15" rx="4" fill="#19252c"/>
    <circle cx="-19" cy="-9" r="4" fill="#ff5959"/>
    <circle cx="19" cy="-9" r="4" fill="#ff5959"/>
    <path d="M-20 16 Q0 8 20 16" fill="none" stroke="#384953" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 -32 L0 -45" stroke="#384953" stroke-width="4"/>
    <circle cx="0" cy="-51" r="6" fill="#ff5959" stroke="#384953" stroke-width="3"/>
    <rect x="-57" y="-2" width="12" height="38" rx="6" fill="#8d9da4" stroke="#384953" stroke-width="3"/>
    <rect x="45" y="-2" width="12" height="38" rx="6" fill="#8d9da4" stroke="#384953" stroke-width="3"/>
  </g>
  <text x="610" y="420" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#ff9d84">8 TOKENS, 2 THOUGHTS</text>

  <!-- curtain pulled aside -->
  <path d="M462 156 Q505 182 520 227 L520 441 Q500 466 462 478 Z" fill="#c5322b" stroke="#6b201d" stroke-width="6"/>
  <path d="M470 167 Q491 207 493 455" fill="none" stroke="#f15a44" stroke-width="9" opacity=".7"/>
  <path d="M492 175 Q512 208 514 442" fill="none" stroke="#8e211f" stroke-width="8" opacity=".7"/>
  <circle cx="475" cy="454" r="9" fill="#ffd34e" stroke="#6b201d" stroke-width="4"/>

  <!-- customer -->
  <g transform="translate(393 455)">
    <circle cx="0" cy="-52" r="31" fill="#f2b37f" stroke="#5a3024" stroke-width="5"/>
    <path d="M-28 -60 Q-8 -91 23 -69 Q30 -58 28 -48 Q5 -58 -28 -60Z" fill="#3c2525"/>
    <rect x="-39" y="-20" width="78" height="73" rx="20" fill="#4d72a1" stroke="#2d4564" stroke-width="5"/>
    <path d="M-22 0 L22 0 M-22 17 L22 17" stroke="#a9d0e8" stroke-width="5"/>
    <path d="M-42 5 L-77 32" stroke="#5a3024" stroke-width="10" stroke-linecap="round"/>
    <path d="M42 5 L76 25" stroke="#5a3024" stroke-width="10" stroke-linecap="round"/>
    <path d="M-13 53 L-23 94 M13 53 L23 94" stroke="#2d4564" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- speech bubbles -->
  <path d="M118 475 Q118 445 150 445 L300 445 Q327 445 327 475 L327 502 Q327 530 300 530 L191 530 L161 550 L166 530 L150 530 Q118 530 118 502Z" fill="#ffffff" stroke="#512d26" stroke-width="5"/>
  <text x="222" y="482" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#3d1d18">“Why is it whispering?”</text>
  <text x="222" y="508" text-anchor="middle" font-family="Arial" font-size="15" fill="#6b3c34">I paid for fireworks!</text>

  <path d="M535 465 Q535 438 562 438 L703 438 Q730 438 730 465 L730 499 Q730 526 703 526 L640 526 L620 549 L617 526 L562 526 Q535 526 535 499Z" fill="#fff4ba" stroke="#512d26" stroke-width="5"/>
  <text x="633" y="477" text-anchor="middle" font-family="Arial" font-size="17" font-weight="900" fill="#9b2d22">“Bandwidth is shy.”</text>
  <text x="633" y="503" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b3c34">Please lower expectations.</text>

  <text x="400" y="579" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="900" fill="#3d1d18">
    SAME SUBSCRIPTION. DIFFERENT BRAIN.
  </text>
</svg>