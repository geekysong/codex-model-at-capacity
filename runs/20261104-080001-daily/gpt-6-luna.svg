<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">5 by 5 grid constraint solution</title>
  <desc id="desc">A 5 by 5 grid with ten shaded cells. Each row and column has exactly two shaded cells, and no shaded cells share an edge.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">5×5 Shaded Cell Solution</text>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="127" y="59">1</text><text x="193" y="59">2</text><text x="259" y="59">3</text><text x="325" y="59">4</text><text x="391" y="59">5</text>
    <text x="61" y="95">A</text><text x="61" y="161">B</text><text x="61" y="227">C</text><text x="61" y="293">D</text><text x="61" y="359">E</text>
  </g>

  <g fill="#86c9b2">
    <rect x="94" y="62" width="66" height="66"/><rect x="226" y="62" width="66" height="66"/>
    <rect x="160" y="128" width="66" height="66"/><rect x="292" y="128" width="66" height="66"/>
    <rect x="94" y="194" width="66" height="66"/><rect x="358" y="194" width="66" height="66"/>
    <rect x="160" y="260" width="66" height="66"/><rect x="424" y="260" width="66" height="66"/>
    <rect x="292" y="326" width="66" height="66"/><rect x="424" y="326" width="66" height="66"/>
  </g>

  <g stroke="#475569" stroke-width="1.5" fill="none">
    <path d="M94 62H490 M94 128H490 M94 194H490 M94 260H490 M94 326H490 M94 392H490"/>
    <path d="M94 62V392 M160 62V392 M226 62V392 M292 62V392 M358 62V392 M424 62V392 M490 62V392"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#172033" text-anchor="middle" dominant-baseline="middle">
    <text x="127" y="95">A1</text><text x="193" y="95">A2</text><text x="259" y="95">A3</text><text x="325" y="95">A4</text><text x="391" y="95">A5</text>
    <text x="127" y="161">B1</text><text x="193" y="161">B2</text><text x="259" y="161">B3</text><text x="325" y="161">B4</text><text x="391" y="161">B5</text>
    <text x="127" y="227">C1</text><text x="193" y="227">C2</text><text x="259" y="227">C3</text><text x="325" y="227">C4</text><text x="391" y="227">C5</text>
    <text x="127" y="293">D1</text><text x="193" y="293">D2</text><text x="259" y="293">D3</text><text x="325" y="293">D4</text><text x="391" y="293">D5</text>
    <text x="127" y="359">E1</text><text x="193" y="359">E2</text><text x="259" y="359">E3</text><text x="325" y="359">E4</text><text x="391" y="359">E5</text>
  </g>

  <g fill="#16785f" font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="127" y="95" text-anchor="middle" dominant-baseline="middle">A1</text>
    <text x="259" y="95" text-anchor="middle" dominant-baseline="middle">A3</text>
    <text x="193" y="161" text-anchor="middle" dominant-baseline="middle">B2</text>
    <text x="325" y="161" text-anchor="middle" dominant-baseline="middle">B4</text>
    <text x="127" y="227" text-anchor="middle" dominant-baseline="middle">C1</text>
    <text x="391" y="227" text-anchor="middle" dominant-baseline="middle">C5</text>
    <text x="193" y="293" text-anchor="middle" dominant-baseline="middle">D2</text>
    <text x="457" y="293" text-anchor="middle" dominant-baseline="middle">D6</text>
    <text x="325" y="359" text-anchor="middle" dominant-baseline="middle">E4</text>
