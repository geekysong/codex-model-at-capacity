<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#b9e8f2"/>
  <rect y="430" width="800" height="170" fill="#f6d58b"/>
  <path d="M0 470 Q140 430 280 470 T560 470 T800 470" fill="none" stroke="#d49b52" stroke-width="8"/>
  <text x="400" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" fill="#17324d" stroke="#fff" stroke-width="3" paint-order="stroke">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#d04f3f">One bird. One bike. Zero balance.</text>

  <!-- clouds -->
  <g fill="#fff" opacity=".9">
    <path d="M90 150 Q105 120 140 135 Q155 100 195 125 Q225 120 235 150 Z"/>
    <path d="M610 160 Q630 125 665 145 Q685 110 725 140 Q755 140 765 170 Z"/>
  </g>

  <!-- bicycle -->
  <g stroke="#263746" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="250" cy="455" r="82" fill="#eaf7fa"/>
    <circle cx="585" cy="455" r="82" fill="#eaf7fa"/>
    <path d="M250 455 L355 320 L455 455 L250 455 M355 320 L585 455 M455 455 L520 330 L585 455"/>
    <path d="M520 330 L555 300 M520 330 L490 300"/>
    <path d="M555 300 L582 300"/>
    <path d="M355 320 L330 285"/>
    <path d="M330 285 L300 285"/>
  </g>
  <g fill="#263746">
    <circle cx="250" cy="455" r="13"/>
    <circle cx="585" cy="455" r="13"/>
    <circle cx="455" cy="455" r="13"/>
    <circle cx="355" cy="320" r="13"/>
  </g>
  <path d="M430 455 q30 28 60 0" fill="none" stroke="#263746" stroke-width="7"/>
  <path d="M450 483 l20 20 M450 483 l-20 20" stroke="#263746" stroke-width="7"/>

  <!-- pelican body -->
  <ellipse cx="405" cy="245" rx="103" ry="123" fill="#f4f0df" stroke="#263746" stroke-width="8"/>
  <path d="M350 215 Q315 275 340 340 Q380 370 421 340 L435 245 Z" fill="#d9e4e4" stroke="#263746" stroke-width="8"/>
  <path d="M360 330 Q402 370 450 327" fill="none" stroke="#263746" stroke-width="8"/>
  <!-- neck/head -->
  <ellipse cx="408" cy="150" rx="82" ry="72" fill="#fffdf2" stroke="#263746" stroke-width="8"/>
  <path d="M350 175 Q295 185 215 160 Q190 150 214 132 Q290 118 365 128 Z" fill="#ef9b39" stroke="#263746" stroke-width="8"/>
  <path d="M215 132 Q190 150 215 160 Q270 184 325 169" fill="#f6b64a" stroke="#263746" stroke-width="5"/>
  <path d="M235 151 Q275 145 315 150" fill="none" stroke="#b96b2e" stroke-width="5"/>
  <circle cx="435" cy="135" r="10" fill="#263746"/>
  <circle cx="438" cy="131" r="3" fill="#fff"/>
  <path d="M460 115 Q500 90 520 125" fill="none" stroke="#263746" stroke-width="8"/>
  <!-- wing and feet -->
  <path d="M445 220 Q500 235 515 300 Q480 325 440 280" fill="#e8eeee" stroke="#263746" stroke-width="8"/>
  <path d="M375 350 L360 405 M430 350 L450 405" stroke="#e49a35" stroke-width="13"/>
  <path d="M350 405 q18 12 35 0 M440 405 q18 12 35 0" fill="none" stroke="#263746" stroke-width="8"/>

  <!-- handlebars held by wing -->
  <path d="M490 280 Q515 300 535 330" fill="none" stroke="#263746" stroke-width="9"/>
  <path d="M490 280 Q475 290 465 305" fill="none" stroke="#263746" stroke-width="9"/>

  <!-- motion lines -->
  <path d="M120 360 h75 M95 390 h55 M650 340 h75" stroke="#d04f3f" stroke-width="8" stroke-linecap="round"/>
  <path d="M170 520 q35 -25 70 0 M620 520 q35 -25 70 0" fill="none" stroke="#d04f3f" stroke-width="7"/>

  <!-- speech bubble -->
  <path d="M560 205 Q640 155 725 205 Q760 235 720 270 Q650 300 570 260 L540 290 L545 250 Q520 230 560 205 Z" fill="#fff" stroke="#263746" stroke-width="6"/>
  <text x="640" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#263746">I SAW A FISH</text>
  <text x="640" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#d04f3f">AND LOST MY BRAKES!</text>

  <!-- tiny sign -->
  <path d="M100 430 V315 M55 315 H155 V365 H55 Z" fill="#fff4c7" stroke="#263746" stroke-width="6"/>
  <text x="105" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#263746">BIKE</text>
  <text x="105" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#d04f3f">LANE</text>

  <text x="400" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17324d">The pelican pedals like he owns the pond.</text>
</svg>