<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Express</title>
  <desc id="description">A determined pelican rides a tiny bicycle carrying a fish in its enormous bill. Wheels spin and the rider bobs in a looping cartoon animation.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12V12" fill="none" stroke="#926338" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff6dc"/>
  <circle cx="693" cy="133" r="45" fill="#ffcf57"/>
  <path d="M0 371Q110 331 220 365T440 354T650 366T800 342V475H0Z" fill="#c8dfc0"/>
  <path d="M0 409Q200 390 400 415T800 405V482H0Z" fill="#add2b2"/>
  <path d="M0 453H800V492H0Z" fill="#ead6b4"/>
  <path d="M30 475H125M170 475H265M570 475H665M710 475H780" stroke="#fff6dc" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#203d43">THE PELICAN EXPRESS</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="3" fill="#926338">ZERO EMISSIONS. ENORMOUS BILL.</text>

  <!-- A roadside commentary on the rider's cargo -->
  <g stroke="#203d43" stroke-linejoin="round">
    <path d="M684 299V447" stroke-width="8"/>
    <rect x="617" y="247" width="132" height="73" rx="8" fill="#fffdf2" stroke-width="4"/>
  </g>
  <text x="683" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#203d43">BIKE LANE</text>
  <text x="683" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#203d43">NO WIDE LOADS</text>

  <ellipse cx="370" cy="453" rx="235" ry="14" fill="#203d43" opacity=".13"/>

  <!-- Wheels rotate around their own hubs -->
  <g transform="translate(232 390)">
    <circle r="66" fill="#fffaf0" stroke="#203d43" stroke-width="12"/>
    <circle r="57" fill="none" stroke="#d2a45b" stroke-width="3"/>
    <g stroke="#708b8c" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-56 0H56M0-56V56M-40-40L40 40M-40 40L40-40"/>
      <path d="M38-38L47-47" stroke="#ed784b" stroke-width="7"/>
    </g>
    <circle r="8" fill="#203d43"/>
  </g>
  <g transform="translate(510 390)">
    <circle r="66" fill="#fffaf0" stroke="#203d43" stroke-width="12"/>
    <circle r="57" fill="none" stroke="#d2a45b" stroke-width="3"/>
    <g stroke="#708b8c" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-56 0H56M0-56V56M-40-40L40 40M-40 40L40-40"/>
      <path d="M38-38L47-47" stroke="#ed784b" stroke-width="7"/>
    </g>
    <circle r="8" fill="#203d43"/>
  </g>

  <!-- The absurdly small bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 390L301 305L353 390H232L292 321H461L353 390M461 321L510 390" stroke="#203d43" stroke-width="13"/>
    <path d="M232 390L301 305L353 390H232L292 321H461L353 390M461 321L510 390" stroke="#eb6950" stroke-width="7"/>
    <path d="M300 308L290 285M510 390L455 281L478 268H495" stroke="#203d43" stroke-width="8"/>
    <path d="M268 285H313M480 268H499" stroke="#203d43" stroke-width="13"/>
  </g>

  <g transform="translate(353 390)">
    <circle r="17" fill="#f7cf68" stroke="#203d43" stroke-width="4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".8s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#203d43" stroke-width="6"/>
      <path d="M-30-5V5M30-5V5" stroke="#203d43" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Pelican and cargo bob together -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M299 276L321 326L339 358" fill="none" stroke="#203d43" stroke-width="16" stroke-linecap="round"/>
    <path d="M299 276L321 326L339 358" fill="none" stroke="#f5ae45" stroke-width="10" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 306 284;8 306 284;-8 306 284" dur=".8s" repeatCount="indefinite"/>
      <path d="M306 284L350 320L368 370" fill="none" stroke="#203d43" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M306 284L350 320L368 370" fill="none" stroke="#ffbf52" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M366 364L390 376L359 381Z" fill="#ffbf52" stroke="#203d43" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <path d="M258 232L194 199L214 247L188 245L245 280Z" fill="#fffdf3" stroke="#203d43" stroke-width="5" stroke-linejoin="round"/>
    <path d="M250 209C284 189 315 216 337 201C356 184 336 148 362 130C392 110 421 136 414 165C410 187 388 205 390 230C394 273 359 300 304 296C252 294 226 263 239 231Z" fill="#fffdf3" stroke="#203d43" stroke-width="5"/>
    <path d="M265 225Q313 211 350 253Q316 281 274 254" fill="#dce5df" stroke="#203d43" stroke-width="4" stroke-linecap="round"/>
    <path d="M323 238Q379 266 456 273" fill="none" stroke="#203d43" stroke-width="16" stroke-linecap="round"/>
    <path d="M323 238Q379 266 456 273" fill="none" stroke="#fffdf3" stroke-width="10" stroke-linecap="round"/>
    <path d="M440 270L454 281M448 267L463 277" stroke="#203d43" stroke-width="3" stroke-linecap="round"/>

    <!-- Enormous pouch, with a skeptical fish -->
    <path d="M405 167L593 181Q555 253 478 234Q430 220 405 167Z" fill="#ffc469" stroke="#203d43" stroke-width="5"/>
    <path d="M471 201Q500 176 536 203L552 191L549 218L534 210Q501 232 471 201Z" fill="#71b6b3" stroke="#203d43" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="487" cy="199" r="6" fill="#fff"/>
    <circle cx="486" cy="199" r="2.5" fill="#203d43"/>
    <path d="M480 190L492 193M473 207H481" stroke="#203d43" stroke-width="2.5"/>
    <path d="M402 158Q490 152 604 178Q610 185 596 188L405 178Z" fill="#f7a33e" stroke="#203d43" stroke-width="5" stroke-linejoin="round"/>

    <ellipse cx="393" cy="149" rx="10" ry="13" fill="white" stroke="#203d43" stroke-width="3"/>
    <circle cx="398" cy="150" r="4" fill="#203d43"/>
    <path d="M382 130L403 135" stroke="#203d43" stroke-width="5" stroke-linecap="round"/>
    <path d="M352 133Q356 105 383 108Q411 109 418 132Z" fill="#eb6950" stroke="#203d43" stroke-width="4"/>
    <path d="M370 112L368 129M389 113L393 130" stroke="#ffcf74" stroke-width="5"/>
    <path d="M358 135L375 167L385 165" fill="none" stroke="#203d43" stroke-width="3"/>
    <path d="M350 189L324 180L333 198L311 205L349 211" fill="#eb6950" stroke="#203d43" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <g fill="none" stroke="#708b8c" stroke-width="4" stroke-linecap="round">
    <path d="M151 310H197M129 326H185M157 342H183">
      <animate attributeName="opacity" values=".3;1;.3" dur=".8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="497" width="800" height="103" fill="#203d43"/>
  <text x="400" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#fff6dc">He downsized the commute. The bill stayed huge.</text>
  <path d="M130 549H670" stroke="#77928d" stroke-width="1"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff6dc">2026-10-31 06:30:02 SGT (UTC+08:00)</text>
</svg>