<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>
  <style>
    .ink{stroke:#18212b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,Helvetica,sans-serif;fill:#18212b}
    .wheel{fill:none;stroke:#18212b;stroke-width:9}
    .spoke{stroke:#71808d;stroke-width:3}
    .motion{stroke:#ef7d32;stroke-width:5;stroke-dasharray:12 12;fill:none;stroke-linecap:round}
  </style>

  <rect width="800" height="600" fill="#bde9f4"/>
  <rect y="415" width="800" height="185" fill="#f6d28b"/>
  <path d="M0 415 Q110 385 220 415 T440 415 T660 415 T800 415" fill="none" stroke="#d89b52" stroke-width="7"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN PEDAL PANIC</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="18" font-weight="700">“Why fly when you can clog traffic with style?”</text>

  <g opacity=".8">
    <path d="M95 175 q28 -20 56 0 q-28 20 -56 0Z" fill="#fff" class="ink"/>
    <path d="M650 145 q28 -20 56 0 q-28 20 -56 0Z" fill="#fff" class="ink"/>
  </g>

  <g class="motion">
    <path d="M112 330 q-35 10 -48 35"/>
    <path d="M680 302 q38 6 58 31"/>
  </g>

  <g id="bike">
    <g id="wheel1">
      <circle cx="260" cy="430" r="78" class="wheel"/>
      <circle cx="260" cy="430" r="9" fill="#ef7d32" class="ink"/>
      <g class="spoke">
        <path d="M260 430 l0 -78 M260 430 l55 -55 M260 430 l78 0 M260 430 l55 55 M260 430 l0 78 M260 430 l-55 55 M260 430 l-78 0 M260 430 l-55 -55"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 260 430" to="360 260 430" dur="2.2s" repeatCount="indefinite"/>
    </g>
    <g id="wheel2">
      <circle cx="575" cy="430" r="78" class="wheel"/>
      <circle cx="575" cy="430" r="9" fill="#ef7d32" class="ink"/>
      <g class="spoke">
        <path d="M575 430 l0 -78 M575 430 l55 -55 M575 430 l78 0 M575 430 l55 55 M575 430 l0 78 M575 430 l-55 55 M575 430 l-78 0 M575 430 l-55 -55"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 575 430" to="360 575 430" dur="2.2s" repeatCount="indefinite"/>
    </g>
    <path d="M260 430 L365 300 L575 430 L260 430 L470 430 L365 300 L430 250 L575 430" fill="none" class="ink"/>
    <path d="M430 250 l-5 -45 M410 205 h45" class="ink" fill="none"/>
    <path d="M470 430 q24 -30 48 0" fill="none" class="ink"/>
    <circle cx="470" cy="430" r="13" fill="#ef7d32" class="ink"/>
    <g transform="translate(470 430)">
      <path d="M0 0 l-35 -25" class="ink"/>
      <path d="M0 0 l35 25" class="ink"/>
      <circle cx="-35" cy="-25" r="7" fill="#18212b"/>
      <circle cx="35" cy="25" r="7" fill="#18212b"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="407" cy="245" rx="92" ry="112" fill="#f8f6ee" class="ink"/>
    <path d="M350 275 q-45 30 -56 92 q45 -18 76 -55" fill="#d9e2e8" class="ink"/>
    <path d="M470 245 q50 18 72 62 q-45 5 -81 -22" fill="#d9e2e8" class="ink"/>
    <circle cx="400" cy="145" r="62" fill="#f8f6ee" class="ink"/>
    <path d="M365 154 Q305 165 255 194 Q318 230 390 190 Q420 175 365 154Z" fill="#f3a34a" class="ink"/>
    <path d="M255 194 q50 10 103 1" fill="none" stroke="#c06e27" stroke-width="5"/>
    <circle cx="413" cy="137" r="9" fill="#18212b"/>
    <path d="M389 111 q27 -20 49 2" fill="none" class="ink"/>
    <path d="M372 340 q-12 46 -4 76 M445 340 q10 45 2 76" fill="none" class="ink"/>
    <path d="M362 415 h35 M430 415 h35" class="ink" fill="none"/>
    <path d="M370 190 q34 20 66 0" fill="none" stroke="#ef7d32" stroke-width="7"/>
    <text x="405" y="270" text-anchor="middle" class="label" font-size="18" font-weight="900">HONK!</text>
  </g>

  <g transform="translate(600 190)">
    <path d="M0 0 q45 -22 88 0" fill="none" class="ink"/>
    <text x="44" y="-12" text-anchor="middle" class="label" font-size="16" font-weight="700">BIKE LANE?</text>
    <path d="M44 5 l0 38" class="ink"/>
    <path d="M44 43 l-10 -12 M44 43 l10 -12" class="ink"/>
  </g>

  <rect x="24" y="548" width="752" height="34" rx="10" fill="#fff5d7" stroke="#18212b" stroke-width="3"/>
  <text x="400" y="571" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-27 20:02:01 SGT (UTC+08:00)</text>
</svg>