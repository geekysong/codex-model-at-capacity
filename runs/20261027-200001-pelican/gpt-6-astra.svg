  </text>
  <text x="400" y="578" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#ffffff">
    2026-10-27 20:00:01 SGT (UTC+08:00)
  </text>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(300 385)">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(585 385)">
    <use href="#wheel"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
