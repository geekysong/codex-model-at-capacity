  </text>
  <text x="400" y="96" text-anchor="middle" font-family="Verdana, sans-serif" font-size="18" font-weight="700" fill="#314653">
    “No license. No brakes. Just vibes and a very large beak.”
  </text>

  <g filter="url(#shadow)">
