    <path d="M270 300 Q235 275 214 300" fill="none" stroke="#17212b" stroke-width="5" stroke-linecap="round"/>
    <text x="173" y="286" font-family="Verdana, sans-serif" font-size="19" font-weight="800" fill="#17212b" transform="rotate(-8 173 286)">HONK!</text>
    <path d="M626 285 Q657 267 682 286" fill="none" stroke="#17212b" stroke-width="5" stroke-linecap="round"/>
    <text x="674" y="270" font-family="Verdana, sans-serif" font-size="18" font-weight="800" fill="#17212b" transform="rotate(8 674 270)">WHEEE!</text>
