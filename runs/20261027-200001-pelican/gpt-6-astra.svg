<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636d"/>
      <stop offset="1" stop-color="#303840"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <g id="wheel">
      <circle r="58" fill="#252a30" stroke="#111820" stroke-width="6"/>
      <circle r="47" fill="none" stroke="#d8e2e8" stroke-width="4"/>
      <g stroke="#d8e2e8" stroke-width="3">
        <path d="M0-47V47M-47 0H47M-33-33L33 33M33-33L-33 33"/>
      </g>
      <circle r="8" fill="#f7c948" stroke="#111820" stroke-width="3"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="42" fill="#fff3a6" opacity=".85"/>
  <path d="M0 340 Q120 275 245 330 T490 315 T800 300 V430 H0Z" fill="#a9d39b"/>
  <path d="M0 390 Q170 350 330 385 T800 360 V455 H0Z" fill="#78b77c"/>
