      <path d="M470 252 Q514 270 536 303" fill="none" stroke="#f8f4e8" stroke-width="20" stroke-linecap="round"/>
      <circle cx="320" cy="329" r="10" fill="#d9a85d" stroke="#17212b" stroke-width="4"/>
      <circle cx="536" cy="303" r="10" fill="#d9a85d" stroke="#17212b" stroke-width="4"/>
      <path d="M388 296 Q371 339 374 374" fill="none" stroke="#f8f4e8" stroke-width="22" stroke-linecap="round"/>
      <path d="M448 298 Q465 338 452 373" fill="none" stroke="#f8f4e8" stroke-width="22" stroke-linecap="round"/>
      <path d="M374 374 L397 353 M452 373 L445 414" stroke="#d9a85d" stroke-width="12" stroke-linecap="round"/>
      <path d="M362 161 Q414 128 472 160" fill="none" stroke="#e54b4b" stroke-width="12" stroke-linecap="round"/>
      <path d="M365 160 L390 139 L410 165" fill="#e54b4b" stroke="#17212b" stroke-width="4"/>
