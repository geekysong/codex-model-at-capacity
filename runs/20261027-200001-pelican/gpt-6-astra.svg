  <g fill="#ffffff" opacity=".8">
    <circle cx="120" cy="145" r="18"/><circle cx="145" cy="140" r="25"/><circle cx="175" cy="148" r="17"/>
  </g>

  <text x="400" y="548" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
