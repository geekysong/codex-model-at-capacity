<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle</title>
  <desc id="desc">A self-important pelican pedals a bicycle with a fish in its beak, while a small duck cheers from the roadside.</desc>
  <style>
    .ink{stroke:#203044;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .wheel{fill:none;stroke:#203044;stroke-width:7}
    .spoke{stroke:#708399;stroke-width:2}
    .label{font-family:system-ui,sans-serif;fill:#203044}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
    .ride{transform-box:fill-box;transform-origin:center;animation:bob .6s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){.spin,.ride{animation:none}}
  </style>

  <rect width="800" height="600" fill="#dff5f2"/>
  <circle cx="680" cy="105" r="48" fill="#ffd166"/>
  <path d="M0 365 Q120 330 245 360 T500 350 T800 365 V475 H0Z" fill="#9bd7ad"/>
  <path d="M0 425 Q140 405 270 430 T540 418 T800 430" fill="none" stroke="#6cbd90" stroke-width="4"/>
  <path d="M0 475H800" stroke="#203044" stroke-width="5"/>
  <path d="M0 490H800" stroke="#f7f2df" stroke-width="3" stroke-dasharray="34 28"/>

  <text id="title" x="40" y="58" class="label" font-size="31" font-weight="900" letter-spacing="1">THE PELICAN CYCLE</text>
  <text x="42" y="88" class="label" font-size="16" font-weight="600">“I’m not late. I’m on bird time.”</text>
  <path d="M42 105H365" stroke="#203044" stroke-width="4" stroke-linecap="round"/>

  <!-- Bicycle -->
  <g aria-label="Bicycle">
    <g class="wheel" cx="255" cy="405" r="67">
      <circle cx="255" cy="405" r="67"/>
      <g class="spin">
        <path class="spoke" d="M255 338V472M188 405H322M208 358L302 452M302 358L208 452"/>
      </g>
    </g>
    <g class="wheel" cx="505" cy="405" r="67">
      <circle cx="505" cy="405" r="67"/>
      <g class="spin">
        <path class="spoke" d="M505 338V472M438 405H572M458 358L552 452M552 358L458 452"/>
      </g>
    </g>
    <path d="M255 405L350 405L315 337L255 405M350 405L408 337L505 405M315 337L408 337" fill="none" class="ink"/>
    <circle cx="350" cy="405" r="12" fill="#ef6b55" class="ink"/>
    <path d="M350 405L370 425M350 405L330 425M358 332H396M315 337L303 325" fill="none" class="ink"/>
    <path d="M390 333L408 337L419 325" fill="none" class="ink"/>
    <path d="M245 335H286M265 335V345" fill="none" class="ink"/>
    <path d="M424 341L443 349" stroke="#ef6b55" stroke-width="8" stroke-linecap="round"/>
    <path d="M318 405H382M472 405H538" stroke="#203044" stroke-width="4"/>
  </g>

  <!-- Pelican and its little riding bounce -->
  <g class="ride">
    <!-- tail feathers -->
    <path d="M325 272L292 261L307 283L279 287L316 300Z" fill="#f4a261" class="ink"/>
    <!-- body -->
    <ellipse cx="365" cy="276" rx="67" ry="49" fill="#fffdf4" class="ink"/>
    <path d="M330 294Q363 329 408 292Q397 327 363 331Q338 327 330 294Z" fill="#ef6b55" class="ink"/>
    <!-- wing -->
    <path d="M340 268Q378 236 411 269Q387 294 352 289Z" fill="#c7d6df" class="ink"/>
    <path d="M352 272Q377 254 396 270" fill="none" stroke="#7a92a4" stroke-width="3"/>
    <!-- long neck -->
    <path d="M398 267Q423 245 421 204Q420 178 443 163" fill="none" stroke="#fffdf4" stroke-width="25" stroke-linecap="round"/>
    <path d="M398 267Q423 245 421 204Q420 178 443 163" fill="none" class="ink" stroke-width="5"/>
    <!-- head -->
    <ellipse cx="454" cy="151" rx="36" ry="29" fill="#fffdf4" class="ink"/>
    <path d="M482 157Q520 150 539 166Q516 183 482 170Z" fill="#f4a261" class="ink"/>
    <path d="M495 163Q518 166 533 168Q514 184 494 176Z" fill="#ef6b55"/>
    <circle cx="465" cy="145" r="4.5" fill="#203044"/>
    <path d="M456 135Q466 128 475 135" fill="none" stroke="#203044" stroke-width="3"/>
    <!-- fish in beak -->
    <path d="M513 140Q526 129 541 139Q526 151 513 140ZM541 139L550 132V146Z" fill="#5aa9a0" stroke="#203044" stroke-width="2.5"/>
    <circle cx="521" cy="138" r="1.8" fill="#203044"/>
    <path d="M527 132L531 127M527 148L532 152" stroke="#203044" stroke-width="2"/>
    <!-- helmet -->
    <path d="M426 139Q432 111 460 113Q480 115 486 137Z" fill="#ffd166" class="ink"/>
    <path d="M423 139H488" fill="none" class="ink"/>
    <!-- feet and pedals -->
    <path d="M342 321Q350 339 370 331L378 324M374 324Q389 315 401 321L408 329" fill="none" stroke="#f4a261" stroke-width="9" stroke-linecap="round"/>
    <path d="M370 331L364 398M401 321L350 400" fill="none" stroke="#203044" stroke-width="5" stroke-linecap="round"/>
    <path d="M355 398H378M340 400H362" stroke="#203044" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Expression marks and roadside duck -->
  <path d="M564 190Q579 180 586 190M575 210L589 211" fill="none" stroke="#203044" stroke-width="3" stroke-linecap="round"/>
  <text x="572" y="174" class="label" font-size="14" font-weight="800">HONK!</text>
  <g transform="translate(632 354)">
    <ellipse cx="38" cy="45" rx="37" ry="24" fill="#ffd166" class="ink"/>
    <circle cx="52" cy="16" r="20" fill="#ffd166" class="ink"/>
    <path d="M69 16L91 23L69 29Z" fill="#ef6b55" class="ink"/>
    <circle cx="57" cy="12" r="3" fill="#203044"/>
    <path d="M25 66V79M48 66V79M18 80H31M41 80H55" fill="none" stroke="#203044" stroke-width="4" stroke-linecap="round"/>
    <path d="M8 39L-3 29M8 47L-5 47" stroke="#203044" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="620" y="333" class="label" font-size="13" font-weight="700">GO, BOSS!</text>

  <!-- Small motion lines -->
  <path d="M196 289H230M184 303H219M553 281H584" stroke="#203044" stroke-width="3" stroke-linecap="round"/>
  <path d="M254 515Q400 501 546 515" fill="none" stroke="#203044" stroke-width="2" opacity=".25"/>

  <!-- Footer kept clear of the scene -->
  <rect x="0" y="540" width="800" height="60" fill="#203044"/>
  <text x="400" y="577" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#fffdf4">2026-10-25 10:01:59 SGT (UTC+08:00)</text>
</svg>