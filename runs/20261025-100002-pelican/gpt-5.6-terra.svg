    <path d="M348 263q58 37 99 5-6 50-42 68-43 14-69-22z" fill="#d9e5d4" class="ink"/>
    <path d="M357 272q25 25 57 29" fill="none" class="thin"/>
    <circle cx="408" cy="184" r="12" fill="#fff" class="ink"/>
    <circle cx="411" cy="185" r="4" fill="#17233a"/>
    <path d="M369 167q19-16 35-6" fill="none" class="ink"/>
    <path d="M384 326q26 10 46-2l16 43-59 7z" fill="#d9e5d4" class="ink"/>

    <g class="leg">
      <path d="M393 359q-24 35 9 57l34-9" fill="none" class="ink"/>
      <path d="M405 416h39" class="ink"/>
      <path d="M420 365q29 23 7 57" fill="none" class="ink"/>
      <path d="M418 423h39" class="ink"/>
    </g>
    <path d="M351 282q-32 8-44-13" fill="none" class="ink"/>
    <path d="M304 268l-18-12" class="ink"/>
    <path d="M445 271q23 13 30-8" fill="none" class="ink"/>
  </g>

  <g transform="translate(570 165)">
    <path d="M0 84q13-71 67-75 52-2 65 54l-23 38H15z" fill="#fff7d5" class="ink"/>
    <path d="M30 57q29-28 57 0" fill="none" class="thin"/>
    <text x="66" y="43" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="20" fill="#17233a">HONK!</text>
    <path d="M37 105q24 13 49 0" fill="none" class="thin"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#17233a">
    <text x="64" y="535" font-size="19" font-weight="bold">Campaign promise:</text>
    <text x="64" y="559" font-size="17">“I will steer us toward the nearest fish market.”</text>
  </g>

  <rect x="0" y="572" width="800" height="28" fill="#17233a"/>
  <text x="400" y="592" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#fff8e8">2026-10-25 10:02:18 SGT (UTC+08:00)</text>
</svg>