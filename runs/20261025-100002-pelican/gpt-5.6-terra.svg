<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Democracy</title>
  <desc id="desc">A satirical cartoon of an imperious pelican riding a wobbly bicycle.</desc>
  <style>
    .ink{stroke:#17233a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#17233a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
    .pelican{transform-box:fill-box;transform-origin:center bottom;animation:bob .55s ease-in-out infinite alternate}
    .leg{transform-box:fill-box;transform-origin:50% 0;animation:pedal .55s ease-in-out infinite alternate}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-7px) rotate(-1deg)}}
    @keyframes pedal{to{transform:rotate(18deg)}}
  </style>

  <rect width="800" height="600" fill="#f8e8b9"/>
  <path d="M0 342Q95 315 188 344T370 336T558 346T800 326V510H0Z" fill="#9bd4c8"/>
  <path d="M0 395Q118 368 236 397T462 384T650 397T800 381" fill="none" stroke="#4faeb1" stroke-width="8" opacity=".65"/>
  <path d="M0 425Q94 402 185 429T373 420T559 430T800 411" fill="none" stroke="#4faeb1" stroke-width="5" opacity=".55"/>
  <path d="M0 486H800" stroke="#e27254" stroke-width="12"/>
  <path d="M0 492H800" stroke="#17233a" stroke-width="5"/>

  <g fill="#fff7d5" stroke="#17233a" stroke-width="4">
    <path d="M77 108l16-31 13 31 20-21 3 35z"/>
    <path d="M665 125l15-29 13 30 21-19 1 36z"/>
  </g>
  <g font-family="Arial Black,Arial,sans-serif" text-anchor="middle">
    <text x="400" y="78" font-size="45" fill="#17233a">PELICAN PEDALS DEMOCRACY!</text>
    <text x="400" y="112" font-size="18" fill="#e25e45">“No hands, no brakes, and somehow still in charge.”</text>
  </g>

  <g class="wheel">
    <circle cx="235" cy="405" r="72" fill="#fff8e8" class="ink"/>
    <circle cx="235" cy="405" r="8" fill="#e25e45" class="ink"/>
    <g class="thin" fill="none">
      <path d="M235 333V477M163 405H307M184 354l102 102M286 354L184 456"/>
    </g>
    <path d="M205 478q30 13 60 0" fill="none" class="thin"/>
  </g>
  <g class="wheel">
    <circle cx="535" cy="405" r="72" fill="#fff8e8" class="ink"/>
    <circle cx="535" cy="405" r="8" fill="#e25e45" class="ink"/>
    <g class="thin" fill="none">
      <path d="M535 333V477M463 405H607M484 354l102 102M586 354L484 456"/>
    </g>
    <path d="M505 478q30 13 60 0" fill="none" class="thin"/>
  </g>

  <g fill="none" class="ink">
    <path d="M235 405L350 305L445 405Z"/>
    <path d="M350 305L480 292L535 405"/>
    <path d="M445 405L535 405"/>
    <path d="M480 292l-24-35"/>
    <path d="M432 257h58"/>
    <path d="M350 305l-18-39"/>
    <path d="M305 266h57"/>
  </g>
  <path d="M293 255q38-13 78 0l-8 16h-64z" fill="#e25e45" class="ink"/>
  <path d="M447 251q14-21 33-8 16 12 26 0" fill="none" class="ink"/>
  <circle cx="445" cy="405" r="21" fill="#f5c744" class="ink"/>
  <circle cx="445" cy="405" r="5" fill="#17233a"/>
  <path d="M445 405l39 20M445 405l-38-20" class="ink"/>

  <g class="pelican">
    <path d="M334 313q-24-60 9-113 24-39 74-18 37 17 32 72l-13 84z" fill="#f6f3db" class="ink"/>
    <path d="M348 231q-14-43 16-76 36-37 85-15 31 14 22 56l-17 50z" fill="#f6f3db" class="ink"/>
    <path d="M398 183q27-16 57 2 29 17 68 6-14 29-64 34-48 5-75-15z" fill="#f0a63d" class="ink"/>
    <path d="M392 203q42 25 106 4-8 54-48 58-39 3-58-31z" fill="#f7bd49" class="ink"/>
