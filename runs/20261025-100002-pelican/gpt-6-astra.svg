<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A helmeted pelican pedals a tiny bicycle, carrying fish in its enormous bill pouch. The wheels spin, the pedals turn, and the pelican bobs in a looping animation.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10 10 0" stroke="#d8e9e9" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <path d="M0 330Q160 265 310 325T610 300T800 320V453H0Z" fill="#d8e9cd"/>
  <circle cx="700" cy="135" r="35" fill="#ffd16c"/>
  <g fill="#fff" opacity=".9">
    <ellipse cx="122" cy="149" rx="57" ry="15"/>
    <ellipse cx="146" cy="137" rx="28" ry="23"/>
    <ellipse cx="597" cy="187" rx="53" ry="14"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#203841">
    <text x="400" y="57" font-size="43" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
    <text x="400" y="88" font-size="17" letter-spacing="2">ONE BIRD. TWO WHEELS. NO PORTION CONTROL.</text>
  </g>

  <path d="M40 449H760" stroke="#203841" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="397" cy="448" rx="230" ry="10" fill="#203841" opacity=".1"/>

  <!-- Wheels rotate around their own hubs. -->
  <g stroke="#203841" stroke-linecap="round">
    <g transform="translate(257 377)">
      <circle r="69" fill="#fffdf4" stroke-width="10"/>
      <circle r="59" fill="none" stroke="#8bb4b8" stroke-width="3"/>
      <g stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41 41 41M-41 41 41-41"/>
        <path d="M14-57 24-53" stroke="#ef7851" stroke-width="7"/>
      </g>
    </g>
    <g transform="translate(547 377)">
      <circle r="69" fill="#fffdf4" stroke-width="10"/>
      <circle r="59" fill="none" stroke="#8bb4b8" stroke-width="3"/>
      <g stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41 41 41M-41 41 41-41"/>
        <path d="M14-57 24-53" stroke="#ef7851" stroke-width="7"/>
      </g>
    </g>
  </g>

  <!-- The comically undersized bicycle. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M257 377 327 285 382 377ZM327 285H503L382 377M503 285 547 377" stroke="#203841" stroke-width="13"/>
    <path d="M257 377 327 285 382 377ZM327 285H503L382 377M503 285 547 377" stroke="#e85e4a" stroke-width="8"/>
    <path d="M327 285 316 263M503 285 489 243 522 232" stroke="#203841" stroke-width="8"/>
    <path d="M299 263H341M517 232H535" stroke="#203841" stroke-width="12"/>
    <path d="M257 377H382" stroke="#203841" stroke-width="3"/>
  </g>
  <g fill="#ffd16c" stroke="#203841" stroke-width="4">
    <circle cx="257" cy="377" r="8"/>
    <circle cx="547" cy="377" r="8"/>
    <circle cx="382" cy="377" r="15"/>
  </g>

  <!-- Pedaling foot and crank. -->
  <g transform="translate(382 377)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-22 0H22" stroke="#203841" stroke-width="7"/>
      <path d="M-22-9V9M22-9V9" stroke="#203841" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- The rider bobs independently of the readable lettering. -->
  <g stroke="#203841" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>

    <path d="M333 258 355 305 388 336" fill="none" stroke="#e7a330" stroke-width="13"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 355 305;7 355 305;-6 355 305" dur="1.8s" repeatCount="indefinite"/>
      <path d="M355 305 370 345 404 354 378 359 359 352" fill="#ffbf45"/>
    </g>

    <path d="M278 223 231 201 250 241 226 244 286 269" fill="#f8fbef"/>
    <path d="M279 200C314 176 351 186 376 210C384 179 363 153 389 133C420 112 447 136 439 164C435 181 419 190 421 217C425 251 394 279 347 279C302 280 267 257 270 225Z" fill="#fffdf3"/>
    <path d="M296 215C321 201 363 217 375 249C345 265 310 255 296 215Z" fill="#d6e4df"/>
    <path d="M308 224 345 240M305 235 335 249" fill="none" stroke="#a1b8b3" stroke-width="3"/>

    <!-- Wing reaches the handlebar. -->
    <path d="M363 211Q416 219 465 251Q484 257 501 242" fill="none" stroke="#203841" stroke-width="17"/>
    <path d="M363 211Q416 219 465 251Q484 257 501 242" fill="none" stroke="#fffdf3" stroke-width="11"/>

    <!-- A bill pouch that doubles as a fish truck. -->
    <path d="M430 166 647 180C625 231 559 259 496 231C461 217 440 191 430 166Z" fill="#ffcf6b"/>
    <path d="M436 164 653 179 645 188 434 180Z" fill="#f6a339"/>
    <path d="M475 203Q543 237 607 204" fill="none" stroke="#e9a548" stroke-width="3"/>

    <g fill="#75b9c1" stroke-width="3">
      <path d="M500 208Q519 187 542 207L558 197V222L542 213Q518 230 500 208Z"/>
      <path d="M558 221Q576 202 596 215L611 207 607 229 594 221Q574 235 558 221Z"/>
    </g>
    <circle cx="511" cy="207" r="2.5" fill="#203841" stroke="none"/>
    <circle cx="568" cy="219" r="2.5" fill="#203841" stroke="none"/>

    <ellipse cx="421" cy="153" rx="12" ry="14" fill="#fff"/>
    <circle cx="426" cy="155" r="4.5" fill="#203841" stroke="none"/>
    <path d="M408 133 430 138" fill="none"/>
    <path d="M382 139Q379 103 412 103Q445 103 452 135Z" fill="#e85e4a"/>
    <path d="M399 110 396 126M416 109 419 128M434 116 439 130" fill="none" stroke="#fff7df" stroke-width="5"/>
    <path d="M389 143 398 172 408 176" fill="none" stroke-width="3"/>
    <path d="M381 184 362 178 346 191 369 196 348 213 381 202" fill="#e85e4a"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#203841">
    <path d="M69 285Q61 271 78 263H204Q220 265 216 282V316Q216 330 202 330H163L176 350 143 330H81Q68 329 69 315Z" fill="#fffdf3" stroke="#203841" stroke-width="3"/>
    <text x="143" y="287" text-anchor="middle" font-size="17" font-weight="bold">“It's called</text>
    <text x="143" y="311" text-anchor="middle" font-size="19" font-weight="bold">CARP-loading.”</text>
  </g>

  <rect x="0" y="471" width="800" height="129" fill="#203841"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="400" y="507" fill="#fff7df" font-size="23" font-weight="bold">He rides for fitness. His beak rides for takeout.</text>
    <path d="M100 530H700" stroke="#739092" stroke-width="1"/>
    <text x="400" y="567" fill="#fff7df" font-size="19">2026-10-25 10:00:02 SGT (UTC+08:00)</text>
  </g>
</svg>