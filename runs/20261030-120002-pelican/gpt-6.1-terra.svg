<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A pelican pedals a bicycle along a seaside road, carrying a fish in its enormous beak.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a8e3ef"/>
      <stop offset="1" stop-color="#e9f9ed"/>
    </linearGradient>
    <linearGradient id="water" x2="0" y2="1">
      <stop stop-color="#64c5d0"/>
      <stop offset="1" stop-color="#a7e2d8"/>
    </linearGradient>
    <style>
      .outline { stroke:#283b43; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { animation: spin 2s linear infinite; transform-box: fill-box; transform-origin:center; }
      .rider { animation: bob .7s ease-in-out infinite alternate; }
      .pedals { animation: spin 1.2s linear infinite; transform-origin:390px 403px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-4px) rotate(-1deg); } }
      @media (prefers-reduced-motion: reduce) { .wheel,.rider,.pedals { animation-duration:8s; } }
    </style>
  </defs>

