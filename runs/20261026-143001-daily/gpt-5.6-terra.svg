  <g font-family="Arial, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#111827">
    <text x="70" y="85">1</text><text x="130" y="85">2</text><text x="190" y="85">3</text><text x="250" y="85">4</text>
    <text x="70" y="145">5</text><text x="130" y="145" font-weight="bold">6</text><text x="190" y="145">7</text><text x="250" y="145">8</text>
    <text x="70" y="205">9</text><text x="130" y="205">10</text><text x="190" y="205">11</text><text x="250" y="205">12</text>
