<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while trying to balance a giant fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565b66"/>
      <stop offset="1" stop-color="#292d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17212b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#202735; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#202735; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite; }
      .bird { transform-box:fill-box; transform-origin:center bottom; animation:bob .65s ease-in-out infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0) rotate(-1deg); } to { transform:translateY(-7px) rotate(2deg); } }
      @media (prefers-reduced-motion: reduce) {
        .wheel,.pedal,.bird { animation:none; }
      }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="105" cy="110" r="43" fill="#fff5a8" opacity=".9"/>
  <path d="M0 350 Q120 300 240 350 T480 340 T800 330 V430 H0Z" fill="#9bcf8a"/>
  <path d="M0 395 Q140 350 280 395 T560 388 T800 378 V470 H0Z" fill="#6fac72"/>
  <path d="M0 450 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 515 H800" stroke="#f8dc63" stroke-width="8" stroke-dasharray="54 30"/>
  <path d="M0 470 Q180 440 355 470 T800 465" fill="none" stroke="#858b96" stroke-width="6" opacity=".65"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="39" font-weight="900" fill="#fff" stroke="#202735" stroke-width="2" paint-order="stroke">PELICAN PEDAL PANIC!</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="18" font-weight="700">“One bird. Two wheels. Zero sense of direction.”</text>

  <g filter="url(#shadow)">
    <g class="wheel">
      <circle cx="260" cy="450" r="74" fill="#202735"/>
      <circle cx="260" cy="450" r="61" fill="#d8e6ed" stroke="#202735" stroke-width="7"/>
      <circle cx="260" cy="450" r="9" fill="#202735"/>
      <path d="M260 389V511 M199 450H321 M217 407L303 493 M303 407L217 493" stroke="#7a8d9a" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="590" cy="450" r="74" fill="#202735"/>
      <circle cx="590" cy="450" r="61" fill="#d8e6ed" stroke="#202735" stroke-width="7"/>
      <circle cx="590" cy="450" r="9" fill="#202735"/>
      <path d="M590 389V511 M529 450H651 M547 407L633 493 M633 407L547 493" stroke="#7a8d9a" stroke-width="4"/>
    </g>

    <path d="M260 450 L392 315 L590 450 L470 450 L392 315 L260 450" fill="none" class="ink" stroke="#e64f46" stroke-width="10"/>
    <path d="M470 450 L442 294" fill="none" class="ink" stroke="#e64f46" stroke-width="9"/>
    <path d="M442 294 Q485 270 535 295" fill="none" class="ink" stroke="#e64f46" stroke-width="9"/>
    <path d="M392 315 L365 282" fill="none" class="ink" stroke="#e64f46" stroke-width="8"/>
    <path d="M344 282 H385" class="ink" fill="none" stroke="#202735" stroke-width="8"/>
    <path d="M590 450 L618 330" fill="none" class="ink" stroke="#e64f46" stroke-width="8"/>
    <path d="M604 328 H650" class="ink" fill="none" stroke="#202735" stroke-width="8"/>

    <g class="pedal">
      <circle cx="392" cy="424" r="18" fill="#f5bf3c" class="ink"/>
      <path d="M392 424 L420 442 M392 424 L366 407" class="ink" fill="none" stroke-width="6"/>
      <rect x="416" y="438" width="25" height="8" rx="4" fill="#202735"/>
      <rect x="353" y="400" width="25" height="8" rx="4" fill="#202735"/>
    </g>

    <g class="bird">
      <ellipse cx="417" cy="270" rx="91" ry="104" fill="#f8f4df" class="ink"/>
      <path d="M353 264 Q320 220 347 173 Q382 145 421 174 Q449 208 437 266" fill="#f8f4df" class="ink"/>
      <ellipse cx="390" cy="195" rx="39" ry="49" fill="#f8f4df" class="ink"/>
      <path d="M405 202 Q500 185 574 225 Q591 237 570 250 Q491 270 411 236Z" fill="#f4a33c" class="ink"/>
      <path d="M538 224 Q582 223 609 242 Q582 259 551 254" fill="#de7832" class="ink"/>
      <circle cx="403" cy="184" r="9" fill="#202735"/>
      <circle cx="406" cy="181" r="3" fill="#fff"/>
      <path d="M374 151 Q393 130 420 145" fill="none" class="ink" stroke="#e9a726" stroke-width="8"/>
      <path d="M359 274 Q310 292 316 327 Q349 346 393 307" fill="#dfe7e9" class="ink"/>
      <path d="M466 260 Q510 273 527 316 Q493 333 454 300" fill="#dfe7e9" class="ink"/>
      <path d="M382 348 L370 397" class="ink" fill="none" stroke="#e5a32d" stroke-width="9"/>
      <path d="M463 348 L479 396" class="ink" fill="none" stroke="#e5a32d" stroke-width="9"/>
      <path d="M357 399 Q373 391 388 401" class="ink" fill="none" stroke="#202735" stroke-width="7"/>
      <path d="M466 399 Q483 390 496 401" class="ink" fill="none" stroke="#202735" stroke-width="7"/>
      <path d="M378 300 Q420 323 460 298" fill="none" class="ink" stroke="#202735" stroke-width="6"/>
      <path d="M391 303 Q421 314 448 301" fill="none" stroke="#e64f46" stroke-width="5"/>
      <path d="M437 185 Q454 173 470 188" fill="none" class="ink" stroke="#202735" stroke-width="5"/>
      <text x="305" y="140" class="label" font-size="22" font-weight="800" transform="rotate(-8 305 140)">I meant to fly!</text>
    </g>

    <g transform="rotate(-7 532 205)">
      <ellipse cx="532" cy="205" rx="67" ry="25" fill="#74b85c" class="ink"/>
      <path d="M475 205 Q505 180 558 190 Q588 198 591 214 Q550 229 500 225Z" fill="#9bd16d" class="ink"/>
      <path d="M570 195 Q600 175 620 188" fill="none" class="ink" stroke="#4e8f49" stroke-width="8"/>
      <path d="M515 191 Q523 174 534 164 M545 191 Q556 173 570 169" fill="none" class="ink" stroke="#4e8f49" stroke-width="6"/>
    </g>
  </g>

  <path d="M118 306 Q147 287 174 307" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  <path d="M153 293 Q176 275 198 293" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="400" y="562" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-27 08:00:35 SGT (UTC+08:00)</text>
</svg>