    <path d="m421 237 18 4" stroke="#edb953" stroke-width="9" stroke-linecap="round"/>
    <path d="M269 254 309 290" fill="none" stroke="#edb953" stroke-width="10" stroke-linecap="round"/>
    <path d="m298 288 25 3-17 12Z" fill="#edb953" stroke="#243c48" stroke-width="3"/>
  </g>

  <path d="M311 258Q304 317 350 399" fill="none" stroke="#243c48" stroke-width="12" stroke-linecap="round"/>
  <path d="M311 258Q304 317 350 399" fill="none" stroke="#edb953" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(350 399)">
    <circle r="23" fill="#fff5dc" stroke="#243c48" stroke-width="5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-28 0H28" stroke="#243c48" stroke-width="6"/>
      <path d="M-39 0h22M17 0h22" stroke="#edb953" stroke-width="9" stroke-linecap="round"/>
    </g>
    <circle r="6" fill="#243c48"/>
