<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican's Pedal Economy</title>
  <desc id="description">A determined pelican pedals a bicycle while carrying a beak full of fish. The wheels spin, the pedals turn, and the pelican bobs. A roadside sign announces a fish-powered economy.</desc>
  <defs>
    <pattern id="tread" width="18" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7 8 1" stroke="#847365" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <circle r="82" fill="#fff8dd" stroke="#243c48" stroke-width="12"/>
      <circle r="72" fill="none" stroke="#cfa960" stroke-width="3"/>
      <g stroke="#82959a" stroke-width="2.5">
        <path d="M-73 0H73M0-73V73M-52-52 52 52M-52 52 52-52"/>
        <path d="m-28-67 56 134m-95-95 134 56m-134 0 134-56m-95 95 56-134"/>
      </g>
      <circle cy="-75" r="5" fill="#ef7550"/>
      <circle r="10" fill="#e5b748" stroke="#243c48" stroke-width="4"/>
    </g>
    <g id="fish">
      <path d="M-20 0Q0-20 24 0 0 20-20 0L-34 12V-12Z" fill="#57aeb0" stroke="#243c48" stroke-width="2"/>
      <circle cx="14" cy="-3" r="2.5" fill="#243c48"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <circle cx="705" cy="143" r="48" fill="#f7ce65"/>
  <path d="M0 349Q110 296 223 341T446 335T800 324V492H0Z" fill="#d7e3c2"/>
  <path d="M0 401Q194 357 376 394T800 382V495H0Z" fill="#b7cda9"/>
  <g fill="none" stroke="#a8c2be" stroke-width="3" stroke-linecap="round">
    <path d="M54 182q12-12 24 0 12-12 24 0M603 210q10-10 20 0 10-10 20 0"/>
  </g>

  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#243c48">THE PEDAL ECONOMY</text>
  <text x="400" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#755b49">One pelican. Two wheels. An outrageous lunch allowance.</text>

  <g transform="translate(603 288)">
    <path d="M46 35V161" stroke="#856449" stroke-width="9"/>
    <rect x="-9" y="-29" width="151" height="79" rx="8" fill="#fff5dc" stroke="#243c48" stroke-width="4"/>
    <text x="66" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#243c48">FISH-POWERED</text>
    <text x="66" y="21" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#243c48">ECONOMY</text>
    <path d="M40 36h54m-10-7 10 7-10 7" fill="none" stroke="#e46646" stroke-width="3"/>
  </g>

  <path d="M0 492H800" stroke="#8e7761" stroke-width="5"/>
  <rect y="496" width="800" height="13" fill="url(#tread)" opacity=".5"/>
  <ellipse cx="354" cy="484" rx="233" ry="12" fill="#6f8069" opacity=".2"/>

  <g transform="translate(222 399)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(490 399)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <use href="#wheel"/>
