    <path d="M420 179q51 24 99-4" fill="none" stroke="#c98e38" stroke-width="3"/>
    <use href="#fish" transform="translate(452 180) rotate(10) scale(.65)"/>
    <use href="#fish" transform="translate(498 181) rotate(-14) scale(.6)"/>
    <circle cx="379" cy="138" r="10" fill="white" stroke="#243c48" stroke-width="3"/>
    <circle cx="383" cy="138" r="4" fill="#243c48"/>
    <path d="m369 123 19-4" stroke="#243c48" stroke-width="4" stroke-linecap="round"/>
    <path d="M347 122q15-29 45-7l-1 7Z" fill="#e96f4c" stroke="#243c48" stroke-width="3"/>
    <path d="m357 110-6-9m18 7 1-10" stroke="#243c48" stroke-width="3" stroke-linecap="round"/>
    <path d="M346 205q34 9 81 35" fill="none" stroke="#243c48" stroke-width="12" stroke-linecap="round"/>
