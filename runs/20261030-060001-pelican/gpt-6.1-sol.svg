  <g transform="translate(81 117)">
    <path d="M16 0H203Q219 0 219 16V60Q219 76 203 76H117L136 98 91 76H16Q0 76 0 60V16Q0 0 16 0Z" fill="white" stroke="#243c48" stroke-width="3"/>
    <text x="110" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#243c48">“My fuel bill?</text>
    <text x="110" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#243c48">I swallow it.”</text>
  </g>

  <rect y="519" width="800" height="81" fill="#243c48"/>
  <text x="400" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#fff5dc">He cycles to work. His lunch enjoys the company vehicle.</text>
  <text x="400" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fff5dc">2026-10-30 06:01:27 SGT (UTC+08:00)</text>
</svg>