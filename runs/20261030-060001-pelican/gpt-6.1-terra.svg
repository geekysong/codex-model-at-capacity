    <path d="M359 239 Q398 230 416 258 L441 259" fill="none" stroke="#f9f7e9" stroke-width="19" stroke-linecap="round"/>
    <path d="M359 239 Q398 230 416 258 L441 259" fill="none" stroke="#173b43" stroke-width="5" stroke-linecap="round"/>
    <path d="M441 253 l14 8 -15 7" fill="none" stroke="#173b43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M368 234 Q382 205 369 178 Q360 158 374 137 Q389 118 415 130 Q442 143 437 169 L430 204 Q422 225 405 238Z" fill="#fffdf1" class="outline"/>
    <path d="M410 170 Q447 170 525 193 Q481 198 425 194 Q418 193 410 189Z" fill="#f4a944" class="outline"/>
    <path d="M416 190 Q422 228 452 235 Q490 237 525 193 Q476 203 416 190Z" fill="#f7c46c" class="outline"/>
    <path d="M441 214 Q455 200 472 213 Q457 226 441 214Z" fill="#6b9fab" stroke="#173b43" stroke-width="3"/>
    <path d="M470 213 l10 -7 v14Z" fill="#6b9fab" stroke="#173b43" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="447" cy="213" r="2" fill="#173b43"/>
    <circle cx="413" cy="154" r="13" fill="#fff" stroke="#173b43" stroke-width="4"/>
    <circle cx="418" cy="155" r="5" fill="#173b43"/>
    <path d="M400 136 Q415 128 428 137" fill="none" stroke="#173b43" stroke-width="5" stroke-linecap="round"/>
    <path d="M375 128 Q381 105 403 106 Q421 106 430 126Z" fill="#e85f4f" stroke="#173b43" stroke-width="5" stroke-linejoin="round"/>
    <path d="M371 128 Q400 133 435 127" fill="none" stroke="#173b43" stroke-width="6" stroke-linecap="round"/>
  </g>

  <path d="M47 495 H753" stroke="#bdd6ca" stroke-width="2"/>
  <text x="400" y="525" text-anchor="middle" class="caption">“My lunch rides in first class.”</text>
  <text x="400" y="556" text-anchor="middle" class="date">2026-10-30 06:02:54 SGT (UTC+08:00)</text>
</svg>