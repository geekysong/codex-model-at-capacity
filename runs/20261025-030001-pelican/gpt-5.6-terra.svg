<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the Town</title>
  <desc id="desc">A satirical cartoon of a proud pelican riding a bicycle while fish commuters look on.</desc>
  <defs>
