<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past Common Sense</title>
  <desc id="desc">A satirical cartoon of a confident pelican riding a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#82d7f5"/>
      <stop offset="1" stop-color="#e9f8df"/>
    </linearGradient>
    <style>
      .wheel { animation: spin 1.2s linear infinite; transform-origin: center; }
      .bob { animation: bob .65s ease-in-out infinite alternate; }
      .leg { animation: pedal .6s linear infinite; transform-origin: 403px 376px; }
      .leg2 { animation: pedal .6s linear infinite reverse; transform-origin: 403px 376px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
      @keyframes pedal { to { transform: rotate(360deg); } }
    </style>
  </defs>

