  <text x="111" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#20313b">DELIVERY</text>
  <text x="111" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#c34d38">→</text>

