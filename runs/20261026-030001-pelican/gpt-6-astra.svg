  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#20313b">THE BEAK ECONOMY</text>
  <text x="400" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#98603c">Zero emissions. Unlimited overhead.</text>

