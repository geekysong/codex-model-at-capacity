  <text x="655" y="323" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#20313b" transform="rotate(8 655 323)">BILL HEAVY.</text>
  <text x="655" y="345" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#20313b" transform="rotate(8 655 345)">TIP LIGHT.</text>

  <rect x="0" y="502" width="800" height="98" fill="#20313b"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff6db">He pedals for peanuts. His bill says otherwise.</text>
