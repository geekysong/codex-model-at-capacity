<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A smug pelican pedals a bicycle with an enormous beak full of fish while a sign promises lightweight delivery. Wheels spin and the rider bobs continuously.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1"/>
    <g id="wheel">
      <circle r="70" fill="#fff9df" stroke="#20313b" stroke-width="10"/>
      <circle r="59" fill="none" stroke="#f5ad40" stroke-width="3"/>
      <g stroke="#52646a" stroke-width="3">
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
      </g>
      <circle cx="0" cy="-59" r="7" fill="#ed6549" stroke="#20313b" stroke-width="2"/>
      <circle r="9" fill="#20313b"/>
    </g>
    <g id="fish">
      <path d="M-22 0Q0-22 26 0Q0 20-22 0L-36-12V12Z" fill="#67bfc1" stroke="#20313b" stroke-width="3"/>
      <circle cx="15" cy="-2" r="3" fill="#20313b"/>
    </g>
  </defs>

