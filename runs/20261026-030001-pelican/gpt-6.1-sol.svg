<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, carrying a fish in its enormous bill. The wheels spin and the rider bobs in a looping cartoon animation.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#d8caa5" opacity=".28"/>
    </pattern>
    <style>
      .outline{stroke:#243542;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#243542;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:Arial,Helvetica,sans-serif;fill:#243542}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff4d7"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M32 109H768" stroke="#243542" stroke-width="3"/>
  <text x="400" y="65" text-anchor="middle" font-size="49" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-size="17" font-weight="bold" letter-spacing="2">THE COMMUTE HAS GONE FOWL.</text>

  <!-- A single seaside cycling scene -->
  <circle cx="675" cy="174" r="34" fill="#f6bd59"/>
  <path d="M35 338Q155 305 284 337T542 335T765 329V446H35Z" fill="#c9e1d7"/>
  <path d="M35 369Q185 347 335 371T765 365" fill="none" stroke="#91beb9" stroke-width="3"/>
  <path d="M35 449H765" stroke="#243542" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="407" cy="455" rx="238" ry="13" fill="#243542" opacity=".12"/>

  <g transform="translate(84 208) rotate(-7)">
    <rect width="119" height="65" rx="5" fill="#fffdf2" class="thin"/>
    <path d="M58 65V235" class="thin" fill="none"/>
    <text x="59" y="25" text-anchor="middle" font-size="16" font-weight="bold">BIKE LANE</text>
    <text x="59" y="48" text-anchor="middle" font-size="14">NO FREE RIDES*</text>
  </g>

  <!-- Bicycle wheels -->
  <g transform="translate(277 376)">
    <circle r="70" fill="#fff9e8" class="outline"/>
    <circle r="60" fill="none" stroke="#d2bda0" stroke-width="3"/>
    <g stroke="#697d83" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-60 0H60M0-60V60M-42-42L42 42M-42 42L42-42"/>
      <circle cx="0" cy="-60" r="5" fill="#f3bd43" stroke="none"/>
    </g>
    <circle r="9" fill="#243542"/>
  </g>
  <g transform="translate(559 376)">
    <circle r="70" fill="#fff9e8" class="outline"/>
    <circle r="60" fill="none" stroke="#d2bda0" stroke-width="3"/>
    <g stroke="#697d83" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-60 0H60M0-60V60M-42-42L42 42M-42 42L42-42"/>
      <circle cx="0" cy="-60" r="5" fill="#f3bd43" stroke="none"/>
    </g>
    <circle r="9" fill="#243542"/>
  </g>

  <g fill="none" stroke="#dd584b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M277 376L346 287L405 376ZM346 287H510L405 376M510 287L559 376"/>
    <path d="M405 376L367 274M510 287L494 248"/>
  </g>
  <path d="M340 273H389" class="outline"/>
  <path d="M494 248L514 233L536 237" fill="none" class="outline"/>
  <circle cx="405" cy="376" r="18" fill="#fae7bb" class="thin"/>
  <g transform="translate(405 376)">
    <g class="thin">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-23 0H23" fill="none"/>
      <path d="M-30-3H-17M17 3H30" stroke-width="6"/>
    </g>
  </g>

  <!-- Pelican rider -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M357 264Q341 306 385 325L415 357" fill="none" stroke="#bb742d" stroke-width="12" stroke-linecap="round"/>
    <path d="M415 357L432 363L409 367" fill="#f3a747" class="thin">
      <animateTransform attributeName="transform" type="rotate" values="-10 385 325;12 385 325;-10 385 325" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M313 228L279 210L293 246L269 246L311 273" fill="#fffdf1" class="outline"/>
    <path d="M306 233Q323 194 383 208Q416 221 421 255Q406 287 360 286Q313 285 306 233Z" fill="#fffdf1" class="outline"/>
    <path d="M325 235Q354 221 386 251Q366 272 334 254" fill="#dce6df" class="thin"/>
    <path d="M391 224Q408 211 407 179Q401 147 425 137Q449 129 463 150Q472 167 460 183Q448 198 450 222L434 251" fill="#fffdf1" class="outline"/>
    <path d="M450 177Q498 181 580 176Q558 217 494 220Q468 214 450 192Z" fill="#f4c565" class="outline"/>
    <path d="M451 175L588 175L455 157Z" fill="#f6a13f" class="outline"/>
    <path d="M469 184Q500 194 548 184" fill="none" stroke="#c88832" stroke-width="3"/>
    <!-- Smug fish enjoying its free ride -->
    <path d="M500 199Q515 184 533 199L544 190V207L533 202Q516 215 500 199Z" fill="#76b9bb" class="thin"/>
    <circle cx="510" cy="198" r="2.5" fill="#243542"/>
    <path d="M515 204L522 204" stroke="#243542" stroke-width="2" stroke-linecap="round"/>
    <circle cx="442" cy="153" r="5" fill="#243542"/>
    <path d="M433 143L446 140" class="thin"/>
    <path d="M414 138Q426 119 448 130L457 137Z" fill="#dd584b" class="outline"/>
    <path d="M418 130L426 137M432 126L439 135" stroke="#fff4d7" stroke-width="4"/>
    <path d="M418 235Q457 249 493 241L514 236" fill="none" stroke="#243542" stroke-width="16" stroke-linecap="round"/>
    <path d="M418 232Q457 246 493 238L514 233" fill="none" stroke="#fffdf1" stroke-width="10" stroke-linecap="round"/>
    <path d="M358 277L380 321L389 374L412 384L381 389" fill="none" stroke="#f3a747" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" values="0 358 277;8 358 277;0 358 277;-5 358 277;0 358 277" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M400 200Q387 200 380 193" fill="none" stroke="#dd584b" stroke-width="9"/>
    <path d="M384 194L357 174L360 190L339 182L374 209Z" fill="#dd584b" class="thin"/>
  </g>

  <g transform="translate(603 252)">
    <path d="M0 0Q0-12 12-12H137Q149-12 149 0V49Q149 61 137 61H33L11 80L18 61H12Q0 61 0 49Z" fill="#fffdf2" class="thin"/>
    <text x="74" y="13" text-anchor="middle" font-size="16" font-weight="bold">“I’m reducing</text>
    <text x="74" y="35" text-anchor="middle" font-size="16" font-weight="bold">my car-bill.”</text>
  </g>
  <path d="M203 331H177M199 346H158M204 361H184" fill="none" stroke="#243542" stroke-width="3" stroke-linecap="round"/>

  <text x="400" y="491" text-anchor="middle" font-size="22" font-weight="bold">Two wheels. One enormous carry-on.</text>
  <text x="400" y="518" text-anchor="middle" font-size="16">*The fish has declined to contribute to the pedaling.</text>
  <path d="M32 540H768" stroke="#243542" stroke-width="2"/>
  <text x="400" y="574" text-anchor="middle" font-size="18" font-weight="bold">2026-10-26 03:01:04 SGT (UTC+08:00)</text>
</svg>