<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A smug pelican rides a bicycle with spinning wheels and bobbing pedals while a fish protests from its beak.</desc>
  <defs>
    <style>
      .ink { stroke:#263447; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.4s linear infinite; }
      .rider { animation:bob 0.7s ease-in-out infinite alternate; }
      .pedal { transform-origin:400px 393px; animation:spin 1.4s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
    <pattern id="spokes" width="1" height="1"/>
  </defs>

  <rect width="800" height="600" fill="#f9f2dd"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#cdebf0" stroke="#263447" stroke-width="5"/>
  <circle cx="690" cy="123" r="42" fill="#ffd66a"/>
