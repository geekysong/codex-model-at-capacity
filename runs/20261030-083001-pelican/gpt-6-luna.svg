<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A dignified pelican pedals a bicycle, carrying a fish in its beak and a tiny traffic cone in its basket.</desc>
  <defs>
    <style>
      .ink{stroke:#17324a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.8s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:bob .55s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-5px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#dff5f2"/>
  <circle cx="690" cy="104" r="48" fill="#ffd166"/>
  <path d="M0 355 Q140 310 270 350 T540 342 T800 350 V600 H0Z" fill="#a9dfc8"/>
  <path d="M0 420 Q180 390 345 420 T800 410 V600 H0Z" fill="#78c7a6"/>

  <text id="title" x="400" y="58" text-anchor="middle" font-family="Verdana, sans-serif" font-size="32" font-weight="900" fill="#17324a">THE PELICAN EXPRESS</text>
  <text x="400" y="88" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="700" fill="#31566a">“I’m cutting down on fish flights.”</text>

  <!-- little birds cheering -->
  <path d="M115 160 q15 -15 30 0 q15 -15 30 0" fill="none" class="ink"/>
  <path d="M617 180 q12 -12 24 0 q12 -12 24 0" fill="none" class="ink"/>
  <text x="82" y="193" font-family="Verdana, sans-serif" font-size="14" font-weight="700" fill="#17324a">HONK!</text>

  <!-- bicycle frame -->
  <g class="ink" fill="none">
    <circle class="wheel" cx="230" cy="414" r="74" stroke="#17324a" stroke-width="8"/>
    <circle class="wheel" cx="568" cy="414" r="74" stroke="#17324a" stroke-width="8"/>
    <g class="wheel" stroke="#5b8292" stroke-width="2.5">
      <path d="M230 340V488 M156 414H304 M178 362L282 466 M282 362L178 466"/>
      <path d="M568 340V488 M494 414H642 M516 362L620 466 M620 362L516 466"/>
    </g>
    <path d="M230 414 L365 414 L315 325 L230 414 M315 325 L438 414 L568 414 M365 414 L438 414" stroke="#ef6c55" stroke-width="10"/>
    <path d="M305 322 L327 322 M300 316 L324 316" stroke-width="6"/>
    <path d="M438 414 L452 305 M438 414 L414 425" stroke="#17324a" stroke-width="6"/>
    <circle cx="438" cy="414" r="12" fill="#ffd166" stroke="#17324a" stroke-width="4"/>
    <path d="M438 414 L459 433 M438 414 L417 395" stroke-width="6"/>
    <path d="M452 305 L487 300 M452 305 L431 285" stroke-width="6"/>
    <path d="M407 286 L436 286" stroke-width="8"/>
  </g>

  <!-- basket and absurd cargo -->
  <path d="M481 309 L548 309 L540 348 L491 348Z" fill="#f2b66d" class="ink"/>
  <path d="M496 309 L500 347 M514 309 L516 347 M533 309 L529 347" stroke="#bd7746" stroke-width="3"/>
  <path d="M506 301 L512 274 L520 301Z" fill="#ef6c55" class="ink"/>
  <path d="M512 274 L514 266 L517 274" fill="#fff4dc" stroke="#17324a" stroke-width="2"/>

  <!-- pelican rider -->
  <g class="rider">
    <!-- tail and body -->
    <path d="M347 281 Q327 267 314 277 Q324 295 345 298" fill="#f8f2df" class="ink"/>
    <ellipse cx="391" cy="274" rx="58" ry="48" fill="#fffaf0" class="ink"/>
    <path d="M364 289 Q390 300 416 286" fill="none" stroke="#d9d2bf" stroke-width="4"/>
    <!-- neck -->
    <path d="M407 265 Q445 248 446 209 Q447 184 430 176" fill="none" stroke="#fffaf0" stroke-width="25" stroke-linecap="round"/>
    <path d="M407 265 Q445 248 446 209 Q447 184 430 176" fill="none" class="ink" stroke-width="5"/>
    <!-- head -->
    <ellipse cx="424" cy="158" rx="40" ry="35" fill="#fffaf0" class="ink"/>
    <path d="M451 160 Q508 153 542 177 Q511 199 457 177Z" fill="#f6a642" class="ink"/>
    <path d="M457 175 Q486 184 520 177 Q501 218 474 202 Q460 191 457 175Z" fill="#f28d45" class="ink"/>
    <path d="M523 175 L540 177 L526 184" fill="#e65f4b" stroke="#17324a" stroke-width="3"/>
    <circle cx="436" cy="151" r="5.5" fill="#17324a"/>
    <circle cx="438" cy="149" r="1.7" fill="#fff"/>
    <path d="M402 138 Q420 119 440 126" fill="none" stroke="#ef6c55" stroke-width="6" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M366 261 Q391 241 419 264 Q401 292 374 293Z" fill="#f2eee2" class="ink"/>
    <path d="M378 269 Q397 266 408 275 M378 280 Q396 278 403 284" fill="none" stroke="#c9c2b2" stroke-width="3"/>
    <!-- legs pedaling -->
    <path d="M380 306 L367 350 L415 392" fill="none" stroke="#f6a642" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M419 302 L440 350 L420 409" fill="none" stroke="#f6a642" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M407 392 L426 395 M412 410 L430 414" fill="none" stroke="#17324a" stroke-width="6" stroke-linecap="round"/>
    <!-- fish in beak -->
    <path d="M500 166 Q514 155 527 165 Q514 177 500 166Z" fill="#77b8c8" stroke="#17324a" stroke-width="2.5"/>
    <path d="M526 165 L534 159 L534 171Z" fill="#77b8c8" stroke="#17324a" stroke-width="2"/>
    <circle cx="508" cy="164" r="1.8" fill="#17324a"/>
  </g>

  <!-- speech bubble -->
  <path d="M565 112 Q565 96 582 96 H704 Q721 96 721 112 V143 Q721 159 704 159 H647 L631 174 L634 159 H582 Q565 159 565 143Z" fill="#fffaf0" class="ink" stroke-width="3"/>
  <text x="643" y="121" text-anchor="middle" font-family="Verdana, sans-serif" font-size="13" font-weight="800" fill="#17324a">BIKE LANE?</text>
  <text x="643" y="140" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#17324a">I AM the lane.</text>

  <path d="M110 488 Q400 472 690 488" fill="none" stroke="#fff7e7" stroke-width="5" stroke-dasharray="18 18"/>
  <text x="400" y="530" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="700" fill="#17324a">Local delivery. Extremely long beak. Zero parking fees.</text>
  <rect x="0" y="554" width="800" height="46" fill="#17324a"/>
  <text x="400" y="584" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="700" fill="#fffaf0">2026-10-30 08:32:06 SGT (UTC+08:00)</text>
</svg>