  <text x="664" y="282" transform="rotate(8 664 282)" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e45746">HONK!</text>

  <text x="400" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#233044">He packs his lunch and calls it aerodynamics.</text>
  <line x1="80" y1="540" x2="720" y2="540" stroke="#d8bc8a" stroke-width="2"/>
  <text x="400" y="565" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#465569">2026-10-30 08:32:25 SGT (UTC+08:00)</text>
