<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Peak Pelican Performance</title>
  <desc id="desc">A pelican in a helmet rides a bicycle with a fish in its beak. The wheels spin and the rider bobs.</desc>
  <defs>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="40" height="40" fill="#fff4d4"/>
      <rect width="20" height="40" fill="#ffedc0"/>
    </pattern>
    <style>
      .ink { stroke:#233044; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.5s linear infinite; }
      .rider { animation:bob .75s ease-in-out infinite alternate; }
      .leg { transform-box:fill-box; transform-origin:20% 20%; animation:pedal .75s ease-in-out infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-7px); } }
      @keyframes pedal { from { transform:rotate(-10deg); } to { transform:rotate(12deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="16" y="16" width="768" height="568" rx="24" fill="url(#stripes)" stroke="#233044" stroke-width="4"/>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="1" fill="#233044">PEAK PELICAN PERFORMANCE</text>

  <path d="M50 432 Q185 407 320 432 T600 429 T750 431" fill="none" stroke="#d4a56b" stroke-width="4" stroke-dasharray="13 12"/>
  <path d="M55 454 H745" stroke="#233044" stroke-width="7" stroke-linecap="round"/>
  <path d="M80 470 H720" stroke="#e4b878" stroke-width="4" stroke-linecap="round"/>
  <path d="M98 245 h62 M75 268 h72 M105 291 h45" stroke="#e9a85b" stroke-width="6" stroke-linecap="round"/>

  <g class="wheel">
    <circle cx="245" cy="397" r="72" fill="#fff9e9" class="ink"/>
    <circle cx="245" cy="397" r="58" fill="none" stroke="#62c4bd" stroke-width="5"/>
    <path d="M245 326 V468 M174 397 H316 M195 347 L295 447 M195 447 L295 347" fill="none" stroke="#9aa6aa" stroke-width="3"/>
    <circle cx="245" cy="397" r="9" fill="#233044"/>
  </g>
  <g class="wheel">
    <circle cx="566" cy="397" r="72" fill="#fff9e9" class="ink"/>
