  <g class="rider">
    <path d="M323 300 Q289 280 287 248 Q296 216 332 211 Q385 204 419 240 Q434 260 423 291 Q402 319 348 311 Z" fill="#fffdf3" class="ink"/>
    <path d="M313 256 Q341 235 382 244 Q370 281 330 288 Q317 283 313 256 Z" fill="#e4e9e1" stroke="#233044" stroke-width="4"/>
    <path d="M298 268 Q280 277 274 292 Q293 289 305 281" fill="#fffdf3" class="ink"/>
    <path d="M397 247 Q410 220 405 183 Q400 151 419 135 Q438 119 460 134 Q474 146 471 171 L463 216 Q462 234 474 250" fill="#fffdf3" class="ink"/>
