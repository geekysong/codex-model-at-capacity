    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#263238" flood-opacity=".3"/>
    </filter>
    <style>
      .ink { stroke:#263238; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#263238; }
      .wheel { fill:none; stroke:#202832; stroke-width:9; }
      .spoke { stroke:#aeb9c3; stroke-width:3; }
    </style>
  </defs>

