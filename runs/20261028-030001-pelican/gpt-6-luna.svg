  <text x="400" y="55" text-anchor="middle" class="label" font-size="34" font-weight="900" letter-spacing="2">THE GREAT PELICAN PEDAL-OFF</text>
  <text x="400" y="88" text-anchor="middle" class="label" font-size="18" font-weight="700">“Why fly when you can commute dramatically?”</text>

