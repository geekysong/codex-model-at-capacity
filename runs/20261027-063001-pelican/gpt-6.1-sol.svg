<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly ignoring traffic rules.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f5"/>
      <stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#292929"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".3"/>
    </filter>
    <style>
      .ink { stroke:#20252b; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#20252b; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="108" r="48" fill="#ffe28a" opacity=".9"/>
  <path d="M0 345 Q150 300 300 340 T600 330 T800 350 V470 H0Z" fill="#8bcf83"/>
  <path d="M0 405 Q180 375 360 410 T800 395 V470 H0Z" fill="#65ae68"/>
  <rect y="445" width="800" height="115" fill="url(#road)"/>
  <path d="M0 500 H800" stroke="#f7dc55" stroke-width="8" stroke-dasharray="45 32"/>

  <g class="label" text-anchor="middle">
    <text x="400" y="58" font-size="38" font-weight="900" fill="#fff" stroke="#20252b" stroke-width="3" paint-order="stroke">PELICAN PEDAL PANIC!</text>
    <text x="400" y="90" font-size="19" font-weight="700">“When the beak is bigger than the bike lane.”</text>
  </g>

  <g filter="url(#shadow)">
    <g id="bike">
      <circle cx="275" cy="430" r="73" fill="none" class="ink"/>
      <circle cx="575" cy="430" r="73" fill="none" class="ink"/>
      <g stroke="#a9d6e5" stroke-width="3" opacity=".8">
        <path d="M275 357V503M202 430H348M223 378L327 482M223 482L327 378"/>
        <path d="M575 357V503M502 430H648M523 378L627 482M523 482L627 378"/>
      </g>
      <path d="M275 430 L365 330 L475 430 L275 430 L425 430 L365 330 L575 430" fill="none" class="ink"/>
      <path d="M365 330 L350 292 M350 292 L320 292" fill="none" class="ink"/>
      <path d="M475 430 L492 365 L520 365" fill="none" class="ink"/>
      <path d="M425 430 L425 468 M425 468 L397 485 M425 468 L452 485" fill="none" class="ink"/>
      <circle cx="425" cy="430" r="14" fill="#f6c445" class="ink"/>
      <g id="pedal">
        <path d="M425 430 L395 455 M425 430 L455 405" fill="none" stroke="#20252b" stroke-width="6"/>
        <circle cx="395" cy="455" r="8" fill="#ef6b5b" class="ink"/>
        <circle cx="455" cy="405" r="8" fill="#ef6b5b" class="ink"/>
      </g>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="405" cy="220" rx="82" ry="96" fill="#f2f0e7" class="ink"/>
      <path d="M367 170 Q400 115 455 148 Q480 170 461 205 Q435 224 401 210Z" fill="#fff" class="ink"/>
      <path d="M448 184 Q548 170 610 216 Q622 229 604 241 Q524 247 451 218Z" fill="#f0a63a" class="ink"/>
      <path d="M471 210 Q530 218 599 236 Q538 272 468 236Z" fill="#e47d2e" class="ink"/>
      <circle cx="432" cy="168" r="13" fill="#20252b"/>
      <circle cx="436" cy="164" r="4" fill="#fff"/>
      <path d="M384 258 Q425 286 466 255 L480 329 Q431 365 378 325Z" fill="#d7d9d3" class="ink"/>
      <path d="M394 329 L381 388 M454 329 L468 389" fill="none" class="ink"/>
      <path d="M381 388 Q370 398 359 394 M468 389 Q479 399 490 395" fill="none" class="ink"/>
      <path d="M360 245 Q322 220 330 184" fill="none" class="ink"/>
      <path d="M330 184 Q344 171 357 186" fill="none" class="ink"/>
      <path d="M375 300 Q405 312 433 299" fill="none" stroke="#20252b" stroke-width="5"/>
      <text x="406" y="116" class="label" text-anchor="middle" font-size="18" font-weight="700">NO LICENSE.</text>
    </g>
  </g>

  <g class="label">
    <path d="M104 170 Q104 128 150 128 H270 Q300 128 300 158 V190 Q300 220 270 220 H180 L145 246 V220 H150 Q104 220 104 170Z" fill="#fff" class="ink"/>
    <text x="202" y="169" text-anchor="middle" font-size="20" font-weight="800">I BRAKE FOR</text>
    <text x="202" y="194" text-anchor="middle" font-size="20" font-weight="800">SNACKS!</text>
  </g>

  <g class="label">
    <text x="400" y="548" text-anchor="middle" font-size="15" font-weight="700">2026-10-27 06:30:30 SGT (UTC+08:00)</text>
  </g>

  <animateTransform xlink:href="#bike" attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.8s" repeatCount="indefinite"/>
  <animateTransform xlink:href="#pedal" attributeName="transform" type="rotate" from="0 425 430" to="360 425 430" dur="1s" repeatCount="indefinite"/>
</svg>