<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly carrying an absurdly large bill.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b68"/>
      <stop offset="1" stop-color="#2f3440"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#12202b" flood-opacity=".3"/>
    </filter>
    <style>
      .ink { stroke:#202733; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial, Helvetica, sans-serif; fill:#202733; }
      .wheelSpin { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .bikeBob { animation:bob .65s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center bottom; }
      .pedalSpin { transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-6px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="105" cy="102" r="45" fill="#fff4a8" opacity=".9"/>
  <path d="M0 355 Q120 300 240 350 T480 340 T800 350 V430 H0Z" fill="#8bcf8c"/>
  <path d="M0 410 Q160 375 320 418 T640 410 T800 420 V600 H0Z" fill="#6eae71"/>
  <path d="M0 470 Q180 430 355 470 T800 465 V600 H0Z" fill="url(#road)"/>
  <path d="M0 548 Q190 510 390 548 T800 542" fill="none" stroke="#f7d66d" stroke-width="10" stroke-dasharray="34 28" opacity=".9"/>

  <g filter="url(#shadow)">
    <rect x="42" y="30" width="716" height="76" rx="20" fill="#fff9e8" stroke="#202733" stroke-width="6"/>
    <text x="400" y="78" text-anchor="middle" class="label" font-size="38" font-weight="900">PELICAN PEDAL PANIC!</text>
  </g>
  <text x="400" y="132" text-anchor="middle" class="label" font-size="19" font-weight="700">
    “He bills by the beak, but still can’t balance the budget.”
  </text>

  <g class="bikeBob">
    <!-- bicycle -->
    <g fill="none" class="ink">
      <path d="M235 456 L335 456 L395 350 L300 350 Z"/>
      <path d="M335 456 L455 456 L395 350"/>
      <path d="M455 456 L500 355"/>
      <path d="M480 355 L525 355"/>
      <path d="M300 350 L280 320"/>
      <path d="M265 320 L300 320"/>
    </g>
    <g class="wheelSpin">
      <circle cx="235" cy="456" r="72" fill="#e9eef2" class="ink"/>
      <circle cx="235" cy="456" r="9" fill="#202733"/>
      <path d="M235 384V528 M163 456H307 M184 405L286 507 M286 405L184 507" stroke="#7a8792" stroke-width="4"/>
    </g>
    <g class="wheelSpin">
      <circle cx="500" cy="456" r="72" fill="#e9eef2" class="ink"/>
      <circle cx="500" cy="456" r="9" fill="#202733"/>
      <path d="M500 384V528 M428 456H572 M449 405L551 507 M551 405L449 507" stroke="#7a8792" stroke-width="4"/>
    </g>
    <g class="pedalSpin">
      <circle cx="395" cy="456" r="16" fill="#f26c5e" class="ink"/>
      <path d="M395 456 L420 430 M395 456 L370 482" class="ink"/>
      <circle cx="428" cy="422" r="7" fill="#202733"/>
      <circle cx="362" cy="490" r="7" fill="#202733"/>
    </g>

    <!-- pelican body -->
    <ellipse cx="372" cy="278" rx="104" ry="92" fill="#f3f0e7" class="ink"/>
    <path d="M310 282 Q355 230 430 256 Q408 314 343 330Z" fill="#d6e0e5" class="ink"/>
    <ellipse cx="427" cy="187" rx="63" ry="57" fill="#f8f5eb" class="ink"/>
    <path d="M470 195 Q565 185 642 223 Q569 271 465 230 Q442 218 470 195Z" fill="#ef9c4c" class="ink"/>
    <path d="M474 226 Q552 229 625 224 Q561 274 482 245Z" fill="#f6bd63" class="ink"/>
    <circle cx="446" cy="174" r="11" fill="#202733"/>
    <circle cx="450" cy="170" r="3.5" fill="#fff"/>
    <path d="M390 168 Q410 145 434 154" fill="none" class="ink"/>
    <path d="M391 234 Q350 205 328 180" fill="none" class="ink"/>
    <path d="M329 180 Q307 157 290 171 Q310 195 345 208" fill="#f3f0e7" class="ink"/>

    <!-- neck scarf -->
    <path d="M385 231 Q430 255 468 231 L478 257 Q426 283 378 253Z" fill="#e85f5a" class="ink"/>
    <path d="M452 253 L490 300 L460 290 L433 265Z" fill="#e85f5a" class="ink"/>

    <!-- wings and feet -->
    <path d="M347 278 Q298 307 302 361 Q354 337 382 299Z" fill="#c9d6dc" class="ink"/>
    <path d="M350 357 Q325 390 332 423" fill="none" class="ink"/>
    <path d="M423 351 Q446 383 443 422" fill="none" class="ink"/>
    <path d="M329 422 l-20 8 M332 422 l-9 17 M443 422 l20 8 M443 422 l9 17" fill="none" class="ink"/>

    <!-- absurd bill -->
    <path d="M505 208 Q570 176 640 220 L627 274 Q560 290 500 245Z" fill="#fffdf4" class="ink"/>
    <text x="566" y="232" text-anchor="middle" class="label" font-size="17" font-weight="900">PAST DUE</text>
    <text x="565" y="254" text-anchor="middle" class="label" font-size="15">$QUACK</text>

    <!-- handlebars grip -->
    <path d="M500 355 Q512 340 525 355" fill="none" class="ink"/>
  </g>

  <!-- motion lines and joke labels -->
  <path d="M144 420 l-38 -12 M150 445 l-45 0 M157 470 l-38 13" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <path d="M584 405 l38 -18 M590 430 l45 -5 M586 455 l42 9" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8"/>
  <g transform="rotate(-8 646 356)">
    <rect x="596" y="326" width="142" height="64" rx="14" fill="#fff9e8" class="ink"/>
    <text x="667" y="352" text-anchor="middle" class="label" font-size="16" font-weight="900">HONK IF</text>
    <text x="667" y="373" text-anchor="middle" class="label" font-size="16" font-weight="900">YOU OWE ME FISH</text>
  </g>

  <rect x="24" y="566" width="752" height="26" rx="8" fill="#fff9e8" stroke="#202733" stroke-width="3"/>
  <text x="400" y="585" text-anchor="middle" class="label" font-size="14" font-weight="700">2026-10-27 06:31:37 SGT (UTC+08:00)</text>
</svg>