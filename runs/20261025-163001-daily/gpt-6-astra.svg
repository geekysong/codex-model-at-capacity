<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>Projectile motion with landing inset</title>
  <desc>At 10 pixels per meter, the landing point is at canvas coordinate (700,350), outside the canvas. A translated inset shows the landing at the same scale. Flight time is 3 seconds; the apex is at horizontal distance 30 meters and height 11.25 meters.</desc>
  <defs>
    <clipPath id="scene">
      <rect x="50" y="180" width="500" height="175"/>
    </clipPath>
  </defs>
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="50" y="25">Projectile motion · Total flight time: 3 s</text>
    <text x="50" y="49">vₓ = 20 m/s · vᵧ₀ = 15 m/s · g = 10 m/s²</text>
    <text x="50" y="73">Scale: 10 px/m · No air resistance</text>
    <text x="50" y="105" font-size="12">Landing lies at x = 700 px;</text>
    <text x="50" y="123" font-size="12">shown in the inset at the same scale.</text>
  </g>

  <rect x="345" y="89" width="235" height="91" rx="5" fill="#f5f8fc" stroke="#bac5d3"/>
  <text x="357" y="108" font-family="Arial, sans-serif" font-size="12" fill="#172033">Landing inset (translated)</text>
  <path d="M 470,115.625 Q 485,125 500,136" fill="none" stroke="#1769aa" stroke-width="2.5"/>
  <line x1="450" y1="136" x2="555" y2="136" stroke="#465363" stroke-width="2"/>
  <circle cx="500" cy="136" r="4" fill="#172033"/>
  <text x="357" y="165" font-family="Arial, sans-serif" font-size="14" fill="#172033">landing: 60 m, 0 m</text>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#465363" stroke-width="2"/>
  <path d="M 100,350 Q 400,125 700,350" clip-path="url(#scene)" fill="none" stroke="#1769aa" stroke-width="2.5"/>
  <path d="M 542,256 L 550,265.625 L 538,265" fill="none" stroke="#1769aa" stroke-width="2"/>
  <circle cx="100" cy="350" r="4" fill="#172033"/>
  <circle cx="400" cy="237.5" r="4" fill="#172033"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="55" y="310">launch: 0 m, 0 m</text>
    <text x="321" y="216">apex: 30 m, 11.25 m</text>
    <text x="435" y="297" font-size="12">Continues to inset</text>
  </g>

  <rect x="0" y="366" width="600" height="34" fill="#eef2f6"/>
  <text x="300" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-10-25 16:34:13 SGT (UTC+08:00)</text>
</svg>