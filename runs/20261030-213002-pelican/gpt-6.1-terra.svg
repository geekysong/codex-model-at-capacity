  <text x="400" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#263238">His commute is a breeze. Parking is a beak problem.</text>
  <path d="M65 526 H735" stroke="#dfd2b8" stroke-width="2"/>
  <text x="400" y="558" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#52615d">2026-10-30 21:33:16 SGT (UTC+08:00)</text>
</svg>