<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Pelican</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels and a gentle bobbing motion.</desc>
  <defs>
    <style>
      .ink { stroke:#263238; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#263238; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 0.8s ease-in-out infinite alternate; }
      .pedal { transform-origin:401px 401px; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion:reduce) { .wheel, .rider, .pedal { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8efd8"/>
  <rect x="18" y="18" width="764" height="564" rx="20" fill="#fffaf0" stroke="#263238" stroke-width="4"/>
  <text x="400" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="39" fill="#263238">THE DAILY PELICAN</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#b34c38">BREAKING NEWS FROM THE BIKE LANE</text>

