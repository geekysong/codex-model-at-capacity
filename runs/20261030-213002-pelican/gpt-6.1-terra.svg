  <path d="M42 427 Q210 412 381 429 T758 425 V462 H42Z" fill="#dfbf8d"/>
  <path d="M69 446 H158 M185 446 H247 M651 446 H733" stroke="#fff5d9" stroke-width="5" stroke-linecap="round"/>

