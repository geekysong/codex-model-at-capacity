  <title id="title">Pelican Pedals for Prestige</title>
  <desc id="desc">A humorous cartoon of an oversized pelican riding a tiny bicycle.</desc>
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .bob { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .55s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-8px) rotate(-2deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
  </style>

