  </g>

  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="900" letter-spacing="3" fill="#253b43">TOUR DE BEAK</text>
  <text x="400" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#487078">THE COMMUTE HAS GONE A LITTLE FOWL.</text>

