<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish in its bill pouch, beneath the slogan: Zero emissions. Suspiciously fishy cargo. Wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bce9ec"/>
      <stop offset="1" stop-color="#f7f1ce"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd16c"/>
      <stop offset="1" stop-color="#f6a64f"/>
    </linearGradient>
    <pattern id="road" width="110" height="16" patternUnits="userSpaceOnUse">
      <path d="M10 8H65" stroke="#fff5d8" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="81" fill="#f3f4dd" fill-opacity=".5" stroke="#253b43" stroke-width="13"/>
      <circle r="72" fill="none" stroke="#fbfbeb" stroke-width="3"/>
      <g stroke="#6d8990" stroke-width="2.5">
        <path d="M-71 0H71M0-71V71M-50-50L50 50M-50 50L50-50"/>
      </g>
      <path d="M0-73A73 73 0 0 1 51-52" fill="none" stroke="#f3b64c" stroke-width="5"/>
      <circle r="8" fill="#253b43"/>
    </g>
  </defs>

