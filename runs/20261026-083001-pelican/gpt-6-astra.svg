<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a giant fish-filled beak pouch, passing a no-fishing sign. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="water" width="70" height="24" patternUnits="userSpaceOnUse">
      <path d="M5 13q15 8 30 0" fill="none" stroke="#75bcc5" stroke-width="3"/>
    </pattern>
    <g id="spokes" stroke="#345260" stroke-width="3">
      <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
      <circle r="9" fill="#f4bd51" stroke="#203841"/>
      <path d="M39-45l8 8" stroke="#ff8654" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5dd"/>
  <path d="M0 111H800V356H0Z" fill="#ccecee"/>
  <circle cx="683" cy="169" r="39" fill="#ffc655"/>
  <path d="M43 177q28-28 56 0q29-34 61 0M543 208q20-20 40 0q24-25 46 0" fill="none" stroke="#fffaf0" stroke-width="14" stroke-linecap="round"/>
  <path d="M0 302q100-22 200 0t200 0t200 0t200 0V403H0Z" fill="#9bd5d8"/>
  <rect y="318" width="800" height="80" fill="url(#water)"/>
  <path d="M0 388Q400 364 800 388V526H0Z" fill="#d6c9ac"/>
  <path d="M0 493H800" stroke="#fff5dd" stroke-width="5" stroke-dasharray="35 23"/>
  <ellipse cx="381" cy="477" rx="221" ry="13" fill="#68716a" opacity=".2"/>

  <g font-family="Verdana, sans-serif" fill="#203841" text-anchor="middle">
    <text x="400" y="53" font-size="43" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="88" font-size="18">One bird. Two wheels. Absolutely no self-control.</text>
  </g>

  <!-- One roadside sign, one very loose interpretation. -->
  <path d="M680 309V416" stroke="#6b756d" stroke-width="8"/>
  <rect x="610" y="255" width="143" height="65" rx="8" fill="#fffaf0" stroke="#203841" stroke-width="4"/>
  <text x="681" y="282" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#b74739">NO FISHING</text>
  <text x="681" y="304" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#203841">YES, EVEN YOU.</text>

  <!-- Stationary tire silhouettes keep the bicycle grounded. -->
  <g fill="#fdf8e9" stroke="#203841" stroke-width="10">
    <circle cx="238" cy="413" r="72"/>
    <circle cx="536" cy="413" r="72"/>
  </g>
  <g fill="none" stroke="#87b8b8" stroke-width="3">
    <circle cx="238" cy="413" r="63"/>
    <circle cx="536" cy="413" r="63"/>
  </g>
  <g transform="translate(238 413)">
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(536 413)">
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 413L306 327L366 413ZM306 327H472L366 413M472 327L536 413" stroke="#203841" stroke-width="13"/>
    <path d="M238 413L306 327L366 413ZM306 327H472L366 413M472 327L536 413" stroke="#e9684b" stroke-width="7"/>
    <path d="M306 327L294 303M472 327L461 284L489 271" stroke="#203841" stroke-width="8"/>
    <path d="M478 274H501" stroke="#203841" stroke-width="11"/>
    <path d="M277 301H323" stroke="#203841" stroke-width="13"/>
    <path d="M236 332H285M246 332V344" stroke="#203841" stroke-width="5"/>
  </g>
  <circle cx="366" cy="413" r="18" fill="#ffc655" stroke="#203841" stroke-width="4"/>

  <!-- The rider's body and feet bob together. -->
  <g stroke="#203841" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M322 287L309 343L354 391" fill="none" stroke="#d78c34" stroke-width="13"/>
    <path d="M346 387l29 9-2 10-37-4Z" fill="#f6b947" stroke-width="3"/>
    <path d="M265 278L224 257L235 291L214 285L249 316" fill="#fffdf4" stroke-width="4"/>
    <path d="M244 270Q237 229 285 218Q316 208 344 224
             Q371 226 375 188L373 161Q373 137 393 136
             Q417 134 423 158L416 215Q414 276 365 302
             Q298 331 256 300Z" fill="#fffdf4" stroke-width="5"/>
    <path d="M273 244Q314 224 353 256Q326 300 274 285Q300 275 311 258" fill="#d5e3df" stroke-width="4"/>
    <path d="M348 244Q385 272 477 274" fill="none" stroke-width="12"/>
    <path d="M348 242Q385 270 477 272" fill="none" stroke="#fffdf4" stroke-width="7"/>
    <path d="M471 267l16 9m-12-13 14 9" fill="none" stroke-width="3"/>

    <!-- A suspiciously well-stocked aerodynamic pouch. -->
    <path d="M411 170L589 183Q561 251 479 246Q426 240 411 184Z" fill="#f7bc61" stroke-width="4"/>
    <path d="M449 211Q466 192 494 209L509 198L507 221L491 215Q468 235 449 211Z" fill="#78b7b7" stroke-width="2.5"/>
    <circle cx="460" cy="209" r="2.5" fill="#203841" stroke="none"/>
    <path d="M506 224Q520 207 541 219L553 209L553 228L540 225Q522 240 506 224Z" fill="#e98a71" stroke-width="2.5"/>
    <circle cx="516" cy="221" r="2" fill="#203841" stroke="none"/>
    <path d="M411 164L602 178Q607 184 593 187L410 181Z" fill="#ffce58" stroke-width="4"/>
    <path d="M429 192q1 24 17 31" fill="none" stroke="#d58d45" stroke-width="3"/>
    <circle cx="399" cy="158" r="8" fill="#fff" stroke-width="2"/>
    <circle cx="402" cy="158" r="3" fill="#203841" stroke="none"/>
    <path d="M389 145l17-2" fill="none" stroke-width="4"/>

    <!-- Racing helmet, because this is obviously a sporting event. -->
    <path d="M371 140Q368 114 396 114Q422 115 425 139Z" fill="#e9684b" stroke-width="4"/>
    <path d="M386 119l-2 14m14-15v15m12-11 3 11" fill="none" stroke-width="3"/>
    <path d="M375 140l11 36 22-36" fill="none" stroke-width="2"/>
    <path d="M280 226l-14 12 19 19 28-20" fill="#e9684b" stroke-width="3"/>
    <path d="M273 231Q233 206 203 221L217 232L201 243Q245 239 272 241" fill="#e9684b" stroke-width="3"/>
  </g>

  <g transform="translate(366 413)">
    <g stroke="#203841" stroke-width="5">
      <path d="M-24 0H24"/>
      <path d="M-31-5v10M31-5v10" stroke-width="9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g font-family="Verdana, sans-serif" fill="#203841">
    <path d="M75 146H259Q274 146 274 161V193Q274 208 259 208H230L246 227L206 208H75Q60 208 60 193V161Q60 146 75 146Z" fill="#fffdf4" stroke="#203841" stroke-width="3"/>
    <text x="167" y="171" text-anchor="middle" font-size="16" font-weight="bold">“These are my</text>
    <text x="167" y="194" text-anchor="middle" font-size="16" font-weight="bold">energy bars.”</text>
  </g>

  <rect y="526" width="800" height="74" fill="#203841"/>
  <g font-family="Verdana, sans-serif" text-anchor="middle">
    <text x="400" y="553" fill="#fff5dd" font-size="19" font-weight="bold">The pelican calls it cycling. The fish call it a getaway.</text>
    <text x="400" y="582" fill="#ccecee" font-size="16">2026-10-26 08:30:01 SGT (UTC+08:00)</text>
  </g>
</svg>