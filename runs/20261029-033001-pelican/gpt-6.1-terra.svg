<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ecff"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f6975"/>
      <stop offset="1" stop-color="#303640"/>
    </linearGradient>
    <style>
      .ink { stroke:#17202a; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .thin { stroke:#17202a; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
      .title { font:900 42px Arial, sans-serif; fill:#17202a; letter-spacing:1px; }
      .caption { font:700 20px Arial, sans-serif; fill:#24313d; }
      .footer { font:600 15px Arial, sans-serif; fill:#24313d; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.4s linear infinite; }
      .bob { animation:bob 1.2s ease-in-out infinite; transform-origin:center; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="688" cy="108" r="48" fill="#ffd86b" opacity=".9"/>
  <path d="M0 355 Q120 315 240 350 T480 345 T800 330 V430 H0Z" fill="#9bd48f"/>
  <path d="M0 400 Q180 370 350 405 T800 385 V600 H0Z" fill="url(#road)"/>
  <path d="M0 485 H800" stroke="#f7df7b" stroke-width="8" stroke-dasharray="42 28" opacity=".9"/>

  <text x="40" y="65" class="title">THE PELICAN COMMUTE</text>
  <text x="42" y="98" class="caption">“Why drive to work when you can wing it?”</text>

  <g aria-label="Pelican riding a bicycle">
    <g class="wheel">
      <circle cx="248" cy="458" r="76" fill="none" class="ink"/>
      <circle cx="248" cy="458" r="9" fill="#f5f7fa" class="thin"/>
      <path d="M248 382V534 M172 458H324 M194 404L302 512 M302 404L194 512" class="thin" opacity=".8"/>
    </g>
    <g class="wheel">
      <circle cx="536" cy="458" r="76" fill="none" class="ink"/>
      <circle cx="536" cy="458" r="9" fill="#f5f7fa" class="thin"/>
      <path d="M536 382V534 M460 458H612 M482 404L590 512 M590 404L482 512" class="thin" opacity=".8"/>
    </g>

    <path d="M248 458 L365 365 L536 458 L420 458 Z" fill="none" class="ink"/>
    <path d="M365 365 L420 458 M365 365 L332 335" fill="none" class="ink"/>
    <path d="M332 335 L382 330" fill="none" class="ink"/>
    <path d="M536 458 L553 347" fill="none" class="ink"/>
    <path d="M553 347 L579 331" fill="none" class="ink"/>
    <path d="M579 331 L600 345" fill="none" class="ink"/>
    <path d="M319 332 L351 332" fill="none" stroke="#e85d4a" stroke-width="12" stroke-linecap="round"/>

    <g class="pedal">
      <circle cx="420" cy="458" r="18" fill="#ffd15c" class="thin"/>
      <path d="M420 440V476 M402 458H438" class="thin"/>
      <circle cx="392" cy="436" r="6" fill="#17202a"/>
      <circle cx="448" cy="480" r="6" fill="#17202a"/>
    </g>

    <g class="bob">
      <ellipse cx="408" cy="310" rx="67" ry="88" fill="#f4f0dc" class="ink"/>
      <path d="M367 339 Q330 369 309 343 Q342 315 372 294" fill="#d9d3bb" class="ink"/>
      <path d="M446 285 Q481 260 500 292 Q470 310 444 321" fill="#d9d3bb" class="ink"/>
      <circle cx="410" cy="220" r="53" fill="#f4f0dc" class="ink"/>
      <path d="M379 233 Q421 224 504 245 Q522 251 504 267 Q430 280 377 257 Z" fill="#f29b45" class="ink"/>
      <path d="M475 247 Q505 257 518 275" fill="none" stroke="#c9702f" stroke-width="5"/>
      <circle cx="425" cy="211" r="9" fill="#17202a"/>
      <circle cx="428" cy="207" r="3" fill="#fff"/>
      <path d="M373 191 Q390 169 412 178" fill="none" class="thin"/>
      <path d="M390 267 Q412 284 437 268" fill="none" class="thin"/>
      <path d="M389 345 L366 420" fill="none" class="ink"/>
      <path d="M434 345 L451 420" fill="none" class="ink"/>
      <path d="M366 420 L402 447" fill="none" class="ink"/>
      <path d="M451 420 L430 451" fill="none" class="ink"/>
      <path d="M401 447 L419 458" fill="none" class="thin"/>
      <path d="M430 451 L447 463" fill="none" class="thin"/>
      <path d="M370 281 Q345 260 353 238" fill="none" stroke="#e85d4a" stroke-width="10"/>
      <path d="M458 287 Q481 270 476 249" fill="none" stroke="#e85d4a" stroke-width="10"/>
      <path d="M397 168 Q414 151 430 168" fill="none" stroke="#e85d4a" stroke-width="7"/>
    </g>

    <g transform="translate(532 280) rotate(-8)">
      <path d="M0 45 Q55 4 112 35 Q127 45 112 61 Q53 75 0 57 Z" fill="#72b8d6" class="ink"/>
      <path d="M105 34 L136 18 L129 52 Z" fill="#f29b45" class="ink"/>
      <circle cx="22" cy="40" r="4" fill="#17202a"/>
      <path d="M36 59 Q55 71 71 60" fill="none" class="thin"/>
      <text x="20" y="32" font-family="Arial" font-size="13" font-weight="bold" fill="#17202a">LUNCH</text>
    </g>
  </g>

  <path d="M94 260 q15 -18 30 0 q15 -18 30 0" fill="none" stroke="#6c9fb1" stroke-width="5"/>
  <path d="M650 250 q15 -18 30 0 q15 -18 30 0" fill="none" stroke="#6c9fb1" stroke-width="5"/>

  <rect x="24" y="554" width="752" height="30" rx="8" fill="#eef5f7" opacity=".95"/>
  <text x="400" y="575" text-anchor="middle" class="footer">2026-10-29 03:31:35 SGT (UTC+08:00)</text>
</svg>