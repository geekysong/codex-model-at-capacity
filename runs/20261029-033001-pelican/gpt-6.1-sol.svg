<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical pelican rides a bicycle while proudly pretending it has everything under control.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#d9f5ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636b"/>
      <stop offset="1" stop-color="#303840"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#182028" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { stroke:#18242c; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#18242c; }
      .wheelSpin { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .bob { animation:bob 1.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="105" r="52" fill="#fff2a8" opacity=".9"/>
  <path d="M0 335 Q130 275 250 330 T510 325 T800 315 V410 H0Z" fill="#9ad08d"/>
  <path d="M0 375 Q180 330 350 370 T800 355 V430 H0Z" fill="#76b877"/>
  <path d="M0 420 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 478 H800" stroke="#e9d36a" stroke-width="8" stroke-dasharray="56 34"/>
  <path d="M0 550 H800" stroke="#202930" stroke-width="5"/>

  <g class="label" text-anchor="middle">
    <text x="400" y="62" font-size="38" font-weight="900" letter-spacing="2">PELICAN PEDAL PANIC</text>
    <text x="400" y="94" font-size="19" font-weight="700">“Why use a car when you already have a perfectly good beak?”</text>
  </g>

  <g filter="url(#shadow)">
    <g class="wheelSpin">
      <circle cx="248" cy="456" r="76" fill="#202a31" class="ink"/>
      <circle cx="248" cy="456" r="62" fill="#e7eef0" stroke="#18242c" stroke-width="5"/>
      <circle cx="248" cy="456" r="9" fill="#ef6b4f" class="ink"/>
      <path d="M248 394V518 M186 456H310 M204 412L292 500 M292 412L204 500" stroke="#6b7d86" stroke-width="4"/>
    </g>
    <g class="wheelSpin">
      <circle cx="560" cy="456" r="76" fill="#202a31" class="ink"/>
      <circle cx="560" cy="456" r="62" fill="#e7eef0" stroke="#18242c" stroke-width="5"/>
      <circle cx="560" cy="456" r="9" fill="#ef6b4f" class="ink"/>
      <path d="M560 394V518 M498 456H622 M516 412L604 500 M604 412L516 500" stroke="#6b7d86" stroke-width="4"/>
    </g>

    <path d="M248 456 L340 360 L455 456 L560 456 L455 456 L405 352 L340 360 L248 456" fill="none" class="ink"/>
    <path d="M405 352 L438 300" fill="none" class="ink"/>
    <path d="M438 300 L474 300" fill="none" class="ink"/>
    <path d="M340 360 L316 329" fill="none" class="ink"/>
    <path d="M305 329 L332 329" fill="none" class="ink"/>
    <circle cx="405" cy="352" r="14" fill="#ef6b4f" class="ink"/>
    <path d="M405 352 L366 421 M366 421 L408 442 M366 421 L330 388" fill="none" class="ink"/>
    <circle cx="366" cy="421" r="10" fill="#f4c34f" class="ink"/>
    <path d="M366 421 L342 443 M366 421 L391 398" fill="none" class="ink"/>
  </g>

  <g class="bob" filter="url(#shadow)">
    <ellipse cx="404" cy="287" rx="71" ry="88" fill="#f4a33c" class="ink"/>
    <ellipse cx="404" cy="202" rx="63" ry="57" fill="#f7b64b" class="ink"/>
    <path d="M357 220 Q405 247 454 220 L484 242 Q438 284 380 268 Q350 256 335 238Z" fill="#e98636" class="ink"/>
    <path d="M378 250 Q405 268 432 250 L442 286 Q405 310 368 286Z" fill="#f3d69a" class="ink"/>
    <circle cx="382" cy="192" r="9" fill="#18242c"/>
    <circle cx="426" cy="192" r="9" fill="#18242c"/>
    <circle cx="379" cy="189" r="3" fill="#fff"/>
    <circle cx="423" cy="189" r="3" fill="#fff"/>
    <path d="M364 167 Q382 148 400 164 M414 164 Q433 148 449 168" fill="none" class="ink"/>
    <path d="M349 275 Q312 302 327 350 Q344 370 374 337" fill="#dc8333" class="ink"/>
    <path d="M457 275 Q493 302 479 350 Q462 370 433 337" fill="#dc8333" class="ink"/>
    <path d="M369 330 Q405 350 440 330" fill="none" class="ink"/>
    <path d="M372 344 L348 380 M437 344 L462 380" fill="none" class="ink"/>
    <path d="M348 380 L330 391 M348 380 L365 391 M462 380 L445 391 M462 380 L480 391" fill="none" class="ink"/>
    <path d="M343 140 Q404 104 465 140" fill="#d94f45" class="ink"/>
    <path d="M350 140 Q404 112 458 140" fill="none" stroke="#ffd15c" stroke-width="12"/>
    <path d="M404 110 L404 83" class="ink"/>
    <path d="M404 83 Q418 72 432 83 Q418 96 404 83Z" fill="#62b86d" class="ink"/>
    <path d="M485 252 Q518 222 545 240" fill="none" class="ink"/>
    <path d="M530 235 Q554 225 567 238" fill="none" class="ink"/>
  </g>

  <g class="label">
    <rect x="72" y="128" width="184" height="68" rx="18" fill="#fffdf2" class="ink"/>
    <path d="M222 194 L246 226 L205 199" fill="#fffdf2" class="ink"/>
    <text x="164" y="157" text-anchor="middle" font-size="17" font-weight="800">I demand a</text>
    <text x="164" y="180" text-anchor="middle" font-size="17" font-weight="800">larger saddle!</text>
  </g>

  <g class="label">
    <rect x="574" y="215" width="158" height="58" rx="15" fill="#fffdf2" class="ink"/>
    <text x="653" y="239" text-anchor="middle" font-size="16" font-weight="800">HONK IF YOU</text>
    <text x="653" y="260" text-anchor="middle" font-size="16" font-weight="800">FEAR POOLS</text>
  </g>

  <g class="label" text-anchor="middle">
    <text x="400" y="530" font-size="22" font-weight="900">ONE BIRD. TWO WHEELS. ZERO BRAKES.</text>
    <text x="400" y="574" font-size="16" font-weight="700">2026-10-29 03:30:19 SGT (UTC+08:00)</text>
  </g>
</svg>