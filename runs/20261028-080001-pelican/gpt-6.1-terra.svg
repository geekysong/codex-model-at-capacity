    <path d="M370 220 l-15 -16 M370 220 l-4 -22" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
    <path d="M455 356 L430 405 M487 355 L515 405" stroke="#263238" stroke-width="6" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="-1 450 350;1 450 350;-1 450 350" dur="0.7s" repeatCount="indefinite" additive="sum"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 350 450" to="360 350 450" dur="1.8s" repeatCount="indefinite"/>
    <circle cx="350" cy="450" r="7" fill="#ffd85e"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 555 450" to="360 555 450" dur="1.8s" repeatCount="indefinite"/>
  </g>

  <text x="400" y="535" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="600" fill="#fff">
    Local bird insists this is “peak beak performance.”
  </text>
  <text x="400" y="578" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#17324d">
    2026-10-28 08:01:57 SGT (UTC+08:00)
  </text>
</svg>