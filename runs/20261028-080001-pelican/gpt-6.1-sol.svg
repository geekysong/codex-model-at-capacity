<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of a pelican riding a bicycle, with looping wheel and pedaling animation.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17465b" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="675" cy="105" r="55" fill="#fff4a8" opacity=".8"/>
  <path d="M0 405 Q125 350 250 405 T500 400 T800 390 V520 H0Z" fill="#70c46b"/>
  <path d="M0 455 Q160 420 320 460 T640 450 T800 460 V520 H0Z" fill="#4d9f59"/>
  <path d="M0 520 H800" stroke="#263b42" stroke-width="12"/>
  <path d="M0 535 Q190 515 380 535 T800 530" fill="none" stroke="#89d0d6" stroke-width="5" opacity=".7"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#17343e">
    <text x="400" y="62" text-anchor="middle" font-size="42" font-weight="900" fill="#123c4a" stroke="#ffffff" stroke-width="2" paint-order="stroke">
      THE GREAT PELICAN COMMUTE
    </text>
    <text x="400" y="96" text-anchor="middle" font-size="19" font-weight="700" fill="#285664">
      “Why fly when you can make traffic worse?”
    </text>
  </g>

  <g filter="url(#shadow)">
    <ellipse cx="405" cy="493" rx="238" ry="20" fill="#193a43" opacity=".25"/>

    <!-- bicycle -->
    <g stroke="#e14b3c" stroke-width="8" fill="none">
      <circle cx="255" cy="445" r=" seventy" opacity="0"/>
      <circle cx="255" cy="445" r=" seventy"/>
    </g>
  </g>

  <!-- corrected bicycle wheels and frame -->
  <g id="bike" stroke-linecap="round" stroke-linejoin="round">
    <g fill="none" stroke="#263b42" stroke-width="8">
      <circle cx="255" cy="445" r=" seventy" opacity="0"/>
      <circle cx="255" cy="445" r=" seventy" opacity="0"/>
    </g>
    <g id="wheelL" transform="translate(255 445)">
      <circle r="70" fill="#f8faf5" stroke="#263b42" stroke-width="8"/>
      <g stroke="#6b8b91" stroke-width="3">
        <path d="M0-65V65M-65 0H65M-46-46L46 46M46-46L-46 46"/>
      </g>
      <circle r="8" fill="#e14b3c" stroke="#263b42" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
    </g>
    <g id="wheelR" transform="translate(575 445)">
      <circle r="70" fill="#f8faf5" stroke="#263b42" stroke-width="8"/>
      <g stroke="#6b8b91" stroke-width="3">
        <path d="M0-65V65M-65 0H65M-46-46L46 46M46-46L-46 46"/>
      </g>
      <circle r="8" fill="#e14b3c" stroke="#263b42" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2s" repeatCount="indefinite"/>
    </g>
    <path d="M255 445 L365 350 L470 445 Z M365 350 L575 445 M365 350 L410 445 M410 445 L470 445" fill="none" stroke="#e14b3c" stroke-width="10"/>
    <path d="M350 344 L380 344" stroke="#263b42" stroke-width="8"/>
    <path d="M470 445 L500 350 L535 350" fill="none" stroke="#263b42" stroke-width="8"/>
    <path d="M402 445 L432 478 M402 445 L375 470" stroke="#263b42" stroke-width="7"/>
    <circle cx="402" cy="445" r="13" fill="#ffd34d" stroke="#263b42" stroke-width="5"/>
    <path d="M402 445 L435 470 M402 445 L375 420" stroke="#263b42" stroke-width="7"/>
  </g>

  <!-- pelican -->
  <g id="pelican" transform="translate(0 0)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="405" cy="275" rx="82" ry="104" fill="#f7f5e9" stroke="#263b42" stroke-width="7"/>
    <path d="M350 260 Q400 210 455 250 Q438 320 385 330 Q352 315 350 260Z" fill="#d9e7e2" stroke="#263b42" stroke-width="6"/>
    <ellipse cx="388" cy="176" rx="64" ry="58" fill="#f7f5e9" stroke="#263b42" stroke-width="7"/>
    <path d="M340 180 Q395 145 506 187 Q515 202 500 213 Q414 208 344 199 Q330 193 340 180Z" fill="#f29b43" stroke="#263b42" stroke-width="7"/>
    <path d="M337 196 Q414 210 500 210 Q468 257 390 229 Q350 218 337 196Z" fill="#f6b15a" stroke="#263b42" stroke-width="5"/>
    <circle cx="410" cy="164" r="8" fill="#263b42"/>
    <path d="M446 151 Q462 137 477 151" fill="none" stroke="#263b42" stroke-width="5"/>
    <path d="M355 332 Q335 355 315 372" fill="none" stroke="#f29b43" stroke-width="14"/>
    <path d="M448 333 Q468 356 486 371" fill="none" stroke="#f29b43" stroke-width="14"/>
    <path d="M315 372 L300 393 M315 372 L328 394 M486 371 L474 394 M486 371 L500 391" fill="none" stroke="#263b42" stroke-width="7"/>
    <path d="M365 229 Q390 260 423 250" fill="none" stroke="#263b42" stroke-width="6"/>
    <path d="M365 276 Q330 300 344 328 Q367 342 391 316" fill="#f29b43" stroke="#263b42" stroke-width="6"/>
    <path d="M432 270 Q478 290 470 334 Q450 353 428 320" fill="#f29b43" stroke="#263b42" stroke-width="6"/>
    <path d="M382 358 Q400 376 420 358" fill="none" stroke="#263b42" stroke-width="6"/>
    <text x="402" y="300" text-anchor="middle" font-family="Arial" font-size="16" font-weight="900" fill="#263b42" transform="rotate(-8 402 300)">HONK!</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="38" y="132" width="205" height="68" rx="18" fill="#fffdf1" stroke="#263b42" stroke-width="4"/>
    <path d="M217 194 L250 218 L243 183" fill="#fffdf1" stroke="#263b42" stroke-width="4"/>
    <text x="56" y="160" font-size="18" font-weight="700" fill="#263b42">“Move over, humans!</text>
    <text x="56" y="184" font-size="18" font-weight="700" fill="#263b42">I have wings.”</text>
  </g>

  <rect x="0" y="555" width="800" height="45" fill="#17343e"/>
  <text x="400" y="583" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff">
    2026-10-28 08:00:39 SGT (UTC+08:00)
  </text>
</svg>