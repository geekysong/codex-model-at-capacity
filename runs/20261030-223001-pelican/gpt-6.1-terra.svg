<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A determined pelican rides a bicycle with spinning wheels and a bobbing pedaling motion.</desc>
  <defs>
    <pattern id="spokes" width="100%" height="100%">
      <path d="M0-75V75M-75 0H75M-53-53L53 53M53-53L-53 53" fill="none" stroke="#f8df9d" stroke-width="3"/>
    </pattern>
    <style>
      .ink { stroke: #26323a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
      .rider { animation: bob .6s ease-in-out infinite alternate; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedal { animation: none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8edcf"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#fff9e9" stroke="#26323a" stroke-width="4"/>
  <text x="400" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#26323a">THE PELICAN EXPRESS</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#c05c3f">ONE BIRD. TWO WHEELS. ZERO BRAKES.</text>

  <circle cx="671" cy="159" r="39" fill="#f5c65d"/>
  <path d="M70 331 Q130 292 190 329 T310 329 T430 329 T550 329 T730 329 V457 H70Z" fill="#cce7dc"/>
  <path d="M74 451 H726" stroke="#26323a" stroke-width="5" stroke-linecap="round"/>
  <path d="M82 467 H160 M181 467 H207 M620 467 H705" stroke="#c5aa79" stroke-width="4" stroke-linecap="round"/>

  <path d="M98 355h65M75 374h76M102 393h42" stroke="#8ab9aa" stroke-width="5" stroke-linecap="round"/>
  <g class="wheel" transform-origin="237px 374px">
    <circle cx="237" cy="374" r="76" fill="#fbf3dc" stroke="#26323a" stroke-width="9"/>
    <circle cx="237" cy="374" r="65" fill="none" stroke="#cf7854" stroke-width="4"/>
    <g transform="translate(237 374)" stroke="#9a9984" stroke-width="3">
      <path d="M0-65V65M-65 0H65M-46-46L46 46M46-46L-46 46"/>
    </g>
    <circle cx="237" cy="374" r="8" fill="#26323a"/>
  </g>
  <g class="wheel" transform-origin="569px 374px">
    <circle cx="569" cy="374" r="76" fill="#fbf3dc" stroke="#26323a" stroke-width="9"/>
    <circle cx="569" cy="374" r="65" fill="none" stroke="#cf7854" stroke-width="4"/>
    <g transform="translate(569 374)" stroke="#9a9984" stroke-width="3">
      <path d="M0-65V65M-65 0H65M-46-46L46 46M46-46L-46 46"/>
    </g>
    <circle cx="569" cy="374" r="8" fill="#26323a"/>
  </g>

  <g fill="none" stroke="#d75d47" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M237 374 L310 280 L378 374 Z"/>
    <path d="M310 280 L475 281 L378 374"/>
    <path d="M475 281 L569 374"/>
  </g>
  <path d="M475 281 L457 247 H489 Q500 247 500 235" fill="none" class="ink"/>
  <path d="M293 275 H329" class="ink"/>
  <circle cx="378" cy="374" r="25" fill="#f5c65d" stroke="#26323a" stroke-width="5"/>
  <g class="pedal">
    <path d="M378 374 l-17 25 M378 374 l17-25" fill="none" stroke="#26323a" stroke-width="5"/>
    <path d="M351 400 h20 M385 348 h20" fill="none" stroke="#26323a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g class="rider">
