    <path d="M375 314 L361 399 M361 399 h-22" fill="none" stroke="#e9a44c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M321 275 Q286 269 269 246 Q268 287 303 302" fill="#e9e4cf" stroke="#26323a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M302 249 Q309 199 369 191 Q421 186 445 223 Q456 246 438 276 Q418 304 369 303 Q324 302 302 277Z" fill="#f2f1e4" stroke="#26323a" stroke-width="6"/>
    <path d="M321 247 Q348 218 408 236 Q402 271 359 278 Q333 280 321 247Z" fill="#dce4dc" stroke="#26323a" stroke-width="5"/>
    <path d="M406 216 Q421 190 421 158 Q420 126 447 120 Q473 114 483 136 Q490 151 480 167 L468 191 Q463 209 462 230" fill="#f2f1e4" stroke="#26323a" stroke-width="6" stroke-linecap="round"/>
    <path d="M461 160 Q510 158 580 173 Q557 184 481 186Z" fill="#f3a844" stroke="#26323a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M481 186 Q509 213 549 183" fill="#f8c46a" stroke="#26323a" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="457" cy="143" r="13" fill="#fff" stroke="#26323a" stroke-width="4"/>
    <circle cx="461" cy="144" r="5" fill="#26323a"/>
    <path d="M446 125 l20-6" stroke="#26323a" stroke-width="5" stroke-linecap="round"/>
    <path d="M426 242 Q447 252 466 245" fill="none" stroke="#26323a" stroke-width="5" stroke-linecap="round"/>
    <path d="M465 244 l22-7" fill="none" stroke="#e9a44c" stroke-width="8" stroke-linecap="round"/>
    <path d="M433 119 Q442 99 462 103 Q478 104 484 118Z" fill="#d75d47" stroke="#26323a" stroke-width="5"/>
    <path d="M430 120 H491" stroke="#26323a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <path d="M601 225 q17-17 34 0 q-17-8-34 0 M649 258 q13-13 26 0 q-13-6-26 0" fill="none" stroke="#93a99d" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="507" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#26323a">He carries his lunch and his road rage in the same pouch.</text>
  <path d="M63 531 H737" stroke="#d8c9aa" stroke-width="2"/>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#53615e">2026-10-30 22:33:04 SGT (UTC+08:00)</text>
</svg>