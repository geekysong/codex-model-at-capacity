        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.3s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#ffbe48" stroke="#263746" stroke-width="3"/>
    </g>
  </defs>

