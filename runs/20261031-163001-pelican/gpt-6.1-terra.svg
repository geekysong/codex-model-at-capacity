<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE COMMUTE HAS GONE TO THE BIRDS</title>
  <desc id="desc">A pelican pedals a bicycle with a fish in its bill as the wheels spin and the rider bobs.</desc>
  <defs>
    <style>
      .ink { stroke:#263238; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#263238; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.2s linear infinite; }
      .rider { animation:bob .6s ease-in-out infinite alternate; }
      .pedal { transform-origin:360px 391px; animation:spin 1.2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
    <g id="spokes">
      <circle r="76" fill="#fff9e8" stroke="#263238" stroke-width="8"/>
      <circle r="66" fill="none" stroke="#9eb5b1" stroke-width="3"/>
      <g stroke="#94aaa6" stroke-width="3">
        <path d="M-65 0H65 M0-65V65 M-46-46L46 46 M46-46L-46 46"/>
      </g>
      <circle r="8" fill="#f5a623" stroke="#263238" stroke-width="3"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#f8e9c8"/>
  <rect x="18" y="18" width="764" height="564" rx="20" fill="#fff8e6" stroke="#263238" stroke-width="5"/>
  <text x="400" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="1" fill="#263238">THE COMMUTE HAS GONE TO THE BIRDS</text>
