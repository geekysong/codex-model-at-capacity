<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a bicycle with a fish-filled bill pouch. The wheels spin, the pedals turn, and the bird bobs as it rides past a no fishing sign.</desc>
