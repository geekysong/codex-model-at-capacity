  <rect y="516" width="800" height="84" fill="#263b43"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff5dc">This pelican’s cargo bike is mostly pelican.</text>
