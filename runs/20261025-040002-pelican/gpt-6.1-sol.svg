    <text x="55" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#263b43">FISH</text>
    <text x="55" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#263b43">MARKET →</text>
  </g>

