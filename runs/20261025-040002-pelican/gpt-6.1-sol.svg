<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">An indignant pelican pedals a tiny bicycle with a huge beak full of fish. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="pavement" width="100" height="20" patternUnits="userSpaceOnUse">
      <path d="M10 10h40" stroke="#e6c587" stroke-width="4" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fff9e9" stroke="#263b43" stroke-width="10"/>
      <circle r="64" fill="none" stroke="#96bec0" stroke-width="3"/>
