  <rect y="484" width="800" height="27" fill="url(#pavement)"/>
  <ellipse cx="416" cy="476" rx="233" ry="12" fill="#263b43" opacity=".13"/>

  <use href="#wheel" x="277" y="397"/>
  <use href="#wheel" x="562" y="397"/>

