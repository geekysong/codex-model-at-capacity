        <path d="M-74 0H74M0-74V74M-52-52L52 52M-52 52L52-52"/>
      </g>
      <circle cx="0" cy="-73" r="6" fill="#ed6554"/>
      <circle r="10" fill="#263645"/>
    </g>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke:#263645; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

