  <text x="400" y="62" text-anchor="middle" font-size="43" font-weight="900" fill="#263645" letter-spacing="2">TOUR DE FISH</text>
  <text x="400" y="94" text-anchor="middle" font-size="18" fill="#52645d">ONE BIRD. TWO WHEELS. AN OUTRAGEOUS BILL.</text>

