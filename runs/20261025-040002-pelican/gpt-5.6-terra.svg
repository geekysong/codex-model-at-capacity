<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of an important-looking pelican riding a bicycle, with spinning wheels and bobbing motion.</desc>
  <defs>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
      .bob { transform-box: fill-box; transform-origin: center; animation: bob .72s ease-in-out infinite alternate; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .72s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
      @keyframes pedal { to { transform: rotate(360deg); } }
    </style>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#82d9ff"/>
      <stop offset="1" stop-color="#e5f8ff"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#5b6572"/>
      <stop offset="1" stop-color="#303843"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="710" cy="95" r="45" fill="#fff1a6"/>
  <g fill="#fff" opacity=".85">
    <path d="M63 113c18-24 48-21 62 1 24-16 53-2 55 21H45c1-10 7-17 18-22z"/>
    <path d="M535 130c13-17 35-15 45 1 16-11 36-1 38 15h-97c1-7 5-12 14-16z"/>
  </g>

  <path d="M0 292Q130 245 260 290T520 278T800 285V416H0z" fill="#8cc66b"/>
  <path d="M0 372Q170 338 338 370T800 355V480H0z" fill="url(#road)"/>
  <path d="M0 423H800" stroke="#ffd94f" stroke-width="11" stroke-dasharray="52 30"/>

  <g stroke="#455541" stroke-width="5" fill="none">
    <path d="M85 298v74m0-60 25 22m-25-12-23 22"/>
    <path d="M706 280v87m0-65 25 25m-25-15-25 23"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="bold">
    <rect x="48" y="154" width="165" height="77" rx="10" fill="#fff9d8" stroke="#3c4851" stroke-width="4"/>
    <text x="130" y="184" text-anchor="middle" font-size="18" fill="#26343d">BIKE LANE</text>
    <text x="130" y="211" text-anchor="middle" font-size="16" fill="#d94838">FOR BIRDS!</text>
  </g>

  <g class="bob">
    <g transform="translate(160 345)">
      <circle cx="70" cy="98" r="68" fill="#232d38" stroke="#121923" stroke-width="8"/>
      <circle cx="70" cy="98" r="53" fill="#dde8ed" stroke="#697b86" stroke-width="4"/>
      <circle cx="330" cy="98" r="68" fill="#232d38" stroke="#121923" stroke-width="8"/>
      <circle cx="330" cy="98" r="53" fill="#dde8ed" stroke="#697b86" stroke-width="4"/>

      <g class="spin" fill="none" stroke="#687a84" stroke-width="5">
        <path d="M70 45v106M17 98h106M33 61l74 74M107 61l-74 74"/>
        <path d="M330 45v106M277 98h106M293 61l74 74M367 61l-74 74"/>
      </g>
      <g fill="#ffcb3d" stroke="#26343d" stroke-width="4">
        <circle cx="70" cy="98" r="10"/>
        <circle cx="330" cy="98" r="10"/>
      </g>

      <g fill="none" stroke="#e24c3c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M70 98 165 10 236 98 70 98 165 98 222 25"/>
        <path d="M236 98 330 98 287 15"/>
      </g>
      <path d="M159 10h52" stroke="#26343d" stroke-width="10" stroke-linecap="round"/>
      <path d="M278 15h34l20-29" fill="none" stroke="#26343d" stroke-width="8" stroke-linecap="round"/>

      <g class="pedal">
        <circle cx="165" cy="98" r="16" fill="#ffcb3d" stroke="#26343d" stroke-width="5"/>
        <path d="M165 98l42 0m-42 0-42 0" stroke="#26343d" stroke-width="6" stroke-linecap="round"/>
        <rect x="200" y="91" width="24" height="13" rx="4" fill="#26343d"/>
        <rect x="106" y="91" width="24" height="13" rx="4" fill="#26343d"/>
      </g>

      <path d="M155 15Q154-55 218-55Q251-49 236 12" fill="#fffdf1" stroke="#26343d" stroke-width="6"/>
      <ellipse cx="194" cy="-90" rx="58" ry="63" fill="#f5f6e8" stroke="#26343d" stroke-width="6"/>
      <path d="M150-109Q107-119 84-91Q116-70 157-80z" fill="#f7a632" stroke="#26343d" stroke-width="5"/>
      <path d="M146-83Q98-79 83-48Q126-40 163-59z" fill="#f8bd48" stroke="#26343d" stroke-width="5"/>
      <circle cx="178" cy="-104" r="9" fill="#26343d"/>
      <circle cx="209" cy="-109" r="9" fill="#26343d"/>
      <path d="M173-123q9-10 19 0m6-2q10-9 19 2" fill="none" stroke="#26343d" stroke-width="4" stroke-linecap="round"/>
      <path d="M190-61q17 8 31-3" fill="none" stroke="#d05b37" stroke-width="5" stroke-linecap="round"/>

      <path d="M163-52Q206-29 240 19L211 38Q183 0 151-14z" fill="#315b8b" stroke="#26343d" stroke-width="5"/>
      <path d="M205-29l62 19-9 21-65-15" fill="#f5f6e8" stroke="#26343d" stroke-width="5"/>
      <path d="M255-14l20 3" stroke="#f7a632" stroke-width="10" stroke-linecap="round"/>
      <path d="M171-9l-18 82" stroke="#f5f6e8" stroke-width="18" stroke-linecap="round"/>
      <path d="M153 73l-36 21" stroke="#f7a632" stroke-width="12" stroke-linecap="round"/>
      <path d="M214 22l-28 77" stroke="#f5f6e8" stroke-width="18" stroke-linecap="round"/>
      <path d="M186 99l38 0" stroke="#f7a632" stroke-width="12" stroke-linecap="round"/>

      <path d="M146-51l-19-35q20-19 44-5l-7 40z" fill="#e95c3d" stroke="#26343d" stroke-width="5"/>
      <text x="149" y="-68" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#fff">CEO</text>
    </g>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="232" y="36" width="390" height="67" rx="25" fill="#fffdf1" stroke="#26343d" stroke-width="5"/>
    <text x="427" y="80" text-anchor="middle" font-size="35" font-weight="900" fill="#d94838">PELICAN PEDAL PANIC!</text>
    <path d="M556 163q42-32 75 2-37 29-75 7z" fill="#fffdf1" stroke="#26343d" stroke-width="4"/>
    <text x="594" y="181" text-anchor="middle" font-size="16" font-weight="bold" fill="#26343d">“I’m reducing</text>
    <text x="594" y="199" text-anchor="middle" font-size="16" font-weight="bold" fill="#26343d">my beakprint!”</text>
  </g>

  <rect y="500" width="800" height="100" fill="#24313b"/>
  <text x="400" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff4b3">A pelican on a bicycle: proof that every commute needs more beak-to-work balance.</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d9edf4">2026-10-25 04:02:19 SGT (UTC+08:00)</text>
</svg>