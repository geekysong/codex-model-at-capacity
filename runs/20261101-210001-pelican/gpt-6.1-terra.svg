<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A pelican rides a bicycle with spinning wheels and a gentle bobbing motion.</desc>
  <defs>
    <style>
      .ink { stroke: #263238; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { animation: bob 1s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#fff" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f8efd9"/>
  <rect x="20" y="20" width="760" height="560" rx="20" fill="#fff8e8" stroke="#263238" stroke-width="4"/>
  <text x="400" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#263238">THE DAILY COMMUTE</text>
  <text x="400" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#bf5638">ONE BIRD. TWO WHEELS. ZERO FISH.</text>

  <rect x="42" y="122" width="716" height="332" rx="12" fill="#a9dcdf"/>
  <rect x="42" y="122" width="716" height="332" rx="12" fill="url(#dots)"/>
  <circle cx="685" cy="176" r="29" fill="#ffd768"/>
  <path d="M53 358 Q145 315 230 355 T420 350 T600 350 T748 338 V453 H53Z" fill="#8cbe9e"/>
  <path d="M42 420 Q160 407 270 419 T510 417 T758 416 V454 H42Z" fill="#edc884"/>
  <path d="M55 439 H745" stroke="#b57f50" stroke-width="4" stroke-dasharray="22 18"/>

  <g fill="none" stroke="#719fa0" stroke-width="5" stroke-linecap="round">
    <path d="M77 248 h52 M63 265 h40 M92 282 h34"/>
    <path d="M100 318 h75 M120 333 h40"/>
  </g>

  <g class="wheel">
    <circle cx="245" cy="388" r="62" fill="#fff9e9" class="ink"/>
    <circle cx="245" cy="388" r="52" fill="none" stroke="#e27751" stroke-width="5"/>
    <g stroke="#8aa5a3" stroke-width="3">
      <path d="M245 336 v104 M193 388 h104 M208 351 l74 74 M282 351 l-74 74"/>
    </g>
    <circle cx="245" cy="388" r="7" fill="#263238"/>
  </g>
  <g class="wheel">
    <circle cx="574" cy="388" r="62" fill="#fff9e9" class="ink"/>
    <circle cx="574" cy="388" r="52" fill="none" stroke="#e27751" stroke-width="5"/>
    <g stroke="#8aa5a3" stroke-width="3">
      <path d="M574 336 v104 M522 388 h104 M537 351 l74 74 M611 351 l-74 74"/>
    </g>
    <circle cx="574" cy="388" r="7" fill="#263238"/>
  </g>

  <g fill="none" class="ink">
    <path d="M245 388 L330 290 L399 388 Z" stroke="#e45f43" stroke-width="9"/>
    <path d="M330 290 L472 291 L399 388 M472 291 L574 388" stroke="#e45f43" stroke-width="9"/>
    <path d="M464 273 L480 309 M463 273 L498 263 L515 270" stroke="#263238" stroke-width="7"/>
    <path d="M318 290 L308 269 M289 269 H330" stroke="#263238" stroke-width="7"/>
    <circle cx="399" cy="388" r="13" fill="#f8efd9"/>
    <path d="M399 388 l25 18 M416 406 h23" stroke-width="6"/>
  </g>

  <g class="rider">
    <path d="M330 282 Q285 268 281 225 Q278 195 299 179 Q310 157 335 159 Q354 159 363 181 Q377 198 370 224 Q365 247 347 255 L360 283 Q381 294 394 315 Q370 331 338 323 Q303 315 291 290Z" fill="#f8f4e6" class="ink"/>
