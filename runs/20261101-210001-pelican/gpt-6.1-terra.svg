    <path d="M318 272 Q341 282 365 269" fill="none" stroke="#8fa8a1" stroke-width="3" stroke-linecap="round"/>
    <path d="M352 304 Q368 321 397 335 L414 376" fill="none" stroke="#e9a143" stroke-width="12" stroke-linecap="round"/>
    <path d="M414 376 l-20 7 l29 3 l15-6" fill="#e9a143" class="ink"/>
    <path d="M331 310 Q339 337 365 353 L379 371" fill="none" stroke="#e9a143" stroke-width="10" stroke-linecap="round"/>
    <path d="M379 371 l-17 5 l24 3" fill="#e9a143" stroke="#263238" stroke-width="4" stroke-linejoin="round"/>
    <path d="M359 195 Q414 197 472 217 Q438 228 377 226 Q360 222 352 215Z" fill="#f1a849" class="ink"/>
    <path d="M363 219 Q394 239 433 226 Q417 260 391 265 Q370 263 355 229Z" fill="#f3be68" class="ink"/>
    <path d="M370 202 Q412 207 454 217" fill="none" stroke="#c77939" stroke-width="3"/>
    <ellipse cx="341" cy="191" rx="10" ry="13" fill="#fff" stroke="#263238" stroke-width="3"/>
    <circle cx="345" cy="193" r="4" fill="#263238"/>
    <path d="M326 173 Q337 165 349 171" fill="none" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
    <path d="M301 177 Q313 149 342 153 Q360 153 367 167 L301 176Z" fill="#e45f43" class="ink"/>
    <path d="M295 178 Q325 167 371 170" fill="none" stroke="#263238" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g>
    <path d="M534 210 h151 a12 12 0 0 1 12 12 v48 a12 12 0 0 1-12 12 h-89 l-24 17 5-17 h-43 a12 12 0 0 1-12-12 v-48 a12 12 0 0 1 12-12Z" fill="#fffdf4" stroke="#263238" stroke-width="4"/>
    <text x="609" y="239" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#263238">I BRAKE</text>
    <text x="609" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#263238">FOR SARDINES.</text>
  </g>

  <text x="400" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#263238">The pelican cycles to work, pouching the traffic.</text>
  <path d="M75 519 H725" stroke="#d9c8a9" stroke-width="2"/>
  <text x="400" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#526164">2026-11-01 21:02:23 SGT (UTC+08:00)</text>
</svg>