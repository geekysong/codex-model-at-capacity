  <path d="M572 258q30-28 66-8" fill="none" stroke="#e45d3e" stroke-width="4" stroke-linecap="round"/>
  <text x="619" y="242" font-size="20" font-weight="900" fill="#e45d3e">HONK!</text>
  <path d="M142 265q40-25 77-2" fill="none" stroke="#154d50" stroke-width="3" stroke-dasharray="5 8"/>
  <text x="141" y="250" font-size="15" font-weight="700" fill="#154d50">bike lane?</text>

  <rect x="0" y="518" width="800" height="82" fill="#154d50"/>
  <text x="400" y="550" text-anchor="middle" font-size="15" font-weight="700" letter-spacing=".4" fill="#fff4d1">FISH IN THE BRIEFCASE. WIND IN THE BILL.</text>
  <text x="400" y="581" text-anchor="middle" font-size="16" font-weight="700" fill="#f4b942">2026-10-26 05:02:22 SGT (UTC+08:00)</text>
</svg>