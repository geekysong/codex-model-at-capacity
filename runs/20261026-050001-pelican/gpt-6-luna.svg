<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE GREAT BEAK ESCAPE</title>
  <desc id="desc">A smug pelican rides a bicycle with a tiny briefcase, proclaiming that the commute is going swimmingly.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: roll 2s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
    @keyframes roll { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
  </style>

  <rect width="800" height="600" fill="#f7e8bd"/>
  <path d="M0 0h800v120H0z" fill="#154d50"/>
  <text id="title" x="400" y="57" text-anchor="middle" font-size="36" font-weight="900" letter-spacing="2" fill="#fff4d1">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#f4b942">“I’m cutting my commute down to one fish.”</text>

  <circle cx="684" cy="174" r="47" fill="#f4b942"/>
  <path d="M0 379q100-34 203 0t202 0 202 0 193 0v125H0z" fill="#d5e8d0"/>
  <path d="M0 455q170-25 330 0t470 0" fill="none" stroke="#9dbd9e" stroke-width="4"/>
  <path d="M0 487h800" stroke="#405b58" stroke-width="5" stroke-dasharray="26 18"/>

  <!-- bicycle -->
  <g class="wheel" fill="none" stroke="#173d42" stroke-width="7">
    <circle cx="254" cy="403" r="69"/>
    <circle cx="546" cy="403" r="69"/>
    <path d="M254 334v138M185 403h138M205 354l98 98m0-98-98 98"/>
  </g>
  <g class="wheel" fill="none" stroke="#173d42" stroke-width="7">
    <circle cx="254" cy="403" r="69"/>
    <circle cx="546" cy="403" r="69"/>
    <path d="M546 334v138M477 403h138M497 354l98 98m0-98-98 98"/>
  </g>
  <g fill="none" stroke="#154d50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M254 403l88-104 83 104H254l53-68 118 0 37-87"/>
    <path d="M417 287h53m-12-9 10 9-10 9"/>
    <path d="M327 298h-36l-16 13"/>
    <path d="M424 403l-9 19m-15 0h32"/>
    <path d="M340 299l-10-23m-18 1h30"/>
  </g>
  <circle cx="342" cy="299" r="10" fill="#f4b942" stroke="#154d50" stroke-width="5"/>

  <!-- pelican and briefcase, moving together -->
  <g class="rider">
    <path d="M384 180q50-25 83 13 22 26 13 62l-21 46-65-3-22-43q-18-46 12-75z" fill="#fff8e5" stroke="#173d42" stroke-width="5"/>
    <path d="M396 234q-25 23-48 47l-20 18q-10 10 2 16 13 6 24-5l43-27" fill="none" stroke="#173d42" stroke-width="13" stroke-linecap="round"/>
    <path d="M467 242q25 9 41 28l-26 18-28-15" fill="none" stroke="#173d42" stroke-width="12" stroke-linecap="round"/>
    <path d="M404 283l-3 18-24 22m66-28 16 23 28 8" fill="none" stroke="#173d42" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M361 339l31-6m82 3 28 9" stroke="#154d50" stroke-width="8" stroke-linecap="round"/>
    <!-- head and expressive crest -->
    <path d="M390 181q-9-38 19-58 31-22 61-1 22 16 16 46-5 25-29 34l-39 0z" fill="#fff8e5" stroke="#173d42" stroke-width="5"/>
    <path d="M413 123q-4-20 9-27m12 21q5-22 21-24m-9 27q15-17 28-13" fill="none" stroke="#e45d3e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="462" cy="155" r="5.5" fill="#173d42"/>
    <path d="M480 165q47-6 85 7 10 4 0 10-34 21-85 11l-13-13z" fill="#f4b942" stroke="#a84c32" stroke-width="4"/>
    <path d="M482 183q37 12 77 0-18 30-57 24-16-2-20-24z" fill="#e45d3e" stroke="#a84c32" stroke-width="4"/>
    <path d="M503 194q20 9 39 1" fill="none" stroke="#fff1d0" stroke-width="3"/>
    <path d="M444 173q-11 7-17 2" fill="none" stroke="#173d42" stroke-width="3"/>
    <!-- tiny briefcase -->
    <rect x="374" y="251" width="53" height="36" rx="5" fill="#e45d3e" stroke="#173d42" stroke-width="4"/>
    <path d="M388 251v-8q0-6 7-6h12q7 0 7 6v8m-40 12h53m-27-4v9" fill="none" stroke="#173d42" stroke-width="4"/>
    <path d="M388 269h6m13 0h6" stroke="#f7e8bd" stroke-width="3"/>
