<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon of an overconfident pelican riding a tiny bicycle.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#81d8f7"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <style>
      .ink { stroke:#173042; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#173042; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { animation: spin 1.2s linear infinite; transform-box:fill-box; transform-origin:center; }
      .pelican { animation: bob .55s ease-in-out infinite alternate; transform-origin:400px 350px; }
      .leg { animation: pedal .6s linear infinite; transform-origin:435px 382px; }
      .leg2 { animation: pedal2 .6s linear infinite; transform-origin:435px 382px; }
      .cloud { animation: drift 8s linear infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-7px) rotate(-1deg); } }
      @keyframes pedal { to { transform:rotate(360deg); } }
      @keyframes pedal2 { to { transform:rotate(360deg); } }
      @keyframes drift { to { transform:translateX(35px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
