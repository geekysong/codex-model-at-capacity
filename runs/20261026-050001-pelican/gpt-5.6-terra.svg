  <text x="85" y="335" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#173042">“Make way!</text>
  <text x="89" y="357" font-family="Arial, sans-serif" font-size="19" font-weight="800" fill="#173042">I’m aerodynamic!”</text>

  <rect x="0" y="518" width="800" height="82" fill="#173042"/>
  <text x="400" y="551" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff4b9">A BIG BIRD, A TINY BIKE, AND ABSOLUTELY NO SELF-DOUBT.</text>
