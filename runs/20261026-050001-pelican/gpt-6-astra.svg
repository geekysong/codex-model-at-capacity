<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a fish in its enormous bill. Both wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1" fill="#d9ccac" opacity=".25"/>
      <circle cx="18" cy="20" r=".7" fill="#d9ccac" opacity=".25"/>
    </pattern>
    <g id="spokes" stroke="#647e85" stroke-width="3">
      <path d="M-68 0H68M0-68V68M-48-48L48 48M-48 48L48-48"/>
      <circle r="53" fill="none" stroke="#b8c8c6" stroke-width="2"/>
    </g>
    <style>
      .ink{stroke:#20333c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      text{font-family:Arial,Helvetica,sans-serif;fill:#20333c}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff3d8"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 345Q120 310 232 346T460 341T800 335V488H0Z" fill="#d9e6d3"/>
  <path d="M0 387Q160 360 325 389T800 379V488H0Z" fill="#bed4bd"/>
  <circle cx="702" cy="145" r="36" fill="#f5bf57"/>

  <text x="400" y="64" text-anchor="middle" font-size="49" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-size="16" font-weight="bold" letter-spacing="2">BIG BILL. TINY BIKE. ZERO SELF-AWARENESS.</text>

  <!-- A single roadside boast. -->
  <g class="ink">
    <path d="M681 354V454" fill="none" stroke="#8c7658"/>
    <path d="M619 313H738V367H619Z" fill="#fff9eb"/>
  </g>
  <text x="678" y="336" text-anchor="middle" font-size="15" font-weight="bold">BIKE LANE</text>
  <text x="678" y="356" text-anchor="middle" font-size="13">not a flyway</text>

  <ellipse cx="378" cy="469" rx="241" ry="13" fill="#20333c" opacity=".13"/>
  <path d="M55 476H746" stroke="#20333c" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#fff3d8" stroke-width="5" stroke-linecap="round">
    <path d="M52 448H107M647 448H706"/>
  </g>

  <!-- Wheel tires stay planted while their spokes rotate. -->
  <g transform="translate(245 398)">
    <circle r="73" fill="#fff9eb" class="ink" stroke-width="9"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#ed7956" class="ink"/>
  </g>
  <g transform="translate(524 398)">
    <circle r="73" fill="#fff9eb" class="ink" stroke-width="9"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#ed7956" class="ink"/>
  </g>

  <!-- Absurdly small racing bicycle. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M245 398L318 309L370 398H245L475 309H318M370 398L475 309L524 398" stroke="#20333c" stroke-width="12"/>
    <path d="M245 398L318 309L370 398H245L475 309H318M370 398L475 309L524 398" stroke="#e5644d" stroke-width="6"/>
    <path d="M318 309L306 283M475 309L461 268L487 250L509 255" stroke="#20333c" stroke-width="7"/>
    <path d="M282 282H329" stroke="#20333c" stroke-width="12"/>
    <path d="M501 253L516 257" stroke="#b67943" stroke-width="10"/>
    <path d="M245 398L370 384Q390 398 370 412L245 404" stroke="#526469" stroke-width="3"/>
  </g>
  <circle cx="370" cy="398" r="20" fill="#f4c85c" class="ink"/>

  <!-- Far leg moves gently in counterphase. -->
  <path d="M324 286Q297 327 342 358L350 398" fill="none" stroke="#20333c" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M324 286Q297 327 342 358L350 398;M324 286Q311 330 354 348L383 380;M324 286Q297 327 342 358L350 398" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M324 286Q297 327 342 358L350 398" fill="none" stroke="#eda23f" stroke-width="7" stroke-linecap="round">
    <animate attributeName="d" values="M324 286Q297 327 342 358L350 398;M324 286Q311 330 354 348L383 380;M324 286Q297 327 342 358L350 398" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- Pelican and its conspicuous cargo bob together. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M267 257L207 225L231 265L204 258L255 290" fill="#fafbf0" class="ink"/>
    <path d="M258 227C223 240 227 288 278 302C326 319 370 290 381 247L414 213L387 175C357 180 351 228 332 233C306 220 284 215 258 227Z" fill="#fffdf2" class="ink"/>
    <path d="M257 246C274 225 319 242 335 269C310 291 278 285 257 246Z" fill="#dbe4df" class="ink"/>
    <path d="M275 248L303 266M286 242L317 261" fill="none" stroke="#a0b5b5" stroke-width="3" stroke-linecap="round"/>
    <path d="M349 242C385 248 402 269 448 268L488 253" fill="none" stroke="#20333c" stroke-width="17" stroke-linecap="round"/>
    <path d="M349 242C385 248 402 269 448 268L488 253" fill="none" stroke="#f9fbef" stroke-width="10" stroke-linecap="round"/>

    <path d="M377 220C359 198 368 158 392 147C421 132 448 151 451 175L440 210Z" fill="#fffdf2" class="ink"/>
    <path d="M428 188L611 190Q571 266 488 244Q455 233 428 206Z" fill="#f6bb64" class="ink"/>
    <path d="M452 203Q491 252 558 222" fill="none" stroke="#d28b41" stroke-width="3"/>
    <path d="M433 180L625 191L434 200Z" fill="#f2a333" class="ink"/>

    <!-- The fish is unimpressed with its transport. -->
    <g transform="translate(530 222) rotate(-9)">
      <path d="M-31 0Q-6-22 19-1L36-12L32 3L39 14L18 9Q-8 23-31 0Z" fill="#79b7b2" stroke="#20333c" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-17" cy="-2" r="5" fill="#fff"/>
      <circle cx="-18" cy="-1" r="2" fill="#20333c"/>
      <path d="M-21 9L-11 8M1-9L5-16L13-8" fill="none" stroke="#20333c" stroke-width="2"/>
    </g>

    <ellipse cx="418" cy="171" rx="10" ry="13" fill="white" stroke="#20333c" stroke-width="3"/>
    <circle cx="422" cy="174" r="4" fill="#20333c"/>
    <path d="M405 153L426 158" fill="none" stroke="#20333c" stroke-width="5" stroke-linecap="round"/>
    <path d="M375 150Q376 119 405 119Q435 119 443 148Z" fill="#e5644d" class="ink"/>
    <path d="M388 126L386 142M403 124L402 140M418 127L421 142" stroke="#20333c" stroke-width="4" stroke-linecap="round"/>
    <path d="M372 150H450" stroke="#20333c" stroke-width="6" stroke-linecap="round"/>
    <path d="M383 204L372 221L349 214L359 234L378 227" fill="#e5644d" stroke="#20333c" stroke-width="3"/>
  </g>

  <!-- Near leg flexes as the crank and webbed foot revolve. -->
  <path d="M332 294Q390 315 397 348L392 398" fill="none" stroke="#20333c" stroke-width="14" stroke-linecap="round">
    <animate attributeName="d" values="M332 294Q390 315 397 348L392 398;M332 289Q376 310 373 350L370 420;M332 294Q350 318 346 350L348 398;M332 289Q382 313 390 337L370 376;M332 294Q390 315 397 348L392 398" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <path d="M332 294Q390 315 397 348L392 398" fill="none" stroke="#f3ac43" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" values="M332 294Q390 315 397 348L392 398;M332 289Q376 310 373 350L370 420;M332 294Q350 318 346 350L348 398;M332 289Q382 313 390 337L370 376;M332 294Q390 315 397 348L392 398" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(370 398)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M-22 0H22" stroke="#20333c" stroke-width="5"/>
      <g transform="translate(22 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.4s" repeatCount="indefinite"/>
          <path d="M-5-6L11-8L23 4L-10 4Z" fill="#f3ac43" stroke="#20333c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-12 8H23" stroke="#20333c" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <g fill="none" stroke="#637c83" stroke-width="4" stroke-linecap="round">
    <path d="M176 294H212M151 312H201M175 331H199"/>
  </g>

  <!-- Dedicated caption and timestamp footer. -->
  <rect x="0" y="491" width="800" height="109" fill="#20333c"/>
  <text x="400" y="527" text-anchor="middle" font-size="23" font-weight="bold" style="fill:#fff3d8">“I cycle to reduce my carbon wingprint.”</text>
  <text x="400" y="550" text-anchor="middle" font-size="15" style="fill:#c7dcd7">The pelican still insists the fish counts as a passenger.</text>
  <text x="400" y="582" text-anchor="middle" font-size="16" style="fill:#fff3d8">2026-10-26 05:00:01 SGT (UTC+08:00)</text>
</svg>