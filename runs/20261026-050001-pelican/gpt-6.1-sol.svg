<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish-filled bill. The wheels spin, the pedals turn, and the bird bobs in an endless loop.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#ece7d9" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <circle r="83" fill="#fffaf0" stroke="#203c48" stroke-width="11"/>
      <circle r="72" fill="none" stroke="#a6bac0" stroke-width="2"/>
      <g stroke="#8babb3" stroke-width="3">
        <path d="M-76 0H76M0-76V76M-54-54L54 54M-54 54L54-54"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#203c48"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7e7"/>
  <path d="M0 150Q190 95 390 150T800 140V495H0Z" fill="#e1f0e9"/>
  <circle cx="701" cy="148" r="38" fill="#ffd776"/>
  <g fill="#fff" opacity=".8">
    <path d="M44 169q0-18 19-18 9-26 32-10 24-7 29 18H44Z"/>
    <path d="M579 183q0-15 17-15 10-23 29-9 21-5 26 18H579Z"/>
  </g>

  <text x="400" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="3" fill="#203c48">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#46616a">THE ONLY RIDER WITH BUILT-IN GROCERY STORAGE.</text>

  <path d="M0 445Q200 429 400 446T800 441V510H0Z" fill="#d4d2b9"/>
  <path d="M0 480H800" stroke="#fff7e7" stroke-width="5" stroke-dasharray="42 30">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur=".9s" repeatCount="indefinite"/>
  </path>
  <ellipse cx="406" cy="455" rx="249" ry="16" fill="#203c48" opacity=".12"/>

  <g fill="none" stroke="#719895" stroke-width="4" stroke-linecap="round">
    <path d="M116 284H167M96 305H150M133 326H168"/>
  </g>

  <use href="#wheel" x="248" y="365"/>
  <use href="#wheel" x="562" y="365"/>

  <g stroke-linejoin="round" stroke-linecap="round">
    <g fill="none" stroke="#203c48" stroke-width="14">
      <path d="M248 365L321 257L391 365ZM321 257H506L391 365M506 257L562 365M391 365L367 248"/>
      <path d="M506 257L496 223L525 208"/>
    </g>
    <g fill="none" stroke="#ed6750" stroke-width="8">
      <path d="M248 365L321 257L391 365ZM321 257H506L391 365M506 257L562 365M391 365L367 248"/>
    </g>
    <path d="M342 245H389" stroke="#203c48" stroke-width="13"/>
    <path d="M520 207L542 203" stroke="#203c48" stroke-width="10"/>
    <path d="M388 353L252 355Q239 365 252 376L389 377" fill="none" stroke="#687b7c" stroke-width="3"/>
    <circle cx="391" cy="365" r="22" fill="#ffda78" stroke="#203c48" stroke-width="4"/>
    <g transform="translate(391 365)">
      <g>
        <path d="M-27 0H27" stroke="#203c48" stroke-width="7"/>
        <path d="M-36 0H-18M18 0H36" stroke="#203c48" stroke-width="8"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <!-- Feet and bent legs -->
    <path d="M349 274L329 310L389 343" fill="none" stroke="#d89235" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M392 276L424 311L404 359" fill="none" stroke="#efb44c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M381 340L405 348L378 354Z" fill="#efb44c" stroke="#203c48" stroke-width="3"/>
    <g>
      <path d="M403 351L426 367L394 369Z" fill="#ffbf4d" stroke="#203c48" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" values="-8 404 355;8 404 355;-8 404 355" dur=".9s" repeatCount="indefinite"/>
    </g>

    <!-- Tail, body, and reaching wing -->
    <path d="M300 244L267 217L277 257L259 253L295 278Z" fill="#f5f4df" stroke="#203c48" stroke-width="4" stroke-linejoin="round"/>
    <path d="M292 218C308 179 384 178 416 217C441 247 411 284 367 286C318 290 280 264 292 218Z" fill="#fffdf2" stroke="#203c48" stroke-width="4"/>
    <path d="M311 231Q332 272 385 259Q355 226 325 223" fill="#d8e3da" stroke="#203c48" stroke-width="3"/>
    <path d="M379 219Q427 231 456 215L520 205" fill="none" stroke="#203c48" stroke-width="18" stroke-linecap="round"/>
    <path d="M379 219Q427 231 456 215L520 205" fill="none" stroke="#fffdf2" stroke-width="11" stroke-linecap="round"/>

    <!-- Long neck and expressive head -->
    <path d="M374 218C386 191 374 167 382 143C390 119 422 116 436 136C446 153 432 171 419 182L421 222" fill="#fffdf2" stroke="#203c48" stroke-width="4"/>
    <path d="M385 147Q404 157 430 147" fill="none" stroke="#d4dfd6" stroke-width="5"/>
    <path d="M430 150L615 172Q607 225 514 226Q457 222 428 170Z" fill="#ffca62" stroke="#203c48" stroke-width="4" stroke-linejoin="round"/>
    <path d="M431 151L622 167L615 177L431 170Z" fill="#f49543" stroke="#203c48" stroke-width="4" stroke-linejoin="round"/>
    <path d="M448 181Q496 215 564 201" fill="none" stroke="#d28c36" stroke-width="3"/>

    <!-- Fish enjoying the ride -->
    <path d="M512 190Q536 170 555 187L570 178L566 199L553 193Q532 209 512 190Z" fill="#73b9b7" stroke="#203c48" stroke-width="3"/>
    <circle cx="524" cy="188" r="3" fill="#203c48"/>
    <path d="M534 182L539 175L545 182" fill="#73b9b7" stroke="#203c48" stroke-width="2"/>

    <circle cx="417" cy="140" r="10" fill="#fff" stroke="#203c48" stroke-width="3"/>
    <circle cx="421" cy="139" r="4" fill="#203c48"/>
    <path d="M405 123L427 127" stroke="#203c48" stroke-width="4" stroke-linecap="round"/>
    <!-- Racing helmet -->
    <path d="M379 127Q383 102 408 104Q431 105 440 125Z" fill="#ed6750" stroke="#203c48" stroke-width="4"/>
    <path d="M393 111L390 120M407 109L406 120M420 112L423 121" stroke="#fff7e7" stroke-width="4" stroke-linecap="round"/>
    <path d="M381 126L445 127" stroke="#203c48" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Arial, sans-serif" fill="#203c48">
    <path d="M604 252Q660 237 737 253V313Q675 331 615 310L594 319L605 296Z" fill="#fffdf2" stroke="#203c48" stroke-width="3"/>
    <text x="670" y="277" text-anchor="middle" font-size="17" font-weight="bold">“I carb-load</text>
    <text x="670" y="299" text-anchor="middle" font-size="17" font-weight="bold">on sardines.”</text>
  </g>

  <rect y="510" width="800" height="90" fill="#203c48"/>
  <text x="400" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff7e7">Two wheels. One enormous lunch commitment.</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffda78">2026-10-26 05:01:21 SGT (UTC+08:00)</text>
</svg>