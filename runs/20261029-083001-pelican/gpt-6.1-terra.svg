<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican pedals furiously on a bicycle while a fish rides in its bill.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#24546b" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#173748;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#173748}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center bottom;animation:bob .7s ease-in-out infinite alternate}
      .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-5px) rotate(-1deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 410 Q130 350 260 410 T520 410 T800 400 V520 H0Z" fill="#76c88b"/>
  <path d="M0 455 Q180 420 360 455 T800 445" fill="none" stroke="#4fa66f" stroke-width="8"/>
  <path d="M0 515 H800" stroke="#173748" stroke-width="10"/>
  <path d="M40 110 Q150 55 260 105" fill="none" stroke="#fff" stroke-width="12" opacity=".75"/>
  <path d="M560 95 q55-40 110 0" fill="none" stroke="#fff" stroke-width="12" opacity=".75"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="40" font-weight="900">PELICAN ON A BICYCLE</text>
  <text x="400" y="95" text-anchor="middle" class="label" font-size="20" font-style="italic">“When the beak is the engine, traffic laws become suggestions.”</text>

  <g filter="url(#shadow)">
    <g class="wheel">
      <circle cx="220" cy="430" r="72" fill="#f7f7f2" class="ink"/>
      <circle cx="220" cy="430" r="10" fill="#ef6b4a" class="ink"/>
      <path d="M220 358V502M148 430H292M169 379L271 481M271 379L169 481" fill="none" stroke="#5b8ca1" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="575" cy="430" r="72" fill="#f7f7f2" class="ink"/>
      <circle cx="575" cy="430" r="10" fill="#ef6b4a" class="ink"/>
      <path d="M575 358V502M503 430H647M524 379L626 481M626 379L524 481" fill="none" stroke="#5b8ca1" stroke-width="4"/>
    </g>
    <path d="M220 430 L345 325 L575 430 L430 430 Z" fill="none" class="ink"/>
    <path d="M345 325 L390 430" fill="none" class="ink"/>
    <path d="M345 325 L330 295" fill="none" class="ink"/>
    <path d="M330 295 h65" fill="none" class="ink"/>
    <path d="M575 430 L600 330" fill="none" class="ink"/>
    <path d="M600 330 h45" fill="none" class="ink"/>
    <path d="M430 430 l-12 34 m12-34 l27 20" fill="none" class="ink"/>
    <g class="pedal">
      <circle cx="430" cy="430" r="27" fill="none" stroke="#ef6b4a" stroke-width="6"/>
      <path d="M430 430 l30 -18 m-30 18 l-23 25" fill="none" stroke="#ef6b4a" stroke-width="6"/>
      <path d="M460 412 h24 M407 455 h-24" fill="none" class="ink"/>
    </g>
  </g>

  <g class="rider">
    <ellipse cx="418" cy="290" rx="68" ry="92" fill="#f7f7f2" class="ink"/>
    <path d="M370 255 Q410 205 465 235 Q500 258 493 306 Q480 345 431 350 Q382 340 370 300Z" fill="#fffdf4" class="ink"/>
    <path d="M455 250 Q490 175 565 198 Q620 214 630 256 Q579 282 520 272Z" fill="#f3c24f" class="ink"/>
    <path d="M520 272 Q572 282 630 256" fill="none" stroke="#c97938" stroke-width="9"/>
    <ellipse cx="587" cy="224" rx="8" ry="11" fill="#173748"/>
    <path d="M405 238 Q430 220 454 239" fill="none" class="ink"/>
    <path d="M390 320 Q425 348 466 320" fill="none" stroke="#ef6b4a" stroke-width="8"/>
    <path d="M396 343 L365 405" fill="none" class="ink"/>
    <path d="M466 342 L500 405" fill="none" class="ink"/>
    <path d="M365 405 L330 430" fill="none" class="ink"/>
    <path d="M500 405 L452 430" fill="none" class="ink"/>
    <path d="M400 228 Q372 185 392 145" fill="none" class="ink"/>
    <path d="M392 145 Q417 118 443 145" fill="none" class="ink"/>
    <path d="M443 145 Q462 181 447 220" fill="none" class="ink"/>
    <path d="M386 153 l-18 -20 M400 145 l-4 -26 M418 143 l10 -23" fill="none" stroke="#ef6b4a" stroke-width="7"/>
    <path d="M530 210 q20-28 45-5" fill="none" stroke="#ef6b4a" stroke-width="7"/>
    <path d="M592 202 q12 10 18 25" fill="none" stroke="#ef6b4a" stroke-width="5"/>
    <g transform="translate(548 183) rotate(-10)">
      <path d="M0 0 q25-20 48 0 q-23 22-48 0Z" fill="#6fc6df" class="ink"/>
      <circle cx="13" cy="-2" r="3" fill="#173748"/>
    </g>
  </g>

  <path d="M90 250 q40-25 80 0" fill="none" stroke="#ef6b4a" stroke-width="8"/>
  <text x="90" y="285" class="label" font-size="18" font-weight="bold">HONK!</text>
  <text x="665" y="365" class="label" font-size="18" font-weight="bold" transform="rotate(12 665 365)">NO FISHING</text>
  <path d="M650 380 q38 20 72 0" fill="none" stroke="#ef6b4a" stroke-width="5"/>

  <rect x="30" y="545" width="740" height="38" rx="12" fill="#fffdf4" stroke="#173748" stroke-width="4"/>
  <text x="400" y="570" text-anchor="middle" class="label" font-size="17" font-weight="700">2026-10-29 08:32:12 SGT (UTC+08:00)</text>
</svg>