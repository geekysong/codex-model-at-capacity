<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b68"/>
      <stop offset="1" stop-color="#292d38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#202532;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202532}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffe37a" opacity=".85"/>
  <path d="M0 365 Q115 320 235 360 T470 350 T800 365 V430 H0Z" fill="#8fd18b"/>
  <path d="M0 430 Q185 390 400 432 T800 425 V600 H0Z" fill="url(#road)"/>
  <path d="M0 492 H800" stroke="#f8e28b" stroke-width="8" stroke-dasharray="42 28" opacity=".9"/>

  <text x="400" y="64" text-anchor="middle" class="label" font-size="39" font-weight="900" fill="#ffffff" stroke="#202532" stroke-width="3" paint-order="stroke">
    THE GREAT PELICAN COMMUTE
  </text>
  <text x="400" y="101" text-anchor="middle" class="label" font-size="20" font-weight="700">
    One bird. Two wheels. Absolutely no traffic sense.
  </text>

  <g filter="url(#shadow)">
    <g aria-label="bicycle">
      <g fill="none" class="ink">
        <circle cx="254" cy="455" r="70" fill="#dbe7ef"/>
        <circle cx="568" cy="455" r="70" fill="#dbe7ef"/>
        <path d="M254 455 L350 350 L455 455 L254 455 M350 350 L397 455 M455 455 L568 455 M350 350 L315 312 M315 312 L278 312"/>
        <path d="M397 455 L376 406 M376 406 L425 406"/>
      </g>
      <g id="wheelSpokes" stroke="#778492" stroke-width="3">
        <path d="M254 385 V525 M184 455 H324 M205 406 L303 504 M205 504 L303 406"/>
        <path d="M568 385 V525 M498 455 H638 M519 406 L617 504 M519 504 L617 406"/>
      </g>
      <circle cx="254" cy="455" r="10" fill="#202532"/>
      <circle cx="568" cy="455" r="10" fill="#202532"/>
      <circle cx="397" cy="455" r="11" fill="#e8b52e" class="ink"/>
      <path d="M397 455 L369 419 M397 455 L428 487" fill="none" stroke="#202532" stroke-width="7"/>
      <circle cx="369" cy="419" r="7" fill="#f05a47"/>
      <circle cx="428" cy="487" r="7" fill="#f05a47"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.1s" repeatCount="indefinite"/>
    </g>

    <g id="pelican" transform="translate(0 0)">
      <ellipse cx="393" cy="295" rx="92" ry="77" fill="#f5f2e9" class="ink"/>
      <path d="M332 278 Q279 250 253 273 Q282 305 341 319" fill="#f3a43b" class="ink"/>
      <path d="M254 273 Q277 292 340 305" fill="none" stroke="#b96522" stroke-width="4"/>
      <path d="M351 225 Q337 145 401 128 Q468 111 491 177 Q505 220 467 255" fill="#faf8f0" class="ink"/>
      <path d="M410 132 Q452 123 478 153 Q443 164 410 155Z" fill="#d8d0c0"/>
      <circle cx="437" cy="169" r="10" fill="#202532"/>
      <circle cx="440" cy="166" r="3" fill="#ffffff"/>
      <path d="M472 194 Q520 213 530 252 Q493 275 455 243" fill="#f5f2e9" class="ink"/>
      <path d="M462 244 Q506 248 522 273" fill="none" class="ink"/>
      <path d="M367 363 L350 421 M426 363 L448 420" fill="none" stroke="#e89a2e" stroke-width="10"/>
      <path d="M350 421 L330 429 M448 420 L470 426" fill="none" stroke="#e89a2e" stroke-width="8"/>
      <path d="M349 278 Q385 298 416 279" fill="none" stroke="#d8d0c0" stroke-width="6"/>
      <path d="M355 237 Q380 213 408 238" fill="none" stroke="#c7c0b2" stroke-width="5"/>
      <path d="M381 218 Q391 201 405 218" fill="#f05a47" class="ink"/>
      <path d="M350 284 Q340 314 350 345" fill="none" stroke="#f05a47" stroke-width="7"/>
      <path d="M461 285 Q473 313 463 343" fill="none" stroke="#f05a47" stroke-width="7"/>
      <path d="M343 344 Q396 366 467 344" fill="none" stroke="#202532" stroke-width="5"/>
      <text x="400" y="395" text-anchor="middle" class="label" font-size="16" font-weight="800" fill="#c53b2f">HONK!</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <g transform="translate(627 205) rotate(8)">
    <path d="M0 0 Q30 -32 58 0" fill="none" stroke="#ffffff" stroke-width="7" opacity=".8"/>
    <path d="M18 22 Q48 -10 76 22" fill="none" stroke="#ffffff" stroke-width="7" opacity=".8"/>
  </g>

  <rect x="24" y="535" width="752" height="44" rx="12" fill="#ffffff" opacity=".9"/>
  <text x="400" y="563" text-anchor="middle" class="label" font-size="18" font-weight="700">
    2026-10-29 08:30:50 SGT (UTC+08:00)
  </text>

  <animateTransform href="#wheelSpokes" attributeName="transform" type="rotate" from="0 411 455" to="360 411 455" dur="1.2s" repeatCount="indefinite"/>
</svg>