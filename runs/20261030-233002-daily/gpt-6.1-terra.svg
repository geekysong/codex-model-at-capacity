<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid route from A1 to E5</title>
  <desc id="desc">A blue route follows the top row and rightmost column from A1 to E5, avoiding blocked intersections B2, C3, and D4. The route has eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">City grid: A1 to E5</text>

  <!-- City blocks -->
  <g fill="#e2e8f0" stroke="#cbd5e1">
    <rect x="142" y="75" width="74" height="41" rx="3"/>
    <rect x="232" y="75" width="74" height="41" rx="3"/>
    <rect x="322" y="75" width="74" height="41" rx="3"/>
    <rect x="412" y="75" width="74" height="41" rx="3"/>
    <rect x="142" y="132" width="74" height="41" rx="3"/>
    <rect x="232" y="132" width="74" height="41" rx="3"/>
    <rect x="322" y="132" width="74" height="41" rx="3"/>
    <rect x="412" y="132" width="74" height="41" rx="3"/>
    <rect x="142" y="189" width="74" height="41" rx="3"/>
    <rect x="232" y="189" width="74" height="41" rx="3"/>
    <rect x="322" y="189" width="74" height="41" rx="3"/>
    <rect x="412" y="189" width="74" height="41" rx="3"/>
    <rect x="142" y="246" width="74" height="41" rx="3"/>
    <rect x="232" y="246" width="74" height="41" rx="3"/>
    <rect x="322" y="246" width="74" height="41" rx="3"/>
    <rect x="412" y="246" width="74" height="41" rx="3"/>
  </g>

  <!-- Streets -->
  <g stroke="#94a3b8" stroke-width="3" fill="none">
    <path d="M134 67H494 M134 124H494 M134 181H494 M134 238H494 M134 295H494"/>
    <path d="M134 67V295 M224 67V295 M314 67V295 M404 67V295 M494 67V295"/>
  </g>

  <!-- Shortest route -->
  <path d="M134 67H494V295" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersection markers -->
  <g fill="#475569">
    <circle cx="134" cy="124" r="3"/><circle cx="134" cy="181" r="3"/><circle cx="134" cy="238" r="3"/><circle cx="134" cy="295" r="3"/>
    <circle cx="224" cy="181" r="3"/><circle cx="224" cy="238" r="3"/><circle cx="224" cy="295" r="3"/>
    <circle cx="314" cy="124" r="3"/><circle cx="314" cy="238" r="3"/><circle cx="314" cy="295" r="3"/>
    <circle cx="404" cy="124" r="3"/><circle cx="404" cy="181" r="3"/><circle cx="404" cy="295" r="3"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M218 118l12 12 M230 118l-12 12"/>
    <path d="M308 175l12 12 M320 175l-12 12"/>
    <path d="M398 232l12 12 M410 232l-12 12"/>
  </g>

  <!-- Start and end -->
  <circle cx="134" cy="67" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="494" cy="295" r="7" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
  <text x="118" y="62" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">Start</text>
  <text x="510" y="300" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">End</text>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#0f172a">
    <text x="142" y="59">A1</text><text x="232" y="59">B1</text><text x="322" y="59">C1</text><text x="412" y="59">D1</text><text x="502" y="59">E1</text>
    <text x="142" y="116">A2</text><text x="232" y="116">B2</text><text x="322" y="116">C2</text><text x="412" y="116">D2</text><text x="502" y="116">E2</text>
    <text x="142" y="173">A3</text><text x="232" y="173">B3</text><text x="322" y="173">C3</text><text x="412" y="173">D3</text><text x="502" y="173">E3</text>
    <text x="142" y="230">A4</text><text x="232" y="230">B4</text><text x="322" y="230">C4</text><text x="412" y="230">D4</text><text x="502" y="230">E4</text>
    <text x="142" y="287">A5</text><text x="232" y="287">B5</text><text x="322" y="287">C5</text><text x="412" y="287">D5</text><text x="502" y="287">E5</text>
  </g>

  <text x="300" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8">Route: 8 street segments</text>
  <line x1="40" y1="350" x2="560" y2="350" stroke="#cbd5e1"/>
  <text x="300" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 23:35:04 SGT (UTC+08:00)</text>
</svg>