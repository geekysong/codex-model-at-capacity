<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest route from A1 to E5</title>
  <desc id="desc">A five-by-five street intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#172554">Shortest route: 8 street segments</text>

  <path d="M100 70H500V310H100Z" fill="#e2e8f0"/>
