    <circle cx="100" cy="130" r="4"/><circle cx="300" cy="130" r="4"/><circle cx="400" cy="130" r="4"/><circle cx="500" cy="130" r="4"/>
    <circle cx="100" cy="190" r="4"/><circle cx="200" cy="190" r="4"/><circle cx="400" cy="190" r="4"/><circle cx="500" cy="190" r="4"/>
    <circle cx="100" cy="250" r="4"/><circle cx="200" cy="250" r="4"/><circle cx="300" cy="250" r="4"/><circle cx="500" cy="250" r="4"/>
    <circle cx="100" cy="310" r="4"/><circle cx="200" cy="310" r="4"/><circle cx="300" cy="310" r="4"/><circle cx="400" cy="310" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 122L208 138 M208 122L192 138"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M392 242L408 258 M408 242L392 258"/>
