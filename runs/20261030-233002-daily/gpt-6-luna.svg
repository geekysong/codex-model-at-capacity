<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down map of a 5 by 5 city grid with a shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4">
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b">City Block Route Map</text>

  <!-- Streets -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <path d="M100 70H500 M100 130H500 M100 190H500 M100 250H500 M100 310H500"/>
    <path d="M100 70V310 M200 70V310 M300 70V310 M400 70V310 M500 70V310"/>
  </g>

  <!-- Shortest route: 8 street segments -->
  <path d="M100 70 H200 V70 H300 V70 H400 V70 H500 V130 H500 V190 H500 V250 H500 V310"
        fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <circle cx="100" cy="70" r="8"/>
    <circle cx="500" cy="310" r="8"/>
  </g>

  <!-- Intersections and labels -->
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle" dominant-baseline="middle">
    <g fill="#334155">
      <circle cx="200" cy="70" r="4"/><circle cx="300" cy="70" r="4"/><circle cx="400" cy="70" r="4"/>
      <circle cx="100" cy="130" r="4"/><circle cx="200" cy="130" r="4"/><circle cx="300" cy="130" r="4"/><circle cx="400" cy="130" r="4"/><circle cx="500" cy="130" r="4"/>
      <circle cx="100" cy="190" r="4"/><circle cx="200" cy="190" r="4"/><circle cx="300" cy="190" r="4"/><circle cx="400" cy="190" r="4"/><circle cx="500" cy="190" r="4"/>
      <circle cx="100" cy="250" r="4"/><circle cx="200" cy="250" r="4"/><circle cx="300" cy="250" r="4"/><circle cx="400" cy="250" r="4"/><circle cx="500" cy="250" r="4"/>
      <circle cx="100" cy="310" r="4"/><circle cx="200" cy="310" r="4"/><circle cx="300" cy="310" r="4"/><circle cx="400" cy="310" r="4"/>
    </g>
    <g fill="#334155">
      <text x="200" y="53">B1</text><text x="300" y="53">C1</text><text x="400" y="53">D1</text>
      <text x="100" y="113">A2</text><text x="300" y="113">C2</text><text x="400" y="113">D2</text><text x="500" y="113">E2</text>
      <text x="100" y="173">A3</text><text x="200" y="173">B3</text><text x="400" y="173">D3</text><text x="500" y="173">E3</text>
      <text x="100" y="233">A4</text><text x="200" y="233">B4</text><text x="300" y="233">C4</text><text x="500" y="233">E4</text>
      <text x="100" y="293">A5</text><text x="200" y="293">B5</text><text x="300" y="293">C5</text><text x="400" y="293">D5</text>
    </g>
    <g fill="#fff" font-weight="700" font-size="11">
      <text x="100" y="70">A1</text>
      <text x="500" y="310">E5</text>
    </g>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M191 121l18 18m0-18l-18 18"/>
    <path d="M291 181l18 18m0-18l-18 18"/>
    <path d="M391 241l18 18m0-18l-18 18"/>
  </g>

  <!-- Legend and route length -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <text x="100" y="348" font-weight="700" fill="#2563eb">Start: A1</text>
    <text x="220" y="348" font-weight="700" fill="#2563eb">End: E5</text>
    <text x="345" y="348" font-weight="700">Route: 8 street segments</text>
  </g>
  <text x="300" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">2026-10-30 23:34:53 SGT (UTC+08:00)</text>
</svg>