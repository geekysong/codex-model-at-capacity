<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street map: shortest route from A1 to E5</title>
  <desc id="desc">Five columns and five rows of intersections. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, totaling eight street segments and avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- City blocks -->
  <g fill="#e2e8f0" stroke="#cbd5e1">
    <path d="M110 65h80v40h-80z M210 65h80v40h-80z M310 65h80v40h-80z M410 65h80v40h-80z
             M110 125h80v40h-80z M210 125h80v40h-80z M310 125h80v40h-80z M410 125h80v40h-80z
             M110 185h80v40h-80z M210 185h80v40h-80z M310 185h80v40h-80z M410 185h80v40h-80z
             M110 245h80v40h-80z M210 245h80v40h-80z M310 245h80v40h-80z M410 245h80v40h-80z"/>
  </g>

  <!-- Streets -->
  <path d="M100 55H500 M100 115H500 M100 175H500 M100 235H500 M100 295H500
           M100 55V295 M200 55V295 M300 55V295 M400 55V295 M500 55V295"
        fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

  <!-- Shortest route: four segments east, four south -->
  <path d="M100 55H500V295" fill="none" stroke="#2563eb" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>

  <g fill="#fff" stroke="#475569" stroke-width="2">
    <circle cx="200" cy="55" r="4"/><circle cx="300" cy="55" r="4"/>
    <circle cx="400" cy="55" r="4"/><circle cx="500" cy="55" r="4"/>
    <circle cx="100" cy="115" r="4"/><circle cx="300" cy="115" r="4"/>
    <circle cx="400" cy="115" r="4"/><circle cx="500" cy="115" r="4"/>
    <circle cx="100" cy="175" r="4"/><circle cx="200" cy="175" r="4"/>
    <circle cx="400" cy="175" r="4"/><circle cx="500" cy="175" r="4"/>
    <circle cx="100" cy="235" r="4"/><circle cx="200" cy="235" r="4"/>
    <circle cx="300" cy="235" r="4"/><circle cx="500" cy="235" r="4"/>
    <circle cx="100" cy="295" r="4"/><circle cx="200" cy="295" r="4"/>
    <circle cx="300" cy="295" r="4"/><circle cx="400" cy="295" r="4"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="100" y="39">A1</text><text x="200" y="39">B1</text><text x="300" y="39">C1</text><text x="400" y="39">D1</text><text x="500" y="39">E1</text>
    <text x="100" y="99">A2</text><text x="200" y="99">B2</text><text x="300" y="99">C2</text><text x="400" y="99">D2</text><text x="500" y="99">E2</text>
    <text x="100" y="159">A3</text><text x="200" y="159">B3</text><text x="300" y="159">C3</text><text x="400" y="159">D3</text><text x="500" y="159">E3</text>
    <text x="100" y="219">A4</text><text x="200" y="219">B4</text><text x="300" y="219">C4</text><text x="400" y="219">D4</text><text x="500" y="219">E4</text>
    <text x="100" y="279">A5</text><text x="200" y="279">B5</text><text x="300" y="279">C5</text><text x="400" y="279">D5</text><text x="500" y="279">E5</text>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M192 107l16 16m0-16l-16 16"/>
    <path d="M292 167l16 16m0-16l-16 16"/>
    <path d="M392 227l16 16m0-16l-16 16"/>
  </g>

  <circle cx="100" cy="55" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="295" r="8" fill="#2563eb" stroke="#fff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold">
    <text x="78" y="60" text-anchor="end" fill="#166534">START</text>
    <text x="520" y="300" fill="#1d4ed8">END</text>
  </g>

  <!-- Dedicated footer -->
  <rect x="0" y="327" width="600" height="73" fill="#fff"/>
  <path d="M24 327H576" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="351" font-size="16" font-weight="bold" fill="#1d4ed8">Shortest route: 8 street segments</text>
    <text x="300" y="380" font-size="14" fill="#334155">2026-10-30 23:33:49 SGT (UTC+08:00)</text>
  </g>
</svg>