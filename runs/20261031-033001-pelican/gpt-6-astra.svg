<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Economy</title>
  <desc id="desc">A smug pelican cycles along the waterfront with a fish-filled bill and a bicycle basket marked EMPTY. Wheels spin, pedals turn, and the pelican bobs. Caption: Why buy a cargo bike when your face is one?</desc>
  <defs>
    <pattern id="water" width="80" height="20" patternUnits="userSpaceOnUse">
      <path d="M5 10h35m15 0h15" fill="none" stroke="#8ac9ce" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff8e7"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="none" stroke="#243743" stroke-width="3"/>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="35" font-weight="900" fill="#243743">THE PELICAN PEDAL ECONOMY</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" letter-spacing="3" fill="#57777b">BIG BILL. SMALL CARBON FOOTPRINT.</text>

  <rect x="40" y="112" width="720" height="359" rx="18" fill="#d9eef0"/>
  <circle cx="106" cy="166" r="33" fill="#ffce68"/>
  <path d="M50 292Q160 274 270 292T490 292T750 292V403H50Z" fill="#acd8d8"/>
  <path d="M50 310H750V405H50Z" fill="url(#water)"/>
  <path d="M59 222q13-13 26 0q13-13 26 0m541-54q11-11 22 0q11-11 22 0" fill="none" stroke="#648c97" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 409H760V453Q760 471 742 471H58Q40 471 40 453Z" fill="#d8cdb7"/>
  <path d="M50 410H750" stroke="#243743" stroke-width="4"/>
  <ellipse cx="403" cy="438" rx="240" ry="12" fill="#b5aa97" opacity=".55"/>

  <!-- Waterfront satire -->
  <g stroke="#243743" stroke-width="3">
    <path d="M693 408V278"/>
    <rect x="640" y="237" width="104" height="64" rx="7" fill="#fff8e7"/>
  </g>
  <text x="692" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#243743">FUEL PRICES</text>
  <text x="692" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#d45d46">1 FISH ↑</text>

  <!-- Wheels rotate around their own axles -->
  <g fill="#fff8e7" stroke="#243743">
    <circle cx="239" cy="363" r="73" stroke-width="10"/>
    <circle cx="555" cy="363" r="73" stroke-width="10"/>
    <g stroke="#7b9395" stroke-width="3">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 239 363" to="360 239 363" dur="1.8s" repeatCount="indefinite"/>
        <path d="M239 295V431M171 363H307M191 315L287 411M191 411L287 315"/>
        <path d="M217 299L223 315" stroke="#e99636" stroke-width="7"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 555 363" to="360 555 363" dur="1.8s" repeatCount="indefinite"/>
        <path d="M555 295V431M487 363H623M507 315L603 411M507 411L603 315"/>
        <path d="M533 299L539 315" stroke="#e99636" stroke-width="7"/>
      </g>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M239 363L310 270L372 363ZM310 270H491L372 363M491 270L555 363" stroke="#243743" stroke-width="13"/>
    <path d="M239 363L310 270L372 363ZM310 270H491L372 363M491 270L555 363" stroke="#de624a" stroke-width="7"/>
    <path d="M310 270L300 244M491 270L479 227L510 214" stroke="#243743" stroke-width="8"/>
    <path d="M281 244H324M505 215L525 210" stroke="#243743" stroke-width="12"/>
    <path d="M239 363L372 351L386 363L372 377Z" stroke="#667778" stroke-width="3"/>
  </g>
  <g fill="#243743">
    <circle cx="239" cy="363" r="8"/>
    <circle cx="555" cy="363" r="8"/>
    <circle cx="372" cy="363" r="17"/>
  </g>

  <!-- The basket nobody needs -->
  <path d="M536 239H614L605 288H546Z" fill="#e7ba76" stroke="#243743" stroke-width="4"/>
  <path d="M553 240L557 287M571 240V287M590 240L586 287M541 255H610M544 273H607" fill="none" stroke="#a87747" stroke-width="2"/>
  <rect x="549" y="252" width="53" height="23" rx="3" fill="#fff8e7"/>
  <text x="575.5" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#243743">EMPTY</text>

  <!-- Pedaling foot and crank -->
  <path d="M338 264L333 306L372 340" fill="none" stroke="#243743" stroke-width="15" stroke-linecap="round"/>
  <path d="M338 264L333 306L372 340" fill="none" stroke="#edab42" stroke-width="9" stroke-linecap="round"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 372 363" to="360 372 363" dur="1.8s" repeatCount="indefinite"/>
    <path d="M372 339V387" stroke="#243743" stroke-width="6"/>
    <path d="M360 339H384M360 387H384" stroke="#243743" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Pelican bobs gently while its enormous pouch carries the groceries -->
  <g stroke="#243743" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M289 209L255 192L264 223L245 222L275 244" fill="#fffdf1" stroke-width="4"/>
    <path d="M285 199Q321 170 363 196Q382 207 387 224Q408 207 407 171Q404 139 430 134Q455 132 466 155Q475 178 455 201Q437 227 420 251Q405 279 356 276Q297 277 278 245Q266 222 285 199Z" fill="#fffdf1" stroke-width="4"/>
    <path d="M299 211Q348 188 379 232Q351 259 307 238L324 232L304 226" fill="#d5e2de" stroke-width="3"/>
    <path d="M393 220Q427 238 477 218L489 222" fill="none" stroke-width="12"/>
    <path d="M393 220Q427 238 477 218L489 222" fill="none" stroke="#fffdf1" stroke-width="7"/>

    <path d="M454 170L622 184Q605 237 540 247Q474 249 454 183Z" fill="#f4b85c" stroke-width="4"/>
    <!-- Fish visible in the pelican's shopping pouch -->
    <g fill="#6caaa9" stroke-width="2">
      <path d="M498 214Q520 193 548 212L561 203L559 224L547 217Q521 236 498 214Z"/>
      <path d="M550 228Q570 209 590 220L601 211L601 229L590 225Q569 242 550 228Z"/>
    </g>
    <circle cx="509" cy="213" r="2.5" fill="#243743" stroke="none"/>
    <circle cx="561" cy="226" r="2.5" fill="#243743" stroke="none"/>
    <path d="M453 168L635 178L620 190L455 183Z" fill="#ffd16c" stroke-width="4"/>
    <path d="M468 184L480 192" fill="none" stroke-width="2"/>

    <circle cx="446" cy="156" r="10" fill="white" stroke-width="2"/>
    <circle cx="450" cy="156" r="4" fill="#243743" stroke="none"/>
    <path d="M434 143L455 146" stroke-width="4"/>
    <!-- Tiny cycling helmet, tremendous confidence -->
    <path d="M408 138Q408 112 437 113Q464 114 466 137Z" fill="#de624a" stroke-width="4"/>
    <path d="M422 120L419 131M436 119V131M450 122L453 131" stroke-width="4"/>
    <path d="M414 140L421 166L432 169" fill="none" stroke-width="2"/>
    <path d="M321 270L359 296L391 337" fill="none" stroke-width="14"/>
    <path d="M321 270L359 296L391 337" fill="none" stroke="#edab42" stroke-width="8"/>
    <path d="M389 331L409 340L382 346L377 339Z" fill="#edab42" stroke-width="3"/>
  </g>

  <g fill="none" stroke="#648c97" stroke-width="3" stroke-linecap="round">
    <path d="M169 269H209M155 281H194M176 294H203">
      <animate attributeName="opacity" values=".3;1;.3" dur=".9s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="400" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#243743">Why buy a cargo bike when your face is one?</text>
  <path d="M65 528H735" stroke="#c6bfae" stroke-width="2"/>
  <text x="400" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#43555d">2026-10-31 03:30:01 SGT (UTC+08:00)</text>
</svg>