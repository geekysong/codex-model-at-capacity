<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE PELICAN COMMUTE</title>
  <desc id="desc">A smug pelican pedals a bicycle, carrying an absurdly large fish. The wheels spin and the rider bobs gently.</desc>
  <defs>
    <style>
      .ink{stroke:#18313b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#f8f4e8;stroke:#18313b;stroke-width:7}
      .spokes{stroke:#59727a;stroke-width:2.5}
      .type{font-family:Arial,Helvetica,sans-serif}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .ride{transform-box:fill-box;transform-origin:center;animation:bob .65s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-4px)}}
    </style>
  </defs>

  <!-- Sky and road -->
  <rect width="800" height="600" fill="#bcecff"/>
  <circle cx="690" cy="116" r="53" fill="#ffd166"/>
  <path d="M0 365 Q190 333 370 366 T800 350 V510 H0Z" fill="#80cf9d"/>
  <path d="M0 456 Q220 437 405 457 T800 440 V600 H0Z" fill="#50636b"/>
  <path d="M0 497 H800" stroke="#f8e7a0" stroke-width="8" stroke-dasharray="48 35"/>

  <!-- Title -->
  <text id="title" class="type" x="400" y="58" text-anchor="middle" font-size="35" font-weight="900" letter-spacing="2" fill="#18313b">THE PELICAN COMMUTE</text>
  <text class="type" x="400" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#34545d">A bird of very little cargo capacity has made a bold choice.</text>

  <!-- Background birds -->
  <path d="M118 177q15-18 30 0q15-18 30 0M620 226q12-15 24 0q12-15 24 0" fill="none" class="ink" stroke-width="3"/>

  <!-- Bicycle wheels -->
  <g class="spin">
    <circle class="wheel" cx="235" cy="414" r="78"/>
    <circle cx="235" cy="414" r="7" fill="#18313b"/>
    <g class="spokes">
      <path d="M235 336v156M157 414h156M180 359l110 110M290 359L180 469"/>
    </g>
  </g>
  <g class="spin">
    <circle class="wheel" cx="565" cy="414" r="78"/>
    <circle cx="565" cy="414" r="7" fill="#18313b"/>
    <g class="spokes">
      <path d="M565 336v156M487 414h156M510 359l110 110M620 359L510 469"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" class="ink">
    <path d="M235 414L327 330L390 414L235 414L300 414L327 330L430 330L390 414L565 414L430 330"/>
    <path d="M430 330l-10-26M398 304h42"/>
    <path d="M315 326l-18-13M284 310l27 7"/>
    <circle cx="300" cy="414" r="24" fill="none" stroke-width="4"/>
    <path d="M300 390v48M276 414h48" stroke-width="3"/>
  </g>
  <path d="M407 300h35" class="ink" stroke-width="8"/>
  <path d="M286 308h-30" class="ink" stroke-width="8"/>

  <!-- Rider bob group -->
  <g class="ride">
    <!-- Pelican body -->
    <path d="M323 268 Q342 219 400 226 Q446 232 453 280 L438 321 Q415 342 366 326 L328 309Z" fill="#fffdf4" class="ink"/>
    <path d="M367 310q40 3 63-21l13 31q-32 25-72 8z" fill="#f2a65a" class="ink"/>
    <path d="M350 280q24 17 46 14" fill="none" stroke="#d4d2c7" stroke-width="4"/>

    <!-- Long neck and head -->
    <path d="M377 250 Q367 205 390 173 Q407 150 438 161 Q457 168 459 190 Q461 214 435 225 L421 272" fill="#fffdf4" class="ink"/>
    <path d="M428 176 Q456 167 481 182 Q500 193 519 188 Q507 209 481 209 L447 203Z" fill="#f3a53b" class="ink"/>
    <path d="M447 201 Q474 203 495 217 Q477 238 451 229 Q435 222 428 208Z" fill="#ee775e" class="ink"/>
    <circle cx="444" cy="179" r="5.5" fill="#18313b"/>
    <circle cx="446" cy="177" r="1.7" fill="#fff"/>
    <path d="M455 164q16-10 30 0" fill="none" stroke="#18313b" stroke-width="3"/>

    <!-- Tiny helmet -->
    <path d="M406 158q9-25 32-22q22 3 25 27z" fill="#ef5d5d" class="ink"/>
    <path d="M405 161h62" class="ink" stroke-width="4"/>
    <path d="M430 139l7 20M447 141l5 18" stroke="#ffb5a8" stroke-width="3"/>

    <!-- Wings -->
    <path d="M350 253q-31-4-42 17q17 22 52 18" fill="#f7f1df" class="ink"/>
    <path d="M335 266l18 10M340 260l18 10" fill="none" stroke="#c3c0b3" stroke-width="3"/>

    <!-- Legs pedaling -->
    <path d="M381 319L353 357L300 414" fill="none" class="ink"/>
    <path d="M416 320L395 362L324 414" fill="none" class="ink"/>
    <path d="M292 414h21M316 414h20" class="ink" stroke-width="7"/>
    <path d="M353 357l-14-8M395 362l11-8" class="ink" stroke-width="6"/>

    <!-- Satchel with fish -->
    <path d="M463 250q22-9 42 5l9 47q-24 11-46-1z" fill="#bd7c4b" class="ink"/>
    <path d="M468 259q19-11 39-2" fill="none" stroke="#f4c28a" stroke-width="4"/>
    <path d="M486 272q12-11 23 0q-11 10-23 0l-8 7v-14z" fill="#79c6d0" class="ink" stroke-width="3"/>
    <circle cx="501" cy="270" r="1.8" fill="#18313b"/>
  </g>

  <!-- Motion marks and speech -->
  <path d="M150 306h47M138 323h34M602 302h34" stroke="#fffdf4" stroke-width="5" stroke-linecap="round"/>
  <path d="M526 119q0-27 33-27h118q31 0 31 27v34q0 27-31 27h-47l-24 19 5-19h-52q-33 0-33-27z" fill="#fffdf4" class="ink" stroke-width="3"/>
  <text class="type" x="614" y="126" text-anchor="middle" font-size="15" font-weight="800" fill="#18313b">“I’M ON A</text>
  <text class="type" x="614" y="147" text-anchor="middle" font-size="15" font-weight="800" fill="#18313b">FISHING LEASE.”</text>

  <!-- Footer band with exact visible timestamp -->
  <rect x="0" y="526" width="800" height="74" fill="#18313b"/>
  <text class="type" x="400" y="557" text-anchor="middle" font-size="16" font-weight="700" fill="#fffdf4">“Pedal faster. The lake is only three blocks away.”</text>
  <text class="type" x="400" y="585" text-anchor="middle" font-size="14" font-weight="600" fill="#bcecff">2026-10-31 03:32:16 SGT (UTC+08:00)</text>
</svg>