<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN POWER</title>
  <desc id="desc">A determined pelican rides a bicycle while its wheels spin and its body bobs. Its enormous beak carries a fish.</desc>
  <defs>
    <pattern id="spokes" width="110" height="110" patternUnits="userSpaceOnUse">
      <circle cx="55" cy="55" r="49" fill="none" stroke="#29343b" stroke-width="7"/>
      <circle cx="55" cy="55" r="42" fill="none" stroke="#f8f4e8" stroke-width="2"/>
      <g stroke="#68767b" stroke-width="2">
        <path d="M55 8v94M8 55h94M22 22l66 66M88 22L22 88"/>
      </g>
      <circle cx="55" cy="55" r="6" fill="#f7bd43" stroke="#29343b" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f5ead2"/>
  <rect x="20" y="18" width="760" height="564" rx="25" fill="#fff8e8" stroke="#29343b" stroke-width="4"/>
  <path d="M22 100H778" stroke="#29343b" stroke-width="3"/>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="900" letter-spacing="3" fill="#253d47">PELICAN POWER</text>

  <path d="M23 371 Q130 330 230 354 T430 350 T630 344 T777 356 V478 H23Z" fill="#b9dfd7"/>
  <path d="M23 412 Q125 394 220 410 T420 407 T620 402 T777 410 V478 H23Z" fill="#90cbbf"/>
  <path d="M95 225q17-14 34 0M129 225q17-14 34 0M610 203q13-11 26 0M636 203q13-11 26 0" fill="none" stroke="#7eaaa5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="665" cy="163" r="32" fill="#f4c867"/>
  <path d="M24 476H776" stroke="#29343b" stroke-width="5" stroke-linecap="round"/>
  <path d="M45 491h710" stroke="#c7b699" stroke-width="3" stroke-dasharray="18 13"/>

  <!-- Wheels rotate around their hubs. -->
  <g transform="translate(235 418)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.1s" repeatCount="indefinite"/>
      <circle r="55" fill="url(#spokes)" transform="translate(-55 -55)"/>
      <circle cx="0" cy="-48" r="4" fill="#e75c47"/>
    </g>
  </g>
  <g transform="translate(565 418)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.1s" repeatCount="indefinite"/>
      <circle r="55" fill="url(#spokes)" transform="translate(-55 -55)"/>
      <circle cx="0" cy="-48" r="4" fill="#e75c47"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke="#d94f3f" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M235 418L325 319 389 418 235 418 347 347 500 347 389 418"/>
    <path d="M500 347l65 71M490 320l10 27"/>
  </g>
  <path d="M325 319l-12-19M293 298h44" fill="none" stroke="#29343b" stroke-width="8" stroke-linecap="round"/>
  <path d="M490 320l-10-20h32q14 0 14-12" fill="none" stroke="#29343b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="389" cy="418" r="14" fill="#f8d370" stroke="#29343b" stroke-width="4"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 389 418" to="360 389 418" dur="2.1s" repeatCount="indefinite"/>
    <path d="M389 418l24 18" stroke="#29343b" stroke-width="5" stroke-linecap="round"/>
    <path d="M405 437h20" stroke="#29343b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Rider bobs gently above the saddle. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.05s" repeatCount="indefinite"/>
    <path d="M352 315q13 30 28 61l18 33" fill="none" stroke="#d89a4a" stroke-width="10" stroke-linecap="round"/>
    <path d="M398 409l20 6" fill="none" stroke="#d89a4a" stroke-width="9" stroke-linecap="round"/>
    <path d="M325 309q-29-15-32-52-4-42 28-60 25-14 57 1 28 13 34 46 5 31-18 54-28 27-69 11Z" fill="#f5f0df" stroke="#29343b" stroke-width="4"/>
