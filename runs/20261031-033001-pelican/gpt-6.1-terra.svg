    <path d="M305 273q-20 8-30-3 4 20 25 22" fill="#f5f0df" stroke="#29343b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M380 218q20-29 21-59 0-28 25-37 23-8 39 10 12 14 8 35l-10 38q-7 31-26 54" fill="#f5f0df" stroke="#29343b" stroke-width="4"/>
    <path d="M455 164q68-8 131 17-41 17-111 13l-23-6Z" fill="#f4b54a" stroke="#29343b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M456 188q31 43 76 20 23-11 54-27-62 10-130 7Z" fill="#ed9950" stroke="#29343b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M493 190q15-12 30 0-15 12-30 0Z" fill="#6c9ca5" stroke="#29343b" stroke-width="2"/>
    <path d="M523 190l9-7v14Z" fill="#6c9ca5" stroke="#29343b" stroke-width="2"/>
    <circle cx="501" cy="189" r="1.8" fill="#29343b"/>
    <ellipse cx="448" cy="149" rx="12" ry="14" fill="#fff" stroke="#29343b" stroke-width="3"/>
    <circle cx="452" cy="151" r="4" fill="#29343b"/>
    <path d="M436 130q10-8 22-3" fill="none" stroke="#29343b" stroke-width="4" stroke-linecap="round"/>
    <path d="M415 130q10-19 36-17l-4 10-32 7Z" fill="#e65b47" stroke="#29343b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M419 248q20 25 51 42l15 5" fill="none" stroke="#e7ad65" stroke-width="8" stroke-linecap="round"/>
    <path d="M480 294l13-1" stroke="#29343b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <path d="M598 287q27-22 60-3" fill="none" stroke="#29343b" stroke-width="3" stroke-linecap="round"/>
  <text x="631" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#29343b">HONK!</text>

  <path d="M22 513H778" stroke="#29343b" stroke-width="3"/>
  <text x="400" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#29343b">Two wheels, one fish, zero traffic violations.</text>
  <text x="400" y="569" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#53666b">2026-10-31 03:32:32 SGT (UTC+08:00)</text>
