    <text x="300" y="190">13</text>
    <text x="350" y="190">14</text>
    <text x="400" y="190">15</text>
    <text x="400" y="240">16</text>
    <text x="350" y="240">17</text>
    <text x="300" y="240">18</text>
    <text x="250" y="240">19</text>
