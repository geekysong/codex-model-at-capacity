<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">5×5 grid puzzle: 24 moves</title>
  <desc id="desc">A continuous snake path visits all 25 cells exactly once, from the green start in the top-left cell to the red end in the bottom-right cell. Cells are numbered in visit order above the path.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#172033">Visit every cell — 24 moves</text>
  <text x="300" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">25 cells · orthogonal steps · each cell visited once</text>

  <rect x="175" y="75" width="250" height="250" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <path d="M225 75V325 M275 75V325 M325 75V325 M375 75V325 M175 125H425 M175 175H425 M175 225H425 M175 275H425" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <polyline points="200,100 250,100 300,100 350,100 400,100 400,150 350,150 300,150 250,150 200,150 200,200 250,200 300,200 350,200 400,200 400,250 350,250 300,250 250,250 200,250 200,300 250,300 300,300 350,300 400,300" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#172033">
    <text x="200" y="90">1</text>
    <text x="250" y="90">2</text>
    <text x="300" y="90">3</text>
    <text x="350" y="90">4</text>
