<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid route from A1 to E5</title>
  <desc id="desc">A top-down five-by-five intersection grid. The blue shortest route avoids blocked intersections B2, C3, and D4, and contains eight street segments.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#182433">City Grid Route</text>

  <!-- Streets -->
  <g stroke="#a9b5c2" stroke-width="4" stroke-linecap="round">
    <path d="M100 70H500 M100 130H500 M100 190H500 M100 250H500 M100 310H500"/>
    <path d="M100 70V310 M200 70V310 M300 70V310 M400 70V310 M500 70V310"/>
  </g>

  <!-- Shortest route: A1-A2-A3-A4-A5-B5-C5-D5-E5 (8 segments) -->
  <path d="M100 70V310H500" fill="none" stroke="#1677e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections and labels -->
  <g font-family="Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="middle">
    <g fill="#fff" stroke="#526273" stroke-width="2">
      <circle cx="100" cy="70" r="6"/><circle cx="200" cy="70" r="6"/><circle cx="300" cy="70" r="6"/><circle cx="400" cy="70" r="6"/><circle cx="500" cy="70" r="6"/>
      <circle cx="100" cy="130" r="6"/><circle cx="200" cy="130" r="6"/><circle cx="300" cy="130" r="6"/><circle cx="400" cy="130" r="6"/><circle cx="500" cy="130" r="6"/>
      <circle cx="100" cy="190" r="6"/><circle cx="200" cy="190" r="6"/><circle cx="300" cy="190" r="6"/><circle cx="400" cy="190" r="6"/><circle cx="500" cy="190" r="6"/>
      <circle cx="100" cy="250" r="6"/><circle cx="200" cy="250" r="6"/><circle cx="300" cy="250" r="6"/><circle cx="400" cy="250" r="6"/><circle cx="500" cy="250" r="6"/>
      <circle cx="100" cy="310" r="6"/><circle cx="200" cy="310" r="6"/><circle cx="300" cy="310" r="6"/><circle cx="400" cy="310" r="6"/><circle cx="500" cy="310" r="6"/>
    </g>
    <g fill="#273646" stroke="#fff" stroke-width="3" paint-order="stroke">
      <text x="100" y="51">A1</text><text x="200" y="51">B1</text><text x="300" y="51">C1</text><text x="400" y="51">D1</text><text x="500" y="51">E1</text>
      <text x="100" y="111">A2</text><text x="200" y="111">B2</text><text x="300" y="111">C2</text><text x="400" y="111">D2</text><text x="500" y="111">E2</text>
      <text x="100" y="171">A3</text><text x="200" y="171">B3</text><text x="300" y="171">C3</text><text x="400" y="171">D3</text><text x="500" y="171">E3</text>
      <text x="100" y="231">A4</text><text x="200" y="231">B4</text><text x="300" y="231">C4</text><text x="400" y="231">D4</text><text x="500" y="231">E4</text>
      <text x="100" y="291">A5</text><text x="200" y="291">B5</text><text x="300" y="291">C5</text><text x="400" y="291">D5</text><text x="500" y="291">E5</text>
    </g>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="70" r="11" fill="#18a058" stroke="#fff" stroke-width="3"/>
  <text x="100" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#137a43">START</text>
  <circle cx="500" cy="310" r="11" fill="#f08c00" stroke="#fff" stroke-width="3"/>
  <text x="500" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#a85f00">END</text>

  <!-- Blocked intersections -->
  <g stroke="#d92d20" stroke-width="5" stroke-linecap="round">
    <path d="M192 122L208 138 M208 122L192 138"/>
    <path d="M292 182L308 198 M308 182L292 198"/>
    <path d="M392 242L408 258 M408 242L392 258"/>
  </g>

  <text x="300" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1677e8">Route length: 8 street segments</text>
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#273646">2026-10-30 07:04:03 SGT (UTC+08:00)</text>
</svg>