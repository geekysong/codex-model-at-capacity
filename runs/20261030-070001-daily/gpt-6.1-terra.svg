<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid route from A1 to E5</title>
  <desc id="desc">A five by five grid of intersections. The blue route travels from A1 across the top row to E1, then down to E5, avoiding blocked intersections B2, C3, and D4. The route has eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">City grid route</text>

  <g stroke="#aeb8c5" stroke-width="3" fill="none">
    <path d="M110 65H430 M110 125H430 M110 185H430 M110 245H430 M110 305H430"/>
    <path d="M110 65V305 M190 65V305 M270 65V305 M350 65V305 M430 65V305"/>
  </g>

  <path d="M110 65H430V305" fill="none" stroke="#1769d2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#fff" stroke="#64748b" stroke-width="2">
    <circle cx="110" cy="65" r="5"/><circle cx="190" cy="65" r="5"/><circle cx="270" cy="65" r="5"/><circle cx="350" cy="65" r="5"/><circle cx="430" cy="65" r="5"/>
    <circle cx="110" cy="125" r="5"/><circle cx="190" cy="125" r="5"/><circle cx="270" cy="125" r="5"/><circle cx="350" cy="125" r="5"/><circle cx="430" cy="125" r="5"/>
    <circle cx="110" cy="185" r="5"/><circle cx="190" cy="185" r="5"/><circle cx="270" cy="185" r="5"/><circle cx="350" cy="185" r="5"/><circle cx="430" cy="185" r="5"/>
    <circle cx="110" cy="245" r="5"/><circle cx="190" cy="245" r="5"/><circle cx="270" cy="245" r="5"/><circle cx="350" cy="245" r="5"/><circle cx="430" cy="245" r="5"/>
    <circle cx="110" cy="305" r="5"/><circle cx="190" cy="305" r="5"/><circle cx="270" cy="305" r="5"/><circle cx="350" cy="305" r="5"/><circle cx="430" cy="305" r="5"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" fill="#263445">
    <text x="119" y="57">A1</text><text x="199" y="57">B1</text><text x="279" y="57">C1</text><text x="359" y="57">D1</text><text x="439" y="57">E1</text>
    <text x="119" y="117">A2</text><text x="199" y="117">B2</text><text x="279" y="117">C2</text><text x="359" y="117">D2</text><text x="439" y="117">E2</text>
    <text x="119" y="177">A3</text><text x="199" y="177">B3</text><text x="279" y="177">C3</text><text x="359" y="177">D3</text><text x="439" y="177">E3</text>
    <text x="119" y="237">A4</text><text x="199" y="237">B4</text><text x="279" y="237">C4</text><text x="359" y="237">D4</text><text x="439" y="237">E4</text>
    <text x="119" y="297">A5</text><text x="199" y="297">B5</text><text x="279" y="297">C5</text><text x="359" y="297">D5</text><text x="439" y="297">E5</text>
  </g>

  <g stroke="#d52b35" stroke-width="4" stroke-linecap="round">
    <path d="M182 117L198 133 M198 117L182 133"/>
    <path d="M262 177L278 193 M278 177L262 193"/>
    <path d="M342 237L358 253 M358 237L342 253"/>
