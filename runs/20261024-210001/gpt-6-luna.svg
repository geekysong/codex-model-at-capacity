<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A level seesaw with a 6 kilogram mass 2 meters left of the pivot and a 4 kilogram mass 3 meters right of the pivot. The torque equation is 6 times 2 equals 4 times 3.</desc>

  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#243247">Balanced seesaw</text>

  <!-- Level beam -->
  <rect x="92" y="185" width="416" height="14" rx="7" fill="#8b5e3c"/>
  <line x1="100" y1="192" x2="500" y2="192" stroke="#5d3d28" stroke-width="2"/>

  <!-- Pivot -->
  <path d="M276 292 L300 199 L324 292 Z" fill="#52677d" stroke="#34495e" stroke-width="2"/>
  <rect x="262" y="292" width="76" height="10" rx="4" fill="#34495e"/>
  <circle cx="300" cy="192" r="7" fill="#f2c14e" stroke="#34495e" stroke-width="2"/>
  <text x="300" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#34495e">pivot</text>

  <!-- Hanging supports -->
  <line x1="180" y1="199" x2="180" y2="238" stroke="#34495e" stroke-width="3"/>
  <line x1="420" y1="199" x2="420" y2="238" stroke="#34495e" stroke-width="3"/>

  <!-- Masses -->
  <rect x="143" y="238" width="74" height="48" rx="8" fill="#dceeff" stroke="#3973a5" stroke-width="2"/>
  <text x="180" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#244b6b">6 kg</text>
  <rect x="383" y="238" width="74" height="48" rx="8" fill="#ffe8d6" stroke="#c66a32" stroke-width="2"/>
  <text x="420" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#85421f">4 kg</text>

  <!-- Downward force arrows -->
  <line x1="180" y1="218" x2="180" y2="232" stroke="#3973a5" stroke-width="3"/>
  <path d="M174 227 L180 237 L186 227" fill="none" stroke="#3973a5" stroke-width="3" stroke-linejoin="round"/>
  <line x1="420" y1="218" x2="420" y2="232" stroke="#c66a32" stroke-width="3"/>
  <path d="M414 227 L420 237 L426 227" fill="none" stroke="#c66a32" stroke-width="3" stroke-linejoin="round"/>

  <!-- Distance markers -->
  <line x1="180" y1="158" x2="300" y2="158" stroke="#596b7c" stroke-width="2"/>
  <line x1="180" y1="151" x2="180" y2="165" stroke="#596b7c" stroke-width="2"/>
  <line x1="300" y1="151" x2="300" y2="165" stroke="#596b7c" stroke-width="2"/>
  <text x="240" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#243247">2 m</text>

  <line x1="300" y1="158" x2="420" y2="158" stroke="#596b7c" stroke-width="2"/>
  <line x1="420" y1="151" x2="420" y2="165" stroke="#596b7c" stroke-width="2"/>
  <text x="360" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#243247">x = 3 m</text>

  <!-- Equilibrium solution -->
  <text x="300" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#243247">6 × 2 = 4 × 3</text>
  <text x="300" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#31805b">BALANCED</text>
</svg>