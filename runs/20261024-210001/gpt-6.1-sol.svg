<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A 6 kilogram mass hangs 2 meters left of the pivot, and a 4 kilogram mass hangs 3 meters right. Equal torques keep the seesaw level.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d14836"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="38" font-size="25" font-weight="bold" fill="#23805b">balanced</text>

    <g stroke="#586575" stroke-width="1.5" fill="none">
      <path d="M100 93V125 M260 93V125 M500 93V125"/>
      <path d="M100 104H260 M260 104H500"/>
      <path d="m105 99-5 5 5 5 M255 99l5 5-5 5 M265 99l-5 5 5 5 M495 99l5 5-5 5"/>
    </g>
    <text x="180" y="87" font-size="19" fill="#25364a">2 m</text>
    <text x="380" y="87" font-size="19" font-weight="bold" fill="#25364a">x = 3 m</text>

    <rect x="65" y="135" width="470" height="12" rx="4" fill="#385b7a"/>
    <path d="M260 147 229 207H291Z" fill="#aebbc7" stroke="#385b7a" stroke-width="2"/>
    <circle cx="260" cy="146" r="5" fill="#25364a"/>
    <path d="M215 209H305" stroke="#586575" stroke-width="3"/>
    <text x="260" y="234" font-size="16" fill="#586575">pivot</text>

    <g stroke="#586575" stroke-width="2">
      <path d="M100 147V180 M500 147V180"/>
    </g>
    <rect x="62" y="180" width="76" height="56" rx="6" fill="#e7eef7" stroke="#385b7a" stroke-width="2"/>
    <rect x="462" y="180" width="76" height="56" rx="6" fill="#e7eef7" stroke="#385b7a" stroke-width="2"/>
    <g font-size="21" font-weight="bold" fill="#25364a">
      <text x="100" y="215">6 kg</text>
      <text x="500" y="215">4 kg</text>
    </g>

    <g stroke="#d14836" stroke-width="3" marker-end="url(#arrow)">
      <path d="M100 242V290"/>
      <path d="M500 242V278"/>
    </g>
    <g font-size="17" fill="#b63829">
      <text x="146" y="271">6g ↓</text>
      <text x="546" y="268">4g ↓</text>
    </g>

    <text x="300" y="330" font-size="24" font-weight="bold" fill="#25364a">6×2 = 4×3</text>
    <text x="300" y="366" font-size="19" fill="#25364a">x = (6×2)/4 = 3 m</text>
  </g>
</svg>