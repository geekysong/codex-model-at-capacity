<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedals Into Trouble</title>
  <desc>A satirical cartoon of a pelican riding a bicycle.</desc>
  <style>
    .ink{stroke:#263238;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .text{font-family:Arial,sans-serif;fill:#263238}
    .small{font-size:16px}
  </style>

  <rect width="800" height="600" fill="#bfe9ff"/>
  <circle cx="680" cy="110" r="58" fill="#ffe27a" opacity=".9"/>
  <path d="M0 440 Q120 395 240 440 T480 440 T800 430 V600 H0Z" fill="#8bd17c"/>
  <path d="M0 470 Q160 430 320 470 T640 465 T800 455" fill="none" stroke="#4a9b59" stroke-width="8"/>
  <path d="M90 435 q20-35 40 0 M115 435 q20-42 40 0 M700 430 q18-35 36 0" fill="none" stroke="#4a9b59" stroke-width="7"/>

  <text x="400" y="62" text-anchor="middle" class="text" font-size="38" font-weight="800">PELICAN PEDALS INTO TROUBLE</text>
  <text x="400" y="95" text-anchor="middle" class="text" font-size="21" font-style="italic">“Why fly when you can wobble with confidence?”</text>

  <g id="bike">
    <g class="wheel">
      <circle cx="250" cy="445" r="78" fill="#e9f7ff" class="ink"/>
      <circle cx="250" cy="445" r="10" fill="#263238"/>
      <path d="M250 367V523 M172 445H328 M195 390L305 500 M305 390L195 500" stroke="#607d8b" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 250 445" to="360 250 445" dur="2s" repeatCount="indefinite"/>
    </g>
    <g class="wheel">
      <circle cx="565" cy="445" r="78" fill="#e9f7ff" class="ink"/>
      <circle cx="565" cy="445" r="10" fill="#263238"/>
      <path d="M565 367V523 M487 445H643 M510 390L620 500 M620 390L510 500" stroke="#607d8b" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 565 445" to="360 565 445" dur="2s" repeatCount="indefinite"/>
    </g>
    <path d="M250 445 L350 330 L565 445 L430 445 L350 330 M430 445 L395 360 L350 330" fill="none" class="ink"/>
    <path d="M350 330 L330 288 M330 288 h58" fill="none" class="ink"/>
    <path d="M395 360 l42-25" fill="none" class="ink"/>
    <circle cx="430" cy="445" r="18" fill="#ffca28" class="ink"/>
    <path d="M430 445 l-30 35 M430 445 l35 30" fill="none" class="ink">
      <animateTransform attributeName="transform" type="rotate" values="0 430 445;360 430 445" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M330 288 q-18-18-3-32" fill="none" class="ink"/>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="390" cy="275" rx="92" ry="112" fill="#f5f7f8" class="ink"/>
    <path d="M335 300 Q390 355 448 302 Q438 370 375 364 Q340 350 335 300Z" fill="#ff9f43" class="ink"/>
    <path d="M346 244 Q292 274 310 330 Q356 307 382 260Z" fill="#d7e1e5" class="ink"/>
    <circle cx="382" cy="190" r="52" fill="#f5f7f8" class="ink"/>
    <path d="M417 205 Q500 206 548 235 Q500 267 415 240Z" fill="#ffb74d" class="ink"/>
    <path d="M538 235 q25 5 33 20 q-20 8-36-2" fill="#ff8f3d" class="ink"/>
    <circle cx="399" cy="188" r="9" fill="#263238"/>
    <path d="M366 163 q22-20 45-6" fill="none" class="ink"/>
    <path d="M382 365 L367 414 M422 365 L445 414" fill="none" class="ink"/>
    <path d="M367 414 l-26 12 M445 414 l28 12" fill="none" class="ink"/>
    <path d="M366 414 l34 22 M445 414 l-32 22" fill="none" class="ink">
      <animateTransform attributeName="transform" type="rotate" values="0 405 414;18 405 414;0 405 414;-18 405 414;0 405 414" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <text x="390" y="125" text-anchor="middle" class="text" font-size="20" font-weight="700">HONK!</text>
  </g>

  <g>
    <path d="M585 300 q35-30 70 0" fill="none" stroke="#263238" stroke-width="5"/>
    <text x="620" y="286" text-anchor="middle" class="text" font-size="18" font-weight="700">NO LICENSE?</text>
    <text x="620" y="309" text-anchor="middle" class="text small">JUST WING IT!</text>
  </g>

  <rect x="35" y="548" width="730" height="34" rx="10" fill="#ffffff" opacity=".88"/>
  <text x="400" y="571" text-anchor="middle" class="text small" font-weight="700">2026-10-29 14:00:07 SGT (UTC+08:00)</text>
</svg>