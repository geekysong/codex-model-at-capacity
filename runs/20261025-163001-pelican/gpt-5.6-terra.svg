<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Plan</title>
  <desc id="desc">A cheerful satirical cartoon of a pelican riding a bicycle while proclaiming it is an efficient transport solution.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: top center; animation: pedal .55s ease-in-out infinite alternate; }
    .leg2 { transform-box: fill-box; transform-origin: top center; animation: pedal2 .55s ease-in-out infinite alternate; }
    .dust { animation: puff 1.1s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(22deg); } }
    @keyframes pedal2 { to { transform: rotate(-22deg); } }
    @keyframes puff { 0% { opacity: .8; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-34px) translateY(-8px); } }
  </style>

  <rect width="800" height="600" fill="#d9f4ff"/>
  <path d="M0 333 Q95 285 183 326 T367 315 T550 326 T800 294 V500 H0Z" fill="#a8dc83"/>
  <path d="M0 386 Q140 355 280 383 T540 369 T800 385 V500 H0Z" fill="#78bb68"/>
  <path d="M0 460 H800" stroke="#5d9d5b" stroke-width="7" stroke-dasharray="18 16"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="400" y="61" text-anchor="middle" font-size="39" font-weight="900" fill="#17395d">THE PELICAN PEDAL PLAN</text>
    <text x="400" y="91" text-anchor="middle" font-size="18" font-weight="700" fill="#35617d">“Zero emissions, except the speeches.”</text>
  </g>

  <g class="dust" fill="#e8d499">
    <ellipse cx="114" cy="436" rx="21" ry="9"/>
    <ellipse cx="82" cy="446" rx="14" ry="6" opacity=".7"/>
  </g>

  <g stroke="#26384a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <g class="wheel">
      <circle cx="240" cy="422" r="72" fill="#f7fbfc"/>
      <circle cx="240" cy="422" r="11" fill="#f2c14e"/>
      <path d="M240 350V494M168 422H312M189 371L291 473M291 371L189 473" stroke="#9bb0bc" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="546" cy="422" r="72" fill="#f7fbfc"/>
      <circle cx="546" cy="422" r="11" fill="#f2c14e"/>
      <path d="M546 350V494M474 422H618M495 371L597 473M597 371L495 473" stroke="#9bb0bc" stroke-width="3"/>
    </g>

    <path d="M240 422 L331 303 L421 422 Z M331 303 L494 303 L546 422 M421 422 L494 303 M331 303 L299 282 M494 303 L529 270" fill="none" stroke="#d94746" stroke-width="10"/>
    <path d="M529 270 H588 L605 249" fill="none"/>
    <path d="M282 282 H321" stroke-width="11"/>
    <circle cx="421" cy="422" r="17" fill="#f2c14e"/>
    <path d="M421 422 L461 442 M421 422 L381 402" stroke-width="8"/>
  </g>

  <g class="rider" stroke="#26384a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M361 330 Q344 362 366 393 Q406 410 448 389 L451 328Z" fill="#7ba8ce" stroke-width="6"/>
    <path d="M379 387 L417 414 L457 442" class="leg" fill="none" stroke="#f6a55b" stroke-width="15"/>
    <path d="M427 387 L410 418 L381 402" class="leg2" fill="none" stroke="#f6a55b" stroke-width="15"/>
    <path d="M362 337 Q321 315 303 298" fill="none" stroke="#f6a55b" stroke-width="14"/>
    <path d="M303 298 L276 285" fill="none" stroke="#f6a55b" stroke-width="14"/>

    <path d="M369 329 Q324 292 337 210 Q349 144 407 159 Q458 172 449 238 Q445 296 409 329Z" fill="#eef3e9" stroke-width="6"/>
    <path d="M342 220 Q291 211 261 242 Q307 273 351 255 Q373 243 342 220Z" fill="#f7c557" stroke-width="6"/>
    <path d="M262 242 Q301 271 349 255 Q318 300 278 286 Q250 275 262 242Z" fill="#f19a4b" stroke-width="5"/>
    <circle cx="394" cy="205" r="12" fill="#fff"/>
    <circle cx="398" cy="207" r="5" fill="#26384a" stroke="none"/>
    <path d="M417 185 Q439 193 444 211" fill="none" stroke-width="6"/>
    <path d="M350 173 Q380 126 421 159" fill="#436f9b" stroke-width="6"/>
    <path d="M355 291 Q398 307 434 278" fill="none" stroke="#26384a" stroke-width="5"/>
    <path d="M432 222 Q462 236 454 271 Q479 251 470 219 Q459 198 432 200Z" fill="#eef3e9" stroke-width="5"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" stroke="#26384a" stroke-linejoin="round">
    <path d="M497 146 Q578 105 662 145 L651 224 Q570 243 495 205Z" fill="#fffdf2" stroke-width="5"/>
    <path d="M516 205 L494 232 L540 211" fill="#fffdf2" stroke-width="5"/>
    <text x="575" y="164" text-anchor="middle" font-size="17" font-weight="800" fill="#26384a" stroke="none">I HAVE A</text>
    <text x="575" y="187" text-anchor="middle" font-size="17" font-weight="800" fill="#26384a" stroke="none">TRANSPORT BILL!</text>
  </g>

  <g transform="translate(613 296)" font-family="Arial, Helvetica, sans-serif">
    <rect width="139" height="72" rx="8" fill="#fff8d2" stroke="#26384a" stroke-width="5"/>
    <text x="69" y="27" text-anchor="middle" font-size="15" font-weight="900" fill="#d94746">BIKE LANE</text>
    <text x="69" y="49" text-anchor="middle" font-size="13" font-weight="700" fill="#26384a">FOR BILLS &amp; BEAKS</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="43" y="510" width="714" height="48" rx="18" fill="#17395d"/>
    <text x="400" y="540" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">A pelican proves every commute needs more bill-able mileage.</text>
    <text x="400" y="586" text-anchor="middle" font-size="14" font-weight="700" fill="#28475e">2026-10-25 16:33:26 SGT (UTC+08:00)</text>
  </g>
</svg>