<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatchAB" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#b7c9ee"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#304c7a" stroke-width="2"/>
    </pattern>
    <pattern id="hatchBC" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#b9dfcf"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#27614a" stroke-width="2"/>
    </pattern>
    <pattern id="hatchAC" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f0c4b8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#844637" stroke-width="2"/>
    </pattern>
  </defs>

  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#17212b">Union area: 74,000 px²</text>

  <!-- Rectangle fills -->
  <rect x="50" y="50" width="200" height="150" fill="#e76f51" fill-opacity="0.45"/>
  <rect x="150" y="120" width="200" height="150" fill="#457b9d" fill-opacity="0.45"/>
  <rect x="320" y="200" width="200" height="150" fill="#2a9d8f" fill-opacity="0.45"/>

  <!-- Pairwise overlap hatching -->
  <rect x="150" y="120" width="100" height="80" fill="url(#hatchAB)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatchBC)"/>

  <!-- Rectangle borders -->
  <rect x="50" y="50" width="200" height="150" fill="none" stroke="#263238" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="none" stroke="#263238" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="none" stroke="#263238" stroke-width="2"/>

  <!-- Labels in non-overlapped regions -->
  <text x="85" y="95" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17212b">A</text>
  <text x="265" y="245" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17212b">B</text>
  <text x="460" y="325" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#17212b">C</text>

  <!-- Exact pairwise overlap areas -->
  <text x="173" y="163" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#17212b">A∩B: 8,000 px²</text>
  <text x="321" y="239" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#17212b">B∩C: 2,100 px²</text>
  <text x="300" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#17212b">A and C do not overlap</text>

  <text x="300" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#17212b">2026-11-03 16:04:17 SGT (UTC+08:00)</text>
</svg>