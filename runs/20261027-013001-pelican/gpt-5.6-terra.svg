    <path d="M8 16h139M8 41h139M46 0v78M104 0v78" stroke="#c99f24" stroke-width="3"/>
    <text x="77" y="31" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#263842">BIRD</text>
    <text x="77" y="52" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#263842">LANE</text>
    <path d="M76 78v52" stroke="#39494d" stroke-width="8"/>
  </g>

  <ellipse cx="414" cy="475" rx="205" ry="20" fill="#17242a" opacity=".28" filter="url(#shadow)"/>

  <g id="bike">
    <g fill="none" stroke="#202c35" stroke-width="10">
      <circle cx="292" cy="430" r="67"/>
      <circle cx="518" cy="430" r="67"/>
    </g>
    <g stroke="#9ee8f5" stroke-width="4" opacity=".85">
      <g transform="translate(292 430)">
        <path d="M0-62V62M-62 0H62M-44-44L44 44M44-44L-44 44"/>
        <animateTransform attributeName="transform" type="rotate" from="0 292 430" to="360 292 430" dur="1.1s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(518 430)">
        <path d="M0-62V62M-62 0H62M-44-44L44 44M44-44L-44 44"/>
        <animateTransform attributeName="transform" type="rotate" from="0 518 430" to="360 518 430" dur="1.1s" repeatCount="indefinite"/>
      </g>
    </g>
    <g fill="none" stroke="#f34c42" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
