<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of an overconfident pelican riding a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#83d9f5"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#59636c"/>
      <stop offset="1" stop-color="#30383e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="95" cy="96" r="42" fill="#ffe36d"/>
  <path d="M0 310 Q105 260 211 311 T420 294 T620 306 T800 275 V405 H0Z" fill="#8fcb7a"/>
  <path d="M0 344 Q160 305 316 348 T608 335 T800 350 V424 H0Z" fill="#62ad62"/>
  <rect y="390" width="800" height="120" fill="url(#road)"/>
  <path d="M0 450 H800" stroke="#f7dc51" stroke-width="9" stroke-dasharray="44 31"/>
  <path d="M0 510 H800" stroke="#d8edf0" stroke-width="5"/>

  <g fill="#fff" opacity=".9">
    <path d="M190 120 q20-25 41 0 q25-20 44 5 q-27 13-85 7Z"/>
    <path d="M600 122 q18-22 38 0 q27-19 43 6 q-34 11-81 5Z"/>
  </g>

  <g transform="translate(49 260)">
