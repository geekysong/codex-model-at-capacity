    <path d="M375 340 Q367 287 397 244 Q426 205 468 239 Q503 267 483 344Z" fill="#f6f5e9" stroke="#26343b" stroke-width="5"/>
    <path d="M400 288 Q407 224 458 233 Q490 240 484 288Z" fill="#f6f5e9" stroke="#26343b" stroke-width="5"/>
    <path d="M403 259 Q365 249 322 267 Q353 303 414 298 Q437 294 443 273 Q429 258 403 259Z" fill="#f6b64b" stroke="#26343b" stroke-width="5"/>
    <path d="M323 267 Q360 282 414 274 Q399 320 350 315 Q325 310 323 267Z" fill="#ffd35f" stroke="#26343b" stroke-width="4"/>
    <circle cx="439" cy="253" r="15" fill="white" stroke="#26343b" stroke-width="4"/>
    <circle cx="443" cy="256" r="6" fill="#26343b"/>
    <path d="M428 231q20-16 37 0" fill="none" stroke="#26343b" stroke-width="5"/>
    <path d="M393 310 Q336 324 357 368 Q374 397 424 368 L451 332Z" fill="#e9ece0" stroke="#26343b" stroke-width="5"/>
    <path d="M430 320 Q482 309 494 351 Q501 380 456 382 Q426 366 430 320Z" fill="#e9ece0" stroke="#26343b" stroke-width="5"/>
    <path d="M451 343 Q479 329 500 316" fill="none" stroke="#f6f5e9" stroke-width="18" stroke-linecap="round"/>
    <path d="M500 316l-13-8m13 8-3 14" fill="none" stroke="#26343b" stroke-width="5" stroke-linecap="round"/>
    <path d="M388 363 Q399 399 424 421 L457 431" fill="none" stroke="#f4a73f" stroke-width="15" stroke-linecap="round"/>
    <path d="M454 366 Q440 399 422 426 L405 437" fill="none" stroke="#f4a73f" stroke-width="15" stroke-linecap="round"/>
    <path d="M449 432h29m-75 5h-28" stroke="#f4a73f" stroke-width="10" stroke-linecap="round"/>
    <path d="M378 321 Q400 336 420 321" fill="none" stroke="#d7473e" stroke-width="6"/>
  </g>

  <g font-family="sans-serif" text-anchor="middle">
    <text x="400" y="61" font-size="39" font-weight="900" fill="#243942" stroke="#fff" stroke-width="5" paint-order="stroke">PELICAN PEDAL PANIC</text>
    <text x="400" y="92" font-size="18" font-weight="bold" fill="#304a54">“I was promised a bike lane, not a bird lane!”</text>
  </g>

  <g transform="translate(580 286) rotate(-8)">
    <path d="M0 0h152v58H0z" rx="6" fill="#fff8dd" stroke="#273942" stroke-width="4"/>
    <text x="76" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#273942">HONK IF YOU</text>
    <text x="76" y="45" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#273942">RESPECT WINGS</text>
  </g>

  <rect y="531" width="800" height="69" fill="#1f3038"/>
  <text x="400" y="559" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#dff8fb">A majestic coastal commuter, bravely outrunning common sense.</text>
  <text x="400" y="584" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffffff">2026-10-27 01:32:48 SGT (UTC+08:00)</text>
</svg>