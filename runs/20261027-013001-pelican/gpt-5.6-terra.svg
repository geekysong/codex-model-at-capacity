      <path d="M437 430 L518 430 L465 319"/>
      <path d="M363 327 L445 327"/>
      <path d="M445 327 L476 282"/>
      <path d="M465 319 L451 270"/>
    </g>
    <path d="M433 267h43" stroke="#29353c" stroke-width="11" stroke-linecap="round"/>
    <path d="M467 281l22-20m-10 10 18 5" stroke="#29353c" stroke-width="8" stroke-linecap="round"/>
    <circle cx="437" cy="430" r="17" fill="#f6d64b" stroke="#29353c" stroke-width="6"/>
    <g stroke="#29353c" stroke-width="7" stroke-linecap="round">
