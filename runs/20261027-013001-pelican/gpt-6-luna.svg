<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A determined pelican pedals a bicycle while a fish rides in its beak. The wheels turn and the rider bobs.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .6s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#c9eff0"/>
  <rect y="390" width="800" height="132" fill="#f6d28e"/>
  <path d="M0 390 Q110 360 220 390 T440 390 T660 390 T880 390" fill="none" stroke="#65b8a5" stroke-width="8"/>
  <circle cx="680" cy="105" r="43" fill="#ffd75e"/>
  <g fill="#fff" opacity=".85">
    <ellipse cx="128" cy="115" rx="42" ry="15"/><ellipse cx="155" cy="108" rx="27" ry="20"/>
    <ellipse cx="330" cy="80" rx="35" ry="12"/><ellipse cx="354" cy="74" rx="24" ry="17"/>
  </g>

  <text id="title" x="400" y="48" text-anchor="middle" font-size="29" font-weight="900" letter-spacing="1.5" fill="#173b52">THE PELICAN COMMUTE</text>
  <text x="400" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#31596b">Running late? Just wing it.</text>

  <!-- Bicycle frame -->
  <g stroke="#d94c40" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M240 380 L335 270 L425 380 L240 380 L305 380"/>
    <path d="M425 380 L505 275 L550 275"/>
    <path d="M335 270 L305 380"/>
    <path d="M315 257 L356 257"/>
    <path d="M515 267 L530 238"/>
  </g>
  <g fill="#173b52" stroke="#173b52" stroke-width="4">
    <circle cx="240" cy="380" r="12"/><circle cx="425" cy="380" r="12"/>
  </g>
  <g class="wheel" fill="none" stroke="#173b52" stroke-width="5">
    <circle cx="240" cy="380" r="72"/><path d="M240 308V452 M168 380H312 M189 329L291 431 M291 329L189 431"/>
  </g>
  <g class="wheel" fill="none" stroke="#173b52" stroke-width="5">
    <circle cx="425" cy="380" r="72"/><path d="M425 308V452 M353 380H497 M374 329L476 431 M476 329L374 431"/>
  </g>
  <path d="M295 245 Q331 233 362 245" fill="none" stroke="#173b52" stroke-width="8" stroke-linecap="round"/>
  <path d="M517 236 Q535 222 552 235" fill="none" stroke="#173b52" stroke-width="8" stroke-linecap="round"/>
  <circle cx="305" cy="380" r="19" fill="#f2b744" stroke="#173b52" stroke-width="5"/>
  <path d="M305 380L283 398 M305 380L328 361" stroke="#173b52" stroke-width="6" stroke-linecap="round"/>
  <path d="M274 401h22 M318 358h22" stroke="#173b52" stroke-width="6" stroke-linecap="round"/>

  <!-- Pelican and its animated ride -->
  <g class="rider">
    <!-- tail feathers -->
    <path d="M312 218 Q279 203 273 222 Q291 231 315 230" fill="#f5f0df" stroke="#173b52" stroke-width="4"/>
    <!-- body -->
    <ellipse cx="367" cy="206" rx="66" ry="48" fill="#fff8e8" stroke="#173b52" stroke-width="5"/>
    <path d="M330 202 Q353 162 395 178 Q416 186 424 207 Q390 224 354 226Z" fill="#d7e5e2" stroke="#173b52" stroke-width="4"/>
    <!-- wing -->
    <path d="M346 204 Q376 178 400 199 Q384 221 351 222Z" fill="#f1c96c" stroke="#173b52" stroke-width="4"/>
    <!-- neck and head -->
    <path d="M399 191 Q411 158 425 140" fill="none" stroke="#fff8e8" stroke-width="20" stroke-linecap="round"/>
    <path d="M399 191 Q411 158 425 140" fill="none" stroke="#173b52" stroke-width="5" stroke-linecap="round"/>
    <circle cx="430" cy="132" r="28" fill="#fff8e8" stroke="#173b52" stroke-width="5"/>
    <circle cx="440" cy="127" r="4.5" fill="#173b52"/>
    <path d="M451 139 Q504 133 530 150 Q514 170 467 164 Q452 158 451 139Z" fill="#f4a63d" stroke="#173b52" stroke-width="5"/>
    <path d="M466 160 Q496 177 528 151 Q517 184 484 180 Q470 176 466 160Z" fill="#e87355" stroke="#173b52" stroke-width="4"/>
    <!-- fish dangling from beak -->
    <path d="M497 153 Q508 141 520 151 Q508 164 497 153Z" fill="#64b6cf" stroke="#173b52" stroke-width="2"/>
    <path d="M519 151l8-6v12z" fill="#64b6cf" stroke="#173b52" stroke-width="2"/>
    <circle cx="505" cy="150" r="1.8" fill="#173b52"/>
    <!-- helmet -->
    <path d="M405 118 Q415 94 439 102 Q453 108 456 121 L407 123Z" fill="#ed6252" stroke="#173b52" stroke-width="4"/>
    <path d="M401 123h59" stroke="#173b52" stroke-width="5" stroke-linecap="round"/>
    <!-- legs, comically reaching pedals -->
    <path d="M354 238 Q340 272 320 291 M391 239 Q408 270 328 361" fill="none" stroke="#f0a13b" stroke-width="11" stroke-linecap="round"/>
    <path d="M314 291l-18 4 M327 361l-14 5" stroke="#173b52" stroke-width="5" stroke-linecap="round"/>
    <!-- handlebar grip -->
    <path d="M412 242 Q455 257 507 264" fill="none" stroke="#f0a13b" stroke-width="8" stroke-linecap="round"/>
    <path d="M501 264l20-26" fill="none" stroke="#f0a13b" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- speed marks -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".9">
    <path d="M99 274h69"/><path d="M121 298h48"/><path d="M89 322h71"/>
  </g>
  <path d="M577 319 Q600 292 623 319 Q600 344 577 319Z" fill="#fff4d5" stroke="#173b52" stroke-width="3"/>
  <text x="600" y="325" text-anchor="middle" font-size="13" font-weight="900" fill="#173b52">HONK!</text>

  <rect x="0" y="522" width="800" height="78" fill="#173b52"/>
  <text x="400" y="550" text-anchor="middle" font-size="17" font-weight="700" fill="#fff8e8">“I’m not late. I’m making excellent time for a bird.”</text>
  <text x="400" y="582" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd75e">2026-10-27 01:32:28 SGT (UTC+08:00)</text>
</svg>