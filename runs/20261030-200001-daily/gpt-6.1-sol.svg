<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest city route from A1 to E5</title>
  <desc id="desc">A five by five intersection grid with blocked intersections B2, C3, and D4. The blue shortest route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, totaling eight street segments.</desc>

  <rect width="600" height="400" fill="#f8fafc"/>
  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
    <path d="M110 55H490V295H110Z"/>
  </g>

  <!-- Streets -->
  <g stroke="#ffffff" stroke-width="12" fill="none">
    <path d="M110 55H490 M110 115H490 M110 175H490 M110 235H490 M110 295H490"/>
    <path d="M110 55V295 M205 55V295 M300 55V295 M395 55V295 M490 55V295"/>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M110 55H490 M110 115H490 M110 175H490 M110 235H490 M110 295H490"/>
    <path d="M110 55V295 M205 55V295 M300 55V295 M395 55V295 M490 55V295"/>
  </g>

  <!-- Shortest route: four segments east and four south -->
  <path d="M110 55H490V295" fill="none" stroke="#2563eb" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#2563eb">
    <path d="M342 49L354 55L342 61Z"/>
    <path d="M484 202L490 214L496 202Z"/>
  </g>

  <!-- Intersections -->
  <g fill="#475569">
    <circle cx="205" cy="55" r="4"/>
    <circle cx="300" cy="55" r="4"/>
    <circle cx="395" cy="55" r="4"/>
    <circle cx="490" cy="55" r="4"/>
    <circle cx="110" cy="115" r="4"/>
    <circle cx="300" cy="115" r="4"/>
    <circle cx="395" cy="115" r="4"/>
    <circle cx="490" cy="115" r="4"/>
    <circle cx="110" cy="175" r="4"/>
    <circle cx="205" cy="175" r="4"/>
    <circle cx="395" cy="175" r="4"/>
    <circle cx="490" cy="175" r="4"/>
    <circle cx="110" cy="235" r="4"/>
    <circle cx="205" cy="235" r="4"/>
    <circle cx="300" cy="235" r="4"/>
    <circle cx="490" cy="235" r="4"/>
    <circle cx="110" cy="295" r="4"/>
    <circle cx="205" cy="295" r="4"/>
    <circle cx="300" cy="295" r="4"/>
    <circle cx="395" cy="295" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M198 108L212 122 M212 108L198 122"/>
    <path d="M293 168L307 182 M307 168L293 182"/>
    <path d="M388 228L402 242 M402 228L388 242"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="110" y="38">A1</text>
    <text x="205" y="38">B1</text>
    <text x="300" y="38">C1</text>
    <text x="395" y="38">D1</text>
    <text x="490" y="38">E1</text>

    <text x="110" y="98">A2</text>
    <text x="205" y="98">B2</text>
    <text x="300" y="98">C2</text>
    <text x="395" y="98">D2</text>
    <text x="490" y="98">E2</text>

    <text x="110" y="158">A3</text>
    <text x="205" y="158">B3</text>
    <text x="300" y="158">C3</text>
    <text x="395" y="158">D3</text>
    <text x="490" y="158">E3</text>

    <text x="110" y="218">A4</text>
    <text x="205" y="218">B4</text>
    <text x="300" y="218">C4</text>
    <text x="395" y="218">D4</text>
    <text x="490" y="218">E4</text>

    <text x="110" y="278">A5</text>
    <text x="205" y="278">B5</text>
    <text x="300" y="278">C5</text>
    <text x="395" y="278">D5</text>
    <text x="490" y="278">E5</text>
  </g>

  <circle cx="110" cy="55" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="490" cy="295" r="8" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="90" y="60" text-anchor="end" fill="#15803d">START</text>
    <text x="510" y="300" fill="#6d28d9">END</text>
  </g>

  <!-- Dedicated footer -->
  <rect x="0" y="325" width="600" height="75" fill="#fff"/>
  <path d="M20 325H580" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="351" font-size="17" font-weight="700" fill="#1d4ed8">Shortest route: 8 street segments</text>
    <text x="300" y="381" font-size="15" fill="#334155">2026-10-30 20:03:20 SGT (UTC+08:00)</text>
  </g>
</svg>