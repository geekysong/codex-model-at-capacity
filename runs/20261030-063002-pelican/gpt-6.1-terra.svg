<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A pelican rides a bicycle with fish in its enormous bill while the wheels turn and its legs pedal.</desc>
  <defs>
    <style>
      .ink { stroke: #25304a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { animation: bob 1s ease-in-out infinite; }
      .leg { transform-box: fill-box; transform-origin: 15% 12%; animation: pedal 1s ease-in-out infinite alternate; }
      .leg.back { animation-direction: alternate-reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes pedal { from { transform: rotate(-13deg); } to { transform: rotate(15deg); } }
      @media (prefers-reduced-motion: reduce) { .wheel, .rider, .leg { animation: none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8efd9"/>
  <rect x="0" y="0" width="800" height="525" fill="#c7edf0"/>
  <circle cx="674" cy="131" r="42" fill="#ffd36b"/>
  <path d="M0 340 Q100 320 200 341 T400 341 T600 341 T800 341 V525 H0Z" fill="#a5d8cd"/>
  <path d="M0 385 Q110 375 220 387 T440 387 T660 387 T800 387 V525 H0Z" fill="#e7d2a9"/>
  <path d="M0 484 H800" stroke="#c6ab80" stroke-width="5"/>
  <path d="M20 501 H160 M220 501 H360 M420 501 H560 M620 501 H760" stroke="#fff7e6" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="57" text-anchor="middle" fill="#25304a" font-family="Arial, sans-serif" font-size="37" font-weight="900" letter-spacing="2">THE PELICAN EXPRESS</text>
  <text x="400" y="83" text-anchor="middle" fill="#42566a" font-family="Arial, sans-serif" font-size="16" font-weight="bold">FRESH FISH. QUESTIONABLE TRANSPORT.</text>

  <g class="wheel">
    <circle cx="215" cy="406" r="77" fill="#fff9e9" stroke="#25304a" stroke-width="10"/>
