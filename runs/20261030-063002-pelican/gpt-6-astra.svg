<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A smug pelican rides a tiny bicycle, carrying fish in its enormous bill beneath a sign declaring a no-fly zone. Wheels spin and the pelican bobs as it pedals.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bcebee"/>
      <stop offset="1" stop-color="#fff5d9"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd575"/>
      <stop offset="1" stop-color="#ee9851"/>
    </linearGradient>
    <pattern id="road" width="150" height="12" patternUnits="userSpaceOnUse">
      <path d="M15 6h65" stroke="#fff3ce" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #183b42; }
      .ink { stroke: #183b42; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .fine { stroke: #183b42; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <path fill="#fff7e7" d="M0 0h800v600H0z"/>
  <path fill="url(#sky)" d="M20 105h760v381H20z"/>
  <text x="400" y="61" text-anchor="middle" font-size="48" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="bold" letter-spacing="2">THE COMMUTE HAS GONE COMPLETELY FOWL.</text>

  <circle cx="685" cy="168" r="37" fill="#ffda73"/>
  <g fill="#fffdf3" opacity=".85">
    <path d="M61 182c-16-25 14-47 34-33 11-32 58-24 59 4 27-6 43 13 35 29z"/>
    <path d="M477 155c-11-18 9-33 24-25 11-24 42-18 45 4 20-6 33 7 27 21z"/>
  </g>
  <path d="M20 375q120-57 240-3t245-10 275 5v72H20z" fill="#8dc6aa"/>
  <path d="M20 409q150-40 306 1t454-14v48H20z" fill="#6faa93"/>
  <path d="M20 432h760v54H20z" fill="#637b7b"/>
  <path fill="url(#road)" d="M20 463h760v12H20z"/>

  <g class="ink">
    <path d="M680 294v138" fill="none" stroke="#657d76"/>
    <rect x="605" y="231" width="150" height="67" rx="9" fill="#fff8e4"/>
  </g>
  <text x="680" y="259" text-anchor="middle" font-size="20" font-weight="900">NO FLYING</text>
  <text x="680" y="282" text-anchor="middle" font-size="14">Budget cuts.</text>

  <ellipse cx="365" cy="446" rx="204" ry="12" fill="#254c4b" opacity=".18"/>

  <!-- Each spoke assembly rotates around its own axle. -->
  <g class="ink">
    <g fill="#e6f6ee">
      <circle cx="245" cy="393" r="63"/>
      <circle cx="498" cy="393" r="63"/>
    </g>
    <g fill="none" stroke="#71958d" stroke-width="3">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 245 393" to="360 245 393" dur="1.8s" repeatCount="indefinite"/>
        <path d="M245 334v118m-59-59h118m-101-42 84 84m-84 0 84-84"/>
        <path d="M245 337a56 56 0 0 1 39 16" stroke="#f7bc43" stroke-width="7"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 498 393" to="360 498 393" dur="1.8s" repeatCount="indefinite"/>
        <path d="M498 334v118m-59-59h118m-101-42 84 84m-84 0 84-84"/>
        <path d="M498 337a56 56 0 0 1 39 16" stroke="#f7bc43" stroke-width="7"/>
      </g>
    </g>
    <g fill="none" stroke="#e36e56" stroke-width="9">
      <path d="m245 393 66-104 57 104H245l112-89h109l-98 89"/>
      <path d="m498 393-39-128"/>
    </g>
    <path d="m459 265-7-19 30-8" fill="none"/>
    <path d="M477 238h22" stroke-width="9"/>
    <path d="m311 289-6-22" fill="none"/>
    <path d="M281 267h52" stroke-width="12"/>
    <circle cx="368" cy="393" r="17" fill="#fff2cf"/>
    <circle cx="245" cy="393" r="6" fill="#183b42" stroke="none"/>
    <circle cx="498" cy="393" r="6" fill="#183b42" stroke="none"/>
  </g>

  <!-- The rider's tiny bounce and flexing legs keep the lettering still. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0;0 -4;0 0" dur="1.8s" repeatCount="indefinite"/>
    <path d="m329 275 58 41-35 61" fill="none" stroke="#bd7736" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" values="M329 275 387 316 352 377;M329 275 365 335 384 409;M329 275 387 316 352 377" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <g class="ink">
      <path d="m256 248-43-19 25 38-33-2 49 31" fill="#f7f6e9"/>
      <path d="M255 207c-32 18-39 57-9 78 30 21 92 15 119-16 21-25 16-54 25-79l-28-20c-28 21-22 58-43 62-17-21-42-34-64-25z" fill="#fffdf0"/>
      <path d="M256 233c23-19 54-5 74 13-10 29-46 36-68 14" fill="#d5e3dc"/>
      <path d="m268 244 24 12m-22 0 15 9" fill="none" stroke="#92afa7" stroke-width="3"/>
      <path d="M357 205c-9-31-10-63 12-80 25-18 65-8 72 15 7 26-12 45-34 43l-19 48" fill="#fffdf0"/>
      <path d="M405 160h164c-19 54-83 83-144 37z" fill="url(#pouch)"/>
      <path d="M414 153 587 167l-170 7" fill="#ffbc4c"/>
      <path d="M356 135c2-33 56-45 79-11l-35 3-17 14z" fill="#ec7059"/>
      <path d="m374 114 9 15m9-19 8 16m8-13 7 12" fill="none" stroke-width="3"/>
      <path d="M355 139h88" fill="none" stroke-width="6"/>
      <path d="m366 145 22 4 8 15" fill="none" stroke-width="3"/>
      <path d="M397 143c8-5 17-3 21 1" fill="none" stroke-width="3"/>
      <circle cx="410" cy="153" r="5" fill="#183b42" stroke="none"/>
      <path d="M406 181q10 6 19-1" fill="none" stroke-width="3"/>
      <path d="M328 236q53 28 143 9" fill="none" stroke="#d5e3dc" stroke-width="14"/>
      <path d="m464 243 14 6 10-9" fill="none" stroke-width="4"/>
    </g>
    <g class="fine">
      <path d="M457 192q23-17 39-2l13-9-2 18-13-3q-20 12-37-4z" fill="#75b5ac"/>
      <circle cx="467" cy="190" r="2" fill="#183b42" stroke="none"/>
      <path d="m479 191 5 5" fill="none"/>
    </g>
    <path d="m316 283 25 57 43 69" fill="none" stroke="#e9a33e" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M316 283 341 340 384 409;M316 283 370 320 352 377;M316 283 341 340 384 409" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g class="fine">
    <animateTransform attributeName="transform" type="rotate" from="0 368 393" to="360 368 393" dur="1.8s" repeatCount="indefinite"/>
    <path d="m352 377 32 32" fill="none" stroke-width="5"/>
    <path d="M342 377h20m12 32h20" fill="none" stroke-width="7"/>
  </g>

  <g class="fine" fill="#fffdf3">
    <path d="M69 216q0-13 13-13h133q13 0 13 13v46q0 13-13 13h-24l26 25-53-25H82q-13 0-13-13z"/>
  </g>
  <text x="148" y="232" text-anchor="middle" font-size="17" font-weight="bold">“My other ride</text>
  <text x="148" y="254" text-anchor="middle" font-size="17" font-weight="bold">is evolution.”</text>
  <g stroke="#fff5d9" stroke-width="4" stroke-linecap="round">
    <path d="M128 364h41m-51 17h32m-17 18h26"/>
  </g>

  <text x="400" y="522" text-anchor="middle" font-size="23" font-weight="bold">He traded air miles for a seafood delivery gig.</text>
  <path d="M75 546h650" stroke="#d9cdb5" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" font-size="18">2026-10-30 06:30:02 SGT (UTC+08:00)</text>
</svg>