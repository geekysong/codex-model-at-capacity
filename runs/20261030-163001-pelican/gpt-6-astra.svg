<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Big Bill, Small Wheels</title>
  <desc id="desc">A smug pelican rides a bicycle with a fish in its enormous bill, passing a sign charging extra for oversized baggage. Wheels spin, pedals turn, and the pelican bobs in a seamless loop.</desc>
  <defs>
    <pattern id="paving" width="80" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 23H80" stroke="#d7c4a0" stroke-width="2"/>
    </pattern>
    <g id="spokes" stroke="#56757b" stroke-width="3">
      <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
      <circle r="57" fill="none" stroke="#fff5d8" stroke-width="3"/>
      <path d="M0-60V-48" stroke="#efaa38" stroke-width="7"/>
    </g>
  </defs>

