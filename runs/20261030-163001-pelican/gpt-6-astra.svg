  <text x="400" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#263b41">He cycles to work. His bill still needs a parking space.</text>
  <path d="M55 531H745" stroke="#d2c4a7" stroke-width="2"/>
  <text x="400" y="559" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#42565b">2026-10-30 16:30:01 SGT (UTC+08:00)</text>
</svg>