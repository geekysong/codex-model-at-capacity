<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title description">
  <title id="title">Pelican Express</title>
  <desc id="description">A determined pelican pedals a bicycle along a seaside road, carrying a fish in its enormous bill pouch. The wheels spin, the pedals turn, and the pelican bobs in a looping animation.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bcecf2"/>
      <stop offset="1" stop-color="#f5f4d9"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc35c"/>
      <stop offset="1" stop-color="#f39148"/>
    </linearGradient>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke: #203743; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #203743; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <g id="wheel">
      <circle r="66" fill="#fffbed" stroke="#203743" stroke-width="10"/>
