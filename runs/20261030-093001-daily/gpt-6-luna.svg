<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down map of city blocks with shortest route from A1 to E5 avoiding blocked intersections">
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172554">City Block Route Map</text>
  <text x="300" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">Shortest route from A1 to E5 avoiding blocked intersections</text>

  <!-- Streets -->
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <path d="M100 90H500 M100 150H500 M100 210H500 M100 270H500 M100 330H500"/>
    <path d="M100 90V330 M200 90V330 M300 90V330 M400 90V330 M500 90V330"/>
  </g>

  <!-- Route: 8 street segments -->
  <path d="M100 90H200 V150 H300 V210 H400 V270 H500 V330"
        fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <circle cx="100" cy="90" r="7"/><circle cx="200" cy="90" r="5"/>
    <circle cx="200" cy="150" r="5"/><circle cx="300" cy="150" r="5"/>
    <circle cx="300" cy="210" r="5"/><circle cx="400" cy="210" r="5"/>
    <circle cx="400" cy="270" r="5"/><circle cx="500" cy="270" r="5"/>
  </g>
  <!-- Start and end markers -->
  <circle cx="100" cy="90" r="12" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>
  <text x="100" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">S</text>
  <circle cx="500" cy="330" r="12" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
  <text x="500" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">E</text>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 142L208 158 M208 142L192 158"/>
    <path d="M292 202L308 218 M308 202L292 218"/>
    <path d="M392 262L408 278 M408 262L392 278"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">
    <text x="100" y="77">A1</text><text x="200" y="77">B1</text><text x="300" y="77">C1</text><text x="400" y="77">D1</text><text x="500" y="77">E1</text>
    <text x="100" y="137">A2</text><text x="200" y="137">B2</text><text x="300" y="137">C2</text><text x="400" y="137">D2</text><text x="500" y="137">E2</text>
    <text x="100" y="197">A3</text><text x="200" y="197">B3</text><text x="300" y="197">C3</text><text x="400" y="197">D3</text><text x="500" y="197">E3</text>
    <text x="100" y="257">A4</text><text x="200" y="257">B4</text><text x="300" y="257">C4</text><text x="400" y="257">D4</text><text x="500" y="257">E4</text>
    <text x="100" y="317">A5</text><text x="200" y="317">B5</text><text x="300" y="317">C5</text><text x="400" y="317">D5</text><text x="500" y="317">E5</text>
  </g>

  <rect x="150" y="345" width="300" height="28" rx="6" fill="#eff6ff"/>
  <text x="300" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">Route length: 8 street segments</text>
  <text x="300" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">2026-10-30 09:34:34 SGT (UTC+08:00)</text>
</svg>