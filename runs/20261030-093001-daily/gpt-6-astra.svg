<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street map with shortest route from A1 to E5</title>
  <desc id="desc">A five-column, five-row street grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- City blocks -->
  <defs>
    <pattern id="blocks" x="100" y="55" width="100" height="65" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="82" height="47" rx="5" fill="#e2e8f0"/>
    </pattern>
  </defs>
  <rect x="100" y="55" width="400" height="260" fill="url(#blocks)"/>

  <!-- Streets -->
  <g fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round">
    <path d="M100 55H500 M100 120H500 M100 185H500 M100 250H500 M100 315H500"/>
    <path d="M100 55V315 M200 55V315 M300 55V315 M400 55V315 M500 55V315"/>
  </g>

  <!-- Shortest route: four eastward and four southward segments -->
  <path d="M100 55H500V315" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#64748b" stroke-width="2">
    <circle cx="200" cy="55" r="4"/><circle cx="300" cy="55" r="4"/>
    <circle cx="400" cy="55" r="4"/><circle cx="500" cy="55" r="4"/>
    <circle cx="100" cy="120" r="4"/><circle cx="300" cy="120" r="4"/>
    <circle cx="400" cy="120" r="4"/><circle cx="500" cy="120" r="4"/>
    <circle cx="100" cy="185" r="4"/><circle cx="200" cy="185" r="4"/>
    <circle cx="400" cy="185" r="4"/><circle cx="500" cy="185" r="4"/>
    <circle cx="100" cy="250" r="4"/><circle cx="200" cy="250" r="4"/>
    <circle cx="300" cy="250" r="4"/><circle cx="500" cy="250" r="4"/>
    <circle cx="100" cy="315" r="4"/><circle cx="200" cy="315" r="4"/>
    <circle cx="300" cy="315" r="4"/><circle cx="400" cy="315" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 112L208 128 M208 112L192 128"/>
    <path d="M292 177L308 193 M308 177L292 193"/>
    <path d="M392 242L408 258 M408 242L392 258"/>
  </g>

  <!-- Start and end -->
  <circle cx="100" cy="55" r="8" fill="#15803d" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="315" r="8" fill="#c2410c" stroke="#fff" stroke-width="2"/>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">
    <text x="100" y="36" fill="#166534">A1 · START</text>
    <text x="200" y="36">B1</text>
    <text x="300" y="36">C1</text>
    <text x="400" y="36">D1</text>
    <text x="500" y="36">E1</text>

    <text x="100" y="103">A2</text>
    <text x="200" y="103" fill="#b91c1c">B2</text>
    <text x="300" y="103">C2</text>
    <text x="400" y="103">D2</text>
    <text x="500" y="103">E2</text>

    <text x="100" y="168">A3</text>
    <text x="200" y="168">B3</text>
    <text x="300" y="168" fill="#b91c1c">C3</text>
    <text x="400" y="168">D3</text>
    <text x="500" y="168">E3</text>

    <text x="100" y="233">A4</text>
    <text x="200" y="233">B4</text>
    <text x="300" y="233">C4</text>
    <text x="400" y="233" fill="#b91c1c">D4</text>
    <text x="500" y="233">E4</text>

    <text x="100" y="338">A5</text>
    <text x="200" y="338">B5</text>
    <text x="300" y="338">C5</text>
    <text x="400" y="338">D5</text>
    <text x="500" y="338" fill="#9a3412">E5 · END</text>
  </g>

  <!-- Dedicated footer -->
  <rect x="0" y="350" width="600" height="50" fill="#eff6ff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="370" font-size="15" font-weight="700" fill="#1d4ed8">Shortest route: 8 street segments</text>
    <text x="300" y="391" font-size="14" fill="#334155">2026-10-30 09:33:33 SGT (UTC+08:00)</text>
  </g>
</svg>