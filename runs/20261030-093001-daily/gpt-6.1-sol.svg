  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    <text x="82" y="70" text-anchor="end" fill="#15803d">START</text>
    <text x="518" y="310" fill="#7c3aed">END</text>
  </g>

  <text x="300" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">Shortest route: 8 street segments</text>
  <path d="M24 353H576" stroke="#cbd5e1"/>
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 09:34:12 SGT (UTC+08:00)</text>
