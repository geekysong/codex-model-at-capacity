<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street grid: shortest route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172033">City streets · A1 to E5</text>

  <g stroke="#cbd5e1" stroke-width="8" stroke-linecap="round">
    <path d="M100 65H500 M100 125H500 M100 185H500 M100 245H500 M100 305H500"/>
    <path d="M100 65V305 M200 65V305 M300 65V305 M400 65V305 M500 65V305"/>
  </g>

  <path d="M100 65H500V305" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#64748b">
    <circle cx="200" cy="65" r="4"/><circle cx="300" cy="65" r="4"/><circle cx="400" cy="65" r="4"/><circle cx="500" cy="65" r="4"/>
    <circle cx="100" cy="125" r="4"/><circle cx="300" cy="125" r="4"/><circle cx="400" cy="125" r="4"/><circle cx="500" cy="125" r="4"/>
    <circle cx="100" cy="185" r="4"/><circle cx="200" cy="185" r="4"/><circle cx="400" cy="185" r="4"/><circle cx="500" cy="185" r="4"/>
    <circle cx="100" cy="245" r="4"/><circle cx="200" cy="245" r="4"/><circle cx="300" cy="245" r="4"/><circle cx="500" cy="245" r="4"/>
    <circle cx="100" cy="305" r="4"/><circle cx="200" cy="305" r="4"/><circle cx="300" cy="305" r="4"/><circle cx="400" cy="305" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 118L207 132 M207 118L193 132"/>
    <path d="M293 178L307 192 M307 178L293 192"/>
    <path d="M393 238L407 252 M407 238L393 252"/>
  </g>

  <circle cx="100" cy="65" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="305" r="7" fill="#7c3aed" stroke="#fff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">
    <text x="100" y="51">A1</text><text x="200" y="51">B1</text><text x="300" y="51">C1</text><text x="400" y="51">D1</text><text x="500" y="51">E1</text>
    <text x="100" y="111">A2</text><text x="200" y="111">B2</text><text x="300" y="111">C2</text><text x="400" y="111">D2</text><text x="500" y="111">E2</text>
    <text x="100" y="171">A3</text><text x="200" y="171">B3</text><text x="300" y="171">C3</text><text x="400" y="171">D3</text><text x="500" y="171">E3</text>
    <text x="100" y="231">A4</text><text x="200" y="231">B4</text><text x="300" y="231">C4</text><text x="400" y="231">D4</text><text x="500" y="231">E4</text>
    <text x="100" y="291">A5</text><text x="200" y="291">B5</text><text x="300" y="291">C5</text><text x="400" y="291">D5</text><text x="500" y="291">E5</text>
