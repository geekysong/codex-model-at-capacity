<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Visit every cell in 24 moves</title>
  <desc id="desc">A path snakes through all 25 cells of a five by five grid, starting at the top left and ending at the bottom right.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
