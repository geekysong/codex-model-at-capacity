<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A smug pelican rides a tiny bicycle with an enormous beak full of fish. The wheels spin, the pedals turn, and the rider bobs continuously.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#e8dfc8"/>
    </pattern>
