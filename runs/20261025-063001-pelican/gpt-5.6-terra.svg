  </g>

  <g transform="translate(582 174) rotate(7)">
    <rect x="0" y="0" width="133" height="82" rx="8" fill="#fff7d7" stroke="#26313a" stroke-width="6"/>
    <text x="66" y="31" text-anchor="middle" font-size="16" font-weight="900" fill="#d64237">NO FLYING</text>
    <text x="66" y="57" text-anchor="middle" font-size="14" font-weight="700" fill="#26313a">BIKES ONLY!</text>
