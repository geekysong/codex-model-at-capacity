      <path d="M260 337V483M187 410H333M208 358L312 462M312 358L208 462" stroke="#8797a2" stroke-width="4"/>
    </g>
    <g class="wheel" style="transform-origin:510px 410px">
      <circle cx="510" cy="410" r="73" fill="#f9f6e8" stroke="#26313a" stroke-width="11"/>
