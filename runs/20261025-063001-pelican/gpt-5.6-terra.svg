  <rect x="0" y="520" width="800" height="80" fill="#26313a"/>
  <text x="400" y="550" text-anchor="middle" font-size="18" font-weight="700" fill="#fff7d7">A pelican on a bicycle: proof that transport policy has gone wonderfully sideways.</text>
  <text x="400" y="581" text-anchor="middle" font-size="15" fill="#bfe9f2">2026-10-25 06:31:52 SGT (UTC+08:00)</text>
