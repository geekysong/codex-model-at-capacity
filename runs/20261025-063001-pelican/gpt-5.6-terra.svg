    <path d="M367 197 Q286 184 246 233 Q294 258 371 245 Q400 236 403 214Z" fill="#f5bc43" stroke="#26313a" stroke-width="7"/>
    <path d="M249 233 Q290 253 370 244 Q350 297 286 286 Q255 276 249 233Z" fill="#ef8e38" stroke="#26313a" stroke-width="6"/>
    <circle cx="418" cy="180" r="10" fill="#26313a"/>
    <circle cx="421" cy="177" r="3" fill="white"/>
