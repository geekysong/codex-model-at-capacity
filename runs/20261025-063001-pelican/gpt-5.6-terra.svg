<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the Pointless Express</title>
  <desc id="desc">A cheerful satirical cartoon of a pelican riding a bicycle.</desc>
  <style>
    .wheel { animation: spin 1.2s linear infinite; transform-origin: center; }
    .bird { animation: bob .7s ease-in-out infinite alternate; }
    .leg { animation: pedal .7s ease-in-out infinite alternate; transform-origin: 405px 385px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(18deg); } }
    text { font-family: Arial, Helvetica, sans-serif; }
  </style>

  <rect width="800" height="600" fill="#9adcf0"/>
  <path d="M0 345 Q120 300 250 342 T500 332 T800 340 V510 H0Z" fill="#d9cf83"/>
  <path d="M0 420 Q170 387 330 428 T800 411 V510 H0Z" fill="#8ac66f"/>
  <path d="M0 455 H800" stroke="#5a994f" stroke-width="8" stroke-dasharray="24 18"/>

  <text x="400" y="58" text-anchor="middle" font-size="34" font-weight="900" fill="#24354c">THE PELICAN COMMUTE</text>
  <text x="400" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#3b5266">“Why fly when you can arrive sweaty and morally superior?”</text>

  <g aria-label="bicycle">
