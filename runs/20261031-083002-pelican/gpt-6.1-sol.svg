<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Pedal Lobby</title>
  <desc id="description">A smug pelican pedals a bicycle carrying a fish beneath a campaign sign promising bike lanes and bigger fish. Wheels spin, feet pedal, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="0.7" fill="#dfd5bc"/>
      <circle cx="12" cy="13" r="0.5" fill="#dfd5bc"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fff8e6" stroke="#253740" stroke-width="10"/>
      <circle r="66" fill="none" stroke="#aab9b6" stroke-width="2"/>
      <g stroke="#82999a" stroke-width="3">
        <path d="M-66 0H66M0-66V66M-47-47L47 47M-47 47L47-47"/>
      </g>
      <circle r="9" fill="#e9ad45" stroke="#253740" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#faf1d9"/>
  <rect width="800" height="600" fill="url(#paper)" opacity=".55"/>

  <text x="400" y="53" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#253740">THE PELICAN PEDAL LOBBY</text>
  <path d="M80 71H720" stroke="#e46d49" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="2" fill="#51656a">BIG BEAK. SMALL CARBON FOOTPRINT.</text>

  <!-- One sunny seaside campaign ride. -->
  <circle cx="104" cy="163" r="35" fill="#f4ca66"/>
  <path d="M28 330Q160 303 277 330T550 325T800 322V443H0Z" fill="#c6ded6"/>
  <path d="M0 356Q140 338 270 355T540 351T800 349" fill="none" stroke="#96c4bd" stroke-width="4"/>
  <path d="M0 452H800" stroke="#586d68" stroke-width="4"/>
  <ellipse cx="398" cy="453" rx="249" ry="13" fill="#253740" opacity=".12"/>

  <!-- Wheels rotate independently around their hubs. -->
  <g transform="translate(249 374)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(551 374)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame, chain, fork and handlebars. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M249 374L321 272L385 374Z M321 272H506L385 374M506 272L551 374M321 272L311 249"
          stroke="#253740" stroke-width="13"/>
    <path d="M249 374L321 272L385 374Z M321 272H506L385 374M506 272L551 374"
          stroke="#e46d49" stroke-width="7"/>
    <path d="M506 272L493 235L522 218L548 224" stroke="#253740" stroke-width="9"/>
    <path d="M297 248H337" stroke="#253740" stroke-width="12"/>
    <path d="M249 363L385 358Q411 374 385 390L249 385" stroke="#536a6d" stroke-width="3"/>
    <circle cx="385" cy="374" r="21" fill="#f3c66b" stroke="#253740" stroke-width="5"/>
  </g>

  <!-- A fish-filled basket: the campaign's entire transport policy. -->
  <path d="M553 264H643L631 316H565Z" fill="#e7b769" stroke="#253740" stroke-width="4"/>
  <g stroke="#a9753c" stroke-width="2">
    <path d="M562 278H639M565 291H635M568 304H632M575 267L581 315M592 267L594 315M609 267L608 315M626 267L621 315"/>
  </g>
  <g transform="translate(597 263) rotate(-15)">
    <path d="M-31 0Q-8-26 22-4L38-19L35 7L20 4Q-8 21-31 0Z" fill="#86b7b1" stroke="#253740" stroke-width="3"/>
    <circle cx="-19" cy="-3" r="3" fill="#253740"/>
    <path d="M-10-10Q-3 0-10 9" fill="none" stroke="#253740" stroke-width="2"/>
  </g>

  <!-- The candidate bobs, while the campaign text stays still. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>

    <!-- Tail, body and extravagant neck. -->
    <path d="M292 251L258 217L301 228L277 195L327 218" fill="#fffdf3" stroke="#253740" stroke-width="5" stroke-linejoin="round"/>
    <path d="M302 223Q306 177 360 178Q391 177 414 205L440 165Q454 144 468 158Q480 169 466 198L431 263Q408 297 353 281Q307 270 302 223Z"
          fill="#fffdf3" stroke="#253740" stroke-width="5"/>
    <path d="M331 217Q360 200 394 225Q373 263 336 248" fill="#dce7df" stroke="#253740" stroke-width="4"/>
    <path d="M360 211Q395 217 431 235L492 229" fill="none" stroke="#253740" stroke-width="10" stroke-linecap="round"/>
    <path d="M360 211Q395 217 431 235L492 229" fill="none" stroke="#f9fbec" stroke-width="6" stroke-linecap="round"/>

    <!-- Head, huge bill and pouch. -->
    <path d="M435 165Q421 137 442 119Q466 103 487 124Q497 140 484 158Z" fill="#fffdf3" stroke="#253740" stroke-width="5"/>
    <path d="M480 143L642 166Q623 193 574 195Q512 195 480 157Z" fill="#edb25e" stroke="#253740" stroke-width="4" stroke-linejoin="round"/>
    <path d="M479 141Q556 135 650 165L480 157Z" fill="#ffc74f" stroke="#253740" stroke-width="4" stroke-linejoin="round"/>
    <path d="M499 165Q541 184 583 180" fill="none" stroke="#bc753c" stroke-width="3"/>
    <circle cx="465" cy="135" r="7" fill="#253740"/>
    <circle cx="467" cy="133" r="2" fill="white"/>
    <path d="M451 121L469 118" stroke="#253740" stroke-width="4" stroke-linecap="round"/>
    <path d="M434 119L426 109M444 114L441 103" stroke="#253740" stroke-width="3" stroke-linecap="round"/>

    <!-- Official-looking sash. -->
    <path d="M320 192L396 271L417 258L341 183Z" fill="#438c8d" stroke="#253740" stroke-width="2"/>
    <circle cx="383" cy="248" r="13" fill="#f8cf64" stroke="#253740" stroke-width="2"/>
    <path d="M377 247L382 252L390 241" fill="none" stroke="#253740" stroke-width="3"/>
  </g>

  <!-- Pedaling feet follow the rotating cranks. -->
  <path d="M350 280L363 322L409 374" fill="none" stroke="#d99c43" stroke-width="10" stroke-linecap="round">
    <animate attributeName="d" values="M350 280L363 322L409 374;M350 280L385 319L385 398;M350 280L350 336L361 374;M350 280L351 312L385 350;M350 280L363 322L409 374" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(385 374)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#253740" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(24 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <path d="M-13-3L9-7L20 1L-10 5Z" fill="#efad43" stroke="#253740" stroke-width="3"/>
          <path d="M-13 7H16" stroke="#253740" stroke-width="4"/>
        </g>
      </g>
      <g transform="translate(-24 0)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.8s" repeatCount="indefinite"/>
          <path d="M-14 3H13" stroke="#253740" stroke-width="5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Stationary speech bubble keeps the joke readable. -->
  <path d="M81 193Q69 193 69 207V267Q69 281 84 281H203L232 303L223 281H249Q262 281 262 267V207Q262 193 248 193Z"
        fill="#fffdf5" stroke="#253740" stroke-width="3"/>
  <text x="166" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#253740">
    <tspan x="166">“I support</tspan>
    <tspan x="166" dy="24">bike lanes.</tspan>
    <tspan x="166" dy="24">And fish lanes.”</tspan>
  </text>

  <rect x="73" y="476" width="654" height="53" rx="12" fill="#253740"/>
  <text x="400" y="509" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff6df">He ran on clean transport. He rides on seafood.</text>

  <path d="M40 547H760" stroke="#c6b995" stroke-width="2"/>
  <text x="400" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#253740">2026-10-31 08:31:07 SGT (UTC+08:00)</text>
</svg>