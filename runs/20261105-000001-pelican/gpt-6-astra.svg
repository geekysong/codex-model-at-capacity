<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican cycles along a seaside road with a fish in its enormous bill pouch. The wheels spin, its feet pedal, and its body bobs. A sign declares this a no-fly zone.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bceaf4"/>
      <stop offset="1" stop-color="#fff4d4"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc54d"/>
      <stop offset="1" stop-color="#ef8c38"/>
    </linearGradient>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .outline { stroke: #24333d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #738e95; stroke-width: 3; }
    </style>
    <g id="wheel">
      <circle r="75" fill="#f7fcf6" stroke="#24333d" stroke-width="12"/>
      <circle r="65" fill="none" stroke="#b5cbd0" stroke-width="3"/>
      <g class="spoke">
        <path d="M-64 0H64 M0-64V64 M-45-45L45 45 M-45 45L45-45"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#ffca4a" stroke="#24333d" stroke-width="4"/>
    </g>
  </defs>

