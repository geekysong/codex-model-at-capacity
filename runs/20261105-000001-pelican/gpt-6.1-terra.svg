<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A determined pelican pedals a bicycle while carrying fish in its enormous beak. The wheels turn and the rider bobs.</desc>
  <defs>
    <style>
      .ink { stroke: #26333c; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2s linear infinite; }
      .rider { animation: bob 0.8s ease-in-out infinite alternate; }
      .pedals { transform-origin: 394px 421px; animation: spin 2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-5px) rotate(-1deg); } }
      @media (prefers-reduced-motion: reduce) { .wheel, .rider, .pedals { animation-duration: 8s; } }
    </style>
    <pattern id="road" width="60" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6h24" stroke="#e8d2a4" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f9f1df"/>
  <rect x="18" y="18" width="764" height="564" rx="24" fill="#fff9eb" stroke="#26333c" stroke-width="4"/>
  <text x="400" y="72" text-anchor="middle" font-family="Georgia, serif" font-weight="bold" font-size="39" fill="#26333c">THE PELICAN EXPRESS</text>
  <text x="400" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="3" fill="#b5533c">DELIVERY WITH A SIDE OF SASS</text>

