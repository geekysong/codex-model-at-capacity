<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with spinning wheels, carrying a fish who questions the transportation budget.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#e4d7bc" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#fff5dc"/>
  <circle cx="690" cy="140" r="49" fill="#ffd371"/>
  <path d="M0 383Q130 350 260 380T530 376T800 365V515H0Z" fill="#d8e7c5"/>
  <path d="M0 448H800V515H0Z" fill="#e1d5bd"/>
  <path d="M0 486H800" stroke="#fff5dc" stroke-width="5" stroke-dasharray="38 24"/>
  <ellipse cx="402" cy="463" rx="250" ry="13" fill="#534b3e" opacity=".14"/>

  <text x="400" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#173d48">TOUR DE BEAK</text>
  <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#49616a">ZERO EMISSIONS. UNLIMITED FISH EXPENSES.</text>

  <!-- A single roadside sign -->
  <path d="M704 314V445" stroke="#745d42" stroke-width="8"/>
  <path d="M638 279H750L771 303L750 327H638Z" fill="#fff" stroke="#173d48" stroke-width="4"/>
  <text x="699" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#173d48">PIER 2 km</text>

  <!-- Wheels rotate independently around their hubs. -->
  <g transform="translate(239 389)">
    <circle r="72" fill="#fff9e9" stroke="#203b42" stroke-width="11"/>
    <circle r="63" fill="none" stroke="#b4bdaf" stroke-width="3"/>
    <g stroke="#849995" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44M-57-24L57 24M-24-57L24 57M-57 24L57-24M-24 57L24-57"/>
      <path d="M-23-58L-14-61" stroke="#ffb52e" stroke-width="8"/>
    </g>
    <circle r="8" fill="#203b42"/>
  </g>
  <g transform="translate(551 389)">
    <circle r="72" fill="#fff9e9" stroke="#203b42" stroke-width="11"/>
    <circle r="63" fill="none" stroke="#b4bdaf" stroke-width="3"/>
    <g stroke="#849995" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44M-57-24L57 24M-24-57L24 57M-57 24L57-24M-24 57L24-57"/>
      <path d="M-23-58L-14-61" stroke="#ffb52e" stroke-width="8"/>
    </g>
    <circle r="8" fill="#203b42"/>
  </g>

  <!-- Bicycle -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M239 389L321 286L378 389ZM321 286H493L378 389M493 286L551 389" stroke="#a23530" stroke-width="13"/>
    <path d="M239 389L321 286L378 389M321 286H493L378 389M493 286L551 389" stroke="#ee6550" stroke-width="6"/>
    <path d="M321 286L309 262M493 286L483 250L509 238" stroke="#203b42" stroke-width="9"/>
    <path d="M285 262H332" stroke="#203b42" stroke-width="13"/>
    <path d="M507 238H526Q541 239 533 253" stroke="#203b42" stroke-width="8"/>
    <path d="M239 389L378 380V400L239 399Z" stroke="#637572" stroke-width="3"/>
  </g>
  <circle cx="378" cy="389" r="17" fill="#ffc54b" stroke="#203b42" stroke-width="4"/>
  <g transform="translate(378 389)">
    <g stroke="#203b42" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-24 0H24"/>
      <path d="M-25-7V7M25-7V7" stroke-width="9"/>
    </g>
  </g>

  <!-- Pelican: a little bounce, a lot of self-importance. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".9s" repeatCount="indefinite"/>
    <path d="M325 252Q344 287 365 308L386 365" fill="none" stroke="#c87925" stroke-width="12" stroke-linecap="round"/>
    <path d="M352 270L397 314L370 374" fill="none" stroke="#f3a93b" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M352 270L397 314L370 374;M352 270L378 323L398 396;M352 270L397 314L370 374" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M370 374L397 376L384 386L366 384Z" fill="#f5ae39" stroke="#203b42" stroke-width="3">
      <animate attributeName="d" values="M370 374L397 376L384 386L366 384Z;M398 396L423 398L411 407L393 405Z;M370 374L397 376L384 386L366 384Z" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M288 224L248 205L266 245L245 246L292 269" fill="#fffdf2" stroke="#203b42" stroke-width="4" stroke-linejoin="round"/>
    <path d="M286 191Q310 166 356 187Q386 202 386 239Q379 275 334 277Q283 277 273 245Q263 216 286 191Z" fill="#fffdf2" stroke="#203b42" stroke-width="4"/>
    <path d="M359 210Q381 194 384 163L383 142Q383 115 408 116Q433 117 435 143L430 183Q427 224 397 247" fill="#fffdf2" stroke="#203b42" stroke-width="4"/>
    <path d="M290 209Q314 192 350 215L327 248Q301 246 290 226M306 221L328 233M318 211L341 221" fill="#e8ebe0" stroke="#8c9f98" stroke-width="3" stroke-linecap="round"/>
    <path d="M359 218Q408 222 446 248L509 244" fill="none" stroke="#203b42" stroke-width="14" stroke-linecap="round"/>
    <path d="M359 215Q409 219 447 245L508 241" fill="none" stroke="#fffdf2" stroke-width="9" stroke-linecap="round"/>

    <!-- Bill and pouch -->
    <path d="M429 143L567 166Q510 196 432 170Z" fill="#f4ab37" stroke="#203b42" stroke-width="4" stroke-linejoin="round"/>
    <path d="M435 169Q450 229 493 211Q530 194 567 166Q506 180 435 169Z" fill="#f4c36b" stroke="#203b42" stroke-width="4"/>
    <path d="M441 165L553 166" stroke="#b97628" stroke-width="3"/>
    <circle cx="413" cy="143" r="7" fill="#203b42"/>
    <circle cx="415" cy="141" r="2" fill="white"/>
    <path d="M400 129L418 125" stroke="#203b42" stroke-width="4" stroke-linecap="round"/>
    <path d="M380 121Q397 95 426 114L430 122H380Z" fill="#e95749" stroke="#203b42" stroke-width="3"/>
    <path d="M395 108L392 119M410 107L411 120" stroke="#fff2d3" stroke-width="4"/>
  </g>

  <!-- Fish passenger in the rear basket -->
  <path d="M190 299H270L259 340H200Z" fill="#d6a66a" stroke="#203b42" stroke-width="4"/>
  <path d="M204 301L210 337M221 301L224 339M238 301V339M255 301L250 338M198 316H265" stroke="#8c6948" stroke-width="2"/>
  <path d="M198 342H274L257 366" fill="none" stroke="#203b42" stroke-width="5"/>
  <path d="M208 292L193 273L194 300L208 295Q234 311 256 285Q230 268 208 292Z" fill="#69b4b2" stroke="#203b42" stroke-width="3"/>
  <circle cx="245" cy="285" r="3.5" fill="#203b42"/>
  <path d="M230 285L234 292M249 296L255 294" fill="none" stroke="#203b42" stroke-width="2"/>

  <!-- Speech stays stationary and readable. -->
  <path d="M66 145Q66 131 81 131H258Q273 131 273 146V203Q273 218 258 218H220L220 257L194 218H81Q66 218 66 203Z" fill="white" stroke="#203b42" stroke-width="3"/>
  <text x="169" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#203b42">
    <tspan x="169">“I thought I was</tspan>
    <tspan x="169" dy="25">the lunch budget.”</tspan>
  </text>

  <!-- Reserved caption and timestamp footer -->
  <rect y="515" width="800" height="85" fill="#173d48"/>
  <text x="400" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff5dc">A pelican on a bicycle: all pouch, no parking fees.</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff5dc">2026-11-05 00:01:29 SGT (UTC+08:00)</text>
</svg>