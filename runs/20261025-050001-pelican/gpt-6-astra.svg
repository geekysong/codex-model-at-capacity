<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A proud pelican pedals a bicycle with a fish-filled bill pouch. Wheels spin and the bird bobs above the caption: Zero emissions. Massive seafood overhead.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0L10 10" stroke="#ffffff" opacity=".15"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <path d="M0 325Q120 270 245 325T485 315T800 320V470H0Z" fill="#d9e9cb"/>
  <circle cx="697" cy="145" r="39" fill="#ffd46b"/>
  <g fill="#fffdf6">
    <path d="M59 180Q49 155 76 150Q85 119 112 143Q143 137 145 164Q165 180 145 186H66Z"/>
    <path d="M549 177Q537 154 560 150Q566 126 592 146Q623 145 621 168Q639 183 615 186H553Z"/>
  </g>

  <text x="400" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="49" font-weight="900" fill="#193c42" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#60726a">THE ONLY RIDER WITH AN ALL-YOU-CAN-EAT AIRBAG</text>

  <path d="M0 450H800V490H0Z" fill="#d2c6a9"/>
  <path d="M0 469H800" stroke="#fff5dc" stroke-width="4" stroke-dasharray="33 22"/>
  <ellipse cx="409" cy="452" rx="245" ry="13" fill="#253d3b" opacity=".14"/>

  <!-- Wheel rotations remain centered on their axles. -->
  <g stroke="#203a40" fill="none">
    <g transform="translate(248 372)">
      <circle r="77" fill="#fff8e7" stroke-width="12"/>
      <circle r="68" stroke="#dfad56" stroke-width="3"/>
      <g stroke="#64898a" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
        <path d="M-25-62L25 62M-62-25L62 25M-62 25L62-25M-25 62L25-62"/>
        <rect x="43" y="-6" width="16" height="12" rx="3" fill="#ffc453" stroke="none"/>
      </g>
      <circle r="9" fill="#203a40" stroke="none"/>
    </g>
    <g transform="translate(569 372)">
      <circle r="77" fill="#fff8e7" stroke-width="12"/>
      <circle r="68" stroke="#dfad56" stroke-width="3"/>
      <g stroke="#64898a" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
        <path d="M-25-62L25 62M-62-25L62 25M-62 25L62-25M-25 62L25-62"/>
        <rect x="43" y="-6" width="16" height="12" rx="3" fill="#ffc453" stroke="none"/>
      </g>
      <circle r="9" fill="#203a40" stroke="none"/>
    </g>

    <path d="M248 372L323 279L391 372ZM323 279H507L391 372M507 279L569 372" stroke="#e9664d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M323 279L315 257M507 279L496 244L522 229" stroke-width="9" stroke-linecap="round"/>
    <path d="M292 256H337" stroke-width="13" stroke-linecap="round"/>
    <path d="M518 229H545Q557 230 553 243" stroke-width="9" stroke-linecap="round"/>
    <circle cx="527" cy="220" r="8" fill="#ffc453" stroke-width="3"/>
    <path d="M248 369L391 355Q410 357 410 372Q409 387 391 389L248 380Z" stroke-width="3" opacity=".65"/>
    <circle cx="391" cy="372" r="20" fill="#fff1cf" stroke-width="5"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <!-- Far leg -->
    <path d="M348 277L361 321L416 348" fill="none" stroke="#c78934" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M405 344L437 351L417 358L396 351Z" fill="#edab42" stroke="#203a40" stroke-width="3"/>

    <!-- Tail and round body -->
    <path d="M289 243L243 211L257 250L234 245L285 282" fill="#fffdf2" stroke="#203a40" stroke-width="4" stroke-linejoin="round"/>
    <path d="M278 228Q306 189 355 205Q395 215 402 254Q405 285 371 295Q310 307 279 277Q263 257 278 228Z" fill="#fffdf2" stroke="#203a40" stroke-width="4"/>
    <!-- Long curved pelican neck -->
    <path d="M366 252Q385 220 378 187Q371 159 390 143Q413 126 434 148Q445 163 435 180Q418 200 425 225Q434 259 402 276" fill="#fffdf2" stroke="#203a40" stroke-width="4"/>
    <path d="M296 236Q341 219 375 255Q349 281 308 258" fill="#e1e6d9" stroke="#203a40" stroke-width="4"/>
    <path d="M311 242L342 253M320 234L352 249" fill="none" stroke="#9aada5" stroke-width="3" stroke-linecap="round"/>

    <!-- Wing reaches confidently to handlebars -->
    <path d="M372 235Q423 250 455 238L521 231" fill="none" stroke="#203a40" stroke-width="15" stroke-linecap="round"/>
    <path d="M372 233Q423 246 455 235L519 228" fill="none" stroke="#f8faed" stroke-width="9" stroke-linecap="round"/>

    <!-- Absurdly capacious bill pouch -->
    <path d="M429 166L631 181Q609 247 534 242Q473 239 429 179Z" fill="#ffc56d" stroke="#203a40" stroke-width="4"/>
    <path d="M447 187Q524 212 605 189" fill="none" stroke="#e59645" stroke-width="3"/>
    <g fill="#7baaaa" stroke="#203a40" stroke-width="2.5">
      <path d="M493 210Q510 190 531 206L544 197L542 220L530 213Q509 226 493 210Z"/>
      <path d="M551 222Q565 207 583 218L595 210L593 229L581 223Q564 236 551 222Z"/>
    </g>
    <g fill="#fff">
      <circle cx="503" cy="207" r="5"/>
      <circle cx="561" cy="219" r="4"/>
    </g>
    <g fill="#203a40">
      <circle cx="504" cy="208" r="2"/>
      <circle cx="562" cy="219" r="2"/>
    </g>
    <path d="M427 162Q519 155 640 180L431 180Z" fill="#f4af38" stroke="#203a40" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="417" cy="155" r="10" fill="white" stroke="#203a40" stroke-width="3"/>
    <circle cx="421" cy="154" r="4" fill="#203a40"/>
    <path d="M405 138L425 135" stroke="#203a40" stroke-width="4" stroke-linecap="round"/>

    <!-- Tiny aerodynamic helmet -->
    <path d="M379 140Q379 111 408 113Q433 115 438 139Z" fill="#e9664d" stroke="#203a40" stroke-width="4"/>
    <path d="M394 118L392 131M407 118L407 130M420 122L422 132" stroke="#fff3d7" stroke-width="4" stroke-linecap="round"/>
    <path d="M383 141L397 174L408 176" fill="none" stroke="#203a40" stroke-width="3"/>

    <!-- Near leg pedals with a gentle repeating flex -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 353 283;5 353 283;-4 353 283" dur=".9s" repeatCount="indefinite"/>
      <path d="M353 283L331 323L377 369" fill="none" stroke="#203a40" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M353 283L331 323L377 369" fill="none" stroke="#f4b441" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M374 363L406 379L383 386L361 377Z" fill="#ffc453" stroke="#203a40" stroke-width="3" stroke-linejoin="round"/>
      <path d="M362 389H402" stroke="#203a40" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="none" stroke="#748f84" stroke-width="3" stroke-linecap="round">
    <path d="M168 260H214M144 278H197M174 296H205">
      <animate attributeName="opacity" values=".3;1;.3" dur=".9s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="34" y="493" width="732" height="52" rx="14" fill="#193c42"/>
  <text x="400" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#fff5dc">Zero emissions. Massive seafood overhead.</text>
  <line x1="60" y1="557" x2="740" y2="557" stroke="#cbbf9f"/>
  <text x="400" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#344d4c">2026-10-25 05:00:01 SGT (UTC+08:00)</text>
</svg>