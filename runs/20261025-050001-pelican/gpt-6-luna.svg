<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Two-Wheeled Midlife Crisis</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle, proudly carrying a fish in its beak.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .wheel{fill:#fff8df;stroke:#26364a;stroke-width:8}
      .spoke{stroke:#8291a1;stroke-width:2}
      .frame{fill:none;stroke:#ef594c;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .ink{stroke:#26364a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes ride{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .wheelset{transform-origin:300px 430px;animation:spin 2.8s linear infinite}
      .wheelset.back{transform-origin:555px 430px}
      .rider{transform-origin:430px 300px;animation:ride .5s ease-in-out infinite}
    </style>
  </defs>

  <rect width="800" height="600" fill="#bcecf0"/>
  <path d="M0 0h800v78H0z" fill="#fff3cb"/>
  <text id="title" x="400" y="48" text-anchor="middle" font-size="29" font-weight="900" fill="#26364a">THE PELICAN’S TWO-WHEELED MIDLIFE CRISIS</text>

  <circle cx="100" cy="145" r="42" fill="#ffd166"/>
  <path d="M0 372q95-95 186 0 96-105 201 0 96-108 205 0 95-100 208 0v228H0z" fill="#79c8ac"/>
  <path d="M0 425q140-58 278 0t272 0 250 0v175H0z" fill="#72b8dc"/>
  <path d="M0 470q145-25 290 0t290 0 220 0" fill="none" stroke="#d8f7ef" stroke-width="5" opacity=".8"/>
  <path d="M0 532q155-22 310 0t310 0 180 0" fill="none" stroke="#d8f7ef" stroke-width="4" opacity=".65"/>

  <g class="wheelset">
    <circle class="wheel" cx="300" cy="430" r="70"/>
    <g class="spoke">
      <path d="M300 360v140M230 430h140M251 381l98 98m0-98-98 98"/>
    </g>
  </g>
  <g class="wheelset back">
    <circle class="wheel" cx="555" cy="430" r="70"/>
    <g class="spoke">
      <path d="M555 360v140M485 430h140M506 381l98 98m0-98-98 98"/>
    </g>
  </g>

  <g class="frame">
    <path d="M300 430l79-92 53 92H300l42-49"/>
    <path d="M432 430l55-103 68 103H432l-53-92"/>
    <path d="M356 330h49"/>
    <path d="M466 318l28-8"/>
  </g>
  <circle cx="379" cy="430" r="12" fill="#ffd166" stroke="#26364a" stroke-width="5"/>
  <path d="M379 430l-24-22m24 22 25 16" fill="none" stroke="#26364a" stroke-width="6" stroke-linecap="round"/>
  <path d="M286 349h50" stroke="#26364a" stroke-width="9" stroke-linecap="round"/>
  <path d="M474 319l9-22 17 7" fill="none" stroke="#26364a" stroke-width="7" stroke-linecap="round"/>

  <g class="rider">
    <!-- Tail and body -->
    <path d="M406 264q-62 8-77 67l-29 31q35 22 72 3 40-19 67-73z" fill="#fffdf2" class="ink"/>
    <path d="M334 344q36 10 63-15" fill="none" stroke="#f2a54a" stroke-width="7" stroke-linecap="round"/>
    <!-- Pelican neck and head -->
    <path d="M418 275q-7-37 11-58 13-16 30-5 17 11 7 28l-23 30" fill="#fffdf2" class="ink"/>
    <path d="M454 216q7-10 18-3 10 7 2 17l-13 12-16-8z" fill="#fffdf2" class="ink"/>
    <circle cx="463" cy="220" r="3.5" fill="#26364a"/>
    <path d="M469 230q48-21 77-1-24 19-66 21l-18-10z" fill="#f5a33a" stroke="#26364a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M467 239q34 25 70 4-10 34-49 39-22-1-34-20z" fill="#f28e35" stroke="#26364a" stroke-width="4" stroke-linejoin="round"/>
    <path d="M486 244q21 14 41 2" fill="none" stroke="#d86c2b" stroke-width="3"/>
    <!-- Tiny fish clenched in beak -->
    <path d="M526 229q20-14 39 0-19 16-39 0zm39 0 12-9v18z" fill="#ef594c" stroke="#26364a" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="533" cy="227" r="2.5" fill="#26364a"/>
    <!-- Helmet -->
    <path d="M431 211q3-25 29-30 26 5 31 27l-60 3z" fill="#ef594c" stroke="#26364a" stroke-width="4"/>
    <path d="M426 212h67" stroke="#26364a" stroke-width="5" stroke-linecap="round"/>
    <!-- Wing -->
    <path d="M387 276q26-30 52-2-11 35-43 42-19-13-9-40z" fill="#e9e4d2" stroke="#26364a" stroke-width="4"/>
    <path d="M397 288l24-8m-19 19 24-11" fill="none" stroke="#9c9a91" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs pedaling -->
    <path d="M391 315l-20 62 13 31" fill="none" stroke="#f3a33e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M426 316l-5 66-27 39" fill="none" stroke="#f3a33e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M376 405l-12 4m31 15 12 5" stroke="#26364a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <path d="M605 177q-31-20-58 0" fill="none" stroke="#26364a" stroke-width="4" stroke-linecap="round"/>
  <text x="618" y="172" font-size="18" font-weight="800" fill="#26364a">HONK!</text>
  <path d="M249 276q-25-20-47 0" fill="none" stroke="#26364a" stroke-width="4" stroke-linecap="round"/>
  <text x="158" y="268" font-size="18" font-weight="800" fill="#26364a">NO WADDLE ZONE</text>

  <rect x="145" y="505" width="510" height="43" rx="21" fill="#fff3cb" stroke="#26364a" stroke-width="3"/>
  <text x="400" y="533" text-anchor="middle" font-size="18" font-weight="700" fill="#26364a">“I’m not late. I’m just riding on a different kind of current.”</text>
  <rect x="0" y="560" width="800" height="40" fill="#26364a"/>
  <text x="400" y="586" text-anchor="middle" font-size="17" font-weight="700" fill="#fff3cb">2026-10-25 05:02:10 SGT (UTC+08:00)</text>
</svg>