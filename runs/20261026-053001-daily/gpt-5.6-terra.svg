  <title id="title">Knight moves from square 6</title>
  <desc id="desc">A 4 by 4 numbered grid with squares 4, 12, 13, and 15 shaded as reachable by a knight from square 6.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="40" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1f2937">Knight moves from square 6</text>

  <g stroke="#334155" stroke-width="2">
    <rect x="40" y="55" width="55" height="55" fill="#ffffff"/>
    <rect x="95" y="55" width="55" height="55" fill="#ffffff"/>
    <rect x="150" y="55" width="55" height="55" fill="#ffffff"/>
    <rect x="205" y="55" width="55" height="55" fill="#93c5fd"/>

    <rect x="40" y="110" width="55" height="55" fill="#ffffff"/>
    <rect x="95" y="110" width="55" height="55" fill="#fde68a"/>
    <rect x="150" y="110" width="55" height="55" fill="#ffffff"/>
    <rect x="205" y="110" width="55" height="55" fill="#ffffff"/>

    <rect x="40" y="165" width="55" height="55" fill="#ffffff"/>
    <rect x="95" y="165" width="55" height="55" fill="#ffffff"/>
    <rect x="150" y="165" width="55" height="55" fill="#ffffff"/>
    <rect x="205" y="165" width="55" height="55" fill="#93c5fd"/>

    <rect x="40" y="220" width="55" height="55" fill="#93c5fd"/>
    <rect x="95" y="220" width="55" height="55" fill="#ffffff"/>
    <rect x="150" y="220" width="55" height="55" fill="#93c5fd"/>
    <rect x="205" y="220" width="55" height="55" fill="#ffffff"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#172554">
    <text x="67.5" y="82.5">1</text><text x="122.5" y="82.5">2</text><text x="177.5" y="82.5">3</text><text x="232.5" y="82.5">4</text>
    <text x="67.5" y="137.5">5</text><text x="122.5" y="137.5" font-weight="bold">6</text><text x="177.5" y="137.5">7</text><text x="232.5" y="137.5">8</text>
    <text x="67.5" y="192.5">9</text><text x="122.5" y="192.5">10</text><text x="177.5" y="192.5">11</text><text x="232.5" y="192.5">12</text>
    <text x="67.5" y="247.5">13</text><text x="122.5" y="247.5">14</text><text x="177.5" y="247.5">15</text><text x="232.5" y="247.5">16</text>
