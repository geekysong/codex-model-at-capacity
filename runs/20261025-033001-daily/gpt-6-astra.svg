<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <clipPath id="scene">
      <rect x="50" y="200" width="500" height="155"/>
    </clipPath>
  </defs>
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="30" y="28" font-size="18" font-weight="bold">Projectile motion</text>
    <text x="30" y="52">vₓ = 20 m/s · vᵧ₀ = 15 m/s · g = 10 m/s² · No air resistance</text>
