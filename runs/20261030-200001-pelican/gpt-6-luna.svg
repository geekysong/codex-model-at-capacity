<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Two-Wheeled Revolution</title>
  <desc id="desc">A smug pelican pedals a bicycle past a sign that says “Bike lane? I thought you said fish lane!”</desc>
  <style>
    text { font-family: "Trebuchet MS", Arial, sans-serif; }
    .wheel { transform-box: view-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .rider { transform-box: view-box; transform-origin: 400px 355px; animation: bob .8s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-5px) rotate(-1deg); } }
  </style>

  <rect width="800" height="600" fill="#bcecff"/>
  <path d="M0 356 Q115 323 225 354 T448 350 T800 344 V477 H0Z" fill="#a7d98a"/>
  <path d="M0 420 H800 V600 H0Z" fill="#535d68"/>
  <path d="M0 431 H800" stroke="#f8e98c" stroke-width="5" stroke-dasharray="42 28"/>
  <circle cx="676" cy="103" r="40" fill="#ffd166"/>
  <g fill="#fff" opacity=".88">
    <ellipse cx="132" cy="104" rx="42" ry="17"/><ellipse cx="162" cy="98" rx="27" ry="23"/>
    <ellipse cx="570" cy="162" rx="36" ry="14"/><ellipse cx="596" cy="155" rx="24" ry="20"/>
  </g>

  <text id="title" x="400" y="48" text-anchor="middle" font-size="28" font-weight="900" fill="#16324f" stroke="#fff" stroke-width="5" paint-order="stroke">THE PELICAN’S TWO-WHEELED REVOLUTION</text>
  <text x="400" y="77" text-anchor="middle" font-size="16" font-weight="700" fill="#16324f">“Bike lane? I thought you said fish lane!”</text>

  <g transform="rotate(-3 105 288)">
    <rect x="34" y="207" width="150" height="93" rx="8" fill="#fff5d6" stroke="#16324f" stroke-width="4"/>
    <text x="109" y="235" text-anchor="middle" font-size="15" font-weight="900" fill="#16324f">CITY BIKE LANE</text>
    <text x="109" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#16324f">NO FISHING</text>
    <text x="109" y="281" text-anchor="middle" font-size="22" font-weight="900" fill="#e76f51">SERIOUSLY.</text>
    <path d="M108 300 V364" stroke="#68747d" stroke-width="8"/>
  </g>

  <g aria-label="Bicycle">
    <g class="wheel">
      <circle cx="260" cy="402" r="67" fill="#263746" stroke="#f8f5e9" stroke-width="7"/>
      <circle cx="260" cy="402" r="7" fill="#ffd166"/>
      <path d="M260 335V469 M193 402H327 M213 355L307 449 M307 355L213 449" stroke="#c9e3e9" stroke-width="3"/>
    </g>
    <g class="wheel">
      <circle cx="548" cy="402" r="67" fill="#263746" stroke="#f8f5e9" stroke-width="7"/>
      <circle cx="548" cy="402" r="7" fill="#ffd166"/>
      <path d="M548 335V469 M481 402H615 M501 355L595 449 M595 355L501 449" stroke="#c9e3e9" stroke-width="3"/>
    </g>
    <path d="M260 402 L337 333 L393 402 L260 402 M337 333 L459 333 L393 402 L433 402 M459 333 L548 402 M337 333 L315 318" fill="none" stroke="#ef476f" stroke-width="10" stroke-linejoin="round"/>
    <path d="M307 315 H349" stroke="#263746" stroke-width="8" stroke-linecap="round"/>
    <path d="M447 333 L456 307 H476" fill="none" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
    <circle cx="393" cy="402" r="17" fill="#ffd166" stroke="#263746" stroke-width="5"/>
    <path d="M393 402 l-25 19 M393 402 l24 18" stroke="#263746" stroke-width="5" stroke-linecap="round"/>
    <path d="M364 421 h-15 M417 420 h15" stroke="#263746" stroke-width="6" stroke-linecap="round"/>
    <path d="M322 306 l25 0" stroke="#263746" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g class="rider" aria-label="Pelican riding the bicycle">
    <!-- tail feathers -->
    <path d="M337 257 Q300 248 286 273 Q316 270 335 282 M345 262 Q310 274 307 296 Q332 284 349 279" fill="#354a5e" stroke="#263746" stroke-width="4"/>
    <!-- body -->
    <ellipse cx="391" cy="266" rx="62" ry="75" fill="#f8f5e9" stroke="#263746" stroke-width="5"/>
    <path d="M349 290 Q390 302 433 284 Q417 329 379 333 Q352 320 349 290" fill="#53677b"/>
    <path d="M389 328 L378 370 L353 389 M417 327 L432 364 L416 385" fill="none" stroke="#ed9a48" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M350 389 l-13 9 M414 385 l12 10" stroke="#ed9a48" stroke-width="8" stroke-linecap="round"/>
    <!-- neck and head -->
    <path d="M408 224 Q411 187 431 165" fill="none" stroke="#f8f5e9" stroke-width="25" stroke-linecap="round"/>
    <ellipse cx="439" cy="153" rx="31" ry="35" fill="#f8f5e9" stroke="#263746" stroke-width="5"/>
    <path d="M462 153 Q506 143 536 158 Q512 173 464 168Z" fill="#f4a261" stroke="#263746" stroke-width="5"/>
    <path d="M469 169 Q506 171 534 160 Q518 190 473 185Z" fill="#ef476f" stroke="#263746" stroke-width="4"/>
    <ellipse cx="449" cy="146" rx="5" ry="7" fill="#263746"/>
    <circle cx="450" cy="144" r="2" fill="#fff"/>
    <path d="M425 122 Q438 105 452 122" fill="none" stroke="#ef476f" stroke-width="8" stroke-linecap="round"/>
    <!-- wing on handlebar -->
    <path d="M365 250 Q394 227 422 256 Q402 278 371 272Z" fill="#dce5e6" stroke="#263746" stroke-width="4"/>
    <path d="M380 255 Q397 251 412 259" fill="none" stroke="#a7b5bb" stroke-width="3"/>
    <path d="M422 256 L456 307" stroke="#f8f5e9" stroke-width="13" stroke-linecap="round"/>
    <!-- smug sweat -->
    <path d="M478 198 Q470 211 478 216 Q486 211 478 198" fill="#47b9d1"/>
    <path d="M461 120 Q476 110 489 119" fill="none" stroke="#263746" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="rotate(-9 618 290)">
    <path d="M591 270 Q613 244 638 266 Q661 284 643 307 Q619 323 598 303Z" fill="#ffd166" stroke="#8f5425" stroke-width="4"/>
    <path d="M597 280 Q618 273 640 282 M600 290 Q619 284 641 293 M604 300 Q620 295 638 303" fill="none" stroke="#8f5425" stroke-width="3"/>
    <path d="M590 286 L575 277 M643 284 L656 276" stroke="#8f5425" stroke-width="3" stroke-linecap="round"/>
    <text x="617" y="341" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">EMERGENCY SNACK</text>
  </g>

  <path d="M488 211 Q526 218 541 235" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="5 7" opacity=".8"/>
  <path d="M529 224 l13 10 -15 3" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="0" y="510" width="800" height="90" fill="#16324f"/>
  <text x="400" y="541" text-anchor="middle" font-size="16" font-weight="800" fill="#ffd166">LOCAL BIRD CLAIMS HE’S “JUST WINGING IT” IN TRAFFIC</text>
  <text x="400" y="570" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2026-10-30 20:02:02 SGT (UTC+08:00)</text>
</svg>