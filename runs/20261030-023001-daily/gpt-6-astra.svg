<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street map with shortest route from A1 to E5</title>
  <desc id="desc">A five-column, five-row street grid. Intersections B2, C3, and D4 are blocked. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for a total of eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- Streets -->
  <g stroke="#cbd5e1" stroke-width="8" stroke-linecap="round">
    <path d="M70 55H510 M70 115H510 M70 175H510 M70 235H510 M70 295H510"/>
    <path d="M70 55V295 M180 55V295 M290 55V295 M400 55V295 M510 55V295"/>
  </g>

  <!-- Shortest route: four segments east and four south -->
  <path d="M70 55H510V295" fill="none" stroke="#2563eb" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <path d="M337 49L349 55L337 61Z"/>
    <path d="M504 201L510 213L516 201Z"/>
  </g>

  <!-- Intersections -->
  <g fill="#ffffff" stroke="#64748b" stroke-width="2">
    <circle cx="180" cy="55" r="4"/>
    <circle cx="290" cy="55" r="4"/>
    <circle cx="400" cy="55" r="4"/>
    <circle cx="510" cy="55" r="4"/>
    <circle cx="70" cy="115" r="4"/>
    <circle cx="290" cy="115" r="4"/>
    <circle cx="400" cy="115" r="4"/>
    <circle cx="510" cy="115" r="4"/>
    <circle cx="70" cy="175" r="4"/>
    <circle cx="180" cy="175" r="4"/>
    <circle cx="400" cy="175" r="4"/>
    <circle cx="510" cy="175" r="4"/>
    <circle cx="70" cy="235" r="4"/>
    <circle cx="180" cy="235" r="4"/>
    <circle cx="290" cy="235" r="4"/>
    <circle cx="510" cy="235" r="4"/>
    <circle cx="70" cy="295" r="4"/>
    <circle cx="180" cy="295" r="4"/>
    <circle cx="290" cy="295" r="4"/>
    <circle cx="400" cy="295" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M172 107L188 123 M188 107L172 123"/>
    <path d="M282 167L298 183 M298 167L282 183"/>
    <path d="M392 227L408 243 M408 227L392 243"/>
  </g>

  <!-- Start and end -->
  <circle cx="70" cy="55" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="510" cy="295" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a" stroke="#f8fafc" stroke-width="4" paint-order="stroke fill">
    <text x="70" y="35">A1 · START</text>
    <text x="180" y="35">B1</text>
    <text x="290" y="35">C1</text>
    <text x="400" y="35">D1</text>
    <text x="510" y="35">E1</text>

    <text x="70" y="97">A2</text>
    <text x="180" y="97" fill="#b91c1c">B2</text>
    <text x="290" y="97">C2</text>
    <text x="400" y="97">D2</text>
    <text x="510" y="97">E2</text>

    <text x="70" y="157">A3</text>
    <text x="180" y="157">B3</text>
    <text x="290" y="157" fill="#b91c1c">C3</text>
    <text x="400" y="157">D3</text>
    <text x="510" y="157">E3</text>

    <text x="70" y="217">A4</text>
    <text x="180" y="217">B4</text>
    <text x="290" y="217">C4</text>
    <text x="400" y="217" fill="#b91c1c">D4</text>
    <text x="510" y="217">E4</text>

    <text x="70" y="277">A5</text>
    <text x="180" y="277">B5</text>
    <text x="290" y="277">C5</text>
    <text x="400" y="277">D5</text>
    <text x="510" y="277">E5 · END</text>
  </g>

  <!-- Dedicated footer -->
  <path d="M25 324H575" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="348" font-size="16" font-weight="700" fill="#1d4ed8">Shortest route: 8 street segments</text>
    <text x="300" y="379" font-size="14" fill="#334155">2026-10-30 02:33:26 SGT (UTC+08:00)</text>
  </g>
</svg>