      <circle cx="100" cy="190" r="6"/><circle cx="200" cy="190" r="6"/><circle cx="300" cy="190" r="6"/><circle cx="400" cy="190" r="6"/><circle cx="500" cy="190" r="6"/>
      <circle cx="100" cy="252.5" r="6"/><circle cx="200" cy="252.5" r="6"/><circle cx="300" cy="252.5" r="6"/><circle cx="400" cy="252.5" r="6"/><circle cx="500" cy="252.5" r="6"/>
      <circle cx="100" cy="315" r="6"/><circle cx="200" cy="315" r="6"/><circle cx="300" cy="315" r="6"/><circle cx="400" cy="315" r="6"/><circle cx="500" cy="315" r="6"/>
    </g>
    <g fill="#263445" stroke="#f7f8fa" stroke-width="4" paint-order="stroke">
      <text x="100" y="48">A1</text><text x="200" y="48">B1</text><text x="300" y="48">C1</text><text x="400" y="48">D1</text><text x="500" y="48">E1</text>
      <text x="100" y="127.5">A2</text><text x="200" y="127.5">B2</text><text x="300" y="127.5">C2</text><text x="400" y="127.5">D2</text><text x="500" y="127.5">E2</text>
      <text x="100" y="190">A3</text><text x="200" y="190">B3</text><text x="300" y="190">C3</text><text x="400" y="190">D3</text><text x="500" y="190">E3</text>
      <text x="100" y="252.5">A4</text><text x="200" y="252.5">B4</text><text x="300" y="252.5">C4</text><text x="400" y="252.5">D4</text><text x="500" y="252.5">E4</text>
      <text x="100" y="315">A5</text><text x="200" y="315">B5</text><text x="300" y="315">C5</text><text x="400" y="315">D5</text><text x="500" y="315">E5</text>
