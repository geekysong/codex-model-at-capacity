<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Level seesaw in static equilibrium: 6 kilogram mass 2 meters left and 4 kilogram mass 3 meters right, so x equals 3 meters.">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d62828"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #17202a; font-size: 20px; }
      .small { font-family: Arial, sans-serif; fill: #17202a; font-size: 17px; }
      .strong { font-family: Arial, sans-serif; fill: #146c43; font-size: 27px; font-weight: bold; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="300" y="34" text-anchor="middle" class="strong">Balanced Seesaw</text>

  <!-- Seesaw beam -->
  <rect x="90" y="190" width="420" height="18" rx="9" fill="#8d6e63" stroke="#5d4037" stroke-width="3"/>
  <line x1="300" y1="190" x2="300" y2="208" stroke="#3e2723" stroke-width="4"/>

  <!-- Pivot -->
  <path d="M270 285 L300 208 L330 285 Z" fill="#607d8b" stroke="#37474f" stroke-width="3"/>
  <line x1="255" y1="285" x2="345" y2="285" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
  <text x="300" y="312" text-anchor="middle" class="small">pivot</text>

  <!-- Left hanging mass -->
  <line x1="150" y1="208" x2="150" y2="247" stroke="#37474f" stroke-width="3"/>
  <rect x="120" y="247" width="60" height="48" rx="7" fill="#4f86c6" stroke="#24527a" stroke-width="3"/>
  <text x="150" y="277" text-anchor="middle" fill="#fff" font-family="Arial" font-size="19" font-weight="bold">6 kg</text>

  <!-- Right hanging mass -->
  <line x1="450" y1="208" x2="450" y2="247" stroke="#37474f" stroke-width="3"/>
  <rect x="420" y="247" width="60" height="48" rx="7" fill="#f4a261" stroke="#b85c00" stroke-width="3"/>
  <text x="450" y="277" text-anchor="middle" fill="#5d2e00" font-family="Arial" font-size="19" font-weight="bold">4 kg</text>

  <!-- Force arrows -->
  <g stroke="#d62828" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <line x1="150" y1="220" x2="150" y2="244">
      <animate attributeName="y2" values="244;238;244" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="220" x2="450" y2="244">
      <animate attributeName="y2" values="244;238;244" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </line>
  </g>
  <text x="150" y="164" text-anchor="middle" class="small">force ↓</text>
  <text x="450" y="164" text-anchor="middle" class="small">force ↓</text>

  <!-- Distance dimensions -->
  <g stroke="#455a64" stroke-width="2" fill="none">
    <line x1="150" y1="340" x2="300" y2="340"/>
    <line x1="150" y1="332" x2="150" y2="348"/>
    <line x1="300" y1="332" x2="300" y2="348"/>
    <line x1="300" y1="365" x2="450" y2="365"/>
    <line x1="300" y1="357" x2="300" y2="373"/>
    <line x1="450" y1="357" x2="450" y2="373"/>
  </g>
  <text x="225" y="333" text-anchor="middle" class="label">2 m</text>
  <text x="375" y="358" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equation -->
  <text x="300" y="105" text-anchor="middle" class="label">Torque balance: 6 × 2 = 4 × 3</text>
  <text x="300" y="135" text-anchor="middle" class="strong">x = 3 m</text>
  <text x="300" y="390" text-anchor="middle" class="strong">BALANCED</text>
</svg>