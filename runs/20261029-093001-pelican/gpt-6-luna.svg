<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Patrol</title>
  <desc id="desc">A satirical pelican rides a bicycle while proudly delivering fishy news.</desc>
  <defs>
    <style>
      .ink{stroke:#17212b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .ride{animation:bob .8s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ef"/>
      <stop offset="1" stop-color="#eaf8f4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 430 Q120 390 240 430 T480 430 T800 425 V600 H0Z" fill="#9bd18b"/>
  <path d="M0 478 Q150 450 300 480 T600 474 T800 480" fill="none" stroke="#5d9b62" stroke-width="6"/>

  <g class="label" text-anchor="middle">
    <rect x="70" y="35" width="660" height="78" rx="18" fill="#fff7c7" class="ink"/>
    <text x="400" y="76" font-size="35" font-weight="800">PELICAN PEDAL PATROL</text>
    <text x="400" y="101" font-size="16" font-weight="700">“Delivering fishy news at beakneck speed!”</text>
  </g>

  <g class="ride">
    <g class="wheel">
      <circle cx="255" cy="430" r="72" fill="#f7fbff" class="ink"/>
      <circle cx="255" cy="430" r="10" fill="#ef6b52" class="ink"/>
      <path d="M255 358V502M183 430H327M204 379L306 481M306 379L204 481" stroke="#4d87a8" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="555" cy="430" r="72" fill="#f7fbff" class="ink"/>
      <circle cx="555" cy="430" r="10" fill="#ef6b52" class="ink"/>
      <path d="M555 358V502M483 430H627M504 379L606 481M606 379L504 481" stroke="#4d87a8" stroke-width="4"/>
    </g>

    <path d="M255 430 L355 345 L455 430 L555 430 L455 430 L405 350 L355 345" fill="none" stroke="#263746" stroke-width="9"/>
    <path d="M355 345 L330 295 M455 430 L475 350" fill="none" stroke="#263746" stroke-width="8"/>
    <path d="M315 292 H350" stroke="#263746" stroke-width="9"/>
    <path d="M463 345 H505" stroke="#263746" stroke-width="9"/>
    <circle cx="405" cy="430" r="18" fill="#f2c84b" class="ink"/>
    <path d="M405 430 l-35 25 M405 430 l35 25" fill="none" stroke="#263746" stroke-width="7"/>
    <circle cx="370" cy="455" r="9" fill="#ef6b52" class="ink"/>
    <circle cx="440" cy="455" r="9" fill="#ef6b52" class="ink"/>

    <g>
      <path d="M360 315 Q380 235 445 245 Q490 252 493 310 L475 360 Q433 378 383 350Z" fill="#f8f4e8" class="ink"/>
      <path d="M385 275 Q405 215 455 225 Q495 235 500 280 L478 320 L418 315Z" fill="#f8f4e8" class="ink"/>
      <path d="M395 255 Q425 205 472 222" fill="none" stroke="#f8f4e8" stroke-width="24"/>
      <path d="M393 275 Q425 250 466 270" fill="none" stroke="#e6dfc9" stroke-width="9"/>
      <circle cx="454" cy="248" r="8" fill="#17212b"/>
      <path d="M472 274 Q540 270 614 300 Q625 306 614 319 Q534 332 470 305Z" fill="#f2a33b" class="ink"/>
      <path d="M534 296 Q572 303 614 300" fill="none" stroke="#c66e25" stroke-width="5"/>
      <path d="M428 315 Q405 350 395 385" fill="none" stroke="#f2a33b" stroke-width="16" class="ink"/>
      <path d="M468 315 Q490 350 500 385" fill="none" stroke="#f2a33b" stroke-width="16" class="ink"/>
      <path d="M390 385 Q375 397 359 390 M500 385 Q518 397 533 389" fill="none" stroke="#17212b" stroke-width="7"/>
      <path d="M386 335 Q350 360 338 385" fill="none" stroke="#f8f4e8" stroke-width="18" class="ink"/>
      <path d="M487 337 Q520 355 532 380" fill="none" stroke="#f8f4e8" stroke-width="18" class="ink"/>
      <path d="M341 384 L325 399 M530 380 L548 394" stroke="#17212b" stroke-width="7"/>
      <path d="M405 385 Q425 400 447 387" fill="none" stroke="#17212b" stroke-width="5"/>
      <path d="M416 300 Q435 310 453 300" fill="none" stroke="#17212b" stroke-width="5"/>
    </g>

    <g transform="translate(530 210)">
      <path d="M0 0 q35 -28 70 0 q-35 25 -70 0Z" fill="#ef6b52" class="ink"/>
      <path d="M28 -2 l18 -18 l18 18" fill="none" class="ink"/>
      <text x="35" y="6" text-anchor="middle" font-size="13" font-weight="800" class="label">NEWS</text>
    </g>
  </g>

  <g class="label">
    <path d="M125 180 Q125 145 160 145 H285 Q320 145 320 180 V220 Q320 255 285 255 H205 L170 280 V255 H160 Q125 255 125 220Z" fill="#ffffff" class="ink"/>
    <text x="222" y="184" text-anchor="middle" font-size="19" font-weight="800">HONK IF YOU</text>
    <text x="222" y="211" text-anchor="middle" font-size="19" font-weight="800">LIKE TUNA!</text>
  </g>

  <g class="label">
    <rect x="70" y="535" width="660" height="42" rx="12" fill="#fff7c7" class="ink"/>
    <text x="400" y="562" text-anchor="middle" font-size="16" font-weight="700">2026-10-29 09:31:35 SGT (UTC+08:00)</text>
  </g>
</svg>