<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedal Patrol</title>
  <desc>A satirical pelican rides a bicycle while taking himself far too seriously.</desc>
  <style>
    .ink{stroke:#17212b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .label{font-family:Arial,sans-serif;fill:#17212b}
    .wheel{fill:#d9f3ff;stroke:#17212b;stroke-width:7}
    .spoke{stroke:#5d8798;stroke-width:3}
    .motion{stroke:#ef6b4a;stroke-width:6;stroke-linecap:round;fill:none;stroke-dasharray:12 14}
  </style>

  <rect width="800" height="600" fill="#fff7df"/>
  <rect x="24" y="22" width="752" height="554" rx="26" fill="#b9e8e1" class="ink"/>
  <path d="M55 455 Q180 420 300 452 T545 448 T745 450" fill="none" stroke="#70b89f" stroke-width="12"/>
  <path d="M55 475 Q180 440 300 472 T545 468 T745 470" fill="none" stroke="#8bcbb5" stroke-width="6"/>

  <text x="400" y="72" text-anchor="middle" class="label" font-size="38" font-weight="900">PELICAN PEDAL PATROL</text>
  <text x="400" y="108" text-anchor="middle" class="label" font-size="20" font-weight="700">“Public service, private plumage, absolutely no helmet.”</text>

  <g class="motion">
    <path d="M105 300 q-25 -18 -46 0"/>
    <path d="M690 265 q25 -18 46 0"/>
    <path d="M115 340 q-22 -14 -39 2"/>
  </g>

  <g id="bike">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="250" cy="420" r="86" class="wheel"/>
    <circle cx="575" cy="420" r="86" class="wheel"/>
    <g class="spoke">
      <path d="M250 334v172M164 420h172M189 359l122 122M189 481l122-122"/>
      <path d="M575 334v172M489 420h172M514 359l122 122M514 481l122-122"/>
    </g>
    <circle cx="250" cy="420" r="12" fill="#ef6b4a" class="ink"/>
    <circle cx="575" cy="420" r="12" fill="#ef6b4a" class="ink"/>
    <path d="M250 420 L345 300 L455 420 L250 420 M345 300 L575 420 M455 420 L505 290 L575 420" fill="none" class="ink"/>
    <path d="M493 289 h45" class="ink"/>
    <path d="M505 290 q-9 -25 7 -40" fill="none" class="ink"/>
    <path d="M335 300 h-43" class="ink"/>
    <path d="M345 300 l-12 -25" class="ink"/>
    <circle cx="455" cy="420" r="25" fill="#f6c84a" class="ink"/>
    <path d="M455 395v50M430 420h50" class="ink"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 455 420;360 455 420" dur="1.2s" repeatCount="indefinite"/>
      <path d="M455 420 l-48 -29 M455 420 l42 35" class="ink"/>
      <circle cx="407" cy="391" r="8" fill="#ef6b4a" class="ink"/>
      <circle cx="497" cy="455" r="8" fill="#ef6b4a" class="ink"/>
    </g>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="405" cy="250" rx="88" ry="112" fill="#f4f1e8" class="ink"/>
    <path d="M350 190 Q300 145 315 95 Q375 112 407 165" fill="#f4f1e8" class="ink"/>
    <path d="M345 170 Q290 125 224 151 Q284 190 370 203" fill="#ef9b49" class="ink"/>
    <path d="M224 151 Q275 177 370 203 Q300 218 245 188" fill="#f6b85d" class="ink"/>
    <circle cx="350" cy="141" r="10" fill="#17212b"/>
    <circle cx="347" cy="138" r="3" fill="#fff"/>
    <path d="M383 171 Q415 150 442 170" fill="none" class="ink"/>
    <path d="M366 256 Q410 282 452 250" fill="none" stroke="#d76b54" stroke-width="9"/>
    <path d="M401 250 Q390 313 372 347" fill="none" class="ink"/>
    <path d="M436 250 Q452 310 470 347" fill="none" class="ink"/>
    <path d="M372 347 l-30 19 M470 347 l30 19" class="ink"/>
    <path d="M368 257 Q330 288 309 323" fill="none" class="ink"/>
    <path d="M443 258 Q482 286 508 314" fill="none" class="ink"/>
    <path d="M335 324 l-15 22 M504 315 l18 18" class="ink"/>
    <path d="M375 194 Q410 220 448 193" fill="none" stroke="#17212b" stroke-width="5"/>
    <path d="M365 204 Q408 229 454 202" fill="none" stroke="#ef6b4a" stroke-width="8"/>
    <text x="404" y="382" text-anchor="middle" class="label" font-size="16" font-weight="900">HONK IF YOU LOVE TAXES</text>
  </g>

  <path d="M610 170 q35 -28 70 0" fill="none" stroke="#ef6b4a" stroke-width="7"/>
  <text x="645" y="156" text-anchor="middle" class="label" font-size="18" font-weight="800">BEAK-LANE</text>

  <rect x="42" y="520" width="716" height="42" rx="12" fill="#fff7df" stroke="#17212b" stroke-width="3"/>
  <text x="400" y="547" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-29 09:32:46 SGT (UTC+08:00)</text>
</svg>