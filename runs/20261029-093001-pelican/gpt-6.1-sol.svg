<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedals Against All Odds</title>
  <desc>A satirical cartoon pelican riding a bicycle while carrying an absurdly oversized briefcase.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9ecff"/>
      <stop offset="1" stop-color="#fff4cf"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7683"/>
      <stop offset="1" stop-color="#3d4652"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#28303a" flood-opacity=".3"/>
    </filter>
    <style>
      .ink { stroke:#202733; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#202733; }
      .small { font-family:Arial,Helvetica,sans-serif; font-size:17px; fill:#202733; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd166" opacity=".85"/>
  <path d="M65 145 C115 105 145 105 190 140 C145 126 115 140 80 165 Z" fill="#fff" opacity=".85"/>
  <path d="M520 92 C560 62 595 70 625 98 C590 88 560 103 535 120 Z" fill="#fff" opacity=".8"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="38" font-weight="900" fill="#d1495b">PELICAN PEDALS AGAINST ALL ODDS</text>
  <text x="400" y="92" text-anchor="middle" class="label" font-size="20" font-weight="700">“The beak is aerodynamic. The judgment is still pending.”</text>

  <path d="M0 405 Q170 370 335 402 T800 390 L800 540 L0 540 Z" fill="#8ccf78"/>
  <path d="M0 468 Q210 430 410 465 T800 448 L800 600 L0 600 Z" fill="url(#road)"/>
  <path d="M0 525 L800 520" stroke="#f8d36a" stroke-width="8" stroke-dasharray="42 30"/>

  <g filter="url(#shadow)">
    <g id="bike">
      <g id="rearWheel">
        <circle cx="238" cy="446" r="83" fill="#f7f7f7" class="ink"/>
        <circle cx="238" cy="446" r="11" fill="#d1495b" class="ink"/>
        <g stroke="#7a8794" stroke-width="3">
          <path d="M238 363V529 M155 446H321 M180 388L296 504 M296 388L180 504"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 238 446" to="360 238 446" dur="2.2s" repeatCount="indefinite"/>
      </g>
      <g id="frontWheel">
        <circle cx="590" cy="446" r="83" fill="#f7f7f7" class="ink"/>
        <circle cx="590" cy="446" r="11" fill="#d1495b" class="ink"/>
        <g stroke="#7a8794" stroke-width="3">
          <path d="M590 363V529 M507 446H673 M532 388L648 504 M648 388L532 504"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0 590 446" to="360 590 446" dur="2.2s" repeatCount="indefinite"/>
      </g>

      <path d="M238 446 L350 352 L470 446 L238 446 L425 446 L350 352 L590 446 L550 326" fill="none" stroke="#d1495b" stroke-width="13" stroke-linejoin="round"/>
      <path d="M550 326 L590 446" fill="none" stroke="#d1495b" stroke-width="10"/>
      <path d="M530 320 L565 320" stroke="#202733" stroke-width="8" stroke-linecap="round"/>
      <path d="M335 350 L320 320" stroke="#202733" stroke-width="8" stroke-linecap="round"/>
      <path d="M313 318 L337 318" stroke="#202733" stroke-width="8" stroke-linecap="round"/>

      <g id="crank">
        <circle cx="425" cy="446" r="17" fill="#ffd166" class="ink"/>
        <path d="M425 446 L449 427 M425 446 L401 465" stroke="#202733" stroke-width="7"/>
        <ellipse cx="455" cy="423" rx="16" ry="6" fill="#202733"/>
        <ellipse cx="395" cy="470" rx="16" ry="6" fill="#202733"/>
        <animateTransform attributeName="transform" type="rotate" from="0 425 446" to="360 425 446" dur="1s" repeatCount="indefinite"/>
      </g>

      <path d="M330 348 Q350 330 375 341" fill="none" stroke="#202733" stroke-width="7"/>
    </g>

    <g id="pelican" transform="translate(0 0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1s" repeatCount="indefinite"/>
      <ellipse cx="391" cy="285" rx="72" ry="92" fill="#f4f1e8" class="ink"/>
      <path d="M354 258 Q325 205 349 156 Q375 117 416 138 Q455 159 444 207 Q435 244 409 263 Z" fill="#d9e0e5" class="ink"/>
      <ellipse cx="405" cy="156" rx="43" ry="35" fill="#f4f1e8" class="ink"/>
      <circle cx="421" cy="148" r="8" fill="#202733"/>
      <path d="M430 158 Q499 157 536 181 Q500 214 433 190 Z" fill="#f3a641" class="ink"/>
      <path d="M435 190 Q484 190 520 184 Q487 224 434 212 Z" fill="#f8c15a" class="ink"/>
      <path d="M447 181 Q475 179 501 185" fill="none" stroke="#b26b26" stroke-width="4"/>
      <path d="M355 191 Q327 237 350 264" fill="none" stroke="#202733" stroke-width="7"/>
      <path d="M411 260 Q445 306 430 347" fill="none" stroke="#202733" stroke-width="10"/>
      <path d="M431 347 L452 415" fill="none" stroke="#f3a641" stroke-width="9"/>
      <path d="M452 415 L466 430" fill="none" stroke="#202733" stroke-width="7"/>
      <path d="M452 415 L438 429" fill="none" stroke="#202733" stroke-width="7"/>
      <path d="M374 265 Q341 301 347 344" fill="none" stroke="#202733" stroke-width="10"/>
      <path d="M347 344 L388 385" fill="none" stroke="#f3a641" stroke-width="9"/>
      <path d="M388 385 L403 399" fill="none" stroke="#202733" stroke-width="7"/>
      <path d="M388 385 L374 400" fill="none" stroke="#202733" stroke-width="7"/>
      <path d="M344 215 Q372 231 400 220" fill="none" stroke="#c0c9cf" stroke-width="7"/>
      <path d="M353 174 Q374 157 394 171" fill="none" stroke="#c0c9cf" stroke-width="7"/>
      <path d="M375 305 Q393 321 412 307" fill="none" stroke="#202733" stroke-width="5"/>
      <text x="393" y="310" text-anchor="middle" class="label" font-size="17" font-weight="900" fill="#d1495b">HONK!</text>
    </g>

    <g id="briefcase" transform="rotate(-7 525 255)">
      <rect x="493" y="218" width="112" height="82" rx="10" fill="#b86b3c" class="ink"/>
      <path d="M526 218 V201 Q526 191 538 191 H560 Q572 191 572 201 V218" fill="none" class="ink"/>
      <path d="M493 250 H605" stroke="#202733" stroke-width="5"/>
      <circle cx="548" cy="259" r="5" fill="#ffd166"/>
      <text x="549" y="287" text-anchor="middle" font-family="Arial" font-size="14" font-weight="900" fill="#fff4cf">TAX PLAN</text>
    </g>
  </g>

  <path d="M116 370 Q132 344 150 370" fill="none" stroke="#202733" stroke-width="5"/>
  <path d="M152 370 Q168 344 186 370" fill="none" stroke="#202733" stroke-width="5"/>
  <text x="136" y="337" class="label" font-size="18" font-weight="700">HONK</text>
  <text x="160" y="322" class="label" font-size="18" font-weight="700">HONK</text>

  <g>
    <rect x="88" y="548" width="624" height="35" rx="10" fill="#fff8e7" stroke="#202733" stroke-width="3"/>
    <text x="400" y="572" text-anchor="middle" class="small" font-weight="700">2026-10-29 09:30:10 SGT (UTC+08:00)</text>
  </g>
</svg>