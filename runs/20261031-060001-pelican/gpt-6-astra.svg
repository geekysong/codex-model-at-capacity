<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a tiny bicycle along a seaside road, carrying fish in its enormous bill beneath a zero emissions sign. Wheels spin and the rider bobs continuously.</desc>
  <defs>
    <pattern id="sea" width="80" height="24" patternUnits="userSpaceOnUse">
      <path d="M10 12q15 10 30 0t30 0" fill="none" stroke="#72bcc5" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff5dc"/>
  <path d="M0 130Q400 95 800 130V400H0Z" fill="#d7eff0"/>
  <circle cx="686" cy="171" r="43" fill="#ffc95f"/>
  <path d="M0 316Q220 296 420 319T800 310V410H0Z" fill="#9cd4d7"/>
  <path d="M0 329H800V410H0Z" fill="url(#sea)"/>
  <path d="M0 396Q340 369 800 397V493H0Z" fill="#e7d4ac"/>
  <path d="M0 425Q380 405 800 427V492H0Z" fill="#777e81"/>
  <path d="M0 474H800" stroke="#fff5dc" stroke-width="5" stroke-dasharray="38 27"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#243642">
    <text x="400" y="66" font-size="49" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="100" font-size="18" font-weight="bold" letter-spacing="2">THE COMMUTE HAS GONE COMPLETELY FOWL.</text>
  </g>

  <!-- Roadside campaign sign -->
  <path d="M115 270V421" stroke="#526363" stroke-width="8"/>
  <rect x="35" y="193" width="160" height="93" rx="9" fill="#fffdf3" stroke="#304a43" stroke-width="4"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#304a43" font-weight="bold">
    <text x="115" y="222" font-size="20">ZERO EMISSIONS</text>
    <text x="115" y="249" font-size="16">100% FISH BREATH</text>
  </g>
  <path d="M94 264h43m-10-6 10 6-10 6" fill="none" stroke="#304a43" stroke-width="3"/>

  <ellipse cx="418" cy="451" rx="230" ry="16" fill="#263742" opacity=".19"/>

  <!-- Wheels: stationary tires, rotating spokes -->
  <g stroke="#243642">
    <g transform="translate(280 405)">
      <circle r="68" fill="#e5ebdf" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#fff8e4" stroke-width="3"/>
      <g stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41 41 41M-41 41 41-41"/>
        <path d="M21-54 25-63" stroke="#f7bc47" stroke-width="7"/>
      </g>
      <circle r="8" fill="#f9bb4a" stroke-width="3"/>
    </g>
    <g transform="translate(559 405)">
      <circle r="68" fill="#e5ebdf" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#fff8e4" stroke-width="3"/>
      <g stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41 41 41M-41 41 41-41"/>
        <path d="M21-54 25-63" stroke="#f7bc47" stroke-width="7"/>
      </g>
      <circle r="8" fill="#f9bb4a" stroke-width="3"/>
    </g>
  </g>

  <!-- Absurdly small racing bicycle -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 405 344 319 401 405H280L499 319H344M401 405 499 319 559 405" stroke="#243642" stroke-width="12"/>
    <path d="M280 405 344 319 401 405H280L499 319H344M401 405 499 319 559 405" stroke="#ef6555" stroke-width="7"/>
    <path d="m344 319-9-29m164 29-14-47 28-12q22-5 22 12" stroke="#243642" stroke-width="8"/>
    <path d="M314 289h43" stroke="#243642" stroke-width="12"/>
    <path d="M280 405H401" stroke="#243642" stroke-width="3"/>
  </g>
  <circle cx="401" cy="405" r="17" fill="#fff1cd" stroke="#243642" stroke-width="4"/>

  <!-- Pelican and legs bob together -->
  <g stroke="#243642" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="m350 296 31 47-7 43" fill="none" stroke="#dba142" stroke-width="11"/>
    <path d="m369 383 26 8-31 5Z" fill="#f7b34c"/>
    <path d="M304 276 258 258l17 35-29-8 39 34" fill="#fffdf2"/>
    <path d="M288 239Q316 214 354 223L391 263Q396 314 353 327Q293 333 278 290Q269 259 288 239Z" fill="#fffdf2"/>
    <path d="M329 246Q293 250 306 286Q321 309 355 300L337 289l22-3-22-12" fill="#d6e4df"/>
    <!-- Long neck -->
    <path d="M354 251Q379 222 373 185Q366 148 397 141Q430 136 441 162Q450 185 423 204L411 235Q399 271 382 282" fill="#fffdf2"/>
    <path d="M385 148l-7-13 18 8-1-15 16 15" fill="#fffdf2"/>
    <!-- Helmet -->
    <path d="M375 155Q375 121 407 125Q435 126 443 155Z" fill="#f06a56"/>
    <path d="m393 132-4 15m18-16-1 16m13-11 5 12" fill="none" stroke-width="3"/>
    <path d="M382 157q1 37 25 40" fill="none" stroke-width="3"/>
    <!-- Bill pouch with a visible lunch passenger -->
    <path d="M432 178 612 192Q562 258 494 236Q449 226 432 178Z" fill="#f7c16b"/>
    <path d="M483 208q26-18 48 0l17-12-2 24-16-8q-25 17-47-4Z" fill="#81b7ae" stroke-width="3"/>
    <circle cx="492" cy="206" r="3" fill="#243642" stroke="none"/>
    <path d="m507 204 0 9" fill="none" stroke-width="2"/>
    <path d="M431 170Q506 168 626 188L611 197 435 185Z" fill="#ffc74f"/>
    <path d="m442 182 162 8" fill="none" stroke-width="2"/>
    <!-- The rider's magnificently unimpressed expression -->
    <circle cx="417" cy="163" r="10" fill="white" stroke-width="2"/>
    <circle cx="420" cy="164" r="4" fill="#243642" stroke="none"/>
    <path d="m405 154 22 3" fill="none" stroke-width="5"/>
    <!-- Wing reaches the handlebar -->
    <path d="M354 243Q393 258 430 271L486 264Q495 269 486 277L434 285Q391 282 362 268" fill="#fffdf2"/>
    <!-- Scarf -->
    <path d="m393 219 20 8-9 17-21-10Z" fill="#e75d50"/>
    <path d="M390 230q-45-24-80-9l18 9-22 11q46-11 78 4" fill="#e75d50">
      <animate attributeName="d" values="M390 230q-45-24-80-9l18 9-22 11q46-11 78 4;M390 230q-45-8-80-17l18 17-22 3q46 4 78 12;M390 230q-45-24-80-9l18 9-22 11q46-11 78 4" dur=".8s" repeatCount="indefinite"/>
    </path>
    <path d="m361 311 53 36-4 44" fill="none" stroke="#efa94b" stroke-width="12"/>
    <path d="m407 386 30 9-35 6Z" fill="#ffc353"/>
  </g>

  <g transform="translate(401 405)" stroke="#243642" stroke-width="5">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-21 0H21"/>
      <path d="M-28 0h14M14 0h14" stroke-width="8"/>
    </g>
  </g>

  <!-- Motion accents -->
  <g fill="none" stroke="#fff5dc" stroke-width="4" stroke-linecap="round">
    <path d="M177 397h-32m35 16h-51m493 22h40"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#243642" text-anchor="middle">
    <rect x="566" y="274" width="196" height="65" rx="18" fill="#fffdf3" stroke="#243642" stroke-width="3"/>
    <path d="m584 275-13-23 38 23" fill="#fffdf3" stroke="#243642" stroke-width="3" stroke-linejoin="round"/>
    <path d="M586 275h20" stroke="#fffdf3" stroke-width="5"/>
    <text x="664" y="300" font-size="17" font-weight="bold">“My lunch has a</text>
    <text x="664" y="322" font-size="17" font-weight="bold">smaller commute.”</text>
  </g>

  <!-- Dedicated caption and timestamp footer -->
  <rect x="0" y="494" width="800" height="106" fill="#fff5dc"/>
  <path d="M35 495H765" stroke="#243642" stroke-width="3"/>
  <text x="400" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#243642">One pelican. Two wheels. Six unpaid passengers.</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#384b54">2026-10-31 06:00:01 SGT (UTC+08:00)</text>
</svg>