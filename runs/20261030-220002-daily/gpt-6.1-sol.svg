    <circle cx="90" cy="305" r="4"/><circle cx="195" cy="305" r="4"/><circle cx="300" cy="305" r="4"/><circle cx="405" cy="305" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
