<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down 5 by 5 city grid with a shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4">
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b">City blocks and shortest street route</text>

  <!-- Streets -->
  <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M90 75 H510 M90 135 H510 M90 195 H510 M90 255 H510 M90 315 H510"/>
    <path d="M90 75 V315 M195 75 V315 M300 75 V315 M405 75 V315 M510 75 V315"/>
  </g>

  <!-- Shortest route: 8 street segments, detouring around blocked intersections -->
  <path d="M90 75 H195 V75 H300 V75 H405 V75 H510 V135 H510 V195 H510 V255 H510 V315"
        fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections and labels -->
  <g font-family="Arial, sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#334155">
    <!-- Row 1 -->
    <circle cx="90" cy="75" r="12" fill="#16a34a" stroke="white" stroke-width="2"/><text x="90" y="51" font-weight="700">A1</text>
    <circle cx="195" cy="75" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="195" y="51">B1</text>
    <circle cx="300" cy="75" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="300" y="51">C1</text>
    <circle cx="405" cy="75" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="405" y="51">D1</text>
    <circle cx="510" cy="75" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="510" y="51">E1</text>
    <!-- Row 2 -->
    <circle cx="90" cy="135" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="90" y="157">A2</text>
    <circle cx="195" cy="135" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><path d="M190 130 L200 140 M200 130 L190 140" stroke="#dc2626" stroke-width="3"/><text x="195" y="111" fill="#b91c1c" font-weight="700">B2</text>
    <circle cx="300" cy="135" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="300" y="157">C2</text>
    <circle cx="405" cy="135" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="405" y="157">D2</text>
    <circle cx="510" cy="135" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="510" y="157">E2</text>
    <!-- Row 3 -->
    <circle cx="90" cy="195" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="90" y="217">A3</text>
    <circle cx="195" cy="195" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="195" y="217">B3</text>
    <circle cx="300" cy="195" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><path d="M295 190 L305 200 M305 190 L295 200" stroke="#dc2626" stroke-width="3"/><text x="300" y="171" fill="#b91c1c" font-weight="700">C3</text>
    <circle cx="405" cy="195" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="405" y="217">D3</text>
    <circle cx="510" cy="195" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="510" y="217">E3</text>
    <!-- Row 4 -->
    <circle cx="90" cy="255" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="90" y="277">A4</text>
    <circle cx="195" cy="255" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="195" y="277">B4</text>
    <circle cx="300" cy="255" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="300" y="277">C4</text>
    <circle cx="405" cy="255" r="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><path d="M400 250 L410 260 M410 250 L400 260" stroke="#dc2626" stroke-width="3"/><text x="405" y="231" fill="#b91c1c" font-weight="700">D4</text>
    <circle cx="510" cy="255" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="510" y="277">E4</text>
    <!-- Row 5 -->
    <circle cx="90" cy="315" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="90" y="339">A5</text>
    <circle cx="195" cy="315" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="195" y="339">B5</text>
    <circle cx="300" cy="315" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="300" y="339">C5</text>
    <circle cx="405" cy="315" r="7" fill="white" stroke="#475569" stroke-width="2"/><text x="405" y="339">D5</text>
    <circle cx="510" cy="315" r="12" fill="#dc2626" stroke="white" stroke-width="2"/><text x="510" y="315" fill="white" font-size="9" font-weight="700">END</text><text x="510" y="339" font-weight="700">E5</text>
  </g>
  <text x="300" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Route: 8 street segments</text>
  <text x="300" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">2026-10-30 22:05:09 SGT (UTC+08:00)</text>
</svg>