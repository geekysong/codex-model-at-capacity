<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest city route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172033">City streets: A1 to E5</text>

  <rect x="100" y="65" width="400" height="240" fill="#e2e8f0"/>
  <g fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M100 65H500 M100 125H500 M100 185H500 M100 245H500 M100 305H500"/>
    <path d="M100 65V305 M200 65V305 M300 65V305 M400 65V305 M500 65V305"/>
  </g>

  <path d="M100 65H500V305" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#2563eb">
    <path d="M343 58L355 65L343 72Z"/>
    <path d="M493 213L500 225L507 213Z"/>
  </g>

  <g fill="#475569">
    <circle cx="200" cy="65" r="4"/><circle cx="300" cy="65" r="4"/><circle cx="400" cy="65" r="4"/><circle cx="500" cy="65" r="4"/>
    <circle cx="100" cy="125" r="4"/><circle cx="300" cy="125" r="4"/><circle cx="400" cy="125" r="4"/><circle cx="500" cy="125" r="4"/>
    <circle cx="100" cy="185" r="4"/><circle cx="200" cy="185" r="4"/><circle cx="400" cy="185" r="4"/><circle cx="500" cy="185" r="4"/>
    <circle cx="100" cy="245" r="4"/><circle cx="200" cy="245" r="4"/><circle cx="300" cy="245" r="4"/><circle cx="500" cy="245" r="4"/>
    <circle cx="100" cy="305" r="4"/><circle cx="200" cy="305" r="4"/><circle cx="300" cy="305" r="4"/><circle cx="400" cy="305" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 117L208 133 M208 117L192 133"/>
    <path d="M292 177L308 193 M308 177L292 193"/>
    <path d="M392 237L408 253 M408 237L392 253"/>
  </g>

  <circle cx="100" cy="65" r="8" fill="#15803d" stroke="white" stroke-width="2"/>
  <circle cx="500" cy="305" r="8" fill="#7c3aed" stroke="white" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033" text-anchor="middle">
    <text x="100" y="50" font-weight="bold">A1 · Start</text>
    <text x="200" y="50">B1</text><text x="300" y="50">C1</text><text x="400" y="50">D1</text><text x="500" y="50">E1</text>
    <text x="100" y="110">A2</text><text x="200" y="110">B2</text><text x="300" y="110">C2</text><text x="400" y="110">D2</text><text x="500" y="110">E2</text>
    <text x="100" y="170">A3</text><text x="200" y="170">B3</text><text x="300" y="170">C3</text><text x="400" y="170">D3</text><text x="500" y="170">E3</text>
    <text x="100" y="230">A4</text><text x="200" y="230">B4</text><text x="300" y="230">C4</text><text x="400" y="230">D4</text><text x="500" y="230">E4</text>
    <text x="100" y="290">A5</text><text x="200" y="290">B5</text><text x="300" y="290">C5</text><text x="400" y="290">D5</text><text x="500" y="290" font-weight="bold">E5 · End</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14">
    <text x="80" y="340" fill="#1d4ed8" font-weight="bold">Shortest route: 8 street segments</text>
    <path d="M399 330L409 340 M409 330L399 340" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
    <text x="419" y="340" fill="#475569">Blocked</text>
  </g>

  <path d="M30 355H570" stroke="#cbd5e1"/>
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-10-30 22:04:08 SGT (UTC+08:00)</text>
</svg>