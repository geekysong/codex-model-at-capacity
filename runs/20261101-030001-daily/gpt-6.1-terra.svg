<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Hamiltonian path: 24 moves</title>
  <desc id="desc">A path visits all 25 cells of a five by five grid exactly once, starting at the top left and ending at the bottom right.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
