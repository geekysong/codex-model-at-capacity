<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A 6 kilogram mass hangs 2 metres left of the pivot, and a 4 kilogram mass hangs 3 metres right. Equal torques keep the seesaw level: 6 times 2 equals 4 times 3.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#dc493a"/>
    </marker>
  </defs>
  <rect width="600" height="400" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="42" font-size="27" font-weight="700" fill="#137a57">balanced</text>

    <!-- Distances share the same scale: 60 pixels per metre. -->
    <g stroke="#64748b" stroke-width="1.5">
      <path d="M150 88 V143 M270 88 V143 M450 88 V143" stroke-dasharray="4 4"/>
      <path d="M150 105 H270 M270 105 H450"/>
      <path d="M150 99 V111 M270 99 V111 M450 99 V111"/>
    </g>
    <g font-size="20" fill="#243247">
      <text x="210" y="88">2 m</text>
      <text x="360" y="88">x = 3 m</text>
    </g>

    <!-- Horizontal beam and fulcrum. -->
    <rect x="110" y="145" width="380" height="12" rx="5" fill="#334155"/>
    <path d="M270 157 L241 215 H299 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <path d="M232 218 H308" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <text x="270" y="242" font-size="16" fill="#475569">pivot</text>

    <!-- Hanging masses. -->
    <g stroke="#334155" stroke-width="3">
      <path d="M150 157 V188 M450 157 V188"/>
    </g>
    <rect x="114" y="188" width="72" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="418" y="188" width="64" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <g font-size="21" font-weight="700" fill="#1e40af">
      <text x="150" y="221">6 kg</text>
      <text x="450" y="217">4 kg</text>
    </g>

    <!-- Downward gravitational forces. -->
    <g stroke="#dc493a" stroke-width="3" marker-end="url(#arrow)">
      <path d="M150 244 V298"/>
      <path d="M450 236 V272"/>
    </g>
    <g font-size="17" fill="#b83227">
      <text x="202" y="281">6g N</text>
      <text x="502" y="261">4g N</text>
    </g>

    <text x="300" y="332" font-size="19" fill="#475569">Equal opposing torques: 6g × 2 = 4g × x</text>
    <text x="300" y="369" font-size="26" font-weight="700" fill="#0f172a">6×2 = 4×3   →   x = 3 m</text>
  </g>
</svg>