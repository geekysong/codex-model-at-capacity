<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="A level seesaw in static equilibrium: a 6 kilogram mass hangs 2 meters left of the pivot, and a 4 kilogram mass hangs 3 meters right.">
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172554">Level Seesaw</text>

  <!-- Balanced beam -->
  <rect x="105" y="186" width="390" height="16" rx="8" fill="#8b5e3c"/>
  <line x1="105" y1="194" x2="495" y2="194" stroke="#5b3926" stroke-width="2"/>

  <!-- Pivot -->
  <path d="M278 204 L322 204 L300 252 Z" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <rect x="265" y="252" width="70" height="10" rx="3" fill="#94a3b8"/>

  <!-- Hangers and masses -->
  <line x1="170" y1="202" x2="170" y2="250" stroke="#334155" stroke-width="3"/>
  <rect x="140" y="250" width="60" height="52" rx="7" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="white">6 kg</text>
  <text x="170" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">mass</text>

  <line x1="430" y1="202" x2="430" y2="250" stroke="#334155" stroke-width="3"/>
  <rect x="400" y="250" width="60" height="52" rx="7" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
  <text x="430" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="white">4 kg</text>
  <text x="430" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">mass</text>

  <!-- Downward force arrows -->
  <line x1="170" y1="304" x2="170" y2="338" stroke="#2563eb" stroke-width="3"/>
  <path d="M162 330 L170 342 L178 330" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">weight</text>

  <line x1="430" y1="304" x2="430" y2="338" stroke="#dc2626" stroke-width="3"/>
  <path d="M422 330 L430 342 L438 330" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">weight</text>

  <!-- Distance labels -->
  <line x1="170" y1="163" x2="300" y2="163" stroke="#475569" stroke-width="2"/>
  <path d="M170 158 L162 163 L170 168 M300 158 L308 163 L300 168" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="170" y1="169" x2="170" y2="183" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="169" x2="300" y2="183" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="235" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">2 m</text>

  <line x1="300" y1="163" x2="430" y2="163" stroke="#475569" stroke-width="2"/>
  <path d="M300 158 L292 163 L300 168 M430 158 L438 163 L430 168" fill="none" stroke="#475569" stroke-width="2"/>
  <line x1="430" y1="169" x2="430" y2="183" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="365" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#334155">x = 3 m</text>

  <!-- Equilibrium statement -->
  <rect x="76" y="62" width="448" height="62" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="300" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#166534">6 × 2 = 4 × 3</text>
  <text x="300" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#15803d">BALANCED</text>
</svg>