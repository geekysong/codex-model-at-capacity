  <path d="M171 343 Q145 351 153 371" fill="none" stroke="#263d49" stroke-width="4"/>

  <rect y="526" width="800" height="74" fill="#17364a"/>
  <path d="M0 526 H800" stroke="#fff7d5" stroke-width="4"/>
  <text x="400" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#fff7d5">A large bird, a very small bike, and absolutely no sense of proportion.</text>
  <text x="400" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#b9e9f5">2026-10-26 22:33:05 SGT (UTC+08:00)</text>
