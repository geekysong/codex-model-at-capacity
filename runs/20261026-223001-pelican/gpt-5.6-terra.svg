<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of an oversized pelican riding a tiny bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite; }
    .pelican { transform-box: fill-box; transform-origin: 50% 100%; animation: bob .72s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: 50% 0%; animation: pedal .72s ease-in-out infinite alternate; }
    .leg.back { animation-direction: alternate-reverse; }
    .dust { animation: puff 1.15s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(22deg); } }
    @keyframes puff { 0% { opacity: 0; transform: translateX(0) scale(.5); } 35% { opacity: .8; } 100% { opacity: 0; transform: translateX(-42px) scale(1.35); } }
  </style>

  <rect width="800" height="600" fill="#b9e9f5"/>
  <path d="M0 290 Q125 235 250 285 T500 270 T800 285 V455 H0Z" fill="#87ca74"/>
  <path d="M0 365 Q170 320 335 368 T800 350 V478 H0Z" fill="#5cae5b"/>
  <path d="M0 448 H800 V600 H0Z" fill="#f4d66c"/>
  <path d="M0 474 Q150 447 300 475 T600 466 T800 479" fill="none" stroke="#dfb84f" stroke-width="7" opacity=".8"/>

  <text x="400" y="62" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="39" fill="#17364a" stroke="#fff7d5" stroke-width="7" paint-order="stroke">PELICAN PEDAL PANIC!</text>
  <text x="400" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#315462">“Because the bike lane needed more beak-onomy.”</text>

  <g opacity=".95">
    <path d="M652 155 Q675 124 696 155 Q710 120 732 154 Q753 130 771 163 L771 235 H646Z" fill="#77ad62"/>
    <rect x="670" y="167" width="12" height="73" fill="#765139"/>
    <rect x="726" y="163" width="12" height="77" fill="#765139"/>
  </g>

  <g class="dust" fill="#e4c25e">
    <ellipse cx="102" cy="430" rx="23" ry="10"/>
    <ellipse cx="130" cy="442" rx="14" ry="7"/>
  </g>

  <g stroke="#263d49" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
