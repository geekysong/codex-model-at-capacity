<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a huge fish-filled bill, insisting it is aerodynamic. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 24L24 0" stroke="#fff" stroke-opacity=".2"/>
    </pattern>
    <g id="wheel">
      <circle r="69" fill="#fcf6df" stroke="#263b43" stroke-width="10"/>
      <circle r="59" fill="none" stroke="#b5c3bc" stroke-width="3"/>
