        <path d="M-59 0H59M0-59V59M-42-42L42 42M-42 42L42-42"/>
      </g>
      <circle r="9" fill="#f5bc43" stroke="#263b43" stroke-width="4"/>
      <path d="M-12-61H12" stroke="#ed6c48" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#f8edcd"/>
