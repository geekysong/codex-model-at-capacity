  <path d="M35 111H765" stroke="#263b43" stroke-width="3"/>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="45" font-weight="900" letter-spacing="2" fill="#263b43">TOUR DE FISH</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#986047">ONE BIRD. TWO WHEELS. ZERO SELF-AWARENESS.</text>

