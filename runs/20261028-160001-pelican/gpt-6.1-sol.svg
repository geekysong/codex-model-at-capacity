<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#20242b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#20242b}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 430 Q140 390 270 430 T540 425 T800 420 V600 H0Z" fill="#8bd17c"/>
  <path d="M0 475 Q180 440 360 470 T800 460 V600 H0Z" fill="#5eaf63"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="36" font-weight="900">THE GREAT PELICAN GETAWAY</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="20" font-weight="700">“Why fly when you can pedal?”</text>

  <g opacity=".8" fill="#fff">
    <path d="M100 145 q35-28 70 0 q-35 25-70 0Z"/>
    <path d="M610 145 q35-28 70 0 q-35 25-70 0Z"/>
  </g>

  <!-- bicycle -->
  <g class="ink" fill="none">
    <circle cx="250" cy="430" r="72" fill="#d9f2ff">
      <animateTransform attributeName="transform" type="rotate" from="0 250 430" to="360 250 430" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="555" cy="430" r="72" fill="#d9f2ff">
      <animateTransform attributeName="transform" type="rotate" from="0 555 430" to="360 555 430" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M250 430 L350 300 L455 430 L250 430 M350 300 L555 430 M455 430 L505 315 M475 315 h55"/>
    <path d="M330 300 h55"/>
    <circle cx="350" cy="430" r="18" fill="#ffd34e"/>
    <path d="M350 430 l-28 -25 M350 430 l30 24"/>
    <path d="M318 405 h-24 M380 454 h24"/>
  </g>

  <!-- pelican riding -->
  <g filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1s" repeatCount="indefinite"/>
    <ellipse cx="407" cy="245" rx="86" ry="103" fill="#f4f0e6" class="ink"/>
    <path d="M350 300 Q405 335 462 296 L470 350 Q404 385 340 345Z" fill="#e2d8c5" class="ink"/>
    <path d="M362 170 Q405 115 455 165 Q483 198 463 241 Q436 274 383 252 Q348 231 362 170Z" fill="#fffaf0" class="ink"/>
    <path d="M437 194 Q535 190 605 228 Q548 266 442 239Z" fill="#f2a84b" class="ink"/>
    <path d="M454 220 Q532 218 585 231" fill="none" stroke="#d47b2f" stroke-width="5"/>
    <circle cx="430" cy="184" r="10" fill="#20242b"/>
    <path d="M388 165 Q405 145 427 158" fill="none" stroke="#20242b" stroke-width="7"/>
    <path d="M367 280 Q316 315 300 369" fill="none" class="ink"/>
    <path d="M455 280 Q500 315 513 363" fill="none" class="ink"/>
    <path d="M300 369 l-22 15 M513 363 l24 13" fill="none" class="ink"/>
    <path d="M381 342 Q407 318 435 342" fill="none" class="ink"/>
    <path d="M375 346 Q403 365 435 345" fill="none" class="ink"/>
    <path d="M376 348 Q405 330 435 347" fill="none" stroke="#f2a84b" stroke-width="12"/>
    <path d="M390 346 L365 409 M428 346 L452 409" fill="none" class="ink"/>
    <circle cx="365" cy="409" r="9" fill="#f2a84b" class="ink"/>
    <circle cx="452" cy="409" r="9" fill="#f2a84b" class="ink"/>
  </g>

  <!-- motion marks -->
  <g stroke="#20242b" stroke-width="5" stroke-linecap="round" opacity=".75">
    <path d="M145 330 h45"><animate attributeName="x1" values="145;125;145" dur="1s" repeatCount="indefinite"/><animate attributeName="x2" values="190;170;190" dur="1s" repeatCount="indefinite"/></path>
    <path d="M620 330 h42"><animate attributeName="x1" values="620;600;620" dur="1s" repeatCount="indefinite"/><animate attributeName="x2" values="662;642;662" dur="1s" repeatCount="indefinite"/></path>
  </g>

  <text x="400" y="525" text-anchor="middle" class="label" font-size="22" font-weight="700">He’s winging it… one pedal stroke at a time.</text>
  <text x="400" y="575" text-anchor="middle" class="label" font-size="15" font-weight="600">2026-10-28 16:01:22 SGT (UTC+08:00)</text>
</svg>