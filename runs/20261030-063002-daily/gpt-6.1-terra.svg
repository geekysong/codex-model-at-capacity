<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid route from A1 to E5</title>
  <desc id="desc">A route of eight street segments travels across the top row from A1 to E1, then down to E5, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b">City grid: A1 to E5</text>

  <!-- City blocks -->
  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
    <rect x="126" y="74" width="68" height="43" rx="3"/>
    <rect x="216" y="74" width="68" height="43" rx="3"/>
    <rect x="306" y="74" width="68" height="43" rx="3"/>
    <rect x="396" y="74" width="68" height="43" rx="3"/>
    <rect x="126" y="129" width="68" height="43" rx="3"/>
    <rect x="216" y="129" width="68" height="43" rx="3"/>
    <rect x="306" y="129" width="68" height="43" rx="3"/>
    <rect x="396" y="129" width="68" height="43" rx="3"/>
    <rect x="126" y="184" width="68" height="43" rx="3"/>
    <rect x="216" y="184" width="68" height="43" rx="3"/>
    <rect x="306" y="184" width="68" height="43" rx="3"/>
    <rect x="396" y="184" width="68" height="43" rx="3"/>
    <rect x="126" y="239" width="68" height="43" rx="3"/>
    <rect x="216" y="239" width="68" height="43" rx="3"/>
    <rect x="306" y="239" width="68" height="43" rx="3"/>
    <rect x="396" y="239" width="68" height="43" rx="3"/>
  </g>

  <!-- Streets -->
  <g stroke="#94a3b8" stroke-width="3" fill="none">
    <path d="M115 68H475 M115 123H475 M115 178H475 M115 233H475 M115 288H475"/>
    <path d="M115 68V288 M205 68V288 M295 68V288 M385 68V288 M475 68V288"/>
  </g>

  <!-- Shortest route: eight segments -->
  <path d="M115 68H475V288" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#475569" stroke-width="1.5">
    <circle cx="115" cy="68" r="4"/><circle cx="205" cy="68" r="4"/><circle cx="295" cy="68" r="4"/><circle cx="385" cy="68" r="4"/><circle cx="475" cy="68" r="4"/>
    <circle cx="115" cy="123" r="4"/><circle cx="205" cy="123" r="4"/><circle cx="295" cy="123" r="4"/><circle cx="385" cy="123" r="4"/><circle cx="475" cy="123" r="4"/>
    <circle cx="115" cy="178" r="4"/><circle cx="205" cy="178" r="4"/><circle cx="295" cy="178" r="4"/><circle cx="385" cy="178" r="4"/><circle cx="475" cy="178" r="4"/>
    <circle cx="115" cy="233" r="4"/><circle cx="205" cy="233" r="4"/><circle cx="295" cy="233" r="4"/><circle cx="385" cy="233" r="4"/><circle cx="475" cy="233" r="4"/>
    <circle cx="115" cy="288" r="4"/><circle cx="205" cy="288" r="4"/><circle cx="295" cy="288" r="4"/><circle cx="385" cy="288" r="4"/><circle cx="475" cy="288" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M198 116l14 14 M212 116l-14 14"/>
    <path d="M288 171l14 14 M302 171l-14 14"/>
    <path d="M378 226l14 14 M392 226l-14 14"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#334155">
    <text x="124" y="63">A1</text><text x="214" y="63">B1</text><text x="304" y="63">C1</text><text x="394" y="63">D1</text><text x="484" y="63">E1</text>
    <text x="124" y="118">A2</text><text x="214" y="118">B2</text><text x="304" y="118">C2</text><text x="394" y="118">D2</text><text x="484" y="118">E2</text>
    <text x="124" y="173">A3</text><text x="214" y="173">B3</text><text x="304" y="173">C3</text><text x="394" y="173">D3</text><text x="484" y="173">E3</text>
    <text x="124" y="228">A4</text><text x="214" y="228">B4</text><text x="304" y="228">C4</text><text x="394" y="228">D4</text><text x="484" y="228">E4</text>
    <text x="124" y="283">A5</text><text x="214" y="283">B5</text><text x="304" y="283">C5</text><text x="394" y="283">D5</text><text x="484" y="283">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <text x="105" y="72" text-anchor="end" fill="#166534">START</text>
    <text x="484" y="302" fill="#1d4ed8">END</text>
  </g>
  <text x="300" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#1e293b">Route: 8 street segments</text>
  <line x1="40" y1="347" x2="560" y2="347" stroke="#cbd5e1"/>
  <text x="300" y="377" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">2026-10-30 06:34:07 SGT (UTC+08:00)</text>
</svg>