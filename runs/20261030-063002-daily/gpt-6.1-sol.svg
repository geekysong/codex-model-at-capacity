<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid shortest route from A1 to E5</title>
  <desc id="desc">A five-column, five-row street grid. The blue route travels from A1 to E1, then down to E5, using eight street segments and avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#0f172a">City Grid · Shortest Route</text>

  <!-- City blocks -->
  <defs>
    <pattern id="blocks" x="100" y="65" width="100" height="60" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="82" height="42" rx="5" fill="#e2e8f0"/>
    </pattern>
  </defs>
  <rect x="100" y="65" width="400" height="240" fill="url(#blocks)"/>

  <!-- Streets -->
  <g fill="none" stroke="#94a3b8" stroke-width="3">
    <path d="M100 65H500 M100 125H500 M100 185H500 M100 245H500 M100 305H500"/>
    <path d="M100 65V305 M200 65V305 M300 65V305 M400 65V305 M500 65V305"/>
  </g>

  <!-- Eight-segment shortest route -->
  <path d="M100 65H500V305" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersection markers -->
  <g fill="#fff" stroke="#64748b" stroke-width="2">
    <circle cx="200" cy="65" r="4"/><circle cx="300" cy="65" r="4"/><circle cx="400" cy="65" r="4"/><circle cx="500" cy="65" r="4"/>
    <circle cx="100" cy="125" r="4"/><circle cx="300" cy="125" r="4"/><circle cx="400" cy="125" r="4"/><circle cx="500" cy="125" r="4"/>
    <circle cx="100" cy="185" r="4"/><circle cx="200" cy="185" r="4"/><circle cx="400" cy="185" r="4"/><circle cx="500" cy="185" r="4"/>
    <circle cx="100" cy="245" r="4"/><circle cx="200" cy="245" r="4"/><circle cx="300" cy="245" r="4"/><circle cx="500" cy="245" r="4"/>
    <circle cx="100" cy="305" r="4"/><circle cx="200" cy="305" r="4"/><circle cx="300" cy="305" r="4"/><circle cx="400" cy="305" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 118L207 132 M207 118L193 132"/>
    <path d="M293 178L307 192 M307 178L293 192"/>
    <path d="M393 238L407 252 M407 238L393 252"/>
  </g>

  <!-- Start and end -->
  <circle cx="100" cy="65" r="7" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="500" cy="305" r="7" fill="#7c3aed" stroke="#fff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    <text x="81" y="69" text-anchor="end" fill="#15803d">START</text>
    <text x="517" y="309" fill="#7c3aed">END</text>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#0f172a">
    <text x="100" y="52">A1</text><text x="200" y="52">B1</text><text x="300" y="52">C1</text><text x="400" y="52">D1</text><text x="500" y="52">E1</text>
    <text x="100" y="112">A2</text><text x="200" y="112">B2</text><text x="300" y="112">C2</text><text x="400" y="112">D2</text><text x="500" y="112">E2</text>
    <text x="100" y="172">A3</text><text x="200" y="172">B3</text><text x="300" y="172">C3</text><text x="400" y="172">D3</text><text x="500" y="172">E3</text>
    <text x="100" y="232">A4</text><text x="200" y="232">B4</text><text x="300" y="232">C4</text><text x="400" y="232">D4</text><text x="500" y="232">E4</text>
    <text x="100" y="292">A5</text><text x="200" y="292">B5</text><text x="300" y="292">C5</text><text x="400" y="292">D5</text><text x="500" y="292">E5</text>
  </g>

  <text x="300" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">Shortest route: 8 street segments</text>

  <!-- Dedicated timestamp footer -->
  <path d="M30 353H570" stroke="#cbd5e1"/>
  <text x="300" y="379" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">2026-10-30 06:33:37 SGT (UTC+08:00)</text>
</svg>