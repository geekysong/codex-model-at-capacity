<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City block route from A1 to E5</title>
  <desc id="desc">A five by five grid with a shortest route avoiding blocked intersections B2, C3, and D4. The route has 8 street segments.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#222">City route: A1 to E5</text>

  <!-- Streets -->
  <g stroke="#9aa4b2" stroke-width="4" stroke-linecap="round">
    <path d="M120 75H480 M120 135H480 M120 195H480 M120 255H480 M120 315H480"/>
    <path d="M120 75V315 M210 75V315 M300 75V315 M390 75V315 M480 75V315"/>
  </g>

  <!-- Shortest route: A1 → B1 → C1 → D1 → E1 → E2 → E3 → E4 → E5 (8 segments) -->
  <path d="M120 75H480V315" fill="none" stroke="#1677e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#fff" stroke="#566273" stroke-width="2">
    <circle cx="120" cy="75" r="6"/><circle cx="210" cy="75" r="6"/><circle cx="300" cy="75" r="6"/><circle cx="390" cy="75" r="6"/><circle cx="480" cy="75" r="6"/>
    <circle cx="120" cy="135" r="6"/><circle cx="210" cy="135" r="6"/><circle cx="300" cy="135" r="6"/><circle cx="390" cy="135" r="6"/><circle cx="480" cy="135" r="6"/>
    <circle cx="120" cy="195" r="6"/><circle cx="210" cy="195" r="6"/><circle cx="300" cy="195" r="6"/><circle cx="390" cy="195" r="6"/><circle cx="480" cy="195" r="6"/>
    <circle cx="120" cy="255" r="6"/><circle cx="210" cy="255" r="6"/><circle cx="300" cy="255" r="6"/><circle cx="390" cy="255" r="6"/><circle cx="480" cy="255" r="6"/>
    <circle cx="120" cy="315" r="6"/><circle cx="210" cy="315" r="6"/><circle cx="300" cy="315" r="6"/><circle cx="390" cy="315" r="6"/><circle cx="480" cy="315" r="6"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#d22f36" stroke-width="5" stroke-linecap="round">
    <path d="M201 126L219 144 M219 126L201 144"/>
    <path d="M291 186L309 204 M309 186L291 204"/>
    <path d="M381 246L399 264 M399 246L381 264"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="120" cy="75" r="11" fill="#fff" stroke="#168447" stroke-width="4"/>
  <circle cx="120" cy="75" r="4" fill="#168447"/>
  <circle cx="480" cy="315" r="11" fill="#fff" stroke="#7b3fb0" stroke-width="4"/>
  <circle cx="480" cy="315" r="4" fill="#7b3fb0"/>

  <!-- Labels -->
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#263244">
    <text x="120" y="57" font-weight="bold">A1</text><text x="210" y="57">B1</text><text x="300" y="57">C1</text><text x="390" y="57">D1</text><text x="480" y="57">E1</text>
    <text x="120" y="158">A2</text><text x="210" y="158">B2</text><text x="300" y="158">C2</text><text x="390" y="158">D2</text><text x="480" y="158">E2</text>
    <text x="120" y="218">A3</text><text x="210" y="218">B3</text><text x="300" y="218">C3</text><text x="390" y="218">D3</text><text x="480" y="218">E3</text>
    <text x="120" y="278">A4</text><text x="210" y="278">B4</text><text x="300" y="278">C4</text><text x="390" y="278">D4</text><text x="480" y="278">E4</text>
    <text x="120" y="343">A5</text><text x="210" y="343">B5</text><text x="300" y="343">C5</text><text x="390" y="343">D5</text><text x="480" y="343">E5</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" font-weight="bold">
    <text x="137" y="79" fill="#168447">START</text>
    <text x="463" y="311" text-anchor="end" fill="#7b3fb0">END</text>
  </g>

  <!-- Route legend and footer -->
  <g font-family="Arial, sans-serif" fill="#263244">
    <line x1="38" y1="365" x2="68" y2="365" stroke="#1677e8" stroke-width="6" stroke-linecap="round"/>
    <text x="78" y="369" font-size="13">Route: 8 street segments</text>
    <line x1="310" y1="365" x2="326" y2="365" stroke="#d22f36" stroke-width="4"/>
    <line x1="310" y1="357" x2="326" y2="373" stroke="#d22f36" stroke-width="4"/>
    <text x="334" y="369" font-size="12">Blocked intersection</text>
    <text x="300" y="391" text-anchor="middle" font-size="11">2026-10-30 00:04:58 SGT (UTC+08:00)</text>
  </g>
</svg>