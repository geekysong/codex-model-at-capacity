    <path d="M90 65V305 M190 65V305 M290 65V305 M390 65V305 M490 65V305"/>
  </g>
  <path d="M90 65H490V305" fill="none" stroke="#1263df" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#fff" stroke="#526779" stroke-width="2">
    <circle cx="190" cy="65" r="4"/><circle cx="290" cy="65" r="4"/><circle cx="390" cy="65" r="4"/><circle cx="490" cy="65" r="4"/>
    <circle cx="90" cy="125" r="4"/><circle cx="290" cy="125" r="4"/><circle cx="390" cy="125" r="4"/><circle cx="490" cy="125" r="4"/>
    <circle cx="90" cy="185" r="4"/><circle cx="190" cy="185" r="4"/><circle cx="390" cy="185" r="4"/><circle cx="490" cy="185" r="4"/>
    <circle cx="90" cy="245" r="4"/><circle cx="190" cy="245" r="4"/><circle cx="290" cy="245" r="4"/><circle cx="490" cy="245" r="4"/>
    <circle cx="90" cy="305" r="4"/><circle cx="190" cy="305" r="4"/><circle cx="290" cy="305" r="4"/><circle cx="390" cy="305" r="4"/>
  </g>

  <g stroke="#d52232" stroke-width="4" stroke-linecap="round">
