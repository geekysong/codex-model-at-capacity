  <circle cx="490" cy="305" r="7" fill="#1263df" stroke="#fff" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    <text x="72" y="70" text-anchor="end" fill="#13834b">START</text>
