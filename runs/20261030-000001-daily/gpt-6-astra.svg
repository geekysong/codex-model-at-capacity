<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest city route from A1 to E5</title>
  <desc id="desc">A five-by-five grid of intersections. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, and E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#172b40">City streets: shortest route A1 → E5</text>

  <g fill="#edf2f5" stroke="#dce4e9">
    <path d="M100 75h80v40h-80z M200 75h80v40h-80z M300 75h80v40h-80z M400 75h80v40h-80z
             M100 135h80v40h-80z M200 135h80v40h-80z M300 135h80v40h-80z M400 135h80v40h-80z
             M100 195h80v40h-80z M200 195h80v40h-80z M300 195h80v40h-80z M400 195h80v40h-80z
             M100 255h80v40h-80z M200 255h80v40h-80z M300 255h80v40h-80z M400 255h80v40h-80z"/>
  </g>

  <g fill="none" stroke="#98a5b1" stroke-width="4">
