<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A helmeted pelican pedals a bicycle beside the seaside, carrying one tiny fish in an enormous bill. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".8" fill="#173e48" opacity=".04"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fffaf0" stroke="#203c45" stroke-width="11"/>
      <circle r="65" fill="none" stroke="#a5bbc0" stroke-width="3"/>
      <g stroke="#6b858c" stroke-width="2">
        <path d="M0-64V64M-64 0H64M-45-45L45 45M-45 45L45-45"/>
        <path d="M-24-59L24 59M-59-24L59 24M-59 24L59-24M-24 59L24-59"/>
      </g>
      <circle cy="-65" r="6" fill="#f6c653" stroke="#203c45" stroke-width="2"/>
      <circle r="9" fill="#203c45"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 304Q155 276 290 305T570 300T800 294V457H0Z" fill="#bfe4df"/>
  <g fill="none" stroke="#84bdbb" stroke-width="3" stroke-linecap="round">
    <path d="M32 331h72m32 12h49m401-17h75m32 27h64M19 377h48m607 17h89"/>
  </g>
  <circle cx="694" cy="172" r="38" fill="#ffd76e"/>
  <g fill="#fffdf5">
    <path d="M49 220q-9-23 17-28 9-25 31-6 29-7 35 19H49Z"/>
    <path d="M581 222q-7-18 12-22 12-21 27-4 23-3 28 19Z"/>
  </g>

  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="2" fill="#203c45">TOUR DE FISH</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#a14735">THE COMMUTE WITH EXCESS BAGGAGE</text>

  <!-- A roadside campaign sign. -->
  <path d="M102 299V442" stroke="#76644b" stroke-width="8"/>
  <rect x="30" y="249" width="145" height="70" rx="9" fill="#fffdf4" stroke="#203c45" stroke-width="4" transform="rotate(-5 102 284)"/>
  <g transform="rotate(-5 102 284)" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" fill="#203c45">
    <text x="102" y="278" font-size="18">BIKE LANE</text>
    <text x="102" y="302" font-size="15">NO WIDE LOADS</text>
  </g>

  <path d="M0 451Q396 435 800 451V503H0Z" fill="#dbccb0"/>
  <path d="M0 477H800" stroke="#fff6df" stroke-width="4" stroke-dasharray="34 26"/>
  <ellipse cx="420" cy="463" rx="232" ry="15" fill="#203c45" opacity=".12"/>

  <!-- Wheels rotate about their own hubs. -->
  <g transform="translate(259 389)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(578 389)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M259 389L334 283L405 389H259L505 285L578 389M334 283L505 285" stroke="#203c45" stroke-width="13"/>
    <path d="M259 389L334 283L405 389H259L505 285L578 389M334 283L505 285" stroke="#e66a48" stroke-width="7"/>
    <path d="M334 283L322 257M505 285L489 239L514 222" stroke="#203c45" stroke-width="9"/>
    <path d="M302 256H348M510 222H534" stroke="#203c45" stroke-width="12"/>
    <path d="M245 389L398 373Q426 389 399 405L245 399Z" stroke="#203c45" stroke-width="3"/>
  </g>
  <circle cx="405" cy="389" r="23" fill="#fff2d3" stroke="#203c45" stroke-width="5"/>
  <g transform="translate(405 389)">
    <g stroke="#203c45" stroke-width="6" stroke-linecap="round">
      <path d="M-24 0H24"/>
      <path d="M-31-4v8m62-8v8" stroke-width="8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- The rider bobs gently without moving any lettering. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <!-- Far leg and flipper. -->
    <path d="M363 285L392 324L383 367" fill="none" stroke="#c38931" stroke-width="13" stroke-linecap="round"/>
    <path d="M381 358l-12 20 34-3-10-10" fill="#edb348" stroke="#203c45" stroke-width="3"/>

    <!-- White body and jaunty tail. -->
    <path d="M300 258L268 224L310 232Q323 179 371 183Q416 187 436 234Q443 270 411 294Q361 324 318 289Z" fill="#fffdf4" stroke="#203c45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M329 232Q348 210 390 225Q412 240 391 267Q363 287 329 251" fill="#e0e9df" stroke="#203c45" stroke-width="4"/>
    <path d="M343 239q19 19 43 5" fill="none" stroke="#99b4ad" stroke-width="3" stroke-linecap="round"/>

    <!-- Long neck. -->
    <path d="M397 218Q410 192 409 164Q405 134 435 128Q468 122 480 145L466 186Q449 203 445 242" fill="#fffdf4" stroke="#203c45" stroke-width="5"/>
    <!-- Enormous bill and elastic pouch. -->
    <path d="M466 166L675 184Q624 257 511 234Q477 225 466 183Z" fill="#f7c45b" stroke="#203c45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M473 165L682 178L674 187L472 181Z" fill="#ef9340" stroke="#203c45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M505 199Q558 232 630 203" fill="none" stroke="#d79b38" stroke-width="3"/>

    <!-- One indignant fish in the oversized pouch. -->
    <path d="M558 209Q576 190 599 207L613 196L610 218L599 211Q576 227 558 209Z" fill="#69b6b2" stroke="#203c45" stroke-width="3"/>
    <circle cx="570" cy="207" r="2.5" fill="#203c45"/>
    <path d="M575 217l6-8 6 7" fill="none" stroke="#203c45" stroke-width="2"/>

    <!-- Face and helmet. -->
    <ellipse cx="449" cy="155" rx="10" ry="13" fill="white" stroke="#203c45" stroke-width="3"/>
    <circle cx="453" cy="157" r="4" fill="#203c45"/>
    <path d="M438 139l18-4" stroke="#203c45" stroke-width="4" stroke-linecap="round"/>
    <path d="M405 136Q405 103 437 104Q469 105 476 134Z" fill="#e86b4b" stroke="#203c45" stroke-width="5"/>
    <path d="M425 111l-3 15m20-16 2 17m16-10 5 12" stroke="#fff3d4" stroke-width="5" stroke-linecap="round"/>
    <path d="M410 137l15 40 17-5" fill="none" stroke="#203c45" stroke-width="3"/>

    <!-- Wing reaching to the handlebars. -->
    <path d="M392 230Q425 251 453 237L516 222" fill="none" stroke="#203c45" stroke-width="20" stroke-linecap="round"/>
    <path d="M392 230Q425 251 453 237L512 223" fill="none" stroke="#fffdf4" stroke-width="13" stroke-linecap="round"/>
    <path d="M510 219l11 8m-4-10 8 7" stroke="#203c45" stroke-width="3" stroke-linecap="round"/>

    <!-- Near leg makes a small continuous pedaling gesture. -->
    <g>
      <path d="M376 292L354 330L421 375" fill="none" stroke="#203c45" stroke-width="15" stroke-linecap="round"/>
      <path d="M376 292L354 330L421 375" fill="none" stroke="#efb345" stroke-width="9" stroke-linecap="round"/>
      <path d="M416 367l-4 19 33-2-17-13Z" fill="#efb345" stroke="#203c45" stroke-width="3" stroke-linejoin="round"/>
      <animateTransform attributeName="transform" type="rotate" values="-5 376 292;5 376 292;-5 376 292" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Motion marks. -->
  <g stroke="#203c45" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M201 213h51m-66 17h43m-22 18h35"/>
    <path d="M639 369l14-7m-10 25h18"/>
  </g>

  <rect x="0" y="503" width="800" height="97" fill="#203c45"/>
  <text x="400" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff6df">He cut his carbon footprint. His lunch still needs a permit.</text>
  <path d="M80 553H720" stroke="#7f9c9e" stroke-width="1"/>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#fff6df">2026-10-25 09:00:59 SGT (UTC+08:00)</text>
</svg>