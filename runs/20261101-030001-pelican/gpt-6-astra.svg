<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Big Bill, Small Bike</title>
  <desc id="description">A smug pelican cycles along the waterfront with fish in its bill pouch. Both bicycle wheels spin, its pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
