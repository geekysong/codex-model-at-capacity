<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A 6 kilogram mass hangs 2 metres left of the pivot, and a 4 kilogram mass hangs 3 metres right. Equal opposing torques keep the seesaw level.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#d44736"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="42" font-size="27" font-weight="700" fill="#19734b">balanced</text>

    <g stroke="#617184" stroke-width="1.5" fill="none">
      <path d="M140 88V126 M280 88V126 M490 88V126"/>
      <path d="M140 100H280 M280 100H490"/>
      <path d="M140 95V105 M280 95V105 M490 95V105"/>
    </g>
    <g font-size="20" fill="#243449">
      <rect x="182" y="83" width="56" height="30" fill="#fff"/>
      <text x="210" y="105">2 m</text>
      <rect x="326" y="83" width="118" height="30" fill="#fff"/>
      <text x="385" y="105" font-weight="700">x = 3 m</text>
    </g>

    <rect x="110" y="140" width="410" height="12" rx="4" fill="#33475b"/>
    <path d="M280 152 246 216H314Z" fill="#d4dde6" stroke="#33475b" stroke-width="2"/>
    <circle cx="280" cy="152" r="5" fill="#33475b"/>
    <path d="M235 218H325" stroke="#33475b" stroke-width="3"/>
    <text x="280" y="243" font-size="17" fill="#475569">pivot</text>

    <g stroke="#33475b" stroke-width="2">
      <path d="M140 152V185 M490 152V185"/>
      <rect x="104" y="185" width="72" height="51" rx="6" fill="#e8f0fa"/>
      <rect x="454" y="185" width="72" height="51" rx="6" fill="#e8f0fa"/>
    </g>
    <g font-size="22" font-weight="700" fill="#243449">
      <text x="140" y="218">6 kg</text>
      <text x="490" y="218">4 kg</text>
    </g>

    <g stroke="#d44736" stroke-width="3" marker-end="url(#arrow)">
      <path d="M140 241V295"/>
      <path d="M490 241V277"/>
    </g>
    <g font-size="18" fill="#b73629">
      <text x="193" y="273">6g N</text>
      <text x="543" y="265">4g N</text>
    </g>

    <text x="300" y="332" font-size="25" font-weight="700" fill="#243449">6×2 = 4×3</text>
    <text x="300" y="366" font-size="18" fill="#475569">6g × 2 = 4g × x  ⇒  x = 3 m</text>
  </g>
</svg>