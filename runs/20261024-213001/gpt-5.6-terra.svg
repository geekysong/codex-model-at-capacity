<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw torque equation</title>
  <desc id="desc">A level seesaw with a 6 kilogram mass two metres left of the pivot and a 4 kilogram mass three metres right of the pivot, showing static equilibrium.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d84545"/>
    </marker>
    <style>
      .label { font: 18px Arial, sans-serif; fill: #1e293b; }
      .small { font: 16px Arial, sans-serif; fill: #334155; }
      .strong { font: bold 22px Arial, sans-serif; fill: #166534; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- Seesaw beam -->
  <line x1="70" y1="205" x2="530" y2="205" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
  <line x1="70" y1="198" x2="530" y2="198" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Pivot -->
  <path d="M300 212 L262 285 L338 285 Z" fill="#f59e0b" stroke="#92400e" stroke-width="4"/>
  <circle cx="300" cy="205" r="10" fill="#fbbf24" stroke="#92400e" stroke-width="4"/>
  <text x="300" y="315" text-anchor="middle" class="label">pivot</text>

  <!-- Left hanging mass -->
  <line x1="160" y1="205" x2="160" y2="245" stroke="#475569" stroke-width="3"/>
  <rect x="125" y="245" width="70" height="52" rx="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
  <text x="160" y="277" text-anchor="middle" class="label">6 kg</text>
  <line x1="160" y1="304" x2="160" y2="352" stroke="#d84545" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="174" y="342" class="small">weight</text>

  <!-- Right hanging mass -->
  <line x1="510" y1="205" x2="510" y2="245" stroke="#475569" stroke-width="3"/>
  <rect x="475" y="245" width="70" height="52" rx="6" fill="#a78bfa" stroke="#6d28d9" stroke-width="3"/>
  <text x="510" y="277" text-anchor="middle" class="label">4 kg</text>
  <line x1="510" y1="304" x2="510" y2="352" stroke="#d84545" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="524" y="342" class="small">weight</text>

  <!-- Distance dimensions -->
  <line x1="160" y1="155" x2="300" y2="155" stroke="#0f766e" stroke-width="2"/>
  <line x1="160" y1="145" x2="160" y2="165" stroke="#0f766e" stroke-width="2"/>
  <line x1="300" y1="145" x2="300" y2="165" stroke="#0f766e" stroke-width="2"/>
  <text x="230" y="143" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="155" x2="510" y2="155" stroke="#0f766e" stroke-width="2"/>
  <line x1="510" y1="145" x2="510" y2="165" stroke="#0f766e" stroke-width="2"/>
  <text x="405" y="143" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equation and result -->
  <rect x="145" y="48" width="310" height="58" rx="12" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="84" text-anchor="middle" class="strong">6 × 2 = 4 × 3</text>
  <text x="300" y="125" text-anchor="middle" class="strong">BALANCED</text>
</svg>