<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="A balanced level seesaw. A 6 kilogram mass hangs 2 meters left of the pivot and a 4 kilogram mass hangs 3 meters right. Torque equation: 6 times 2 equals 4 times 3.">
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Balanced Seesaw</text>

  <line x1="90" y1="176" x2="510" y2="176" stroke="#334155" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="176" r="10" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <path d="M267 292 L300 190 L333 292 Z" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
  <line x1="250" y1="294" x2="350" y2="294" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

  <line x1="150" y1="176" x2="150" y2="220" stroke="#64748b" stroke-width="3"/>
  <line x1="450" y1="176" x2="450" y2="220" stroke="#64748b" stroke-width="3"/>
  <rect x="119" y="220" width="62" height="54" rx="7" fill="#3b82f6" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="419" y="220" width="62" height="54" rx="7" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
  <text x="150" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">6 kg</text>
  <text x="450" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">4 kg</text>

  <line x1="150" y1="118" x2="150" y2="163" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="450" y1="118" x2="450" y2="163" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="150" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">weight</text>
  <text x="450" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">weight</text>

  <line x1="150" y1="205" x2="300" y2="205" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="198" x2="150" y2="212" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="198" x2="300" y2="212" stroke="#475569" stroke-width="2"/>
  <text x="225" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#334155">2 m</text>

  <line x1="300" y1="205" x2="450" y2="205" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="198" x2="450" y2="212" stroke="#475569" stroke-width="2"/>
  <text x="375" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="600" fill="#334155">x = 3 m</text>

  <text x="300" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">6 × 2 = 4 × 3</text>
  <text x="300" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#15803d">balanced</text>

  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>