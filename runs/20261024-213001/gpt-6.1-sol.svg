<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A level seesaw with a 6 kilogram mass 2 meters left of the pivot and a 4 kilogram mass 3 meters right. Equal opposing torques give 6 times 2 equals 4 times 3, so x equals 3 meters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#c24136"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#183044">
    <text x="300" y="40" font-size="26" font-weight="700">balanced</text>

    <g stroke="#657789" stroke-width="1.5" fill="none">
      <path d="M110 108V143 M270 108V143 M510 108V143"/>
      <path d="M110 119H270 M270 119H510"/>
      <path d="m115 114-5 5 5 5 m150-10 5 5-5 5 m10-10-5 5 5 5 m230-10 5 5-5 5"/>
    </g>
    <text x="190" y="101" font-size="20">2 m</text>
    <text x="390" y="101" font-size="20" font-weight="700">x = 3 m</text>

    <rect x="70" y="150" width="480" height="12" rx="4" fill="#346784"/>
    <path d="M270 163 239 224H301Z" fill="#bdcbd5" stroke="#344f63" stroke-width="2"/>
    <circle cx="270" cy="160" r="5" fill="#183044"/>
    <path d="M228 227H312" stroke="#344f63" stroke-width="4" stroke-linecap="round"/>
    <text x="270" y="253" font-size="16">pivot</text>

    <g stroke="#344f63" stroke-width="2">
      <path d="M110 162V190 M510 162V190"/>
      <rect x="75" y="190" width="70" height="52" rx="6" fill="#e6eff5"/>
      <rect x="475" y="190" width="70" height="52" rx="6" fill="#e6eff5"/>
    </g>
    <text x="110" y="223" font-size="22" font-weight="700">6 kg</text>
    <text x="510" y="223" font-size="22" font-weight="700">4 kg</text>

    <g stroke="#c24136" stroke-width="3" marker-end="url(#arrow)">
      <path d="M110 247V294"/>
      <path d="M510 247V294"/>
    </g>
    <g fill="#a7352d" font-size="18">
      <text x="160" y="282">6g ↓</text>
      <text x="460" y="282">4g ↓</text>
    </g>

    <text x="300" y="335" font-size="25" font-weight="700">6×2 = 4×3</text>
    <text x="300" y="370" font-size="19">x = (6×2)/4 = 3 m</text>
  </g>
</svg>