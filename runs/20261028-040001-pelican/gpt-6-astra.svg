<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7ff"/>
      <stop offset="1" stop-color="#eafcff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7b89"/>
      <stop offset="1" stop-color="#3f4b57"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#173042" flood-opacity=".3"/>
    </filter>
    <style>
      .ink{stroke:#172735;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:none;stroke:#172735;stroke-width:8}
      .spoke{stroke:#89a9b8;stroke-width:3}
      .label{font-family:Verdana,Arial,sans-serif;fill:#172735}
      .bold{font-weight:800}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .pedalSpin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
      .bob{animation:bob .8s ease-in-out infinite alternate}
      .flag{animation:wave 1.1s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
      @keyframes wave{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="105" r="48" fill="#fff7b0" opacity=".9"/>
  <path d="M0 350 Q110 285 220 345 T440 335 T660 350 T800 330 V440 H0Z" fill="#9bcf9a"/>
  <path d="M0 400 Q150 360 300 405 T600 395 T800 405 V600 H0Z" fill="url(#road)"/>
  <path d="M0 507 Q160 478 320 510 T640 503 T800 512" fill="none" stroke="#e8f3ed" stroke-width="7" stroke-dasharray="28 20"/>

  <g filter="url(#shadow)">
    <rect x="42" y="30" width="716" height="92" rx="25" fill="#fffdf2" stroke="#172735" stroke-width="6"/>
    <text x="400" y="75" text-anchor="middle" class="label bold" font-size="34">THE PELICAN PEDAL EXPRESS</text>
    <text x="400" y="103" text-anchor="middle" class="label" font-size="18">When your beak is bigger than your budget, ride faster.</text>
  </g>

  <g class="bob">
    <!-- bicycle -->
    <g>
      <circle cx="235" cy="445" r="72" class="wheel"/>
      <circle cx="555" cy="445" r="72" class="wheel"/>
      <g class="wheelSpin">
        <path d="M235 373V517M163 445H307M184 394L286 496M286 394L184 496" class="spoke"/>
      </g>
      <g class="wheelSpin">
        <path d="M555 373V517M483 445H627M504 394L606 496M606 394L504 496" class="spoke"/>
      </g>
      <path d="M235 445 L330 365 L430 445 L555 445 L430 445 L380 345 L330 365 L235 445 M380 345 L455 350 L555 445" fill="none" class="ink"/>
      <path d="M372 342 L357 320 M350 320 H390" fill="none" class="ink"/>
      <circle cx="430" cy="445" r="14" fill="#ffd34e" class="ink"/>
      <g class="pedalSpin">
        <path d="M430 445 L463 473 M430 445 L397 417" fill="none" class="ink"/>
        <circle cx="470" cy="480" r="7" fill="#ff795f" class="ink"/>
        <circle cx="390" cy="410" r="7" fill="#ff795f" class="ink"/>
      </g>
      <path d="M545 372 L585 355 L605 371" fill="none" class="ink"/>
    </g>

    <!-- pelican -->
    <g>
      <ellipse cx="380" cy="282" rx="75" ry="92" fill="#f2f0df" class="ink"/>
      <path d="M333 276 Q380 240 426 276 L438 332 Q382 365 326 332Z" fill="#d6e3df" class="ink"/>
      <path d="M331 260 Q299 208 326 160 Q363 116 408 151 Q431 171 420 214 Q402 253 331 260Z" fill="#f8f5e9" class="ink"/>
      <circle cx="372" cy="185" r="10" fill="#172735"/>
      <circle cx="375" cy="181" r="3" fill="#fff"/>
      <path d="M337 217 Q285 207 250 230 Q291 258 355 247" fill="#f3a23d" class="ink"/>
      <path d="M252 230 Q302 231 353 246 Q307 267 258 246Z" fill="#f7b04f" class="ink"/>
      <path d="M351 306 Q319 337 328 375 M410 306 Q443 337 433 376" fill="none" class="ink"/>
      <path d="M325 375 Q341 385 356 375 M430 375 Q445 385 460 375" fill="none" class="ink"/>
      <path d="M352 247 Q381 264 412 247" fill="none" stroke="#172735" stroke-width="5"/>
      <path d="M355 255 Q382 273 408 255" fill="none" stroke="#ef6d5b" stroke-width="5"/>
      <!-- wing and fish -->
      <path d="M420 266 Q478 245 495 293 Q465 319 416 316" fill="#e8eadb" class="ink"/>
      <path d="M462 273 Q518 231 591 268 Q548 306 478 298Z" fill="#6bb7c8" class="ink"/>
      <path d="M570 265 L602 247 L598 280Z" fill="#f2c14e" class="ink"/>
      <circle cx="528" cy="264" r="4" fill="#172735"/>
      <text x="474" y="229" class="label bold" font-size="17">LUNCH?</text>
      <!-- helmet -->
      <path d="M319 165 Q362 117 414 154 L420 172 Q367 148 322 180Z" fill="#ff665d" class="ink"/>
      <path d="M315 168 Q356 151 419 171" fill="none" class="ink"/>
    </g>
  </g>

  <g class="flag">
    <path d="M650 380 V260" class="ink"/>
    <path d="M650 262 Q695 245 736 264 Q697 286 650 275Z" fill="#ff665d" class="ink"/>
    <text x="666" y="267" class="label bold" font-size="15">HONK!</text>
  </g>

  <text x="400" y="555" text-anchor="middle" class="label bold" font-size="17">
    2026-10-28 04:00:01 SGT (UTC+08:00)
  </text>
</svg>