<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Against the Tide</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle, wobbling cheerfully through a windy seaside town.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8dd8f2"/>
      <stop offset="1" stop-color="#d9f6ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#198ca8"/>
      <stop offset="1" stop-color="#66d0d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#164b5a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#173844;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#173844}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .rider{animation:bob 1.2s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="105" r="55" fill="#ffe58b" opacity=".9"/>
  <path d="M0 315 Q105 265 210 315 T420 315 T630 315 T840 315 V430 H0Z" fill="url(#sea)"/>
  <path d="M0 350 Q90 320 180 350 T360 350 T540 350 T720 350 T900 350" fill="none" stroke="#c6f5ef" stroke-width="9" opacity=".8"/>
  <path d="M0 405 Q120 370 240 405 T480 405 T720 405 T960 405" fill="none" stroke="#d8fff9" stroke-width="7" opacity=".75"/>

  <g opacity=".9">
    <path d="M90 185 l38 -34 38 34 v70 H90Z" fill="#f4a261" class="ink"/>
    <rect x="106" y="208" width="22" height="47" fill="#fff0c2" class="ink"/>
    <path d="M128 151h70l-35-25z" fill="#e76f51" class="ink"/>
    <path d="M145 210h18v18h-18zM175 210h18v18h-18z" fill="#9de3ef" class="ink"/>
  </g>

  <g class="label" font-weight="900" text-anchor="middle">
    <text x="400" y="58" font-size="34" fill="#173844">PELICAN PEDALS</text>
    <text x="400" y="91" font-size="20" fill="#d1495b">AGAINST THE TIDE</text>
  </g>

  <g class="label" font-size="18" font-weight="700">
    <path d="M575 145 q45-35 90 0" fill="none" stroke="#173844" stroke-width="4"/>
    <text x="665" y="137">“I brake for fish!”</text>
  </g>

  <g filter="url(#shadow)">
    <g class="wheel">
      <circle cx="245" cy="462" r="70" fill="#d8f4f2" class="ink"/>
      <circle cx="245" cy="462" r="10" fill="#e76f51" class="ink"/>
      <path d="M245 392V532M175 462H315M196 413L294 511M294 413L196 511" fill="none" stroke="#4b8792" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="555" cy="462" r="70" fill="#d8f4f2" class="ink"/>
      <circle cx="555" cy="462" r="10" fill="#e76f51" class="ink"/>
      <path d="M555 392V532M485 462H625M506 413L604 511M604 413L506 511" fill="none" stroke="#4b8792" stroke-width="4"/>
    </g>

    <path d="M245 462 L350 355 L455 462 L245 462 M350 355 L555 462 M455 462 L505 350 L555 462" fill="none" stroke="#e76f51" stroke-width="10" stroke-linejoin="round"/>
    <path d="M505 350 l35 -8" stroke="#173844" stroke-width="8" stroke-linecap="round"/>
    <path d="M338 350 h35" stroke="#173844" stroke-width="9" stroke-linecap="round"/>
    <circle cx="350" cy="462" r="18" fill="#ffd166" class="ink"/>
    <path d="M350 462 l45 -23 M350 462 l-22 39" stroke="#173844" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="395" cy="441" rx="12" ry="7" fill="#f4a261" class="ink"/>
    <ellipse cx="314" cy="500" rx="12" ry="7" fill="#f4a261" class="ink"/>
  </g>

  <g class="rider" filter="url(#shadow)">
    <path d="M385 180 Q420 140 472 165 Q507 184 501 232 L481 318 Q470 348 431 335 L394 307 Q371 276 385 180Z" fill="#f7f1d0" class="ink"/>
    <ellipse cx="438" cy="170" rx="55" ry="45" fill="#fff8dc" class="ink"/>
    <path d="M466 180 Q530 181 589 213 Q603 222 587 238 Q531 245 470 218Z" fill="#f28c52" class="ink"/>
    <path d="M582 216 q16 7 17 17 q-12 10-24 0" fill="#d96b42" class="ink"/>
    <circle cx="457" cy="159" r="8" fill="#173844"/>
    <path d="M400 157 q-17-32 10-51 q35-21 65 10 q-22-7-38 7 q-18 17-37 34Z" fill="#f4a261" class="ink"/>
    <path d="M407 210 Q372 224 367 280 Q392 300 420 275" fill="#f4a261" class="ink"/>
    <path d="M470 218 Q510 238 510 292 Q484 305 459 277" fill="#f4a261" class="ink"/>
    <path d="M410 286 L390 370 L350 426" fill="none" stroke="#f4a261" stroke-width="16" stroke-linecap="round"/>
    <path d="M470 285 L485 363 L520 420" fill="none" stroke="#f4a261" stroke-width="16" stroke-linecap="round"/>
    <path d="M350 426 l-28 10 M520 420 l27 11" stroke="#173844" stroke-width="9" stroke-linecap="round"/>
    <path d="M402 200 q28 16 57 0" fill="none" stroke="#d96b42" stroke-width="5"/>
    <path d="M486 128 q22-24 50-11" fill="none" stroke="#173844" stroke-width="5"/>
    <text x="390" y="120" class="label" font-size="16" font-weight="900">HONK!</text>
  </g>

  <g class="label" font-size="19" font-weight="800">
    <rect x="92" y="520" width="615" height="42" rx="21" fill="#fff8dc" stroke="#173844" stroke-width="4"/>
    <text x="400" y="547" text-anchor="middle">A bird-brained commute with excellent beak-through.</text>
  </g>

  <text x="400" y="588" text-anchor="middle" class="label" font-size="13" font-weight="700">2026-10-29 01:30:01 SGT (UTC+08:00)</text>
</svg>