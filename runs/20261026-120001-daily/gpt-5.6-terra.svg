<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Knight moves from square 6 on a 4 by 4 grid</title>
  <desc id="desc">Squares 4, 12, 13, and 15 are reachable by a knight in one move from square 6.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="40" y="24" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">Knight moves from square 6</text>

  <g stroke="#334155" stroke-width="2">
    <rect x="40" y="45" width="60" height="60" fill="#f8fafc"/>
    <rect x="100" y="45" width="60" height="60" fill="#f8fafc"/>
    <rect x="160" y="45" width="60" height="60" fill="#f8fafc"/>
    <rect x="220" y="45" width="60" height="60" fill="#fde68a"/>
    <rect x="40" y="105" width="60" height="60" fill="#f8fafc"/>
    <rect x="100" y="105" width="60" height="60" fill="#f8fafc"/>
    <rect x="160" y="105" width="60" height="60" fill="#f8fafc"/>
    <rect x="220" y="105" width="60" height="60" fill="#f8fafc"/>
    <rect x="40" y="165" width="60" height="60" fill="#f8fafc"/>
    <rect x="100" y="165" width="60" height="60" fill="#f8fafc"/>
    <rect x="160" y="165" width="60" height="60" fill="#f8fafc"/>
    <rect x="220" y="165" width="60" height="60" fill="#fde68a"/>
    <rect x="40" y="225" width="60" height="60" fill="#fde68a"/>
    <rect x="100" y="225" width="60" height="60" fill="#f8fafc"/>
    <rect x="160" y="225" width="60" height="60" fill="#fde68a"/>
    <rect x="220" y="225" width="60" height="60" fill="#f8fafc"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle" fill="#111827">
    <text x="70" y="75">1</text><text x="130" y="75">2</text><text x="190" y="75">3</text><text x="250" y="75">4</text>
    <text x="70" y="135">5</text><text x="130" y="135" font-weight="bold">6</text><text x="190" y="135">7</text><text x="250" y="135">8</text>
    <text x="70" y="195">9</text><text x="130" y="195">10</text><text x="190" y="195">11</text><text x="250" y="195">12</text>
    <text x="70" y="255">13</text><text x="130" y="255">14</text><text x="190" y="255">15</text><text x="250" y="255">16</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="325" y="75" font-size="20" font-weight="bold">Legend</text>
    <rect x="325" y="94" width="20" height="20" fill="#fde68a" stroke="#334155" stroke-width="2"/>
    <text x="355" y="110" font-size="16">Reachable in one move</text>
    <text x="325" y="150" font-size="18" font-weight="bold">Shaded squares: 4</text>
    <text x="325" y="185" font-size="18">Numbers: 4, 12, 13, 15</text>
    <text x="325" y="230" font-size="15" fill="#475569">Start: square 6</text>
  </g>

  <line x1="30" y1="330" x2="570" y2="330" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="365" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#334155">2026-10-26 12:04:35 SGT (UTC+08:00)</text>
