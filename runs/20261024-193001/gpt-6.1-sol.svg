<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>

  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#222">
    Level Seesaw — Static Equilibrium
  </text>

  <!-- Seesaw beam -->
  <rect x="90" y="178" width="420" height="24" rx="8" fill="#8b5a2b" stroke="#4b3018" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,202 260,278 340,278" fill="#6c757d" stroke="#343a40" stroke-width="3"/>
  <circle cx="300" cy="190" r="8" fill="#343a40"/>
  <text x="300" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">pivot</text>

  <!-- Left mass -->
  <rect x="150" y="112" width="60" height="52" rx="6" fill="#4d9de0" stroke="#1f5f91" stroke-width="3"/>
  <text x="180" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>
  <line x1="180" y1="164" x2="180" y2="176" stroke="#d62828" stroke-width="4"/>
  <polygon points="180,184 172,170 188,170" fill="#d62828"/>
  <text x="180" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#d62828">weight</text>

  <!-- Right mass -->
  <rect x="390" y="112" width="60" height="52" rx="6" fill="#f4a261" stroke="#b85c20" stroke-width="3"/>
  <text x="420" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>
  <line x1="420" y1="164" x2="420" y2="176" stroke="#d62828" stroke-width="4"/>
  <polygon points="420,184 412,170 428,170" fill="#d62828"/>
  <text x="420" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#d62828">weight</text>

  <!-- Distance markers -->
  <line x1="180" y1="225" x2="300" y2="225" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="218" x2="180" y2="232" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="218" x2="300" y2="232" stroke="#333" stroke-width="2"/>
  <text x="240" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2 m</text>

  <line x1="300" y1="225" x2="420" y2="225" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="218" x2="420" y2="232" stroke="#333" stroke-width="2"/>
  <text x="360" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">x m</text>

  <!-- Equation and result -->
  <text x="300" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222">
    6 × 2 = 4 × 3
  </text>
  <text x="300" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#16803c">
    x = 3 m  •  BALANCED
  </text>
</svg>