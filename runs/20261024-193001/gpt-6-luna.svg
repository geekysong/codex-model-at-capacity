<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4e79"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="85" y="210" width="430" height="20" rx="5" fill="#b8793e" stroke="#5b3a29" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,230 260,300 340,300" fill="#777" stroke="#333" stroke-width="3"/>
  <circle cx="300" cy="220" r="8" fill="#333"/>
  <text x="300" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">pivot</text>

  <!-- Masses -->
  <rect x="125" y="145" width="50" height="50" rx="6" fill="#d9534f" stroke="#8c2f2f" stroke-width="3"/>
  <text x="150" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>

  <rect x="425" y="145" width="50" height="50" rx="6" fill="#4f81bd" stroke="#294d73" stroke-width="3"/>
  <text x="450" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="135" x2="150" y2="92" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="150" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f4e79">force</text>

  <line x1="450" y1="135" x2="450" y2="92" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1f4e79">force</text>

  <!-- Distance dimension lines -->
  <line x1="150" y1="255" x2="300" y2="255" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="247" x2="150" y2="263" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="247" x2="300" y2="263" stroke="#333" stroke-width="2"/>
  <text x="225" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">2 m</text>

  <line x1="300" y1="255" x2="450" y2="255" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="247" x2="450" y2="263" stroke="#333" stroke-width="2"/>
  <text x="375" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#222">3 m</text>

  <!-- Equilibrium statement -->
  <text x="300" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#222">6 × 2 = 4 × 3</text>
  <text x="300" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#188038">BALANCED</text>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222">Static Equilibrium: x = 3 m</text>
</svg>