<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="dimArrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>

  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="26" font-weight="700" fill="#111827">Level Seesaw in Static Equilibrium</text>

  <!-- Seesaw beam -->
  <rect x="85" y="208" width="430" height="24" rx="8" fill="#c08457" stroke="#7c4a2d" stroke-width="3"/>
  <line x1="85" y1="220" x2="515" y2="220" stroke="#f3d0a4" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,232 260,300 340,300" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <circle cx="300" cy="220" r="9" fill="#334155"/>
  <text x="300" y="325" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" fill="#334155">pivot</text>

  <!-- Left hanging mass -->
  <line x1="150" y1="232" x2="150" y2="270" stroke="#374151" stroke-width="3"/>
  <rect x="118" y="270" width="64" height="48" rx="5" fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"/>
  <text x="150" y="300" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="20" font-weight="700" fill="#ffffff">6 kg</text>

  <!-- Right hanging mass -->
  <line x1="450" y1="232" x2="450" y2="270" stroke="#374151" stroke-width="3"/>
  <rect x="418" y="270" width="64" height="48" rx="5" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
  <text x="450" y="300" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="20" font-weight="700" fill="#ffffff">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="255" x2="150" y2="342" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="150" y="365" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17" fill="#1f2937">6g downward</text>

  <line x1="450" y1="255" x2="450" y2="342" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="450" y="365" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="17" fill="#1f2937">4g downward</text>

  <!-- Distance dimension lines -->
  <line x1="150" y1="178" x2="300" y2="178" stroke="#2563eb" stroke-width="3"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <line x1="150" y1="187" x2="150" y2="205" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="187" x2="300" y2="205" stroke="#2563eb" stroke-width="2"/>
  <text x="225" y="168" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="20" font-weight="700" fill="#2563eb">2 m</text>

  <line x1="300" y1="145" x2="450" y2="145" stroke="#2563eb" stroke-width="3"
        marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>
  <line x1="300" y1="154" x2="300" y2="205" stroke="#2563eb" stroke-width="2"/>
  <line x1="450" y1="154" x2="450" y2="205" stroke="#2563eb" stroke-width="2"/>
  <text x="375" y="135" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="20" font-weight="700" fill="#2563eb">x = 3 m</text>

  <!-- Torque equation and status -->
  <rect x="128" y="78" width="344" height="42" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="300" y="106" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="23" font-weight="700" fill="#3730a3">6 × 2 = 4 × 3</text>
  <text x="300" y="395" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="24" font-weight="700" fill="#15803d">balanced</text>
</svg>