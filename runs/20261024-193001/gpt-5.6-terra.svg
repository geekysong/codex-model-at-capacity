<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="105" y="190" width="390" height="20" rx="8" fill="#8b5e3c" stroke="#4b3425" stroke-width="3"/>
  <line x1="120" y1="200" x2="480" y2="200" stroke="#d6a66f" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,210 265,275 335,275" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <line x1="245" y1="275" x2="355" y2="275" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="200" r="8" fill="#f8fafc" stroke="#334155" stroke-width="3"/>

  <!-- Left mass -->
  <rect x="197" y="125" width="46" height="46" rx="6" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
  <text x="220" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">6 kg</text>
  <line x1="220" y1="95" x2="220" y2="122" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="220" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">F = 6g</text>

  <!-- Right mass -->
  <rect x="397" y="125" width="46" height="46" rx="6" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
  <text x="420" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">4 kg</text>
  <line x1="420" y1="95" x2="420" y2="122" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="420" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">F = 4g</text>

  <!-- Pivot reaction -->
  <line x1="300" y1="258" x2="300" y2="225" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="315" y="248" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">support</text>

  <!-- Distance labels -->
  <line x1="220" y1="305" x2="300" y2="305" stroke="#334155" stroke-width="2"/>
  <line x1="220" y1="298" x2="220" y2="312" stroke="#334155" stroke-width="2"/>
  <line x1="300" y1="298" x2="300" y2="312" stroke="#334155" stroke-width="2"/>
  <text x="260" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">2 m</text>

  <line x1="300" y1="350" x2="420" y2="350" stroke="#334155" stroke-width="2"/>
  <line x1="300" y1="343" x2="300" y2="357" stroke="#334155" stroke-width="2"/>
  <line x1="420" y1="343" x2="420" y2="357" stroke="#334155" stroke-width="2"/>
  <text x="360" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">3 m</text>

  <!-- Equation and status -->
  <text x="300" y=" thirty" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827"> </text>
  <text x="300" y=" thirty" text-anchor="middle"></text>
  <text x="300" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827">6 × 2 = 4 × 3</text>
  <text x="300" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#15803d">BALANCED</text>
</svg>