<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">PELICAN EXPRESS</title>
  <desc id="description">A determined pelican pedals a bicycle with a huge fish-filled beak pouch. A tiny basket is labeled oversized baggage. Wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#dbcda8" opacity=".25"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff3d6"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M28 108H772" stroke="#253641" stroke-width="3"/>
  <text x="400" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="2" fill="#253641">PELICAN EXPRESS</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#aa4935">ZERO EMISSIONS. QUESTIONABLE AERODYNAMICS.</text>

  <!-- One seaside cycling scene -->
  <path d="M30 350Q145 326 255 350T485 350T770 350V450H30Z" fill="#b8dcd8"/>
  <path d="M40 377H124M652 377H750M66 391H172M680 399H760" fill="none" stroke="#80b7b8" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 451H770" stroke="#253641" stroke-width="4"/>
  <ellipse cx="410" cy="458" rx="251" ry="13" fill="#253641" opacity=".13"/>

  <!-- Spinning wheels -->
  <g fill="#fff9e9" stroke="#253641">
    <circle cx="242" cy="367" r="80" stroke-width="10"/>
    <circle cx="567" cy="367" r="80" stroke-width="10"/>
  </g>
  <g stroke="#77969a" stroke-width="3">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 242 367" to="360 242 367" dur="1.5s" repeatCount="indefinite"/>
      <path d="M242 292V442M167 367H317M189 314L295 420M189 420L295 314"/>
      <path d="M213 298L271 436M173 338L311 396M173 396L311 338M213 436L271 298"/>
      <path d="M242 292A75 75 0 0 1 295 314" fill="none" stroke="#eea334" stroke-width="5"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 567 367" to="360 567 367" dur="1.5s" repeatCount="indefinite"/>
      <path d="M567 292V442M492 367H642M514 314L620 420M514 420L620 314"/>
      <path d="M538 298L596 436M498 338L636 396M498 396L636 338M538 436L596 298"/>
      <path d="M567 292A75 75 0 0 1 620 314" fill="none" stroke="#eea334" stroke-width="5"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M242 367L328 274L388 367H242L328 274H516L388 367M516 274L567 367" stroke="#253641" stroke-width="15"/>
    <path d="M242 367L328 274L388 367H242M328 274H516L388 367M516 274L567 367" stroke="#e45f46" stroke-width="8"/>
    <path d="M328 274L318 251M516 274L502 234L533 221" stroke="#253641" stroke-width="9"/>
    <path d="M292 249Q316 240 344 250" stroke="#253641" stroke-width="13"/>
    <path d="M528 220L548 220" stroke="#253641" stroke-width="12"/>
    <path d="M242 367L388 351L405 375L242 376Z" stroke="#253641" stroke-width="3"/>
  </g>
  <circle cx="242" cy="367" r="7" fill="#253641"/>
  <circle cx="567" cy="367" r="7" fill="#253641"/>
  <circle cx="388" cy="367" r="20" fill="#eeb646" stroke="#253641" stroke-width="4"/>

  <!-- Absurdly small baggage basket -->
  <path d="M558 261H647L635 312H568Z" fill="#e7c58a" stroke="#253641" stroke-width="4"/>
  <path d="M573 267L578 306M591 265L594 307M610 265V308M630 265L624 307M562 282H642M567 297H638" stroke="#a47d47" stroke-width="2"/>
  <rect x="559" y="276" width="91" height="31" rx="4" fill="#fff9e9" stroke="#253641" stroke-width="2"/>
  <text x="604" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#253641">OVERSIZED</text>
  <text x="604" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#253641">BAGGAGE</text>

  <!-- Rider: whole upper body gently bobs -->
  <g stroke="#253641" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".75s" repeatCount="indefinite"/>
    <path d="M321 247L354 292L374 340" fill="none" stroke="#bd762c" stroke-width="12">
      <animate attributeName="d" values="M321 247L354 292L374 340;M321 247L338 313L403 379;M321 247L354 292L374 340" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M285 218L235 195L250 237L225 231L263 259" fill="#f9fbef" stroke-width="4"/>
    <path d="M264 223C267 179 321 166 371 194C394 207 408 214 427 194L454 158C468 144 484 157 480 177C469 222 436 259 393 267C338 283 270 275 264 223Z" fill="#fffef1" stroke-width="5"/>
    <path d="M288 211C327 192 373 217 388 244C345 255 311 248 288 211Z" fill="#d0dfdb" stroke-width="4"/>
    <path d="M305 216Q339 218 367 240M313 229L338 242" fill="none" stroke="#8ca7a5" stroke-width="3"/>
    <path d="M400 215Q445 227 502 233L528 221" fill="none" stroke-width="14"/>
    <path d="M400 212Q445 224 501 230L526 219" fill="none" stroke="#fffef1" stroke-width="9"/>

    <!-- Head and heroic helmet -->
    <path d="M442 174C421 158 428 128 450 123C480 117 500 137 494 158L479 180Z" fill="#fffef1" stroke-width="4"/>
    <path d="M428 143Q424 113 456 113Q486 111 494 137Z" fill="#e95f48" stroke-width="4"/>
    <path d="M440 122L444 133M455 119L459 132M470 122L474 133" stroke-width="4"/>
    <path d="M431 143L466 180L486 151" fill="none" stroke-width="3"/>
    <ellipse cx="476" cy="148" rx="9" ry="12" fill="white" stroke-width="2"/>
    <circle cx="479" cy="151" r="4" fill="#253641" stroke="none"/>
    <path d="M467 133L485 138" fill="none" stroke-width="4"/>

    <!-- Huge pouch with a visibly unimpressed fish -->
    <path d="M487 161L700 176Q659 261 577 251Q509 242 487 161Z" fill="#f4b856" stroke-width="4"/>
    <path d="M533 205Q579 177 627 201L649 184L644 215L660 230L628 226Q577 246 533 205Z" fill="#8fbbb2" stroke-width="3"/>
    <path d="M573 194L584 180L598 195M566 226L580 237L591 226" fill="#6d9f98" stroke-width="2"/>
    <circle cx="548" cy="205" r="6" fill="#fffef1" stroke-width="2"/>
    <circle cx="546" cy="206" r="2" fill="#253641" stroke="none"/>
    <path d="M541 217H556M564 202Q571 213 563 221" fill="none" stroke-width="2"/>
    <path d="M488 153L711 170L697 182L488 169Z" fill="#f8d16e" stroke-width="4"/>
    <path d="M514 165L681 173" stroke="#bc8336" stroke-width="2"/>
    <path d="M410 155Q400 143 402 138M414 173L401 168" fill="none" stroke="#67aeb6" stroke-width="4"/>
  </g>

  <!-- Animated near leg and pedal -->
  <path d="M344 257L417 303L410 367" fill="none" stroke="#253641" stroke-width="15" stroke-linejoin="round">
    <animate attributeName="d" values="M344 257L417 303L410 367;M344 257L387 319L388 389;M344 257L354 305L366 367;M344 257L380 294L388 345;M344 257L417 303L410 367" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <path d="M344 257L417 303L410 367" fill="none" stroke="#efaa3f" stroke-width="9" stroke-linejoin="round">
    <animate attributeName="d" values="M344 257L417 303L410 367;M344 257L387 319L388 389;M344 257L354 305L366 367;M344 257L380 294L388 345;M344 257L417 303L410 367" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 388 367" to="360 388 367" dur="1.5s" repeatCount="indefinite"/>
    <path d="M366 367H410" stroke="#253641" stroke-width="5"/>
    <g transform="translate(410 367)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
        <path d="M-10 -5L11 -7L25 4H-10Z" fill="#efaa3f" stroke="#253641" stroke-width="3"/>
        <path d="M-12 7H23" stroke="#253641" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <path d="M135 290H185M115 310H170M135 330H157" stroke="#253641" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#253641">He traded his wings for the gig economy.</text>
  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#8c4935">The fish requested contactless delivery.</text>

  <rect x="0" y="548" width="800" height="52" fill="#253641"/>
  <text x="400" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#fff3d6">2026-10-26 10:30:01 SGT (UTC+08:00)</text>
</svg>