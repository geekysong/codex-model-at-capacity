<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of an oversized pelican riding a tiny bicycle.</desc>
  <style>
    .wheel { animation: spin 1.15s linear infinite; transform-origin: center; }
    .rider { animation: bob .55s ease-in-out infinite alternate; transform-origin: 390px 340px; }
    .leg { animation: pedal .575s linear infinite alternate; transform-origin: 400px 385px; }
    .leg2 { animation: pedal .575s linear infinite alternate-reverse; transform-origin: 400px 385px; }
    .note { animation: wobble .7s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(22deg); } }
    @keyframes wobble { to { transform: translateY(-5px) rotate(8deg); } }
  </style>

