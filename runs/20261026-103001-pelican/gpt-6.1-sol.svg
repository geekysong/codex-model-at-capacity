<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with a fish in its enormous bill pouch. The wheels turn and the rider bobs in a looping animation.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#e8dfc9"/>
      <circle cx="18" cy="17" r=".7" fill="#e8dfc9"/>
    </pattern>
    <g id="spokes" stroke="#334d54" stroke-width="3">
      <circle r="66" fill="#f9f3dd" stroke="#243b43" stroke-width="12"/>
      <circle r="55" fill="none" stroke="#d99042" stroke-width="3"/>
      <path d="M-60 0H60M0-60V60M-43-43 43 43M-43 43 43-43"/>
      <circle r="9" fill="#f2ad48" stroke="#243b43" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#faf3df"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" fill="#213d45">THE PELICAN EXPRESS</text>
  <text x="400" y="93" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#65716b">Zero emissions. Suspiciously high fish consumption.</text>

