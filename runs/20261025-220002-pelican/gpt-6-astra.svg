<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with a fish in its enormous bill pouch. The wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#e4dbc6" stroke-width="1"/>
    </pattern>
    <g id="wheel">
      <circle r="69" fill="#fff8e7" stroke="#223741" stroke-width="9"/>
