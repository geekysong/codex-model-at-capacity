  <text x="643" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#e96748">NO FLYING</text>

  <text x="400" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#223741">He cycles to work. The fish gets a company car.</text>
