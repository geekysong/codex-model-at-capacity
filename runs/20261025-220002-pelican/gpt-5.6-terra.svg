<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a pelican confidently riding a bicycle while carrying far too many fish in its enormous beak.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
    .leg-a { transform-box: fill-box; transform-origin: top center; animation: pedalA 1s linear infinite; }
    .leg-b { transform-box: fill-box; transform-origin: top center; animation: pedalB 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedalA { 50% { transform: rotate(28deg); } }
    @keyframes pedalB { 50% { transform: rotate(-28deg); } }
  </style>

