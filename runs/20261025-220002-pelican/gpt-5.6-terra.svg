  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="900" fill="#173951">PELICAN PEDAL PANIC!</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#31536a">“I’m not late — I’m aero-dynamic-ish.”</text>

