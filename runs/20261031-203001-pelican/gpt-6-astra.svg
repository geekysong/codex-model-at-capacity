<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Pelican Express: sustainable delivery, unsustainable appetite</title>
  <desc id="description">A determined pelican pedals a bicycle with an enormous beak full of fish. The wheels spin, its feet pedal, and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 8 0" stroke="#d9e8df" stroke-width="1"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fffdf2" stroke="#253c48" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#83a5a0" stroke-width="2"/>
      <g stroke="#83a5a0" stroke-width="3">
        <path d="M-65 0H65M0-65V65M-46-46 46 46M-46 46 46-46"/>
      </g>
      <path d="M-13-66h26" stroke="#f3ad33" stroke-width="7" stroke-linecap="round"/>
      <circle r="9" fill="#253c48"/>
    </g>
    <g id="fish">
      <path d="M0 0Q16-17 35 0 16 17 0 0L-12-10V10Z" fill="#80c5c1" stroke="#253c48" stroke-width="2"/>
      <circle cx="26" cy="-2" r="2.5" fill="#253c48"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff8e8"/>
  <path d="M0 135Q210 95 403 144T800 125V475H0Z" fill="#dceee7"/>
  <circle cx="690" cy="164" r="37" fill="#f7c65c"/>
  <g fill="#fffdf5" opacity=".85">
    <path d="M67 177q-12-24 15-31 9-26 30-8 28-8 31 20 25 2 22 19Z"/>
    <path d="M516 170q-8-19 12-24 10-21 25-7 23-7 25 16 22 0 21 15Z"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#253c48">
    <text x="400" y="57" font-size="42" font-weight="900" letter-spacing="2">PELICAN EXPRESS</text>
    <text x="400" y="90" font-size="18" font-weight="700">ZERO EMISSIONS. EXCESS BAGGAGE.</text>
  </g>

  <path d="M0 454Q186 440 380 454T800 451V510H0Z" fill="#c0d3b7"/>
  <path d="M0 483H800" stroke="#fff8e8" stroke-width="5" stroke-dasharray="35 22"/>
  <ellipse cx="412" cy="469" rx="251" ry="12" fill="#253c48" opacity=".12"/>

  <g transform="translate(245 390)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(575 390)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g stroke="#253c48" stroke-linejoin="round" stroke-linecap="round">
    <path d="M245 390 331 290 390 390H245L313 263M331 290H527L390 390M527 290 575 390" fill="none" stroke-width="13"/>
    <path d="M245 390 331 290 390 390H245M331 290H527L390 390" fill="none" stroke="#df6646" stroke-width="7"/>
    <path d="M527 290 508 246 539 233" fill="none" stroke-width="10"/>
    <path d="M534 234h25" fill="none" stroke-width="12"/>
    <path d="M291 263h48" fill="none" stroke-width="14"/>
    <path d="M204 299h83M217 301l-8 29" fill="none" stroke-width="6"/>
    <circle cx="390" cy="390" r="25" fill="#e5c680" stroke-width="4"/>
    <circle cx="390" cy="390" r="6" fill="#253c48"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M337 286 369 328 390 368" fill="none" stroke="#bd792a" stroke-width="13" stroke-linecap="round"/>
    <path d="M390 368h30" stroke="#bd792a" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M390 368h30;M390 412h30;M390 368h30" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <g stroke="#253c48" stroke-width="4" stroke-linejoin="round">
      <path d="m285 245-44-25 18 44-28 5 57 21" fill="#f7fbef"/>
      <path d="M285 211Q333 175 383 204 414 233 390 279 357 312 301 290 261 273 285 211Z" fill="#fffef5"/>
      <path d="M365 235Q380 212 382 184L381 156Q386 130 412 139 438 148 426 176L421 208Q427 247 396 265" fill="#fffef5"/>
      <path d="M305 226Q324 209 352 229L392 266Q337 280 305 226Z" fill="#e1e7d7"/>
      <path d="M359 234Q411 252 453 251L527 236" fill="none" stroke-width="13" stroke-linecap="round"/>
      <path d="m519 230 15 7-14 9" fill="#fffef5" stroke-linecap="round"/>
      <path d="M419 170 634 184Q609 241 492 235 444 226 419 185Z" fill="#efb644"/>
      <path d="M431 183Q475 223 524 218 579 219 613 188" fill="#f8d675" stroke-width="2"/>
      <use href="#fish" transform="translate(477 201) rotate(12)"/>
      <use href="#fish" transform="translate(535 203) rotate(-12)"/>
      <path d="M419 169 643 184 421 185Z" fill="#f3aa32"/>
      <circle cx="411" cy="157" r="7" fill="#253c48" stroke="none"/>
      <circle cx="413" cy="155" r="2" fill="white" stroke="none"/>
      <path d="m398 143 19 2" fill="none" stroke-width="5" stroke-linecap="round"/>
      <path d="M372 139Q379 109 407 117 427 121 431 139Z" fill="#df6646"/>
      <path d="M369 140h68M386 121l-3 14M403 119v16M417 125l3 10" fill="none" stroke-width="4"/>
      <path d="M382 184 368 202 384 217 397 188" fill="#df6646"/>
      <path d="m371 199-39-12 22 29 24-7" fill="#df6646"/>
    </g>

    <path d="M346 285 332 331 390 412" fill="none" stroke="#efa437" stroke-width="14" stroke-linecap="round">
      <animate attributeName="d" values="M346 285 332 331 390 412;M346 285 372 319 390 368;M346 285 332 331 390 412" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="m381 412 35 0-9-9" fill="none" stroke="#efa437" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="m381 412 35 0-9-9;m381 368 35 0-9-9;m381 412 35 0-9-9" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(390 390)" stroke="#253c48" stroke-width="5">
    <g>
      <path d="M0-22V22"/>
      <path d="M-11-22h22M-11 22h22" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#253c48">
    <path d="M66 206h166q12 0 12 12v54q0 12-12 12h-39l-24 23 5-23H66q-12 0-12-12v-54q0-12 12-12Z" fill="#fffef5" stroke="#253c48" stroke-width="3"/>
    <text x="149" y="235" text-anchor="middle" font-size="17" font-weight="700">“It’s all</text>
    <text x="149" y="259" text-anchor="middle" font-size="17" font-weight="700">carry-on!”</text>
    <g transform="translate(669 285) rotate(7)">
      <path d="M0 0v163" stroke="#7c8f81" stroke-width="7"/>
      <rect x="-48" y="0" width="102" height="64" rx="7" fill="#fffef5" stroke="#253c48" stroke-width="3"/>
      <text x="3" y="25" text-anchor="middle" font-size="15" font-weight="700">BIKE LANE</text>
      <text x="3" y="47" text-anchor="middle" font-size="14">NO FLYING</text>
    </g>
  </g>

  <rect y="510" width="800" height="90" fill="#fff8e8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#253c48" text-anchor="middle">
    <text x="400" y="542" font-size="21" font-weight="700">He traded his wings for wheels. The bill stayed huge.</text>
    <path d="M160 556H640" stroke="#c1b9a5"/>
    <text x="400" y="581" font-size="16">2026-10-31 20:30:01 SGT (UTC+08:00)</text>
  </g>
</svg>