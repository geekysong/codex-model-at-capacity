<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish peeking out of its bill. The wheels turn and the rider bobs.</desc>
  <defs>
    <style>
      .ink { stroke:#26343b; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 3s linear infinite; }
      .rider { animation:bob 0.8s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f7f1df"/>
  <rect x="20" y="20" width="760" height="560" rx="22" fill="#fffaf0" stroke="#26343b" stroke-width="4"/>
  <text x="400" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="2" fill="#26343b">THE DAILY COMMUTE</text>
  <text x="400" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#b9583f">A VERY IMPORTANT BIRD WITH PLACES TO BE</text>

  <rect x="43" y="125" width="714" height="340" rx="14" fill="#c9e9e5"/>
  <circle cx="666" cy="180" r="29" fill="#f5c65d"/>
  <path d="M44 366 Q130 331 218 355 T400 349 T594 356 T756 341 V465 H44Z" fill="#a9d3be"/>
  <path d="M44 405 Q160 389 277 405 T516 401 T756 404 V465 H44Z" fill="#e5cfa2"/>
  <path d="M44 437 H756" stroke="#d0b98d" stroke-width="3" stroke-dasharray="20 15"/>

  <g opacity=".65" stroke="#fffaf0" stroke-width="6" stroke-linecap="round">
    <path d="M94 197h65 M112 214h78 M75 231h59"/>
    <path d="M575 260h70 M602 278h92"/>
  </g>

  <!-- Wheels -->
  <g class="wheel">
    <circle cx="239" cy="397" r="69" fill="#fffaf0" stroke="#26343b" stroke-width="8"/>
    <circle cx="239" cy="397" r="56" fill="none" stroke="#b5c5bb" stroke-width="3"/>
    <g stroke="#78918a" stroke-width="3">
      <path d="M239 330v134 M172 397h134 M192 350l94 94 M192 444l94-94"/>
    </g>
    <circle cx="239" cy="397" r="8" fill="#26343b"/>
  </g>
  <g class="wheel">
    <circle cx="557" cy="397" r="69" fill="#fffaf0" stroke="#26343b" stroke-width="8"/>
    <circle cx="557" cy="397" r="56" fill="none" stroke="#b5c5bb" stroke-width="3"/>
    <g stroke="#78918a" stroke-width="3">
      <path d="M557 330v134 M490 397h134 M510 350l94 94 M510 444l94-94"/>
    </g>
    <circle cx="557" cy="397" r="8" fill="#26343b"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#dc654a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M239 397 L311 305 L379 397 Z"/>
    <path d="M311 305 L474 305 L379 397"/>
    <path d="M474 305 L557 397"/>
  </g>
  <g class="ink" fill="none">
    <path d="M311 305l-9-27 M282 278h43"/>
    <path d="M557 397l-92-128 11-24h34"/>
    <path d="M510 245q12 0 12 12"/>
  </g>
  <path d="M274 276q18-12 49-5l8 8h-56q-8 0-1-3Z" fill="#26343b"/>
  <g class="pedal">
    <circle cx="379" cy="397" r="19" fill="#fffaf0" stroke="#26343b" stroke-width="4"/>
    <path d="M379 397l17 20 M379 397l-17-20 M389 418h18 M351 376h18" fill="none" stroke="#26343b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Rider -->
  <g class="rider">
    <path d="M331 306 Q347 337 371 360 L398 384" fill="none" stroke="#e39b45" stroke-width="12" stroke-linecap="round"/>
    <path d="M398 384l18 5-16 8-17-3" fill="#e39b45" stroke="#26343b" stroke-width="3" stroke-linejoin="round"/>
    <path d="M302 302 Q282 264 299 219 Q312 187 361 187 Q408 188 419 228 Q432 272 396 302 Q360 328 302 302Z" fill="#fffaf0" class="ink"/>
    <path d="M309 251 Q344 218 389 241 Q387 277 352 286 Q326 291 309 273Z" fill="#d7e1da" stroke="#26343b" stroke-width="4"/>
    <path d="M321 257q21 3 33 16 M332 248q20 2 34 15" fill="none" stroke="#a7b9b1" stroke-width="3" stroke-linecap="round"/>
    <path d="M390 235 Q418 245 452 268 L478 250" fill="none" stroke="#fffaf0" stroke-width="18" stroke-linecap="round"/>
    <path d="M390 235 Q418 245 452 268 L478 250" fill="none" stroke="#26343b" stroke-width="4" stroke-linecap="round"/>
    <path d="M468 251q9-9 17-4" fill="none" stroke="#26343b" stroke-width="5" stroke-linecap="round"/>
    <path d="M306 220 Q278 187 292 153 Q304 121 342 128 Q381 134 382 169 Q382 190 363 207" fill="#fffaf0" class="ink"/>
    <circle cx="348" cy="157" r="13" fill="#fff" stroke="#26343b" stroke-width="3"/>
    <circle cx="352" cy="158" r="5" fill="#26343b"/>
    <path d="M332 137q12-8 25-2" fill="none" stroke="#26343b" stroke-width="4" stroke-linecap="round"/>
    <!-- Beak and pouch -->
    <path d="M362 171 Q418 158 505 181 Q487 194 376 192Z" fill="#f4b54e" class="ink"/>
    <path d="M377 192 Q409 246 473 202 L505 181 Q461 196 377 192Z" fill="#ed9d49" class="ink"/>
    <path d="M388 199q39 12 79 0" fill="none" stroke="#d67e3c" stroke-width="3"/>
    <!-- Fish peeking out -->
    <path d="M432 187q17-16 34-3l10-7-2 12 3 10-11-5q-18 8-34-7Z" fill="#76b6bd" stroke="#26343b" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="443" cy="186" r="2.5" fill="#26343b"/>
    <path d="M288 145q20-24 67-17l-5-12q-35-10-55 9Z" fill="#dc654a" stroke="#26343b" stroke-width="4" stroke-linejoin="round"/>
    <path d="M290 143q-11 4-18 12 24 1 43-8" fill="#dc654a" stroke="#26343b" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <path d="M626 341q20 3 25 18 M645 326q27 7 35 29" fill="none" stroke="#26343b" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#26343b">He insists this counts as sustainable seafood delivery.</text>
  <path d="M65 532H735" stroke="#d9cbb1" stroke-width="2"/>
  <text x="400" y="559" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#46565b">2026-10-31 20:32:30 SGT (UTC+08:00)</text>
</svg>