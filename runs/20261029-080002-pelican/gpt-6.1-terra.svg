  <text x="400" y="62" text-anchor="middle" class="text" font-size="38" font-weight="900">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="96" text-anchor="middle" class="text" font-size="20" font-style="italic">One bird. One bicycle. Zero sense of direction.</text>

