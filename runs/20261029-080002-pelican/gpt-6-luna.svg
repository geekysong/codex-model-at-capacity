<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly ignoring traffic rules.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe7ff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <style>
      .ink{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheelSpin{transform-box:fill-box;transform-origin:center;animation:spin 2s linear infinite}
      .bob{animation:bob .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      .pedalSpin{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd76a" opacity=".9"/>
  <path d="M0 420 Q130 380 260 420 T520 420 T800 410 V520 H0Z" fill="#8bd17c"/>
  <path d="M0 505 Q180 470 350 510 T800 495 V600 H0Z" fill="#5cab62"/>
  <path d="M0 510 H800" stroke="#315b3b" stroke-width="10"/>

  <text x="400" y="58" text-anchor="middle" font-family="Verdana,sans-serif" font-size="34" font-weight="700" fill="#17202a">THE GREAT PELICAN COMMUTE</text>
  <text x="400" y="92" text-anchor="middle" font-family="Verdana,sans-serif" font-size="19" fill="#263746">“When your beak is bigger than your parking space.”</text>

  <!-- bicycle -->
  <g class="ink" fill="none">
    <circle cx="220" cy="430" r="78" fill="#e9f5ff"/>
    <circle cx="580" cy="430" r="78" fill="#e9f5ff"/>
    <g class="wheelSpin" stroke="#58798c" stroke-width="3">
      <path d="M220 352V508M142 430H298M165 375L275 485M165 485L275 375"/>
    </g>
    <g class="wheelSpin" stroke="#58798c" stroke-width="3">
      <path d="M580 352V508M502 430H658M525 375L635 485M525 485L635 375"/>
    </g>
    <path d="M220 430 L330 330 L430 430 L220 430 L370 430 L330 330 L580 430" stroke="#d94b4b" stroke-width="10"/>
    <path d="M430 430 L470 330 L545 330" stroke="#d94b4b" stroke-width="10"/>
    <path d="M470 330 L455 300 M545 330 L570 300" stroke="#17202a" stroke-width="7"/>
    <circle cx="430" cy="430" r="19" fill="#ffd35a"/>
    <g class="pedalSpin" stroke="#17202a" stroke-width="6">
      <path d="M430 430 L462 455 M430 430 L398 405"/>
      <path d="M462 455 h25 M398 405 h-25"/>
    </g>
  </g>

  <!-- pelican -->
  <g class="bob">
    <ellipse cx="380" cy="275" rx="94" ry="116" fill="#f4f1df" class="ink"/>
    <path d="M315 250 Q250 205 258 150 Q267 103 316 124 Q356 141 365 205Z" fill="#d9e2e8" class="ink"/>
    <circle cx="352" cy="135" r="56" fill="#f4f1df" class="ink"/>
    <circle cx="369" cy="127" r="8" fill="#17202a"/>
    <path d="M394 146 Q492 123 560 159 Q489 184 396 173Z" fill="#f2a23a" class="ink"/>
    <path d="M402 160 Q477 167 535 177 Q474 214 402 183Z" fill="#ef8e32" class="ink"/>
    <path d="M405 153 Q451 152 493 159" fill="none" stroke="#8b4c24" stroke-width="4"/>
    <path d="M330 216 Q376 250 424 220" fill="none" stroke="#17202a" stroke-width="7"/>
    <path d="M334 345 L323 385 M420 345 L437 385" class="ink" fill="none"/>
    <path d="M308 386 Q331 396 348 386 M422 386 Q444 396 460 386" class="ink" fill="none"/>
    <path d="M324 296 Q366 330 422 299" fill="none" stroke="#b8c5cc" stroke-width="9"/>
    <path d="M334 260 L278 310 L350 330" fill="#d9e2e8" class="ink"/>
    <path d="M426 260 L489 309 L421 330" fill="#d9e2e8" class="ink"/>
    <path d="M344 385 L330 430 M420 385 L440 430" class="ink" fill="none"/>
  </g>

  <path d="M575 235 Q625 215 665 240" fill="none" stroke="#17202a" stroke-width="5"/>
  <text x="620" y="220" text-anchor="middle" font-family="Verdana,sans-serif" font-size="18" font-weight="700" fill="#17202a">HONK!</text>

  <rect x="70" y="535" width="660" height="42" rx="12" fill="#ffffff" opacity=".88"/>
  <text x="400" y="562" text-anchor="middle" font-family="Verdana,sans-serif" font-size="16" fill="#17202a">2026-10-29 08:01:37 SGT (UTC+08:00)</text>
</svg>