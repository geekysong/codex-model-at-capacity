<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #111827; font-size: 20px; }
      .small { font-family: Arial, sans-serif; fill: #111827; font-size: 17px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Level seesaw -->
  <line x1="90" y1="190" x2="510" y2="190" stroke="#374151" stroke-width="14" stroke-linecap="round"/>
  <line x1="90" y1="181" x2="510" y2="181" stroke="#9ca3af" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,190 265,270 335,270" fill="#64748b" stroke="#1f2937" stroke-width="3"/>
  <circle cx="300" cy="190" r="9" fill="#f59e0b" stroke="#1f2937" stroke-width="3"/>
  <text x="300" y="300" text-anchor="middle" class="small">pivot</text>

  <!-- Masses -->
  <rect x="145" y="220" width="70" height="55" rx="5" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
  <text x="180" y="254" text-anchor="middle" class="label" fill="#1e3a8a">6 kg</text>

  <rect x="385" y="220" width="70" height="55" rx="5" fill="#fca5a5" stroke="#991b1b" stroke-width="3"/>
  <text x="420" y="254" text-anchor="middle" class="label" fill="#991b1b">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="155" x2="180" y2="215" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="180" y="140" text-anchor="middle" class="small">F = 6g</text>

  <line x1="420" y1="155" x2="420" y2="215" stroke="#1f2937" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="420" y="140" text-anchor="middle" class="small">F = 4g</text>

  <!-- Distance markers -->
  <line x1="180" y1="325" x2="300" y2="325" stroke="#2563eb" stroke-width="3"/>
  <line x1="180" y1="317" x2="180" y2="333" stroke="#2563eb" stroke-width="3"/>
  <line x1="300" y1="317" x2="300" y2="333" stroke="#2563eb" stroke-width="3"/>
  <text x="240" y="350" text-anchor="middle" class="small">2 m</text>

  <line x1="300" y1="325" x2="420" y2="325" stroke="#dc2626" stroke-width="3"/>
  <line x1="420" y1="317" x2="420" y2="333" stroke="#dc2626" stroke-width="3"/>
  <text x="360" y="350" text-anchor="middle" class="small">x = 3 m</text>

  <!-- Equation and status -->
  <text x="300" y="55" text-anchor="middle" class="label" font-weight="bold">6 × 2 = 4 × 3</text>
  <text x="300" y="88" text-anchor="middle" class="label" fill="#15803d" font-weight="bold">balanced</text>
</svg>