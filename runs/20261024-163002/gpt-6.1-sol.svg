<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4e79"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #17202a; font-size: 20px; }
      .small { font-family: Arial, sans-serif; fill: #17202a; font-size: 17px; }
    </style>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <!-- Seesaw beam -->
  <rect x="90" y="198" width="420" height="24" rx="6" fill="#c88745" stroke="#6e431f" stroke-width="3"/>
  <line x1="300" y1="190" x2="300" y2="230" stroke="#6e431f" stroke-width="3"/>

  <!-- Pivot -->
  <path d="M270 300 L300 220 L330 300 Z" fill="#7f8c8d" stroke="#34495e" stroke-width="3"/>
  <line x1="255" y1="300" x2="345" y2="300" stroke="#34495e" stroke-width="5"/>
  <circle cx="300" cy="210" r="8" fill="#34495e"/>

  <!-- Masses -->
  <rect x="145" y="130" width="70" height="68" rx="8" fill="#e74c3c" stroke="#922b21" stroke-width="3"/>
  <rect x="385" y="150" width="70" height="48" rx="8" fill="#3498db" stroke="#1b4f72" stroke-width="3"/>
  <text x="180" y="171" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="white">6 kg</text>
  <text x="420" y="180" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="105" x2="180" y2="128" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="420" y1="125" x2="420" y2="148" stroke="#1f4e79" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="180" y="92" text-anchor="middle" class="small">weight</text>
  <text x="420" y="112" text-anchor="middle" class="small">weight</text>

  <!-- Distance dimension lines -->
  <line x1="180" y1="245" x2="300" y2="245" stroke="#34495e" stroke-width="2"/>
  <line x1="180" y1="237" x2="180" y2="253" stroke="#34495e" stroke-width="2"/>
  <line x1="300" y1="237" x2="300" y2="253" stroke="#34495e" stroke-width="2"/>
  <text x="240" y="270" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="245" x2="420" y2="245" stroke="#34495e" stroke-width="2"/>
  <line x1="420" y1="237" x2="420" y2="253" stroke="#34495e" stroke-width="2"/>
  <text x="360" y="270" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equation and result -->
  <text x="300" y="335" text-anchor="middle" class="label" font-weight="bold">6 × 2 = 4 × 3</text>
  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#228b22">BALANCED</text>
</svg>