<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b22222"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#222">
    Level Seesaw — Static Equilibrium
  </text>

  <!-- seesaw beam -->
  <rect x="95" y="188" width="410" height="24" rx="6" fill="#c58b45" stroke="#6b461f" stroke-width="3"/>

  <!-- pivot -->
  <polygon points="300,212 260,290 340,290" fill="#777" stroke="#444" stroke-width="3"/>
  <circle cx="300" cy="200" r="8" fill="#333"/>
  <text x="300" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#333">pivot</text>

  <!-- left mass -->
  <rect x="105" y="112" width="72" height="54" rx="8" fill="#8ecae6" stroke="#1f4e79" stroke-width="3"/>
  <text x="141" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#123">6 kg</text>
  <line x1="141" y1="166" x2="141" y2="245" stroke="#b22222" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="141" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#b22222">6g downward</text>

  <!-- right mass -->
  <rect x="423" y="112" width="72" height="54" rx="8" fill="#ffcc80" stroke="#9a5b00" stroke-width="3"/>
  <text x="459" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#5a3500">4 kg</text>
  <line x1="459" y1="166" x2="459" y2="245" stroke="#b22222" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="459" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#b22222">4g downward</text>

  <!-- distance indicators -->
  <line x1="141" y1="350" x2="300" y2="350" stroke="#1f4e79" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="300" y1="350" x2="459" y2="350" stroke="#1f4e79" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="141" y1="337" x2="141" y2="360" stroke="#1f4e79" stroke-width="2"/>
  <line x1="300" y1="337" x2="300" y2="360" stroke="#1f4e79" stroke-width="2"/>
  <line x1="459" y1="337" x2="459" y2="360" stroke="#1f4e79" stroke-width="2"/>
  <text x="220" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1f4e79">2 m</text>
  <text x="380" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#1f4e79">x = 3 m</text>

  <!-- torque equation -->
  <text x="300" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#222">
    Torque balance: 6 × 2 = 4 × 3
  </text>
  <text x="300" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2e7d32">
    balanced
  </text>
</svg>