<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#596273"/>
      <stop offset="1" stop-color="#303641"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17202b;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17202b}
      .wheel{transform-box:fill-box;transform-origin:center}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="108" r="54" fill="#ffd86b" opacity=".9"/>
  <path d="M0 360 Q120 310 240 350 T480 340 T800 350 V600 H0Z" fill="#83c96b"/>
  <path d="M0 420 Q190 385 390 425 T800 415 V600 H0Z" fill="url(#road)"/>
  <path d="M0 502 Q170 475 350 505 T800 500" fill="none" stroke="#f6d86a" stroke-width="8" stroke-dasharray="28 24"/>

  <g aria-label="title">
    <rect x="34" y="26" width="732" height="78" rx="18" fill="#fff7d6" class="ink" filter="url(#shadow)"/>
    <text x="400" y="73" text-anchor="middle" class="label" font-size="38" font-weight="900">THE GREAT PELICAN PEDAL</text>
    <text x="400" y="96" text-anchor="middle" class="label" font-size="15" font-weight="700">When your beak is bigger than your handlebars</text>
  </g>

  <g id="bike" filter="url(#shadow)">
    <g class="wheel" style="animation:spin 1.8s linear infinite">
      <circle cx="278" cy="450" r="66" fill="#d9f4ff" stroke="#17202b" stroke-width="8"/>
      <circle cx="278" cy="450" r="7" fill="#17202b"/>
      <path d="M278 384V516M212 450H344M231 403L325 497M325 403L231 497" fill="none" stroke="#4b8199" stroke-width="4"/>
    </g>
    <g class="wheel" style="animation:spin 1.8s linear infinite">
      <circle cx="558" cy="450" r="66" fill="#d9f4ff" stroke="#17202b" stroke-width="8"/>
      <circle cx="558" cy="450" r="7" fill="#17202b"/>
      <path d="M558 384V516M492 450H624M511 403L605 497M605 403L511 497" fill="none" stroke="#4b8199" stroke-width="4"/>
    </g>
    <path d="M278 450 L365 370 L470 450 L558 450 L470 450 L410 330 Z" fill="none" class="ink"/>
    <path d="M365 370 L410 330 L452 330" fill="none" class="ink"/>
    <path d="M558 450 L548 349 L584 331" fill="none" class="ink"/>
    <path d="M535 329 L594 329" class="ink"/>
    <circle cx="470" cy="450" r="17" fill="#ffbf45" class="ink"/>
    <g style="animation:pedal .9s ease-in-out infinite alternate">
      <path d="M470 450 L433 422 M470 450 L502 479" fill="none" class="ink"/>
      <circle cx="427" cy="418" r="8" fill="#ffbf45" class="ink"/>
      <circle cx="508" cy="484" r="8" fill="#ffbf45" class="ink"/>
    </g>
    <path d="M400 329 L400 302" class="ink"/>
    <path d="M383 302 H418" class="ink"/>
  </g>

  <g id="pelican" style="animation:bob 1.8s ease-in-out infinite" filter="url(#shadow)">
    <ellipse cx="414" cy="268" rx="75" ry="94" fill="#f8f5ec" class="ink"/>
    <path d="M365 250 Q326 205 357 169 Q388 137 429 166 Q452 184 443 224 Q431 259 414 280Z" fill="#d9e6e9" class="ink"/>
    <circle cx="408" cy="187" r="10" fill="#fff" class="ink"/>
    <circle cx="411" cy="187" r="4" fill="#17202b"/>
    <path d="M358 208 Q298 193 273 218 Q300 249 371 238Z" fill="#f29a43" class="ink"/>
    <path d="M287 221 Q327 231 367 231" fill="none" stroke="#c6672b" stroke-width="4"/>
    <path d="M385 280 Q418 305 455 280" fill="none" class="ink"/>
    <path d="M380 335 L365 370 M442 337 L470 365" fill="none" stroke="#f29a43" stroke-width="13"/>
    <path d="M356 166 Q373 129 411 137 Q438 143 448 171" fill="#f7fbff" class="ink"/>
    <path d="M370 151 Q405 119 438 151" fill="none" stroke="#e4b83c" stroke-width="8"/>
    <path d="M382 247 Q416 267 442 241" fill="none" stroke="#d3a22c" stroke-width="7"/>
    <text x="408" y="214" text-anchor="middle" class="label" font-size="14" font-weight="900" fill="#b54f28">HONK!</text>
  </g>

  <g aria-label="caption">
    <rect x="92" y="535" width="616" height="34" rx="12" fill="#fff7d6" class="ink"/>
    <text x="400" y="558" text-anchor="middle" class="label" font-size="18" font-weight="800">“He insists it’s a two-wheeler… technically, he has two feet.”</text>
  </g>

  <text x="400" y="590" text-anchor="middle" class="label" font-size="13" font-weight="700">2026-10-27 22:31:01 SGT (UTC+08:00)</text>

  <style>
    @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes pedal{from{transform:rotate(-10deg);transform-origin:470px 450px}to{transform:rotate(10deg);transform-origin:470px 450px}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  </style>
</svg>