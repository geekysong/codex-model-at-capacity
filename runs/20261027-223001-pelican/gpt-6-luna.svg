<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an oversized fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59616b"/>
      <stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#173044" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#17212b;stroke-width:5;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
      .small{font-size:16px;font-weight:700}
      .caption{font-size:20px;font-weight:700}
      .title{font-size:38px;font-weight:900;letter-spacing:1px}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
      .bob{animation:bob .8s ease-in-out infinite alternate}
      .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="54" fill="#fff4a8" opacity=".9"/>
  <path d="M0 350 Q120 290 250 345 T520 330 T800 350 V430 H0Z" fill="#9bc7a2"/>
  <path d="M0 398 Q150 360 300 395 T600 390 T800 405 V470 H0Z" fill="#78ad82"/>
  <path d="M0 438 H800 V570 H0Z" fill="url(#road)"/>
  <path d="M0 498 H800" stroke="#f4d35e" stroke-width="8" stroke-dasharray="55 32"/>
  <path d="M0 438 H800" stroke="#1d252c" stroke-width="8"/>

  <g transform="translate(400 46)">
    <rect x="-300" y="-5" width="600" height="62" rx="18" fill="#fffdf3" class="ink" filter="url(#shadow)"/>
    <text x="0" y="38" text-anchor="middle" class="label title">THE PELICAN PEDAL PANIC</text>
  </g>

  <g transform="translate(0 10)" class="bob">
    <!-- bicycle frame -->
    <g class="ink" fill="none">
      <path d="M275 420 L350 300 L455 420 L275 420 L405 420 L350 300 L430 300"/>
      <path d="M430 300 L470 270"/>
      <path d="M463 267 L492 267"/>
      <path d="M275 420 L250 395"/>
      <path d="M250 395 L230 395"/>
    </g>

    <!-- wheels -->
    <g class="wheel">
      <circle cx="275" cy="420" r="67" fill="#202a33" class="ink"/>
      <circle cx="275" cy="420" r="53" fill="#dceaf0" stroke="#17212b" stroke-width="4"/>
      <path d="M275 367V473 M222 420H328 M237 382L313 458 M313 382L237 458" stroke="#6d8794" stroke-width="3"/>
      <circle cx="275" cy="420" r="8" fill="#f4d35e" class="ink"/>
    </g>
    <g class="wheel">
      <circle cx="455" cy="420" r="67" fill="#202a33" class="ink"/>
      <circle cx="455" cy="420" r="53" fill="#dceaf0" stroke="#17212b" stroke-width="4"/>
      <path d="M455 367V473 M402 420H508 M417 382L493 458 M493 382L417 458" stroke="#6d8794" stroke-width="3"/>
      <circle cx="455" cy="420" r="8" fill="#f4d35e" class="ink"/>
    </g>

    <!-- crank and pedals -->
    <g class="pedal">
      <circle cx="350" cy="420" r="13" fill="#f4d35e" class="ink"/>
      <path d="M350 420 L374 397 M350 420 L326 443" class="ink"/>
      <path d="M370 394h18 M318 446h18" class="ink"/>
    </g>

    <!-- pelican body -->
    <ellipse cx="363" cy="246" rx="83" ry="91" fill="#f4f1df" class="ink"/>
    <path d="M315 216 Q360 160 414 198 Q437 221 424 270 Q400 244 370 248 Q340 253 315 278 Q300 246 315 216Z" fill="#d8e1df" class="ink"/>
    <ellipse cx="350" cy="162" rx="49" ry="52" fill="#f4f1df" class="ink"/>
    <path d="M315 163 Q354 137 394 157 L455 176 Q470 182 455 194 L389 205 Q352 210 315 190Z" fill="#f2a65a" class="ink"/>
    <path d="M329 179 Q379 188 447 181" fill="none" stroke="#b76438" stroke-width="4"/>
    <circle cx="369" cy="151" r="7" fill="#17212b"/>
    <path d="M339 133 Q354 121 370 128" fill="none" class="ink"/>
    <path d="M332 245 Q352 267 380 270" fill="none" class="ink"/>
    <path d="M342 306 L326 370" class="ink" fill="none"/>
    <path d="M399 304 L414 369" class="ink" fill="none"/>
    <path d="M315 366 q18 -12 34 0 l-4 12 h-34z" fill="#f2a65a" class="ink"/>
    <path d="M402 366 q18 -12 34 0 l4 12 h-34z" fill="#f2a65a" class="ink"/>

    <!-- wing gripping handlebar -->
    <path d="M410 230 Q439 250 462 278" fill="none" class="ink"/>
    <path d="M456 278 q9 9 18 0" fill="none" class="ink"/>

    <!-- fish cargo -->
    <g transform="translate(245 183) rotate(-10)">
      <path d="M0 26 Q48 -8 105 25 Q48 58 0 26Z" fill="#74c6d8" class="ink"/>
      <path d="M104 25 L130 7 L126 45Z" fill="#5baabd" class="ink"/>
      <circle cx="22" cy="22" r="5" fill="#17212b"/>
      <path d="M54 8 Q67 25 54 43" fill="none" stroke="#287f94" stroke-width="4"/>
    </g>
    <path d="M278 208 Q255 222 244 241" fill="none" class="ink"/>
    <path d="M244 241 l-13 -6 M244 241 l-4 14" class="ink"/>
  </g>

  <g transform="translate(555 300)">
    <rect x="-8" y="-32" width="190" height="78" rx="16" fill="#fffdf3" class="ink" filter="url(#shadow)"/>
    <path d="M0 46 l-18 22 34 -15" fill="#fffdf3" class="ink"/>
    <text x="86" y="0" text-anchor="middle" class="label caption">“I call this</text>
    <text x="86" y="25" text-anchor="middle" class="label caption">beak-to-wheel!”</text>
  </g>

  <text x="400" y="548" text-anchor="middle" class="label caption" fill="#fffdf3">A bird with a big beak, a bigger fish, and absolutely no brakes.</text>
  <text x="400" y="584" text-anchor="middle" class="label small">2026-10-27 22:31:27 SGT (UTC+08:00)</text>
</svg>