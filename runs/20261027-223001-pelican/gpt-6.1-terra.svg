  <path d="M120 375 l18 -12 M120 375 l20 5 M650 320 l18 -8 M650 320 l18 10" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>

  <rect x="35" y="535" width="730" height="48" rx="14" fill="#fff8df" stroke="#17324d" stroke-width="3"/>
  <text x="400" y="556" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#17324d">
