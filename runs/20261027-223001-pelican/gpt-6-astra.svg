<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon pelican pedals a bicycle while proudly carrying an absurdly large beak.</desc>
  <style>
    .ink{stroke:#252525;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
    .label{font-family:Arial,sans-serif;fill:#252525}
  </style>

  <rect width="800" height="600" fill="#bfe8f5"/>
  <rect y="430" width="800" height="170" fill="#8bd17c"/>
  <path d="M0 430 Q180 390 360 430 T800 430" fill="none" stroke="#5aa85a" stroke-width="8"/>

  <text x="400" y="60" text-anchor="middle" class="label" font-size="40" font-weight="900">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="21" font-weight="700">A pelican proves that every commute needs more cargo space.</text>

  <g id="bike">
    <g fill="none" class="ink">
      <circle cx="240" cy="455" r="78" fill="#e9f7ff"/>
      <circle cx="560" cy="455" r="78" fill="#e9f7ff"/>
      <path d="M240 455 L330 330 L430 455 L240 455 M330 330 L560 455 M430 455 L500 330 L560 455 M470 330 L530 330"/>
      <path d="M322 330 L300 300 M290 300 L325 300"/>
      <path d="M490 330 L510 300 M495 300 L530 300"/>
    </g>
    <g stroke="#6ca6b8" stroke-width="3">
      <path d="M240 377V533 M162 455H318 M185 400L295 510 M185 510L295 400"/>
      <path d="M560 377V533 M482 455H638 M505 400L615 510 M505 510L615 400"/>
    </g>
    <g fill="#252525">
      <circle cx="330" cy="455" r="13"/>
      <path d="M330 455 L365 420 M330 455 L300 490" stroke="#252525" stroke-width="8"/>
    </g>
    <g class="ink" fill="#f4c542">
      <ellipse cx="365" cy="420" rx="16" ry="9"/>
      <ellipse cx="300" cy="490" rx="16" ry="9"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 330 455" to="360 330 455" dur="2s" repeatCount="indefinite"/>
      <path d="M330 455 L365 420 M330 455 L300 490" stroke="#252525" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="365" cy="420" rx="16" ry="9" fill="#f4c542" class="ink"/>
      <ellipse cx="300" cy="490" rx="16" ry="9" fill="#f4c542" class="ink"/>
    </g>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="395" cy="300" rx="72" ry="88" fill="#f7f2e8" class="ink"/>
    <path d="M350 270 Q330 225 355 190 Q385 155 430 180 Q458 198 448 238 Q432 278 395 285Z" fill="#f7f2e8" class="ink"/>
    <path d="M426 210 Q500 225 585 265 Q610 278 585 300 Q500 294 425 260Z" fill="#f28d3c" class="ink"/>
    <path d="M438 255 Q510 270 575 283 Q530 340 447 300Z" fill="#ffb34d" class="ink"/>
    <circle cx="405" cy="205" r="10" fill="#252525"/>
    <circle cx="408" cy="201" r="3" fill="white"/>
    <path d="M365 180 Q340 145 365 125" fill="none" class="ink"/>
    <path d="M378 177 Q360 135 390 120" fill="none" class="ink"/>
    <path d="M350 300 Q290 335 285 390" fill="none" class="ink"/>
    <path d="M430 305 Q475 345 480 390" fill="none" class="ink"/>
    <path d="M285 390 L270 420 M480 390 L500 420" fill="none" class="ink"/>
    <path d="M268 420 L292 420 M488 420 L512 420" fill="none" class="ink"/>
    <path d="M345 350 Q395 370 445 350" fill="none" stroke="#d65c33" stroke-width="10"/>
    <path d="M360 352 Q395 385 430 352" fill="none" stroke="#252525" stroke-width="5"/>
    <path d="M365 260 Q395 280 425 260" fill="none" stroke="#252525" stroke-width="5"/>
  </g>

  <g transform="translate(95 150)">
    <path d="M0 0 Q35 -35 70 0" fill="none" stroke="#ffffff" stroke-width="7"/>
    <path d="M20 15 Q55 -20 90 15" fill="none" stroke="#ffffff" stroke-width="7"/>
  </g>

  <text x="650" y="345" text-anchor="middle" class="label" font-size="23" font-weight="800" transform="rotate(8 650 345)">“Pedal faster—</text>
  <text x="650" y="372" text-anchor="middle" class="label" font-size="23" font-weight="800" transform="rotate(8 650 372)">my beak is a spoiler!”</text>

  <rect x="35" y="545" width="730" height="38" rx="12" fill="#fff7d6" stroke="#252525" stroke-width="3"/>
  <text x="400" y="571" text-anchor="middle" class="label" font-size="18" font-weight="700">2026-10-27 22:30:01 SGT (UTC+08:00)</text>
</svg>