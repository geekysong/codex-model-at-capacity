<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#fff4d6" fill-opacity="0.92"/>
      <path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#754c24" stroke-width="1.5"/>
    </pattern>
  </defs>

  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold">
    Union area: 80,000 px²
  </text>

  <!-- Rectangle fills -->
  <rect x="50" y="50" width="200" height="150" fill="#ef5350" fill-opacity="0.42"/>
  <rect x="150" y="120" width="200" height="150" fill="#42a5f5" fill-opacity="0.42"/>
  <rect x="320" y="200" width="200" height="150" fill="#66bb6a" fill-opacity="0.42"/>

  <!-- Pairwise overlaps: A∩B = 100×80; B∩C = 30×70; A∩C = none -->
  <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

  <!-- Rectangle outlines -->
  <rect x="50" y="50" width="200" height="150" fill="none" stroke="#222" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="none" stroke="#222" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="none" stroke="#222" stroke-width="2"/>

  <!-- Labels in non-overlapped regions -->
  <text x="70" y="92" font-family="Arial, sans-serif" font-size="18" font-weight="bold">A</text>
  <text x="270" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">B</text>
  <text x="470" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold">C</text>

  <!-- Overlap annotations -->
  <text x="200" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold">A∩B</text>
  <text x="200" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">8,000 px²</text>
  <text x="335" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold">B∩C</text>
  <text x="335" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">2,100 px²</text>

  <text x="300" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="12">
    A∩C: no overlap (0 px²)
  </text>
  <text x="300" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">
    2026-11-03 08:03:10 SGT (UTC+08:00)
  </text>
</svg>