      </g>
      <path d="M-24-61A66 66 0 0 1 24-61" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle r="9" fill="#24343b"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5da"/>
