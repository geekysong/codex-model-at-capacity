  <g font-family="sans-serif" fill="#24343b">
    <path d="M75 131H275Q288 131 288 144V181Q288 194 275 194H228L248 216L205 194H75Q62 194 62 181V144Q62 131 75 131Z" fill="#fffdf5" stroke="#24343b" stroke-width="3"/>
    <text x="175" y="157" text-anchor="middle" font-size="18" font-weight="bold">“They said I'd be</text>
    <text x="175" y="181" text-anchor="middle" font-size="18" font-weight="bold">my own boss.”</text>
    <g transform="translate(597 282) rotate(7)">
      <rect width="157" height="49" rx="5" fill="#fff5da" stroke="#24343b" stroke-width="3"/>
      <text x="78.5" y="20" text-anchor="middle" font-size="13" font-weight="bold">DELIVERY FEE: 1 FISH</text>
      <text x="78.5" y="39" text-anchor="middle" font-size="13" font-weight="bold" fill="#b84b32">PLATFORM CUT: 2 FISH</text>
    </g>
  </g>

  <rect x="24" y="498" width="752" height="85" rx="10" fill="#24343b"/>
  <text x="400" y="527" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#fff5da">He pedals for peanuts. His bill demands fish.</text>
  <path d="M68 541H732" stroke="#65716e"/>
  <text x="400" y="566" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#fff5da">2026-10-30 20:30:01 SGT (UTC+08:00)</text>
