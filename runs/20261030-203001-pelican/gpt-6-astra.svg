  <path d="M35 106H765" stroke="#24343b" stroke-width="3"/>
  <text x="400" y="55" text-anchor="middle" font-family="sans-serif" font-size="35" font-weight="900" fill="#24343b">THE PELICAN DELIVERY ECONOMY</text>
  <text x="400" y="87" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#b84b32">ZERO EMISSIONS. ENORMOUS BILL.</text>

