<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A determined pelican pedals a bicycle with a gigantic bill full of fish. The wheels spin and the pelican bobs in a looping cartoon animation.</desc>
  <defs>
    <pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r=".7" fill="#e4d8b7"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fff8e8" stroke="#24343b" stroke-width="10"/>
