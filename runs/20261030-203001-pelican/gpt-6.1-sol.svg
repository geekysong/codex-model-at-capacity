<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Power: a beak too big to fail</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with a huge fish-filled bill, passing a fuel-price sign. Wheels spin, feet pedal, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 20 20 0" stroke="#eef3ed" stroke-width="1"/>
    </pattern>
