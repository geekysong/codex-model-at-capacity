<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical pelican rides a bicycle while trying to deliver an enormous fish.</desc>
  <style>
    .ink{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .wheel{fill:none;stroke:#17202a;stroke-width:8}
    .spoke{stroke:#65727e;stroke-width:2}
    .label{font-family:Arial,sans-serif;fill:#17202a}
    .bob{animation:bob 1.2s ease-in-out infinite}
    .pedal{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
    .wheelspin{animation:spin 2.2s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <rect width="800" height="600" fill="#d9f4ff"/>
  <path d="M0 425 Q150 390 300 425 T600 425 T800 420 V600 H0Z" fill="#b9e6a5"/>
  <path d="M0 478 Q180 455 360 480 T800 470" fill="none" stroke="#7bb56b" stroke-width="8"/>
  <path d="M0 535 Q200 510 400 535 T800 528" fill="none" stroke="#8cc47a" stroke-width="5"/>

  <g class="label">
    <text x="400" y="58" text-anchor="middle" font-size="38" font-weight="900">PELICAN PEDAL PANIC</text>
    <text x="400" y="91" text-anchor="middle" font-size="18" font-weight="700">“Delivering fish faster than common sense.”</text>
  </g>

  <g class="bob">
    <!-- bicycle -->
    <g>
      <circle class="wheel" cx="245" cy="420" r=" seventy"/>
      <circle class="wheel" cx="555" cy="420" r="70"/>
      <g class="wheelspin">
        <path class="spoke" d="M245 350V490M175 420H315M196 371L294 469M294 371L196 469"/>
      </g>
      <g class="wheelspin">
        <path class="spoke" d="M555 350V490M485 420H625M506 371L604 469M604 371L506 469"/>
      </g>
      <path d="M245 420 L330 315 L430 420 L245 420 M330 315 L555 420 M430 420 L470 330 L520 330" fill="none" class="ink"/>
      <path d="M320 315 L300 285" fill="none" class="ink"/>
      <path d="M292 282 L325 282" fill="none" class="ink"/>
      <path d="M430 420 L470 420" fill="none" class="ink"/>
      <g class="pedal">
        <circle cx="430" cy="420" r="15" fill="#f4b942" class="ink"/>
        <path d="M430 420 L455 440 M430 420 L410 400" fill="none" class="ink"/>
        <path d="M450 441h20 M400 399h-20" class="ink"/>
      </g>
      <path d="M320 315 Q350 300 380 315" fill="none" class="ink"/>
    </g>

    <!-- pelican -->
    <ellipse cx="365" cy="245" rx="78" ry="92" fill="#f5f7f9" class="ink"/>
    <path d="M315 220 Q285 170 320 130 Q365 90 414 125 Q448 150 424 205 Q405 238 365 245Z" fill="#eef2f4" class="ink"/>
    <circle cx="376" cy="151" r="10" fill="#17202a"/>
    <path d="M414 170 Q500 157 571 196 Q590 208 568 221 Q492 238 414 205Z" fill="#f3a63b" class="ink"/>
    <path d="M414 205 Q492 238 568 221" fill="none" class="ink"/>
    <path d="M345 238 Q375 270 404 241" fill="none" stroke="#17202a" stroke-width="5"/>
    <path d="M322 176 Q292 185 281 214" fill="none" stroke="#d8e0e5" stroke-width="18"/>
    <path d="M333 322 L318 365 M394 322 L410 365" fill="none" class="ink"/>
    <path d="M309 366 L340 366 M400 366 L431 366" fill="none" class="ink"/>
    <!-- wing and fish -->
    <path d="M330 245 Q285 270 307 320 Q345 304 367 270Z" fill="#dce5ea" class="ink"/>
    <path d="M298 283 Q250 270 218 292 Q249 315 303 307Z" fill="#6db7d6" class="ink"/>
    <path d="M228 292 l-18 -10 l5 20Z" fill="#6db7d6" class="ink"/>
    <circle cx="252" cy="293" r="3" fill="#17202a"/>
    <text x="605" y="155" class="label" font-size="20" font-weight="700">“HONK!”</text>
    <path d="M598 165 q28 10 35 30" fill="none" class="ink"/>
  </g>

  <g class="label">
    <text x="400" y="555" text-anchor="middle" font-size="16">2026-10-27 09:31:30 SGT (UTC+08:00)</text>
  </g>
</svg>