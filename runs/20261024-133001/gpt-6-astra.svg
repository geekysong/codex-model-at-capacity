<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="white"/>

  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827">
    Level Seesaw — Static Equilibrium
  </text>

  <!-- seesaw beam -->
  <rect x="105" y="190" width="390" height="20" rx="5" fill="#8b5e34" stroke="#4b3422" stroke-width="2"/>
  <line x1="300" y1="180" x2="300" y2="220" stroke="#374151" stroke-width="3"/>

  <!-- pivot -->
  <polygon points="300,210 270,270 330,270" fill="#64748b" stroke="#334155" stroke-width="2"/>
  <line x1="255" y1="270" x2="345" y2="270" stroke="#334155" stroke-width="5"/>
  <text x="300" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#374151">pivot</text>

  <!-- masses -->
  <rect x="145" y="125" width="70" height="55" rx="6" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  <text x="180" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">6 kg</text>

  <rect x="385" y="125" width="70" height="55" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0f172a">4 kg</text>

  <!-- force arrows -->
  <line x1="180" y1="112" x2="180" y2="178" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="180" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">F = 6g</text>

  <line x1="420" y1="112" x2="420" y2="178" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1f2937">F = 4g</text>

  <!-- distance indicators -->
  <line x1="180" y1="225" x2="300" y2="225" stroke="#2563eb" stroke-width="2"/>
  <line x1="180" y1="218" x2="180" y2="232" stroke="#2563eb" stroke-width="2"/>
  <line x1="300" y1="218" x2="300" y2="232" stroke="#2563eb" stroke-width="2"/>
  <text x="240" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#1d4ed8">2 m</text>

  <line x1="300" y1="225" x2="420" y2="225" stroke="#d97706" stroke-width="2"/>
  <line x1="300" y1="218" x2="300" y2="232" stroke="#d97706" stroke-width="2"/>
  <line x1="420" y1="218" x2="420" y2="232" stroke="#d97706" stroke-width="2"/>
  <text x="360" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#b45309">3 m (x)</text>

  <!-- equilibrium statement -->
  <text x="300" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#111827">
    6 × 2 = 4 × 3
  </text>
  <text x="300" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#15803d">
    x = 3 m — BALANCED
  </text>
</svg>