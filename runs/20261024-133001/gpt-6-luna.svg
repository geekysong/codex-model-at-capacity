<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f2937">Level Seesaw in Static Equilibrium</text>

  <!-- Seesaw beam -->
  <rect x="80" y="190" width="440" height="18" rx="9" fill="#8b5e3c" stroke="#4b3425" stroke-width="3"/>
  
  <!-- Pivot -->
  <polygon points="285,208 315,208 300,275" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <circle cx="300" cy="199" r="8" fill="#f59e0b" stroke="#7c4a03" stroke-width="3"/>
  <text x="300" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">pivot</text>

  <!-- Left mass and hanger -->
  <line x1="180" y1="208" x2="180" y2="250" stroke="#374151" stroke-width="3"/>
  <rect x="145" y="250" width="70" height="48" rx="6" fill="#3b82f6" stroke="#1e3a8a" stroke-width="3"/>
  <text x="180" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>

  <!-- Right mass and hanger -->
  <line x1="420" y1="208" x2="420" y2="250" stroke="#374151" stroke-width="3"/>
  <rect x="385" y="250" width="70" height="48" rx="6" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
  <text x="420" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="225" x2="180" y2="335" stroke="#2563eb" stroke-width="4"/>
  <polygon points="180,345 171,328 189,328" fill="#2563eb"/>
  <text x="180" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">6g downward</text>

  <line x1="420" y1="225" x2="420" y2="335" stroke="#dc2626" stroke-width="4"/>
  <polygon points="420,345 411,328 429,328" fill="#dc2626"/>
  <text x="420" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#b91c1c">4g downward</text>

  <!-- Distance dimensions -->
  <line x1="180" y1="155" x2="300" y2="155" stroke="#111827" stroke-width="2"/>
  <line x1="180" y1="148" x2="180" y2="162" stroke="#111827" stroke-width="2"/>
  <line x1="300" y1="148" x2="300" y2="162" stroke="#111827" stroke-width="2"/>
  <polygon points="180,155 192,150 192,160" fill="#111827"/>
  <polygon points="300,155 288,150 288,160" fill="#111827"/>
  <text x="240" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#111827">2 m</text>

  <line x1="300" y1="155" x2="420" y2="155" stroke="#111827" stroke-width="2"/>
  <line x1="420" y1="148" x2="420" y2="162" stroke="#111827" stroke-width="2"/>
  <polygon points="300,155 312,150 312,160" fill="#111827"/>
  <polygon points="420,155 408,150 408,160" fill="#111827"/>
  <text x="360" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#111827">x = 3 m</text>

  <!-- Equation and result -->
  <text x="300" y=" ninety" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#111827">6 × 2 = 4 × 3</text>
  <text x="300" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#15803d">balanced</text>
</svg>