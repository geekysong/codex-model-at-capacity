<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle with a fish-filled bill, proudly claiming to travel light. The wheels spin and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="160" height="160" patternUnits="userSpaceOnUse">
      <rect width="160" height="160" fill="none"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fff6dd" stroke="#253844" stroke-width="12"/>
      <circle r="66" fill="none" stroke="#e5b568" stroke-width="3"/>
      <g stroke="#6c858a" stroke-width="3">
        <path d="M-67 0H67M0-67V67M-47-47L47 47M-47 47L47-47"/>
      </g>
      <circle r="10" fill="#253844"/>
    </g>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .ink { stroke:#253844; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6dd"/>
  <path d="M0 129Q210 100 410 127T800 120V474H0Z" fill="#d9eeea"/>
  <circle cx="695" cy="169" r="38" fill="#ffd46c"/>
  <g fill="#fffdf3">
    <path d="M37 178Q42 153 67 159Q79 135 104 153Q129 147 139 178Z"/>
    <path d="M432 164Q441 145 459 151Q471 130 490 148Q514 143 521 164Z"/>
  </g>

  <text x="400" y="58" text-anchor="middle" font-size="46" font-weight="900" letter-spacing="3" fill="#253844">TOUR DE BEAK</text>
  <text x="400" y="92" text-anchor="middle" font-size="18" font-weight="bold" fill="#52716f">ZERO EMISSIONS. QUESTIONABLE CARGO.</text>

  <!-- One seaside road, with a politely ignored weight limit. -->
  <path d="M0 420Q154 399 303 421T800 412V492H0Z" fill="#b9d5b6"/>
  <path d="M0 453H800V515H0Z" fill="#6c858a"/>
  <path d="M0 494H800" stroke="#fff6dd" stroke-width="4" stroke-dasharray="35 23"/>
  <ellipse cx="386" cy="459" rx="224" ry="12" fill="#253844" opacity=".16"/>

  <g class="ink">
    <path d="M694 315V449" fill="none" stroke="#8b7566"/>
    <rect x="630" y="259" width="129" height="77" rx="8" fill="#fffdf3"/>
  </g>
  <text x="694" y="283" text-anchor="middle" font-size="14" font-weight="bold" fill="#253844">CYCLE LANE</text>
  <text x="694" y="307" text-anchor="middle" font-size="16" font-weight="bold" fill="#b64f3b">NO WIDE LOADS</text>
  <path d="M673 322H714M709 317L715 322L709 327" fill="none" stroke="#253844" stroke-width="3"/>

  <!-- Rotating wheels stay anchored to the road. -->
  <g transform="translate(238 380)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(536 380)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 380L301 291L365 380L238 380M301 291H485L365 380M485 291L536 380" stroke="#253844" stroke-width="13"/>
    <path d="M238 380L301 291L365 380L238 380M301 291H485L365 380M485 291L536 380" stroke="#e96b50" stroke-width="7"/>
    <path d="M301 291L290 267M485 291L475 255L501 244" stroke="#253844" stroke-width="8"/>
    <path d="M270 265H314" stroke="#253844" stroke-width="12"/>
    <path d="M501 244L516 245" stroke="#4d7777" stroke-width="11"/>
    <path d="M359 371L297 352Q285 368 300 385L365 390" stroke="#253844" stroke-width="3"/>
  </g>

  <!-- Pelican and its modest carry-on luggage. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".75s" repeatCount="indefinite"/>
    <path d="M299 290Q303 315 340 330L365 380" fill="none" stroke="#253844" stroke-width="13" stroke-linecap="round"/>
    <path d="M299 290Q303 315 340 330L365 380" fill="none" stroke="#f5b546" stroke-width="8" stroke-linecap="round"/>
    <path d="M261 231Q239 241 232 266L269 256" fill="#fffdf3" class="ink"/>
    <path d="M270 224Q284 187 328 199Q366 207 376 244Q382 273 353 290Q315 310 275 285Q251 265 270 224Z" fill="#fffdf3" class="ink"/>
    <path d="M283 239Q304 220 341 242Q350 255 330 270Q310 280 283 253" fill="#d9e3dc" class="ink"/>
    <path d="M345 225Q356 204 350 181Q344 153 360 141Q380 127 398 145Q411 159 400 180Q387 203 390 229L383 255" fill="#fffdf3" class="ink"/>
    <path d="M358 142L349 128L368 134L369 120L381 135" fill="#fffdf3" class="ink"/>

    <!-- A bill large enough to qualify as a delivery van. -->
    <path d="M396 164L583 185Q568 244 509 247Q448 244 397 186Z" fill="#f5b546" class="ink"/>
    <path d="M410 184Q476 213 568 189Q555 230 508 233Q457 232 410 184Z" fill="#ffce72"/>
    <g transform="translate(483 210) rotate(8)">
      <path d="M-31 0Q-7-21 23-1L38-13L35 11L23 4Q-8 24-31 0Z" fill="#76aaa1" stroke="#253844" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-19" cy="-2" r="3" fill="#253844"/>
      <path d="M-3-7L3 0L-3 8" fill="none" stroke="#52716f" stroke-width="2"/>
    </g>
    <path d="M395 163L586 181L576 190L399 182Z" fill="#ef9c3c" class="ink"/>
    <circle cx="384" cy="156" r="11" fill="#fff" stroke="#253844" stroke-width="3"/>
    <circle cx="389" cy="157" r="4" fill="#253844"/>
    <path d="M374 139L392 143" fill="none" stroke="#253844" stroke-width="4" stroke-linecap="round"/>
    <path d="M375 239Q421 252 474 251L501 244" fill="none" stroke="#253844" stroke-width="9" stroke-linecap="round"/>
    <path d="M375 239Q421 252 474 251" fill="none" stroke="#fffdf3" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Turning crank and a webbed foot. -->
  <g transform="translate(365 380)">
    <circle r="19" fill="#fff6dd" stroke="#253844" stroke-width="5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#253844" stroke-width="6" stroke-linecap="round"/>
      <path d="M19-6L37-11L33-2L43 3L20 7Z" fill="#f5b546" stroke="#253844" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-32 0H-18" stroke="#253844" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle r="5" fill="#253844"/>
  </g>

  <g>
    <path d="M60 205Q60 192 73 192H221Q234 192 234 205V236Q234 248 221 248H191L207 269L169 248H73Q60 248 60 235Z" fill="#fffdf3" stroke="#253844" stroke-width="3"/>
    <text x="147" y="227" text-anchor="middle" font-size="21" font-weight="bold" fill="#253844">“I travel light.”</text>
  </g>
  <path d="M130 350H166M117 366H158M135 382H163" stroke="#fffdf3" stroke-width="5" stroke-linecap="round"/>

  <!-- Dedicated, static caption and timestamp footer. -->
  <rect x="0" y="515" width="800" height="85" fill="#fff6dd"/>
  <text x="400" y="546" text-anchor="middle" font-size="21" font-weight="bold" fill="#253844">One pelican. Two wheels. Six undeclared sardines.</text>
  <path d="M130 559H670" stroke="#d8c9aa" stroke-width="1"/>
  <text x="400" y="582" text-anchor="middle" font-size="16" fill="#435c64">2026-10-25 13:01:16 SGT (UTC+08:00)</text>
</svg>