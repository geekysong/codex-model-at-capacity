  <text x="400" y="62" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="34" fill="#17344c" stroke="#fff" stroke-width="3" paint-order="stroke">PELICAN FOR MAYOR!</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#17344c">“Finally, a candidate who can carry all the baggage.”</text>

