<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon of an expressive pelican riding a bicycle.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#555"/>
      <stop offset=".5" stop-color="#737373"/>
      <stop offset="1" stop-color="#555"/>
    </linearGradient>
    <style>
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
      .bob { transform-box: fill-box; transform-origin: center; animation: bob .8s ease-in-out infinite; }
      .pedal { transform-box: fill-box; transform-origin: 400px 413px; animation: pedal .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pedal { to { transform: rotate(360deg); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    </style>
  </defs>

