    <text x="210" y="43">B1</text><text x="310" y="43">C1</text><text x="410" y="43">D1</text><text x="510" y="43">E1</text>
    <text x="110" y="108">A2</text><text x="210" y="108">B2</text><text x="310" y="108">C2</text><text x="410" y="108">D2</text><text x="510" y="108">E2</text>
    <text x="110" y="173">A3</text><text x="210" y="173">B3</text><text x="310" y="173">C3</text><text x="410" y="173">D3</text><text x="510" y="173">E3</text>
    <text x="110" y="238">A4</text><text x="210" y="238">B4</text><text x="310" y="238">C4</text><text x="410" y="238">D4</text><text x="510" y="238">E4</text>
    <text x="110" y="303">A5</text><text x="210" y="303">B5</text><text x="310" y="303">C5</text><text x="410" y="303">D5</text><text x="510" y="303">E5 · End</text>
