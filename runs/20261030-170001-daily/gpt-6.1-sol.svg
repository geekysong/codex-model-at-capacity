<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid with shortest route from A1 to E5</title>
  <desc id="desc">A five-by-five intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5, totaling eight street segments and avoiding blocked intersections B2, C3, and D4.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <g fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1">
    <path d="M100 55H500V315H100Z"/>
  </g>
  <g fill="none" stroke="#94a3b8" stroke-width="5">
    <path d="M100 55H500 M100 120H500 M100 185H500 M100 250H500 M100 315H500"/>
    <path d="M100 55V315 M200 55V315 M300 55V315 M400 55V315 M500 55V315"/>
  </g>

  <path d="M100 55H500V315" fill="none" stroke="#fff" stroke-width="11" stroke-linejoin="round"/>
  <path d="M100 55H500V315" fill="none" stroke="#2563eb" stroke-width="7" stroke-linejoin="round"/>

  <g fill="#475569">
