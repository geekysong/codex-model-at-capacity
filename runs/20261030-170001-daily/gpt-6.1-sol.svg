    <circle cx="100" cy="120" r="4"/><circle cx="300" cy="120" r="4"/><circle cx="400" cy="120" r="4"/><circle cx="500" cy="120" r="4"/>
    <circle cx="100" cy="185" r="4"/><circle cx="200" cy="185" r="4"/><circle cx="400" cy="185" r="4"/><circle cx="500" cy="185" r="4"/>
    <circle cx="100" cy="250" r="4"/><circle cx="200" cy="250" r="4"/><circle cx="300" cy="250" r="4"/><circle cx="500" cy="250" r="4"/>
    <circle cx="100" cy="315" r="4"/><circle cx="200" cy="315" r="4"/><circle cx="300" cy="315" r="4"/><circle cx="400" cy="315" r="4"/>
  </g>

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M192 112L208 128 M208 112L192 128"/>
    <path d="M292 177L308 193 M308 177L292 193"/>
    <path d="M392 242L408 258 M408 242L392 258"/>
  </g>

  <circle cx="100" cy="55" r="8" fill="#16a34a" stroke="white" stroke-width="2"/>
  <circle cx="500" cy="315" r="8" fill="#ea580c" stroke="white" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#0f172a" paint-order="stroke" stroke="#f8fafc" stroke-width="3" stroke-linejoin="round">
