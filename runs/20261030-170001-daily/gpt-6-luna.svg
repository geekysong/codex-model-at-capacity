<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down map of a 5 by 5 city-block street grid with a shortest route from A1 to E5 avoiding blocked intersections B2, C3, and D4.">
  <rect width="600" height="400" fill="#f7f8fa"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#263445">CITY GRID — SHORTEST STREET ROUTE</text>

  <!-- Streets -->
  <g stroke="#c5cdd6" stroke-width="5" stroke-linecap="round">
    <path d="M110 65H430 M110 125H430 M110 185H430 M110 245H430 M110 305H430"/>
    <path d="M110 65V305 M190 65V305 M270 65V305 M350 65V305 M430 65V305"/>
  </g>

  <!-- Route: 8 street segments -->
  <path d="M110 65H190 V185 H270 V245 H350 V305 H430"
        fill="none" stroke="#1677e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blocked intersections -->
  <g stroke="#d62828" stroke-width="4" stroke-linecap="round">
    <path d="M182 117l16 16m0-16-16 16"/>
    <path d="M262 177l16 16m0-16-16 16"/>
    <path d="M342 237l16 16m0-16-16 16"/>
  </g>

  <!-- Route endpoints -->
  <circle cx="110" cy="65" r="10" fill="#168447" stroke="#fff" stroke-width="3"/>
  <circle cx="430" cy="305" r="10" fill="#7b2cbf" stroke="#fff" stroke-width="3"/>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#263445">
    <text x="110" y="49">A1</text><text x="190" y="49">B1</text><text x="270" y="49">C1</text><text x="350" y="49">D1</text><text x="430" y="49">E1</text>
    <text x="110" y="113">A2</text><text x="190" y="113">B2</text><text x="270" y="113">C2</text><text x="350" y="113">D2</text><text x="430" y="113">E2</text>
    <text x="110" y="173">A3</text><text x="190" y="173">B3</text><text x="270" y="173">C3</text><text x="350" y="173">D3</text><text x="430" y="173">E3</text>
    <text x="110" y="233">A4</text><text x="190" y="233">B4</text><text x="270" y="233">C4</text><text x="350" y="233">D4</text><text x="430" y="233">E4</text>
    <text x="110" y="293">A5</text><text x="190" y="293">B5</text><text x="270" y="293">C5</text><text x="350" y="293">D5</text><text x="430" y="293">E5</text>
  </g>

  <!-- Endpoint labels and legend -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700">
    <text x="72" y="70" text-anchor="end" fill="#168447">START</text>
    <text x="468" y="310" fill="#7b2cbf">END</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#263445">
    <line x1="120" y1="343" x2="154" y2="343" stroke="#1677e8" stroke-width="6" stroke-linecap="round"/>
    <text x="164" y="348">Route: 8 street segments</text>
    <path d="M363 337l12 12m0-12-12 12" stroke="#d62828" stroke-width="3" stroke-linecap="round"/>
    <text x="383" y="348">Blocked intersection</text>
  </g>
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#263445">2026-10-30 17:04:28 SGT (UTC+08:00)</text>
</svg>