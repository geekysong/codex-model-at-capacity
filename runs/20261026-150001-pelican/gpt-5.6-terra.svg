<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of an oversized pelican riding a tiny bicycle.</desc>
  <defs>
    <style>
      .title{font:900 38px sans-serif;fill:#172b4d;letter-spacing:1px}
      .caption{font:700 18px sans-serif;fill:#243b53}
      .footer{font:14px monospace;fill:#425466}
      .ink{stroke:#172b4d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#172b4d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
      .bob{animation:bob .55s ease-in-out infinite alternate}
      .leg{transform-box:fill-box;transform-origin:50% 12%;animation:pedal .55s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-7px) rotate(-1deg)}}
      @keyframes pedal{to{transform:rotate(18deg)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="#bcecff"/>
  <path d="M0 310 Q105 265 205 310T405 300T600 308T800 280V455H0Z" fill="#87d77f"/>
  <path d="M0 390 Q120 350 250 392T500 375T800 390V455H0Z" fill="#54b96b"/>
  <path d="M0 455H800" stroke="#172b4d" stroke-width="7"/>

  <text x="400" y="58" text-anchor="middle" class="title">PELICAN PEDAL PANIC!</text>
  <path d="M140 75 Q400 115 660 75" fill="none" stroke="#f6b73c" stroke-width="7" stroke-linecap="round"/>

