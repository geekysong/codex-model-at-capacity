<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Against the Current</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an oversized fish-shaped briefcase.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd8f2"/>
      <stop offset="1" stop-color="#d8f6ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#566575"/>
      <stop offset="1" stop-color="#293441"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="675" cy="105" r="48" fill="#fff8bd" opacity=".9"/>
  <path d="M0 385 Q110 330 220 380 T440 375 T660 370 T800 380 V470 H0Z" fill="#8acb91"/>
  <path d="M0 420 Q150 390 290 425 T560 420 T800 425 V520 H0Z" fill="#6cb37a"/>
  <path d="M0 475 H800 V560 H0Z" fill="url(#road)"/>
  <path d="M0 525 H800" stroke="#f8d66d" stroke-width="7" stroke-dasharray="42 30"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#17324d" stroke="#ffffff" stroke-width="5" paint-order="stroke">
    PELICAN PEDALS AGAINST THE CURRENT
  </text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-style="italic" fill="#17324d">
    “Why fly when you can commute dramatically?”
  </text>

  <g filter="url(#shadow)">
    <!-- bicycle -->
    <g stroke="#d94b38" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M205 455 L310 455 L390 345 L500 455 L390 455 L310 455 L275 385"/>
      <path d="M390 345 L420 315"/>
      <path d="M405 315 L446 315"/>
      <path d="M275 385 L247 355"/>
      <path d="M238 352 L268 352"/>
    </g>

    <!-- wheels -->
    <g fill="none" stroke="#263746" stroke-width="8">
      <circle cx="205" cy="455" r="69"/>
      <circle cx="500" cy="455" r="69"/>
    </g>
    <g stroke="#aec9d4" stroke-width="2" opacity=".8">
      <g>
        <line x1="205" y1="386" x2="205" y2="524"/>
        <line x1="136" y1="455" x2="274" y2="455"/>
        <line x1="156" y1="406" x2="254" y2="504"/>
        <line x1="156" y1="504" x2="254" y2="406"/>
      </g>
      <g>
        <line x1="500" y1="386" x2="500" y2="524"/>
        <line x1="431" y1="455" x2="569" y2="455"/>
        <line x1="451" y1="406" x2="549" y2="504"/>
        <line x1="451" y1="504" x2="549" y2="406"/>
      </g>
    </g>
    <g transform="rotate(0 205 455)">
      <animateTransform attributeName="transform" type="rotate" from="0 205 455" to="360 205 455" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <g transform="rotate(0 500 455)">
      <animateTransform attributeName="transform" type="rotate" from="0 500 455" to="360 500 455" dur="1.4s" repeatCount="indefinite"/>
    </g>

    <!-- pelican body bob -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.4s" repeatCount="indefinite"/>
      <ellipse cx="365" cy="265" rx="82" ry="104" fill="#f5f1df" stroke="#263746" stroke-width="6"/>
      <path d="M308 239 Q270 275 292 330 Q326 309 348 271Z" fill="#d8d4c4" stroke="#263746" stroke-width="5"/>
      <circle cx="363" cy="150" r="55" fill="#f5f1df" stroke="#263746" stroke-width="6"/>
      <path d="M397 154 Q490 148 535 183 Q490 222 398 188Z" fill="#f09a43" stroke="#263746" stroke-width="6"/>
      <path d="M397 184 Q466 194 522 180 Q477 246 395 212Z" fill="#e47736" stroke="#263746" stroke-width="5"/>
      <circle cx="382" cy="142" r="10" fill="#263746"/>
      <circle cx="386" cy="138" r="3" fill="#fff"/>
      <path d="M326 116 Q355 87 388 111" fill="none" stroke="#263746" stroke-width="7" stroke-linecap="round"/>
      <path d="M342 335 L332 414" stroke="#f09a43" stroke-width="12" stroke-linecap="round"/>
      <path d="M397 335 L430 411" stroke="#f09a43" stroke-width="12" stroke-linecap="round"/>
      <!-- pedaling legs -->
      <g stroke="#263746" stroke-width="6" stroke-linecap="round">
        <path d="M332 414 L365 445"/>
        <path d="M430 411 L393 452"/>
        <path d="M355 444 L382 455"/>
        <path d="M393 452 L420 460"/>
      </g>
      <path d="M318 205 Q355 230 395 205" fill="none" stroke="#263746" stroke-width="5"/>
      <path d="M330 257 Q372 281 410 255" fill="none" stroke="#263746" stroke-width="5"/>
      <text x="365" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#263746">HONK!</text>
      <path d="M292 136 l-25 -20 M300 122 l-17 -30" stroke="#e47736" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- fish briefcase -->
    <g transform="translate(505 250) rotate(-8)">
      <path d="M0 30 Q56 -5 125 30 Q77 78 0 30Z" fill="#77c7d5" stroke="#263746" stroke-width="5"/>
      <path d="M15 28 Q60 24 103 31" fill="none" stroke="#eafaff" stroke-width="4"/>
      <circle cx="92" cy="25" r="6" fill="#263746"/>
      <path d="M125 30 L149 12 L145 51Z" fill="#77c7d5" stroke="#263746" stroke-width="5"/>
      <path d="M53 6 L65 -14 L78 5" fill="#77c7d5" stroke="#263746" stroke-width="4"/>
      <text x="64" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#17324d">TAXES</text>
    </g>
  </g>

  <path d="M595 335 q35 -20 70 0" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/>
  <path d="M620 315 q27 -16 54 0" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/>
  <text x="610" y="300" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#17324d">WING IT!</text>

  <rect x="28" y="565" width="744" height="27" rx="10" fill="#17324d" opacity=".92"/>
  <text x="400" y="584" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    2026-10-28 02:02:39 SGT (UTC+08:00)
  </text>
</svg>