<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>79900</title>
  <desc>Union area: 79900 square pixels. A overlaps B by 8000 square pixels. B overlaps C by 2100 square pixels. A and C do not overlap.</desc>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M-1 1L1-1M0 7L7 0M6 8L8 6" fill="none" stroke="#344054" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#172033" aria-label="Total union area in square pixels">79900</text>

  <g stroke-width="2">
    <rect x="50" y="50" width="200" height="150" fill="#4099eb" fill-opacity="0.4" stroke="#195c99"/>
    <rect x="150" y="120" width="200" height="150" fill="#f4b544" fill-opacity="0.4" stroke="#926000"/>
    <rect x="320" y="200" width="200" height="150" fill="#bf72d9" fill-opacity="0.4" stroke="#783794"/>
  </g>

  <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

  <g font-family="Arial, sans-serif" fill="#172033" text-anchor="middle">
    <g font-size="22" font-weight="bold">
      <text x="95" y="100">A</text>
      <text x="285" y="165">B</text>
      <text x="430" y="300">C</text>
    </g>

    <rect x="159" y="148" width="82" height="24" rx="4" fill="white" fill-opacity="0.96"/>
    <text x="200" y="165" font-size="14" font-weight="bold">8000 px²</text>

    <g transform="translate(335 235) rotate(-90)">
      <rect x="-31" y="-9" width="62" height="18" rx="3" fill="white" fill-opacity="0.96"/>
      <text x="0" y="4" font-size="12" font-weight="bold">2100 px²</text>
    </g>

    <text x="300" y="368" font-size="13">A and C do not overlap.</text>
    <text x="300" y="391" font-size="14">2026-11-03 20:04:03 SGT (UTC+08:00)</text>
  </g>
</svg>