<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Total union area: 79900 square pixels</title>
  <desc id="desc">Three translucent rectangles. A and B overlap by 8000 square pixels, B and C overlap by 2100 square pixels, and A and C do not overlap.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#273449" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#172033">Total union area: 79900 square pixels</text>

  <rect x="50" y="50" width="200" height="150" fill="#4f8fe8" fill-opacity=".45" stroke="#22559c" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#e89c48" fill-opacity=".45" stroke="#a45b0c" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#65bd83" fill-opacity=".45" stroke="#27733f" stroke-width="2"/>

  <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="75" y="90" font-size="22" font-weight="bold">A</text>
    <text x="275" y="155" font-size="22" font-weight="bold">B</text>
    <text x="385" y="300" font-size="22" font-weight="bold">C</text>

    <rect x="158" y="147" width="84" height="25" rx="3" fill="#fff" fill-opacity=".95"/>
    <text x="200" y="164" text-anchor="middle" font-size="13" font-weight="bold">8000 px²</text>

    <path d="M335 235 L365 235" stroke="#172033" stroke-width="1.5" fill="none"/>
    <rect x="365" y="222" width="85" height="25" rx="3" fill="#fff" fill-opacity=".95"/>
    <text x="407.5" y="239" text-anchor="middle" font-size="13" font-weight="bold">2100 px²</text>

    <text x="50" y="371" font-size="13">A and C do not overlap.</text>
    <text x="550" y="390" text-anchor="end" font-size="13">2026-11-03 20:04:38 SGT (UTC+08:00)</text>
  </g>
</svg>