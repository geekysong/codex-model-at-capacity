<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <title>79900</title>
  <desc>Union area: 79900 square pixels. A overlaps B by 8000 square pixels. B overlaps C by 2100 square pixels. A and C have no positive-area overlap.</desc>
  <defs>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M-1 1L1-1 M0 7L7 0 M6 8L8 6" fill="none" stroke="#263445" stroke-width="1" stroke-opacity="0.65"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>

  <g font-family="Arial, sans-serif" fill="#172331">
    <text x="300" y="29" text-anchor="middle" font-size="25" font-weight="700" aria-label="Total union area in square pixels: 79900">79900</text>

    <rect x="50" y="50" width="200" height="150" fill="#3498db" fill-opacity="0.4" stroke="#21618c" stroke-width="2"/>
    <rect x="150" y="120" width="200" height="150" fill="#ef9343" fill-opacity="0.4" stroke="#a65013" stroke-width="2"/>
    <rect x="320" y="200" width="200" height="150" fill="#45b982" fill-opacity="0.4" stroke="#22734e" stroke-width="2"/>

    <rect x="150" y="120" width="100" height="80" fill="url(#hatch)"/>
    <rect x="320" y="200" width="30" height="70" fill="url(#hatch)"/>

    <g font-size="22" font-weight="700">
      <text x="78" y="88">A</text>
      <text x="284" y="158">B</text>
      <text x="420" y="304">C</text>
    </g>

    <rect x="159" y="148" width="82" height="24" rx="4" fill="#ffffff" fill-opacity="0.95"/>
    <text x="200" y="165" text-anchor="middle" font-size="15" font-weight="700">8000 px²</text>

    <g transform="translate(335 235) rotate(-90)">
      <rect x="-31" y="-9" width="62" height="18" rx="3" fill="#ffffff" fill-opacity="0.95"/>
      <text x="0" y="4" text-anchor="middle" font-size="12" font-weight="700">2100 px²</text>
    </g>

    <text x="300" y="367" text-anchor="middle" font-size="12">A and C do not overlap (0 px²).</text>

    <path d="M30 375H570" stroke="#cbd5df"/>
    <text x="300" y="392" text-anchor="middle" font-size="13">2026-11-03 20:03:37 SGT (UTC+08:00)</text>
  </g>
</svg>