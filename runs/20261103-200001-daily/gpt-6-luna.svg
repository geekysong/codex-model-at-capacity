<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatchAB" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f3dfbd"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#6b4d2e" stroke-width="2"/>
    </pattern>
    <pattern id="hatchBC" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#d9e8d2"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#385b38" stroke-width="2"/>
    </pattern>
    <pattern id="hatchABC" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ded8ef"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#51416f" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">Union area: 86,000 px²</text>

  <!-- Pairwise overlap regions are hatched; the triple overlap has its own hatch. -->
  <path d="M150 120 H250 V200 H320 V270 H250 V200 H150 Z" fill="url(#hatchAB)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatchBC)"/>
  <rect x="250" y="200" width="70" height="70" fill="url(#hatchABC)"/>

  <rect x="50" y="50" width="200" height="150" fill="#e45b5b" fill-opacity=".42" stroke="#8b2525" stroke-width="2"/>
  <rect x="150" y="120" width="200" height="150" fill="#4b8bd8" fill-opacity=".42" stroke="#1e4d7c" stroke-width="2"/>
  <rect x="320" y="200" width="200" height="150" fill="#55a85e" fill-opacity=".42" stroke="#286631" stroke-width="2"/>

  <path d="M150 120 H250 V200 H320 V270 H250 V200 H150 Z" fill="url(#hatchAB)"/>
  <rect x="320" y="200" width="30" height="70" fill="url(#hatchBC)"/>
  <rect x="250" y="200" width="70" height="70" fill="url(#hatchABC)"/>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="85" y="105" fill="#451515">A</text>
    <text x="185" y="250" fill="#102f4c">B</text>
    <text x="465" y="325" fill="#17451d">C</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#222">
    <text x="200" y="145">AB only: 13,000 px²</text>
    <text x="285" y="235">ABC: 4,900 px²</text>
    <text x="335" y="288">BC only: 2,100 px²</text>
  </g>

  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">A–C do not overlap.</text>
  <text x="300" y="391" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">2026-11-03 20:04:27 SGT (UTC+08:00)</text>
</svg>