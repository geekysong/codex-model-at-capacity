<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Shortest street route from A1 to E5</title>
  <desc id="desc">A five by five city intersection grid. The blue shortest route avoids blocked intersections B2, C3, and D4 and uses eight street segments.</desc>
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">City block route map</text>

  <!-- Streets -->
  <g stroke="#9ca3af" stroke-width="3" stroke-linecap="round">
    <path d="M100 70H500 M100 120H500 M100 170H500 M100 220H500 M100 270H500"/>
    <path d="M100 70V270 M200 70V270 M300 70V270 M400 70V270 M500 70V270"/>
  </g>

  <!-- Shortest route: down column A, then right along row E -->
  <path d="M100 70V270H500" fill="none" stroke="#1677ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#374151" stroke="white" stroke-width="1.5">
    <circle cx="100" cy="70" r="7"/><circle cx="200" cy="70" r="5"/><circle cx="300" cy="70" r="5"/><circle cx="400" cy="70" r="5"/><circle cx="500" cy="70" r="5"/>
    <circle cx="100" cy="120" r="5"/><circle cx="200" cy="120" r="5"/><circle cx="300" cy="120" r="5"/><circle cx="400" cy="120" r="5"/><circle cx="500" cy="120" r="5"/>
    <circle cx="100" cy="170" r="5"/><circle cx="200" cy="170" r="5"/><circle cx="300" cy="170" r="5"/><circle cx="400" cy="170" r="5"/><circle cx="500" cy="170" r="5"/>
    <circle cx="100" cy="220" r="5"/><circle cx="200" cy="220" r="5"/><circle cx="300" cy="220" r="5"/><circle cx="400" cy="220" r="5"/><circle cx="500" cy="220" r="5"/>
    <circle cx="100" cy="270" r="5"/><circle cx="200" cy="270" r="5"/><circle cx="300" cy="270" r="5"/><circle cx="400" cy="270" r="5"/><circle cx="500" cy="270" r="7"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="11" fill="#374151">
    <text x="100" y="54" text-anchor="middle">A1</text><text x="200" y="54" text-anchor="middle">B1</text><text x="300" y="54" text-anchor="middle">C1</text><text x="400" y="54" text-anchor="middle">D1</text><text x="500" y="54" text-anchor="middle">E1</text>
    <text x="100" y="108" text-anchor="middle">A2</text><text x="200" y="108" text-anchor="middle">B2</text><text x="300" y="108" text-anchor="middle">C2</text><text x="400" y="108" text-anchor="middle">D2</text><text x="500" y="108" text-anchor="middle">E2</text>
    <text x="100" y="158" text-anchor="middle">A3</text><text x="200" y="158" text-anchor="middle">B3</text><text x="300" y="158" text-anchor="middle">C3</text><text x="400" y="158" text-anchor="middle">D3</text><text x="500" y="158" text-anchor="middle">E3</text>
    <text x="100" y="208" text-anchor="middle">A4</text><text x="200" y="208" text-anchor="middle">B4</text><text x="300" y="208" text-anchor="middle">C4</text><text x="400" y="208" text-anchor="middle">D4</text><text x="500" y="208" text-anchor="middle">E4</text>
    <text x="100" y="258" text-anchor="middle">A5</text><text x="200" y="258" text-anchor="middle">B5</text><text x="300" y="258" text-anchor="middle">C5</text><text x="400" y="258" text-anchor="middle">D5</text><text x="500" y="258" text-anchor="middle">E5</text>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="70" r="12" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="500" cy="270" r="12" fill="none" stroke="#dc2626" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold">
    <text x="72" y="76" text-anchor="end" fill="#15803d">START</text>
    <text x="520" y="276" fill="#b91c1c">END</text>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 113l14 14m0-14l-14 14"/>
    <path d="M293 163l14 14m0-14l-14 14"/>
    <path d="M393 213l14 14m0-14l-14 14"/>
  </g>

  <text x="300" y="317" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1677ff">Shortest route: 8 street segments</text>
  <text x="300" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">Red X = blocked intersection · Blue = route</text>
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#374151">2026-10-30 19:04:12 SGT (UTC+08:00)</text>
</svg>