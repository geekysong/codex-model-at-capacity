      <stop offset="1" stop-color="#f8f2d6"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc55e"/>
      <stop offset="1" stop-color="#ed884e"/>
    </linearGradient>
