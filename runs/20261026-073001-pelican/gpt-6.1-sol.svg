<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">An extremely confident pelican pedals a bicycle with a fish in its enormous bill pouch. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
