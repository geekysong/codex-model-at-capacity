  <rect y="499" width="800" height="101" fill="#fff9ea"/>
  <text x="400" y="534" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#203c49">He trained for the race. His lunch trained for escape.</text>
