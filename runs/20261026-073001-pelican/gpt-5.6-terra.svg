<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the Penny-Farthing</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding an absurdly small bicycle.</desc>
  <style>
    .wheel { animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
    .bird { animation: bob .55s ease-in-out infinite alternate; transform-origin: 405px 300px; }
    .leg { animation: pedal .55s linear infinite alternate; transform-box: fill-box; transform-origin: center top; }
    .leg2 { animation: pedal .55s linear infinite alternate-reverse; transform-box: fill-box; transform-origin: center top; }
    .dust { animation: puff 1.1s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(18deg); } }
    @keyframes puff { 0% { opacity: .85; transform: translateX(0) scale(.6); } 100% { opacity: 0; transform: translateX(-42px) scale(1.35); } }
  </style>

