  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#24324a">PELICAN: BIKE LANE ENFORCER</text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#31445f">“I carry enough cargo to justify this commute.”</text>

