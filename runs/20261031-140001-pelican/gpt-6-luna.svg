<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican’s Two-Wheel Career</title>
  <desc id="desc">A dignified pelican pedals a bicycle while its oversized beak catches the wind. The wheels spin and the rider bobs gently.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: view-box; transform-origin: center; animation: spin 3s linear infinite; }
      .rider { transform-box: view-box; transform-origin: 440px 370px; animation: bob 0.7s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#dff5f4"/>
  <circle cx="685" cy="118" r="48" fill="#ffd166"/>
  <path d="M0 345 Q110 305 220 344 T440 335 T660 342 T880 330 V600 H0Z" fill="#b9e4ad"/>
  <path d="M0 438 Q200 414 400 438 T800 430 V600 H0Z" fill="#83c98b"/>
  <path d="M75 389 Q140 375 198 390 M585 385 Q650 369 720 386" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".8"/>

  <text x="400" y="56" text-anchor="middle" font-size="31" font-weight="900" fill="#17324d">THE PELICAN’S TWO-WHEEL CAREER</text>
  <text x="400" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#315a69">“I used to be a birdbrain. Now I’m a cycle path.”</text>

  <!-- bicycle frame -->
  <g stroke="#e85d45" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M250 405 L355 405 L315 320 L250 405 M315 320 L420 405 L355 405 M315 320 L290 320"/>
    <path d="M420 405 L455 405"/>
  </g>
  <g class="wheel" fill="none" stroke="#21465c" stroke-width="5">
    <circle cx="250" cy="405" r="65"/><path d="M185 405h130 M250 340v130 M204 359l92 92 M296 359l-92 92"/>
  </g>
  <g class="wheel" fill="none" stroke="#21465c" stroke-width="5">
    <circle cx="420" cy="405" r="65"/><path d="M355 405h130 M420 340v130 M374 359l92 92 M466 359l-92 92"/>
  </g>
  <circle cx="355" cy="405" r="10" fill="#ffd166" stroke="#21465c" stroke-width="4"/>
  <path d="M355 405l-25-24 M355 405l29 20" stroke="#21465c" stroke-width="6" stroke-linecap="round"/>
  <path d="M280 309h-36 M305 313l-18-12" stroke="#21465c" stroke-width="8" stroke-linecap="round"/>
  <path d="M411 319l24-12 17 5" fill="none" stroke="#21465c" stroke-width="7" stroke-linecap="round"/>

  <!-- rider and comically wind-catching beak -->
  <g class="rider">
    <path d="M355 252 Q370 209 420 211 Q459 215 472 254 L455 305 Q426 327 383 306Z" fill="#fffdf4" stroke="#21465c" stroke-width="5"/>
    <path d="M375 282 Q410 266 451 281 L460 303 Q428 322 386 307Z" fill="#f4eee0" stroke="#21465c" stroke-width="4"/>
    <path d="M392 302 Q411 320 436 307 L427 338 L399 337Z" fill="#f0a95c" stroke="#21465c" stroke-width="4"/>
    <path d="M390 334 L426 334 L430 370 L404 379 L381 361Z" fill="#457b9d" stroke="#21465c" stroke-width="5"/>
    <path d="M400 357 L370 386 L355 405 M425 357 L395 382 L385 405" fill="none" stroke="#21465c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M390 334 L365 314 L338 320 M423 338 L447 314 L455 298" fill="none" stroke="#21465c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M365 314l-30 6 M447 314l12-7" stroke="#f0a95c" stroke-width="8" stroke-linecap="round"/>
    <!-- head -->
    <path d="M383 226 Q370 183 394 157 Q417 132 447 151 Q466 164 457 193 L437 226Z" fill="#fffdf4" stroke="#21465c" stroke-width="5"/>
    <path d="M440 176 Q483 164 531 178 Q544 182 533 191 Q499 206 448 197Z" fill="#f4a340" stroke="#21465c" stroke-width="5"/>
    <path d="M451 192 Q493 194 529 185 Q516 216 480 221 Q457 218 451 192Z" fill="#ed7656" stroke="#21465c" stroke-width="4"/>
    <circle cx="432" cy="169" r="5" fill="#17324d"/>
    <path d="M401 145 Q414 126 439 137" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M470 155q13-13 24-8 M475 147l4-12 M487 147l10-9" fill="none" stroke="#21465c" stroke-width="3" stroke-linecap="round"/>
    <!-- little helmet -->
    <path d="M390 151 Q400 119 429 124 Q449 127 454 151Z" fill="#ffd166" stroke="#21465c" stroke-width="4"/>
    <path d="M386 152h72" stroke="#21465c" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- wind and gag details -->
  <path d="M551 157q31-13 53 0 M558 173q19-8 37 0 M536 211q28 8 45-2" fill="none" stroke="#53a9b5" stroke-width="4" stroke-linecap="round"/>
  <path d="M566 139l13-10 M579 145l16-4" stroke="#53a9b5" stroke-width="3" stroke-linecap="round"/>
  <path d="M493 266 Q520 245 545 264 Q523 287 493 266Z" fill="#fff" stroke="#21465c" stroke-width="3"/>
  <text x="519" y="270" text-anchor="middle" font-size="13" font-weight="900" fill="#21465c">HONK!</text>
  <path d="M144 306l-20-10 M155 289l-9-20 M170 300l3-23" stroke="#f4a340" stroke-width="5" stroke-linecap="round"/>

  <rect x="92" y="474" width="616" height="48" rx="24" fill="#fffdf4" stroke="#21465c" stroke-width="3"/>
  <text x="400" y="505" text-anchor="middle" font-size="19" font-weight="800" fill="#17324d">He’s not late. He’s just winging the commute.</text>

  <text x="400" y="570" text-anchor="middle" font-size="14" font-weight="700" fill="#17324d">2026-10-31 14:02:04 SGT (UTC+08:00)</text>
</svg>