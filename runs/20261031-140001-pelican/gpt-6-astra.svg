    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-22 0h44" stroke="#233d46" stroke-width="6"/>
      <path d="M-25-8v16M25-8v16" stroke="#233d46" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <g fill="none" stroke="#527c80" stroke-width="4" stroke-linecap="round">
    <path d="M145 280h-40M148 295h-62M135 310h-28">
      <animate attributeName="opacity" values=".3;1;.3" dur=".8s" repeatCount="indefinite"/>
    </path>
  </g>
  <path d="M67 129h223q15 0 15 15v42q0 15-15 15h-34l-20 23 4-23H67q-15 0-15-15v-42q0-15 15-15Z" fill="#fffdf3" stroke="#233d46" stroke-width="3"/>
  <text x="179" y="158" text-anchor="middle" fill="#233d46" font-family="Arial, sans-serif" font-size="18" font-weight="bold">“My bill includes</text>
  <text x="179" y="183" text-anchor="middle" fill="#233d46" font-family="Arial, sans-serif" font-size="18" font-weight="bold">the delivery fee.”</text>

  <rect y="518" width="800" height="82" fill="#fff3d8"/>
  <text x="400" y="545" text-anchor="middle" fill="#233d46" font-family="Arial, sans-serif" font-size="19" font-weight="bold">One pelican. Two wheels. A mouthful of operating costs.</text>
  <path d="M80 560h640" stroke="#cbbf9f"/>
  <text x="400" y="583" text-anchor="middle" fill="#354e55" font-family="Arial, sans-serif" font-size="16">2026-10-31 14:00:01 SGT (UTC+08:00)</text>
</svg>