<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Delivery Economy</title>
  <desc id="desc">A determined pelican pedals a bicycle with an enormous beak full of fish. The wheels spin, pedals turn, and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="road" width="120" height="12" patternUnits="userSpaceOnUse">
      <path d="M15 6h55" stroke="#fff4d6" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="spokes" stroke="#334650" stroke-width="3">
      <path d="M-63 0H63M0-63V63M-45-45l90 90M-45 45l90-90"/>
      <circle r="9" fill="#ffd260" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff3d8"/>
  <path d="M0 139Q210 100 408 143T800 125V458H0Z" fill="#cce9e4"/>
  <circle cx="689" cy="179" r="38" fill="#ffd269"/>
  <g fill="#fffaf0" opacity=".85">
    <path d="M38 202q-9-28 21-29 11-31 39-10 36-7 38 26H38Z"/>
    <path d="M532 155q-7-20 14-24 12-24 34-8 27-2 29 22Z"/>
  </g>

  <text x="400" y="52" text-anchor="middle" fill="#233d46" font-family="Arial, sans-serif" font-size="35" font-weight="900">THE PELICAN DELIVERY ECONOMY</text>
  <text x="400" y="87" text-anchor="middle" fill="#586365" font-family="Arial, sans-serif" font-size="18" letter-spacing="2">ZERO EMISSIONS. UNLIMITED BILLING.</text>

  <g stroke="#233d46" stroke-linecap="round" stroke-linejoin="round">
    <path d="M655 322v132" stroke-width="9"/>
    <rect x="602" y="276" width="135" height="61" rx="8" fill="#fff8e8" stroke-width="4"/>
    <text x="669" y="301" text-anchor="middle" stroke="none" fill="#233d46" font-family="Arial, sans-serif" font-size="16" font-weight="bold">BIKE LANE</text>
    <text x="669" y="323" text-anchor="middle" stroke="none" fill="#233d46" font-family="Arial, sans-serif" font-size="14">NO FREE RIDES*</text>
  </g>
  <path d="M0 453Q400 442 800 453V518H0Z" fill="#708b8d"/>
  <rect y="480" width="800" height="12" fill="url(#road)"/>
  <ellipse cx="375" cy="457" rx="224" ry="13" fill="#324c50" opacity=".18"/>

  <g fill="none" stroke="#233d46" stroke-width="12">
