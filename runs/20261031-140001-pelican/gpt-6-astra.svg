    <circle cx="514" cy="390" r="70" fill="#eaf5e6"/>
  </g>
  <g fill="none" stroke="#fff3d8" stroke-width="3">
    <circle cx="239" cy="390" r="63"/>
    <circle cx="514" cy="390" r="63"/>
  </g>
