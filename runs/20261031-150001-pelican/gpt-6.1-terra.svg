<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelicargo Express</title>
  <desc id="desc">A pelican rides a bicycle with a fish in its bill while its wheels spin and its body bobs.</desc>
  <defs>
    <style>
      .ink { stroke:#24304a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#24304a; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .words { font-family:Verdana, Geneva, sans-serif; fill:#24304a; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 1s ease-in-out infinite; }
      .pedal { transform-origin:397px 399px; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
    </style>
  </defs>

