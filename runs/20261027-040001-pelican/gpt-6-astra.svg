<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Satirical cartoon of a pelican riding a bicycle">
  <title>Pelican Power</title>
  <desc>A smug pelican pedals a bicycle while fish cheer from the roadside.</desc>
  <style>
    .ink{stroke:#17212b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .text{font-family:Arial,Helvetica,sans-serif;fill:#17212b}
    .wheel{fill:#d9f3ff;stroke:#17212b;stroke-width:7}
    .spoke{stroke:#5e9fb5;stroke-width:3}
  </style>

  <rect width="800" height="600" fill="#fff6d6"/>
  <rect y="390" width="800" height="210" fill="#b9e6a4"/>
  <path d="M0 390 Q120 350 240 390 T480 390 T720 390 T960 390" fill="none" stroke="#78b77b" stroke-width="10"/>

  <text x="400" y="62" text-anchor="middle" class="text" font-size="42" font-weight="900">PELICAN POWER</text>
  <text x="400" y="98" text-anchor="middle" class="text" font-size="21" font-weight="700">When the beak is big, every commute becomes a campaign.</text>

  <g transform="translate(0 0)">
    <ellipse cx="420" cy="345" rx="175" ry="22" fill="#6b9b68" opacity=".35">
      <animate attributeName="rx" values="175;185;175" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>

    <g>
      <circle cx="250" cy="430" r="86" class="wheel"/>
      <circle cx="570" cy="430" r="86" class="wheel"/>
      <g>
        <path d="M250 344V516 M164 430H336 M189 369L311 491 M189 491L311 369" class="spoke"/>
        <path d="M570 344V516 M484 430H656 M509 369L631 491 M509 491L631 369" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate" from="0 250 430" to="360 250 430" dur="2s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="M570 344V516 M484 430H656 M509 369L631 491 M509 491L631 369" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate" from="0 570 430" to="360 570 430" dur="2s" repeatCount="indefinite"/>
      </g>
      <path d="M250 430 L350 315 L570 430 L250 430 M350 315 L420 430 L570 430 M350 315 L390 270" fill="none" class="ink"/>
      <circle cx="420" cy="430" r="18" fill="#f6b73c" class="ink"/>
      <path d="M420 430 L385 390 M420 430 L458 466" class="ink"/>
      <circle cx="380" cy="386" r="9" fill="#17212b"/>
      <circle cx="462" cy="470" r="9" fill="#17212b"/>
      <path d="M390 270 L430 270" class="ink"/>
      <path d="M425 267 Q450 260 465 276" fill="none" class="ink"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="1.2s" repeatCount="indefinite"/>
      <ellipse cx="410" cy="250" rx="82" ry="92" fill="#f7fbff" class="ink"/>
      <path d="M357 240 Q330 190 352 150 Q405 165 430 220" fill="#d8eef8" class="ink"/>
      <path d="M463 241 Q494 188 478 151 Q430 164 408 220" fill="#d8eef8" class="ink"/>
      <circle cx="382" cy="182" r="10" fill="#17212b"/>
      <circle cx="440" cy="182" r="10" fill="#17212b"/>
      <circle cx="379" cy="178" r="3" fill="#fff"/>
      <circle cx="437" cy="178" r="3" fill="#fff"/>
      <path d="M389 205 Q417 218 447 204" fill="none" class="ink"/>
      <path d="M395 222 Q427 213 454 231 L530 250 Q545 255 530 270 L450 285 Q421 287 397 270 Z" fill="#f28f3b" class="ink"/>
      <path d="M470 250 Q500 254 527 260" fill="none" stroke="#c56c26" stroke-width="5"/>
      <path d="M385 300 Q410 325 440 300" fill="none" class="ink"/>
      <path d="M388 307 L370 352 M433 307 L450 352" class="ink"/>
      <path d="M363 351 Q370 360 382 352 M443 352 Q454 360 465 351" fill="none" class="ink"/>
      <path d="M383 275 Q410 290 438 274" fill="none" stroke="#e6a62f" stroke-width="8"/>
      <text x="410" y="330" text-anchor="middle" class="text" font-size="16" font-weight="700">HONK!</text>
    </g>
  </g>

  <g class="text" font-weight="900">
    <text x="85" y="300" font-size="24" transform="rotate(-8 85 300)">HURRY UP!</text>
    <path d="M145 302 L205 340" fill="none" stroke="#17212b" stroke-width="4"/>
    <text x="625" y="280" font-size="22" transform="rotate(7 625 280)">BEAK LANE</text>
  </g>

  <g transform="translate(55 410)">
    <path d="M0 62 Q35 20 70 62" fill="#5da8c7" class="ink"/>
    <circle cx="35" cy="36" r="23" fill="#f7fbff" class="ink"/>
    <circle cx="28" cy="32" r="4" fill="#17212b"/>
    <path d="M45 40 L82 48 L45 54" fill="#f28f3b" class="ink"/>
    <text x="35" y="100" text-anchor="middle" class="text" font-size="15" font-weight="700">LOCAL FISH</text>
  </g>

  <rect x="20" y="548" width="760" height="38" rx="10" fill="#fff" stroke="#17212b" stroke-width="3"/>
  <text x="400" y="573" text-anchor="middle" class="text" font-size="18" font-weight="700">2026-10-27 04:00:01 SGT (UTC+08:00)</text>
</svg>