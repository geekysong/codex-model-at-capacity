<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="30" y="28" font-size="16" font-weight="bold">Projectile motion</text>
    <text x="30" y="53">vₓ = 20 m/s; vᵧ₀ = 15 m/s</text>
    <text x="30" y="75">g = 10 m/s²; no air resistance</text>
    <text x="30" y="97">Total flight time: 3 s</text>
    <text x="30" y="119">Scale: 10 px per meter</text>
    <text x="30" y="141">Horizontal distances measured from launch.</text>

    <text x="310" y="28" font-size="12">Continuation: 45–60 m</text>
    <text x="310" y="46" font-size="12">(same scale; origin shifted)</text>
  </g>

  <!-- Main chart: x = 100 + 10X; y = 350 - 10H. -->
  <line x1="50" y1="350" x2="550" y2="350" stroke="#596273" stroke-width="2"/>
  <path d="M100 350 Q325 12.5 550 265.625"
        fill="none" stroke="#1769aa" stroke-width="3"/>
  <circle cx="100" cy="350" r="4" fill="#172033"/>
  <circle cx="400" cy="237.5" r="4" fill="#172033"/>

  <!-- Continuation chart: x = 10X - 100; y = 145 - 10H. -->
  <line x1="335" y1="145" x2="530" y2="145" stroke="#596273" stroke-width="2"/>
  <path d="M350 60.625 Q425 88.75 500 145"
        fill="none" stroke="#1769aa" stroke-width="3"/>
  <circle cx="500" cy="145" r="4" fill="#172033"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <text x="60" y="324">launch: 0 m, 0 m</text>
    <text x="300" y="216">apex: 30 m, 11.25 m</text>
    <text x="354" y="174">landing: 60 m, 0 m</text>
    <text x="452" y="292" font-size="12">45 m: see inset</text>
  </g>

  <rect x="0" y="368" width="600" height="32" fill="#eef2f6"/>
  <text x="300" y="389" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-10-25 12:04:26 SGT (UTC+08:00)</text>
</svg>