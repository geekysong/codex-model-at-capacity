<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish</title>
  <desc id="desc">A determined pelican pedals a bicycle with a giant fish-filled bill. The wheels spin, its feet pedal, and its body bobs. Caption: All that cardio. Still carrying a huge bill.</desc>
  <defs>
    <pattern id="tire" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 3L12 9" stroke="#fff" stroke-width="2" opacity=".3"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke:#203849; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .spoke { stroke:#547180; stroke-width:3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5db"/>
  <rect x="16" y="16" width="768" height="568" rx="22" fill="none" stroke="#203849" stroke-width="4"/>
  <text x="400" y="69" text-anchor="middle" font-size="46" font-weight="900" fill="#203849" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="99" text-anchor="middle" font-size="17" font-weight="bold" fill="#92613d">THE ONLY RACE WITH EXCESS BEAK-GAGE</text>

  <path d="M36 352Q125 305 224 346T415 340T610 335T764 350V467H36Z" fill="#dce9c8"/>
  <circle cx="685" cy="165" r="36" fill="#ffd76d"/>
  <g fill="#fff" opacity=".9">
    <path d="M65 168Q60 146 84 146Q101 120 120 146Q149 141 150 168Z"/>
    <path d="M566 137Q565 119 585 121Q597 103 614 123Q637 120 641 137Z"/>
  </g>
  <path d="M36 469H764" stroke="#203849" stroke-width="4"/>
  <ellipse cx="408" cy="465" rx="242" ry="12" fill="#203849" opacity=".12"/>

  <!-- Bicycle wheels: the spoke assemblies rotate around their hubs. -->
  <g>
    <circle cx="245" cy="390" r="73" fill="#fff9e9" class="ink" stroke-width="9"/>
    <circle cx="245" cy="390" r="65" fill="none" stroke="#a9bdbe" stroke-width="3"/>
    <g class="spoke">
      <path d="M245 322V458M177 390H313M197 342L293 438M197 438L293 342"/>
      <circle cx="245" cy="326" r="5" fill="#f5ad46" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0 245 390" to="360 245 390" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle cx="575" cy="390" r="73" fill="#fff9e9" class="ink" stroke-width="9"/>
    <circle cx="575" cy="390" r="65" fill="none" stroke="#a9bdbe" stroke-width="3"/>
    <g class="spoke">
      <path d="M575 322V458M507 390H643M527 342L623 438M527 438L623 342"/>
      <circle cx="575" cy="326" r="5" fill="#f5ad46" stroke="none"/>
      <animateTransform attributeName="transform" type="rotate" from="0 575 390" to="360 575 390" dur="1.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M245 390L320 298L391 390H245L320 298H519L391 390M519 298L575 390" stroke="#203849" stroke-width="13"/>
    <path d="M245 390L320 298L391 390H245M320 298H519L391 390M519 298L575 390" stroke="#ef6b57" stroke-width="7"/>
    <path d="M320 298L307 274M519 298L506 259L536 249" stroke="#203849" stroke-width="8"/>
    <path d="M291 273H330M530 250H548" stroke="#203849" stroke-width="11"/>
    <path d="M245 390L391 390" stroke="#203849" stroke-width="3"/>
  </g>
  <g fill="#f8bc45" class="ink">
    <circle cx="245" cy="390" r="7"/>
    <circle cx="575" cy="390" r="7"/>
    <circle cx="391" cy="390" r="17"/>
  </g>

  <!-- Far leg and rotating crank. -->
  <path d="M345 269L372 324L408 377" fill="none" stroke="#b77d32" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M345 269L372 324L408 377;M345 269L341 339L374 403;M345 269L372 324L408 377" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <g stroke="#203849" stroke-width="5" stroke-linecap="round">
    <path d="M366 390H416"/>
    <animateTransform attributeName="transform" type="rotate" from="0 391 390" to="360 391 390" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- The rider bobs independently of the stationary lettering. -->
  <g class="ink">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <path d="M283 234L239 214L259 250L236 245L280 277" fill="#fffdf3"/>
    <path d="M283 209Q320 186 363 206Q386 219 393 253Q366 293 303 278Q266 269 267 239Z" fill="#fffdf3"/>
    <path d="M278 231Q323 214 365 236L350 274Q309 287 278 261Z" fill="#34a2a0"/>
    <path d="M291 247Q321 237 347 249L320 262Z" fill="#e7eee4" stroke-width="3"/>
    <path d="M360 238Q407 220 406 184Q403 153 423 150Q448 150 446 185Q446 231 391 259" fill="#fffdf3"/>
    <path d="M354 233Q400 242 429 258L510 258" fill="none" stroke="#fffdf3" stroke-width="19"/>
    <path d="M354 233Q400 242 429 258L510 258" fill="none" stroke-width="4"/>
    <path d="M344 214L380 217L373 233L340 229Z" fill="#ef6b57"/>
    <path d="M345 215L321 193L325 217L301 206L320 229Z" fill="#ef6b57"/>

    <!-- Vast bill, visibly weighed down by lunch. -->
    <path d="M444 178L650 200Q604 275 510 247Q463 234 444 194Z" fill="#ffc55a"/>
    <path d="M449 180L651 198L449 197Z" fill="#ed9546"/>
    <path d="M472 207Q522 237 576 223" fill="none" stroke="#d58c36" stroke-width="3"/>
    <g stroke-width="3">
      <path d="M509 219Q533 198 560 216L577 207L574 228L558 220Q530 238 509 219Z" fill="#7ebdc0"/>
      <circle cx="520" cy="216" r="3" fill="#203849" stroke="none"/>
      <path d="M543 215L537 207M541 226L547 218" fill="none"/>
    </g>
    <path d="M400 168Q396 135 426 130Q453 129 463 159L439 162L432 147L425 165Z" fill="#ef6b57"/>
    <path d="M411 140L414 152M428 136L433 149M444 141L450 153" fill="none" stroke-width="3"/>
    <ellipse cx="435" cy="176" rx="10" ry="13" fill="#fff"/>
    <circle cx="439" cy="178" r="4" fill="#203849" stroke="none"/>
    <path d="M426 159L443 163" fill="none" stroke-width="4"/>
    <path d="M400 185L388 192M398 196L385 201" fill="none" stroke-width="3"/>
  </g>

  <!-- Near foot pedals through a small continuous motion. -->
  <g class="ink">
    <path d="M332 275L321 324L376 385" fill="none" stroke="#e7a844" stroke-width="13">
      <animate attributeName="d" values="M332 275L321 324L376 385;M332 275L361 325L406 397;M332 275L321 324L376 385" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M369 380L396 385L402 396H367Z" fill="#f8bc45">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 12;0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="none" stroke="#547180" stroke-width="4" stroke-linecap="round">
    <path d="M160 288H216M176 308H208M133 329H199"/>
    <path d="M474 141L480 130M488 152L500 147"/>
  </g>
  <g transform="translate(95 206) rotate(-9)">
    <rect width="130" height="48" rx="7" fill="#fffdf3" stroke="#203849" stroke-width="3"/>
    <text x="65" y="20" text-anchor="middle" fill="#203849" font-size="13" font-weight="bold">FUELED BY</text>
    <text x="65" y="39" text-anchor="middle" fill="#c14d3c" font-size="17" font-weight="900">SARDINES</text>
  </g>

  <text x="400" y="507" text-anchor="middle" font-size="24" font-weight="bold" fill="#203849">All that cardio. Still carrying a huge bill.</text>
  <path d="M48 531H752" stroke="#d2c3a4" stroke-width="2"/>
  <text x="400" y="562" text-anchor="middle" font-size="18" fill="#203849">2026-10-30 14:00:01 SGT (UTC+08:00)</text>
</svg>