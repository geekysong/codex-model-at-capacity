<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: A pelican on a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle, its enormous bill full of fish. A sign demands no fishing while riding. Wheels spin and the rider bobs continuously.</desc>
