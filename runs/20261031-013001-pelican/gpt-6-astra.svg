  <rect x="0" y="499" width="800" height="101" fill="#203541"/>
  <text x="400" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff4d9">The pelican’s bike is light. His lunch is over the limit.</text>
