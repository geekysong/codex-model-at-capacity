        <path d="M-63 0H63M0-63V63M-45-45L45 45M-45 45L45-45"/>
      </g>
      <path d="M-25-59A64 64 0 0 1 28-58" fill="none" stroke="#efb747" stroke-width="5"/>
      <circle r="8" fill="#203541"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
