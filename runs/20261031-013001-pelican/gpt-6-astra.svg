  <text x="145" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#203541">
    <tspan x="145">“It’s called</tspan>
    <tspan x="145" dy="24">carp-loading.”</tspan>
  </text>
