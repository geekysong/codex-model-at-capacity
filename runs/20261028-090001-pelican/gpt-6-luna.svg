<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican pedals furiously on a bicycle while carrying an absurdly large fish.</desc>
  <rect width="800" height="600" fill="#dff5ff"/>
  <rect y="430" width="800" height="170" fill="#9bd18b"/>
  <path d="M0 455 Q130 420 260 455 T520 455 T800 455" fill="none" stroke="#5c9b55" stroke-width="8"/>
  <text x="400" y="62" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="900" fill="#17324d">PELICAN ON A BICYCLE!</text>
  <text x="400" y="95" text-anchor="middle" font-family="sans-serif" font-size="19" font-style="italic" fill="#234">When the fish says “take the scenic route.”</text>

  <g id="bike">
    <circle cx="250" cy="430" r="82" fill="none" stroke="#263746" stroke-width="10"/>
    <circle cx="560" cy="430" r="82" fill="none" stroke="#263746" stroke-width="10"/>
    <g stroke="#718694" stroke-width="3">
      <path d="M250 348V512M168 430H332M192 372L308 488M308 372L192 488"/>
      <path d="M560 348V512M478 430H642M502 372L618 488M618 372L502 488"/>
    </g>
    <path d="M250 430 L350 330 L470 430 L250 430 L390 430 L350 330" fill="none" stroke="#d44b3d" stroke-width="11" stroke-linejoin="round"/>
    <path d="M470 430 L510 325 L560 348" fill="none" stroke="#d44b3d" stroke-width="10"/>
    <path d="M500 325 L550 315" stroke="#263746" stroke-width="9" stroke-linecap="round"/>
    <circle cx="390" cy="430" r="14" fill="#f5c542" stroke="#263746" stroke-width="6"/>
    <g id="pedal" stroke="#263746" stroke-width="6" stroke-linecap="round">
      <path d="M390 430 L420 460M390 430 L360 400"/>
      <path d="M420 460h22M360 400h-22"/>
    </g>
    <animateTransform href="#pedal" attributeName="transform" type="rotate" from="0 390 430" to="360 390 430" dur="1.2s" repeatCount="indefinite"/>
    <g fill="#263746">
      <circle cx="250" cy="430" r="8"/>
      <circle cx="560" cy="430" r="8"/>
    </g>
    <animateTransform href="#bike" attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.6s" repeatCount="indefinite"/>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="390" cy="275" rx="78" ry="94" fill="#f7f7f2" stroke="#263746" stroke-width="7"/>
    <path d="M350 210 Q390 160 432 205 L420 270 Q387 290 350 260Z" fill="#e8ece9" stroke="#263746" stroke-width="7"/>
    <circle cx="405" cy="205" r="9" fill="#263746"/>
    <path d="M430 220 Q520 205 600 245 Q522 286 430 254Z" fill="#f0a43c" stroke="#263746" stroke-width="7"/>
    <path d="M447 241 Q510 258 570 247" fill="none" stroke="#c87527" stroke-width="5"/>
    <path d="M350 270 Q300 315 320 380" fill="none" stroke="#263746" stroke-width="24" stroke-linecap="round"/>
    <path d="M430 270 Q475 310 462 380" fill="none" stroke="#263746" stroke-width="24" stroke-linecap="round"/>
    <path d="M320 380 L350 400 M462 380 L432 400" stroke="#f0a43c" stroke-width="11" stroke-linecap="round"/>
    <path d="M355 300 Q390 330 425 300" fill="none" stroke="#d44b3d" stroke-width="6"/>
    <path d="M340 180 Q300 150 275 175" fill="none" stroke="#f0a43c" stroke-width="12" stroke-linecap="round"/>
    <path d="M470 285 Q535 285 575 325" fill="none" stroke="#f0a43c" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g transform="translate(575 170) rotate(12)">
    <path d="M0 35 Q55 0 105 35 Q60 70 0 35Z" fill="#6fb6d8" stroke="#263746" stroke-width="6"/>
    <path d="M105 35 l28 -18 l-8 22 l8 22z" fill="#f0a43c" stroke="#263746" stroke-width="5"/>
    <circle cx="25" cy="30" r="4" fill="#263746"/>
  </g>
  <text x="620" y="150" font-family="sans-serif" font-size="17" font-weight="bold" fill="#17324d" transform="rotate(8 620 150)">Emergency snack!</text>

  <rect x="34" y="535" width="732" height="42" rx="10" fill="#ffffff" fill-opacity="0.88" stroke="#263746" stroke-width="3"/>
  <text x="400" y="562" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#17324d">2026-10-28 09:01:14 SGT (UTC+08:00)</text>
</svg>