<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying an oversized fish.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de6ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#616875"/>
      <stop offset="1" stop-color="#343945"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17202a" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202735;stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
      .label{font-family:Arial,sans-serif;fill:#202735}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx=" ninety" cy="95" r="48" fill="#fff4a8" opacity=".8"/>
  <path d="M0 355 Q110 295 220 350 T450 340 T680 350 T800 320 V445 H0Z" fill="#92c77b"/>
  <path d="M0 420 Q170 390 330 420 T650 410 T800 425 V520 H0Z" fill="#78ad68"/>
  <path d="M0 455 Q200 430 400 460 T800 450 V600 H0Z" fill="url(#road)"/>
  <path d="M0 516 Q180 490 360 520 T800 510" fill="none" stroke="#f9db65" stroke-width="8" stroke-dasharray="35 26"/>

  <g class="label" text-anchor="middle">
    <rect x="180" y="24" width="440" height="70" rx="20" fill="#fff8dc" stroke="#202735" stroke-width="6" filter="url(#shadow)"/>
    <text x="400" y="55" font-size="30" font-weight="900">PELICAN POWER!</text>
    <text x="400" y="81" font-size="17" font-weight="700">The only commute with a built-in snack compartment</text>
  </g>

  <g transform="translate(0,5)" filter="url(#shadow)">
    <!-- bicycle -->
    <g id="bike">
      <g id="wheelBack">
        <circle cx="260" cy="455" r="70" fill="#202735" class="ink"/>
        <circle cx="260" cy="455" r="58" fill="#e9eef2" stroke="#202735" stroke-width="5"/>
        <g stroke="#77818d" stroke-width="3">
          <path d="M260 397V513M202 455H318M219 414L301 496M301 414L219 496"/>
        </g>
        <circle cx="260" cy="455" r="8" fill="#f05a4f" class="ink"/>
      </g>
      <g id="wheelFront">
        <circle cx="570" cy="455" r="70" fill="#202735" class="ink"/>
        <circle cx="570" cy="455" r="58" fill="#e9eef2" stroke="#202735" stroke-width="5"/>
        <g stroke="#77818d" stroke-width="3">
          <path d="M570 397V513M512 455H628M529 414L611 496M611 414L529 496"/>
        </g>
        <circle cx="570" cy="455" r="8" fill="#f05a4f" class="ink"/>
      </g>
      <path d="M260 455 L355 350 L455 455 L260 455 L410 455 L355 350 L570 455 L535 350" fill="none" stroke="#d94c45" stroke-width="10"/>
      <path d="M355 350 L385 300" fill="none" stroke="#202735" stroke-width="8"/>
      <path d="M375 300 Q405 286 430 300" fill="none" stroke="#202735" stroke-width="8"/>
      <path d="M535 350 L565 300" fill="none" stroke="#202735" stroke-width="8"/>
      <path d="M535 350 L570 455" fill="none" stroke="#202735" stroke-width="7"/>
      <path d="M342 455 Q355 430 380 455" fill="none" stroke="#202735" stroke-width="7"/>
      <circle cx="365" cy="455" r="12" fill="#f7c843" class="ink"/>
      <path d="M365 455 l-27 -13 M365 455 l22 17" stroke="#202735" stroke-width="6"/>
      <animateTransform attributeName="transform" type="translate" values="0 5;0 0;0 5" dur="1.2s" repeatCount="indefinite"/>
    </g>

    <!-- pelican body -->
    <g id="pelican">
      <ellipse cx="395" cy="258" rx="105" ry="115" fill="#f4f1e8" class="ink"/>
      <path d="M330 245 Q385 205 450 230 Q475 270 440 320 Q385 340 335 300Z" fill="#d8e3e6" class="ink"/>
      <path d="M355 174 Q390 125 445 150 Q478 170 462 220 L430 242 Q380 235 355 205Z" fill="#f4f1e8" class="ink"/>
      <path d="M430 178 Q505 163 608 205 Q628 216 608 235 Q525 251 440 225Z" fill="#f09b48" class="ink"/>
      <path d="M446 208 Q525 225 604 218" fill="none" stroke="#c96b31" stroke-width="5"/>
      <ellipse cx="437" cy="181" rx="9" ry="12" fill="#202735"/>
      <circle cx="440" cy="177" r="3" fill="#fff"/>
      <path d="M405 153 Q425 138 447 151" fill="none" stroke="#202735" stroke-width="6"/>
      <path d="M386 327 Q405 360 430 382" fill="none" stroke="#f09b48" stroke-width="13"/>
      <path d="M430 382 L455 405 M430 382 L405 405" fill="none" stroke="#f09b48" stroke-width="8"/>
      <path d="M350 328 Q335 366 350 399" fill="none" stroke="#f09b48" stroke-width="13"/>
      <path d="M350 399 L375 420 M350 399 L327 420" fill="none" stroke="#f09b48" stroke-width="8"/>
      <path d="M327 420 Q350 428 375 420" fill="none" stroke="#202735" stroke-width="5"/>
      <!-- wing and fish -->
      <path d="M342 240 Q292 275 320 330 Q350 351 380 312" fill="#c9d7dc" class="ink"/>
      <path d="M303 284 Q265 265 238 285 Q270 309 315 309Z" fill="#69b8d6" class="ink"/>
      <path d="M238 285 l-20 -15 l5 25 l-18 14 l31 -3" fill="#69b8d6" class="ink"/>
      <circle cx="304" cy="287" r="4" fill="#202735"/>
      <text x="395" y="115" class="label" font-size="18" font-weight="800" text-anchor="middle">"I call it beak-to-seat transit."</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <g class="label">
    <path d="M625 285 Q690 265 745 300" fill="none" stroke="#202735" stroke-width="4"/>
    <text x="700" y="275" font-size="19" font-weight="900" text-anchor="middle">NO FUEL.</text>
    <text x="700" y="298" font-size="19" font-weight="900" text-anchor="middle">JUST FOWL PLAY.</text>
  </g>

  <text x="400" y="548" class="label" font-size="16" font-weight="700" text-anchor="middle">
    2026-10-28 09:02:05 SGT (UTC+08:00)
  </text>

  <animateTransform href="#wheelBack" attributeName="transform" type="rotate" from="0 260 455" to="360 260 455" dur="1.2s" repeatCount="indefinite"/>
  <animateTransform href="#wheelFront" attributeName="transform" type="rotate" from="0 570 455" to="360 570 455" dur="1.2s" repeatCount="indefinite"/>
</svg>