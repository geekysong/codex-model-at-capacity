<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a huge fish-filled beak, passing a fuel station. Wheels spin and the rider bobs in a looping animation.</desc>
