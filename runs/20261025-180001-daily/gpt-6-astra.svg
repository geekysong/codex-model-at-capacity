<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="30" y="30" font-size="20" font-weight="bold">Projectile motion</text>
    <text x="30" y="57" font-size="14">Initial velocity: horizontal 20 m/s; vertical 15 m/s</text>
    <text x="30" y="80" font-size="14">Gravity: 10 m/s² · No air resistance · Flight time: 3 s</text>
    <text x="30" y="109" font-size="13">Scale: 10 px/m; horizontal distances 34–56 m omitted.</text>
    <text x="30" y="130" font-size="13">Axis break is necessary: the unbroken landing would be at x=700.</text>
  </g>

  <path d="M50 350 H550" fill="none" stroke="#374151" stroke-width="2"/>

  <!-- x=100+200t, y=350-150t+50t².
       After the horizontal axis break, x is translated by -200 px. -->
  <path d="M100 350 Q270 222.5 440 239.5"
        fill="none" stroke="#1768b3" stroke-width="3"/>
  <path d="M460 322 Q480 335 500 350"
        fill="none" stroke="#1768b3" stroke-width="3"/>

  <path d="M440 247 L460 314" fill="none"
        stroke="#7c8798" stroke-width="1.5" stroke-dasharray="4 5"/>
  <path d="M440 277 l12 -7 M444 287 l12 -7"
        fill="none" stroke="#374151" stroke-width="2"/>

  <g fill="#1768b3">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="54" y="311">launch:</text>
    <text x="54" y="331">0 m, 0 m</text>
    <text x="310" y="214">apex: 30 m, 11.25 m</text>
    <text x="478" y="299">landing:</text>
    <text x="478" y="319">60 m, 0 m</text>
  </g>

  <rect x="0" y="366" width="600" height="34" fill="#eef2f6"/>
  <text x="300" y="388" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="14" fill="#172033">2026-10-25 18:03:52 SGT (UTC+08:00)</text>
</svg>