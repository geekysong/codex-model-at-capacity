<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Knight moves from square 6 on a 4 by 4 grid</title>
  <desc id="desc">Squares 4, 12, 13, and 15 are reachable in one knight move from square 6.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="150" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">4 × 4 Knight-Move Grid</text>

  <g stroke="#334155" stroke-width="2">
    <rect x="30" y="50" width="60" height="60" fill="#ffffff"/>
    <rect x="90" y="50" width="60" height="60" fill="#ffffff"/>
    <rect x="150" y="50" width="60" height="60" fill="#ffffff"/>
    <rect x="210" y="50" width="60" height="60" fill="#facc15"/>
    <rect x="30" y="110" width="60" height="60" fill="#ffffff"/>
    <rect x="90" y="110" width="60" height="60" fill="#60a5fa"/>
    <rect x="150" y="110" width="60" height="60" fill="#ffffff"/>
    <rect x="210" y="110" width="60" height="60" fill="#ffffff"/>
    <rect x="30" y="170" width="60" height="60" fill="#ffffff"/>
    <rect x="90" y="170" width="60" height="60" fill="#ffffff"/>
    <rect x="150" y="170" width="60" height="60" fill="#ffffff"/>
    <rect x="210" y="170" width="60" height="60" fill="#facc15"/>
    <rect x="30" y="230" width="60" height="60" fill="#facc15"/>
    <rect x="90" y="230" width="60" height="60" fill="#ffffff"/>
    <rect x="150" y="230" width="60" height="60" fill="#facc15"/>
    <rect x="210" y="230" width="60" height="60" fill="#ffffff"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#111827">
    <text x="60" y="80">1</text><text x="120" y="80">2</text><text x="180" y="80">3</text><text x="240" y="80">4</text>
    <text x="60" y="140">5</text><text x="120" y="140">6</text><text x="180" y="140">7</text><text x="240" y="140">8</text>
    <text x="60" y="200">9</text><text x="120" y="200">10</text><text x="180" y="200">11</text><text x="240" y="200">12</text>
    <text x="60" y="260">13</text><text x="120" y="260">14</text><text x="180" y="260">15</text><text x="240" y="260">16</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="330" y="80" font-size="22" font-weight="bold">Legend</text>
    <rect x="330" y="100" width="20" height="20" fill="#60a5fa" stroke="#334155" stroke-width="1"/>
    <text x="362" y="116" font-size="16">Starting square: 6</text>
    <rect x="330" y="140" width="20" height="20" fill="#facc15" stroke="#334155" stroke-width="1"/>
    <text x="362" y="156" font-size="16">Reachable by knight</text>
    <text x="330" y="205" font-size="18" font-weight="bold">Shaded squares: 4</text>
    <text x="330" y="238" font-size="17">Numbers: 4, 12, 13, 15</text>
    <text x="330" y="280" font-size="14" fill="#475569">A knight moves two squares</text>
    <text x="330" y="300" font-size="14" fill="#475569">in one direction and one across.</text>
  </g>

  <line x1="30" y1="335" x2="570" y2="335" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-10-26 14:05:23 SGT (UTC+08:00)</text>
</svg>