<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Against Common Sense</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while carrying an absurdly large fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9edfff"/>
      <stop offset="1" stop-color="#f7f1c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#333" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#252525;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#252525}
      .wheel{fill:none;stroke:#252525;stroke-width:8}
      .spoke{stroke:#555;stroke-width:3}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 405 Q110 355 220 405 T440 405 T660 405 T880 405 V505 H0Z" fill="#8bcf78"/>
  <path d="M0 470 Q180 430 360 470 T720 470 T1000 470" fill="none" stroke="#4f9e59" stroke-width="8"/>
  <path d="M0 505 H800" stroke="#6c6c6c" stroke-width="18"/>
  <path d="M0 505 H800" stroke="#d9d9d9" stroke-width="5" stroke-dasharray="35 28"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="36" font-weight="900" fill="#173b57">
    PELICAN PEDALS AGAINST COMMON SENSE
  </text>
  <text x="400" y="92" text-anchor="middle" class="label" font-size="19" font-style="italic">
    “Why walk when you can wobble with dignity?”
  </text>

  <g filter="url(#shadow)">
    <g id="bike">
      <circle cx="250" cy="432" r="78" class="wheel"/>
      <circle cx="600" cy="432" r="78" class="wheel"/>
      <g>
        <circle cx="250" cy="432" r="8" fill="#252525"/>
        <path d="M250 432 L250 354 M250 432 L315 397 M250 432 L315 467 M250 432 L185 397 M250 432 L185 467" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate" from="0 250 432" to="360 250 432" dur="2s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle cx="600" cy="432" r="8" fill="#252525"/>
        <path d="M600 432 L600 354 M600 432 L665 397 M600 432 L665 467 M600 432 L535 397 M600 432 L535 467" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate" from="0 600 432" to="360 600 432" dur="2s" repeatCount="indefinite"/>
      </g>
      <path d="M250 432 L350 320 L470 432 L250 432 M350 320 L420 432 M350 320 L395 282 M470 432 L600 432 M470 432 L520 365" fill="none" class="ink"/>
      <path d="M395 282 L440 282" class="ink"/>
      <circle cx="420" cy="432" r="24" fill="none" class="ink"/>
      <path d="M420 432 L445 410 M420 432 L395 454" class="ink"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 420 432" to="360 420 432" dur="1.2s" repeatCount="indefinite"/>
        <path d="M420 432 L450 450 M420 432 L390 414" class="ink"/>
        <circle cx="450" cy="450" r="6" fill="#e34b35"/>
        <circle cx="390" cy="414" r="6" fill="#e34b35"/>
      </g>
      <path d="M505 355 Q535 345 555 360" fill="none" class="ink"/>
      <path d="M515 350 L520 328" class="ink"/>
    </g>

    <g id="pelican">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
      <path d="M370 305 Q330 250 370 195 Q410 145 475 165 Q535 182 545 240 Q552 286 510 320 Q455 350 370 305Z" fill="#f4f0df" class="ink"/>
      <path d="M390 205 Q430 170 480 190 Q520 210 520 255 Q510 290 475 294 Q430 292 405 260Z" fill="#fffdf2" class="ink"/>
      <ellipse cx="495" cy="205" rx="28" ry="35" fill="#f4f0df" class="ink"/>
      <circle cx="503" cy="198" r="7" fill="#252525"/>
      <path d="M518 220 Q625 235 650 275 Q590 305 510 260Z" fill="#f5a447" class="ink"/>
      <path d="M535 248 Q588 265 620 280" fill="none" stroke="#c66b25" stroke-width="4"/>
      <path d="M413 278 Q385 332 405 365" fill="none" class="ink"/>
      <path d="M490 286 Q510 330 495 365" fill="none" class="ink"/>
      <path d="M398 365 Q420 370 437 365 M480 365 Q502 370 520 365" fill="none" class="ink"/>
      <path d="M400 245 Q355 230 330 255 Q360 280 407 275" fill="#dce8ec" class="ink"/>
      <path d="M390 250 Q355 255 342 272" fill="none" stroke="#7c9aa4" stroke-width="4"/>
      <path d="M445 300 Q462 315 478 300" fill="none" class="ink"/>
      <path d="M455 118 Q470 102 485 118" fill="none" class="ink"/>
      <path d="M468 118 Q485 100 500 118" fill="none" class="ink"/>
    </g>

    <g id="fish">
      <path d="M610 162 Q680 120 735 165 Q680 210 610 190 Q585 180 610 162Z" fill="#7ec8d8" class="ink"/>
      <path d="M735 165 L770 142 L758 180 L770 205Z" fill="#f0a34a" class="ink"/>
      <circle cx="680" cy="166" r="6" fill="#252525"/>
      <path d="M635 155 Q655 145 668 151" fill="none" stroke="#3e8da1" stroke-width="4"/>
      <text x="680" y="115" text-anchor="middle" class="label" font-size="18" font-weight="bold">EMERGENCY LUNCH</text>
    </g>
  </g>

  <path d="M120 180 Q95 150 120 130 M95 210 Q65 180 90 155" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <text x="110" y="250" class="label" font-size="20" font-weight="bold" transform="rotate(-12 110 250)">HONK!</text>

  <rect x="40" y="535" width="720" height="42" rx="12" fill="#fff8df" stroke="#252525" stroke-width="3"/>
  <text x="400" y="562" text-anchor="middle" class="label" font-size="16" font-weight="bold">
    2026-10-28 02:31:58 SGT (UTC+08:00)
  </text>
</svg>