<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink { stroke:#263238; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#263238; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2.2s linear infinite; }
      .rider { transform-box:fill-box; transform-origin:center bottom; animation:bob .7s ease-in-out infinite alternate; }
      .pedal { transform-box:fill-box; transform-origin:center; animation:spin 1.1s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0px) rotate(-1deg); } to { transform:translateY(-5px) rotate(1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#ffd95a" opacity=".9"/>
  <g fill="#fff" opacity=".8">
    <path d="M90 120c18-25 48-25 66 0 18-18 51-8 54 18H55c2-25 22-34 35-18z"/>
    <path d="M520 92c15-19 39-19 54 0 16-15 40-6 43 15H485c2-20 20-28 35-15z"/>
  </g>

  <text x="400" y="52" text-anchor="middle" class="label" font-size="34" font-weight="900" fill="#e94f37">THE GREAT PELICAN PEDAL</text>
  <text x="400" y="82" text-anchor="middle" class="label" font-size="18" font-weight="700">One bird. Two wheels. Absolutely no license.</text>

  <path d="M0 420 Q180 390 360 420 T800 410 L800 600 0 600Z" fill="url(#road)"/>
  <path d="M0 505h800" stroke="#ffe27a" stroke-width="8" stroke-dasharray="40 28" opacity=".8"/>
  <path d="M0 430 Q180 400 360 430 T800 420" fill="none" stroke="#b4e48a" stroke-width="20"/>

  <g opacity=".35" fill="#263238">
    <ellipse cx="405" cy="520" rx="185" ry="20"/>
  </g>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <g class="wheel">
      <circle cx="250" cy="442" r="72" fill="#f7f7f7" class="ink"/>
      <circle cx="250" cy="442" r="10" fill="#ef5350" class="ink"/>
      <g stroke="#607d8b" stroke-width="3">
        <path d="M250 370v144M178 442h144M199 391l102 102M301 391L199 493"/>
      </g>
      <circle cx="250" cy="442" r="61" fill="none" stroke="#263238" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="560" cy="442" r="72" fill="#f7f7f7" class="ink"/>
      <circle cx="560" cy="442" r="10" fill="#ef5350" class="ink"/>
      <g stroke="#607d8b" stroke-width="3">
        <path d="M560 370v144M488 442h144M509 391l102 102M611 391L509 493"/>
      </g>
      <circle cx="560" cy="442" r="61" fill="none" stroke="#263238" stroke-width="4"/>
    </g>

    <path d="M250 442 L350 350 L470 442 L250 442 L410 442 L350 350" fill="none" stroke="#e94f37" stroke-width="10"/>
    <path d="M470 442 L560 442 M350 350 L330 320 M470 442 L500 355" fill="none" stroke="#263238" stroke-width="8"/>
    <path d="M310 320h48 M485 355h48" stroke="#263238" stroke-width="8" stroke-linecap="round"/>
    <circle cx="410" cy="442" r="17" fill="#ffd95a" class="ink"/>
    <g class="pedal">
      <path d="M410 442l42 22M410 442l-36-25" stroke="#263238" stroke-width="6"/>
      <path d="M447 464h24M350 405h24" stroke="#263238" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- pelican rider -->
  <g class="rider" filter="url(#shadow)">
    <ellipse cx="400" cy="270" rx="68" ry="92" fill="#f4f1e8" class="ink"/>
    <path d="M350 290 Q300 330 326 385 L375 350" fill="#d9d4c8" class="ink"/>
    <path d="M449 285 Q500 320 475 370 L430 345" fill="#d9d4c8" class="ink"/>
    <path d="M372 335 Q400 350 430 335 L445 395 L360 395Z" fill="#ef5350" class="ink"/>
    <path d="M360 395 L335 442 M445 395 L470 442" stroke="#263238" stroke-width="9"/>
    <path d="M326 385 L300 420 M475 370 L505 405" stroke="#263238" stroke-width="9"/>
    <circle cx="400" cy="178" r="62" fill="#f4f1e8" class="ink"/>
    <path d="M367 168 Q400 126 433 168" fill="#f4f1e8" class="ink"/>
    <path d="M348 185 Q400 205 452 185 L505 218 Q400 270 295 218Z" fill="#f29b38" class="ink"/>
    <path d="M310 218 Q400 248 490 218" fill="none" stroke="#c66b22" stroke-width="5"/>
    <circle cx="378" cy="168" r="8" fill="#263238"/>
    <circle cx="422" cy="168" r="8" fill="#263238"/>
    <path d="M386 225 Q400 235 414 225" fill="none" stroke="#263238" stroke-width="4"/>
    <path d="M345 135 Q400 105 455 135" fill="none" stroke="#ef5350" stroke-width="12"/>
    <path d="M455 135l18-25 7 34" fill="#ef5350" class="ink"/>
  </g>

  <g class="label" font-weight="800">
    <path d="M115 275 Q170 245 240 285" fill="none" stroke="#263238" stroke-width="3"/>
    <text x="58" y="245" font-size="19">“Beak performance!”</text>
    <path d="M585 240 Q540 215 478 235" fill="none" stroke="#263238" stroke-width="3"/>
    <text x="595" y="215" font-size="19">NO BRAKES?</text>
    <text x="612" y="238" font-size="16">Just vibes.</text>
  </g>

  <rect x="36" y="548" width="728" height="34" rx="12" fill="#fff" opacity=".9" class="ink"/>
  <text x="400" y="571" text-anchor="middle" class="label" font-size="16" font-weight="700">2026-10-28 02:31:00 SGT (UTC+08:00)</text>
</svg>