  </g>

  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="900" fill="#263b46" letter-spacing="2">THE PELICAN EXPRESS</text>
  <text x="400" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#596c6b">One bird. Two wheels. An unreasonable carry-on.</text>

  <g transform="translate(68 278)">
    <rect width="114" height="64" rx="8" fill="#fffdf5" stroke="#516e66" stroke-width="3"/>
    <text x="57" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#516e66">BIKE LANE</text>
    <text x="57" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#516e66">BILLS EXTRA</text>
    <path d="M57 64V159" stroke="#516e66" stroke-width="7"/>
  </g>

