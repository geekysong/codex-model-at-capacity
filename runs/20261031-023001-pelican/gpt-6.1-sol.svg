        <path d="M-69 0H69M0-69V69M-49-49L49 49M-49 49L49-49M-64-26L64 26M-26-64L26 64M-64 26L64-26M-26 64L26-64"/>
      </g>
      <circle cx="0" cy="-67" r="6" fill="#f46448"/>
      <circle r="10" fill="#263b46"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5db"/>
  <path d="M0 325Q160 292 320 329T640 318T800 324V483H0Z" fill="#d4e7d6"/>
