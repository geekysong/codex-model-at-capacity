  <g font-family="Arial, sans-serif" fill="#263b46">
    <path d="M601 279Q639 264 714 279Q741 285 730 318Q714 341 636 325L609 342L616 319Q590 308 601 279Z" fill="#fffdf5" stroke="#263b46" stroke-width="3"/>
    <text x="665" y="298" text-anchor="middle" font-size="17" font-weight="bold">“It's all</text>
    <text x="665" y="319" text-anchor="middle" font-size="17" font-weight="bold">hand luggage.”</text>
  </g>

  <rect x="0" y="510" width="800" height="90" fill="#263b46"/>
  <text x="400" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff5db">He cycles to work. His lunch takes the scenic route.</text>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#ffdc89">2026-10-31 02:31:25 SGT (UTC+08:00)</text>
