<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Express</title>
  <desc id="description">A smug pelican pedals a bicycle with an enormous fish-filled bill. The wheels spin, the pedals turn, and the rider bobs in a seamless loop.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1"/>
    <g id="wheel">
      <circle r="77" fill="#fffaf0" stroke="#263b46" stroke-width="10"/>
      <circle r="67" fill="none" stroke="#f3b341" stroke-width="3"/>
