<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN POWER</title>
  <desc id="desc">A determined pelican pedals a bicycle, carrying fish in its enormous bill.</desc>
  <defs>
    <pattern id="spokes" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="60" cy="60" r="54" fill="#fff9e9" stroke="#263744" stroke-width="8"/>
      <circle cx="60" cy="60" r="5" fill="#263744"/>
      <g stroke="#8ba1a4" stroke-width="2">
        <path d="M60 8v104M8 60h104M23 23l74 74M97 23L23 97"/>
      </g>
    </pattern>
    <g id="wheel">
      <circle r="57" fill="#fff9e9" stroke="#263744" stroke-width="9"/>
      <circle r="47" fill="none" stroke="#e76f51" stroke-width="3"/>
      <g stroke="#93a6a7" stroke-width="2">
        <path d="M0-47V47M-47 0H47M-33-33L33 33M33-33L-33 33"/>
      </g>
      <circle r="6" fill="#263744"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d8"/>
  <rect x="18" y="18" width="764" height="564" rx="22" fill="#f8e9c8" stroke="#263744" stroke-width="4"/>
  <rect x="34" y="91" width="732" height="374" rx="18" fill="#bce7e6"/>
  <circle cx="663" cy="150" r="34" fill="#ffd166"/>
  <g fill="#fffdf2" opacity=".85">
    <path d="M96 163c-7-22 23-34 37-18 14-21 47-13 48 11 21-2 25 24 3 27H94c-17-2-17-19 2-20z"/>
    <path d="M501 131c-4-15 18-23 27-11 11-15 34-8 34 8 15-1 19 17 3 19h-64c-12-1-12-15 0-16z"/>
  </g>
  <text x="400" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="42" letter-spacing="3" fill="#263744">PELICAN POWER</text>

  <path d="M35 411q130-16 260 0t260 0 211 0v54H35z" fill="#86b88c"/>
  <path d="M35 432h731" stroke="#4e7666" stroke-width="3" stroke-dasharray="13 12"/>
  <g fill="#477e69" opacity=".8">
    <path d="M90 411l-6-16 10 11 5-18 3 23zM695 411l-8-17 11 10 5-19 3 26zM157 419l-5-12 8 8 4-13 3 17z"/>
  </g>

  <!-- Bicycle wheels -->
  <g transform="translate(250 389)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(550 389)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#df5b49" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 389l91-115 61 115H250l135-91 17 91"/>
    <path d="M402 389l99-116 49 116M385 298h116"/>
  </g>
  <g fill="none" stroke="#263744" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M341 274l-10-18M307 254h49M501 273l-8-29h33q15 0 15 14"/>
  </g>
  <circle cx="402" cy="389" r="17" fill="#f8e9c8" stroke="#263744" stroke-width="5"/>
  <g>
    <path d="M402 389l22 17" stroke="#263744" stroke-width="6" stroke-linecap="round"/>
    <path d="M416 408h20" stroke="#263744" stroke-width="7" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" values="0 402 389;360 402 389" dur="2s" repeatCount="indefinite"/>
  </g>

  <!-- Pelican gently bobs as it rides -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1s" repeatCount="indefinite"/>
    <!-- Tail and body -->
    <path d="M311 252l-57-27 30 48-38-10 51 39z" fill="#f3f0df" stroke="#263744" stroke-width="4" stroke-linejoin="round"/>
    <path d="M294 224c15-43 79-57 123-30 35 21 42 65 14 91-24 22-95 24-123-1-18-16-23-37-14-60z" fill="#fffdf0" stroke="#263744" stroke-width="5"/>
    <path d="M317 232c16-26 58-31 93-13-5 28-33 52-68 45-18-4-26-15-25-32z" fill="#e5dfcd" stroke="#263744" stroke-width="3"/>
    <path d="M338 242q23 12 49-3M344 252q20 8 38-2" fill="none" stroke="#b4ad9d" stroke-width="3" stroke-linecap="round"/>
    <!-- Neck and head -->
    <path d="M397 217c19-10 31-32 26-53-5-23 7-42 30-43 26-1 38 17 34 39-5 31-18 55-39 76z" fill="#fffdf0" stroke="#263744" stroke-width="5"/>
    <circle cx="459" cy="145" r="5" fill="#263744"/>
    <path d="M448 133q10-8 20-2" fill="none" stroke="#263744" stroke-width="4" stroke-linecap="round"/>
    <!-- Long bill and overflowing pouch -->
    <path d="M478 153l146 23-144 12z" fill="#f4aa35" stroke="#263744" stroke-width="4" stroke-linejoin="round"/>
    <path d="M480 188l144-12c-23 47-67 67-105 47-18-9-31-21-39-35z" fill="#f6c05b" stroke="#263744" stroke-width="4" stroke-linejoin="round"/>
    <path d="M501 194q40 27 84 7" fill="none" stroke="#d88a36" stroke-width="3"/>
    <!-- Fish poking out of pouch -->
    <path d="M539 189q13-16 26-2l10-6-2 13 5 9-13-3q-14 10-26-4z" fill="#73aeb5" stroke="#263744" stroke-width="2"/>
    <circle cx="546" cy="190" r="2" fill="#263744"/>
    <!-- Legs toward pedals -->
    <path d="M358 282l25 40 36 23" fill="none" stroke="#d78a32" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M418 345l22 2-14 8-16-3" fill="#efa945" stroke="#263744" stroke-width="3" stroke-linejoin="round"/>
    <path d="M337 283l-1 48 31 32" fill="none" stroke="#d78a32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M366 363l21 2-13 8-16-3" fill="#efa945" stroke="#263744" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Motion marks -->
  <g stroke="#4d8990" stroke-width="4" stroke-linecap="round" opacity=".75">
    <path d="M140 302h53M126 318h39M151 334h33"/>
  </g>
  <g transform="translate(650 269)">
    <path d="M0 0q37-20 72 0v39q-35 20-72 0z" fill="#fffdf2" stroke="#263744" stroke-width="3"/>
    <text x="36" y="17" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#263744">FISH</text>
    <text x="36" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#263744">LANE!</text>
  </g>

  <text x="400" y="507" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#263744">The daily commute comes with a built-in snack pouch.</text>
  <path d="M70 530h660" stroke="#bba989" stroke-width="2"/>
  <text x="400" y="559" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#4b5960">2026-10-31 02:32:42 SGT (UTC+08:00)</text>
</svg>