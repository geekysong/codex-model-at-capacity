<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset="1" stop-color="#f4a623"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#2b3340" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="455" width="800" height="145" fill="#d8c7aa"/>
  <rect y="455" width="800" height="145" fill="url(#dots)" opacity=".45"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="34" font-weight="900" fill="#202735" letter-spacing="1">
    PREMIUM MODEL. SURPRISE MODEL.
  </text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" font-weight="700" fill="#b23a2b">
    THE FINE PRINT IS DOING ALL THE THINKING.
  </text>

  <!-- storefront -->
  <g filter="url(#shadow)">
    <rect x="70" y="135" width="660" height="320" rx="18" fill="#fffdf7" stroke="#202735" stroke-width="6"/>
    <rect x="70" y="135" width="660" height="72" rx="18" fill="#202735"/>
    <rect x="70" y="180" width="660" height="27" fill="#202735"/>
    <text x="400" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="32" font-weight="900" fill="#fff">THE CLOUD EMPORIUM</text>

    <!-- awning -->
    <path d="M90 210 H710 L690 255 H110 Z" fill="#ef4b3f" stroke="#202735" stroke-width="5"/>
    <path d="M130 210 L145 255 M205 210 L215 255 M280 210 L285 255 M355 210 L355 255 M430 210 L425 255 M505 210 L495 255 M580 210 L565 255 M655 210 L635 255"
          stroke="#ffd45c" stroke-width="15"/>
    <text x="400" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="19" font-weight="900" fill="#fff">100% PREMIUM • TOTALLY TRANSPARENT</text>

    <!-- counter -->
    <rect x="110" y="365" width="580" height="63" rx="10" fill="#8d5a3b" stroke="#202735" stroke-width="5"/>
    <rect x="110" y="365" width="580" height="13" fill="#c78b55"/>
  </g>

  <!-- premium box on display -->
  <g filter="url(#shadow)">
    <path d="M157 282 L265 255 L365 285 L255 315 Z" fill="#ffe77a" stroke="#202735" stroke-width="5"/>
    <path d="M157 282 L157 365 L255 398 L255 315 Z" fill="#f6b83d" stroke="#202735" stroke-width="5"/>
    <path d="M255 315 L365 285 L365 365 L255 398 Z" fill="url(#gold)" stroke="#202735" stroke-width="5"/>
    <text x="260" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="20" font-weight="900" fill="#202735" transform="rotate(-15 260 344)">ULTRA-PLUS</text>
    <text x="260" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700" fill="#202735" transform="rotate(-15 260 369)">128K • GENIUS • GOLD</text>
  </g>

  <!-- customer -->
  <g stroke="#202735" stroke-width="5" stroke-linejoin="round">
    <circle cx="120" cy="395" r="27" fill="#f2b38f"/>
    <path d="M94 390 Q120 350 147 389 Q128 375 94 390" fill="#4b3028"/>
    <circle cx="110" cy="397" r="3" fill="#202735" stroke="none"/>
    <circle cx="130" cy="397" r="3" fill="#202735" stroke="none"/>
    <path d="M110 411 Q120 418 131 410" fill="none"/>
    <path d="M92 430 Q120 413 148 430 L160 500 H78 Z" fill="#4fa3d1"/>
    <path d="M96 444 L55 476 M145 444 L185 474" fill="none"/>
    <path d="M55 476 L37 468 M185 474 L203 463" fill="none"/>
  </g>
  <text x="120" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="16" font-weight="800" fill="#202735">CUSTOMER</text>

  <!-- clerk -->
  <g stroke="#202735" stroke-width="5" stroke-linejoin="round">
    <circle cx="665" cy="300" r="28" fill="#8c5a45"/>
    <path d="M638 291 Q663 260 691 289 Q674 280 638 291" fill="#252525"/>
    <rect x="642" y="328" width="47" height="83" rx="12" fill="#7a63b8"/>
    <path d="M646 350 L608 390 M684 350 L720 389" fill="none"/>
    <path d="M609 390 L594 386 M720 389 L735 380" fill="none"/>
    <path d="M648 411 L640 458 M683 411 L694 458" fill="none"/>
  </g>
  <text x="666" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="15" font-weight="800" fill="#202735">SALES BOT</text>

  <!-- hidden chute -->
  <path d="M390 285 L570 285 L570 420 L390 420 Z" fill="#9ed8e6" stroke="#202735" stroke-width="5"/>
  <path d="M410 302 H550 V391 H410 Z" fill="#d9f7ff" stroke="#202735" stroke-width="4"/>
  <text x="480" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="900" fill="#202735">PREMIUM</text>
  <text x="480" y="351" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="13" font-weight="700" fill="#202735">MODEL DISPENSER</text>

  <!-- trapdoor and weak model -->
  <path d="M420 420 Q480 390 540 420 L540 470 Q480 500 420 470 Z" fill="#3c4654" stroke="#202735" stroke-width="5"/>
  <path d="M432 436 Q480 414 528 436" fill="none" stroke="#f4a623" stroke-width="7"/>
  <g transform="translate(478 452)">
    <ellipse cx="0" cy="24" rx="42" ry="13" fill="#202735" opacity=".25" stroke="none"/>
    <rect x="-27" y="-20" width="54" height="48" rx="8" fill="#c7ccd3" stroke="#202735" stroke-width="4"/>
    <circle cx="-10" cy="-2" r="5" fill="#ef4b3f" stroke="none"/>
    <circle cx="10" cy="-2" r="5" fill="#ef4b3f" stroke="none"/>
    <path d="M-13 14 Q0 7 13 14" fill="none" stroke="#202735" stroke-width="3"/>
    <text x="0" y="43" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="12" font-weight="900" fill="#fff" stroke="none">LITE</text>
  </g>
  <path d="M495 406 C520 393 546 398 557 418" fill="none" stroke="#ef4b3f" stroke-width="5" stroke-dasharray="8 6"/>
  <text x="592" y="405" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="900" fill="#b23a2b" transform="rotate(-8 592 405)">*quiet substitution*</text>

  <!-- caption -->
  <rect x="177" y="548" width="446" height="38" rx="19" fill="#202735"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="800" fill="#fff">
    SAME LOGO. DIFFERENT BRAIN.
  </text>
</svg>