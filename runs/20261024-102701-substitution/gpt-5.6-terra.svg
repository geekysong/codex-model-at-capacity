<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dff4ff"/>
      <stop offset="1" stop-color="#fff7df"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe47a"/>
      <stop offset="1" stop-color="#f6a928"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#b51f3b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#17202a" flood-opacity=".25"/>
    </filter>
    <pattern id="brick" width="48" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0H48M0 24H48M24 0V12M0 12V24" stroke="#b86e53" stroke-width="2" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 450 Q180 410 350 450 T800 440 V600H0Z" fill="#8bcf83"/>
  <path d="M0 475 Q180 435 350 475 T800 465 V600H0Z" fill="#67ad68"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#17202a" letter-spacing="1">
    THE PREMIUM MODEL EXPERIENCE
  </text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#b51f3b">
    “Same brilliant answers!”* 
  </text>

  <!-- storefront -->
  <g filter="url(#shadow)">
    <rect x="125" y="145" width="550" height="300" rx="14" fill="#f7d7b5" stroke="#17202a" stroke-width="6"/>
    <rect x="125" y="145" width="550" height="92" rx="14" fill="url(#red)" stroke="#17202a" stroke-width="6"/>
    <path d="M125 198 H675" stroke="#17202a" stroke-width="6"/>
    <rect x="144" y="260" width="215" height="145" rx="8" fill="#bcecff" stroke="#17202a" stroke-width="6"/>
    <rect x="441" y="260" width="215" height="145" rx="8" fill="#bcecff" stroke="#17202a" stroke-width="6"/>
    <path d="M154 277 H349 M451 277 H646" stroke="#fff" stroke-width="5" opacity=".75"/>
    <path d="M154 315 H349 M451 315 H646" stroke="#fff" stroke-width="5" opacity=".75"/>
  </g>

  <text x="400" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900" fill="#fff">
    PREMIUM MODEL
  </text>
  <text x="400" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffe47a">
    NOW WITH EXTRA INTELLIGENCE!
  </text>

  <!-- giant bait sign -->
  <g transform="translate(70 120) rotate(-8)" filter="url(#shadow)">
    <path d="M0 0 H225 Q240 0 240 15 V105 Q240 120 225 120 H0 Q-15 120 -15 105 V15 Q-15 0 0 0Z" fill="url(#gold)" stroke="#17202a" stroke-width="6"/>
    <path d="M240 43 L285 60 L240 77Z" fill="#f6a928" stroke="#17202a" stroke-width="6"/>
    <text x="112" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#17202a">PAY $99</text>
    <text x="112" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#17202a">GET GENIUS</text>
    <text x="112" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#17202a">† probably</text>
  </g>

  <!-- trapdoor -->
  <g filter="url(#shadow)">
    <path d="M300 405 L500 405 L470 530 L330 530Z" fill="#513a32" stroke="#17202a" stroke-width="7"/>
    <path d="M300 405 L500 405 L470 455 L330 455Z" fill="#8a5b42" stroke="#17202a" stroke-width="7"/>
    <path d="M332 435 H468" stroke="#c38b63" stroke-width="5" stroke-dasharray="12 10"/>
  </g>
  <text x="400" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#fff">ACTUAL PIPELINE</text>

  <!-- tiny weak model -->
  <g transform="translate(400 535)">
    <ellipse cx="0" cy="22" rx="104" ry="18" fill="#17202a" opacity=".25"/>
    <rect x="-62" y="-50" width="124" height="78" rx="18" fill="#9aa7b2" stroke="#17202a" stroke-width="6"/>
    <rect x="-48" y="-35" width="96" height="48" rx="10" fill="#d9f4ff" stroke="#17202a" stroke-width="4"/>
    <circle cx="-20" cy="-11" r="7" fill="#17202a"/>
    <circle cx="20" cy="-11" r="7" fill="#17202a"/>
    <path d="M-27 1 Q0 17 27 1" fill="none" stroke="#17202a" stroke-width="4"/>
    <path d="M-80 -17 L-62 -5 M80 -17 L62 -5" stroke="#17202a" stroke-width="6" stroke-linecap="round"/>
    <path d="M-28 28 V44 M28 28 V44" stroke="#17202a" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#17202a">BARGAIN BOT 0.3</text>
  </g>

  <!-- customer -->
  <g transform="translate(675 420)">
    <circle cx="0" cy="-70" r="34" fill="#f2bd8d" stroke="#17202a" stroke-width="6"/>
    <path d="M-34 -76 Q0 -125 34 -76 Q25 -111 0 -111 Q-25 -111 -34 -76Z" fill="#3d2c2a" stroke="#17202a" stroke-width="6"/>
    <circle cx="-12" cy="-68" r="4" fill="#17202a"/><circle cx="12" cy="-68" r="4" fill="#17202a"/>
    <path d="M-12 -51 Q0 -43 12 -51" fill="none" stroke="#17202a" stroke-width="4"/>
    <path d="M-25 -32 L-43 45 H43 L25 -32Z" fill="#4e82bd" stroke="#17202a" stroke-width="6"/>
    <path d="M-25 0 H25" stroke="#fff" stroke-width="5"/>
  </g>

  <!-- speech bubble -->
  <g filter="url(#shadow)">
    <path d="M555 286 Q555 245 595 245 H757 Q790 245 790 278 V322 Q790 355 757 355 H664 L635 382 L638 355 H595 Q555 355 555 322Z" fill="#fff" stroke="#17202a" stroke-width="5"/>
    <text x="674" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#17202a">“Why is it answering</text>
    <text x="674" y="307" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" fill="#17202a">like a sleepy toaster?”</text>
    <text x="674" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b51f3b">— delighted customer</text>
  </g>

  <!-- arrows and fine print -->
  <path d="M400 242 V385" stroke="#17202a" stroke-width="7" stroke-dasharray="12 10"/>
  <path d="M382 367 L400 390 L418 367" fill="none" stroke="#17202a" stroke-width="7"/>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#17202a">
    * “Premium” refers to the price tag, not the model.
  </text>
</svg>