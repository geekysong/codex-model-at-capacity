<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7dc"/>
      <stop offset="1" stop-color="#f6d7a8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe36e"/>
      <stop offset="1" stop-color="#f0a62b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4b3024" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#3d2923;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#3d2923}
      .small{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#3d2923}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <path d="M0 95 Q200 65 400 95 T800 85" fill="none" stroke="#e7b873" stroke-width="5" opacity=".5"/>
  <path d="M0 520 Q200 490 400 520 T800 510" fill="none" stroke="#e7b873" stroke-width="5" opacity=".5"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="34">PREMIUM MODEL™</text>
  <text x="400" y="88" text-anchor="middle" class="small" font-size="17" fill="#b33a2e">“The finest intelligence money can buy!”</text>

  <!-- left panel -->
  <rect x="35" y="125" width="350" height="390" rx="24" fill="#fffdf3" class="ink" filter="url(#shadow)"/>
  <rect x="60" y="150" width="300" height="58" rx="16" fill="url(#gold)" class="ink"/>
  <text x="210" y="188" text-anchor="middle" class="label" font-size="24">WHAT YOU ORDER</text>

  <!-- fancy robot -->
  <path d="M132 284 Q132 236 210 226 Q288 236 288 284 L276 375 Q210 405 144 375Z" fill="#d9e7f4" class="ink"/>
  <rect x="158" y="265" width="104" height="70" rx="18" fill="#263746" class="ink"/>
  <circle cx="188" cy="300" r="10" fill="#77f0ff"/>
  <circle cx="232" cy="300" r="10" fill="#77f0ff"/>
  <path d="M185 321 Q210 339 235 321" fill="none" class="ink"/>
  <path d="M210 226 V205" class="ink"/>
  <circle cx="210" cy="195" r="12" fill="#ffcf45" class="ink"/>
  <path d="M145 350 L108 372 M275 350 L312 372" class="ink"/>
  <path d="M172 385 L156 430 M248 385 L264 430" class="ink"/>
  <path d="M145 430 H175 M245 430 H275" class="ink"/>
  <path d="M115 255 Q100 235 83 250 M305 255 Q320 235 337 250" fill="none" class="ink"/>
  <text x="210" y="466" text-anchor="middle" class="label" font-size="22">OMNI-GENIUS 9000</text>
  <text x="210" y="492" text-anchor="middle" class="small" font-size="15">reasons, writes, understands</text>

  <!-- arrow -->
  <path d="M393 320 H448" class="ink"/>
  <path d="M435 304 L452 320 L435 336" fill="none" class="ink"/>
  <text x="421" y="285" text-anchor="middle" class="small" font-size="15" transform="rotate(-8 421 285)">SUBSCRIPTION</text>

  <!-- right panel -->
  <rect x="415" y="125" width="350" height="390" rx="24" fill="#fffdf3" class="ink" filter="url(#shadow)"/>
  <rect x="440" y="150" width="300" height="58" rx="16" fill="#ee6b55" class="ink"/>
  <text x="590" y="188" text-anchor="middle" class="label" font-size="24" fill="#fff7dc">WHAT ARRIVES</text>

  <!-- trapdoor -->
  <path d="M475 260 Q590 220 705 260 L688 390 Q590 425 492 390Z" fill="#b8c0c5" class="ink"/>
  <path d="M492 390 Q590 425 688 390 L688 420 Q590 455 492 420Z" fill="#7e8589" class="ink"/>
  <path d="M515 270 L515 382 M665 270 L665 382" stroke="#8b9296" stroke-width="4"/>
  <text x="590" y="305" text-anchor="middle" class="label" font-size="20">BUDGET BOT</text>
  <text x="590" y="331" text-anchor="middle" class="small" font-size="16">“I can summarize…”</text>
  <text x="590" y="355" text-anchor="middle" class="small" font-size="16">“…your disappointment.”</text>
  <circle cx="555" cy="370" r="7" fill="#e04b3f" class="ink"/>
  <circle cx="625" cy="370" r="7" fill="#e04b3f" class="ink"/>
  <path d="M555 400 Q590 382 625 400" fill="none" class="ink"/>

  <!-- tiny receipt -->
  <path d="M505 430 L675 430 L666 485 L514 485Z" fill="#fff" class="ink"/>
  <text x="590" y="452" text-anchor="middle" class="small" font-size="15">PREMIUM PRICE</text>
  <text x="590" y="476" text-anchor="middle" class="label" font-size="18">$99.99 / month</text>
  <path d="M506 440 L674 480" stroke="#d33c32" stroke-width="7"/>
  <text x="590" y="503" text-anchor="middle" class="label" font-size="15" fill="#d33c32">ACTUAL MODEL: “FREE TIER”</text>

  <!-- sneaky hand and tag -->
  <path d="M735 225 Q770 210 780 235 Q785 252 765 260 L735 272" fill="#f2b38d" class="ink"/>
  <path d="M750 244 L778 231" class="ink"/>
  <rect x="650" y="218" width="106" height="34" rx="10" fill="#ffe36e" class="ink" transform="rotate(8 650 218)"/>
  <text x="704" y="241" text-anchor="middle" class="small" font-size="14" transform="rotate(8 704 241)">QUIET UPDATE</text>

  <text x="400" y="562" text-anchor="middle" class="label" font-size="22">SAME LOGO. SAME BILL. DIFFERENT BRAIN.</text>
</svg>