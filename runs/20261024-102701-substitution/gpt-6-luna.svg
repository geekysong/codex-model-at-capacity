<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e7"/>
      <stop offset="1" stop-color="#f4dfc1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd85a"/>
      <stop offset="1" stop-color="#e89518"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#3b2d2a" flood-opacity=".25"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#e6b9a4"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="92" fill="#241d2b"/>
  <text x="400" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900" fill="#fff8e7" letter-spacing="1">PREMIUM MODEL*</text>
  <text x="400" y="83" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#ffcf4a">*terms and model substitutions may apply</text>

  <rect x="28" y="124" width="744" height="380" rx="28" fill="#f9efe1" stroke="#3b2d2a" stroke-width="5" filter="url(#shadow)"/>
  <path d="M48 444 Q400 365 752 444 L752 484 Q400 542 48 484Z" fill="url(#dots)" opacity=".65"/>

  <!-- bait side -->
  <text x="222" y="157" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#3b2d2a">WHAT THEY SHOW YOU</text>
  <rect x="76" y="178" width="292" height="214" rx="18" fill="#5147a8" stroke="#29234e" stroke-width="6"/>
  <rect x="92" y="194" width="260" height="166" rx="12" fill="#b9e7ff" stroke="#29234e" stroke-width="5"/>
  <circle cx="222" cy="261" r="48" fill="#fff" stroke="#29234e" stroke-width="5"/>
  <path d="M187 257 Q222 218 257 257 L247 283 Q222 300 197 283Z" fill="#ffbf3f" stroke="#29234e" stroke-width="5"/>
  <circle cx="205" cy="256" r="6" fill="#29234e"/>
  <circle cx="239" cy="256" r="6" fill="#29234e"/>
  <path d="M205 277 Q222 288 239 277" fill="none" stroke="#29234e" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 227 L160 205 M305 227 L283 205" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="222" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#29234e">GENIUS-9000</text>
  <text x="222" y="377" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#fff8e7">“Writes symphonies!”</text>
  <path d="M145 405 L299 405" stroke="#e89518" stroke-width="7" stroke-linecap="round"/>
  <path d="M145 405 L299 405 L279 394 M299 405 L279 416" fill="none" stroke="#e89518" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- switch arrow -->
  <path d="M381 257 C430 215 455 215 495 257" fill="none" stroke="#d94b3d" stroke-width="10" stroke-linecap="round"/>
  <path d="M480 243 L500 257 L480 271" fill="none" stroke="#d94b3d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="438" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#d94b3d" transform="rotate(-7 438 210)">CLICK “UPGRADE”</text>

  <!-- hidden trapdoor -->
  <path d="M415 292 Q515 267 615 292 L615 385 Q515 412 415 385Z" fill="#6d4838" stroke="#3b2d2a" stroke-width="6"/>
  <path d="M434 303 Q515 286 596 303 L596 371 Q515 389 434 371Z" fill="#30282a"/>
  <text x="515" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" fill="#ffcf4a">ACTUAL MODEL</text>
  <text x="515" y="357" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#fff8e7">please enjoy your savings</text>

  <!-- weak model -->
  <g transform="translate(500 414)" filter="url(#shadow)">
    <rect x="-70" y="-26" width="140" height="78" rx="14" fill="#9ba3ad" stroke="#3b2d2a" stroke-width="5"/>
    <rect x="-52" y="-12" width="104" height="40" rx="8" fill="#dff4f7" stroke="#3b2d2a" stroke-width="4"/>
    <circle cx="-25" cy="8" r="6" fill="#3b2d2a"/>
    <circle cx="25" cy="8" r="6" fill="#3b2d2a"/>
    <path d="M-25 22 L25 22" stroke="#3b2d2a" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="900" fill="#3b2d2a">MODEL-LITE</text>
  </g>

  <!-- bait company hand -->
  <path d="M720 176 Q685 158 665 185 L624 238 Q612 254 625 267 Q638 279 651 265 L681 231 L690 241 L659 289 Q649 305 663 315 Q677 324 689 308 L718 267 L725 278 L704 319 Q696 335 711 343 Q726 349 735 332 L760 283 Q780 244 760 206Z" fill="#ffbf3f" stroke="#3b2d2a" stroke-width="6"/>
  <path d="M691 184 L722 203" stroke="#3b2d2a" stroke-width="5" stroke-linecap="round"/>
  <text x="687" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="900" fill="#3b2d2a">OUR BEST!</text>

  <!-- dropped outputs -->
  <g fill="#fff" stroke="#3b2d2a" stroke-width="4">
    <rect x="86" y="456" width="150" height="38" rx="8" transform="rotate(-8 86 456)"/>
    <rect x="586" y="449" width="150" height="38" rx="8" transform="rotate(8 586 449)"/>
  </g>
  <text x="162" y="480" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#d94b3d" transform="rotate(-8 162 480)">“Roses are…”</text>
  <text x="663" y="477" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#d94b3d" transform="rotate(8 663 477)">“Error: thought”</text>

  <!-- caption -->
  <rect x="108" y="525" width="584" height="52" rx="18" fill="#d94b3d" stroke="#3b2d2a" stroke-width="5"/>
  <text x="400" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="900" fill="#fff8e7">Premium on the label. Budget in the brain.</text>
</svg>