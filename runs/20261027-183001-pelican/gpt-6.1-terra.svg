    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.4s" repeatCount="indefinite"/>
    <ellipse cx="390" cy="280" rx="78" ry="92" fill="#f7f3e8" stroke="#263238" stroke-width="6"/>
    <path d="M345 250 Q290 275 315 350 Q350 385 395 345 Q370 310 345 250Z" fill="#d8e0e2" stroke="#263238" stroke-width="5"/>
