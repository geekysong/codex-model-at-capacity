  <text x="400" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#17324d" stroke="#fff" stroke-width="2">THE PECKING ORDER</text>
  <text x="400" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17324d">A pelican discovers that cycling beats flying… uphill.</text>

  <ellipse cx="425" cy="468" rx="255" ry="22" fill="#111" opacity=".3" filter="url(#shadow)"/>

