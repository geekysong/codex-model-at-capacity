<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon of an overconfident pelican riding a bicycle.</desc>
  <defs>
    <style>
      .ink{stroke:#243447;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#243447}
    </style>
  </defs>

  <rect width="800" height="600" fill="#dff4ff"/>
  <circle cx="690" cy="95" r="48" fill="#ffd166"/>
  <path d="M0 440 Q150 400 300 440 T600 435 T800 440 V600 H0Z" fill="#9bd18b"/>
  <path d="M0 500 Q180 470 360 500 T800 495" fill="none" stroke="#6eaa67" stroke-width="8"/>

  <text x="400" y="58" text-anchor="middle" class="label" font-size="38" font-weight="900">THE GREAT PELICAN GETAWAY</text>
  <text x="400" y="91" text-anchor="middle" class="label" font-size="19" font-style="italic">“No wings required when you have questionable balance.”</text>

  <g id="bike">
    <g>
      <circle cx="245" cy="438" r="78" fill="#eef8ff" class="ink"/>
      <circle cx="575" cy="438" r="78" fill="#eef8ff" class="ink"/>
      <g stroke="#6c8ba3" stroke-width="3">
        <path d="M245 360V516 M167 438H323 M190 383L300 493 M300 383L190 493"/>
        <path d="M575 360V516 M497 438H653 M520 383L630 493 M630 383L520 493"/>
      </g>
      <g fill="none" class="ink">
        <path d="M245 438 L355 438 L430 350 L575 438 L430 438 Z"/>
        <path d="M355 438 L315 350 L245 438"/>
        <path d="M315 350 L350 350"/>
        <path d="M430 350 L420 315"/>
        <path d="M405 315 L435 315"/>
      </g>
      <g transform="translate(355 438)">
        <circle r="13" fill="#f4a261" class="ink"/>
        <g>
          <path d="M0 0 L32 20" class="ink"/>
          <path d="M32 20 L48 12" class="ink"/>
          <path d="M0 0 L-24 28" class="ink"/>
          <path d="M-24 28 L-42 25" class="ink"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>
    <g>
      <circle cx="245" cy="438" r="10" fill="#243447"/>
      <circle cx="575" cy="438" r="10" fill="#243447"/>
      <animateTransform attributeName="transform" type="rotate" from="0 410 438" to="360 410 438" dur="2.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <g id="pelican">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.4s" repeatCount="indefinite"/>
    <ellipse cx="420" cy="278" rx="78" ry="91" fill="#fffaf0" class="ink"/>
    <path d="M368 270 Q330 320 350 365 Q383 344 403 305" fill="#d9e7ef" class="ink"/>
    <circle cx="444" cy="201" r="57" fill="#fffaf0" class="ink"/>
    <circle cx="463" cy="192" r="8" fill="#243447"/>
    <path d="M481 215 Q565 222 604 253 Q559 283 477 257Z" fill="#f4a261" class="ink"/>
    <path d="M477 257 Q535 265 582 251" fill="none" stroke="#b95d37" stroke-width="4"/>
    <path d="M391 356 Q420 375 449 355" fill="none" class="ink"/>
    <path d="M398 365 L384 405 M444 365 L458 405" class="ink"/>
    <path d="M380 404 L365 417 M458 404 L474 417" class="ink"/>
    <path d="M391 254 Q420 244 443 258" fill="none" stroke="#243447" stroke-width="5"/>
    <path d="M385 221 Q401 208 417 220" fill="none" stroke="#243447" stroke-width="5"/>
    <text x="380" y="145" class="label" font-size="20" font-weight="700">CEO OF BIRD TRANSPORT</text>
    <path d="M373 299 Q330 280 312 250" fill="none" class="ink"/>
    <path d="M312 250 Q302 230 318 218 Q341 236 362 270" fill="#fffaf0" class="ink"/>
  </g>

  <g transform="translate(90 330)">
    <path d="M0 0 Q45 -35 90 0" fill="none" stroke="#e76f51" stroke-width="10"/>
    <text x="45" y="-12" text-anchor="middle" class="label" font-size="22" font-weight="900">HONK!</text>
  </g>

  <rect x="35" y="540" width="730" height="42" rx="10" fill="#ffffff" opacity=".9"/>
  <text x="400" y="566" text-anchor="middle" class="label" font-size="18" font-weight="700">2026-10-27 18:30:01 SGT (UTC+08:00)</text>
</svg>