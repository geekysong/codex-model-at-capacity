<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedals Against the Current</title>
  <desc>A satirical cartoon of a pelican riding a bicycle, animated with looping wheel and pedaling motion.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ee7ff"/>
      <stop offset="100%" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#69717c"/>
      <stop offset="100%" stop-color="#343a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#18202a" flood-opacity=".3"/>
    </filter>
    <style>
      .ink { stroke:#1d2730; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#17212b; }
      .small { font-size:18px; font-weight:700; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="685" cy="104" r="48" fill="#fff5a8" opacity=".8"/>
  <path d="M0 365 Q110 320 220 365 T440 365 T660 365 T900 365 V600 H0Z" fill="#8ed7a0"/>
  <path d="M0 438 Q150 405 300 440 T600 440 T900 430 V600 H0Z" fill="url(#road)"/>
  <path d="M0 505 Q130 477 260 505 T520 505 T800 505" fill="none" stroke="#f7d66a" stroke-width="10" stroke-dasharray="38 28"/>

  <g filter="url(#shadow)">
    <rect x="44" y="34" width="712" height="82" rx="20" fill="#fffdf4" stroke="#1d2730" stroke-width="6"/>
    <text x="400" y="72" text-anchor="middle" class="label" font-size="31" font-weight="900">PELICAN PEDALS AGAINST THE CURRENT</text>
    <text x="400" y="99" text-anchor="middle" class="label" font-size="17" font-weight="700">“Why walk when you can wobble with purpose?”</text>
  </g>

  <g transform="translate(0 5)">
    <!-- bicycle frame -->
    <g class="ink" fill="none">
      <circle cx="237" cy="430" r="78" stroke-width="8"/>
      <circle cx="587" cy="430" r="78" stroke-width="8"/>
      <path d="M237 430 L350 300 L445 430 L237 430 L350 300 L587 430" stroke-width="8"/>
      <path d="M445 430 L420 290 L383 260" stroke-width="8"/>
      <path d="M420 290 L465 275" stroke-width="8"/>
      <path d="M350 300 L330 265" stroke-width="8"/>
    </g>

    <!-- animated wheels -->
    <g class="ink" fill="none">
      <g>
        <circle cx="237" cy="430" r="65" stroke="#dce7ec" stroke-width="3"/>
        <g>
          <path d="M237 430 L237 365 M237 430 L294 397 M237 430 L294 463 M237 430 L237 495 M237 430 L180 463 M237 430 L180 397"/>
          <animateTransform attributeName="transform" type="rotate" from="0 237 430" to="360 237 430" dur="2s" repeatCount="indefinite"/>
        </g>
      </g>
      <g>
        <circle cx="587" cy="430" r="65" stroke="#dce7ec" stroke-width="3"/>
        <g>
          <path d="M587 430 L587 365 M587 430 L644 397 M587 430 L644 463 M587 430 L587 495 M587 430 L530 463 M587 430 L530 397"/>
          <animateTransform attributeName="transform" type="rotate" from="0 587 430" to="360 587 430" dur="2s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- crank and pedals -->
    <g class="ink" fill="none">
      <circle cx="350" cy="430" r="15" fill="#f5b83d"/>
      <path d="M350 430 L382 455 M350 430 L318 405" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" from="0 350 430" to="360 350 430" dur="1s" repeatCount="indefinite"/>
      </path>
      <path d="M375 460 l24 0 M305 400 l-24 0" stroke-width="7">
        <animateTransform attributeName="transform" type="rotate" from="0 350 430" to="360 350 430" dur="1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- pelican bobbing group -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1s" repeatCount="indefinite"/>
      <!-- body -->
      <ellipse cx="382" cy="235" rx="89" ry="73" fill="#f5f2e8" class="ink"/>
      <path d="M325 255 Q380 285 447 248" fill="none" stroke="#b5c1c7" stroke-width="9"/>
      <!-- wing -->
      <path d="M350 205 Q405 190 435 232 Q397 250 353 239 Q335 228 350 205Z" fill="#c9d4d8" class="ink"/>
      <path d="M365 216 Q395 225 419 234" fill="none" stroke="#8b9aa2" stroke-width="5"/>
      <!-- neck and head -->
      <path d="M357 198 Q335 157 359 124 Q384 91 427 108 Q458 121 458 158 Q457 198 426 218" fill="#f5f2e8" class="ink"/>
      <ellipse cx="404" cy="132" rx="54" ry="43" fill="#f5f2e8" class="ink"/>
      <!-- beak -->
      <path d="M364 143 Q314 134 264 153 Q315 185 379 165 Q391 155 364 143Z" fill="#e8a735" class="ink"/>
      <path d="M271 153 Q316 156 375 157" fill="none" stroke="#a9691c" stroke-width="4"/>
      <!-- eye and brow -->
      <circle cx="422" cy="126" r="8" fill="#17212b"/>
      <path d="M407 108 Q428 97 444 108" fill="none" stroke="#1d2730" stroke-width="7"/>
      <!-- hat -->
      <path d="M374 93 Q405 65 445 91 L451 108 L373 108Z" fill="#e85d4a" class="ink"/>
      <path d="M364 108 Q412 95 459 108" fill="none" stroke="#1d2730" stroke-width="8"/>
      <!-- feet -->
      <path d="M350 286 L333 350 L319 394" fill="none" stroke="#e8a735" stroke-width="13"/>
      <path d="M417 286 L429 350 L447 394" fill="none" stroke="#e8a735" stroke-width="13"/>
      <path d="M318 394 q-18 10-27 2 M318 394 q2 18-10 24 M447 394 q18 10 27 2 M447 394 q-2 18 10 24" fill="none" stroke="#e8a735" stroke-width="7"/>
      <!-- comic speech bubble -->
      <path d="M523 151 Q638 122 709 178 Q734 206 706 233 Q625 259 541 226 L510 245 L519 218 Q491 185 523 151Z" fill="#fffdf4" class="ink"/>
      <text x="612" y="184" text-anchor="middle" class="label small">HONK IF</text>
      <text x="612" y="207" text-anchor="middle" class="label small">YOU SEE FISH!</text>
    </g>
  </g>

  <!-- satirical caption -->
  <g class="label">
    <rect x="92" y="535" width="616" height="31" rx="15" fill="#fffdf4" stroke="#1d2730" stroke-width="4"/>
    <text x="400" y="557" text-anchor="middle" font-size="17" font-weight="800">A pelican on a bicycle: proof that traffic laws are just suggestions with feathers.</text>
  </g>

  <!-- required visible timestamp footer -->
  <text x="400" y="590" text-anchor="middle" class="label" font-size="13" font-weight="700">
    2026-10-27 18:31:09 SGT (UTC+08:00)
  </text>
</svg>