  <rect x="20" y="519" width="760" height="65" rx="13" fill="#233b47"/>
  <text x="400" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff8e7">Why fly when you can bill for mileage?</text>
