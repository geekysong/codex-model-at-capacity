  <title id="title">Pelican Express</title>
  <desc id="desc">A smug pelican pedals a bicycle with a fish-filled basket, choosing reimbursable mileage over flying. The wheels turn, pedals rotate, and the pelican bobs in a continuous loop.</desc>
