<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="description">A determined pelican pedals a tiny bicycle with a fish-filled bill pouch. Wheels spin, feet pedal, and the rider bobs along a seaside road.</desc>
  <defs>
    <pattern id="road" width="100" height="20" patternUnits="userSpaceOnUse">
      <path d="M10 10H55" stroke="#fff4cf" stroke-width="5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#fff4d8"/>
  <path d="M0 118H800V441H0Z" fill="#bfe8e5"/>
  <circle cx="695" cy="183" r="39" fill="#ffc653"/>
  <path d="M0 344Q110 325 220 344T440 344T660 344T880 344V442H0Z" fill="#68bfc0"/>
  <path d="M25 366H114M619 368H739M653 390H779" stroke="#def5e8" stroke-width="4" stroke-linecap="round"/>
  <path d="M62 190q15-17 30 0q15-17 30 0M568 165q11-12 22 0q11-12 22 0" fill="none" stroke="#397c85" stroke-width="4"/>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#203c43">
    <text x="400" y="58" font-size="43" font-weight="900" letter-spacing="2">TOUR DE FISH</text>
    <text x="400" y="94" font-size="18" font-weight="700">ZERO EMISSIONS. QUESTIONABLE AERODYNAMICS.</text>
  </g>

  <path d="M0 442H800V511H0Z" fill="#52666a"/>
  <rect y="478" width="800" height="20" fill="url(#road)"/>
  <ellipse cx="402" cy="451" rx="224" ry="13" fill="#203c43" opacity=".18"/>

  <!-- Bicycle wheels -->
  <g fill="#e5f2df" stroke="#243b42">
    <circle cx="251" cy="402" r="65" stroke-width="12"/>
    <circle cx="550" cy="402" r="65" stroke-width="12"/>
  </g>
  <g stroke="#57777a" stroke-width="3">
    <g transform="translate(251 402)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
        <path d="M-21-54L21 54M-54 21L54-21"/>
        <rect x="34" y="-6" width="15" height="12" rx="3" fill="#ffbe45" stroke="none"/>
      </g>
    </g>
    <g transform="translate(550 402)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
        <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/>
        <path d="M-21-54L21 54M-54 21L54-21"/>
        <rect x="34" y="-6" width="15" height="12" rx="3" fill="#ffbe45" stroke="none"/>
      </g>
    </g>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M251 402L322 308L380 402ZM322 308H488L380 402M488 308L550 402" stroke="#243b42" stroke-width="13"/>
    <path d="M251 402L322 308L380 402ZM322 308H488L380 402M488 308L550 402" stroke="#ed6450" stroke-width="7"/>
    <path d="M322 308L311 283M488 308L477 268L502 254H524" stroke="#243b42" stroke-width="8"/>
    <path d="M287 282H335" stroke="#243b42" stroke-width="14"/>
    <path d="M251 402H380" stroke="#243b42" stroke-width="5"/>
  </g>
  <g fill="#243b42">
    <circle cx="251" cy="402" r="8"/>
    <circle cx="550" cy="402" r="8"/>
    <circle cx="380" cy="402" r="15"/>
  </g>

  <!-- Rider -->
  <g stroke="#243b42" stroke-width="4" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M307 247L252 218L268 257L241 247L272 277" fill="#fffdf0"/>
    <path d="M288 226C315 192 368 204 393 233C411 254 390 288 346 295C304 298 274 274 288 226Z" fill="#fffdf0"/>
    <path d="M307 221Q331 207 355 217L379 283Q351 300 322 288Z" fill="#ed6450"/>
    <path d="M326 240Q349 262 386 264L480 258" fill="none" stroke="#243b42" stroke-width="20" stroke-linecap="round"/>
    <path d="M326 240Q349 262 386 264L480 258" fill="none" stroke="#fffdf0" stroke-width="13" stroke-linecap="round"/>
    <path d="M475 252L490 257L477 265" fill="#fffdf0"/>

    <path d="M368 241C385 213 375 179 388 157C403 131 444 141 445 165C445 189 414 191 412 210L409 250Q389 269 368 241Z" fill="#fffdf0"/>
    <path d="M429 174L620 200Q591 256 494 245Q451 238 434 198Z" fill="#ffc653"/>
    <path d="M429 174L621 197L433 195Z" fill="#f99a43"/>
    <path d="M457 208Q513 245 579 216" fill="none" stroke="#d78039" stroke-width="3"/>

    <!-- One visibly unimpressed passenger -->
    <path d="M496 220Q518 201 539 216L552 205L550 225L538 221Q519 237 496 220Z" fill="#76c8c5" stroke-width="2.5"/>
    <circle cx="506" cy="217" r="2.5" fill="#243b42" stroke="none"/>
    <path d="M501 211L511 214" stroke-width="2"/>

    <circle cx="423" cy="163" r="10" fill="white"/>
    <circle cx="427" cy="163" r="4" fill="#243b42" stroke="none"/>
    <path d="M413 148L432 153" fill="none" stroke-width="5"/>
    <path d="M386 148Q385 121 413 121Q442 121 448 145Z" fill="#ed6450"/>
    <path d="M398 129L401 141M414 127L418 142M430 131L434 143" stroke="#fff4d8" stroke-width="4"/>
    <path d="M391 149L404 184L419 186" fill="none" stroke-width="3"/>

    <path d="M318 288L339 335L380 376" fill="none" stroke="#e8a339" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" values="M318 288L339 335L380 376;M318 288L314 350L354 402;M318 288L355 356L380 428;M318 288L372 332L406 402;M318 288L339 335L380 376" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(380 402)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
      <path d="M0-26V26" stroke="#243b42" stroke-width="6"/>
      <g transform="translate(0 -26)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.4s" repeatCount="indefinite"/>
          <path d="M-12 0H14" stroke="#243b42" stroke-width="7" stroke-linecap="round"/>
          <path d="M-8-5L-8-16L14-6L20-2H-9Z" fill="#ffc653" stroke="#243b42" stroke-width="3"/>
        </g>
      </g>
      <g transform="translate(0 26)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.4s" repeatCount="indefinite"/>
          <path d="M-12 0H14" stroke="#243b42" stroke-width="7" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#203c43">
    <path d="M60 229Q60 214 75 214H208Q223 214 223 229V281Q223 296 208 296H156L167 317L127 296H75Q60 296 60 281Z" fill="#fffdf0" stroke="#243b42" stroke-width="3"/>
    <text x="142" y="246" text-anchor="middle" font-size="18" font-weight="700">“My lunch IS</text>
    <text x="142" y="273" text-anchor="middle" font-size="18" font-weight="700">the cargo bike.”</text>
    <path d="M658 321V442" stroke="#243b42" stroke-width="7"/>
    <rect x="604" y="282" width="139" height="57" rx="7" fill="#fff4d8" stroke="#243b42" stroke-width="3"/>
    <text x="674" y="305" text-anchor="middle" font-size="16" font-weight="700">PIER →</text>
    <text x="674" y="326" text-anchor="middle" font-size="13">NO FREE PARKING</text>
  </g>

  <rect y="511" width="800" height="89" fill="#fff4d8"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#203c43">
    <text x="400" y="543" font-size="21" font-weight="700">He traded his wings for wheels. The bill stayed enormous.</text>
    <path d="M110 557H690" stroke="#203c43" stroke-opacity=".22"/>
    <text x="400" y="582" font-size="17">2026-10-30 13:30:01 SGT (UTC+08:00)</text>
  </g>
</svg>