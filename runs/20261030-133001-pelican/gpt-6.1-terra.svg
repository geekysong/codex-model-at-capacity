        <path d="M-76 0H76M0-76V76M-54-54L54 54M54-54L-54 54"/>
      </g>
      <circle r="10" fill="#e3a64d" stroke="#273d3d" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#f8f3df"/>
  <rect x="18" y="18" width="764" height="564" rx="20" fill="#fdfbf0" stroke="#273d3d" stroke-width="4"/>
