  <text x="400" y="63" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#273d3d">THE DAILY BEAK COMMUTE</text>
  <text x="400" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#c15f42">TWO WHEELS. ONE VERY FULL TANK.</text>

