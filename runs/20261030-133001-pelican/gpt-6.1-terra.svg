<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Beak Commute</title>
  <desc id="desc">A pelican pedals a bicycle with a fish in its bill while its wheels spin and its body bobs.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#d8e7dc"/>
    </pattern>
    <g id="wheel">
      <circle r="89" fill="#fffaf0" stroke="#273d3d" stroke-width="10"/>
      <circle r="78" fill="none" stroke="#e3a64d" stroke-width="4"/>
