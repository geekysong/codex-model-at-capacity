<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">An earnest pelican pedals a tiny bicycle with a fish dangling in front of its enormous bill. Both wheels spin, its pedals turn, and the bird bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="6" r="1" fill="#dbceaa" opacity=".25"/>
      <circle cx="17" cy="19" r=".8" fill="#dbceaa" opacity=".25"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fff9e9" stroke="#243c45" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#b9c9c6" stroke-width="3"/>
      <g stroke="#829b9d" stroke-width="2.5">
        <path d="M-65 0H65M0-65V65M-46-46L46 46M-46 46L46-46"/>
        <path d="M-60-25L60 25M-25-60L25 60M-60 25L60-25M-25 60L25-60"/>
      </g>
      <path d="M0-70A70 70 0 0 1 27-65" fill="none" stroke="#edac3a" stroke-width="6" stroke-linecap="round"/>
      <circle r="9" fill="#243c45"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff4d9"/>
  <rect width="800" height="600" fill="url(#paper)"/>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="900" letter-spacing="2" fill="#243c45">TOUR DE FISH</text>
  <text x="400" y="89" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#95603a">ONE BIRD. TWO WHEELS. ZERO SELF-AWARENESS.</text>

  <g fill="#d7e5dc">
    <path d="M0 404Q105 346 211 401T421 394T631 397T800 381V470H0Z"/>
    <path d="M27 169q25-27 50 0q25-27 50 0" fill="none" stroke="#d7e5dc" stroke-width="7" stroke-linecap="round"/>
  </g>

  <path d="M83 474H720" stroke="#243c45" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="404" cy="477" rx="230" ry="10" fill="#243c45" opacity=".1"/>

  <g transform="translate(236 392)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <g transform="translate(562 392)">
    <g>
      <use href="#wheel"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g stroke="#243c45" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236 392L315 280L390 392Z M315 280H506L390 392 M506 280L562 392" fill="none" stroke-width="14"/>
    <path d="M236 392L315 280L390 392Z M315 280H506L390 392 M506 280L562 392" fill="none" stroke="#e7664b" stroke-width="8"/>
    <path d="M315 280L302 251M282 250H330" fill="none" stroke-width="10"/>
    <path d="M506 280L489 238L518 226" fill="none" stroke-width="9"/>
    <path d="M515 226H540" fill="none" stroke="#243c45" stroke-width="12"/>
    <circle cx="390" cy="392" r="24" fill="#e8c36c" stroke-width="4"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".9s" repeatCount="indefinite"/>
    <!-- The pelican's far leg -->
    <path d="M329 265L361 316L374 369" fill="none" stroke="#c5892e" stroke-width="13" stroke-linecap="round"/>

    <!-- A plump rider and an implausibly aerodynamic neck -->
    <path d="M274 168C235 164 226 196 250 222L271 245C290 271 348 282 384 252C408 232 411 202 414 173L416 146C416 126 438 120 448 135C457 150 444 163 437 173L428 207C423 237 411 258 390 267C340 289 273 268 251 236L225 213L260 218C246 198 252 177 274 168Z"
          fill="#fffef5" stroke="#243c45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M277 192C315 168 363 188 375 217C353 252 306 245 277 222L258 226" fill="#dfe8df" stroke="#243c45" stroke-width="4"/>
    <path d="M293 208Q325 227 355 213" fill="none" stroke="#9eb5ae" stroke-width="4" stroke-linecap="round"/>

    <!-- Cycling helmet -->
    <path d="M403 136C397 108 414 96 434 99C452 101 461 117 456 133Z" fill="#e7664b" stroke="#243c45" stroke-width="4"/>
    <path d="M414 108L416 127M430 105L433 127M445 111L448 127" stroke="#fff4d9" stroke-width="5" stroke-linecap="round"/>

    <!-- Eye and monumental bill -->
    <circle cx="438" cy="145" r="15" fill="#fffef5" stroke="#243c45" stroke-width="3"/>
    <circle cx="443" cy="145" r="4.5" fill="#243c45"/>
    <path d="M430 130L446 133" stroke="#243c45" stroke-width="4" stroke-linecap="round"/>
    <path d="M453 148L640 167L454 178Z" fill="#f3bb43" stroke="#243c45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M455 177L610 171Q558 249 485 210Q462 196 455 177Z" fill="#f1cb7a" stroke="#243c45" stroke-width="4"/>
    <path d="M480 185Q510 213 553 202" fill="none" stroke="#cd9141" stroke-width="3" stroke-linecap="round"/>

    <!-- Wing reaching the handlebars -->
    <path d="M363 213Q417 244 514 226" fill="none" stroke="#243c45" stroke-width="17" stroke-linecap="round"/>
    <path d="M363 210Q417 241 514 223" fill="none" stroke="#fffef5" stroke-width="10" stroke-linecap="round"/>

    <path d="M334 264L313 313L380 385" fill="none" stroke="#e5ab3e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="d" values="M334 264L313 313L380 385;M334 264L330 319L402 397;M334 264L313 313L380 385" dur="1.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(390 392)">
    <g stroke="#243c45" stroke-width="6" stroke-linecap="round">
      <path d="M-30 0H30"/>
      <path d="M-36-5H-23M23 5H36" stroke-width="9"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
    <circle r="7" fill="#243c45"/>
  </g>

  <!-- A highly effective, deeply questionable training incentive -->
  <path d="M535 227L656 211L679 137" fill="none" stroke="#243c45" stroke-width="4" stroke-linecap="round"/>
  <path d="M679 137V173" stroke="#9a8567" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(678 191)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8;8;-8" dur="1.8s" repeatCount="indefinite"/>
      <path d="M0-17Q-24-15-27 0Q-16 17 0 17L13 8L26 18V-18L13-8Z" fill="#78bbc2" stroke="#243c45" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-15" cy="-3" r="3" fill="#243c45"/>
      <path d="M-19 8L-10 8" stroke="#243c45" stroke-width="2"/>
    </g>
  </g>

  <g font-family="Arial, sans-serif" fill="#243c45">
    <path d="M64 278Q54 278 54 266V222Q54 210 67 210H197Q210 210 210 222V266Q210 278 197 278H164L173 296L138 278Z" fill="#fffef5" stroke="#243c45" stroke-width="3"/>
    <text x="132" y="237" text-anchor="middle" font-size="18" font-weight="bold">“My trainer says</text>
    <text x="132" y="260" text-anchor="middle" font-size="18" font-weight="bold">I'm driven.”</text>
    <text x="652" y="252" text-anchor="middle" font-size="13" font-weight="bold" transform="rotate(-6 652 252)">PERSONAL TRAINER</text>
  </g>

  <path d="M105 352H153M89 370H142M114 390H157" stroke="#9eb5ae" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#243c45">He bought a bicycle. The fish supplied the motivation.</text>

  <path d="M45 542H755" stroke="#cfbc94" stroke-width="2"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#43565a">2026-11-06 08:01:04 SGT (UTC+08:00)</text>
</svg>