  <rect x="0" y="510" width="800" height="90" fill="#fff7e4"/>
  <text x="400" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#203547">He bought a bicycle to cut down on flap expenses.</text>
