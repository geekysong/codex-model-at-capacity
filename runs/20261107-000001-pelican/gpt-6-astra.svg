<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A smug pelican pedals a tiny bicycle with a huge fish-filled beak pouch. The wheels spin, its feet pedal, and its body bobs continuously.</desc>
