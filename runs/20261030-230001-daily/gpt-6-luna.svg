  <text x="24" y="368" font-family="Arial, sans-serif" font-size="14" fill="#222">Shortest route: 8 street segments</text>
  <text x="24" y="393" font-family="Arial, sans-serif" font-size="12" fill="#444">2026-10-30 23:04:23 SGT (UTC+08:00)</text>
