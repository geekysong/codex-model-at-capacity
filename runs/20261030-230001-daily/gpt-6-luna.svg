      <circle cx="500" cy="155" r="15"/><circle cx="500" cy="230" r="15"/><circle cx="500" cy="305" r="15"/><circle cx="500" cy="380" r="15"/>
    </g>
    <g fill="#263238" stroke="none">
      <text x="100" y="80">A1</text><text x="200" y="80">B1</text><text x="300" y="80">C1</text><text x="400" y="80">D1</text><text x="500" y="80">E1</text>
      <text x="100" y="155">A2</text><text x="200" y="155">B2</text><text x="300" y="155">C2</text><text x="400" y="155">D2</text><text x="500" y="155">E2</text>
      <text x="100" y="230">A3</text><text x="200" y="230">B3</text><text x="300" y="230">C3</text><text x="400" y="230">D3</text><text x="500" y="230">E3</text>
      <text x="100" y="305">A4</text><text x="200" y="305">B4</text><text x="300" y="305">C4</text><text x="400" y="305">D4</text><text x="500" y="305">E4</text>
      <text x="100" y="380">A5</text><text x="200" y="380">B5</text><text x="300" y="380">C5</text><text x="400" y="380">D5</text><text x="500" y="380">E5</text>
    </g>
  </g>

  <g stroke="#d32f2f" stroke-width="4" stroke-linecap="round">
    <path d="M190 145l20 20m0-20l-20 20"/>
    <path d="M290 220l20 20m0-20l-20 20"/>
    <path d="M390 295l20 20m0-20l-20 20"/>
