<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City street grid with shortest route from A1 to E5</title>
  <desc id="desc">A five-column, five-row intersection grid. The blue route follows A1, B1, C1, D1, E1, E2, E3, E4, E5 for eight street segments, avoiding blocked intersections B2, C3, and D4.</desc>

  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- City blocks -->
  <defs>
    <pattern id="blocks" x="100" y="55" width="100" height="60" patternUnits="userSpaceOnUse">
      <rect x="10" y="10" width="80" height="40" rx="5" fill="#e2e8f0"/>
    </pattern>
  </defs>
  <rect x="100" y="55" width="400" height="240" fill="url(#blocks)"/>

  <!-- Streets -->
  <g fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round">
    <path d="M100 55H500 M100 115H500 M100 175H500 M100 235H500 M100 295H500"/>
    <path d="M100 55V295 M200 55V295 M300 55V295 M400 55V295 M500 55V295"/>
  </g>

  <!-- Shortest route: four segments east, four south -->
  <path d="M100 55H500V295" fill="none" stroke="#2563eb" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Intersections -->
  <g fill="#ffffff" stroke="#475569" stroke-width="2">
    <circle cx="100" cy="55" r="5"/><circle cx="200" cy="55" r="5"/><circle cx="300" cy="55" r="5"/><circle cx="400" cy="55" r="5"/><circle cx="500" cy="55" r="5"/>
    <circle cx="100" cy="115" r="5"/><circle cx="300" cy="115" r="5"/><circle cx="400" cy="115" r="5"/><circle cx="500" cy="115" r="5"/>
    <circle cx="100" cy="175" r="5"/><circle cx="200" cy="175" r="5"/><circle cx="400" cy="175" r="5"/><circle cx="500" cy="175" r="5"/>
    <circle cx="100" cy="235" r="5"/><circle cx="200" cy="235" r="5"/><circle cx="300" cy="235" r="5"/><circle cx="500" cy="235" r="5"/>
    <circle cx="100" cy="295" r="5"/><circle cx="200" cy="295" r="5"/><circle cx="300" cy="295" r="5"/><circle cx="400" cy="295" r="5"/><circle cx="500" cy="295" r="5"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M193 108L207 122 M207 108L193 122"/>
    <path d="M293 168L307 182 M307 168L293 182"/>
    <path d="M393 228L407 242 M407 228L393 242"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="100" cy="55" r="8" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
  <circle cx="500" cy="295" r="8" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#0f172a">
    <text x="111" y="43">A1</text><text x="211" y="43">B1</text><text x="311" y="43">C1</text><text x="411" y="43">D1</text><text x="511" y="43">E1</text>
    <text x="111" y="103">A2</text><text x="211" y="103">B2</text><text x="311" y="103">C2</text><text x="411" y="103">D2</text><text x="511" y="103">E2</text>
    <text x="111" y="163">A3</text><text x="211" y="163">B3</text><text x="311" y="163">C3</text><text x="411" y="163">D3</text><text x="511" y="163">E3</text>
    <text x="111" y="223">A4</text><text x="211" y="223">B4</text><text x="311" y="223">C4</text><text x="411" y="223">D4</text><text x="511" y="223">E4</text>
    <text x="111" y="283">A5</text><text x="211" y="283">B5</text><text x="311" y="283">C5</text><text x="411" y="283">D5</text><text x="511" y="283">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700">
    <text x="81" y="60" text-anchor="end" fill="#15803d">START</text>
    <text x="500" y="321" text-anchor="middle" fill="#7c3aed">END</text>
  </g>

  <!-- Dedicated footer -->
  <path d="M24 336H576" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="358" font-size="16" font-weight="700" fill="#1d4ed8">Shortest route: 8 street segments</text>
    <text x="300" y="384" font-size="14" fill="#334155">2026-10-30 16:33:28 SGT (UTC+08:00)</text>
  </g>
</svg>