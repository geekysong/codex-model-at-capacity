<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Top-down city grid with shortest route from A1 to E5 avoiding blocked intersections">
  <rect width="600" height="400" fill="#f7f9fc"/>
  <text x="300" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#243247">CITY BLOCK ROUTE</text>

  <!-- Streets -->
  <g stroke="#aab6c5" stroke-width="3" stroke-linecap="round">
    <path d="M100 60H500 M100 120H500 M100 180H500 M100 240H500 M100 300H500"/>
    <path d="M100 60V300 M200 60V300 M300 60V300 M400 60V300 M500 60V300"/>
  </g>

  <!-- Shortest route: 8 street segments -->
  <path d="M100 60H500V300"
        fill="none" stroke="#1674e8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1674e8">
    <circle cx="100" cy="60" r="7"/>
    <circle cx="200" cy="60" r="5"/>
    <circle cx="300" cy="60" r="5"/>
    <circle cx="400" cy="60" r="5"/>
    <circle cx="500" cy="60" r="5"/>
    <circle cx="500" cy="120" r="5"/>
    <circle cx="500" cy="180" r="5"/>
    <circle cx="500" cy="240" r="5"/>
    <circle cx="500" cy="300" r="7"/>
  </g>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#304156">
    <g><text x="100" y="45">A1</text><text x="200" y="45">B1</text><text x="300" y="45">C1</text><text x="400" y="45">D1</text><text x="500" y="45">E1</text></g>
    <g><text x="100" y="108">A2</text><text x="200" y="108">B2</text><text x="300" y="108">C2</text><text x="400" y="108">D2</text><text x="500" y="108">E2</text></g>
    <g><text x="100" y="168">A3</text><text x="200" y="168">B3</text><text x="300" y="168">C3</text><text x="400" y="168">D3</text><text x="500" y="168">E3</text></g>
    <g><text x="100" y="228">A4</text><text x="200" y="228">B4</text><text x="300" y="228">C4</text><text x="400" y="228">D4</text><text x="500" y="228">E4</text></g>
    <g><text x="100" y="288">A5</text><text x="200" y="288">B5</text><text x="300" y="288">C5</text><text x="400" y="288">D5</text><text x="500" y="288">E5</text></g>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#d63232" stroke-width="5" stroke-linecap="round">
    <path d="M192 112L208 128 M208 112L192 128"/>
    <path d="M292 172L308 188 M308 172L292 188"/>
    <path d="M392 232L408 248 M408 232L392 248"/>
  </g>

  <!-- Start and end markers -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700">
    <rect x="58" y="32" width="32" height="20" rx="5" fill="#1674e8"/>
    <text x="74" y="46" text-anchor="middle" fill="#ffffff">START</text>
    <rect x="508" y="286" width="28" height="20" rx="5" fill="#1674e8"/>
    <text x="522" y="300" text-anchor="middle" fill="#ffffff">END</text>
  </g>

  <text x="300" y="339" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1674e8">Shortest route: 8 street segments</text>
  <text x="300" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#536477">Blue: route  •  Red X: blocked intersections</text>
  <text x="300" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#304156">2026-10-30 16:34:30 SGT (UTC+08:00)</text>
</svg>