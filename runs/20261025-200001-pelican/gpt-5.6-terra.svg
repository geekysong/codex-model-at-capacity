<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of an oversized pelican proudly riding a tiny bicycle.</desc>
  <style>
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
    .bob { transform-box: fill-box; transform-origin: center; animation: bob .65s ease-in-out infinite alternate; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: pedal .65s linear infinite; }
    .flag { transform-box: fill-box; transform-origin: left center; animation: flag .8s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes flag { to { transform: skewY(-9deg); } }
  </style>

