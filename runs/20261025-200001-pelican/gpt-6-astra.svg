  <g font-family="Arial, sans-serif" fill="#253744">
    <path d="M493 108H667Q681 108 681 122V137Q681 151 667 151H584L567 161L569 151H493Q479 151 479 137V122Q479 108 493 108Z" fill="#fffdf5" stroke="#253744" stroke-width="2.5"/>
    <text x="580" y="136" text-anchor="middle" font-size="17" font-weight="bold">“Put it on my bill.”</text>
