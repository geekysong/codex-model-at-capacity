  <rect x="35" y="498" width="730" height="66" rx="8" fill="#fff6df"/>
  <text x="400" y="526" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#253744">He skipped the delivery fee. The fish paid in fear.</text>
  <path d="M75 541H725" stroke="#c9b996" stroke-width="1"/>
  <text x="400" y="563" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#495762">2026-10-25 20:00:01 SGT (UTC+08:00)</text>
