        <path d="M-66 0H66 M0-66V66 M-47-47L47 47 M-47 47L47-47"/>
      </g>
      <path d="M-12-66H12" stroke="#eea633" stroke-width="6" stroke-linecap="round"/>
      <circle r="9" fill="#253744"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
