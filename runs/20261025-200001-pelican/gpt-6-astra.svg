<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Express: Beak-hour traffic</title>
  <desc id="desc">A smug pelican pedals a bicycle along the waterfront, carrying fish in its enormous bill. The wheels spin, pedals turn, and the rider bobs in a looping animation.</desc>
  <defs>
    <pattern id="water" width="85" height="25" patternUnits="userSpaceOnUse">
      <path d="M8 12 Q22 5 36 12 T64 12" fill="none" stroke="#9ad6d9" stroke-width="3"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#fffaf0" stroke="#253744" stroke-width="12"/>
