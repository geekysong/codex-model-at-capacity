<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon of a determined pelican cycling past a sign demanding more bicycle lanes.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.15s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: top center; animation: pedal .55s ease-in-out infinite alternate; }
    .cloud { animation: drift 9s linear infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(5px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(18deg); } }
    @keyframes drift { to { transform: translateX(45px); } }
  </style>

  <rect width="800" height="600" fill="#9bdef2"/>
  <path class="cloud" d="M70 125c10-31 57-31 65-1 23-20 61-4 55 23H57c-13-10-4-22 13-22z" fill="#fff" opacity=".85"/>
  <path d="M560 92c12-33 58-30 66 0 23-18 58-1 54 25H544c-10-13 0-25 16-25z" fill="#fff" opacity=".85"/>

  <text x="400" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="33" font-weight="900" fill="#173b55">PELICAN COMMUTES, HUMANITY PANICS</text>
  <text x="400" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#28556e">“I’m not blocking traffic. I AM traffic.”</text>

  <rect y="344" width="800" height="150" fill="#4e5961"/>
  <path d="M0 416H800" stroke="#f8e95c" stroke-width="8" stroke-dasharray="42 28"/>
  <path d="M0 494H800" stroke="#29343b" stroke-width="6"/>

  <g transform="translate(630 190)">
    <rect x="0" y="0" width="128" height="110" rx="8" fill="#f8f0ca" stroke="#38444a" stroke-width="5"/>
    <text x="64" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#313b40">CITY NOTICE</text>
    <path d="M21 48h86M21 72h86" stroke="#dc5a48" stroke-width="6"/>
    <text x="64" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#313b40">NO BIRDS</text>
    <path d="M64 120v62" stroke="#4a3930" stroke-width="10"/>
  </g>

  <g transform="translate(92 321)">
    <path d="M0 24c35-13 64-5 88 11" fill="none" stroke="#718f42" stroke-width="12" stroke-linecap="round"/>
    <path d="M45 43c32-25 64-17 89-1" fill="none" stroke="#718f42" stroke-width="11" stroke-linecap="round"/>
  </g>

  <g aria-label="bicycle">
    <g class="wheel">
      <circle cx="270" cy="414" r="68" fill="#dce8e8" stroke="#1e2c33" stroke-width="12"/>
      <circle cx="270" cy="414" r="8" fill="#ee7054"/>
      <path d="M270 349v130M205 414h130M224 368l92 92M316 368l-92 92" stroke="#7c979b" stroke-width="4"/>
    </g>
    <g class="wheel">
      <circle cx="510" cy="414" r="68" fill="#dce8e8" stroke="#1e2c33" stroke-width="12"/>
      <circle cx="510" cy="414" r="8" fill="#ee7054"/>
      <path d="M510 349v130M445 414h130M464 368l92 92M556 368l-92 92" stroke="#7c979b" stroke-width="4"/>
    </g>
    <path d="M270 414L350 309 425 414zM350 309l102 1 58 104M425 414l85 0M350 309l-21-39M452 310l32-33" fill="none" stroke="#e5483d" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M305 267h49M475 276h50" stroke="#1e2c33" stroke-width="10" stroke-linecap="round"/>
    <circle cx="425" cy="414" r="22" fill="none" stroke="#1e2c33" stroke-width="7"/>
    <path d="M425 414l31 24M425 414l-32-23" stroke="#1e2c33" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="rider">
    <path d="M365 300c-17 39-14 85 11 110l50-4c9-45 2-81-19-109z" fill="#6b8fa1" stroke="#213943" stroke-width="5"/>
    <path class="leg" d="M389 395l36 25 31 17" fill="none" stroke="#e88f45" stroke-width="16" stroke-linecap="round"/>
    <path class="leg" d="M402 394l-13 30 8 26" fill="none" stroke="#e88f45" stroke-width="16" stroke-linecap="round"/>
    <path d="M448 437h27M385 452h25" stroke="#26363c" stroke-width="10" stroke-linecap="round"/>

    <path d="M385 308c-46-8-65-48-54-92 10-43 43-68 78-54 34 14 40 75 8 121z" fill="#f4f4e6" stroke="#213943" stroke-width="5"/>
    <path d="M341 250c-25 16-20 51 13 53 38 2 73-16 103-53-42 7-79 1-116 0z" fill="#f1aa39" stroke="#213943" stroke-width="5"/>
    <path d="M352 267c24 9 48 6 70-3" fill="none" stroke="#cb6b2e" stroke-width="4"/>
    <ellipse cx="379" cy="223" rx="8" ry="11" fill="#172b35"/>
    <circle cx="381" cy="220" r="2.5" fill="white"/>
    <path d="M348 211q28-24 54-5" fill="none" stroke="#213943" stroke-width="7" stroke-linecap="round"/>
    <path d="M331 211q-5-33 28-40 34-8 52 23" fill="#334f60" stroke="#213943" stroke-width="5"/>
    <path d="M404 313c36-10 59-16 79-31" fill="none" stroke="#f4f4e6" stroke-width="17" stroke-linecap="round"/>
    <path d="M478 281l28-5" stroke="#f4f4e6" stroke-width="13" stroke-linecap="round"/>
  </g>

  <g transform="translate(95 210)">
    <rect width="165" height="82" rx="15" fill="#fff8d8" stroke="#263a43" stroke-width="5"/>
    <path d="M115 82l18 20 4-20" fill="#fff8d8" stroke="#263a43" stroke-width="5"/>
    <text x="82" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="900" fill="#253f4b">BIKE LANE?</text>
    <text x="82" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#253f4b">I thought this was it.</text>
  </g>

  <rect y="510" width="800" height="90" fill="#173b55"/>
  <text x="400" y="541" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fff5ce">A pelican pedals bravely through a city designed for absolutely nobody.</text>
  <text x="400" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#b9eafa">2026-10-25 12:32:21 SGT (UTC+08:00)</text>
</svg>