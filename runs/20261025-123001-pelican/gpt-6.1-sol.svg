<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Peak Commute: a pelican riding a bicycle</title>
  <desc id="desc">A determined pelican with an enormous beak pedals a tiny bicycle past a sardine delivery sign. Both wheels spin, the pedals turn, and the pelican bobs. Caption: All beak. No brakes.</desc>
  <defs>
    <pattern id="spokes" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0h4" stroke="#fff" stroke-width="1"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fffdf5" stroke="#243746" stroke-width="10"/>
      <circle r="65" fill="none" stroke="#9cb6bb" stroke-width="2"/>
      <g stroke="#8aa6ad" stroke-width="2">
        <path d="M-69 0H69M0-69V69M-49-49l98 98M-49 49l98-98"/>
        <path d="M-64-26L64 26M-26-64L26 64M-64 26L64-26M-26 64L26-64"/>
      </g>
      <path d="M-29-63a69 69 0 0 1 55 0" fill="none" stroke="#ef7352" stroke-width="6"/>
      <circle r="8" fill="#243746"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff8e8"/>
  <path d="M0 305Q130 255 265 301T530 294T800 280V463H0Z" fill="#dcebdc"/>
  <circle cx="684" cy="150" r="38" fill="#ffd36f"/>
  <g fill="#fff" opacity=".85">
    <path d="M61 174q-4-23 19-24 10-29 34-10 30-3 30 24H61Z"/>
    <path d="M567 119q0-17 18-18 11-24 31-8 24-3 27 26Z"/>
  </g>

  <text x="400" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#243746">PEAK COMMUTE</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#8e5743">THE DAILY GRIND, WITH EXTRA GULP</text>

  <g stroke="#243746" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 467H800" stroke-width="4"/>
    <path d="M47 441h73m-45-16h57m-82-16h44" stroke="#a2b6a3" stroke-width="4"/>
    <ellipse cx="391" cy="467" rx="248" ry="10" fill="#243746" opacity=".12" stroke="none"/>

    <g transform="translate(245 386)">
      <g>
        <use href="#wheel"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(535 386)">
      <g>
        <use href="#wheel"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <g fill="none" stroke="#e45e49" stroke-width="10">
      <path d="M245 386l86-112 54 112H245l111-80h139l-110 80"/>
      <path d="M495 306l40 80M495 306l-14-43"/>
    </g>
    <path d="M331 274l-8-24" fill="none" stroke-width="7"/>
    <path d="M299 250h54" stroke-width="12"/>
    <path d="M481 264l-5-19h30q17 0 17 15" fill="none" stroke-width="7"/>
    <circle cx="385" cy="386" r="21" fill="#fff8e8" stroke-width="5"/>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
      <!-- The far leg reaches the opposite pedal. -->
      <path d="M355 278l37 49-34 43" fill="none" stroke="#c68d28" stroke-width="11"/>
      <path d="M346 372l28 1-10 11-25-2Z" fill="#eab03d" stroke-width="3"/>

      <!-- A streamlined body and a decidedly unstreamlined beak. -->
      <path d="M321 207l-42 25 34 7q-12 34 22 50 42 18 72-21l26-59Z" fill="#fffefa" stroke-width="4"/>
      <path d="M323 232q23-29 62-13-1 33-34 44-19-4-28-31Z" fill="#e2e9e4" stroke-width="3"/>
      <path d="M387 249q22-19 18-51-7-43 21-63 23-17 46-2 22 15 15 40-5 21-30 32-11 25-11 44-28 29-59 0Z" fill="#fffefa" stroke-width="4"/>

      <!-- The pouch droops like an overloaded shopping bag. -->
      <path d="M476 165l186 26q-81 81-163 31-19-15-23-57Z" fill="#f6ba63" stroke-width="4"/>
      <path d="M478 158l196 28-13 13-181-18Z" fill="#ffd66b" stroke-width="4"/>
      <path d="M504 196q62 34 126 8" fill="none" stroke="#d98a42" stroke-width="3"/>
      <circle cx="461" cy="153" r="14" fill="white" stroke-width="3"/>
      <circle cx="466" cy="155" r="5" fill="#243746" stroke="none"/>
      <path d="M446 132l24 5" stroke-width="5"/>
      <path d="M428 128l-9-12m19 10-2-16" fill="none" stroke-width="3"/>

      <!-- A tie adds unnecessary corporate urgency. -->
      <path d="M419 213l15 6-7 13-10-7Z" fill="#e45e49" stroke-width="2"/>
      <path d="M420 229l-12 40 15 12 11-46Z" fill="#e45e49" stroke-width="2"/>
      <path d="M377 235q39 12 81 22l23-7" fill="none" stroke="#243746" stroke-width="5"/>
      <path d="M458 257l18 4 8-10" fill="none" stroke="#e5ad3b" stroke-width="7"/>

      <path d="M365 279l60 44-33 47" fill="none" stroke="#e5ad3b" stroke-width="12">
        <animate attributeName="d" values="M365 279l60 44-33 47;M365 279l42 52-23 51;M365 279l60 44-33 47" dur=".8s" repeatCount="indefinite"/>
      </path>
      <path d="M387 366l25 10-3 11-36-4Z" fill="#f6be48" stroke-width="3"/>
    </g>

    <g transform="translate(385 386)">
      <g>
        <path d="M-27 0H27" stroke-width="5"/>
        <path d="M-36 0h18M18 0h18" stroke-width="7"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(63 252)">
      <path d="M45 62v143" fill="none" stroke="#927452" stroke-width="7"/>
      <path d="M0 0h99l23 35-23 35H0Z" fill="#fffefa" stroke-width="3"/>
      <text x="53" y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#243746" stroke="none">SARDINES</text>
      <text x="53" y="49" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e45e49" stroke="none">1 MILE →</text>
    </g>
  </g>

  <rect x="0" y="482" width="800" height="118" fill="#fff8e8"/>
  <text x="400" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#243746">All beak. No brakes.</text>
  <path d="M72 543H728" stroke="#d8cbb3" stroke-width="1"/>
  <text x="400" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#485660">2026-10-25 12:31:09 SGT (UTC+08:00)</text>
</svg>