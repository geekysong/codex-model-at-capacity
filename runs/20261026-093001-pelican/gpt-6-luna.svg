<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Beak Escape</title>
  <desc id="desc">A smug pelican pedals a bicycle while a fish dangles from its enormous beak pouch.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .wheel { transform-box: view-box; transform-origin: center; animation: spin 3s linear infinite; }
      .rider { transform-box: view-box; transform-origin: 405px 330px; animation: bob .65s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#dff6f2"/>
  <circle cx="690" cy="117" r="48" fill="#ffd166"/>
  <path d="M0 390 Q130 355 250 390 T500 384 T800 390 V600 H0Z" fill="#9ed9c5"/>
  <path d="M0 442 Q180 410 350 442 T800 430" fill="none" stroke="#75c4aa" stroke-width="5"/>
  <path d="M0 504 Q170 477 340 504 T800 495" fill="none" stroke="#75c4aa" stroke-width="4"/>

  <text x="400" y="58" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="1" fill="#17324d">THE GREAT BEAK ESCAPE</text>
  <text x="400" y="88" text-anchor="middle" font-size="16" font-weight="600" fill="#31566c">“I’m not late. I’m fishing on the way.”</text>

  <g fill="#fff" opacity=".88">
    <path d="M102 149c0-12 10-22 22-22 8 0 15 4 19 11 3-2 7-3 11-3 11 0 20 9 20 20s-9 20-20 20h-49c-11 0-20-9-20-20 0-9 7-17 17-18z"/>
    <path d="M555 205c0-9 8-17 17-17 6 0 12 3 15 9 3-2 6-2 9-2 9 0 16 7 16 16s-7 16-16 16h-40c-9 0-16-7-16-16 0-7 6-14 14-14z"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#e85d4a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M220 414 L333 414 L385 326 L290 326 Z"/>
    <path d="M333 414 L410 414 L385 326"/>
    <path d="M385 326 L427 326"/>
    <path d="M410 414 L440 366"/>
  </g>
  <g class="wheel" fill="none" stroke="#17324d" stroke-width="6">
    <circle cx="220" cy="414" r="63"/>
    <path d="M220 351v126 M157 414h126 M175.5 369.5l89 89 M264.5 369.5l-89 89"/>
  </g>
  <g class="wheel" fill="none" stroke="#17324d" stroke-width="6">
    <circle cx="440" cy="414" r="63"/>
    <path d="M440 351v126 M377 414h126 M395.5 369.5l89 89 M484.5 369.5l-89 89"/>
  </g>
  <circle cx="333" cy="414" r="12" fill="#ffd166" stroke="#17324d" stroke-width="4"/>
  <path d="M293 314h38" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
  <path d="M414 317l26 3" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>

  <!-- Pelican rider -->
  <g class="rider">
    <path d="M323 279 Q345 222 395 236 Q429 245 425 285 Q421 326 382 335 Q344 340 323 309Z" fill="#fff" stroke="#17324d" stroke-width="5"/>
    <path d="M356 321 Q354 346 333 361 L315 396" fill="none" stroke="#17324d" stroke-width="9" stroke-linecap="round"/>
    <path d="M397 326 Q416 344 407 366 L386 399" fill="none" stroke="#17324d" stroke-width="9" stroke-linecap="round"/>
    <path d="M315 396l-15 9 M386 399l-12 8" stroke="#e85d4a" stroke-width="7" stroke-linecap="round"/>

    <!-- neck and head -->
    <path d="M379 256 Q386 210 411 185 Q430 168 450 181 Q469 194 457 213 Q444 233 426 244 L421 275" fill="#fff" stroke="#17324d" stroke-width="5"/>
    <ellipse cx="449" cy="184" rx="31" ry="25" fill="#fff" stroke="#17324d" stroke-width="5"/>
    <circle cx="459" cy="179" r="4.5" fill="#17324d"/>
    <path d="M471 189 Q535 188 568 202 Q531 214 472 205Z" fill="#f4a261" stroke="#17324d" stroke-width="4"/>
    <path d="M477 202 Q517 235 549 216 Q525 247 493 230 Q479 222 472 207Z" fill="#f28c78" stroke="#17324d" stroke-width="4"/>
    <path d="M500 208 Q508 219 517 221" fill="none" stroke="#d85c52" stroke-width="3"/>
    <path d="M422 165 Q440 147 460 163" fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <path d="M481 166l11-13 M487 173l17-4" stroke="#e85d4a" stroke-width="4" stroke-linecap="round"/>

    <!-- wings and handlebars -->
    <path d="M344 267 Q380 245 407 275 Q386 298 354 294Z" fill="#eef7f6" stroke="#17324d" stroke-width="4"/>
    <path d="M354 276l35 6 M359 285l27 5" stroke="#b4d8d6" stroke-width="3"/>
    <path d="M398 285 Q414 304 428 320" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>
    <path d="M428 320l12-3" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>
    <path d="M347 293 Q328 312 320 326" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>

    <!-- dangling fish -->
    <path d="M550 225 Q563 235 561 251" fill="none" stroke="#31566c" stroke-width="2" stroke-dasharray="4 4"/>
    <g transform="translate(561 250)">
      <path d="M0 0 Q15-12 29 0 Q15 12 0 0Z" fill="#4da6a8" stroke="#17324d" stroke-width="2"/>
      <path d="M27 0l10-8v16z" fill="#f4a261" stroke="#17324d" stroke-width="2"/>
      <circle cx="7" cy="-2" r="1.8" fill="#17324d"/>
    </g>
    <path d="M568 183q5-8 10 0" fill="none" stroke="#e85d4a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g fill="#17324d" font-size="13" font-weight="700">
    <text x="107" y="337">COMMUTE</text>
    <text x="103" y="354">STATUS:</text>
    <text x="103" y="371" fill="#e85d4a">FISHING</text>
  </g>
  <path d="M168 352 Q190 360 201 376" fill="none" stroke="#17324d" stroke-width="2"/>
  <circle cx="200" cy="378" r="4" fill="#17324d"/>

  <rect x="0" y="548" width="800" height="52" fill="#17324d"/>
  <text x="400" y="570" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">A pelican pedals past the fish market, insisting this counts as lunch.</text>
  <text x="400" y="590" text-anchor="middle" font-size="12" font-weight="600" fill="#ffd166">2026-10-26 09:32:39 SGT (UTC+08:00)</text>
</svg>