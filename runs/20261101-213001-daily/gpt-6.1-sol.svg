<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">A 25-cell path in 24 moves</title>
  <desc id="desc">A continuous serpentine path visits every cell of a five-by-five grid exactly once, starting at the top-left cell and ending at the bottom-right cell. Cells are numbered from 1 to 25 in visit order.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="300" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Visit every cell · 24 moves</text>

  <rect x="170" y="55" width="260" height="260" fill="#f8fafc"/>
  <path d="M170 55H430V315H170Z M222 55V315 M274 55V315 M326 55V315 M378 55V315 M170 107H430 M170 159H430 M170 211H430 M170 263H430"
        fill="none" stroke="#94a3b8" stroke-width="1.5"/>

  <polyline points="196,81 248,81 300,81 352,81 404,81
                    404,133 352,133 300,133 248,133 196,133
                    196,185 248,185 300,185 352,185 404,185
                    404,237 352,237 300,237 248,237 196,237
                    196,289 248,289 300,289 352,289 404,289"
            fill="none" stroke="#2563eb" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="208" y="69">1</text>
    <text x="260" y="69">2</text>
    <text x="312" y="69">3</text>
    <text x="364" y="69">4</text>
    <text x="416" y="69">5</text>
    <text x="416" y="121">6</text>
    <text x="364" y="121">7</text>
    <text x="312" y="121">8</text>
    <text x="260" y="121">9</text>
    <text x="208" y="121">10</text>
    <text x="208" y="173">11</text>
    <text x="260" y="173">12</text>
    <text x="312" y="173">13</text>
    <text x="364" y="173">14</text>
    <text x="416" y="173">15</text>
    <text x="416" y="225">16</text>
    <text x="364" y="225">17</text>
    <text x="312" y="225">18</text>
    <text x="260" y="225">19</text>
    <text x="208" y="225">20</text>
    <text x="208" y="277">21</text>
    <text x="260" y="277">22</text>
    <text x="312" y="277">23</text>
    <text x="364" y="277">24</text>
    <text x="416" y="277">25</text>
  </g>

  <circle cx="196" cy="81" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
  <circle cx="404" cy="289" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" fill="#334155">
    <circle cx="207" cy="340" r="6" fill="#16a34a"/>
    <text x="220" y="345">Start: 1</text>
    <circle cx="330" cy="340" r="6" fill="#dc2626"/>
    <text x="343" y="345">End: 25</text>
  </g>

