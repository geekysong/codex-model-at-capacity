  <g font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" dominant-baseline="middle" fill="#0f172a">
    <text x="72" y="87">1</text>
    <text x="136" y="87">2</text>
    <text x="200" y="87">3</text>
    <text x="264" y="87">4</text>

    <text x="72" y="151">5</text>
    <text x="136" y="151" font-weight="700">6</text>
    <text x="200" y="151">7</text>
    <text x="264" y="151">8</text>

    <text x="72" y="215">9</text>
    <text x="136" y="215">10</text>
    <text x="200" y="215">11</text>
    <text x="264" y="215">12</text>

    <text x="72" y="279">13</text>
