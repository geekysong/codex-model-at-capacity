  <line x1="30" y1="337" x2="570" y2="337" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="368" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" fill="#334155">2026-10-26 09:04:16 SGT (UTC+08:00)</text>
