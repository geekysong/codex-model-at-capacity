<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Power Pedaling</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly pretending it is a race champion.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f4"/>
      <stop offset="1" stop-color="#e9f7d6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c6670"/>
      <stop offset="1" stop-color="#303841"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#18222b" flood-opacity=".35"/>
    </filter>
    <style>
      .ink{stroke:#202b33;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#202b33;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#202b33}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .pedal{transform-box:fill-box;transform-origin:center;animation:pedal 1.2s ease-in-out infinite}
      .rider{animation:bob 1.2s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pedal{0%,100%{transform:rotate(0deg)}50%{transform:rotate(180deg)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="700" cy="100" r="48" fill="#ffd95a" opacity=".9"/>
  <path d="M0 350 Q150 285 300 345 T600 330 T800 350 V440 H0Z" fill="#9acb7c"/>
  <path d="M0 405 Q170 365 330 405 T650 395 T800 410 V600 H0Z" fill="url(#road)"/>
  <path d="M0 492 Q180 470 360 492 T800 488" fill="none" stroke="#f5d76b" stroke-width="10" stroke-dasharray="38 28"/>

  <g filter="url(#shadow)">
    <rect x="55" y="35" width="690" height="92" rx="24" fill="#fff7df" class="ink"/>
    <text x="400" y="77" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN POWER PEDALING</text>
    <text x="400" y="108" text-anchor="middle" class="label" font-size="18" font-weight="700">“Why waddle when you can wobble at speed?”</text>
  </g>

  <g class="rider">
    <!-- bicycle frame -->
    <g>
      <circle cx="255" cy="430" r="78" fill="none" class="ink wheel"/>
      <circle cx="565" cy="430" r="78" fill="none" class="ink wheel"/>
      <g class="wheel" fill="none" stroke="#202b33" stroke-width="3">
        <path d="M255 352V508M177 430H333M200 375L310 485M200 485L310 375"/>
        <path d="M565 352V508M487 430H643M510 375L620 485M510 485L620 375"/>
      </g>
      <path d="M255 430 L350 335 L465 430 L255 430 L410 430 L350 335" fill="none" class="ink"/>
      <path d="M465 430 L540 350" fill="none" class="ink"/>
      <path d="M540 350 L575 345" fill="none" class="ink"/>
      <path d="M338 335 L315 315" fill="none" class="ink"/>
      <path d="M300 315 H335" fill="none" class="ink"/>
      <circle cx="410" cy="430" r="12" fill="#f5b642" class="ink"/>
      <g class="pedal">
        <path d="M410 430 L438 456 M410 430 L386 400" fill="none" class="thin"/>
        <path d="M438 456 h22 M386 400 h-22" fill="none" class="thin"/>
      </g>
      <path d="M188 374 Q255 350 323 374" fill="none" stroke="#202b33" stroke-width="5"/>
    </g>

    <!-- pelican body and neck -->
    <ellipse cx="395" cy="270" rx="78" ry="92" fill="#f7f3e7" class="ink"/>
    <path d="M360 300 Q328 252 350 190 Q370 145 414 164 Q449 180 435 230 L420 290Z" fill="#f7f3e7" class="ink"/>
    <path d="M373 177 Q410 145 449 170 Q467 183 455 204 Q430 216 401 201Z" fill="#f08b46" class="ink"/>
    <path d="M448 181 Q502 173 548 192 Q563 199 548 211 Q490 220 448 203Z" fill="#f08b46" class="ink"/>
    <path d="M452 205 Q500 218 546 207 Q525 245 472 244 Q451 233 452 205Z" fill="#e8753b" class="thin"/>
    <circle cx="422" cy="181" r="8" fill="#202b33"/>
    <path d="M426 225 Q451 242 468 223" fill="none" class="thin"/>
    <path d="M350 264 Q385 285 429 270" fill="none" stroke="#d4cfc0" stroke-width="12"/>
    <path d="M347 245 Q322 232 311 212" fill="none" class="ink"/>
    <path d="M311 212 l-16 15" fill="none" class="ink"/>

    <!-- wing, scarf, legs -->
    <path d="M355 250 Q314 273 333 316 Q354 340 382 306" fill="#d9e3e5" class="ink"/>
    <path d="M350 260 Q375 278 386 300" fill="none" class="thin"/>
    <path d="M382 176 Q350 155 329 135" fill="none" stroke="#e63946" stroke-width="16"/>
    <path d="M329 135 l-28 4 17 22" fill="#e63946" class="thin"/>
    <path d="M382 320 L410 370 L445 370" fill="none" class="ink"/>
    <path d="M410 370 l12 14" fill="none" class="ink"/>
    <path d="M424 320 L450 370 L475 370" fill="none" class="ink"/>
    <path d="M450 370 l13 14" fill="none" class="ink"/>
  </g>

  <g transform="translate(555 270) rotate(8)">
    <path d="M0 0 q28 -18 56 0 q-28 18 -56 0z" fill="#fff7df" class="ink"/>
    <text x="28" y="6" text-anchor="middle" class="label" font-size="14" font-weight="800">HONK!</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="525" width="616" height="50" rx="16" fill="#fff7df" class="ink"/>
    <text x="400" y="547" text-anchor="middle" class="label" font-size="16" font-weight="700">
      A pelican on a bicycle: all beak, no brakes, maximum bird-brained ambition.
    </text>
    <text x="400" y="568" text-anchor="middle" class="label" font-size="13" font-weight="700">
      2026-10-27 20:31:01 SGT (UTC+08:00)
    </text>
  </g>
</svg>