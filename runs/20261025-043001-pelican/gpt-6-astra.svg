<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with an enormous fish-filled beak. Wheels spin, pedals turn, and the pelican bobs. A roadside sign says Bike lane: no wide loads.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0L12 12M12 0L0 12" stroke="#975f37" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <circle r="68" fill="#fff9e8" stroke="#243646" stroke-width="10"/>
      <circle r="58" fill="none" stroke="#a9bfc1" stroke-width="3"/>
      <g stroke="#738f98" stroke-width="3">
        <path d="M-57 0H57M0-57V57M-40-40L40 40M-40 40L40-40"/>
      </g>
      <path d="M0-59A59 59 0 0 1 30-51" fill="none" stroke="#f7b544" stroke-width="6"/>
      <circle r="8" fill="#243646"/>
    </g>
    <g id="fish">
      <path d="M-22 0Q0-20 23 0Q0 20-22 0L-35-11V11Z" fill="#72b6bd" stroke="#243646" stroke-width="2"/>
      <circle cx="13" cy="-2" r="2.5" fill="#243646"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff5db"/>
  <path d="M0 305Q150 275 300 307T600 300T800 290V468H0Z" fill="#d7e9df"/>
  <circle cx="685" cy="155" r="43" fill="#f7cb65"/>
  <g fill="#fffdf4">
    <path d="M66 163Q57 139 81 134Q91 106 118 125Q145 118 152 145Q173 151 165 163Z"/>
    <path d="M572 116Q564 100 582 95Q592 75 610 91Q635 88 638 107L649 116Z"/>
  </g>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="43" fill="#243646">TOUR DE FISH</text>
  <text x="400" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" letter-spacing="2" fill="#50636a">BIG BILL. TINY BIKE. ZERO SHAME.</text>

  <!-- Roadside bureaucracy -->
  <path d="M690 288V442" stroke="#687c7e" stroke-width="9"/>
  <rect x="616" y="227" width="148" height="85" rx="8" fill="#fffdf3" stroke="#243646" stroke-width="4"/>
  <g text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" fill="#243646">
    <text x="690" y="252" font-size="18">BIKE LANE</text>
    <text x="690" y="277" font-size="15">NO WIDE</text>
    <text x="690" y="297" font-size="15">LOADS</text>
  </g>

  <path d="M0 461H800V505H0Z" fill="#b8c8c4"/>
  <path d="M0 462H800" stroke="#718783" stroke-width="4"/>
  <path d="M20 488H105M154 488H239M288 488H373M422 488H507M556 488H641M690 488H775" stroke="#fff9e8" stroke-width="5"/>
  <ellipse cx="395" cy="466" rx="227" ry="10" fill="#243646" opacity=".12"/>

  <!-- Rotating wheels -->
  <g transform="translate(258 395)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(540 395)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- Bicycle -->
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M258 395L324 297L383 395ZM324 297H493L383 395M493 297L540 395" stroke="#243646" stroke-width="13"/>
    <path d="M258 395L324 297L383 395ZM324 297H493L383 395M493 297L540 395" stroke="#ec6653" stroke-width="8"/>
    <path d="M324 297L315 277M493 297L480 261L506 247H529" stroke="#243646" stroke-width="8"/>
    <path d="M293 277H337" stroke="#243646" stroke-width="12"/>
    <path d="M258 395L383 385L394 405L258 403Z" stroke="#647b82" stroke-width="3"/>
  </g>
  <circle cx="383" cy="395" r="20" fill="#fff5db" stroke="#243646" stroke-width="5"/>

  <!-- Pelican and bobbing rider -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".75s" repeatCount="indefinite"/>
    <path d="M325 266Q309 300 349 323L383 370" fill="none" stroke="#d58a35" stroke-width="13" stroke-linecap="round"/>
    <path d="M264 247L226 223L241 262L224 272L274 283" fill="#fffdf4" stroke="#243646" stroke-width="4"/>
    <path d="M270 209Q296 183 343 194Q366 201 384 225Q399 244 380 265Q351 294 298 277Q256 265 270 209Z" fill="#fffdf4" stroke="#243646" stroke-width="4"/>
    <path d="M332 215Q368 209 371 177L373 154Q376 125 405 131Q435 136 425 164L411 216Q398 257 370 261" fill="#fffdf4" stroke="#243646" stroke-width="4"/>
    <path d="M293 224Q318 208 345 227L388 248L475 255" fill="none" stroke="#243646" stroke-width="16" stroke-linecap="round"/>
    <path d="M293 222Q318 211 345 229L388 248L475 255" fill="none" stroke="#d9e4dc" stroke-width="10" stroke-linecap="round"/>
    <path d="M282 245Q307 268 333 255" fill="none" stroke="#a2b5b3" stroke-width="3"/>

    <!-- Helmet, eye, and enormous cargo pouch -->
    <path d="M367 149Q367 116 400 117Q428 118 436 143Z" fill="#eb6551" stroke="#243646" stroke-width="4"/>
    <path d="M386 125L382 138M402 123L401 137M417 128L420 137" stroke="#fff5db" stroke-width="5"/>
    <path d="M377 149L394 177L421 147" fill="none" stroke="#243646" stroke-width="3"/>
    <ellipse cx="410" cy="155" rx="10" ry="12" fill="white" stroke="#243646" stroke-width="3"/>
    <circle cx="414" cy="157" r="4" fill="#243646"/>
    <path d="M401 139L421 144" stroke="#243646" stroke-width="4" stroke-linecap="round"/>
    <path d="M422 174L594 181Q563 250 486 224Q441 210 422 174Z" fill="#f2b55f" stroke="#243646" stroke-width="4"/>
    <g transform="translate(492 197) rotate(12)">
      <use href="#fish"/>
    </g>
    <g transform="translate(544 195) rotate(-14) scale(.7)">
      <use href="#fish"/>
    </g>
    <path d="M423 163Q506 160 608 179Q611 189 593 187L424 178Z" fill="#f8cf68" stroke="#243646" stroke-width="4"/>
    <path d="M463 214Q497 235 533 220" fill="none" stroke="#ce873b" stroke-width="3"/>
    <path d="M354 171L347 161M348 187L335 184" stroke="#243646" stroke-width="3" stroke-linecap="round"/>

    <path d="M342 270Q369 293 356 323L394 378" fill="none" stroke="#f4ad43" stroke-width="14" stroke-linecap="round">
      <animate attributeName="d" values="M342 270Q369 293 356 323L394 378;M342 270Q383 296 375 329L367 397;M342 270Q369 293 356 323L394 378" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Pedal crank -->
  <g transform="translate(383 395)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-22 0H22" stroke="#243646" stroke-width="6"/>
      <path d="M22-9V9M-22-9V9" stroke="#243646" stroke-width="8" stroke-linecap="round"/>
      <circle r="5" fill="#ec6653"/>
    </g>
  </g>

  <!-- Determined puff of effort -->
  <g fill="none" stroke="#718783" stroke-width="3" stroke-linecap="round">
    <path d="M190 352H220M179 368H207M183 385H198"/>
  </g>
  <rect x="55" y="177" width="178" height="65" rx="17" fill="#fffdf4" stroke="#243646" stroke-width="3"/>
  <path d="M219 238L248 253L232 222" fill="#fffdf4" stroke="#243646" stroke-width="3" stroke-linejoin="round"/>
  <path d="M218 236L230 222" stroke="#fffdf4" stroke-width="5"/>
  <text x="144" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#243646">
    <tspan x="144">“It’s all</tspan>
    <tspan x="144" dy="23">carry-on.”</tspan>
  </text>

  <!-- Dedicated caption and timestamp footer -->
  <rect y="509" width="800" height="91" fill="#fff5db"/>
  <text x="400" y="539" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#243646">He cycles to save fuel. The fish pay the bill.</text>
  <path d="M105 551H695" stroke="#d7c9ab"/>
  <text x="400" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#435963">2026-10-25 04:30:01 SGT (UTC+08:00)</text>
</svg>