  <text x="400" y="63" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="35" fill="#172238">PELICAN PEDALS FOR PRESIDENT!</text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#42536a">“A beak in every pothole!”</text>

