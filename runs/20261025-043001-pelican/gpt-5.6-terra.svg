<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">PELICAN PEDALS FOR PRESIDENT</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle, campaigning with an empty promise basket.</desc>
  <defs>
    <style>
      .ink{stroke:#172238;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheel{animation:spin 1.4s linear infinite;transform-box:fill-box;transform-origin:center}
      .bob{animation:bob .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      .pedal{animation:pedal .7s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-7px) rotate(-1deg)}}
    </style>
  </defs>

