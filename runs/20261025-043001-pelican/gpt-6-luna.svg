<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Peloton</title>
  <desc id="desc">A determined pelican pedals a bicycle, its enormous beak full of fish, as a tiny fish cheers it on.</desc>
  <defs>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.2s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
      .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-5px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#bcecff"/>
  <path d="M0 0h800v333c-88-28-153-8-239 2-112 13-182-24-288-2C166 353 86 364 0 337z" fill="#dff7ff"/>
  <circle cx="680" cy="118" r="48" fill="#ffd65a"/>
  <path d="M0 381c116-32 205-12 306 6s191 8 279-10 147-19 215 2v145H0z" fill="#83cc72"/>
  <path d="M0 451c135-18 218-4 333 11s210 10 467-17v97H0z" fill="#65b65d"/>
  <path d="M0 520h800v80H0z" fill="#464a55"/>
  <path d="M0 559h800" stroke="#fff4bf" stroke-width="6" stroke-dasharray="40 27"/>

  <text x="400" y="54" text-anchor="middle" font-size="33" font-weight="900" fill="#163b59" stroke="#fff" stroke-width="5" paint-order="stroke">THE PELICAN PELOTON</text>
  <text x="400" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#35566b">“Tour de Beak: snacks are strictly on the go.”</text>

  <!-- comic speed lines -->
  <path d="M86 277h102M61 301h121M109 325h77" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <path d="M213 437h370" stroke="#266546" stroke-width="5" stroke-linecap="round" opacity=".65"/>

  <!-- bicycle wheels -->
  <g class="wheel" fill="none" stroke="#26394b" stroke-width="8">
    <circle cx="260" cy="420" r="74" fill="#e9fbff" stroke="#26394b" stroke-width="8"/>
    <circle cx="260" cy="420" r="5" fill="#26394b" stroke="none"/>
    <path d="M260 346v148M186 420h148M208 368l104 104M312 368 208 472" stroke="#4b7384" stroke-width="3"/>
  </g>
  <g class="wheel" fill="none" stroke="#26394b" stroke-width="8">
    <circle cx="560" cy="420" r="74" fill="#e9fbff" stroke="#26394b" stroke-width="8"/>
    <circle cx="560" cy="420" r="5" fill="#26394b" stroke="none"/>
    <path d="M560 346v148M486 420h148M508 368l104 104M612 368 508 472" stroke="#4b7384" stroke-width="3"/>
  </g>

  <!-- frame and crank -->
  <path d="M260 420 350 330 430 420 335 420 350 330 475 330 560 420" fill="none" stroke="#e34f38" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M475 330h48m-13-12 13 12-13 12" fill="none" stroke="#26394b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M350 330 333 306h-34" fill="none" stroke="#26394b" stroke-width="9" stroke-linecap="round"/>
  <circle cx="335" cy="420" r="14" fill="#ffd65a" stroke="#26394b" stroke-width="5"/>
  <g class="pedal">
    <path d="M335 420 358 440M335 420 312 400" stroke="#26394b" stroke-width="7" stroke-linecap="round"/>
    <path d="M350 444h22M300 396h22" stroke="#26394b" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path d="M296 306h55" stroke="#26394b" stroke-width="11" stroke-linecap="round"/>

  <!-- pelican rider -->
  <g class="rider">
    <!-- tail -->
    <path d="M321 286c-38-18-49-14-67 6 26-3 40 8 52 26z" fill="#f7f2df" stroke="#344653" stroke-width="4"/>
    <!-- body -->
    <ellipse cx="378" cy="282" rx="62" ry="47" fill="#fffaf0" stroke="#344653" stroke-width="5"/>
    <path d="M341 301c25 17 68 18 92 0-13 35-70 44-92 0" fill="#e7a339" stroke="#344653" stroke-width="4"/>
    <path d="M352 246c-5-37 7-74 39-91 31-16 64 3 68 35 3 25-15 43-34 51l-10 49-52-4z" fill="#fffaf0" stroke="#344653" stroke-width="5"/>
    <!-- wing -->
    <path d="M367 272c27-24 57-10 60 11 3 20-25 34-52 23" fill="#e8edf0" stroke="#344653" stroke-width="4"/>
    <path d="M378 274l28 21M373 287l25 17" stroke="#bdc8ce" stroke-width="3" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M412 245c-2 29 1 43 20 61" fill="none" stroke="#fffaf0" stroke-width="18" stroke-linecap="round"/>
    <!-- huge beak and pouch -->
    <path d="M420 199c56-15 123-6 168 14-44 16-93 25-142 19z" fill="#ffbf38" stroke="#6c4b24" stroke-width="5" stroke-linejoin="round"/>
    <path d="M435 218c38 20 97 19 135-5-1 31-34 58-79 54-29-2-50-19-56-49z" fill="#f27c55" stroke="#6c4b24" stroke-width="5"/>
    <path d="M442 225c36 14 83 11 119-7" fill="none" stroke="#ffe1a0" stroke-width="4" stroke-linecap="round"/>
    <!-- eye, brow -->
    <circle cx="431" cy="179" r="12" fill="#fff" stroke="#344653" stroke-width="3"/>
    <circle cx="435" cy="180" r="5" fill="#172d3a"/>
    <path d="M420 161q14-12 28 0" fill="none" stroke="#344653" stroke-width="5" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M397 164c8-31 42-44 68-23 10 8 15 18 16 30z" fill="#32a6d4" stroke="#344653" stroke-width="5"/>
    <path d="M396 166h91" stroke="#344653" stroke-width="7" stroke-linecap="round"/>
    <path d="M430 140l-2 23m24-20 3 20" stroke="#d9f5ff" stroke-width="4"/>
    <!-- legs pedaling -->
    <path d="M384 318 355 364 335 420M409 316 431 365 335 420" fill="none" stroke="#f4a22f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 363l-26 6M430 365l23 4" stroke="#344653" stroke-width="8" stroke-linecap="round"/>
    <!-- goggles reflection -->
    <path d="M427 174l5-4" stroke="#9be7ff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- fish peeking from the pouch -->
  <g transform="rotate(-12 510 244)">
    <path d="M489 247q17-22 39 0-22 22-39 0zm39 0 16-13v26z" fill="#6ce0dc" stroke="#175f72" stroke-width="3"/>
    <circle cx="498" cy="244" r="2.6" fill="#163b59"/>
    <path d="M506 239l5 8m1-9 5 9" stroke="#fff" stroke-width="2"/>
  </g>

  <!-- speech bubble -->
  <path d="M591 126q0-20 20-20h123q20 0 20 20v48q0 20-20 20h-65l-20 18 5-18h-43q-20 0-20-20z" fill="#fff" stroke="#24465b" stroke-width="4"/>
  <text x="677" y="145" text-anchor="middle" font-size="14" font-weight="800" fill="#24465b">I TRAINED FOR</text>
  <text x="677" y="164" text-anchor="middle" font-size="14" font-weight="800" fill="#24465b">THIS SNACK!</text>

  <!-- tiny cheering fish -->
  <g transform="translate(657 380)">
    <path d="M0 17q19-24 43 0Q19 41 0 17zm43 0 19-14v28z" fill="#ffdc62" stroke="#735720" stroke-width="3"/>
    <circle cx="12" cy="14" r="3" fill="#193844"/>
    <path d="M22 7v20m8-17v14" stroke="#fff" stroke-width="2"/>
    <path d="M14 39q8 11 16 0" fill="none" stroke="#193844" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="690" y="361" font-size="12" font-weight="800" fill="#24465b">GO, BEAK!</text>
  <path d="M652 355l-8-9m22 5 1-12m19 15 9-8" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- footer panel with required readable timestamp -->
  <rect x="0" y="570" width="800" height="30" fill="#26394b"/>
  <text x="400" y="591" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2026-10-25 04:32:10 SGT (UTC+08:00)</text>
</svg>