<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777"/>
      <stop offset="1" stop-color="#444"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="42" fill="#ffd34d"/>
  <path d="M0 340 Q110 285 220 340 T440 340 T660 340 T900 340 V430 H0Z" fill="#9bd18b"/>
  <path d="M0 400 Q180 360 360 405 T800 395 V600 H0Z" fill="url(#road)"/>
  <path d="M0 490 H800" stroke="#f7df74" stroke-width="8" stroke-dasharray="44 28" opacity=".9"/>

  <text x="400" y="58" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="900" fill="#15324b" stroke="#fff" stroke-width="3" paint-order="stroke">
    THE GREAT PELICAN GETAWAY
  </text>
  <text x="400" y="91" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#234">
    “Why walk when you can wobble with style?”
  </text>

  <g id="bike" filter="url(#shadow)">
    <g fill="none" stroke="#202b35" stroke-width="8">
      <circle cx="245" cy="445" r="72" fill="#b9e7ff"/>
      <circle cx="555" cy="445" r="72" fill="#b9e7ff"/>
      <path d="M245 445 L350 350 L430 445 L245 445 L390 445 L350 350 L555 445"/>
      <path d="M350 350 L332 315 M350 350 L385 335"/>
      <path d="M430 445 L450 390"/>
    </g>
    <g stroke="#66818f" stroke-width="4">
      <path d="M245 373 V517 M173 445 H317 M194 394 L296 496 M194 496 L296 394"/>
      <path d="M555 373 V517 M483 445 H627 M504 394 L606 496 M504 496 L606 394"/>
    </g>
    <circle cx="390" cy="445" r="18" fill="#ffcb3d" stroke="#202b35" stroke-width="6"/>
    <path d="M390 445 L360 420 M390 445 L422 468" stroke="#202b35" stroke-width="7" stroke-linecap="round"/>
    <path d="M318 315 Q350 295 385 315" fill="none" stroke="#202b35" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g id="pelican" transform="translate(0 0)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="1.2s" repeatCount="indefinite"/>
    <ellipse cx="393" cy="285" rx="74" ry="91" fill="#f4f0e5" stroke="#28343b" stroke-width="6"/>
    <path d="M350 276 Q312 252 304 215 Q335 194 378 215 Q403 236 390 279Z" fill="#d7e0df" stroke="#28343b" stroke-width="6"/>
    <path d="M316 215 Q274 222 230 244 Q275 278 347 261" fill="#f2a85a" stroke="#28343b" stroke-width="6"/>
    <path d="M230 244 Q273 246 315 239" fill="none" stroke="#c4773c" stroke-width="4"/>
    <circle cx="357" cy="226" r="12" fill="#fff" stroke="#28343b" stroke-width="5"/>
    <circle cx="359" cy="227" r="5" fill="#222"/>
    <path d="M366 340 Q423 365 468 332 Q444 394 380 391 Q348 382 327 350Z" fill="#d2d9d8" stroke="#28343b" stroke-width="6"/>
    <path d="M370 367 L350 408 M430 365 L449 405" stroke="#e28a42" stroke-width="9" stroke-linecap="round"/>
    <path d="M343 410 L321 419 M449 407 L471 416" stroke="#28343b" stroke-width="6" stroke-linecap="round"/>
    <path d="M348 182 Q376 154 409 177" fill="none" stroke="#28343b" stroke-width="7" stroke-linecap="round"/>
    <path d="M377 164 Q401 145 425 166" fill="none" stroke="#28343b" stroke-width="7" stroke-linecap="round"/>
    <path d="M333 291 Q355 305 375 289" fill="none" stroke="#28343b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(555 145)">
    <path d="M0 35 Q22 0 48 35" fill="#fff" opacity=".9"/>
    <path d="M38 35 Q64 4 90 35" fill="#fff" opacity=".9"/>
  </g>

  <g transform="translate(595 260) rotate(8)">
    <path d="M0 0 Q24 -18 44 0" fill="none" stroke="#28343b" stroke-width="5"/>
    <path d="M15 0 Q15 20 0 32 M29 0 Q30 20 45 32" fill="none" stroke="#28343b" stroke-width="5"/>
  </g>

  <text x="400" y="540" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#fff">
    A beak, two wheels, and absolutely no sense of balance.
  </text>
  <rect x="0" y="560" width="800" height="40" fill="#1f2a33"/>
  <text x="400" y="585" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#fff">
    2026-10-28 03:31:42 SGT (UTC+08:00)
  </text>

  <style>
    #bike g:nth-child(1) circle {
      transform-box: fill-box;
      transform-origin: center;
    }
    #bike g:nth-child(1) circle {
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</svg>