  </g>

  <path d="M105 300 q30-25 60 0" fill="none" class="ink"/>
  <path d="M650 270 q30-25 60 0" fill="none" class="ink"/>
  <text x="400" y="555" text-anchor="middle" font-size="18" class="label">Pelican on a bicycle: balancing beak, bird-brain, and bicycle physics.</text>
  <text x="400" y="585" text-anchor="middle" font-size="14" class="label">2026-10-28 03:30:01 SGT (UTC+08:00)</text>
</svg>