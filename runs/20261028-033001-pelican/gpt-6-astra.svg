<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
    <style>
      .ink{stroke:#17202a;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#d7f3ff;stroke:#17202a;stroke-width:7}
      .spoke{stroke:#4b7180;stroke-width:3}
      .label{font-family:Arial,sans-serif;fill:#17202a}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
      @keyframes pedal{0%,100%{transform:rotate(0deg)}50%{transform:rotate(180deg)}}
      .rider{animation:bob 1.2s ease-in-out infinite}
      .crank{transform-origin:430px 430px;animation:pedal 1s linear infinite}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="48" fill="#ffd86b" class="ink"/>
  <path d="M0 430 Q120 390 240 430 T480 430 T800 425 V535 H0Z" fill="#9bd27e"/>
  <path d="M0 500 Q180 470 360 505 T800 495 V550 H0Z" fill="#6ab866"/>
  <path d="M75 470 q18-45 36 0 M95 470 q18-38 36 0 M690 470 q18-45 36 0 M710 470 q18-38 36 0" fill="none" class="ink"/>

  <text x="400" y="58" text-anchor="middle" font-size="34" font-weight="800" class="label">THE GREAT PELICYCLE</text>
  <text x="400" y="91" text-anchor="middle" font-size="19" class="label">One bird. Two wheels. Zero traffic sense.</text>

  <g id="bike">
    <circle cx="220" cy="430" r="82" class="wheel"/>
    <circle cx="585" cy="430" r="82" class="wheel"/>
    <g class="spoke">
      <path d="M220 348V512 M138 430H302 M162 372L278 488 M162 488L278 372"/>
      <path d="M585 348V512 M503 430H667 M527 372L643 488 M527 488L643 372"/>
    </g>
    <path d="M220 430 L350 430 L430 300 L585 430 L430 430 Z" fill="none" class="ink"/>
    <path d="M350 430 L430 300 L470 430" fill="none" class="ink"/>
    <path d="M430 300 L405 270" fill="none" class="ink"/>
    <path d="M390 270 H425" fill="none" class="ink"/>
    <path d="M430 430 L400 470 M430 430 L462 465" fill="none" class="ink"/>
    <circle cx="430" cy="430" r="13" fill="#ff9f43" class="ink"/>
    <g class="crank">
      <path d="M430 430 L390 405 M430 430 L470 455" fill="none" class="ink"/>
      <circle cx="385" cy="402" r="8" fill="#ff9f43" class="ink"/>
      <circle cx="475" cy="458" r="8" fill="#ff9f43" class="ink"/>
    </g>
    <path d="M330 350 H385" fill="none" class="ink"/>
    <path d="M570 350 L600 325" fill="none" class="ink"/>
  </g>

  <g class="rider">
    <ellipse cx="395" cy="255" rx="58" ry="70" fill="#f5f1df" class="ink"/>
    <path d="M350 280 Q300 300 270 340 Q300 355 355 325" fill="#f5f1df" class="ink"/>
    <path d="M435 265 Q500 285 535 330 Q505 345 450 315" fill="#f5f1df" class="ink"/>
    <ellipse cx="410" cy="175" rx="54" ry="48" fill="#f5f1df" class="ink"/>
    <path d="M445 180 Q535 190 575 215 Q535 245 445 220Z" fill="#f19a38" class="ink"/>
    <circle cx="430" cy="165" r="8" fill="#17202a"/>
    <path d="M375 145 Q410 115 450 145" fill="none" class="ink"/>
    <path d="M380 295 L405 360 L430 430" fill="none" class="ink"/>
    <path d="M425 295 L450 360 L470 455" fill="none" class="ink"/>
    <path d="M397 360 L350 390" fill="none" class="ink"/>
    <path d="M448 360 L500 390" fill="none" class="ink"/>
    <path d="M340 390 L315 380 M500 390 L525 380" fill="none" class="ink"/>
    <path d="M385 235 Q410 250 438 235" fill="none" class="ink"/>
