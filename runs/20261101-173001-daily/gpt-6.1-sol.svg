    <text x="331" y="120">7</text>
    <text x="381" y="120">6</text>

    <text x="181" y="170">11</text>
    <text x="231" y="170">12</text>
    <text x="281" y="170">13</text>
    <text x="331" y="170">14</text>
    <text x="381" y="170">15</text>

    <text x="181" y="220">20</text>
    <text x="231" y="220">19</text>
    <text x="281" y="220">18</text>
    <text x="331" y="220">17</text>
