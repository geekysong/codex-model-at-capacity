<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">5×5 Hamiltonian path — 24 moves</title>
  <desc id="desc">A continuous serpentine path visits every cell exactly once, starting at the top-left green circle and ending at the bottom-right red circle. Numbers indicate visit order.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">5×5 grid · 25 cells · 24 moves</text>

  <rect x="175" y="55" width="250" height="250" fill="white" stroke="#64748b" stroke-width="2"/>
  <path d="M225 55V305 M275 55V305 M325 55V305 M375 55V305
           M175 105H425 M175 155H425 M175 205H425 M175 255H425"
        fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <polyline points="200,80 250,80 300,80 350,80 400,80
                    400,130 350,130 300,130 250,130 200,130
                    200,180 250,180 300,180 350,180 400,180
                    400,230 350,230 300,230 250,230 200,230
                    200,280 250,280 300,280 350,280 400,280"
            fill="none" stroke="#2563eb" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">
