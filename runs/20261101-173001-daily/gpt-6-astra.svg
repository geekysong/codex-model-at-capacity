<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">A 25-cell path in 24 moves</title>
  <desc id="desc">A continuous snake path visits every cell of a five-by-five grid exactly once, beginning at the top-left green circle and ending at the bottom-right red circle. Numbers show visit order.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="300" y="30" font-size="23" font-weight="700" fill="#0f172a">25 cells · 24 moves</text>
    <text x="300" y="51" font-size="13" fill="#475569">Visit each cell exactly once using orthogonal moves</text>
  </g>

  <rect x="175" y="65" width="250" height="250" fill="#fff" stroke="#64748b" stroke-width="1.5"/>
  <path d="M225 65V315 M275 65V315 M325 65V315 M375 65V315
           M175 115H425 M175 165H425 M175 215H425 M175 265H425"
        fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <polyline points="200,90 250,90 300,90 350,90 400,90
                    400,140 350,140 300,140 250,140 200,140
                    200,190 250,190 300,190 350,190 400,190
                    400,240 350,240 300,240 250,240 200,240
                    200,290 250,290 300,290 350,290 400,290"
            fill="none" stroke="#2563eb" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="188" y="80">1</text>
    <text x="238" y="80">2</text>
    <text x="288" y="80">3</text>
    <text x="338" y="80">4</text>
    <text x="388" y="80">5</text>
    <text x="388" y="130">6</text>
    <text x="338" y="130">7</text>
    <text x="288" y="130">8</text>
    <text x="238" y="130">9</text>
    <text x="188" y="130">10</text>
    <text x="188" y="180">11</text>
    <text x="238" y="180">12</text>
    <text x="288" y="180">13</text>
    <text x="338" y="180">14</text>
    <text x="388" y="180">15</text>
    <text x="388" y="230">16</text>
    <text x="338" y="230">17</text>
    <text x="288" y="230">18</text>
    <text x="238" y="230">19</text>
    <text x="188" y="230">20</text>
    <text x="188" y="280">21</text>
    <text x="238" y="280">22</text>
    <text x="288" y="280">23</text>
    <text x="338" y="280">24</text>
    <text x="388" y="280">25</text>
  </g>

  <circle cx="200" cy="90" r="6" fill="#16a34a" stroke="#14532d" stroke-width="1.5"/>
  <circle cx="400" cy="290" r="6" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>

  <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
    <circle cx="227" cy="337" r="5" fill="#16a34a"/>
    <text x="239" y="342">Start: 1</text>
    <circle cx="327" cy="337" r="5" fill="#ef4444"/>
    <text x="339" y="342">End: 25</text>
  </g>

  <path d="M30 357H570" stroke="#cbd5e1"/>
  <text x="300" y="382" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#334155">2026-11-01 17:32:33 SGT (UTC+08:00)</text>
</svg>