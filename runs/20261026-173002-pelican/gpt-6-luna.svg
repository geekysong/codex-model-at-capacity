<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pedal-Powered Pelican</title>
  <desc id="desc">A determined pelican rides a bicycle, its enormous beak full of snacks, as a fish cheers from the roadside.</desc>
  <defs>
    <style>
      .ink{stroke:#17324d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#f8fbff;stroke:#17324d;stroke-width:7}
      .spoke{stroke:#87a9bd;stroke-width:2}
      .frame{fill:none;stroke:#e85d3f;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .small{font-family:system-ui,sans-serif}
    </style>
  </defs>

  <rect width="800" height="600" fill="#bdeaf2"/>
  <circle cx="677" cy="105" r="48" fill="#ffd166"/>
  <path d="M0 370 Q115 330 220 366 T440 357 T800 366 V480 H0Z" fill="#8ed08b"/>
  <path d="M0 420 Q160 388 310 421 T610 410 T800 420 V520 H0Z" fill="#69b979"/>
  <path d="M0 475H800" stroke="#f8f0cf" stroke-width="8" stroke-dasharray="34 24"/>
  <path d="M60 279q18-20 36 0m9-13q18-20 36 0M597 273q18-20 36 0" fill="none" class="ink" stroke-width="3"/>

  <text x="400" y="55" text-anchor="middle" class="small" font-size="31" font-weight="900" fill="#17324d">PEDAL-POWERED PELICAN</text>
  <text x="400" y="83" text-anchor="middle" class="small" font-size="16" font-weight="700" fill="#31556c">“When the beak is full, take the scenic route.”</text>

  <!-- Bicycle wheels -->
  <g>
    <g transform="translate(230 410)">
      <circle r="67" class="wheel"/>
      <g class="spinning">
        <path d="M0-61V61M-61 0H61M-43-43L43 43M43-43L-43 43" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
      </g>
      <circle r="7" fill="#e85d3f"/>
    </g>
    <g transform="translate(570 410)">
      <circle r="67" class="wheel"/>
      <g>
        <path d="M0-61V61M-61 0H61M-43-43L43 43M43-43L-43 43" class="spoke"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
      </g>
      <circle r="7" fill="#e85d3f"/>
    </g>
  </g>

  <!-- Bicycle frame and handlebars -->
  <g class="frame">
    <path d="M230 410L352 410L410 300L230 410M352 410L475 410L410 300M475 410L570 410"/>
    <path d="M410 300L398 276M384 276h35M570 410l20-116h24"/>
    <path d="M346 410l-9 15m-14 0h28M475 410l-8 14"/>
  </g>
  <circle cx="352" cy="410" r="11" fill="#ffd166" class="ink"/>
  <path d="M352 410l34-30m-34 30l-26 29" stroke="#17324d" stroke-width="7" stroke-linecap="round"/>
  <g>
    <path d="M399 276h-17m-5 0h-8" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
    <path d="M610 294h18" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Pelican and gentle riding bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="0.7s" repeatCount="indefinite"/>
    <!-- body -->
    <ellipse cx="414" cy="236" rx="76" ry="55" fill="#fffdf6" class="ink"/>
    <path d="M389 232q36-43 70 1-27 35-70-1Z" fill="#d9eef0" stroke="#17324d" stroke-width="4"/>
    <path d="M425 252l-8 49m28-48l13 47" stroke="#e85d3f" stroke-width="7" stroke-linecap="round"/>
    <path d="M411 301l-17 7m64-8l17 6" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <!-- neck and head -->
    <path d="M446 222q25-46 5-82" fill="none" stroke="#fffdf6" stroke-width="27" stroke-linecap="round"/>
    <path d="M446 222q25-46 5-82" fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="445" cy="128" r="33" fill="#fffdf6" class="ink"/>
    <circle cx="456" cy="121" r="4.5" fill="#17324d"/>
    <path d="M429 139q-2 24 18 34 9-8 7-17" fill="#f4a261" class="ink"/>
    <!-- giant beak -->
    <path d="M467 128q98-12 147 19-43 28-132 7Z" fill="#ffd166" class="ink"/>
    <path d="M491 145q56 8 107 2" fill="none" stroke="#e85d3f" stroke-width="4"/>
    <!-- snacks poking out -->
    <path d="M542 136q5-24 19-11l5 15m13-4q9-24 21-8l1 15" fill="#79c56c" class="ink" stroke-width="3"/>
    <circle cx="551" cy="128" r="5" fill="#e85d3f"/>
    <path d="M480 108l-8-11m-8 7l-3-12" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
    <!-- riding cap -->
    <path d="M418 102q24-30 52-5l8 16q-29-12-59 0Z" fill="#e85d3f" class="ink"/>
    <path d="M466 111q18 1 23 8" fill="none" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M372 231q22-30 54-5 13 11 8 27-30 20-62-1Z" fill="#f3f7f2" stroke="#17324d" stroke-width="4"/>
    <path d="M383 238q18 4 34 15m-20-27q17 7 29 21" fill="none" stroke="#8daab4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Pigeon spectator -->
  <g transform="translate(685 354)">
    <ellipse cx="0" cy="0" rx="25" ry="19" fill="#8799a5" class="ink" stroke-width="3"/>
    <circle cx="19" cy="-20" r="14" fill="#9fb0b8" class="ink" stroke-width="3"/>
    <circle cx="23" cy="-22" r="2.8" fill="#17324d"/>
    <path d="M32-20l17 5-16 5" fill="#ffd166" stroke="#17324d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-8 17v15m16-15v15m-20 0h10m6 0h10" stroke="#e85d3f" stroke-width="3" stroke-linecap="round"/>
    <path d="M-17-4q-22-8-26-24 25 3 35 15" fill="#718894" stroke="#17324d" stroke-width="3"/>
  </g>
  <path d="M626 310q16-20 32 0m-22-22q14-15 28 0" fill="none" stroke="#17324d" stroke-width="3"/>
  <text x="688" y="313" text-anchor="middle" class="small" font-size="15" font-weight="800" fill="#17324d">SHOW-OFF!</text>

  <rect x="0" y="520" width="800" height="80" fill="#17324d"/>
  <text x="400" y="555" text-anchor="middle" class="small" font-size="18" font-weight="700" fill="#fffdf6">One beak. Two wheels. Absolutely no car payments.</text>
  <text x="400" y="584" text-anchor="middle" class="small" font-size="16" font-weight="600" fill="#ffd166">2026-10-26 17:33:19 SGT (UTC+08:00)</text>
</svg>