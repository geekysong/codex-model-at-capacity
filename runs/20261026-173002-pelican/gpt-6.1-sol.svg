<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican riding a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle, carrying a fish in its enormous bill. Both wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="sky" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#c9e6e9"/>
    </pattern>
    <style>
      .ink{stroke:#20323d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .small{font-family:Arial,Helvetica,sans-serif;fill:#20323d}
      .spoke{stroke:#647984;stroke-width:3}
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="20" y="88" width="760" height="396" rx="24" fill="#e2f3f1"/>
  <rect x="20" y="88" width="760" height="396" rx="24" fill="url(#sky)"/>
  <text x="400" y="55" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="42" fill="#20323d">TOUR DE FISH</text>
  <text x="400" y="80" text-anchor="middle" class="small" font-size="15" letter-spacing="3">THE COMMUTE HAS A CATCH.</text>

  <g fill="#fff" opacity=".8">
    <path d="M54 172q15-28 35-10q11-32 34-10q28-9 31 20Z"/>
    <path d="M628 135q10-24 29-12q15-28 35-4q23-2 27 16Z"/>
  </g>
  <path d="M21 430Q175 398 320 431T779 420V460H21Z" fill="#b7d8bd"/>
  <rect x="20" y="449" width="760" height="35" fill="#d7c7a6"/>
  <path d="M40 450H760" stroke="#20323d" stroke-width="4"/>
  <ellipse cx="397" cy="453" rx="230" ry="9" fill="#20323d" opacity=".12"/>

  <g class="ink" fill="none">
    <path d="M114 297h66m-82 20h64m-27 20h41" stroke="#75a6a7" stroke-width="4"/>
    <path d="M657 316h45m-33 20h52" stroke="#75a6a7" stroke-width="4"/>
  </g>

  <!-- Rotating wheels -->
  <g transform="translate(254 378)">
    <circle r="70" fill="#fff9e9" stroke="#20323d" stroke-width="10"/>
    <circle r="60" fill="#dcf0ed" stroke="#8b9ea0" stroke-width="2"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-60 0H60M0-60V60M-43-43L43 43M-43 43L43-43"/>
      <path d="M0-66h15" stroke="#ee744b" stroke-width="6"/>
    </g>
    <circle r="9" fill="#20323d"/>
  </g>
  <g transform="translate(552 378)">
    <circle r="70" fill="#fff9e9" stroke="#20323d" stroke-width="10"/>
    <circle r="60" fill="#dcf0ed" stroke="#8b9ea0" stroke-width="2"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <path d="M-60 0H60M0-60V60M-43-43L43 43M-43 43L43-43"/>
      <path d="M0-66h15" stroke="#ee744b" stroke-width="6"/>
    </g>
    <circle r="9" fill="#20323d"/>
  </g>

  <!-- Tiny bicycle, very large passenger -->
  <g class="ink" fill="none">
    <path d="M254 378L328 281L396 378ZM328 281H509L396 378M509 281L552 378" stroke="#d94e4b" stroke-width="9"/>
    <path d="M328 281L316 258M509 281L495 242L521 230" stroke="#20323d" stroke-width="8"/>
    <path d="M292 257H340" stroke-width="12"/>
    <path d="M518 230h20" stroke="#a66e42" stroke-width="10"/>
    <path d="M218 298h59M225 298l-12 33" stroke-width="6"/>
  </g>

  <!-- Far leg -->
  <path d="M368 283L424 323L383 376" fill="none" stroke="#cf8b3c" stroke-width="12" stroke-linecap="round">
    <animate attributeName="d" values="M368 283L424 323L383 376;M368 283L401 342L410 394;M368 283L424 323L383 376" dur=".75s" repeatCount="indefinite"/>
  </path>

  <!-- Bobbing pelican -->
  <g class="ink">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".75s" repeatCount="indefinite"/>
    <path d="M303 243L267 226L284 260L262 263L310 282" fill="#fffdf4"/>
    <path d="M307 214C328 187 378 192 404 218C429 243 414 281 383 295C348 312 302 289 297 259C294 241 298 225 307 214Z" fill="#fffdf4"/>
    <path d="M325 229Q367 220 392 253Q370 281 330 264Q351 258 359 246" fill="#dce5e0"/>
    <path d="M383 225C410 214 397 175 421 152C437 136 461 143 467 164C474 184 455 198 439 202L427 241" fill="#fffdf4"/>
    <path d="M450 180L636 188Q608 254 521 244Q476 235 450 196Z" fill="#f2b04e"/>
    <path d="M456 177L645 185L636 195L454 192Z" fill="#ffcf65"/>
    <path d="M492 207Q527 222 570 217" stroke="#ce8736" stroke-width="3" fill="none"/>
    <!-- The catch -->
    <path d="M548 220Q568 201 589 218L604 209L601 230L587 224Q567 236 548 220Z" fill="#78bbb8" stroke-width="3"/>
    <circle cx="557" cy="219" r="2.5" fill="#20323d" stroke="none"/>
    <path d="M561 225q6 5 12 0" fill="none" stroke-width="2"/>
    <circle cx="448" cy="164" r="13" fill="white" stroke-width="3"/>
    <circle cx="453" cy="164" r="5" fill="#20323d" stroke="none"/>
    <path d="M431 145L455 148" fill="none" stroke-width="4"/>
    <!-- Helmet -->
    <path d="M418 146Q419 111 447 114Q475 117 477 149Z" fill="#df544c"/>
    <path d="M437 119L433 141M452 120L454 141" stroke="#963d39" stroke-width="4"/>
    <path d="M420 147H482" stroke-width="6"/>
    <path d="M420 188Q411 206 410 220" fill="none" stroke="#e35b51" stroke-width="10"/>
    <path d="M415 214L447 236L422 246L447 255L423 264" fill="#e35b51" stroke-width="3"/>
    <!-- Wing reaches the handlebar -->
    <path d="M391 231Q440 263 505 238" fill="none" stroke="#20323d" stroke-width="17"/>
    <path d="M391 231Q440 263 505 238" fill="none" stroke="#fffdf4" stroke-width="11"/>
  </g>

  <!-- Moving near leg and crank -->
  <path d="M365 286L354 338L410 380" fill="none" stroke="#eda846" stroke-width="13" stroke-linecap="round">
    <animate attributeName="d" values="M365 286L354 338L410 380;M365 286L372 322L382 362;M365 286L354 338L410 380" dur=".75s" repeatCount="indefinite"/>
  </path>
  <circle cx="396" cy="378" r="17" fill="#fff9e9" stroke="#20323d" stroke-width="5"/>
  <g transform="translate(396 378)">
    <g stroke="#20323d" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".75s" repeatCount="indefinite"/>
      <path d="M-20 0H20"/>
      <path d="M15-5h14M-29 5h14" stroke-width="7"/>
    </g>
  </g>

  <g>
    <path d="M82 198Q66 198 66 182V120Q66 104 82 104H301Q317 104 317 120V182Q317 198 301 198H277L296 223L249 198Z" fill="#fffdf4" stroke="#20323d" stroke-width="3"/>
    <text x="191" y="133" text-anchor="middle" class="small" font-size="19" font-weight="bold">
      <tspan x="191">“My bill is huge.</tspan>
      <tspan x="191" dy="25">My carbon footprint?</tspan>
      <tspan x="191" dy="25">Two webbed feet.”</tspan>
    </text>
  </g>

  <text x="400" y="519" text-anchor="middle" class="small" font-size="22" font-weight="bold">One pelican. Two wheels. Zero delivery fees.</text>
  <path d="M50 540H750" stroke="#d6cbb4" stroke-width="2"/>
  <text x="400" y="574" text-anchor="middle" class="small" font-size="18">2026-10-26 17:31:57 SGT (UTC+08:00)</text>
</svg>