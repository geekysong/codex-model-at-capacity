<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals to Glory</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding a bicycle while fish fly from its oversized beak.</desc>
  <defs>
    <style>
      .ink { stroke:#172536; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#172536; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .title { font: bold 38px sans-serif; fill:#172536; letter-spacing:1px; }
      .caption { font: italic 18px sans-serif; fill:#172536; }
      .footer { font: 15px monospace; fill:#29445a; }
      .spin { animation: spin 1s linear infinite; transform-origin:center; }
      .bob { animation: bob .55s ease-in-out infinite alternate; }
      .pedal { animation: pedal .55s linear infinite; transform-origin:402px 388px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(-7px) rotate(-1deg); } }
      @keyframes pedal { to { transform:rotate(360deg); } }
    </style>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e7fbff"/>
    </linearGradient>
    <linearGradient id="road" x2="1">
      <stop stop-color="#8794a1"/>
      <stop offset=".5" stop-color="#bac5cc"/>
      <stop offset="1" stop-color="#8794a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="704" cy="90" r="46" fill="#ffd75a" stroke="#172536" stroke-width="5"/>
  <path d="M38 136 Q84 104 130 136 Q177 102 224 136" fill="none" class="thin" opacity=".65"/>
  <path d="M564 150 Q605 117 646 150 Q685 118 730 150" fill="none" class="thin" opacity=".65"/>
  <path d="M0 318 Q125 275 248 316 T500 306 T800 314 V416 H0Z" fill="#77c96d" class="ink"/>
  <path d="M0 404 H800 V510 H0Z" fill="url(#road)" class="ink"/>
  <path d="M0 463 H800" stroke="#f9e46b" stroke-width="9" stroke-dasharray="44 27"/>

  <text x="400" y="57" text-anchor="middle" class="title">PELICAN PEDALS TO GLORY!</text>
  <text x="400" y="83" text-anchor="middle" class="caption">“No license? I have a beak permit.”</text>

  <g aria-label="bicycle">
    <g class="spin">
      <circle cx="260" cy="410" r="72" fill="#eaf7ff" class="ink"/>
      <circle cx="260" cy="410" r="10" fill="#ffcc4d" class="ink"/>
      <path d="M260 338V482 M188 410H332 M209 359L311 461 M311 359L209 461" class="thin"/>
    </g>
    <g class="spin" style="transform-origin:540px 410px">
      <circle cx="540" cy="410" r="72" fill="#eaf7ff" class="ink"/>
      <circle cx="540" cy="410" r="10" fill="#ffcc4d" class="ink"/>
      <path d="M540 338V482 M468 410H612 M489 359L591 461 M591 359L489 461" class="thin"/>
    </g>
    <path d="M260 410 L340 302 L402 410 L540 410 L458 302 Z" fill="none" stroke="#e34f4f" stroke-width="11" stroke-linejoin="round"/>
    <path d="M340 302 L458 302 M458 302 L490 257 M490 257 L535 257" fill="none" class="ink"/>
    <path d="M324 297 L361 297" class="ink"/>
    <path d="M402 410 L380 443 M402 410 L430 381" class="thin"/>
    <g class="pedal">
      <circle cx="402" cy="388" r="18" fill="#ffcc4d" class="ink"/>
      <path d="M402 370 V338 M402 406 V438 M384 338 H420 M384 438 H420" class="thin"/>
    </g>
  </g>

  <g class="bob" aria-label="pelican rider">
    <path d="M335 304 Q297 267 313 205 Q326 151 380 166 Q421 177 408 236 L391 291Z" fill="#f4f5ee" class="ink"/>
    <path d="M348 204 Q370 177 396 198 Q420 223 397 247 Q365 266 340 238Z" fill="#fff" class="thin"/>
    <circle cx="378" cy="211" r="8" fill="#172536"/>
    <circle cx="381" cy="208" r="2.5" fill="white"/>
    <path d="M394 220 Q481 202 539 233 Q482 290 392 267 Q375 247 394 220Z" fill="#ffb84a" class="ink"/>
    <path d="M397 247 Q468 242 516 251 Q467 276 394 267Z" fill="#f28e3c" class="thin"/>
    <path d="M331 286 Q283 302 282 350 Q308 358 336 326" fill="#758aa0" class="ink"/>
    <path d="M368 289 Q420 283 455 333 L426 352 Q391 316 363 322Z" fill="#758aa0" class="ink"/>
    <path d="M319 307 L349 370 L387 370" fill="none" class="ink"/>
    <path d="M374 310 L407 367" fill="none" class="ink"/>
    <path d="M349 370 L380 382 M407 367 L429 381" class="thin"/>
    <path d="M303 174 Q275 157 254 174" fill="none" class="thin"/>
    <path d="M530 230 Q566 207 588 229" fill="none" class="thin"/>
    <ellipse cx="575" cy="224" rx="16" ry="9" fill="#77b8dd" class="thin"/>
    <path d="M590 224 L605 214 L604 234Z" fill="#77b8dd" class="thin"/>
    <text x="295" y="133" font-family="sans-serif" font-size="16" font-weight="bold" fill="#172536">FISH DELIVERY:</text>
    <text x="318" y="151" font-family="sans-serif" font-size="16" font-weight="bold" fill="#172536">EXPRESS-ish</text>
  </g>

  <g transform="translate(60 285) rotate(-10)">
    <path d="M0 0 H124 L112 53 H10Z" fill="#fff8dc" class="ink"/>
    <text x="62" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#d64b42">CITY HALL</text>
    <text x="62" y="43" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#172536">BIKE LANE TAX</text>
  </g>

  <rect y="510" width="800" height="90" fill="#f8f1db" class="ink"/>
  <text x="400" y="543" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#172536">A bird with a bill, a wheel, and absolutely no brakes.</text>
  <text x="400" y="578" text-anchor="middle" class="footer">2026-10-26 17:33:44 SGT (UTC+08:00)</text>
</svg>