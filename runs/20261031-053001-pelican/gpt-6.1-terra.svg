<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A satirical cartoon of a pelican riding a bicycle, with spinning wheels and a bobbing rider.</desc>
  <defs>
    <pattern id="spokes" width="132" height="132" patternUnits="userSpaceOnUse">
      <path d="M66 6v120M6 66h120M24 24l84 84M108 24l-84 84" fill="none" stroke="#f6eedb" stroke-width="3"/>
    </pattern>
    <style>
      .outline { stroke:#263345; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob 1s ease-in-out infinite alternate; }
      .pedal { transform-origin:395px 386px; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f8e9c9"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#fff8e8" stroke="#263345" stroke-width="4"/>
  <text x="400" y="72" text-anchor="middle" font-family="Verdana, sans-serif" font-size="36" font-weight="900" fill="#263345">THE PELICAN EXPRESS</text>
  <text x="400" y="100" text-anchor="middle" font-family="Verdana, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#b5523c">COMMUTING ON A WING AND A PRAYER</text>

  <rect x="43" y="120" width="714" height="330" rx="18" fill="#bfe5e3"/>
  <circle cx="665" cy="174" r="30" fill="#f9d36a"/>
  <path d="M70 353 Q155 315 240 350 T410 344 T585 350 T735 337 V450 H43 V365Z" fill="#90bfa7"/>
  <path d="M43 405 Q220 390 400 404 T757 399 V450 H43Z" fill="#d5b580"/>
  <path d="M56 436 H744" stroke="#8a7057" stroke-width="4" stroke-linecap="round"/>
  <path d="M86 420h45m35 0h28m500 0h35" stroke="#f8e9c9" stroke-width="5" stroke-linecap="round"/>

  <g class="wheel">
    <circle cx="230" cy="376" r="66" fill="#efb85f" stroke="#263345" stroke-width="10"/>
    <circle cx="230" cy="376" r="57" fill="url(#spokes)" stroke="#fff8e8" stroke-width="3"/>
    <circle cx="230" cy="376" r="8" fill="#263345"/>
  </g>
  <g class="wheel">
    <circle cx="555" cy="376" r="66" fill="#efb85f" stroke="#263345" stroke-width="10"/>
    <circle cx="555" cy="376" r="57" fill="url(#spokes)" stroke="#fff8e8" stroke-width="3"/>
    <circle cx="555" cy="376" r="8" fill="#263345"/>
  </g>

  <g fill="none" stroke="#d65d49" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 376 L320 284 L395 386 L230 376 L353 305 L493 305 L395 386"/>
    <path d="M555 376 L493 268"/>
  </g>
  <path d="M493 268 l-13-25 h39" fill="none" class="outline"/>
  <path d="M307 278 h42" fill="none" class="outline" stroke-width="9"/>
  <circle cx="395" cy="386" r="17" fill="#fff8e8" stroke="#263345" stroke-width="5"/>
  <g class="pedal">
    <path d="M395 386 l18 20 M395 386 l-18-20" fill="none" stroke="#263345" stroke-width="5"/>
    <path d="M404 408h23 M363 364h23" stroke="#263345" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g class="rider">
    <path d="M335 258 Q308 280 310 302 Q319 322 347 320 L388 302" fill="none" stroke="#ec9a4c" stroke-width="12" stroke-linecap="round"/>
    <path d="M347 320 Q366 342 381 361 l-9 10" fill="none" stroke="#ec9a4c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M370 371 l-12 1 m12-1 l-7 8" stroke="#263345" stroke-width="4" stroke-linecap="round"/>
    <path d="M298 226 Q278 245 281 273 Q288 306 343 307 Q397 305 412 270 Q421 249 404 228Z" fill="#f8f5e8" class="outline"/>
    <path d="M306 256 Q340 240 377 261 Q365 287 329 282 Q316 280 306 272" fill="#d9e5df" stroke="#263345" stroke-width="4" stroke-linejoin="round"/>
    <path d="M300 261 l-26-12 11 23-17 2 22 13" fill="#f8f5e8" class="outline"/>
    <path d="M386 259 Q418 264 455 249 L480 244" fill="none" stroke="#f8f5e8" stroke-width="17" stroke-linecap="round"/>
    <path d="M386 259 Q418 264 455 249 L480 244" fill="none" stroke="#263345" stroke-width="4" stroke-linecap="round"/>
    <path d="M373 234 Q392 211 388 184 Q383 156 401 145 Q419 133 439 148 Q456 162 451 185 L441 219 Q435 240 414 247Z" fill="#f8f5e8" class="outline"/>
    <path d="M435 180 Q468 179 522 195 Q507 209 441 203Z" fill="#f2aa4e" class="outline"/>
    <path d="M441 203 Q483 209 522 195 Q505 242 459 231 Q445 227 441 203Z" fill="#efc17b" stroke="#263345" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="424" cy="170" r="13" fill="#fff" stroke="#263345" stroke-width="4"/>
    <circle cx="428" cy="172" r="5" fill="#263345"/>
    <path d="M405 151 Q420 142 436 151" fill="none" stroke="#263345" stroke-width="5" stroke-linecap="round"/>
    <path d="M393 146 Q410 121 446 140 L453 149 Q421 145 393 153Z" fill="#d65d49" stroke="#263345" stroke-width="5" stroke-linejoin="round"/>
    <path d="M406 132 l8-12 8 11" fill="#d65d49" stroke="#263345" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <path d="M563 219 Q604 203 642 218 Q660 225 662 245 Q663 265 640 272 L609 275 L593 290 L593 275 Q565 272 557 254 Q550 235 563 219Z" fill="#fff8e8" stroke="#263345" stroke-width="4"/>
  <text x="610" y="241" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#263345">I BRAKE</text>
  <text x="610" y="261" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#263345">FOR FISH!</text>

  <text x="400" y="493" text-anchor="middle" font-family="Verdana, sans-serif" font-size="20" font-weight="bold" fill="#263345">His commute has really taken a tern.</text>
  <path d="M75 515 H725" stroke="#d8c8a9" stroke-width="2"/>
  <text x="400" y="548" text-anchor="middle" font-family="Verdana, sans-serif" font-size="16" fill="#40505b">2026-10-31 05:32:28 SGT (UTC+08:00)</text>
</svg>