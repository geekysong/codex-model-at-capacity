<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican’s Two-Wheel Retirement Plan</title>
  <desc id="description">A determined pelican pedals a bicycle, carrying a tiny briefcase and a sign reading “WILL FISH FOR PARKING.”</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
      .rider { transform-box: fill-box; transform-origin: center; animation: bob .65s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff5d9"/>
  <path d="M0 410 Q130 392 258 408 T520 403 T800 410 V600 H0Z" fill="#d9efd3"/>
  <path d="M0 438 Q180 424 360 438 T800 432" fill="none" stroke="#8dbd8c" stroke-width="4"/>
  <circle cx="690" cy="115" r="48" fill="#ffd15c"/>
  <path d="M685 57v-22m0 160v-22m58-58h22m-174 0h22m113-41 16-16m-114 114 16-16m82 0 16 16m-114-114 16 16" stroke="#f0ad36" stroke-width="5" stroke-linecap="round"/>

  <text x="400" y="58" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="1" fill="#173b44">THE PELICAN’S TWO-WHEEL</text>
  <text x="400" y="94" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="1" fill="#e3613a">RETIREMENT PLAN</text>

  <g fill="#fff" opacity=".9">
    <path d="M88 173c-2-15 14-24 27-17 7-18 35-14 36 5 18-3 25 18 11 27H99c-7-2-11-8-11-15z"/>
    <path d="M548 192c-1-12 12-20 23-14 6-15 29-12 30 4 15-3 21 15 9 23h-53c-6-1-9-6-9-13z"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#255b63" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M235 398 L330 398 L382 300 L290 300 Z"/>
    <path d="M330 398 L420 398 L382 300"/>
    <path d="M382 300 L433 300"/>
    <path d="M286 287 L323 287"/>
    <path d="M420 398 L442 367"/>
  </g>
  <g class="wheel" fill="none" stroke="#173b44" stroke-width="7">
    <circle cx="235" cy="398" r="76"/>
    <circle cx="235" cy="398" r="8" fill="#e3613a" stroke="none"/>
    <path d="M235 322v152m-76-76h152m-130-54 108 108m0-108L181 452"/>
  </g>
  <g class="wheel" fill="none" stroke="#173b44" stroke-width="7">
    <circle cx="470" cy="398" r="76"/>
    <circle cx="470" cy="398" r="8" fill="#e3613a" stroke="none"/>
    <path d="M470 322v152m-76-76h152m-130-54 108 108m0-108L416 452"/>
  </g>
  <circle cx="330" cy="398" r="13" fill="#f5bc40" stroke="#173b44" stroke-width="5"/>
  <path d="M330 398l31 30m-31-30-29-27" stroke="#173b44" stroke-width="7" stroke-linecap="round"/>
  <path d="M272 280h63" stroke="#173b44" stroke-width="11" stroke-linecap="round"/>
  <path d="M425 292l24-10" stroke="#173b44" stroke-width="8" stroke-linecap="round"/>

  <g class="rider">
    <!-- Tail feathers -->
    <path d="M326 270q-39-35-49-11 15 26 49 34" fill="#f8f8ec" stroke="#173b44" stroke-width="5"/>
    <path d="M321 278q-40-12-42 8 24 20 51 11" fill="#e8e8d8" stroke="#173b44" stroke-width="4"/>
    <!-- Body -->
    <ellipse cx="365" cy="256" rx="58" ry="47" fill="#fffdf1" stroke="#173b44" stroke-width="5"/>
    <path d="M342 280q28 21 56 2" fill="none" stroke="#d7d5c5" stroke-width="4"/>
    <!-- Neck -->
    <path d="M390 246q18-40 17-72" fill="none" stroke="#fffdf1" stroke-width="24" stroke-linecap="round"/>
    <path d="M390 246q18-40 17-72" fill="none" stroke="#173b44" stroke-width="5" stroke-linecap="round"/>
    <!-- Head -->
    <ellipse cx="412" cy="161" rx="34" ry="28" fill="#fffdf1" stroke="#173b44" stroke-width="5"/>
    <circle cx="423" cy="155" r="4.8" fill="#173b44"/>
    <path d="M440 168 Q477 161 500 175 Q481 185 442 179Z" fill="#ef9943" stroke="#173b44" stroke-width="4"/>
    <path d="M442 178 Q470 183 493 179 Q475 199 449 190Z" fill="#e76f50" stroke="#173b44" stroke-width="4"/>
    <path d="M452 176q14-2 25 1" stroke="#fff1b3" stroke-width="3" fill="none"/>
    <!-- Helmet -->
    <path d="M385 147q5-33 35-33 27 2 33 32z" fill="#e3613a" stroke="#173b44" stroke-width="5"/>
    <path d="M382 148h75" stroke="#173b44" stroke-width="6" stroke-linecap="round"/>
    <path d="M407 119q15-10 31 1" stroke="#ffb077" stroke-width="4" fill="none"/>
    <!-- Wing steering -->
    <path d="M388 233q25 16 47 50l-11 10q-31-17-51-38" fill="#fffdf1" stroke="#173b44" stroke-width="5" stroke-linejoin="round"/>
    <path d="M431 293l-5-12" stroke="#173b44" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs pedaling -->
    <path d="M352 282q-4 40-24 89l5 22" fill="none" stroke="#ef9943" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M391 279q-4 39-34 73l-26 46" fill="none" stroke="#ef9943" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M331 393l-13 7m15-8 2 12m-4-12 10 5" stroke="#173b44" stroke-width="4" stroke-linecap="round"/>
    <path d="M332 400l-8-4" stroke="#173b44" stroke-width="7" stroke-linecap="round"/>
    <!-- Tiny briefcase -->
    <rect x="314" y="220" width="39" height="30" rx="4" fill="#c98243" stroke="#173b44" stroke-width="4"/>
    <path d="M325 220v-7h16v7m-8 0v30" fill="none" stroke="#173b44" stroke-width="3"/>
  </g>

  <!-- Comedic sign -->
  <g transform="rotate(-4 561 270)">
    <path d="M548 292l-5 71" stroke="#765443" stroke-width="6"/>
    <rect x="500" y="231" width="133" height="67" rx="7" fill="#fffdf1" stroke="#173b44" stroke-width="4"/>
    <text x="566" y="254" text-anchor="middle" font-size="12" font-weight="900" fill="#e3613a">WILL FISH</text>
    <text x="566" y="271" text-anchor="middle" font-size="12" font-weight="900" fill="#173b44">FOR PARKING</text>
    <text x="566" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#173b44">OR PENSION</text>
  </g>

  <!-- Motion marks -->
  <path d="M110 336h42m-55 18h31m514-43h29m-15 18h40" stroke="#e3613a" stroke-width="5" stroke-linecap="round"/>
  <text x="400" y="514" text-anchor="middle" font-size="20" font-weight="700" fill="#173b44">He’s finally found a way to commute without a carpool.</text>
  <text x="400" y="543" text-anchor="middle" font-size="14" font-weight="600" fill="#567276">“I’m just here for the fish-shaped bike lane.”</text>
  <path d="M40 558h720" stroke="#a9c9aa" stroke-width="2"/>
  <text x="400" y="583" text-anchor="middle" font-size="15" font-weight="700" fill="#173b44">2026-10-31 05:32:10 SGT (UTC+08:00)</text>
</svg>