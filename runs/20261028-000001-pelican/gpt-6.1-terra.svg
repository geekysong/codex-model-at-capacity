<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while commuters cheer and a fish complains.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9de7ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#777b86"/>
      <stop offset="1" stop-color="#3f424d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#202936;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,sans-serif;fill:#202936}
      .small{font-size:18px}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff6b0" opacity=".9"/>
  <path d="M0 300 Q120 245 235 285 T470 270 T800 250 V390 H0Z" fill="#8fd18f"/>
  <path d="M0 355 Q160 315 300 350 T560 330 T800 345 V430 H0Z" fill="#5caf73"/>
  <path d="M0 418 H800 V600 H0Z" fill="url(#road)"/>
  <path d="M0 475 H800" stroke="#f8df62" stroke-width="8" stroke-dasharray="42 30"/>
  <path d="M0 530 H800" stroke="#282c35" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="55" y="35" width="690" height="78" rx="20" fill="#fff" stroke="#202936" stroke-width="6"/>
    <text x="400" y="82" text-anchor="middle" class="label" font-size="34" font-weight="900">THE PELICAN PEDAL EXPRESS</text>
    <text x="400" y="103" text-anchor="middle" class="label small" font-weight="700" fill="#d34b3e">“Finally, a commute with a built-in snack pouch.”</text>
  </g>

  <!-- bicycle -->
  <g id="bike" transform="translate(0 2)">
    <g fill="none" class="ink">
      <circle cx="260" cy="450" r="70" fill="#dce9f2"/>
      <circle cx="585" cy="450" r="70" fill="#dce9f2"/>
      <path d="M260 450 L355 350 L470 450 L260 450 L410 450 L355 350 L585 450 L520 350 L470 450"/>
      <path d="M355 350 L333 305"/>
      <path d="M315 305 H350"/>
      <path d="M520 350 L542 305 H575"/>
    </g>
    <g stroke="#8094a3" stroke-width="3">
      <path d="M260 380V520 M190 450H330 M211 401L309 499 M211 499L309 401"/>
      <path d="M585 380V520 M515 450H655 M536 401L634 499 M536 499L634 401"/>
    </g>
    <g fill="#f3b928" class="ink">
      <circle cx="410" cy="450" r="14"/>
      <path d="M410 450 L384 421 L402 408"/>
      <path d="M410 450 L439 477 L457 462"/>
    </g>
    <path d="M540 315 Q565 295 590 315" fill="none" class="ink"/>
  </g>

  <!-- pelican body -->
  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="1.2s" repeatCount="indefinite"/>
    <path d="M350 245 Q385 185 470 205 Q530 220 532 300 L493 370 Q450 397 382 365 Q338 335 350 245Z" fill="#f4f1df" class="ink"/>
    <path d="M380 260 Q427 238 490 260 L470 340 Q420 356 375 330Z" fill="#e4d8ba" class="ink"/>
    <path d="M395 215 Q425 160 485 180 Q518 191 532 223 L505 252 Q455 222 395 245Z" fill="#faf8ec" class="ink"/>
    <path d="M477 201 Q520 168 579 192 L645 220 Q655 227 644 238 L565 260 Q514 260 480 238Z" fill="#f0a83b" class="ink"/>
    <path d="M493 231 Q555 229 624 221 Q580 253 515 249Z" fill="#d77b35"/>
    <circle cx="479" cy="205" r="9" fill="#202936"/>
    <path d="M399 283 Q367 300 350 335 L383 350 Q406 320 426 302Z" fill="#f4f1df" class="ink"/>
    <path d="M462 342 Q490 357 522 339" fill="none" class="ink"/>
    <path d="M407 365 L395 416" class="ink" fill="none"/>
    <path d="M478 367 L496 416" class="ink" fill="none"/>
    <path d="M378 416 Q396 407 412 420 Q395 435 373 428Z" fill="#ef9e32" class="ink"/>
    <path d="M485 417 Q505 408 520 422 Q499 438 482 429Z" fill="#ef9e32" class="ink"/>
    <path d="M431 267 Q452 277 469 266" fill="none" stroke="#202936" stroke-width="4"/>
    <path d="M442 292 Q466 307 488 291" fill="none" stroke="#202936" stroke-width="4"/>
  </g>

  <!-- satirical signs -->
  <g class="label" font-weight="800">
    <rect x="90" y="245" width="160" height="62" rx="10" fill="#fff" class="ink"/>
    <text x="170" y="270" text-anchor="middle" font-size="17">CITY POLICY:</text>
    <text x="170" y="293" text-anchor="middle" font-size="19" fill="#d34b3e">WING IT!</text>
    <path d="M170 307V390" class="ink" fill="none"/>
  </g>
  <g>
    <path d="M675 300 Q710 270 752 300" fill="none" class="ink"/>
    <circle cx="700" cy="305" r="7" fill="#202936"/>
    <circle cx="731" cy="305" r="7" fill="#202936"/>
    <path d="M690 320 Q716 343 743 320" fill="none" class="ink"/>
    <text x="715" y="365" text-anchor="middle" class="label small" font-weight="700">“Go, bird, go!”</text>
  </g>

  <!-- fish heckler -->
  <g transform="translate(95 400)">
    <path d="M0 25 Q45 -8 90 25 Q45 58 0 25Z" fill="#65b8dc" class="ink"/>
    <path d="M90 25 L120 0 V50Z" fill="#65b8dc" class="ink"/>
    <circle cx="24" cy="20" r="5" fill="#202936"/>
    <path d="M38 36 Q52 43 65 34" fill="none" class="ink"/>
    <text x="8" y="82" class="label small" font-weight="700">“That’s my lunch!”</text>
  </g>

  <text x="400" y="560" text-anchor="middle" class="label" font-size="21" font-weight="700">
    2026-10-28 00:03:12 SGT (UTC+08:00)
  </text>
  <text x="400" y="585" text-anchor="middle" class="label" font-size="15" fill="#e9edf2">
    Public transit report: one pelican, zero tickets, maximum beak speed.
  </text>
</svg>