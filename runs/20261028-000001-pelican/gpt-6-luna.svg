<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical cartoon pelican rides a bicycle while taking itself far too seriously.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#17445c" flood-opacity=".28"/>
    </filter>
    <style>
      .ink{stroke:#173b4d;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#173b4d}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="52" fill="#ffe37a" opacity=".9"/>
  <path d="M0 350 Q120 285 245 340 T500 330 T800 345 V470 H0Z" fill="#8fd18d"/>
  <path d="M0 405 Q160 360 330 410 T650 398 T800 420 V470 H0Z" fill="#6fbc78"/>
  <rect y="445" width="800" height="92" fill="#4c5961"/>
  <path d="M0 491 H800" stroke="#f8d86a" stroke-width="8" stroke-dasharray="42 28"/>
  <path d="M0 537 H800" stroke="#26343c" stroke-width="5"/>

  <g filter="url(#shadow)">
    <rect x="48" y="38" width="704" height="78" rx="22" fill="#fff8dc" class="ink"/>
    <text x="400" y="78" text-anchor="middle" class="label" font-size="34" font-weight="900">PELICAN PEDAL PANIC</text>
    <text x="400" y="103" text-anchor="middle" class="label" font-size="16" font-weight="700">“I brake for absolutely no one.”</text>
  </g>

  <g aria-label="pelican riding bicycle">
    <g transform="translate(0 0)">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 4;0 0" dur="1.4s" repeatCount="indefinite"/>
      <ellipse cx="414" cy="330" rx="84" ry="70" fill="#f7f3e8" class="ink"/>
      <path d="M365 322 Q322 280 335 226 Q350 176 402 186 Q430 192 443 222 Q411 239 405 280Z" fill="#d9e8ea" class="ink"/>
      <path d="M344 219 Q319 175 352 145 Q380 119 411 145 Q432 162 420 191" fill="#f7f3e8" class="ink"/>
      <path d="M372 143 Q404 133 430 151 Q447 163 435 179 Q414 195 384 183Z" fill="#f6a74c" class="ink"/>
      <path d="M433 170 Q472 174 523 193 Q541 200 528 214 Q500 226 432 201Z" fill="#f28d3d" class="ink"/>
      <circle cx="399" cy="158" r="8" fill="#173b4d"/>
      <path d="M347 279 Q390 260 438 283" fill="none" stroke="#b7cbd0" stroke-width="12"/>
      <path d="M376 386 Q395 421 385 454" fill="none" class="ink"/>
      <path d="M438 388 Q451 420 473 447" fill="none" class="ink"/>
      <path d="M371 455 h30 M461 448 h29" fill="none" class="ink"/>
      <path d="M372 315 Q320 350 299 382 Q284 404 307 414 Q338 414 385 367Z" fill="#d9e8ea" class="ink"/>
      <path d="M450 301 Q498 327 519 357" fill="none" class="ink"/>
      <path d="M493 292 Q529 270 554 286" fill="none" class="ink"/>
      <path d="M527 286 l27 13" fill="none" class="ink"/>
      <text x="535" y="259" class="label" font-size="17" font-weight="800">HONK!</text>
      <text x="552" y="278" class="label" font-size="13">I’m a cyclist now.</text>
    </g>

    <g>
      <circle cx="295" cy="456" r="64" fill="#d5f5ff" fill-opacity=".25" class="ink"/>
      <circle cx="545" cy="456" r="64" fill="#d5f5ff" fill-opacity=".25" class="ink"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 295 456" to="360 295 456" dur="1.2s" repeatCount="indefinite"/>
        <path d="M295 392 V520 M231 456 H359 M250 411 L340 501 M340 411 L250 501" stroke="#ffffff" stroke-width="3" opacity=".7"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 545 456" to="360 545 456" dur="1.2s" repeatCount="indefinite"/>
        <path d="M545 392 V520 M481 456 H609 M500 411 L590 501 M590 411 L500 501" stroke="#ffffff" stroke-width="3" opacity=".7"/>
      </g>
      <path d="M295 456 L382 370 L462 456 L545 456 L462 456 L420 365 L382 370 Z" fill="none" stroke="#e85d4a" stroke-width="10" stroke-linejoin="round"/>
      <path d="M420 365 L409 333 M399 333 H429" fill="none" class="ink"/>
      <path d="M382 370 L349 350 M349 350 L331 350" fill="none" class="ink"/>
      <circle cx="462" cy="456" r="13" fill="#f2c84b" class="ink"/>
      <path d="M462 456 l-35 -25 M462 456 l34 24" fill="none" class="ink"/>
      <circle cx="427" cy="431" r="8" fill="#f2c84b" class="ink"/>
      <circle cx="496" cy="480" r="8" fill="#f2c84b" class="ink"/>
      <path d="M545 456 L572 423" fill="none" class="ink"/>
      <path d="M572 423 l22 -2" fill="none" class="ink"/>
    </g>
  </g>

  <g>
    <rect x="86" y="395" width="154" height="58" rx="15" fill="#fff8dc" class="ink"/>
    <text x="163" y="420" text-anchor="middle" class="label" font-size="16" font-weight="800">TRAFFIC TIP</text>
    <text x="163" y="441" text-anchor="middle" class="label" font-size="13">Use your beak.</text>
    <path d="M225 449 l25 18 -7 -27" fill="#fff8dc" class="ink"/>
  </g>

  <rect x="20" y="555" width="760" height="32" rx="10" fill="#fff8dc" opacity=".96"/>
  <text x="400" y="577" text-anchor="middle" class="label" font-size="15" font-weight="700">2026-10-28 00:02:02 SGT (UTC+08:00)</text>
</svg>