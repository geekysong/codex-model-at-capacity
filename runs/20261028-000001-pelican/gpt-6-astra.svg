<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican on a Bicycle</title>
  <desc>A satirical cartoon pelican rides a bicycle while proudly ignoring traffic rules.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555"/>
      <stop offset="1" stop-color="#292929"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#20252b;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Arial,Helvetica,sans-serif;fill:#20252b}
      .bold{font-weight:800}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="110" r="52" fill="#ffe36e" opacity=".9"/>
  <path d="M0 350 Q120 290 240 345 T480 335 T800 340 L800 470 L0 470Z" fill="#87c86b"/>
  <path d="M0 405 Q170 360 330 410 T650 400 T800 410 L800 470 L0 470Z" fill="#5caa5a"/>
  <path d="M0 455 H800 V555 H0Z" fill="url(#road)"/>
  <path d="M0 505 H800" stroke="#f8df6a" stroke-width="8" stroke-dasharray="50 34"/>
  <path d="M0 553 H800" stroke="#15191d" stroke-width="7"/>

  <text x="40" y="64" class="label bold" font-size="34">THE DAILY WINGSPAN</text>
  <text x="42" y="98" class="label" font-size="18">BREAKING: LOCAL BIRD DISCOVERS “CYCLE-LOGISTICS”</text>

  <g transform="translate(0,-8)" filter="url(#shadow)">
