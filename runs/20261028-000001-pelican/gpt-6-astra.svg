      <rect x="535" y="170" width="190" height="58" rx="14" fill="#fff" stroke="#20252b" stroke-width="4"/>
      <text x="550" y="194">“I’m not late—</text>
      <text x="550" y="216">I’m aerodynamic!”</text>
