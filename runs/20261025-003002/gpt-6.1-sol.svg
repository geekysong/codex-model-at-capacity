<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="50" y="35">Projectile motion · vₓ = 20 m/s · vᵧ = 15 m/s</text>
    <text x="50" y="60">g = 10 m/s² · no air resistance · total flight time: 3 s</text>
    <text x="50" y="90">Scale: 10 px/m; horizontal trajectory break shown below.</text>
    <text x="50" y="115">Unbroken landing position: x = 700 px (beyond canvas).</text>
  </g>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#374151" stroke-width="2"/>

  <!-- x = 100 + 200t; y = 350 - 150t + 50t².
       After the horizontal break, displayed x is reduced by 200 px. -->
  <g fill="none" stroke="#1967d2" stroke-width="3">
    <path d="M 100 350 Q 265 102.5 430 238.625"/>
    <path d="M 450 315.625 Q 475 331.25 500 350"/>
  </g>

  <g stroke="#1967d2" stroke-width="2">
    <path d="M 426 232 L 434 245 M 432 231 L 440 244"/>
    <path d="M 441 310 L 449 323 M 447 309 L 455 322"/>
  </g>

  <g fill="#1967d2">
    <circle cx="100" cy="350" r="4"/>
    <circle cx="400" cy="237.5" r="4"/>
    <circle cx="500" cy="350" r="4"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="60" y="380">launch: 0 m, 0 m</text>
    <text x="340" y="215">apex: 30 m, 11.25 m</text>
    <text x="410" y="380">landing: 60 m, 0 m</text>
    <text x="455" y="265" font-size="12">Horizontal break</text>
    <text x="455" y="283" font-size="12">33 m → 55 m</text>
  </g>
</svg>