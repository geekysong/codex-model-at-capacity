<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" overflow="visible">
  <title>Projectile motion with horizontal speed 20 m/s and vertical speed 15 m/s</title>
  <desc>Scale: 10 pixels per meter. Flight time: 3 seconds. Apex: 30 meters horizontally, 11.25 meters high. Landing: 60 meters horizontally, at SVG coordinate (700,350), beyond the canvas width.</desc>
  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="50" y="40">Projectile motion — no air resistance</text>
    <text x="50" y="65">Initial velocity: horizontal 20 m/s, vertical 15 m/s</text>
    <text x="50" y="90">Gravity: 10 m/s² · Scale: 10 px/m</text>
    <text x="50" y="115">Total flight time: 3 s</text>
    <text x="50" y="150">Landing lies beyond the 600 px canvas.</text>

    <path d="M50 350 H550" fill="none" stroke="#596273" stroke-width="2"/>
    <path d="M100 350 Q400 125 700 350" fill="none" stroke="#1268bd" stroke-width="3"/>

    <g fill="#1268bd">
      <circle cx="100" cy="350" r="4"/>
      <circle cx="400" cy="237.5" r="4"/>
      <circle cx="700" cy="350" r="4"/>
    </g>

    <text x="60" y="380">launch: 0 m, 0 m</text>
    <text x="330" y="215">apex: 30 m, 11.25 m</text>
    <text x="405" y="380">landing: 60 m, 0 m</text>
  </g>
</svg>