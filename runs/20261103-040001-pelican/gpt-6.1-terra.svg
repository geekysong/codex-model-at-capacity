<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A smug pelican pedals a bicycle along a seaside road, carrying a fish in its enormous bill.</desc>
  <defs>
    <style>
      .ink { stroke:#263348; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .spoke { stroke:#718399; stroke-width:3; }
      .letter { font-family:Arial, Helvetica, sans-serif; fill:#263348; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.8s linear infinite; }
      .rider { animation:bob .9s ease-in-out infinite alternate; }
      .pedal { transform-origin:403px 406px; animation:spin 1.8s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f5edd8"/>
  <rect x="20" y="20" width="760" height="510" rx="24" fill="#cbeef0" stroke="#263348" stroke-width="4"/>
