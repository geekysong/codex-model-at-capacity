<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Cycle</title>
  <desc id="desc">A determined pelican rides a bicycle, carrying a fish and a tiny traffic jam in its enormous beak.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
    .rider { transform-box: fill-box; transform-origin: center; animation: bob .65s ease-in-out infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
  </style>

  <rect width="800" height="600" fill="#dff5f3"/>
  <rect y="430" width="800" height="170" fill="#f6e5bb"/>
  <path d="M0 430 Q140 408 280 430 T560 430 T840 430" fill="none" stroke="#9bc8b5" stroke-width="5"/>
  <circle cx="92" cy="108" r="39" fill="#ffd66b"/>
  <path d="M0 470h800" stroke="#424957" stroke-width="8"/>
  <path d="M0 487h800" stroke="#fff5d9" stroke-width="4" stroke-dasharray="32 24"/>

  <text id="title" x="400" y="54" text-anchor="middle" font-size="34" font-weight="900" fill="#19394a">THE PELICAN CYCLE</text>
  <text x="400" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#42606a">“I’m on a seafood diet: I see a bike, and I pedal.”</text>

  <!-- Bicycle -->
  <g fill="none" stroke="#e05243" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 390 L310 390 L350 307 L286 307 Z"/>
    <path d="M350 307 L422 390 L310 390"/>
    <path d="M422 390 L438 304"/>
    <path d="M420 304h43"/>
    <path d="M286 307h-34"/>
  </g>
  <g class="wheel" fill="none" stroke="#263c4b" stroke-width="5">
    <circle cx="238" cy="390" r="66"/>
    <path d="M238 324v132M172 390h132M191 343l94 94M285 343l-94 94"/>
  </g>
  <g class="wheel" fill="none" stroke="#263c4b" stroke-width="5">
    <circle cx="422" cy="390" r="66"/>
    <path d="M422 324v132M356 390h132M375 343l94 94M469 343l-94 94"/>
  </g>
  <circle cx="310" cy="390" r="11" fill="#f2b544" stroke="#263c4b" stroke-width="4"/>
  <path d="M310 390l25 20m-25-20-20 25" stroke="#263c4b" stroke-width="6" stroke-linecap="round"/>
  <path d="M279 307l-6-19h34" fill="none" stroke="#263c4b" stroke-width="7" stroke-linecap="round"/>

  <!-- Pelican and its absurdly large beak -->
  <g class="rider">
    <path d="M300 300 Q288 263 315 230 Q350 196 387 219 Q415 237 404 273 Q397 298 365 306Z" fill="#fffaf0" stroke="#34434a" stroke-width="5"/>
    <path d="M315 275 Q337 250 367 268 L389 292 Q357 314 327 302Z" fill="#f5a623" stroke="#34434a" stroke-width="4"/>
    <path d="M342 293 Q359 304 377 292 L373 310 Q356 320 340 308Z" fill="#e87958" stroke="#34434a" stroke-width="3"/>
    <path d="M380 238 Q403 222 424 232 Q440 240 432 253 Q420 267 391 258Z" fill="#fffaf0" stroke="#34434a" stroke-width="4"/>
    <circle cx="408" cy="239" r="4.5" fill="#263c4b"/>
    <path d="M431 245 Q479 233 522 252 Q538 260 520 269 Q474 286 428 258Z" fill="#f2a21b" stroke="#34434a" stroke-width="4"/>
    <path d="M432 257 Q476 276 520 267 Q510 299 466 300 Q444 292 432 257Z" fill="#e87958" stroke="#34434a" stroke-width="4"/>
    <!-- Fish passenger -->
    <path d="M477 253 Q490 241 506 251 Q517 258 506 266 Q491 273 477 261 L466 268 L468 252Z" fill="#65b8d0" stroke="#34434a" stroke-width="2"/>
    <circle cx="499" cy="255" r="2" fill="#263c4b"/>
    <path d="M336 303l-12 45m44-43 8 43" stroke="#e05243" stroke-width="7" stroke-linecap="round"/>
    <path d="M324 348l-12 30m52-30 21 30" stroke="#34434a" stroke-width="7" stroke-linecap="round"/>
    <path d="M304 378h24m47 0h24" stroke="#f2a623" stroke-width="8" stroke-linecap="round"/>
    <!-- wing -->
    <path d="M320 251 Q342 225 371 246 Q354 267 328 269Z" fill="#e8e0d1" stroke="#34434a" stroke-width="3"/>
    <path d="M349 258l8 5m-19-9 8 5" stroke="#b6aa97" stroke-width="2"/>
  </g>

  <!-- Expression marks and gag -->
  <path d="M531 224q12-12 24 0m-16-12q12-12 24 0" fill="none" stroke="#e05243" stroke-width="4" stroke-linecap="round"/>
  <path d="M563 282q12 12 0 24m13-28q12 12 0 24" fill="none" stroke="#e05243" stroke-width="4" stroke-linecap="round"/>
  <rect x="572" y="222" width="151" height="61" rx="12" fill="#fffaf0" stroke="#34434a" stroke-width="3"/>
  <path d="M572 252l-16 8 16 7" fill="#fffaf0" stroke="#34434a" stroke-width="3"/>
  <text x="647" y="246" text-anchor="middle" font-size="13" font-weight="800" fill="#34434a">BIKE LANE?</text>
  <text x="647" y="265" text-anchor="middle" font-size="13" font-weight="800" fill="#e05243">I AM THE LANE.</text>

  <path d="M170 350q10-10 20 0m-9-20q10-10 20 0" fill="none" stroke="#6c9a91" stroke-width="4" stroke-linecap="round"/>
  <text x="105" y="320" font-size="14" font-weight="700" fill="#52736e">HONK!</text>

  <!-- Footer with exact visible timestamp -->
  <rect y="520" width="800" height="80" fill="#263c4b"/>
  <text x="400" y="551" text-anchor="middle" font-size="17" font-weight="800" fill="#fffaf0">Pedal-powered. Fish-motivated. Completely unlicensed.</text>
  <text x="400" y="582" text-anchor="middle" font-size="16" font-weight="700" fill="#ffd66b">2026-10-30 12:32:25 SGT (UTC+08:00)</text>
</svg>