<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Daily Commute</title>
  <desc id="desc">A smug pelican rides a bicycle with spinning wheels and bobbing feet.</desc>
  <defs>
    <style>
      .outline { stroke:#263342; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob .7s ease-in-out infinite alternate; }
      .pedals { transform-origin:400px 389px; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedals { animation:none; } }
    </style>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse"/>
  </defs>
  <rect width="800" height="600" fill="#fff9e9"/>
  <rect x="20" y="20" width="760" height="560" rx="24" fill="#dff4f4" stroke="#263342" stroke-width="5"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#263342">THE DAILY COMMUTE</text>
