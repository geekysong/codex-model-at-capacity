<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Pedal Panic</title>
  <desc id="desc">A satirical cartoon of a determined pelican riding an overloaded bicycle.</desc>
  <defs>
    <style>
      .ink{stroke:#172033;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{animation:spin 1.4s linear infinite;transform-box:fill-box;transform-origin:center}
      .bob{animation:bob .72s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      .pedal{animation:pedal .72s linear infinite;transform-box:fill-box;transform-origin:center}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pedal{to{transform:rotate(360deg)}}
      @keyframes bob{to{transform:translateY(-8px) rotate(-1deg)}}
    </style>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#88dcff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 390 Q90 340 180 386 T360 378 T540 384 T800 365 V510 H0Z" fill="#9bd66f"/>
  <path d="M0 465 Q170 440 330 468 T800 452 V510 H0Z" fill="#64b657"/>
  <path d="M0 510H800" stroke="#f6ca50" stroke-width="12" stroke-dasharray="40 24"/>
  <path d="M0 535H800" stroke="#49515d" stroke-width="120"/>
  <path d="M0 474 Q125 448 245 474 T490 475 T800 462" fill="none" stroke="#26303c" stroke-width="7"/>

  <text x="400" y="64" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="39" fill="#172033">PELICAN PEDAL PANIC!</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="18" fill="#31425b">“No traffic jam can stop a bird with a very large bill.”</text>

  <g opacity=".95">
    <path d="M82 172 q25-33 50 0q-25-12-50 0M620 162q23-30 48 0q-24-11-48 0M684 220q17-22 35 0q-18-8-35 0" fill="none" class="ink" stroke-width="3"/>
    <circle cx="123" cy="265" r="45" fill="#fff4bd" class="ink"/>
    <path d="M123 229v72M87 265h72" class="ink" stroke-width="3"/>
    <text x="123" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#172033">NO</text>
    <text x="123" y="292" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">BIRDS?</text>
  </g>

  <g class="wheel">
    <circle cx="260" cy="417" r="82" fill="#dce7ec" class="ink"/>
    <circle cx="260" cy="417" r="70" fill="none" stroke="#637080" stroke-width="4"/>
