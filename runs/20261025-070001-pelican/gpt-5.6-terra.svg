    <text x="48" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#172033">“SHOW-OFF.”</text>
  </g>

  <rect y="548" width="800" height="52" fill="#172033"/>
  <text x="28" y="580" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Civic cycling policy: now featuring beak-powered momentum.</text>
  <text x="772" y="580" text-anchor="end" font-family="Arial,sans-serif" font-size="13" fill="#dbe8f5">2026-10-25 07:02:02 SGT (UTC+08:00)</text>
