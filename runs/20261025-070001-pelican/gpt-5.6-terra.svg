    <circle cx="530" cy="417" r="82" fill="#dce7ec" class="ink"/>
    <circle cx="530" cy="417" r="70" fill="none" stroke="#637080" stroke-width="4"/>
    <g stroke="#637080" stroke-width="3">
      <path d="M530 347v140M460 417h140M480 367l100 100M580 367L480 467"/>
    </g>
    <circle cx="530" cy="417" r="10" fill="#ffcc52" class="ink"/>
  </g>

  <g fill="none" class="ink">
    <path d="M260 417L350 296 430 417H260L395 417 350 296 470 296 530 417"/>
    <path d="M430 417L395 417"/>
    <path d="M470 296l34-35h42"/>
    <path d="M335 296h-38"/>
