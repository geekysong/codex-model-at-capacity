    <path d="M425 209q-18-42 7-68q17 31 7 67" fill="#eef2e8" class="ink"/>
    <path d="M463 210q4-43 34-56q3 36-22 62" fill="#eef2e8" class="ink"/>
    <path d="M407 239q15-12 30 1" fill="none" class="ink" stroke-width="3"/>
    <path d="M413 256q13 8 25-1" fill="none" stroke="#172033" stroke-width="3"/>
