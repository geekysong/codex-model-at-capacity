<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Knight moves from square 6 on a 4 by 4 grid</title>
  <desc id="desc">Squares 4, 12, 13, and 15 are reachable by a knight in one move from square 6.</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <text x="40" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">4 × 4 Knight Move Grid</text>

  <g stroke="#334155" stroke-width="2">
    <rect x="40" y="45" width="65" height="65" fill="#f8fafc"/>
    <rect x="105" y="45" width="65" height="65" fill="#f8fafc"/>
    <rect x="170" y="45" width="65" height="65" fill="#f8fafc"/>
    <rect x="235" y="45" width="65" height="65" fill="#bfdbfe"/>

    <rect x="40" y="110" width="65" height="65" fill="#f8fafc"/>
    <rect x="105" y="110" width="65" height="65" fill="#fde68a"/>
    <rect x="170" y="110" width="65" height="65" fill="#f8fafc"/>
    <rect x="235" y="110" width="65" height="65" fill="#f8fafc"/>

    <rect x="40" y="175" width="65" height="65" fill="#f8fafc"/>
    <rect x="105" y="175" width="65" height="65" fill="#f8fafc"/>
    <rect x="170" y="175" width="65" height="65" fill="#f8fafc"/>
    <rect x="235" y="175" width="65" height="65" fill="#bfdbfe"/>

    <rect x="40" y="240" width="65" height="65" fill="#bfdbfe"/>
    <rect x="105" y="240" width="65" height="65" fill="#f8fafc"/>
    <rect x="170" y="240" width="65" height="65" fill="#bfdbfe"/>
    <rect x="235" y="240" width="65" height="65" fill="#f8fafc"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1f2937">
    <text x="72.5" y="77.5">1</text><text x="137.5" y="77.5">2</text><text x="202.5" y="77.5">3</text><text x="267.5" y="77.5">4</text>
    <text x="72.5" y="142.5">5</text><text x="137.5" y="142.5">6</text><text x="202.5" y="142.5">7</text><text x="267.5" y="142.5">8</text>
    <text x="72.5" y="207.5">9</text><text x="137.5" y="207.5">10</text><text x="202.5" y="207.5">11</text><text x="267.5" y="207.5">12</text>
    <text x="72.5" y="272.5">13</text><text x="137.5" y="272.5">14</text><text x="202.5" y="272.5">15</text><text x="267.5" y="272.5">16</text>
  </g>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="340" y="75" font-size="21" font-weight="bold">Legend</text>
    <rect x="340" y="95" width="22" height="22" fill="#fde68a" stroke="#334155" stroke-width="2"/>
    <text x="375" y="112" font-size="16">Starting square: 6</text>
    <rect x="340" y="135" width="22" height="22" fill="#bfdbfe" stroke="#334155" stroke-width="2"/>
