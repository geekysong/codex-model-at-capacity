  <line x1="40" y1="335" x2="560" y2="335" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#475569">2026-10-26 08:33:46 SGT (UTC+08:00)</text>
