<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" overflow="visible">
  <title>Projectile motion at 10 pixels per meter</title>
  <desc>The projectile travels 60 meters in 3 seconds, reaching an apex of 11.25 meters at 30 meters. At the requested scale, the landing point is at x=700, beyond the 600-pixel canvas; overflow is visible to preserve the specified scale.</desc>
  <style>
    text { font-family: Arial, sans-serif; font-size: 14px; fill: #172033; }
  </style>

  <text x="50" y="30">Projectile motion — no air resistance</text>
  <text x="50" y="54">Initial velocity: horizontal 20 m/s; vertical 15 m/s</text>
  <text x="50" y="78">Gravity: 10 m/s² · Scale: 10 px/m</text>
  <text x="50" y="102">Total flight time: 3 s</text>
  <text x="50" y="132">At this scale, landing extends beyond the canvas to x=700.</text>

  <line x1="50" y1="350" x2="550" y2="350" stroke="#485366" stroke-width="2"/>

  <path d="M 100 350 Q 400 125 700 350" fill="none" stroke="#176bc0" stroke-width="3"/>

  <circle cx="100" cy="350" r="4" fill="#172033"/>
  <circle cx="400" cy="237.5" r="4" fill="#176bc0"/>
  <circle cx="700" cy="350" r="4" fill="#176bc0"/>

  <text x="60" y="322">launch: 0 m, 0 m</text>
  <text x="330" y="218">apex: 30 m, 11.25 m</text>
  <text x="405" y="300">landing: 60 m, 0 m</text>
  <path d="M 520 307 L 690 346" fill="none" stroke="#697586" stroke-width="1" stroke-dasharray="4 4"/>

  <rect x="0" y="368" width="600" height="32" fill="#f0f3f7"/>
  <text x="300" y="389" text-anchor="middle">2026-10-25 04:02:38 SGT (UTC+08:00)</text>
</svg>