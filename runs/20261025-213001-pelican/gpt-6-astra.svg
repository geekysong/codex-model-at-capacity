<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A determined pelican pedals a bicycle with a huge fish-filled beak while its wheels spin. A sign declares a no-fly zone. Caption: Why fly free when you can finance a bicycle?</desc>
  <defs>
    <pattern id="skyDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e5ddc5"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { stroke: #203039; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #63797b; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e6"/>
  <rect x="16" y="16" width="768" height="568" rx="22" fill="none" stroke="#203039" stroke-width="4"/>
  <path d="M35 119H765" stroke="#203039" stroke-width="3"/>
  <text x="400" y="70" text-anchor="middle" font-size="49" font-weight="900" letter-spacing="3" fill="#203039">TOUR DE BEAK</text>
  <text x="400" y="102" text-anchor="middle" font-size="17" font-weight="bold" letter-spacing="2" fill="#b54531">BIG BILL. ZERO HORSEPOWER.</text>

  <rect x="35" y="131" width="730" height="348" rx="14" fill="#d8eeeb"/>
  <rect x="35" y="131" width="730" height="348" rx="14" fill="url(#skyDots)" opacity=".45"/>
  <path d="M36 377Q133 337 238 376T446 366T765 371V479H35Z" fill="#b5cdb4"/>
  <path d="M35 443Q390 422 765 443V479H35Z" fill="#d8c9a8"/>
  <path d="M55 459H745" stroke="#a19377" stroke-width="3" stroke-dasharray="33 22"/>
  <ellipse cx="397" cy="449" rx="225" ry="13" fill="#203039" opacity=".13"/>

  <g class="ink">
    <path d="M108 303V430" fill="none" stroke="#776f60"/>
    <rect x="55" y="224" width="116" height="79" rx="8" fill="#fff8e6"/>
    <path d="M88 246l17 9 20-9" fill="none" stroke-width="3"/>
    <path d="M82 237l46 29" stroke="#c94b36" stroke-width="4"/>
  </g>
  <text x="113" y="287" text-anchor="middle" font-size="15" font-weight="900" fill="#203039">NO FLY ZONE</text>

  <g fill="none" stroke="#fff8e6" stroke-width="9" stroke-linecap="round" opacity=".85">
    <path d="M193 165h70m-51 17h76"/>
    <path d="M594 188h87m-48 17h62"/>
  </g>

  <!-- Stationary tires, rotating spokes. -->
  <g>
    <circle cx="253" cy="379" r="65" fill="#f6f3df" fill-opacity=".65" class="ink" stroke-width="10"/>
    <g transform="translate(253 379)">
      <g class="spoke">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-60 0H60M0-60V60M-43-43L43 43M-43 43L43-43"/>
        <path d="M0-59A59 59 0 0 1 42-42" fill="none" stroke="#fff8e6" stroke-width="5"/>
        <rect x="29" y="27" width="13" height="7" rx="2" fill="#f4b83f" stroke="none"/>
      </g>
    </g>
    <circle cx="553" cy="379" r="65" fill="#f6f3df" fill-opacity=".65" class="ink" stroke-width="10"/>
    <g transform="translate(553 379)">
      <g class="spoke">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
        <path d="M-60 0H60M0-60V60M-43-43L43 43M-43 43L43-43"/>
        <path d="M0-59A59 59 0 0 1 42-42" fill="none" stroke="#fff8e6" stroke-width="5"/>
        <rect x="29" y="27" width="13" height="7" rx="2" fill="#f4b83f" stroke="none"/>
      </g>
    </g>
  </g>

  <!-- Bicycle frame. -->
  <g class="ink" fill="none">
    <path d="M253 379L317 283L369 379ZM317 283H505L369 379M505 283L553 379" stroke="#203039" stroke-width="12"/>
    <path d="M253 379L317 283L369 379ZM317 283H505L369 379M505 283L553 379" stroke="#e35b43" stroke-width="6"/>
    <path d="M317 283L309 264M505 283L493 249L515 230H534" stroke-width="7"/>
    <path d="M288 264H329" stroke-width="11"/>
    <path d="M253 379L369 391L387 377L367 365Z" stroke-width="2"/>
  </g>
  <g fill="#203039">
    <circle cx="253" cy="379" r="7"/>
    <circle cx="553" cy="379" r="7"/>
    <circle cx="369" cy="379" r="13"/>
  </g>

  <!-- The rider bobs gently while the lettering stays still. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".8s" repeatCount="indefinite"/>
    <g class="ink">
      <path d="M323 263L299 303L348 345" fill="none" stroke="#d39232" stroke-width="10"/>
      <path d="M337 340l26 10-27 7" fill="#f2b83f" stroke-width="3"/>

      <path d="M277 220L235 205L251 239L225 232L254 260L295 267" fill="#fdfcf0"/>
      <path d="M274 211Q314 181 361 215Q380 198 385 169Q391 144 417 150Q442 158 433 190L419 223Q414 271 365 285Q309 302 271 265Q256 243 274 211Z" fill="#fffdf1"/>
      <path d="M280 245Q321 268 356 242Q342 282 300 269" fill="#c8d9d5" stroke-width="3"/>
      <path d="M301 227Q337 218 366 242L416 270L487 242" fill="none" stroke="#203039" stroke-width="16"/>
      <path d="M301 227Q337 218 366 242L416 270L487 242" fill="none" stroke="#fffdf1" stroke-width="10"/>
      <path d="M480 239l18-6m-15 11 17-3" fill="none" stroke-width="3"/>

      <path d="M429 181L611 204Q597 260 530 260Q467 259 429 198Z" fill="#f7ba49"/>
      <path d="M435 185L618 195L611 207L431 198Z" fill="#ee9140" stroke-width="4"/>
      <path d="M451 211Q491 241 548 242" fill="none" stroke="#cf8c32" stroke-width="3"/>

      <path d="M492 224q22-23 50-2l17-11-3 24-16-7q-28 14-48-4Z" fill="#7da7a4" stroke-width="3"/>
      <circle cx="504" cy="220" r="2.5" fill="#203039" stroke="none"/>

      <ellipse cx="423" cy="174" rx="11" ry="15" fill="white" stroke-width="3"/>
      <circle cx="427" cy="175" r="4" fill="#203039" stroke="none"/>
      <path d="M411 157l21 5" fill="none" stroke-width="4"/>
      <path d="M384 154Q385 130 410 132Q434 131 441 152Z" fill="#e85a42" stroke-width="4"/>
      <path d="M402 135l-3 13m16-13 2 13m14-8 4 9" fill="none" stroke-width="3"/>
      <path d="M386 154l-5 34 23 9" fill="none" stroke-width="3"/>
      <path d="M443 158q13-15 19-9q3 7-19 9" fill="#71bdcf" stroke-width="2"/>

      <g>
        <animateTransform attributeName="transform" type="rotate" values="-5 350 275;7 350 275;-5 350 275" dur="1.6s" repeatCount="indefinite"/>
        <path d="M350 278L387 311L374 357" fill="none" stroke="#f4b33e" stroke-width="11"/>
        <path d="M373 350l25 17-35 2Z" fill="#f4b33e" stroke-width="3"/>
      </g>
    </g>
  </g>

  <g transform="translate(369 379)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-23 0H23" stroke="#203039" stroke-width="6"/>
      <path d="M-23-8V8M23-8V8" stroke="#203039" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="rotate(-8 665 342)">
    <rect x="620" y="305" width="91" height="69" rx="8" fill="#fff8e6" stroke="#203039" stroke-width="3"/>
    <text x="665" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#203039">POWERED BY</text>
    <text x="665" y="354" text-anchor="middle" font-size="21" font-weight="900" fill="#bd4834">SARDINES</text>
  </g>
  <path d="M181 329h-26m32 17h-42m29 18h-17" fill="none" stroke="#63797b" stroke-width="3" stroke-linecap="round"/>

  <text x="400" y="511" text-anchor="middle" font-size="23" font-weight="bold" fill="#203039">Why fly free when you can finance a bicycle?</text>
  <path d="M54 535H746" stroke="#203039" stroke-width="2"/>
  <text x="400" y="563" text-anchor="middle" font-size="17" fill="#203039">2026-10-25 21:30:01 SGT (UTC+08:00)</text>
</svg>