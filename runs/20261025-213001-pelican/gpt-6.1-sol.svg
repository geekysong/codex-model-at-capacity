<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with spinning wheels, carrying a fish in its enormous bill pouch. A sign advertises the no-fly lane.</desc>
  <defs>
    <pattern id="spokes" width="140" height="140" patternUnits="userSpaceOnUse">
      <path d="M70 0V140M0 70H140M20 20L120 120M20 120L120 20" fill="none" stroke="#729499" stroke-width="3"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; }
      .outline { stroke:#183b43; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { animation:spin 1.3s linear infinite; transform-box:fill-box; transform-origin:center; }
      .bird { animation:bob .65s ease-in-out infinite; }
      .pedals { animation:spin 1.3s linear infinite; transform-origin:395px 380px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6dc"/>
  <path d="M0 335Q130 280 265 332T530 322T800 314V472H0Z" fill="#d7e9ce"/>
  <circle cx="690" cy="145" r="42" fill="#ffcf66"/>
  <g fill="#fffdf2">
    <path d="M72 168c-18-26 19-46 34-25 13-32 55-22 53 5 28-6 38 20 24 28H72Z"/>
    <path d="M563 113c-12-19 13-35 26-19 11-23 41-16 41 5 25-3 28 17 19 22h-86Z"/>
  </g>

  <text x="400" y="65" text-anchor="middle" fill="#183b43" font-size="48" font-weight="900" letter-spacing="2">TOUR DE BEAK</text>
  <text x="400" y="98" text-anchor="middle" fill="#49666a" font-size="19">One bird. Two wheels. Absolutely no aerodynamics.</text>

  <g class="outline">
    <path d="M681 309V439" fill="none" stroke="#678379" stroke-width="8"/>
    <path d="M612 262H738V315H612L592 289Z" fill="#fffdf2"/>
  </g>
  <text x="671" y="284" text-anchor="middle" fill="#183b43" font-size="17" font-weight="bold">NO-FLY</text>
  <text x="671" y="304" text-anchor="middle" fill="#183b43" font-size="17" font-weight="bold">LANE</text>

  <path d="M0 445H800V480H0Z" fill="#c7b99a"/>
  <path d="M0 446H800" stroke="#8fa383" stroke-width="5"/>
  <path d="M37 465H135M622 465H720" stroke="#fff6dc" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="395" cy="451" rx="224" ry="13" fill="#183b43" opacity=".13"/>

  <g class="outline">
    <g>
      <circle cx="255" cy="381" r="69" fill="#fffdf2" stroke-width="9"/>
      <g class="wheel">
        <circle cx="255" cy="381" r="62" fill="none" stroke="none"/>
        <path d="M255 319V443M193 381H317M211 337L299 425M211 425L299 337" fill="none" stroke="#7a999b" stroke-width="3"/>
        <circle cx="255" cy="329" r="5" fill="#ffc44c" stroke="none"/>
