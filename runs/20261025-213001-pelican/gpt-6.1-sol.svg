        <circle cx="535" cy="329" r="5" fill="#ffc44c" stroke="none"/>
      </g>
      <circle cx="535" cy="381" r="8" fill="#183b43"/>
    </g>

    <path d="M255 381L325 302L395 380L255 381M325 302H493L395 380M493 302L535 381M395 380L320 287" fill="none" stroke="#e26649" stroke-width="9"/>
