  <g fill="none" stroke="#77928b" stroke-width="4" stroke-linecap="round">
    <path d="M174 326H205M153 343H194M163 360H188"/>
  </g>

  <path d="M481 120H641Q654 120 654 133V158Q654 171 641 171H497L467 186L478 163Q470 156 470 145V133Q470 120 481 120Z" fill="white" stroke="#183b43" stroke-width="3"/>
  <text x="562" y="143" text-anchor="middle" fill="#183b43" font-size="17" font-weight="bold">“My bill includes</text>
  <text x="562" y="163" text-anchor="middle" fill="#183b43" font-size="17" font-weight="bold">free parking.”</text>

  <text x="400" y="516" text-anchor="middle" fill="#183b43" font-size="23" font-weight="bold">He traded frequent flyer miles for frequent tire bills.</text>
