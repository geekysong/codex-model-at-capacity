<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Cycle of the Beak</title>
  <desc id="desc">A smug pelican rides a bicycle, pedaling furiously while its enormous beak catches the breeze.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .wheel { fill: none; stroke: #26384a; stroke-width: 9; }
      .spoke { stroke: #78909c; stroke-width: 2; }
      .frame { fill: none; stroke: #ed6548; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .detail { fill: none; stroke: #26384a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .ink { stroke: #26384a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 2.2s linear infinite; }
      .ride { transform-box: fill-box; transform-origin: center; animation: bob .55s ease-in-out infinite alternate; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-4px) rotate(-1deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="#f6efd9"/>
  <path d="M0 434 Q140 415 270 434 T540 430 T800 432 V600 H0Z" fill="#d9ebd3"/>
  <path d="M0 458 H800" stroke="#96b99c" stroke-width="3" stroke-dasharray="12 12"/>

  <text x="400" y="56" text-anchor="middle" font-size="34" font-weight="900" letter-spacing="1.5" fill="#26384a">CYCLE OF THE BEAK</text>
  <text x="400" y="84" text-anchor="middle" font-size="16" font-weight="700" fill="#596d78">He’s going places. Mostly because the bike is.</text>

