<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Express</title>
  <desc id="desc">A smug pelican pedals a bicycle, insisting it is a sustainable fish delivery service.</desc>
  <defs>
    <style>
      .ink{stroke:#17324d;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .wheel{fill:#f8f1df;stroke:#17324d;stroke-width:7}
      .spoke{stroke:#78909d;stroke-width:2}
      .frame{fill:none;stroke:#e6533e;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
      .type{font-family:Arial,Helvetica,sans-serif;fill:#17324d}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes ride{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .rotor{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}
      .rider{transform-box:fill-box;transform-origin:center;animation:ride .6s ease-in-out infinite}
    </style>
  </defs>

  <rect width="800" height="600" fill="#bde9e4"/>
  <path d="M0 358 Q125 330 245 358 T490 352 T800 354 V522 H0Z" fill="#7ec6a4"/>
  <circle cx="694" cy="112" r="47" fill="#ffd36e"/>
  <path d="M65 119q19-20 39 0 18-18 35 0M574 170q16-17 32 0 17-17 34 0" fill="none" stroke="#fff8e8" stroke-width="8" stroke-linecap="round"/>

  <text id="title" x="400" y="57" text-anchor="middle" class="type" font-size="34" font-weight="900" letter-spacing="1">THE PELICAN EXPRESS</text>
  <text x="400" y="88" text-anchor="middle" class="type" font-size="17" font-weight="700">“Zero emissions. One very suspicious fish smell.”</text>

  <!-- Bicycle -->
  <g aria-label="Bicycle">
    <g class="rotor">
      <circle class="wheel" cx="214" cy="410" r="79"/>
      <path class="spoke" d="M214 331V489M135 410H293M158 354L270 466M270 354L158 466"/>
    </g>
    <g class="rotor">
      <circle class="wheel" cx="574" cy="410" r="79"/>
      <path class="spoke" d="M574 331V489M495 410H653M518 354L630 466M630 354L518 466"/>
    </g>
    <path class="frame" d="M214 410L338 410L294 319L214 410M338 410L407 320L294 319M407 320L574 410M338 410L365 437"/>
    <path d="M282 312h40M397 312h40M407 320l12-23" class="ink" fill="none"/>
    <path d="M355 436l10 5m-10-5l-5 10m5-10l-4-10m4 10l10-2" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="338" cy="410" r="8" fill="#ffd36e" stroke="#17324d" stroke-width="4"/>
    <path d="M197 403h34M557 403h34" stroke="#17324d" stroke-width="5" stroke-linecap="round"/>
    <path d="M160 321h50" stroke="#17324d" stroke-width="7" stroke-linecap="round"/>
    <path d="M574 331v-24h24" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Bouncing rider and fish delivery basket -->
  <g class="rider">
    <path d="M303 208q-13-31 6-57 18-24 52-18 37 6 42 44l-9 65-74-3z" fill="#f4b84e" class="ink"/>
    <path d="M313 189q-2-26 25-41 25-14 49 4l17 23-6 43q-18 23-50 19-31-4-38-27z" fill="#fff5df" class="ink"/>
    <path d="M379 200q39-26 81-5 25 13 49 8l-9 27q-38 18-72 4l-38 18z" fill="#f2aa42" class="ink"/>
    <path d="M493 203q17-15 30-5 12 10 0 21-13 10-32 11" fill="#ef8b2c" class="ink"/>
    <path d="M402 196q35-19 76-3" fill="none" stroke="#d9822b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="353" cy="180" r="6" fill="#17324d"/>
    <path d="M346 164q15-13 31 1" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
    <path d="M326 236l35 24 37-15M326 236l-30 54 42 29M394 245l-22 61 33 22" fill="none" stroke="#17324d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M339 319l-22-8m88 20l15-9" fill="none" stroke="#17324d" stroke-width="8" stroke-linecap="round"/>
    <path d="M298 286l-18 5m159 32l12 9" fill="none" stroke="#17324d" stroke-width="6" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M310 158q6-35 38-39 34-3 47 27z" fill="#4a89a9" class="ink"/>
    <path d="M307 158h91" stroke="#17324d" stroke-width="7" stroke-linecap="round"/>
    <!-- basket -->
    <path d="M462 290h96l-13 48h-70z" fill="#d98945" class="ink"/>
    <path d="M472 300h75M479 316h65M489 291l5 45m25-45v45m25-45l-6 45" fill="none" stroke="#96572e" stroke-width="3"/>
    <path d="M481 283q12-18 26 0 14-20 29-1 11-13 22 0" fill="none" stroke="#17324d" stroke-width="4" stroke-linecap="round"/>
    <path d="M492 278q16-22 33 0-17 20-33 0z" fill="#e85c50" stroke="#17324d" stroke-width="3"/>
    <circle cx="518" cy="277" r="2.5" fill="#17324d"/>
  </g>

  <!-- Comedic motion marks and sign -->
  <path d="M251 205l-20-14m17 30l-23-4M550 249l20-12m-16 29l24 2" fill="none" stroke="#e6533e" stroke-width="5" stroke-linecap="round"/>
  <path d="M94 270h139v60H94z" fill="#fff5df" stroke="#17324d" stroke-width="4" rx="10"/>
  <text x="163" y="294" text-anchor="middle" class="type" font-size="14" font-weight="900">FISH DELIVERY</text>
  <text x="163" y="315" text-anchor="middle" class="type" font-size="12" font-weight="700">“Please allow beak time.”</text>
  <path d="M229 300l42 7" stroke="#17324d" stroke-width="3" stroke-dasharray="5 6"/>

  <path d="M0 522H800" stroke="#17324d" stroke-width="5"/>
  <text x="400" y="553" text-anchor="middle" class="type" font-size="15" font-weight="700">He’s pedaling for the planet—and for the sardines in his front basket.</text>
  <text x="400" y="582" text-anchor="middle" class="type" font-size="14" font-weight="700">2026-10-30 15:33:34 SGT (UTC+08:00)</text>
</svg>