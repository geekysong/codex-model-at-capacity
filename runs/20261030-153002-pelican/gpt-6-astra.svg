<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Pelican Pedal Express</title>
  <desc id="description">A smug pelican pedals a bicycle with a huge fish-filled beak, passing a sign that says No free rides. The wheels spin and the bird bobs in a looping animation.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 0H10" stroke="#fff"/>
    </pattern>
    <style>
      text { font-family: "Trebuchet MS", Arial, sans-serif; fill: #183747; }
      .outline { stroke: #183747; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #52747d; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff6dd"/>
  <path d="M0 330Q160 280 320 330T800 315V475H0Z" fill="#c8e6df"/>
  <circle cx="690" cy="150" r="45" fill="#ffc958"/>
  <path d="M58 174q18-18 36 0q18-18 36 0M620 244q14-14 28 0q14-14 28 0" fill="none" stroke="#75aaa8" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="54" text-anchor="middle" font-size="36" font-weight="900">THE PELICAN PEDAL EXPRESS</text>
  <text x="400" y="84" text-anchor="middle" font-size="17" letter-spacing="2">LESS GAS. MORE BASS.</text>

  <!-- A single seaside cycle lane -->
  <path d="M0 430Q400 413 800 430V490H0Z" fill="#e0cba5"/>
  <path d="M20 465H130M180 465H290M340 465H450M500 465H610M660 465H770" stroke="#fff6dd" stroke-width="5"/>
  <ellipse cx="404" cy="439" rx="227" ry="13" fill="#183747" opacity=".12"/>

  <g class="outline">
    <path d="M111 310V424" fill="none" stroke="#7f8779"/>
    <rect x="52" y="236" width="118" height="80" rx="8" fill="#fffdf0"/>
  </g>
  <text x="111" y="262" text-anchor="middle" font-size="17" font-weight="bold">NO FREE</text>
  <text x="111" y="284" text-anchor="middle" font-size="17" font-weight="bold">RIDES</text>
  <text x="111" y="303" text-anchor="middle" font-size="11">(fish included)</text>

  <!-- Rotating wheels, centered on fixed axles -->
  <g transform="translate(270 370)">
    <circle r="68" fill="#fffbed" stroke="#183747" stroke-width="9"/>
    <circle r="59" fill="none" stroke="#89aaa7" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41M-54-22L54 22M-22-54L22 54M-54 22L54-22M-22 54L22-54"/>
      <path d="M-10-59H10" stroke="#ed7852" stroke-width="6"/>
    </g>
    <circle r="8" fill="#183747"/>
  </g>
  <g transform="translate(539 370)">
    <circle r="68" fill="#fffbed" stroke="#183747" stroke-width="9"/>
    <circle r="59" fill="none" stroke="#89aaa7" stroke-width="3"/>
    <g class="spoke">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41M-54-22L54 22M-22-54L22 54M-54 22L54-22M-22 54L22-54"/>
      <path d="M-10-59H10" stroke="#ed7852" stroke-width="6"/>
    </g>
    <circle r="8" fill="#183747"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M270 370L332 281L393 370ZM332 281H493L393 370M493 281L539 370" stroke="#183747" stroke-width="12"/>
    <path d="M270 370L332 281L393 370ZM332 281H493L393 370M493 281L539 370" stroke="#ed7852" stroke-width="7"/>
    <path d="M332 281L324 260M493 281L483 245L510 237" stroke="#183747" stroke-width="7"/>
    <path d="M303 259H344" stroke="#183747" stroke-width="12"/>
    <path d="M506 237H526" stroke="#366b73" stroke-width="10"/>
    <path d="M270 370L393 382L406 365" stroke="#183747" stroke-width="3"/>
  </g>
  <circle cx="393" cy="370" r="18" fill="#fff6dd" class="outline"/>

  <!-- The rider bobs while the signs and captions remain still -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".8s" repeatCount="indefinite"/>
    <!-- Rear leg -->
    <path d="M363 259L350 305L377 348" fill="none" stroke="#bd7b32" stroke-width="11" stroke-linecap="round"/>
    <!-- Tail, body and long neck -->
    <path d="M320 235L281 216L296 246L274 245L307 268" fill="#fdfcf5" class="outline"/>
    <path d="M310 217C328 191 383 196 406 218C422 207 419 182 424 160C430 133 463 130 478 149C492 167 478 191 463 202C450 219 458 248 434 269C409 291 334 284 309 260C296 247 296 230 310 217Z" fill="#fffef4" class="outline"/>
    <path d="M323 224Q370 207 402 246Q367 274 327 244" fill="#d5e7e4" class="outline"/>
    <path d="M334 231L367 241M343 245L370 249" fill="none" stroke="#91b5b4" stroke-width="3" stroke-linecap="round"/>
    <!-- Wing reaching the handlebar -->
    <path d="M397 223Q439 240 501 236" fill="none" stroke="#183747" stroke-width="17" stroke-linecap="round"/>
    <path d="M397 222Q441 235 499 235" fill="none" stroke="#fffef4" stroke-width="10" stroke-linecap="round"/>
    <!-- Enormous loaded pouch -->
    <path d="M472 181L641 191Q607 261 514 233Q483 221 472 181Z" fill="#f6b74f" class="outline"/>
    <path d="M478 178L651 188L641 198L477 193Z" fill="#ffd875" class="outline"/>
    <!-- Fish stowaway -->
    <path d="M540 211Q562 190 589 211L605 201L602 224L587 216Q560 235 540 211Z" fill="#61aaa8" stroke="#183747" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="550" cy="209" r="3" fill="#183747"/>
    <path d="M563 204Q571 211 563 220" fill="none" stroke="#183747" stroke-width="2"/>
    <!-- Smug eye, brow and tiny helmet -->
    <circle cx="459" cy="166" r="8" fill="white" stroke="#183747" stroke-width="3"/>
    <circle cx="462" cy="166" r="3.5" fill="#183747"/>
    <path d="M449 151L468 155" fill="none" stroke="#183747" stroke-width="4" stroke-linecap="round"/>
    <path d="M419 146Q424 113 452 114Q482 114 487 145Z" fill="#ed7852" class="outline"/>
    <path d="M442 120L437 136M458 120L460 136" stroke="#fff6dd" stroke-width="5" stroke-linecap="round"/>
    <path d="M424 149L439 185L476 151" fill="none" stroke="#183747" stroke-width="3"/>
    <!-- Animated forward leg -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-5 385 266;7 385 266;-5 385 266" dur=".8s" repeatCount="indefinite"/>
      <path d="M385 269L414 305L405 348" fill="none" stroke="#183747" stroke-width="15" stroke-linecap="round"/>
      <path d="M385 269L414 305L405 348" fill="none" stroke="#f6b74f" stroke-width="9" stroke-linecap="round"/>
      <path d="M404 342L428 354L396 358Z" fill="#f6b74f" class="outline"/>
    </g>
  </g>

  <g transform="translate(393 370)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-19 12L19-12" stroke="#183747" stroke-width="5"/>
      <circle cx="19" cy="-12" r="5" fill="#366b73"/>
      <circle cx="-19" cy="12" r="5" fill="#366b73"/>
    </g>
  </g>

  <!-- Fixed speech bubble -->
  <path d="M567 289Q567 277 579 277H741Q753 277 753 289V327Q753 339 741 339H604L584 354L590 339H579Q567 339 567 327Z" fill="#fffef4" stroke="#183747" stroke-width="3"/>
  <text x="660" y="302" text-anchor="middle" font-size="16" font-weight="bold">“I'm just here</text>
  <text x="660" y="323" text-anchor="middle" font-size="16" font-weight="bold">for the carpool.”</text>
  <path d="M592 270L578 239" fill="none" stroke="#183747" stroke-width="2" stroke-dasharray="4 5"/>

  <rect x="0" y="491" width="800" height="109" fill="#fff6dd"/>
  <text x="400" y="521" text-anchor="middle" font-size="21" font-weight="bold">A pelican on a bicycle: the bill still carries the whole crew.</text>
  <path d="M70 542H730" stroke="#d4be96" stroke-width="2"/>
  <text x="400" y="575" text-anchor="middle" font-size="18">2026-10-30 15:30:02 SGT (UTC+08:00)</text>
</svg>