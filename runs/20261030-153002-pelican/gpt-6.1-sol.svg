    <path d="M338 278l38 44-13 55" fill="none" stroke="#c98535" stroke-width="13" stroke-linecap="round"/>
    <path d="M350 375l29 3-10 10h-30Z" fill="#edaa43" stroke="#263c45" stroke-width="3"/>
    <path d="M301 235l-37-18 12 36-28-3 41 39" fill="#f8fcf4" stroke="#263c45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M299 209q34-40 79-12l46 34q16-3 25-30l-3-46q-3-34 28-41 36-9 48 18 11 24-9 42l-13 14q6 63-38 89-49 28-116 10-57-13-47-78Z" fill="#fffdf1" stroke="#263c45" stroke-width="4"/>
    <path d="M321 223q42-33 83 12-13 42-70 29 21-4 31-17-24 6-44-24Z" fill="#d9e5dd" stroke="#263c45" stroke-width="3"/>
    <path d="M481 169q32 48 112 21-1 73-63 72-51-1-49-93Z" fill="url(#pouch)" stroke="#263c45" stroke-width="4"/>
