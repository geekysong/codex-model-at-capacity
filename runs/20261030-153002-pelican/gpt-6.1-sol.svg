<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish-filled bill pouch past a no fishing sign. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bdeef2"/>
      <stop offset="1" stop-color="#fff3cf"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffc864"/>
      <stop offset="1" stop-color="#ef914b"/>
    </linearGradient>
    <pattern id="road" width="140" height="20" patternUnits="userSpaceOnUse">
      <path d="M10 10h65" stroke="#fff4ca" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="wheel" fill="none">
      <circle r="75" fill="#f5fcf7" fill-opacity=".65" stroke="#263c45" stroke-width="12"/>
      <circle r="64" stroke="#92a6a8" stroke-width="2"/>
      <g stroke="#718c93" stroke-width="2">
        <path d="M-64 0H64M0-64V64M-45-45l90 90M-45 45l90-90"/>
        <path d="M-59-24L59 24M-24-59L24 59M-59 24L59-24M-24 59L24-59"/>
      </g>
      <circle r="9" fill="#ffc857" stroke="#263c45" stroke-width="4"/>
      <path d="M-17-61l13-3" stroke="#ff7158" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="fish" stroke="#274953" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-21 0q20-22 43 0Q0 22-21 0l-14 11V-11Z" fill="#81d4ce"/>
      <circle cx="13" cy="-2" r="2.5" fill="#274953" stroke="none"/>
      <path d="M3-9Q-3 0 3 9" fill="none"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff8e8"/>
  <rect x="16" y="16" width="768" height="506" rx="24" fill="url(#sky)" stroke="#263c45" stroke-width="3"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263c45" text-anchor="middle">
    <text x="400" y="65" font-size="44" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
    <text x="400" y="94" font-size="16" font-weight="bold" letter-spacing="1.5">ZERO EMISSIONS. QUESTIONABLE CARGO.</text>
  </g>

  <circle cx="104" cy="163" r="34" fill="#ffd775"/>
  <g fill="#fffdf0" opacity=".9">
    <path d="M170 156q0-17 19-17 9-23 30-10 23-3 26 18 21 0 22 15h-97Z"/>
    <path d="M538 131q6-15 23-10 13-23 34-7 24-2 28 17Z"/>
  </g>
  <path d="M18 348Q149 304 285 345T558 337T782 346V419H18Z" fill="#80c9bc"/>
  <path d="M18 377Q191 346 328 377T592 370T782 380V422H18Z" fill="#4ca89c"/>
  <path d="M31 393q42-8 77 0m493-8h59m48 12h49" fill="none" stroke="#bce9d6" stroke-width="4" stroke-linecap="round"/>
  <path d="M18 415H782V497Q782 520 758 520H42Q18 520 18 497Z" fill="#64767a"/>
  <rect x="18" y="479" width="764" height="20" fill="url(#road)"/>
  <path d="M18 417H782" stroke="#e4d3a4" stroke-width="8"/>
  <ellipse cx="399" cy="462" rx="224" ry="12" fill="#2b4449" opacity=".22"/>

  <g stroke="#263c45" stroke-width="4">
    <path d="M700 293v124" stroke="#6c6861" stroke-width="8"/>
    <rect x="641" y="237" width="118" height="63" rx="8" fill="#fff8e8"/>
