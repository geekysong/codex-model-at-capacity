    <path d="M450 176q-17 11-27 8l-20-7 10 20 35-4" fill="#ed6553" stroke="#263c45" stroke-width="3"/>
    <path d="M407 228q47 4 89-9l19-8" fill="none" stroke="#263c45" stroke-width="13" stroke-linecap="round"/>
    <path d="M407 226q47 4 89-9l19-8" fill="none" stroke="#fffdf1" stroke-width="8" stroke-linecap="round"/>
    <path d="M368 274l55 37-28 57" fill="none" stroke="#263c45" stroke-width="15" stroke-linecap="round"/>
    <path d="M368 274l55 37-28 57" fill="none" stroke="#efac49" stroke-width="9" stroke-linecap="round"/>
    <path d="M384 363l30 9-4 12-39-5Z" fill="#ffc75c" stroke="#263c45" stroke-width="3"/>
  </g>

  <g transform="translate(395 386)">
    <circle r="16" fill="#ffd166" stroke="#263c45" stroke-width="4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
      <path d="M-24 0H24" stroke="#263c45" stroke-width="6" stroke-linecap="round"/>
      <path d="M-30-5v10M30-5v10" stroke="#263c45" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle r="4" fill="#263c45"/>
  </g>

  <g stroke="#fff7d7" stroke-width="4" stroke-linecap="round">
    <path d="M152 284h45m-60 17h39m-15 18h26"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#263c45" text-anchor="middle">
    <rect x="87" y="110" width="286" height="74" rx="18" fill="#fffdf1" stroke="#263c45" stroke-width="3"/>
    <path d="M350 182l26 23-6-35" fill="#fffdf1" stroke="#263c45" stroke-width="3" stroke-linejoin="round"/>
    <path d="M351 180l17-9" stroke="#fffdf1" stroke-width="5"/>
    <text x="230" y="140" font-size="18" font-weight="bold">“It’s a commute.</text>
    <text x="230" y="165" font-size="18" font-weight="bold">The fish are carpooling.”</text>
    <text x="400" y="548" font-size="20" font-weight="bold">One pelican. Two wheels. A suspiciously fresh lunch.</text>
    <text x="400" y="578" font-size="16">2026-10-30 15:32:02 SGT (UTC+08:00)</text>
  </g>
</svg>