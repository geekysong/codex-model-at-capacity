<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pedalican: pelican riding a bicycle</title>
  <desc id="desc">A satirical cartoon of a determined pelican cycling through town.</desc>
  <style>
    .title { font: 900 42px sans-serif; fill:#20233b; letter-spacing:1px }
    .caption { font: 700 18px sans-serif; fill:#3a405e }
    .footer { font: 15px monospace; fill:#4b506b }
    .sign { font: 800 16px sans-serif; fill:#fff }
    .line { stroke:#20233b; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; fill:none }
    .thin { stroke:#20233b; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; fill:none }
    .wheel { animation: spin 1.1s linear infinite; transform-box:fill-box; transform-origin:center }
    .rider { animation: bob .55s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center }
    .leg1 { animation: pedal1 1.1s linear infinite; transform-box:fill-box; transform-origin: 410px 370px }
    .leg2 { animation: pedal2 1.1s linear infinite; transform-box:fill-box; transform-origin: 410px 370px }
    @keyframes spin { to { transform:rotate(360deg) } }
    @keyframes bob { to { transform:translateY(-7px) rotate(-1deg) } }
    @keyframes pedal1 { 0% { transform:rotate(0deg) } 100% { transform:rotate(360deg) } }
    @keyframes pedal2 { 0% { transform:rotate(180deg) } 100% { transform:rotate(540deg) } }
  </style>

