  <text x="631" y="181" text-anchor="middle" class="sign">NO FOWL</text>

  <text x="400" y="60" text-anchor="middle" class="title">PEDALICAN!</text>
  <text x="400" y="89" text-anchor="middle" class="caption">“Traffic? I prefer a beak lane.”</text>

