<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="white"/>
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#222">
    Level Seesaw in Static Equilibrium
  </text>

  <!-- Seesaw beam -->
  <rect x="90" y="190" width="420" height="18" rx="8" fill="#8b5a2b" stroke="#4a2f16" stroke-width="2"/>

  <!-- Pivot -->
  <polygon points="300,208 270,270 330,270" fill="#777" stroke="#333" stroke-width="2"/>
  <circle cx="300" cy="199" r="7" fill="#333"/>
  <text x="300" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">pivot</text>

  <!-- Masses -->
  <rect x="155" y="145" width="50" height="45" rx="5" fill="#4b9cd3" stroke="#1d4f73" stroke-width="2"/>
  <text x="180" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">6 kg</text>

  <rect x="395" y="145" width="50" height="45" rx="5" fill="#e28b3d" stroke="#8a4d17" stroke-width="2"/>
  <text x="420" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">4 kg</text>

  <!-- Force arrows -->
  <line x1="180" y1="115" x2="180" y2="140" stroke="#b00020" stroke-width="4"/>
  <polygon points="180,150 172,136 188,136" fill="#b00020"/>
  <text x="180" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#b00020">F = 6g</text>

  <line x1="420" y1="115" x2="420" y2="140" stroke="#b00020" stroke-width="4"/>
  <polygon points="420,150 412,136 428,136" fill="#b00020"/>
  <text x="420" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#b00020">F = 4g</text>

  <!-- Distance indicators -->
  <line x1="180" y1="325" x2="300" y2="325" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="318" x2="180" y2="332" stroke="#333" stroke-width="2"/>
  <line x1="300" y1="318" x2="300" y2="332" stroke="#333" stroke-width="2"/>
  <polygon points="180,325 192,319 192,331" fill="#333"/>
  <polygon points="300,325 288,319 288,331" fill="#333"/>
  <text x="240" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">2 m</text>

  <line x1="300" y1="325" x2="420" y2="325" stroke="#333" stroke-width="2"/>
  <line x1="420" y1="318" x2="420" y2="332" stroke="#333" stroke-width="2"/>
  <polygon points="300,325 312,319 312,331" fill="#333"/>
  <polygon points="420,325 408,319 408,331" fill="#333"/>
  <text x="360" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#222">x = 3 m</text>

  <!-- Torque equation and result -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#222">
    6 × 2 = 4 × 3
  </text>
  <text x="520" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#16803c">
    balanced
  </text>
</svg>