<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f2937"/>
    </marker>
    <style>
      .label { font-family: Arial, sans-serif; fill: #1f2937; font-size: 20px; }
      .small { font-family: Arial, sans-serif; fill: #1f2937; font-size: 17px; }
      .bold { font-family: Arial, sans-serif; fill: #166534; font-size: 28px; font-weight: bold; }
    </style>
  </defs>

  <rect width="600" height="400" fill="#ffffff"/>

  <!-- Level seesaw -->
  <rect x="90" y="178" width="420" height="24" rx="6" fill="#b77942" stroke="#5b3a29" stroke-width="3"/>
  <line x1="300" y1="165" x2="300" y2="215" stroke="#5b3a29" stroke-width="3"/>

  <!-- Pivot -->
  <polygon points="300,202 260,275 340,275" fill="#64748b" stroke="#334155" stroke-width="3"/>
  <circle cx="300" cy="190" r="9" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
  <text x="300" y="305" text-anchor="middle" class="label">pivot</text>

  <!-- Left mass -->
  <line x1="150" y1="202" x2="150" y2="245" stroke="#334155" stroke-width="3"/>
  <rect x="115" y="245" width="70" height="55" rx="6" fill="#60a5fa" stroke="#1e3a8a" stroke-width="3"/>
  <text x="150" y="279" text-anchor="middle" class="label" fill="#ffffff">6 kg</text>

  <!-- Right mass -->
  <line x1="450" y1="202" x2="450" y2="245" stroke="#334155" stroke-width="3"/>
  <rect x="415" y="245" width="70" height="55" rx="6" fill="#f87171" stroke="#991b1b" stroke-width="3"/>
  <text x="450" y="279" text-anchor="middle" class="label" fill="#ffffff">4 kg</text>

  <!-- Force arrows -->
  <line x1="150" y1="235" x2="150" y2="320" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="150" y="345" text-anchor="middle" class="small">6g downward</text>
  <line x1="450" y1="235" x2="450" y2="320" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="450" y="345" text-anchor="middle" class="small">4g downward</text>

  <!-- Distance labels -->
  <line x1="150" y1="145" x2="300" y2="145" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="138" x2="150" y2="152" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="138" x2="300" y2="152" stroke="#475569" stroke-width="2"/>
  <text x="225" y="132" text-anchor="middle" class="label">2 m</text>

  <line x1="300" y1="110" x2="450" y2="110" stroke="#475569" stroke-width="2"/>
  <line x1="300" y1="103" x2="300" y2="117" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="103" x2="450" y2="117" stroke="#475569" stroke-width="2"/>
  <text x="375" y="97" text-anchor="middle" class="label">x = 3 m</text>

  <!-- Equation and status -->
  <text x="300" y=" fifty" text-anchor="middle" class="label" transform="translate(0,0)">Torque balance:</text>
  <text x="300" y="45" text-anchor="middle" class="label">6 × 2 = 4 × 3</text>
  <text x="300" y="380" text-anchor="middle" class="bold">BALANCED</text>
</svg>