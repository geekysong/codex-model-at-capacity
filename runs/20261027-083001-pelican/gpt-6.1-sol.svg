    <style>
      .ink { stroke:#17202a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:Arial,Helvetica,sans-serif; fill:#17202a; }
      .wheelSpin { transform-origin:0 0; animation:spin 1.5s linear infinite; }
      .pedal { transform-origin:0 0; animation:spin 1.2s linear infinite; }
      .bob { animation:bob .8s ease-in-out infinite alternate; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-5px); } }
    </style>
  </defs>

