<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a Bicycle</title>
  <desc id="desc">A satirical cartoon pelican rides a bicycle while proudly carrying a fish.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68717d"/>
      <stop offset="1" stop-color="#3c4652"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="110" r="52" fill="#fff6b0" opacity=".9"/>
  <path d="M0 390 Q120 330 240 385 T480 375 T800 360 V500 H0Z" fill="#9bd58d"/>
  <path d="M0 470 Q190 420 390 465 T800 445 V600 H0Z" fill="url(#road)"/>
  <path d="M0 515 H800" stroke="#f5d76e" stroke-width="9" stroke-dasharray="50 28" opacity=".9"/>

  <g font-family="Verdana, sans-serif" fill="#16324f">
    <text x="400" y="58" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="2">THE GREAT PELICAN COMMUTE</text>
    <text x="400" y="88" text-anchor="middle" font-size="16" font-style="italic">“If it has wheels, it has a beak for traffic.”</text>
  </g>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity=".7">
    <path d="M92 245h80"/>
    <path d="M55 285h105"/>
    <path d="M110 325h58"/>
  </g>

  <!-- bicycle -->
  <g filter="url(#shadow)">
    <g fill="none" stroke="#d84343" stroke-width="8">
      <circle cx="280" cy="430" r="76"/>
      <circle cx="590" cy="430" r="76"/>
      <path d="M280 430 L370 300 L470 430 L280 430 M370 300 L420 430 M370 300 L335 260"/>
      <path d="M470 430 L520 315 L590 430"/>
    </g>
    <g fill="none" stroke="#f5b642" stroke-width="5">
      <circle cx="280" cy="430" r="6"/>
      <circle cx="590" cy="430" r="6"/>
      <path d="M280 430L280 354M280 430L214 430M280 430L330 485M280 430L340 380"/>
      <path d="M590 430L590 354M590 430L524 430M590 430L640 485M590 430L650 380"/>
    </g>
    <path d="M328 259 Q350 245 375 258" fill="none" stroke="#202a35" stroke-width="9" stroke-linecap="round"/>
    <path d="M513 315 Q540 290 566 307" fill="none" stroke="#202a35" stroke-width="9" stroke-linecap="round"/>
    <rect x="405" y="332" width="72" height="52" rx="10" fill="#f7c948" stroke="#9b5a20" stroke-width="5"/>
    <text x="441" y="365" text-anchor="middle" font-family="Verdana" font-size="16" font-weight="700" fill="#6b3e18">FISH</text>
  </g>

  <!-- rotating wheel accents -->
  <g stroke="#ffffff" stroke-width="3" opacity=".8">
    <path d="M280 430l-44-52M280 430l-6-75M280 430l45-51"/>
    <path d="M590 430l-44-52M590 430l-6-75M590 430l45-51"/>
  </g>

  <!-- pelican body with bobbing animation -->
  <g id="pelican" filter="url(#shadow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-7;0,0" dur="1.1s" repeatCount="indefinite"/>
    <ellipse cx="420" cy="235" rx="88" ry="105" fill="#f7f4ea" stroke="#263746" stroke-width="6"/>
    <path d="M367 200 Q395 132 463 150 Q508 162 511 218 Q489 183 450 181 Q407 177 367 200Z" fill="#d9e2e5" stroke="#263746" stroke-width="6"/>
    <ellipse cx="455" cy="164" rx="13" ry="16" fill="#263746"/>
    <circle cx="459" cy="159" r="4" fill="#fff"/>
    <path d="M466 188 Q565 183 644 226 Q573 273 465 231Z" fill="#f0a43c" stroke="#263746" stroke-width="6"/>
    <path d="M469 222 Q548 241 625 226 Q551 292 470 247Z" fill="#f2bd58" stroke="#263746" stroke-width="5"/>
    <path d="M401 274 Q430 304 471 278" fill="none" stroke="#263746" stroke-width="6" stroke-linecap="round"/>
    <path d="M378 215 Q347 245 370 276" fill="none" stroke="#263746" stroke-width="18" stroke-linecap="round"/>
    <path d="M471 280 Q510 311 526 344" fill="none" stroke="#f0a43c" stroke-width="16" stroke-linecap="round"/>
    <path d="M400 320 Q382 355 362 380" fill="none" stroke="#f0a43c" stroke-width="16" stroke-linecap="round"/>
    <path d="M350 380 l-30 9 M350 380 l-23 18 M350 380 l-11 25" stroke="#f0a43c" stroke-width="7" stroke-linecap="round"/>
    <path d="M522 343 l28 10 M522 343 l24 18 M522 343 l12 25" stroke="#f0a43c" stroke-width="7" stroke-linecap="round"/>
    <text x="420" y="130" text-anchor="middle" font-family="Verdana" font-size="15" font-weight="700" fill="#263746">LICENSED TO WING IT</text>
  </g>

  <!-- pedal crank and motion -->
  <g transform="translate(420 430)">
    <circle r="13" fill="#f5b642" stroke="#8f5b1d" stroke-width="4"/>
    <g stroke="#8f5b1d" stroke-width="6" stroke-linecap="round">
      <path d="M0 0L30 -18"/>
      <path d="M30 -18h18"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.1s" repeatCount="indefinite"/>
  </g>

  <!-- wheel rotation marks -->
  <g fill="none" stroke="#ffffff" stroke-width="4" opacity=".9">
    <path d="M280 354 A76 76 0 0 1 347 395"/>
    <path d="M590 354 A76 76 0 0 1 657 395"/>
    <animateTransform attributeName="transform" type="rotate" from="0 280 430" to="360 280 430" dur="1.1s" repeatCount="indefinite"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="4" opacity=".9">
    <path d="M590 354 A76 76 0 0 1 657 395"/>
    <animateTransform attributeName="transform" type="rotate" from="0 590 430" to="360 590 430" dur="1.1s" repeatCount="indefinite"/>
  </g>

  <g font-family="Verdana, sans-serif">
    <rect x="92" y="548" width="616" height="34" rx="12" fill="#17324a" opacity=".92"/>
    <text x="400" y="570" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">A pelican on a bicycle: finally, a bird with a balanced commute.</text>
    <text x="400" y="596" text-anchor="middle" font-size="12" fill="#17324a">2026-10-27 08:31:00 SGT (UTC+08:00)</text>
  </g>
</svg>