<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">An indignant pelican pedals a bicycle with a fish-filled bill while a fish in its front basket demands a refund. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="5" r="1" fill="#173c49" opacity=".035"/>
      <circle cx="17" cy="19" r="1" fill="#173c49" opacity=".035"/>
    </pattern>
    <g id="spokes" stroke="#557582" stroke-width="3">
      <path d="M-72 0H72M0-72V72M-51-51L51 51M-51 51L51-51"/>
      <circle r="62" fill="none" stroke="#adc5c5" stroke-width="2"/>
      <path d="M0-69L10-57H-10Z" fill="#f5b735" stroke="none"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff3d9"/>
  <rect width="800" height="600" fill="url(#paper)"/>
  <path d="M0 354Q145 319 286 354T560 348T800 352V486H0Z" fill="#dbe7d3"/>
  <g fill="#fff" opacity=".8">
    <path d="M53 176Q40 153 67 146Q77 118 101 140Q127 133 137 156Q155 157 154 176Z"/>
    <path d="M618 139Q610 119 631 114Q646 88 666 111Q693 105 700 126Q721 128 722 139Z"/>
  </g>

  <text x="400" y="63" text-anchor="middle" font-family="Arial, sans-serif" font-size="47" font-weight="900" letter-spacing="3" fill="#173c49">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#aa4b32">ZERO EMISSIONS. MASSIVE BILL.</text>

  <ellipse cx="404" cy="469" rx="258" ry="14" fill="#173c49" opacity=".13"/>
  <path d="M48 477H752" stroke="#173c49" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#aa4b32" stroke-width="4" stroke-linecap="round">
    <path d="M91 323H147M109 339H156M88 355H134"/>
  </g>

  <!-- Wheels rotate independently around fixed hubs. -->
  <g transform="translate(240 391)">
    <circle r="79" fill="#fff9e9" stroke="#173c49" stroke-width="12"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="9" fill="#173c49"/>
  </g>
  <g transform="translate(565 391)">
    <circle r="79" fill="#fff9e9" stroke="#173c49" stroke-width="12"/>
    <g>
      <use href="#spokes"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="9" fill="#173c49"/>
  </g>

  <!-- Bicycle frame. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 391L320 295L371 391H240L494 295L371 391M320 295H494" stroke="#173c49" stroke-width="14"/>
    <path d="M240 391L320 295L371 391H240L494 295L371 391M320 295H494" stroke="#e7634c" stroke-width="8"/>
    <path d="M565 391L492 278L484 253L510 245" stroke="#173c49" stroke-width="10"/>
    <path d="M320 295L310 272" stroke="#173c49" stroke-width="9"/>
    <path d="M285 272H333" stroke="#173c49" stroke-width="15"/>
    <path d="M510 245L527 249" stroke="#e7634c" stroke-width="12"/>
    <path d="M240 391L369 378Q391 390 369 405L240 398Z" stroke="#173c49" stroke-width="3"/>
  </g>

  <!-- Rider bobs while the text remains stationary. -->
  <g stroke="#173c49" stroke-width="4" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M290 247L334 299L364 365" fill="none" stroke="#df9430" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" values="M290 247L334 299L364 365;M290 247L315 321L383 382;M290 247L334 299L364 365" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M271 239L227 217L241 254L216 245Q225 279 276 275" fill="#fffdf2"/>
    <path d="M270 190Q303 162 345 187Q367 198 379 164Q382 143 402 139Q427 137 433 160Q437 181 420 201L398 231Q384 281 325 279Q273 280 252 246Q240 219 270 190Z" fill="#fffdf2"/>
    <path d="M270 211Q321 188 349 226Q337 259 284 250Q311 240 319 226Q295 236 270 211Z" fill="#d5e3dd"/>
    <path d="M345 209Q388 211 425 245L489 251" fill="none" stroke="#173c49" stroke-width="15" stroke-linecap="round"/>
    <path d="M345 209Q388 211 425 245L489 251" fill="none" stroke="#fffdf2" stroke-width="9" stroke-linecap="round"/>
    <path d="M406 176L566 188Q533 246 467 229Q438 222 419 190Z" fill="#f7bd50"/>
    <path d="M409 173L570 187L419 193Z" fill="#f18f38"/>
    <path d="M448 202Q479 182 507 204L525 192L521 216L505 211Q475 229 448 202Z" fill="#66acb3" stroke-width="2"/>
    <circle cx="459" cy="202" r="3" fill="#173c49" stroke="none"/>
    <path d="M480 199L488 209M471 201L478 213" fill="none" stroke-width="2"/>
    <ellipse cx="410" cy="159" rx="10" ry="13" fill="white"/>
    <circle cx="414" cy="160" r="4" fill="#173c49" stroke="none"/>
    <path d="M396 144L420 149" fill="none" stroke-width="5"/>
    <path d="M376 139Q382 111 410 115Q433 117 440 141Z" fill="#e7634c"/>
    <path d="M389 124L386 135M402 122L400 136M415 124L416 137" fill="none" stroke-width="3"/>
    <path d="M373 141H445" stroke-width="6" stroke-linecap="round"/>
    <path d="M379 178L364 187L370 199L387 188Z" fill="#e7634c"/>
    <path d="M367 189Q340 173 327 181L345 194L328 200Q349 210 371 199" fill="#e7634c"/>

    <path d="M321 263L357 309L385 385" fill="none" stroke="#f4b13f" stroke-width="13" stroke-linecap="round">
      <animate attributeName="d" values="M321 263L357 309L385 385;M321 263L375 303L354 365;M321 263L357 309L385 385" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M383 378L409 392L378 395Z" fill="#f4b13f">
      <animateTransform attributeName="transform" type="translate" values="0 0;-31 -20;0 0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <circle cx="371" cy="391" r="17" fill="#f5b735" stroke="#173c49" stroke-width="4"/>
  <g transform="translate(371 391)">
    <g stroke="#173c49" stroke-width="5" stroke-linecap="round">
      <path d="M-18-12L18 12M-26-12H-10M10 12H26"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- An unwilling passenger. -->
  <g stroke="#173c49" stroke-width="3" stroke-linejoin="round">
    <path d="M542 277Q553 239 580 253L597 239L597 265L580 263Q562 289 542 277Z" fill="#69b3ba"/>
    <circle cx="555" cy="261" r="7" fill="white"/>
    <circle cx="557" cy="261" r="2.5" fill="#173c49" stroke="none"/>
    <path d="M546 274L555 271" fill="none"/>
    <path d="M524 276H610L600 321H536Z" fill="#e9b87b"/>
    <path d="M532 291H606M535 306H603M548 278L551 319M568 278V319M589 278L586 319" fill="none" stroke="#9e713e" stroke-width="2"/>
    <path d="M523 276H612" stroke-width="6" stroke-linecap="round"/>
    <path d="M602 232L620 217H721Q738 217 738 199V166Q738 150 720 150H587Q571 150 571 167V199Q571 217 590 217H606Z" fill="#fffdf4"/>
  </g>
  <text x="654" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#173c49">
    <tspan x="654">I ordered</tspan>
    <tspan x="654" dy="22">a WATER taxi!</tspan>
  </text>

  <rect x="0" y="492" width="800" height="108" fill="#173c49"/>
  <text x="400" y="528" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#fff3d9">He bought a bicycle. The fish still foot the bill.</text>
  <path d="M160 545H640" stroke="#688991"/>
  <text x="400" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff3d9">2026-10-30 19:30:02 SGT (UTC+08:00)</text>
</svg>