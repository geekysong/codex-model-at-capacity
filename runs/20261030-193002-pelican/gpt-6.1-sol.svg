<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a fish dangling in front of its enormous beak. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#fff5d9"/>
    </pattern>
