<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">A pelican rides a bicycle</title>
  <desc id="desc">A determined pelican pedals a bicycle past a sign that reads “Climate of opinion: mostly hot air.”</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif}
    .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.2s linear infinite}
    .rider{animation:bob .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes bob{to{transform:translateY(-4px)}}
  </style>

  <rect width="800" height="600" fill="#c9efff"/>
  <rect y="375" width="800" height="160" fill="#a9d88b"/>
  <path d="M0 386 Q110 356 210 382 T420 376 T650 383 T800 369 V415 H0Z" fill="#8bc46d"/>
  <circle cx="685" cy="112" r="42" fill="#ffd45c"/>
  <path d="M72 95h156l-12 48H84z" fill="#fff8dc" stroke="#24344b" stroke-width="3"/>
  <text x="150" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#24344b">PUBLIC NOTICE</text>
  <text x="150" y="134" text-anchor="middle" font-size="11" fill="#24344b">HOT AIR AHEAD</text>

  <text id="title" x="400" y="53" text-anchor="middle" font-size="30" font-weight="900" letter-spacing="1" fill="#18324b">THE GREAT WING-AND-PEDAL</text>
  <text x="400" y="79" text-anchor="middle" font-size="15" font-weight="bold" fill="#40566b">“I’m cycling for the planet. The planet can keep up.”</text>

  <!-- A little cloud of self-important exhaust -->
  <g fill="#fff" stroke="#9cb5c2" stroke-width="2">
    <circle cx="139" cy="228" r="15"/><circle cx="157" cy="220" r="19"/><circle cx="178" cy="229" r="14"/>
  </g>
  <text x="157" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#526b78">HONK!</text>

  <!-- Bicycle frame -->
  <g stroke="#e34d48" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M260 392 L355 392 L405 312 L340 312 Z"/>
    <path d="M355 392 L436 392 L405 312"/>
  </g>
  <path d="M339 307h39" stroke="#25384a" stroke-width="7" stroke-linecap="round"/>
  <path d="M428 301l28-9" stroke="#25384a" stroke-width="7" stroke-linecap="round"/>
  <path d="M450 290l13 24" stroke="#25384a" stroke-width="6" stroke-linecap="round"/>
  <path d="M325 297l30 0" stroke="#25384a" stroke-width="7" stroke-linecap="round"/>
  <path d="M340 298l-8 15" stroke="#25384a" stroke-width="6" stroke-linecap="round"/>

  <!-- Wheels and spokes -->
  <g class="wheel" fill="none" stroke="#263746" stroke-width="4">
    <circle cx="260" cy="392" r="62"/>
    <circle cx="260" cy="392" r="6" fill="#263746"/>
    <path d="M260 330v124M198 392h124M216 348l88 88M304 348l-88 88"/>
  </g>
  <g class="wheel" fill="none" stroke="#263746" stroke-width="4">
    <circle cx="436" cy="392" r="62"/>
    <circle cx="436" cy="392" r="6" fill="#263746"/>
    <path d="M436 330v124M374 392h124M392 348l88 88M480 348l-88 88"/>
  </g>

  <!-- Pedals -->
  <circle cx="355" cy="392" r="15" fill="#f7bd3d" stroke="#263746" stroke-width="4"/>
  <path d="M355 392l-22-24m22 24 22 24" stroke="#263746" stroke-width="5" stroke-linecap="round"/>
  <path d="M319 367h22m25 49h22" stroke="#263746" stroke-width="6" stroke-linecap="round"/>

  <!-- Pelican rider -->
  <g class="rider">
    <path d="M325 304 Q310 280 320 247 Q331 215 365 217 Q398 220 406 252 Q411 279 392 302 L374 322 L337 320Z" fill="#fffdf4" stroke="#273a4b" stroke-width="4"/>
    <path d="M327 266 Q333 242 360 239 Q382 240 391 261 Q394 280 378 292 Q354 303 335 287Z" fill="#f3a34a" stroke="#273a4b" stroke-width="4"/>
    <path d="M372 248 Q390 231 414 238 Q429 242 438 253 Q422 264 401 263 L382 261Z" fill="#f3a34a" stroke="#273a4b" stroke-width="4"/>
    <path d="M434 250 Q448 253 453 261 Q442 269 427 266 L407 262" fill="#f4c84e" stroke="#273a4b" stroke-width="3"/>
    <circle cx="381" cy="247" r="5" fill="#182a39"/>
    <circle cx="383" cy="245" r="1.7" fill="#fff"/>
    <path d="M354 238 Q360 220 377 219" fill="none" stroke="#e34d48" stroke-width="5" stroke-linecap="round"/>
    <path d="M349 230l-9-9m23 1 2-13m10 13 10-9" stroke="#e34d48" stroke-width="3" stroke-linecap="round"/>
    <path d="M349 294 Q355 318 345 336 L329 365" fill="none" stroke="#273a4b" stroke-width="7" stroke-linecap="round"/>
    <path d="M382 294 Q390 315 371 336 L356 369" fill="none" stroke="#273a4b" stroke-width="7" stroke-linecap="round"/>
    <path d="M329 365l-12 2m39 2-12 5" stroke="#273a4b" stroke-width="6" stroke-linecap="round"/>
    <path d="M341 328l-29-18m59 11 29-16" fill="none" stroke="#273a4b" stroke-width="7" stroke-linecap="round"/>
    <path d="M306 309l-7-5m99 1 11-6" stroke="#f3a34a" stroke-width="8" stroke-linecap="round"/>
    <path d="M339 290 Q354 301 380 290" fill="none" stroke="#e34d48" stroke-width="3"/>
    <text x="357" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#273a4b">TOUR DE</text>
    <text x="357" y="291" text-anchor="middle" font-size="11" font-weight="bold" fill="#273a4b">HONK</text>
  </g>

  <!-- Road dashes and comic speed marks -->
  <path d="M70 478h72m42 0h72m42 0h72m42 0h72m42 0h72m42 0h72" stroke="#fff7db" stroke-width="7" stroke-linecap="round"/>
  <path d="M477 278h31m-25 13h22m-18 13h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="552" y="286" font-size="19" font-weight="900" fill="#e34d48" transform="rotate(-8 552 286)">WHEEE!</text>

  <rect x="0" y="535" width="800" height="65" fill="#20364c"/>
  <text x="400" y="559" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff3ce">ONE BIRD. TWO WHEELS. ABSOLUTELY NO LICENSE TO HONK.</text>
  <text x="400" y="585" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2026-10-30 19:32:29 SGT (UTC+08:00)</text>
</svg>