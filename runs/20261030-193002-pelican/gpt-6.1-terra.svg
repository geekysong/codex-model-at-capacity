  <text x="611" y="281" text-anchor="middle" font-size="15" font-weight="bold" fill="#26384a">NO FISH</text>
  <text x="611" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#26384a">LANE?!</text>

  <rect x="16" y="512" width="768" height="72" rx="0" fill="#fff8e8"/>
  <path d="M16 512h768" stroke="#26384a" stroke-width="3"/>
  <text x="400" y="540" text-anchor="middle" font-size="20" font-weight="bold" fill="#26384a">He’s on a roll—and still fishing for compliments.</text>
