<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">THE DAILY COMMUTE</title>
  <desc id="desc">A pelican rides a bicycle along a coastal road, with spinning wheels and a gently bobbing body.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bcebf3"/>
      <stop offset="1" stop-color="#f5f3d7"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#66c8d0"/>
      <stop offset="1" stop-color="#329cae"/>
    </linearGradient>
    <style>
      .ink { stroke:#26384a; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .thin { stroke:#26384a; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 1.5s linear infinite; }
      .rider { animation:bob 1.5s ease-in-out infinite; }
      .pedal { transform-origin:390px 420px; animation:spin 1.5s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
      text { font-family:Arial,Helvetica,sans-serif; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff8e8"/>
  <rect x="14" y="14" width="772" height="572" rx="20" fill="url(#sky)" stroke="#26384a" stroke-width="4"/>

  <text x="400" y="61" text-anchor="middle" font-size="32" font-weight="900" letter-spacing="2" fill="#26384a">THE DAILY COMMUTE</text>
