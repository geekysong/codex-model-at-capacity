  <text x="300" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">Shortest route: 8 street segments</text>

  <path d="M24 357H576" stroke="#cbd5e1"/>
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">2026-10-30 15:04:07 SGT (UTC+08:00)</text>
