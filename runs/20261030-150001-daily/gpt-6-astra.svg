    <path d="M100 55V295 M190 55V295 M280 55V295 M370 55V295 M460 55V295"/>
  </g>

  <path d="M100 55H460V295" fill="none" stroke="#2563eb" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

