    <circle cx="100" cy="115" r="5"/><circle cx="280" cy="115" r="5"/><circle cx="370" cy="115" r="5"/><circle cx="460" cy="115" r="5"/>
    <circle cx="100" cy="175" r="5"/><circle cx="190" cy="175" r="5"/><circle cx="370" cy="175" r="5"/><circle cx="460" cy="175" r="5"/>
    <circle cx="100" cy="235" r="5"/><circle cx="190" cy="235" r="5"/><circle cx="280" cy="235" r="5"/><circle cx="460" cy="235" r="5"/>
    <circle cx="100" cy="295" r="5"/><circle cx="190" cy="295" r="5"/><circle cx="280" cy="295" r="5"/><circle cx="370" cy="295" r="5"/><circle cx="460" cy="295" r="5"/>
  </g>

  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M182 107L198 123 M198 107L182 123"/>
    <path d="M272 167L288 183 M288 167L272 183"/>
    <path d="M362 227L378 243 M378 227L362 243"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#172033">
    <text x="111" y="77">A1</text><text x="201" y="77">B1</text><text x="291" y="77">C1</text><text x="381" y="77">D1</text><text x="471" y="77">E1</text>
    <text x="111" y="137">A2</text><text x="201" y="137">B2</text><text x="291" y="137">C2</text><text x="381" y="137">D2</text><text x="471" y="137">E2</text>
    <text x="111" y="197">A3</text><text x="201" y="197">B3</text><text x="291" y="197">C3</text><text x="381" y="197">D3</text><text x="471" y="197">E3</text>
    <text x="111" y="257">A4</text><text x="201" y="257">B4</text><text x="291" y="257">C4</text><text x="381" y="257">D4</text><text x="471" y="257">E4</text>
    <text x="111" y="317">A5</text><text x="201" y="317">B5</text><text x="291" y="317">C5</text><text x="381" y="317">D5</text><text x="471" y="317">E5</text>
