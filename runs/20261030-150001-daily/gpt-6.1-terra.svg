<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">City grid route from A1 to E5</title>
  <desc id="desc">A shortest route follows the top row and rightmost column, avoiding blocked intersections B2, C3, and D4. The route has eight street segments.</desc>
  <rect width="600" height="400" fill="#f8fafc"/>

  <!-- Streets -->
  <g stroke="#cbd5e1" stroke-width="4" stroke-linecap="round">
    <path d="M90 55H490 M90 115H490 M90 175H490 M90 235H490 M90 295H490"/>
    <path d="M90 55V295 M190 55V295 M290 55V295 M390 55V295 M490 55V295"/>
  </g>

  <!-- Shortest route: 4 segments east, then 4 segments south -->
  <path d="M90 55H490V295" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intersections -->
  <g fill="#475569">
    <circle cx="90" cy="55" r="4"/><circle cx="190" cy="55" r="4"/><circle cx="290" cy="55" r="4"/><circle cx="390" cy="55" r="4"/><circle cx="490" cy="55" r="4"/>
    <circle cx="90" cy="115" r="4"/><circle cx="190" cy="115" r="4"/><circle cx="290" cy="115" r="4"/><circle cx="390" cy="115" r="4"/><circle cx="490" cy="115" r="4"/>
    <circle cx="90" cy="175" r="4"/><circle cx="190" cy="175" r="4"/><circle cx="290" cy="175" r="4"/><circle cx="390" cy="175" r="4"/><circle cx="490" cy="175" r="4"/>
    <circle cx="90" cy="235" r="4"/><circle cx="190" cy="235" r="4"/><circle cx="290" cy="235" r="4"/><circle cx="390" cy="235" r="4"/><circle cx="490" cy="235" r="4"/>
    <circle cx="90" cy="295" r="4"/><circle cx="190" cy="295" r="4"/><circle cx="290" cy="295" r="4"/><circle cx="390" cy="295" r="4"/><circle cx="490" cy="295" r="4"/>
  </g>

  <!-- Blocked intersections -->
  <g stroke="#dc2626" stroke-width="5" stroke-linecap="round">
    <path d="M183 108l14 14 M197 108l-14 14"/>
    <path d="M283 168l14 14 M297 168l-14 14"/>
    <path d="M383 228l14 14 M397 228l-14 14"/>
  </g>

  <!-- Start and end markers -->
  <circle cx="90" cy="55" r="8" fill="#16a34a" stroke="#fff" stroke-width="2"/>
  <circle cx="490" cy="295" r="8" fill="#7c3aed" stroke="#fff" stroke-width="2"/>

  <!-- Intersection labels -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#1e293b">
    <text x="102" y="48">A1</text><text x="202" y="48">B1</text><text x="302" y="48">C1</text><text x="402" y="48">D1</text><text x="502" y="48">E1</text>
    <text x="102" y="108">A2</text><text x="202" y="108">B2</text><text x="302" y="108">C2</text><text x="402" y="108">D2</text><text x="502" y="108">E2</text>
    <text x="102" y="168">A3</text><text x="202" y="168">B3</text><text x="302" y="168">C3</text><text x="402" y="168">D3</text><text x="502" y="168">E3</text>
    <text x="102" y="228">A4</text><text x="202" y="228">B4</text><text x="302" y="228">C4</text><text x="402" y="228">D4</text><text x="502" y="228">E4</text>
    <text x="102" y="288">A5</text><text x="202" y="288">B5</text><text x="302" y="288">C5</text><text x="402" y="288">D5</text><text x="502" y="288">E5</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="13" font-weight="bold">
    <text x="52" y="38" fill="#15803d">Start</text>
    <text x="503" y="310" fill="#6d28d9">End</text>
  </g>

  <path d="M30 330H570" stroke="#cbd5e1"/>
  <g font-family="Arial, sans-serif" fill="#1e293b">
    <text x="30" y="351" font-size="14" font-weight="bold">Route: 8 street segments</text>
    <text x="30" y="378" font-size="13">2026-10-30 15:05:38 SGT (UTC+08:00)</text>
  </g>
</svg>