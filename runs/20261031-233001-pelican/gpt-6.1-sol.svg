      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-26 0H26" stroke="#182b37" stroke-width="6"/>
      <path d="M-35 0H-18M18 0H35" stroke="#182b37" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Pelican and legs have a small, continuous riding bounce. -->
