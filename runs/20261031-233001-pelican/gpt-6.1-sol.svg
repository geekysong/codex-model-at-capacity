    <path d="M278 172Q320 145 370 171Q394 146 399 127Q407 108 427 119Q450 134 437 165L414 211Q406 263 348 276Q290 286 267 253Q248 223 278 172Z" fill="#fffef5" class="outline"/>
    <path d="M287 200Q327 180 366 204Q351 241 294 243Q317 227 321 214" fill="#d6e1df" class="outline"/>
    <path d="M366 205Q415 218 492 237" fill="none" stroke="#182b37" stroke-width="12" stroke-linecap="round"/>
    <path d="M366 205Q415 218 492 237" fill="none" stroke="#eef3e9" stroke-width="7" stroke-linecap="round"/>

    <path d="M430 147L635 166Q617 221 530 229Q464 232 431 179Z" fill="#f7c36b" class="outline"/>
    <path d="M433 148L637 166L432 170Z" fill="#f1a343" class="outline"/>
    <path d="M457 183Q527 208 603 183" fill="none" stroke="#d38a45" stroke-width="3"/>

    <g transform="translate(544 198) rotate(-8)">
      <path d="M-26 0Q-8-20 20 0Q-8 20-26 0L-39 12V-12Z" fill="#78bfc6" stroke="#182b37" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="10" cy="-2" r="3" fill="#182b37"/>
      <path d="M-10-9L-7-19L3-11" fill="#78bfc6" stroke="#182b37" stroke-width="2"/>
    </g>

    <circle cx="423" cy="140" r="10" fill="white" stroke="#182b37" stroke-width="3"/>
    <circle cx="427" cy="140" r="4" fill="#182b37"/>
    <path d="M411 125L431 122" stroke="#182b37" stroke-width="4" stroke-linecap="round"/>
    <path d="M399 122Q412 93 440 111L453 124Z" fill="#e45748" class="outline"/>
    <path d="M412 107L415 119M427 109L432 121" stroke="#fff7df" stroke-width="4"/>
    <path d="M389 174L410 185L395 202L375 184Z" fill="#e45748" stroke="#182b37" stroke-width="3"/>
    <path d="M382 184L354 174L358 194Z" fill="#e45748" stroke="#182b37" stroke-width="3"/>
  </g>

  <g>
    <path d="M573 122L561 96H532Q518 96 518 82V127Q518 141 533 141H722Q737 141 737 126V113Q737 99 722 99H590Z" fill="#fffef8" stroke="#182b37" stroke-width="3"/>
    <text x="628" y="125" text-anchor="middle" font-size="17" font-weight="bold">“I ordered delivery!”</text>
  </g>

  <path d="M174 292H132M181 311H112M176 330H142" fill="none" stroke="#91a6a0" stroke-width="4" stroke-linecap="round"/>

  <rect x="0" y="495" width="800" height="105" fill="#fff7df"/>
  <path d="M42 498H758" stroke="#182b37" stroke-width="2"/>
  <text x="400" y="530" text-anchor="middle" font-size="21" font-weight="bold">He rides for fitness. His bill rides for takeout.</text>
  <text x="400" y="574" text-anchor="middle" font-size="18">2026-10-31 23:31:15 SGT (UTC+08:00)</text>
</svg>