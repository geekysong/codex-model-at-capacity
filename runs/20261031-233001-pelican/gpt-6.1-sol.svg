<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish</title>
  <desc id="description">A proud pelican pedals a bicycle with a fish-filled bill while a fish passenger complains. The wheels spin and the rider bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="1" height="1" patternContentUnits="objectBoundingBox">
      <path d="M0 0L1 1M1 0L0 1" stroke="#465966" stroke-width=".02"/>
    </pattern>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #182b37; }
      .outline { stroke: #182b37; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #77909b; stroke-width: 3; }
    </style>
  </defs>

  <rect width="800" height="600" fill="#fff7df"/>
  <path d="M0 310Q130 260 265 309T540 300T800 285V465H0Z" fill="#dcebc8"/>
  <circle cx="691" cy="159" r="42" fill="#ffd76a"/>
  <path d="M43 177q22-20 44 0m12 17q15-15 30 0" fill="none" stroke="#9ebcae" stroke-width="4" stroke-linecap="round"/>

  <text x="400" y="61" text-anchor="middle" font-size="46" font-weight="900" letter-spacing="3">TOUR DE FISH</text>
  <text x="400" y="94" text-anchor="middle" font-size="17" font-weight="bold" letter-spacing="2">ZERO EMISSIONS. SUSPICIOUS CARGO.</text>

  <path d="M0 438H800V491H0Z" fill="#e1d3b5"/>
  <path d="M22 466H778" stroke="#fff7df" stroke-width="5" stroke-dasharray="38 25"/>
  <ellipse cx="398" cy="438" rx="246" ry="14" fill="#182b37" opacity=".13"/>

  <!-- Bicycle wheels rotate around their own hubs. -->
  <g transform="translate(239 364)">
    <circle r="73" fill="#fffaf0" class="outline" stroke-width="10"/>
    <circle r="62" fill="none" stroke="#b2c3c4" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44" class="spoke"/>
      <path d="M-24-57L24 57M-57 24L57-24" class="spoke"/>
      <rect x="-5" y="-60" width="10" height="17" rx="3" fill="#f5ae36" stroke="#182b37" stroke-width="2"/>
    </g>
    <circle r="8" fill="#182b37"/>
  </g>
  <g transform="translate(560 364)">
    <circle r="73" fill="#fffaf0" class="outline" stroke-width="10"/>
    <circle r="62" fill="none" stroke="#b2c3c4" stroke-width="3"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <path d="M-62 0H62M0-62V62M-44-44L44 44M-44 44L44-44" class="spoke"/>
      <path d="M-24-57L24 57M-57 24L57-24" class="spoke"/>
      <rect x="-5" y="-60" width="10" height="17" rx="3" fill="#f5ae36" stroke="#182b37" stroke-width="2"/>
    </g>
    <circle r="8" fill="#182b37"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M239 364L310 270L375 364ZM310 270H505L375 364M505 270L560 364" stroke="#182b37" stroke-width="13"/>
    <path d="M239 364L310 270L375 364ZM310 270H505L375 364M505 270L560 364" stroke="#e45748" stroke-width="7"/>
    <path d="M310 270L302 248M505 270L496 239L520 224H542" stroke="#182b37" stroke-width="8"/>
    <path d="M278 247H326" stroke="#182b37" stroke-width="13"/>
    <path d="M244 356L375 348Q392 349 393 364Q392 380 375 380L244 373Z" stroke="#182b37" stroke-width="3"/>
  </g>
  <circle cx="375" cy="364" r="20" fill="#f4c450" class="outline"/>
