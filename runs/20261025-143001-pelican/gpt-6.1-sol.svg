  <text x="400" y="509" text-anchor="middle" fill="#fff5d9" font-family="Arial, sans-serif" font-size="20" font-weight="bold">“I was told this would shrink my carbon wingprint.”</text>
  <text x="400" y="532" text-anchor="middle" fill="#f2b64e" font-family="Arial, sans-serif" font-size="16">The pelican packed lunch. The bicycle regrets everything.</text>

