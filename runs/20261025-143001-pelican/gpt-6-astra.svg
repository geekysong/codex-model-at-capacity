<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish in its enormous bill pouch, passing a sign for the flight lane. The wheels spin and the pelican bobs in a continuous loop.</desc>
  <defs>
