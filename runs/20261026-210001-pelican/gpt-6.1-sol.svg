  <rect x="20" y="533" width="760" height="47" rx="10" fill="#fff7e8"/>
  <text x="400" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#24394a">The pelican brought lunch. The bicycle brought consequences.</text>
