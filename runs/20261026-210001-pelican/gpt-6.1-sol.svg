<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Fish: a pelican rides a bicycle</title>
  <desc id="description">An overconfident pelican cycles along the waterfront with a fish in its enormous bill pouch. The wheels spin and the pelican bobs as it pedals.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#c6edf1"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffcb6b"/>
      <stop offset="1" stop-color="#ed8b43"/>
    </linearGradient>
    <pattern id="road" width="100" height="12" patternUnits="userSpaceOnUse">
      <path d="M10 6h45" stroke="#fff0c7" stroke-width="5" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="77" fill="#f9f4dc" stroke="#24394a" stroke-width="11"/>
      <circle r="68" fill="#d9eeeb" stroke="#fff7df" stroke-width="3"/>
      <g stroke="#567885" stroke-width="2.5">
        <path d="M-67 0H67M0-67V67M-47-47 47 47M-47 47 47-47"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#f4be4c" stroke="#24394a" stroke-width="4"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff7e8"/>
  <rect x="17" y="17" width="766" height="566" rx="22" fill="url(#sky)" stroke="#24394a" stroke-width="4"/>

