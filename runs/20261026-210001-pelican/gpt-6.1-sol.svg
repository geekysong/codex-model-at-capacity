  <text x="400" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#38586a">One bird. Two wheels. Absolutely no brakes.</text>

  <circle cx="688" cy="166" r="37" fill="#ffd36a"/>
