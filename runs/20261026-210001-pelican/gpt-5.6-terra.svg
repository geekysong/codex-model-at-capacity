  <rect y="510" width="800" height="90" fill="#283447"/>
  <text x="400" y="543" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#fceba0">A pelican, a bicycle, and absolutely no respect for aerodynamic design.</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">2026-10-26 21:04:04 SGT (UTC+08:00)</text>
