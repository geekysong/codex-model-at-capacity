  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="400" y="57" font-size="35" font-weight="900" fill="#283447" stroke="#fff" stroke-width="5" paint-order="stroke">PELICAN PEDALS THE CITY</text>
    <text x="400" y="87" font-size="16" font-weight="700" fill="#283447">“Finally, a commute with enough room for snacks.”</text>
  </g>

  <g class="wheel" stroke="#20262c" fill="#dcecf2">
