<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals the City</title>
  <desc id="desc">A satirical cartoon of a cheerful pelican riding an undersized bicycle.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#82dcf5"/>
      <stop offset="1" stop-color="#fdf0ae"/>
    </linearGradient>
    <style>
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.2s linear infinite; }
      .bob { transform-box: fill-box; transform-origin: center; animation: bob .6s ease-in-out infinite alternate; }
      .leg { transform-box: fill-box; transform-origin: top center; animation: pedal .6s ease-in-out infinite alternate; }
      .leg2 { transform-box: fill-box; transform-origin: top center; animation: pedal .6s ease-in-out infinite alternate-reverse; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
      @keyframes pedal { to { transform: rotate(16deg); } }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="94" cy="92" r="42" fill="#ffe05c"/>
  <path d="M0 253 Q110 195 230 250 T450 240 T800 220 V430 H0Z" fill="#9bcf83"/>
