  <text x="180" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#263c43">
    <tspan x="180">“My transport bill</tspan>
    <tspan x="180" dy="25">is enormous.”</tspan>
  </text>
  <g stroke="#82958a" stroke-width="3" stroke-linecap="round">
    <path d="M143 295H192M125 310H180M155 325H198">
      <animate attributeName="opacity" values=".35;1;.35" dur=".8s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="36" y="495" width="728" height="73" rx="12" fill="#263c43"/>
  <text x="400" y="523" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#fff5da">He pedals for the planet. The fish pays the toll.</text>
  <text x="400" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#f5cf69">2026-10-26 21:00:01 SGT (UTC+08:00)</text>
</svg>