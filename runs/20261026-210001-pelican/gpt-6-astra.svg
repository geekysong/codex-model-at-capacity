<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a tiny bicycle with a fish in its enormous bill. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="spokes" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10L10 0" stroke="#cad8d6" stroke-width="1"/>
    </pattern>
    <g id="wheel">
      <circle r="78" fill="#f9fbeb" stroke="#253b42" stroke-width="11"/>
      <circle r="65" fill="none" stroke="#9aada8" stroke-width="2"/>
      <g stroke="#829c99" stroke-width="3">
        <path d="M-71 0H71M0-71V71M-50-50L50 50M-50 50L50-50M-66-27L66 27M-27-66L27 66M-66 27L66-27M-27 66L27-66"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <g>
        <path d="M0-71L0-59" stroke="#efa83e" stroke-width="8" stroke-linecap="round"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      </g>
      <circle r="9" fill="#253b42"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#f7efd9"/>
  <rect x="16" y="16" width="768" height="568" rx="20" fill="none" stroke="#263c43" stroke-width="3"/>
  <text x="400" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="900" letter-spacing="3" fill="#233b42">TOUR DE BEAK</text>
  <text x="400" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#647575">ZERO EMISSIONS. UNLIMITED FISH LOBBYING.</text>

  <path d="M40 399Q150 350 262 387T491 380T760 393V484H40Z" fill="#d6dfc1"/>
  <path d="M43 468H757" stroke="#71867b" stroke-width="3"/>
  <ellipse cx="393" cy="470" rx="235" ry="14" fill="#273b42" opacity=".12"/>

  <g stroke="#263c43" stroke-linecap="round" stroke-linejoin="round">
    <path d="M664 365V465" stroke-width="7"/>
    <path d="M618 326H724L743 349L724 372H618Z" fill="#f6ca65" stroke-width="3"/>
    <text x="674" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#263c43" stroke="none">FISH LANE</text>
    <text x="675" y="363" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#263c43" stroke="none">NO CARS. JUST CARP.</text>
  </g>

  <g transform="translate(255 389)"><use href="#wheel"/></g>
  <g transform="translate(541 389)"><use href="#wheel"/></g>

