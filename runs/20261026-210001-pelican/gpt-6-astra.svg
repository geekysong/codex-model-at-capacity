  <g stroke="#263c43" stroke-width="3" stroke-linejoin="round">
    <path d="M85 139H276Q290 139 290 153V194Q290 208 276 208H249L273 230L224 208H85Q71 208 71 194V153Q71 139 85 139Z" fill="#fffdf2"/>
