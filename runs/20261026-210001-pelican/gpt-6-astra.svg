    <path d="M255 389L324 291L381 389Z M324 291H495L381 389 M495 291L541 389" stroke="#263c43" stroke-width="13"/>
    <path d="M255 389L324 291L381 389Z M324 291H495L381 389 M495 291L541 389" stroke="#e66851" stroke-width="7"/>
    <path d="M324 291L312 266M495 291L481 247L509 228L531 234" stroke="#263c43" stroke-width="8"/>
    <path d="M292 265H334" stroke="#263c43" stroke-width="12"/>
    <path d="M381 381L261 382Q247 389 260 399L381 400" stroke="#647575" stroke-width="3"/>
  </g>

