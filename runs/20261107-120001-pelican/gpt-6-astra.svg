  <rect y="505" width="800" height="95" fill="#fff6df"/>
  <path d="M45 506H755" stroke="#263d48" stroke-width="2"/>
  <text x="400" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#263d48">He traded his wings for a cycle-to-work subsidy.</text>
  <text x="400" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#435d65">2026-11-07 12:00:01 SGT (UTC+08:00)</text>
