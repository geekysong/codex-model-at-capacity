      <animate attributeName="d" values="M342 225l26 69 27 58;M342 225l57 59-4 68;M342 225l26 69 27 58" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M383 345l33 11-36 7Z" fill="#efaa51" stroke="#263d48" stroke-width="3"/>
  </g>

