<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A smug pelican pedals a bicycle with a huge fish-filled bill. Its wheels spin, pedals turn, and body bobs in a looping animation.</desc>
  <defs>
    <pattern id="road" width="90" height="12" patternUnits="userSpaceOnUse">
      <path d="M10 6h45" stroke="#fff5ce" stroke-width="4" stroke-linecap="round"/>
    </pattern>
    <g id="wheel">
      <circle r="76" fill="#fff9e8" stroke="#263d48" stroke-width="11"/>
      <circle r="65" fill="none" stroke="#a9c0bd" stroke-width="3"/>
      <g stroke="#668c92" stroke-width="3">
        <path d="M-64 0H64M0-64V64M-45-45l90 90M-45 45l90-90"/>
      </g>
      <path d="M0-70h13" stroke="#ed7753" stroke-width="7" stroke-linecap="round"/>
      <circle r="9" fill="#263d48"/>
    </g>
    <g id="fish">
      <path d="M0 0q17-17 36 0Q17 17 0 0l-13 10V-10Z" fill="#70b7b0" stroke="#263d48" stroke-width="3"/>
      <circle cx="27" cy="-2" r="2.5" fill="#263d48"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="#fff6df"/>
  <path d="M0 145Q180 110 360 145T800 130V453H0Z" fill="#d5ece6"/>
  <circle cx="686" cy="168" r="39" fill="#f6cb65"/>
  <g fill="#fffaf0">
    <path d="M68 180q-7-22 15-25 8-27 32-12 25-6 30 17 24-1 25 20Z"/>
    <path d="M540 138q-5-17 12-20 7-19 24-9 19-5 24 13 18-1 19 16Z"/>
  </g>

  <text x="400" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="39" font-weight="900" fill="#263d48">THE PELICAN COMMUTE</text>
  <text x="400" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="2" fill="#657e7c">ZERO EMISSIONS. MASSIVE BILL.</text>

  <path d="M0 431q180-30 350 1t450-9v77H0Z" fill="#a5c4a8"/>
  <path d="M0 456H800V504H0Z" fill="#697e80"/>
  <path d="M0 483H800" stroke="url(#road)" stroke-width="12"/>
  <ellipse cx="406" cy="461" rx="255" ry="13" fill="#263d48" opacity=".15"/>

  <g font-family="Arial, sans-serif" fill="#263d48">
    <path d="M72 229q0-13 13-13h150q13 0 13 13v53q0 13-13 13h-23l16 24-47-24H85q-13 0-13-13Z" fill="#fffaf0" stroke="#263d48" stroke-width="3"/>
    <text x="160" y="246" text-anchor="middle" font-size="18" font-weight="bold">“I bike to avoid</text>
    <text x="160" y="272" text-anchor="middle" font-size="18" font-weight="bold">the fish toll.”</text>
  </g>

  <g transform="translate(245 383)">
    <use href="#wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </use>
  </g>
  <g transform="translate(576 383)">
    <use href="#wheel">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
    </use>
  </g>

