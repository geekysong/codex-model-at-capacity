<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Pelican Commute</title>
  <desc id="desc">A determined pelican pedals a bicycle with fish peeking out of its enormous beak.</desc>
  <defs>
    <style>
      .ink { stroke:#263b46; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
      .rider { animation:bob .55s ease-in-out infinite alternate; }
      .pedal { transform-origin:408px 400px; animation:spin 2s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @keyframes bob { to { transform:translateY(5px) rotate(1deg); } }
      @media (prefers-reduced-motion:reduce) { .wheel,.rider,.pedal { animation:none; } }
    </style>
    <pattern id="stripe" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#fff6d8"/>
      <rect width="4" height="12" fill="#f3dfaa"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f8f1dc"/>
  <rect x="18" y="18" width="764" height="564" rx="20" fill="#c8eaf0" stroke="#263b46" stroke-width="5"/>
  <path d="M20 440 Q170 409 317 435 T780 430 V515 H20Z" fill="#a5ceba"/>
  <path d="M20 482 Q200 470 380 482 T780 477 V515 H20Z" fill="#e3bc7b"/>
  <path d="M40 479 H760" stroke="#b78c59" stroke-width="3" stroke-dasharray="22 20"/>
  <g fill="#fffdf0" opacity=".85">
    <ellipse cx="126" cy="164" rx="42" ry="15"/><ellipse cx="159" cy="158" rx="31" ry="20"/>
    <ellipse cx="659" cy="174" rx="49" ry="16"/><ellipse cx="621" cy="169" rx="30" ry="20"/>
  </g>
  <text x="400" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="42" fill="#263b46">THE PELICAN COMMUTE</text>
  <text x="400" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="17" fill="#48636b">TWO WHEELS. ONE VERY LARGE LUNCHBOX.</text>

  <g class="wheel">
    <circle cx="245" cy="402" r="88" fill="#f9f2dc" class="ink"/>
    <circle cx="245" cy="402" r="76" fill="none" stroke="#e76d4e" stroke-width="5"/>
    <g stroke="#7e999b" stroke-width="3">
      <path d="M245 326V478 M169 402H321 M191 348L299 456 M299 348L191 456"/>
    </g>
    <circle cx="245" cy="402" r="7" fill="#263b46"/>
  </g>
  <g class="wheel">
