<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican Pedals Past Reason</title>
  <desc id="desc">A satirical cartoon of an exuberant pelican riding a wobbly bicycle.</desc>
  <style>
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
    .bob { transform-box: fill-box; transform-origin: center bottom; animation: bob .55s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: 50% 15%; animation: pedal .55s ease-in-out infinite alternate; }
    .leg2 { transform-box: fill-box; transform-origin: 50% 15%; animation: pedal .55s ease-in-out infinite alternate-reverse; }
    .cloud { animation: drift 9s linear infinite alternate; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-7px) rotate(-1deg); } }
    @keyframes pedal { to { transform: rotate(25deg); } }
    @keyframes drift { to { transform: translateX(38px); } }
  </style>

