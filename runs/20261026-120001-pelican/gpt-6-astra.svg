<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Tour de Beak</title>
  <desc id="desc">A determined pelican pedals a bicycle carrying a single tiny fish. The wheels spin, the pedals turn, and the pelican bobs in a continuous loop.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12V12" fill="none" stroke="#9e622e" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #173445; }
    .outline { stroke: #173445; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .spoke { stroke: #7a97a0; stroke-width: 3; }
  </style>

  <rect width="800" height="600" fill="#fff5d9"/>
  <circle cx="686" cy="139" r="46" fill="#ffd565"/>
  <path d="M40 172Q65 148 90 172Q116 142 143 172M568 115Q590 94 612 115" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>

  <text x="400" y="64" text-anchor="middle" font-size="47" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-size="17" font-weight="700">ZERO EMISSIONS. QUESTIONABLE AERODYNAMICS.</text>

  <path d="M0 436Q138 398 295 434T800 424V499H0Z" fill="#c9dfb3"/>
  <path d="M0 466H800V507H0Z" fill="#dfc8a0"/>
  <path d="M25 487H109M169 487H253M313 487H397M457 487H541M601 487H685M745 487H800" stroke="#fff5d9" stroke-width="5"/>
  <ellipse cx="403" cy="468" rx="242" ry="13" fill="#173445" opacity=".13"/>

  <!-- Spinning wheels -->
  <g transform="translate(245 407)">
    <circle r="66" fill="#fff9e9" class="outline" stroke-width="9"/>
    <circle r="57" fill="none" stroke="#a9bbc0" stroke-width="3"/>
    <g class="spoke">
      <path d="M-57 0H57M0-57V57M-40-40L40 40M-40 40L40-40"/>
      <path d="M0-53V-40" stroke="#f28a3b" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#173445"/>
  </g>
  <g transform="translate(562 407)">
    <circle r="66" fill="#fff9e9" class="outline" stroke-width="9"/>
    <circle r="57" fill="none" stroke="#a9bbc0" stroke-width="3"/>
    <g class="spoke">
      <path d="M-57 0H57M0-57V57M-40-40L40 40M-40 40L40-40"/>
      <path d="M0-53V-40" stroke="#f28a3b" stroke-width="7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
    <circle r="8" fill="#173445"/>
  </g>

  <!-- Bicycle frame -->
  <g fill="none" class="outline">
    <path d="M245 407L321 317L392 407ZM321 317H515L392 407M515 317L562 407" stroke="#e45245" stroke-width="9"/>
    <path d="M321 317L309 292M515 317L505 276L533 262" stroke-width="7"/>
    <path d="M286 291H332" stroke-width="12"/>
    <path d="M530 262Q553 255 555 274" stroke-width="9"/>
    <path d="M392 395L248 397Q232 407 248 417L392 420" stroke-width="3"/>
  </g>

  <!-- The very small reward -->
  <path d="M548 290H643L630 342H559Z" fill="#e6af69" class="outline"/>
  <path d="M548 290H643L630 342H559Z" fill="url(#basket)"/>
  <path d="M578 284Q593 266 610 282L625 272V294L611 287Q593 300 578 284Z" fill="#65b9c4" stroke="#173445" stroke-width="3"/>
  <circle cx="587" cy="282" r="2.5" fill="#173445"/>
  <rect x="566" y="306" width="62" height="25" rx="5" fill="#fff5d9"/>
  <text x="597" y="324" text-anchor="middle" font-size="13" font-weight="bold">FUEL</text>

  <!-- Pelican and feet bob together -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".7s" repeatCount="indefinite"/>
    <path d="M329 282L351 333L381 378" fill="none" stroke="#cf822f" stroke-width="12" stroke-linecap="round"/>
    <path d="M379 371L410 385L376 389Z" fill="#f3a33e" class="outline"/>

    <path d="M283 263L245 240L266 279L242 278L283 302" fill="#fffdf1" class="outline"/>
    <path d="M282 218Q318 191 357 215Q386 237 369 278Q347 309 300 294Q265 280 270 248Z" fill="#fffdf1" class="outline"/>
    <path d="M302 229Q306 274 351 278Q327 246 302 229Z" fill="#d2e3df" class="outline"/>
    <path d="M344 229Q365 219 362 188Q356 153 385 145Q414 140 426 166Q433 187 415 211Q396 234 385 258" fill="#fffdf1" class="outline"/>

    <!-- Vast bill and stretchy pouch -->
    <path d="M416 178L571 205Q518 268 435 219Z" fill="#f4ba58" class="outline"/>
    <path d="M417 177L577 203L423 198Z" fill="#ffda70" class="outline"/>
    <path d="M442 211Q484 238 533 216" fill="none" stroke="#db8b38" stroke-width="3"/>
    <circle cx="405" cy="172" r="11" fill="white" stroke="#173445" stroke-width="3"/>
    <circle cx="409" cy="174" r="4" fill="#173445"/>
    <path d="M393 155L415 159" fill="none" class="outline"/>

    <!-- Cycling helmet -->
    <path d="M359 151Q355 121 386 119Q415 119 423 146Z" fill="#e45245" class="outline"/>
    <path d="M373 130L370 143M388 127L387 141M402 130L405 141" stroke="#173445" stroke-width="4" stroke-linecap="round"/>
    <path d="M367 151L383 182" fill="none" stroke="#173445" stroke-width="3"/>

    <!-- Wing grips the handlebar -->
    <path d="M354 243Q409 270 475 259L536 266Q539 280 520 282L470 276Q405 291 365 271" fill="#e0ebe3" class="outline"/>
    <path d="M332 287L359 337L401 402" fill="none" stroke="#efa13d" stroke-width="13" stroke-linecap="round"/>
    <path d="M400 396L432 409L396 417Z" fill="#ffb64f" class="outline"/>
  </g>

  <!-- Rotating crank and pedals -->
  <circle cx="392" cy="407" r="17" fill="#e1e7df" class="outline"/>
  <g transform="translate(392 407)">
    <g>
      <path d="M-24 0H24" stroke="#173445" stroke-width="6"/>
      <path d="M-33 0H-16M16 0H33" stroke="#173445" stroke-width="8" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Speech bubble -->
  <path d="M62 189Q62 176 77 176H224Q240 176 240 192V224Q240 238 225 238H192L220 263L169 238H77Q62 238 62 222Z" fill="white" stroke="#173445" stroke-width="3"/>
  <text x="151" y="201" text-anchor="middle" font-size="17" font-weight="bold">
    <tspan x="151">“I was told this</tspan>
    <tspan x="151" dy="23">was a flycycle.”</tspan>
  </text>
  <path d="M175 341H208M161 358H197M181 375H203" stroke="#7e9c8b" stroke-width="4" stroke-linecap="round"/>

  <!-- Dedicated, stationary footer -->
  <rect x="0" y="507" width="800" height="93" fill="#173445"/>
  <text x="400" y="541" text-anchor="middle" font-size="21" font-weight="bold" style="fill:#fff5d9">He traded free flight for a bicycle with monthly payments.</text>
  <text x="400" y="578" text-anchor="middle" font-size="17" style="fill:#fff5d9">2026-10-26 12:00:01 SGT (UTC+08:00)</text>
</svg>