<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw torque equation</title>
  <desc id="desc">A level seesaw with a 6 kilogram mass two metres left of the pivot and a 4 kilogram mass three metres right, in static equilibrium.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#d64545"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fffdf7"/>
  <text x="300" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#25364a">Static Equilibrium</text>

  <line x1="95" y1="190" x2="505" y2="190" stroke="#35495e" stroke-width="12" stroke-linecap="round"/>
  <circle cx="300" cy="190" r="8" fill="#f2a93b" stroke="#35495e" stroke-width="3"/>
  <path d="M270 285 L330 285 L300 198 Z" fill="#f2a93b" stroke="#35495e" stroke-width="4"/>
  <line x1="240" y1="286" x2="360" y2="286" stroke="#35495e" stroke-width="5" stroke-linecap="round"/>
  <text x="300" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#35495e">pivot</text>

  <line x1="140" y1="190" x2="140" y2="224" stroke="#35495e" stroke-width="3"/>
  <rect x="112" y="224" width="56" height="45" rx="5" fill="#668ec2" stroke="#35495e" stroke-width="3"/>
  <text x="140" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">6 kg</text>

  <line x1="460" y1="190" x2="460" y2="224" stroke="#35495e" stroke-width="3"/>
  <rect x="432" y="224" width="56" height="45" rx="5" fill="#668ec2" stroke="#35495e" stroke-width="3"/>
  <text x="460" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">4 kg</text>

  <line x1="140" y1="274" x2="140" y2="334" stroke="#d64545" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="102" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d64545">weight</text>
  <line x1="460" y1="274" x2="460" y2="334" stroke="#d64545" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="498" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#d64545">weight</text>

  <line x1="140" y1="145" x2="300" y2="145" stroke="#6b7280" stroke-width="2"/>
  <line x1="140" y1="137" x2="140" y2="153" stroke="#6b7280" stroke-width="2"/>
  <line x1="300" y1="137" x2="300" y2="153" stroke="#6b7280" stroke-width="2"/>
  <text x="220" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#35495e">2 m</text>

  <line x1="300" y1="145" x2="460" y2="145" stroke="#6b7280" stroke-width="2"/>
  <line x1="460" y1="137" x2="460" y2="153" stroke="#6b7280" stroke-width="2"/>
  <text x="380" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#35495e">x = 3 m</text>

  <text x="300" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#25364a">6 × 2 = 4 × 3</text>
  <text x="300" y="389" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#25834f">balanced</text>
</svg>