<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Level seesaw in static equilibrium: 6 kilogram mass 2 meters left of the pivot balances 4 kilogram mass 3 meters right of the pivot.">
  <rect width="600" height="400" fill="#fff"/>
  <text x="300" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18324b">BALANCED</text>

  <!-- Level seesaw -->
  <rect x="104" y="176" width="392" height="14" rx="7" fill="#b8793e" stroke="#75451f" stroke-width="2"/>
  <path d="M276 282 L300 190 L324 282 Z" fill="#71869a" stroke="#40566b" stroke-width="2"/>
  <line x1="260" y1="284" x2="340" y2="284" stroke="#40566b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="300" cy="183" r="8" fill="#40566b"/>

  <!-- Hanging supports and masses -->
  <line x1="170" y1="190" x2="170" y2="226" stroke="#334155" stroke-width="3"/>
  <rect x="139" y="226" width="62" height="48" rx="7" fill="#4f8fc0" stroke="#285a80" stroke-width="2"/>
  <text x="170" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">6 kg</text>

  <line x1="430" y1="190" x2="430" y2="226" stroke="#334155" stroke-width="3"/>
  <rect x="399" y="226" width="62" height="48" rx="7" fill="#e39b43" stroke="#a96217" stroke-width="2"/>
  <text x="430" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">4 kg</text>

  <!-- Force arrows -->
  <line x1="170" y1="280" x2="170" y2="323" stroke="#c0392b" stroke-width="3"/>
  <path d="M163 313 L170 324 L177 313" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9f2d23">weight</text>

  <line x1="430" y1="280" x2="430" y2="323" stroke="#c0392b" stroke-width="3"/>
  <path d="M423 313 L430 324 L437 313" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#9f2d23">weight</text>

  <!-- Distances from pivot -->
  <line x1="170" y1="144" x2="300" y2="144" stroke="#34495e" stroke-width="2"/>
  <path d="M170 144 l10 -5 v10 z M300 144 l-10 -5 v10 z" fill="#34495e"/>
  <line x1="170" y1="151" x2="170" y2="174" stroke="#8292a3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="300" y1="151" x2="300" y2="174" stroke="#8292a3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="235" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18324b">2 m</text>

  <line x1="300" y1="144" x2="430" y2="144" stroke="#34495e" stroke-width="2"/>
  <path d="M300 144 l10 -5 v10 z M430 144 l-10 -5 v10 z" fill="#34495e"/>
  <line x1="430" y1="151" x2="430" y2="174" stroke="#8292a3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="365" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#18324b">x = 3 m</text>

  <!-- Torque equation -->
  <text x="300" y="382" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18324b">6 × 2 = 4 × 3</text>
</svg>