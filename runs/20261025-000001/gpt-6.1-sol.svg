<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A level seesaw with a 6 kilogram mass 2 meters left of the pivot and a 4 kilogram mass 3 meters right. Equal torques give 6 times 2 equals 4 times 3, so x equals 3 meters.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#c2413b"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#183247">
    <text x="300" y="42" font-size="27" font-weight="700">balanced</text>
    <text x="300" y="72" font-size="16">Static equilibrium • equal opposing torques</text>

    <g stroke="#657989" stroke-width="1.5" fill="none">
      <path d="M120 111V146 M280 103V146 M520 111V146"/>
      <path d="M120 122H280 M280 122H520"/>
      <path d="M116 116L124 128 M276 116L284 128 M516 116L524 128"/>
    </g>
    <rect x="171" y="108" width="58" height="27" fill="white"/>
    <rect x="349" y="108" width="102" height="27" fill="white"/>
    <text x="200" y="128" font-size="20">2 m</text>
    <text x="400" y="128" font-size="20" font-weight="700">x = 3 m</text>

    <rect x="77" y="151" width="486" height="14" rx="4" fill="#345d78"/>
    <path d="M280 165 247 226H313Z" fill="#d9e2e9" stroke="#345d78" stroke-width="2"/>
    <circle cx="280" cy="165" r="5" fill="#183247"/>
    <path d="M237 229H323" stroke="#345d78" stroke-width="4" stroke-linecap="round"/>
    <text x="280" y="251" font-size="16">pivot</text>

    <g stroke="#345d78" stroke-width="2">
      <path d="M120 165V190 M520 165V190"/>
      <rect x="87" y="190" width="66" height="47" rx="5" fill="#e7f0f7"/>
      <rect x="487" y="190" width="66" height="47" rx="5" fill="#e7f0f7"/>
    </g>
    <text x="120" y="220" font-size="22" font-weight="700">6 kg</text>
    <text x="520" y="220" font-size="22" font-weight="700">4 kg</text>

    <g stroke="#c2413b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M120 242V292"/>
      <path d="M520 242V282"/>
    </g>
    <text x="164" y="277" font-size="18" fill="#a5322d">6g ↓</text>
    <text x="476" y="271" font-size="18" fill="#a5322d">4g ↓</text>

    <text x="300" y="326" font-size="25" font-weight="700">6×2 = 4×3</text>
    <text x="300" y="359" font-size="20">6g × 2 = 4g × x  ⇒  x = 3 m</text>
  </g>
</svg>