<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">Balanced seesaw in static equilibrium</title>
  <desc id="desc">A level seesaw has a 6 kilogram mass 2 metres left of the pivot and a 4 kilogram mass 3 metres right. Equal torques give 6 times 2 equals 4 times 3, so x equals 3 metres.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#dc493a"/>
    </marker>
  </defs>
  <rect width="600" height="400" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#172b42">
    <text x="300" y="40" font-size="26" font-weight="700" fill="#16805d">balanced</text>

    <!-- Distances use a consistent scale of 70 pixels per metre. -->
    <g stroke="#64748b" stroke-width="1.5">
      <path d="M100 91 V145 M240 91 V145 M450 91 V145" stroke-dasharray="4 4"/>
      <path d="M100 105 H240 M240 105 H450"/>
      <path d="M100 99 V111 M240 99 V111 M450 99 V111"/>
    </g>
    <text x="170" y="89" font-size="20">2 m</text>
    <text x="345" y="89" font-size="20" font-weight="700">x = 3 m</text>

    <!-- Horizontal beam and supporting pivot. -->
    <rect x="65" y="150" width="425" height="14" rx="5" fill="#355773"/>
    <path d="M240 164 L207 222 H273 Z" fill="#b6c8d8" stroke="#355773" stroke-width="2"/>
    <path d="M194 224 H286" stroke="#355773" stroke-width="4" stroke-linecap="round"/>
    <text x="240" y="249" font-size="17">pivot</text>

    <!-- Hanging masses. -->
    <g stroke="#355773" stroke-width="3">
      <path d="M100 164 V190 M450 164 V190"/>
    </g>
    <rect x="65" y="190" width="70" height="52" rx="7" fill="#dbeafe" stroke="#355773" stroke-width="2"/>
    <rect x="420" y="190" width="60" height="45" rx="7" fill="#dbeafe" stroke="#355773" stroke-width="2"/>
    <text x="100" y="222" font-size="22" font-weight="700">6 kg</text>
    <text x="450" y="219" font-size="22" font-weight="700">4 kg</text>

    <!-- Downward gravitational force arrows. -->
    <g stroke="#dc493a" stroke-width="3" marker-end="url(#arrow)">
      <path d="M100 245 V292"/>
      <path d="M450 238 V277"/>
    </g>
    <text x="149" y="280" font-size="18" fill="#bd352a">6g N</text>
    <text x="498" y="269" font-size="18" fill="#bd352a">4g N</text>

    <text x="300" y="324" font-size="17" fill="#526579">Equal opposing torques (g cancels)</text>
    <text x="300" y="354" font-size="26" font-weight="700">6×2 = 4×3</text>
    <text x="300" y="383" font-size="21">x = (6×2)/4 = 3 m</text>
  </g>
</svg>