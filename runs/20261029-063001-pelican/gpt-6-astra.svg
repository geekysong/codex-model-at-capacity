<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Pelican Pedal Panic</title>
  <desc>A satirical pelican rides a bicycle while trying to balance an enormous beak.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8f2"/>
      <stop offset="1" stop-color="#d9f5e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity=".25"/>
    </filter>
    <style>
      .ink{stroke:#263238;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Verdana,Arial,sans-serif;fill:#263238}
      .wheel{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
      .ride{animation:bob .8s ease-in-out infinite alternate}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="105" r="48" fill="#fff4b3" opacity=".8"/>
  <path d="M0 420 Q150 370 300 420 T600 410 T800 425 V510 H0Z" fill="#8bcf7a"/>
  <path d="M0 475 Q180 430 360 470 T800 465 V535 H0Z" fill="#63ae65"/>
  <path d="M0 520 H800 V558 H0Z" fill="#d6b36a"/>
  <path d="M0 548 Q160 535 320 548 T640 548 T800 548" fill="none" stroke="#a27b43" stroke-width="6"/>

  <text x="400" y="62" text-anchor="middle" class="label" font-size="34" font-weight="900" fill="#173b4d">PELICAN PEDAL PANIC</text>
  <text x="400" y="94" text-anchor="middle" class="label" font-size="18" font-style="italic">“Why fly when you can wobble professionally?”</text>

  <g class="ride" filter="url(#shadow)">
    <g class="wheel" transform="translate(282 435)">
      <circle r="72" fill="#eef7f5" class="ink"/>
      <circle r="8" fill="#263238"/>
      <path d="M0-67V67M-67 0H67M-47-47L47 47M47-47L-47 47" class="ink" stroke-width="3"/>
    </g>
    <g class="wheel" transform="translate(540 435)">
      <circle r="72" fill="#eef7f5" class="ink"/>
      <circle r="8" fill="#263238"/>
      <path d="M0-67V67M-67 0H67M-47-47L47 47M47-47L-47 47" class="ink" stroke-width="3"/>
    </g>

    <path d="M282 435 L360 330 L460 435 L282 435 L410 435 L540 435 L460 435 L410 350 Z" fill="none" class="ink" stroke="#e4572e" stroke-width="10"/>
    <path d="M360 330 L340 300 M330 300 H380" class="ink"/>
    <path d="M540 435 L570 350 M550 350 H590" class="ink"/>
    <circle cx="410" cy="435" r="18" fill="#f7c948" class="ink"/>
    <path d="M410 435 L385 405 M410 435 L435 460" class="ink" stroke-width="7"/>

    <g>
      <ellipse cx="410" cy="265" rx="78" ry="96" fill="#f4f0df" class="ink"/>
      <path d="M365 250 Q330 220 342 175 Q382 203 410 230" fill="#d8e5df" class="ink"/>
      <path d="M455 252 Q500 220 488 175 Q450 201 425 230" fill="#d8e5df" class="ink"/>
      <ellipse cx="410" cy="175" rx="62" ry="65" fill="#f4f0df" class="ink"/>
      <circle cx="388" cy="165" r="9" fill="#263238"/>
      <circle cx="432" cy="165" r="9" fill="#263238"/>
      <path d="M398 185 Q410 194 422 185" fill="none" class="ink"/>
      <path d="M366 193 Q410 220 454 193 L520 226 Q530 232 520 242 Q462 262 405 245 Q350 260 294 242 Q284 232 294 226Z" fill="#f28c28" class="ink"/>
      <path d="M294 242 Q405 260 520 242" fill="none" class="ink" stroke-width="3"/>
      <path d="M410 328 L410 405" class="ink" stroke-width="14"/>
      <path d="M410 350 Q365 380 350 410 M410 350 Q455 380 475 410" fill="none" class="ink" stroke-width="12"/>
      <path d="M350 410 L330 430 M475 410 L495 430" class="ink" stroke-width="9"/>
      <path d="M380 300 Q410 320 440 300" fill="none" class="ink" stroke-width="8"/>
      <text x="410" y="285" text-anchor="middle" class="label" font-size="15" font-weight="bold">HONK!</text>
    </g>
  </g>

  <path d="M120 170 q25-25 50 0 q25-25 50 0" fill="none" class="ink" stroke-width="4"/>
  <text x="400" y="575" text-anchor="middle" class="label" font-size="15" font-weight="bold">2026-10-29 06:30:01 SGT (UTC+08:00)</text>
</svg>