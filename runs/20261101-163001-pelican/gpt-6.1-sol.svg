<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a fish stuffed into its enormous bill pouch. The wheels spin and the pelican bobs in a looping animation.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bceafa"/>
      <stop offset="1" stop-color="#f3fbef"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#ffd16b"/>
      <stop offset="1" stop-color="#f59751"/>
    </linearGradient>
    <g id="wheel">
      <circle r="69" fill="#fffdf3" stroke="#203744" stroke-width="10"/>
      <circle r="59" fill="none" stroke="#a9bdc5" stroke-width="2"/>
