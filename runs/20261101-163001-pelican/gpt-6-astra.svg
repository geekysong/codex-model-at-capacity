    <text x="31" y="35" text-anchor="middle" font-size="25" font-weight="900">20</text>
    <text x="31" y="53" text-anchor="middle" font-size="11">FISH / HOUR</text>
  </g>

  <ellipse cx="390" cy="473" rx="234" ry="13" fill="#253647" opacity=".12"/>

  <g transform="translate(238 383)">
