    <circle cx="400" cy="154" r="4" fill="#253647"/>
    <path d="M374 137Q368 111 393 107Q419 105 428 132Z" fill="#ed654d" class="outline"/>
    <path d="M388 112L391 130M402 112L408 131" stroke="#fff0d1" stroke-width="5" stroke-linecap="round"/>
