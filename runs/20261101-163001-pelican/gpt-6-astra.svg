    <path d="M323 212Q346 201 377 221L426 249L495 237Q510 237 509 245Q473 275 426 267L348 245" fill="#fffdf4" class="outline"/>
    <path d="M342 220L377 240M338 230L366 246" fill="none" stroke="#a8babc" stroke-width="3" stroke-linecap="round"/>
    <path d="M301 278Q295 316 332 336L354 365" fill="none" stroke="#253647" stroke-width="15" stroke-linecap="round"/>
    <path d="M301 278Q295 316 332 336L354 365" fill="none" stroke="#f5ba50" stroke-width="9" stroke-linecap="round"/>
    <path d="M350 357L376 374L342 375Z" fill="#f5ba50" class="outline">
      <animateTransform attributeName="transform" type="rotate" values="9 354 365;-9 354 365;9 354 365" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g>
    <path d="M74 216Q62 216 62 202V151Q62 137 77 137H249Q264 137 264 152V201Q264 216 249 216H217L254 242L190 216Z" fill="#fffdf5" class="outline"/>
    <text x="163" y="168" text-anchor="middle" font-size="19" font-weight="bold">“I’m only doing</text>
    <text x="163" y="193" text-anchor="middle" font-size="19" font-weight="bold">this for the fish.”</text>
  </g>
  <path d="M170 281H207M153 302H194M173 323H199" fill="none" stroke="#6b9899" stroke-width="4" stroke-linecap="round"/>

  <rect x="37" y="505" width="726" height="60" rx="10" fill="#253647"/>
  <text x="400" y="530" text-anchor="middle" font-size="19" font-weight="bold" style="fill:#fff4d8">He cut emissions. The bill is still enormous.</text>
  <text x="400" y="552" text-anchor="middle" font-size="14" style="fill:#fff4d8">2026-11-01 16:30:01 SGT (UTC+08:00)</text>
</svg>