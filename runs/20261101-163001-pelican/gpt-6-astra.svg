<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Tour de Beak</title>
  <desc id="description">A smug pelican pedals a bicycle with a huge fish-filled bill, competing for the prestigious cycle lane seafood delivery championship. Wheels spin and the rider bobs in a looping animation.</desc>
  <defs>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#e9b761"/>
      <path d="M0 6H12M6 0V12" stroke="#a46c35" stroke-width="2"/>
    </pattern>
    <g id="wheel">
      <circle r="86" fill="#fff9e9" stroke="#253647" stroke-width="13"/>
      <circle r="73" fill="none" stroke="#b2bac0" stroke-width="3"/>
      <g stroke="#7c939f" stroke-width="3">
        <path d="M-72 0H72M0-72V72M-51-51L51 51M-51 51L51-51"/>
      </g>
      <circle r="10" fill="#ef694d" stroke="#253647" stroke-width="4"/>
      <path d="M-13-77H13" stroke="#ffd15a" stroke-width="7" stroke-linecap="round"/>
    </g>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #253647; }
      .outline { stroke: #253647; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

