  <rect x="18" y="18" width="764" height="564" rx="24" fill="none" stroke="#253647" stroke-width="3"/>
  <text x="400" y="66" text-anchor="middle" font-size="43" font-weight="900" letter-spacing="3">TOUR DE BEAK</text>
  <text x="400" y="94" text-anchor="middle" font-size="16" font-weight="bold" letter-spacing="2">BIG BILL. SMALL CARBON FOOTPRINT.</text>

  <path d="M36 363Q137 307 245 357T478 349T764 355V478H36Z" fill="#d3e7d4"/>
  <g fill="#fffdf5">
    <path d="M68 184Q51 164 77 155Q77 132 103 142Q120 117 140 144Q172 139 173 164Q190 182 166 184Z"/>
    <path d="M597 155Q582 137 606 129Q611 110 630 124Q652 112 661 135Q690 136 681 155Z"/>
  </g>
  <path d="M37 474H763" stroke="#253647" stroke-width="4"/>
  <path d="M43 489H157M200 489H306M529 489H630M673 489H758" stroke="#d9bd80" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(644 237)">
